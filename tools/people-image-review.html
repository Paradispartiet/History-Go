<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>History Go – people-image-review</title>
  <style>
    :root { --bg:#111318; --panel:#1b1f28; --panel-2:#242a36; --text:#f3f5f8; --muted:#aeb6c5; --line:rgba(255,255,255,.12); --ok:#4ade80; --bad:#fb7185; --warn:#facc15; --link:#93c5fd; --shadow:0 18px 50px rgba(0,0,0,.35); }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { position:sticky; top:0; z-index:10; padding:18px 20px; background:rgba(17,19,24,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(12px); }
    h1 { margin:0 0 8px; font-size:clamp(22px,4vw,34px); line-height:1.1; }
    .lead { margin:0; color:var(--muted); font-size:15px; line-height:1.45; }
    .toolbar,.actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:14px; }
    button,.link-button { border:1px solid var(--line); background:var(--panel-2); color:var(--text); border-radius:999px; padding:9px 13px; font:inherit; font-size:14px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
    button:hover,.link-button:hover { border-color:rgba(255,255,255,.32); }
    button[data-action="approve"].active { border-color:rgba(74,222,128,.85); background:rgba(74,222,128,.16); }
    button[data-action="reject"].active { border-color:rgba(251,113,133,.85); background:rgba(251,113,133,.16); }
    button[data-action="maybe"].active { border-color:rgba(250,204,21,.85); background:rgba(250,204,21,.16); }
    main { padding:18px; max-width:1500px; margin:0 auto; }
    .status { margin:14px 0 18px; padding:12px 14px; border:1px solid var(--line); border-radius:16px; background:var(--panel); color:var(--muted); font-size:14px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:18px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:22px; overflow:hidden; box-shadow:var(--shadow); }
    .image-wrap { position:relative; background:#05070a; aspect-ratio:16/10; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .image-wrap img { width:100%; height:100%; object-fit:contain; display:block; }
    .image-error { position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:18px; text-align:center; color:#fecdd3; background:rgba(20,5,8,.9); font-size:14px; }
    .image-wrap.broken .image-error { display:flex; }
    .orientation { position:absolute; left:12px; top:12px; padding:5px 9px; border-radius:999px; background:rgba(0,0,0,.72); border:1px solid rgba(255,255,255,.18); font-size:12px; color:white; }
    .orientation.landscape { color:var(--ok); } .orientation.portrait { color:var(--warn); }
    .body { padding:15px; }
    .title-row { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:8px; }
    h2 { margin:0; font-size:20px; line-height:1.2; }
    code { color:#dbeafe; background:rgba(147,197,253,.11); border:1px solid rgba(147,197,253,.18); padding:2px 5px; border-radius:7px; font-size:12px; word-break:break-word; }
    .meta { display:grid; gap:6px; margin:12px 0; color:var(--muted); font-size:13px; line-height:1.35; }
    .meta strong { color:var(--text); font-weight:650; }
    .warning { margin:12px 0; padding:10px; border-radius:14px; background:rgba(250,204,21,.11); border:1px solid rgba(250,204,21,.25); color:#fde68a; font-size:13px; line-height:1.4; }
    a { color:var(--link); } textarea { width:100%; min-height:140px; resize:vertical; border-radius:14px; border:1px solid var(--line); background:#080a0f; color:var(--text); padding:12px; font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }
    dialog { width:min(900px,calc(100vw - 28px)); border:1px solid var(--line); border-radius:22px; padding:0; background:var(--panel); color:var(--text); box-shadow:var(--shadow); } dialog::backdrop { background:rgba(0,0,0,.65); } .dialog-inner { padding:18px; } .dialog-inner h2 { margin-bottom:12px; } .muted { color:var(--muted); } .small { font-size:12px; }
  </style>
</head>
<body>
  <header>
    <h1>People-image-kandidat-review</h1>
    <p class="lead">Review skjer i nettleseren og lagres bare i localStorage. Apply kjøres trygt via GitHub Actions eller lokalt script; første publiseringsbatch kan inneholde maksimalt fem personer.</p>
    <div class="toolbar">
      <button id="applyApproved" type="button">Legg inn godkjente bilder</button>
      <button id="copyApproved" type="button">Kopier approved-ID-er</button>
      <button id="copyReview" type="button">Kopier full review</button>
      <button id="clearReview" type="button">Nullstill lokal review</button>
    </div>
  </header>
  <main><div id="status" class="status">Laster kandidater …</div><div id="grid" class="grid"></div></main>
  <dialog id="copyDialog"><div class="dialog-inner"><h2>Kopier review</h2><p class="muted small">Dette er bare tekst. Ingen repo-filer er endret.</p><textarea id="copyText" readonly></textarea><div class="actions"><button id="closeDialog" type="button">Lukk</button></div></div></dialog>
  <script>
    const CANDIDATE_PATH = "../data/people/people_image_candidates.json";
    const STORAGE_KEY = "hg_people_image_review_v2";
    const OLD_STORAGE_KEY = "hg_people_image_review_v1";
    const MAX_APPROVED = 5;
    const APPLY_WORKFLOW_URL = "https://github.com/Paradispartiet/History-Go/actions/workflows/apply-people-image-candidates.yml";
    const BUILD_WORKFLOW_URL = "https://github.com/Paradispartiet/History-Go/actions/workflows/build-people-image-candidates.yml";
    const statusEl = document.getElementById("status"), gridEl = document.getElementById("grid"), dialogEl = document.getElementById("copyDialog"), copyTextEl = document.getElementById("copyText");
    let candidates = []; let review = loadReview();
    function loadReview(){ try { const v2=localStorage.getItem(STORAGE_KEY); if(v2) return JSON.parse(v2); const old=JSON.parse(localStorage.getItem(OLD_STORAGE_KEY)||"{}"); const out={}; for(const [personId,row] of Object.entries(old||{})) out[personId]={personId,candidateId:"",decision:row?.decision||"unreviewed",approvalMode:"normal",criteria:{},bestAvailableReason:"",updatedAt:row?.updatedAt||new Date().toISOString()}; return out; } catch { return {}; } }
    function saveReview(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(review, null, 2)); }
    function escapeHtml(value){ return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    const criteriaLabels={correctPerson:"Riktig person",identifiable:"Personen er tydelig identifiserbar",singleClearPerson:"Bildet viser bare én tydelig person",suitableForCard:"Bildet er egnet som personkort",acceptableCrop:"Utsnittet er akseptabelt",acceptableExposure:"Lys og kontrast er akseptabelt",sharpEnough:"Bildet er skarpt nok",noProblematicTextOrWatermark:"Ingen problematisk tekst eller vannmerke"};
    const warningNo={lav_oppløsning:"Lav oppløsning",for_lyst:"Bildet er for lyst",for_mørkt:"Bildet er for mørkt",utbrente_høylys:"Utbrente høylys",svært_mørke_partier:"Svært mørke partier",lav_kontrast:"Bildet har lav kontrast",mulig_uskarphet:"Mulig uskarphet",ekstremt_sideforhold:"Ekstremt sideforhold",automatisk_bildeanalyse_begrenset:"Automatisk bildeanalyse er begrenset"};
    function byPerson(){ const m=new Map(); for(const c of candidates){ if(!m.has(c.personId)) m.set(c.personId,[]); m.get(c.personId).push(c); } for(const list of m.values()) list.sort((a,b)=>(a.rank||99)-(b.rank||99)); return [...m.entries()]; }
    function selected(personId){ return review[personId] || {}; }
    function approvedIds(){ return Object.values(review).filter(r=>r.decision==="approve").map(r=>r.candidateId||r.personId); }
    function canNormalApprove(r){ return ["correctPerson","identifiable","singleClearPerson","suitableForCard","acceptableCrop","acceptableExposure","sharpEnough","noProblematicTextOrWatermark"].every(k=>r.criteria?.[k]); }
    function setDecision(personId,candidateId,decision,mode="normal"){ if(decision==="approve"&&selected(personId)?.decision!=="approve"&&approvedIds().length>=MAX_APPROVED){ alert("Første publiseringsbatch kan inneholde maksimalt fem personer."); return; } review[personId]={personId,candidateId,decision,approvalMode:mode,criteria:selected(personId).criteria||{},bestAvailableReason:selected(personId).bestAvailableReason||"",updatedAt:new Date().toISOString()}; saveReview(); render(); }
    function toggleCriterion(personId,key,checked){ const r=review[personId] ||= {personId,candidateId:"",decision:"unreviewed",approvalMode:"normal",criteria:{},bestAvailableReason:"",updatedAt:new Date().toISOString()}; r.criteria ||= {}; r.criteria[key]=checked; r.updatedAt=new Date().toISOString(); saveReview(); render(); }
    function setReason(personId,value){ const r=review[personId] ||= {personId,candidateId:"",decision:"unreviewed",approvalMode:"normal",criteria:{},bestAvailableReason:"",updatedAt:new Date().toISOString()}; r.bestAvailableReason=value; r.updatedAt=new Date().toISOString(); saveReview(); }
    function counts(){ const people=byPerson().length, approved=Object.values(review).filter(r=>r.decision==="approve").length, maybe=Object.values(review).filter(r=>r.decision==="maybe").length, rejected=Object.values(review).filter(r=>r.decision==="reject").length; return {total:people,approved,maybe,rejected,unreviewed:Math.max(0,people-approved-maybe-rejected)}; }
    function render(){ const c=counts(); statusEl.textContent=`${c.total} personer · ${candidates.length} kandidater · ${c.approved} godkjent · ${c.maybe} usikker · ${c.rejected} avvist · ${c.unreviewed} ikke vurdert`; gridEl.innerHTML=byPerson().map(([personId,list])=>`<article class="card person-group" data-person-id="${escapeHtml(personId)}"><div class="body"><div class="title-row"><div><h2>${escapeHtml(list[0]?.personName||personId)}</h2><div class="small"><code>${escapeHtml(personId)}</code></div></div><button type="button" data-action="more" data-id="${escapeHtml(personId)}">Søk etter flere kandidater</button></div></div>${list.map(candidateCard).join("")}</article>`).join(""); }
    function candidateCard(candidate){ const r=selected(candidate.personId), chosen=r.candidateId===candidate.candidateId, warnings=(candidate.quality?.warnings||[]).map(w=>warningNo[w]||w), isBest=candidate.bestAvailable||candidate.quality?.tier==="best_available", normalOk=chosen&&canNormalApprove(r), reasonOk=(r.bestAvailableReason||"").trim().length>=20; return `<section class="body" style="border-top:1px solid var(--line)"><div class="image-wrap"><img src="${escapeHtml(candidate.originalImageUrl||"")}" alt="${escapeHtml(candidate.personName||candidate.personId)}" loading="lazy" referrerpolicy="no-referrer"/><div class="image-error">Kunne ikke laste originalbildet fra Commons.</div><span class="orientation">${candidate.recommendedForReview?"Systemets anbefaling":""} #${candidate.rank||"?"} ${isBest?"· Beste tilgjengelige bilde":""}</span></div><div class="meta"><div><strong>Kandidat-ID:</strong> <code>${escapeHtml(candidate.candidateId)}</code></div><div><strong>Kvalitetsnivå:</strong> ${escapeHtml(candidate.quality?.tier||"ukjent")} · <strong>Score:</strong> ${escapeHtml(candidate.quality?.score??"?")}</div><div><strong>Identitet:</strong> ${escapeHtml(candidate.identity?.status||"ukjent")} (${escapeHtml(candidate.identity?.source||"")})</div><div><strong>Commons-fil:</strong> ${escapeHtml(candidate.commonsFileName)}</div><div><strong>Lisens:</strong> ${escapeHtml(candidate.license)}</div></div>${isBest?`<div class="warning"><strong>Beste tilgjengelige bilde</strong><br>Dette bildet oppfyller ikke alle kvalitetskriteriene:${warnings.length?`<ul>${warnings.map(w=>`<li>${escapeHtml(w)}</li>`).join("")}</ul>`:" ingen automatiske advarsler"}</div>`:(warnings.length?`<div class="warning"><strong>Advarsler:</strong><ul>${warnings.map(w=>`<li>${escapeHtml(w)}</li>`).join("")}</ul></div>`:"")}<div class="actions"><a class="link-button" href="${escapeHtml(candidate.originalImageUrl)}" target="_blank" rel="noopener">Åpne full størrelse</a><a class="link-button" href="${escapeHtml(candidate.commonsPage)}" target="_blank" rel="noopener">Åpne Commons-siden</a></div><div class="actions"><button type="button" data-action="select" data-id="${escapeHtml(candidate.personId)}" data-candidate="${escapeHtml(candidate.candidateId)}" class="${chosen?"active":""}">Velg dette bildet</button></div>${chosen?checklist(candidate,r,normalOk,reasonOk):""}</section>`; }
    function checklist(candidate,r,normalOk,reasonOk){ return `<div class="warning"><strong>Obligatorisk sjekkliste</strong><div>${Object.entries(criteriaLabels).map(([k,l])=>`<label><input type="checkbox" data-criterion="${k}" data-id="${escapeHtml(candidate.personId)}" ${r.criteria?.[k]?"checked":""}> ${escapeHtml(l)}</label><br>`).join("")}</div><label>Begrunnelse ved beste tilgjengelige:<textarea data-reason="${escapeHtml(candidate.personId)}">${escapeHtml(r.bestAvailableReason||"")}</textarea></label></div><div class="actions"><button type="button" data-action="approve" data-id="${escapeHtml(candidate.personId)}" data-candidate="${escapeHtml(candidate.candidateId)}" ${normalOk?"":"disabled"}>Godkjenn</button><button type="button" data-action="approve-best" data-id="${escapeHtml(candidate.personId)}" data-candidate="${escapeHtml(candidate.candidateId)}" ${reasonOk?"":"disabled"}>Godkjenn som beste tilgjengelige</button><button type="button" data-action="maybe" data-id="${escapeHtml(candidate.personId)}" data-candidate="${escapeHtml(candidate.candidateId)}">Usikker</button><button type="button" data-action="reject" data-id="${escapeHtml(candidate.personId)}" data-candidate="${escapeHtml(candidate.candidateId)}">Avvis</button></div>`; }
    function reviewPayload(){ return { version:2, selections:Object.values(review).filter(r=>r.decision==="approve"&&r.candidateId).map(r=>({personId:r.personId,candidateId:r.candidateId,approvalMode:r.approvalMode||"normal",bestAvailableReason:r.bestAvailableReason||"",criteria:r.criteria||{},updatedAt:r.updatedAt})) }; }
    function showCopy(text,title="Kopier review",note="Dette er bare tekst. Ingen repo-filer er endret."){ dialogEl.querySelector("h2").textContent=title; dialogEl.querySelector("p").innerHTML=note; copyTextEl.value=text; dialogEl.showModal(); copyTextEl.focus(); copyTextEl.select(); }
    function showMore(personId){ showCopy(`people_id: ${personId}\n\nKjør build-workflowen manuelt for denne personen med:\npeople_ids=${personId}\nlimit=1\nmax_candidates_per_person=8\n\nWorkflow: ${BUILD_WORKFLOW_URL}\n\nSiden starter ikke workflow automatisk og bruker ingen hemmelige tokens i nettleseren.`, "Søk etter flere kandidater"); }
    async function copyToClipboard(text){ if(navigator.clipboard?.writeText){ await navigator.clipboard.writeText(text); return; } copyTextEl.value=text; copyTextEl.focus(); copyTextEl.select(); document.execCommand("copy"); }
    document.addEventListener("click", event=>{ const button=event.target.closest("button[data-action]"); if(!button) return; const a=button.dataset.action; if(a==="select") setDecision(button.dataset.id,button.dataset.candidate,"selected"); else if(a==="approve") setDecision(button.dataset.id,button.dataset.candidate,"approve","normal"); else if(a==="approve-best") setDecision(button.dataset.id,button.dataset.candidate,"approve","best_available"); else if(a==="more") showMore(button.dataset.id); else setDecision(button.dataset.id,button.dataset.candidate,a); });
    document.addEventListener("change", event=>{ const el=event.target; if(el?.dataset?.criterion) toggleCriterion(el.dataset.id,el.dataset.criterion,el.checked); });
    document.addEventListener("input", event=>{ const el=event.target; if(el?.dataset?.reason) setReason(el.dataset.reason,el.value); });
    document.addEventListener("error", event=>{ if(event.target?.tagName==="IMG") event.target.closest(".image-wrap")?.classList.add("broken"); }, true);
    document.getElementById("applyApproved").addEventListener("click",()=>showCopy(JSON.stringify(reviewPayload(),null,2),"Legg inn godkjente bilder",`Kopier <code>review_payload</code> og åpne <a href="${APPLY_WORKFLOW_URL}" target="_blank" rel="noopener">people apply-workflow</a>. Første kjøring skal bruke <code>write_output=false</code>.`));
    document.getElementById("copyApproved").addEventListener("click",()=>showCopy(approvedIds().join(","),"Kopier candidateId-er"));
    document.getElementById("copyReview").addEventListener("click",()=>showCopy(JSON.stringify(reviewPayload(),null,2),"Kopier full review-payload"));
    document.getElementById("clearReview").addEventListener("click",()=>{ if(!confirm("Nullstille lokal review i denne nettleseren?")) return; review={}; saveReview(); render(); });
    copyTextEl.addEventListener("click",()=>copyTextEl.select()); dialogEl.querySelector(".actions").insertAdjacentHTML("afterbegin",'<button id="copyDialogText" type="button">Kopier tekst</button>'); document.getElementById("copyDialogText").addEventListener("click",async()=>copyToClipboard(copyTextEl.value)); document.getElementById("closeDialog").addEventListener("click",()=>dialogEl.close());
    async function init(){ try { const response=await fetch(CANDIDATE_PATH,{cache:"no-store"}); if(!response.ok) throw new Error(`${response.status} ${response.statusText}`); const data=await response.json(); candidates=Array.isArray(data)?data:[]; render(); } catch(error){ statusEl.textContent=`Kunne ikke laste ${CANDIDATE_PATH}: ${error.message}`; } }
    init();
  </script>
</body>
</html>
