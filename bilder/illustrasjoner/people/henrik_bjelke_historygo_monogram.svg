 <pattern id="grain" width="20" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="1" fill="#603e1e" opacity=".14"/><path d="M10 8l4 5" stroke="#603e1e" opacity=".1"/></pattern>
</defs>
