<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Henrik Bjelke – redaksjonell navneillustrasjon</title>
<desc id="desc">En original, symbolsk navneillustrasjon med initialene HB, historisk gårdsbygning og pergament. Det er ikke et portrett eller Bjelke-familiens autentiske våpenskjold.</desc>
<defs>
