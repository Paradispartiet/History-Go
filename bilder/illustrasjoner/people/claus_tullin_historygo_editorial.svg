<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Claus Tullin – symbolsk originalillustrasjon for History Go</title>
<desc id="desc">Et grafisk navneemblem med initialene CT og et stilisert kart over Ruseløkken og Tullinløkka. Illustrasjonen viser ingen person og gjør ingen påstand om utseendet til Claus Tullin eller hans far Christian Braunmann Tullin.</desc>
<defs>
 <radialGradient id="base" cx="48%" cy="35%" r="75%"><stop stop-color="#f4f3ee"/><stop offset=".73" stop-color="#d8d8d3"/><stop offset="1" stop-color="#a7a8ab"/></radialGradient>
 <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#53565d"/><stop offset="1" stop-color="#22272f"/></linearGradient>
 <pattern id="grain" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M2 9l2 2M19 15l3-2M11 22l-2 1" stroke="#606268" opacity=".20" stroke-width="2"/></pattern>
 <clipPath id="medallion"><circle cx="512" cy="498" r="472"/></clipPath>
</defs>
<circle cx="512" cy="498" r="474" fill="url(#base)" stroke="#404040" stroke-width="24"/>
<circle cx="512" cy="498" r="447" fill="none" stroke="#808080" stroke-width="6" stroke-dasharray="7 10"/>
<g clip-path="url(#medallion)">
 <rect x="92" y="90" width="840" height="840" fill="url(#grain)"/>
 <!-- Symbolsk grunnplan: offentlig byrom mellom institusjoner, ikke autentisk historisk kart -->
 <path d="M172 615L324 455L447 498L577 359L834 429L781 701L590 785L398 708Z" fill="#c6c6c0" stroke="#747579" stroke-width="10" stroke-linejoin="round"/>
 <path d="M219 667L420 495M342 728L583 391M483 750L765 451M614 756L785 596" fill="none" stroke="#85868a" stroke-width="18" opacity=".6"/>
 <path d="M318 567Q475 645 692 541" fill="none" stroke="#f6f4ec" stroke-width="30" stroke-linecap="round"/>
 <path d="M351 568Q490 620 649 544" fill="none" stroke="#8d9294" stroke-width="6" stroke-dasharray="16 18"/>
 <!-- De innrammede bygningene er ikoniske markører, ikke dokumentarisk rekonstruksjon -->
 <path d="M212 630V480L283 432L356 480V630" fill="#b4b6b5" stroke="#65676b" stroke-width="9"/>
 <path d="M193 480L281 414L369 480" stroke="#40444a" stroke-width="13" fill="none"/>
 <path d="M237 512h90M237 550h90M237 588h90" stroke="#777d81" stroke-width="7"/>
 <path d="M664 670V453L723 406L792 453V670Z" fill="#bbc0c0" stroke="#606568" stroke-width="10"/>
 <path d="M658 453L726 402L798 453" fill="none" stroke="#40444a" stroke-width="13"/>
 <path d="M687 487h82M687 528h82M687 569h82M687 610h82" stroke="#757b7d" stroke-width="7"/>
 <!-- Initialer, ikke portrett -->
 <circle cx="510" cy="355" r="177" fill="url(#stone)" stroke="#b2b5b7" stroke-width="13"/>
 <circle cx="510" cy="355" r="156" fill="none" stroke="#d2d3d0" stroke-width="3"/>
 <text x="510" y="408" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="155" letter-spacing="2" fill="#f7f6f2">CT</text>
 <rect x="97" y="744" width="829" height="121" rx="20" fill="#33363c" stroke="#9fa1a3" stroke-width="8"/>
 <text x="512" y="803" text-anchor="middle" fill="#f3f2ed" font-size="44" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700">CLAUS TULLIN</text>
 <text x="512" y="843" text-anchor="middle" fill="#dfe0e0" font-size="26" font-family="Arial,DejaVu Sans,sans-serif">RUSELØKKEN · NAVNEOPPHAV TIL TULLINLØKKA</text>
 <rect x="81" y="886" width="860" height="103" rx="10" fill="#24272c"/>
 <text x="512" y="925" text-anchor="middle" fill="#f4f4f2" font-size="23" font-weight="700" font-family="Arial,DejaVu Sans,sans-serif">REDAKSJONELL SYMBOLILLUSTRASJON</text>
 <text x="512" y="961" text-anchor="middle" fill="#f0f0ef" font-size="24" font-family="Arial,DejaVu Sans,sans-serif">IKKE HISTORISK PORTRETT ELLER KART</text>
</g></svg>
