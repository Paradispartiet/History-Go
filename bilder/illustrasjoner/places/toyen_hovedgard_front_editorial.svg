<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
<title id="title">Tøyen hovedgård – redaksjonell illustrasjon</title>
<desc id="desc">En stilisert, egenprodusert tegning av et historisk hovedhus med mansardtak, to etasjer, sidefløyer og grønt gårdsrom. Ikke et dokumentarisk fotografi eller en eksakt rekonstruksjon.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1"><stop stop-color="#b7d8e5"/><stop offset="1" stop-color="#edf0e0"/></linearGradient>
 <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9dbb88"/><stop offset="1" stop-color="#5d896e"/></linearGradient>
 <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e6ded0"/><stop offset=".55" stop-color="#fff3e0"/><stop offset="1" stop-color="#c8beb3"/></linearGradient>
 <pattern id="wood" patternUnits="userSpaceOnUse" width="22" height="16"><path d="M0 9H22" stroke="#c6b9a6" stroke-width="1.4" opacity=".7"/></pattern>
 <pattern id="roof" patternUnits="userSpaceOnUse" width="35" height="26"><path d="M0 9H35M0 22H35M17 9V22M0 22V26" stroke="#965746" stroke-width="1.7" opacity=".48"/></pattern>
 <pattern id="paving" patternUnits="userSpaceOnUse" width="48" height="26"><path d="M0 0H48M0 13H48M24 0V13M0 13V26" stroke="#baa994" stroke-width="1.6" opacity=".7"/></pattern>
</defs>
