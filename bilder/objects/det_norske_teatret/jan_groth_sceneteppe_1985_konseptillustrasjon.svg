<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Kildebasert konseptillustrasjon av Jan Groths sceneteppe på Hovudscenen ved Det Norske Teatret</title>
<desc id="desc">Skjematisk scene, mørkt teppe i tolv tekstilpaneler med en lys brodert linje. Illustrasjonen gjengir ikke fotografisk eller nøyaktig Jan Groths originalkunstverk.</desc>
<defs>
 <linearGradient id="void" x2="0" y2="1"><stop stop-color="#16181a"/><stop offset="1" stop-color="#08090a"/></linearGradient>
 <linearGradient id="curtain" x2="0" y2="1"><stop stop-color="#272422"/><stop offset="0.7" stop-color="#151414"/><stop offset="1" stop-color="#201d1b"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#d4b48a" stop-opacity=".42"/><stop offset="1" stop-color="#d4b48a" stop-opacity="0"/></radialGradient>
 <pattern id="thread" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M1 4l2 -1" stroke="#f8f0df" stroke-width=".8" opacity=".4"/></pattern>
</defs>
<rect width="1200" height="760" fill="#111315"/>
<rect x="22" y="18" width="1156" height="634" rx="14" fill="url(#void)" stroke="#8b755e" stroke-width="5"/>
<path d="M54 63H1146V627H54Z" fill="#0e0f10" stroke="#ad895f" stroke-width="11"/>
<path d="M76 74H1124V596H76Z" fill="url(#curtain)"/>
<path d="M76 74H1124V596H76Z" fill="url(#light)"/>
<!-- Twelve panels, a single sewn curtain rather than twelve objects -->
<g stroke="#7a7169" stroke-width="2" opacity=".33">
<path d="M163.3 74V596M250.6 74V596M337.9 74V596M425.2 74V596M512.5 74V596M599.8 74V596M687.1 74V596M774.4 74V596M861.7 74V596M949 74V596M1036.3 74V596"/>
</g>
<g stroke="#0b0a09" stroke-opacity=".6" stroke-width="3"><path d="M80 80V588M1120 80V588"/></g>
<!-- An intentionally schematic, non-identical line evoking the documented embroidered motif -->
<path d="M182 493 C315 444 347 234 487 250 C595 263 595 448 723 441 C853 433 880 250 1044 184" fill="none" stroke="#e8dfd1" stroke-linecap="round" stroke-width="12" stroke-opacity=".27"/>
<path d="M182 493 C315 444 347 234 487 250 C595 263 595 448 723 441 C853 433 880 250 1044 184" fill="none" stroke="#f7f1e4" stroke-linecap="round" stroke-dasharray="4 2.7" stroke-width="6"/>
<path d="M105 624H1095" stroke="#a37a51" stroke-width="9"/>
<g fill="#332721"><path d="M20 628h1160v17H20z"/></g>
<rect y="652" width="1200" height="108" fill="#111b23"/>
<path d="M0 652H1200" stroke="#7a6654"/>
<text x="45" y="696" fill="#f0e6d6" font-family="Arial, sans-serif" font-size="28" font-weight="bold">ILLUSTRASJON – IKKE FOTOGRAFI</text>
<text x="45" y="730" fill="#d8d2c9" font-family="Arial, sans-serif" font-size="20">Jan Groths sceneteppe, Hovudscenen (1985) · skjematisk og ikke målfast</text>
</svg>
