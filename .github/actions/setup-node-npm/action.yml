name: Setup History GO Node workspace
description: Install the canonical Node version and cache/install npm dependencies.
runs:
  using: composite
  steps:
    - name: Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
