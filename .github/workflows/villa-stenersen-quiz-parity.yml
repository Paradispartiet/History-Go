name: Villa Stenersen quiz parity
on:
  pull_request:
    paths:
      - 'data/quiz/historie/villa_stenersen_sets.json'
      - 'data/quiz/production_briefs/historie/villa_stenersen.json'
      - 'data/quizcards/historie/villa_stenersen_quizcard_v1.json'
      - 'data/places/historie/oslo/places_historie_added_batch_01/villa_stenersen.json'
      - 'tests/villa-stenersen-v1-parity.test.mjs'
      - 'tests/villa-stenersen-real-app-browser-20261027.mjs'
      - '.github/workflows/villa-stenersen-quiz-parity.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  villa-quiz-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check Villa Stenersen quiz, QuizCard, Fagverk, photo provenance
        run: node --test tests/villa-stenersen-v1-parity.test.mjs
      - name: Walk through Villa Stenersen on mobile and desktop
        run: node tests/villa-stenersen-real-app-browser-20261027.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: villa-stenersen-mobile-desktop
          path: artifacts/villa-stenersen-browser/
          if-no-files-found: ignore
