name: TEMP Spikersuppa final repair

on:
  push:
    branches:
      - agent/spikersuppa-final-repair-20260907-temp
    paths:
      - '.github/workflows/TEMP_spikersuppa_final_repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Replay verified Spikersuppa delta on fresh main
        env:
          MAIN_SHA: 3986385c44d112544c35fcc88bc343e426d110ed
          SPIKE_SHA: e1b35186d5bafe1a14679f2c4f1d807b796eda0f
        run: |
          set -euxo pipefail
          git checkout --detach "$MAIN_SHA"
          set +e
          git cherry-pick --no-commit "$SPIKE_SHA"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            git diff --name-only --diff-filter=U | tee /tmp/conflicts.txt
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                data/runtime/place-open/*|data/epoker/epoke-place-index.json|data/places/place_image_backlog_summary.json|data/fagverk/fagverk_release.json|reports/knowledge-contract-audit.json)
                  git checkout --ours -- "$file"; git add "$file" ;;
                *) echo "Unexpected source conflict: $file" >&2; exit 1 ;;
              esac
            done < /tmp/conflicts.txt
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Apply narrow closure repairs
        env:
          MAIN_SHA: 3986385c44d112544c35fcc88bc343e426d110ed
        run: |
          set -euxo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const langPath='data/leksikon/sprak/places/europe/norway/oslo/spikersuppa.json';
          const lang=JSON.parse(fs.readFileSync(langPath,'utf8'));
          const entry=lang.entries.find(x=>x.id==='eidsvolls_plass' || x.id==='spikersuppa_eidsvolls_plass');
          if(!entry) throw new Error('Expected Spikersuppa Eidsvolls plass language entry');
          entry.id='spikersuppa_eidsvolls_plass';
          write(langPath,lang);

          const placePath='data/places/by/oslo/places/spikersuppa.json';
          const place=JSON.parse(fs.readFileSync(placePath,'utf8'));
          place.externalLinks ||= [];
          const add=(url,label)=>{ if(!place.externalLinks.some(x=>x&&x.url===url)) place.externalLinks.push({type:'source',label,url,verifiedAt:'2026-09-07'}); };
          add('https://www.pps.org/product/the-social-life-of-small-urban-spaces','Project for Public Spaces – The Social Life of Small Urban Spaces');
          add('https://mitpress.mit.edu/9780262620017/the-image-of-the-city/','MIT Press – The Image of the City');
          write(placePath,place);
          NODE
          git checkout "$MAIN_SHA" -- reports/knowledge-contract-audit.json
      - name: Install dependencies
        run: npm ci
      - name: Regenerate affected deterministic outputs
        run: |
          set -euxo pipefail
          npm run place-open:build
          npm run epoker:places:build
          node --input-type=module - <<'NODE'
          import fs from 'node:fs/promises';
          import { buildQuizProductionContext } from './scripts/quiz-production-lib.mjs';
          const artifact = await buildQuizProductionContext({
            root: process.cwd(),
            categoryId: 'by',
            targetId: 'spikersuppa'
          });
          await fs.writeFile(
            'data/quiz/production_context/by/spikersuppa.json',
            JSON.stringify(artifact, null, 2) + '\n',
            'utf8'
          );
          NODE
      - name: Validate exact failing gates plus Spikersuppa core
        env:
          BASE_SHA: 3986385c44d112544c35fcc88bc343e426d110ed
        run: |
          set -euxo pipefail
          node --test tests/place-language-layer.test.mjs tests/place-language-dialect-scope.test.mjs tests/birkelunden-phase7h-language.test.mjs tests/sprakatlas-map-v3.test.mjs tests/sprakatlas-collection-v4.test.mjs tests/place-popup-direct-tabs.test.mjs tests/place-popup-all-direct-tabs-visible.test.mjs
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/spikersuppa-completion.test.mjs
          npm run place-open:check
          npm run epoker:places:check
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run leksikon:ids:check
          npm run check:stories
          node scripts/audit-repository-hygiene-v1.mjs --base-ref="$BASE_SHA"
          test -z "$(git diff --name-only --diff-filter=U)"
          test -z "$(git diff --name-only "$BASE_SHA" | grep -E '(^|/)(TEMP|temp)[^/]*|^\.github/workflows/TEMP' || true)"
      - name: Commit clean one-parent output
        env:
          MAIN_SHA: 3986385c44d112544c35fcc88bc343e426d110ed
        run: |
          set -euxo pipefail
          git add -A
          git config user.name 'history-go-replay'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Complete Spikersuppa Place production'
          test "$(git rev-parse HEAD^)" = "$MAIN_SHA"
          test -z "$(git diff --name-only "$MAIN_SHA"..HEAD | grep -E '(^|/)(TEMP|temp)[^/]*|^\.github/workflows/TEMP' || true)"
          git push --force origin HEAD:refs/heads/agent/spikersuppa-final-output-20260907
