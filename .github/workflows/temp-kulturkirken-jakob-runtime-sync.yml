name: TEMP Kulturkirken Jakob scoped place-open runtime sync
on:
  push:
    branches:
      - agent/kulturkirken-jakob-story-reading-20261104
    paths:
      - '.github/workflows/temp-kulturkirken-jakob-runtime-sync.yml'
permissions:
  contents: write
concurrency:
  group: temp-kulturkirken-jakob-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate canonical runtime and constrain changed paths
        shell: bash
        run: |
          set -euo pipefail
          npm run place-open:build
          git diff --name-only > /tmp/jakob-generated-paths.txt
          cat /tmp/jakob-generated-paths.txt
          if [ ! -s /tmp/jakob-generated-paths.txt ]; then
            echo "No generated changes"; exit 1
          fi
          while IFS= read -r path; do
            case "$path" in
              data/runtime/stories-all/part-*.json|data/runtime/lesespor-all.json|data/runtime/place-open/kulturkirken_jakob_litteratur.json) ;;
              *) echo "REFUSING unrelated generated change: $path"; exit 1 ;;
            esac
          done < /tmp/jakob-generated-paths.txt
          npm run place-open:check
      - name: Commit exactly scoped generated runtime files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/runtime/stories-all/ data/runtime/lesespor-all.json data/runtime/place-open/kulturkirken_jakob_litteratur.json
          git diff --cached --check
          git commit -m 'build(jakob): synchronize Story and Lesespor into place-open runtime'
          git push origin "HEAD:${GITHUB_REF_NAME}"
