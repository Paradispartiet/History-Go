name: Apply Oslo popupDesc V4 batch 01

on:
  push:
    branches:
      - agent/oslo-popup-v4-batch-01-ten

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-popup-v4-batch-01-ten
          fetch-depth: 0

      - name: Apply ten description revisions
        shell: bash
        run: |
          cat .tmp/oslo-popup-v4-batch-01/payload-*.txt | base64 -d | gunzip > /tmp/apply-oslo.js
          node /tmp/apply-oslo.js

      - name: Verify scope and remove temporary files
        shell: bash
        run: |
          rm -rf .tmp/oslo-popup-v4-batch-01
          rm .github/workflows/oslo-popup-v4-batch-01.yml
          node -e "for (const f of process.argv.slice(1)) JSON.parse(require('fs').readFileSync(f, 'utf8'))" \
            data/places/by/oslo/places/ring_3.json \
            data/places/by/oslo/places/storgata.json \
            data/places/by/oslo/places/nydalen.json \
            data/places/by/oslo/places/stensparken.json \
            data/places/by/oslo/places/akerselva.json \
            data/places/by/oslo/places/torshov.json \
            data/places/by/oslo/places/grorud.json \
            data/places/by/oslo/places/sagene.json \
            data/places/by/oslo/places/barcode.json \
            data/places/by/oslo/places/bjorvika.json
          git diff --check
          git status --short

      - name: Commit production files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            data/places/by/oslo/places/ring_3.json \
            data/places/by/oslo/places/storgata.json \
            data/places/by/oslo/places/nydalen.json \
            data/places/by/oslo/places/stensparken.json \
            data/places/by/oslo/places/akerselva.json \
            data/places/by/oslo/places/torshov.json \
            data/places/by/oslo/places/grorud.json \
            data/places/by/oslo/places/sagene.json \
            data/places/by/oslo/places/barcode.json \
            data/places/by/oslo/places/bjorvika.json \
            .github/workflows/oslo-popup-v4-batch-01.yml \
            .tmp/oslo-popup-v4-batch-01
          git commit -m "Revider ti Oslo-steder etter 300-ordsregelen"
          git push origin HEAD:agent/oslo-popup-v4-batch-01-ten
