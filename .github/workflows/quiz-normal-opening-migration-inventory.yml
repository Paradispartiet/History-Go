name: Quiz normal opening migration inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: quiz-normal-opening-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-inventory:
    if: startsWith(github.head_ref, 'agent/quiz-normal-opening-migration-inventory') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build full migration inventory
        run: |
          set -euo pipefail
          node --check tools/build-quiz-normal-opening-migration-inventory.mjs
          node --check tools/compact-quiz-normal-opening-migration-reports.mjs
          node --check tools/validate-quiz-normal-opening-migration-inventory.mjs
          node tools/build-quiz-normal-opening-migration-inventory.mjs
          node tools/compact-quiz-normal-opening-migration-reports.mjs
          node tools/validate-quiz-normal-opening-migration-inventory.mjs \
            | tee reports/quiz-normal-opening-migration-inventory-validation.txt
          git diff --check
          {
            echo 'Generated report sizes:'
            du -h reports/quiz-content-quality.json
            du -h reports/quiz-normal-opening-migration-inventory.json
            du -h reports/quiz-normal-opening-migration-inventory.md
            du -h reports/quiz-normal-opening-migration-inventory-validation.txt
          } | tee "$RUNNER_TEMP/quiz-inventory-sizes.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiz-normal-opening-migration-inventory
          path: |
            reports/quiz-content-quality.json
            reports/quiz-normal-opening-migration-inventory.json
            reports/quiz-normal-opening-migration-inventory.md
            reports/quiz-normal-opening-migration-inventory-validation.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiz-normal-opening-migration-inventory-sizes
          path: ${{ runner.temp }}/quiz-inventory-sizes.txt
          if-no-files-found: warn
      - name: Commit generated inventory
        id: publish
        continue-on-error: true
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/quiz-inventory-publish-diagnostic.txt"
          : > "$LOG"
          {
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add reports/quiz-content-quality.json
            git add reports/quiz-normal-opening-migration-inventory.json
            git add reports/quiz-normal-opening-migration-inventory.md
            git add reports/quiz-normal-opening-migration-inventory-validation.txt
            echo '## staged files'
            git diff --cached --stat
            echo '## largest generated files'
            du -h reports/quiz-content-quality.json reports/quiz-normal-opening-migration-inventory.json reports/quiz-normal-opening-migration-inventory.md reports/quiz-normal-opening-migration-inventory-validation.txt
            git diff --cached --check
            if git diff --cached --quiet; then
              echo 'Inventaret er allerede oppdatert.'
            else
              git commit -m 'Quiz: bygg full migreringskø for normalåpning'
              git push origin HEAD:${{ github.head_ref }}
            fi
          } >> "$LOG" 2>&1
          status=$?
          cat "$LOG"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiz-normal-opening-inventory-publish-diagnostic
          path: ${{ runner.temp }}/quiz-inventory-publish-diagnostic.txt
          if-no-files-found: warn
      - name: Propagate publish failure
        if: steps.publish.outcome == 'failure'
        run: exit 1
