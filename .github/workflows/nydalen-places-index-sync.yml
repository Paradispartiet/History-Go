name: Nydalen places-index sync

on:
  push:
    branches:
      - agent/nydalen-places-index-sync-20260915

permissions:
  contents: write

concurrency:
  group: nydalen-places-index-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate canonical places index
        run: npm run places:index:build
      - name: Verify canonical places index
        run: npm run places:index:check
      - name: Commit canonical index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/places_index.json
          if git diff --cached --quiet; then
            echo "No index changes to commit."
          else
            git commit -m "Synchronize Nydalen places index"
            git push origin HEAD:agent/nydalen-places-index-sync-20260915
          fi
