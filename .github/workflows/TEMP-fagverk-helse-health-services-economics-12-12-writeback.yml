name: TEMP Helse health services economics 12/12 writeback

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: temp-helse-health-services-economics-12-12-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  writeback:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/helse-health-services-economics-fulltext-content'
    runs-on: ubuntu-latest
    env:
      BRANCH: agent/helse-health-services-economics-fulltext-content
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/brief-helse-health-services-economics-sources-v1.mjs
      - run: node scripts/materialize-helse-health-services-economics-fulltext-v1.mjs
      - name: Extend inventory test through the final-domain strict-proof gate
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'tests/fagverk-subject-inventory.test.mjs';
          const from = 'source_brief_complete_full_chapter_production|full_chapter_complete_next_domain_source_brief';
          const to = 'source_brief_complete_full_chapter_production|full_chapter_complete_next_domain_source_brief|full_chapter_complete_strict_proof_next';
          const raw = fs.readFileSync(file, 'utf8');
          if (!raw.includes(from)) throw new Error('Expected Helse progression assertion not found');
          fs.writeFileSync(file, raw.replace(from, to));
          NODE
      - run: node scripts/audit-fagverk-general-engine.mjs --write-report
      - run: node scripts/build-fagverk-release-manifest.mjs
      - run: node scripts/audit-helse-health-services-economics-fulltext-v1.mjs --write
      - run: node scripts/audit-helse-health-services-economics-fulltext-v1.mjs
      - run: node scripts/audit-helse-cumulative-progress-v1.mjs
      - run: node scripts/audit-fagverk-subject-inventory.mjs
      - run: node scripts/audit-fagverk-general-engine.mjs
      - run: node scripts/audit-fagverk-theory-quality.mjs
      - run: node scripts/audit-fagverk-theory-integrity.mjs
      - run: node scripts/build-fagverk-release-manifest.mjs --check
      - name: Test health services economics fulltext
        run: node --test tests/helse-health-services-economics-fulltext-v1.test.mjs
      - name: Test Helse cumulative progress
        run: node --test tests/helse-cumulative-progress-v1.test.mjs
      - name: Test subject inventory
        run: node --test tests/fagverk-subject-inventory.test.mjs
      - name: Test general engine
        run: node --test tests/fagverk-general-engine.test.mjs
      - name: Test release manifest
        run: node --test tests/fagverk-release-manifest.test.mjs
      - name: Commit deterministic writeback
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/fag/fag_manifest.json \
            data/fag/helse/helsepensum_canonical_v1.json \
            data/fag/helse/emner_helse_canonical_v1.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_inventory.json \
            data/fagverk/subject_status.json \
            data/fagverk/fagverk_release.json \
            data/fagverk/helse/helsetjenester-helseokonomi-organisering-kvalitet-prioritering-og-ressursbruk.json \
            data/fagverk/helse/helsetjenester-helseokonomi-organisering-kvalitet-prioritering-og-ressursbruk \
            reports/fagverk/helse-health-services-economics-fulltext-v1-audit.json \
            reports/fagverk/general-engine-audit.json \
            tests/fagverk-subject-inventory.test.mjs
          if git diff --cached --quiet; then
            echo "No generated writeback changes."
            exit 0
          fi
          git commit -m "Materialize Helse health services economics at 12/12 [writeback]"
          git push origin "HEAD:${BRANCH}"
