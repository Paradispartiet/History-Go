name: TypeScript Nearby filters finalize

on:
  pull_request:
    paths:
      - ".github/workflows/typescript-nearby-filters-finalize.yml"
      - ".github/scripts/finalize_nearby_filters.py"
      - "js/ui/left-panel.js"
      - "js/ui/nearbyFilters.ts"
      - "js/app.js"
      - "build/build-web.mjs"
      - "schemas/app-globals.d.ts"

permissions:
  contents: write

jobs:
  finalize-nearby-filters:
    if: github.event.pull_request.head.ref == 'agent/typescript-nearby-filters'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Nearby filters extraction
        shell: bash
        run: |
          set +e
          python3 .github/scripts/finalize_nearby_filters.py > nearby-filters-finalize.log 2>&1
          status=$?
          cat nearby-filters-finalize.log
          echo "$status" > nearby-filters-finalize.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: nearby-filters-finalize-diagnostics
          path: |
            nearby-filters-finalize.log
            nearby-filters-finalize.status
          retention-days: 1
      - name: Stop on migration failure
        shell: bash
        run: |
          status=$(cat nearby-filters-finalize.status)
          if [ "$status" != "0" ]; then
            exit "$status"
          fi
      - name: Verify browser TypeScript and build
        run: |
          npm run typecheck:web
          npm run build:web
          git diff --check
      - name: Commit migration and generated browser outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ui/nearbyFilters.ts js/ui/nearby-filters.js js/ui/left-panel.js js/app.js build/build-web.mjs schemas/app-globals.d.ts dist/web/nearbyFilters.js
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "Extract Nearby filter state to TypeScript"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
