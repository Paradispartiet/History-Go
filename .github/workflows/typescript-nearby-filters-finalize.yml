name: TypeScript Nearby filters finalize

on:
  pull_request:
    paths:
      - ".github/workflows/typescript-nearby-filters-finalize.yml"
      - "js/ui/left-panel.js"
      - "js/ui/nearbyFilters.ts"
      - "js/app.js"
      - "build/build-web.mjs"
      - "schemas/app-globals.d.ts"

permissions:
  contents: write

jobs:
  finalize-nearby-filters:
    if: github.event.pull_request.head.ref == 'agent/typescript-nearby-filters'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Extract Nearby filter state to TypeScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected migration anchor not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          nearby_filters_ts = r'''// Canonical state and persistence controller for Nearby/Utforsk filters.
          // Button rendering and event binding remain in left-panel.js during the strangler migration.

          import type { CategoryDefinition } from "../core/categories";

          export type NearbyPlaceFilter = "unvisited" | "all" | "unlocked";
          export type NearbyNatureFilter = "all" | "unlocked" | "flora" | "fauna";
          export type NearbySort = "distance" | "oldest" | "newest";

          export type NearbyFiltersApi = {
            initializeFromStorage: () => void;
            normalizeSort: (value: unknown) => NearbySort;
            normalizeBadgeFilter: (value: unknown) => string;
            getCategoryById: (value: unknown) => CategoryDefinition | null;
            getBadgeOptions: () => string[];
            getActiveBadgeFilter: () => string;
            setActiveBadgeFilter: (value: unknown) => string;
            isBadgeFilterActive: () => boolean;
            cyclePlaceFilter: () => NearbyPlaceFilter;
            cycleNatureFilter: () => NearbyNatureFilter;
            toggleFavorites: () => boolean;
            cycleSort: () => NearbySort;
          };

          type RuntimeWindow = Window & typeof globalThis & {
            CATEGORY_LIST?: CategoryDefinition[];
            HG_NEARBY_FILTER?: NearbyPlaceFilter;
            HG_NEARBY_BADGE_FILTER?: string;
            HG_NEARBY_SORT?: NearbySort;
            HG_NEARBY_FAVORITES_ONLY?: boolean;
            HG_NATURE_FILTER?: NearbyNatureFilter;
            HGNearbyFilters?: NearbyFiltersApi;
            HG_getActiveBadgeFilter?: () => string;
            HG_isBadgeFilterActive?: () => boolean;
          };

          const win = window as RuntimeWindow;

          const PLACE_FILTER_ORDER = ["unvisited", "all", "unlocked"] as const;
          const NATURE_FILTER_ORDER = ["all", "unlocked", "flora", "fauna"] as const;
          const SORT_ORDER = ["distance", "oldest", "newest"] as const;

          function readStorage(key: string): string | null {
            try {
              return localStorage.getItem(key);
            } catch {
              return null;
            }
          }

          function writeStorage(key: string, value: string): void {
            try {
              localStorage.setItem(key, value);
            } catch {}
          }

          function normalizeChoice<T extends string>(value: unknown, allowed: readonly T[], fallback: T): T {
            const raw = String(value ?? "").trim().toLowerCase() as T;
            return allowed.includes(raw) ? raw : fallback;
          }

          function normalizePlaceFilter(value: unknown): NearbyPlaceFilter {
            return normalizeChoice(value, PLACE_FILTER_ORDER, "unvisited");
          }

          function normalizeNatureFilter(value: unknown): NearbyNatureFilter {
            return normalizeChoice(value, NATURE_FILTER_ORDER, "all");
          }

          function normalizeSort(value: unknown): NearbySort {
            return normalizeChoice(value, SORT_ORDER, "distance");
          }

          function getCategoryById(value: unknown): CategoryDefinition | null {
            const id = String(value ?? "").trim();
            if (!id) return null;
            const categories = Array.isArray(win.CATEGORY_LIST) ? win.CATEGORY_LIST : [];
            return categories.find((category) => category.id === id) ?? null;
          }

          function getBadgeOptions(): string[] {
            const categories = Array.isArray(win.CATEGORY_LIST) ? win.CATEGORY_LIST : [];
            return ["all", ...categories.map((category) => category.id.trim()).filter(Boolean)];
          }

          function normalizeBadgeFilter(value: unknown): string {
            const raw = String(value ?? "all").trim() || "all";
            if (raw === "all") return "all";
            return getCategoryById(raw) ? raw : "all";
          }

          function getActiveBadgeFilter(): string {
            return normalizeBadgeFilter(win.HG_NEARBY_BADGE_FILTER ?? "all");
          }

          function setActiveBadgeFilter(value: unknown): string {
            const next = normalizeBadgeFilter(value);
            win.HG_NEARBY_BADGE_FILTER = next;
            writeStorage("hg_nearby_badge_filter_v1", next);
            return next;
          }

          function isBadgeFilterActive(): boolean {
            return getActiveBadgeFilter() !== "all";
          }

          function cycleValue<T extends string>(current: T, order: readonly T[]): T {
            const index = order.indexOf(current);
            return order[(index + 1) % order.length] ?? order[0];
          }

          function cyclePlaceFilter(): NearbyPlaceFilter {
            const current = normalizePlaceFilter(win.HG_NEARBY_FILTER);
            const next = cycleValue(current, PLACE_FILTER_ORDER);
            win.HG_NEARBY_FILTER = next;
            writeStorage("hg_nearby_filter_v1", next);
            return next;
          }

          function cycleNatureFilter(): NearbyNatureFilter {
            const current = normalizeNatureFilter(win.HG_NATURE_FILTER);
            const next = cycleValue(current, NATURE_FILTER_ORDER);
            win.HG_NATURE_FILTER = next;
            writeStorage("hg_nature_filter_v1", next);
            return next;
          }

          function toggleFavorites(): boolean {
            const next = !Boolean(win.HG_NEARBY_FAVORITES_ONLY);
            win.HG_NEARBY_FAVORITES_ONLY = next;
            writeStorage("hg_nearby_favorites_filter_v1", next ? "1" : "0");
            return next;
          }

          function cycleSort(): NearbySort {
            const current = normalizeSort(win.HG_NEARBY_SORT);
            const next = cycleValue(current, SORT_ORDER);
            win.HG_NEARBY_SORT = next;
            writeStorage("hg_nearby_sort_v1", next);
            return next;
          }

          function initializeFromStorage(): void {
            win.HG_NEARBY_FILTER = normalizePlaceFilter(readStorage("hg_nearby_filter_v1"));
            win.HG_NEARBY_BADGE_FILTER = normalizeBadgeFilter(readStorage("hg_nearby_badge_filter_v1"));
            win.HG_NEARBY_SORT = normalizeSort(readStorage("hg_nearby_sort_v1"));
            win.HG_NEARBY_FAVORITES_ONLY = readStorage("hg_nearby_favorites_filter_v1") === "1";
            win.HG_NATURE_FILTER = normalizeNatureFilter(readStorage("hg_nature_filter_v1"));
          }

          const api: NearbyFiltersApi = {
            initializeFromStorage,
            normalizeSort,
            normalizeBadgeFilter,
            getCategoryById,
            getBadgeOptions,
            getActiveBadgeFilter,
            setActiveBadgeFilter,
            isBadgeFilterActive,
            cyclePlaceFilter,
            cycleNatureFilter,
            toggleFavorites,
            cycleSort
          };

          win.HGNearbyFilters = api;
          win.HG_getActiveBadgeFilter = getActiveBadgeFilter;
          win.HG_isBadgeFilterActive = isBadgeFilterActive;
          initializeFromStorage();
          '''
          Path("js/ui/nearbyFilters.ts").write_text(nearby_filters_ts)

          replace_once(
              "build/build-web.mjs",
              '  { in: "js/ui/search.ts", out: "search" },\n  { in: "js/ui/nearbyDrawer.ts", out: "nearbyDrawer" }',
              '  { in: "js/ui/search.ts", out: "search" },\n  { in: "js/ui/nearbyDrawer.ts", out: "nearbyDrawer" },\n  { in: "js/ui/nearbyFilters.ts", out: "nearbyFilters" }'
          )
          replace_once(
              "build/build-web.mjs",
              '  { out: "search", target: "js/ui/search.js" },\n  { out: "nearbyDrawer", target: "js/ui/nearby-drawer.js" }',
              '  { out: "search", target: "js/ui/search.js" },\n  { out: "nearbyDrawer", target: "js/ui/nearby-drawer.js" },\n  { out: "nearbyFilters", target: "js/ui/nearby-filters.js" }'
          )

          replace_once(
              "js/app.js",
              '    await safeRun("loadNearbyDrawer", () => loadScriptOnce("js/ui/nearby-drawer.js"));\n    await safeRun("loadLeftPanel", () => loadScriptOnce("js/ui/left-panel.js"));',
              '    await safeRun("loadNearbyDrawer", () => loadScriptOnce("js/ui/nearby-drawer.js"));\n    await safeRun("loadNearbyFilters", () => loadScriptOnce("js/ui/nearby-filters.js"));\n    await safeRun("loadLeftPanel", () => loadScriptOnce("js/ui/left-panel.js"));'
          )

          globals_path = Path("schemas/app-globals.d.ts")
          globals_text = globals_path.read_text()
          filters_decl = '''    HGNearbyFilters?: {
              initializeFromStorage?: () => void;
              normalizeSort?: (value: unknown) => "distance" | "oldest" | "newest";
              normalizeBadgeFilter?: (value: unknown) => string;
              getCategoryById?: (value: unknown) => any;
              getBadgeOptions?: () => string[];
              getActiveBadgeFilter?: () => string;
              setActiveBadgeFilter?: (value: unknown) => string;
              isBadgeFilterActive?: () => boolean;
              cyclePlaceFilter?: () => "unvisited" | "all" | "unlocked";
              cycleNatureFilter?: () => "all" | "unlocked" | "flora" | "fauna";
              toggleFavorites?: () => boolean;
              cycleSort?: () => "distance" | "oldest" | "newest";
            };
          '''
          if "HGNearbyFilters?:" not in globals_text:
              anchor = '''    HGNearbyDrawer?: {
                isOpen?: () => boolean;
                setOpen?: (open: boolean) => void;
                open?: () => void;
                close?: () => void;
                toggle?: () => void;
              };
          '''
              if anchor not in globals_text:
                  raise SystemExit("HGNearbyDrawer declaration anchor missing")
              globals_text = globals_text.replace(anchor, anchor + filters_decl, 1)
          if "HG_NEARBY_FAVORITES_ONLY?:" not in globals_text:
              globals_text = globals_text.replace(
                  "    HG_NEARBY_FILTER?: any;\n",
                  "    HG_NEARBY_FILTER?: any;\n    HG_NEARBY_FAVORITES_ONLY?: boolean;\n",
                  1
              )
          globals_path.write_text(globals_text)

          replace_once(
              "js/ui/left-panel.js",
              '''function normalizeNearbySort(mode) {
            const raw = String(mode || "distance").trim().toLowerCase();
            if (raw === "oldest" || raw === "newest") return raw;
            return "distance";
          }''',
              '''function normalizeNearbySort(mode) {
            return window.HGNearbyFilters?.normalizeSort?.(mode) || "distance";
          }'''
          )

          replace_once(
              "js/ui/left-panel.js",
              '''  if (mode === "nature") {
            window.HG_NEARBY_BADGE_FILTER = "all";
            try {
              localStorage.setItem("hg_nearby_badge_filter_v1", "all");
            } catch {}
          }''',
              '''  if (mode === "nature") {
            window.HGNearbyFilters?.setActiveBadgeFilter?.("all");
          }'''
          )

          replace_once(
              "js/ui/left-panel.js",
              '''function getCategoryById(id) {
            const cats = Array.isArray(window.CATEGORY_LIST) ? window.CATEGORY_LIST : [];
            return cats.find(c => String(c.id || "").trim() === String(id || "").trim()) || null;
          }

          function getNearbyBadgeOptions() {
            const cats = Array.isArray(window.CATEGORY_LIST) ? window.CATEGORY_LIST : [];
            return ["all", ...cats.map(c => String(c.id || "").trim()).filter(Boolean)];
          }

          function normalizeBadgeFilter(id) {
            const raw = String(id || "all").trim() || "all";
            if (raw === "all") return "all";
            return getCategoryById(raw) ? raw : "all";
          }

          function getActiveBadgeFilter() {
            return normalizeBadgeFilter(window.HG_NEARBY_BADGE_FILTER || "all");
          }''',
              '''function getCategoryById(id) {
            return window.HGNearbyFilters?.getCategoryById?.(id) || null;
          }

          function getNearbyBadgeOptions() {
            return window.HGNearbyFilters?.getBadgeOptions?.() || ["all"];
          }

          function normalizeBadgeFilter(id) {
            return window.HGNearbyFilters?.normalizeBadgeFilter?.(id) || "all";
          }

          function getActiveBadgeFilter() {
            return window.HGNearbyFilters?.getActiveBadgeFilter?.() || "all";
          }'''
          )

          replace_once(
              "js/ui/left-panel.js",
              '''  window.HG_NEARBY_BADGE_FILTER = next;
            try { localStorage.setItem("hg_nearby_badge_filter_v1", next); } catch {}
          ''',
              '''  window.HGNearbyFilters?.setActiveBadgeFilter?.(next);
          '''
          )

          replace_once(
              "js/ui/left-panel.js",
              '''function isBadgeFilterActive() {
            const f = getActiveBadgeFilter();
            return !!f && f !== "all";
          }''',
              '''function isBadgeFilterActive() {
            return window.HGNearbyFilters?.isBadgeFilterActive?.() || false;
          }'''
          )

          replace_once(
              "js/ui/left-panel.js",
              '''    window.HG_NEARBY_FILTER =
                localStorage.getItem("hg_nearby_filter_v1") || "unvisited";

              window.HG_NEARBY_BADGE_FILTER =
                normalizeBadgeFilter(localStorage.getItem("hg_nearby_badge_filter_v1") || "all");
              window.HG_NEARBY_SORT =
                normalizeNearbySort(localStorage.getItem("hg_nearby_sort_v1") || "distance");
              window.HG_NEARBY_FAVORITES_ONLY =
                localStorage.getItem("hg_nearby_favorites_filter_v1") === "1";

              window.HG_NATURE_FILTER =
                localStorage.getItem("hg_nature_filter_v1") || "all";
          ''',
              '''    window.HGNearbyFilters?.initializeFromStorage?.();
          '''
          )

          replace_once(
              "js/ui/left-panel.js",
              '  const PLACES_ORDER = ["unvisited", "all", "unlocked"];\n\n',
              ''
          )
          replace_once(
              "js/ui/left-panel.js",
              '  const NATURE_ORDER = ["all", "unlocked", "flora", "fauna"];\n',
              ''
          )
          replace_once(
              "js/ui/left-panel.js",
              '  const SORT_ORDER = ["distance", "oldest", "newest"];\n',
              ''
          )

          replace_once(
              "js/ui/left-panel.js",
              '''        const i = NATURE_ORDER.indexOf(window.HG_NATURE_FILTER);
                  window.HG_NATURE_FILTER = NATURE_ORDER[(i + 1) % NATURE_ORDER.length];
                  try { localStorage.setItem("hg_nature_filter_v1", window.HG_NATURE_FILTER); } catch {}''',
              '''        window.HG_NATURE_FILTER = window.HGNearbyFilters?.cycleNatureFilter?.() || "all";'''
          )
          replace_once(
              "js/ui/left-panel.js",
              '''        const i = PLACES_ORDER.indexOf(window.HG_NEARBY_FILTER);
                  window.HG_NEARBY_FILTER = PLACES_ORDER[(i + 1) % PLACES_ORDER.length];
                  try { localStorage.setItem("hg_nearby_filter_v1", window.HG_NEARBY_FILTER); } catch {}''',
              '''        window.HG_NEARBY_FILTER = window.HGNearbyFilters?.cyclePlaceFilter?.() || "unvisited";'''
          )
          replace_once(
              "js/ui/left-panel.js",
              '''      window.HG_NEARBY_FAVORITES_ONLY = !window.HG_NEARBY_FAVORITES_ONLY;
                try { localStorage.setItem("hg_nearby_favorites_filter_v1", window.HG_NEARBY_FAVORITES_ONLY ? "1" : "0"); } catch {}''',
              '''      window.HG_NEARBY_FAVORITES_ONLY = window.HGNearbyFilters?.toggleFavorites?.() || false;'''
          )
          replace_once(
              "js/ui/left-panel.js",
              '''      const current = normalizeNearbySort(window.HG_NEARBY_SORT);
                const i = SORT_ORDER.indexOf(current);
                const next = SORT_ORDER[(i + 1) % SORT_ORDER.length] || "distance";
                window.HG_NEARBY_SORT = next;
                try { localStorage.setItem("hg_nearby_sort_v1", next); } catch {}''',
              '''      window.HG_NEARBY_SORT = window.HGNearbyFilters?.cycleSort?.() || "distance";'''
          )
          PY
      - name: Verify browser TypeScript and build
        run: |
          npm run typecheck:web
          npm run build:web
          git diff --check
      - name: Commit migration and generated browser outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ui/nearbyFilters.ts js/ui/nearby-filters.js js/ui/left-panel.js js/app.js build/build-web.mjs schemas/app-globals.d.ts dist/web/nearbyFilters.js
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "Extract Nearby filter state to TypeScript"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
