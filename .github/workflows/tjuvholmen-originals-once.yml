name: Tjuvholmen one-time Wikimedia original source archive
on:
  push:
    branches:
      - content/tjuvholmen-originals-closeout-20261112
    paths:
      - .github/workflows/tjuvholmen-originals-once.yml
permissions:
  contents: write
jobs:
  archive:
    if: github.repository == 'Paradispartiet/History-Go' && github.ref == 'refs/heads/content/tjuvholmen-originals-closeout-20261112' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/tjuvholmen-originals-closeout-20261112
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Try exact Commons originals, no bypass on 429
        run: python scripts/archive-tjuvholmen-structure-originals.py
      - name: Commit evidence and any verified original bytes only
        shell: bash
        run: |
          set -euo pipefail
          git add -- reports/place-production/tjuvholmen-structures-source-candidates-20261112.json reports/place-production/tjuvholmen-structure-originals-retrieval-20261112.json
          git add -A -- bilder/kort/structures/source/
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".")
          manifest=json.loads((root/"reports/place-production/tjuvholmen-structures-source-candidates-20261112.json").read_text())
          for item in manifest["candidates"]:
              if item.get("original_file_pending") is False:
                  path=root/item["original_archive"]["path"]
                  assert path.is_file(), f"Reported original missing on disk: {path}"
          PY
          if git diff --cached --quiet; then
            echo "No new verified originals or evidence"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Archive verified Commons originals or record retrieval blockers'
          git push origin HEAD:content/tjuvholmen-originals-closeout-20261112
