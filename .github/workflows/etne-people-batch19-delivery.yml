name: Etne People of Places batch 19 validation

on:
  pull_request:
    paths:
      - '.github/workflows/etne-people-batch19-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 2350
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/etne-people-of-places-batch19
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          mkdir -p reports/etne-people-of-places-batch19-validation
          npm install --no-audit --no-fund 2>&1 | tee reports/etne-people-of-places-batch19-validation/npm-install.log

      - name: Run batch 19 regression test
        run: node tests/etne-people-of-places-batch19.test.js 2>&1 | tee reports/etne-people-of-places-batch19-validation/batch19-test.log

      - name: Run full people checks
        run: bash scripts/check-people.sh 2>&1 | tee reports/etne-people-of-places-batch19-validation/check-people.log

      - name: Audit Etne coverage and target uniqueness
        run: |
          node <<'NODE' | tee reports/etne-people-of-places-batch19-validation/coverage.json
          const fs = require('fs');
          const path = require('path');

          const runtimePlaces = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const activeIds = new Set(runtimePlaces.map((place) => place.id));
          const placeManifest = JSON.parse(fs.readFileSync('data/places/manifest.json', 'utf8'));
          const etnePlaces = [];
          const etneIds = new Set();
          for (const rel of placeManifest.files) {
            const doc = JSON.parse(fs.readFileSync(path.join('data', rel), 'utf8'));
            const places = Array.isArray(doc) ? doc : [doc];
            for (const place of places) {
              if (!place?.id || !activeIds.has(place.id)) continue;
              if (String(place.kommune || '').toLowerCase() !== 'etne') continue;
              if (etneIds.has(place.id)) throw new Error(`Duplicate active Etne place: ${place.id}`);
              etneIds.add(place.id);
              etnePlaces.push(place);
            }
          }

          const peopleManifest = JSON.parse(fs.readFileSync('data/people/manifest.json', 'utf8'));
          const covered = new Set();
          const targetLinks = [];
          let totalPeople = 0;
          for (const rel of peopleManifest.files) {
            const doc = JSON.parse(fs.readFileSync(path.join('data', rel), 'utf8'));
            const people = Array.isArray(doc) ? doc : [doc];
            for (const person of people) {
              totalPeople += 1;
              const links = new Set([person.placeId, ...(person.places || [])].filter(Boolean));
              for (const id of links) if (etneIds.has(id)) covered.add(id);
              if (links.has('litledalen_kraftverk')) targetLinks.push({ id: person.id, name: person.name, file: rel });
            }
          }

          const uncovered = etnePlaces.map((place) => place.id).filter((id) => !covered.has(id)).sort();
          const expectedTargetLinks = [{
            id: 'halfdan_greve',
            name: 'Halfdan Greve',
            file: 'people/naeringsliv/vestland/etne/people_litledalen_kraftverk_batch1.json'
          }];
          if (JSON.stringify(targetLinks) !== JSON.stringify(expectedTargetLinks)) {
            throw new Error(`Unexpected Litledalen people links: ${JSON.stringify(targetLinks)}`);
          }
          if (etnePlaces.length !== 81) throw new Error(`Expected 81 active Etne places, got ${etnePlaces.length}`);
          if (covered.size !== 60) throw new Error(`Expected 60 covered Etne places after batch 19, got ${covered.size}`);
          if (uncovered.length !== 21) throw new Error(`Expected 21 uncovered Etne places after batch 19, got ${uncovered.length}`);

          console.log(JSON.stringify({
            status: 'PASS',
            peopleManifestFiles: peopleManifest.files.length,
            totalPeople,
            activeEtnePlaces: etnePlaces.length,
            coveredEtnePlaces: covered.size,
            uncoveredEtnePlaces: uncovered.length,
            targetLinks,
            uncovered
          }, null, 2));
          NODE

      - name: Run typecheck
        run: npm run typecheck 2>&1 | tee reports/etne-people-of-places-batch19-validation/typecheck.log

      - name: Run tools check against known main story baseline
        run: |
          set +e
          npm run tools:check 2>&1 | tee reports/etne-people-of-places-batch19-validation/tools-check.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "PASS: tools:check passed fully." | tee reports/etne-people-of-places-batch19-validation/tools-check-baseline.log
            exit 0
          fi
          node <<'NODE' | tee reports/etne-people-of-places-batch19-validation/tools-check-baseline.log
          const fs = require('fs');
          const log = fs.readFileSync('reports/etne-people-of-places-batch19-validation/tools-check.log', 'utf8');
          const actual = log.split(/\r?\n/).filter((line) => line.startsWith('- Ugyldig place_id:'));
          const expected = [
            '- Ugyldig place_id: story=st_regjeringskvartalet_terror_2011 field=related_places[0] place_id=utoya file=data/stories/stories_regjeringskvartalet.json',
            '- Ugyldig place_id: story=st_mollergata_19_petter_moens_dagbok field=related_places[1] place_id=norges_hjemmefrontmuseum file=data/stories/stories_mollergata_19.json',
            '- Ugyldig place_id: story=st_mollergata_19_petter_moens_dagbok field=next_scenes[0].place_id place_id=norges_hjemmefrontmuseum file=data/stories/stories_mollergata_19.json',
            '- Ugyldig place_id: story=st_folketeateret_kino_teater_opera_musikal field=related_places[1] place_id=operaen file=data/stories/stories_folketeateret.json',
            '- Ugyldig place_id: story=st_folketeateret_kino_teater_opera_musikal field=next_scenes[0].place_id place_id=operaen file=data/stories/stories_folketeateret.json'
          ];
          if (!log.includes('Stories integrity FAILED')) throw new Error('tools:check failed outside the known story baseline');
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`Story baseline changed: ${JSON.stringify(actual, null, 2)}`);
          console.log('PASS: tools:check stopped only on the five known main-branch story-reference failures.');
          NODE

      - name: Run diff whitespace check
        run: git diff --check | tee reports/etne-people-of-places-batch19-validation/git-diff-check.log

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: etne-people-batch19-validation
          path: reports/etne-people-of-places-batch19-validation
          if-no-files-found: error
