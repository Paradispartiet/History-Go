name: Repair Telegraf production

on:
  push:
    branches:
      - agent/oslo-quiz-telegrafbygningen-5x7

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-quiz-telegrafbygningen-5x7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate canonical quiz and context
        run: node scripts/repair-telegraf-production.mjs
      - name: Commit generated files
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz/naeringsliv/telegrafbygningen_sets_merged.json data/quiz/production_context/naeringsliv/telegrafbygningen.json
          git commit -m "Generer kanonisk Telegrafbygningen-kontekst"
          git push origin HEAD:agent/oslo-quiz-telegrafbygningen-5x7
