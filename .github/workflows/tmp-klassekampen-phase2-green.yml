name: TEMP Klassekampen Phase 2 GREEN

on:
  push:
    branches:
      - agent/klassekampen-phase-2-20260916

permissions:
  contents: write

concurrency:
  group: klassekampen-phase2-green
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/klassekampen-phase-2-20260916
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for focused UI audit
        run: npx playwright install --with-deps chromium

      - name: Materialize reviewed Commons assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bilder/places bilder/kort/objects bilder/kort/brands
          UA='History-Go educational place production (https://github.com/Paradispartiet/History-Go)'
          curl -A "$UA" -L --fail --retry 3 --retry-delay 2 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Groenland%204%20Oslo.jpg?width=900' \
            -o bilder/places/klassekampen_redaksjon_front.jpg
          curl -A "$UA" -L --fail --retry 3 --retry-delay 2 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Klassekampen_no_1_1969.jpg?width=900' \
            -o bilder/kort/objects/klassekampen_forste_utgave_1969.jpg
          curl -A "$UA" -L --fail --retry 3 --retry-delay 2 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Klassekampen_logo.gif' \
            -o bilder/kort/brands/klassekampen.gif
          test -s bilder/places/klassekampen_redaksjon_front.jpg
          test -s bilder/kort/objects/klassekampen_forste_utgave_1969.jpg
          test -s bilder/kort/brands/klassekampen.gif

      - name: Materialize canonical Phase 2 data
        run: node scripts/tmp-klassekampen-phase2-green.mjs

      - name: Rebuild owner-managed runtime outputs
        shell: bash
        run: |
          set -euo pipefail
          npm run build:web
          npm run places:index:build
          npm run place-open:build

      - name: Verify focused GREEN contract and UI
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/klassekampen-redaksjon-completion.test.mjs tests/place-quizcards-category-manifests.test.mjs
          node tests/klassekampen-redaksjon-browser-audit.test.mjs
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-content
          npm run places:index:check
          npm run place-open:check
          npm run build:web:check

      - name: Commit verified materialization and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/tmp-klassekampen-phase2-green.mjs .github/workflows/tmp-klassekampen-phase2-green.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialization changes to commit.'
            exit 0
          fi
          git commit -m 'Complete Klassekampen Phase 2 place production'
          git push origin HEAD:agent/klassekampen-phase-2-20260916
