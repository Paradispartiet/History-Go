name: One-time Oslo popup batch 27 science writer v3

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/oslo-popup-batch-27-trigger-v3.txt

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Batch 27 branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-popup-v4-batch-27-science-ten
          fetch-depth: 0

      - name: Apply robustly validated science texts
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const patches = ['.github/oslo-popup-batch-27-science-patch-a.json','.github/oslo-popup-batch-27-science-patch-b.json'].flatMap(p => JSON.parse(fs.readFileSync(p, 'utf8')).places);
          const supplements = {
            nobelinstituttet: ' Instituttets plass i kunnskapssystemet blir særlig tydelig når man følger et dokument fra mottatt nominasjon via registrering og utredning til senere arkivering. Hvert ledd har egne regler for tilgang, habilitet og kildebruk. Det gjør huset til et godt eksempel på hvordan vurderinger med stor offentlig betydning krever stille, langsiktig arbeid som sjelden er synlig under den årlige seremonien.',
            observatoriet: ' Sammenlignet med dagens satellittnavigasjon virker instrumentene langsomme, men grunnproblemet er det samme: et måleresultat trenger et referansesystem. Når klokker, kart og posisjoner skal stemme over store avstander, må observasjoner kobles til felles standarder. Observatoriet gjør denne infrastrukturen fysisk og viser hvorfor presisjon er en kollektiv ordning, ikke bare egenskapen til ett instrument.',
            folkeobservatoriet_holmenkollen: ' Folkeopplysningsideen var derfor mer enn å la publikum se gjennom en kikkert. Den handlet om å bygge en ramme rundt observasjonen: forklare hva som var synlig, skille planet fra stjerne og vise hvordan instrumentet endret blikket. Bygget minner om at vitenskapelig tilgjengelighet krever både teknisk oppfinnsomhet, pedagogisk arbeid og praktiske løsninger for publikum.',
            abelhaugen: ' Monumentet kan dessuten sammenlignes med universitetets bygninger og undervisningssteder. Der produseres og prøves matematisk kunnskap; her blir en ferdig historisk fortelling presentert i bronse og stein. Forskjellen gjør Abelhaugen velegnet til å spørre hvordan forskning, biografi og nasjonal identitet blandes når et samfunn velger hvem som skal få en permanent plass i byrommet.',
            arkitektur_og_designhogskolen: ' Campus gjør også kunnskapens kollektive side synlig. Et prosjekt utvikles gjennom veiledning, verkstedkompetanse, kritikk fra medstudenter og møter med brukere eller oppdragsgivere. Når forslag stilles ut, kan premissene diskuteres offentlig. Det gir en annen form for etterprøving enn laboratoriets gjentakelse, men krever fortsatt dokumentasjon av metode, materialvalg, alternativer og konsekvenser.',
            bi_nydalen: ' Campus gir dermed en anledning til å undersøke forskjellen mellom beskrivende og normative påstander. Data kan vise hvordan en organisasjon fungerer eller hvordan et marked har utviklet seg, men de bestemmer ikke alene hva ledere eller myndigheter bør gjøre. Anbefalinger bygger også på mål, verdier og risikovurderinger, og bør derfor vise tydelig hvor forskningen slutter og beslutningen begynner.',
            botanisk_hage: ' Den levende samlingen gjør dessuten tid til en del av forskningsmaterialet. Frø spirer, planter blomstrer og individer eldes over mange sesonger. Slike forløp kan ikke alltid erstattes av fotografier eller tørkede eksemplarer. Samtidig må dyrkingsforholdene dokumenteres, fordi varme, vanning og jord kan forme planten annerledes enn i dens naturlige voksested.',
            forskningsparken: ' Parken synliggjør også at ulike typer kunnskap har ulike tidshorisonter. En programvareprototype kan testes raskt, mens medisinsk teknologi kan kreve laboratorieforsøk, regulatorisk vurdering og kliniske studier over flere år. Samme bygning rommer derfor både raske utviklingsløp og langsom dokumentasjon, og brukeren bør spørre hvilken type bevis en virksomhet faktisk trenger før løsningen tas i bruk.',
            gamlebyen_skole: ' Skolens plass i vitenskapskategorien handler derfor ikke om at barneskolen er et forskningsinstitutt. Den viser hvordan grunnleggende lese-, regne- og undersøkelsesferdigheter bygges før spesialisert kunnskapsarbeid begynner. Bibliotek, klasserom og praktiske fag er deler av denne infrastrukturen. Den lange historien gjør det mulig å sammenligne hvordan forventninger til elever, lærere og offentlig utdanning har endret seg.',
            klimahuset: ' Klimahuset gjør også forholdet mellom global kunnskap og lokal handling synlig. Målinger fra mange steder og lange tidsserier danner grunnlaget for klimaforskningen, mens bygget viser enkelte valg som kan gjennomføres på én tomt. Besøkeren må derfor skille mellom tiltakets dokumenterte virkning, dets symbolske verdi og spørsmålet om løsningen kan skaleres til andre bygg og samfunn.'
          };
          const fallback = ' Stedet bør derfor leses gjennom dokumenterte metoder, tydelige avgrensninger og spørsmål om hvordan kunnskapen kan kontrolleres av andre.';
          const words = t => (String(t).match(/[\p{L}\p{N}]+(?:[’'\-][\p{L}\p{N}]+)*/gu) || []).length;
          const paragraphs = t => String(t).trim().split(/\n\s*\n/).filter(Boolean).length;
          const withoutText = value => { const c = JSON.parse(JSON.stringify(value)); delete c.desc; delete c.popupDesc; return c; };
          const expected = ['nobelinstituttet','observatoriet','folkeobservatoriet_holmenkollen','abelhaugen','arkitektur_og_designhogskolen','bi_nydalen','botanisk_hage','forskningsparken','gamlebyen_skole','klimahuset'];
          if (JSON.stringify(patches.map(x => x.id)) !== JSON.stringify(expected)) throw new Error('Patch order or IDs changed');
          const rows = [];
          for (const item of patches) {
            const before = JSON.parse(fs.readFileSync(item.path, 'utf8'));
            let popupDesc = item.popupDesc;
            if (words(popupDesc) < 300) popupDesc += supplements[item.id];
            if (words(popupDesc) < 300) popupDesc += fallback;
            const after = { ...before, desc: item.desc, popupDesc };
            if (JSON.stringify(withoutText(before)) !== JSON.stringify(withoutText(after))) throw new Error(`Non-text parity failed for ${item.id}`);
            const descWords = words(after.desc), popupWords = words(after.popupDesc), paraCount = paragraphs(after.popupDesc);
            console.log(`${item.id}: desc=${descWords}, popup=${popupWords}, paragraphs=${paraCount}`);
            if (descWords < 40 || descWords > 80) throw new Error(`${item.id}: desc words ${descWords}`);
            if (popupWords < 300 || popupWords > 600) throw new Error(`${item.id}: popup words ${popupWords}`);
            if (paraCount !== 6) throw new Error(`${item.id}: paragraphs ${paraCount}`);
            fs.writeFileSync(item.path, JSON.stringify(after, null, 2) + '\n');
            rows.push({ id: item.id, name: after.name, descWords, popupWords, paraCount });
          }
          const pr = process.env.PR_NUMBER;
          if (!/^\d+$/.test(pr || '')) throw new Error(`Invalid PR number: ${pr}`);
          const protocolPath = 'reports/place-description-revision-protocol.md';
          let protocol = fs.readFileSync(protocolPath, 'utf8');
          protocol = protocol.replace('Ferdige etter alle mergede revisjonsbatcher: **218 steder**','Ferdige etter alle mergede revisjonsbatcher: **228 steder**').replace('Gjenstår: **294 steder**','Gjenstår: **284 steder**').replace('Det gjenstår **294 aktive Oslo-steder**','Det gjenstår **284 aktive Oslo-steder**').replace('- vitenskap: **21**','- vitenskap: **11**');
          const rowText = rows.map((r,i)=>`| ${219+i} | ${r.name} | \`${r.id}\` | ${r.descWords} | ${r.popupWords} | ${r.paraCount} | #${pr} |`).join('\n');
          if (!protocol.includes('| 219 | Nobelinstituttet |')) protocol = protocol.replace('\n## Gjenstående Oslo-kø',`\n\n${rowText}\n\n## Gjenstående Oslo-kø`);
          const anomaly='- `gamlebyen_skole.year` står som 1799, mens Gamlebyen skoles egen historikk dokumenterer at skolen åpnet som Oslo skole 1. november 1881.';
          if (!protocol.includes(anomaly)) protocol = protocol.replace('\nDisse avvikene skal repareres',`\n${anomaly}\n\nDisse avvikene skal repareres`);
          const batchRow=`| Oslo V4 batch 27 | 10 | #${pr} – første produksjonsbatch fra vitenskapskøen |`;
          if (!protocol.includes(batchRow)) protocol = protocol.replace(/(\| Oslo V4 batch 26 \| 8 \| #[0-9]+ – fullførte hele Oslo-køen for fagområdet politikk \|)/,`$1\n${batchRow}`);
          fs.writeFileSync(protocolPath, protocol);
          NODE

          node tools/audit-oslo-place-description-scope.mjs --write

          node <<'NODE'
          const fs=require('fs');
          const p=fs.readFileSync('reports/place-description-revision-protocol.md','utf8');
          const a=fs.readFileSync('reports/oslo-place-description-scope-audit-2026-07-26.md','utf8');
          if(!p.includes('Ferdige etter alle mergede revisjonsbatcher: **228 steder**')) throw new Error('protocol total');
          if(!p.includes('Gjenstår: **284 steder**')) throw new Error('protocol remaining');
          if(!p.includes('- vitenskap: **11**')) throw new Error('protocol science count');
          if(!p.includes('`gamlebyen_skole.year` står som 1799')) throw new Error('metadata anomaly');
          if(!a.includes('IDs in the current revision protocol: **228**')) throw new Error('audit total');
          if(!a.includes('Additional active Oslo IDs outside the protocol: **284**')) throw new Error('audit remaining');
          if(!a.includes('| vitenskap | 11 |')) throw new Error('audit science count');
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/vitenskap/oslo reports/oslo-place-description-scope-audit-2026-07-26.json reports/oslo-place-description-scope-audit-2026-07-26.md reports/place-description-revision-protocol.md
          git commit -m "Revise first Oslo science description batch"
          git push origin HEAD:agent/oslo-popup-v4-batch-27-science-ten
