name: Oslo next five real-app closeout
on:
  pull_request:
    paths:
      - '.github/workflows/oslo-next-five-real-app-closeout.yml'
      - 'tests/oslo-next-five-real-app-browser-20261027.mjs'
      - 'tests/oslo-next-six-quiz-parity.test.mjs'
      - 'data/quiz/manifest.json'
      - 'data/quiz/**'
      - 'data/quizcards/**'
      - 'data/knowledge/knowledge_units.generated.json'
      - 'data/places/**'
      - 'data/runtime/place-open/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oslo-next-five-real-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    name: Five Oslo Places — mobile and desktop real app
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and launch Chromium dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify five-Place quiz and Knowledge parity
        run: node --test tests/oslo-next-six-quiz-parity.test.mjs
      - name: Inspect PlaceCard, photos, QuizCard, fullquiz and Fagverk on mobile/desktop
        run: node tests/oslo-next-five-real-app-browser-20261027.mjs
      - name: Save real-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oslo-next-five-mobile-desktop
          path: artifacts/oslo-next-five-browser/
          if-no-files-found: warn
