name: One-time popupDesc fact gate

on:
  push:
    branches:
      - agent/popupdesc-fakta-regjeringskvartalet

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/popupdesc-fakta-regjeringskvartalet
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize machine-readable popupDesc rules
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const file = 'data/places/regler/place_description_templates_v1.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));

          data.version = '4.1.0';
          data.status = 'canonical_fact_only_full_popup_articles';
          data.purpose = 'Sikre at desc og popupDesc består av dokumenterte stedfakta, uten redaksjonell, pedagogisk, kartteknisk eller oppkonstruert fylltekst.';

          data.global.factualityGate = {
            everyFactualClaimNeedsInspectableSupport: true,
            everyParagraphNeedsConcretePlaceAnchors: true,
            minimumConcreteAnchorsPerParagraph: 2,
            allowedExplanations: [
              'kildebelagt årsak og konsekvens',
              'dokumentert konflikt mellom navngitte aktører eller vedtak',
              'konkret sammenligning mellom daterte tidslag'
            ],
            notFactsOnTheirOwn: [
              'betydning',
              'spenning',
              'rolle',
              'identitet',
              'åpenhet',
              'sikkerhet',
              'transformasjon',
              'samfunn',
              'relevans',
              'lesbarhet'
            ],
            missingContentRule: 'Mer research er eneste godkjente løsning. Ikke fyll med analyse, moral, redaksjonell forklaring eller generelle setninger.'
          };

          data.global.forbiddenEditorialLanguage = [
            {
              id: 'history_go_reader_copy',
              examples: ['History Go kan bruke stedet til', 'I History Go'],
              rule: 'Produktnavn og redaksjonell bruk skal aldri stå i brukerartikkelen.'
            },
            {
              id: 'reader_instruction',
              examples: ['Se hvordan', 'Husk at', 'spilleren skal forstå', 'spilleren bør forstå'],
              rule: 'popupDesc skal formidle kunnskap, ikke instruere spilleren.'
            },
            {
              id: 'map_identity_copy',
              examples: ['kartpunktet er et områdeanker', 'autoritative kartidentiteten', 'markør for hele området'],
              rule: 'Kart-, koordinat- og representasjonslogikk hører i egne metadatafelt.'
            },
            {
              id: 'dataset_distinction_copy',
              examples: ['må holdes adskilt fra', 'skal ikke reduseres til én samlet markør', 'oppdateres separat'],
              rule: 'Datasettgrenser og canonical-identiteter skal ikke forklares i popupDesc.'
            },
            {
              id: 'production_defence_copy',
              examples: ['Dette hindrer at', 'stabil nok til å romme videre utvikling'],
              rule: 'Teksten skal ikke forsvare redaksjonelle eller tekniske valg.'
            }
          ];

          const newRules = [
            'Hvert avsnitt skal inneholde minst to konkrete stedsholdepunkter når kildegrunnlaget tillater det.',
            'Ikke konstruer en generell spenning, moral eller faglig lesning som kildene ikke uttrykker.',
            'Fjern alle setninger som forklarer History Go, spilleren, kartpunktet, markøren eller produksjonsvalget.'
          ];
          for (const rule of newRules) {
            if (!data.global.writingRules.includes(rule)) data.global.writingRules.push(rule);
          }

          if (!data.global.antiFormula.watchWords.includes('spenning')) {
            data.global.antiFormula.watchWords.push('spenning');
          }
          data.global.antiFormula.rule = 'Abstrakte ord er tillatt når de forklarer et konkret, kildebelagt faktum, men ikke som erstatning for fakta.';

          const reviewQuestions = [
            'Kan hver faktisk påstand føres tilbake til en inspectable kilde?',
            'Har hvert avsnitt konkrete navn, datoer, handlinger, objekter, funksjoner, mål eller resultater?',
            'Er all History Go-, spiller-, kart-, markør- og produksjonsmetatekst fjernet?'
          ];
          for (const question of reviewQuestions) {
            if (!data.global.reviewQuestions.includes(question)) data.global.reviewQuestions.push(question);
          }

          const politicsAvoid = data.categories?.politikk?.avoid;
          if (Array.isArray(politicsAvoid) && !politicsAvoid.includes('udokumentert spenning mellom åpenhet og sikkerhet')) {
            politicsAvoid.push('udokumentert spenning mellom åpenhet og sikkerhet');
          }

          fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`);
          NODE

      - name: Validate factual popupDesc contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const template = JSON.parse(fs.readFileSync('data/places/regler/place_description_templates_v1.json', 'utf8'));
          const place = JSON.parse(fs.readFileSync('data/places/politikk/oslo/places_politikk/regjeringskvartalet.json', 'utf8'));
          const popup = place.popupDesc;
          const words = popup.normalize('NFKC').match(/[\p{L}\p{N}]+(?:[-’'][\p{L}\p{N}]+)*/gu) ?? [];
          const paragraphs = popup.split(/\n\s*\n/u).filter(Boolean);
          const forbidden = [
            /history go/iu,
            /se hvordan/iu,
            /husk at/iu,
            /kartpunkt/iu,
            /områdeanker/iu,
            /kartidentitet/iu,
            /markøridentitet/iu,
            /oppdateres separat/iu,
            /stabil nok til å romme/iu,
            /dette hindrer at/iu
          ];

          if (template.version !== '4.1.0') throw new Error('Maskinlesbar popupDesc-regel er ikke oppdatert til 4.1.0');
          if (!template.global?.factualityGate?.everyFactualClaimNeedsInspectableSupport) throw new Error('Faktaport mangler');
          if (!Array.isArray(template.global?.forbiddenEditorialLanguage)) throw new Error('Forbudt metatekst-liste mangler');
          if (words.length < 300) throw new Error(`popupDesc er bare ${words.length} ord`);
          if (paragraphs.length < 3) throw new Error(`popupDesc har bare ${paragraphs.length} avsnitt`);
          for (const pattern of forbidden) {
            if (pattern.test(popup)) throw new Error(`Forbudt popupDesc-språk: ${pattern}`);
          }
          for (const required of ['Erling Viksjø', '22. juli 2011', '13. april 2026', 'A-blokka', 'D-blokka', 'Matias Faldbakken']) {
            if (!popup.includes(required)) throw new Error(`Mangler konkret faktaholdepunkt: ${required}`);
          }
          console.log(`Regjeringskvartalet: ${words.length} ord, ${paragraphs.length} avsnitt, ingen intern metatekst.`);
          NODE

      - name: Rebuild and validate place data
        run: |
          npm run places:index:build
          npm run places:index:check
          npm run places:emner:check
          node scripts/audit-place-descriptions.mjs --strict

      - name: Commit production changes and remove one-time workflow
        run: |
          rm .github/workflows/one-time-popupdesc-fact-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/regler/place_description_templates_v1.json \
                  data/places/places_index.json \
                  .github/workflows/one-time-popupdesc-fact-gate.yml
          if git diff --cached --quiet; then
            echo "Ingen genererte endringer å committe"
          else
            git commit -m "Synkroniser popupDesc-faktaport og stedindeks"
            git push origin HEAD:agent/popupdesc-fakta-regjeringskvartalet
          fi
