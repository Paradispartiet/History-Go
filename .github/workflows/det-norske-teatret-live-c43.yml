name: Det Norske Teatret C43 deployed image QA

on:
  pull_request:
    paths:
      - '.github/workflows/det-norske-teatret-live-c43.yml'
      - 'tests/det-norske-teatret-live-browser-c43.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dnt-c43-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deployed-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Playwright test dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate deployed Pages files and run real public app popup
        run: node tests/det-norske-teatret-live-browser-c43.mjs
      - name: Preserve diagnostic result and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnt-c43-public-browser-evidence
          path: artifacts/dnt-c43/*
          if-no-files-found: warn
          retention-days: 7
