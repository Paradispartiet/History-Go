name: Oslo V1 epoch index one-shot
on:
  push:
    branches:
      - content/oslo-v1-museums-gassverk-brugata-20261021
    paths:
      - '.github/workflows/oslo-v1-epoke-sync-20261021.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate deterministic epoch index
        run: npm run epoker:places:build
      - name: Commit only generated index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/epoker/epoke-place-index.json
          if ! git diff --cached --quiet; then
            git commit -m "History Go: regenerate epoch index for four-place V1 batch"
            git push origin HEAD:content/oslo-v1-museums-gassverk-brugata-20261021
          fi
