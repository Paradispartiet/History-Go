name: TypeScript search migration debug

on:
  pull_request:
    paths:
      - "js/ui/search.ts"
      - "build/build-web.mjs"
      - ".github/workflows/typescript-search-debug.yml"

permissions:
  contents: write

jobs:
  finalize-search-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove overly broad local index signature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("js/ui/search.ts")
          source = path.read_text()
          needle = "  [key: string]: unknown;\n"
          if needle not in source:
              raise SystemExit(0)
          path.write_text(source.replace(needle, "", 1))
          PY
      - name: Verify and build browser runtime
        run: |
          npm run typecheck:web
          npm run build:web
      - name: Commit typed source and generated compatibility outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ui/search.ts dist/web/search.js js/ui/search.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix search types and build runtime"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
