name: Register Bislett Vålerenga batch 2

on:
  push:
    branches:
      - data/people-bislett-vif-historic-batch2-20260714
    paths:
      - .github/workflows/register-bislett-vif-batch2.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/people-bislett-vif-historic-batch2-20260714
          fetch-depth: 0
      - name: Register files and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/people/manifest.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          files = payload['files']
          additions = [
              'people/sport/oslo/bislett_stadion/tom_rusz_jacobsen.json',
              'people/sport/oslo/bislett_stadion/tom_h_jacobsen.json',
              'people/sport/oslo/bislett_stadion/arild_mathisen.json',
              'people/sport/oslo/bislett_stadion/jorn_andersen.json',
              'people/sport/oslo/bislett_stadion/eivind_arnevag.json',
          ]
          files[:] = [item for item in files if item not in additions]
          anchor = 'people/sport/oslo/bislett_stadion/per_edmund_mordt.json'
          if anchor not in files:
              raise SystemExit('Bislett batch 1 anchor not found')
          insert_at = files.index(anchor) + 1
          files[insert_at:insert_at] = additions
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git rm .github/workflows/register-bislett-vif-batch2.yml
          git add data/people/manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Register Bislett Vålerenga batch 2 in people manifest'
          git push origin HEAD:data/people-bislett-vif-historic-batch2-20260714
