name: Oslo six quiz polish canonical regeneration once
on:
  push:
    branches:
      - research/oslo-six-culture-institutions-v1-20261023
    paths:
      - .github/workflows/oslo-six-quiz-polish-sync-once.yml
permissions:
  contents: write
jobs:
  verify-and-synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-six-culture-institutions-v1-20261023
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh five production contexts after editorial quiz rewrites
        shell: bash
        run: |
          for subject_target in \
            "politikk arbeidersamfunnets_plass" \
            "politikk politihuset_gronland" \
            "politikk statsministerboligen" \
            "historie nobels_fredssenter" \
            "by vikaterrassen"; do
            set -- $subject_target
            npm run quiz:context -- --category "$1" --target "$2" --output "data/quiz/production_context/$1/$2.json"
          done
      - name: Generate and verify Knowledge links without stale ID reuse
        run: |
          npm run knowledge:canonical:write
          npm run knowledge:canonical:check
      - name: Update Fagverk release digest for source-first context
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Verify discipline balance and source-first quiz contracts
        run: |
          npm run audit:quiz-progression
          npm run audit:quiz-production-context
          node --test tests/oslo-sentrum-six-6586-integrity.test.mjs
          npm run test:quiz-production
      - name: Stop on unexpected generated files
        shell: bash
        run: |
          git diff --name-only
          CHANGED="$(git diff --name-only | grep -c . || true)"
          if [ "$CHANGED" -gt 55 ]; then
            echo "Refusing broad autogenerated update: $CHANGED files"
            exit 1
          fi
          if git diff --name-only | grep -E '^data/places/(by|politikk|historie)/oslo/'; then
            echo "Generator unexpectedly modified canonical Place sources"
            exit 1
          fi
      - name: Commit checked generated Knowledge and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git rm .github/workflows/oslo-six-quiz-polish-sync-once.yml
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "Regenerate Knowledge, contexts and Fagverk digest for source-checked Oslo quiz reasoning"
          git push origin HEAD:research/oslo-six-culture-institutions-v1-20261023
