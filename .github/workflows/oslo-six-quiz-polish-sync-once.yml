name: Oslo six quiz polish canonical regeneration once
on:
  push:
    branches:
      - research/oslo-six-culture-institutions-v1-20261023
    paths:
      - .github/workflows/oslo-six-quiz-polish-sync-once.yml
permissions:
  contents: write
jobs:
  verify-and-synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-six-culture-institutions-v1-20261023
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh five production contexts after editorial quiz rewrites
        shell: bash
        run: |
          for subject_target in \
            "politikk arbeidersamfunnets_plass" \
            "politikk politihuset_gronland" \
            "politikk statsministerboligen" \
            "historie nobels_fredssenter" \
            "by vikaterrassen"; do
            set -- $subject_target
            npm run quiz:context -- --category "$1" --target "$2" --output "data/quiz/production_context/$1/$2.json"
          done
      - name: Generate and verify Knowledge links without stale ID reuse
        run: |
          npm run knowledge:canonical:write
          npm run knowledge:canonical:check
      - name: Align all five ten-card collections with canonical Knowledge and fullquiz
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const targets = [
            ['politikk','arbeidersamfunnets_plass'],
            ['politikk','politihuset_gronland'],
            ['politikk','statsministerboligen'],
            ['historie','nobels_fredssenter'],
            ['by','vikaterrassen']
          ];
          for (const [cat,id] of targets) {
            const quiz = JSON.parse(fs.readFileSync('data/quiz/'+cat+'/'+id+'_sets.json', 'utf8'));
            const file = 'data/quizcards/'+cat+'/'+id+'_quizkort_v1.json';
            const cards = JSON.parse(fs.readFileSync(file, 'utf8'));
            const byId = new Map(quiz.sets.flatMap(set => set.questions.map(q => [q.id,q])));
            const matched = cards.cards.filter(c => c.targetId === id);
            if (matched.length !== 1 || matched[0].questions.length !== 10) throw Error(id+' incorrect QuizCard count');
            for (const card of matched) {
              for (const qcard of card.questions) {
                const question = byId.get(qcard.sourceQuestionId);
                if (!question || question.knowledge_link_status !== 'linked' || !question.primary_knowledge_unit_id) throw Error(id+' unlinked '+qcard.sourceQuestionId);
                for (const key of ['question','options','answer','answerIndex','knowledge','difficulty','claim_id','primary_knowledge_unit_id','knowledge_unit_ids','concept_ids','term_ids','emne_id','knowledge_contract_version','knowledge_link_status']) qcard[key] = question[key];
                qcard.sourceQuizId = question.quiz_id;
                qcard.source_refs = question.source;
                qcard.source_urls = question.source.map(x => quiz.sources[x] || x);
              }
              card.answerKey = card.questions.map(q => ({number:q.number, answer:q.answer, answerIndex:q.answerIndex}));
            }
            fs.writeFileSync(file, JSON.stringify(cards,null,2)+'\n');
          }
          NODE
      - name: Update Fagverk release digest for source-first context
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Verify discipline balance and source-first quiz contracts
        run: |
          npm run audit:quiz-progression
          npm run audit:quiz-production-context
          node --test tests/oslo-sentrum-six-6586-integrity.test.mjs
          npm run test:quiz-production
      - name: Stop on unexpected generated files
        shell: bash
        run: |
          git diff --name-only
          CHANGED="$(git diff --name-only | grep -c . || true)"
          if [ "$CHANGED" -gt 55 ]; then
            echo "Refusing broad autogenerated update: $CHANGED files"
            exit 1
          fi
          if git diff --name-only | grep -E '^data/places/(by|politikk|historie)/oslo/'; then
            echo "Generator unexpectedly modified canonical Place sources"
            exit 1
          fi
      - name: Commit checked generated Knowledge and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git rm .github/workflows/oslo-six-quiz-polish-sync-once.yml
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "Regenerate quiz Knowledge, 50 QuizCards, contexts and Fagverk digest for Oslo six"
          git push origin HEAD:research/oslo-six-culture-institutions-v1-20261023
