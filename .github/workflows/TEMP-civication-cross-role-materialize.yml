name: TEMP Civication cross-role materialize

on:
  push:
    branches:
      - agent/civication-cross-role-shared-world-pilot

permissions:
  contents: write

concurrency:
  group: civication-cross-role-materialize
  cancel-in-progress: true

jobs:
  materialize-and-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/civication-cross-role-shared-world-pilot
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize compiled registry
        run: node scripts/build-civication-scene-registry.mjs --write

      - name: Cross-role shared-world gate
        run: node tests/civication-cross-role-shared-world.test.js

      - name: Role World Realism Matrix gate
        run: node tests/civication-role-world-realism-matrix.test.js

      - name: Media leadership rollout gate
        run: node tests/civication-media-redaksjonell-ledelse-rollout-playability.test.js

      - name: Career Gameplay audit gate
        run: node scripts/audit-civication-career-gameplay.mjs --check

      - name: Compiled registry check
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Commit canonical generated registry
        run: |
          git add data/Civication/compiledSceneRegistryV1.json
          if git diff --cached --quiet; then
            echo "Compiled registry already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize cross-role shared-world registry"
          git push origin HEAD:agent/civication-cross-role-shared-world-pilot
