name: TEMP Fagverk Helse nutrition metabolism 9/12 writeback

on:
  push:
    branches:
      - agent/helse-nutrition-metabolism-fulltext-content
    paths:
      - 'scripts/materialize-helse-nutrition-metabolism-fulltext-v1.mjs'
      - 'scripts/audit-helse-nutrition-metabolism-fulltext-v1.mjs'
      - 'tests/helse-nutrition-metabolism-fulltext-v1.test.mjs'
      - 'scripts/audit-helse-cumulative-progress-v1.mjs'
      - 'tests/helse-cumulative-progress-v1.test.mjs'
      - '.github/workflows/TEMP-fagverk-helse-nutrition-metabolism-9-12-writeback.yml'

permissions:
  contents: write

jobs:
  writeback:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/helse-nutrition-metabolism-fulltext-content
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Validate source brief
        run: node scripts/brief-helse-nutrition-metabolism-sources-v1.mjs
      - name: Materialize nutrition metabolism fulltext
        run: node scripts/materialize-helse-nutrition-metabolism-fulltext-v1.mjs
      - name: Refresh general engine audit
        run: node scripts/audit-fagverk-general-engine.mjs --write-report
      - name: Build release manifest
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Write nutrition metabolism audit report
        run: node scripts/audit-helse-nutrition-metabolism-fulltext-v1.mjs --write-report
      - name: Validate full generated state
        run: |
          node scripts/audit-helse-nutrition-metabolism-fulltext-v1.mjs
          node scripts/audit-helse-cumulative-progress-v1.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-theory-quality.mjs
          node scripts/audit-fagverk-theory-integrity.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/helse-nutrition-metabolism-fulltext-v1.test.mjs tests/helse-cumulative-progress-v1.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-general-engine.test.mjs tests/fagverk-release-manifest.test.mjs
      - name: Commit deterministic writeback
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/fag/fag_manifest.json \
            data/fag/helse/helsepensum_canonical_v1.json \
            data/fag/helse/emner_helse_canonical_v1.json \
            data/fag/helse/methods_helse_canonical_v1.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_inventory.json \
            data/fagverk/subject_status.json \
            data/fagverk/fagverk_release.json \
            data/fagverk/helse/ernaering-metabolisme-energi-naeringsstoffer-regulering-og-kostmonster.json \
            data/fagverk/helse/ernaering-metabolisme-energi-naeringsstoffer-regulering-og-kostmonster \
            reports/fagverk/helse-nutrition-metabolism-fulltext-v1-audit.json \
            reports/fagverk/general-engine-audit.json
          if git diff --cached --quiet; then
            echo 'No generated writeback changes.'
          else
            git commit -m 'Materialize Helse nutrition metabolism at 9/12'
            git push origin HEAD:agent/helse-nutrition-metabolism-fulltext-content
          fi
