name: Complete Oslo coordinate control batch 34

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-34-final
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge latest main before applying coordinates
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Capture Batch 34 source results
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-34/sources
          mkdir -p "$out"
          node --experimental-strip-types tools/address-first-coordinate-finder.mts --address 'Maridalsveien 17 Oslo' \
            | tee "$out/vulkan-maridalsveien-17-geonorge.json"
          python3 - <<'PY' | tee "$out/source-resolution-summary.json"
          import json, urllib.parse, urllib.request, time
          from pathlib import Path
          out=Path('reports/oslo-coordinate-control-batch-34/sources')
          headers={'User-Agent':'History-Go-coordinate-control/1.0 contact=repository-audit'}
          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=45) as r:
                  return json.load(r)
          lookup='https://nominatim.openstreetmap.org/lookup?'+urllib.parse.urlencode({
              'osm_ids':'W377766486,W381749949,W315066295,W4334996',
              'format':'jsonv2','addressdetails':1,'extratags':1,'namedetails':1,
          })
          rows=get_json(lookup)
          (out/'osm-lookup.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
          expected={('way',377766486),('way',381749949),('way',315066295),('way',4334996)}
          found={(r.get('osm_type'),r.get('osm_id')) for r in rows}
          if found != expected:
              raise SystemExit(f'Unexpected OSM object set: {found}')
          queries={
              'elvestrekning_bla_brenneriveien':'Elvestrekning ved Blå (Brenneriveien), Oslo, Norway',
              'fossveien_elvestrekning':'Fossveien – elvestrekning, Oslo, Norway',
              'hausmannsomradet_elvelop':'Hausmannsområdet (elveløp), Oslo, Norway',
          }
          searches={}
          for key,q in queries.items():
              url='https://nominatim.openstreetmap.org/search?'+urllib.parse.urlencode({'q':q,'format':'jsonv2','limit':10,'addressdetails':1,'extratags':1,'namedetails':1})
              searches[key]=get_json(url)
              time.sleep(1.1)
          (out/'broad-segment-searches.json').write_text(json.dumps(searches,ensure_ascii=False,indent=2)+'\n')
          nonempty={k:len(v) for k,v in searches.items() if v}
          if nonempty:
              raise SystemExit(f'Broad segment exact-name searches changed; manual re-audit required: {nonempty}')
          docs={
              'vulkan_address_anchor':'Maridalsveien 17',
              'sources':[
                  'https://vulkanoslo.no/om-vulkan/',
                  'https://snl.no/Vulkan_-_omr%C3%A5de_i_Oslo',
                  'https://oslobyleksikon.no/side/Vulkan_%28omr%C3%A5de%29'
              ]
          }
          (out/'vulkan-documentation.json').write_text(json.dumps(docs,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'osm_objects':sorted([f'{t}:{i}' for t,i in found]),'broad_exact_name_hits':{k:len(v) for k,v in searches.items()}},ensure_ascii=False,indent=2))
          PY
      - name: Apply researched Batch 34 decisions safely
        run: node scripts/tmp-complete-oslo-coordinate-batch34.mjs
      - name: Build repository tools without npm install
        run: |
          rm -rf dist/tools
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),{stripTypeScriptTypes}=require('node:module');
          const src=path.resolve('tools'),out=path.resolve('dist/tools');
          function walk(d){return fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const f=path.join(d,e.name);return e.isDirectory()?walk(f):(/\.(mts|ts|cts)$/.test(e.name)?[f]:[])});}
          for(const f of walk(src)){const rel=path.relative(src,f),ext=path.extname(rel),oe=ext==='.mts'?'.mjs':ext==='.cts'?'.cjs':'.js',dest=path.join(out,rel.slice(0,-ext.length)+oe),s=fs.readFileSync(f,'utf8'),nl=s.indexOf('\n'),sh=s.startsWith('#!')?s.slice(0,nl+1):'',body=s.startsWith('#!')?s.slice(nl+1):s;fs.mkdirSync(path.dirname(dest),{recursive:true});fs.writeFileSync(dest,sh+stripTypeScriptTypes(body,{mode:'transform'}));}
          NODE
      - name: Rebuild global runtime index
        run: node dist/tools/build_places_index.mjs
      - name: Prove exact aggregate scope against merged main
        run: |
          node <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const file='data/places/natur/oslo/places_oslo_natur_akerselvarute.json';
          const before=JSON.parse(cp.execFileSync('git',['show',`origin/main:${file}`],{encoding:'utf8'}));
          const after=JSON.parse(fs.readFileSync(file,'utf8'));
          const b=new Map(before.map(p=>[p.id,p]));
          const changed=after.filter(p=>JSON.stringify(p)!==JSON.stringify(b.get(p.id))).map(p=>p.id);
          const expected=['vulkan_industriomrade','elvestrekning_bla_brenneriveien','fossveien_elvestrekning','hausmannsbrua','hausmannsomradet_elvelop','ankerbrua','nybrua_vaterlandsparken'];
          const bad=changed.filter(id=>!expected.includes(id));
          if(bad.length)throw new Error('Unexpected aggregate changes: '+bad.join(','));
          for(const id of expected)if(!changed.includes(id))throw new Error('Expected aggregate record unchanged: '+id);
          console.log(changed.join('\n'));
          NODE
      - name: Run all hard validation gates
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-34/validation
          mkdir -p "$out"
          node dist/tools/audit-places-split-manifest-sync.mjs | tee "$out/split-manifest-sync.txt"
          node dist/tools/check_no_lng_coordinates.mjs | tee "$out/places-index-check.txt"
          node dist/tools/check_places_index_sync.mjs | tee -a "$out/places-index-check.txt"
          node tests/place-coordinate-index-parity.test.js | tee -a "$out/places-index-check.txt"
          node tests/coordinate-source-contract-anchor-trust.test.mjs | tee "$out/coordinate-source-contract.txt"
          node dist/tools/place-coordinate-quality-gate.mjs | tee "$out/coordinate-quality.txt"
          node dist/tools/place-coordinate-intake-gate.mjs --strict-new | tee "$out/coordinate-intake.txt"
          node dist/tools/audit-coordinate-evidence.mjs | tee "$out/coordinate-evidence-audit.txt"
          git diff --check | tee "$out/git-diff-check.txt"
      - name: Assert Batch 34 decisions and protocol
        run: node scripts/tmp-assert-oslo-coordinate-batch34.mjs
      - name: Render old/new map QA for moved markers
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-34/visual-qa
          mkdir -p "$out"
          python3 - <<'PY'
          import json, html
          from pathlib import Path
          root=Path('reports/oslo-coordinate-control-batch-34')
          qa=root/'visual-qa'
          data=json.loads((root/'applied-summary.json').read_text())['moves']
          ids=['vulkan_industriomrade','hausmannsbrua','ankerbrua']
          labels={'vulkan_industriomrade':'Vulkan industriområde','hausmannsbrua':'Hausmannsbrua','ankerbrua':'Ankerbrua'}
          rows=[]
          for id in ids:
              move=data[id]
              for phase,coords in [('gammel',move['from']),('ny',move['to'])]:
                  rows.append((labels[id],phase,coords[0],coords[1]))
          height=1500
          cells=[]; script=[]
          for i,(label,phase,lat,lon) in enumerate(rows):
              mid=f'm{i}'
              cells.append(f'<div class="p"><div class="l">{html.escape(label)} – {phase}<span class="s">{lat}, {lon}</span></div><div id="{mid}" class="m"></div></div>')
              script.append(f"mk('{mid}',{lat},{lon});")
          doc=f'''<!doctype html><html><head><meta charset="utf-8"><style>html,body{{margin:0;width:1600px;height:{height}px;font-family:Arial}}.grid{{display:grid;grid-template-columns:1fr 1fr;width:1600px;height:{height}px}}.p{{position:relative;height:500px}}.m{{width:800px;height:500px}}.l{{position:absolute;z-index:9999;top:12px;left:12px;background:#fff;padding:9px 12px;border:3px solid #111;font-size:19px;font-weight:700}}.s{{display:block;font-size:13px;font-weight:400;margin-top:3px}}.mk{{width:26px;height:26px;border-radius:50%;background:#fff;border:7px solid #111;box-sizing:border-box}}</style><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script></head><body><div class="grid">{''.join(cells)}</div><script>const I=L.divIcon({{className:'',html:'<div class="mk"></div>',iconSize:[26,26],iconAnchor:[13,13]}});function mk(id,lat,lon){{const m=L.map(id,{{zoomControl:false,attributionControl:false}}).setView([lat,lon],17);L.tileLayer('https://tile.openstreetmap.org/{{z}}/{{x}}/{{y}}.png',{{maxZoom:19}}).addTo(m);L.marker([lat,lon],{{icon:I}}).addTo(m);}}{''.join(script)}</script></body></html>'''
          (qa/'batch34-old-new.html').write_text(doc)
          (qa/'README.md').write_text('# Batch 34 visual map QA\n\nOld/new comparisons for Vulkan industriområde, Hausmannsbrua and Ankerbrua.\n')
          PY
          (cd "$out" && python3 -m http.server 8768 >/tmp/b34-http.log 2>&1 & echo $! >/tmp/b34-http.pid)
          sleep 2
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1600,1500 --virtual-time-budget=9000 --screenshot="$PWD/$out/batch34-old-new.png" http://127.0.0.1:8768/batch34-old-new.html
          kill "$(cat /tmp/b34-http.pid)" 2>/dev/null || true
          rm "$out/batch34-old-new.html"
          test -s "$out/batch34-old-new.png"
      - uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch-34-visual-qa
          path: reports/oslo-coordinate-control-batch-34/visual-qa/batch34-old-new.png
          if-no-files-found: error
      - name: Commit clean completed batch
        run: |
          rm -f .github/workflows/oslo-coordinate-batch-34-final.yml scripts/tmp-complete-oslo-coordinate-batch34.mjs scripts/tmp-assert-oslo-coordinate-batch34.mjs
          git add data docs reports .github/workflows/oslo-coordinate-batch-34-final.yml scripts/tmp-complete-oslo-coordinate-batch34.mjs scripts/tmp-assert-oslo-coordinate-batch34.mjs
          git commit -m 'Complete Oslo coordinate control batch 34'
          git push origin HEAD:refs/heads/agent/oslo-coordinate-control-batch-34-final
