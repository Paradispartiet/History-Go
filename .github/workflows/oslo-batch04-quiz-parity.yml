name: Oslo batch04 quiz and QuizCard parity
on:
  push:
    branches:
      - content/vinmonopolet-lager-fagverk-v1-20261027
  pull_request:
    paths:
      - '.github/workflows/oslo-batch04-quiz-parity.yml'
      - 'tests/oslo-batch04-v1-quiz-parity.test.mjs'
      - 'tests/vinmonopolet-lager-v1-parity.test.mjs'
      - 'tests/oslo-batch04-v1-real-browser.mjs'
      - 'scripts/verify-place-quiz-browser.mjs'
      - 'data/quiz/**'
      - 'data/quizcards/**'
      - 'reports/place-production/oslo-batch04-v1-quiz-readiness-20261022.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oslo-batch04-quiz-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:

  vinmonopolet-regenerate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/content/vinmonopolet-lager-fagverk-v1-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Restore place index and generated epoch and Place-open data
        run: |
          set -euo pipefail
          npm run places:index:build
          npm run epoker:places:build
          node scripts/build-place-open-payloads.mjs
      - name: Regenerate Knowledge contract and link QuizCard to canonical quiz
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --write
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const qPath='data/quiz/naeringsliv/vinmonopolet_lager_sets_merged.json';
          const cPath='data/quizcards/naeringsliv/vinmonopolet_lager_quizkort_v1.json';
          const q=JSON.parse(fs.readFileSync(qPath,'utf8'));
          const c=JSON.parse(fs.readFileSync(cPath,'utf8'));
          const byId=new Map(q.sets.flatMap(s=>s.questions).map(row=>[row.id,row]));
          for(const entry of c.cards.flatMap(row=>row.questions)){
            const source=byId.get(entry.sourceQuestionId);
            if(!source)throw new Error('missing canonical quiz: '+entry.sourceQuestionId);
            for(const k of ['question','options','answer','answerIndex','knowledge','primary_knowledge_unit_id','knowledge_unit_ids','concept_ids','term_ids','knowledge_link_status','knowledge_contract_version']){
              entry[k]=source[k];
            }
          }
          fs.writeFileSync(cPath,JSON.stringify(c,null,2)+'\n');
          NODE
      - name: Rebuild 4.2 description packet and Fagverk release
        run: |
          set -euo pipefail
          node scripts/build-vinmonopolet-lager-description-packet.mjs
          node scripts/build-fagverk-release-manifest.mjs
          node --test tests/vinmonopolet-lager-v1-parity.test.mjs
      - name: Commit only regenerated tracked production outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u data/ reports/
          git add data/places/production/vinmonopolet_lager.json
          git diff --cached --stat | tail -45
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Vinmonopolet index, Knowledge, epoch, Place-open, Fagverk and 4.2 packet"
            git push origin HEAD:content/vinmonopolet-lager-fagverk-v1-20261027
          fi
  quiz-parity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Verify 17 canonical fullquizzes and 170 linked QuizCard questions
        run: node --test tests/oslo-batch04-v1-quiz-parity.test.mjs
      - name: Vinmonopolet Hasle 30-question and 10-QuizCard parity
        run: node --test tests/vinmonopolet-lager-v1-parity.test.mjs
  real-browser:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Real Chromium PlaceCards, portraits, QuizCard, Fagverk, fullquiz
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node tests/oslo-batch04-v1-real-browser.mjs ${{ matrix.shard }}
      - name: Vinmonopolet Hasle fullquiz - desktop 1440 and mobile 390
        if: ${{ matrix.shard == 0 }}
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node scripts/verify-place-quiz-browser.mjs vinmonopolet_lager
      - name: Upload native-app acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oslo-batch04-native-chromium-shard-${{ matrix.shard }}
          path: |
            artifacts/oslo-batch04-v1-browser/shard-${{ matrix.shard }}/**
            artifacts/place-quiz/**
          if-no-files-found: ignore
          retention-days: 14
