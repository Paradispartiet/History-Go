name: Oslo batch04 quiz and QuizCard parity
on:
  pull_request:
    paths:
      - '.github/workflows/oslo-batch04-quiz-parity.yml'
      - 'tests/oslo-batch04-v1-quiz-parity.test.mjs'
      - 'data/quiz/**'
      - 'data/quizcards/**'
      - 'reports/place-production/oslo-batch04-v1-quiz-readiness-20261022.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oslo-batch04-quiz-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quiz-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Verify 17 canonical fullquizzes and 170 linked QuizCard questions
        run: node --test tests/oslo-batch04-v1-quiz-parity.test.mjs
