name: Lillebekk review derived indexes (one-shot)
on:
  push:
    branches:
      - civication/lillebekk-review-checklist-20261105
    paths:
      - .github/workflows/civication-lillebekk-review-indexes-once.yml
permissions:
  contents: write
jobs:
  update-derived:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rebuild derived career and Role World indexes
        run: |
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
          node scripts/build-civication-scene-registry.mjs --check
          node tests/civication-lillebekk-saksoversikt-inbox.test.js
      - name: Commit exact derived data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/careerGameplayMatrix.json data/Civication/roleWorldRolloutReadiness.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync career and role readiness with Lillebekk inbox acceptance test"
            git push origin HEAD:civication/lillebekk-review-checklist-20261105
          fi
