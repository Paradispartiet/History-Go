name: Finish coordinate documentation review cleanly

on:
  pull_request:

permissions:
  contents: write

jobs:
  finish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Add evidence audit to tools check
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path("package.json")
          text = path.read_text(encoding="utf-8")
          package = json.loads(text)
          tools_check = package["scripts"]["tools:check"]
          if "npm run places:coords:evidence:audit" in tools_check:
              raise SystemExit("Evidence audit already exists in tools:check")
          old = "node tests/coordinate-source-contract-anchor-trust.test.mjs && npm run audit:places-split-manifest-sync"
          new = "node tests/coordinate-source-contract-anchor-trust.test.mjs && npm run places:coords:evidence:audit && npm run audit:places-split-manifest-sync"
          if text.count(old) != 1:
              raise SystemExit(f"Expected one tools:check anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate targeted coordinate gates
        run: |
          npm ci --ignore-scripts
          npm run test:coordinate-source-contract
          npm run places:coords:evidence:audit

      - name: Remove temporary runners and commit
        run: |
          git rm .github/workflows/temporary-coordinate-documentation-repair-runner.yml
          git rm .github/workflows/tmp-finish-coordinate-review-cleanly.yml
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/temporary-coordinate-documentation-repair-runner.yml .github/workflows/tmp-finish-coordinate-review-cleanly.yml package.json "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Finish coordinate documentation review fixes"
          git push origin HEAD:${{ github.head_ref }}
