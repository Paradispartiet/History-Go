name: TEMP Helsfyr exact-head gate repair

on:
  push:
    branches:
      - work/helsfyr-completion-20260904

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: work/helsfyr-completion-20260904
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply minimal source and contract fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one literal match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          builder_path = Path("tools/build-helsfyr-completion.mjs")
          builder = builder_path.read_text(encoding="utf-8")

          anchor = '  lokalwikiBruskeland: "https://lokalhistoriewiki.no/wiki/Guttorm_Bruskeland",\n'
          if builder.count(anchor) != 1:
              raise SystemExit("builder: lokalwikiBruskeland anchor mismatch")
          builder = builder.replace(
              anchor,
              anchor
              + '  lokalwikiHelsfyr: "https://lokalhistoriewiki.no/wiki/Helsfyr_%28str%C3%B8k%29",\n'
              + '  scandicHelsfyrHistory: "https://stories.scandichotels.no/scandic-helsfyr/",\n',
              1,
          )

          pattern = re.compile(r'(id: "lesespor_helsfyr_torp"[^\n]*source_quality: )"professional_press"')
          builder, n = pattern.subn(r'\1"recognized"', builder, count=1)
          if n != 1:
              raise SystemExit(f"builder: expected one Helsfyr Torp source_quality replacement, found {n}")

          old_strong = '  const strong = /viktig|grunnleggende|særlig|derfor|samtidig|ikke bare|mindre av|karakteristiske/iu.test(sentenceText);'
          new_strong = '  const strong = /viktig|grunnleggende|særlig|derfor|dermed|første|samtidig|ikke bare|mindre av|karakteristiske/iu.test(sentenceText);'
          if builder.count(old_strong) != 1:
              raise SystemExit("builder: strong-claim classifier anchor mismatch")
          builder = builder.replace(old_strong, new_strong, 1)

          old_independent = '  if (strong) claim.independentSourceUrls = [torp ? urls.arkitekturTorp : urls.sporveien];'
          new_independent = '''  if (strong) {
    if (/Det første Hotell Helsfyr/iu.test(sentenceText)) {
      claim.independentSourceUrls = [urls.lokalwikiHelsfyr, urls.scandicHelsfyrHistory];
    } else if (/Helsfyr består dermed/iu.test(sentenceText)) {
      claim.independentSourceUrls = [urls.sporveien, urls.arkitekturTorp, urls.scandicHelsfyrHistory];
    } else {
      claim.independentSourceUrls = [torp ? urls.arkitekturTorp : urls.sporveien];
    }
  }'''
          if builder.count(old_independent) != 1:
              raise SystemExit("builder: independent-source anchor mismatch")
          builder = builder.replace(old_independent, new_independent, 1)

          old_questions = 'questions: sets.slice(0, 2).flatMap(set => set.questions).slice(0, 8).map(q => ({ question: q.question, answer: q.answer, type: q.question_type, normalKnowledgeQuestion: true, claimIds: [q.claim_id] }))'
          new_questions = '''questions: [
    [0, "hva", "claim_helsfyr_text_04"],
    [1, "når", "claim_helsfyr_text_01"],
    [3, "hva_skjedde", "claim_helsfyr_text_06"],
    [4, "hva", "claim_helsfyr_text_07"],
    [5, "hva_ble_bygget_produsert_eller_endret", "claim_helsfyr_text_14"],
    [6, "når", "claim_helsfyr_text_19"],
    [7, "hvem", "claim_helsfyr_text_15"],
    [8, "når", "claim_helsfyr_text_10"]
  ].map(([questionIndex, type, claimId]) => {
    const q = sets.flatMap(set => set.questions)[questionIndex];
    return { question: q.question, answer: q.answer, type, normalKnowledgeQuestion: true, claimIds: [claimId] };
  })'''
          if builder.count(old_questions) != 1:
              raise SystemExit("builder: quizReadiness adapter anchor mismatch")
          builder = builder.replace(old_questions, new_questions, 1)
          builder_path.write_text(builder, encoding="utf-8")

          lesespor_path = Path("data/lesespor/oslo/lesespor_oslo_by.json")
          lesespor = lesespor_path.read_text(encoding="utf-8")
          lesespor_pattern = re.compile(r'("id": "lesespor_helsfyr_torp"[\s\S]*?"source_quality": )"professional_press"')
          lesespor, n = lesespor_pattern.subn(r'\1"recognized"', lesespor, count=1)
          if n != 1:
              raise SystemExit(f"lesespor: expected one Helsfyr Torp replacement, found {n}")
          lesespor_path.write_text(lesespor, encoding="utf-8")

          production_path = Path("data/places/production/helsfyr.json")
          production = json.loads(production_path.read_text(encoding="utf-8"))
          claims = {claim["id"]: claim for claim in production["claims"]}
          sporveien = "https://www.sporveien.no/vare-tjenester/t-banen/t-banestasjoner/f/helsfyr/"
          arkitektur = "https://www.arkitektur.no/aktuelt/arkitektur/han-hadde-et-bankende-arkitekthjerte/"
          lokalwiki_helsfyr = "https://lokalhistoriewiki.no/wiki/Helsfyr_%28str%C3%B8k%29"
          scandic_helsfyr = "https://stories.scandichotels.no/scandic-helsfyr/"
          strong_sources = {
              "claim_helsfyr_text_08": [sporveien],
              "claim_helsfyr_text_19": [lokalwiki_helsfyr, scandic_helsfyr],
              "claim_helsfyr_text_21": [sporveien, arkitektur, scandic_helsfyr],
          }
          for claim_id, urls in strong_sources.items():
              claim = claims.get(claim_id)
              if claim is None:
                  raise SystemExit(f"production: missing expected claim {claim_id}")
              claim["claimKind"] = "strong"
              claim["evidenceMode"] = "explicit"
              claim["independentSourceUrls"] = urls

          quiz = json.loads(Path("data/quiz/by/helsfyr_sets.json").read_text(encoding="utf-8"))
          flat_questions = [q for quiz_set in quiz["sets"] for q in quiz_set["questions"]]
          readiness_map = [
              (0, "hva", "claim_helsfyr_text_04"),
              (1, "når", "claim_helsfyr_text_01"),
              (3, "hva_skjedde", "claim_helsfyr_text_06"),
              (4, "hva", "claim_helsfyr_text_07"),
              (5, "hva_ble_bygget_produsert_eller_endret", "claim_helsfyr_text_14"),
              (6, "når", "claim_helsfyr_text_19"),
              (7, "hvem", "claim_helsfyr_text_15"),
              (8, "når", "claim_helsfyr_text_10"),
          ]
          production["quizReadiness"]["questions"] = [
              {
                  "question": flat_questions[index]["question"],
                  "answer": flat_questions[index]["answer"],
                  "type": question_type,
                  "normalKnowledgeQuestion": True,
                  "claimIds": [claim_id],
              }
              for index, question_type, claim_id in readiness_map
          ]
          production_path.write_text(json.dumps(production, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          test_path = Path("tests/epoke-place-index.test.mjs")
          test_text = test_path.read_text(encoding="utf-8")
          old_count = 'assert.equal(index.stats.verified_place_production_milestone_count, 425);'
          new_count = 'assert.equal(index.stats.verified_place_production_milestone_count, 434);'
          if test_text.count(old_count) != 1:
              raise SystemExit("epoch test: expected stale 425 assertion exactly once")
          test_path.write_text(test_text.replace(old_count, new_count, 1), encoding="utf-8")
          PY

      - name: Regenerate Civication History People index
        run: npm run civication:history-people:build

      - name: Verify Lesespor contract
        run: |
          npm run build:tools
          node dist/tools/validate_lesespor.mjs

      - name: Verify Civication People sync
        run: npm run civication:history-people:check

      - name: Verify Place description governance
        run: node scripts/validate-place-description-production-v4_2_policy.mjs --all --report /tmp/place-description-validation-v4_2.json

      - name: Verify epoch index and viewer contracts
        run: |
          npm run epoker:places:check
          npm run typecheck:web
          node --test \
            tests/epoke-place-index.test.mjs \
            tests/epoker-runtime-place-index.test.mjs \
            tests/epoke-viewer.test.mjs \
            tests/fagverk-history-period-deeplink.test.mjs \
            tests/place-card-meta-surfaces.test.mjs

      - name: Syntax-check Helsfyr materializer
        run: node --check tools/build-helsfyr-completion.mjs

      - name: Commit proven repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-helsfyr-exact-head-repair.yml
          git add \
            tools/build-helsfyr-completion.mjs \
            data/lesespor/oslo/lesespor_oslo_by.json \
            data/places/production/helsfyr.json \
            tests/epoke-place-index.test.mjs \
            data/Civication/historyPeople_index.json
          git diff --cached --check
          git status --short
          git commit -m "Fix Helsfyr exact-head governance gates"
          git push origin HEAD:work/helsfyr-completion-20260904
