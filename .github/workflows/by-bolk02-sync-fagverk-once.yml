name: By-bolk 02 synchronize Fagverk release once
on:
  push:
    branches:
      - feature/by-bolk02-20-v1-20261025
    paths:
      - '.github/workflows/by-bolk02-sync-fagverk-once.yml'
permissions:
  contents: write
concurrency:
  group: by-bolk02-fagverk-once
  cancel-in-progress: false
jobs:
  update-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/by-bolk02-20-v1-20261025
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate Fagverk release using the canonical generator
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit only release and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/by-bolk02-sync-fagverk-once.yml
          git add data/fagverk/fagverk_release.json
          git add -u .github/workflows/by-bolk02-sync-fagverk-once.yml
          if git diff --cached --quiet; then
            echo "No generated differences"
            exit 0
          fi
          git commit -m "chore(by): regenerate Fagverk 3.17.5 release and remove one-shot generator"
          git pull --rebase origin feature/by-bolk02-20-v1-20261025
          git push origin HEAD:feature/by-bolk02-20-v1-20261025
