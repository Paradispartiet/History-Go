name: Temporary Regjeringskvartalet sources production

on:
  push:
    branches:
      - production/regjeringskvartalet-phase-7-sources

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/regjeringskvartalet-phase-7-sources
          fetch-depth: 0

      - name: Produce phase 7
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          place_path = Path('data/places/politikk/oslo/places_politikk/regjeringskvartalet.json')
          place = json.loads(place_path.read_text(encoding='utf-8'))
          place['source_summary'] = {
              'safe_sources': [
                  'Regjeringen.no: stedets hovedside, bygningshistorie og åpningen i 2026',
                  'Meld. St. 21 og vedtaket av statlig reguleringsplan: politiske valg og planramme',
                  'Statsbygg: byggetrinn, rehabilitering, kostnadsrammer og gjennomføringsstatus',
                  'KORO: historisk og ny offentlig kunst i Regjeringskvartalet',
                  'Regjeringen og 22. juli-senteret: terrorhistorie, minnested og permanent læringssenter',
                  'Store norske leksikon: uavhengig oversikt over stedets historie og bygninger',
                  'Wikimedia Commons og Creative Commons: proveniens og lisens for Før/etter-bildene'
              ],
              'hold_back_sources': [
                  'Interne produksjonsrapporter, audits, quizkontekst og coordinate-evidens vises ikke som brukerrettede kilder.',
                  'Rå WFS-/geometridata beholdes som teknisk koordinatproveniens og vises ikke som lesekilde i Kilder-fanen.',
                  'Planmål, kostnadsrammer og prosjektbeskrivelser behandles ikke som dokumentasjon på langsiktig effekt.'
              ]
          }
          place['externalLinks'] = [
              {
                  'type': 'official',
                  'label': 'Regjeringen.no – Regjeringskvartalet',
                  'url': 'https://www.regjeringen.no/no/tema/plan-bygg-og-eiendom/regjeringskvartalet/id669703/',
                  'lang': 'nb',
                  'verifiedAt': '2026-08-02'
              },
              {
                  'type': 'official_history',
                  'label': 'Regjeringen.no – kunst, arkitektur og bygninger',
                  'url': 'https://www.regjeringen.no/no/tema/plan-bygg-og-eiendom/regjeringskvartalet/bygninger/id712727/',
                  'lang': 'nb',
                  'verifiedAt': '2026-08-02'
              },
              {
                  'type': 'policy',
                  'label': 'Regjeringen.no – Meld. St. 21 (2018–2019) Nytt regjeringskvartal',
                  'url': 'https://www.regjeringen.no/no/dokumenter/meld.-st.-21-20182019/id2641647/',
                  'lang': 'nb',
                  'verifiedAt': '2026-08-02'
              },
              {
                  'type': 'policy',
                  'label': 'Regjeringen.no – vedtak av statlig reguleringsplan',
                  'url': 'https://www.regjeringen.no/no/dokumenter/vedtak-av-statlig-reguleringsplan-for-nytt-regjeringskvartal/id2538263/',
                  'lang': 'nb',
                  'verifiedAt': '2026-08-02'
              },
              {
                  'type': 'official_project',
                  'label': 'Regjeringen.no – byggeprosjektet og byggetrinnene',
                  'url': 'https://www.regjeringen.no/no/tema/plan-bygg-og-eiendom/regjeringskvartalet/nytt-RKV/id712726/',
                  'lang': 'nb',
                  'verifiedAt': '2026-08-02'
              },
              {
                  'type': 'official_project',
                  'label': 'Statsbygg – Nytt regjeringskvartal',
                  'url': 'https://www.statsbygg.no/byggeprosjekter/nytt-regjeringskvartal/',
                  'lang': 'nb',
                  'verifiedAt': '2026-08-02'
              },
              {
                  'type': 'official',
                  'label': 'Regjeringen.no – offisiell åpning 13. april 2026',
                  'url': 'https://www.regjeringen.no/no/aktuelt/det-nye-regjeringskvartalet-offisielt-apnet/id3155987/',
                  'lang': 'nb',
                  'verifiedAt': '2026-08-02'
              },
              {
                  'type': 'art_and_architecture',
                  'label': 'KORO – Kunsten i nytt regjeringskvartal',
                  'url': 'https://koro.no/kunsten-i-nytt-regjeringskvartal/',
                  'lang': 'nb',
                  'verifiedAt': '2026-08-02'
              },
              {
                  'type': 'memory',
                  'label': 'Regjeringen.no – åpning av nasjonalt minnested',
                  'url': 'https://www.regjeringen.no/no/aktuelt/apning-av-nasjonalt-minnested/id3168433/',
                  'lang': 'nb',
                  'verifiedAt': '2026-08-02'
              },
              {
                  'type': 'memory',
                  'label': 'Regjeringen.no – minnemarkering og åpning av 22. juli-senteret',
                  'url': 'https://www.regjeringen.no/no/aktuelt/statsministerens-tale-ved-minnemarkeringen-i-regjeringskvartalet/id3169237/',
                  'lang': 'nb',
                  'verifiedAt': '2026-08-02'
              },
              {
                  'type': 'learning',
                  'label': '22. juli-senteret – Om Regjeringskvartalet',
                  'url': 'https://www.22julisenteret.no/no/fordyp-deg/fagartikler/om-regjeringskvartalet',
                  'lang': 'nb',
                  'verifiedAt': '2026-08-02'
              },
              {
                  'type': 'reference',
                  'label': 'Store norske leksikon – Regjeringskvartalet',
                  'url': 'https://snl.no/Regjeringskvartalet',
                  'lang': 'nb',
                  'verifiedAt': '2026-08-02'
              },
              {
                  'type': 'image_archive',
                  'label': 'Wikimedia Commons – Johan Nygaardsvolds plass i 2008',
                  'url': 'https://commons.wikimedia.org/wiki/File:Regjeringskvartalet_H-blokk_Johan_Nygaardsvolds_plass_Oslo_Norway_(2008.07.01).jpg',
                  'lang': 'nb',
                  'verifiedAt': '2026-08-02'
              },
              {
                  'type': 'image_archive',
                  'label': 'Wikimedia Commons – åpningen 13. april 2026',
                  'url': 'https://commons.wikimedia.org/wiki/File:Official_opening_Regjeringskvartalet_April_13th_2026.jpg',
                  'lang': 'nb',
                  'verifiedAt': '2026-08-02'
              },
              {
                  'type': 'license',
                  'label': 'Creative Commons – CC BY-SA 4.0-lisens',
                  'url': 'https://creativecommons.org/licenses/by-sa/4.0/',
                  'lang': 'nb',
                  'verifiedAt': '2026-08-02'
              }
          ]
          place_bytes = (json.dumps(place, ensure_ascii=False, separators=(',', ':')) + '\n').encode('utf-8')
          place_path.write_bytes(place_bytes)
          place_sha = hashlib.sha256(place_bytes).hexdigest()
          place_size = len(place_bytes)

          context_path = Path('data/quiz/production_context/politikk/regjeringskvartalet.json')
          context = json.loads(context_path.read_text(encoding='utf-8'))
          target = context['source_files']['target']
          target['bytes'] = place_size
          target['sha256'] = place_sha
          context_path.write_text(json.dumps(context, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          before_path = Path('tests/regjeringskvartalet-before-after-phase.test.mjs')
          before = before_path.read_text(encoding='utf-8')
          before = re.sub(r"assert\.equal\(target\.bytes, \d+\);", f"assert.equal(target.bytes, {place_size});", before, count=1)
          before = re.sub(r"assert\.equal\(target\.sha256, '[0-9a-f]{64}'\);", f"assert.equal(target.sha256, '{place_sha}');", before, count=1)
          before = before.replace(
              "assert.match(report, /\\| 6 \\| Lesespor \\| \\*\\*KLAR FOR REVIEW\\*\\* \\|/);",
              "assert.match(report, /\\| 7 \\| Brukerrettede Kilder \\| \\*\\*KLAR FOR REVIEW\\*\\* \\|/);"
          )
          before_path.write_text(before, encoding='utf-8')

          news_path = Path('tests/regjeringskvartalet-news-phase.test.mjs')
          news = news_path.read_text(encoding='utf-8').replace(
              "assert.match(report, /\\| 6 \\| Lesespor \\| \\*\\*KLAR FOR REVIEW\\*\\* \\|/);",
              "assert.match(report, /\\| 7 \\| Brukerrettede Kilder \\| \\*\\*KLAR FOR REVIEW\\*\\* \\|/);"
          )
          news_path.write_text(news, encoding='utf-8')

          reading_path = Path('tests/regjeringskvartalet-reading-phase.test.mjs')
          reading = reading_path.read_text(encoding='utf-8')
          reading = reading.replace(
              "assert.match(report, /\\| 6 \\| Lesespor \\| \\*\\*KLAR FOR REVIEW\\*\\* \\|/);",
              "assert.match(report, /\\| 6 \\| Lesespor \\| \\*\\*GODKJENT – PR #4669, merge `c68881578a5a56c6ae9b610f7c5132fc448297c3`\\*\\* \\|/);"
          ).replace(
              "assert.match(report, /\\| 7 \\| Brukerrettede Kilder \\| \\*\\*NESTE AKTIVE FASE ETTER MERGE AV FASE 6\\*\\* \\|/);",
              "assert.match(report, /\\| 7 \\| Brukerrettede Kilder \\| \\*\\*KLAR FOR REVIEW\\*\\* \\|/);"
          )
          reading_path.write_text(reading, encoding='utf-8')

          report_path = Path('reports/place-production/regjeringskvartalet-politikk-v1.md')
          report = report_path.read_text(encoding='utf-8')
          replacements = {
              '- Status: **fase 6 – fire godkjente Lesespor klare for review; stedet er ikke samlet produksjonsklart**': '- Status: **fase 7 – deduplisert brukerrettet Kilder-flate klar for review; stedet er ikke samlet produksjonsklart**',
              '| Brukerrettede kilder | Place og Leksikon har flere offisielle lenker, men ingen separat, deduplisert og fasegodkjent Kilder-flate med grupper, navn, kildebruk og avgrensninger er dokumentert. |': '| Brukerrettede kilder | Sju kuraterte kildegrupper og femten unike, navngitte HTTPS-lenker dekker historie, plan, bygg, åpning, kunst, minne, læring, referanse og bildeproveniens. |',
              '| Kilder | DELVIS / IKKE GODKJENT | Kilder finnes i place-, rapport-, Story- og Leksikon-data, men den brukerrettede flaten er ikke separat kuratert, deduplisert og fasegodkjent. |': '| Kilder | PASS – fase 7 | Canonical place-record har sju trygge kildegrupper, femten unike lenker og eksplisitte hold-back-regler for interne og tekniske kilder. |',
              '- Kilder som deduplisert og brukerrettet flate;\n': '',
              '- fire godkjente Lesespor med ærlige datoer, åpne lenker og `link_only`-rettigheter.': '- fire godkjente Lesespor med ærlige datoer, åpne lenker og `link_only`-rettigheter;\n- sju brukerrettede kildegrupper og femten unike, verifiserte HTTPS-lenker.',
              '| 6 | Lesespor | **KLAR FOR REVIEW** |': '| 6 | Lesespor | **GODKJENT – PR #4669, merge `c68881578a5a56c6ae9b610f7c5132fc448297c3`** |',
              '| 7 | Brukerrettede Kilder | **NESTE AKTIVE FASE ETTER MERGE AV FASE 6** |': '| 7 | Brukerrettede Kilder | **KLAR FOR REVIEW** |',
              '| 8 | Mer | IKKE STARTET |': '| 8 | Mer | **NESTE AKTIVE FASE ETTER MERGE AV FASE 7** |'
          }
          for old, new in replacements.items():
              if old not in report:
                  raise SystemExit(f'Mangler forventet rapporttekst: {old}')
              report = report.replace(old, new, 1)
          marker = '## Neste aktive fase\n'
          report = report.split(marker, 1)[0].rstrip() + '''

## Resultat i fase 7

- Canonical place-record har fått `source_summary` med sju korte, brukerrettede kildegrupper og tre eksplisitte hold-back-regler.
- `externalLinks` er kuratert til femten unike, navngitte HTTPS-lenker, alle med språk og kontrolltidspunkt 2026-08-02.
- Kildene dekker stedets identitet og historie, Meld. St. 21 og reguleringsvedtaket, byggeprosjekt og byggetrinn, åpningen i april 2026, offentlig kunst, minnested og 22. juli-senter, uavhengig oppslagsverk samt Før/etter-bildenes proveniens og lisens.
- Den rå WFS-lenken er tatt ut av brukerflaten. Teknisk geometriproveniens er fortsatt bevart i `coordSourceUrl` og koordinatmetadata.
- Lesespor og Kilder kan dele enkelte autoritative endepunkter, men har ulik funksjon: Lesespor anbefaler fire fordypningsressurser; Kilder viser femten navngitte belegg for konkrete faktalag.
- Interne rapporter, audits, quizkontekst, coordinate-evidens og effektpåstander er eksplisitt holdt utenfor brukerflaten.
- Den deterministiske quizkonteksten er synkronisert bare med ny byte-/SHA-verdi for canonical place-filen. Quizsett, spørsmål, fagvalg og Knowledge er uendret.
- Eksisterende runtime dedupliserer lenker, løfter Før/etter-kilder og lisens til navngitte lenker og hindrer dobbel visning av kildeprofilen.

## Neste aktive fase

Etter at fase 7 er merget og kontrollert på faktisk `main`, starter **fase 8: Mer**.

Fasen skal:

1. auditere hvilke Mer-komponenter som allerede finnes i de fire tematiske Leksikon-artiklene og hvilke som mangler;
2. bygge et avgrenset Språkleksikon for stedets egne ord og institusjonsbegreper, ikke en generell statsvitenskapelig ordliste;
3. produsere observasjon, betydning og motpunkt med synlig skille mellom fysisk spor, tolkning og dokumentert fakta;
4. begrunne N/A der en Mer-komponent ikke har egenverdi utover Om, Historie, Stories, Nyheter, Lesespor eller Kilder;
5. endre bare Leksikon-/Språkleksikon-data, fasekort, nødvendig runtime og målrettede regresjoner.

## Samlet status etter fase 7

Regjeringskvartalet har et sterkt faglig grunnlag, men er **ikke produksjonsklart etter den canonicale sted-for-sted-checklista**. Alle åtte popupfaner bortsett fra Mer er nå produsert eller reviewet. Quiz/Knowledge og People er også ferdige. Mer, Objects, Brands og sluttkontroll av Badges, fagverk og faktisk UI står fortsatt åpne.
'''
          report_path.write_text(report, encoding='utf-8')

          source_test = Path('tests/regjeringskvartalet-sources-phase.test.mjs')
          source_test.write_text(f"""import assert from 'node:assert/strict';
import {{ createHash }} from 'node:crypto';
import fs from 'node:fs';
import test from 'node:test';

const readJson = path => JSON.parse(fs.readFileSync(path, 'utf8'));
const placePath = 'data/places/politikk/oslo/places_politikk/regjeringskvartalet.json';
const placeBuffer = fs.readFileSync(placePath);
const place = JSON.parse(placeBuffer.toString('utf8'));
const context = readJson('data/quiz/production_context/politikk/regjeringskvartalet.json');
const reading = readJson('data/lesespor/oslo/lesespor_oslo_politikk.json');
const runtime = fs.readFileSync('js/ui/place-popup-tabs.js', 'utf8');
const report = fs.readFileSync('reports/place-production/regjeringskvartalet-politikk-v1.md', 'utf8');

test('Regjeringskvartalet har en kuratert og verifisert brukerrettet kildeflate', () => {{
  assert.equal(place.source_summary.safe_sources.length, 7);
  assert.equal(place.source_summary.hold_back_sources.length, 3);
  assert.equal(place.externalLinks.length, 15);
  assert.equal(new Set(place.externalLinks.map(link => link.url)).size, 15);
  assert.ok(place.externalLinks.every(link => link.label.length >= 20));
  assert.ok(place.externalLinks.every(link => link.url.startsWith('https://')));
  assert.ok(place.externalLinks.every(link => link.lang === 'nb'));
  assert.ok(place.externalLinks.every(link => link.verifiedAt === '2026-08-02'));
}});

test('Kildene dekker historie, policy, prosjekt, kunst, minne, læring, referanse og bilder', () => {{
  const types = new Set(place.externalLinks.map(link => link.type));
  for (const type of ['official', 'official_history', 'policy', 'official_project', 'art_and_architecture', 'memory', 'learning', 'reference', 'image_archive', 'license']) {{
    assert.ok(types.has(type), `mangler kildetype ${{type}}`);
  }}
}});

test('Tekniske og interne kilder holdes ute av brukerflaten', () => {{
  const safe = place.source_summary.safe_sources.join(' ').toLowerCase();
  assert.doesNotMatch(safe, /audit|quizkontekst|coordinate-evidens|report\/place-production/);
  assert.ok(place.source_summary.hold_back_sources.some(note => /WFS/.test(note)));
  assert.ok(place.source_summary.hold_back_sources.some(note => /langsiktig effekt/.test(note)));
  assert.ok(place.externalLinks.every(link => !/cgi-bin\/wms|OUTPUTFORMAT=geojson/i.test(link.url)));
  assert.match(place.coordSourceUrl, /cgi-bin\/wms/);
}});

test('Kilder og Lesespor har ulikt omfang og ingen record-identitetskopiering', () => {{
  const readingRows = reading.items.filter(item => item.place_ids?.includes('regjeringskvartalet'));
  const readingUrls = new Set(readingRows.map(item => item.url));
  const overlap = place.externalLinks.filter(link => readingUrls.has(link.url));
  assert.equal(readingRows.length, 4);
  assert.ok(overlap.length <= 4);
  assert.ok(place.externalLinks.length - overlap.length >= 11);
  const readingIds = new Set(readingRows.map(item => item.id));
  assert.ok(place.externalLinks.every(link => !readingIds.has(link.id)));
}});

test('Renderer dedupliserer kildeprofil, navngitte lenker og Før/etter-kilder', () => {{
  assert.match(runtime, /includeProfileLabels \? uniqueBy\(strings\(sourceProfile\?\.safe_sources/);
  assert.match(runtime, /const beforeAfterLinks = \[/);
  assert.match(runtime, /uniqueBy\(\[\.\.\.configuredLinks, \.\.\.beforeAfterLinks\]/);
  assert.match(runtime, /hasExistingSourceProfile = Boolean/);
  assert.match(runtime, /target=\"_blank\" rel=\"noopener noreferrer\"/);
}});

test('Quizkonteksten er synkronisert uten å endre quizinnhold', () => {{
  const target = context.source_files.target;
  assert.equal(target.path, placePath);
  assert.equal(target.bytes, placeBuffer.byteLength);
  assert.equal(target.sha256, createHash('sha256').update(placeBuffer).digest('hex'));
  assert.equal(target.bytes, {place_size});
  assert.equal(target.sha256, '{place_sha}');
}});

test('Fasekortet lukker Lesespor, åpner Kilder og peker bare videre til Mer', () => {{
  assert.match(report, /\\| 6 \\| Lesespor \\| \\*\\*GODKJENT – PR #4669, merge `c68881578a5a56c6ae9b610f7c5132fc448297c3`\\*\\* \\|/);
  assert.match(report, /\\| Kilder \\| PASS – fase 7 \\|/);
  assert.match(report, /\\| 7 \\| Brukerrettede Kilder \\| \\*\\*KLAR FOR REVIEW\\*\\* \\|/);
  assert.match(report, /\\| 8 \\| Mer \\| \\*\\*NESTE AKTIVE FASE ETTER MERGE AV FASE 7\\*\\* \\|/);
  assert.match(report, /ikke produksjonsklart/);
}});
""", encoding='utf-8')

          workflow_path = Path('.github/workflows/place-rounds-governance.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          needle = '      - "tests/regjeringskvartalet-reading-phase.test.mjs"\n'
          if workflow.count(needle) != 2:
              raise SystemExit(f'Uventet antall path-ankre: {workflow.count(needle)}')
          workflow = workflow.replace(needle, needle + '      - "tests/regjeringskvartalet-sources-phase.test.mjs"\n')
          context_needle = '      - "data/places/politikk/oslo/places_politikk/regjeringskvartalet.json"\n'
          workflow = workflow.replace(context_needle, context_needle + '      - "data/quiz/production_context/politikk/regjeringskvartalet.json"\n')
          old_cmd = 'node --test tests/regjeringskvartalet-before-after-phase.test.mjs tests/regjeringskvartalet-news-phase.test.mjs tests/regjeringskvartalet-reading-phase.test.mjs'
          new_cmd = old_cmd + ' tests/regjeringskvartalet-sources-phase.test.mjs'
          if old_cmd not in workflow:
              raise SystemExit('Mangler Regjeringskvartalet-testkommando')
          workflow = workflow.replace(old_cmd, new_cmd, 1)
          workflow_path.write_text(workflow, encoding='utf-8')
          PY

      - name: Validate phase 7
        run: node --test tests/regjeringskvartalet-before-after-phase.test.mjs tests/regjeringskvartalet-news-phase.test.mjs tests/regjeringskvartalet-reading-phase.test.mjs tests/regjeringskvartalet-sources-phase.test.mjs

      - name: Remove temporary files
        run: |
          rm .github/workflows/_tmp-regjeringskvartalet-sources.yml
          rm .github/_tmp-trigger-regjeringskvartalet-sources.txt

      - name: Commit phase 7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bygg Kilder for Regjeringskvartalet"
          git push origin HEAD:production/regjeringskvartalet-phase-7-sources
