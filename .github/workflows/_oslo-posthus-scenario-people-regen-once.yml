name: Oslo Posthus scenario People regen once

on:
  push:
    branches:
      - agent/oslo-posthus-production-closure-20260910
    paths:
      - '.github/workflows/_oslo-posthus-scenario-people-regen-once.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-posthus-production-closure-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate canonical Civication scenario People
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - name: Verify canonical Civication scenario People
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/_oslo-posthus-scenario-people-regen-once.yml
      - name: Commit permanent generated output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 1
          fi
          git commit -m 'Regenerate Oslo Posthus scenario People catalog'
          git push origin HEAD:agent/oslo-posthus-production-closure-20260910
