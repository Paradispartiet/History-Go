name: Aker Brygge — remaining brand official header evidence
on:
  push:
    branches:
      - feature/aker-brygge-remaining-brand-visual-review-20261119
    paths:
      - .github/workflows/aker-brygge-brand-header-evidence.yml
      - scripts/audit-aker-brygge-official-brand-headers.mjs
      - scripts/produce-aker-brygge-inline-svg-candidates.mjs
      - tests/aker-brygge-inline-svg-candidates.test.mjs
permissions:
  contents: write
jobs:
  brand-header-evidence:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aker-brygge-remaining-brand-visual-review-20261119
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium only
        run: npx playwright install --with-deps chromium
      - name: Capture original source header evidence
        run: node scripts/audit-aker-brygge-official-brand-headers.mjs
      - name: Extract only authentic official Lundhagem and Haavind SVG DOM
        run: node scripts/produce-aker-brygge-inline-svg-candidates.mjs
      - name: Verify original hashes, WebP format and publication hold
        run: node --test tests/aker-brygge-inline-svg-candidates.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aker-brygge-remaining-brand-source-evidence
          path: |
            reports/place-production/aker-brygge-official-header-evidence/
            bilder/kort/brands/source/aker_brygge/lund_hagem_official_inline.svg
            bilder/kort/brands/source/aker_brygge/haavind_official_inline.svg
            bilder/kort/brands/candidates/aker_brygge/lund_hagem.webp
            bilder/kort/brands/candidates/aker_brygge/haavind.webp
            reports/place-production/aker-brygge-inline-svg-candidates-2026-11-19.json
            reports/place-production/aker-brygge-remaining-brand-header-audit-2026-11-19.json
          if-no-files-found: ignore
      - name: Archive only source snapshots and JSON research
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reports/place-production/aker-brygge-remaining-brand-header-audit-2026-11-19.json reports/place-production/aker-brygge-inline-svg-candidates-2026-11-19.json bilder/kort/brands/source/aker_brygge/lund_hagem_official_inline.svg bilder/kort/brands/source/aker_brygge/haavind_official_inline.svg bilder/kort/brands/candidates/aker_brygge/lund_hagem.webp bilder/kort/brands/candidates/aker_brygge/haavind.webp
          if ! git diff --cached --quiet; then
            git commit -m "research(aker-brygge): archive four official header visual reviews"
            git push origin HEAD:refs/heads/feature/aker-brygge-remaining-brand-visual-review-20261119
          fi
