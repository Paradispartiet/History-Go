name: Sync Oslo address anchor repair with main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-oslo-address-anchors-torggata-storgata-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Merge current main and resolve generated-file conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            for file in \
              data/places/places_index.json \
              reports/coordinate-evidence-audit.md \
              reports/place-coordinate-intake-gate.md \
              reports/place-coordinate-quality-gate.md
            do
              if git diff --name-only --diff-filter=U | grep -Fxq "$file"; then
                git checkout --theirs -- "$file"
                git add "$file"
              fi
            done

            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ -n "$unresolved" ]; then
              echo "Unresolved non-generated conflicts:"
              echo "$unresolved"
              exit 1
            fi
          fi

      - name: Rebuild and validate merged data
        run: |
          set -euo pipefail
          npm ci
          npm run build:tools
          npm run places:index:build
          npm run audit:places-split-manifest-sync
          npm run places:index:check
          npm run test:coordinate-source-contract
          npm run places:coords:quality
          npm run places:coords:intake
          npm run places:coords:evidence:audit
          git diff --check

      - name: Commit synchronized branch
        run: |
          set -euo pipefail
          rm .github/workflows/sync-oslo-address-anchor-pr.yml
          git add -A
          git commit -m "Sync Oslo address anchor repair with current main"
          git push origin HEAD
