name: Trosterudvillaen derived data synchronization (one-off)
on:
  push:
    branches:
      - content/trosterudvillaen-visual-story-20261110
    paths:
      - '.github/workflows/trosterudvillaen-sync-once.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/trosterudvillaen-visual-story-20261110
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate Place-open from canonical source manifests
        run: npm run place-open:build
      - name: Regenerate historical epoch index
        run: npm run epoker:places:build
      - name: Commit only Trosterudvillaen derived data
        run: |
          git add data/runtime/place-open/trosterudvillaen.json data/epoker/epoke-place-index.json
          if git diff --cached --quiet; then
            echo "Trosterudvillaen generated data is already current"
            exit 0
          fi
          git -c user.name="HistoryGo CI" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Sync Trosterudvillaen generated Place-open and epoch index"
          git push origin HEAD:content/trosterudvillaen-visual-story-20261110
