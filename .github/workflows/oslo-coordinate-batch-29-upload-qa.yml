name: Upload Oslo coordinate batch 29 QA image

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  upload:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-29-v3
      - uses: actions/upload-artifact@v4
        with:
          name: batch29-map-qa
          path: reports/oslo-coordinate-control-batch-29-v3/visual-qa/batch29-map-qa.png
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/oslo-coordinate-batch-29-upload-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/oslo-coordinate-batch-29-upload-qa.yml
          git commit -m "Remove temporary batch 29 QA upload workflow"
          git push origin HEAD
