name: Vaterlandsparken production closure
on:
  push:
    branches:
      - agent/vaterlandsparken-production-closure-20260911
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize Vaterlandsparken
        run: node tools/finalize-vaterlandsparken-completion.mjs
      - name: Validate focused contracts
        run: |
          node --test tests/vaterlandsparken-production-closure.test.mjs tests/nybrua-vaterlandsparken-split-rounds-batch1.test.js
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run check:stories
          npm run leksikon:ids:check
          npm run places:index:check
          npm run place-open:check
          npm run epoker:places:check
          npm run audit:people-of-places
      - name: Remove one-shot workflow
        run: rm .github/workflows/_vaterlandsparken-production-closure-once.yml
      - name: Commit canonical output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes"
            exit 1
          fi
          git commit -m "Materialize Vaterlandsparken production closure"
          git push origin HEAD
