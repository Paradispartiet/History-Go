name: Diagnose Hardeland people audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/fill-hardeland-rounds-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Register Hardeland people file
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('data/people/manifest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          target = 'people/naeringsliv/vestland/etne/people_hardeland_kraftverk_batch1.json'
          data['files'] = [x for x in data['files'] if x != target] + [target]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Capture people audit
        shell: bash
        run: |
          set +e
          bash scripts/check-people.sh > reports/hardeland-people-audit-diagnostic.txt 2>&1
          status=$?
          echo "EXIT_STATUS=$status" >> reports/hardeland-people-audit-diagnostic.txt
          cat reports/hardeland-people-audit-diagnostic.txt
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "History Go data agent"
          git config user.email "history-go-agent@users.noreply.github.com"
          git add reports/hardeland-people-audit-diagnostic.txt
          git commit -m "Record Hardeland people audit diagnostic"
          git push origin HEAD:${{ github.head_ref }}
