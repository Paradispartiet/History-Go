name: Oslo Oppdag Kvadraturen art batch 2 coordinates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-oppdag-kvadraturen-art-batch-2-coordinates.yml'

permissions:
  contents: write

jobs:
  coordinates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve Den røde prikk address
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-batch-2/coordinates'
          mkdir -p "$outdir"
          npm run places:coords:find:address -- --address 'Kongens gate 3 Oslo' \
            | tee "$outdir/den_rode_prikk_address.json"

      - name: Resolve Øvre Slottsgate sculpture-zone street geometry
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-batch-2/coordinates'
          mkdir -p "$outdir"
          curl --max-time 30 --retry 2 --fail --silent --show-error \
            -H 'User-Agent: History-Go coordinate audit (github.com/Paradispartiet/History-Go)' \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'format=jsonv2' \
            --data-urlencode 'q=Øvre Slottsgate, Oslo, Norge' \
            --data-urlencode 'countrycodes=no' \
            --data-urlencode 'limit=20' \
            --data-urlencode 'addressdetails=1' \
            --data-urlencode 'namedetails=1' \
            --data-urlencode 'polygon_geojson=1' \
            --data-urlencode 'viewbox=10.738,59.914,10.746,59.909' \
            --data-urlencode 'bounded=1' \
            -o "$outdir/skulptursonen_ovre_slottsgate_nominatim.json"
          jq -e 'length > 0' "$outdir/skulptursonen_ovre_slottsgate_nominatim.json" >/dev/null
          jq -r '.[] | [.osm_type, .osm_id, .lat, .lon, .category, .type, .display_name] | @tsv' \
            "$outdir/skulptursonen_ovre_slottsgate_nominatim.json" \
            | tee "$outdir/skulptursonen_ovre_slottsgate_candidates.tsv"

      - name: Persist coordinate evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/oslo-oppdag-kvadraturen-art-batch-2/coordinates
          git commit -m 'Save Oppdag Kvadraturen art batch 2 coordinate evidence'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
