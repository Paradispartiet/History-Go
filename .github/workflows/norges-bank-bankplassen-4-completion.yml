name: Norges Bank Bankplassen 4 completion

# Retry after aligning the source-owned quiz package with its reviewed source brief.

on:
  push:
    branches: [agent/norges-bank-bankplassen-4-place-production-20260914]
    paths:
      - ".github/workflows/norges-bank-bankplassen-4-completion.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: norges-bank-bankplassen-4-completion-20260914
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Configure git and integrate fresh main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Install dependencies
        run: npm ci

      - name: Download verified source assets
        run: |
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Norges_Bank.jpg' -o /tmp/norges-bank-place.jpg
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Karl_Gether_Bomhoff_(PO-013562_01_1).jpg' -o /tmp/bomhoff.jpg
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Riksl%C3%B8ven_fasade_Bankplassen_4_Oslo.jpg' -o /tmp/arbeid-fred.jpg
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hjemmefrontmuseet_Rakkestad_-_Norwegian_banknote_old_design_Norsk_pengeseddel_5_kroner_guld_1942_Norges_Bank_Wilhelm_Frimann_Koren_Christie_-_Local_World_War_II_Museum_Norway_IMG_5579.jpg' -o /tmp/seddel.jpg
          file /tmp/norges-bank-place.jpg /tmp/bomhoff.jpg /tmp/arbeid-fred.jpg /tmp/seddel.jpg

      - name: Materialize Bankplassen 4 source-led derivatives
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import sharp from 'sharp';

          const root = process.cwd();
          const verifiedAt = '2026-09-14';
          const placeId = 'norges_bank_bankplassen_4';
          const personId = 'karl_gether_bomhoff';
          const brandId = 'norges_bank';
          const placeFile = 'data/places/naeringsliv/oslo/places_naeringsliv_oslo_oppdag_kvadraturen_batch_04/norges_bank_bankplassen_4.json';
          const personFile = 'data/people/naeringsliv/oslo/norges_bank_bankplassen_4/karl_gether_bomhoff.json';
          const personClaimsFile = 'data/people/claims/naeringsliv/oslo/norges_bank_bankplassen_4/karl_gether_bomhoff.claims.json';
          const leksikonFile = 'data/leksikon/places/oslo/naeringsliv/leksikon_norges_bank_bankplassen_4.json';
          const languageFile = 'data/leksikon/sprak/places/europe/norway/oslo/norges_bank_bankplassen_4.json';
          const quizFile = 'data/quiz/naeringsliv/norges_bank_bankplassen_4_sets.json';
          const sourceBriefFile = 'data/quiz/production_briefs/naeringsliv/norges_bank_bankplassen_4.json';
          const contextFile = 'data/quiz/production_context/naeringsliv/norges_bank_bankplassen_4.json';

          const urls = {
            history: 'https://www.norges-bank.no/en/topics/about/History/history-of-norges-bank/',
            printing: 'https://www.norges-bank.no/globalassets/upload/english/publications/economic-bulletin/2007-03/printing-works.pdf?v=09032017122215',
            series2: 'https://www.norges-bank.no/tema/Sedler-og-mynter/utgaatte-sedler-mynter/Sedler-Utgave-II/',
            oppdag: 'https://www.oppdagkvadraturen.no/stoppesteder/bankplassen-4-christiania-theater-og-norges-bank',
            architecture: 'https://www.oppdagkvadraturen.no/stoppesteder/stil-og-arkitektur-bankplassen',
            annual: 'https://www.norges-bank.no/en/news-events/publications/Annual-Report/2025-annual-report/web-report-2025-annual-report/',
            governors: 'https://www.norges-bank.no/en/topics/about/history/Chairs-of-Norges-Banks-Executive-Board-/',
            bomhoff: 'https://snl.no/Karl_Gether_Bomhoff',
            placePhoto: 'https://commons.wikimedia.org/wiki/File:Norges_Bank.jpg',
            personPhoto: 'https://commons.wikimedia.org/wiki/File:Karl_Gether_Bomhoff_(PO-013562_01_1).jpg',
            facadePhoto: 'https://commons.wikimedia.org/wiki/File:Riksl%C3%B8ven_fasade_Bankplassen_4_Oslo.jpg',
            notePhoto: 'https://commons.wikimedia.org/wiki/File:Hjemmefrontmuseet_Rakkestad_-_Norwegian_banknote_old_design_Norsk_pengeseddel_5_kroner_guld_1942_Norges_Bank_Wilhelm_Frimann_Koren_Christie_-_Local_World_War_II_Museum_Norway_IMG_5579.jpg'
          };

          const read = file => JSON.parse(fs.readFileSync(path.join(root, file), 'utf8'));
          const write = (file, value) => {
            const target = path.join(root, file);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.writeFileSync(target, `${JSON.stringify(value, null, 2)}\n`);
          };
          const exists = file => fs.existsSync(path.join(root, file));
          const addOnce = (items, value, key = item => item) => {
            if (!items.some(item => key(item) === key(value))) items.push(value);
          };
          const upsert = (items, value) => {
            const index = items.findIndex(item => item?.id === value.id);
            if (index < 0) items.push(value); else items[index] = value;
          };
          const sha256 = value => crypto.createHash('sha256').update(String(value)).digest('hex');
          const splitSentences = text => [...new Intl.Segmenter('nb', { granularity: 'sentence' }).segment(text)]
            .map(item => item.segment.trim()).filter(Boolean);

          const place = read(placeFile);
          const people = read(personFile);
          const person = Array.isArray(people) ? people[0] : people;
          if (place.id !== placeId) throw new Error(`Unexpected place id ${place.id}`);
          if (!person || person.id !== personId) throw new Error('Karl Gether Bomhoff source profile missing');
          if (place.production_status !== 'complete') throw new Error('Place source is not marked complete');
          if (JSON.stringify(place.place_card_profile?.collection_ids) !== JSON.stringify(['people','objects','brands','productions'])) {
            throw new Error('Unexpected collection contract');
          }

          async function makeImage(input, output, width, height, options = {}) {
            const target = path.join(root, output);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            await sharp(input).rotate().resize(width, height, {
              fit: options.fit || 'cover',
              position: options.position || 'centre',
              background: options.background || '#111111'
            }).webp({ quality: 90 }).toFile(target);
          }
          await Promise.all([
            makeImage('/tmp/norges-bank-place.jpg', 'bilder/places/norges_bank_bankplassen_4.webp', 1200, 675),
            makeImage('/tmp/norges-bank-place.jpg', 'bilder/places/norges_bank_bankplassen_4_front_portrait.webp', 900, 1200),
            makeImage('/tmp/norges-bank-place.jpg', 'bilder/QuizCards/Norges Bank – Bankplassen 4.webp', 900, 1280),
            makeImage('/tmp/bomhoff.jpg', 'bilder/kort/people/karl_gether_bomhoff.webp', 720, 900),
            makeImage('/tmp/arbeid-fred.jpg', 'bilder/kort/objects/norges_bank_bankplassen_4_arbeid_og_fred.webp', 900, 620),
            makeImage('/tmp/seddel.jpg', 'bilder/kort/productions/norges_bank_bankplassen_4_seddeltrykking.webp', 900, 620),
            makeImage('/tmp/seddel.jpg', 'bilder/kort/brands/norges_bank.webp', 900, 520, { fit: 'contain', background: '#111111' })
          ]);

          const peopleManifest = read('data/people/manifest.json');
          addOnce(peopleManifest.files, 'people/naeringsliv/oslo/norges_bank_bankplassen_4/karl_gether_bomhoff.json');
          write('data/people/manifest.json', peopleManifest);

          const brand = {
            id: brandId,
            name: 'Norges Bank',
            aliases: ['Noregs Bank', 'Central Bank of Norway'],
            brand_group: 'professional_brand',
            brand_type: 'institution_brand',
            brand_kind: 'central_bank',
            sector: 'finance',
            state: 'catalog',
            status: 'active',
            verification: 'verified_current',
            verified_at: verifiedAt,
            desc: 'Norges sentralbank, knyttet til Bankplassen 4 som historisk hovedsete fra 1906 til 1986.',
            popupdesc: 'Brand-kortet gjelder Norges Bank som institusjonsidentitet, ikke Bankplassen 4 som bygning. Bankplassen 4 var hovedsete 1906–1986 og huset seddeltrykkeriet 1907–1934. Kortbildet er en autentisk norsk seddel fra samme institusjon, men det avbildede 1942-eksemplaret brukes bare til referensiell identifikasjon og dokumenterer ikke produksjon på Bankplassen 4 etter 1934.',
            place_ids: [placeId],
            source_urls: [urls.history, urls.printing, urls.series2, urls.notePhoto],
            logo: 'bilder/kort/brands/norges_bank.webp',
            imageMeta: {
              source: 'wikimedia_commons',
              sourcePage: urls.notePhoto,
              creator: 'Wolfmann',
              credit: 'Wolfmann / Wikimedia Commons',
              license: 'CC BY-SA 4.0',
              licenseUrl: 'https://creativecommons.org/licenses/by-sa/4.0/',
              rightsBasis: 'Licensed documentary image of an authentic Norges Bank note; used only for referential institutional identification.',
              reviewStatus: 'manually_approved',
              assetKind: 'authentic_historic_product_mark',
              usageContext: 'referential_identification',
              noEndorsement: true,
              generated: false,
              reconstructed: false,
              temporalScope: 'historical',
              transformation: 'Dokumentert seddelfoto proporsjonalt skalert på nøytral flate; ingen rekonstruksjon.',
              outputDimensions: '900x520',
              reviewedAt: verifiedAt
            }
          };
          for (const file of ['data/brands/brands_master.json','data/brands/brands_catalog.json','data/brands/brands_catalog_v17.json']) {
            if (!exists(file)) continue;
            const rows = read(file);
            if (!Array.isArray(rows)) continue;
            const value = file.endsWith('brands_master.json') ? brand : {
              id: brand.id, name: brand.name, aliases: brand.aliases, brand_group: brand.brand_group,
              brand_type: brand.brand_type, brand_kind: brand.brand_kind, sector: brand.sector,
              state: brand.state, status: brand.status, verification: brand.verification,
              verified_at: brand.verified_at, place_ids: brand.place_ids, source_urls: brand.source_urls,
              logo: brand.logo, imageMeta: brand.imageMeta
            };
            upsert(rows, value);
            write(file, rows);
          }
          const brandsByPlace = read('data/brands/brands_by_place.json');
          const brandValues = Array.isArray(brandsByPlace[placeId]) ? brandsByPlace[placeId] : [];
          if (!brandValues.includes(brandId)) brandValues.push(brandId);
          brandsByPlace[placeId] = brandValues;
          write('data/brands/brands_by_place.json', brandsByPlace);

          const leksikonManifest = read('data/leksikon/manifest.json');
          addOnce(leksikonManifest.files, leksikonFile);
          write('data/leksikon/manifest.json', leksikonManifest);
          const languageManifest = read('data/leksikon/sprak/manifest.json');
          languageManifest.place_files ||= {};
          languageManifest.place_files[placeId] = languageFile;
          write('data/leksikon/sprak/manifest.json', languageManifest);

          const readingFile = 'data/lesespor/oslo/lesespor_oslo_naeringsliv.json';
          const readings = read(readingFile);
          readings.items = (readings.items || []).filter(item => !String(item.id || '').startsWith('lesespor_norges_bank_bankplassen_4_'));
          readings.items.push(
            { id: 'lesespor_norges_bank_bankplassen_4_history', title: 'History of Norges Bank', author: null, publication: 'Norges Bank', date: null, year: 2026, type: 'official_institution_history', subjects: ['Norges Bank','Bankplassen 4','sentralbank'], place_ids: [placeId], person_ids: [personId], category_hints: ['naeringsliv','historie','by'], url: urls.history, access: 'open', rights: 'link_only', source_quality: 'canonical', curation_status: 'approved', relevance: 'Primær institusjonshistorie for hovedseteflytting, 1906-bygningen og bankens funksjon.' },
            { id: 'lesespor_norges_bank_bankplassen_4_printing', title: 'Norges Bank’s Printing Works – 190 years', author: null, publication: 'Norges Bank', date: null, year: 2007, type: 'official_production_history', subjects: ['seddeltrykkeri','Bankplassen 4','produksjon'], place_ids: [placeId], person_ids: [], category_hints: ['naeringsliv','historie'], url: urls.printing, access: 'open', rights: 'link_only', source_quality: 'canonical', curation_status: 'approved', relevance: 'Direkte kilde til seddeltrykkeriets flytting, arbeidsstyrke og perioden i Bankplassen 4.' },
            { id: 'lesespor_norges_bank_bankplassen_4_oppdag', title: 'Bankplassen 4 – Christiania Theater og Norges Bank', author: null, publication: 'Oppdag Kvadraturen', date: null, year: 2026, type: 'official_place_history', subjects: ['Bankplassen 4','Christiania Theater','Norges Bank'], place_ids: [placeId], person_ids: [], category_hints: ['naeringsliv','historie','by'], url: urls.oppdag, access: 'open', rights: 'link_only', source_quality: 'official', curation_status: 'approved', relevance: 'Stedsspesifikk kilde som skiller teaterets eldre tomtelag fra den stående bankbygningen.' }
          );
          write(readingFile, readings);

          const quizManifest = read('data/quiz/manifest.json');
          quizManifest.sets = (quizManifest.sets || []).filter(entry => entry.targetId !== placeId);
          quizManifest.sets.push({ targetId: placeId, file: quizFile });
          write('data/quiz/manifest.json', quizManifest);

          const fagManifest = read('data/fag/fag_manifest.json');
          const naering = fagManifest.fag?.naeringsliv ?? fagManifest.naeringsliv;
          if (!naering?.quizProduction?.targets) throw new Error('Canonical fag_manifest naeringsliv quizProduction.targets lookup failed');
          naering.quizProduction.targets[placeId] = {
            source_brief: '../quiz/production_briefs/naeringsliv/norges_bank_bankplassen_4.json',
            context_artifact: '../quiz/production_context/naeringsliv/norges_bank_bankplassen_4.json',
            quiz_file: '../quiz/naeringsliv/norges_bank_bankplassen_4_sets.json'
          };
          write('data/fag/fag_manifest.json', fagManifest);

          const fagverkRegistry = read('data/fagverk/fagverk_registry.json');
          fagverkRegistry.placeLinks ||= {};
          fagverkRegistry.placeLinks[placeId] = {
            sourceFile: 'places/naeringsliv/oslo/places_naeringsliv_oslo_oppdag_kvadraturen_batch_04/norges_bank_bankplassen_4.json',
            field: 'fagverk', schema: 'history_go_place_fagverk_v2', level: 'standard', status: 'curated'
          };
          fagverkRegistry.updatedAt = verifiedAt;
          write('data/fagverk/fagverk_registry.json', fagverkRegistry);

          const allClaimIds = [
            'claim_nb_b4_mainseat','claim_nb_b4_printing','claim_nb_b4_series2','claim_nb_b4_theater',
            'claim_nb_b4_departure','claim_nb_b4_current_management'
          ];
          const claims = [
            { id: 'claim_nb_b4_mainseat', claim: 'Norges Bank tok i bruk Bankplassen 4 som hovedsete i 1906 etter at hovedsetet var flyttet fra Trondheim til Kristiania i 1897.', sourceUrl: urls.history, sourceLocation: 'History of Norges Bank – relocation and new head office', sourceType: 'official', independentSourceUrls: [urls.oppdag], verifiedAt, status: 'verified', claimKind: 'identity', evidenceMode: 'explicit', temporalStatus: 'historical' },
            { id: 'claim_nb_b4_printing', claim: 'Norges Banks seddeltrykkeri flyttet til Oslo i 1907, lå i første etasje i Bankplassen 4 og flyttet til en egen bygning i 1934.', sourceUrl: urls.printing, sourceLocation: 'Printing Works history – Oslo move and 1934 relocation', sourceType: 'official', independentSourceUrls: [], verifiedAt, status: 'verified', claimKind: 'strong', evidenceMode: 'explicit', temporalStatus: 'historical' },
            { id: 'claim_nb_b4_series2', claim: 'Fra 1907 ble sedlene i serie II trykt i Norge på papir fra Alvøen.', sourceUrl: urls.series2, sourceLocation: 'Sedler utgave II – production from 1907', sourceType: 'official', independentSourceUrls: [urls.printing], verifiedAt, status: 'verified', claimKind: 'strong', evidenceMode: 'explicit', temporalStatus: 'historical' },
            { id: 'claim_nb_b4_theater', claim: 'Christiania Theater sto omtrent på samme tomt fra 1837 til 1899 og ble revet før den stående bankbygningen ble reist.', sourceUrl: urls.oppdag, sourceLocation: 'Bankplassen 4 – Christiania Theater og Norges Bank', sourceType: 'institutional', independentSourceUrls: [], verifiedAt, status: 'verified', claimKind: 'fact', evidenceMode: 'direct', temporalStatus: 'historical' },
            { id: 'claim_nb_b4_departure', claim: 'Norges Bank flyttet hovedkontoret fra Bankplassen 4 til Bankplassen 2 i 1986.', sourceUrl: urls.history, sourceLocation: 'History of Norges Bank – new head office', sourceType: 'official', independentSourceUrls: [], verifiedAt, status: 'verified', claimKind: 'fact', evidenceMode: 'direct', temporalStatus: 'historical' },
            { id: 'claim_nb_b4_current_management', claim: 'Norges Banks årsrapport for 2025 opplyser at forvaltningsansvaret for Bankplassen 4 gikk fra Statsbygg til Forsvarsbygg fra 1. januar 2026.', sourceUrl: urls.annual, sourceLocation: 'Annual Report 2025 – Bankplassen 4 property management', sourceType: 'annual_report', independentSourceUrls: [], verifiedAt, status: 'verified', claimKind: 'current', evidenceMode: 'explicit', temporalStatus: 'current' }
          ];
          write('data/places/production/norges_bank_bankplassen_4.json', {
            schemaVersion: '4.2', validatorVersion: '4.2.1', placeId, placeFile, status: 'ready_v4_2',
            identity: { status: 'resolved', represents: 'Den stående tidligere Norges Bank-bygningen på Bankplassen 4, hovedsete 1906–1986 og seddeltrykkeri 1907–1934.', period: '1906–', excludes: ['Den gamle Norges Bank på Bankplassen 3','dagens Norges Bank på Bankplassen 2','Christiania Theater som revet forgjenger på tomten','Forsvarsbygg som bevis for bestemt operativ forsvarsbruk'] },
            metadataSnapshot: { name: place.name, year: place.year, category: place.category },
            textHashes: { algorithm: 'sha256', desc: sha256(place.desc), popupDesc: sha256(place.popupDesc) },
            claims,
            sentenceCoverage: {
              desc: splitSentences(place.desc).map((text, index) => ({ sentence: index + 1, text, claim_ids: index === 0 ? ['claim_nb_b4_mainseat'] : ['claim_nb_b4_printing','claim_nb_b4_theater'] })),
              popupDesc: splitSentences(place.popupDesc).map((text, index) => ({ sentence: index + 1, text, claim_ids: allClaimIds }))
            },
            sourceConflicts: [],
            reviews: {
              factual: { status: 'passed', reviewedAt: verifiedAt, reviewer: 'Bankplassen 4 source review', notes: 'Identitet, hovedsete, trykkeriperiode, teaterlag og dagens forvaltningsstatus er eksplisitt avgrenset.' },
              editorial: { status: 'passed', reviewedAt: verifiedAt, reviewer: 'Bankplassen 4 editorial review', notes: 'Teksten skiller bygning, institusjon, produksjonsenhet og senere eiendomsforvaltning.' }
            }
          });

          const caseId = 'case_norges_bank_bankplassen_4_central_bank_and_printing';
          const sourceIds = ['source_nb_history','source_nb_printing','source_nb_series2','source_oppdag','source_annual2025'];
          const reportSources = [
            { id: 'source_nb_history', url: urls.history, sourceLocation: 'History of Norges Bank – head office and institutional history', sourceType: 'official', verifiedAt, temporalCoverage: 'mixed', provenance: 'Norges Banks own institutional history.', limitations: 'Institutional primary source; used for dates and functions, not independent impact evaluation.' },
            { id: 'source_nb_printing', url: urls.printing, sourceLocation: 'Norges Bank’s Printing Works – 190 years', sourceType: 'technical_documentation', verifiedAt, temporalCoverage: 'historical', provenance: 'Norges Banks documented history of banknote printing.', limitations: 'Describes production history but does not provide a consistent productivity series for Bankplassen 4.' },
            { id: 'source_nb_series2', url: urls.series2, sourceLocation: 'Sedler utgave II – production and paper', sourceType: 'official', verifiedAt, temporalCoverage: 'historical', provenance: 'Norges Banks official banknote history.', limitations: 'Documents banknote series and production facts, not all operational inputs or costs.' },
            { id: 'source_oppdag', url: urls.oppdag, sourceLocation: 'Bankplassen 4 – Christiania Theater og Norges Bank', sourceType: 'museum_or_heritage', verifiedAt, temporalCoverage: 'historical', provenance: 'Oppdag Kvadraturens place-specific heritage presentation.', limitations: 'Place-history source; not a quantitative banking dataset.' },
            { id: 'source_annual2025', url: urls.annual, sourceLocation: 'Annual Report 2025 – Bankplassen 4 property management', sourceType: 'annual_report', verifiedAt, temporalCoverage: 'current', provenance: 'Norges Banks published annual report.', limitations: 'Current property-management information does not establish a specific operational use of the building.' }
          ];
          write('data/places/naeringsliv-production/norges_bank_bankplassen_4.json', {
            schemaVersion: 'naeringsliv_place_production_v1', validatorVersion: '1.0.0', placeId, placeFile, status: 'ready',
            economicIdentity: {
              statement: 'Bankplassen 4 was a place-bound central-bank workplace and banknote-production site where monetary administration and physical production were combined.',
              anchorType: 'bank',
              placeObjectDistinction: 'Analysen gjelder den tidligere hovedbygningen på Bankplassen 4 og dokumenterte funksjoner der, ikke Norges Bank som helhet eller byggene på Bankplassen 2 og 3.',
              temporalScope: { start: '1906', end: '2026', precision: 'period', rationale: 'Perioden følger bankens hovedsete, trykkeriet, utflyttingen og dokumentert senere statlig eiendomsforvaltning.' },
              sourceIds: ['source_nb_history','source_nb_printing','source_annual2025']
            },
            businessTopics: place.emne_ids.map(emneId => ({
              emneId,
              siteSpecificRationale: {
                em_naering_kapital_finans: 'Bygningen var Norges Banks hovedsete og gjør sentralbankens finansielle og institusjonelle funksjon konkret på ett historisk arbeidssted.',
                em_naering_risiko_regulering: 'Sentralbankarbeid og sikker seddelproduksjon viser hvordan kontroll, tillit og offentlig regulering er innebygd i pengeinfrastrukturen.',
                em_naering_arbeid_verdiskaping: 'Bankfunksjoner og seddeltrykkeri samlet administrativt, teknisk og manuelt arbeid på samme sted, uten at bemanning alene måles som produktivitet.',
                em_naering_produksjon_produktivitet: 'Trykkeriet 1907–1934 gir en konkret produksjonsprosess der output kan skilles fra kapasitet, bemanning og samfunnsøkonomisk verdi.'
              }[emneId],
              caseIds: [caseId]
            })),
            sources: reportSources,
            economicCases: [{
              id: caseId,
              claim: 'Bankplassen 4 combined central-bank administration and banknote printing, making monetary infrastructure visible as both institutional coordination and a physical production process.',
              unitOfAnalysis: { unit: 'Norges Bank at Bankplassen 4', boundary: 'The case covers documented bank and printing functions at this building from 1906, not the entire Norwegian monetary system.', scale: 'site', temporalScope: { start: '1906', end: '1986', precision: 'period', rationale: 'The period follows the bank as main occupant; the printing sub-period is 1907–1934.' }, sourceIds: ['source_nb_history','source_nb_printing','source_nb_series2'] },
              actors: [
                { name: 'Norges Bank and its leadership', roleOrInterest: 'Organised central-bank administration, monetary functions and the workplace at the head office.', economicPosition: 'Public monetary institution controlling the organisation of the bank and its printing works.', sourceIds: ['source_nb_history'] },
                { name: 'Bank and printing-works employees', roleOrInterest: 'Performed administrative, technical and physical work required for banking and banknote production.', economicPosition: 'Labour supplied specialised knowledge and production work within the central-bank organisation.', sourceIds: ['source_nb_history','source_nb_printing'] }
              ],
              valueCreation: {
                inputs: [{ statement: 'Specialised labour, printing equipment, banknote paper, organisational rules and secure premises were documented inputs.', sourceIds: ['source_nb_printing','source_nb_series2'] }],
                activity: { statement: 'The site combined central-bank administration with printing of Norwegian banknotes during the 1907–1934 production period.', sourceIds: ['source_nb_history','source_nb_printing'] },
