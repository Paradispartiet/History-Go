          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('data/places/naeringsliv/oslo/places_naeringsliv_oslo_oppdag_kvadraturen_batch_04/norges_bank_bankplassen_4.json','utf8'));
          const ids = p.place_card_profile?.collection_ids || [];
          if (JSON.stringify(ids) !== JSON.stringify(['people','objects','brands','productions'])) throw new Error(`Unexpected collection ids ${JSON.stringify(ids)}`);
          if (!p.related_people_ids?.includes('karl_gether_bomhoff')) throw new Error('Karl Gether Bomhoff missing');
          if (!p.objects?.some(x => x.id === 'norges_bank_bankplassen_4_arbeid_og_fred')) throw new Error('Arbeid og fred missing');
          if (!p.productions?.some(x => x.id === 'norges_bank_bankplassen_4_seddeltrykking_1907_1934')) throw new Error('Printing production missing');
          const brands = JSON.parse(fs.readFileSync('data/brands/brands_by_place.json','utf8'));
          if (!(brands.norges_bank_bankplassen_4 || []).includes('norges_bank')) throw new Error('Norges Bank brand missing');
          const runtime = JSON.parse(fs.readFileSync('data/runtime/place-open/norges_bank_bankplassen_4.json','utf8'));
          if (!runtime.people?.some(x => x.id === 'karl_gether_bomhoff')) throw new Error('Runtime person missing');
          if (!runtime.brands?.some(x => x.id === 'norges_bank')) throw new Error('Runtime brand missing');
          const quiz = JSON.parse(fs.readFileSync('data/quiz/naeringsliv/norges_bank_bankplassen_4_sets.json','utf8'));
          const questions = quiz.sets.flatMap(set => set.questions || []);
          if (questions.length !== 21) throw new Error(`Expected 21 questions, got ${questions.length}`);
          const balance = [0,1,2].map(index => questions.filter(q => q.answerIndex === index).length);
          if (JSON.stringify(balance) !== JSON.stringify([7,7,7])) throw new Error(`Expected 7/7/7 answer balance, got ${JSON.stringify(balance)}`);
          if (questions.some(q => q.knowledge_link_status !== 'linked' || !q.knowledge_id)) throw new Error('Quiz Knowledge closure incomplete');
          console.log('Bankplassen 4 exact collection + 21-question + Knowledge closure PASS');
          NODE

