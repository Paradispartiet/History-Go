name: TEMP Subkultur Produksjonsledelse prerequisites replay

on:
  push:
    branches:
      - agent/civication-subkultur-produksjonsledelse-prerequisites-replay-20260904

permissions:
  contents: write

jobs:
  replay:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') && !contains(github.event.head_commit.message, '[diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Restore green role-owned prerequisite sources
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=5706f447e84be865de4e22c4b66d2ecc28df3c56
          files=(
            data/Civication/roleModels/subkultur/subkultur_produksjonsledelse.json
            data/Civication/workGrammars/subkultur/subkultur_produksjonsledelse.json
            data/Civication/mailPlans/subkultur/subkultur_produksjonsledelse_plan.json
            data/Civication/mailFamilies/subkultur/job/subkultur_produksjonsledelse_job.json
            data/Civication/mailFamilies/subkultur/people/subkultur_produksjonsledelse_people.json
            data/Civication/mailFamilies/subkultur/conflict/subkultur_produksjonsledelse_conflict.json
            data/Civication/mailFamilies/subkultur/story/subkultur_produksjonsledelse_story.json
            data/Civication/mailFamilies/subkultur/event/subkultur_produksjonsledelse_event.json
            data/Civication/mailFamilies/subkultur/micro/subkultur_produksjonsledelse_micro.json
            data/Civication/mailFamilies/subkultur/followup/subkultur_produksjonsledelse_followup.json
            data/Civication/mailFamilies/subkultur/knowledge/subkultur_produksjonsledelse_knowledge.json
            data/Civication/mailFamilies/subkultur/consequence/subkultur_produksjonsledelse_consequence.json
            tests/civication-subkultur-produksjonsledelse-prerequisites.test.js
            reports/CIVICATION_SUBKULTUR_PRODUKSJONSLEDELSE_PREREQUISITES_SOURCE_FIRST.md
          )
          for p in "${files[@]}"; do
            mkdir -p "$(dirname "$p")"
            curl -fsSL "https://raw.githubusercontent.com/Paradispartiet/History-Go/${SOURCE_SHA}/${p}" -o "$p"
          done
      - name: Register canonical role model on fresh manifest
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='data/Civication/roleModels/manifest.json';
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          const model='data/Civication/roleModels/subkultur/subkultur_produksjonsledelse.json';
          if(!m.files.includes(model)) m.files.push(model);
          m.files=[...new Set(m.files)].sort((a,b)=>a.localeCompare(b,'nb'));
          fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');
          NODE
      - name: Regenerate role-pack index
        run: node scripts/audit-civication-role-packs.mjs
      - name: Normalize generated role-pack EOF
        run: node -e "const fs=require('fs');const p='docs/CIVICATION_ROLE_PACK_INDEX.md';const s=fs.readFileSync(p,'utf8');fs.writeFileSync(p,s.replace(/\n+$/,'\n'));"
      - name: Regenerate scenario People
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - name: Verify scenario People parity
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
      - name: Test scenario People invariants
        run: node --test tests/civication-scenario-people.test.mjs
      - name: Regenerate career gameplay matrix
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Regenerate Role World readiness outputs
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Focused prerequisite gate
        run: node tests/civication-subkultur-produksjonsledelse-prerequisites.test.js
      - name: Subkultur career compatibility
        run: node tests/civication-subkultur-career-architecture.test.js
      - name: Career gameplay parity
        run: node scripts/audit-civication-career-gameplay.mjs --check
      - name: Role World readiness parity
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --check
      - name: Regenerate compiled scene registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Compiled scene registry parity
        run: node scripts/build-civication-scene-registry.mjs --check
      - name: Full Civication
        run: npm run test:civication
      - name: Repository diff gate
        run: git diff --check
      - name: Publish fresh-main permanent prerequisite state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/TEMP-subkultur-produksjonsledelse-prerequisites-replay.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No permanent changes"
            exit 1
          fi
          git diff --cached --check
          git commit -m "Materialize Subkultur Produksjonsledelse prerequisites [materialized]"
          git push origin HEAD:${GITHUB_REF_NAME}
