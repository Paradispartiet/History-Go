name: Repair Tullin quiz relative phases

on:
  push:
    branches:
      - work/tullin-completion-20260830
    paths:
      - .github/workflows/tullin-quiz-phase-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tullin-completion-20260830
          fetch-depth: 0
      - name: Align Tullin quiz phases with canonical relative progression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/finalize-tullin-completion.mjs')
          text = path.read_text()
          old_set = 'phase: index < 2 ? "opening" : index < 4 ? "middle" : index === 4 ? "bridge" : "final"'
          new_set = 'phase: index === 0 ? "opening" : index < 4 ? "middle" : index === 4 ? "bridge" : "final"'
          old_claim = 'planned_phase: index < 14 ? "opening" : index < 28 ? "middle" : index < 35 ? "bridge" : "final"'
          new_claim = 'planned_phase: index < 7 ? "opening" : index < 28 ? "middle" : index < 35 ? "bridge" : "final"'
          if text.count(old_set) != 1:
              raise SystemExit(f'expected one old set phase expression, found {text.count(old_set)}')
          if text.count(old_claim) != 1:
              raise SystemExit(f'expected one old claim phase expression, found {text.count(old_claim)}')
          text = text.replace(old_set, new_set).replace(old_claim, new_claim)
          path.write_text(text)
          PY
          rm -f reports/place-production/tullin-producer-error.log
          rm -f .github/workflows/tullin-quiz-phase-repair.yml
          git diff --check
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align Tullin quiz phases with relative progression"
          git push origin HEAD:work/tullin-completion-20260830
