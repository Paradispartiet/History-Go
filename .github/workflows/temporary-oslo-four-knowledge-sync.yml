name: Temporary Oslo four fullquiz Knowledge sync
on:
  push:
    branches:
      - content/oslo-four-fullquiz-qc-20261021
    paths:
      - .github/workflows/temporary-oslo-four-knowledge-sync.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/oslo-four-fullquiz-qc-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Synchronize canonical Knowledge data
        run: |
          npm ci --no-audit --no-fund
          npm run knowledge:canonical:write
      - name: Commit only generated Knowledge artifacts
        shell: bash
        run: |
          git add -- data/quiz/kunst/munch_museet_sets.json data/quiz/kunst/nasjonalmuseet_sets.json data/quiz/naeringsliv/oslo_gassverk_sets_merged.json data/quiz/subkultur/brugata_storgata_rusmiljo_sets.json data/knowledge/knowledge_units.generated.json data/knowledge/knowledge_emne_review_queue.generated.json reports/knowledge-id-backfill.json
          if git diff --cached --quiet; then
            echo 'Canonical Knowledge artifacts already in sync'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(knowledge): synchronize four reviewed Oslo full quizzes'
          git push origin HEAD:refs/heads/content/oslo-four-fullquiz-qc-20261021
