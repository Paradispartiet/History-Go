name: Temporary People duplicate diagnosis
on:
  push:
    branches: [diagnostics/hon-people-duplicate-20261102]
    paths: [.github/workflows/diagnose-people-duplicate-20261102.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print duplicate canonical People IDs with source files
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const manifest=JSON.parse(fs.readFileSync('data/people/manifest.json','utf8'));
          const entries=new Map();
          let count=0;
          for(const file of manifest.files){
            const value=JSON.parse(fs.readFileSync(path.join('data',file),'utf8'));
            const rows=Array.isArray(value)?value:Array.isArray(value.people)?value.people:[value];
            for(const row of rows) {
              count++;
              const id=row?.id||'NO_ID';
              const locations=entries.get(id)||[];
              locations.push({file,name:row?.name||''});
              entries.set(id,locations);
            }
          }
          console.log('Entries',count,'unique IDs',entries.size);
          for(const [id, locations] of entries) {
            if(locations.length>1) console.log('DUPLICATE',id,JSON.stringify(locations));
          }
          NODE
