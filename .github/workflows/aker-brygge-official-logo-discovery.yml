name: Aker Brygge — discover authentic official logo resources
on:
  push:
    branches:
      - feature/aker-brygge-original-logo-candidates-20261118
    paths:
      - .github/workflows/aker-brygge-official-logo-discovery.yml
      - scripts/discover-aker-brygge-official-logo-sources.mjs
permissions:
  contents: write
concurrency:
  group: aker-brygge-official-logo-discovery
  cancel-in-progress: false
jobs:
  discover:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aker-brygge-original-logo-candidates-20261118
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect only five official sites for logo asset URLs
        run: node scripts/discover-aker-brygge-official-logo-sources.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: aker-brygge-logo-source-discovery
          path: reports/place-production/aker-brygge-official-logo-discovery-2026-11-19.json
      - name: Archive unverified source findings (not images)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reports/place-production/aker-brygge-official-logo-discovery-2026-11-19.json
          if ! git diff --cached --quiet; then
            git commit -m "research(aker-brygge): capture official logo asset candidate URLs"
            git push origin HEAD:refs/heads/feature/aker-brygge-original-logo-candidates-20261118
          fi
