name: Politics norms domain quality runner

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: politics-norms-domain-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run-domain-work:
    if: startsWith(github.head_ref, 'agent/politikk-normer-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read phase
        id: phase
        if: hashFiles('reports/politikk-canonical-migration/normer-domain-work-marker.txt') != ''
        run: echo "value=$(cat reports/politikk-canonical-migration/normer-domain-work-marker.txt)" >> "$GITHUB_OUTPUT"
      - name: Export current canonical inputs
        id: export
        if: steps.phase.outputs.value == 'export-current-canonical'
        run: |
          set -euo pipefail
          mkdir -p /tmp/politikk-canonical
          cp data/fag/politikk/{fagkart_politikk_canonical_v4_5.json,emner_politikk_canonical_v4_5.json,methods_politikk_canonical_v4_5.json,emnemapping_politikk_canonical_v4_5.json,politikkpensum_canonical_v4_5.json,quiz_generator_rules_politikk_v5_1_source_priority_patch.json} /tmp/politikk-canonical/
          echo "exported=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.export.outputs.exported == 'true'
        with:
          name: politics-canonical-current-norms
          path: /tmp/politikk-canonical/
      - name: Materialize norm domain
        if: steps.phase.outputs.value == 'materialize'
        run: |
          set -euo pipefail
          node tools/apply-politikk-normer-vertical.mjs
          node tools/validate-politikk-normer-vertical.mjs | tee reports/politikk-canonical-migration/normer-identitet-vertical-chain-validation.txt
          node -e 'const fs=require("fs"); for (const p of ["data/fag/politikk/fagkart_politikk_canonical_v4_5.json","data/fag/politikk/emner_politikk_canonical_v4_5.json","data/fag/politikk/methods_politikk_canonical_v4_5.json","data/fag/politikk/emnemapping_politikk_canonical_v4_5.json","data/fag/politikk/politikkpensum_canonical_v4_5.json","data/fag/politikk/quiz_generator_rules_politikk_v5_1_source_priority_patch.json","reports/politikk-canonical-migration/normer-identitet-question-blueprints.json"]) JSON.parse(fs.readFileSync(p,"utf8")); console.log("JSON parse: PASS");'
          git diff --check
      - name: Commit canonical result
        if: steps.phase.outputs.value == 'materialize'
        run: |
          set -euo pipefail
          rm tools/apply-politikk-normer-vertical.mjs
          rm reports/politikk-canonical-migration/normer-domain-work-marker.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fag/politikk/fagkart_politikk_canonical_v4_5.json
          git add data/fag/politikk/emner_politikk_canonical_v4_5.json
          git add data/fag/politikk/methods_politikk_canonical_v4_5.json
          git add data/fag/politikk/emnemapping_politikk_canonical_v4_5.json
          git add data/fag/politikk/politikkpensum_canonical_v4_5.json
          git add data/fag/politikk/quiz_generator_rules_politikk_v5_1_source_priority_patch.json
          git add reports/politikk-canonical-migration/normer-identitet-question-blueprints.json
          git add reports/politikk-canonical-migration/normer-identitet-vertical-chain.md
          git add reports/politikk-canonical-migration/normer-identitet-vertical-chain-validation.txt
          git add tools/validate-politikk-normer-vertical.mjs
          git add -u tools/apply-politikk-normer-vertical.mjs reports/politikk-canonical-migration/normer-domain-work-marker.txt
          git diff --cached --check
          git commit -m 'Politikk: fullfør normdomenets vertikale kvalitetskjede'
          git push origin HEAD:${{ github.head_ref }}
