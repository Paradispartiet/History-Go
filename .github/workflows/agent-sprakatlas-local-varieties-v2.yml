name: Agent Språkatlas lokale talemål v2

on:
  push:
    branches:
      - agent/sprakatlas-local-varieties-v2

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/sprakatlas-local-varieties-v2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build local speech hierarchy
        run: python3 scripts/agent_sprakatlas_local_varieties_v2.py

      - name: Check runtime syntax
        run: node --check js/ui/place-language-layer.js

      - name: Run language regressions
        run: |
          node --test tests/place-language-dialect-scope.test.mjs
          node --test tests/place-language-layer.test.mjs

      - name: Validate generated JSON and diff
        run: |
          python3 -m json.tool data/leksikon/sprak/norge_atlas_v1.json >/dev/null
          python3 -m json.tool data/leksikon/sprak/atlas_schema_v1.json >/dev/null
          git diff --check

      - name: Commit product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/leksikon/sprak/norge_atlas_v1.json \
                  data/leksikon/sprak/atlas_schema_v1.json \
                  js/ui/place-language-layer.js \
                  css/place-language-layer.css \
                  docs/SPRAKLEKSIKON.md \
                  tests/place-language-dialect-scope.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Gjør lokale talemål til atlasets hovednivå'
          git push origin HEAD:agent/sprakatlas-local-varieties-v2
