name: Temporary documentation phase 20 historical routes

on:
  push:
    branches:
      - agent/documentation-governance-phase-20-historical-routes

permissions:
  contents: write

jobs:
  consolidate-historical-routes-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-governance-phase-20-historical-routes
          fetch-depth: 0

      - name: Consolidate historical routes documentation
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          active_path = Path("docs/README_HistoryGo_Historiske_Ruter.md")
          archive_dir = Path("reports/archive/2026-07/historical-routes")
          archive_path = archive_dir / "README_HistoryGo_Historiske_Ruter_PRE_CONSOLIDATION_2026-07-26.md"
          archive_index_path = archive_dir / "README.md"

          original = active_path.read_bytes()
          archive_dir.mkdir(parents=True, exist_ok=True)
          archive_path.write_bytes(original)
          assert archive_path.read_bytes() == original

          active_document = '''# History GO — Historiske ruter

Status: **operational runtimeguide**  
Canonical schema: [`../data/routes/historical/schema_historical_route.json`](../data/routes/historical/schema_historical_route.json)  
Aktiveringsmanifest: [`../data/routes/historical/manifest.json`](../data/routes/historical/manifest.json)  
Runtime: [`../js/historical-routes.js`](../js/historical-routes.js)  
Sist kontrollert: **2026-07-26**

Historiske ruter er narrative History GO-reiser der en rute organiserer kapitler, historiske stopp og progresjon. Dette dokumentet beskriver det som faktisk er implementert. Den tidligere konsept-, idé- og faseplanen er bevart byte-identisk i rapportarkivet og er ikke nåstatus.

## Autoritetsrekkefølge

1. [`../data/routes/historical/schema_historical_route.json`](../data/routes/historical/schema_historical_route.json) — maskinlesbart ruteskjema.
2. [`../data/routes/historical/manifest.json`](../data/routes/historical/manifest.json) — aktiverte route-filer.
3. Route-dataene som manifestet laster, for tiden [`../data/routes/historical/routes_historical_oslo.json`](../data/routes/historical/routes_historical_oslo.json).
4. [`../js/historical-routes.js`](../js/historical-routes.js) — online-spiller, progresjonslagring og events.
5. `HGNextUpHistoricalRoutes` i [`../js/nextUpRuntime.js`](../js/nextUpRuntime.js) — NextUp-forslag og handoff til spilleren.
6. [`../tools/audit-historical-routes.mts`](../tools/audit-historical-routes.mts) og rutetestene — maskinell kontroll.
7. Dette dokumentet — menneskelesbar implementasjonsguide.

Ved konflikt gjelder schema, manifest, aktive data, runtime og tester foran denne teksten.

## Implementert nå

### Data og aktivering

- `data/routes/historical/manifest.json` laster route-filer under samme mappe.
- Aktive objekter bruker `type: "historical_route"` og `feature: "historiske_ruter"`.
- Hver rute har arketype, periode, fortelling, kapitler, play modes og rewards-metadata.
- Kapitler kan peke til et canonical `placeId` eller være tekstlige etapper uten fysisk sted.
- Fysiske kapitler har `physical.enabled`, `placeId` og positiv `gpsRadius` i data.
- Auditen kontrollerer route- og chapter-ID-er, manifestlastingen og at alle place-referanser finnes i aktive place-source-filer.

### Online-spiller

`window.HGHistoricalRoutes` eksponerer:

- `load()`
- `getAll()`
- `getProgress(routeId)`
- `startRoute(routeId)`
- `completeCurrentChapter(routeId)`
- `getRouteArchetypeLabel(routeArchetype)`
- `renderCards()`
- `bindCards(container)`
- `open(routeId)`
- `close()`

Runtime bruker `DataHub.loadHistoricalRoutes()` når helperen finnes, ellers manifestbasert fetch. Bare ruter med gyldig type, feature, online-modus og minst ett kapittel tas inn i spilleren.

Spilleren viser ruteintro, kapittel, periode, fortelling, første task-prompt, tilknyttet place-ID og progresjon. Brukeren kan starte, gå videre kapittel for kapittel, fullføre online og starte reisen på nytt.

### Progresjon

Canonical runtime-key for denne modulen er:

```txt
hg_historical_routes_progress_v1
```

Per rute lagres blant annet:

```txt
status
online.started
online.completed
online.currentStopId
online.completedStopIds
physical.visitedStopIds
physical.completed
updatedAt
```

Aktive online-statuser er:

```txt
not_started
started
online_in_progress
online_completed
```

Online-fullføring setter ikke fysisk fullføring.

### Events og NextUp

Ved progresjonsendring sender runtime:

- `updateProfile`
- `hg:historicalRouteProgress`

Ved online-fullføring sender den også:

- `hg:routeCompleted` med route-ID og `strength: 2`

NextUp-integrasjonen er implementert. Den kan foreslå en ikke startet eller påbegynt rute, åpne riktig route-player og vise handlingsetiketter som «Start reisen», «Fortsett reisen», «Samle fysiske stopp senere» eller «Spill reisen på nytt» ut fra faktisk progresjon og om ruten har fysiske kapitler.

## Ikke implementert eller ikke garantert

Følgende må ikke omtales som ferdig runtime:

- GPS-basert registrering av fysiske routestopp.
- Automatisk oppdatering av `physical.visitedStopIds` fra vanlige place-besøk.
- Fysisk route-fullføring eller fysisk route-badge.
- Direkte tildeling av points eller badges i `historical-routes.js`; rewards-feltene er metadata, og runtime viser dem ved fullføring.
- Faktiske quiz-, valg- eller oppgaveporter. Dagens task-felt vises som refleksjons-/placeholdertekst, og Neste-knappen håndhever ikke et svar.
- Route objects, Wonderkammer-unlocks, creator-publisering eller ekstern route-import.
- Automatisk profilseksjon med full route-statistikk utover events og lagret read-model.

`playModes.physical.enabled: true` betyr derfor at ruten er modellert for framtidig fysisk samling. Det betyr ikke at GPS-innsamlingen er implementert.

## Datakrav

En aktiv rute skal minst ha:

```txt
id
title
type = historical_route
feature = historiske_ruter
routeArchetype
narrativeText
playModes.online
playModes.physical
chapters
rewards
```

Et kapittel skal minst ha:

```txt
sequence
id
chapterTitle
narrativeText
tasks
physical
```

Når `chapter.placeId` finnes:

- ID-en skal finnes i aktive place-source-filer.
- `chapter.physical.placeId` skal peke til samme canonical sted.
- `physical.enabled` skal være `true` og `gpsRadius` skal være positiv.

Når et kapittel ikke har `placeId`:

- det er en tekstlig etappe;
- `physical.enabled` skal være `false`;
- det skal ikke oppgis fysisk place-ID eller radius.

`physicalCollected` i canonical route-data skal være `false`. Brukerens tilstand skal ligge i progress store, ikke skrives tilbake til route-dataene.

## Redaksjonell arbeidsflyt

1. Gjenbruk eksisterende canonical places når kapitlet representerer et faktisk History GO-sted.
2. Opprett ikke et nytt place bare for å fylle et route-kapittel dersom et tekstlig kapittel er mer presist.
3. Legg nye ruter i en manifestlastet route-fil og behold stabile route- og chapter-ID-er.
4. Skille mellom dokumentert historisk bevegelseslogikk og moderne turforslag.
5. Ikke erklær fysisk samling, badges, points eller quiz som implementert før runtime og tester håndhever det.
6. Kjør alle route-kontroller før merge.

## Validering

```bash
npm run test:historical-routes
npm run test:nextup-historical-routes
npm run test:historical-routes:audit
```

Testene kontrollerer blant annet:

- minst fem aktive eksempelruter;
- gyldige place-referanser;
- konsistente fysiske chapter-felter;
- online progresjon og separat fysisk status;
- `updateProfile` ved progresjonsendring;
- route-arketypelabels;
- NextUp-status, handlingsetiketter og åpning av riktig rute.

## Historisk planmateriale

Den opprinnelige 1 198-linjers feature-, mekanikk- og faseplanen er bevart i:

```txt
reports/archive/2026-07/historical-routes/README_HistoryGo_Historiske_Ruter_PRE_CONSOLIDATION_2026-07-26.md
```

Planen kan brukes som idéhistorikk. Den kan ikke brukes til å hevde at foreslåtte v0.2–v0.7-funksjoner er implementert.
'''
          active_path.write_text(active_document, encoding="utf-8")

          archive_index = '''# Historiske ruter — pre-consolidation-arkiv

Dette arkivet bevarer den tidligere samlede konsept-, mekanikk- og faseplanen for Historiske ruter byte-identisk.

## Historisk snapshot

- [`README_HistoryGo_Historiske_Ruter_PRE_CONSOLIDATION_2026-07-26.md`](./README_HistoryGo_Historiske_Ruter_PRE_CONSOLIDATION_2026-07-26.md)

Snapshotet er ikke nåstatus.

## Aktive kilder

- [`../../../../docs/README_HistoryGo_Historiske_Ruter.md`](../../../../docs/README_HistoryGo_Historiske_Ruter.md) — operational runtimeguide
- [`../../../../data/routes/historical/schema_historical_route.json`](../../../../data/routes/historical/schema_historical_route.json) — canonical schema
- [`../../../../data/routes/historical/manifest.json`](../../../../data/routes/historical/manifest.json) — aktiveringsmanifest
- [`../../../../js/historical-routes.js`](../../../../js/historical-routes.js) — online runtime
'''
          archive_index_path.write_text(archive_index, encoding="utf-8")

          registry_path = Path("docs/documentation_registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          documents = registry["documents"]

          entries = [
              {
                  "path": "docs/README_HistoryGo_Historiske_Ruter.md",
                  "status": "operational",
                  "role": "Aktiv runtimeguide for manifest, online-spiller, progresjon, NextUp og implementasjonsgrenser for Historiske ruter",
                  "owns": ["historical_routes_runtime_guide"],
                  "last_verified": "2026-07-26",
              },
              {
                  "path": "data/routes/historical/schema_historical_route.json",
                  "status": "canonical",
                  "role": "Maskinlesbart schema for Historical Route v1 route-, chapter-, physical- og reward-felter",
                  "owns": ["historical_routes_data_schema"],
                  "last_verified": "2026-07-26",
              },
              {
                  "path": "reports/archive/2026-07/historical-routes/README_HistoryGo_Historiske_Ruter_PRE_CONSOLIDATION_2026-07-26.md",
                  "status": "historical",
                  "role": "Pre-consolidation konsept-, mekanikk- og faseplan for Historiske ruter",
                  "owns": [],
                  "superseded_by": [
                      "docs/README_HistoryGo_Historiske_Ruter.md",
                      "data/routes/historical/schema_historical_route.json",
                  ],
                  "historical_reason": "Dokumentet blander framtidig featurevisjon og faseplan med deler som senere ble implementert. Det er bevart byte-identisk, men kan ikke brukes som gjeldende runtime- eller implementasjonsstatus.",
              },
          ]

          paths = {entry["path"] for entry in entries}
          documents[:] = [entry for entry in documents if entry.get("path") not in paths]
          anchor_index = next(
              (index + 1 for index, entry in enumerate(documents) if entry.get("path") == "docs/PLACE_STANDARD.md"),
              len(documents),
          )
          for offset, entry in enumerate(entries):
              documents.insert(anchor_index + offset, entry)

          registry["last_verified"] = "2026-07-26"
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          docs_index_path = Path("docs/README.md")
          docs_index = docs_index_path.read_text(encoding="utf-8")
          docs_index = docs_index.replace("Sist kontrollert: **2026-07-25**", "Sist kontrollert: **2026-07-26**", 1)

          route_section = '''### Historiske ruter

1. [`README_HistoryGo_Historiske_Ruter.md`](./README_HistoryGo_Historiske_Ruter.md) — operational runtimeguide og ærlig implementasjonsgrense
2. [`../data/routes/historical/schema_historical_route.json`](../data/routes/historical/schema_historical_route.json) — canonical route- og chapter-schema
3. [`../data/routes/historical/manifest.json`](../data/routes/historical/manifest.json) — aktiverte route-filer
4. [`../js/historical-routes.js`](../js/historical-routes.js) — online-spiller og progress store
5. [`../tools/audit-historical-routes.mts`](../tools/audit-historical-routes.mts) — manifest-, ID- og place-referanseaudit

Online-reisen, lokal progresjon, events og NextUp-handoff er implementert. Fysisk GPS-samling, faktisk badge-/pointstildeling og interaktive quiz-/valgporter er foreløpig ikke implementert selv om dataene er forberedt for fysisk modus.

'''
          if "### Historiske ruter\n" not in docs_index:
              anchor = "### Domener, data og innholdsproduksjon\n"
              if docs_index.count(anchor) != 1:
                  raise SystemExit("Expected one domain/data documentation anchor")
              docs_index = docs_index.replace(anchor, route_section + anchor, 1)

          completion_line = "- `PEOPLE_IMAGES.md` synkronisert med pipeline og registrert som canonical bilde- og rettighetskontrakt\n"
          new_completion = "- Historiske ruter-planen skilt fra implementert runtimeguide og byte-identisk pre-consolidation-arkiv\n"
          if new_completion not in docs_index:
              if completion_line not in docs_index:
                  raise SystemExit("Expected PEOPLE_IMAGES completion anchor")
              docs_index = docs_index.replace(completion_line, completion_line + new_completion, 1)

          docs_index_path.write_text(docs_index, encoding="utf-8")

          month_index_path = Path("reports/archive/2026-07/README.md")
          month_index = month_index_path.read_text(encoding="utf-8")
          month_line = "- [`historical-routes/`](./historical-routes/) — tidligere konsept-, mekanikk- og faseplan for Historiske ruter, bevart byte-identisk\n"
          if month_line not in month_index:
              anchor = "- [`legacy-readmes/`](./legacy-readmes/) — fire gamle globale relations-, oppgave-, BY-fag- og badge-modeller, bevart byte-identisk\n"
              if anchor not in month_index:
                  raise SystemExit("Expected archive index anchor")
              month_index = month_index.replace(anchor, anchor + month_line, 1)
          month_index_path.write_text(month_index, encoding="utf-8")

          assert hashlib.sha256(archive_path.read_bytes()).hexdigest() == hashlib.sha256(original).hexdigest()
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate documentation and historical routes
        shell: bash
        run: |
          npm run build:scripts
          node dist/scripts/check-documentation-governance.mjs
          npm run test:historical-routes
          npm run test:nextup-historical-routes
          npm run test:historical-routes:audit

      - name: Verify final scope and archive identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          active = Path("docs/README_HistoryGo_Historiske_Ruter.md")
          archive = Path("reports/archive/2026-07/historical-routes/README_HistoryGo_Historiske_Ruter_PRE_CONSOLIDATION_2026-07-26.md")
          registry = json.loads(Path("docs/documentation_registry.json").read_text(encoding="utf-8"))
          entries = {entry["path"]: entry for entry in registry["documents"]}

          assert entries[str(active)]["status"] == "operational"
          assert entries[str(active)]["owns"] == ["historical_routes_runtime_guide"]
          assert entries["data/routes/historical/schema_historical_route.json"]["status"] == "canonical"
          assert entries["data/routes/historical/schema_historical_route.json"]["owns"] == ["historical_routes_data_schema"]
          assert entries[str(archive)]["status"] == "historical"
          assert "v0.6 — Nextup-kobling" not in active.read_text(encoding="utf-8")
          assert "Første byggefase: v0.1" in archive.read_text(encoding="utf-8")

          original_blob = subprocess.check_output([
              "git", "show", "HEAD:docs/README_HistoryGo_Historiske_Ruter.md"
          ])
          assert hashlib.sha256(original_blob).hexdigest() == hashlib.sha256(archive.read_bytes()).hexdigest()

          changed = set(subprocess.check_output(["git", "diff", "--name-only", "HEAD"]).decode().splitlines())
          expected = {
              "docs/README.md",
              "docs/README_HistoryGo_Historiske_Ruter.md",
              "docs/documentation_registry.json",
              "reports/archive/2026-07/README.md",
              "reports/archive/2026-07/historical-routes/README.md",
              "reports/archive/2026-07/historical-routes/README_HistoryGo_Historiske_Ruter_PRE_CONSOLIDATION_2026-07-26.md",
          }
          assert changed == expected, (changed, expected)
          PY

      - name: Commit consolidation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-documentation-phase-20-historical-routes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/README.md docs/README_HistoryGo_Historiske_Ruter.md docs/documentation_registry.json reports/archive/2026-07/README.md reports/archive/2026-07/historical-routes .github/workflows/temporary-documentation-phase-20-historical-routes.yml
          git commit -m "Konsolider dokumentasjonen for Historiske ruter"
          git push origin HEAD:agent/documentation-governance-phase-20-historical-routes
