name: Temp materialize quiz answer shuffle

on:
  push:
    branches:
      - governance/quiz-answer-shuffle-20260829
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-materialize-quiz-answer-shuffle
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/quiz-answer-shuffle-20260829
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize runtime, governance and tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, content) {
            fs.mkdirSync(require('path').dirname(path), { recursive: true });
            fs.writeFileSync(path, content);
          }
          function replaceOnce(path, from, to, label) {
            const text = read(path);
            const count = text.split(from).length - 1;
            if (count !== 1) throw new Error(`${label}: expected exactly one anchor, found ${count}`);
            write(path, text.replace(from, to));
          }

          write('js/quiz/answer-shuffle.js', `(function (root, factory) {
            "use strict";
            const api = factory();
            if (typeof module === "object" && module && module.exports) module.exports = api;
            if (root) root.HGQuizAnswerShuffle = api;
          })(typeof window !== "undefined" ? window : globalThis, function () {
            "use strict";

            function sourceAnswerIndex(question, options) {
              if (Number.isInteger(question?.answerIndex)) return question.answerIndex;
              return options.findIndex((option) => option === question?.answer);
            }

            function shuffleQuestion(question, rng = Math.random) {
              const sourceOptions = Array.isArray(question?.options)
                ? question.options
                : (Array.isArray(question?.choices) ? question.choices : []);
              const originalOptions = sourceOptions.slice();
              const originalAnswerIndex = sourceAnswerIndex(question, originalOptions);

              if (originalAnswerIndex < 0 || originalAnswerIndex >= originalOptions.length) {
                return { options: originalOptions, answerIndex: originalAnswerIndex };
              }

              const entries = originalOptions.map((option, originalIndex) => ({ option, originalIndex }));
              for (let i = entries.length - 1; i > 0; i -= 1) {
                const raw = Number(rng());
                const bounded = Number.isFinite(raw) ? Math.min(Math.max(raw, 0), 0.9999999999999999) : 0;
                const j = Math.floor(bounded * (i + 1));
                [entries[i], entries[j]] = [entries[j], entries[i]];
              }

              return {
                options: entries.map((entry) => entry.option),
                answerIndex: entries.findIndex((entry) => entry.originalIndex === originalAnswerIndex)
              };
            }

            return Object.freeze({ shuffleQuestion });
          });
          `);

          replaceOnce(
            'js/app.js',
            '    await safeRun("loadHGReads", () => loadScriptOnce("js/hgReads.js"));\n    await safeRun("loadQuizzes", () => loadScriptOnce("js/quizzes.js"));',
            '    await safeRun("loadHGReads", () => loadScriptOnce("js/hgReads.js"));\n    await safeRun("loadQuizAnswerShuffle", () => loadScriptOnce("js/quiz/answer-shuffle.js"));\n    await safeRun("loadQuizzes", () => loadScriptOnce("js/quizzes.js"));',
            'app quiz loader order'
          );

          replaceOnce(
            'js/quizzes.js',
            '    const options = arr(q.options || q.choices);\n    const answerIndex =\n      typeof q.answerIndex === "number"\n        ? q.answerIndex\n        : options.findIndex((o) => o === q.answer);',
            '    const presentation = window.HGQuizAnswerShuffle?.shuffleQuestion?.(q);\n    if (!presentation) throw new Error("HGQuizAnswerShuffle mangler");\n    const options = presentation.options;\n    const answerIndex = presentation.answerIndex;',
            'quiz runtime option rendering'
          );

          write('scripts/audit-quiz-answer-position-bias.mjs', `#!/usr/bin/env node
          import fs from "node:fs";
          import path from "node:path";
          import { execFileSync } from "node:child_process";
          import { pathToFileURL } from "node:url";

          const root = process.cwd();

          export function collectQuestions(value, out = []) {
            if (Array.isArray(value)) {
              for (const item of value) collectQuestions(item, out);
              return out;
            }
            if (!value || typeof value !== "object") return out;
            if ((Array.isArray(value.options) || Array.isArray(value.choices)) && Number.isInteger(value.answerIndex)) {
              out.push(value);
              return out;
            }
            for (const child of Object.values(value)) collectQuestions(child, out);
            return out;
          }

          export function auditQuestionCollection(questions, label = "quiz") {
            const errors = [];
            const indexes = [];
            for (const [offset, question] of questions.entries()) {
              const options = Array.isArray(question.options) ? question.options : question.choices;
              const idx = question.answerIndex;
              const id = question.quiz_id || question.quizId || question.id || `#${offset + 1}`;
              if (!Array.isArray(options) || options.length < 2) {
                errors.push(`${label}: ${id} must have at least two options`);
                continue;
              }
              if (!Number.isInteger(idx) || idx < 0 || idx >= options.length) {
                errors.push(`${label}: ${id} has invalid answerIndex ${idx}`);
                continue;
              }
              if (question.answer !== undefined && options[idx] !== question.answer) {
                errors.push(`${label}: ${id} answerIndex does not point to answer`);
              }
              indexes.push(idx);
            }

            if (indexes.length >= 4 && new Set(indexes).size < 2) {
              errors.push(`${label}: all ${indexes.length} correct answers use the same stored position (${indexes[0]}); distribute answerIndex values`);
            }
            if (indexes.length >= 8) {
              const counts = new Map();
              for (const idx of indexes) counts.set(idx, (counts.get(idx) || 0) + 1);
              const max = Math.max(...counts.values());
              if (max / indexes.length > 0.75) {
                errors.push(`${label}: ${max}/${indexes.length} correct answers use one stored position; positional bias exceeds 75%`);
              }
            }
            return errors;
          }

          function changedQuizFiles(base, head = "HEAD") {
            const output = execFileSync("git", ["diff", "--diff-filter=ACMR", "--name-only", `${base}...${head}`], {
              cwd: root,
              encoding: "utf8"
            });
            return output.split("\\n").map((line) => line.trim()).filter((file) =>
              file.startsWith("data/quiz/") && file.endsWith(".json") && fs.existsSync(path.join(root, file))
            );
          }

          export function auditFiles(files) {
            const errors = [];
            let audited = 0;
            for (const file of files) {
              let data;
              try { data = JSON.parse(fs.readFileSync(path.join(root, file), "utf8")); }
              catch (error) {
                errors.push(`${file}: invalid JSON: ${error.message}`);
                continue;
              }
              const questions = collectQuestions(data);
              if (!questions.length) continue;
              audited += 1;
              errors.push(...auditQuestionCollection(questions, file));
            }
            return { audited, errors };
          }

          function parseArgs(argv) {
            const args = {};
            for (let i = 0; i < argv.length; i += 1) {
              const token = argv[i];
              if (token === "--base" || token === "--head" || token === "--file") args[token.slice(2)] = argv[++i];
            }
            return args;
          }

          function main() {
            const args = parseArgs(process.argv.slice(2));
            const files = args.file ? [args.file] : (args.base ? changedQuizFiles(args.base, args.head || "HEAD") : []);
            if (!args.file && !args.base) throw new Error("Use --base <sha> [--head <sha>] or --file <path>");
            const result = auditFiles(files);
            if (result.errors.length) {
              result.errors.forEach((error) => console.error(`ERROR: ${error}`));
              process.exitCode = 1;
              return;
            }
            console.log(`Quiz answer-position audit PASS (${result.audited} quiz file(s) with questions).`);
          }

          if (process.argv[1] && import.meta.url === pathToFileURL(path.resolve(process.argv[1])).href) {
            try { main(); }
            catch (error) { console.error(`Quiz answer-position audit failed: ${error.message}`); process.exitCode = 1; }
          }
          `);

          write('tests/quiz-answer-shuffle-runtime.test.mjs', `import assert from "node:assert/strict";
          import fs from "node:fs";
          import test from "node:test";
          import { createRequire } from "node:module";

          const require = createRequire(import.meta.url);
          const { shuffleQuestion } = require("../js/quiz/answer-shuffle.js");

          test("shuffle preserves correct answer while remapping its displayed index", () => {
            const question = { options: ["Riktig", "B", "C", "D"], answer: "Riktig", answerIndex: 0 };
            const source = structuredClone(question);
            const values = [0, 0, 0];
            const shuffled = shuffleQuestion(question, () => values.shift() ?? 0);
            assert.deepEqual(question, source, "canonical question data must not be mutated");
            assert.deepEqual([...shuffled.options].sort(), [...question.options].sort());
            assert.equal(shuffled.options[shuffled.answerIndex], "Riktig");
            assert.notEqual(shuffled.answerIndex, 0, "controlled shuffle must move the first-slot answer");
          });

          test("shuffle can resolve answer index from answer text", () => {
            const shuffled = shuffleQuestion({ options: ["A", "B", "C"], answer: "B" }, () => 0);
            assert.equal(shuffled.options[shuffled.answerIndex], "B");
          });

          test("quiz runtime loads shuffler first and renders shuffled presentation", () => {
            const app = fs.readFileSync("js/app.js", "utf8");
            const runtime = fs.readFileSync("js/quizzes.js", "utf8");
            assert.ok(app.indexOf("js/quiz/answer-shuffle.js") < app.indexOf("js/quizzes.js"));
            assert.match(runtime, /HGQuizAnswerShuffle\?\.shuffleQuestion\?\.\(q\)/);
            assert.doesNotMatch(runtime, /const options = arr\(q\.options \|\| q\.choices\);\n\s*const answerIndex/);
          });
          `);

          write('tests/quiz-answer-position-governance.test.mjs', `import assert from "node:assert/strict";
          import test from "node:test";
          import { auditQuestionCollection, collectQuestions } from "../scripts/audit-quiz-answer-position-bias.mjs";

          const q = (idx, n = 4) => ({
            id: `q_${idx}_${Math.random()}`,
            options: Array.from({ length: n }, (_, i) => `o${i}`),
            answerIndex: idx,
            answer: `o${idx}`
          });

          test("recursive collector finds set questions", () => {
            const data = { sets: [{ questions: [q(0), q(1)] }] };
            assert.equal(collectQuestions(data).length, 2);
          });

          test("fixed first-slot quiz is rejected", () => {
            const errors = auditQuestionCollection(Array.from({ length: 7 }, () => q(0)), "fixture");
            assert.ok(errors.some((error) => error.includes("same stored position")));
          });

          test("distributed answer positions pass", () => {
            const questions = Array.from({ length: 14 }, (_, i) => q(i % 4));
            assert.deepEqual(auditQuestionCollection(questions, "fixture"), []);
          });

          test("answerIndex integrity remains mandatory", () => {
            const broken = Array.from({ length: 4 }, (_, i) => q(i % 2));
            broken[0].answer = "not-the-indexed-answer";
            assert.ok(auditQuestionCollection(broken, "fixture").some((error) => error.includes("does not point to answer")));
          });
          `);

          // Canonical quiz policy: version bump + explicit runtime and authoring invariant.
          let quizDoc = read('data/quiz/regler/QUIZ_PRODUCTION_CANONICAL.md');
          quizDoc = quizDoc.replace('**Versjon:** 3.3', '**Versjon:** 3.4');
          const section8 = '\n## 8.';
          const pos = quizDoc.indexOf(section8);
          if (pos < 0) throw new Error('quiz canonical section 8 anchor missing');
          const rule = `\n### 7.1 Svarrekkefølge og posisjonsbias — obligatorisk shuffle\n\nLagret \`answerIndex\` dokumenterer hvilket alternativ som er korrekt i canonical data. Det er **ikke** en instruks om hvor det riktige svaret skal vises.\n\n- Quizruntime skal lage en ny kopi av svaralternativene og shuffle dem for hvert vist spørsmål i hvert quizforsøk.\n- Når alternativene shuffles, skal korrekt indeks remappes til den nye visningsrekkefølgen før brukerens valg vurderes.\n- Runtime skal aldri mutere \`options\`, \`answer\` eller \`answerIndex\` i canonical quizdata.\n- Nye og reviderte quizfiler skal fordele lagrede \`answerIndex\`-posisjoner og kan ikke legge alle eller nesten alle riktige svar i samme slot. Første alternativ skal spesielt aldri brukes som systematisk fasitposisjon.\n- Det er tillatt at et enkelt spørsmål tilfeldig får samme visningsposisjon som i kildefilen etter shuffle. Kravet gjelder at presentasjonen faktisk randomiseres, ikke at en bestemt posisjon forbys.\n- Å flytte alle riktige svar til en annen fast posisjon er ikke en løsning; både produksjonsdata og runtime skal være fri for systematisk posisjonsmønster.\n\nCI skal stoppe nye eller endrede quizfiler med fast eller ekstremt konsentrert lagret fasitposisjon, i tillegg til å kontrollere at \`answerIndex\` fortsatt peker på \`answer\`.\n`;
          quizDoc = quizDoc.slice(0, pos) + rule + quizDoc.slice(pos);
          write('data/quiz/regler/QUIZ_PRODUCTION_CANONICAL.md', quizDoc);

          replaceOnce(
            'scripts/place-production-rule-preflight.mjs',
            '  "docs/PLACE_PRODUCTION_PROFILES.md",\n  "data/places/README_place_rounds.md",',
            '  "docs/PLACE_PRODUCTION_PROFILES.md",\n  "data/quiz/regler/QUIZ_PRODUCTION_CANONICAL.md",\n  "data/places/README_place_rounds.md",',
            'READ-FIRST quiz rule registration'
          );

          // Route runtime + audit changes to the existing quiz-governance CI job.
          let dataChecks = read('.github/workflows/data-checks.yml');
          const pathAnchor = "      - 'data/quiz/**'\n";
          if (!dataChecks.includes(pathAnchor)) throw new Error('data-checks path anchor missing');
          dataChecks = dataChecks.replace(pathAnchor, pathAnchor + "      - 'js/quizzes.js'\n      - 'js/quiz/answer-shuffle.js'\n      - 'scripts/audit-quiz-answer-position-bias.mjs'\n      - 'tests/quiz-answer-shuffle-runtime.test.mjs'\n      - 'tests/quiz-answer-position-governance.test.mjs'\n");
          const scopeAnchor = '              data/quiz/*|scripts/audit-quiz-*|scripts/build-quiz-production-context.mjs|scripts/quiz-production-lib.mjs|tests/quiz-*|tests/quiz-content-quality-audit.test.mjs)';
          if (!dataChecks.includes(scopeAnchor)) throw new Error('data-checks quiz scope anchor missing');
          dataChecks = dataChecks.replace(scopeAnchor, '              data/quiz/*|js/quizzes.js|js/quiz/*|scripts/audit-quiz-*|scripts/build-quiz-production-context.mjs|scripts/quiz-production-lib.mjs|tests/quiz-*|tests/quiz-content-quality-audit.test.mjs)');
          const testAnchor = '          npm run test:quiz-content-audit\n          npm run test:quiz-production\n';
          if (!dataChecks.includes(testAnchor)) throw new Error('data-checks quiz test anchor missing');
          dataChecks = dataChecks.replace(testAnchor, `          npm run test:quiz-content-audit\n          npm run test:quiz-production\n          node --test tests/quiz-answer-shuffle-runtime.test.mjs tests/quiz-answer-position-governance.test.mjs\n          if [ "\\${{ github.event_name }}" = "pull_request" ]; then\n            node scripts/audit-quiz-answer-position-bias.mjs --base "\\${{ github.event.pull_request.base.sha }}" --head "\\${{ github.event.pull_request.head.sha }}"\n          fi\n`);
          write('.github/workflows/data-checks.yml', dataChecks);
          NODE

      - name: Validate materialized quiz contract
        shell: bash
        run: |
          set -euo pipefail
          node --check js/quizzes.js
          node --check js/quiz/answer-shuffle.js
          node --check scripts/audit-quiz-answer-position-bias.mjs
          node --check scripts/place-production-rule-preflight.mjs
          node --test tests/quiz-answer-shuffle-runtime.test.mjs tests/quiz-answer-position-governance.test.mjs tests/place-production-rule-preflight.test.mjs
          git diff --check

      - name: Commit permanent changes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-materialize-quiz-answer-shuffle.yml
          git config user.name "History Go automation"
          git config user.email "paradispartiet@gmail.com"
          git add js/app.js js/quizzes.js js/quiz/answer-shuffle.js \
            data/quiz/regler/QUIZ_PRODUCTION_CANONICAL.md \
            scripts/audit-quiz-answer-position-bias.mjs \
            scripts/place-production-rule-preflight.mjs \
            tests/quiz-answer-shuffle-runtime.test.mjs \
            tests/quiz-answer-position-governance.test.mjs \
            .github/workflows/data-checks.yml \
            .github/workflows/temp-materialize-quiz-answer-shuffle.yml
          git commit -m "Shuffle quiz answers and block positional bias"
          git push origin HEAD:governance/quiz-answer-shuffle-20260829
