name: Temp materialize quiz answer shuffle

on:
  push:
    branches:
      - governance/quiz-answer-shuffle-20260829
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-materialize-quiz-answer-shuffle
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/quiz-answer-shuffle-20260829
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize and validate global quiz shuffle
        run: bash tools/temp-materialize-quiz-answer-shuffle.sh
