name: Kvadraturen Krigsskolen final normal-quiz gates and release
on:
  push:
    branches:
      - research/oslo-sentrum-kvadraturen-v1-six-20261023
    paths:
      - '.github/workflows/kvadraturen-krigsskolen-final-gates-temp.yml'
permissions:
  contents: write
concurrency:
  group: krigsskolen-final-gates
  cancel-in-progress: false
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-kvadraturen-v1-six-20261023
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install canonical tools
        run: |
          npm ci --no-audit --no-fund
          npm run build:scripts
      - name: Rebuild canonical production context and Knowledge after editorial taxonomy correction
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import {buildQuizProductionContext} from './scripts/quiz-production-lib.mjs';
          const c=await buildQuizProductionContext({categoryId:'historie',targetId:'den_gamle_krigsskolen'});
          assert.equal(c.claim_bank.length,21);
          assert.deepEqual(c.question_balance.counts,{fact:12,context:5,concept_theory:4});
          await fs.writeFile('data/quiz/production_context/historie/den_gamle_krigsskolen.json',JSON.stringify(c,null,2)+'\n');
          NODE
          node dist/scripts/knowledge-canonical-data.mjs --write
          node dist/scripts/knowledge-canonical-data.mjs --check
      - name: Run existing full QuizProduction/progression/theory/Place gates
        run: |
          node scripts/audit-quiz-production-context.mjs
          node scripts/audit-quiz-progression.mjs
          node scripts/audit-quiz-theory-binding.mjs
          node tests/oslo-sentrum-kvadraturen-six-research-preflight.mjs
      - name: Rebuild Fagverk release after final Knowledge output
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit only Krigsskolen canonical outputs and derived Knowledge/release
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only >/tmp/kv-change
          cat /tmp/kv-change
          grep -Ev '^(data/quiz/historie/den_gamle_krigsskolen_sets.json|data/quiz/production_context/historie/den_gamle_krigsskolen.json|data/knowledge/knowledge_units.generated.json|reports/knowledge-id-backfill.json|data/fagverk/fagverk_release.json)$' /tmp/kv-change >/tmp/other || true
          test ! -s /tmp/other || { cat /tmp/other; exit 1; }
          git add data/quiz/historie/den_gamle_krigsskolen_sets.json data/quiz/production_context/historie/den_gamle_krigsskolen.json data/knowledge/knowledge_units.generated.json reports/knowledge-id-backfill.json data/fagverk/fagverk_release.json
          if git diff --cached --quiet; then echo 'Already synchronized'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Rebuild canonical Knowledge and Fagverk release after Krigsskolen taxonomy QA'
          git push origin HEAD:research/oslo-sentrum-kvadraturen-v1-six-20261023
# Rerun with canonical source-critical emne binding for question 21
