name: Kvadraturen Krigsskolen final normal-quiz gates and release
on:
  push:
    branches:
      - research/oslo-sentrum-kvadraturen-v1-six-20261023
    paths:
      - '.github/workflows/kvadraturen-krigsskolen-final-gates-temp.yml'
permissions:
  contents: write
concurrency:
  group: krigsskolen-final-gates
  cancel-in-progress: false
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-kvadraturen-v1-six-20261023
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
      - name: Guard official QuizProduction, normal opening and theory binding
        run: |
          node scripts/audit-quiz-production-context.mjs
          node scripts/audit-quiz-progression.mjs
          node scripts/audit-quiz-theory-binding.mjs
          node tests/oslo-sentrum-kvadraturen-six-research-preflight.mjs
      - name: Build and verify deterministic Fagverk release
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit only canonical regenerated release
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | grep -v '^data/fagverk/fagverk_release.json$' >/tmp/other || true
          test ! -s /tmp/other || { cat /tmp/other; exit 1; }
          git add data/fagverk/fagverk_release.json
          if git diff --cached --quiet; then echo 'Release already synchronized'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh canonical Fagverk release after normal Krigsskolen opening taxonomy fix'
          git push origin HEAD:research/oslo-sentrum-kvadraturen-v1-six-20261023
