name: Oslo Blå skilt 2026 round content finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-bla-skilt-2026-round-content-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply curated round content and documentation rules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/oslo-bla-skilt-2026-round-content/validation
          node tools/finalize-oslo-blue-plaques-2026-round-content.mjs \
            | tee reports/oslo-bla-skilt-2026-round-content/validation/finalizer.txt

      - name: Build and validate place runtime
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-bla-skilt-2026-round-content/validation'
          npm run places:index:build | tee "$outdir/places-index-build.txt"
          npm run places:index:check | tee "$outdir/places-index-check.txt"
          npm run places:coords:intake | tee "$outdir/coordinate-intake.txt"
          npm run places:emner:check | tee "$outdir/emne-check.txt"
          npm run audit:places-split-manifest-sync | tee "$outdir/split-manifest-sync.txt"
          npm run test:coordinate-source-contract | tee "$outdir/coordinate-source-contract.txt"

      - name: Validate PlaceCard round runtime
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-bla-skilt-2026-round-content/validation'
          node tests/place-card-rounds-runtime-audit.test.js | tee "$outdir/place-card-rounds-runtime.txt"
          node tests/oslo-blue-plaques-2026-round-content.test.js | tee "$outdir/blue-plaques-round-content.txt"

      - name: Validate People of Places
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-bla-skilt-2026-round-content/validation'
          npm run audit:people-of-places | tee "$outdir/people-of-places.txt"
          git restore --source=HEAD -- reports/people-of-places-status.json reports/people-of-places-status.md 2>/dev/null || true

      - name: Capture place health and reject findings on the five places
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-bla-skilt-2026-round-content/validation'
          set +e
          npm run health:places | tee "$outdir/health-places.txt"
          status=${PIPESTATUS[0]}
          set -e
          echo "health_exit_status=$status" | tee "$outdir/health-status.txt"
          if grep -Ei '(error|warning).*bla_skilt_(aud_schonemann|stein_mehren|christopher_hornsrud|helverschous|enerhaugen)|bla_skilt_(aud_schonemann|stein_mehren|christopher_hornsrud|helverschous|enerhaugen).*(error|warning)' "$outdir/health-places.txt"; then
            echo 'New blue-plaque round content produced a health error/warning' >&2
            exit 1
          fi
          echo 'No health error/warning references any of the five blue-plaque ids' | tee -a "$outdir/health-status.txt"

      - name: Check diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check | tee reports/oslo-bla-skilt-2026-round-content/validation/git-diff-check.txt

      - name: Remove temporary tooling and persist finalization
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/oslo-bla-skilt-2026-round-content-finalize.yml
          rm -f tools/finalize-oslo-blue-plaques-2026-round-content.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Fill Oslo blue plaque PlaceCard rounds'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
