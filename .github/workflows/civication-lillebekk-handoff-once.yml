name: Civication Lillebekk evidence handoff materialization (one-shot)
on:
  push:
    branches:
      - civication/lillebekk-evidence-handoff-20261105
    paths:
      - .github/workflows/civication-lillebekk-handoff-once.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile canonical scene and compatibility registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Audit career matrix and readiness
        run: |
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify real early-to-formal decision handoff
        run: node tests/civication-by-radgiver-lillebekk-evidence-handoff.test.js
      - name: Verify prior formal governance and first phase are preserved
        run: |
          node tests/civication-by-radgiver-lillebekk-early-work-case.test.js
          node tests/civication-by-radgiver-lillebekk-followup-continuity.test.js
          node tests/civication-by-radgiver-role-world-realism-pilot.test.js
      - name: Commit regenerated indexes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/compiledSceneRegistryV1.json data/Civication/careerGameplayMatrix.json data/Civication/roleWorldRolloutReadiness.json
          if ! git diff --cached --quiet; then
            git commit -m "Materialize source-grounded Lillebekk case handoff"
            git push origin HEAD:civication/lillebekk-evidence-handoff-20261105
          fi
