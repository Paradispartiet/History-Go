name: Gråbein generated artifacts one-shot
on:
  push:
    branches:
      - place/museumsleiligheten-grabein-production-20261009
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'Paradispartiet/History-Go' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate canonical artifacts
        run: |
          node scripts/build-quiz-production-context.mjs --category historie --target museumsleiligheten_grabein --output data/quiz/production_context/historie/museumsleiligheten_grabein.json
          node scripts/build-place-open-payloads.mjs
          node scripts/build-epoke-place-index.mjs
          node scripts/build-fagverk-release-manifest.mjs
      - name: Commit only Gråbein and derived canonical artifacts
        run: |
          git add -- data/quiz/production_context/historie/museumsleiligheten_grabein.json data/runtime/place-open/museumsleiligheten_grabein.json data/epoker/epoke-place-index.json data/fagverk/fagverk_release.json
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Already synchronized"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate Gråbein quiz context, Place-open, epoch index and Fagverk release'
          git push origin HEAD:refs/heads/place/museumsleiligheten-grabein-production-20261009
