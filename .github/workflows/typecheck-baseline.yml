name: Typecheck baseline report

on:
  pull_request:
    paths:
      - 'js/Civication/**'
      - 'tests/**civication**'
      # The two read-only theory tests are handled by Psykoteori CI.
      - '!tests/civication-psychology-room-theory.test.js'
      - '!tests/civication-psychology-room-coverage.test.js'
      - 'tests/civication/**'
      - 'tools/typecheck-baseline-report.mts'
      - 'tools/audit-civication-*.mts'
      - 'scripts/**civication**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Print Node/npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check Civication UI
        run: node --check js/Civication/ui/CivicationUI.js

      - name: Syntax check Civication Event Engine
        run: node --check js/Civication/core/civicationEventEngine.js

      - name: Generate typecheck baseline report
        run: npm run typecheck:report

      - name: Print report summary
        if: always()
        run: sed -n '1,90p' reports/typecheck-baseline-report.md

      - name: Upload typecheck baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-baseline-report
          path: reports/typecheck-baseline-report.md
