name: Typecheck baseline report

on:
  pull_request:
    paths:
      - 'js/Civication/**'
      - 'tests/**civication**'
      - 'tests/civication/**'
      - 'tools/typecheck-baseline-report.mts'
      - 'tools/audit-civication-*.mts'
      - 'scripts/**civication**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/typecheck-baseline.yml'
  workflow_dispatch:

jobs:
  typecheck-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Print Node/npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check Civication UI
        run: node --check js/Civication/ui/CivicationUI.js

      - name: Syntax check Civication Event Engine
        run: node --check js/Civication/core/civicationEventEngine.js

      - name: Run Civication outcome tests
        run: npm run test:civication

      - name: Run Civication map tests
        run: npm run test:civication-map

      - name: Audit Civication History Go place mapping
        continue-on-error: true
        run: npm run audit:civication-place-mapping

      - name: Audit Civication city map entries
        continue-on-error: true
        run: npm run audit:civication-city-map-entries

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Civication boot smoke test
        run: npm run civication:boot-smoke

      - name: Generate typecheck baseline report
        run: npm run typecheck:report

      - name: Print report summary
        if: always()
        run: sed -n '1,90p' reports/typecheck-baseline-report.md

      - name: Upload typecheck baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-baseline-report
          path: reports/typecheck-baseline-report.md
