name: TEMP Materialize Film/TV Regissør Role World

on:
  push:
    branches:
      - agent/civication-film-tv-regissor-role-world-rollout
    paths:
      - scripts/TEMP_materialize_regissor_role_world.mjs
      - tests/civication-film-tv-regissor-role-world-rollout.test.js
      - .github/workflows/TEMP-civication-regissor-role-world-materialize.yml

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-film-tv-regissor-role-world-rollout
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize world-only authored data
        run: node scripts/TEMP_materialize_regissor_role_world.mjs
      - name: Normalize Regissør theme profile to canonical bank
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const worldPath = 'data/Civication/roleWorlds/film_tv/regissor.json';
          const themePath = 'data/Civication/roleWorldThemeBank.json';
          const world = JSON.parse(fs.readFileSync(worldPath, 'utf8'));
          const bank = JSON.parse(fs.readFileSync(themePath, 'utf8'));
          if (!world.theme_ids.includes('gender_sexuality')) throw new Error('Expected TEMP theme id not found');
          world.theme_ids = world.theme_ids.map(id => id === 'gender_sexuality' ? 'class_power' : id);
          if (new Set(world.theme_ids).size !== world.theme_ids.length) throw new Error('Theme normalization created duplicate id');
          const allowed = new Set((bank.themes || []).map(theme => theme.id));
          for (const id of world.theme_ids) if (!allowed.has(id)) throw new Error(`Unknown canonical Role World theme: ${id}`);
          bank.reference_profiles = bank.reference_profiles || {};
          bank.reference_profiles['film_tv/regissor'] = world.theme_ids;
          fs.writeFileSync(worldPath, JSON.stringify(world, null, 2) + '\n');
          fs.writeFileSync(themePath, JSON.stringify(bank, null, 2) + '\n');
          NODE
      - name: Make Programleder completion assertion progression-safe
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const testPath = 'tests/civication-film-tv-programleder-role-world-rollout.test.js';
          const source = fs.readFileSync(testPath, 'utf8');
          const stale = "assert.equal(readiness.rollout_queue[0].key, 'film_tv/regissor');";
          const replacement = [
            "const readinessRole = readiness.roles.find(row => row.key === KEY);",
            "assert.ok(readinessRole, 'completed role must remain classified by readiness');",
            "assert.equal(readinessRole.runtime_gate, true, 'completed Programleder must keep its runtime gate');",
            "assert.equal(readiness.gate.gate_pass, true, 'program-level readiness gate must remain green');",
            "assert.notEqual(readiness.rollout_queue[0]?.key, KEY, 'completed role cannot return to rollout head');"
          ].join('\n');
          if (!source.includes(stale)) throw new Error('Expected stale Programleder queue assertion not found');
          fs.writeFileSync(testPath, source.replace(stale, replacement));
          NODE
      - name: Regenerate scene registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Regenerate career gameplay audit
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Regenerate rollout readiness
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify focused rollout and canonical gates
        run: |
          node tests/civication-film-tv-regissor-role-world-rollout.test.js
          node tests/civication-film-tv-programleder-role-world-rollout.test.js
          node tests/civication-role-world-contract.test.js
          node tests/civication-role-world-broad-rollout-policy.test.js
          node scripts/build-civication-scene-registry.mjs --check
          node scripts/audit-civication-career-gameplay.mjs --check
          node scripts/audit-civication-role-world-rollout-readiness.mjs --check
      - name: Run full Civication suite
        run: npm run test:civication
      - name: Remove temporary materialization surface
        run: |
          rm scripts/TEMP_materialize_regissor_role_world.mjs
          rm .github/workflows/TEMP-civication-regissor-role-world-materialize.yml
      - name: Commit exact verified result
        run: |
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Film/TV Regissør Role World rollout"
          git push origin HEAD:agent/civication-film-tv-regissor-role-world-rollout
