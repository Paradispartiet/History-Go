name: Map web bundle repair (one-shot)
on:
  push:
    branches:
      - fix/main-integrity-map-bundle-20261103
    paths:
      - reports/maintenance/map-build-trigger-20261103.txt

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/main-integrity-map-bundle-20261103
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build map bundle and commit only generated artifact
        shell: bash
        run: |
          set -euo pipefail
          npm run build:web
          if git diff --quiet -- dist/web/map.js; then
            echo "Map bundle already matches source"
          else
            git add dist/web/map.js
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/map-bundle-one-shot-20261103.yml reports/maintenance/map-build-trigger-20261103.txt
          git diff --cached --stat
          git commit -m "build(map): synchronize generated web bundle on main integrity follow-up"
          git push origin HEAD:refs/heads/fix/main-integrity-map-bundle-20261103
