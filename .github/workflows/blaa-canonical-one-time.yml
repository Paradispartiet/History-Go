name: Blå one-time generated data synchronization
# Rerun on corrected Knowledge claim IDs; job is scoped to this branch.
on:
  push:
    branches:
      - content/blaa-v1-fagverk-people-quiz-20261102
    paths:
      - .github/workflows/blaa-canonical-one-time.yml
permissions:
  contents: write
concurrency:
  group: blaa-generated-onetime
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate Place-open, Fagverk release, Knowledge and diagnostics
        run: |
          npm run place-open:build
          node scripts/build-fagverk-release-manifest.mjs
          npm run knowledge:canonical:write
      - name: Commit only relevant generated artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/place-open/blaa.json data/runtime/people-all data/runtime/people-all.json data/fagverk/fagverk_release.json data/quiz/musikk/blaa_sets_merged.json data/knowledge/knowledge_units.generated.json reports/knowledge-id-backfill.json
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Blå: synchronize generated Place-open People Knowledge and Fagverk release"
            for attempt in 1 2 3; do
              git fetch origin content/blaa-v1-fagverk-people-quiz-20261102
              git rebase origin/content/blaa-v1-fagverk-people-quiz-20261102
              if git push origin HEAD:content/blaa-v1-fagverk-people-quiz-20261102; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
