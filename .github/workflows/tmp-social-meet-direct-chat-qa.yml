name: Social Meet private chat QA (temporary)
on:
  push:
    branches:
      - codex/social-meet-aha-private-chat-v1
  workflow_dispatch:
jobs:
  social-meet-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Social Meet existing and new UI contract tests
        run: |
          node tests/hg-social-meet-aha-private-chat.test.js
          node tests/hg-social-meet-ui-backend.test.js
          node tests/hg-social-meet-status-actions.test.js
          node tests/social-meet-fastapi-adapter.test.js
          node tests/hg-social-surface-contract.test.js
