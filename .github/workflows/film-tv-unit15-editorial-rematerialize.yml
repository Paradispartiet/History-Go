name: Rematerialize Film TV Unit15 editorial prose

on:
  push:
    branches:
      - agent/film-tv-unit15-cultural-heritage-canon-stars-memory-fulltext
    paths:
      - .github/workflows/film-tv-unit15-editorial-rematerialize.yml

permissions:
  contents: write

concurrency:
  group: film-tv-unit15-editorial-rematerialize
  cancel-in-progress: true

jobs:
  rematerialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-tv-unit15-cultural-heritage-canon-stars-memory-fulltext
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Reconcile stale predecessor completion gates
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('scripts/reaudit-film-tv-existing-chapters-v1.mjs'),
              Path('scripts/plan-film-tv-learning-order-v1.mjs'),
          ]
          old = '(?:source_brief_complete_full_chapter_production|full_chapter_complete_next_unit_source_brief)$'
          new = '(?:source_brief_complete_full_chapter_production|full_chapter_complete_next_unit_source_brief|full_chapter_complete_completion_audit)$'
          changed = []
          for path in files:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one stale completion-gate regex, found {count}')
              path.write_text(text.replace(old, new))
              changed.append(str(path))
          print('Reconciled predecessor gates:')
          for path in changed:
              print(f'- {path}')
          PY

      - name: Validate editor and predecessor syntax
        run: |
          node --check scripts/reaudit-film-tv-existing-chapters-v1.mjs
          node --check scripts/plan-film-tv-learning-order-v1.mjs
          node --check scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs
          node --check scripts/audit-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs

      - name: Materialize revised Unit15 editorial corpus
        run: |
          node scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs
          node scripts/audit-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs --write

      - name: Validate revised editorial and predecessor contracts
        run: |
          node scripts/audit-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs --check
          node tests/film-tv-final-gate-monotonicity-v1.test.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-film-tv-phase3.mjs
          node scripts/audit-film-tv-curriculum-completeness-v1.mjs
          node scripts/audit-film-tv-variable-inventory-v1.mjs
          node scripts/reaudit-film-tv-existing-chapters-v1.mjs
          node scripts/plan-film-tv-learning-order-v1.mjs
          node --test tests/film-tv-variable-inventory-v1.test.mjs
          node --test tests/film-tv-existing-chapter-reaudit-v1.test.mjs
          node --test tests/film-tv-learning-order-plan-v1.test.mjs
          node --test tests/fagverk-film-tv-phase3.test.mjs
          node --test tests/film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.test.mjs
          node --test tests/film-tv-cultural-heritage-canon-stars-memory-registry-v1.test.mjs
          node --test tests/film-tv-unit15-fulltext-predecessor-monotonicity-v1.test.mjs
          node scripts/build-fagverk-release-manifest.mjs --check

      - name: Commit only verified outputs and permanent reconciliation
        run: |
          rm .github/workflows/film-tv-unit15-editorial-rematerialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/reaudit-film-tv-existing-chapters-v1.mjs \
            scripts/plan-film-tv-learning-order-v1.mjs \
            data/fagverk/film_tv/kulturarv-kanon-stjerner-og-minne.json \
            data/fagverk/film_tv/kulturarv-kanon-stjerner-og-minne \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_status.json \
            reports/fagverk/film-tv-cultural-heritage-canon-stars-memory-fulltext-v1-audit.json \
            .github/workflows/film-tv-unit15-editorial-rematerialize.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No verified output changes"; exit 1; } || true
          git commit -m "Reconcile Unit15 predecessors and rematerialize editorial prose"
          git push origin HEAD:agent/film-tv-unit15-cultural-heritage-canon-stars-memory-fulltext
