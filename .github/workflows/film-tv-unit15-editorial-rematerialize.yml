name: Diagnose Film TV Unit15 sentence repetition

on:
  push:
    branches:
      - agent/film-tv-unit15-cultural-heritage-canon-stars-memory-fulltext
    paths:
      - .github/workflows/film-tv-unit15-editorial-rematerialize.yml

permissions:
  contents: read

concurrency:
  group: film-tv-unit15-editorial-finalize
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-tv-unit15-cultural-heritage-canon-stars-memory-fulltext
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Patch source-role variation in workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs')
          text = path.read_text()
          start = text.index('function sourceRoleSentence(sourceRows, index) {')
          end = text.index('\nfunction methodSentence', start)
          lines = [
              'function sourceRoleSentence(sourceRows, index) {',
              '  const roles = sourceRows.map((row) => `${labelSource(row)} er en ${sourceKind(row)} med relevans for ${clean(row.territory)}`);',
              '  const leads = [',
              "    'Kildenes roller er forskjellige',",
              "    'Det er viktig å holde kildetypene fra hverandre',",
              "    'Kildekritisk må materialet vektes etter funksjon',",
              "    'Dokumentene har ulik bevisverdi',",
              "    'Kildene må leses ut fra institusjonell og faglig funksjon',",
              "    'Evidensstyrken avhenger av hvilken rolle hver kilde faktisk spiller',",
              "    'Samme påstand bæres her av kilder med ulike oppgaver',",
              "    'Kildekombinasjonen krever at autoritet og funksjon skilles',",
              "    'Hvert dokument bidrar på sin egen måte til kontrollen',",
              "    'Trianguleringen virker bare når kildenes funksjoner holdes fra hverandre',",
              "    'Kildekritikken begynner med å skille dokumenttype fra påstandsstyrke',",
              "    'Evidensgrunnlaget blir mer presist når hver kildes rolle navngis'",
              '  ];',
              '  const lead = leads[index % leads.length];',
              "  return `${lead}: ${roles.join('; ')}`;",
              '}',
          ]
          path.write_text(text[:start] + '\n'.join(lines) + '\n' + text[end:])
          PY
          node --check scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs
          node scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs

      - name: Report exact repeated sentences
        run: |
          python - <<'PY'
          import json, re
          from collections import Counter, defaultdict
          from pathlib import Path

          base = Path('data/fagverk/film_tv/kulturarv-kanon-stjerner-og-minne')
          files = [
              base / '01-kulturarv-kanon-og-motarkiv.json',
              base / '02-stjerner-kanonmakt-og-kollektiv-referanse.json',
              base / '03-kult-nostalgi-og-kulturell-varighet.json',
              base / '04-sitat-stjerneapparat-og-tv-minne.json',
          ]
          counts = Counter()
          samples = {}
          locations = defaultdict(list)
          for file in files:
              doc = json.loads(file.read_text())
              for section in doc.get('sections', []):
                  for pidx, paragraph in enumerate(section.get('paragraphs', []), 1):
                      for raw in re.split(r'(?<=[.!?])\s+', paragraph):
                          key = re.sub(r'\s+', ' ', re.sub(r'[«»“”"\']', '', raw)).strip().lower()
                          if len(key) < 70:
                              continue
                          counts[key] += 1
                          samples.setdefault(key, raw.strip())
                          locations[key].append(f'{file.name}:{section.get("id")}#{pidx}')
          repeated = [(n, key) for key, n in counts.items() if n > 2]
          repeated.sort(reverse=True)
          if not repeated:
              print('No sentence repeated more than twice.')
              raise SystemExit(0)
          for n, key in repeated[:20]:
              msg = f'{samples[key]} | locations: {", ".join(locations[key][:8])}'
              msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Repeated sentence x{n}::{msg}')
          raise SystemExit(1)
          PY
