name: Validate Film TV Unit15 editorial fulltext

on:
  push:
    branches:
      - agent/film-tv-unit15-cultural-heritage-canon-stars-memory-fulltext
    paths:
      - .github/workflows/film-tv-unit15-editorial-rematerialize.yml

permissions:
  contents: write

concurrency:
  group: film-tv-unit15-editorial-finalize
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-tv-unit15-cultural-heritage-canon-stars-memory-fulltext
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Repair Unit15 editorial repetition and predecessor gates
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs')
          text = path.read_text()
          lower_start = text.index('const lowerFirst = (value) => {')
          lower_end = text.index('\nconst sentence =', lower_start)
          lower_lines = [
              "const inlineText = (value) => noTerminal(value).replace(/([.!?])\\s+/gu, '; ').trim();",
              'const lowerFirst = (value) => {',
              '  const text = inlineText(value);',
              "  return text ? text.charAt(0).toLocaleLowerCase('nb-NO') + text.slice(1) : text;",
              '};',
          ]
          text = text[:lower_start] + '\n'.join(lower_lines) + text[lower_end:]
          token = '${clean(q)}'
          if text.count(token) != 4:
              raise SystemExit(f'expected 4 clean(q) insertions, found {text.count(token)}')
          text = text.replace(token, '${inlineText(q)}')
          role_start = text.index('function sourceRoleSentence(sourceRows, index) {')
          role_end = text.index('\nfunction methodSentence', role_start)
          role_lines = [
              'function sourceRoleSentence(sourceRows, index, sectionTitle) {',
              '  const roles = sourceRows.map((row) => `${labelSource(row)} er en ${sourceKind(row)} med relevans for ${clean(row.territory)}`);',
              '  const leads = [',
              "    'Kildenes roller er forskjellige',",
              "    'Det er viktig å holde kildetypene fra hverandre',",
              "    'Kildekritisk må materialet vektes etter funksjon',",
              "    'Dokumentene har ulik bevisverdi',",
              "    'Kildene må leses ut fra institusjonell og faglig funksjon',",
              "    'Evidensstyrken avhenger av hvilken rolle hver kilde faktisk spiller',",
              "    'Samme påstand bæres her av kilder med ulike oppgaver',",
              "    'Kildekombinasjonen krever at autoritet og funksjon skilles',",
              "    'Hvert dokument bidrar på sin egen måte til kontrollen',",
              "    'Trianguleringen virker bare når kildenes funksjoner holdes fra hverandre',",
              "    'Kildekritikken begynner med å skille dokumenttype fra påstandsstyrke',",
              "    'Evidensgrunnlaget blir mer presist når hver kildes rolle navngis'",
              '  ];',
              '  const lead = leads[index % leads.length];',
              "  return `${lead}: ${roles.join('; ')}; denne kildevektingen gjelder ${clean(sectionTitle).toLocaleLowerCase('nb-NO')}`;",
              '}',
          ]
          text = text[:role_start] + '\n'.join(role_lines) + text[role_end:]
          case_start = text.index('function caseSentence(caseRow, index) {')
          case_end = text.index('\nfunction buildEditorialParagraph', case_start)
          case_lines = [
              'function caseSentence(caseRow, index, sectionTitle) {',
              "  const context = `; caset brukes her som prøvepunkt for ${clean(sectionTitle).toLocaleLowerCase('nb-NO')}`;",
              '  if (!caseRow) {',
              '    const variants = [',
              "      'Her finnes ikke ett enkelt case som kan bære slutningen; kildekjeden og den historiske konteksten må derfor gjøre hele evidensarbeidet',",
              "      'Fraværet av et selvstendig case gjør kildekritikken viktigere: slutningen må kunne rekonstrueres direkte fra de navngitte dokumentene',",
              "      'Ingen enkelt case får fungere som snarvei; vurderingen må i stedet bygges fra daterte kilder og eksplisitt kontekst'",
              '    ];',
              '    return `${variants[index % variants.length]}${context}`;',
              '  }',
              '  return `${CASE_LEADS[index % CASE_LEADS.length](caseRow)}${context}`;',
              '}',
          ]
          text = text[:case_start] + '\n'.join(case_lines) + text[case_end:]
          old_source_lead = '  const sourceLead = SOURCE_LEADS[globalIndex % SOURCE_LEADS.length](labels);'
          new_source_lead = "  const sourceLead = `${SOURCE_LEADS[globalIndex % SOURCE_LEADS.length](labels)}; dette kildevalget gjelder ${clean(section.title).toLocaleLowerCase('nb-NO')}`;"
          if text.count(old_source_lead) != 1:
              raise SystemExit('sourceLead assignment not found exactly once')
          text = text.replace(old_source_lead, new_source_lead)
          text = text.replace('  const sourceRole = sourceRoleSentence(sourceRows, globalIndex);', '  const sourceRole = sourceRoleSentence(sourceRows, globalIndex, section.title);')
          text = text.replace('  const concreteCase = caseSentence(caseRow, globalIndex);', '  const concreteCase = caseSentence(caseRow, globalIndex, section.title);')
          path.write_text(text)
          gate_files = [
              Path('scripts/reaudit-film-tv-existing-chapters-v1.mjs'),
              Path('scripts/plan-film-tv-learning-order-v1.mjs'),
              Path('tests/film-tv-existing-chapter-reaudit-v1.test.mjs'),
              Path('tests/film-tv-learning-order-plan-v1.test.mjs'),
          ]
          old_gate = '(?:source_brief_complete_full_chapter_production|full_chapter_complete_next_unit_source_brief)$'
          new_gate = '(?:source_brief_complete_full_chapter_production|full_chapter_complete_next_unit_source_brief|full_chapter_complete_completion_audit)$'
          for file in gate_files:
              body = file.read_text()
              count = body.count(old_gate)
              if count != 1:
                  raise SystemExit(f'{file}: expected exactly one stale gate regex, found {count}')
              file.write_text(body.replace(old_gate, new_gate))
          PY
          node --check scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs

      - name: Materialize Unit15 editorial outputs
        run: node scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs
      - name: Write Unit15 editorial audit
        run: node scripts/audit-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs --write
      - name: Check Unit15 editorial audit
        run: node scripts/audit-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs --check
      - name: Unit15 fulltext regression
        run: node --test tests/film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.test.mjs
      - name: Unit15 registry regression
        run: node --test tests/film-tv-cultural-heritage-canon-stars-memory-registry-v1.test.mjs
      - name: Final gate monotonicity
        run: node tests/film-tv-final-gate-monotonicity-v1.test.mjs
      - name: Unit15 predecessor monotonicity
        run: node --test tests/film-tv-unit15-fulltext-predecessor-monotonicity-v1.test.mjs
      - name: Existing chapter reaudit
        run: node scripts/reaudit-film-tv-existing-chapters-v1.mjs
      - name: Existing chapter regression
        run: node --test tests/film-tv-existing-chapter-reaudit-v1.test.mjs
      - name: Learning order plan
        run: node scripts/plan-film-tv-learning-order-v1.mjs
      - name: Learning order regression
        run: node --test tests/film-tv-learning-order-plan-v1.test.mjs
      - name: Film TV phase3 audit
        run: node scripts/audit-fagverk-film-tv-phase3.mjs
      - name: Film TV phase3 regression
        run: node --test tests/fagverk-film-tv-phase3.test.mjs
      - name: Release manifest
        run: node scripts/build-fagverk-release-manifest.mjs --check

      - name: Commit verified Unit15 editorial reconciliation and self-remove
        run: |
          rm .github/workflows/film-tv-unit15-editorial-rematerialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs \
            scripts/reaudit-film-tv-existing-chapters-v1.mjs \
            scripts/plan-film-tv-learning-order-v1.mjs \
            tests/film-tv-existing-chapter-reaudit-v1.test.mjs \
            tests/film-tv-learning-order-plan-v1.test.mjs \
            data/fagverk/film_tv/kulturarv-kanon-stjerner-og-minne.json \
            data/fagverk/film_tv/kulturarv-kanon-stjerner-og-minne/01-kulturarv-kanon-og-motarkiv.json \
            data/fagverk/film_tv/kulturarv-kanon-stjerner-og-minne/02-stjerner-kanonmakt-og-kollektiv-referanse.json \
            data/fagverk/film_tv/kulturarv-kanon-stjerner-og-minne/03-kult-nostalgi-og-kulturell-varighet.json \
            data/fagverk/film_tv/kulturarv-kanon-stjerner-og-minne/04-sitat-stjerneapparat-og-tv-minne.json \
            data/fagverk/film_tv/kulturarv-kanon-stjerner-og-minne/brief.json \
            data/fagverk/film_tv/kulturarv-kanon-stjerner-og-minne/claims.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_status.json \
            reports/fagverk/film-tv-cultural-heritage-canon-stars-memory-fulltext-v1-audit.json \
            .github/workflows/film-tv-unit15-editorial-rematerialize.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No verified Unit15 changes"; exit 1; } || true
          git commit -m "Finalize Unit15 editorial fulltext and predecessor gates"
          git push origin HEAD:agent/film-tv-unit15-cultural-heritage-canon-stars-memory-fulltext
