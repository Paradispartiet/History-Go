name: Diagnose Film TV Unit15 editorial audit

on:
  push:
    branches:
      - agent/film-tv-unit15-cultural-heritage-canon-stars-memory-fulltext
    paths:
      - .github/workflows/film-tv-unit15-editorial-rematerialize.yml

permissions:
  contents: write

concurrency:
  group: film-tv-unit15-editorial-finalize
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-tv-unit15-cultural-heritage-canon-stars-memory-fulltext
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Materialize editorial Unit15 outputs
        run: node scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs
      - name: Diagnose editorial audit gate
        shell: bash
        run: |
          set +e
          output=$(node scripts/audit-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs --write 2>&1)
          code=$?
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            clean=$(printf '%s' "$output" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Unit15 editorial audit::${clean}"
            exit "$code"
          fi
