name: TEMP Scenekunst regi og koreografi prerequisites

on:
  push:
    branches:
      - agent/civication-scenekunst-regi-og-koreografi-prerequisites-materialize

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize authored mail depth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/TEMP-scenekunst-regi-og-koreografi-prerequisites-materializer.mjs')
          s=p.read_text()
          old=" Dermed kan senere endringer gjenåpne bare berørte ledd uten at tidligere begrunnelse, ansvar eller varsling forsvinner."
          new=old+" Hver mail må også gjøre synlig hvilken prøve som faktisk er observert, hvem som må svare før neste versjon kan distribueres, og hva ensemble, inspisient og teknikk skal beholde mens avklaringen pågår."
          if old not in s:
              raise SystemExit('mail-depth anchor missing')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Materialize authored prerequisite package
        run: node .github/TEMP-scenekunst-regi-og-koreografi-prerequisites-materializer.mjs

      - name: Regenerate canonical derived state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-civication-role-packs.mjs
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
          node scripts/build-civication-scene-registry.mjs --write
          npm run build:civication:career-gameplay-matrix
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write

      - name: Focused prerequisite gate
        run: node tests/civication-scenekunst-regi-og-koreografi-prerequisites.test.js

      - name: Generated-state parity gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-civication-role-packs.mjs
          node scripts/audit-civication-career-gameplay.mjs --check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node scripts/build-civication-scene-registry.mjs --check
          node scripts/audit-civication-role-world-rollout-readiness.mjs --check

      - name: Full Civication gate
        run: npm run test:civication

      - name: Repository diff gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/CIVICATION_ROLE_PACK_INDEX.md')
          p.write_text(p.read_text().rstrip()+"\n")
          PY
          git diff --check
          git status --short

      - name: Publish permanent prerequisite state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/TEMP-scenekunst-regi-og-koreografi-prerequisites.yml
          git rm -f .github/TEMP-scenekunst-regi-og-koreografi-prerequisites-materializer.mjs
          git add data/Civication docs/CIVICATION_ROLE_PACK_INDEX.md reports tests/civication-scenekunst-regi-og-koreografi-prerequisites.test.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No permanent changes to publish"
            exit 1
          fi
          git commit -m "Materialize Scenekunst regi og koreografi prerequisites"
          git push origin HEAD:agent/civication-scenekunst-regi-og-koreografi-prerequisites-materialize
