name: VisitOSLO Grünerløkka production

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-validate:
    if: github.head_ref == 'agent/visitoslo-grunerlokka-production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Register canonical places and coordinate evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="reports/coordinate-branch-runner/agent_visitoslo-grunerlokka-production"
          mkdir -p "$OUT"

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          hodet_evidence_path = Path('data/coordinate-evidence/oslo/kunst/hodet_nn_torshovdalen.json')
          hodet_evidence_path.parent.mkdir(parents=True, exist_ok=True)
          hodet_evidence = {
            "schemaVersion": "1.0",
            "placeId": "hodet_nn_torshovdalen",
            "placeFile": "data/places/kunst/oslo/places_kunst/hodet_nn_torshovdalen.json",
            "evidenceStatus": "applied_to_place",
            "coordinateDecision": "do_not_change_coordinates_yet",
            "currentCoordinate": {
              "lat": 59.9339293,
              "lon": 10.7768206,
              "r": 45,
              "coordStatus": "verified_geometry",
              "coordSource": "OpenStreetMap node 2965223021 – HODET N.N.; identity cross-checked with Skulpturstopp",
              "coordType": "artwork",
              "coordNote": "Eksakt OSM-kunstobjekt med riktig tittel, kunstner, verkstype, år og lenke til Skulpturstopp."
            },
            "identity": {
              "currentName": "HODET N.N.",
              "resolvedIdentity": "Marianne Heskes HODET N.N. fra 2014 i Torshovdalen",
              "identityStatus": "resolved",
              "identityProblem": "",
              "locatorTypeCandidate": "poi",
              "requiresSplit": False,
              "splitReason": ""
            },
            "requiredEvidence": [
              "eksakt fysisk kunstobjekt",
              "uavhengig dokumentert verkidentitet"
            ],
            "evidence": [{
              "sourceProvider": "osm",
              "sourceName": "OpenStreetMap node 2965223021",
              "sourceUrl": "https://www.openstreetmap.org/node/2965223021",
              "sourceObjectId": "osm-node:2965223021",
              "sourceQuality": "exact_named_artwork_point",
              "finding": "Eksakt tourism=artwork-punkt med name=HODET N.N., artist_name=Marianne Heske, artwork_type=sculpture og start_date=2014.",
              "canVerifyCoordinate": True,
              "reason": "Skulpturstopp dokumenterer samme kunstner, tittel, år, materialitet og plassering i Torshovdalen."
            }],
            "addressCandidates": [],
            "sourceObjectCandidates": [{
              "sourceProvider": "osm",
              "sourceObjectId": "osm-node:2965223021",
              "canApplyToPlace": True
            }],
            "geometryCandidates": [{
              "sourceProvider": "osm",
              "sourceObjectId": "osm-node:2965223021",
              "lat": 59.9339293,
              "lon": 10.7768206,
              "canApplyToPlace": True
            }],
            "coordinateCandidates": [{
              "lat": 59.9339293,
              "lon": 10.7768206,
              "coordRole": "display_marker",
              "canApplyToPlace": True
            }],
            "decision": {
              "canBecomeVerified": True,
              "blockedReason": "",
              "nextAction": "Exact named artwork point applied to the canonical art place."
            },
            "notes": ["The point represents the sculpture itself, not Torshovdalen as a general park area."]
          }
          hodet_evidence_path.write_text(json.dumps(hodet_evidence, ensure_ascii=False, indent=2) + '\n')

          place_entries = [
            'places/historie/oslo/places_historie/paulus_kirke.json',
            'places/kunst/oslo/places_kunst/purenkel_galleri.json',
            'places/by/oslo/places/torshovparken.json',
            'places/kunst/oslo/places_kunst/hodet_nn_torshovdalen.json'
          ]
          place_manifest_path = Path('data/places/manifest.json')
          place_manifest = json.loads(place_manifest_path.read_text())
          for entry in place_entries:
              if entry not in place_manifest['files']:
                  place_manifest['files'].append(entry)
          place_manifest_path.write_text(json.dumps(place_manifest, ensure_ascii=False, indent=2) + '\n')

          evidence_entries = [
            'oslo/historie/paulus_kirke.json',
            'oslo/kunst/purenkel_galleri.json',
            'oslo/by/torshovparken.json',
            'oslo/kunst/hodet_nn_torshovdalen.json'
          ]
          evidence_manifest_path = Path('data/coordinate-evidence/manifest.json')
          evidence_manifest = json.loads(evidence_manifest_path.read_text())
          for entry in evidence_entries:
              if entry not in evidence_manifest['files']:
                  evidence_manifest['files'].append(entry)
          evidence_manifest_path.write_text(json.dumps(evidence_manifest, ensure_ascii=False, indent=2) + '\n')

          overrides_path = Path('data/places/category_overrides.json')
          overrides = json.loads(overrides_path.read_text())
          if not any(row.get('id') == 'paulus_kirke' for row in overrides):
              overrides.append({
                'id': 'paulus_kirke',
                'category': 'religion',
                'note': 'Aktiv kirke og primært trossted.'
              })
          overrides_path.write_text(json.dumps(overrides, ensure_ascii=False, indent=2) + '\n')

          protocol_path = Path('docs/coordinates/coordinate-control-protocol.md')
          protocol = protocol_path.read_text()
          ids = ['paulus_kirke', 'purenkel_galleri', 'torshovparken', 'hodet_nn_torshovdalen']
          if any(f'`{pid}`' in protocol for pid in ids):
              raise SystemExit('One or more Grünerløkka production ids already exist in the coordinate protocol')

          oslo_start = protocol.index('## Oslo')
          next_heading = protocol.find('\n## ', oslo_start + len('## Oslo'))
          oslo_block = protocol[oslo_start:] if next_heading == -1 else protocol[oslo_start:next_heading]
          batches = [int(value) for value in re.findall(r'^\|\s*(\d+)\s*\|', oslo_block, re.M)]
          if not batches:
              raise SystemExit('Could not determine current Oslo batch maximum')
          first_batch = max(batches) + 1

          summary_re = re.compile(
              r'Oslo-tabellen inneholder nå (\d+) verifiserte eller kildekontrollerte canonical steder\. '
              r'.*? Antallet fullførte kontroller uten godkjent Oslo-koordinat er (\d+)\.'
          )
          match = summary_re.search(protocol)
          if not match:
              raise SystemExit('Could not locate Oslo protocol summary')
          old_count = int(match.group(1))
          needs_review = int(match.group(2))
          new_count = old_count + 4
          last_batch = first_batch + 3
          new_summary = (
              f'Oslo-tabellen inneholder nå {new_count} verifiserte eller kildekontrollerte canonical steder. '
              f'Batch {first_batch}–{last_batch} legger til Paulus kirke og Purenkel med entydige Geonorge-adressepunkter, '
              f'Torshovparken med eksakt navngitt parkpolygon og HODET N.N. med eksakt navngitt kunstobjekt. '
              f'Antallet fullførte kontroller uten godkjent Oslo-koordinat er {needs_review}.'
          )
          protocol = summary_re.sub(new_summary, protocol, count=1)

          rows = [
              f'| {first_batch} | `paulus_kirke` | Paulus kirke | verified | `geonorge-adresser-v1:0301:17489:31` |',
              f'| {first_batch + 1} | `purenkel_galleri` | Purenkel galleri | verified | `geonorge-adresser-v1:0301:12432:3` |',
              f'| {first_batch + 2} | `torshovparken` | Torshovparken | verified_geometry | `osm-way:252260743` |',
              f'| {first_batch + 3} | `hodet_nn_torshovdalen` | HODET N.N. | verified_geometry | `osm-node:2965223021` |'
          ]
          marker = '\nRelevante korrigerende merger for de første Oslo-batchene:'
          if marker not in protocol:
              raise SystemExit('Could not locate Oslo table end marker')
          protocol = protocol.replace(marker, '\n' + '\n'.join(rows) + marker, 1)
          protocol_path.write_text(protocol)

          report = {
            'placeIds': ids,
            'firstBatch': first_batch,
            'lastBatch': last_batch,
            'oldOsloControlledCount': old_count,
            'newOsloControlledCount': new_count,
            'runtimeCategoryOverride': {'paulus_kirke': 'religion'}
          }
          out = Path('reports/coordinate-branch-runner/agent_visitoslo-grunerlokka-production')
          (out / 'job.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Build runtime place index
        run: npm run places:index:build 2>&1 | tee reports/coordinate-branch-runner/agent_visitoslo-grunerlokka-production/places-index-build.log

      - name: Validate production batch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT="reports/coordinate-branch-runner/agent_visitoslo-grunerlokka-production"
          npm run audit:places-split-manifest-sync 2>&1 | tee "$OUT/split-manifest-sync.log"
          npm run places:index:check 2>&1 | tee "$OUT/places-index-check.log"
          npm run test:coordinate-source-contract 2>&1 | tee "$OUT/coordinate-source-contract.log"
          npm run places:coords:quality 2>&1 | tee "$OUT/coordinate-quality.log"
          npm run places:coords:intake -- --strict-new 2>&1 | tee "$OUT/coordinate-intake.log"
          npm run places:coords:evidence:audit 2>&1 | tee "$OUT/coordinate-evidence.log"
          set +e
          npm run health:places 2>&1 | tee "$OUT/health-places.log"
          health_code=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$health_code" > "$OUT/health-places.exit-code.txt"
          git diff --check 2>&1 | tee "$OUT/git-diff-check.log"

      - name: Remove one-shot workflow and commit generated state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/visitoslo-grunerlokka-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Produce VisitOSLO Grünerløkka canonical gaps"
          git push origin HEAD:${{ github.head_ref }}
