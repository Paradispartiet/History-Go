name: TEMP Civication Politikk Parlamentarisk arbeid Role World

on:
  push:
    branches:
      - agent/civication-politikk-parlamentarisk-arbeid-role-world-20260907
    paths:
      - scripts/TEMP_materialize_politikk_parlamentarisk_arbeid_role_world.mjs
      - .github/workflows/TEMP-civication-politikk-parlamentarisk-arbeid-role-world.yml

permissions:
  contents: write

concurrency:
  group: temp-civication-politikk-parlamentarisk-arbeid-role-world
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-politikk-parlamentarisk-arbeid-role-world-20260907
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Syntax
        run: node --check scripts/TEMP_materialize_politikk_parlamentarisk_arbeid_role_world.mjs

      - name: Materialize Parliamentary Role World
        run: node scripts/TEMP_materialize_politikk_parlamentarisk_arbeid_role_world.mjs

      - name: Generate canonical rollout surfaces
        run: |
          set -euo pipefail
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write

      - name: Verify Parliamentary Role World
        run: node tests/civication-politikk-parlamentarisk-arbeid-role-world-rollout.test.js

      - name: Verify global Role World contract
        run: node tests/civication-role-world-contract.test.js

      - name: Verify Career Gameplay Matrix
        run: node tests/civication-career-gameplay-matrix.test.js

      - name: Verify Role World readiness
        run: node tests/civication-role-world-rollout-readiness.test.js

      - name: Verify Scene Registry
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Verify Scenario People index
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check

      - name: Verify Scenario People audit
        run: node --test tests/civication-scenario-people.test.mjs

      - name: Verify full Civication suite
        run: node tests/run-civication-tests.mjs

      - name: Verify job learning profiles
        run: npm run audit:job-learning-profiles

      - name: Verify job knowledge requirements
        run: npm run audit:job-knowledge-requirements

      - name: Verify exact permanent Role World scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          if [ "${#changed[@]}" -ne 9 ]; then
            echo "Expected exactly 9 permanent Role World paths, found ${#changed[@]}" >&2
            exit 1
          fi
          for f in "${changed[@]}"; do
            case "$f" in
              data/Civication/careerGameplayMatrix.json|data/Civication/roleWorldAuthoringChecklist.json|data/Civication/roleWorldRolloutReadiness.json|data/Civication/roleWorldThemeBank.json|data/Civication/roleWorlds/index.json|data/Civication/roleWorlds/politikk/politikk_parlamentarisk_arbeid.json|reports/CIVICATION_POLITIKK_PARLAMENTARISK_ARBEID_ROLE_WORLD_ROLLOUT_SOURCE_FIRST.md|reports/civication-role-world-rollout-readiness.md|tests/civication-politikk-parlamentarisk-arbeid-role-world-rollout.test.js)
                ;;
              *)
                echo "Unexpected generated path: $f" >&2
                exit 1
                ;;
            esac
          done
          for required in \
            data/Civication/careerGameplayMatrix.json \
            data/Civication/roleWorldAuthoringChecklist.json \
            data/Civication/roleWorldRolloutReadiness.json \
            data/Civication/roleWorldThemeBank.json \
            data/Civication/roleWorlds/index.json \
            data/Civication/roleWorlds/politikk/politikk_parlamentarisk_arbeid.json \
            reports/CIVICATION_POLITIKK_PARLAMENTARISK_ARBEID_ROLE_WORLD_ROLLOUT_SOURCE_FIRST.md \
            reports/civication-role-world-rollout-readiness.md \
            tests/civication-politikk-parlamentarisk-arbeid-role-world-rollout.test.js; do
            printf '%s\n' "${changed[@]}" | grep -Fx "$required" >/dev/null || { echo "Missing required permanent path: $required" >&2; exit 1; }
          done
          git diff --check

      - name: Commit permanent verified Role World
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/TEMP_materialize_politikk_parlamentarisk_arbeid_role_world.mjs
          rm -f .github/workflows/TEMP-civication-politikk-parlamentarisk-arbeid-role-world.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.' >&2
            exit 1
          fi
          git diff --cached --check
          git status --short
          git commit -m "Complete Politikk Parlamentarisk arbeid Role World"
          git push origin HEAD:agent/civication-politikk-parlamentarisk-arbeid-role-world-20260907
