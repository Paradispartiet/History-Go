name: One-off Etne primary category cleanup

on:
  push:
    branches:
      - agent/etne-primary-category-cleanup
    paths:
      - .github/workflows/etne-primary-category-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-primary-category-cleanup
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reclassify and add Etne places
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const branchDate = '2026-07-23';
          const manifestPath = 'data/places/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const moveMap = new Map();

          const asRecords = (doc) => Array.isArray(doc) ? doc : [doc];
          const ensureTag = (tags, tag) => {
            const rest = (Array.isArray(tags) ? tags : []).filter((value) => value !== tag);
            return [tag, ...rest];
          };

          function moveAndReclassify(from, to, category, removeTags = []) {
            const doc = JSON.parse(fs.readFileSync(from, 'utf8'));
            for (const record of asRecords(doc)) {
              record.category = category;
              let tags = Array.isArray(record.tags) ? record.tags.filter((tag) => !removeTags.includes(tag)) : [];
              record.tags = ensureTag(tags, category);
            }
            fs.mkdirSync(path.dirname(to), { recursive: true });
            fs.writeFileSync(to, JSON.stringify(doc, null, 2) + '\n');
            if (from !== to) fs.unlinkSync(from);
            moveMap.set(from.replace(/^data\//, ''), to.replace(/^data\//, ''));
          }

          const moves = [
            ['data/places/historie/vestland/etne/stodle_kyrkje.json', 'data/places/religion/vestland/etne/stodle_kyrkje.json', 'religion', []],
            ['data/places/historie/vestland/etne/gjerde_kyrkje_etne.json', 'data/places/religion/vestland/etne/gjerde_kyrkje_etne.json', 'religion', []],
            ['data/places/historie/vestland/etne/grindheim_kyrkje_etne.json', 'data/places/religion/vestland/etne/grindheim_kyrkje_etne.json', 'religion', []],
            ['data/places/historie/vestland/etne/fjaera_kapell.json', 'data/places/religion/vestland/etne/fjaera_kapell.json', 'religion', []],
            ['data/places/kunst/vestland/etne/house_of_blues_skanevik.json', 'data/places/musikk/vestland/etne/house_of_blues_skanevik.json', 'musikk', ['kunst']],
            ['data/places/kunst/vestland/etne/abc_studio_etne.json', 'data/places/musikk/vestland/etne/abc_studio_etne.json', 'musikk', ['kunst']],
            ['data/places/kunst/vestland/etne/old_river_saloon_etne.json', 'data/places/musikk/vestland/etne/old_river_saloon_etne.json', 'musikk', ['kunst']],
            ['data/places/kunst/vestland/etne/musikkpaviljongen_doktorhagen.json', 'data/places/musikk/vestland/etne/musikkpaviljongen_doktorhagen.json', 'musikk', ['kunst']],
            ['data/places/kunst/vestland/etne/skanevik_fjordhotel_pippifestivalen.json', 'data/places/scenekunst/vestland/etne/skanevik_fjordhotel_pippifestivalen.json', 'scenekunst', ['kunst']]
          ];

          for (const args of moves) moveAndReclassify(...args);

          async function geocodeAddress(adressenavn, nummer, postcode, city) {
            const url = new URL('https://ws.geonorge.no/adresser/v1/sok');
            url.searchParams.set('adressenavn', adressenavn);
            url.searchParams.set('nummer', String(nummer));
            url.searchParams.set('kommunenummer', '4611');
            url.searchParams.set('treffPerSide', '100');
            const response = await fetch(url, { headers: { 'user-agent': 'History-Go-Etne-category-cleanup/1.0' } });
            if (!response.ok) throw new Error(`Geonorge ${response.status} for ${adressenavn} ${nummer}`);
            const payload = await response.json();
            const hits = payload.adresser || [];
            const hit = hits.find((entry) => String(entry.postnummer || '') === String(postcode)) || hits[0];
            if (!hit?.representasjonspunkt) throw new Error(`No Geonorge address hit for ${adressenavn} ${nummer}, ${postcode} ${city}`);
            return {
              lat: Number(hit.representasjonspunkt.lat),
              lon: Number(hit.representasjonspunkt.lon),
              sourceObjectId: `geonorge-adresser-v1:${hit.kommunenummer || '4611'}:${hit.adressekode || 'unknown'}:${hit.nummer || nummer}`
            };
          }

          function writePlace(file, record) {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, JSON.stringify(record, null, 2) + '\n');
          }

          async function main() {
            const etne = await geocodeAddress('Enge', 5, '5590', 'Etne');
            const skanevik = await geocodeAddress('Prestavegen', 11, '5593', 'Skånevik');
            const bedehus = await geocodeAddress('Tjedlavegen', 38, '5593', 'Skånevik');

            const newPlaces = [
              {
                file: 'data/places/religion/vestland/etne/etne_kyrkje.json',
                record: {
                  id: 'etne_kyrkje', name: 'Etne kyrkje', lat: etne.lat, lon: etne.lon, r: 180,
                  coordType: 'address_point', coordStatus: 'verified', coordSource: 'geonorge_adresser_v1', coordVerifiedAt: branchDate,
                  coordNote: 'Kartverket/Geonorge sitt offisielle adresserepresentasjonspunkt for Enge 5, 5590 Etne. Punktet brukes som display-marker for Etne kyrkje og er ikke påstått å være geometrisk bygningssentrum eller inngangspunkt.',
                  locatorType: 'building', sourceProvider: 'official_address', sourceObjectId: etne.sourceObjectId,
                  address: { street: 'Enge', number: '5', postcode: '5590', city: 'Etne', country: 'NO' },
                  geocodeAccuracy: 'rooftop', coordRole: 'display_marker', category: 'religion', fylke: 'vestland', kommune: 'Etne', year: 2013,
                  period: 'Moderne soknekyrkje frå 2013',
                  tags: ['religion', 'kristendom', 'kirke', 'etne', '2013', 'soknekyrkje'],
                  desc: 'Etne kyrkje er den moderne soknekyrkja på Enge i Etne sentrum, teken i bruk i 2013 og i aktiv bruk til gudstenester og kyrkjelydsarbeid.',
                  popupDesc: 'Etne kyrkje ligg på Enge i Etne sentrum og vart bygd i 2013. Som den nyaste av kyrkjene i kommunen representerer ho det samtidige kyrkjelivet i Etne, med gudstenester, dåp, konfirmantarbeid og aktivitetar for ulike aldersgrupper. I History Go er dette først og fremst eit levande religionssted, ikkje eit historisk kyrkjeminne.',
                  externalLinks: [
                    { type: 'official', label: 'Etne kommune – Kyrkja i Etne', url: 'https://www.etne.kommune.no/kultur-og-fritid/kyrkja/', lang: 'nn', verifiedAt: branchDate },
                    { type: 'official', label: 'Etne kyrkjelege fellesråd – Kyrkjene våre', url: 'https://www.etne.kyrkja.no/Kyrkjene-v%C3%A5re', lang: 'nn', verifiedAt: branchDate }
                  ],
                  quiz_profile: {
                    place_type: 'kirke', subtype: 'moderne_soknekyrkje_fra_2013',
                    signature_features: ['bygd i 2013', 'ligg på Enge i Etne sentrum', 'aktiv soknekyrkje'],
                    primary_angles: ['trosliv', 'kristendom', 'ritualer', 'lokalsamfunn'],
                    question_families: ['kirkesteder', 'moderne_kirkebygg', 'etne', 'trosliv'],
                    avoid_angles: ['framstille_som_historisk_middelalderkirke'],
                    must_include: ['byggjeåret 2013', 'den aktive kyrkjelydsfunksjonen'],
                    contrast_targets: ['gjerde_kyrkje_etne', 'stodle_kyrkje']
                  }
                }
              },
              {
                file: 'data/places/religion/vestland/etne/skanevik_kyrkje.json',
                record: {
                  id: 'skanevik_kyrkje', name: 'Skånevik kyrkje', lat: skanevik.lat, lon: skanevik.lon, r: 180,
                  coordType: 'address_point', coordStatus: 'verified', coordSource: 'geonorge_adresser_v1', coordVerifiedAt: branchDate,
                  coordNote: 'Kartverket/Geonorge sitt offisielle adresserepresentasjonspunkt for Prestavegen 11, 5593 Skånevik. Markøren gjelder dagens kyrkje frå 1900 og skal holdes adskilt fra det eldre historiske stedet skanevik_kyrkjestad.',
                  locatorType: 'building', sourceProvider: 'official_address', sourceObjectId: skanevik.sourceObjectId,
                  address: { street: 'Prestavegen', number: '11', postcode: '5593', city: 'Skånevik', country: 'NO' },
                  geocodeAccuracy: 'rooftop', coordRole: 'display_marker', category: 'religion', fylke: 'vestland', kommune: 'Etne', year: 1900,
                  period: 'Soknekyrkje frå 1900',
                  tags: ['religion', 'kristendom', 'kirke', 'skanevik', '1900', 'soknekyrkje'],
                  desc: 'Dagens Skånevik kyrkje vart vigsla i 1900 og fører vidare kyrkjelivet i Skånevik ved sida av den eldre, historiske kyrkjestaden sør for bygget.',
                  popupDesc: 'Skånevik kyrkje er dagens aktive kyrkjebygg i bygda og vart vigsla i 1900. Staden skal skiljast frå History Go-markøren Skånevik kyrkjestad, som representerer den eldre middelalderske kyrkjegarden og tidlegare kyrkjebygg. Saman viser dei to markørane både kontinuitet og fysisk endring i det lokale kyrkjelivet.',
                  externalLinks: [
                    { type: 'official', label: 'Etne kommune – Kyrkja i Etne', url: 'https://www.etne.kommune.no/kultur-og-fritid/kyrkja/', lang: 'nn', verifiedAt: branchDate },
                    { type: 'reference', label: 'Norges Kirker – Skånevik kyrkje', url: 'https://norgeskirker.no/wiki/Sk%C3%A5nevik_kyrkje', lang: 'nn', verifiedAt: branchDate }
                  ],
                  quiz_profile: {
                    place_type: 'kirke', subtype: 'aktiv_soknekyrkje_fra_1900',
                    signature_features: ['vigsla i 1900', 'dagens aktive kyrkje i Skånevik', 'ligg nord for den eldre kyrkjestaden'],
                    primary_angles: ['trosliv', 'kristendom', 'ritualer', 'stadskontinuitet'],
                    question_families: ['kirkesteder', 'skanevik', '1900_tallet', 'trosliv'],
                    avoid_angles: ['blande_med_skanevik_kyrkjestad', 'framstille_dagens_bygg_som_middelalderkirke'],
                    must_include: ['at dette er dagens kyrkje frå 1900', 'skillet fra den eldre kyrkjestaden'],
                    contrast_targets: ['skanevik_kyrkjestad', 'fjaera_kapell']
                  }
                }
              },
              {
                file: 'data/places/religion/vestland/etne/frette_kapell.json',
                record: {
                  id: 'frette_kapell', name: 'Frette kapell', lat: 59.7261, lon: 6.16205, r: 180,
                  coordType: 'building_centroid', coordStatus: 'verified_geometry', coordSource: 'OpenStreetMap building geometry + Norges Kirker', coordVerifiedAt: branchDate,
                  coordNote: 'Representativt bygningsanker for OpenStreetMap way 557505490, kontrollert mot Norges Kirker sin identifikasjon av Frette kapell ved enden av Stordalsvatnet. Punktet brukes som display-marker.',
                  locatorType: 'building', sourceProvider: 'osm', sourceObjectId: 'osm-way:557505490', geocodeAccuracy: 'geometric_center', coordRole: 'display_marker',
                  category: 'religion', fylke: 'vestland', kommune: 'Etne', year: 1959,
                  period: 'Bedehus frå 1910, vigsla som kapell i 1959',
                  tags: ['religion', 'kristendom', 'kapell', 'frette', 'stordalsvatnet', '1910', '1959'],
                  desc: 'Frette kapell ved enden av Stordalsvatnet vart oppført som bedehuset Betania i 1910 og ombygd og vigsla til kyrkjeleg bruk i 1959.',
                  popupDesc: 'Bygningen på Frette vart først reist som bedehuset Betania i 1910. I 1959 vart han bygd grundig om til kyrkjeleg bruk, med den eldre stova som kjerne, og vigsla som kapell 13. desember same år. Staden viser korleis eit lokalt bedehusmiljø kunne utviklast til eit fast kyrkjeleg rom.',
                  externalLinks: [
                    { type: 'reference', label: 'Norges Kirker – Frette kapell', url: 'https://norgeskirker.no/wiki/Frette_kapell', lang: 'nn', verifiedAt: branchDate },
                    { type: 'official', label: 'Etne kommune – Kyrkja i Etne', url: 'https://www.etne.kommune.no/kultur-og-fritid/kyrkja/', lang: 'nn', verifiedAt: branchDate }
                  ],
                  quiz_profile: {
                    place_type: 'kapell', subtype: 'bedehus_ombygd_til_kapell_i_1959',
                    signature_features: ['opphavleg Betania bedehus frå 1910', 'ombygd til kyrkjeleg bruk i 1959', 'ligg ved enden av Stordalsvatnet'],
                    primary_angles: ['trosliv', 'bedehustradisjon', 'kristendom', 'lokalsamfunn'],
                    question_families: ['kapeller', 'bedehus', 'frette', '1950_tallet'],
                    avoid_angles: ['hevde_at_bygningen_var_kapell_fra_1910'],
                    must_include: ['skillet mellom bedehuset frå 1910 og vigslinga som kapell i 1959'],
                    contrast_targets: ['fjaera_kapell', 'grindheim_kyrkje_etne']
                  }
                }
              },
              {
                file: 'data/places/religion/vestland/etne/skanevik_bedehus.json',
                record: {
                  id: 'skanevik_bedehus', name: 'Skånevik bedehus', lat: bedehus.lat, lon: bedehus.lon, r: 140,
                  coordType: 'address_point', coordStatus: 'verified', coordSource: 'geonorge_adresser_v1', coordVerifiedAt: branchDate,
                  coordNote: 'Kartverket/Geonorge sitt offisielle adresserepresentasjonspunkt for Tjedlavegen 38, 5593 Skånevik, brukt som display-marker for Skånevik bedehus.',
                  locatorType: 'building', sourceProvider: 'official_address', sourceObjectId: bedehus.sourceObjectId,
                  address: { street: 'Tjedlavegen', number: '38', postcode: '5593', city: 'Skånevik', country: 'NO' },
                  geocodeAccuracy: 'rooftop', coordRole: 'display_marker', category: 'religion', fylke: 'vestland', kommune: 'Etne', year: null,
                  period: 'Bedehus og møteplass for kristent organisasjonsliv',
                  tags: ['religion', 'kristendom', 'bedehus', 'indremisjon', 'skanevik', 'moteplass'],
                  desc: 'Skånevik bedehus i Tjedlavegen er møteplass for Skånevik Indremisjon og lokalt kristent organisasjonsliv.',
                  popupDesc: 'Skånevik bedehus er eit eige religiøst møtehus i bygda, registrert av Etne kommune under tru og livssyn med møteaktivitet. History Go-staden representerer bedehustradisjonen og det organiserte kristne fellesskapet utanfor den ordinære soknekyrkja.',
                  externalLinks: [
                    { type: 'official', label: 'Etne kommune – Skånevik Indremisjon/Skånevik Bedehus', url: 'https://www.etne.kommune.no/Organisasjon/OrganisasjonVis.aspx?MId1=3694&OrganisasjonId=138', lang: 'nn', verifiedAt: branchDate }
                  ],
                  quiz_profile: {
                    place_type: 'bedehus', subtype: 'indremisjonsbedehus_og_lokal_moteplass',
                    signature_features: ['Tjedlavegen 38', 'Skånevik Indremisjon', 'registrert møteaktivitet under tru og livssyn'],
                    primary_angles: ['bedehustradisjon', 'kristendom', 'fellesskap', 'organisasjonsliv'],
                    question_families: ['bedehus', 'indremisjon', 'skanevik', 'trosliv'],
                    avoid_angles: ['framstille_som_soknekyrkje'],
                    must_include: ['rollen som bedehus og møtestad'],
                    contrast_targets: ['skanevik_kyrkje', 'skanevik_kyrkjestad']
                  }
                }
              }
            ];

            for (const { file, record } of newPlaces) writePlace(file, record);

            manifest.files = manifest.files.map((entry) => moveMap.get(entry) || entry);
            for (const { file } of newPlaces) {
              const manifestEntry = file.replace(/^data\//, '');
              if (!manifest.files.includes(manifestEntry)) manifest.files.push(manifestEntry);
            }
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Rebuild and validate places index
        run: |
          npm run places:index:build
          npm run places:index:check
          npm run audit:places-split-manifest-sync

      - name: Commit generated cleanup and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/etne-primary-category-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Clean up Etne primary place categories"
          git push origin HEAD:agent/etne-primary-category-cleanup
