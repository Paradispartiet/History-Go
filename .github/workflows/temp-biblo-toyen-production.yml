name: Temporary Biblo Tøyen production

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  produce:
    if: github.head_ref == 'agent/oslo-coordinate-biblo-toyen-production'
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-biblo-toyen-production
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize Biblo Tøyen
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const placeId = 'biblo_toyen';
          const placeRel = 'places/litteratur/oslo/places_litteratur/biblo_toyen.json';
          const evidenceRel = 'oslo/litteratur/biblo_toyen.json';
          const lat = 59.914420834487764;
          const lon = 10.775438542801346;
          const sourceObjectId = 'geonorge-adresser-v1:0301:12580:22';
          const sourceUrl = 'https://ws.geonorge.no/adresser/v1/sok?sok=Hagegata%2022%20Oslo';
          const coordNote = 'Offisiell adressekoordinat fra Geonorge Adresser API for Hagegata 22, OSLO. Punktet er representasjonspunktet for adressen og brukes som display-marker for Biblo Tøyen, ikke som generelt områdeanker for Tøyen torg eller for den separate Deichman Tøyen-filialen i Hagegata 28.';

          const readJson = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const writeJson = (p, value) => {
            fs.mkdirSync(path.dirname(p), { recursive: true });
            fs.writeFileSync(p, JSON.stringify(value, null, 2) + '\n');
          };
          const haversine = (aLat, aLon, bLat, bLon) => {
            const R = 6371000;
            const dLat = (bLat - aLat) * Math.PI / 180;
            const dLon = (bLon - aLon) * Math.PI / 180;
            const x = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * Math.PI / 180) * Math.cos(bLat * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(x));
          };

          const currentIndex = readJson('data/places/places_index.json');
          if (currentIndex.some(p => p.id === placeId)) throw new Error(`${placeId} already exists in runtime index`);
          const nearby = currentIndex
            .filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon))
            .map(p => ({ id: p.id, name: p.name, category: p.category, distanceMeters: Math.round(haversine(lat, lon, p.lat, p.lon) * 10) / 10 }))
            .filter(p => p.distanceMeters <= 350)
            .sort((a, b) => a.distanceMeters - b.distanceMeters);

          const place = {
            id: placeId,
            name: 'Biblo Tøyen',
            lat,
            lon,
            r: 60,
            category: 'litteratur',
            year: 2016,
            desc: 'Eget Deichman-bibliotek i Hagegata 22 for unge mellom 10 og 15 år. Biblo kombinerer bøker og lesing med verksteder, teknologi, matlaging og sosialt opphold i et rom utviklet på de unges premisser.',
            popupDesc: 'Biblo Tøyen åpnet 31. mars 2016 som et eget Deichman-bibliotek for aldersgruppen 10–15 år. Det ligger i Hagegata 22 og er fysisk og institusjonelt adskilt fra den ordinære Deichman Tøyen-filialen i Hagegata 28. Aldersavgrensningen er en del av selve idéen: unge skulle få et gratis sted der de kunne lese, lære, skape og være sammen på egne premisser.\n\nBøker og lesing står sentralt, men biblioteket er også bygget som et sosialt og skapende rom. Programmet har omfattet blant annet kodeklubb, forfattermøter, film, matlaging og ulike verksteder. Biblo viser dermed hvordan et moderne bibliotek kan være både litteraturinstitusjon, læringsarena og et lavterskel tredje sted mellom skole og hjem.\n\nHistory Go behandler Biblo som den konkrete bibliotekfilialen i Hagegata 22. Stedet skal ikke slås sammen med `toyen_torg`, og det skal heller ikke blandes med den separate Deichman Tøyen-filialen for alle aldersgrupper.',
            emne_ids: [
              'em_lit_bibliotek_og_offentlighet',
              'em_lit_lesekultur_og_formidling'
            ],
            quiz_profile: {
              place_type: 'bibliotek',
              subtype: 'aldersavgrenset_ungdomsbibliotek_og_tredje_sted',
              signature_features: [
                'åpnet 31. mars 2016',
                'eget bibliotek for unge mellom 10 og 15 år',
                'fysisk adresse Hagegata 22',
                'kombinerer litteratur med skapende aktiviteter og sosialt opphold',
                'adskilt fra ordinære Deichman Tøyen i Hagegata 28'
              ],
              primary_angles: [
                'bibliotekhistorie',
                'barn_og_unges_lesekultur',
                'litteraturformidling',
                'tredje_sted_og_tilhorighet',
                'brukermedvirkning_og_rom'
              ],
              question_families: [
                'institusjonshistorie',
                'bruk_og_malgruppe',
                'rom_og_biblioteksideal',
                'litteratur_og_aktivitet',
                'kontrast'
              ],
              avoid_angles: [
                'generisk_bibliotekquiz',
                'omtale_biblo_som_apent_for_alle_aldre',
                'redusere_stedet_til_aktivitetsklubb_uten_litteratur',
                'forveksle_med_deichman_toyen_hagegata_28',
                'forveksle_med_toyen_torg_som_omrade'
              ],
              must_include: [
                'aldersgruppen 10–15 år som del av konseptet',
                'bibliotekfunksjonen og bøkenes rolle',
                'kombinasjonen av lesing, skapende aktivitet og sosialt opphold',
                'skillet fra den ordinære Tøyen-filialen'
              ],
              contrast_targets: [
                'deichman_grunerlokka',
                'deichman_bjorvika',
                'toyen_torg'
              ],
              notes: 'Spør Biblo som et konkret ungdomsbibliotek og litterært tredje sted. Eksterne Deichman-, kommune- og bibliotekskilder skal dominere synlig quizinnhold.'
            },
            locatorType: 'building',
            sourceProvider: 'official_address',
            sourceObjectId,
            address: {
              street: 'Hagegata',
              number: '22',
              postcode: '0653',
              city: 'Oslo',
              country: 'NO'
            },
            geocodeAccuracy: 'rooftop',
            coordRole: 'display_marker',
            coordStatus: 'verified',
            coordSource: 'geonorge_adresser_v1',
            coordSourceId: sourceObjectId,
            coordSourceUrl: sourceUrl,
            coordType: 'address_point',
            coordVerifiedAt: '2026-07-20',
            coordNote,
            externalLinks: [
              {
                type: 'official',
                label: 'VisitOSLO – Biblo Tøyen',
                url: 'https://www.visitoslo.com/no/produkt/?name=Biblo-Toyen&tlp=3582403',
                lang: 'nb',
                verifiedAt: '2026-07-20'
              },
              {
                type: 'official',
                label: 'Oslo kommune – Bibliotekene: mye mer enn bøker',
                url: 'https://magasin.oslo.kommune.no/byplan/bibliotekene-mye-mer-enn-boker',
                lang: 'nb',
                verifiedAt: '2026-07-20'
              }
            ]
          };
          writeJson(path.join('data', placeRel), place);

          const evidence = {
            schemaVersion: '1.0',
            placeId,
            placeFile: `data/${placeRel}`,
            evidenceStatus: 'applied_to_place',
            coordinateDecision: 'do_not_change_coordinates_yet',
            currentCoordinate: {
              lat,
              lon,
              r: 60,
              coordStatus: 'verified',
              coordSource: 'geonorge_adresser_v1',
              coordType: 'address_point',
              coordNote
            },
            identity: {
              currentName: 'Biblo Tøyen',
              resolvedIdentity: 'Deichman Biblo Tøyen, dedicated library for ages 10–15 at Hagegata 22',
              identityStatus: 'resolved',
              identityProblem: '',
              locatorTypeCandidate: 'building',
              requiresSplit: false,
              splitReason: ''
            },
            requiredEvidence: [
              'entydig offisielt adressepunkt for Hagegata 22',
              'dokumentert egen Biblo-identitet og målgruppe',
              'eksplisitt skille fra Deichman Tøyen i Hagegata 28 og Tøyen torg som område'
            ],
            evidence: [
              {
                sourceProvider: 'official_address',
                sourceName: 'geonorge_adresser_v1',
                sourceUrl,
                sourceObjectId,
                sourceQuality: 'official_address_plus_current_library_identity',
                finding: 'Geonorge returnerer ett entydig adressetreff for Hagegata 22. Kandidatauditten dokumenterer Biblo som en egen Deichman-filial for 10–15-åringer og skiller stedet fra den ordinære Tøyen-filialen i Hagegata 28.',
                canVerifyCoordinate: true,
                reason: 'Det offisielle adressepunktet er et stabilt bygningsanker for Biblo Tøyens konkrete besøkssted.'
              }
            ],
            addressCandidates: [
              {
                address: 'Hagegata 22 Oslo',
                sourceProvider: 'official_address',
                sourceObjectId,
                lat,
                lon,
                canApplyToPlace: true
              }
            ],
            sourceObjectCandidates: [
              { sourceProvider: 'official_address', sourceObjectId, canApplyToPlace: true }
            ],
            geometryCandidates: [],
            coordinateCandidates: [
              { lat, lon, coordRole: 'display_marker', canApplyToPlace: true }
            ],
            decision: {
              canBecomeVerified: true,
              blockedReason: '',
              nextAction: 'Kildekontrakt, egen bibliotekidentitet og representasjonsanker er anvendt på canonical place.'
            },
            notes: [coordNote]
          };
          writeJson(path.join('data/coordinate-evidence', evidenceRel), evidence);

          const placeManifestPath = 'data/places/manifest.json';
          const placeManifest = readJson(placeManifestPath);
          if (!placeManifest.files.includes(placeRel)) placeManifest.files.push(placeRel);
          writeJson(placeManifestPath, placeManifest);

          const evidenceManifestPath = 'data/coordinate-evidence/manifest.json';
          const evidenceManifest = readJson(evidenceManifestPath);
          if (!evidenceManifest.files.includes(evidenceRel)) evidenceManifest.files.push(evidenceRel);
          writeJson(evidenceManifestPath, evidenceManifest);

          const protocolPath = 'docs/coordinates/coordinate-control-protocol.md';
          let protocol = fs.readFileSync(protocolPath, 'utf8');
          const osloStart = protocol.indexOf('## Oslo');
          const noCoordStart = protocol.indexOf('### Dokumenterte Oslo-kontroller uten godkjent koordinat');
          if (osloStart < 0 || noCoordStart < 0) throw new Error('Could not locate bounded Oslo protocol section');
          const osloSection = protocol.slice(osloStart, noCoordStart);
          const rows = [...osloSection.matchAll(/^\| (\d+) \| `([^`]+)` \|.*$/gm)];
          if (!rows.length) throw new Error('No Oslo protocol rows found');
          const lastRow = rows[rows.length - 1];
          const maxBatch = Math.max(...rows.map(m => Number(m[1])));
          const nextBatch = maxBatch + 1;
          const newRow = `| ${nextBatch} | \`${placeId}\` | Biblo Tøyen | verified | \`${sourceObjectId}\` |`;
          const insertAt = osloStart + lastRow.index + lastRow[0].length;
          protocol = protocol.slice(0, insertAt) + '\n' + newRow + protocol.slice(insertAt);

          const summaryRe = /Oslo-tabellen inneholder nå (\d+) verifiserte eller kildekontrollerte canonical steder\. Batch \d+ legger til .*? Antallet fullførte kontroller uten godkjent Oslo-koordinat er (\d+)\./;
          const summaryMatch = protocol.match(summaryRe);
          if (!summaryMatch) throw new Error('Could not locate Oslo protocol summary');
          const newTotal = Number(summaryMatch[1]) + 1;
          const noCoordCount = Number(summaryMatch[2]);
          protocol = protocol.replace(summaryRe, `Oslo-tabellen inneholder nå ${newTotal} verifiserte eller kildekontrollerte canonical steder. Batch ${nextBatch} legger til Biblo Tøyen med den entydige offisielle Geonorge-adressekoordinaten for Hagegata 22, eksplisitt skilt fra Tøyen torg og den ordinære Deichman Tøyen-filialen i Hagegata 28. Antallet fullførte kontroller uten godkjent Oslo-koordinat er ${noCoordCount}.`);
          fs.writeFileSync(protocolPath, protocol);

          const reportDir = 'reports/visitoslo-oslo-east-audit-20260720/biblo-toyen';
          writeJson(path.join(reportDir, 'production-decision.json'), {
            placeId,
            decision: 'produce_distinct_canonical_library_place',
            primaryCategory: 'litteratur',
            coordinate: { lat, lon, sourceObjectId },
            nearbyWithin350m: nearby,
            identityDecision: 'Biblo Tøyen is the dedicated 10–15-year-old library at Hagegata 22; Deichman Tøyen at Hagegata 28 and the broad Tøyen torg place are separate identities.',
            protocolBatch: nextBatch
          });

          console.log(JSON.stringify({ placeId, nextBatch, nearby }, null, 2));
          NODE

      - name: Run and persist validation gates
        shell: bash
        run: |
          set -u
          LOGDIR="reports/coordinate-branch-runner/agent_oslo-coordinate-biblo-toyen-production"
          mkdir -p "$LOGDIR"
          : > "$LOGDIR/gate-status.txt"
          BLOCKING_FAIL=0

          run_gate() {
            name="$1"
            shift
            set +e
            "$@" > >(tee "$LOGDIR/$name.log") 2>&1
            code=$?
            set -e
            printf '%s\n' "$code" > "$LOGDIR/$name.exit-code.txt"
            echo "$name=$code" >> "$LOGDIR/gate-status.txt"
            if [ "$code" -ne 0 ]; then BLOCKING_FAIL=1; fi
            return 0
          }

          set -e
          run_gate places-index-build npm run places:index:build
          run_gate split-manifest-sync npm run audit:places-split-manifest-sync
          run_gate places-index-check npm run places:index:check
          run_gate coordinate-source-contract npm run test:coordinate-source-contract
          run_gate coordinate-quality npm run places:coords:quality
          run_gate coordinate-intake npm run places:coords:intake -- --strict-new
          run_gate coordinate-evidence npm run places:coords:evidence:audit
          run_gate git-diff-check git diff --check

          set +e
          npm run health:places 2>&1 | tee "$LOGDIR/health-places.log"
          HEALTH_CODE=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$HEALTH_CODE" > "$LOGDIR/health-places.exit-code.txt"
          echo "health-places=$HEALTH_CODE" >> "$LOGDIR/gate-status.txt"
          printf '%s\n' "$BLOCKING_FAIL" > "$LOGDIR/blocking-fail.txt"

      - name: Commit production result
        shell: bash
        run: |
          set -euo pipefail
          LOGDIR="reports/coordinate-branch-runner/agent_oslo-coordinate-biblo-toyen-production"
          BLOCKING_FAIL=$(cat "$LOGDIR/blocking-fail.txt")
          rm -f .github/workflows/temp-biblo-toyen-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Biblo Tøyen as canonical Oslo literature place"
          git push origin HEAD:agent/oslo-coordinate-biblo-toyen-production
          if [ "$BLOCKING_FAIL" -ne 0 ]; then exit 1; fi
