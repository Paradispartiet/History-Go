              return json.loads(Path(path).read_text(encoding='utf-8'))

          def write(path, value):
              Path(path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          place_path = Path('data/places/natur/oslo/places_oslo_natur_akerselvarute/stilla_nydalen.json')
          story_path = Path('data/stories/stories_stilla_nydalen.json')
          quiz_path = Path('data/quiz/natur/stilla_nydalen_sets.json')
          article_path = Path('data/leksikon/places/oslo/natur/leksikon_oslo_natur_batch1.json')
