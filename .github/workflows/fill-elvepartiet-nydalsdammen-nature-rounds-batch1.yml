name: Fill Elvepartiet below Nydalsdammen nature rounds batch 1

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fill-elvepartiet-nydalsdammen-nature-rounds-batch1.yml
      - .github/workflows/kick-elvepartiet-nydalsdammen-nature-rounds-batch1.yml

permissions:
  contents: write

