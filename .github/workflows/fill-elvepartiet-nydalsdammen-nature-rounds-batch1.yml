          route_manifest_path = Path('data/places/natur/oslo/places_oslo_natur_akerselvarute_manifest.json')

          place = read(place_path)
          assert place['id'] == 'stilla_nydalen'
          assert [place['lat'], place['lon'], place['r'], place['year']] == [59.9449, 10.7654, 120, 1900]

