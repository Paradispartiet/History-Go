name: Stortorget current-main materialize once

on:
  push:
    branches:
      - agent/stortorget-production-closure-20260911-current-main
    paths:
      - '.github/workflows/_stortorget-current-main-materialize-once.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stortorget-production-closure-20260911-current-main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebuild canonical Stortorget production
        run: node tools/build-stortorget-completion.mjs
      - name: Normalize image backlog summary
        run: |
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/stortorget-image-audit.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('/tmp/stortorget-image-audit.json', 'utf8'));
          const file = 'data/places/place_image_backlog_summary.json';
          const backlog = JSON.parse(fs.readFileSync(file, 'utf8'));
          backlog.generatedAt = '2026-09-11';
          backlog.generatedFromCommit = 'stortorget_current_main_replay_20260911';
          backlog.totalPlaces = audit.totalPlaces;
          backlog.summary = { validLocal: audit.summary.local, validRemote: audit.summary.remote, optionalMissing: audit.summary.optional, missing: audit.summary.missing, invalidLocalPath: audit.summary.invalid, remaining: audit.summary.missing + audit.summary.invalid };
          for (const [category, row] of Object.entries(audit.byCategory)) backlog.byCategory[category] = { ...backlog.byCategory[category], total: row.total, valid: row.local + row.remote, optional: row.optional, missing: row.missing, invalid: row.invalid };
          fs.writeFileSync(file, JSON.stringify(backlog, null, 2) + '\n');
          NODE
      - name: Record rule preflight
        run: node scripts/place-production-rule-preflight.mjs record --workcard reports/place-production/stortorget-workcard-current.json --place-id stortorget --category by
      - name: Regenerate People indexes
        run: |
          npm run civication:history-people:build
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - name: Regenerate place derivatives
        run: |
          npm run epoker:places:build
          node scripts/build-quiz-production-context.mjs --category by --target stortorget --output data/quiz/production_context/by/stortorget.json
          npm run places:index:build
          npm run place-open:build
          node scripts/build-fagverk-release-manifest.mjs
      - name: Verify focused Stortorget contracts
        run: |
          node tools/validate-stortorget-v42.mjs
          npm run places:index:check
          npm run place-open:check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Remove one-shot workflow
        run: git rm -- .github/workflows/_stortorget-current-main-materialize-once.yml
      - name: Verify Stortorget regression
        run: node --test tests/stortorget-production-closure.test.mjs
      - name: Commit permanent current-main Stortorget production
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Complete Stortorget production on current main'
          git push origin HEAD:agent/stortorget-production-closure-20260911-current-main
