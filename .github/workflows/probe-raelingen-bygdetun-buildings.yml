name: Probe Rælingen bygdetun building geometry

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  probe:
    if: github.head_ref == 'agent/akershus-raelingen-bygdetun-production'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch actual tun geometry
        shell: bash
        run: |
          set -euo pipefail
          out='reports/akershus-coordinate-raelingen-bygdetun-source-probe'
          mkdir -p "$out"

          for id in 1926783972 6593405625 2311812289; do
            curl --fail --location --retry 4 --retry-delay 3 \
              -A 'History-Go coordinate verification/1.0' \
              "https://api.openstreetmap.org/api/0.6/node/${id}" \
              | tee "$out/osm-node-${id}.xml" >/dev/null
          done

          curl --fail --location --retry 4 --retry-delay 3 \
            -A 'History-Go coordinate verification/1.0' \
            'https://api.openstreetmap.org/api/0.6/map?bbox=11.0800,59.9193,11.0835,59.9212' \
            | tee "$out/osm-actual-raelingen-bygdetun-bbox.xml" >/dev/null

          python - <<'PY' | tee "$out/building-summary.txt"
          import json
          import math
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path('reports/akershus-coordinate-raelingen-bygdetun-source-probe')
          legacy = (59.9261, 11.0608)
          museum = (59.9203765, 11.0818226)
          official = (59.92032136910839, 11.081489629785487)

          def hav(a, b):
              R = 6371000.0
              p1, p2 = map(math.radians, (a[0], b[0]))
              dp = math.radians(b[0] - a[0])
              dl = math.radians(b[1] - a[1])
              h = math.sin(dp/2)**2 + math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2 * R * math.asin(math.sqrt(h))

          root = ET.parse(out / 'osm-actual-raelingen-bygdetun-bbox.xml').getroot()
          nodes = {n.attrib['id']: (float(n.attrib['lat']), float(n.attrib['lon'])) for n in root.findall('node')}
          rows = []
          for way in root.findall('way'):
              tags = {t.attrib['k']: t.attrib['v'] for t in way.findall('tag')}
              if not tags.get('building'):
                  continue
              pts = [nodes[nd.attrib['ref']] for nd in way.findall('nd') if nd.attrib['ref'] in nodes]
              if len(pts) < 3:
                  continue
              ring = [(lon, lat) for lat, lon in pts]
              if ring[0] != ring[-1]:
                  ring.append(ring[0])
              area2 = cx = cy = 0.0
              for (x1, y1), (x2, y2) in zip(ring, ring[1:]):
                  cross = x1 * y2 - x2 * y1
                  area2 += cross
                  cx += (x1 + x2) * cross
                  cy += (y1 + y2) * cross
              if abs(area2) < 1e-15:
                  lat = sum(p[0] for p in pts) / len(pts)
                  lon = sum(p[1] for p in pts) / len(pts)
              else:
                  lon = cx / (3 * area2)
                  lat = cy / (3 * area2)
              rows.append({
                  'osm_way': way.attrib['id'],
                  'lat': lat,
                  'lon': lon,
                  'distance_to_museum_node_m': round(hav((lat, lon), museum), 1),
                  'distance_to_official_address_m': round(hav((lat, lon), official), 1),
                  'distance_from_legacy_m': round(hav((lat, lon), legacy), 1),
                  'tags': tags,
              })
          rows.sort(key=lambda r: r['distance_to_museum_node_m'])
          print('museum_node=' + json.dumps({'lat': museum[0], 'lon': museum[1], 'distance_from_legacy_m': round(hav(legacy, museum), 1)}, ensure_ascii=False))
          print('official_address=' + json.dumps({'lat': official[0], 'lon': official[1], 'distance_from_legacy_m': round(hav(legacy, official), 1), 'distance_to_museum_node_m': round(hav(official, museum), 1)}, ensure_ascii=False))
          print('nearest_buildings=' + json.dumps(rows[:20], ensure_ascii=False, sort_keys=True))
          PY

      - name: Remove probe workflow and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/probe-raelingen-bygdetun-buildings.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/akershus-coordinate-raelingen-bygdetun-source-probe .github/workflows/probe-raelingen-bygdetun-buildings.yml
          git commit -m 'Persist Rælingen bygdetun building geometry evidence'
          git push origin HEAD:${{ github.head_ref }}
