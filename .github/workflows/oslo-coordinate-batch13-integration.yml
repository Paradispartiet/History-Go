name: Oslo coordinate batch 13 integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'agent/oslo-coordinate-control-batch-13'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply batch
        run: node scripts/tmp-complete-oslo-coordinate-batch13.mjs
      - name: Rebuild place index
        run: npm run places:index:build
      - name: Validate batch
        env:
          COORD_INTAKE_BASE: origin/main
        run: |
          npm run places:index:check
          npm run audit:places-split-manifest-sync
          npm run places:coords:quality
          npm run places:coords:intake
          npm run places:coords:evidence:audit
          git diff --check
      - name: Remove temporary integration files
        run: |
          rm scripts/tmp-complete-oslo-coordinate-batch13.mjs
          rm .github/workflows/oslo-coordinate-batch13-integration.yml
      - name: Commit integrated batch
        run: |
          git config user.name 'history-go-coordinate-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Complete Oslo coordinate control batch 13'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
