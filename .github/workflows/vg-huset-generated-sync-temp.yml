name: VG-huset generated place artifacts (one-shot)

on:
  push:
    branches:
      - agent/vg-huset-source-preflight-20261009

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/agent/vg-huset-source-preflight-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vg-huset-source-preflight-20261009
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate only from existing canonical source files
        run: |
          set -euo pipefail
          npm run places:index:build
          npm run place-open:build
          npm run places:index:check
          npm run place-open:check
          node --test tests/vg-huset-collections.test.mjs
      - name: Limit the generator output to VG-huset artifacts
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/vg-huset-changed.txt
          cat /tmp/vg-huset-changed.txt
          node <<'NODE'
          const fs=require("node:fs");
          const files=fs.readFileSync("/tmp/vg-huset-changed.txt","utf8").trim().split("\n").filter(Boolean);
          const allow=new Set(["data/places/places_index.json","data/runtime/place-open/vg_huset.json"]);
          const unexpected=files.filter(file=>!allow.has(file));
          if(unexpected.length) throw new Error("Unexpected generated changes: "+unexpected.join(", "));
          if(!files.includes("data/runtime/place-open/vg_huset.json")) throw new Error("VG-huset runtime missing from generator output");
          NODE
      - name: Commit generated artifacts and remove both temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/places_index.json data/runtime/place-open/vg_huset.json
          git rm .github/workflows/vg-huset-licensed-asset-import-temp.yml .github/workflows/vg-huset-generated-sync-temp.yml
          git diff --cached --name-only
          git commit -m "Sync VG-huset PlaceCard runtime and retire temporary workflows"
          git push origin HEAD:refs/heads/agent/vg-huset-source-preflight-20261009
