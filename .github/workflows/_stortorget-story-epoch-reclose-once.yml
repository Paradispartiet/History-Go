name: Stortorget Story epoch reclose once

on:
  push:
    branches:
      - agent/stortorget-production-closure-20260911-current-main
    paths:
      - '.github/workflows/_stortorget-story-epoch-reclose-once.yml'

permissions:
  contents: write

jobs:
  reclose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stortorget-production-closure-20260911-current-main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate place and Story runtime before epochs
        run: |
          npm run places:index:build
          npm run place-open:build
      - name: Regenerate epoch index last
        run: npm run epoker:places:build
      - name: Build governance tools
        run: npm run build:tools --silent
      - name: Verify Stories integrity
        run: node dist/tools/check_stories_integrity.mjs
      - name: Verify generated derivatives
        run: |
          npm run places:index:check
          npm run place-open:check
          npm run epoker:places:check
          node --test tests/stortorget-production-closure.test.mjs
      - name: Remove one-shot workflow
        run: git rm -- .github/workflows/_stortorget-story-epoch-reclose-once.yml
      - name: Commit permanent Story and epoch closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Reclose Stortorget Story and epoch derivatives'
          git push origin HEAD:agent/stortorget-production-closure-20260911-current-main
