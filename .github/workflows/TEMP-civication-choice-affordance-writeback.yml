name: TEMP Civication choice affordance writeback

on:
  push:
    branches:
      - agent/civication-knowledge-choice-affordance
    paths:
      - scripts/TEMP_patch_civication_choice_affordance.py
      - .github/workflows/TEMP-civication-choice-affordance-writeback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-knowledge-choice-affordance
          fetch-depth: 0
      - name: Apply bounded knowledge affordance patch
        run: python scripts/TEMP_patch_civication_choice_affordance.py
      - name: Materialize scene registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Verify foundation and Arkiv vertical slice
        run: |
          node --check js/Civication/core/civicationChoiceAffordance.js
          node --check js/Civication/core/civicationEventEngine.js
          node --check js/Civication/civicationShellLoader.js
          node --check scripts/build-civication-scene-registry.mjs
          python -m json.tool data/Civication/sceneContractV1.schema.json >/dev/null
          python -m json.tool data/Civication/mailFamilies/historie/consequence/historie_arkiv_og_dokumentasjon_consequence.json >/dev/null
          node scripts/build-civication-scene-registry.mjs --check
          node tests/civication-history-go-choice-affordance.test.js
          node tests/civication-work-object-scene-pipeline.test.js
          node tests/civication-institution-authority-foundation.test.js
          node tests/civication-historie-arkiv-work-object-continuity.test.js
          node tests/civication-historie-arkiv-dokumentasjon-playability.test.js
      - name: Commit writeback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/sceneContractV1.schema.json data/Civication/compiledSceneRegistryV1.json data/Civication/mailFamilies/historie/consequence/historie_arkiv_og_dokumentasjon_consequence.json js/Civication/core/civicationEventEngine.js js/Civication/civicationShellLoader.js scripts/build-civication-scene-registry.mjs
          git diff --cached --check
          git commit -m "Connect History Go learning to professional choices"
          git push origin HEAD:agent/civication-knowledge-choice-affordance
