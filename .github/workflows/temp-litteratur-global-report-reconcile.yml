name: TEMP Litteratur global theory report reconcile

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize reconciled global report
        run: |
          node --check scripts/audit-fagverk-theory-integrity.mjs
          node --check tools/audit-musikk-theory-integrity.mjs
          node --check tools/audit-litteratur-theory-integrity.mjs
          node scripts/audit-fagverk-theory-integrity.mjs --write-report --no-check-report
          node --test tests/musikk-theory-integrity.test.mjs
          node --test tests/litteratur-theory-integrity.test.mjs
          node --test tests/fagverk-theory-integrity.test.mjs
      - name: Upload reconciled global report
        uses: actions/upload-artifact@v4
        with:
          name: litteratur-global-theory-report-reconcile
          path: reports/fagverk/fagverk-theory-integrity-audit.json
