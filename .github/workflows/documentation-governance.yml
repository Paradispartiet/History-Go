name: Documentation governance

on:
  pull_request:
    paths:
      - "README.md"
      - "DOCS.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README/**"
      - "docs/**"
      - "reports/README.md"
      - "scripts/check-documentation-governance.mts"
      - ".github/workflows/documentation-governance.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "DOCS.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README/**"
      - "docs/**"
      - "reports/README.md"
      - "scripts/check-documentation-governance.mts"
      - ".github/workflows/documentation-governance.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-social-contract-status:
    name: Temporary Social contract status sync
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Synchronize status and restore workflows
        run: |
          python scripts/tmp-sync-social-contract-status.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/documentation-governance.yml
          rm -f .github/workflows/tmp-sync-social-contract-status.yml
          rm -f .tmp-social-contract-status-trigger
          rm -f scripts/tmp-sync-social-contract-status.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs backend/README.md .github/workflows/documentation-governance.yml .github/workflows/tmp-sync-social-contract-status.yml .tmp-social-contract-status-trigger scripts/tmp-sync-social-contract-status.py
          git diff --cached --check
          git commit -m "Synchronize Social Meet contract status"
          git push origin "HEAD:${{ github.head_ref }}"

  documentation-governance:
    name: Documentation registry and links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build TypeScript scripts
        run: npm run build:scripts

      - name: Validate documentation governance
        run: |
          set -o pipefail
          mkdir -p reports/documentation-governance
          node dist/scripts/check-documentation-governance.mjs 2>&1 | tee reports/documentation-governance/audit.log

      - name: Upload documentation governance audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-governance-audit
          path: reports/documentation-governance/
          if-no-files-found: error
