name: Documentation governance

on:
  pull_request:
    paths:
      - "README.md"
      - "DOCS.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README/**"
      - "docs/**"
      - "reports/README.md"
      - "scripts/check-documentation-governance.mts"
      - ".github/workflows/documentation-governance.yml"
      - ".github/workflows/one-shot-politikk-place-recipe.yml"
      - ".github/scripts/materialize-politikk-place-recipe.py"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "DOCS.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README/**"
      - "docs/**"
      - "reports/README.md"
      - "scripts/check-documentation-governance.mts"
      - ".github/workflows/documentation-governance.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-politikk-place-recipe:
    name: Materialize Politikk place recipe
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/politikk-sted-oppskrift'
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize canonical documentation
        run: python .github/scripts/materialize-politikk-place-recipe.py

      - name: Restore permanent workflow and commit production diff
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/documentation-governance.yml
          rm -f .github/workflows/one-shot-politikk-place-recipe.yml
          rm -f .github/scripts/materialize-politikk-place-recipe.py
          git config user.name "history-go-doc-bot"
          git config user.email "history-go-doc-bot@users.noreply.github.com"
          git add docs/PLACE_PRODUCTION_CHECKLIST.md docs/documentation_registry.json .github/workflows/documentation-governance.yml .github/workflows/one-shot-politikk-place-recipe.yml .github/scripts/materialize-politikk-place-recipe.py
          git commit -m "Gjør Politikk-stedsgate obligatorisk i produksjonsoppskriften"
          git push origin HEAD:${{ github.head_ref }}

  documentation-governance:
    name: Documentation registry and links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build TypeScript scripts
        run: npm run build:scripts

      - name: Validate documentation governance
        run: |
          set -o pipefail
          mkdir -p reports/documentation-governance
          node dist/scripts/check-documentation-governance.mjs 2>&1 | tee reports/documentation-governance/audit.log

      - name: Upload documentation governance audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-governance-audit
          path: reports/documentation-governance/
          if-no-files-found: error
