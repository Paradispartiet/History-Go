name: Alna five generated synchronization

on:
  pull_request:
    paths:
      - '.github/workflows/alna-five-generated-sync-20261020.yml'

permissions:
  contents: write

concurrency:
  group: alna-five-generated-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synchronize:
    name: Sync five changed Place payloads and history index
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'content/alna-historical-place-prose-batch-20261020'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate only derived runtime and history data
        run: |
          set -euo pipefail
          npm run place-open:build
          npm run epoker:places:build
      - name: Commit derived files and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/runtime/place-open/groruddammen.json \
            data/runtime/place-open/alna_bryn.json \
            data/runtime/place-open/svartdalen.json \
            data/runtime/place-open/kvaernerbyen_alna.json \
            data/runtime/place-open/alna_utlop_bjorvika.json \
            data/epoker/epoke-place-index.json
          git rm -- .github/workflows/alna-five-generated-sync-20261020.yml
          if ! git diff --cached --quiet; then
            git commit -m "build(alna): synchronize five place-open payloads and historical timeline"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
