name: TEMP Civication Politikk Regjeringsledelse prerequisites replay

on:
  push:
    branches:
      - agent/civication-politikk-regjeringsledelse-prerequisites-replay-20260907
    paths:
      - .github/workflows/TEMP-civication-politikk-regjeringsledelse-prerequisites-replay.yml

permissions:
  contents: write

concurrency:
  group: temp-civication-politikk-regjeringsledelse-prerequisites-replay
  cancel-in-progress: true

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-politikk-regjeringsledelse-prerequisites-replay-20260907
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Require fresh main ancestry before verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "Replay branch is already behind main; refusing to generate stale global state." >&2
            exit 1
          }

      - name: Register Regjeringsledelse role model in manifest
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'data/Civication/roleModels/manifest.json';
          const model = 'data/Civication/roleModels/politikk/politikk_regjeringsledelse.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!Array.isArray(manifest.files)) throw new Error('roleModels manifest files must be an array');
          if (manifest.files.includes(model)) throw new Error('Regjeringsledelse model is already registered; replay assumptions changed');
          manifest.files.push(model);
          manifest.files.sort((a,b) => a.localeCompare(b, 'en'));
          if (manifest.files.filter(x => x === model).length !== 1) throw new Error('Regjeringsledelse manifest entry must be unique');
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Generate canonical derived surfaces
        run: |
          set -euo pipefail
          node scripts/audit-civication-role-packs.mjs
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
          node scripts/build-civication-scene-registry.mjs --write
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts

      - name: Verify Regjeringsledelse prerequisites
        run: node tests/civication-politikk-regjeringsledelse-prerequisites.test.js

      - name: Verify Politics life/career split
        run: node tests/civication-politics-life-career-split.test.js

      - name: Verify Career Gameplay Matrix
        run: node tests/civication-career-gameplay-matrix.test.js

      - name: Verify Role World readiness
        run: node tests/civication-role-world-rollout-readiness.test.js

      - name: Verify Scene Registry
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Verify Scenario People index
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check

      - name: Verify Scenario People audit
        run: node --test tests/civication-scenario-people.test.mjs

      - name: Verify full Civication suite
        run: node tests/run-civication-tests.mjs

      - name: Verify job learning profiles
        run: npm run audit:job-learning-profiles

      - name: Verify job knowledge requirements
        run: npm run audit:job-knowledge-requirements

      - name: Verify exact permanent replay scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "Main moved during verification; refusing stale permanent commit." >&2
            exit 1
          }
          TEMP=.github/workflows/TEMP-civication-politikk-regjeringsledelse-prerequisites-replay.yml
          mapfile -t changed < <(
            {
              git diff --name-only origin/main...HEAD
              git diff --name-only
              git ls-files --others --exclude-standard
            } | grep -vFx "$TEMP" | sort -u
          )
          printf '%s\n' "${changed[@]}"
          for f in "${changed[@]}"; do
            case "$f" in
              data/Civication/careerGameplayMatrix.json|data/Civication/compiledSceneRegistryV1.json|data/Civication/roleModels/manifest.json|data/Civication/rolePackIndex.json|data/Civication/roleWorldRolloutReadiness.json|data/Civication/scenarioPeople/generated/politikk.json|data/Civication/scenarioPeople_index.json|docs/CIVICATION_ROLE_PACK_INDEX.md|reports/civication-role-packs.md|reports/civication-career-gameplay-matrix.md|reports/civication-role-world-rollout-readiness.md|reports/CIVICATION_POLITIKK_REGJERINGSLEDELSE_PREREQUISITES_SOURCE_FIRST.md|tests/civication-politikk-regjeringsledelse-prerequisites.test.js|data/Civication/roleModels/politikk/politikk_regjeringsledelse.json|data/Civication/workGrammars/politikk/politikk_regjeringsledelse.json|data/Civication/mailPlans/politikk/politikk_regjeringsledelse_plan.json|data/Civication/mailFamilies/politikk/*/politikk_regjeringsledelse_*.json)
                ;;
              *)
                echo "Unexpected replay path: $f" >&2
                exit 1
                ;;
            esac
          done
          for required in \
            data/Civication/roleModels/manifest.json \
            data/Civication/roleModels/politikk/politikk_regjeringsledelse.json \
            data/Civication/workGrammars/politikk/politikk_regjeringsledelse.json \
            data/Civication/mailPlans/politikk/politikk_regjeringsledelse_plan.json \
            reports/CIVICATION_POLITIKK_REGJERINGSLEDELSE_PREREQUISITES_SOURCE_FIRST.md \
            tests/civication-politikk-regjeringsledelse-prerequisites.test.js \
            data/Civication/roleWorldRolloutReadiness.json \
            data/Civication/rolePackIndex.json \
            data/Civication/careerGameplayMatrix.json; do
            printf '%s\n' "${changed[@]}" | grep -Fx "$required" >/dev/null || {
              echo "Missing required fresh-main replay path: $required" >&2
              exit 1
            }
          done
          for type in job people conflict story event micro followup knowledge consequence; do
            required="data/Civication/mailFamilies/politikk/$type/politikk_regjeringsledelse_${type}.json"
            printf '%s\n' "${changed[@]}" | grep -Fx "$required" >/dev/null || {
              echo "Missing replay mail family: $required" >&2
              exit 1
            }
          done
          git diff --check

      - name: Commit fresh-main verified package
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "Main moved before permanent commit; refusing stale package." >&2
            exit 1
          }
          rm -f .github/workflows/TEMP-civication-politikk-regjeringsledelse-prerequisites-replay.yml
          git diff --check
          git add -A
          git diff --cached --check
          git commit -m "Verify Regjeringsledelse prerequisites on fresh main"
          git push origin HEAD:agent/civication-politikk-regjeringsledelse-prerequisites-replay-20260907
