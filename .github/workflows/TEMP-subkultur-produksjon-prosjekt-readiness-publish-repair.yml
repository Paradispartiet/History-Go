name: TEMP Subkultur Produksjon og prosjekt readiness publish repair

on:
  push:
    branches:
      - agent/civication-subkultur-produksjon-prosjekt-role-world-replay-20260904

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate readiness before career normalization
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Regenerate career gameplay matrix
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Regenerate final readiness outputs
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Career gameplay parity
        run: node scripts/audit-civication-career-gameplay.mjs --check
      - name: Role World readiness parity
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --check
      - name: Current role focused gate
        run: node tests/civication-subkultur-produksjon-og-prosjekt-role-world-rollout.test.js
      - name: Current role prerequisite compatibility
        run: node tests/civication-subkultur-produksjon-og-prosjekt-prerequisites.test.js
      - name: Compiled scene registry parity
        run: node scripts/build-civication-scene-registry.mjs --check
      - name: Full Civication
        run: npm run test:civication
      - name: Repository diff gate
        run: git diff --check
      - name: Publish complete generated readiness outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/TEMP-subkultur-produksjon-prosjekt-readiness-publish-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/Civication/careerGameplayMatrix.json \
            data/Civication/roleWorldRolloutReadiness.json \
            reports/civication-role-world-rollout-readiness.md \
            .github/workflows/TEMP-subkultur-produksjon-prosjekt-readiness-publish-repair.yml
          git diff --cached --check
          git commit -m "Publish complete Role World readiness outputs [materialized]"
          git push origin HEAD:${GITHUB_REF_NAME}
