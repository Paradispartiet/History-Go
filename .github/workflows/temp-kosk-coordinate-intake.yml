name: Temporary KÖSK coordinate intake

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  intake:
    if: github.head_ref == 'data/oslo-kosk-coordinate-intake'
    runs-on: ubuntu-latest
    steps:
      - name: Check out intake branch
        uses: actions/checkout@v4
        with:
          ref: data/oslo-kosk-coordinate-intake
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run and save both Geonorge lookups
        shell: bash
        run: |
          set -euo pipefail
          REPORTDIR="reports/visitoslo-oslo-east-audit-20260720/kosk"
          mkdir -p "$REPORTDIR"
          npm run places:coords:find:address -- --address "Operagata 63A Oslo" \
            2>&1 | tee "$REPORTDIR/geonorge-operagata-63a.txt"
          npm run places:coords:find:address -- --address "Operagata 63C Oslo" \
            2>&1 | tee "$REPORTDIR/geonorge-operagata-63c.txt"

      - name: Resolve current gallery address and duplicate gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          from pathlib import Path

          reportdir = Path('reports/visitoslo-oslo-east-audit-20260720/kosk')

          def parse_lookup(filename):
              text = (reportdir / filename).read_text()
              start = text.find('{\n')
              if start < 0:
                  raise SystemExit(f'No JSON in {filename}')
              return json.loads(text[start:])

          a = parse_lookup('geonorge-operagata-63a.txt')
          c = parse_lookup('geonorge-operagata-63c.txt')

          index = json.loads(Path('data/places/places_index.json').read_text())
          keyword_matches = []
          for p in index:
              hay = ' '.join(str(p.get(k, '')) for k in ('id','name','desc')).lower()
              if 'kösk' in hay or 'kosk' in hay or 'operagata 63' in hay:
                  keyword_matches.append({k:p.get(k) for k in ('id','name','category','lat','lon')})

          # Current public-facing official gallery pages repeatedly use 63C.
          chosen = c if c.get('ok') and c.get('status') == 'verified_candidate' else None
          if chosen is None:
              raise SystemExit(f'Operagata 63C did not resolve as verified candidate: {c}')

          coord = chosen['coordinate']
          lat, lon = coord['lat'], coord['lon']

          def haversine(lat1, lon1, lat2, lon2):
              R = 6371000
              p1, p2 = math.radians(lat1), math.radians(lat2)
              dp = math.radians(lat2-lat1)
              dl = math.radians(lon2-lon1)
              x = math.sin(dp/2)**2 + math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*R*math.asin(math.sqrt(x))

          nearby = []
          for p in index:
              if isinstance(p.get('lat'), (int,float)) and isinstance(p.get('lon'), (int,float)):
                  d = haversine(lat, lon, p['lat'], p['lon'])
                  if d <= 350:
                      nearby.append({
                          'id': p.get('id'), 'name': p.get('name'), 'category': p.get('category'),
                          'distanceMeters': round(d, 1)
                      })
          nearby.sort(key=lambda x: x['distanceMeters'])

          decision = {
              'version': '2026-07-20-two-address-clean',
              'placeId': 'kosk_oslo',
              'candidateName': 'KÖSK',
              'status': 'verified_address_candidate',
              'productionGate': 'ready_for_canonical_production' if not keyword_matches else 'manual_duplicate_review_required',
              'primaryCategory': 'kunst',
              'identity': {
                  'currentName': 'KÖSK',
                  'currentGalleryAddress': 'Operagata 63C, 0194 Oslo',
                  'alternatePickupOrLegacyAddress': 'Operagata 63A, 0194 Oslo',
                  'summary': 'Aktivt galleri for norsk samtidskunst, med særlig vekt på yngre kunstnere.'
              },
              'addressAudit': {
                  'operagata63A': a,
                  'operagata63C': c,
                  'decision': 'Use 63C as canonical public gallery address because KÖSK current homepage, contact and about pages consistently state 63C. Keep 63A only as an alternate pickup/older listing unless future official evidence shows the public entrance moved.'
              },
              'coordinate': coord,
              'source': {
                  'sourceProvider': chosen['sourceProvider'],
                  'sourceName': chosen['sourceName'],
                  'sourceUrl': chosen['sourceUrl'],
                  'sourceObjectId': chosen['sourceObjectId']
              },
              'duplicateGate': {
                  'canonicalIdentityMatches': keyword_matches,
                  'nearbyWithin350m': nearby,
                  'conclusion': 'No KÖSK / Operagata 63 gallery identity exists in the current canonical index.' if not keyword_matches else 'Potential identity match requires review.'
              },
              'sourcePriority': [
                  'KÖSK current homepage / about / contact: Operagata 63C',
                  'KÖSK pickup page: Operagata 63A',
                  'VisitOSLO 2026 listing: Operagata 63A'
              ],
              'guardrails': [
                  'Do not create separate active places for 63A and 63C.',
                  'Do not use 63A as canonical while the current public gallery pages consistently identify 63C.',
                  'Treat KÖSK as a gallery institution, not as the wider Oslobukta/Bispevika area.'
              ]
          }
          (reportdir / 'decision.json').write_text(json.dumps(decision, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(decision, ensure_ascii=False, indent=2))
          PY

      - name: Commit durable intake and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-kosk-coordinate-intake.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record KÖSK two-address coordinate intake"
          git push origin HEAD:data/oslo-kosk-coordinate-intake
