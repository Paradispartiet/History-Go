name: Temporary PlaceCard build sync

on:
  push:
    branches:
      - placecard-single-column-header

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: placecard-single-column-header
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:web
      - name: Commit generated browser build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/web/place-unified-surface.js dist/web/place-unified-surface.js.map
          if git diff --cached --quiet; then
            echo "Build already in sync"
            exit 0
          fi
          git commit -m "Sync generated PlaceCard browser build"
          git push origin HEAD:placecard-single-column-header
