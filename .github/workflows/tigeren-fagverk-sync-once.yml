name: Tigeren Fagverk one-off sync

on:
  push:
    branches:
      - work/tigeren-fagverk-v2-20260902
    paths:
      - .github/workflows/tigeren-fagverk-sync-once.yml

permissions:
  contents: write

jobs:
  sync-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Register Tigeren Fagverk
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/fagverk/fagverk_registry.json';
          const registry = JSON.parse(fs.readFileSync(path, 'utf8'));
          registry.placeLinks ||= {};
          registry.placeLinks.tigeren = {
            sourceFile: 'places/by/oslo/places/tigeren.json',
            field: 'fagverk',
            schema: 'history_go_place_fagverk_v2',
            level: 'full',
            status: 'curated'
          };
          fs.writeFileSync(path, JSON.stringify(registry, null, 2) + '\n');
          NODE

      - name: Regenerate deterministic artifacts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-fagverk-release-manifest.mjs
          npm run place-open:build
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/place-image-audit.json
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/place-image-audit.json', 'utf8'));
          const target = 'data/places/place_image_backlog_summary.json';
          const saved = JSON.parse(fs.readFileSync(target, 'utf8'));
          const byCategory = {};
          for (const [id, bucket] of Object.entries(report.byCategory || {})) {
            const previous = saved.byCategory?.[id] || {};
            byCategory[id] = {
              total: bucket.total,
              valid: bucket.local + bucket.remote,
              optional: bucket.optional,
              missing: bucket.missing,
              invalid: bucket.invalid
            };
            if (previous.designAlias) byCategory[id].designAlias = previous.designAlias;
          }
          saved.generatedAt = new Date().toISOString().slice(0, 10);
          saved.generatedFromCommit = 'tigeren_fagverk_v2_20260902';
          saved.totalPlaces = report.totalPlaces;
          saved.summary = {
            validLocal: report.summary.local,
            validRemote: report.summary.remote,
            optionalMissing: report.summary.optional,
            missing: report.summary.missing,
            invalidLocalPath: report.summary.invalid,
            remaining: report.summary.missing + report.summary.invalid
          };
          saved.byCategory = byCategory;
          fs.writeFileSync(target, JSON.stringify(saved, null, 2) + '\n');
          NODE

      - name: Validate Tigeren Fagverk and generated state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run place-open:check
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/place-image-audit-verified.json --verify-summary=data/places/place_image_backlog_summary.json
          node scripts/audit-fagverk-place-pages.mjs
          node --test tests/fagverk-place-pages.test.mjs tests/fagverk-place-rendering.test.mjs tests/fagverk-place-substance-audit.test.mjs

      - name: Commit generated state and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tigeren-fagverk-sync-once.yml
          git add data/fagverk/fagverk_registry.json
          git add data/fagverk/fagverk_release.json
          git add data/places/place_image_backlog_summary.json
          git add data/runtime/place-open
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Sync Tigeren Fagverk generated artifacts"
          fi
          git push origin HEAD:work/tigeren-fagverk-v2-20260902
