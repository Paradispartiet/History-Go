          f=read(fp).replace('canonical og bindende fagverkskontrakt v5','canonical og bindende fagverkskontrakt v6').replace('kopieres og omskrives atten ganger','kopieres og omskrives sytten ganger').replace('fagverk.html?subject=teknologi\n','fagverk.html?subject=vitenskap&specialization=teknologi\n').replace('vitenskap\nteknologi\nfilosofi','vitenskap\nfilosofi').replace('4. `teknologi` — utvidet vitenskapelig pakke.','4. `vitenskap` — standard vitenskapelig fagpakke med den utvidede `teknologi`-pakken som nested spesialisering.')
