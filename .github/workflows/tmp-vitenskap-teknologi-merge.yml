      - name: Install dependencies
        run: npm ci
      - name: Build browser mirrors
        run: npm run build:web
      - name: Generate deterministic reports
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs --write-report --no-check-report
          node scripts/audit-fagverk-general-engine.mjs --write-report --no-check-report
      - name: Validate contracts and runtimes
        run: |
          npm run typecheck:web
          node scripts/audit-category-governance.mjs
          node scripts/audit-quiz-template-governance.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node --test tests/fagverk-documentation-contract.test.mjs
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/vitenskap-teknologi-category-contract.test.mjs
          node tools/build-teknologi-canonical-v2_4.mjs --check
          node tools/validate-teknologi-foundation.mjs
          node tools/validate-teknologi-quality-v2_1.mjs
          node tools/validate-teknologi-ontology-v2_2.mjs
          node tools/validate-teknologi-evidence-v2_3.mjs
          node tools/validate-teknologi-canonical-v2_4.mjs
      - name: Commit migration
        shell: bash
        run: |
          rm .github/workflows/tmp-vitenskap-teknologi-merge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Samle Teknologi under Vitenskap og teknologi"
          git push origin HEAD:fix/vitenskap-teknologi-felles-badge
