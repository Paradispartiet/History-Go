name: Temporary Vitenskap teknologi migration

on:
  push:
    branches:
      - fix/vitenskap-teknologi-felles-badge

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Merge Technology into Science
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import pathlib
          import re

          ROOT = pathlib.Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')

          def load(path):
              return json.loads(read(path))

          def dump(path, value):
              write(path, json.dumps(value, ensure_ascii=False, indent=2) + '\n')

          def replace(path, old, new, *, count=None):
              source = read(path)
              if old not in source:
                  raise RuntimeError(f'Mangler forventet tekst i {path}: {old[:100]!r}')
              result = source.replace(old, new) if count is None else source.replace(old, new, count)
              write(path, result)

          # 1. Canonical category contract: 17 top subjects, one combined Science & Technology badge.
          contract_path = 'data/categories/category_contract.json'
          contract = load(contract_path)
          contract['version'] = '1.6'
          contract['updatedAt'] = '2026-07-28'
          contract['runtimeCategories'] = [item for item in contract['runtimeCategories'] if item != 'teknologi']
          contract['fagSubjects'] = [item for item in contract['fagSubjects'] if item != 'teknologi']
          for alias in ['technology', 'teknologi', 'tech', 'it', 'informasjonsteknologi']:
              contract.setdefault('aliases', {})[alias] = 'vitenskap'
          contract.setdefault('labels', {})['vitenskap'] = 'Vitenskap & teknologi'
          contract['labels'].pop('teknologi', None)
          contract.setdefault('decisions', {})['vitenskap'] = (
              'Vitenskap & teknologi er én canonical toppkategori. Den omfatter empirisk og formell '
              'kunnskapsproduksjon, naturvitenskap, medisin, matematikk, modeller og vitenskapelige '
              'institusjoner, samt teknologi, ingeniørfag og IT: maskiner, materialer, energi, elektronikk, '
              'programvare, algoritmer, data, nettverk, robotikk, cybersikkerhet og digital infrastruktur. '
              'Teknologi er en faglig spesialisering under vitenskap, ikke et eget toppmerke. Bedriften som '
              'virksomhet hører primært til næringsliv; den tekniske løsningen hører til Vitenskap & teknologi.'
          )
          contract['decisions'].pop('teknologi', None)
          dump(contract_path, contract)

          # 2. Badge ownership and legacy redirect metadata.
          badge_index = load('data/badges/index.json')
          badge_index['files'] = [item for item in badge_index['files'] if item != 'data/badges/teknologi.json']
          dump('data/badges/index.json', badge_index)

          science_badge = load('data/badges/vitenskap.json')
          science_badge['name'] = 'Vitenskap & teknologi'
          science_badge['description'] = (
              'For dem som undersøker, forklarer og bygger verden gjennom observasjon, måling, testing, '
              'beregning, ingeniørkunst og etterprøvbar kunnskap – fra naturvitenskap og medisin til '
              'teknologi, IT, programvare og digital infrastruktur.'
          )
          science_badge['sub'] = [
              'naturvitenskap',
              'teknologi',
              'teknologi_og_ingeniorfag',
              'informasjonsteknologi',
              'data_programvare_og_algoritmer',
              'nettverk_og_digital_infrastruktur',
              'elektronikk_robotikk_og_automatisering',
              'medisin',
              'matematikk',
              'psykologi_og_hjerne',
              'forskning_og_metode',
              'vitenskapshistorie',
              'vitenskaps_og_teknologihistorie',
              'klima_og_miljovitenskap',
              'astronomi_og_fysikk',
              'kjemi_og_materialvitenskap'
          ]
          dump('data/badges/vitenskap.json', science_badge)

          technology_badge = load('data/badges/teknologi.json')
          technology_badge['status'] = 'legacy_redirect'
          technology_badge['canonicalBadgeId'] = 'vitenskap'
          technology_badge['description'] = (
              'Teknologi er bevart som en faglig spesialisering under merket Vitenskap & teknologi. '
              'Denne filen er bare et migreringsanker og registreres ikke som et eget toppmerke.'
          )
          dump('data/badges/teknologi.json', technology_badge)

          # 3. Keep the full technology package as a nested specialization under Science.
          manifest_path = 'data/fag/fag_manifest.json'
          manifest = load(manifest_path)
          technology = manifest.pop('teknologi')
          specialization = {
              'id': 'teknologi',
              'label': 'Teknologi',
              'canonicalParentSubject': 'vitenskap',
              'badgeId': 'vitenskap',
              'schemaFamily': 'technology_scientific_v2_4',
              'routeStatus': 'planned',
              'route': '',
              **technology
          }
          specialization['status'] = 'canonical_scientific_specialization'
          manifest['vitenskap']['specializations'] = {'teknologi': specialization}
          dump(manifest_path, manifest)

          quiz_registry = load('data/quiz/regler/QUIZ_TEMPLATE_REGISTRY_V2.json')
          quiz_registry['version'] = '3.4'
          quiz_registry['category_profiles'].pop('teknologi', None)
          quiz_registry['subject_specialization_profiles'] = {
              'vitenskap': {
                  'teknologi': 'data/fag/teknologi/supersetQUIZMAL_teknologi.json'
              }
          }
          dump('data/quiz/regler/QUIZ_TEMPLATE_REGISTRY_V2.json', quiz_registry)

          quiz_manifest = load('data/quiz/manifest.json')
          for entry in quiz_manifest.get('subjectPackages', []):
              if entry.get('subjectId') == 'teknologi':
                  entry['parentSubjectId'] = 'vitenskap'
                  entry['specializationId'] = 'teknologi'
          dump('data/quiz/manifest.json', quiz_manifest)

          # 4. Portal, inventory and status expose only 17 top-level subjects.
          portal = load('data/fagverk/fagverk_portal.json')
          portal['categories'] = [item for item in portal['categories'] if item.get('id') != 'teknologi']
          for item in portal['categories']:
              if item.get('id') == 'vitenskap':
                  item['label'] = 'Vitenskap & teknologi'
          dump('data/fagverk/fagverk_portal.json', portal)

          inventory = load('data/fagverk/subject_inventory.json')
          inventory['version'] = '1.2.0'
          inventory['subjects'] = [item for item in inventory['subjects'] if item.get('id') != 'teknologi']
          family = inventory.get('schemaFamilies', {}).get('technology_scientific_v2_4')
          if isinstance(family, dict):
              family['description'] = 'Utvidet teknologivitenskapelig schemafamilie brukt som nested spesialisering under vitenskap.'
          for item in inventory['subjects']:
              if item.get('id') == 'vitenskap':
                  item['pilot'] = True
                  optional = list(item.get('optionalManifestFields', []))
                  if 'specializations' not in optional:
                      optional.append('specializations')
                  item['optionalManifestFields'] = optional
                  item['specializations'] = [{
                      'id': 'teknologi',
                      'schemaFamily': 'technology_scientific_v2_4',
                      'requiredManifestFields': ['pensum', 'emner', 'fagkart', 'methods'],
                      'optionalManifestFields': [
                          'supersetQuizMal', 'quizStandard', 'quizQuestionSchema', 'scientificPackage',
                          'quizPackageSchema', 'subjectPathwaySchema', 'subjectPathwayPackage',
                          'canonicalModelVersion', 'universalCoverage', 'geographicProduction'
                      ],
                      'pilot': True
                  }]
          dump('data/fagverk/subject_inventory.json', inventory)

          status = load('data/fagverk/subject_status.json')
          status['version'] = '1.2.0'
          status['subjects'] = [item for item in status['subjects'] if item.get('id') != 'teknologi']
          for item in status['subjects']:
              if item.get('id') == 'vitenskap':
                  item['nextGate'] = 'phase_2_pilot'
                  item['note'] = 'Vitenskap er fase-2-pilot og bærer Teknologi som canonical nested spesialisering.'
          dump('data/fagverk/subject_status.json', status)

          design = load('data/fagverk/category_place_design.json')
          design['version'] = '1.2.0'
          for alias in ['technology', 'teknologi', 'tech', 'it', 'informasjonsteknologi']:
              design.setdefault('aliases', {})[alias] = 'vitenskap'
          science_design = design['categories']['vitenskap']
          science_design['label'] = 'Vitenskap & teknologi'
          science_design['imageDirection'] = (
              'Vis laboratorium, observatorium, samling, feltsted, verksted, maskin, teknisk anlegg eller '
              'digital infrastruktur. Illustrasjoner av et begrep, logoer eller produktbilder teller ikke '
              'alene som bilde av stedet.'
          )
          science_design['contentPriority'] = [
              'problem_oppdagelse_og_design',
              'metode_instrument_og_system',
              'institusjon_personer_og_ingeniorarbeid',
              'virkning_risiko_og_usikkerhet'
          ]
          dump('data/fagverk/category_place_design.json', design)

          # 5. Runtime registries normalize legacy technology IDs to Science.
          domain_path = 'js/DomainRegistry.js'
          domain = read(domain_path)
          domain = domain.replace('"scenekunst", "sport", "subkultur", "vitenskap", "teknologi",\n    "filosofi", "film_tv"', '"scenekunst", "sport", "subkultur", "vitenskap",\n    "filosofi", "film_tv"')
          domain = domain.replace('"technology": "teknologi"', '"technology": "vitenskap"')
          domain = domain.replace('"tech": "teknologi"', '"tech": "vitenskap"')
          domain = domain.replace('"it": "teknologi"', '"it": "vitenskap"')
          domain = domain.replace('"informasjonsteknologi": "teknologi"', '"informasjonsteknologi": "vitenskap"')
          domain = domain.replace('    "technology": "vitenskap",\n', '    "technology": "vitenskap",\n    "teknologi": "vitenskap",\n')
          write(domain_path, domain)

          categories_path = 'js/core/categories.ts'
          categories = read(categories_path)
          categories = categories.replace(
              '  { id: "vitenskap", name: "Vitenskap", icon: "🔬", color: "#6A5AE0", secondaryColor: "#332B51", scope: "runtime_domain" },\n'
              '  { id: "teknologi", name: "Teknologi", icon: "⚙️", color: "#E07A1F", secondaryColor: "#252A31", scope: "runtime_domain" },',
              '  { id: "vitenskap", name: "Vitenskap & teknologi", icon: "🔬", color: "#6A5AE0", secondaryColor: "#332B51", scope: "runtime_domain", aliases: ["Vitenskap", "Teknologi", "Technology", "Tech", "IT", "Informasjonsteknologi"] },'
          )
          marker = 'function norm(value: unknown): string {\n  return String(value ?? "").trim();\n}\n'
          insertion = marker + '\nconst CATEGORY_ID_ALIASES: Readonly<Record<string, string>> = Object.freeze({\n  teknologi: "vitenskap",\n  technology: "vitenskap",\n  tech: "vitenskap",\n  it: "vitenskap",\n  informasjonsteknologi: "vitenskap"\n});\n\nfunction canonicalCategoryId(value: unknown): string {\n  const normalized = norm(value).toLowerCase();\n  return CATEGORY_ID_ALIASES[normalized] || normalized;\n}\n'
          if marker not in categories:
              raise RuntimeError('Fant ikke norm-funksjonen i categories.ts')
          categories = categories.replace(marker, insertion)
          categories = categories.replace('const category = CAT_BY_ID[norm(categoryId)];', 'const category = CAT_BY_ID[canonicalCategoryId(categoryId)];')
          categories = categories.replace('const id = norm(categoryId).toLowerCase().replace(/[^a-z0-9_]+/g, "-");', 'const id = canonicalCategoryId(categoryId).replace(/[^a-z0-9_]+/g, "-");')
          categories = categories.replace(
              '  const normalizedTag = norm(tag);\n  if (!normalizedTag) return null;\n  if (CAT_BY_ID[normalizedTag]) return normalizedTag;',
              '  const normalizedTag = norm(tag);\n  if (!normalizedTag) return null;\n  const canonicalTag = canonicalCategoryId(normalizedTag);\n  if (CAT_BY_ID[canonicalTag]) return canonicalTag;'
          )
          categories = categories.replace(
              '    const categoryId = norm(entry.cat ?? entry.category ?? entry.categoryId ?? entry.category_id);\n    if (categoryId && CAT_BY_ID[categoryId]) return categoryId;',
              '    const categoryId = canonicalCategoryId(entry.cat ?? entry.category ?? entry.categoryId ?? entry.category_id);\n    if (categoryId && CAT_BY_ID[categoryId]) return categoryId;'
          )
          categories = categories.replace(
              '  const normalizedDisplay = norm(display).toLowerCase();\n  if (!normalizedDisplay) return null;\n  if (CAT_BY_ID[normalizedDisplay]) return normalizedDisplay;',
              '  const normalizedDisplay = norm(display).toLowerCase();\n  if (!normalizedDisplay) return null;\n  const canonicalDisplay = canonicalCategoryId(normalizedDisplay);\n  if (CAT_BY_ID[canonicalDisplay]) return canonicalDisplay;'
          )
          write(categories_path, categories)

          policy_path = 'tools/placeSchemaPolicy.mts'
          policy = read(policy_path)
          policy = policy.replace('"scenekunst", "sport", "subkultur", "vitenskap", "teknologi",\n  "filosofi", "film_tv"', '"scenekunst", "sport", "subkultur", "vitenskap",\n  "filosofi", "film_tv"')
          policy = policy.replace('export const LEGACY_OR_SECONDARY_PLACE_CATEGORIES = ["film"] as const;', 'export const LEGACY_OR_SECONDARY_PLACE_CATEGORIES = ["film", "teknologi"] as const;')
          write(policy_path, policy)

          # 6. Generic badge page resolves old technology links and aggregates preserved points.
          write('js/merke-fallback.js', r'''// @ts-nocheck
          (function installGenericBadgePage(global){
            'use strict';
            const text=(value)=>String(value==null?'':value).trim();
            const esc=(value)=>String(value==null?'':value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
            const fetchJson=async(url)=>{const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error(`${response.status} ${url}`);return response.json();};
            function resolveBadgeId(rawId,contract){const raw=text(rawId);if((contract.runtimeCategories||[]).includes(raw))return raw;const alias=text(contract.aliases?.[raw]);return (contract.runtimeCategories||[]).includes(alias)?alias:'';}
            function pointsFor(id,contract){try{const merits=JSON.parse(localStorage.getItem('merits_by_category')||'{}');const ids=new Set([id,...Object.entries(contract.aliases||{}).filter(([,target])=>target===id).map(([alias])=>alias)]);return [...ids].reduce((sum,key)=>sum+Number(merits?.[key]?.points||0),0);}catch{return 0;}}
            function tierState(tiers,points){let current={label:'Nybegynner',threshold:0};let next=null;for(const tier of tiers){const threshold=Number(tier?.threshold||0);if(points>=threshold)current=tier;else if(!next)next=tier;}return {current,next};}
            function renderSubjectAction(id,portal){const actions=document.getElementById('genericBadgeActions');const item=(portal.categories||[]).find((row)=>text(row.id)===id);if(!actions||!item)return;const target=text(item.subjectPage);if(target){actions.insertAdjacentHTML('afterbegin',`<a href="${esc(target)}">Åpne faget →</a>`);}else{actions.insertAdjacentHTML('afterbegin',`<span class="is-pending" aria-disabled="true">Faget bygges</span>`);}}
            async function init(){const params=new URLSearchParams(global.location.search);const requestedId=text(params.get('badge'));const loading=document.getElementById('genericBadgeLoading');const content=document.getElementById('genericBadgeContent');const error=document.getElementById('genericBadgeError');try{const [contract,portal]=await Promise.all([fetchJson('data/categories/category_contract.json'),fetchJson('data/fagverk/fagverk_portal.json')]);const id=resolveBadgeId(requestedId,contract);if(!id)throw new Error(`Ukjent merke: ${requestedId||'(mangler id)'}`);if(requestedId!==id)history.replaceState(null,'',`merke.html?badge=${encodeURIComponent(id)}`);const badge=await fetchJson(`data/badges/${encodeURIComponent(id)}.json`);const points=pointsFor(id,contract);const tiers=Array.isArray(badge.tiers)?badge.tiers:[];const state=tierState(tiers,points);document.title=`${text(badge.name)||contract.labels?.[id]||id} – History Go`;document.getElementById('genericBadgeTitle').textContent=text(badge.name)||contract.labels?.[id]||id;document.getElementById('genericBadgeDescription').textContent=text(badge.description)||'Merkeprofil i History Go.';const image=document.getElementById('genericBadgeImage');image.innerHTML=badge.image?`<img src="${esc(badge.image)}" alt="">`:`<span aria-hidden="true">${esc(badge.icon||'◆')}</span>`;document.getElementById('genericBadgeProgress').innerHTML=`<div><strong>${points} poeng</strong><span>${esc(text(state.current?.label)||'Nybegynner')}</span></div><div><strong>${state.next?Math.max(0,Number(state.next.threshold||0)-points):'Fullført'}</strong><span>${state.next?`poeng til ${esc(state.next.label)}`:'øverste nivå nådd'}</span></div>`;document.getElementById('genericBadgeTiers').innerHTML=tiers.map((tier)=>`<article class="generic-badge-tier${points>=Number(tier.threshold||0)?' is-earned':''}"><strong>${esc(tier.label)}</strong><span>${Number(tier.threshold||0)} poeng</span></article>`).join('');renderSubjectAction(id,portal);loading.hidden=true;content.hidden=false;error.hidden=true;}catch(err){loading.hidden=true;content.hidden=true;error.hidden=false;error.textContent=`Merkesiden kunne ikke lastes: ${err.message}`;console.error('[generic-badge]',err);}}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
          })(window);
          '''.replace('          ', ''))

          # 7. Permanent inventory audit understands nested specializations.
          write('scripts/audit-fagverk-subject-inventory.mjs', r'''#!/usr/bin/env node
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { isDeepStrictEqual } from 'node:util';

          const ROOT = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const PATHS = Object.freeze({
            categories: 'data/categories/category_contract.json',
            manifest: 'data/fag/fag_manifest.json',
            portal: 'data/fagverk/fagverk_portal.json',
            inventory: 'data/fagverk/subject_inventory.json',
            status: 'data/fagverk/subject_status.json',
            report: 'reports/fagverk/subject-baseline.json'
          });
          const CORE_FIELDS = Object.freeze(['pensum', 'emner', 'fagkart', 'methods']);
          const ALLOWED_FAMILIES = new Set(['standard_canonical', 'foundation_v1', 'by_compatibility', 'technology_scientific_v2_4']);

          const absolute = (relativePath) => path.join(ROOT, relativePath);
          function readJson(relativePath) {
            let raw;
            try { raw = fs.readFileSync(absolute(relativePath), 'utf8'); }
            catch (error) { throw new Error(`Kan ikke lese ${relativePath}: ${error.message}`); }
            try { return JSON.parse(raw); }
            catch (error) { throw new Error(`Ugyldig JSON i ${relativePath}: ${error.message}`); }
          }
          function assert(condition, message) { if (!condition) throw new Error(message); }
          function assertExactOrder(actual, expected, label) {
            assert(Array.isArray(actual) && actual.length === expected.length && actual.every((value, index) => value === expected[index]), `${label} må følge canonical rekkefølge. Forventet ${JSON.stringify(expected)}, fikk ${JSON.stringify(actual)}`);
          }
          function resolveFagPointer(pointer) {
            assert(typeof pointer === 'string' && pointer.trim(), `Ugyldig fagfilpeker: ${JSON.stringify(pointer)}`);
            return path.posix.normalize(path.posix.join('data/fag', pointer));
          }
          function classifySubject(subjectId, manifestEntry) {
            if (subjectId === 'by') return 'by_compatibility';
            if (manifestEntry.status === 'active_foundation') return 'foundation_v1';
            return 'standard_canonical';
          }
          function countBy(items, field, allowedValues) {
            const counts = Object.fromEntries(allowedValues.map((value) => [value, 0]));
            for (const item of items) {
              assert(Object.hasOwn(counts, item[field]), `${item.id}: ukjent ${field} ${JSON.stringify(item[field])}`);
              counts[item[field]] += 1;
            }
            return counts;
          }
          function normalizeCoreFiles(manifestEntry) { return Object.fromEntries(CORE_FIELDS.map((field) => [field, manifestEntry[field]])); }
          function specializationRows(categories, manifest, inventory) {
            const inventoryById = new Map(inventory.subjects.map((item) => [item.id, item]));
            return categories.fagSubjects.flatMap((parentSubjectId) => {
              const manifestSpecs = manifest[parentSubjectId]?.specializations || {};
              const inventorySpecs = inventoryById.get(parentSubjectId)?.specializations || [];
              return inventorySpecs.map((item) => ({
                parentSubjectId,
                id: item.id,
                schemaFamily: item.schemaFamily,
                coreFiles: normalizeCoreFiles(manifestSpecs[item.id] || {}),
                optionalManifestFields: item.optionalManifestFields || [],
                pilot: Boolean(item.pilot)
              }));
            });
          }

          export function buildBaselineReport({ categories, manifest, inventory, status }) {
            const statusById = new Map(status.subjects.map((item) => [item.id, item]));
            const inventoryById = new Map(inventory.subjects.map((item) => [item.id, item]));
            const subjectRows = categories.fagSubjects.map((subjectId) => {
              const manifestEntry = manifest[subjectId];
              const inventoryEntry = inventoryById.get(subjectId);
              const statusEntry = statusById.get(subjectId);
              return {
                id: subjectId,
                schemaFamily: inventoryEntry.schemaFamily,
                coreFiles: normalizeCoreFiles(manifestEntry),
                optionalManifestFields: inventoryEntry.optionalManifestFields,
                navigationStatus: statusEntry.navigationStatus,
                assessmentStatus: statusEntry.assessmentStatus,
                editorialStatus: statusEntry.editorialStatus,
                pilot: inventoryEntry.pilot,
                specializations: (inventoryEntry.specializations || []).map((item) => ({
                  id: item.id,
                  schemaFamily: item.schemaFamily,
                  coreFiles: normalizeCoreFiles(manifestEntry.specializations?.[item.id] || {}),
                  optionalManifestFields: item.optionalManifestFields || [],
                  pilot: Boolean(item.pilot)
                }))
              };
            });
            const specializations = specializationRows(categories, manifest, inventory);
            const allFamilies = [...subjectRows.map((item) => item.schemaFamily), ...specializations.map((item) => item.schemaFamily)];
            return {
              schema: 'history_go_fagverk_subject_baseline_report_v1',
              version: '1.2.0',
              status: 'living_inventory_baseline',
              generatedFrom: { inventory: PATHS.inventory, status: PATHS.status, categories: PATHS.categories, manifest: PATHS.manifest, portal: PATHS.portal },
              summary: {
                subjectCount: subjectRows.length,
                specializationCount: specializations.length,
                schemaFamilyCount: new Set(allFamilies).size,
                requiredCoreFileCount: (subjectRows.length + specializations.length) * CORE_FIELDS.length,
                navigation: countBy(status.subjects, 'navigationStatus', status.rules.navigationStatuses),
                assessment: countBy(status.subjects, 'assessmentStatus', status.rules.assessmentStatuses),
                editorial: countBy(status.subjects, 'editorialStatus', status.rules.editorialStatuses),
                pilotSubjects: subjectRows.filter((item) => item.pilot).map((item) => item.id).sort(),
                pilotSpecializations: specializations.filter((item) => item.pilot).map((item) => `${item.parentSubjectId}/${item.id}`).sort()
              },
              migrationDebt: inventory.migrationDebt,
              subjects: subjectRows
            };
          }

          function validateStatusProgression(subjectId, statusEntry, portalEntry) {
            assert(statusEntry.navigationStatus === portalEntry.subjectStatus, `${subjectId}: portal- og statusregister er usynkronisert`);
            if (statusEntry.navigationStatus === 'planned') {
              assert(!portalEntry.subjectPage, `${subjectId}: planned fag kan ikke ha aktiv subjectPage`);
              assert(statusEntry.editorialStatus === 'not_started', `${subjectId}: planned fag kan ikke ha redaksjonell ferdigstatus`);
              assert(statusEntry.assessmentStatus !== 'audited', `${subjectId}: audited fag må materialiseres i samme godkjente endring`);
            } else {
              assert(portalEntry.subjectPage === `fagverk.html?subject=${subjectId}`, `${subjectId}: materialized fag må bruke canonical subjectPage`);
            }
            if (statusEntry.assessmentStatus === 'audited') {
              assert(statusEntry.navigationStatus === 'materialized', `${subjectId}: audited krever materialized`);
              assert(['structure_ready', 'chapters_in_progress', 'complete'].includes(statusEntry.editorialStatus), `${subjectId}: audited krever minst structure_ready`);
            }
            if (statusEntry.assessmentStatus === 'blocked') assert(statusEntry.editorialStatus === 'not_started', `${subjectId}: blocked kan ikke ha redaksjonell ferdigstatus`);
            if (statusEntry.editorialStatus !== 'not_started') assert(statusEntry.navigationStatus === 'materialized' && statusEntry.assessmentStatus === 'audited', `${subjectId}: redaksjonell fremdrift krever materialized + audited`);
          }

          function auditCoreFiles(ownerId, manifestEntry, coreFileAudit) {
            for (const field of CORE_FIELDS) {
              const pointer = manifestEntry[field];
              assert(typeof pointer === 'string' && pointer.length > 0, `${ownerId}: mangler manifestfeltet ${field}`);
              const relativePath = resolveFagPointer(pointer);
              assert(fs.existsSync(absolute(relativePath)), `${ownerId}: required ${field}-fil finnes ikke: ${relativePath}`);
              readJson(relativePath);
              coreFileAudit.push({ ownerId, field, path: relativePath });
            }
          }

          export function auditRepository({ writeReport = false, checkReport = true } = {}) {
            const categories = readJson(PATHS.categories);
            const manifest = readJson(PATHS.manifest);
            const portal = readJson(PATHS.portal);
            const inventory = readJson(PATHS.inventory);
            const status = readJson(PATHS.status);
            assert(Array.isArray(categories.fagSubjects), 'category_contract.json mangler fagSubjects');
            const canonicalSubjects = categories.fagSubjects;
            assert(canonicalSubjects.length === 17, `Fagverket skal ha 17 toppfag, fikk ${canonicalSubjects.length}`);
            assert(!canonicalSubjects.includes('teknologi'), 'Teknologi kan ikke være canonical toppfag');
            assert(categories.aliases?.teknologi === 'vitenskap', 'teknologi-aliaset må peke til vitenskap');
            assertExactOrder(categories.runtimeCategories, canonicalSubjects, 'runtimeCategories');
            assertExactOrder(Object.keys(manifest), canonicalSubjects, 'fag_manifest.json');
            assertExactOrder(inventory.subjects.map((item) => item.id), canonicalSubjects, 'subject_inventory.json');
            assertExactOrder(status.subjects.map((item) => item.id), canonicalSubjects, 'subject_status.json');
            assertExactOrder(portal.categories.map((item) => item.id), canonicalSubjects, 'fagverk_portal.json');

            const inventoryById = new Map(inventory.subjects.map((item) => [item.id, item]));
            const statusById = new Map(status.subjects.map((item) => [item.id, item]));
            const portalById = new Map(portal.categories.map((item) => [item.id, item]));
            const coreFileAudit = [];
            let specializationCount = 0;

            for (const subjectId of canonicalSubjects) {
              const manifestEntry = manifest[subjectId];
              const inventoryEntry = inventoryById.get(subjectId);
              const statusEntry = statusById.get(subjectId);
              const portalEntry = portalById.get(subjectId);
              assert(manifestEntry && inventoryEntry && statusEntry && portalEntry, `${subjectId}: mangler manifest, inventory, status eller portal`);
              assert(ALLOWED_FAMILIES.has(inventoryEntry.schemaFamily), `${subjectId}: ukjent schemaFamily`);
              assert(inventoryEntry.schemaFamily === classifySubject(subjectId, manifestEntry), `${subjectId}: schemaFamily samsvarer ikke med manifestet`);
              assert(Array.isArray(inventoryEntry.requiredManifestFields) && CORE_FIELDS.every((field) => inventoryEntry.requiredManifestFields.includes(field)), `${subjectId}: inventory mangler required core-felt`);
              assert(Array.isArray(inventoryEntry.optionalManifestFields), `${subjectId}: optionalManifestFields må være array`);
              assert(typeof inventoryEntry.pilot === 'boolean', `${subjectId}: pilot må være boolean`);
              assert(status.rules.navigationStatuses.includes(statusEntry.navigationStatus), `${subjectId}: ugyldig navigationStatus`);
              assert(status.rules.assessmentStatuses.includes(statusEntry.assessmentStatus), `${subjectId}: ugyldig assessmentStatus`);
              assert(status.rules.editorialStatuses.includes(statusEntry.editorialStatus), `${subjectId}: ugyldig editorialStatus`);
              validateStatusProgression(subjectId, statusEntry, portalEntry);
              auditCoreFiles(subjectId, manifestEntry, coreFileAudit);

              const manifestSpecs = manifestEntry.specializations || {};
              const inventorySpecs = inventoryEntry.specializations || [];
              assert(Object.keys(manifestSpecs).length === inventorySpecs.length, `${subjectId}: manifest og inventory har ulikt antall spesialiseringer`);
              for (const spec of inventorySpecs) {
                const entry = manifestSpecs[spec.id];
                assert(entry, `${subjectId}/${spec.id}: mangler manifestoppføring`);
                assert(entry.canonicalParentSubject === subjectId, `${subjectId}/${spec.id}: feil parent subject`);
                assert(entry.badgeId === subjectId, `${subjectId}/${spec.id}: spesialiseringen kan ikke eie eget toppmerke`);
                assert(entry.status === 'canonical_scientific_specialization', `${subjectId}/${spec.id}: feil spesialiseringsstatus`);
                assert(ALLOWED_FAMILIES.has(spec.schemaFamily), `${subjectId}/${spec.id}: ukjent schemaFamily`);
                assert(entry.schemaFamily === spec.schemaFamily, `${subjectId}/${spec.id}: schemaFamily er usynkronisert`);
                assert(Array.isArray(spec.requiredManifestFields) && CORE_FIELDS.every((field) => spec.requiredManifestFields.includes(field)), `${subjectId}/${spec.id}: mangler required core-felt`);
                assert(typeof spec.pilot === 'boolean', `${subjectId}/${spec.id}: pilot må være boolean`);
                auditCoreFiles(`${subjectId}/${spec.id}`, entry, coreFileAudit);
                specializationCount += 1;
              }
            }

            assert(specializationCount === 1, `Forventet én nested spesialisering, fikk ${specializationCount}`);
            assert(manifest.vitenskap.specializations?.teknologi, 'Vitenskap mangler Teknologi-spesialiseringen');
