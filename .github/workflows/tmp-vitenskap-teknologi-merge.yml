              console.log(`Fagverk inventar OK: ${result.subjectCount} toppfag, ${result.specializationCount} spesialisering, ${result.coreFileAudit.length} required kjernefiler, ${result.report.summary.schemaFamilyCount} schemafamilier.`);
            } catch (error) {
