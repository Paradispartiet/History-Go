name: Temporary Vitenskap teknologi migration

on:
  push:
    branches:
      - fix/vitenskap-teknologi-felles-badge

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Merge Technology into Science
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import pathlib
          import re

          ROOT = pathlib.Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')

          def load(path):
              return json.loads(read(path))

          def dump(path, value):
              write(path, json.dumps(value, ensure_ascii=False, indent=2) + '\n')

          def replace(path, old, new, *, count=None):
              source = read(path)
              if old not in source:
                  raise RuntimeError(f'Mangler forventet tekst i {path}: {old[:100]!r}')
              result = source.replace(old, new) if count is None else source.replace(old, new, count)
              write(path, result)

          contract_path = 'data/categories/category_contract.json'
          contract = load(contract_path)
          contract['version'] = '1.6'
          contract['updatedAt'] = '2026-07-28'
          contract['runtimeCategories'] = [item for item in contract['runtimeCategories'] if item != 'teknologi']
          contract['fagSubjects'] = [item for item in contract['fagSubjects'] if item != 'teknologi']
          for alias in ['technology', 'teknologi', 'tech', 'it', 'informasjonsteknologi']:
              contract.setdefault('aliases', {})[alias] = 'vitenskap'
          contract.setdefault('labels', {})['vitenskap'] = 'Vitenskap & teknologi'
          contract['labels'].pop('teknologi', None)
          contract.setdefault('decisions', {})['vitenskap'] = ('Vitenskap & teknologi er én canonical toppkategori. Den omfatter empirisk og formell kunnskapsproduksjon, naturvitenskap, medisin, matematikk, modeller og vitenskapelige institusjoner, samt teknologi, ingeniørfag og IT: maskiner, materialer, energi, elektronikk, programvare, algoritmer, data, nettverk, robotikk, cybersikkerhet og digital infrastruktur. Teknologi er en faglig spesialisering under vitenskap, ikke et eget toppmerke. Bedriften som virksomhet hører primært til næringsliv; den tekniske løsningen hører til Vitenskap & teknologi.')
          contract['decisions'].pop('teknologi', None)
          dump(contract_path, contract)

          badge_index = load('data/badges/index.json')
          badge_index['files'] = [item for item in badge_index['files'] if item != 'data/badges/teknologi.json']
          dump('data/badges/index.json', badge_index)
          science_badge = load('data/badges/vitenskap.json')
          science_badge['name'] = 'Vitenskap & teknologi'
          science_badge['description'] = 'For dem som undersøker, forklarer og bygger verden gjennom observasjon, måling, testing, beregning, ingeniørkunst og etterprøvbar kunnskap – fra naturvitenskap og medisin til teknologi, IT, programvare og digital infrastruktur.'
          science_badge['sub'] = ['naturvitenskap','teknologi','teknologi_og_ingeniorfag','informasjonsteknologi','data_programvare_og_algoritmer','nettverk_og_digital_infrastruktur','elektronikk_robotikk_og_automatisering','medisin','matematikk','psykologi_og_hjerne','forskning_og_metode','vitenskapshistorie','vitenskaps_og_teknologihistorie','klima_og_miljovitenskap','astronomi_og_fysikk','kjemi_og_materialvitenskap']
          dump('data/badges/vitenskap.json', science_badge)
          technology_badge = load('data/badges/teknologi.json')
          technology_badge['status'] = 'legacy_redirect'
          technology_badge['canonicalBadgeId'] = 'vitenskap'
          technology_badge['description'] = 'Teknologi er bevart som en faglig spesialisering under merket Vitenskap & teknologi. Denne filen er bare et migreringsanker og registreres ikke som et eget toppmerke.'
          dump('data/badges/teknologi.json', technology_badge)

          manifest_path = 'data/fag/fag_manifest.json'
          manifest = load(manifest_path)
          technology = manifest.pop('teknologi')
          specialization = {'id':'teknologi','label':'Teknologi','canonicalParentSubject':'vitenskap','badgeId':'vitenskap','schemaFamily':'technology_scientific_v2_4','routeStatus':'planned','route':'',**technology}
          specialization['status'] = 'canonical_scientific_specialization'
          manifest['vitenskap']['specializations'] = {'teknologi': specialization}
          dump(manifest_path, manifest)

          quiz_registry = load('data/quiz/regler/QUIZ_TEMPLATE_REGISTRY_V2.json')
          quiz_registry['version'] = '3.4'
          quiz_registry['category_profiles'].pop('teknologi', None)
          quiz_registry['subject_specialization_profiles'] = {'vitenskap': {'teknologi': 'data/fag/teknologi/supersetQUIZMAL_teknologi.json'}}
          dump('data/quiz/regler/QUIZ_TEMPLATE_REGISTRY_V2.json', quiz_registry)
          quiz_manifest = load('data/quiz/manifest.json')
          for entry in quiz_manifest.get('subjectPackages', []):
              if entry.get('subjectId') == 'teknologi':
                  entry['parentSubjectId'] = 'vitenskap'
                  entry['specializationId'] = 'teknologi'
          dump('data/quiz/manifest.json', quiz_manifest)

          portal = load('data/fagverk/fagverk_portal.json')
          portal['categories'] = [item for item in portal['categories'] if item.get('id') != 'teknologi']
          for item in portal['categories']:
              if item.get('id') == 'vitenskap': item['label'] = 'Vitenskap & teknologi'
          dump('data/fagverk/fagverk_portal.json', portal)
          inventory = load('data/fagverk/subject_inventory.json')
          inventory['version'] = '1.2.0'
          inventory['subjects'] = [item for item in inventory['subjects'] if item.get('id') != 'teknologi']
          family = inventory.get('schemaFamilies', {}).get('technology_scientific_v2_4')
          if isinstance(family, dict): family['description'] = 'Utvidet teknologivitenskapelig schemafamilie brukt som nested spesialisering under vitenskap.'
          for item in inventory['subjects']:
              if item.get('id') == 'vitenskap':
                  item['pilot'] = True
                  optional = list(item.get('optionalManifestFields', []))
                  if 'specializations' not in optional: optional.append('specializations')
                  item['optionalManifestFields'] = optional
                  item['specializations'] = [{'id':'teknologi','schemaFamily':'technology_scientific_v2_4','requiredManifestFields':['pensum','emner','fagkart','methods'],'optionalManifestFields':['supersetQuizMal','quizStandard','quizQuestionSchema','scientificPackage','quizPackageSchema','subjectPathwaySchema','subjectPathwayPackage','canonicalModelVersion','universalCoverage','geographicProduction'],'pilot':True}]
          dump('data/fagverk/subject_inventory.json', inventory)
          status = load('data/fagverk/subject_status.json')
          status['version'] = '1.2.0'
          status['subjects'] = [item for item in status['subjects'] if item.get('id') != 'teknologi']
          for item in status['subjects']:
              if item.get('id') == 'vitenskap':
                  item['nextGate'] = 'phase_2_pilot'
                  item['note'] = 'Vitenskap er fase-2-pilot og bærer Teknologi som canonical nested spesialisering.'
          dump('data/fagverk/subject_status.json', status)
          design = load('data/fagverk/category_place_design.json')
          design['version'] = '1.2.0'
          for alias in ['technology','teknologi','tech','it','informasjonsteknologi']: design.setdefault('aliases', {})[alias] = 'vitenskap'
          science_design = design['categories']['vitenskap']
          science_design['label'] = 'Vitenskap & teknologi'
          science_design['imageDirection'] = 'Vis laboratorium, observatorium, samling, feltsted, verksted, maskin, teknisk anlegg eller digital infrastruktur. Illustrasjoner av et begrep, logoer eller produktbilder teller ikke alene som bilde av stedet.'
          science_design['contentPriority'] = ['problem_oppdagelse_og_design','metode_instrument_og_system','institusjon_personer_og_ingeniorarbeid','virkning_risiko_og_usikkerhet']
          dump('data/fagverk/category_place_design.json', design)

          domain_path = 'js/DomainRegistry.js'
          domain = read(domain_path)
          domain = domain.replace('"scenekunst", "sport", "subkultur", "vitenskap", "teknologi",\n    "filosofi", "film_tv"', '"scenekunst", "sport", "subkultur", "vitenskap",\n    "filosofi", "film_tv"')
          for key in ['technology','tech','it','informasjonsteknologi']: domain = domain.replace(f'"{key}": "teknologi"', f'"{key}": "vitenskap"')
          domain = domain.replace('    "technology": "vitenskap",\n', '    "technology": "vitenskap",\n    "teknologi": "vitenskap",\n')
          write(domain_path, domain)

          categories_path = 'js/core/categories.ts'
          categories = read(categories_path)
          categories = categories.replace('  { id: "vitenskap", name: "Vitenskap", icon: "🔬", color: "#6A5AE0", secondaryColor: "#332B51", scope: "runtime_domain" },\n  { id: "teknologi", name: "Teknologi", icon: "⚙️", color: "#E07A1F", secondaryColor: "#252A31", scope: "runtime_domain" },', '  { id: "vitenskap", name: "Vitenskap & teknologi", icon: "🔬", color: "#6A5AE0", secondaryColor: "#332B51", scope: "runtime_domain", aliases: ["Vitenskap", "Teknologi", "Technology", "Tech", "IT", "Informasjonsteknologi"] },')
          marker = 'function norm(value: unknown): string {\n  return String(value ?? "").trim();\n}\n'
          insertion = marker + '\nconst CATEGORY_ID_ALIASES: Readonly<Record<string, string>> = Object.freeze({\n  teknologi: "vitenskap",\n  technology: "vitenskap",\n  tech: "vitenskap",\n  it: "vitenskap",\n  informasjonsteknologi: "vitenskap"\n});\n\nfunction canonicalCategoryId(value: unknown): string {\n  const normalized = norm(value).toLowerCase();\n  return CATEGORY_ID_ALIASES[normalized] || normalized;\n}\n'
          if marker not in categories: raise RuntimeError('Fant ikke norm-funksjonen i categories.ts')
          categories = categories.replace(marker, insertion)
          categories = categories.replace('const category = CAT_BY_ID[norm(categoryId)];', 'const category = CAT_BY_ID[canonicalCategoryId(categoryId)];')
          categories = categories.replace('const id = norm(categoryId).toLowerCase().replace(/[^a-z0-9_]+/g, "-");', 'const id = canonicalCategoryId(categoryId).replace(/[^a-z0-9_]+/g, "-");')
          categories = categories.replace('  const normalizedTag = norm(tag);\n  if (!normalizedTag) return null;\n  if (CAT_BY_ID[normalizedTag]) return normalizedTag;', '  const normalizedTag = norm(tag);\n  if (!normalizedTag) return null;\n  const canonicalTag = canonicalCategoryId(normalizedTag);\n  if (CAT_BY_ID[canonicalTag]) return canonicalTag;')
          categories = categories.replace('    const categoryId = norm(entry.cat ?? entry.category ?? entry.categoryId ?? entry.category_id);\n    if (categoryId && CAT_BY_ID[categoryId]) return categoryId;', '    const categoryId = canonicalCategoryId(entry.cat ?? entry.category ?? entry.categoryId ?? entry.category_id);\n    if (categoryId && CAT_BY_ID[categoryId]) return categoryId;')
          categories = categories.replace('  const normalizedDisplay = norm(display).toLowerCase();\n  if (!normalizedDisplay) return null;\n  if (CAT_BY_ID[normalizedDisplay]) return normalizedDisplay;', '  const normalizedDisplay = norm(display).toLowerCase();\n  if (!normalizedDisplay) return null;\n  const canonicalDisplay = canonicalCategoryId(normalizedDisplay);\n  if (CAT_BY_ID[canonicalDisplay]) return canonicalDisplay;')
          write(categories_path, categories)

          policy_path = 'tools/placeSchemaPolicy.mts'
          policy = read(policy_path)
          policy = policy.replace('"scenekunst", "sport", "subkultur", "vitenskap", "teknologi",\n  "filosofi", "film_tv"', '"scenekunst", "sport", "subkultur", "vitenskap",\n  "filosofi", "film_tv"')
          policy = policy.replace('export const LEGACY_OR_SECONDARY_PLACE_CATEGORIES = ["film"] as const;', 'export const LEGACY_OR_SECONDARY_PLACE_CATEGORIES = ["film", "teknologi"] as const;')
          write(policy_path, policy)

          write('js/merke-fallback.js', """// @ts-nocheck
(function installGenericBadgePage(global){
  'use strict';
  const text=(value)=>String(value==null?'':value).trim();
  const esc=(value)=>String(value==null?'':value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\\"','&quot;').replaceAll(\"'\",'&#039;');
  const fetchJson=async(url)=>{const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error(`${response.status} ${url}`);return response.json();};
  function resolveBadgeId(rawId,contract){const raw=text(rawId);if((contract.runtimeCategories||[]).includes(raw))return raw;const alias=text(contract.aliases?.[raw]);return (contract.runtimeCategories||[]).includes(alias)?alias:'';}
  function pointsFor(id,contract){try{const merits=JSON.parse(localStorage.getItem('merits_by_category')||'{}');const ids=new Set([id,...Object.entries(contract.aliases||{}).filter(([,target])=>target===id).map(([alias])=>alias)]);return [...ids].reduce((sum,key)=>sum+Number(merits?.[key]?.points||0),0);}catch{return 0;}}
  function tierState(tiers,points){let current={label:'Nybegynner',threshold:0};let next=null;for(const tier of tiers){const threshold=Number(tier?.threshold||0);if(points>=threshold)current=tier;else if(!next)next=tier;}return {current,next};}
  function renderSubjectAction(id,portal){const actions=document.getElementById('genericBadgeActions');const item=(portal.categories||[]).find((row)=>text(row.id)===id);if(!actions||!item)return;const target=text(item.subjectPage);if(target){actions.insertAdjacentHTML('afterbegin',`<a href=\"${esc(target)}\">Åpne faget →</a>`);}else{actions.insertAdjacentHTML('afterbegin',`<span class=\"is-pending\" aria-disabled=\"true\">Faget bygges</span>`);}}
  async function init(){const params=new URLSearchParams(global.location.search);const requestedId=text(params.get('badge'));const loading=document.getElementById('genericBadgeLoading');const content=document.getElementById('genericBadgeContent');const error=document.getElementById('genericBadgeError');try{const [contract,portal]=await Promise.all([fetchJson('data/categories/category_contract.json'),fetchJson('data/fagverk/fagverk_portal.json')]);const id=resolveBadgeId(requestedId,contract);if(!id)throw new Error(`Ukjent merke: ${requestedId||'(mangler id)'}`);if(requestedId!==id)history.replaceState(null,'',`merke.html?badge=${encodeURIComponent(id)}`);const badge=await fetchJson(`data/badges/${encodeURIComponent(id)}.json`);const points=pointsFor(id,contract);const tiers=Array.isArray(badge.tiers)?badge.tiers:[];const state=tierState(tiers,points);document.title=`${text(badge.name)||contract.labels?.[id]||id} – History Go`;document.getElementById('genericBadgeTitle').textContent=text(badge.name)||contract.labels?.[id]||id;document.getElementById('genericBadgeDescription').textContent=text(badge.description)||'Merkeprofil i History Go.';const image=document.getElementById('genericBadgeImage');image.innerHTML=badge.image?`<img src=\"${esc(badge.image)}\" alt=\"\">`:`<span aria-hidden=\"true\">${esc(badge.icon||'◆')}</span>`;document.getElementById('genericBadgeProgress').innerHTML=`<div><strong>${points} poeng</strong><span>${esc(text(state.current?.label)||'Nybegynner')}</span></div><div><strong>${state.next?Math.max(0,Number(state.next.threshold||0)-points):'Fullført'}</strong><span>${state.next?`poeng til ${esc(state.next.label)}`:'øverste nivå nådd'}</span></div>`;document.getElementById('genericBadgeTiers').innerHTML=tiers.map((tier)=>`<article class=\"generic-badge-tier${points>=Number(tier.threshold||0)?' is-earned':''}\"><strong>${esc(tier.label)}</strong><span>${Number(tier.threshold||0)} poeng</span></article>`).join('');renderSubjectAction(id,portal);loading.hidden=true;content.hidden=false;error.hidden=true;}catch(err){loading.hidden=true;content.hidden=true;error.hidden=false;error.textContent=`Merkesiden kunne ikke lastes: ${err.message}`;console.error('[generic-badge]',err);}}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})(window);
""")

          write('scripts/audit-fagverk-subject-inventory.mjs', """#!/usr/bin/env node
import fs from 'node:fs';
import path from 'node:path';
import { fileURLToPath } from 'node:url';
import { isDeepStrictEqual } from 'node:util';
const ROOT=path.resolve(path.dirname(fileURLToPath(import.meta.url)),'..');
const PATHS=Object.freeze({categories:'data/categories/category_contract.json',manifest:'data/fag/fag_manifest.json',portal:'data/fagverk/fagverk_portal.json',inventory:'data/fagverk/subject_inventory.json',status:'data/fagverk/subject_status.json',report:'reports/fagverk/subject-baseline.json'});
const CORE_FIELDS=Object.freeze(['pensum','emner','fagkart','methods']);
const ALLOWED_FAMILIES=new Set(['standard_canonical','foundation_v1','by_compatibility','technology_scientific_v2_4']);
const absolute=(p)=>path.join(ROOT,p);
function readJson(p){let raw;try{raw=fs.readFileSync(absolute(p),'utf8');}catch(e){throw new Error(`Kan ikke lese ${p}: ${e.message}`);}try{return JSON.parse(raw);}catch(e){throw new Error(`Ugyldig JSON i ${p}: ${e.message}`);}}
function assert(c,m){if(!c)throw new Error(m);}
function assertExactOrder(a,e,l){assert(Array.isArray(a)&&a.length===e.length&&a.every((v,i)=>v===e[i]),`${l} må følge canonical rekkefølge. Forventet ${JSON.stringify(e)}, fikk ${JSON.stringify(a)}`);}
function resolveFagPointer(p){assert(typeof p==='string'&&p.trim(),`Ugyldig fagfilpeker: ${JSON.stringify(p)}`);return path.posix.normalize(path.posix.join('data/fag',p));}
function classifySubject(id,e){if(id==='by')return'by_compatibility';if(e.status==='active_foundation')return'foundation_v1';return'standard_canonical';}
function countBy(items,field,allowed){const counts=Object.fromEntries(allowed.map(v=>[v,0]));for(const item of items){assert(Object.hasOwn(counts,item[field]),`${item.id}: ukjent ${field} ${JSON.stringify(item[field])}`);counts[item[field]]+=1;}return counts;}
const normalizeCoreFiles=(e)=>Object.fromEntries(CORE_FIELDS.map(f=>[f,e[f]]));
function specializationRows(categories,manifest,inventory){const ib=new Map(inventory.subjects.map(i=>[i.id,i]));return categories.fagSubjects.flatMap(parent=>{const ms=manifest[parent]?.specializations||{};return(ib.get(parent)?.specializations||[]).map(item=>({parentSubjectId:parent,id:item.id,schemaFamily:item.schemaFamily,coreFiles:normalizeCoreFiles(ms[item.id]||{}),optionalManifestFields:item.optionalManifestFields||[],pilot:Boolean(item.pilot)}));});}
export function buildBaselineReport({categories,manifest,inventory,status}){const sb=new Map(status.subjects.map(i=>[i.id,i]));const ib=new Map(inventory.subjects.map(i=>[i.id,i]));const subjects=categories.fagSubjects.map(id=>{const me=manifest[id],ie=ib.get(id),se=sb.get(id);return{id,schemaFamily:ie.schemaFamily,coreFiles:normalizeCoreFiles(me),optionalManifestFields:ie.optionalManifestFields,navigationStatus:se.navigationStatus,assessmentStatus:se.assessmentStatus,editorialStatus:se.editorialStatus,pilot:ie.pilot,specializations:(ie.specializations||[]).map(item=>({id:item.id,schemaFamily:item.schemaFamily,coreFiles:normalizeCoreFiles(me.specializations?.[item.id]||{}),optionalManifestFields:item.optionalManifestFields||[],pilot:Boolean(item.pilot)}))};});const specs=specializationRows(categories,manifest,inventory);const families=[...subjects.map(i=>i.schemaFamily),...specs.map(i=>i.schemaFamily)];return{schema:'history_go_fagverk_subject_baseline_report_v1',version:'1.2.0',status:'living_inventory_baseline',generatedFrom:{inventory:PATHS.inventory,status:PATHS.status,categories:PATHS.categories,manifest:PATHS.manifest,portal:PATHS.portal},summary:{subjectCount:subjects.length,specializationCount:specs.length,schemaFamilyCount:new Set(families).size,requiredCoreFileCount:(subjects.length+specs.length)*CORE_FIELDS.length,navigation:countBy(status.subjects,'navigationStatus',status.rules.navigationStatuses),assessment:countBy(status.subjects,'assessmentStatus',status.rules.assessmentStatuses),editorial:countBy(status.subjects,'editorialStatus',status.rules.editorialStatuses),pilotSubjects:subjects.filter(i=>i.pilot).map(i=>i.id).sort(),pilotSpecializations:specs.filter(i=>i.pilot).map(i=>`${i.parentSubjectId}/${i.id}`).sort()},migrationDebt:inventory.migrationDebt,subjects};}
function validateStatusProgression(id,s,p){assert(s.navigationStatus===p.subjectStatus,`${id}: portal- og statusregister er usynkronisert`);if(s.navigationStatus==='planned'){assert(!p.subjectPage,`${id}: planned fag kan ikke ha aktiv subjectPage`);assert(s.editorialStatus==='not_started',`${id}: planned fag kan ikke ha redaksjonell ferdigstatus`);assert(s.assessmentStatus!=='audited',`${id}: audited fag må materialiseres i samme godkjente endring`);}else assert(p.subjectPage===`fagverk.html?subject=${id}`,`${id}: materialized fag må bruke canonical subjectPage`);if(s.assessmentStatus==='audited'){assert(s.navigationStatus==='materialized',`${id}: audited krever materialized`);assert(['structure_ready','chapters_in_progress','complete'].includes(s.editorialStatus),`${id}: audited krever minst structure_ready`);}if(s.assessmentStatus==='blocked')assert(s.editorialStatus==='not_started',`${id}: blocked kan ikke ha redaksjonell ferdigstatus`);if(s.editorialStatus!=='not_started')assert(s.navigationStatus==='materialized'&&s.assessmentStatus==='audited',`${id}: redaksjonell fremdrift krever materialized + audited`);}
function auditCoreFiles(owner,e,a){for(const field of CORE_FIELDS){const pointer=e[field];assert(typeof pointer==='string'&&pointer.length>0,`${owner}: mangler manifestfeltet ${field}`);const rel=resolveFagPointer(pointer);assert(fs.existsSync(absolute(rel)),`${owner}: required ${field}-fil finnes ikke: ${rel}`);readJson(rel);a.push({ownerId:owner,field,path:rel});}}
export function auditRepository({writeReport=false,checkReport=true}={}){const categories=readJson(PATHS.categories),manifest=readJson(PATHS.manifest),portal=readJson(PATHS.portal),inventory=readJson(PATHS.inventory),status=readJson(PATHS.status);const canonical=categories.fagSubjects;assert(canonical.length===17,`Fagverket skal ha 17 toppfag, fikk ${canonical.length}`);assert(!canonical.includes('teknologi'),'Teknologi kan ikke være canonical toppfag');assert(categories.aliases?.teknologi==='vitenskap','teknologi-aliaset må peke til vitenskap');assertExactOrder(categories.runtimeCategories,canonical,'runtimeCategories');assertExactOrder(Object.keys(manifest),canonical,'fag_manifest.json');assertExactOrder(inventory.subjects.map(i=>i.id),canonical,'subject_inventory.json');assertExactOrder(status.subjects.map(i=>i.id),canonical,'subject_status.json');assertExactOrder(portal.categories.map(i=>i.id),canonical,'fagverk_portal.json');const ib=new Map(inventory.subjects.map(i=>[i.id,i])),sb=new Map(status.subjects.map(i=>[i.id,i])),pb=new Map(portal.categories.map(i=>[i.id,i]));const audit=[];let specializationCount=0;for(const id of canonical){const me=manifest[id],ie=ib.get(id),se=sb.get(id),pe=pb.get(id);assert(me&&ie&&se&&pe,`${id}: mangler manifest, inventory, status eller portal`);assert(ALLOWED_FAMILIES.has(ie.schemaFamily),`${id}: ukjent schemaFamily`);assert(ie.schemaFamily===classifySubject(id,me),`${id}: schemaFamily samsvarer ikke med manifestet`);assert(Array.isArray(ie.requiredManifestFields)&&CORE_FIELDS.every(f=>ie.requiredManifestFields.includes(f)),`${id}: inventory mangler required core-felt`);assert(Array.isArray(ie.optionalManifestFields),`${id}: optionalManifestFields må være array`);assert(typeof ie.pilot==='boolean',`${id}: pilot må være boolean`);validateStatusProgression(id,se,pe);auditCoreFiles(id,me,audit);const ms=me.specializations||{},is=ie.specializations||[];assert(Object.keys(ms).length===is.length,`${id}: manifest og inventory har ulikt antall spesialiseringer`);for(const spec of is){const e=ms[spec.id];assert(e,`${id}/${spec.id}: mangler manifestoppføring`);assert(e.canonicalParentSubject===id,`${id}/${spec.id}: feil parent subject`);assert(e.badgeId===id,`${id}/${spec.id}: spesialiseringen kan ikke eie eget toppmerke`);assert(e.status==='canonical_scientific_specialization',`${id}/${spec.id}: feil spesialiseringsstatus`);assert(ALLOWED_FAMILIES.has(spec.schemaFamily),`${id}/${spec.id}: ukjent schemaFamily`);assert(e.schemaFamily===spec.schemaFamily,`${id}/${spec.id}: schemaFamily er usynkronisert`);auditCoreFiles(`${id}/${spec.id}`,e,audit);specializationCount+=1;}}assert(specializationCount===1,`Forventet én nested spesialisering, fikk ${specializationCount}`);assert(manifest.vitenskap.specializations?.teknologi,'Vitenskap mangler Teknologi-spesialiseringen');for(const p of inventory.migrationDebt?.politicsSpecificRuntimeFiles??[])assert(fs.existsSync(absolute(p)),`Inventert politikkspesifikk runtimefil finnes ikke: ${p}`);const report=buildBaselineReport({categories,manifest,inventory,status});if(writeReport){fs.mkdirSync(path.dirname(absolute(PATHS.report)),{recursive:true});fs.writeFileSync(absolute(PATHS.report),`${JSON.stringify(report,null,2)}\n`);}if(checkReport){const committed=readJson(PATHS.report);assert(isDeepStrictEqual(committed,report),`${PATHS.report} er utdatert. Kjør node scripts/audit-fagverk-subject-inventory.mjs --write-report`);}return{report,coreFileAudit:audit,subjectCount:canonical.length,specializationCount};}
function main(){const args=new Set(process.argv.slice(2));try{const r=auditRepository({writeReport:args.has('--write-report'),checkReport:!args.has('--no-check-report')});console.log(`Fagverk inventar OK: ${r.subjectCount} toppfag, ${r.specializationCount} spesialisering, ${r.coreFileAudit.length} required kjernefiler, ${r.report.summary.schemaFamilyCount} schemafamilier.`);}catch(e){console.error(`Fagverk inventar FEIL: ${e.message}`);process.exitCode=1;}}
