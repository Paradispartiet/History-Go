          f=f.replace(note,'Teknologi er ikke et eget toppfag. Den komplette fagpakken registreres som `vitenskap.specializations.teknologi` og skal vises som en spesialisering inne i Vitenskap & teknologi.\n\n'+note).replace('Pilotfasen er godkjent først når alle fire bruker samme renderer uten fagspesifikke DOM-kopier.','Pilotfasen er godkjent først når alle fire toppfag bruker samme renderer, og Teknologi-spesialiseringen kan normaliseres gjennom samme modell uten å opprette en attende toppside eller fagspesifikk DOM-kopi.')
          write(fp,f)
          dt='tests/fagverk-documentation-contract.test.mjs';write(dt,read(dt).replace('/canonical og bindende fagverkskontrakt v5/i','/canonical og bindende fagverkskontrakt v6/i'))
          rr='reports/fagverk/README.md';r=read(rr).replace('alle 18 fag, fire schemafamilier, 72 required kjernefiler','17 toppfag, én Teknologi-spesialisering, fire schemafamilier, 72 required kjernefiler').replace('De fire neste pilotene er `natur`, `religion`, `by` og `teknologi`.','De fire neste toppfagpilotene er `natur`, `religion`, `by` og `vitenskap`; Teknologi inngår som nested spesialisering i Vitenskap-piloten.');write(rr,r)
          hr=ROOT/'reports/teknologi-eget-fag-og-badge.md'
          if hr.exists():
              old=read(str(hr));notice='> **Status 2026-07-28:** Denne beslutningen er erstattet. Teknologi er nå en canonical spesialisering under toppmerket **Vitenskap & teknologi**. Rapporten beholdes som historikk.\n\n'
              if not old.startswith('> **Status 2026-07-28:**'): write(str(hr),notice+old)
          gt='tests/fagverk-general-engine.test.mjs';g=read(gt).replace("test('teknologiadapter bruker vitenskapelig fagkart og focus-koblinger'","test('nested Teknologi-spesialisering bruker vitenskapelig fagkart og focus-koblinger'");write(gt,g)
          wf='.github/workflows/fagverk.yml';w=read(wf).replace("      - 'tests/fagverk-general-engine.test.mjs'","      - 'tests/fagverk-general-engine.test.mjs'\n      - 'tests/vitenskap-teknologi-category-contract.test.mjs'").replace('          node --test tests/fagverk-general-engine.test.mjs','          node --test tests/fagverk-general-engine.test.mjs\n          node --test tests/vitenskap-teknologi-category-contract.test.mjs');write(wf,w)
