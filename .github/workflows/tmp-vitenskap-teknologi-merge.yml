          quiz_audit = quiz_audit.replace('profilesChecked: checkedProfiles.length,', 'profilesChecked: checkedProfiles.length,\n  specializationProfilesChecked: Object.values(registry?.subject_specialization_profiles || {}).reduce((sum, value) => sum + Object.keys(value || {}).length, 0),')
          write(quiz_audit_path, quiz_audit)

          # 11. Documentation now states the corrected category and pilot model.
          domain_contract = '''# History GO — domenekontrakt

          Status: **canonical og bindende kategoribeslutning**  
          Eier: History GO data/runtime  
          Sist kontrollert: **2026-07-28**

          Maskinlesbar sannhetskilde:

          ```text
          data/categories/category_contract.json
          ```

          Runtime-, UI- og redaksjonelle filer skal samsvare med maskinkontrakten. `scripts/audit-category-governance.mjs` håndhever samsvaret.

          ## 1. Kjerneprinsipp

          Ett toppdomene har én runtime-id, én fag-id og ett toppmerke. Runtime-id og fag-id er identiske for alle canonicale toppkategorier. Store spesialiseringer kan eie egne fagpakker, metoder, emner og quizforløp uten å bli egne toppmerker.

          Samme kategoriidentitet skal være konsistent i `place.category`, `merits_by_category`, badge-id, quiz `categoryId`, fagmanifest, quizregister, DomainRegistry, kategori-UI og place-valideringspolicy.

          ## 2. Canonicale toppkategorier

          | Runtime-id | Fag-id | Visningsnavn |
          |---|---|---|
          | `by` | `by` | By & arkitektur |
          | `historie` | `historie` | Historie |
          | `kunst` | `kunst` | Kunst |
          | `litteratur` | `litteratur` | Litteratur |
          | `media` | `media` | Medier |
          | `musikk` | `musikk` | Musikk |
          | `naeringsliv` | `naeringsliv` | Økonomi og næringsliv |
          | `natur` | `natur` | Natur & miljø |
          | `politikk` | `politikk` | Politikk & samfunn |
          | `psykologi` | `psykologi` | Psykologi |
          | `religion` | `religion` | Religion |
          | `scenekunst` | `scenekunst` | Scenekunst |
          | `sport` | `sport` | Sport & lek |
          | `subkultur` | `subkultur` | Subkultur |
          | `vitenskap` | `vitenskap` | Vitenskap & teknologi |
          | `filosofi` | `filosofi` | Filosofi |
          | `film_tv` | `film_tv` | Film & TV |

          Ved tvil gjelder `data/categories/category_contract.json`.

          ## 3. Vitenskap & teknologi

          `vitenskap` er det samlede toppdomenet og toppmerket for:

          - empirisk og formell kunnskapsproduksjon;
          - observasjon, måling, eksperiment, matematikk og modeller;
          - naturvitenskap, medisin, klima- og miljøvitenskap;
          - vitenskapelige institusjoner, instrumenter og historie;
          - teknologi, ingeniørfag og design;
          - maskiner, energi, materialer og produksjon;
          - elektronikk, sensorer, robotikk og automatisering;
          - datamaskiner, operativsystemer, programvare, data og algoritmer;
          - kunstig intelligens, nettverk, cybersikkerhet og digital infrastruktur;
          - teknologihistorie, standarder, vedlikehold, etikk og risiko.

          Teknologi er en **canonical faglig spesialisering under `vitenskap`**. Den komplette V2.4-pakken ligger fortsatt under `data/fag/teknologi/`, men registreres i `fag_manifest.json` som `vitenskap.specializations.teknologi`. Den eier ikke en toppkategori eller et eget toppmerke.

          `technology`, `teknologi`, `tech`, `it` og `informasjonsteknologi` normaliseres til `vitenskap`. Interne `em_tek_*`, `met_tek_*`, teknologiquizer og teknologiressurser beholdes som stabile spesialiserings-ID-er.

          Grenseflater:

          - Bedriften som virksomhet, marked og eierskap hører normalt til `naeringsliv`; teknologiens mekanisme, arkitektur og tekniske løsning hører til `vitenskap`.
          - Medieinnhold og journalistikk hører til `media`; plattformens programvare, algoritmer og nettverk hører til `vitenskap`.
          - Arkitektur, byrom og areal hører til `by`; byggets tekniske systemer kan gi `vitenskap` som primær eller sekundær kategori.
          - Naturfenomenet eller økosystemet hører til `natur`; måling, forskning og konstruerte løsninger kan høre til `vitenskap`.
          - Vitenskaps- og teknologifilosofi hører til `filosofi` når argumentet står i sentrum.

          ## 4. Andre låste domenebeslutninger

          `filosofi` er selvstendig runtime- og fagkategori for argumentasjon, epistemologi, metafysikk, etikk, politisk filosofi, estetikk, fenomenologi, idéhistorie og vitenskaps- og teknologifilosofi.

          `kultur` er ikke toppkategori. `film_tv`, `media`, `religion`, `scenekunst`, `kunst` og `musikk` er selvstendige domener.

          `populaerkultur` og `popkultur` er ikke canonicale toppkategorier. Populærkultur brukes som tagg, linse og mediefaglig analysefelt.

          `sosial_laering` er et non-place progression badge og skal ikke forekomme i runtime-kategorilister eller fagmanifest.

          ## 5. Primær og sekundær badgebruk

          Hvert sted har én primær kategori. `secondaryBadgeIds` uttrykker reell tverrfaglighet og erstatter ikke primærbeslutningen.

          Eksempler:

          - Et laboratorium eller forskningsinstitutt er normalt `vitenskap`.
          - Et datasenter er normalt `vitenskap`, eventuelt med `naeringsliv` eller `by` sekundært.
          - Et teknologiselskap er `naeringsliv` når virksomheten står i sentrum og `vitenskap` når det tekniske systemet står i sentrum.
          - Et teknisk museum kan være `vitenskap`, med `historie` sekundært.
          - En institusjon for teknologifilosofi er normalt `filosofi`, med `vitenskap` sekundært.

          ## 6. Fileierskap

          - Canonical maskinkontrakt: `data/categories/category_contract.json`
          - Alias og runtimekonvertering: `js/DomainRegistry.js`
          - Kategori-UI: `js/core/categories.ts`
          - Badges: `data/badges/index.json` og `data/badges/<runtime-id>.json`
          - Fag- og quizregister: `data/fag/fag_manifest.json` og `data/quiz/regler/QUIZ_TEMPLATE_REGISTRY_V2.json`
          - Place-validering: `tools/placeSchemaPolicy.mts`

          ## 7. Migreringsregel

          Legacy `teknologi`-verdier kan finnes i steder, quizhistorikk og lokale lag mens migreringen pågår. De skal normaliseres til `vitenskap` ved runtime- og importgrenser. Interne spesialiserings-ID-er skal ikke masseomdøpes.

          Nye toppkategorier krever oppdatering av maskinkontrakt, DomainRegistry, badges, fagmanifest, quizprofilregister, kategori-UI, place-policy og denne kontrakten i samme endring. Kjør `npm run audit:categories`.
          '''
          write('docs/DOMAIN_CONTRACT.md', domain_contract.replace('          ', ''))

