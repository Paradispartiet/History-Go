name: Temporary ml_faction ignored-source audit proof

on:
  push:
    branches:
      - civication/scene-pipeline-ml-faction-duplicate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-audit-semantics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prove transition source is ignored by compiler
        shell: bash
        run: |
          test -f data/Civication/mailFamilies/naeringsliv/job/mellomleder_fraksjonsvalg.json
          test -f data/Civication/mailFamilies/naeringsliv/job/mellomleder_job.json
          node - <<'NODE'
          const fs = require('node:fs');
          const registry = JSON.parse(fs.readFileSync('data/Civication/compiledSceneRegistryV1.json', 'utf8'));
          const transition = 'data/Civication/mailFamilies/naeringsliv/job/mellomleder_fraksjonsvalg.json';
          if (!(registry.ignored_source_files || []).includes(transition)) {
            throw new Error(`${transition} is not in ignored_source_files`);
          }
          if ((registry.compiled_source_files || []).includes(transition)) {
            throw new Error(`${transition} unexpectedly appears in compiled_source_files`);
          }
          NODE

      - name: Require reachability-aware duplicate blocker
        shell: bash
        run: |
          node scripts/audit-civication-scene-pipeline.mjs --json > /tmp/audit.json
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const counts = {};
          for (const issue of audit.blocking_issues || []) {
            counts[issue.category] = (counts[issue.category] || 0) + 1;
          }
          console.log(JSON.stringify({ summary: audit.summary, category_counts: counts }, null, 2));
          if (audit.summary.missing_internal_references !== 0) {
            throw new Error(`missing refs regressed to ${audit.summary.missing_internal_references}`);
          }
          if ((counts.duplicate_scene_id || 0) !== 20) {
            throw new Error(`expected 20 canonical duplicate blockers, got ${counts.duplicate_scene_id || 0}`);
          }
          if ((counts.daily_work_situation_budget_conflict || 0) !== 1) {
            throw new Error('expected one existing budget blocker');
          }
          if (audit.summary.blocking_issues !== 21) {
            throw new Error(`expected 21 blockers, got ${audit.summary.blocking_issues}`);
          }
          if ((audit.blocking_issues || []).some((issue) => issue.category === 'duplicate_scene_id' && issue.id === 'ml_faction_001')) {
            throw new Error('ml_faction_001 must not be a canonical duplicate blocker when one occurrence is compiler-ignored');
          }
          NODE

      - name: Verify complete Civication state
        run: |
          node scripts/build-civication-scene-registry.mjs --check
          npm run test:civication
          git diff --check
