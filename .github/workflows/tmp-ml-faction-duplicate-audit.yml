name: Temporary ml_faction reachability audit fix

on:
  push:
    branches:
      - civication/scene-pipeline-ml-faction-duplicate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-verify-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prove regression is red before repair
        shell: bash
        run: |
          if node tests/civication-scene-pipeline-ignored-source-duplicates.test.js; then
            echo 'Regression test unexpectedly passed before repair.' >&2
            exit 1
          fi

      - name: Make duplicate audit compiler-reachability-aware
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/audit-civication-scene-pipeline.mjs')
          text = path.read_text()
          old = '''  const ids = new Map();
          for (const record of sceneRecords) {
            if (!ids.has(record.id)) ids.set(record.id, []);
            ids.get(record.id).push(record);
          }
          const duplicateSceneIds = [...ids.entries()]
            .filter(([, rows]) => rows.length > 1)
            .map(([id, rows]) => ({
              id,
              occurrences: rows.map((row) => ({ path: row.source_path, pointer: row.pointer, type: row.mail_type, family: row.mail_family }))
            }))
            .sort((a, b) => a.id.localeCompare(b.id, "en"));
          '''
          new = '''  const compiledRegistry = parsedJson.find(
            (row) => row.path === "data/Civication/compiledSceneRegistryV1.json"
          )?.json;
          const compilerIgnoredSourceFiles = new Set(uniq(compiledRegistry?.ignored_source_files));
          const duplicateCandidateRecords = sceneRecords.filter(
            (record) => !compilerIgnoredSourceFiles.has(record.source_path)
          );

          const ids = new Map();
          for (const record of duplicateCandidateRecords) {
            if (!ids.has(record.id)) ids.set(record.id, []);
            ids.get(record.id).push(record);
          }
          const duplicateSceneIds = [...ids.entries()]
            .filter(([, rows]) => rows.length > 1)
            .map(([id, rows]) => ({
              id,
              occurrences: rows.map((row) => ({ path: row.source_path, pointer: row.pointer, type: row.mail_type, family: row.mail_family }))
            }))
            .sort((a, b) => a.id.localeCompare(b.id, "en"));
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one duplicate-audit block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff -- scripts/audit-civication-scene-pipeline.mjs
          git diff --check

      - name: Prove focused blocker reduction
        shell: bash
        run: |
          node tests/civication-scene-pipeline-ignored-source-duplicates.test.js
          node scripts/audit-civication-scene-pipeline.mjs --json > /tmp/audit.json
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const counts = {};
          for (const issue of audit.blocking_issues || []) {
            counts[issue.category] = (counts[issue.category] || 0) + 1;
          }
          console.log(JSON.stringify({ summary: audit.summary, category_counts: counts }, null, 2));
          if (audit.summary.missing_internal_references !== 0) {
            throw new Error(`missing refs regressed to ${audit.summary.missing_internal_references}`);
          }
          if ((counts.duplicate_scene_id || 0) !== 20) {
            throw new Error(`expected 20 canonical duplicate blockers, got ${counts.duplicate_scene_id || 0}`);
          }
          if ((counts.daily_work_situation_budget_conflict || 0) !== 1) {
            throw new Error('expected one existing budget blocker');
          }
          if (audit.summary.blocking_issues !== 21) {
            throw new Error(`expected 21 blockers, got ${audit.summary.blocking_issues}`);
          }
          if ((audit.blocking_issues || []).some((issue) => issue.category === 'duplicate_scene_id' && issue.id === 'ml_faction_001')) {
            throw new Error('ml_faction_001 duplicate blocker still present');
          }
          NODE

      - name: Verify complete Civication state
        shell: bash
        run: |
          node scripts/build-civication-scene-registry.mjs --check
          npm run test:civication
          git diff --check

      - name: Commit permanent audit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-ml-faction-duplicate-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-civication-scene-pipeline.mjs tests/civication-scene-pipeline-ignored-source-duplicates.test.js .github/workflows/tmp-ml-faction-duplicate-audit.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No permanent changes to commit.' >&2; exit 1; }
          git commit -m 'Civication: ignore compiler-excluded sources in duplicate audit'
          git push
