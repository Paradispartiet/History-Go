name: Temporary ml_faction reachability audit fix

on:
  push:
    branches:
      - civication/scene-pipeline-ml-faction-duplicate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-verify-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prove inherited governance drift and synchronize it
        shell: bash
        run: |
          if node scripts/audit-civication-career-gameplay.mjs --check; then
            echo 'Expected inherited careerGameplayMatrix.json drift.' >&2
            exit 1
          fi
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-career-gameplay.mjs --check

          if node scripts/audit-civication-role-world-rollout-readiness.mjs --check; then
            echo 'Expected inherited roleWorldRolloutReadiness drift.' >&2
            exit 1
          fi
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --check

          git diff --name-only > /tmp/derived-files.txt
          cat /tmp/derived-files.txt
          grep -qx 'data/Civication/careerGameplayMatrix.json' /tmp/derived-files.txt
          grep -qx 'data/Civication/roleWorldRolloutReadiness.json' /tmp/derived-files.txt
          while IFS= read -r file; do
            case "$file" in
              data/Civication/careerGameplayMatrix.json|data/Civication/roleWorldRolloutReadiness.json|reports/civication-career-gameplay-matrix.md|reports/civication-role-world-rollout-readiness.md) ;;
              *) echo "Unexpected derived change: $file" >&2; exit 1 ;;
            esac
          done < /tmp/derived-files.txt
          git diff --check

      - name: Prove regression is red before audit repair
        shell: bash
        run: |
          if node tests/civication-scene-pipeline-ignored-source-duplicates.test.js; then
            echo 'Regression test unexpectedly passed before audit repair.' >&2
            exit 1
          fi

      - name: Make duplicate audit compiler-reachability-aware
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/audit-civication-scene-pipeline.mjs')
          text = path.read_text()
          needle = '  const ids = new Map();\n  for (const record of sceneRecords) {'
          replacement = (
              '  const compiledRegistry = parsedJson.find(\n'
              '    (row) => row.path === "data/Civication/compiledSceneRegistryV1.json"\n'
              '  )?.json;\n'
              '  const compilerIgnoredSourceFiles = new Set(uniq(compiledRegistry?.ignored_source_files));\n'
              '  const duplicateCandidateRecords = sceneRecords.filter(\n'
              '    (record) => !compilerIgnoredSourceFiles.has(record.source_path)\n'
              '  );\n\n'
              '  const ids = new Map();\n'
              '  for (const record of duplicateCandidateRecords) {'
          )
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one duplicate-audit anchor, found {text.count(needle)}')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          git diff -- scripts/audit-civication-scene-pipeline.mjs
          git diff --check

      - name: Prove focused blocker reduction
        shell: bash
        run: |
          node tests/civication-scene-pipeline-ignored-source-duplicates.test.js
          node scripts/audit-civication-scene-pipeline.mjs --json > /tmp/audit.json
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const counts = {};
          for (const issue of audit.blocking_issues || []) {
            counts[issue.category] = (counts[issue.category] || 0) + 1;
          }
          console.log(JSON.stringify({ summary: audit.summary, category_counts: counts }, null, 2));
          if (audit.summary.missing_internal_references !== 0) {
            throw new Error(`missing refs regressed to ${audit.summary.missing_internal_references}`);
          }
          if ((counts.duplicate_scene_id || 0) !== 20) {
            throw new Error(`expected 20 canonical duplicate blockers, got ${counts.duplicate_scene_id || 0}`);
          }
          if ((counts.daily_work_situation_budget_conflict || 0) !== 1) {
            throw new Error('expected one existing budget blocker');
          }
          if (audit.summary.blocking_issues !== 21) {
            throw new Error(`expected 21 blockers, got ${audit.summary.blocking_issues}`);
          }
          if ((audit.blocking_issues || []).some((issue) => issue.category === 'duplicate_scene_id' && issue.id === 'ml_faction_001')) {
            throw new Error('ml_faction_001 duplicate blocker still present');
          }
          NODE

      - name: Verify complete Civication state
        shell: bash
        run: |
          node scripts/build-civication-scene-registry.mjs --check
          node scripts/audit-civication-career-gameplay.mjs --check
          node scripts/audit-civication-role-world-rollout-readiness.mjs --check
          npm run test:civication
          git diff --check

      - name: Commit permanent repairs and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-ml-faction-duplicate-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-civication-scene-pipeline.mjs tests/civication-scene-pipeline-ignored-source-duplicates.test.js data/Civication/careerGameplayMatrix.json data/Civication/roleWorldRolloutReadiness.json reports/civication-career-gameplay-matrix.md reports/civication-role-world-rollout-readiness.md .github/workflows/tmp-ml-faction-duplicate-audit.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No permanent changes to commit.' >&2; exit 1; }
          git commit -m 'Civication: align scene audit with compiled reachability'
          git push
