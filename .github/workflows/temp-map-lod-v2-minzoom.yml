name: TEMP Map LOD v2 minzoom

on:
  push:
    branches:
      - agent/map-lod-v2

permissions:
  contents: write

jobs:
  refine-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/map-lod-v2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply minzoom refinement
        run: node scripts/temp-map-lod-v2-minzoom.mjs

      - name: Rebuild web runtime
        run: npm run build:web

      - name: Focused LOD regression
        run: node --test tests/map-place-area-lod.test.mjs

      - name: Verify index parity
        run: npm run places:index:check

      - name: Verify web typecheck
        run: npm run typecheck:web

      - name: Verify patch
        run: git diff --check

      - name: Remove temporary files
        run: git rm -f scripts/temp-map-lod-v2-minzoom.mjs .github/workflows/temp-map-lod-v2-minzoom.yml

      - name: Commit refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/map.ts js/map.js dist/web/map.js tests/map-place-area-lod.test.mjs
          git diff --cached --check
          git commit -m "Bruk layer minzoom i kart-LOD v2"
          git push origin HEAD:agent/map-lod-v2
