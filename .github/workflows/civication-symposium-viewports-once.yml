name: Civication Symposium viewport acceptance (one-shot)
on:
  push:
    branches:
      - civication/symposium-rollekontinuitet-20261103
    paths:
      - .github/workflows/civication-symposium-viewports-once.yml
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify actual mobile and iPad Symposium rendering
        run: node scripts/verify-civication-symposium-viewports.cjs
      - name: Upload Chromium viewports and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civication-symposium-viewports
          path: reports/civication-symposium-browser/
          if-no-files-found: warn
