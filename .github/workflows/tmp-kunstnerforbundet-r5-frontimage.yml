name: TEMP Kunstnerforbundet R5 frontImage materialization

on:
  push:
    branches:
      - agent/kunstnerforbundet-frontimage-r5-20260913

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/kunstnerforbundet-frontimage-r5-20260913
          fetch-depth: 1

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Create documentary portrait crop
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('bilder/places/kunstnerforbundet.jpg')
          dst = Path('bilder/places/kunstnerforbundet_front_portrait.webp')
          with Image.open(src) as im:
              im = im.convert('RGB')
              width, height = im.size
              target_ratio = 3 / 4
              crop_width = round(height * target_ratio)
              if crop_width > width:
                  crop_height = round(width / target_ratio)
                  top = (height - crop_height) // 2
                  crop = im.crop((0, top, width, top + crop_height))
              else:
                  left = (width - crop_width) // 2
                  crop = im.crop((left, 0, left + crop_width, height))
              out = crop.resize((900, 1200), Image.Resampling.LANCZOS)
              out.save(dst, 'WEBP', quality=90, method=6)
              print(f'source={width}x{height} output={out.size[0]}x{out.size[1]}')
          PY

      - name: Guard image scope and dimensions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          p = 'bilder/places/kunstnerforbundet_front_portrait.webp'
          with Image.open(p) as im:
              assert im.size == (900, 1200), im.size
          PY
          mapfile -t changed < <(git status --short | awk '{print $2}')
          printf 'Changed/untracked:\n%s\n' "${changed[*]:-<none>}"
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "bilder/places/kunstnerforbundet_front_portrait.webp" ]]; then
            echo "Unexpected frontImage materialization scope" >&2
            exit 1
          fi

      - name: Commit frontImage and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-kunstnerforbundet-r5-frontimage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/places/kunstnerforbundet_front_portrait.webp .github/workflows/tmp-kunstnerforbundet-r5-frontimage.yml
          git commit -m "Add Kunstnerforbundet portrait frontImage"
          git push origin HEAD:agent/kunstnerforbundet-frontimage-r5-20260913
