name: Musikk scientific quality

on:
  pull_request:
    paths:
      - "data/fag/musikk/**"
      - "tools/validate-musikk-*.mjs"
      - ".github/workflows/musikk-scientific-quality.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Musikk canonical scientific contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/validate-musikk-emner-fagdybde-v2.mjs
      - run: node tools/validate-musikk-source-dossiers-v1.mjs
