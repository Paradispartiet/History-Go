name: Musikk scientific quality

on:
  pull_request:
    paths:
      - "data/fag/musikk/**"
      - "tools/validate-musikk-*.mjs"
      - ".github/workflows/musikk-scientific-quality.yml"
  push:
    branches: [main]
    paths:
      - "data/fag/musikk/**"
      - "tools/validate-musikk-*.mjs"
      - ".github/workflows/musikk-scientific-quality.yml"

jobs:
  validate:
    name: Musikk canonical scientific contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/validate-musikk-emner-fagdybde-v2.mjs
