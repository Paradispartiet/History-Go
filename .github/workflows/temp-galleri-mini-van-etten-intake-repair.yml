name: Temporary Galleri Mini and Van Etten intake repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  intake:
    if: github.head_ref == 'data/oslo-galleri-mini-van-etten-coordinate-intake'
    runs-on: ubuntu-latest
    steps:
      - name: Check out intake branch
        uses: actions/checkout@v4
        with:
          ref: data/oslo-galleri-mini-van-etten-coordinate-intake
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run and save all address lookups, including negative alternatives
        shell: bash
        run: |
          set -u
          MINI="reports/visitoslo-oslo-east-audit-20260720/galleri-mini"
          VAN="reports/visitoslo-oslo-east-audit-20260720/van-etten"
          mkdir -p "$MINI" "$VAN"

          run_lookup() {
            outfile="$1"
            shift
            set +e
            npm run places:coords:find:address -- --address "$*" 2>&1 | tee "$outfile"
            code=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$code" > "$outfile.exit-code.txt"
          }

          set -e
          run_lookup "$MINI/geonorge-munkegata-1.txt" "Munkegata 1 Oslo"
          run_lookup "$MINI/geonorge-munkegata-10.txt" "Munkegata 10 Oslo"
          run_lookup "$VAN/geonorge-smedgata-3.txt" "Smedgata 3 Oslo"

      - name: Resolve candidate decisions and duplicate gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          from pathlib import Path

          mini_dir = Path('reports/visitoslo-oslo-east-audit-20260720/galleri-mini')
          van_dir = Path('reports/visitoslo-oslo-east-audit-20260720/van-etten')

          def parse_lookup(path):
              text = path.read_text()
              starts = [i for i in range(len(text)) if text.startswith('{\n', i)]
              if not starts:
                  raise SystemExit(f'No JSON object found in {path}')
              last_error = None
              for start in reversed(starts):
                  try:
                      return json.loads(text[start:])
                  except Exception as exc:
                      last_error = exc
              raise SystemExit(f'Could not parse JSON from {path}: {last_error}')

          mini_1 = parse_lookup(mini_dir / 'geonorge-munkegata-1.txt')
          mini_10 = parse_lookup(mini_dir / 'geonorge-munkegata-10.txt')
          van = parse_lookup(van_dir / 'geonorge-smedgata-3.txt')

          if not mini_1.get('ok') or mini_1.get('status') != 'verified_candidate':
              raise SystemExit(f'Munkegata 1 did not resolve cleanly: {mini_1}')
          if not van.get('ok') or van.get('status') != 'verified_candidate':
              raise SystemExit(f'Smedgata 3 did not resolve cleanly: {van}')

          index = json.loads(Path('data/places/places_index.json').read_text())

          def haversine(lat1, lon1, lat2, lon2):
              R = 6371000
              p1, p2 = math.radians(lat1), math.radians(lat2)
              dp = math.radians(lat2-lat1)
              dl = math.radians(lon2-lon1)
              a = math.sin(dp/2)**2 + math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*R*math.asin(math.sqrt(a))

          def nearby_and_matches(lat, lon, needles):
              matches, nearby = [], []
              for p in index:
                  hay = ' '.join(str(p.get(k, '')) for k in ('id','name','desc')).lower()
                  if any(n.lower() in hay for n in needles):
                      matches.append({k:p.get(k) for k in ('id','name','category','lat','lon')})
                  if isinstance(p.get('lat'), (int,float)) and isinstance(p.get('lon'), (int,float)):
                      d = haversine(lat, lon, p['lat'], p['lon'])
                      if d <= 350:
                          nearby.append({'id':p.get('id'),'name':p.get('name'),'category':p.get('category'),'distanceMeters':round(d,1)})
              nearby.sort(key=lambda x: x['distanceMeters'])
              return matches, nearby

          mini_coord = mini_1['coordinate']
          mini_matches, mini_nearby = nearby_and_matches(mini_coord['lat'], mini_coord['lon'], ['galleri mini','gallery mini','munkegata 1','munkegata 10'])
          van_coord = van['coordinate']
          van_matches, van_nearby = nearby_and_matches(van_coord['lat'], van_coord['lon'], ['van etten','smedgata 3'])

          mini_10_status = {
              'ok': mini_10.get('ok'),
              'status': mini_10.get('status'),
              'reason': mini_10.get('reason'),
              'query': mini_10.get('query'),
              'sourceObjectId': mini_10.get('sourceObjectId'),
              'coordinate': mini_10.get('coordinate')
          }

          mini_decision = {
              'version': '2026-07-20-two-address-clean',
              'placeId': 'galleri_mini_oslo',
              'candidateName': 'Galleri Mini',
              'status': 'verified_address_candidate',
              'productionGate': 'ready_for_canonical_production' if not mini_matches else 'manual_duplicate_review_required',
              'primaryCategory': 'kunst',
              'identity': {
                  'currentName': 'Galleri Mini',
                  'canonicalAddress': 'Munkegata 1, 0656 Oslo',
                  'established': 2016,
                  'founder': 'Cecilia Kristensen',
                  'profile': 'Galleri i Gamlebyen med fokus på unge kunstnere og inngang ved Bodyartkvartalet.'
              },
              'addressAudit': {
                  'munkegata1': mini_1,
                  'munkegata10Test': mini_10_status,
                  'decision': 'Use Munkegata 1. The current VisitOSLO rendering «Munkegata 10656 Oslo» is consistent with Munkegata 1 followed by postcode 0656; independent copies and gallery listings explicitly state Munkegata 1. Munkegata 10 was tested only to eliminate the earlier parse ambiguity and is not a second gallery address.'
              },
              'coordinate': mini_coord,
              'source': {
                  'sourceProvider': mini_1['sourceProvider'],
                  'sourceName': mini_1['sourceName'],
                  'sourceUrl': mini_1['sourceUrl'],
                  'sourceObjectId': mini_1['sourceObjectId']
              },
              'duplicateGate': {
                  'canonicalIdentityMatches': mini_matches,
                  'nearbyWithin350m': mini_nearby,
                  'conclusion': 'No Galleri Mini / Munkegata 1 identity exists in the current canonical index.' if not mini_matches else 'Potential identity match requires review.'
              },
              'guardrails': [
                  'Do not create separate active places for Munkegata 1 and Munkegata 10.',
                  'Do not interpret the concatenated VisitOSLO string as house number 10 without accounting for postcode 0656.',
                  'Use 2016 as documented gallery-establishment year, not the start of Cecilia Kristensen’s artistic practice.'
              ]
          }

          van_decision = {
              'version': '2026-07-20-address-first-clean',
              'placeId': 'van_etten',
              'candidateName': 'Van Etten',
              'status': 'verified_address_candidate',
              'productionGate': 'ready_for_canonical_production' if not van_matches else 'manual_duplicate_review_required',
              'primaryCategory': 'kunst',
              'identity': {
                  'currentName': 'Van Etten',
                  'currentAddress': 'Smedgata 3, 0651 Oslo',
                  'established': 2020,
                  'profile': 'Independent, non-profit contemporary art space at Enerhaugen, primarily focused on solo exhibitions, artistic production and critical dialogue.',
                  'runBy': ['Katja Jarem','Øyvind Sørfjordmo']
              },
              'coordinate': van_coord,
              'source': {
                  'sourceProvider': van['sourceProvider'],
                  'sourceName': van['sourceName'],
                  'sourceUrl': van['sourceUrl'],
                  'sourceObjectId': van['sourceObjectId']
              },
              'duplicateGate': {
                  'canonicalIdentityMatches': van_matches,
                  'nearbyWithin350m': van_nearby,
                  'conclusion': 'No Van Etten / Smedgata 3 identity exists in the current canonical index.' if not van_matches else 'Potential identity match requires review.'
              },
              'guardrails': [
                  'Do not describe Van Etten as a conventional commercial sales gallery when its documented profile is non-profit and independent.',
                  'Do not merge the gallery into Enerhaugen as a neighborhood marker.',
                  'Keep the 2020 establishment year tied to the gallery institution, not the building.'
              ]
          }

          (mini_dir / 'decision.json').write_text(json.dumps(mini_decision, ensure_ascii=False, indent=2) + '\n')
          (van_dir / 'decision.json').write_text(json.dumps(van_decision, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps({'galleriMini':mini_decision,'vanEtten':van_decision}, ensure_ascii=False, indent=2))
          PY

      - name: Commit durable intake and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-galleri-mini-van-etten-coordinate-intake.yml
          rm -f .github/workflows/temp-galleri-mini-van-etten-intake-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record Galleri Mini and Van Etten coordinate intake"
          git push origin HEAD:data/oslo-galleri-mini-van-etten-coordinate-intake
