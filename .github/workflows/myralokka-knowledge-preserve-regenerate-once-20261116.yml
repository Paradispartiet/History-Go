name: Myralokka Knowledge preserve and regenerate (one-time PR)
on:
  pull_request:
    paths:
      - ".github/workflows/myralokka-knowledge-preserve-regenerate-once-20261116.yml"
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 7342
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies and regenerate canonical Knowledge
        run: |
          npm ci --no-audit --no-fund
          npm run knowledge:canonical:write
          npm run knowledge:canonical:check
      - name: Check retired progress, active Natur ownership and fullquiz tests
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const preserved = require('./data/knowledge/preserved_quiz_sources/myralokka_myragarden_legacy_20261116.json');
          const quiz = require('./data/quiz/natur/myralokka_sets.json');
          const units = require('./data/knowledge/knowledge_units.generated.json').units;
          const q = quiz.sets.flatMap(s => s.questions);
          const byUnit = new Map(units.map(x => [x.knowledge_unit_id, x]));
          assert.equal(q.length, 42);
          assert.equal(q.filter(x => x.knowledge_link_status === 'linked').length, 42);
          assert.equal(q.filter(x => x.knowledge_link_status === 'editorial_review_required').length, 0);
          assert.deepEqual(preserved.questions.map(x => x.id), ['myralokka_s2_q5', 'myralokka_s2_q6']);
          assert.deepEqual(preserved.questions.map(x => x.primary_knowledge_unit_id), ['ku_natur_arbeiderboligene_stod_fe_a7d573c3e7', 'ku_natur_arkitektene_christian_mo_87269ae2c5']);
          for (const old of preserved.questions) {
            assert.ok(!q.some(x => x.id === old.id || x.quiz_id === old.quiz_id));
            assert.ok(byUnit.has(old.primary_knowledge_unit_id), 'Existing earned Knowledge unit disappeared');
          }
          for (const id of ['myralokka_s2_q5_natur_20261116', 'myralokka_s2_q6_natur_20261116']) {
            const row = q.find(x => x.id === id);
            assert.ok(row && row.primary_knowledge_unit_id && byUnit.has(row.primary_knowledge_unit_id));
            assert.ok(row.source.some(s => s.includes('veiledere.nve.no')));
            assert.ok(!preserved.questions.some(old => old.primary_knowledge_unit_id === row.primary_knowledge_unit_id));
          }
          NODE
          node --test tests/myralokka-placecard-collections-v2.test.mjs
      - name: Scope guard, save canonical output and remove this workflow
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          changes="$(git diff --name-only)"
          printf 'Canonical generated changes:\n%s\n' "$changes"
          unexpected="$(printf '%s\n' "$changes" | grep -vE '^(data/quiz/natur/myralokka_sets\.json|data/knowledge/knowledge_units\.generated\.json|data/knowledge/knowledge_emne_review_queue\.generated\.json|reports/knowledge-id-backfill\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files from generator: $unexpected"
            exit 1
          fi
          test -n "$changes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz/natur/myralokka_sets.json data/knowledge/knowledge_units.generated.json data/knowledge/knowledge_emne_review_queue.generated.json reports/knowledge-id-backfill.json
          git rm .github/workflows/myralokka-knowledge-preserve-regenerate-once-20261116.yml
          git commit -m "chore(myralokka): regenerate 42 active Natur Knowledge units while preserving history"
          git push origin "HEAD:refs/heads/$HEAD_REF"
