name: TEMP Christiania Torv story writeback

on:
  push:
    branches:
      - agent/christiania-torv-phase6-story-v1

permissions:
  contents: write

jobs:
  writeback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/christiania-torv-phase6-story-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Register story manifests idempotently
        run: |
          node <<'NODE'
          const fs = require('fs');
          const storyPath = 'data/stories/stories_christiania_torv.json';
          const manifestPath = 'data/stories/stories_manifest.json';
          const episodePath = 'data/stories/stories_episode_v1_manifest.json';

          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.files ||= [];
          const matches = manifest.files.filter(x => x.entity_id === 'christiania_torv' || x.path === storyPath);
          if (matches.length > 1) throw new Error('duplicate Christiania Torv story manifest entries');
          if (matches.length === 0) {
            manifest.files.push({ category: 'by', entity_id: 'christiania_torv', path: storyPath });
          } else {
            const m = matches[0];
            if (m.category !== 'by' || m.entity_id !== 'christiania_torv' || m.path !== storyPath) {
              throw new Error(`conflicting manifest entry: ${JSON.stringify(m)}`);
            }
          }
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

          const episode = JSON.parse(fs.readFileSync(episodePath, 'utf8'));
          episode.files ||= [];
          const count = episode.files.filter(x => x === storyPath).length;
          if (count > 1) throw new Error('duplicate Christiania Torv episode manifest entries');
          if (count === 0) episode.files.push(storyPath);
          fs.writeFileSync(episodePath, JSON.stringify(episode, null, 2) + '\n');
          NODE
      - name: Commit writeback if needed
        run: |
          if git diff --quiet -- data/stories/stories_manifest.json data/stories/stories_episode_v1_manifest.json; then
            echo "No manifest writeback needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stories/stories_manifest.json data/stories/stories_episode_v1_manifest.json
          git commit -m "Register Christiania Torv episode story"
          git push origin HEAD:agent/christiania-torv-phase6-story-v1
