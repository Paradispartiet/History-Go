name: Finalize Civication documentation reconciliation

on:
  push:
    branches:
      - agent/civication-role-world-documentation-reconciliation

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-role-world-documentation-reconciliation
          fetch-depth: 0
      - name: Apply targeted documentation reconciliation
        run: python3 scripts/tmp-civication-doc-reconcile.py
      - name: Remove all temporary reconciliation files
        run: |
          rm -f scripts/tmp-civication-doc-reconcile.py
          rm -f .github/workflows/civication-role-world-doc-reconcile.yml
          rm -f .github/workflows/civication-doc-finalize.yml
          rm -f .github/civication-docs-trigger.txt
      - name: Commit permanent documentation only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs js/Civication/README.md data/Civication/README-mailsystem-og-rolemodels.md data/Civication/SCENE_PIPELINE_V1.md data/Civication/scenePipelinePolicyV1.json
          git add -u scripts/tmp-civication-doc-reconcile.py .github/workflows/civication-role-world-doc-reconcile.yml .github/workflows/civication-doc-finalize.yml .github/civication-docs-trigger.txt
          git diff --cached --check
          git commit -m 'Finalize Civication documentation reconciliation'
          git push origin HEAD:agent/civication-role-world-documentation-reconciliation
