name: Fagverk Vitenskap holistic university breadth completion

on:
  pull_request:
    paths:
      - 'data/fag/vitenskap/**'
      - 'data/fagverk/vitenskap/**'
      - 'reports/fagverk/vitenskap-holistic-university-breadth-completion-audit.json'
      - 'reports/fagverk/vitenskap-holistic-quality-review-audit.json'
      - 'reports/fagverk/vitenskap-theory-integrity-audit.json'
      - 'reports/fagverk/vitenskap-*-coverage-audit.json'
      - 'scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs'
      - 'scripts/audit-fagverk-vitenskap-holistic-quality-review.mjs'
      - 'tools/audit-vitenskap-theory-integrity.mjs'
      - 'scripts/audit-fagverk-vitenskap-*-coverage.mjs'
      - 'tests/fagverk-vitenskap-holistic-university-breadth-completion.test.mjs'
      - 'tests/fagverk-vitenskap-holistic-quality-review.test.mjs'
      - 'tests/vitenskap-theory-integrity.test.mjs'
      - 'tests/fagverk-vitenskap-*-coverage.test.mjs'
      - '.github/workflows/fagverk-vitenskap-holistic-university-breadth-completion.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify holistic completion report and contract
        run: |
          node --check scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs
          node scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs
          node --test tests/fagverk-vitenskap-holistic-university-breadth-completion.test.mjs
      - name: Verify explicit holistic quality review when material prerequisites are closed
        run: |
          if [ -f data/fag/vitenskap/vitenskap_holistic_quality_review_v1.json ]; then
            node --check scripts/audit-fagverk-vitenskap-holistic-quality-review.mjs
            node scripts/audit-fagverk-vitenskap-holistic-quality-review.mjs
          node --test tests/fagverk-vitenskap-holistic-quality-review.test.mjs
          fi
      - name: Verify strict theory integrity across all six canonical fields
        run: |
          node --check tools/audit-vitenskap-theory-integrity.mjs
          node tools/audit-vitenskap-theory-integrity.mjs
          node --test tests/vitenskap-theory-integrity.test.mjs
      - name: Preserve substantive editorial coverage gates
        run: |
          node --test tests/fagverk-vitenskap-methods-models-coverage.test.mjs
          node --test tests/fagverk-vitenskap-institutions-knowledge-places-coverage.test.mjs
          node --test tests/fagverk-vitenskap-society-power-ethics-coverage.test.mjs
          node --test tests/fagverk-vitenskap-digital-science-data-infrastructure-coverage.test.mjs
          node --test tests/fagverk-vitenskap-natural-science-medicine-environment-coverage.test.mjs
          node --test tests/fagverk-vitenskap-paradigms-theories-truth-coverage.test.mjs
      - name: Preserve existing Vitenskap progression gates
        run: |
          node scripts/audit-fagverk-vitenskap-breadth-reconciliation.mjs
          node scripts/audit-fagverk-vitenskap-pilot.mjs
          node scripts/audit-fagverk-vitenskap-university-readiness.mjs
          node scripts/audit-fagverk-vitenskap-unit1.mjs
          node scripts/audit-fagverk-vitenskap-mathematics-fulltext.mjs
          node scripts/audit-fagverk-vitenskap-physics-astronomy-fulltext.mjs
          node scripts/audit-fagverk-vitenskap-chemistry-material-science-fulltext.mjs
          node scripts/audit-fagverk-vitenskap-medicine-biomedicine-public-health-fulltext.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Preserve nested Teknologi quality
        run: |
          node --test tests/vitenskap-teknologi-category-contract.test.mjs
          node tools/build-teknologi-editorial-v3.mjs --check
          node tools/validate-teknologi-foundation.mjs
          node tools/validate-teknologi-quality-v2_1.mjs
          node tools/validate-teknologi-ontology-v2_2.mjs
          node tools/validate-teknologi-evidence-v2_3.mjs
          node scripts/validate-teknologi-editorial-v3.mjs
