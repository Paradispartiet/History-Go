name: TypeScript map migration debug

on:
  pull_request:
    paths:
      - "js/map.ts"
      - "schemas/globals.d.ts"
      - "schemas/map-dom-runtime.d.ts"
      - "tsconfig.web.json"
      - "build/build-web.mjs"
      - ".github/workflows/typescript-map-debug.yml"

permissions:
  contents: write

jobs:
  capture-map-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck browser runtime
        run: npm run typecheck:web
      - name: Build browser runtime
        run: npm run build:web
      - name: Commit generated map runtime if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/web/map.js js/map.js
          if git diff --cached --quiet; then
            echo "Generated map runtime already in sync."
            exit 0
          fi
          git commit -m "Build TypeScript map runtime"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
