name: TypeScript map migration debug

on:
  pull_request:
    paths:
      - "js/map.ts"
      - "schemas/globals.d.ts"
      - "schemas/map-dom-runtime.d.ts"
      - "tsconfig.web.json"
      - "build/build-web.mjs"
      - ".github/workflows/typescript-map-debug.yml"

jobs:
  capture-map-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture browser TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck:web > typecheck-map.log 2>&1
          status=$?
          echo "exit_code=$status" >> typecheck-map.log
          exit 0
      - name: Build browser runtime
        run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: typescript-map-build
          path: |
            typecheck-map.log
            dist/web/map.js
            js/map.js
          if-no-files-found: error
