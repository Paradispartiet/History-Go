# One-shot touch: trigger the pending Gamle rådhus people materialization.
name: Temporary Gamle rådhus people finalizer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Gamle rådhus people branch
        uses: actions/checkout@v4
        with:
          ref: agent/people-gamle-radhus-batch1
          fetch-depth: 0

      - name: Detect pending one-shot job
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/gamle-radhus-people-finalizer.mjs ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.pending.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.pending.outputs.run == 'true'
        run: npm install --no-audit --no-fund

      - name: Materialize Gamle rådhus people batch
        if: steps.pending.outputs.run == 'true'
        run: node scripts/gamle-radhus-people-finalizer.mjs

      - name: Validate People of Places
        if: steps.pending.outputs.run == 'true'
        run: bash scripts/check-people.sh

      - name: Publish materialized branch
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Gamle rådhus people batch 1"
          git pull --rebase origin agent/people-gamle-radhus-batch1
          git push origin HEAD:agent/people-gamle-radhus-batch1
