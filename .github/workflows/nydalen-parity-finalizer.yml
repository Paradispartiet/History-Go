name: Nydalen parity finalizer

on:
  push:
    branches:
      - agent/nydalen-full-place-production-20260915

permissions:
  contents: write

concurrency:
  group: nydalen-parity-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebuild Nydalen quiz context
        run: npm run quiz:context -- --category by --target nydalen --output data/quiz/production_context/by/nydalen.json
      - name: Rebuild Tollboden context inherited from main
        run: npm run quiz:context -- --category naeringsliv --target tollboden_oslo --output data/quiz/production_context/naeringsliv/tollboden_oslo.json
      - name: Regenerate Nydalen derived artifacts
        run: |
          npm run place-open:build
          npm run epoker:places:build
          npm run civication:history-people:build
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/place-production-rule-preflight.mjs record --workcard reports/place-production/nydalen-workcard-current.json --place-id nydalen --category by
      - name: Verify parity
        run: |
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run place-open:check
          npm run epoker:places:check
          npm run civication:history-people:check
          node scripts/build-fagverk-release-manifest.mjs --check
          node scripts/audit-place-images.mjs --mode=all --report=reports/place-image-audit.json --verify-summary=data/places/place_image_backlog_summary.json
          node scripts/place-production-rule-preflight.mjs validate --workcard reports/place-production/nydalen-workcard-current.json
      - name: Commit deterministic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz/production_context/by/nydalen.json \
                  data/quiz/production_context/naeringsliv/tollboden_oslo.json \
                  data/runtime \
                  data/epoker/epoke-place-index.json \
                  data/Civication/historyPeople_index.json \
                  data/fagverk/fagverk_release.json \
                  reports/place-production/nydalen-workcard-current.json
          if git diff --cached --quiet; then
            echo "No deterministic changes to commit."
          else
            git commit -m "Synchronize Nydalen final parity"
            git push origin HEAD:agent/nydalen-full-place-production-20260915
          fi
