name: Temporary Minneparken a360 pinned main technical replay
on:
  push:
    branches:
      - content/minneparken-kildebasert-leksikon-20261103
    paths:
      - .github/workflows/minneparken-final-a360-tech-replay-temp.yml
permissions:
  contents: write
jobs:
  verify-and-merge-into-draft-only:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/minneparken-kildebasert-leksikon-20261103
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Freeze scope, integrate exact main snapshot, reject unknown conflicts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '35d38e3027e0b5fe48139f11e83b2f51bb182e2e'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          git merge-base --is-ancestor 'a3604109e670191529741af4752d0ac56371fb68' origin/main
          test "$(git merge-base HEAD origin/main)" = '8671bc4c5887421bdcb27a0777d852680ad42084'
          git diff --name-only '8671bc4c5887421bdcb27a0777d852680ad42084' 'a3604109e670191529741af4752d0ac56371fb68' > /tmp/minneparken-reviewed-main-paths.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const observed=fs.readFileSync('/tmp/minneparken-reviewed-main-paths.txt','utf8').trim().split('\n').filter(Boolean);
          const expected=new Set(["bilder/kort/people/gert_walter_thuesen_illustration.webp","bilder/kort/people/halvard_heskestad_waage_illustration.webp","bilder/kort/people/hedda_oritsland_illustration.webp","bilder/kort/people/henrik_christiansen_svommer_illustration.webp","bilder/merker/by/locales/en/samtidsarkitektur.webp","bilder/merker/by/locales/es/samtidsarkitektur.webp","bilder/merker/by/locales/fr/samtidsarkitektur.webp","bilder/merker/by/locales/pt/samtidsarkitektur.webp","bilder/merker/by/undermerker/samtidsarkitektur-brodert-v1.webp","data/Civication/careerGameplayMatrix.json","data/Civication/compiledSceneRegistryV1.json","data/Civication/historyPeople_index.json","data/Civication/lifestory/editorial/inspiration/filmThemeSourceNotesWave01V1.json","data/Civication/mailFamilies/film_tv/conflict/produksjonsassistent_conflict.json","data/Civication/mailFamilies/film_tv/event/produksjonsassistent_event.json","data/Civication/mailFamilies/film_tv/job/produksjonsassistent_job.json","data/Civication/mailFamilies/film_tv/people/produksjonsassistent_people.json","data/Civication/roleWorldRolloutReadiness.json","data/Civication/scenarioPeople/generated/by.json","data/Civication/scenarioPeople/generated/sport.json","data/Civication/scenarioPeople_index.json","data/badges/badge_locale_images_candidates.json","data/badges/by.json","data/badges/underbadge_batch01_production.json","data/people/by/oslo/toyenbadet/gert_walter_thuesen.json","data/people/by/oslo/toyenbadet/halvard_heskestad_waage.json","data/people/claims/by/oslo/toyenbadet/gert_walter_thuesen.claims.json","data/people/claims/by/oslo/toyenbadet/halvard_heskestad_waage.claims.json","data/people/claims/sport/oslo/toyenbadet/hedda_oritsland.claims.json","data/people/claims/sport/oslo/toyenbadet/henrik_christiansen_svommer.claims.json","data/people/manifest.json","data/people/media/toyenbadet_ai_illustrated_people_assets.json","data/people/sport/oslo/toyenbadet/hedda_oritsland.json","data/people/sport/oslo/toyenbadet/henrik_christiansen_svommer.json","data/people/staging/toyenbadet_people_20261103.json","data/places/sport/europa/norway/oslo_sport/toyenbadet.json","data/runtime/people-all/part-007.json","data/runtime/place-open/toyenbadet.json","docs/CIVICATION_FILM_THEME_SOURCE_NOTES_WAVE_01.md","docs/PEOPLE_AI_ILLUSTRATION_RULE.md","docs/badge-locale-previews/by-2.jpg","reports/place-production/toyenbadet-people-field-claims-20261103.json","reports/place-production/toyenbadet-workcard-current.json","tests/badge-by-brutalisme-v1-production.test.mjs","tests/badge-by-funksjonalisme-v1-locales.test.mjs","tests/badge-by-funksjonalisme-v1-production.test.mjs","tests/badge-by-klassisk-arkitektur-v2-production.test.mjs","tests/badge-by-modernisme-v1-production.test.mjs","tests/badge-by-postmodernisme-v1-production.test.mjs","tests/badge-by-samtidsarkitektur-v1-production.test.mjs","tests/badge-underbadge-batch01.test.mjs","tests/civication-film-theme-source-notes-wave01.test.js","tests/civication-produksjonsassistent-intro-persistent-case.test.js","tests/toyenbadet-anne-lindboe-people.test.mjs","tests/toyenbadet-illustrated-people.test.mjs","tests/toyenbadet-people-staging-source-gate.test.mjs","tests/toyenbadet-vferdig-real-browser-20261103.test.mjs"]);
          assert.equal(observed.length,expected.size);
          for(const p of observed)assert.ok(expected.has(p),'Unreviewed main file: '+p);
          console.log('Reviewed latest main change set:',observed.length);
          NODE
          git merge --no-ff --no-commit 'a3604109e670191529741af4752d0ac56371fb68' || true
          test -f .git/MERGE_HEAD
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          printf 'Merge conflicts: %s\n' "${conflicts[*]:-none}"
          if (( ${#conflicts[@]} )); then echo "Unexpected merge conflicts; no push" >&2; exit 1; fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git merge-base --is-ancestor 'a3604109e670191529741af4752d0ac56371fb68' origin/main
      - name: Rebuild derived content, source and policy checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run places:index:build
          npm run places:index:check
          npm run epoker:places:check
          npm run place-open:build
          npm run place-open:check
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/minneparken-main-a360-image-audit.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='data/places/place_image_backlog_summary.json';
          const saved=JSON.parse(fs.readFileSync(p,'utf8'));
          const audit=JSON.parse(fs.readFileSync('/tmp/minneparken-main-a360-image-audit.json','utf8'));
          saved.totalPlaces=audit.totalPlaces;
          saved.summary={validLocal:audit.summary.local,validRemote:audit.summary.remote,optionalMissing:audit.summary.optional,missing:audit.summary.missing,invalidLocalPath:audit.summary.invalid,remaining:audit.summary.missing+audit.summary.invalid};
          saved.generatedFromCommit='a3604109e670';
          saved.note='Aggregater verifisert mot full Place-bildeaudit etter kontrollert Minneparken/main-integrasjon 2026-11-03. Kategorioversikten er et eldre detaljuttrekk og må regenereres separat ved kategorirevisjon.';
          fs.writeFileSync(p,JSON.stringify(saved,null,2)+'\n');
          NODE
          node scripts/audit-place-images.mjs --mode=all --verify-summary=data/places/place_image_backlog_summary.json
          npm run knowledge:canonical:check
          npm run check:stories
          node scripts/test-flora-tyskhonsetarm-b09.mjs
          node scripts/test-flora-vassarve-b09.mjs
          node --test tests/toyenbadet-people-staging-source-gate.test.mjs tests/toyenbadet-anne-lindboe-people.test.mjs tests/toyenbadet-illustrated-people.test.mjs
          node --test tests/civication-film-theme-source-notes-wave01.test.js tests/civication-produksjonsassistent-intro-persistent-case.test.js
          node --test tests/minneparken-historical-photo-provenance.test.mjs tests/minneparken-quiz-source-parity.test.mjs tests/minneparken-knowledge-registry.test.mjs tests/minneparken-story-candidate.test.mjs tests/birkelunden-place-images.test.mjs tests/civication-symposium-role-history.test.js
          test -s reports/knowledge-contract-audit.json
          git check-ignore -q reports/knowledge-contract-audit.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const id='minneparken_gamlebyen', h=read('data/places/historie-production/'+id+'.json');
          assert.equal(h.status,'blocked');
          for(const g of ['F','G','H'])assert.equal(h.gates[g].status,'N/A');
          assert.ok(!read('data/quiz/manifest.json').sets.some(x=>x.targetId===id));
          assert.ok(!read('data/quizcards/historie/manifest.json').collections.includes(id+'_quizcard_v1.json'));
          assert.ok(!read('data/stories/stories_manifest.json').files.some(x=>x.path==='data/stories/stories_'+id+'.json'));
          const qs=read('data/quiz/historie/'+id+'_sets.json').sets.flatMap(s=>s.questions);
          assert.equal(qs.filter(x=>x.knowledge_link_status==='linked').length,21);
          assert.equal(new Set(qs.flatMap(x=>x.knowledge_unit_ids)).size,32);
          assert.equal(read('reports/knowledge-contract-audit.json').questions_with_errors,0);
          console.log('PASS Knowledge 21/32 and unmodified release blockers F/G/H');
          NODE
          REPO_HYGIENE_BASE_SHA='8671bc4c5887421bdcb27a0777d852680ad42084' REPO_HYGIENE_HEAD_SHA=HEAD node scripts/audit-repository-hygiene-v1.mjs
      - name: Actual mobile and desktop Minneparken QA with test-only quiz
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          node tests/minneparken-readonly-app-browser.test.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const qf='data/quiz/manifest.json', cf='data/quizcards/historie/manifest.json';
          const q=read(qf),c=read(cf);
          q.sets.push({targetId:'minneparken_gamlebyen',file:'data/quiz/historie/minneparken_gamlebyen_sets.json'});
          c.collections.push('minneparken_gamlebyen_quizcard_v1.json');
          fs.writeFileSync(qf,JSON.stringify(q,null,2)+'\n');
          fs.writeFileSync(cf,JSON.stringify(c,null,2)+'\n');
          NODE
          node scripts/verify-minneparken-quizcard-real-browser.mjs
          node scripts/verify-place-quiz-browser.mjs minneparken_gamlebyen
          git restore --worktree -- data/quiz/manifest.json data/quizcards/historie/manifest.json
      - name: Verify generated diff scope, push to draft only if fully green
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import cp from 'node:child_process';
          const changed=cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed=new Set(['data/places/places_index.json','data/runtime/place-open/birkelunden.json','data/fagverk/fagverk_release.json','data/places/place_image_backlog_summary.json']);
          console.log('Unstaged generated diffs:',JSON.stringify(changed));
          const extra=changed.filter(p=>!allowed.has(p));
          if(extra.length)throw Error('Unreviewed generated paths: '+extra.join(', '));
          NODE
          git add -- data/places/places_index.json data/runtime/place-open/birkelunden.json data/fagverk/fagverk_release.json data/places/place_image_backlog_summary.json
          git diff --quiet
          git diff --cached --check
          git commit -m 'Merge reviewed By, Civication and Tøyenbadet main snapshot into Minneparken draft after QA'
          git push origin HEAD:content/minneparken-kildebasert-leksikon-20261103
          echo 'PASS draft-branch-only merge; main and active manifests untouched'
      - name: Upload canonical Knowledge contract audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minneparken-main-a360-knowledge-contract
          path: reports/knowledge-contract-audit.json
          retention-days: 30
          if-no-files-found: warn
