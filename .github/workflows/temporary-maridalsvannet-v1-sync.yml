name: Temporary Maridalsvannet v1 generated data sync
on:
  push:
    branches:
      - content/oslo-maridalsvannet-v1-20261021
    paths:
      - .github/workflows/temporary-maridalsvannet-v1-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/oslo-maridalsvannet-v1-20261021
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build canonical generated materializations
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run places:index:build
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
          npm run place-open:build
          npm run epoker:places:build
          node --test tests/fagverk-place-pages.test.mjs tests/fagverk-place-rendering.test.mjs tests/fagverk-place-substance-audit.test.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run place-open:check
      - name: Commit generated outputs only
        run: |
          set -euo pipefail
          git add -u -- \
            data/places/places_index.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/fagverk-place-page-coverage-v2.json \
            data/runtime/place-open \
            data/epoker/epoke-place-index.json
          if git diff --cached --quiet; then
            echo 'Already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(place): sync Maridalsvannet v1 generated index and runtime'
          git pull --rebase origin content/oslo-maridalsvannet-v1-20261021
          git push origin HEAD:refs/heads/content/oslo-maridalsvannet-v1-20261021
