name: Audit Scenekunst batch 7 coordinates

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/scenekunst-batch-7-coordinate-trigger.txt'

permissions:
  contents: read

jobs:
  audit-coordinates:
    if: github.event.pull_request.head.ref == 'agent/scenekunst-batch-7-coordinate-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Query exact Geonorge address candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          targets = [
              {
                  "id": "operahuset_nordfjord",
                  "name": "Operahuset Nordfjord",
                  "query": "Sophus Lie-vegen 3 6770 Nordfjordeid",
                  "postcode": "6770",
                  "number": "3",
                  "letter": "",
              },
              {
                  "id": "figurteatret_i_nordland",
                  "name": "Figurteatret i Nordland",
                  "query": "J M Johansens vei 23 8340 Stamsund",
                  "postcode": "8340",
                  "number": "23",
                  "letter": "",
              },
              {
                  "id": "grenland_friteater",
                  "name": "Grenland Friteater",
                  "query": "Huken 3 D 3921 Porsgrunn",
                  "postcode": "3921",
                  "number": "3",
                  "letter": "D",
              },
              {
                  "id": "rom_for_dans",
                  "name": "Rom for Dans",
                  "query": "Marstrandgata 8 0566 Oslo",
                  "postcode": "0566",
                  "number": "8",
                  "letter": "",
              },
              {
                  "id": "red_residency_eina_danz",
                  "name": "R.E.D. Residency Eina Danz",
                  "query": "Einavegen 1771 2843 Eina",
                  "postcode": "2843",
                  "number": "1771",
                  "letter": "",
              },
          ]

          def norm(value):
              return str(value or "").strip().upper().replace(" ", "")

          results = []
          for target in targets:
              params = urllib.parse.urlencode({"sok": target["query"], "treffPerSide": 25})
              url = f"https://ws.geonorge.no/adresser/v1/sok?{params}"
              request = urllib.request.Request(url, headers={"User-Agent": "History-Go-coordinate-audit/1.0"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)

              candidates = payload.get("adresser") or payload.get("addresses") or []
              compact = []
              exact = []
              for item in candidates:
                  point = item.get("representasjonspunkt") or item.get("representasjonspunktEPSG4326") or {}
                  number = item.get("nummer") or item.get("husnummer") or ""
                  letter = item.get("bokstav") or item.get("husbokstav") or ""
                  postcode = item.get("postnummer") or ""
                  record = {
                      "adressetekst": item.get("adressetekst"),
                      "adressenavn": item.get("adressenavn"),
                      "nummer": number,
                      "bokstav": letter,
                      "postnummer": postcode,
                      "poststed": item.get("poststed"),
                      "kommunenummer": item.get("kommunenummer"),
                      "kommunenavn": item.get("kommunenavn"),
                      "adressekode": item.get("adressekode"),
                      "adresseId": item.get("adresseId") or item.get("adresseid"),
                      "lat": point.get("lat"),
                      "lon": point.get("lon"),
                      "rawRepresentasjonspunkt": point,
                  }
                  compact.append(record)
                  if (
                      norm(postcode) == norm(target["postcode"])
                      and norm(number) == norm(target["number"])
                      and norm(letter) == norm(target["letter"])
                  ):
                      exact.append(record)

              results.append({
                  **target,
                  "requestUrl": url,
                  "candidateCount": len(compact),
                  "exactCount": len(exact),
                  "exactMatches": exact,
                  "candidates": compact,
              })

          report = {
              "schema": "history-go.scenekunst-coordinate-audit.v1",
              "provider": "Geonorge Adresser v1",
              "targets": results,
              "allExactAndUnique": all(item["exactCount"] == 1 for item in results),
          }
          out = Path('/tmp/scenekunst-batch-7-coordinate-audit.json')
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          print(out.read_text())
          if not report["allExactAndUnique"]:
              raise SystemExit('One or more addresses did not return exactly one postcode/number/letter match')
          PY

      - name: Upload coordinate audit
        uses: actions/upload-artifact@v4
        with:
          name: scenekunst-batch-7-coordinate-audit
          path: /tmp/scenekunst-batch-7-coordinate-audit.json
          if-no-files-found: error
          retention-days: 7
