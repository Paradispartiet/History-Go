name: Oslo Oppdag Kvadraturen Stil og arkitektur batch 1 audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-oppdag-kvadraturen-stil-arkitektur-batch-1-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Audit existing canonical coverage
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-stil-arkitektur-batch-1/audit'
          mkdir -p "$outdir"
          {
            echo '=== Candidate name/address search ==='
            grep -RInEi 'Sjøfartsbygningen|Sjofartsbygningen|Kirkegata 5|Kirkegata 7|Kongens gate 6' data/places || true
            echo
            echo '=== Candidate id search ==='
            grep -RInE '"id"[[:space:]]*:[[:space:]]*"(sjofarts|sjoefarts|kirkegata_5)' data/places || true
          } | tee "$outdir/existing-place-search.txt"

      - name: Resolve address candidates
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-stil-arkitektur-batch-1/coordinates'
          mkdir -p "$outdir"

          npm run places:coords:find:address -- --address 'Kirkegata 5 Oslo' \
            | tee "$outdir/kirkegata_5.json"

          npm run places:coords:find:address -- --address 'Kirkegata 7 Oslo' \
            | tee "$outdir/sjofartsbygningen_kirkegata_7.json"

          npm run places:coords:find:address -- --address 'Kongens gate 6 Oslo' \
            | tee "$outdir/sjofartsbygningen_kongens_gate_6.json"

      - name: Resolve named Sjøfartsbygningen geometry
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-stil-arkitektur-batch-1/coordinates'
          mkdir -p "$outdir"
          curl --max-time 30 --retry 2 --fail --silent --show-error \
            -H 'User-Agent: History-Go coordinate audit (github.com/Paradispartiet/History-Go)' \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'format=jsonv2' \
            --data-urlencode 'q=Sjøfartsbygningen, Oslo, Norge' \
            --data-urlencode 'countrycodes=no' \
            --data-urlencode 'limit=10' \
            --data-urlencode 'addressdetails=1' \
            --data-urlencode 'namedetails=1' \
            --data-urlencode 'polygon_geojson=1' \
            --data-urlencode 'viewbox=10.72,59.92,10.76,59.89' \
            --data-urlencode 'bounded=1' \
            | tee "$outdir/sjofartsbygningen_nominatim.json"

      - name: Persist audit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/oslo-oppdag-kvadraturen-stil-arkitektur-batch-1
          if ! git diff --cached --quiet; then
            git commit -m 'Save Stil og arkitektur batch 1 audit evidence'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
