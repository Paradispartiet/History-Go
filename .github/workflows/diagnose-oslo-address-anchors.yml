name: Diagnose Oslo address anchors

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: agent/fix-oslo-address-anchors-torggata-storgata-v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Capture all Geonorge results
        shell: bash
        run: |
          set +e
          mkdir -p reports/oslo-address-anchor-repair-20260719/coordinates

          npm run places:coords:find:address -- --address "Hausmanns gate 19 Oslo" \
            | tee reports/oslo-address-anchor-repair-20260719/coordinates/torggata_blad.json
          blad_status=${PIPESTATUS[0]}

          npm run places:coords:find:address -- --address "Torggata 22 Oslo" \
            | tee reports/oslo-address-anchor-repair-20260719/coordinates/torggata.json
          torggata_status=${PIPESTATUS[0]}

          npm run places:coords:find:address -- --address "Storgata 26 Oslo" \
            | tee reports/oslo-address-anchor-repair-20260719/coordinates/storgata.json
          storgata_status=${PIPESTATUS[0]}

          cat > reports/oslo-address-anchor-repair-20260719/coordinate-command-status.json <<EOF
          {
            "torggata_blad": ${blad_status},
            "torggata": ${torggata_status},
            "storgata": ${storgata_status}
          }
          EOF

          exit 0

      - name: Persist diagnostic evidence
        run: |
          set -euo pipefail
          rm .github/workflows/diagnose-oslo-address-anchors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports .github/workflows/diagnose-oslo-address-anchors.yml
          git commit -m "Capture Oslo address anchor diagnostics"
          git push origin HEAD
