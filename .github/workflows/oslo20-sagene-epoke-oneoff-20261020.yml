name: Oslo-20 Sagene targeted timeline materialization
on:
  push:
    branches: [content/oslo20-sagene-v42-closeout-20261020]
    paths: [.github/workflows/oslo20-sagene-epoke-oneoff-20261020.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Update source evidence while preserving Oslo coverage totals
        run: |
          cp data/epoker/epoke-place-index.json /tmp/oslo20-epoke-previous.json
          npm run epoker:places:build
          node --input-type=module - <<'JS'
          import fs from "node:fs";
          const prev=JSON.parse(fs.readFileSync("/tmp/oslo20-epoke-previous.json","utf8"));
          const next=JSON.parse(fs.readFileSync("data/epoker/epoke-place-index.json","utf8"));
          if(JSON.stringify(prev)===JSON.stringify(next))throw Error("Expected new Sagene source material to update index");
          const old=prev.domains.historie.oslo_coverage;
          const fresh=next.domains.historie.oslo_coverage;
          for(const key of ["canonical_place_count","dated_evidence_place_count","documented_case_place_count","awaiting_source_backed_history_count"]){
            if(old[key]!==fresh[key])throw Error("Unexpected Oslo coverage change: "+key);
          }
          if(old.places.find(p=>p.place_id==="sagene_skole")?.status!=="dated_evidence" ||
             fresh.places.find(p=>p.place_id==="sagene_skole")?.status!=="dated_evidence")throw Error("Unexpected Sagene classification");
          console.log("Regenerated Sagene evidence: classification and 587-place totals unchanged");
          JS
          node --test tests/epoke-place-index.test.mjs
      - name: Save generated index and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/oslo20-sagene-epoke-oneoff-20261020.yml
          git add -A .github/workflows/oslo20-sagene-epoke-oneoff-20261020.yml
          git add data/epoker/epoke-place-index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(oslo20): sync Sagene sources in History timeline'
          git push origin HEAD:refs/heads/content/oslo20-sagene-v42-closeout-20261020
