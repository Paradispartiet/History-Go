name: Rebuild Technology V3 subject baseline

on:
  push:
    branches:
      - editorial/teknologi-v3-20260805
    paths:
      - .github/workflows/rebuild-teknologi-v3-subject-baseline.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/teknologi-v3-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild Fagverk subject baseline
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs --write-report
          node scripts/audit-fagverk-subject-inventory.mjs
      - name: Revalidate Technology V3
        run: |
          node tools/build-teknologi-editorial-v3.mjs --check
          node scripts/validate-teknologi-editorial-v3.mjs
          node --test tests/vitenskap-teknologi-category-contract.test.mjs
      - name: Remove temporary workflow
        run: rm .github/workflows/rebuild-teknologi-v3-subject-baseline.yml
      - name: Commit clean generated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refresh Fagverk subject baseline for Technology V3"
          git push origin HEAD:editorial/teknologi-v3-20260805
