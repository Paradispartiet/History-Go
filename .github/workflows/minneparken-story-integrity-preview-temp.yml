name: Temporary Minneparken isolated Story integrity preview
on:
  push:
    branches:
      - content/minneparken-kildebasert-leksikon-20261103
    paths:
      - .github/workflows/minneparken-story-integrity-preview-temp.yml
permissions:
  contents: read
jobs:
  preview:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/minneparken-kildebasert-leksikon-20261103
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify candidate is not currently active
        run: node --test tests/minneparken-story-candidate.test.mjs
      - name: Run full canonical Story integrity on isolated test activation
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d "$RUNNER_TEMP/minneparken-story-XXXXXX")"
          cleanup() {
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force "$temp/repo" || true
            rm -rf "$temp"
          }
          trap cleanup EXIT
          git worktree add --detach "$temp/repo" HEAD
          cd "$temp/repo"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'data/stories/stories_minneparken_gamlebyen.json';
          const manifestPath = 'data/stories/stories_manifest.json';
          const episodePath = 'data/stories/stories_episode_v1_manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          const episodes = JSON.parse(fs.readFileSync(episodePath,'utf8'));
          if (manifest.files.some(x => x.path === file) || episodes.files.includes(file)) {
            throw Error('Story already active; refusing preview injection');
          }
          manifest.files.push({category:'historie',entity_id:'minneparken_gamlebyen',path:file});
          episodes.files.push(file);
          fs.writeFileSync(manifestPath,JSON.stringify(manifest,null,2)+'\n');
          fs.writeFileSync(episodePath,JSON.stringify(episodes,null,2)+'\n');
          console.log('Injected Story into two DISPOSABLE manifests; permanent manifests remain unchanged');
          NODE
          node --experimental-strip-types tools/check_stories_integrity.mts
          echo "Full canonical Story integrity PASS in disposable worktree only."
