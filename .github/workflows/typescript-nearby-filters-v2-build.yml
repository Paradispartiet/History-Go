name: Build Nearby filters v2 branch

on:
  pull_request:
    paths:
      - ".github/workflows/typescript-nearby-filters-v2-build.yml"
      - ".github/scripts/apply_nearby_filters_v2.py"
      - "js/ui/nearbyFilters.ts"
  push:
    branches:
      - agent/typescript-nearby-filters-v2
    paths:
      - ".github/workflows/typescript-nearby-filters-v2-build.yml"
      - ".github/scripts/apply_nearby_filters_v2.py"
      - "js/ui/nearbyFilters.ts"

permissions:
  contents: write

jobs:
  build-nearby-filters:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/typescript-nearby-filters-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/typescript-nearby-filters-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply migration to current main structure
        run: python3 .github/scripts/apply_nearby_filters_v2.py
      - name: Verify browser TypeScript and generate bundles
        run: |
          npm run typecheck:web
          npm run build:web
          git diff --check
      - name: Commit source integration and generated bundles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            build/build-web.mjs \
            js/app.js \
            js/ui/leftPanelMode.ts \
            js/ui/left-panel.js \
            schemas/app-globals.d.ts \
            dist/web/nearbyFilters.js \
            dist/web/leftPanelMode.js
          if git diff --cached --quiet; then
            echo "No generated integration changes to commit"
            exit 0
          fi
          git commit -m "Integrate Nearby filter state runtime"
          git push origin HEAD:agent/typescript-nearby-filters-v2
