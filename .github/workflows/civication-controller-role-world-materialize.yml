name: Civication Controller Role World materializer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: civication-controller-role-world-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/civication-controller-role-world'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Materialize and verify Controller Role World
        run: node scripts/materialize-civication-controller-role-world.mjs

      - name: Commit verified permanent outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/Civication/lifestory/manifest.json \
            data/Civication/lifestory/roles/controller/role.json \
            data/Civication/lifestory/roles/controller/threads.json \
            data/Civication/lifestory/roles/controller/scenes.json \
            data/Civication/mailPlans/naeringsliv/controller_plan.json \
            data/Civication/roleWorlds/naeringsliv/controller.json \
            data/Civication/roleWorlds/index.json \
            data/Civication/roleWorldPolicy.json \
            data/Civication/roleWorldAuthoringChecklist.json \
            data/Civication/compiledSceneRegistryV1.json \
            data/Civication/careerGameplayMatrix.json \
            reports/civication-career-gameplay-matrix.md \
            docs/CIVICATION_ROLE_WORLD_STANDARD.md \
            docs/CIVICATION_ROLE_WORLD_AUTHORING_GUIDE.md \
            tests/civication-controller-role-world.test.js \
            tests/civication-role-world-contract.test.js
          if git diff --cached --quiet; then
            echo "Controller Role World already materialized; nothing to commit."
            exit 0
          fi
          git commit -m "Materialize Controller as fourth Civication Role World"
          git push origin HEAD:${{ github.head_ref }}
