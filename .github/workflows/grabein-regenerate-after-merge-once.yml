name: Grabein canonical regeneration (one shot)

on:
  push:
    branches:
      - place/museumsleiligheten-grabein-production-20261009

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: place/museumsleiligheten-grabein-production-20261009
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Regenerate Grabein quiz context
        run: node scripts/build-quiz-production-context.mjs --category historie --target museumsleiligheten_grabein --output data/quiz/production_context/historie/museumsleiligheten_grabein.json
      - name: Regenerate Knowledge source links
        run: npm run knowledge:canonical:write
      - name: Regenerate place-open and chronology
        run: |
          node scripts/build-place-open-payloads.mjs
          node scripts/build-epoke-place-index.mjs
      - name: Regenerate complete Fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Verify Grabein and epoke contract
        run: node --test tests/grabein-bjorklund-quiz-integrity.test.mjs tests/museumsleiligheten-grabein-collections.test.mjs tests/epoke-place-index.test.mjs
      - name: Commit generated files and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/quiz/production_context/historie/museumsleiligheten_grabein.json data/quiz/historie/museumsleiligheten_grabein_sets.json data/knowledge/knowledge_units.generated.json reports/knowledge-id-backfill.json data/runtime/place-open data/epoker/epoke-place-index.json data/fagverk/fagverk_release.json
          git rm -- .github/workflows/grabein-regenerate-after-merge-once.yml
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "build(grabein): regenerate canonical data after latest main merge"
            git push origin HEAD:place/museumsleiligheten-grabein-production-20261009
          fi
