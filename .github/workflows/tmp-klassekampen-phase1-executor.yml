name: TEMP Klassekampen Phase 1 executor

on:
  push:
    branches:
      - agent/klassekampen-phase-1-20260915
    paths:
      - .github/workflows/tmp-klassekampen-phase1-executor.yml

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact phase branch
        uses: actions/checkout@v4
        with:
          ref: agent/klassekampen-phase-1-20260915
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Execute locked Phase 1 materializer blocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          source = Path('.github/workflows/tmp-klassekampen-phase1-materialize.yml')
          lines = source.read_text().splitlines()

          def extract_run(name):
              marker = f'      - name: {name}'
              matches = [i for i, line in enumerate(lines) if line == marker]
              if len(matches) != 1:
                  raise SystemExit(f'{name}: expected exactly one step marker, found {len(matches)}')
              i = matches[0] + 1
              while i < len(lines) and lines[i].strip() != 'run: |':
                  if lines[i].startswith('      - name: '):
                      raise SystemExit(f'{name}: run block not found')
                  i += 1
              if i >= len(lines):
                  raise SystemExit(f'{name}: run block not found')
              run_indent = len(lines[i]) - len(lines[i].lstrip())
              block = []
              i += 1
              while i < len(lines):
                  line = lines[i]
                  indent = len(line) - len(line.lstrip()) if line.strip() else 10**9
                  if line.strip() and indent <= run_indent:
                      break
                  cut = run_indent + 2
                  block.append(line[cut:] if len(line) >= cut else '')
                  i += 1
              script = '\n'.join(block).rstrip() + '\n'
              if not script.strip():
                  raise SystemExit(f'{name}: empty run block')
              return script

          def run_locked(name):
              print(f'=== {name} ===', flush=True)
              subprocess.run(['bash', '-lc', extract_run(name)], check=True)

          run_locked('Verify locked ancestry')
          run_locked('Materialize canonical Phase 1 sources')

          place_path = Path('data/places/media/oslo/places_oslo_media/klassekampen_redaksjon.json')
          packet_path = Path('data/places/production/klassekampen_redaksjon.json')
          place = json.loads(place_path.read_text())
          packet = json.loads(packet_path.read_text())

          popup = place['popupDesc']
          if '\n\n' in popup:
              raise SystemExit('expected one-paragraph locked popup before policy repair')

          old_first = 'Første nummer av dagens Klassekampen kom i februar 1969.'
          new_first = 'Dagens Klassekampen begynte å komme ut i februar 1969.'
          old_meta = 'History Go bruker Grønland 4 som kartanker for den aktive redaksjonen, mens institusjonshistorien brukes som bakgrunn og tidslinje.'
          new_meta = 'Grønland 4 er den dokumenterte redaksjonsadressen i dag, mens institusjonshistorien gir bakgrunn og tidslinje.'
          break_after_distribution = 'Bokmagasinet og Musikkmagasinet er egne løpende publikasjoner knyttet til avisen.'
          break_after_timeline = 'Bjørgulv Braanen ble redaktør i 2002, og Mari Skurdal overtok som sjefredaktør i 2018.'

          for needle in [old_first, old_meta, break_after_distribution, break_after_timeline]:
              count = popup.count(needle)
              if count != 1:
                  raise SystemExit(f'expected exactly one popup fragment, found {count}: {needle}')

          popup = popup.replace(old_first, new_first, 1)
          popup = popup.replace(old_meta, new_meta, 1)
          popup = popup.replace(break_after_distribution, break_after_distribution + '\n\n', 1)
          popup = popup.replace(break_after_timeline, break_after_timeline + '\n\n', 1)

          if popup.count('\n\n') != 2:
              raise SystemExit('popup policy repair did not produce exactly three paragraphs')
          if 'History Go' in popup:
              raise SystemExit('forbidden product meta text remains in popup')
          if old_first in popup:
              raise SystemExit('strong-term wording remains in popup sentence 5')

          place['popupDesc'] = popup
          packet['textHashes']['popupDesc'] = hashlib.sha256(popup.encode('utf-8')).hexdigest()
          place_path.write_text(json.dumps(place, ensure_ascii=False, indent=2) + '\n')
          packet_path.write_text(json.dumps(packet, ensure_ascii=False, indent=2) + '\n')

          for name in [
              'Regenerate owner-controlled outputs',
              'Validate Phase 1 contracts',
              'Record Phase 1 checkpoint',
              'Enforce exact Phase 1 write surface',
          ]:
              run_locked(name)
          PY

      - name: Commit validated Phase 1 sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/places/media/oslo/places_oslo_media/klassekampen_redaksjon.json \
            data/places/production/klassekampen_redaksjon.json \
            data/leksikon/sprak/places/europe/norway/oslo/klassekampen_redaksjon.json \
            data/leksikon/sprak/manifest.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            data/places/places_index.json \
            data/epoker/epoke-place-index.json \
            reports/place-production/klassekampen-source-review-v1.md \
            reports/place-production/klassekampen-workcard-current.json
          git diff --cached --check
          git diff --cached --name-only
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Materialize Klassekampen Phase 1 sources and chronology'
          git push origin HEAD:agent/klassekampen-phase-1-20260915
