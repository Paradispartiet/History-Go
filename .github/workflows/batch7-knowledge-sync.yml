name: Batch 7 Knowledge sync

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-people-zero-gap-batch7-v3
          fetch-depth: 0
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate canonical Knowledge outputs
        run: npm run knowledge:canonical:write

      - name: Verify canonical Knowledge outputs
        run: |
          npm run knowledge:canonical:check
          npm run knowledge:legacy:check
          npm run audit:knowledge

      - name: Publish clean Knowledge sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/batch7-knowledge-sync.yml
          git add data/knowledge/knowledge_units.generated.json data/knowledge/concepts.generated.json reports/knowledge-id-backfill.json .github/workflows/batch7-knowledge-sync.yml
          git diff --cached --check
          git commit -m "Synchronize canonical Knowledge outputs"
          git push origin HEAD:agent/oslo-people-zero-gap-batch7-v3
