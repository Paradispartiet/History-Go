name: Materialize Øvre spinneri quiz registries
on:
  push:
    branches: [work/spinner-materialize-20261118]
    paths:
      - '.github/workflows/spinner-materialize-once.yml'
      - 'data/quiz/historie/seilduksfabrikken_nydalen_sets.json'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Generate and validate
        run: |
          npm run knowledge:canonical:write
          npm run knowledge:canonical:check
          node scripts/materialize-natur-final-registry.mjs
          node scripts/build-fagverk-release-manifest.mjs
          git add -- data/knowledge/knowledge_units.generated.json data/knowledge/knowledge_emne_review_queue.generated.json reports/knowledge-id-backfill.json data/fagverk/fagverk_release.json
          git diff --exit-code
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit generated files and remove one-time workflow
        run: |
          git rm -- .github/workflows/spinner-materialize-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize Øvre spinneri quiz registries'
          git push origin HEAD:refs/heads/work/spinner-materialize-20261118
