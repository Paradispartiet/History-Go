name: Tronsmo editorial People media integration
on:
  push:
    branches:
      - content/tronsmo-people-editorial-images-20261111
    paths:
      - 'data/people/litteratur/oslo/tronsmo_bokhandel/ivar_tronsmo.json'
      - 'data/people/kunst/oslo/tronsmo_bokhandel/lars_fiske.json'
      - 'data/people/kunst/oslo/tronsmo_bokhandel/bendik_kaltenborn.json'
      - 'bilder/illustrasjoner/people/*_historygo_editorial.svg'
      - 'tests/oslo-ts-tronsmo-people-quizcard-v1.test.mjs'
      - '.github/workflows/tronsmo-people-editorial-20261111.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tronsmo-editorial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/tronsmo-people-editorial-images-20261111
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate canonical Place-open and People projections
        run: |
          npm run place-open:build
          npm run civication:history-people:build
      - name: Verify Tronsmo source images and generated runtime
        run: |
          node --test tests/oslo-ts-tronsmo-people-quizcard-v1.test.mjs
          npm run place-open:check
      - name: Commit exact generated projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/place-open/tronsmo_bokhandel.json data/runtime/people-all/ data/Civication/historyPeople_index.json
          if ! git diff --cached --quiet; then
            git commit -m "build(tronsmo): materialize three original People illustrations"
            git fetch origin content/tronsmo-people-editorial-images-20261111
            git rebase origin/content/tronsmo-people-editorial-images-20261111
            git push origin HEAD:content/tronsmo-people-editorial-images-20261111
          fi
