name: Inspect Hausmanns gate 19 candidates

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: agent/fix-oslo-address-anchors-torggata-storgata-v2

      - name: Fetch raw Geonorge candidates
        run: |
          set -euo pipefail
          mkdir -p reports/oslo-address-anchor-repair-20260719/coordinates
          curl --fail --silent --show-error --get \
            --data-urlencode "sok=Hausmanns gate 19 Oslo" \
            "https://ws.geonorge.no/adresser/v1/sok" \
            | tee reports/oslo-address-anchor-repair-20260719/coordinates/hausmanns_gate_19_raw.json

          jq '{total: (.adresser | length), candidates: [.adresser[] | {adressetekst, adressetekstutenadressetilleggsnavn, adressetilleggsnavn, adressekode, nummer, bokstav, kommunenummer, kommunenavn, postnummer, poststed, gardsnummer, bruksnummer, festenummer, undernummer, representasjonspunkt}]}' \
            reports/oslo-address-anchor-repair-20260719/coordinates/hausmanns_gate_19_raw.json \
            | tee reports/oslo-address-anchor-repair-20260719/coordinates/hausmanns_gate_19_candidates.json

      - name: Persist candidates
        run: |
          set -euo pipefail
          rm .github/workflows/inspect-hausmanns-gate-19.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports .github/workflows/inspect-hausmanns-gate-19.yml
          git commit -m "Inspect Hausmanns gate 19 Geonorge candidates"
          git push origin HEAD
