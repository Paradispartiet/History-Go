name: Temporary Minneparken merge-conflict inventory against main
on:
  push:
    branches:
      - content/minneparken-kildebasert-leksikon-20261103
    paths:
      - .github/workflows/minneparken-main-conflict-inventory-temp.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/minneparken-kildebasert-leksikon-20261103
          fetch-depth: 0
          persist-credentials: false
      - name: Compute a non-pushing merge conflict inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/minneparken-main-merge
          git fetch --no-tags origin main
          git rev-parse HEAD > artifacts/minneparken-main-merge/pr-head.txt
          git rev-parse origin/main > artifacts/minneparken-main-merge/main-head.txt
          git merge-base HEAD origin/main > artifacts/minneparken-main-merge/merge-base.txt
          set +e
          git -c merge.conflictStyle=diff3 merge --no-ff --no-commit origin/main > artifacts/minneparken-main-merge/merge-stdout.txt 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > artifacts/minneparken-main-merge/merge-exit-code.txt
          git status --short > artifacts/minneparken-main-merge/merge-status.txt
          git diff --name-only --diff-filter=U > artifacts/minneparken-main-merge/conflicts.txt
          git ls-files -u > artifacts/minneparken-main-merge/conflict-stages.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import cp from 'node:child_process';
          const dir='artifacts/minneparken-main-merge';
          const read=f=>fs.readFileSync(dir+'/'+f,'utf8').trim();
          const files=read('conflicts.txt').split('\n').filter(Boolean);
          const categories={};
          for(const file of files){
            const key=file.startsWith('data/runtime/')||file==='data/places/places_index.json'||file.startsWith('data/fagverk/fagverk_release')
              ?'generated'
              :file.startsWith('data/')?'canonical_data':file.startsWith('tools/')||file.startsWith('scripts/')?'source_code':'other';
            (categories[key]??=[]).push(file);
          }
          const summary={schema:'minneparken_merge_inventory_v1',date:'2026-11-03',scope:'read_only_dry_run_no_push',pr_head:read('pr-head.txt'),main_head:read('main-head.txt'),merge_base:read('merge-base.txt'),merge_exit_code:Number(read('merge-exit-code.txt')),conflict_count:files.length,conflicts:files,categories,unresolved:files.length>0,requires_human_or_source_aware_resolution:files.length>0};
          fs.writeFileSync(dir+'/report.json',JSON.stringify(summary,null,2)+'\n');
          for(const file of files){
            const patch=cp.spawnSync('git',['diff','--cc','--',file],{encoding:'utf8',maxBuffer:5*1024*1024});
            const safe=file.replaceAll(/[^A-Za-z0-9_-]/g,'_');
            fs.writeFileSync(dir+'/conflict_'+safe+'.patch',(patch.stdout||'').slice(0,30000));
          }
          console.log(JSON.stringify(summary));
          NODE
          if test -f .git/MERGE_HEAD; then git merge --abort; fi
          git diff --quiet
          echo 'Read-only inventory complete. No commit, merge, PR status change, or push.'
      - name: Preserve exact conflicts and source-aware patches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minneparken-main-conflict-inventory
          path: artifacts/minneparken-main-merge/
          retention-days: 30
