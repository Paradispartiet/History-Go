name: TEMP Hausmannsbrua latest-main replay

on:
  push:
    branches:
      - agent/hausmannsbrua-place-production-20260911
    paths:
      - ".github/workflows/TEMP_hausmannsbrua_latest_main.yml"

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/hausmannsbrua-place-production-20260911

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify latest main is ancestor
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor 2789334c3ab6754fa716ed0f5feff8e79cc41db4 HEAD

      - name: Replay Hausmannsbrua on latest main
        run: node tools/finalize-hausmannsbrua-completion.mjs

      - name: Validate Hausmannsbrua closure
        run: node --test tests/hausmannsbrua-completion.test.mjs

      - name: Ensure no temporary media cache remains
        run: test ! -e .cache/hausmannsbrua-media

      - name: Remove one-shot workflow
        run: rm .github/workflows/TEMP_hausmannsbrua_latest_main.yml

      - name: Commit latest-main replay
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "Reconcile Hausmannsbrua on latest main"
          git push origin HEAD:agent/hausmannsbrua-place-production-20260911
