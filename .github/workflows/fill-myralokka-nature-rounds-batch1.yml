name: Fill Myraløkka nature rounds batch 1

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/tmp/myralokka_payload.part*'
      - '.github/workflows/fill-myralokka-nature-rounds-batch1.yml'

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Rebuild verified production script
        shell: bash
        run: |
          set -euo pipefail
          cat tools/tmp/myralokka_payload.part{0..4} | base64 -d | gzip -d > /tmp/produce_myralokka.py
          echo '8c9bccc5ad1b7fb2e58713a4ed1fd6e6405c615942787b0f4fa6f7cf1619f014  /tmp/produce_myralokka.py' | sha256sum -c -
          python -m py_compile /tmp/produce_myralokka.py

      - name: Produce Myraløkka content
        run: python /tmp/produce_myralokka.py

      - name: Validate targeted content
        shell: bash
        run: |
          set -euo pipefail
          node tests/myralokka-nature-rounds-batch1.test.js
          node tests/oslo-nature-rounds-batch9-akerselva-mid.test.js
          node tests/place-card-leksikon-content-audit.test.js
          node tests/voienvolden-history-rounds-batch1.test.js
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              'data/places/natur/oslo/places_oslo_natur_akerselvarute/myralokka.json',
              'data/places/natur/oslo/places_oslo_natur_akerselvarute_index.json',
              'data/places/natur/oslo/places_oslo_natur_akerselvarute_manifest.json',
              'data/quiz/natur/myralokka_sets.json',
              'data/leksikon/places/oslo/natur/leksikon_oslo_natur_batch3.json',
              'data/stories/stories_myralokka.json',
              'data/stories/stories_manifest_natur_batch_01.json',
          ]:
              json.loads(Path(path).read_text(encoding='utf-8'))
          print('Changed JSON parse OK')
          PY
          git diff --check

      - name: Commit production files and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/tmp/myralokka_payload.part{0..4}
          rm -f .github/workflows/fill-myralokka-nature-rounds-batch1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fill Myraløkka nature rounds batch 1'
          git push origin HEAD:${{ github.head_ref }}
