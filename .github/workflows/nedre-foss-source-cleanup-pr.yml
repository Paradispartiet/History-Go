name: Nedre Foss source cleanup PR runner

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nedre-foss-source-cleanup-pr.yml'
      - 'tools/cleanup-nedre-foss-source-holdbacks.py'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cleanup-nedre-foss-source-holdbacks
          fetch-depth: 0

      - name: Apply cleanup and capture validation
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p reports/nedre-foss-source-cleanup/validation

          status=0

          python tools/cleanup-nedre-foss-source-holdbacks.py \
            > reports/nedre-foss-source-cleanup/validation/apply-cleanup.txt 2>&1
          apply_status=$?
          if [ "$apply_status" -ne 0 ]; then status=1; fi

          npm ci --silent \
            > reports/nedre-foss-source-cleanup/validation/npm-ci.txt 2>&1
          npm_status=$?
          if [ "$npm_status" -ne 0 ]; then status=1; fi

          node tests/nedre-foss-rounds-batch1.test.js \
            > reports/nedre-foss-source-cleanup/validation/nedre-foss-targeted-test.txt 2>&1
          targeted_status=$?
          if [ "$targeted_status" -ne 0 ]; then status=1; fi

          node tests/place-card-rounds-runtime-audit.test.js \
            > reports/nedre-foss-source-cleanup/validation/place-card-rounds-runtime.txt 2>&1
          runtime_status=$?
          if [ "$runtime_status" -ne 0 ]; then status=1; fi

          npm run audit:people-of-places \
            > reports/nedre-foss-source-cleanup/validation/people-of-places.txt 2>&1
          people_status=$?
          if [ "$people_status" -ne 0 ]; then status=1; fi
          git checkout origin/main -- reports/people-of-places-status.json reports/people-of-places-status.md 2>/dev/null || true

          node - <<'NODE' > reports/nedre-foss-source-cleanup/validation/json-parse.txt 2>&1
          const fs = require('fs');
          for (const file of [
            'data/places/natur/oslo/places_oslo_natur_akerselvarute/nedre_foss.json',
            'data/leksikon/places/oslo/historie/leksikon_oslo_historie_nedre_foss.json',
            'data/people/historie/oslo/akerselva/friedrich_gruner.json'
          ]) JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log('JSON parse OK');
          NODE
          json_status=$?
          if [ "$json_status" -ne 0 ]; then status=1; fi

          git diff --check \
            > reports/nedre-foss-source-cleanup/validation/git-diff-check.txt 2>&1
          diff_status=$?
          if [ "$diff_status" -ne 0 ]; then status=1; fi

          cat > reports/nedre-foss-source-cleanup/validation/status.txt <<EOF
          apply_cleanup=$apply_status
          npm_ci=$npm_status
          targeted_test=$targeted_status
          place_card_runtime=$runtime_status
          people_of_places=$people_status
          json_parse=$json_status
          git_diff_check=$diff_status
          overall=$status
          EOF

          rm -f .github/workflows/nedre-foss-source-cleanup.yml
          rm -f .github/workflows/nedre-foss-source-cleanup-pr.yml
          rm -f tools/cleanup-nedre-foss-source-holdbacks.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: resolve stale Nedre Foss source holdbacks'
          git push origin HEAD:agent/cleanup-nedre-foss-source-holdbacks

          echo "Captured validation overall=$status; ordinary PR CI will remain authoritative."
