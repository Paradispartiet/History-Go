name: Integrate rebased Etne history batch 3

on:
  push:
    branches:
      - agent/etne-historie-batch-3

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip etne integration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-historie-batch-3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          set -o pipefail
          mkdir -p reports/etne-historie-batch-3-integration
          npm install --no-audit --no-fund 2>&1 | tee reports/etne-historie-batch-3-integration/npm-install.txt
      - name: Register source files
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee reports/etne-historie-batch-3-integration/manifest-update.txt
          const fs = require('fs');
          const file = 'data/places/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const wanted = [
            'places/historie/vestland/etne/skanevik_gjestgjevargarden.json',
            'places/historie/vestland/etne/driftevegen_stordalen_roldal.json',
            'places/historie/vestland/etne/postvegen_rullestadjuvet.json',
            'places/historie/vestland/etne/folgefonden_minnesmerke_skanevik.json',
            'places/historie/vestland/etne/reichwald_snublesteiner_skanevik.json'
          ];
          for (const entry of wanted) if (!manifest.files.includes(entry)) manifest.files.push(entry);
          for (const entry of wanted) {
            const count = manifest.files.filter((x) => x === entry).length;
            if (count !== 1) throw new Error(`${entry}: expected exactly once, got ${count}`);
            console.log(`PASS manifest ${entry}`);
          }
          fs.writeFileSync(file, JSON.stringify(manifest) + '\n');
          NODE
      - name: Build and validate
        run: |
          set -o pipefail
          bash scripts/check-places.sh 2>&1 | tee reports/etne-historie-batch-3-integration/check-places.txt
          npm run audit:places-split-manifest-sync 2>&1 | tee reports/etne-historie-batch-3-integration/split-manifest-sync.txt
          npm run places:coords:quality 2>&1 | tee reports/etne-historie-batch-3-integration/coordinate-quality.txt
          node <<'NODE' 2>&1 | tee reports/etne-historie-batch-3-integration/targeted-validation.txt
          const fs = require('fs');
          const index = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const ids = ['skanevik_gjestgjevargarden','driftevegen_stordalen_roldal','postvegen_rullestadjuvet','folgefonden_minnesmerke_skanevik','reichwald_snublesteiner_skanevik'];
          for (const id of ids) {
            const count = index.filter((x) => x.id === id).length;
            if (count !== 1) throw new Error(`${id}: expected one runtime row, got ${count}`);
            console.log(`PASS ${id}: exactly one active runtime row`);
          }
          const seen = new Set(), dup = new Set();
          for (const row of index) { if (seen.has(row.id)) dup.add(row.id); seen.add(row.id); }
          if (dup.size) throw new Error(`duplicate active IDs: ${[...dup].join(', ')}`);
          console.log('PASS global duplicate active place IDs: 0');
          NODE
          git diff --check 2>&1 | tee reports/etne-historie-batch-3-integration/git-diff-check.txt
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/integrate-etne-history-batch3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/manifest.json data/places/places_index.json reports/etne-historie-batch-3-integration .github/workflows/integrate-etne-history-batch3.yml
          git commit -m 'Integrate rebased Etne history batch 3 [skip etne integration]'
          git push origin HEAD:agent/etne-historie-batch-3
