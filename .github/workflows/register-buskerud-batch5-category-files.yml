name: Register Buskerud batch 5 category files

on:
  push:
    branches:
      - main
    paths:
      - .github/buskerud-batch5-trigger.txt

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reduce history batch and update places manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          batch_path = Path('data/places/historie/buskerud/places_historie_buskerud_batch5.json')
          batch = json.loads(batch_path.read_text(encoding='utf-8'))
          moved_ids = {'lauvlia_kittelsen', 'hagan_skredsvig'}
          reduced = [place for place in batch if place.get('id') not in moved_ids]
          expected_order = [
              'gulskogen_gard',
              'aal_bygdamuseum',
              'gol_bygdemuseum',
              'hemsedal_bygdatun',
              'krokkleiva_kongeveien',
              'bragernes_kirke',
          ]
          by_id = {place['id']: place for place in reduced}
          if list(by_id) != expected_order:
              raise SystemExit(f'Unexpected retained order: {list(by_id)}')
          if any(place.get('category') != 'historie' for place in reduced):
              raise SystemExit('Retained batch 5 place has non-historie category')
          batch_path.write_text(
              json.dumps(reduced, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          manifest_path = Path('data/places/manifest.json')
          data = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = data['files']
          anchor = 'places/historie/buskerud/places_historie_buskerud_batch5.json'
          additions = [
              'places/kunst/buskerud/lauvlia_kittelsen.json',
              'places/kunst/buskerud/hagan_skredsvig.json',
          ]
          for item in additions:
              while item in files:
                  files.remove(item)
          insert_at = files.index(anchor) + 1
          files[insert_at:insert_at] = additions
          manifest_path.write_text(
              json.dumps(data, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8',
          )
          PY
      - name: Commit changes and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/historie/buskerud/places_historie_buskerud_batch5.json data/places/manifest.json
          git rm .github/workflows/register-buskerud-batch5-category-files.yml .github/buskerud-batch5-trigger.txt
          git commit -m "Split and register Buskerud batch 5 category files"
          git push origin main
