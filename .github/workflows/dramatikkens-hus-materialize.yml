name: Dramatikkens hus materialize

on:
  push:
    branches:
      - agent/dramatikkens-hus-full-production-20260914
    paths:
      - '.github/workflows/dramatikkens-hus-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.event.head_commit.message == 'Add temporary Dramatikkens materializer' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/dramatikkens-hus-full-production-20260914

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync main and regenerate canonical derived data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          npm run epoker:places:build
          npm run place-open:build
          git diff --check
          rm .github/workflows/dramatikkens-hus-materialize.yml
          git add -A
          git commit -m "Sync main and materialize Dramatikkens hus indexes"
          git push origin HEAD:agent/dramatikkens-hus-full-production-20260914
