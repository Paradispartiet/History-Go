name: Film TV final repair once

on:
  push:
    branches:
      - agent/film-tv-holistic-192-completion-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair head
        uses: actions/checkout@v4
        with:
          ref: agent/film-tv-holistic-192-completion-audit
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Materialize targeted monotonicity repairs
        run: node scripts/repair-ftv-final-gaps-once.mjs

      - name: Validate permanent monotonicity guard
        run: node scripts/repair-film-tv-completion-monotonicity-v1.mjs

      - name: Validate representation monotonicity
        run: node --test tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs

      - name: Validate variable inventory at completion
        run: node scripts/audit-film-tv-variable-inventory-v1.mjs

      - name: Validate legacy Phase4 audits
        run: |
          node scripts/audit-fagverk-film-tv-kinoer-visningssteder-publikum-phase4.mjs
          node scripts/audit-fagverk-film-tv-produksjon-studio-filmarbeid-phase4.mjs

      - name: Validate Unit12 deterministic canonical claim IDs
        run: |
          node scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
          node scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
          node --test tests/film-tv-screen-places-identity-circulation-fulltext-v1.test.mjs

      - name: Reject unexpected generated drift
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(scripts/repair-film-tv-completion-monotonicity-v1\.mjs|tests/film-tv-representation-position-counterimages-monotone-regression-v1\.test\.mjs|scripts/audit-film-tv-variable-inventory-v1\.mjs|scripts/audit-fagverk-film-tv-kinoer-visningssteder-publikum-phase4\.mjs|scripts/audit-fagverk-film-tv-produksjon-studio-filmarbeid-phase4\.mjs|scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1\.mjs)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error title=Unexpected Film TV repair drift::Repair changed files outside the locked source/test set"
            printf '%s\n' "$unexpected"
            git diff -- $unexpected
            exit 1
          fi
          expected=(
            scripts/repair-film-tv-completion-monotonicity-v1.mjs
            tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs
            scripts/audit-film-tv-variable-inventory-v1.mjs
            scripts/audit-fagverk-film-tv-kinoer-visningssteder-publikum-phase4.mjs
            scripts/audit-fagverk-film-tv-produksjon-studio-filmarbeid-phase4.mjs
            scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
          )
          for file in "${expected[@]}"; do
            if git diff --quiet -- "$file"; then
              echo "::error title=Missing Film TV repair::$file was expected to change but did not"
              exit 1
            fi
          done

      - name: Commit repairs and remove one-shot transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/film-tv-final-repair-once.yml scripts/repair-ftv-final-gaps-once.mjs
          git add \
            scripts/repair-film-tv-completion-monotonicity-v1.mjs \
            tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs \
            scripts/audit-film-tv-variable-inventory-v1.mjs \
            scripts/audit-fagverk-film-tv-kinoer-visningssteder-publikum-phase4.mjs \
            scripts/audit-fagverk-film-tv-produksjon-studio-filmarbeid-phase4.mjs \
            scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
          git commit -m "fix(film-tv): close final completion monotonicity gaps"
          git push origin HEAD:agent/film-tv-holistic-192-completion-audit
