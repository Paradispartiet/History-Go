name: Film TV final repair once

on:
  push:
    branches:
      - agent/film-tv-holistic-192-completion-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair head
        uses: actions/checkout@v4
        with:
          ref: agent/film-tv-holistic-192-completion-audit
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Materialize targeted monotonicity repairs
        run: node scripts/repair-ftv-final-gaps-once.mjs

      - name: Validate permanent monotonicity guard
        run: node scripts/repair-film-tv-completion-monotonicity-v1.mjs

      - name: Validate representation monotonicity
        run: node --test tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs

      - name: Validate variable inventory at completion
        run: node scripts/audit-film-tv-variable-inventory-v1.mjs

      - name: Validate legacy Phase4 audits
        run: |
          node scripts/audit-fagverk-film-tv-kinoer-visningssteder-publikum-phase4.mjs
          node scripts/audit-fagverk-film-tv-produksjon-studio-filmarbeid-phase4.mjs

      - name: Validate Unit12 deterministic canonical claim IDs
        run: |
          node scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
          node scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
          node --test tests/film-tv-screen-places-identity-circulation-fulltext-v1.test.mjs

      - name: Validate Unit12 module drift is keypoint reference-only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const files = [
            'data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/01-by-bolig-og-urban-skala.json',
            'data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/02-landskap-periferi-og-arktis.json',
            'data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/03-mobilitet-tilhorighet-og-romlig-sirkulasjon.json',
            'data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/04-ikoniske-steder-myte-og-skjermminne.json'
          ];

          let changedReferences = 0;
          for (const file of files) {
            const before = JSON.parse(execFileSync('git', ['show', `HEAD:${file}`], { encoding: 'utf8' }));
            const after = JSON.parse(fs.readFileSync(file, 'utf8'));
            const expected = structuredClone(before);

            for (const section of expected.sections || []) {
              section.keyPointClaimIds = (section.keyPointClaimIds || []).map((group) =>
                group.map((id) => {
                  if (!/^sp-/u.test(id)) throw new Error(`${file}: unexpected pre-repair keyPoint claim ID ${id}`);
                  changedReferences += 1;
                  return id.replace(/^sp-/u, 'spsi-');
                })
              );
            }

            if (JSON.stringify(expected) !== JSON.stringify(after)) {
              throw new Error(`${file}: generated drift is not limited to sp-* -> spsi-* keyPointClaimIds`);
            }
          }

          if (changedReferences === 0) throw new Error('Unit12 reference migration changed no keyPoint claim IDs');
          console.log(`Validated ${changedReferences} Unit12 keyPoint claim references as reference-only canonical migration.`);
          NODE

      - name: Reject unexpected generated drift
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(scripts/repair-film-tv-completion-monotonicity-v1\.mjs|tests/film-tv-representation-position-counterimages-monotone-regression-v1\.test\.mjs|scripts/audit-film-tv-variable-inventory-v1\.mjs|scripts/audit-fagverk-film-tv-kinoer-visningssteder-publikum-phase4\.mjs|scripts/audit-fagverk-film-tv-produksjon-studio-filmarbeid-phase4\.mjs|scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1\.mjs|data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/(01-by-bolig-og-urban-skala|02-landskap-periferi-og-arktis|03-mobilitet-tilhorighet-og-romlig-sirkulasjon|04-ikoniske-steder-myte-og-skjermminne)\.json)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            unexpected_inline="$(printf '%s' "$unexpected" | paste -sd ', ' -)"
            echo "::error title=Unexpected Film TV repair drift::Repair changed files outside the locked source/test/reference set: $unexpected_inline"
            printf '%s\n' "$unexpected"
            git diff -- $unexpected
            exit 1
          fi
          expected=(
            scripts/repair-film-tv-completion-monotonicity-v1.mjs
            tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs
            scripts/audit-film-tv-variable-inventory-v1.mjs
            scripts/audit-fagverk-film-tv-kinoer-visningssteder-publikum-phase4.mjs
            scripts/audit-fagverk-film-tv-produksjon-studio-filmarbeid-phase4.mjs
            scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
            data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/01-by-bolig-og-urban-skala.json
            data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/02-landskap-periferi-og-arktis.json
            data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/03-mobilitet-tilhorighet-og-romlig-sirkulasjon.json
            data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/04-ikoniske-steder-myte-og-skjermminne.json
          )
          for file in "${expected[@]}"; do
            if git diff --quiet -- "$file"; then
              echo "::error title=Missing Film TV repair::$file was expected to change but did not"
              exit 1
            fi
          done

      - name: Commit repairs and remove one-shot transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/film-tv-final-repair-once.yml scripts/repair-ftv-final-gaps-once.mjs
          git add \
            scripts/repair-film-tv-completion-monotonicity-v1.mjs \
            tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs \
            scripts/audit-film-tv-variable-inventory-v1.mjs \
            scripts/audit-fagverk-film-tv-kinoer-visningssteder-publikum-phase4.mjs \
            scripts/audit-fagverk-film-tv-produksjon-studio-filmarbeid-phase4.mjs \
            scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs \
            data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/01-by-bolig-og-urban-skala.json \
            data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/02-landskap-periferi-og-arktis.json \
            data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/03-mobilitet-tilhorighet-og-romlig-sirkulasjon.json \
            data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/04-ikoniske-steder-myte-og-skjermminne.json
          git commit -m "fix(film-tv): close final completion monotonicity gaps"
          git push origin HEAD:agent/film-tv-holistic-192-completion-audit
