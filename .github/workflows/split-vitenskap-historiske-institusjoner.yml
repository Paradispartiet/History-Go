name: Split Oslo historical science institutions

on:
  push:
    branches:
      - data/split-vitenskap-historiske-institusjoner-20260708

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/split-vitenskap-historiske-institusjoner-20260708
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/split-vitenskap-historiske-institusjoner.mjs
      - run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add data/places/vitenskap/oslo/places_vitenskap_historiske_institusjoner data/places/vitenskap/oslo/places_vitenskap_historiske_institusjoner_manifest.json data/places/vitenskap/oslo/places_vitenskap_historiske_institusjoner_index.json data/places/vitenskap/oslo/places_vitenskap_historiske_institusjoner_split_report.txt
          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Generate split Oslo historical institution files"
            git push
          fi
