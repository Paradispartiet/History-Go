name: One-shot History war collaboration and gray zones V1

on:
  push:
    branches:
      - agent/history-war-collaboration-grayzones-evidence-v1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/history-war-collaboration-grayzones-evidence-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize canonical evidence batch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, value) => {
            fs.mkdirSync(path.dirname(p), { recursive: true });
            fs.writeFileSync(p, `${JSON.stringify(value, null, 2)}\n`);
          };
          const sorted = (values) => [...new Set(values)].sort((a, b) => String(a).localeCompare(String(b), 'nb'));
          const addUnique = (array, key, item) => {
            if (!array.some((row) => row[key] === item[key])) array.push(item);
          };
          const geo = 'geo_no_oslo_akershus';
          const profileId = 'profile_historie_no_oslo_akershus';
          const caseId = 'case_his_nationaltheatret';
          const placeId = 'nationaltheatret';
          const targetEmne = 'em_his_krig_okkupasjon_okkupasjon_samarbeid_tilpasning_og_motstand';
          const commonEmne = 'em_his_okkupasjon_motstand';
          const civilEmne = 'em_his_krig_okkupasjon_sivilsamfunn_total_krig_og_hverdagsliv';

          const claimsPath = 'data/fag/historie/claims_historie_canonical_v1.json';
          const sourcesPath = 'data/fag/historie/sources_historie_canonical_v1.json';
          const evidencePath = 'data/fag/historie/place_evidence_historie_v1.json';
          const theoryPath = 'data/fag/historie/theory_evidence_historie_canonical_v1.json';
          const profilePath = 'data/fag/profiles/historie/oslo_akershus/profile.json';
          const dossierPath = 'data/fag/historie/source_dossiers/war_collaboration_grayzones_v1.json';

          const claimsFile = read(claimsPath);
          const sourcesFile = read(sourcesPath);
          const evidenceFile = read(evidencePath);
          const theoryFile = read(theoryPath);
          const profile = read(profilePath);

          const sourceNational = {
            source_id: 'src_his_nationaltheatret_occupation_history',
            title: 'Nationaltheatret – Historie',
            publisher: 'Nationaltheatret',
            source_type: 'official_institution_history',
            url: 'https://www.nationaltheatret.no/om-oss/organisasjon/historie/',
            language: 'nb',
            geography_ids: [geo],
            temporal_scope: { from: 1940, to: 1945 },
            provenance: {
              repository_source: 'data/places/production/nationaltheatret.json',
              extracted_from: ['claims[id=claim_strike_arrests_1941]', 'claims[id=claim_strike_spread]'],
              accessed_at: '2026-07-30'
            },
            dating: { published_at: null, updated_at: null, accessed_at: '2026-07-30' },
            limitations: [
              'Nationaltheatrets egen historikk er autoritativ for institusjonens dokumenterte forløp, men er en ettertidsframstilling og erstatter ikke samtidige politi-, styre- eller personarkiver for hver enkelt deltaker.',
              'Streik, arrestasjoner og avslutning under trussel dokumenterer institusjonelle handlinger og tvang, men kilden gir ikke et representativt mål på alle ansattes motiv, risikovurdering eller politiske holdning.'
            ],
            quality: {
              tier: 'A',
              rationale: 'Offisiell institusjonskilde som allerede er faktasjekket i canonical Nationaltheatret-produksjon for streiken, arrestasjonene og den tvungne avslutningen i 1941.'
            }
          };

          const sourceNormann = {
            source_id: 'src_his_nbl_axel_otto_normann',
            title: 'Axel Otto Normann',
            publisher: 'Norsk biografisk leksikon / Store norske leksikon',
            source_type: 'biographical_reference',
            url: 'https://nbl.snl.no/Axel_Otto_Normann',
            language: 'nb',
            geography_ids: [geo],
            temporal_scope: { from: 1935, to: 1946 },
            provenance: {
              repository_source: 'data/people/claims/litteratur/oslo/nationaltheatret/axel_otto_normann.claims.json',
              extracted_from: ['claims[id=wartime_departure_return]', 'claims[id=nationaltheatret_1935_1941]', 'claims[id=nationaltheatret_1945_1946]'],
              accessed_at: '2026-07-30'
            },
            dating: { published_at: null, updated_at: null, accessed_at: '2026-07-30' },
            limitations: [
              'Biografiartikkelen dokumenterer Normanns institusjonelle rolle, avgang og retur, men er ikke en full dag-for-dag-rekonstruksjon av styrekonflikten, arrestasjonene eller alle beslutningene rundt teaterstreiken.',
              'En redigert personbiografi kan belyse én aktørs forløp, men Normanns valg og posisjon kan ikke uten videre gjøres representative for skuespillerne, styret, publikum eller norsk kulturliv under okkupasjonen.'
            ],
            quality: {
              tier: 'B',
              rationale: 'Redigert biografisk referansekilde som allerede er brukt i et faktasjekket People-claimsett for Normanns Nationaltheatret-perioder og krigsavgang.'
            }
          };

          addUnique(sourcesFile.sources, 'source_id', sourceNational);
          addUnique(sourcesFile.sources, 'source_id', sourceNormann);

          const claimStrike = {
            claim_id: 'claim_his_nationaltheatret_actor_strike_arrests_1941',
            statement: 'Skuespillere ved Nationaltheatret gikk til streik i 1941 under nazistenes kontrollforsøk, og femten skuespillere ble arrestert.',
            claim_type: 'occupation_cultural_resistance_and_repression',
            scope: {
              geography_ids: [geo],
              place_ids: [placeId],
              case_ids: [caseId],
              temporal: { from: 1941, to: 1941 }
            },
            emne_ids: [targetEmne, commonEmne, civilEmne],
            source_ids: [sourceNational.source_id],
            confidence: 'high',
            uncertainty: {
              level: 'medium',
              note: 'Institusjonskilden dokumenterer streiken og arrestasjonstallet, men ikke et komplett person-for-person-forløp, alle individuelle motiv eller hele myndighetenes beslutningskjede.'
            },
            alternative_interpretations: [
              'Streiken dokumenterer kollektiv motstand mot nazistisk kontroll ved institusjonen, men deltakernes individuelle motiv, risiko og handlingsrom kan ha variert.'
            ]
          };

          const claimCoercion = {
            claim_id: 'claim_his_nationaltheatret_strike_forced_end_1941',
            statement: 'Teaterstreiken som omfattet Nationaltheatret spredte seg til Bergen og Trondheim, og etter fem uker ga skuespillerne etter etter trusler om dødsstraff.',
            claim_type: 'occupation_coercion_and_forced_capitulation',
            scope: {
              geography_ids: [geo],
              place_ids: [placeId],
              case_ids: [caseId],
              temporal: { from: 1941, to: 1941 }
            },
            emne_ids: [targetEmne, commonEmne, civilEmne],
            source_ids: [sourceNational.source_id],
            confidence: 'high',
            uncertainty: {
              level: 'medium',
              note: 'Kilden dokumenterer spredningen, femukersforløpet og dødstrusselen, men Nationaltheatret-lenken brukes bare som lokalt anker for institusjonens deltakelse og ikke som fysisk anker for hendelsene i Bergen og Trondheim.'
            },
            alternative_interpretations: [
              'At arbeidet ble gjenopptatt etter trusler om dødsstraff dokumenterer tvang og kapitulasjon under press; det kan ikke uten videre tolkes som frivillig ideologisk støtte eller som likt opplevd handlingsrom for alle.'
            ]
          };

          const claimNormann = {
            claim_id: 'claim_his_nationaltheatret_normann_ns_board_departure_return_1941_1946',
            statement: 'Axel Otto Normann gikk av som teatersjef ved Nationaltheatret sommeren 1941 etter at et NS-oppnevnt styre tok over, kom tilbake etter frigjøringen i 1945 og ledet teatret til våren 1946.',
            claim_type: 'occupation_actor_institutional_trajectory',
            scope: {
              geography_ids: [geo],
              place_ids: [placeId],
              case_ids: [caseId],
              temporal: { from: 1941, to: 1946 }
            },
            emne_ids: [targetEmne, commonEmne],
            source_ids: [sourceNormann.source_id],
            confidence: 'high',
            uncertainty: {
              level: 'medium',
              note: 'NBL dokumenterer avgangen etter NS-styrets overtakelse og returen etter frigjøringen, men claimet tilskriver ikke Normann et mer detaljert motiv eller et komplett individuelt motstandsforløp enn kilden støtter.'
            },
            alternative_interpretations: [
              'Avgangen kan analyseres som institusjonell fortrengning under NS-kontroll, mens returen viser et etterkrigsbrudd; kilden alene fastslår ikke alle personlige motiver, forhandlinger eller mellomliggende handlinger.'
            ]
          };

          for (const claim of [claimStrike, claimCoercion, claimNormann]) addUnique(claimsFile.claims, 'claim_id', claim);

          const caseEmner = sorted([targetEmne, commonEmne, civilEmne]);
          addUnique(profile.cases, 'case_id', {
            case_id: caseId,
            label: 'Nationaltheatret',
            geography_id: geo,
            geography_scope: 'local_or_regional',
            status: 'pilot_validated',
            evidence_status: 'claim_source_linked',
            place_ids: [placeId],
            emne_ids: caseEmners,
            case_requirement_ids: [
              'case_req_his_temporal_sequence',
              'case_req_his_actor_conflict',
              'case_req_his_source_comparison',
              'case_req_his_comparative_scale'
            ],
            provenance: {
              migrated_from: 'data/places/production/nationaltheatret.json + data/people/claims/litteratur/oslo/nationaltheatret/axel_otto_normann.claims.json',
              migration_date: '2026-07-30'
            },
            validation: {
              status: 'validated_case',
              batch_id: 'history_war_collaboration_grayzones_evidence_v1',
              validated_at: '2026-07-30',
              minimum_evidence_links: 2,
              source_policy: 'canonical_registry_with_explicit_limitations',
              spatial_note: '`nationaltheatret` brukes som anker for hovedbygningen og den stedbundne teaterinstitusjonen; Nationaltheatret stasjon og streikehendelser i andre byer er ikke del av dette stedspunktet.'
            }
          });

          for (const emneId of [targetEmne, commonEmne, civilEmne]) {
            const mapping = profile.emne_case_mappings.find((row) => row.emne_id === emneId);
            if (mapping && !mapping.case_ids.includes(caseId)) mapping.case_ids.push(caseId);
          }

          const evidenceRows = [
            {
              evidence_id: 'evidence_his_nationaltheatret_01',
              profile_id: profileId,
              geography_id: geo,
              place_id: placeId,
              case_id: caseId,
              emne_ids: claimStrike.emne_ids,
              claim_id: claimStrike.claim_id,
              source_ids: claimStrike.source_ids,
              support_type: 'direct_single_source',
              validation_status: 'validated_case',
              limitations_inherited: true,
              note: 'Kobler den faktasjekkede Nationaltheatret-historikken om streik og arrestasjoner til et eksplisitt okkupasjonscase uten å tilskrive alle deltakere samme motiv.'
            },
            {
              evidence_id: 'evidence_his_nationaltheatret_02',
              profile_id: profileId,
              geography_id: geo,
              place_id: placeId,
              case_id: caseId,
              emne_ids: claimCoercion.emne_ids,
              claim_id: claimCoercion.claim_id,
              source_ids: claimCoercion.source_ids,
              support_type: 'direct_single_source',
              validation_status: 'validated_case',
              limitations_inherited: true,
              note: 'Kobler femukersforløpet og avslutningen under dødstrussel til Nationaltheatrets deltakelse og skiller tvunget kapitulasjon fra frivillig samarbeid.'
            },
            {
              evidence_id: 'evidence_his_nationaltheatret_03',
              profile_id: profileId,
              geography_id: geo,
              place_id: placeId,
              case_id: caseId,
              emne_ids: claimNormann.emne_ids,
              claim_id: claimNormann.claim_id,
              source_ids: claimNormann.source_ids,
              support_type: 'direct_single_source',
              validation_status: 'validated_case',
              limitations_inherited: true,
              note: 'Kobler Normanns dokumenterte avgang etter NS-styrets overtakelse og retur etter frigjøringen til Nationaltheatret uten å utlede udokumenterte personlige motiver.'
            }
          ];
          for (const row of evidenceRows) addUnique(evidenceFile.evidence_links, 'evidence_id', row);

          const claimMap = new Map(claimsFile.claims.map((row) => [row.claim_id, row]));
          const evidenceByClaim = new Map();
          for (const row of evidenceFile.evidence_links) {
            const list = evidenceByClaim.get(row.claim_id) || [];
            list.push(row);
            evidenceByClaim.set(row.claim_id, list);
          }
          const makeEntry = ({ theory_id, claim_ids, rationale, limitations, alternative_interpretations, disconfirmation_conditions, evidence_dimensions }) => {
            const selected = claim_ids.map((id) => claimMap.get(id));
            if (selected.some((row) => !row)) throw new Error(`Missing claim for ${theory_id}`);
            return {
              theory_id,
              status: 'evidence_ready',
              scope_status: 'multi_case_geographic_pilot',
              universalization_status: 'provisional_not_universal',
              claim_ids,
              source_ids: sorted(selected.flatMap((row) => row.source_ids || [])),
              case_ids: sorted(selected.flatMap((row) => row.scope?.case_ids || [])),
              place_ids: sorted(selected.flatMap((row) => row.scope?.place_ids || [])),
              emne_ids: sorted(selected.flatMap((row) => row.emne_ids || [])),
              evidence_link_ids: sorted(selected.flatMap((row) => (evidenceByClaim.get(row.claim_id) || []).map((link) => link.evidence_id))),
              evidence_dimensions,
              rationale,
              limitations,
              alternative_interpretations,
              disconfirmation_conditions,
              scope_note: 'Dette er et fler-case evidensgrunnlag i Oslo og er ikke universelt bevis for teoriens gyldighet på tvers av okkupasjoner, geografier, institusjoner, aktørgrupper eller kildetyper.'
            };
          };

          const villaClaim = 'claim_his_villa_grande_gimle_quisling_residence_1941';
          const theoryCollaboration = makeEntry({
            theory_id: 'theory_his_krig_okkupasjon_okkupasjon_samarbeid_tilpasning_og_motstand',
            claim_ids: [claimStrike.claim_id, claimCoercion.claim_id, claimNormann.claim_id, villaClaim],
            evidence_dimensions: ['documented_application', 'limitation_test', 'alternative_interpretation', 'multi_case_comparison', 'actor_trajectory', 'coercion_distinction'],
            rationale: 'Nationaltheatret følger et dokumentert institusjonelt forløp fra kollektiv streik og arrestasjoner via tvungen avslutning under dødstrussel til NS-styrets overtakelse og Normanns avgang og etterkrigsretur. Villa Grande gir samtidig et separat, tydelig kollaborasjons- og maktsted. Sammen gjør casene det mulig å skille motstand, tvang, institusjonell overtakelse og kollaborasjon uten å presse alle handlinger inn på én moralsk akse.',
            limitations: [
              'Nationaltheatret-caset dokumenterer en kulturinstitusjon og bestemte kollektive og ledelsesmessige forløp; det dekker ikke bredden i økonomisk samarbeid, daglig sivilliv, illegal virksomhet eller andre sektorers tilpasning under okkupasjonen.',
              'Villa Grande dokumenterer et klart makt- og kollaborasjonssted, mens claimene ikke kvantifiserer aktørenes individuelle gevinst, ideologi eller handlingsalternativer; kategoriene må derfor forbli knyttet til de konkrete handlingene som faktisk er dokumentert.'
            ],
            alternative_interpretations: [
              'Teaterforløpet kan leses som institusjonell motstand som til slutt ble brutt av tvang, men også som et eksempel på hvordan fortsatt drift, konflikt og tvungen normalisering kunne eksistere innen samme institusjon uten at de betyr det samme.'
            ],
            disconfirmation_conditions: [
              'Anvendelsen svekkes dersom gjenopptatt arbeid etter dødstrusler klassifiseres som frivillig samarbeid, dersom avgang automatisk likestilles med motstand uten aktørkilde, eller dersom Villa Grandes rolle brukes til å karakterisere andre aktører uten egen dokumentasjon.'
            ]
          });

          const theoryGrayzones = makeEntry({
            theory_id: 'theory_his_krig_okkupasjon_motstand_samarbeid_tilpasning_og_grasoner',
            claim_ids: [claimCoercion.claim_id, claimNormann.claim_id, villaClaim],
            evidence_dimensions: ['documented_application', 'limitation_test', 'alternative_interpretation', 'multi_case_comparison', 'microhistorical_actor_path', 'hard_boundary_contrast'],
            rationale: 'Nationaltheatrets femukersstreik endte under dødstrussel, mens Axel Otto Normanns dokumenterte avgang etter NS-styrets overtakelse og retur etter frigjøringen gir et avgrenset aktørforløp gjennom institusjonelt regimeskifte. Villa Grande brukes som hard kontrast: et bevoktet maktsted for Quisling-regimet skal ikke oppløses i en generell gråsonekategori. Casene prøver dermed hvordan tvang, institusjonsrolle og skiftende posisjon kan analyseres uten å relativisere dokumentert kollaborasjon.',
            limitations: [
              'Normann-claimet dokumenterer rolle, avgang og retur, men ikke alle samtidige relasjoner, informasjonsgrunnlag, nettverk eller personlige begrunnelser; mikrohistorisk analyse må derfor stoppe der kilden stopper.',
              'Det kollektive streikeforløpet viser tvang og institusjonell konflikt, men kan ikke brukes som representativ modell for hele teatret, kulturlivet eller den norske befolkningen, og gråsonebegrepet må ikke skjule dokumentert maktbruk eller ansvar.'
            ],
            alternative_interpretations: [
              'Normanns avgang og senere retur kan tolkes som et tydelig institusjonelt brudd snarere enn som en gråsone; verdien i sammenstillingen ligger derfor i å teste hvor gråsonebegrepet faktisk slutter, ikke i å plassere enhver aktør i en mellomkategori.'
            ],
            disconfirmation_conditions: [
              'Gråsoneanvendelsen skal avvises dersom den brukes til å gjøre dødstrusler til frivillig tilpasning, tilskrive Normann udokumenterte motiver eller redusere Villa Grandes klare kollaborasjonsfunksjon til analytisk tvetydighet.'
            ]
          });

          addUnique(theoryFile.entries, 'theory_id', theoryCollaboration);
          addUnique(theoryFile.entries, 'theory_id', theoryGrayzones);
          theoryFile.completion.total_theories = 230;
          theoryFile.completion.qualifying_entries = theoryFile.entries.length;
          theoryFile.completion.ratio = Math.round((theoryFile.entries.length / 230) * 1000) / 1000;

          const profileEvidence = evidenceFile.evidence_links.filter((row) => row.profile_id === profileId);
          const profileClaimIds = new Set(profileEvidence.map((row) => row.claim_id));
          const profileSourceIds = new Set(profileEvidence.flatMap((row) => row.source_ids || []));
          const verifiedCases = profile.cases.filter((row) => row.evidence_status === 'claim_source_linked');
          profile.production_coverage.cases_total = profile.cases.length;
          profile.production_coverage.verified_cases_total = verifiedCases.length;
          profile.production_coverage.claims_total = profileClaimIds.size;
          profile.production_coverage.sources_total = profileSourceIds.size;
          profile.production_coverage.evidence_links_total = profileEvidence.length;

          const dossier = {
            schema_version: '1.0',
            dossier_id: 'history_war_collaboration_grayzones_evidence_v1',
            subject_id: 'historie',
            geography_id: geo,
            status: 'reviewed_source_dossier',
            accessed_at: '2026-07-30',
            scope: {
              qualified_theory_ids: [theoryCollaboration.theory_id, theoryGrayzones.theory_id],
              case_ids: [caseId, 'case_his_hl_senteret_villa_grande'],
              method_rule: 'Klassifiser handlinger etter dokumentert tvang, initiativ, institusjonsrolle, konsekvens og endring over tid. Gjenopptatt arbeid under dødstrussel er ikke frivillig støtte; gråsonebegrepet brukes til å teste avgrensede aktørforløp og må ikke oppløse dokumentert kollaborasjon eller ansvar.'
            },
            spatial_anchoring: {
              nationaltheatret: {
                place_id: placeId,
                status: 'verified_main_theatre_institution_anchor',
                assessment: 'Canonical `nationaltheatret` representerer hovedbygningen og den stedbundne institusjonen på Johanne Dybwads plass. Det brukes som anker for teaterstreiken og Normanns institusjonsrolle, ikke for Nationaltheatret stasjon eller streikehendelser i Bergen og Trondheim.'
              },
              villa_grande: {
                place_id: 'villa_grande',
                status: 'existing_validated_collaboration_power_anchor',
                assessment: 'Villa Grande gjenbrukes som eksisterende validert case for Quisling-regimets bevoktede residens og fungerer som tydelig grensecase mot å gjøre all okkupasjonsatferd til gråsone.'
              }
            },
            source_anchoring: {
              new_source_ids: [sourceNational.source_id, sourceNormann.source_id],
              reused_source_ids: ['src_his_hl_senteret_official'],
              assessment: 'Nationaltheatrets offisielle historikk bærer streik-, arrestasjons- og tvangssporet. NBL bærer Normanns rolleforløp. HL-senterets eksisterende kilde bærer Villa Grande som kollaborasjons- og maktsted. Kildene fyller ulike funksjoner og brukes ikke som gjensidig erstatning.'
            },
            source_snapshots: [
              {
                source_id: sourceNational.source_id,
                title: sourceNational.title,
                publisher: sourceNational.publisher,
                url: sourceNational.url,
                supported_dimensions: ['theatre_strike', 'arrests', 'coercive_end', 'institutional_resistance'],
                source_locations: ['Canonical place-production claims claim_strike_arrests_1941 og claim_strike_spread, faktasjekket 2026-07-29 mot Nationaltheatrets historieside.'],
                limitations: sourceNational.limitations
              },
              {
                source_id: sourceNormann.source_id,
                title: sourceNormann.title,
                publisher: sourceNormann.publisher,
                url: sourceNormann.url,
                supported_dimensions: ['director_role', 'ns_board_takeover', 'wartime_departure', 'post_liberation_return'],
                source_locations: ['People-claimsettet for Axel Otto Normann, særlig wartime_departure_return, faktasjekket 2026-07-28 mot NBL.'],
                limitations: sourceNormann.limitations
              }
            ],
            production_decisions: [
              'Nationaltheatret materialiseres som nytt Historie-case fordi canonical place- og People-produksjon allerede har direkte faktasjekket okkupasjonsevidens; batchen oppretter ikke en ny stedidentitet.',
              'Streik/arrestasjon, tvungen avslutning og Normanns institusjonelle rolle skilles i tre claims for å unngå at motstand, tvang og ledelsesendring blandes i én påstand.',
              'Villa Grande gjenbrukes som hardt kollaborasjons- og maktcase. Gråsoneobjektet bruker dette som avgrensning mot relativisering, ikke som påstand om at Quisling-regimets residens var tvetydig.',
              'De to teoriobjektene får ulike komplette claim-bundles; dette oppfyller både kontrakten og den faglige forskjellen mellom bred handlingsklassifikasjon og mikrohistorisk gråsoneanalyse.'
            ]
          };

          write(claimsPath, claimsFile);
          write(sourcesPath, sourcesFile);
          write(evidencePath, evidenceFile);
          write(theoryPath, theoryFile);
          write(profilePath, profile);
          write(dossierPath, dossier);

          const docPath = 'docs/HISTORY_THEORY_EVIDENCE.md';
          let doc = fs.readFileSync(docPath, 'utf8');
          doc = doc.replace('Produksjonen står på 67 av 230 etter at organisering, streik, forhandling, avindustrialisering, ombruk og industriarv V1 er lagt til.', 'Produksjonen står på 69 av 230 etter at okkupasjon, samarbeid, tilpasning, motstand og gråsoner V1 er lagt til.');
          doc = doc.replace('- Organisering, streik, forhandling, avindustrialisering, ombruk og industriarv V1: **2** nye kvalifiserende teoriobjekter, **2** nye claims, **2** nye kilder og **1** nyvalidert case.\n- Totalt: **67 av 230** teoriobjekter (**29.1 %**).\n- Universell status: **INCOMPLETE**.\n- Gjenstående teoriobjekter: **163**.', '- Organisering, streik, forhandling, avindustrialisering, ombruk og industriarv V1: **2** nye kvalifiserende teoriobjekter, **2** nye claims, **2** nye kilder og **1** nyvalidert case.\n- Okkupasjon, samarbeid, tilpasning, motstand og gråsoner V1: **2** nye kvalifiserende teoriobjekter, **3** nye claims, **2** nye kilder og **1** nyvalidert case.\n- Totalt: **69 av 230** teoriobjekter (**30.0 %**).\n- Universell status: **INCOMPLETE**.\n- Gjenstående teoriobjekter: **161**.');
          if (!doc.includes('**69 av 230**')) throw new Error('Failed to update HISTORY_THEORY_EVIDENCE.md');
          fs.writeFileSync(docPath, doc);

          const batchDoc = `# Historie — okkupasjon, samarbeid, tilpasning, motstand og gråsoner V1\n\nStatus: **VALIDATED EVIDENCE BATCH**\n\nDenne batchen kvalifiserer to nye teoriobjekter i \`his_krig_okkupasjon_motstand\`:\n\n- \`theory_his_krig_okkupasjon_okkupasjon_samarbeid_tilpasning_og_motstand\`\n- \`theory_his_krig_okkupasjon_motstand_samarbeid_tilpasning_og_grasoner\`\n\nHistorie forblir eksplisitt \`INCOMPLETE\`. Krig, okkupasjon og motstand går fra 4 av 10 til 6 av 10 kvalifiserte teoriobjekter, mens den universelle teorikøen går fra 67 til 69 av 230.\n\n## Nationaltheatret 1941\n\nNationaltheatrets faktasjekkede canonical produksjonsgrunnlag dokumenterer streik under nazistenes kontrollforsøk, femten arresterte skuespillere og at den bredere teaterstreiken etter fem uker ble avsluttet etter trusler om dødsstraff. Axel Otto Normanns faktasjekkede People-claim dokumenterer at han gikk av etter at et NS-oppnevnt styre tok over sommeren 1941 og kom tilbake etter frigjøringen.\n\nForløpet brukes ikke som én etikett. Streik og arrestasjon dokumenterer motstand og represjon; gjenopptatt arbeid etter dødstrussel dokumenterer tvang; Normanns avgang og retur dokumenterer et institusjonelt aktørforløp uten at batchen tilskriver ham udokumenterte motiv.\n\n## Villa Grande som grensecase\n\nDet eksisterende Villa Grande-claimet dokumenterer at NS-myndighetene tok stedet i bruk som Vidkun og Maria Quislings bevoktede residens «Gimle». Caset brukes som tydelig kollaborasjons- og maktgrense. Gråsoneanalyse skal forklare tvang og skiftende handlingsrom der kildene støtter det, men skal ikke gjøre dokumentert kollaborasjon analytisk uklar.\n\n## Produksjon\n\n- 3 nye canonical Historie-claims\n- 2 nye canonical Historie-kilder med eksisterende repo-proveniens\n- 3 nye validerte place–claim–source-koblinger\n- 1 nyvalidert case: Nationaltheatret\n- 2 nye \`evidence_ready\` teoriobjekter\n- teori-evidens: 67 → 69 av 230\n- krig, okkupasjon og motstand: 4 → 6 av 10\n\n## Evidensgrense\n\n- Fortsatt drift eller gjenopptatt arbeid under okkupasjon er ikke i seg selv bevis på frivillig samarbeid.\n- Gjenopptatt arbeid etter trusler om dødsstraff klassifiseres som tvang, ikke som ideologisk støtte.\n- Normanns avgang og retur brukes bare slik NBL dokumenterer dem; motiv og mellomliggende handlinger fylles ikke inn.\n- Ett teaterforløp representerer ikke norsk sivilsamfunn generelt.\n- Villa Grande brukes som hard grense mot å gjøre dokumentert kollaborasjon til en vag gråsone.\n- Oslo-casene er ikke universelt bevis for handlingskategorier under andre okkupasjoner.\n\n## Canonical filer\n\n- \`data/fag/historie/claims_historie_canonical_v1.json\`\n- \`data/fag/historie/sources_historie_canonical_v1.json\`\n- \`data/fag/historie/place_evidence_historie_v1.json\`\n- \`data/fag/historie/theory_evidence_historie_canonical_v1.json\`\n- \`data/fag/historie/source_dossiers/war_collaboration_grayzones_v1.json\`\n- \`data/fag/profiles/historie/oslo_akershus/profile.json\`\n`;
          fs.writeFileSync('docs/HISTORY_WAR_COLLABORATION_GRAYZONES_EVIDENCE_V1.md', batchDoc);

          const testPath = 'tests/fagverk-historie.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          if (!test.includes('assert.equal(report.universalCoverage.theoryEvidenceQualifying, 67);')) throw new Error('Expected 67 regression assertion not found');
          test = test.replace('assert.equal(report.universalCoverage.theoryEvidenceQualifying, 67);', 'assert.equal(report.universalCoverage.theoryEvidenceQualifying, 69);');
          fs.writeFileSync(testPath, test);
          NODE

      - name: Regenerate deterministic History reports
        shell: bash
        run: |
          set -euo pipefail
          node tools/validate-historie-theory-evidence.mjs
          node tools/audit-historie-geographic-profile.mjs
          node tools/audit-historie-universal-coverage.mjs
          node tools/audit-historie-v5-5-quality-depth.mjs --write-freeze --reason='V5.8 freeze reaffirmed after war collaboration and gray-zones V6 evidence batch; frozen theory definitions remain unchanged.'
          node scripts/audit-fagverk-historie.mjs --write-report --no-check-report

      - name: Validate focused History gates
        shell: bash
        run: |
          set -euo pipefail
          node tools/validate-historie-profile-evidence.mjs
          node tools/validate-historie-theory-evidence.mjs --check
          node tools/audit-historie-geographic-profile.mjs --check
          node tools/audit-historie-universal-coverage.mjs --check
          node tools/audit-historie-v5-5-quality-depth.mjs
          node scripts/audit-fagverk-historie.mjs
          node --test tests/fagverk-historie.test.mjs

      - name: Commit production output and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-history-war-collaboration-grayzones-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Bygg Historie samarbeid- og gråsoneevidens V1'
          git push origin HEAD:agent/history-war-collaboration-grayzones-evidence-v1
