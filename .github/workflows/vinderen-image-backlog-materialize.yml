name: Materialize Vinderen image backlog summary

on:
  push:
    branches:
      - place/vinderen-fagverk-v2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: place/vinderen-fagverk-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize backlog summary from canonical audit
        run: |
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/place-image-audit.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const summaryPath = 'data/places/place_image_backlog_summary.json';
          const report = JSON.parse(fs.readFileSync('/tmp/place-image-audit.json', 'utf8'));
          const saved = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
          saved.generatedAt = '2026-09-07';
          saved.generatedFromCommit = 'vinderen_fagverk_v2_20260907';
          saved.totalPlaces = report.totalPlaces;
          saved.summary = {
            validLocal: report.summary.local,
            validRemote: report.summary.remote,
            optionalMissing: report.summary.optional,
            missing: report.summary.missing,
            invalidLocalPath: report.summary.invalid,
            remaining: report.summary.missing + report.summary.invalid
          };
          for (const [category, bucket] of Object.entries(report.byCategory)) {
            const previous = saved.byCategory?.[category] ?? {};
            saved.byCategory[category] = {
              total: bucket.total,
              valid: bucket.local + bucket.remote,
              optional: bucket.optional,
              missing: bucket.missing,
              invalid: bucket.invalid,
              ...(previous.designAlias ? { designAlias: previous.designAlias } : {})
            };
          }
          fs.writeFileSync(summaryPath, `${JSON.stringify(saved, null, 2)}\n`);
          EOF
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/place-image-audit-verify.json --verify-summary=data/places/place_image_backlog_summary.json
          changed="$(git diff --name-only)"
          test "$changed" = "data/places/place_image_backlog_summary.json" || {
            echo "Unexpected generated changes:"
            printf '%s\n' "$changed"
            exit 1
          }
      - name: Commit permanent summary and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/place_image_backlog_summary.json
          git rm .github/workflows/vinderen-image-backlog-materialize.yml
          git commit -m "chore: sync Vinderen image backlog summary"
          git push origin HEAD:place/vinderen-fagverk-v2
