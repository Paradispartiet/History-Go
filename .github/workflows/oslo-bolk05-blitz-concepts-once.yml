name: Oslo bolk 05 - fix Blitzhuset canonical concepts once
on:
  push:
    branches:
      - research/oslo-sentrum-bolk05-tekst-20261101
    paths:
      - .github/workflows/oslo-bolk05-blitz-concepts-once.yml
permissions:
  contents: write
concurrency:
  group: oslo-bolk05-blitz-concepts-20261102
  cancel-in-progress: false
jobs:
  link-blitz:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bind existing canonical Subkultur concept IDs to 21 Blitzhuset questions
        run: node scripts/link-oslo-bolk05-blitz-concepts.mjs
      - name: Regenerate canonical Knowledge and synchronize QuizCards
        run: |
          npm run knowledge:canonical:write
          node scripts/build-oslo-bolk05-quizzes.mjs --sync-cards
          npm run knowledge:canonical:check
          node scripts/build-oslo-bolk05-quizzes.mjs --check
      - name: Confirm Subkultur quiz Knowledge audit is clean
        run: node scripts/audit-subkultur-quiz-knowledge-v1.mjs
      - name: Commit bounded Blitz metadata change without touching other Oslo batches
        env:
          BRANCH_NAME: research/oslo-sentrum-bolk05-tekst-20261101
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/quiz/subkultur/blitzhuset_sets.json data/quizcards/subkultur/blitzhuset_quizkort_v1.json
          git add -- data/knowledge/ reports/knowledge-contract-audit.json reports/knowledge-id-backfill.json
          git rm -- .github/workflows/oslo-bolk05-blitz-concepts-once.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Bind Blitzhuset 21 fullquiz and 10 QuizCard questions to canonical Subkultur concepts"
          git fetch origin "$BRANCH_NAME"
          if [ "$(git rev-parse "origin/$BRANCH_NAME")" != "$(git rev-parse HEAD^)" ]; then
            echo "::error::PR branch advanced; refusing to overwrite"
            exit 1
          fi
          git push origin "HEAD:$BRANCH_NAME"
