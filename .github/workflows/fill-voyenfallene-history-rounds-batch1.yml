name: Fill Vøyenfallene history rounds batch 1

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  produce:
    if: github.event.pull_request.head.ref == 'agent/fill-voyenfallene-history-rounds-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Rebuild verified production script
        if: hashFiles('reports/voyenfallene-production-error.log') == ''
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path
          parts = [Path(f'tools/.tmp_voyenfallene_payload_{i}.txt').read_text(encoding='utf-8').strip() for i in range(5)]
          payload = ''.join(parts)
          assert hashlib.sha256(payload.encode('ascii')).hexdigest() == 'fc380cd67227c539e94afea3ff900475d90544d0ccecc6bd8caa31e533d48d9f'
          raw = gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(raw).hexdigest() == '76ecec38feaa5784acbf9271d5f6432e58a7fa1512bc6656ce1a5cf61d5568e8'
          script = raw.decode('utf-8')
          old = 'manifest["files"]'
          assert script.count(old) == 2, f'Expected exactly two route manifest references, found {script.count(old)}'
          script = script.replace(old, 'manifest["places"]')
          Path('tools/tmp_produce_voyenfallene_decoded.py').write_text(script, encoding='utf-8')
          print('Verified and patched Vøyenfallene production payload')
          PY

      - name: Produce Vøyenfallene content
        id: production
        if: hashFiles('reports/voyenfallene-production-error.log') == ''
        continue-on-error: true
        run: python tools/tmp_produce_voyenfallene_decoded.py > tools/tmp_voyenfallene_production.log 2>&1

      - name: Persist production failure
        if: steps.production.outcome == 'failure'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          cp tools/tmp_voyenfallene_production.log reports/voyenfallene-production-error.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/voyenfallene-production-error.log
          git commit -m "Record Vøyenfallene production error"
          git push origin HEAD:"$BRANCH"

      - name: Validate targeted content
        if: steps.production.outcome == 'success'
        run: |
          node tests/voyenfallene-history-rounds-batch1.test.js
          node tests/place-card-rounds-runtime-audit.test.js
          node tests/place-card-leksikon-content-audit.test.js
          node tests/glads-molle-history-rounds-batch1.test.js
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              'data/places/natur/oslo/places_oslo_natur_akerselvarute/voienfossen.json',
              'data/places/natur/oslo/places_oslo_natur_akerselvarute_index.json',
              'data/places/natur/oslo/places_oslo_natur_akerselvarute_manifest.json',
              'data/quiz/historie/voienfossen_sets.json',
              'data/people/natur/oslo/people_natur_oslo.json',
              'data/people/naeringsliv/oslo/people_naeringsliv_oslo.json',
              'data/stories/stories_voienfossen.json',
              'data/stories/stories_manifest_natur_batch_01.json',
              'data/leksikon/places/oslo/historie/leksikon_oslo_historie_batch2.json',
          ]
          for path in paths:
              json.loads(Path(path).read_text(encoding='utf-8'))
          print('JSON parse OK')
          PY
          git diff --check

      - name: Commit production files and remove temporary files
        if: steps.production.outcome == 'success'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f tools/tmp_produce_voyenfallene.py
          rm -f tools/tmp_produce_voyenfallene_decoded.py
          rm -f tools/tmp_voyenfallene_production.log
          rm -f tools/.tmp_voyenfallene_payload_*.txt
          rm -f reports/voyenfallene-production-error.log
          rm -f .github/workflows/fill-voyenfallene-history-rounds-batch1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fill Vøyenfallene history rounds batch 1"
          git push origin HEAD:"$BRANCH"
