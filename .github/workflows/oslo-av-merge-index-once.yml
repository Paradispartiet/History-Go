name: Oslo AV temporary index reconciliation
on:
  push:
    branches:
      - content/oslo-aav-text-v42-20261026
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reconcile indexes and merge main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const path = require('node:path');
          const get=(ref,file)=>JSON.parse(cp.execFileSync('git',['show',ref+':'+file],{maxBuffer:16000000,encoding:'utf8'}));
          const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          const check=(v,msg)=>{if(!v)throw Error(msg)};
          const common=cp.execFileSync('git',['merge-base','HEAD','origin/main'],{encoding:'utf8'}).trim();
          const ep='data/epoker/epoke-place-index.json', pl='data/places/places_index.json';
          const [base,head,main]=[common,'HEAD','origin/main'].map(ref=>get(ref,ep));
          const [pb,ph,pm]=[common,'HEAD','origin/main'].map(ref=>get(ref,pl));
          const ids=new Set(['wessels_plass','ostbanestasjonen']);
          check(eq(pb.map(x=>x.id),ph.map(x=>x.id))&&eq(pb.map(x=>x.id),pm.map(x=>x.id)),'Place ordering changed');
          const headChanges=ph.filter((p,i)=>!eq(p,pb[i])).map(x=>x.id);
          const mainChanges=pm.filter((p,i)=>!eq(p,pb[i])).map(x=>x.id);
          check(headChanges.length===2&&headChanges.every(id=>ids.has(id)),'Unexpected changes in PR index');
          check(headChanges.every(id=>!mainChanges.includes(id)),'Overlapping place index changes');
          const places=pm.map(p=>ids.has(p.id)?ph.find(h=>h.id===p.id):p);
          for(const section of ['epochs','parallel_tracks']){
            for(const [key,b] of Object.entries(base.domains.historie[section])){
              const h=head.domains.historie[section][key], m=main.domains.historie[section][key];
              const bm=new Map(b.places.map(p=>[p.place_id,p])),hm=new Map(h.places.map(p=>[p.place_id,p])),mm=new Map(m.places.map(p=>[p.place_id,p]));
              const all=new Set([...bm.keys(),...hm.keys(),...mm.keys()]);
              const hc=[...all].filter(id=>!eq(bm.get(id),hm.get(id)));
              const mc=[...all].filter(id=>!eq(bm.get(id),mm.get(id)));
              check(hc.every(id=>ids.has(id)),'Unexpected PR epoch change: '+key);
              check(hc.every(id=>!mc.includes(id)),'Overlapping epoch change: '+key);
              for(const id of hc){if(hm.has(id))mm.set(id,hm.get(id));else mm.delete(id);}
              m.places=[...mm.values()].sort((a,b)=>a.name.localeCompare(b.name,'nb')||a.place_id.localeCompare(b.place_id,'nb'));
              m.placeCount=m.places.length;
              m.milestoneCount=m.places.reduce((n,p)=>n+p.milestones.length,0);
            }
          }
          const cv=main.domains.historie.oslo_coverage,hcv=head.domains.historie.oslo_coverage;
          const hm=new Map(hcv.places.filter(p=>ids.has(p.place_id)).map(p=>[p.place_id,p]));
          cv.places=cv.places.map(p=>hm.get(p.place_id)||p);
          const count=(a,s)=>a.filter(p=>p.status===s).length;
          cv.dated_evidence_place_count=count(cv.places,'dated_evidence');
          cv.documented_case_place_count=count(cv.places,'documented_case');
          cv.awaiting_source_backed_history_count=count(cv.places,'awaiting_source_backed_history');
          for(const c of cv.categories){const subset=cv.places.filter(p=>p.category===c.category);c.total=subset.length;c.dated_evidence=count(subset,'dated_evidence');c.documented_case=count(subset,'documented_case');c.awaiting_source_backed_history=count(subset,'awaiting_source_backed_history');}
          for(const k of Object.keys(base.stats))main.stats[k]=main.stats[k]+head.stats[k]-base.stats[k];
          const groups=Object.values(main.domains.historie.epochs);
          check(groups.reduce((n,g)=>n+g.placeCount,0)===main.stats.epoch_place_relations,'Epoch relation mismatch');
          check(groups.reduce((n,g)=>n+g.milestoneCount,0)===main.stats.milestone_count,'Milestone mismatch');
          check(cv.places.length===593,'Coverage count mismatch');
          check(headChanges.every(id=>eq(places.find(p=>p.id===id),ph.find(p=>p.id===id))),'Place content lost');
          const tmp=process.env.RUNNER_TEMP;
          fs.writeFileSync(path.join(tmp,'oslo-av-merged-epoke.json'),JSON.stringify(main,null,2)+'\n');
          fs.writeFileSync(path.join(tmp,'oslo-av-merged-places.json'),JSON.stringify(places,null,2)+'\n');
          console.log('Reconciled',headChanges,'with',mainChanges,'epoch milestones',main.stats.milestone_count);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit -X ours origin/main
          cp "$RUNNER_TEMP/oslo-av-merged-epoke.json" data/epoker/epoke-place-index.json
          cp "$RUNNER_TEMP/oslo-av-merged-places.json" data/places/places_index.json
          git add data/epoker/epoke-place-index.json data/places/places_index.json
          git commit -m "Merge main and reconcile Oslo AV place chronology indexes"
          git push origin HEAD:refs/heads/content/oslo-aav-text-v42-20261026
