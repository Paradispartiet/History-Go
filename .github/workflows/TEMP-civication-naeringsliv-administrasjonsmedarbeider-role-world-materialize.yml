name: TEMP Materialize Administrasjonsmedarbeider Role World

on:
  push:
    branches:
      - agent/civication-naeringsliv-administrasjonsmedarbeider-role-world-rollout
    paths:
      - scripts/TEMP_materialize_administrasjonsmedarbeider_role_world.mjs
      - tests/civication-administrasjonsmedarbeider-role-world-rollout.test.js
      - tests/civication-administrasjonsmedarbeider-readiness-prerequisites.test.js
      - reports/CIVICATION_NAERINGSLIV_ADMINISTRASJONSMEDARBEIDER_ROLE_WORLD_ROLLOUT_SOURCE_FIRST.md
      - .github/workflows/TEMP-civication-naeringsliv-administrasjonsmedarbeider-role-world-materialize.yml
  workflow_dispatch:

concurrency:
  group: civication-naeringsliv-administrasjonsmedarbeider-role-world-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-naeringsliv-administrasjonsmedarbeider-role-world-rollout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize Administrasjonsmedarbeider Role World
        run: node scripts/TEMP_materialize_administrasjonsmedarbeider_role_world.mjs
      - name: Verify scene registry remains canonical
        run: node scripts/build-civication-scene-registry.mjs
      - name: Regenerate career gameplay audit
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Regenerate rollout readiness
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify focused Administrasjonsmedarbeider and canonical gates
        run: |
          node tests/civication-administrasjonsmedarbeider-role-world-rollout.test.js
          node tests/civication-administrasjonsmedarbeider-readiness-prerequisites.test.js
          node tests/civication-role-world-contract.test.js
          node tests/civication-role-world-broad-rollout-policy.test.js
          node tests/civication-compiled-scene-registry-parity.test.js
          node tests/civication-cross-role-shared-world.test.js
          node tests/civication-career-gameplay-matrix.test.js
          node tests/civication-role-world-rollout-readiness.test.js
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node --test tests/civication-scenario-people.test.mjs
      - name: Run full Civication suite
        run: |
          set +e
          npm run test:civication > /tmp/civication.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "=== relevant Civication failure output ==="
            grep -E -B 8 -A 24 'AssertionError|ERR_ASSERTION|not ok|FAIL|Error:|error:' /tmp/civication.log | tail -n 120 || tail -n 120 /tmp/civication.log
            exit "$status"
          fi
          echo "Full Civication suite passed."
          tail -n 25 /tmp/civication.log
      - name: Remove temporary materialization surface
        run: rm scripts/TEMP_materialize_administrasjonsmedarbeider_role_world.mjs .github/workflows/TEMP-civication-naeringsliv-administrasjonsmedarbeider-role-world-materialize.yml
      - name: Commit exact verified result
        run: |
          git diff --check
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No permanent changes produced"; exit 1; }
          git commit -m "Complete Administrasjonsmedarbeider Role World rollout"
          git push origin HEAD:agent/civication-naeringsliv-administrasjonsmedarbeider-role-world-rollout
