name: tmp Ullevål Hageby data audit capture
on:
  push:
    branches:
      - work/ulleval-hageby-completion-20260902
permissions:
  contents: write
jobs:
  capture:
    if: github.event.head_commit.message != 'Capture Ullevål Hageby data check failures'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ulleval-hageby-completion-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Capture failing audits
        shell: bash
        run: |
          set +e
          mkdir -p reports/tmp
          : > reports/tmp/ulleval-hageby-data-check.log
          run_check() {
            echo "===== $1 =====" | tee -a reports/tmp/ulleval-hageby-data-check.log
            shift
            "$@" 2>&1 | tee -a reports/tmp/ulleval-hageby-data-check.log
            code=${PIPESTATUS[0]}
            echo "EXIT=$code" | tee -a reports/tmp/ulleval-hageby-data-check.log
            echo | tee -a reports/tmp/ulleval-hageby-data-check.log
          }
          run_check quiz-production-context npm run audit:quiz-production-context
          run_check quiz-progression npm run audit:quiz-progression
          run_check quiz-theory-binding npm run audit:quiz-theory-binding
          run_check civication-history-people npm run civication:history-people:check
          run_check people-shell bash scripts/check-people.sh
          exit 0
      - name: Publish diagnostics
        run: |
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add reports/tmp/ulleval-hageby-data-check.log
          git commit -m "Capture Ullevål Hageby data check failures"
          git push origin HEAD:work/ulleval-hageby-completion-20260902
