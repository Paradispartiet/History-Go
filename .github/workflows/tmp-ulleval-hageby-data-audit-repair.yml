name: tmp Ullevål Hageby data audit repair
on:
  push:
    branches:
      - work/ulleval-hageby-completion-20260902
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'Repair Ullevål Hageby data audit state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ulleval-hageby-completion-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Replay on fresh main
        run: |
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Repair final theory binding
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const quizFile = 'data/quiz/by/ullevål_hageby_sets.json';
          const quiz = JSON.parse(fs.readFileSync(quizFile, 'utf8'));
          const questions = (quiz.sets || []).flatMap((set) => set.questions || []);
          const theoryQuestion = questions.find((question) => question.id === 'ullevål_hageby_quiz_25');
          if (!theoryQuestion) throw new Error('Missing Ullevål Hageby theory question 25');
          if (theoryQuestion.emne_id !== 'em_by_boligstruktur') {
            throw new Error(`Unexpected q25 emne_id: ${theoryQuestion.emne_id}`);
          }
          theoryQuestion.topic_hook_id = 'bolig_boligtyper';
          theoryQuestion.thinker_id = 'david_harvey';
          theoryQuestion.work = 'Rebel Cities';
          theoryQuestion.theory_ref = {
            topic_hook_id: 'bolig_boligtyper',
            thinker_id: 'david_harvey',
            work: 'Rebel Cities',
            why_it_helps: 'Boligtypeperspektivet kobler hagebyens planlagte boligform til hvordan boligstruktur organiserer tilgang, hverdagsrom og byutvikling.'
          };
          const context = quiz.production_context || (quiz.production_context = {});
          const addUnique = (values, value) => [...new Set([...(Array.isArray(values) ? values : []), value])];
          context.topic_hook_ids = addUnique(context.topic_hook_ids, 'bolig_boligtyper');
          context.thinker_ids = addUnique(context.thinker_ids, 'david_harvey');
          context.works = addUnique(context.works, 'Rebel Cities');
          fs.writeFileSync(quizFile, `${JSON.stringify(quiz, null, 2)}\n`);
          NODE
      - name: Repair quiz source brief
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const quizFile = 'data/quiz/by/ullevål_hageby_sets.json';
          const briefFile = 'data/quiz/production_briefs/by/ullevål_hageby.json';
          const quiz = JSON.parse(fs.readFileSync(quizFile, 'utf8'));
          const brief = JSON.parse(fs.readFileSync(briefFile, 'utf8'));
          const pc = quiz.production_context;
          for (const field of ['existing_quiz_audit', 'profile_decision', 'held_back_candidates']) {
            if (pc[field] === undefined) throw new Error(`Quiz production_context.${field} missing`);
            brief[field] = pc[field];
          }
          const curriculumPairs = {
            module_ids: 'pensum_module_ids',
            emne_ids: 'emne_ids',
            topic_hook_ids: 'topic_hook_ids',
            method_ids: 'method_ids',
            thinker_ids: 'thinker_ids',
            works: 'works'
          };
          brief.selected_curriculum = {};
          for (const [briefField, contextField] of Object.entries(curriculumPairs)) {
            if (!Array.isArray(pc[contextField])) throw new Error(`Quiz production_context.${contextField} missing`);
            brief.selected_curriculum[briefField] = pc[contextField];
          }
          fs.writeFileSync(briefFile, `${JSON.stringify(brief, null, 2)}\n`);
          NODE
      - name: Regenerate affected artifacts
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-quiz-production-context.mjs --category by --target ullevål_hageby --output data/quiz/production_context/by/ullevål_hageby.json
          npm run civication:history-people:build
      - name: Normalize generated quiz context whitespace
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'data/quiz/production_context/by/ullevål_hageby.json';
          const text = fs.readFileSync(file, 'utf8');
          const normalized = text.split(/\r?\n/).map((line) => line.replace(/[ \t]+$/u, '')).join('\n');
          fs.writeFileSync(file, `${normalized.replace(/\n*$/u, '')}\n`);
          NODE
      - name: Verify quiz production context
        run: npm run audit:quiz-production-context
      - name: Verify quiz progression
        run: npm run audit:quiz-progression
      - name: Verify quiz theory binding
        run: npm run audit:quiz-theory-binding
      - name: Verify Civication history people
        run: npm run civication:history-people:check
      - name: Verify people shell
        run: bash scripts/check-people.sh
      - name: Verify whitespace
        run: git diff --check
      - name: Publish repaired candidate
        run: |
          git add -A
          git commit -m "Repair Ullevål Hageby data audit state"
          git push origin HEAD:work/ulleval-hageby-completion-20260902
# retrigger current data repair — pass 4
