name: One-time deduplicate place popup facts

on:
  push:
    branches:
      - agent/stensparken-place-popup-system
    paths:
      - .github/workflows/one-time-deduplicate-place-popup-facts.yml

permissions:
  contents: write

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out popup branch
        uses: actions/checkout@v4
        with:
          ref: agent/stensparken-place-popup-system
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deduplication patch
        run: python scripts/one-time-deduplicate-place-popup-facts.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate popup and documentation
        run: |
          node --check js/ui/place-popup-v2.js
          node --test tests/place-popup-v2.test.js tests/place-popup-type-sections.test.js
          npm run build:scripts
          node dist/scripts/check-documentation-governance.mjs
          npm run build:web:check

      - name: Commit cleanup and remove runner
        run: |
          git restore --staged --worktree reports 2>/dev/null || true
          git clean -fd reports/documentation-governance 2>/dev/null || true
          git rm \
            .github/workflows/one-time-deduplicate-place-popup-facts.yml \
            scripts/one-time-deduplicate-place-popup-facts.py
          git add \
            js/ui/place-popup-v2.js \
            css/place-popup-v2.css \
            tests/place-popup-type-sections.test.js \
            docs/PLACE_POPUP_SYSTEM.md \
            docs/PLACE_STANDARD.md
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Give each place fact one visual owner"
          git push origin HEAD:agent/stensparken-place-popup-system
