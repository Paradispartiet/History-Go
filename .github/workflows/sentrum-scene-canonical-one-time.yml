name: Sentrum Scene one-time generated data sync
on:
  push:
    branches: [content/sentrum-scene-v1-20261102]
    paths:
      - .github/workflows/sentrum-scene-canonical-one-time.yml
permissions:
  contents: write
concurrency:
  group: sentrum-scene-canonical-one-time
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build real runtime, Fagverk release and Knowledge
        run: |
          npm run place-open:build
          node scripts/build-fagverk-release-manifest.mjs
          npm run knowledge:canonical:write
      - name: Commit only canonical products
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/place-open/sentrum_scene.json data/runtime/people-all data/runtime/people-all.json data/fagverk/fagverk_release.json data/quiz/musikk/sentrum_scene_sets_merged.json data/knowledge/knowledge_units.generated.json reports/knowledge-id-backfill.json
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Sentrum Scene: synchronize People Place-open Knowledge and release digest"
            git restore .
            for attempt in 1 2 3; do
              git fetch origin content/sentrum-scene-v1-20261102
              git rebase origin/content/sentrum-scene-v1-20261102
              if git push origin HEAD:content/sentrum-scene-v1-20261102; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
