name: TEMP Civication pilot wave closure materialize

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/civication-pilot-wave-closure-materialize.yml'
      - 'data/Civication/careerGameplayPolicy.json'
      - 'tests/civication-pilot-wave-closure.test.js'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-pilot-wave-closure
          fetch-depth: 0
      - name: Regenerate Career Gameplay Matrix
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Verify closure contract
        run: node tests/civication-pilot-wave-closure.test.js
      - name: Verify matrix audit
        run: node scripts/audit-civication-career-gameplay.mjs --check
      - name: Commit generated matrix artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Regenerate Career Gameplay Matrix for pilot closure'
          git push origin HEAD:agent/civication-pilot-wave-closure
