name: Temporary Gamlebyen kirke production

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  produce:
    if: github.head_ref == 'agent/oslo-coordinate-gamlebyen-kirke-production'
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-gamlebyen-kirke-production
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize Gamlebyen kirke
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const placeId='gamlebyen_kirke';
          const placeRel='places/historie/oslo/places_historie/gamlebyen_kirke.json';
          const evidenceRel='oslo/historie/gamlebyen_kirke.json';
          const lat=59.9031277;
          const lon=10.7685824;
          const sourceObjectId='osm-way:557799193';
          const sourceUrl='https://www.openstreetmap.org/way/557799193';
          const coordNote='Geometrisk representasjonspunkt for det navngitte OpenStreetMap-way 557799193, «Gamlebyen kirke». Objektet representerer selve Gamlebyen kirke / Oslo Hospitals kirke innenfor det bredere Oslo Hospital-komplekset, ikke hospitalanlegget som helhet.';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>{fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');};
          const hav=(aLat,aLon,bLat,bLon)=>{const R=6371000,dLat=(bLat-aLat)*Math.PI/180,dLon=(bLon-aLon)*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(aLat*Math.PI/180)*Math.cos(bLat*Math.PI/180)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x));};

          const index=read('data/places/places_index.json');
          if(index.some(p=>p.id===placeId)) throw new Error(`${placeId} already exists in runtime index`);
          const nearby=index.filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon)).map(p=>({id:p.id,name:p.name,category:p.category,distanceMeters:Math.round(hav(lat,lon,p.lat,p.lon)*10)/10})).filter(p=>p.distanceMeters<=350).sort((a,b)=>a.distanceMeters-b.distanceMeters);
          const hospital=nearby.find(p=>p.id==='oslo_hospital');
          if(!hospital) throw new Error('Expected nearby oslo_hospital complex anchor');

          const place={
            id:placeId,
            name:'Gamlebyen kirke',
            lat,lon,r:60,
            category:'historie',
            year:1796,
            period:'Nåværende kirke innviet i mai 1796',
            emne_ids:[
              'em_his_historiske_lag_i_byrom',
              'em_his_spor_materialitet',
              'em_his_sosialhistorie_hverdagsliv'
            ],
            desc:'Aktiv kirke i Ekebergveien 1, også kjent som Oslo Hospitals kirke. Den nåværende kirken ble innviet i 1796 og står som en egen fysisk kirke inne i det langt eldre Oslo Hospital-komplekset.',
            popupDesc:'Gamlebyen kirke, også kjent som Oslo Hospitals kirke, er den aktive kirken inne i det historiske Oslo Hospital-komplekset. Den nåværende kirkebygningen ble innviet i mai 1796. Stedet bærer samtidig langt eldre religiøse og institusjonelle lag gjennom nærheten til middelalderens kloster- og kirkemiljø og den senere hospitalhistorien.\n\nHistory Go skiller derfor tydelig mellom to canonical steder: `oslo_hospital` representerer det bredere historiske hospital- og omsorgskomplekset, mens `gamlebyen_kirke` representerer selve den aktive kirkebygningen og dens gudstjeneste- og kulturbruk. De ligger bare rundt femti meter fra hverandre, men har ulik fysisk identitet og primærfunksjon.\n\nÅret 1796 skal knyttes til den nåværende kirkebygningen og innvielsen, ikke til hele områdets eldre kirke-, kloster- eller hospitalhistorie. Quiz og formidling skal bruke denne lagdelingen aktivt uten å slå de to stedene sammen.',
            quiz_profile:{
              place_type:'religiost_institusjonsbygg',
              subtype:'aktiv_hospitalskirke_i_historisk_kompleks',
              signature_features:[
                'nåværende kirke innviet i mai 1796',
                'også kjent som Oslo Hospitals kirke',
                'aktiv kirke med gudstjeneste- og kulturbruk',
                'egen kirkebygning inne i Oslo Hospital-komplekset',
                'fysisk og funksjonelt skilt fra canonical oslo_hospital'
              ],
              primary_angles:[
                'religionshistorie',
                'kirke_og_omsorgsinstitusjon',
                'historiske_lag',
                'arkitektur_og_materialitet',
                'aktivt_trossted_i_historisk_anlegg'
              ],
              question_families:[
                'institusjonshistorie',
                'historisk_endring',
                'religionshistorie',
                'sted_og_funksjon',
                'kontrast'
              ],
              avoid_angles:[
                'forveksle_kirken_med_hele_oslo_hospital',
                'presentere_1796_som_starten_pa_hele_stedets_historie',
                'generisk_kirkequiz_uten_hospitalforankring',
                'gjore_eldre_klosterhistorie_til_dokumentert_byggehistorie_for_1796_kirken'
              ],
              must_include:[
                '1796 som innvielsesår for den nåværende kirken',
                'navnet Oslo Hospitals kirke',
                'dagens aktive kirkelige funksjon',
                'skillet fra Oslo Hospital som bredere institusjonssted'
              ],
              contrast_targets:['oslo_hospital','gamlebyen_gravlund','st_hallvard_kirke_kloster'],
              notes:'Spør stedet som konkret aktiv kirke i et eldre institusjonslandskap. Eksterne kirke-, lokalhistorie- og institusjonskilder skal dominere synlig quizinnhold.'
            },
            locatorType:'building',
            sourceProvider:'osm',
            sourceObjectId,
            address:{street:'Ekebergveien',number:'1',postcode:'0192',city:'Oslo',country:'NO'},
            geocodeAccuracy:'geometric_center',
            coordRole:'display_marker',
            coordType:'building_center',
            coordStatus:'verified_geometry',
            coordSource:'OpenStreetMap way 557799193 – Gamlebyen kirke',
            coordSourceId:sourceObjectId,
            coordSourceUrl:sourceUrl,
            coordVerifiedAt:'2026-07-20',
            coordNote
          };
          write(path.join('data',placeRel),place);

          const evidence={
            schemaVersion:'1.0',placeId,placeFile:`data/${placeRel}`,evidenceStatus:'applied_to_place',coordinateDecision:'do_not_change_coordinates_yet',
            currentCoordinate:{lat,lon,r:60,coordStatus:'verified_geometry',coordSource:'OpenStreetMap way 557799193 – Gamlebyen kirke',coordType:'building_center',coordNote},
            identity:{currentName:'Gamlebyen kirke',resolvedIdentity:'Gamlebyen kirke / Oslo Hospitals kirke represented by OSM way 557799193 inside the broader Oslo Hospital complex',identityStatus:'resolved',identityProblem:'',locatorTypeCandidate:'building',requiresSplit:false,splitReason:''},
            requiredEvidence:[
              'completed but non-applicable address-first audit for Ekebergveien 1',
              'separate named church building object',
              'explicit scope distinction from oslo_hospital complex anchor',
              'current active church identity'
            ],
            evidence:[{
              sourceProvider:'osm',sourceName:'OpenStreetMap named church building geometry',sourceUrl,sourceObjectId,sourceQuality:'named_building_geometry_cross_checked_with_current_church_identity',
              finding:'OSM way 557799193 is explicitly named Gamlebyen kirke and resolves the church building separately from the nearby Oslo Hospital complex anchor.',canVerifyCoordinate:true,reason:coordNote
            }],
            addressCandidates:[{address:'Ekebergveien 1 Oslo',sourceProvider:'official_address',sourceObjectId:null,canApplyToPlace:false}],
            sourceObjectCandidates:[{sourceProvider:'osm',sourceObjectId,canApplyToPlace:true}],
            geometryCandidates:[{sourceProvider:'osm',sourceObjectId,geometryType:'Polygon',canApplyToPlace:true}],
            coordinateCandidates:[{lat,lon,coordRole:'display_marker',canApplyToPlace:true}],
            decision:{canBecomeVerified:true,blockedReason:'',nextAction:'Applied the geometric center of the separate named church building after the shared address proved non-specific.'},
            notes:[coordNote]
          };
          write(path.join('data/coordinate-evidence',evidenceRel),evidence);

          const manifest=read('data/places/manifest.json');
          if(!manifest.files.includes(placeRel)) manifest.files.push(placeRel);
          write('data/places/manifest.json',manifest);
          const evManifest=read('data/coordinate-evidence/manifest.json');
          if(!evManifest.files.includes(evidenceRel)) evManifest.files.push(evidenceRel);
          write('data/coordinate-evidence/manifest.json',evManifest);

          const overridesPath='data/places/category_overrides.json';
          const overrides=read(overridesPath);
          if(!overrides.some(x=>x.id===placeId)) overrides.push({id:placeId,category:'religion',note:'Aktiv kirke i Gamlebyen og primært trossted. Oslo Hospital beholdes som separat historisk institusjonssted.'});
          write(overridesPath,overrides);

          const protocolPath='docs/coordinates/coordinate-control-protocol.md';
          let protocol=fs.readFileSync(protocolPath,'utf8');
          const osloStart=protocol.indexOf('## Oslo'), noCoordStart=protocol.indexOf('### Dokumenterte Oslo-kontroller uten godkjent koordinat');
          if(osloStart<0||noCoordStart<0) throw new Error('Could not locate bounded Oslo protocol section');
          const section=protocol.slice(osloStart,noCoordStart);
          const rows=[...section.matchAll(/^\| (\d+) \| `([^`]+)` \|.*$/gm)];
          if(!rows.length) throw new Error('No Oslo protocol rows found');
          const last=rows[rows.length-1], nextBatch=Math.max(...rows.map(m=>Number(m[1])))+1;
          const newRow=`| ${nextBatch} | \`${placeId}\` | Gamlebyen kirke | verified_geometry | \`${sourceObjectId}\` |`;
          const insertAt=osloStart+last.index+last[0].length;
          protocol=protocol.slice(0,insertAt)+'\n'+newRow+protocol.slice(insertAt);
          const summaryRe=/Oslo-tabellen inneholder nå (\d+) verifiserte eller kildekontrollerte canonical steder\. Batch \d+ legger til .*? Antallet fullførte kontroller uten godkjent Oslo-koordinat er (\d+)\./;
          const m=protocol.match(summaryRe); if(!m) throw new Error('Could not locate Oslo protocol summary');
          protocol=protocol.replace(summaryRe,`Oslo-tabellen inneholder nå ${Number(m[1])+1} verifiserte eller kildekontrollerte canonical steder. Batch ${nextBatch} legger til Gamlebyen kirke med eget navngitt OSM-bygningsanker, eksplisitt skilt fra Oslo Hospital-kompleksets separate historiske områdeanker. Antallet fullførte kontroller uten godkjent Oslo-koordinat er ${Number(m[2])}.`);
          fs.writeFileSync(protocolPath,protocol);

          write('reports/visitoslo-oslo-east-audit-20260720/gamlebyen-kirke/production-decision.json',{placeId,decision:'produce_distinct_active_church_with_religion_override',storageCategory:'historie',runtimeCategory:'religion',coordinate:{lat,lon,sourceObjectId},nearbyWithin350m:nearby,osloHospitalDistanceMeters:hospital.distanceMeters,identityDecision:'Gamlebyen kirke is the distinct active church building; oslo_hospital remains the broader historic hospital and care institution.',protocolBatch:nextBatch});
          console.log(JSON.stringify({placeId,nextBatch,nearby},null,2));
          NODE

      - name: Run and persist validation gates
        shell: bash
        run: |
          set -u
          LOGDIR="reports/coordinate-branch-runner/agent_oslo-coordinate-gamlebyen-kirke-production"
          mkdir -p "$LOGDIR"
          : > "$LOGDIR/gate-status.txt"
          BLOCKING_FAIL=0
          run_gate(){ name="$1"; shift; set +e; "$@" > >(tee "$LOGDIR/$name.log") 2>&1; code=$?; set -e; printf '%s\n' "$code" > "$LOGDIR/$name.exit-code.txt"; echo "$name=$code" >> "$LOGDIR/gate-status.txt"; if [ "$code" -ne 0 ]; then BLOCKING_FAIL=1; fi; return 0; }
          set -e
          run_gate places-index-build npm run places:index:build
          run_gate split-manifest-sync npm run audit:places-split-manifest-sync
          run_gate places-index-check npm run places:index:check
          run_gate coordinate-source-contract npm run test:coordinate-source-contract
          run_gate coordinate-quality npm run places:coords:quality
          run_gate coordinate-intake npm run places:coords:intake -- --strict-new
          run_gate coordinate-evidence npm run places:coords:evidence:audit
          run_gate git-diff-check git diff --check
          set +e
          npm run health:places 2>&1 | tee "$LOGDIR/health-places.log"
          HEALTH_CODE=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$HEALTH_CODE" > "$LOGDIR/health-places.exit-code.txt"
          echo "health-places=$HEALTH_CODE" >> "$LOGDIR/gate-status.txt"
          printf '%s\n' "$BLOCKING_FAIL" > "$LOGDIR/blocking-fail.txt"

      - name: Commit production result
        shell: bash
        run: |
          set -euo pipefail
          LOGDIR="reports/coordinate-branch-runner/agent_oslo-coordinate-gamlebyen-kirke-production"
          BLOCKING_FAIL=$(cat "$LOGDIR/blocking-fail.txt")
          rm -f .github/workflows/temp-gamlebyen-kirke-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Gamlebyen kirke as canonical Oslo religion place"
          git push origin HEAD:agent/oslo-coordinate-gamlebyen-kirke-production
          if [ "$BLOCKING_FAIL" -ne 0 ]; then exit 1; fi
