name: One-time diagnose professional depth

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/one-time-diagnose-prof-depth.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/okonomi-naeringsliv-profesjonsfordypning
          fetch-depth: 0

      - name: Materialize and run validators separately
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p .tmp/prof-depth/logs
          cat .tmp/prof-depth/pkg-* | base64 --decode > /tmp/prof-depth.tar.gz
          decode_status=$?
          if [ "$decode_status" -eq 0 ]; then
            tar -xzf /tmp/prof-depth.tar.gz -C . > .tmp/prof-depth/logs/extract.log 2>&1
            extract_status=$?
          else
            extract_status=99
          fi

          run_check() {
            name="$1"; shift
            if [ "$extract_status" -eq 0 ]; then
              "$@" > ".tmp/prof-depth/logs/${name}.log" 2>&1
              eval "${name}_status=$?"
            else
              echo 'Not run because archive extraction failed.' > ".tmp/prof-depth/logs/${name}.log"
              eval "${name}_status=99"
            fi
          }

          run_check framework node tools/validate-okonomi-naeringsliv-universitetsramme.mjs
          run_check quality node tools/validate-okonomi-naeringsliv-universitetskvalitet.mjs
          run_check individual node tools/validate-okonomi-naeringsliv-emnerevisjon.mjs
          run_check business_school node tools/validate-okonomi-naeringsliv-handelshogskole.mjs
          run_check depth node tools/validate-okonomi-naeringsliv-profesjonsfordypning.mjs
          run_check governance node scripts/audit-category-governance.mjs

          {
            echo "decode_status=$decode_status"
            echo "extract_status=$extract_status"
            echo "framework_status=$framework_status"
            echo "quality_status=$quality_status"
            echo "individual_status=$individual_status"
            echo "business_school_status=$business_school_status"
            echo "depth_status=$depth_status"
            echo "governance_status=$governance_status"
          } > .tmp/prof-depth/logs/status.txt

          cat .tmp/prof-depth/logs/status.txt
          for file in .tmp/prof-depth/logs/*.log; do echo "===== $file ====="; cat "$file"; done
          exit 0

      - name: Commit diagnostic logs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp/prof-depth/logs
          git diff --cached --quiet && exit 0
          git commit -m 'TEMP: diagnose profesjonsfordypning'
          git push origin HEAD:agent/okonomi-naeringsliv-profesjonsfordypning
