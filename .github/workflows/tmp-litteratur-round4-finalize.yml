name: TEMP Litteratur round4 finalize

on:
  push:
    branches:
      - agent/litteratur-maintenance-source-refresh-round4-20260905
    paths:
      - '.github/workflows/tmp-litteratur-round4-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.ref == 'refs/heads/agent/litteratur-maintenance-source-refresh-round4-20260905'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/litteratur-maintenance-source-refresh-round4-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Re-run verified materialization without self-deleting workflow
        shell: bash
        run: |
          set -euo pipefail
          src=.github/workflows/tmp-litteratur-round4-materialize.yml
          awk 'found { sub(/^          /, ""); print } /^        run: \|$/ { found=1 }' "$src" \
            | grep -v '^git rm \.github/workflows/tmp-litteratur-round4-materialize\.yml$' \
            > /tmp/round4-materialize.sh
          test -s /tmp/round4-materialize.sh
          grep -q '^git commit -m "Refresh Litteratur narratology sources round 4"$' /tmp/round4-materialize.sh
          grep -q '^git push origin HEAD:agent/litteratur-maintenance-source-refresh-round4-20260905$' /tmp/round4-materialize.sh
          bash /tmp/round4-materialize.sh