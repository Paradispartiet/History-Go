name: Politikk wave 9 canonical sync

on:
  push:
    branches:
      - 'feature/politikk-hungary-comparison-wave9-ready-20261021'
    paths:
      - '.github/workflows/politikk-wave9-canonical-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/politikk-hungary-comparison-wave9-ready-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate Knowledge and Fagverk release
        run: |
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --write
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --check
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/politikk-advanced-political-science-subject-pathway-v6.test.mjs tests/politikk-advanced-political-science-wave8-comparison.test.mjs tests/politikk-advanced-political-science-wave9-pathway-ready.test.mjs
      - name: Reject any unrelated generated file changes
        run: |
          git diff --name-only | while IFS= read -r file; do
            case "$file" in
              data/knowledge/*.generated.json|data/knowledge/subjects/*.generated.json|data/knowledge/subjects/*/*.generated.json|data/quiz/politikk/politikk_subject_pathways_v1.json|data/fagverk/fagverk_release.json|reports/knowledge-id-backfill.json) ;;
              *) echo "Unexpected canonical generation change: $file"; exit 1 ;;
            esac
          done
          git diff --check
      - name: Save generated files on review branch
        run: |
          if git diff --quiet; then echo "Already canonical"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/knowledge data/fagverk/fagverk_release.json reports/knowledge-id-backfill.json data/quiz/politikk/politikk_subject_pathways_v1.json
          git diff --cached --check
          git commit -m "build(politikk): sync one-to-one Knowledge and Fagverk release"
          git push origin HEAD:feature/politikk-hungary-comparison-wave9-ready-20261021
