name: Finalize Tullin checkpoint v10

on:
  push:
    branches:
      - work/tullin-completion-20260830
    paths:
      - '.github/workflows/tullin-finalize-checkpoint.yml'

permissions:
  contents: write

concurrency:
  group: tullin-finalize-checkpoint
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tullin-completion-20260830
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Merge current main and discard only rebuildable conflict snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          MERGE_STATUS=$?
          set -e
          if [ "$MERGE_STATUS" -ne 0 ]; then
            mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U)
            printf 'Merge conflicts:\n%s\n' "${CONFLICTS[*]}"
            if [ "${#CONFLICTS[@]}" -eq 0 ]; then
              echo "Merge failed without resolvable file conflicts"
              exit 1
            fi
            for file in "${CONFLICTS[@]}"; do
              case "$file" in
                data/brands/brands_by_place.json|data/epoker/epoke-place-index.json|data/fagverk/fagverk_release.json|data/leksikon/manifest.json|data/leksikon/sprak/manifest.json|data/relations.json|data/runtime/leksikon-all/part-007.json|data/runtime/lesespor-all.json|data/runtime/people-all/part-006.json|data/runtime/stories-all/part-004.json|data/runtime/stories-all/part-005.json|data/stories/stories_episode_v1_manifest.json|data/stories/stories_manifest.json)
                  ;;
                *)
                  echo "Unexpected merge conflict: $file"
                  exit 1
                  ;;
              esac
            done
            git checkout --theirs -- "${CONFLICTS[@]}"
            git add "${CONFLICTS[@]}"
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "Unresolved conflicts remain"
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit --no-edit
          fi

      - name: Reapply canonical Tullin merge deltas
        run: node tools/tullin-merge-deltas.mjs

      - name: Repair canonical Tullin source contracts
        run: node tools/tullin-finalize-repair.mjs pre

      - name: Preserve shared Statsbygg context across both places
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'data/brands/brands_master.json';
          const brands = JSON.parse(fs.readFileSync(path, 'utf8'));
          const brand = brands.find((candidate) => candidate.id === 'statsbygg');
          if (!brand) throw new Error('Missing canonical Statsbygg brand');
          for (const id of ['regjeringskvartalet', 'tullin']) {
            if (!brand.place_ids?.includes(id)) throw new Error(`Statsbygg missing place binding: ${id}`);
          }
          if (!brand.source_urls?.some((url) => /nytt-regjeringskvartal/i.test(url))) {
            throw new Error('Statsbygg Regjeringskvartalet source is missing');
          }
          if (!brand.source_urls?.some((url) => /stedsanalyseNationaltheatret\.pdf/i.test(url))) {
            throw new Error('Statsbygg Tullin source is missing');
          }
          brand.popupdesc = 'Statsbygg er statens byggherre og eiendomsaktør. Ved Regjeringskvartalet er virksomheten byggherre og prosjektorganisasjon for det nye Regjeringskvartalet. Ved Tullin er koblingen dokumentert gjennom at Statsbygg anla parken over Tullinløkka i 2011 etter at det nye Nasjonalmuseet ble lagt til Vestbanen.';
          fs.writeFileSync(path, `${JSON.stringify(brands, null, 2)}\n`);
          console.log('Statsbygg popup preserves Regjeringskvartalet and Tullin context');
          NODE

      - name: Repair velociped Story score after source enrichment
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'data/stories/stories_tullin.json';
          const stories = JSON.parse(fs.readFileSync(path, 'utf8'));
          const story = stories.find((candidate) => candidate.id === 'st_tullin_velociped_1885');
          if (!story) throw new Error('Missing st_tullin_velociped_1885');
          if (!Array.isArray(story.sources) || story.sources.length < 2) {
            throw new Error('Velociped Story source enrichment is missing');
          }
          story.score = {
            narrative: 3,
            historical: 2,
            source: 4,
            play_value: 3,
            originality: 3,
            total: 15
          };
          fs.writeFileSync(path, `${JSON.stringify(stories, null, 2)}\n`);
          console.log('Tullin velociped Story score repaired to source=4 total=15');
          NODE

      - name: Repair source-grounded theory bindings
        run: node tools/tullin-theory-binding-fix.mjs

      - name: Rebuild place and epoch projections
        run: |
          npm run places:index:build
          npm run place-open:build
          npm run epoker:places:build

      - name: Refresh exact epoch and round snapshots
        run: node tools/tullin-finalize-repair.mjs snapshots

      - name: Rebuild People projections
        run: |
          npm run civication:history-people:build
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts

      - name: Rebuild canonical Knowledge
        run: npm run knowledge:canonical:write

      - name: Rebuild Fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs

      - name: Rebuild Tullin quiz context
        run: node tools/tullin-finalize-repair.mjs quiz-context

      - name: Refresh place image backlog summary
        run: |
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/tullin-place-image-audit.json
          node tools/tullin-finalize-repair.mjs image-summary

      - name: Validate Tullin target
        run: node --test tests/tullin-completion.test.mjs

      - name: Validate Stories
        run: npm run check:stories

      - name: Validate v4.2 description production
        run: node scripts/validate-place-description-production-v4_2_policy.mjs --all --report /tmp/place-description-validation-v4_2.json

      - name: Validate place and epoch projections
        run: |
          npm run places:index:check
          npm run place-open:check
          npm run epoker:places:check
          node --test tests/epoke-place-index.test.mjs

      - name: Validate Statsbygg round contract
        run: node --test tests/regjeringskvartalet-brands-phase.test.mjs

      - name: Validate image backlog materialization
        run: node scripts/audit-place-images.mjs --mode=all --report=/tmp/place-image-audit-verify.json --verify-summary=data/places/place_image_backlog_summary.json

      - name: Validate quiz and Knowledge contracts
        run: |
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run knowledge:canonical:check
          node scripts/build-fagverk-release-manifest.mjs --check

      - name: Validate content integration
        run: |
          npm run leksikon:ids:check
          npm run audit:people-of-places
          npm run civication:history-people:check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check

      - name: Validate Tullin runtime projections
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const readText = file => fs.readFileSync(file, 'utf8');
          const scanDir = dir => fs.readdirSync(dir)
            .filter(name => name.endsWith('.json'))
            .map(name => readText(path.join(dir, name)))
            .join('\n');
          const checks = [
            ['leksikon runtime', scanDir('data/runtime/leksikon-all'), /tullin/i],
            ['lesespor runtime', readText('data/runtime/lesespor-all.json'), /lesespor_tullin_/i],
            ['people runtime', scanDir('data/runtime/people-all'), /claus_tullin/i],
            ['stories runtime', scanDir('data/runtime/stories-all'), /st_tullin_/i]
          ];
          for (const [label, text, pattern] of checks) {
            if (!pattern.test(text)) throw new Error(`${label} mangler Tullin-materialisering`);
          }
          console.log('Tullin runtime projections present');
          NODE

      - name: Validate READ-FIRST against merged main
        run: |
          BASE=$(git merge-base HEAD origin/main)
          node scripts/place-production-rule-preflight.mjs check --base "$BASE"

      - name: Validate repository diff
        run: git diff --check

      - name: Commit permanent Tullin package and remove temporary helpers
        run: |
          rm -f reports/place-production/tullin-producer-error.log
          rm -f tools/tullin-fetch-retry.mjs
          rm -f tools/tullin-finalize-repair.mjs
          rm -f tools/tullin-merge-deltas.mjs
          rm -f tools/tullin-theory-binding-fix.mjs
          rm -f tools/finalize-tullin-completion.mjs
          rm -f .github/workflows/tullin-place-production.yml
          rm -f .github/workflows/tullin-finalize-checkpoint.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No final Tullin changes were produced"
            exit 1
          fi
          git commit -m "Complete Tullin place production"
          git push origin HEAD:work/tullin-completion-20260830
