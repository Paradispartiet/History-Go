name: Finalize Tullin checkpoint

on:
  push:
    branches:
      - work/tullin-completion-20260830
    paths:
      - '.github/workflows/tullin-finalize-checkpoint.yml'

permissions:
  contents: write

concurrency:
  group: tullin-finalize-checkpoint
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tullin-completion-20260830
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Merge current main without discarding Tullin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Repair Tullin quiz taxonomy
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'data/quiz/by/tullin_sets.json';
          const quiz = JSON.parse(fs.readFileSync(path, 'utf8'));
          const questions = quiz.sets.flatMap((set) => set.questions);
          const byId = new Map(questions.map((question) => [question.id, question]));
          const assignments = {
            fact: [
              'tullin_quiz_16',
              'tullin_quiz_19',
              'tullin_quiz_20',
              'tullin_quiz_22',
              'tullin_quiz_23',
              'tullin_quiz_24',
              'tullin_quiz_26'
            ],
            concept_theory: [
              'tullin_quiz_29',
              'tullin_quiz_31'
            ]
          };
          for (const [type, ids] of Object.entries(assignments)) {
            for (const id of ids) {
              const question = byId.get(id);
              if (!question) throw new Error(`Missing expected Tullin quiz question: ${id}`);
              if (question.question_type !== 'context') {
                throw new Error(`${id} expected context before taxonomy repair, got ${question.question_type}`);
              }
              question.question_type = type;
            }
          }
          const counts = questions.reduce((acc, question) => {
            acc[question.question_type] = (acc[question.question_type] || 0) + 1;
            return acc;
          }, {});
          const expected = { fact: 22, context: 12, concept_theory: 8 };
          for (const [type, count] of Object.entries(expected)) {
            if (counts[type] !== count) {
              throw new Error(`Unexpected ${type} count: ${counts[type]} (expected ${count})`);
            }
          }
          fs.writeFileSync(path, `${JSON.stringify(quiz, null, 2)}\n`);
          console.log(JSON.stringify({ status: 'repaired', counts }, null, 2));
          NODE

      - name: Rebuild place and epoch projections
        run: |
          npm run places:index:build
          npm run place-open:build
          npm run epoker:places:build

      - name: Rebuild People projections
        run: |
          npm run civication:history-people:build
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts

      - name: Rebuild canonical Knowledge
        run: npm run knowledge:canonical:write

      - name: Rebuild Fagverk release after Knowledge
        run: node scripts/build-fagverk-release-manifest.mjs

      - name: Rebuild Tullin quiz context after all upstream projections
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildQuizProductionContext } from './scripts/quiz-production-lib.mjs';
          const context = await buildQuizProductionContext({ root: process.cwd(), categoryId: 'by', targetId: 'tullin' });
          fs.writeFileSync('data/quiz/production_context/by/tullin.json', `${JSON.stringify(context, null, 2)}\n`);
          NODE

      - name: Validate Tullin target
        run: node --test tests/tullin-completion.test.mjs

      - name: Validate place and epoch projections
        run: |
          npm run places:index:check
          npm run place-open:check
          npm run epoker:places:check

      - name: Validate quiz and Knowledge contracts
        run: |
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run knowledge:canonical:check
          node scripts/build-fagverk-release-manifest.mjs --check

      - name: Validate content integration
        run: |
          npm run check:stories
          npm run leksikon:ids:check
          npm run audit:people-of-places
          npm run civication:history-people:check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check

      - name: Validate READ-FIRST against merged main
        run: |
          BASE=$(git merge-base HEAD origin/main)
          node scripts/place-production-rule-preflight.mjs check --base "$BASE"

      - name: Validate repository diff
        run: git diff --check

      - name: Commit permanent Tullin package and remove temporary helpers
        run: |
          rm -f reports/place-production/tullin-producer-error.log
          rm -f tools/tullin-fetch-retry.mjs
          rm -f .github/workflows/tullin-place-production.yml
          rm -f .github/workflows/tullin-finalize-checkpoint.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No final Tullin changes were produced"
            exit 1
          fi
          git commit -m "Complete Tullin place production"
          git push origin HEAD:work/tullin-completion-20260830
