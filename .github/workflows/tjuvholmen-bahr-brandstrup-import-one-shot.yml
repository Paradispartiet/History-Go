name: Tjuvholmen BAHR and Brandstrup authentic logo materialization
on:
  pull_request:
    paths:
      - '.github/workflows/tjuvholmen-bahr-brandstrup-import-one-shot.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tjuvholmen-bahr-brandstrup-import-${{ github.ref }}
  cancel-in-progress: true
jobs:
  materialize-official-logos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/tjuvholmen-bahr-brandstrup-logos-20261112
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests pillow
      - name: Save original logo bytes, make lossless WebP without cropping, and record provenance
        run: |
          python - <<'PY'
          import requests,hashlib,json
          from io import BytesIO
          from PIL import Image,ImageOps
          from pathlib import Path
          from datetime import date
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (compatible; HistoryGoDocumentarySourceAudit/1.0)'})
          sources={
           'bahr':{
             'site':'https://bahr.no/logo',
             'asset':'https://bahr.no/content/uploads/2026/03/bahr_black_transparent.png',
             'creator':'Advokatfirmaet BAHR',
             'credit':'Advokatfirmaet BAHR – official logo page',
             'sourceForm':'original_official_current_black_logo',
             'description':'BAHR law firm wordmark, official black logo'
           },
           'galleri_brandstrup':{
             'site':'https://www.brandstrup.no/gallery1',
             'asset':'https://s3.amazonaws.com/files.collageplatform.com.prod/application/5552233d07a72c407042f524/f14e9abee68a63523e113a6e51c9ef32.png',
             'creator':'Galleri Brandstrup',
             'credit':'Galleri Brandstrup – image inside its official page header marked logo with alt Galleri Brandstrup',
             'sourceForm':'original_official_brandstrup_gallery_header_logo',
             'description':'Galleri Brandstrup official site logo image'
           },
           'galleri_brandstrup_home_alternative':{
             'site':'https://www.brandstrup.no/',
             'asset':'https://s3.amazonaws.com/files.collageplatform.com.prod/application/5552233d07a72c407042f524/2255c99730628b4f81bc79ccf73724bf.png',
             'creator':'Galleri Brandstrup',
             'credit':'Galleri Brandstrup – official home page alternative logo',
             'sourceForm':'original_official_homepage_header_logo',
             'description':'Second official logo used on main landing page'
           }
          }
          source_dir=Path('bilder/kort/brands/source');source_dir.mkdir(parents=True,exist_ok=True)
          output_dir=Path('bilder/kort/brands');output_dir.mkdir(parents=True,exist_ok=True)
          provenance_dir=Path('data/brands')
          manifest={}
          for key,src in sources.items():
           resp=session.get(src['asset'],timeout=35);resp.raise_for_status()
           if len(resp.content)>2_500_000 or not resp.content.startswith(b'\x89PNG\r\n\x1a\n'):
            raise RuntimeError(key+' must be small authentic PNG source')
           src_path=source_dir/(key+'_official_logo.png')
           src_path.write_bytes(resp.content)
           im=Image.open(BytesIO(resp.content)).convert('RGBA')
           if im.width<100 or im.height<20:raise RuntimeError(key+' source unexpected size')
           canvas=Image.new('RGBA',(900,520),(255,255,255,255))
           inner=ImageOps.contain(im,(840,440),method=Image.Resampling.LANCZOS)
           canvas.alpha_composite(inner,((900-inner.width)//2,(520-inner.height)//2))
           output=output_dir/(key+'.webp')
           canvas.convert('RGB').save(output,format='WEBP',lossless=True,method=6)
           dig=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
           manifest[key]={
             **src,'brandId':key if not key.endswith('_home_alternative') else 'galleri_brandstrup',
             'sourceDimensions':[im.width,im.height], 'sourceFormat':'PNG',
             'sourceSha256':dig(src_path),'sourceLocalPath':str(src_path),
             'assetPath':str(output),'assetSha256':dig(output),'outputDimensions':[900,520],
             'alphaAtSource':bool(im.getextrema()[3][0]<255),
             'reviewStatus':'source_verified_visual_review_pending'
           }
           print('OFFICIAL_LOGO',key,json.dumps(manifest[key],ensure_ascii=False))
          # Integrate only the primary two; keep the alternative saved until visual review.
          master_path=Path('data/brands/brands_master.json')
          brands=json.loads(master_path.read_text())
          for key in ('bahr','galleri_brandstrup'):
           x=next((b for b in brands if b.get('id')==key),None)
           if x is None:raise RuntimeError('Missing canonical Brand '+key)
           info=manifest[key];x['logo']=info['assetPath']
           x['source_urls']=list(dict.fromkeys(x.get('source_urls',[])+[info['site']]))
           x['place_ids']=list(dict.fromkeys(x.get('place_ids',[])+['tjuvholmen']))
           x['imageMeta']={
             'sourcePage':info['site'],'sourceAsset':info['asset'],
             'sourceSha256':info['sourceSha256'],'assetSha256':info['assetSha256'],
             'assetKind':'logo','sourceForm':info['sourceForm'],'creator':info['creator'],
             'credit':info['credit'],'license':'Original trademark; not Creative Commons',
             'rightsBasis':'referential_trademark_identification; downloaded from official brand site; no affiliation or endorsement implied',
             'usageContext':'referential_identification','noEndorsement':True,
             'reviewStatus':'source_verified_visual_review_pending',
             'transformation':'Official PNG pixels preserved; aspect-preserving scale and white background padding; no crop or font reconstruction',
             'width':900,'height':520,'reviewedAt':None
           }
           prov={
             'schema':'history_go_brand_asset_attribution_v1',
             'brandId':key,'path':info['assetPath'],'sourcePage':info['site'],'sourceAsset':info['asset'],
             'sourceLocalPath':info['sourceLocalPath'],'sourceSha256':info['sourceSha256'],
             'assetSha256':info['assetSha256'],'sourceDimensions':info['sourceDimensions'],
             'outputDimensions':[900,520],'assetKind':'logo',
             'sourceForm':info['sourceForm'],'creator':info['creator'],'credit':info['credit'],
             'license':'Original trademark; not Creative Commons',
             'rightsBasis':'referential_trademark_identification; official brand site logo; no endorsement implied',
             'usageContext':'referential_identification','noEndorsement':True,
             'transformation':'Preserved actual original artwork and correct aspect, scaled and white-padded without crop or redraw',
             'reviewStatus':'source_verified_visual_review_pending',
             'dateVerified':'2026-11-12'
           }
           (provenance_dir/(key+'_logo_provenance.json')).write_text(json.dumps(prov,ensure_ascii=False,indent=2)+'\n')
          master_path.write_text(json.dumps(brands,ensure_ascii=False,indent=2)+'\n')
          Path('.tmp/tjuvholmen-brand-official-logo-manifest.json').parent.mkdir(exist_ok=True)
          Path('.tmp/tjuvholmen-brand-official-logo-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tjuvholmen-official-bahr-brandstrup-logo-review
          path: |
            bilder/kort/brands/bahr.webp
            bilder/kort/brands/galleri_brandstrup.webp
            bilder/kort/brands/galleri_brandstrup_home_alternative.webp
            .tmp/tjuvholmen-brand-official-logo-manifest.json
          if-no-files-found: ignore
      - name: Commit binary original and source-verified logo candidates
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/kort/brands/source/bahr_official_logo.png bilder/kort/brands/source/galleri_brandstrup_official_logo.png bilder/kort/brands/source/galleri_brandstrup_home_alternative_official_logo.png
          git add bilder/kort/brands/bahr.webp bilder/kort/brands/galleri_brandstrup.webp bilder/kort/brands/galleri_brandstrup_home_alternative.webp
          git add data/brands/bahr_logo_provenance.json data/brands/galleri_brandstrup_logo_provenance.json data/brands/brands_master.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat(tjuvholmen): save authentic BAHR and Galleri Brandstrup logo originals with evidence"
            git reset --hard HEAD
            git clean -fd
            git fetch origin content/tjuvholmen-bahr-brandstrup-logos-20261112
            git rebase origin/content/tjuvholmen-bahr-brandstrup-logos-20261112
            git push origin HEAD:content/tjuvholmen-bahr-brandstrup-logos-20261112
          fi
