name: One-time Nationaltheatret factuality audit batch 1

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/nationaltheatret-factuality-audit-batch-1-trigger.txt

permissions:
  contents: write

jobs:
  audit-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check out and synchronize production branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main agent/nationaltheatret-factuality-audit-people-batch-1
          git checkout -B agent/nationaltheatret-factuality-audit-people-batch-1 origin/agent/nationaltheatret-factuality-audit-people-batch-1
          git merge --no-edit origin/main

      - name: Apply factuality audit corrections
        run: node scripts/apply-nationaltheatret-factuality-audit-batch-1.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build tools and scripts
        run: |
          npm run typecheck:tools
          npm run build:tools
          npm run typecheck:scripts
          npm run build:scripts

      - name: Run factuality and profile regression tests
        run: |
          npm run test:factuality-contract
          node --test \
            tests/person-popup-v2.test.js \
            tests/nationaltheatret-ensemble-leadership-people-v2.test.js \
            tests/nationaltheatret-factuality-audit-people-batch-1.test.js

      - name: Regenerate people-popup readiness reports
        run: |
          npm run audit:people-popup-readiness
          npm run audit:people-popup-readiness:check

      - name: Rebuild Civication people index
        run: |
          npm run civication:history-people:build
          npm run civication:history-people:check

      - name: Validate complete people data
        run: bash scripts/check-people.sh

      - name: Verify browser build remains synchronized
        run: npm run build:web:check

      - name: Remove one-time script and unrelated generated side effects
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-nationaltheatret-factuality-audit-batch-1.mjs
          git checkout origin/main -- js/core/categories.js 2>/dev/null || true
          find reports -mindepth 1 -maxdepth 1 \
            ! -name 'people-popup-readiness.json' \
            ! -name 'people-popup-readiness.md' \
            ! -name 'people-factuality-audit-nationaltheatret-batch-1.md' \
            -exec git restore --staged --worktree -- '{}' + 2>/dev/null || true
          git clean -fd reports 2>/dev/null || true

      - name: Commit clean factuality audit diff
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git status --short
          git commit -m "Source-audit Nationaltheatret people batch 1"
          git push origin HEAD:agent/nationaltheatret-factuality-audit-people-batch-1
