name: Skraperudtjern v1 real browser acceptance
# Permanent acceptance: 21/21 canonical Knowledge links and real mobile/desktop quiz playback
on:
  pull_request:
    paths:
      - 'tests/skraperudtjern-v1-real-browser.mjs'
      - 'data/places/natur/oslo/places_oslo_natur_ljanselva_rute/skraperudtjern.json'
      - 'data/quiz/natur/skraperudtjern_sets.json'
      - 'data/quizcards/natur/topp10_natur_skraperudtjern_20261021.json'
      - 'data/runtime/place-open/skraperudtjern.json'
      - 'bilder/places/skraperudtjern_front_portrait.webp'
      - 'bilder/places/skraperudtjern_landscape.webp'
      - '.github/workflows/skraperudtjern-v1-browser.yml'
  workflow_dispatch:
concurrency:
  group: skraperudtjern-v1-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Check actual app at 390 and 1440 px, including QuizCard after animation
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node tests/skraperudtjern-v1-real-browser.mjs
      - name: Complete all 21 questions on desktop and mobile without a false physical visit
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node scripts/verify-ljanselva-fullquiz-browser.mjs skraperudtjern
      - name: Upload actual app evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skraperudtjern-v1-permanent-browser-evidence
          path: |
            artifacts/skraperudtjern-browser/**
            artifacts/place-quiz/skraperudtjern/**
          if-no-files-found: ignore
          retention-days: 14
