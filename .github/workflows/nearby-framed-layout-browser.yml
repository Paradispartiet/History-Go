name: Nearby framed layout browser audit

on:
  pull_request:
    paths:
      - 'css/layout.css'
      - 'css/theme.css'
      - 'css/miniProfile.css'
      - 'css/footer.css'
      - 'js/core/viewportManager.js'
      - 'tests/mobile-footer-layout.test.mjs'
      - 'tests/mobile-footer-browser.test.mjs'
      - 'css/nearby.css'
      - 'css/people.css'
      - 'css/nature.css'
      - 'index.html'
      - 'tests/nearby-framed-layout-browser.test.mjs'
      - 'tests/header-language-menu-browser.test.mjs'
      - '.github/workflows/nearby-framed-layout-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nearby-frame-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nearby-framed-layout-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify footer geometry contract
        run: node --test tests/mobile-footer-layout.test.mjs
      - name: Audit footer layout on phone and tablet
        run: node tests/mobile-footer-browser.test.mjs
      - name: Audit framed Nearby layout on phone, tablet and desktop
        run: node tests/nearby-framed-layout-browser.test.mjs
      - name: Verify Hurtigmeny language flag on mobile and desktop
        run: node tests/header-language-menu-browser.test.mjs
