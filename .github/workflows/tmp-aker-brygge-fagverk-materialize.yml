name: Temporary Aker Brygge Fagverk materialization

on:
  push:
    branches:
      - work/aker-brygge-fagverk-v2-20260902

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/aker-brygge-fagverk-v2-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Synchronize registry and release manifest
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'data/fagverk/fagverk_registry.json';
          const registry = JSON.parse(fs.readFileSync(path, 'utf8'));
          registry.placeLinks ||= {};
          registry.placeLinks.aker_brygge = {
            sourceFile: 'places/by/oslo/places/aker_brygge.json',
            field: 'fagverk',
            schema: 'history_go_place_fagverk_v2',
            level: 'full',
            status: 'curated'
          };
          fs.writeFileSync(path, `${JSON.stringify(registry, null, 2)}\n`);
          NODE
          node scripts/build-fagverk-release-manifest.mjs
          rm .github/workflows/tmp-aker-brygge-fagverk-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk/fagverk_registry.json data/fagverk/fagverk_release.json .github/workflows/tmp-aker-brygge-fagverk-materialize.yml
          if ! git diff --cached --quiet; then
            git commit -m "Sync Aker Brygge Fagverk registry and release"
            git push origin HEAD:work/aker-brygge-fagverk-v2-20260902
          fi
