name: Complete Oslo coordinate control batch 35

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-35-final-v2
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge latest main before applying coordinates
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Capture Batch 35 source objects
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-35/sources
          mkdir -p "$out"
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path

          out = Path('reports/oslo-coordinate-control-batch-35/sources')
          headers = {'User-Agent': 'History-Go-coordinate-control/1.0 contact=repository-audit'}
          def get_json(url, data=None):
              req = urllib.request.Request(url, data=data, headers=headers)
              with urllib.request.urlopen(req, timeout=90) as r:
                  return json.load(r)

          lookup = 'https://nominatim.openstreetmap.org/lookup?' + urllib.parse.urlencode({
              'osm_ids': 'W381749953,W246047712',
              'format': 'jsonv2',
              'addressdetails': 1,
              'extratags': 1,
              'namedetails': 1,
          })
          rows = get_json(lookup)
          (out / 'osm-lookup.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n')
          found = {(r.get('osm_type'), r.get('osm_id')) for r in rows}
          expected = {('way', 381749953), ('way', 246047712)}
          if found != expected:
              raise SystemExit(f'Unexpected OSM lookup objects: {found}')

          query = '''[out:json][timeout:90];(way(381749953);way(246047712););out tags center geom;'''
          raw = get_json('https://overpass-api.de/api/interpreter', urllib.parse.urlencode({'data': query}).encode())
          (out / 'osm-geometry.json').write_text(json.dumps(raw, ensure_ascii=False, indent=2) + '\n')
          by_id = {e['id']: e for e in raw.get('elements', []) if e.get('type') == 'way'}
          if set(by_id) != {381749953, 246047712}:
              raise SystemExit(f'Unexpected Overpass objects: {set(by_id)}')
          outlet_geom = by_id[246047712].get('geometry') or []
          if not outlet_geom:
              raise SystemExit('Missing outlet geometry')
          endpoint = outlet_geom[-1]
          if abs(endpoint['lat'] - 59.9075303) > 1e-7 or abs(endpoint['lon'] - 10.7554479) > 1e-7:
              raise SystemExit(f'Outlet endpoint changed: {endpoint}')

          bridge = by_id[381749953]
          bounds = bridge.get('bounds') or {}
          if not (bounds.get('minlat', 0) <= 59.9134578 <= bounds.get('maxlat', 0) and bounds.get('minlon', 0) <= 10.7581117 <= bounds.get('maxlon', 0)):
              raise SystemExit('Vaterlands bru anchor is outside source geometry bounds')

          docs = {
              'vaterland_historisk_elvelop': {
                  'historical_source': 'https://oslobyleksikon.no/side/Akerselva',
                  'bridge_context': 'https://oslobyleksikon.no/side/Vaterlands_bru',
                  'geometry_anchor': 'osm-way:381749953',
                  'decision': 'Use exact Vaterlands bru geometry as historical start anchor for the documented lower Akerselva course later placed in tunnel.'
              },
              'akerselva_utlop_bjorvika': {
                  'reference_sources': ['https://oslobyleksikon.no/side/Akerselva', 'https://snl.no/Akerselva'],
                  'geometry': 'osm-way:246047712',
                  'endpoint': {'lat': endpoint['lat'], 'lon': endpoint['lon']},
                  'decision': 'Use the terminal endpoint of the named lower Akerselva geometry as the outlet line anchor.'
              }
          }
          (out / 'source-resolution-summary.json').write_text(json.dumps(docs, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(docs, ensure_ascii=False, indent=2))
          PY
      - name: Apply Batch 35 decisions safely
        run: node scripts/tmp-complete-oslo-coordinate-batch35.mjs
      - name: Build repository tools without npm install
        run: |
          rm -rf dist/tools
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),{stripTypeScriptTypes}=require('node:module');
          const src=path.resolve('tools'),out=path.resolve('dist/tools');
          function walk(d){return fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const f=path.join(d,e.name);return e.isDirectory()?walk(f):(/\.(mts|ts|cts)$/.test(e.name)?[f]:[])});}
          for(const f of walk(src)){const rel=path.relative(src,f),ext=path.extname(rel),oe=ext==='.mts'?'.mjs':ext==='.cts'?'.cjs':'.js',dest=path.join(out,rel.slice(0,-ext.length)+oe),s=fs.readFileSync(f,'utf8'),nl=s.indexOf('\n'),sh=s.startsWith('#!')?s.slice(0,nl+1):'',body=s.startsWith('#!')?s.slice(nl+1):s;fs.mkdirSync(path.dirname(dest),{recursive:true});fs.writeFileSync(dest,sh+stripTypeScriptTypes(body,{mode:'transform'}));}
          NODE
      - name: Rebuild global runtime index
        run: node dist/tools/build_places_index.mjs
      - name: Prove exact aggregate scope against merged main
        run: |
          node <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const file='data/places/natur/oslo/places_oslo_natur_akerselvarute.json';
          const before=JSON.parse(cp.execFileSync('git',['show',`origin/main:${file}`],{encoding:'utf8'}));
          const after=JSON.parse(fs.readFileSync(file,'utf8'));
          const b=new Map(before.map(p=>[p.id,p]));
          const changed=after.filter(p=>JSON.stringify(p)!==JSON.stringify(b.get(p.id))).map(p=>p.id);
          const expected=['vaterland_historisk_elvelop','akerselva_utlop_bjorvika'];
          const bad=changed.filter(id=>!expected.includes(id));
          if(bad.length)throw new Error('Unexpected aggregate changes: '+bad.join(','));
          for(const id of expected)if(!changed.includes(id))throw new Error('Expected aggregate record unchanged: '+id);
          console.log(changed.join('\n'));
          NODE
      - name: Run all hard validation gates
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-35/validation
          mkdir -p "$out"
          node dist/tools/audit-places-split-manifest-sync.mjs | tee "$out/split-manifest-sync.txt"
          node dist/tools/check_no_lng_coordinates.mjs | tee "$out/places-index-check.txt"
          node dist/tools/check_places_index_sync.mjs | tee -a "$out/places-index-check.txt"
          node tests/place-coordinate-index-parity.test.js | tee -a "$out/places-index-check.txt"
          node tests/coordinate-source-contract-anchor-trust.test.mjs | tee "$out/coordinate-source-contract.txt"
          node dist/tools/place-coordinate-quality-gate.mjs | tee "$out/coordinate-quality.txt"
          node dist/tools/place-coordinate-intake-gate.mjs --strict-new | tee "$out/coordinate-intake.txt"
          node dist/tools/audit-coordinate-evidence.mjs | tee "$out/coordinate-evidence-audit.txt"
          git diff --check | tee "$out/git-diff-check.txt"
      - name: Assert Batch 35 result
        run: node scripts/tmp-assert-oslo-coordinate-batch35.mjs
      - name: Render old/new map QA
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-35/visual-qa
          mkdir -p "$out"
          cat > "$out/map.html" <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1600px;height:1000px;font-family:Arial}.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;width:1600px;height:1000px}.p{position:relative}.m{width:800px;height:500px}.l{position:absolute;z-index:9999;top:12px;left:12px;background:#fff;padding:9px 12px;border:3px solid #111;font-size:19px;font-weight:700}.s{display:block;font-size:13px;font-weight:400;margin-top:3px}.mk{width:26px;height:26px;border-radius:50%;background:#fff;border:7px solid #111;box-sizing:border-box}</style><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script></head><body><div class="grid"><div class="p"><div class="l">Vaterland historisk elveløp – gammel<span class="s">59.9158, 10.7332</span></div><div id="a" class="m"></div></div><div class="p"><div class="l">Vaterland historisk elveløp – nytt anker<span class="s">59.9134578, 10.7581117</span></div><div id="b" class="m"></div></div><div class="p"><div class="l">Akerselva utløp – gammel<span class="s">59.9118, 10.7469</span></div><div id="c" class="m"></div></div><div class="p"><div class="l">Akerselva utløp – nytt<span class="s">59.9075303, 10.7554479</span></div><div id="d" class="m"></div></div></div><script>const I=L.divIcon({className:'',html:'<div class="mk"></div>',iconSize:[26,26],iconAnchor:[13,13]});for(const [id,lat,lon]of[['a',59.9158,10.7332],['b',59.9134578,10.7581117],['c',59.9118,10.7469],['d',59.9075303,10.7554479]]){const m=L.map(id,{zoomControl:false,attributionControl:false}).setView([lat,lon],17);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(m);L.marker([lat,lon],{icon:I}).addTo(m);}</script></body></html>
          EOF
          (cd "$out" && python3 -m http.server 8769 >/tmp/b35-http.log 2>&1 & echo $! >/tmp/b35-http.pid)
          sleep 2
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1600,1000 --virtual-time-budget=8000 --screenshot="$PWD/$out/batch35-old-new.png" http://127.0.0.1:8769/map.html
          kill "$(cat /tmp/b35-http.pid)" 2>/dev/null || true
          rm "$out/map.html"
          test -s "$out/batch35-old-new.png"
          printf '# Batch 35 visual map QA\n\nOld/new comparison for the historical Vaterland anchor and the Akerselva outlet in Bjørvika.\n' > "$out/README.md"
      - uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch-35-visual-qa
          path: reports/oslo-coordinate-control-batch-35/visual-qa/batch35-old-new.png
          if-no-files-found: error
      - name: Commit clean completed batch
        run: |
          rm -f .github/workflows/oslo-coordinate-batch-35-final-v2.yml scripts/tmp-complete-oslo-coordinate-batch35.mjs scripts/tmp-assert-oslo-coordinate-batch35.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs reports .github/workflows/oslo-coordinate-batch-35-final-v2.yml scripts/tmp-complete-oslo-coordinate-batch35.mjs scripts/tmp-assert-oslo-coordinate-batch35.mjs
          git commit -m 'Complete Oslo coordinate control batch 35'
          git push origin HEAD:refs/heads/agent/oslo-coordinate-control-batch-35-final-v2
