name: Fagverk Helse registry gate

on:
  pull_request:
    paths:
      - 'data/fag/helse/**'
      - 'data/fag/fag_manifest.json'
      - 'data/fagverk/helse/**'
      - 'data/fagverk/fagverk_registry.json'
      - 'data/fagverk/fagverk_release.json'
      - 'data/fagverk/subject_inventory.json'
      - 'data/fagverk/subject_status.json'
      - 'reports/fagverk/**'
      - 'scripts/*helse*'
      - 'scripts/audit-fagverk-subject-inventory.mjs'
      - 'scripts/audit-fagverk-general-engine.mjs'
      - 'scripts/audit-fagverk-theory-quality.mjs'
      - 'scripts/audit-fagverk-theory-integrity.mjs'
      - 'scripts/build-fagverk-release-manifest.mjs'
      - 'tests/helse-*.test.mjs'
      - 'tests/fagverk-subject-inventory.test.mjs'
      - 'tests/fagverk-general-engine.test.mjs'
      - 'tests/fagverk-release-manifest.test.mjs'
      - '.github/ci/fagverk-helse-domain-registry-v1.json'
      - '.github/workflows/fagverk-helse.yml'
  push:
    branches: [main]
    paths:
      - 'data/fag/helse/**'
      - 'data/fag/fag_manifest.json'
      - 'data/fagverk/helse/**'
      - 'data/fagverk/fagverk_registry.json'
      - 'data/fagverk/fagverk_release.json'
      - 'data/fagverk/subject_inventory.json'
      - 'data/fagverk/subject_status.json'
      - 'reports/fagverk/**'
      - 'scripts/*helse*'
      - 'scripts/audit-fagverk-subject-inventory.mjs'
      - 'scripts/audit-fagverk-general-engine.mjs'
      - 'scripts/audit-fagverk-theory-quality.mjs'
      - 'scripts/audit-fagverk-theory-integrity.mjs'
      - 'scripts/build-fagverk-release-manifest.mjs'
      - 'tests/helse-*.test.mjs'
      - 'tests/fagverk-subject-inventory.test.mjs'
      - 'tests/fagverk-general-engine.test.mjs'
      - 'tests/fagverk-release-manifest.test.mjs'
      - '.github/ci/fagverk-helse-domain-registry-v1.json'
      - '.github/workflows/fagverk-helse.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fagverk-helse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run registry-driven Helse gate
        run: node scripts/run-helse-domain-ci-v1.mjs

  writeback:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/helse-strict-completion-proof-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/helse-strict-completion-proof-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize deterministic Helse outputs
        run: |
          node tools/audit-helse-theory-integrity.mjs --write-report --no-check-report
          node scripts/materialize-helse-strict-completion-v1.mjs
          node scripts/audit-helse-health-services-economics-fulltext-v1.mjs --write
          node scripts/audit-fagverk-theory-quality.mjs --write-report --no-check-report
          node scripts/audit-fagverk-theory-integrity.mjs --write-report --no-check-report
          node scripts/build-fagverk-release-manifest.mjs
      - name: Commit deterministic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fag/helse/helsepensum_canonical_v1.json
          git add data/fagverk/fagverk_registry.json
          git add data/fagverk/subject_status.json
          git add data/fagverk/fagverk_release.json
          git add reports/fagverk
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Materialize Helse strict completion outputs"
          git push origin HEAD:agent/helse-strict-completion-proof-v1
