name: TEMP Litteratur round4 finalize
on:
  push:
    branches: [agent/litteratur-maintenance-source-refresh-round4-20260905]
    paths: ['.github/workflows/tmp-litteratur-round4-diagnose.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/litteratur-maintenance-source-refresh-round4-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Extract and execute verified round 4 artifact block
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/tmp-litteratur-round4-materialize.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(src) if "node --input-type=module <<'NODE'" in l)+1
          end=next(i for i in range(start,len(src)) if src[i].strip()=='NODE')
          out=[line[10:] if line.startswith('          ') else line for line in src[start:end]]
          Path('/tmp/round4-materialize.mjs').write_text('\n'.join(out)+'\n')
          PY
          node --check /tmp/round4-materialize.mjs
          node /tmp/round4-materialize.mjs
          node --check scripts/audit-litteratur-maintenance-source-refresh-round4.mjs
          node --check tests/litteratur-maintenance-source-refresh-round4.test.mjs
          grep -q 'Audit Litteratur source refresh round 4' .github/workflows/litteratur-maintenance-integrity.yml
      - name: Generate canonical reports
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-fagverk-litteratur-legacy-theory.mjs --write-report
      - name: Verify round 1 through 4 and theory gates
        run: |
          node scripts/audit-litteratur-maintenance-source-refresh-round1.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round2.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round3.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round4.mjs
          node --test tests/litteratur-maintenance-source-refresh-round1.test.mjs tests/litteratur-maintenance-source-refresh-round2.test.mjs tests/litteratur-maintenance-source-refresh-round3.test.mjs tests/litteratur-maintenance-source-refresh-round4.test.mjs
          node scripts/audit-litteratur-assessment-v1.mjs
          node tools/audit-litteratur-theory-integrity.mjs
          node --test tests/litteratur-assessment-v1.test.mjs tests/litteratur-theory-integrity.test.mjs tests/fagverk-litteratur-legacy-theory-audit.test.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Verify permanent diff allowlist
        shell: bash
        run: |
          set -euo pipefail
          allowed='^.github/workflows/litteratur-maintenance-integrity.yml$|^data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/narratologi_prosa/claims.json$|^data/fagverk/fagverk_release.json$|^data/fagverk/litteratur/maintenance/source-refresh-round4-2026-09-05.json$|^data/knowledge/subjects/litteratur/knowledge_units.generated.json$|^data/quiz/litteratur/litteratur_subject_pathways_v1.json$|^reports/fagverk/litteratur-legacy-theory-audit.json$|^scripts/audit-litteratur-maintenance-source-refresh-round4.mjs$|^scripts/materialize-litteratur-narrative-poetry-v1.mjs$|^tests/litteratur-maintenance-source-refresh-round4.test.mjs$|^.github/workflows/tmp-litteratur-round4-materialize.yml$|^.github/workflows/tmp-litteratur-round4-diagnose.yml$'
          unexpected="$(git status --porcelain | sed 's/^...//' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then printf 'Unexpected files:\n%s\n' "$unexpected"; exit 1; fi
          for p in \
            .github/workflows/litteratur-maintenance-integrity.yml \
            data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/narratologi_prosa/claims.json \
            data/fagverk/fagverk_release.json \
            data/fagverk/litteratur/maintenance/source-refresh-round4-2026-09-05.json \
            data/quiz/litteratur/litteratur_subject_pathways_v1.json \
            reports/fagverk/litteratur-legacy-theory-audit.json \
            scripts/audit-litteratur-maintenance-source-refresh-round4.mjs \
            scripts/materialize-litteratur-narrative-poetry-v1.mjs \
            tests/litteratur-maintenance-source-refresh-round4.test.mjs; do
            git status --porcelain -- "$p" | grep -q . || { echo "Missing required round-4 delta: $p"; exit 1; }
          done
          git diff --check
      - name: Commit permanent round 4 and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-litteratur-round4-materialize.yml .github/workflows/tmp-litteratur-round4-diagnose.yml
          git add .github/workflows/litteratur-maintenance-integrity.yml \
            data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/narratologi_prosa/claims.json \
            data/fagverk/fagverk_release.json \
            data/fagverk/litteratur/maintenance/source-refresh-round4-2026-09-05.json \
            data/knowledge/subjects/litteratur/knowledge_units.generated.json \
            data/quiz/litteratur/litteratur_subject_pathways_v1.json \
            reports/fagverk/litteratur-legacy-theory-audit.json \
            scripts/audit-litteratur-maintenance-source-refresh-round4.mjs \
            scripts/materialize-litteratur-narrative-poetry-v1.mjs \
            tests/litteratur-maintenance-source-refresh-round4.test.mjs
          git diff --cached --check
          git commit -m "Refresh Litteratur narratology sources round 4"
          git push origin HEAD:agent/litteratur-maintenance-source-refresh-round4-20260905
