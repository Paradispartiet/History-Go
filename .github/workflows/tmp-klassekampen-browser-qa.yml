name: TEMP Klassekampen browser QA

on:
  push:
    branches:
      - agent/klassekampen-phase2-v3-20261004
    paths:
      - .github/workflows/tmp-klassekampen-browser-qa.yml
      - data/people/media/oslo/people_media_oslo.json
      - data/runtime/people-all/**
      - data/runtime/place-open/klassekampen_redaksjon.json
      - tests/klassekampen-redaksjon-place-production-v3.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4

      - name: Verify exact Phase 2 target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f data/runtime/place-open/klassekampen_redaksjon.json
          node --test tests/klassekampen-redaksjon-place-production-v3.test.mjs

      - name: Prepare real Chrome QA harness
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "::error::Chrome/Chromium is not installed on this runner"
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "Using Chrome: $CHROME_BIN"
          "$CHROME_BIN" --version

          rm -rf /tmp/hg-browser-qa
          mkdir -p /tmp/hg-browser-qa "$GITHUB_WORKSPACE/artifacts/klassekampen-browser-qa"
          cd /tmp/hg-browser-qa
          npm init -y >/dev/null
          npm install --no-save --package-lock=false --no-audit --no-fund puppeteer-core@24.2.0

      - name: Start exact-head History Go server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" > /tmp/hg-browser-qa/server.log 2>&1 &
          echo $! > /tmp/hg-browser-qa/server.pid
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/index.html >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/hg-browser-qa/server.log
          exit 1

      - name: Run desktop and mobile Chrome QA
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/hg-browser-qa/qa.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import puppeteer from 'puppeteer-core';

          const workspace = process.env.GITHUB_WORKSPACE;
          const outDir = path.join(workspace, 'artifacts', 'klassekampen-browser-qa');
          const url = 'http://127.0.0.1:8080/index.html?hgTest=1#/place/klassekampen_redaksjon';
          const profiles = [
            { name: 'desktop', viewport: { width: 1440, height: 1000, deviceScaleFactor: 1 } },
            { name: 'mobile', viewport: { width: 390, height: 844, deviceScaleFactor: 1, isMobile: true, hasTouch: true } }
          ];

          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_BIN,
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
          });

          const reports = [];
          let hardFailure = false;

          for (const profile of profiles) {
            const page = await browser.newPage();
            await page.setViewport(profile.viewport);

            const consoleErrors = [];
            const pageErrors = [];
            const failedSameOrigin = [];

            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            page.on('pageerror', error => pageErrors.push(String(error?.stack || error)));
            page.on('response', response => {
              try {
                const responseUrl = new URL(response.url());
                if (responseUrl.origin === 'http://127.0.0.1:8080' && response.status() >= 400) {
                  failedSameOrigin.push({ status: response.status(), url: response.url() });
                }
              } catch {}
            });

            await page.evaluateOnNewDocument(() => {
              try {
                localStorage.setItem('hg_onboarding_shown_v1', '1');
                localStorage.setItem('HG_TEST_MODE', '1');
              } catch {}
            });

            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60_000 });
            await page.waitForFunction(
              () => window.__HG_APP_READY__ === true && window.__HG_ROUTER_STARTED__ === true,
              { timeout: 90_000 }
            );
            await page.waitForFunction(
              () => document.getElementById('placeCard')?.dataset?.currentPlaceId === 'klassekampen_redaksjon',
              { timeout: 60_000 }
            );
            await page.waitForFunction(
              () => {
                const image = document.getElementById('pcFrontImage');
                return image instanceof HTMLImageElement && image.complete && image.naturalWidth > 0;
              },
              { timeout: 45_000 }
            );
            await new Promise(resolve => setTimeout(resolve, 3500));

            const report = await page.evaluate(() => {
              const card = document.getElementById('placeCard');
              const title = document.getElementById('pcTitle');
              const frontImage = document.getElementById('pcFrontImage');
              const quizImage = document.getElementById('pcQuizCardImage');
              const collections = document.querySelector('[data-hg-place-sheet-collections]');
              const rect = card?.getBoundingClientRect?.();
              const visible = Boolean(card && rect && rect.width > 0 && rect.height > 0 && getComputedStyle(card).display !== 'none' && getComputedStyle(card).visibility !== 'hidden' && card.getAttribute('aria-hidden') !== 'true');
              const images = Array.from(card?.querySelectorAll?.('img') || []).map(img => ({
                id: img.id || '',
                className: img.className || '',
                src: img.currentSrc || img.src || '',
                complete: img.complete,
                naturalWidth: img.naturalWidth,
                naturalHeight: img.naturalHeight,
                rect: (() => {
                  const r = img.getBoundingClientRect();
                  return { x: r.x, y: r.y, width: r.width, height: r.height };
                })()
              }));
              const buttons = Array.from(card?.querySelectorAll?.('button') || []).map(button => ({
                id: button.id || '',
                text: (button.innerText || button.getAttribute('aria-label') || '').trim(),
                hidden: button.hidden,
                ariaHidden: button.getAttribute('aria-hidden')
              }));
              return {
                href: location.href,
                hash: location.hash,
                appReady: window.__HG_APP_READY__ === true,
                routerReady: window.__HG_ROUTER_STARTED__ === true,
                testMode: window.HG_TEST_MODE === true || window.TEST_MODE === true,
                currentPlaceId: card?.dataset?.currentPlaceId || '',
                title: (title?.textContent || '').trim(),
                cardVisible: visible,
                cardRect: rect ? { x: rect.x, y: rect.y, width: rect.width, height: rect.height, right: rect.right, bottom: rect.bottom } : null,
                viewport: { width: innerWidth, height: innerHeight },
                documentSize: { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight },
                horizontalOverflowPx: Math.max(0, document.documentElement.scrollWidth - document.documentElement.clientWidth),
                frontImage: frontImage instanceof HTMLImageElement ? {
                  src: frontImage.currentSrc || frontImage.src,
                  complete: frontImage.complete,
                  naturalWidth: frontImage.naturalWidth,
                  naturalHeight: frontImage.naturalHeight
                } : null,
                quizImage: quizImage instanceof HTMLImageElement ? {
                  src: quizImage.currentSrc || quizImage.src,
                  complete: quizImage.complete,
                  naturalWidth: quizImage.naturalWidth,
                  naturalHeight: quizImage.naturalHeight,
                  hidden: quizImage.hidden
                } : null,
                collectionText: (collections?.innerText || '').trim(),
                cardText: (card?.innerText || '').trim().slice(0, 12000),
                images,
                buttons
              };
            });

            report.profile = profile.name;
            report.consoleErrors = consoleErrors.slice(0, 30);
            report.pageErrors = pageErrors.slice(0, 30);
            report.failedSameOrigin = failedSameOrigin.slice(0, 30);
            report.brokenPlaceImages = report.images.filter(image => {
              const hiddenQuizImage = image.id === 'pcQuizCardImage' && report.quizImage?.hidden === true;
              return !hiddenQuizImage && Boolean(image.src) && Number(image.naturalWidth || 0) <= 0;
            }).slice(0, 30);

            const required = {
              exactPlace: report.currentPlaceId === 'klassekampen_redaksjon',
              title: /Klassekampen/i.test(report.title),
              visible: report.cardVisible === true,
              frontImageLoaded: Number(report.frontImage?.naturalWidth || 0) > 0,
              testMode: report.testMode === true,
              noHorizontalOverflow: report.horizontalOverflowPx <= 2,
              noPageErrors: report.pageErrors.length === 0,
              noBrokenPlaceImages: report.brokenPlaceImages.length === 0
            };
            report.required = required;
            reports.push(report);
            if (Object.values(required).some(value => value !== true)) hardFailure = true;

            fs.writeFileSync(path.join(outDir, `${profile.name}.json`), JSON.stringify(report, null, 2));
            await page.screenshot({ path: path.join(outDir, `${profile.name}.png`), fullPage: true });
            console.log(`\n=== ${profile.name.toUpperCase()} ===`);
            console.log(JSON.stringify({ ...required, collectionText: report.collectionText, cardRect: report.cardRect, viewport: report.viewport, consoleErrors: report.consoleErrors, pageErrors: report.pageErrors, brokenPlaceImages: report.brokenPlaceImages, failedSameOrigin: report.failedSameOrigin }, null, 2));

            await page.close();
          }

          await browser.close();
          fs.writeFileSync(path.join(outDir, 'summary.json'), JSON.stringify(reports, null, 2));
          if (hardFailure) process.exit(1);
          NODE

          node /tmp/hg-browser-qa/qa.mjs

      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klassekampen-browser-qa-${{ github.sha }}
          path: artifacts/klassekampen-browser-qa
          if-no-files-found: error
          retention-days: 7
