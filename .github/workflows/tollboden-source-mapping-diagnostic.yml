name: Tollboden source mapping diagnostic

on:
  push:
    branches:
      - agent/tollboden-closure-diagnostic-20260914

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Knowledge source normalization
        run: |
          echo '=== normalizeSources block ==='
          start=$(grep -n '^function normalizeSources' scripts/knowledge-canonical-data.mts | cut -d: -f1 | head -1)
          if [ -n "$start" ]; then end=$((start+180)); sed -n "${start},${end}p" scripts/knowledge-canonical-data.mts; fi
          echo '=== all missing/error construction branches ==='
          grep -n -B 6 -A 12 -E 'missing_|errors\.push|throw new Error|source_origin|sourceOrigin' scripts/knowledge-canonical-data.mts || true
          echo '=== build-quiz-manifest references repo-wide ==='
          grep -R -n -I 'build-quiz-manifest' scripts data tests 2>/dev/null | head -n 200 || true
