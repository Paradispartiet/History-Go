name: Capture Skakkeringen story validation 2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  capture-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate content
        run: |
          python - <<'PY'
          import base64, gzip, pathlib, re
          workflow = pathlib.Path('.github/workflows/agent-fill-skakkeringen-rounds.yml').read_text()
          payload = re.search(r'GENERATOR_GZ_B64: "([A-Za-z0-9+/=]+)"', workflow).group(1)
          script = gzip.decompress(base64.b64decode(payload)).decode()
          script = script.replace("const root = path.resolve(__dirname, '..');", "const root = process.cwd();")
          pathlib.Path('/tmp/agent-fill-skakkeringen-rounds.js').write_text(script)
          PY
          node /tmp/agent-fill-skakkeringen-rounds.js
      - name: Capture story integrity output
        run: |
          mkdir -p reports/skakkeringen-rounds-batch1
          set +e
          npm run check:stories > reports/skakkeringen-rounds-batch1/story-integrity-debug.txt 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> reports/skakkeringen-rounds-batch1/story-integrity-debug.txt
      - name: Commit content and diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports tests
          git commit -m "Generate Skakkeringen content for diagnosis [skip ci]"
          git push
