name: Probe Nannestad bygdemuseum source objects

on:
  push:
    branches:
      - agent/akershus-nannestad-bygdemuseum-production
    paths:
      - .github/workflows/probe-nannestad-bygdemuseum.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: agent/akershus-nannestad-bygdemuseum-production
          fetch-depth: 0

      - name: Fetch museum, address and nearby objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/akershus-coordinate-nannestad-bygdemuseum-source-probe

          python - <<'PY'
          import json
          import math
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path('reports/akershus-coordinate-nannestad-bygdemuseum-source-probe')
          legacy = (60.217, 11.012)
          ua = {'User-Agent': 'History-Go-coordinate-audit/1.0 (github.com/Paradispartiet/History-Go)'}

          def fetch(url):
              req = urllib.request.Request(url, headers=ua)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read()

          def save(name, data):
              (out / name).write_bytes(data)

          def haversine(a, b):
              lat1, lon1 = map(math.radians, a)
              lat2, lon2 = map(math.radians, b)
              dlat = lat2 - lat1
              dlon = lon2 - lon1
              h = math.sin(dlat / 2) ** 2 + math.cos(lat1) * math.cos(lat2) * math.sin(dlon / 2) ** 2
              return 2 * 6371000 * math.asin(math.sqrt(h))

          def polygon_centroid(coords):
              if not coords:
                  return None
              pts = coords[:]
              if pts[0] != pts[-1]:
                  pts.append(pts[0])
              area2 = 0.0
              cx = 0.0
              cy = 0.0
              for (lat1, lon1), (lat2, lon2) in zip(pts, pts[1:]):
                  cross = lon1 * lat2 - lon2 * lat1
                  area2 += cross
                  cx += (lon1 + lon2) * cross
                  cy += (lat1 + lat2) * cross
              if abs(area2) < 1e-15:
                  return (sum(p[0] for p in coords) / len(coords), sum(p[1] for p in coords) / len(coords))
              return (cy / (3 * area2), cx / (3 * area2))

          nom_url = 'https://nominatim.openstreetmap.org/search?' + urllib.parse.urlencode({
              'q': 'Nannestad bygdemuseum, Nannestad, Norway',
              'format': 'jsonv2',
              'addressdetails': 1,
              'extratags': 1,
              'namedetails': 1,
              'polygon_geojson': 1,
              'limit': 10,
          })
          nom_raw = fetch(nom_url)
          save('nominatim-nannestad-bygdemuseum.json', nom_raw)
          nom = json.loads(nom_raw)

          address_url = 'https://ws.geonorge.no/adresser/v1/sok?' + urllib.parse.urlencode({
              'sok': 'Teiealleen 11 Nannestad',
              'kommunenummer': '3238',
              'treffPerSide': 50,
          })
          address_raw = fetch(address_url)
          save('geonorge-teiealleen-11-nannestad.json', address_raw)
          address_data = json.loads(address_raw)

          exact_addresses = []
          for address in address_data.get('adresser', []):
              if address.get('adressenavn', '').casefold() == 'teiealleen' and address.get('nummer') == 11:
                  p = address.get('representasjonspunkt') or {}
                  point = (float(p['lat']), float(p['lon']))
                  exact_addresses.append({'data': address, 'point': point})

          named = None
          for item in nom:
              if item.get('name', '').casefold() == 'nannestad bygdemuseum':
                  named = item
                  break
          if named is None and nom:
              named = nom[0]

          if named:
              named_point = (float(named['lat']), float(named['lon']))
          elif exact_addresses:
              named_point = exact_addresses[0]['point']
          else:
              named_point = legacy

          object_summary = None
          if named and named.get('osm_type') in ('node', 'way'):
              osm_type = named['osm_type']
              osm_id = str(named['osm_id'])
              full_url = f'https://api.openstreetmap.org/api/0.6/{osm_type}/{osm_id}'
              if osm_type == 'way':
                  full_url += '/full'
              object_raw = fetch(full_url)
              save(f'osm-{osm_type}-{osm_id}-full.xml', object_raw)
              root = ET.fromstring(object_raw)
              if osm_type == 'node':
                  obj = root.find('node')
                  point = (float(obj.attrib['lat']), float(obj.attrib['lon']))
                  tags = {tag.attrib['k']: tag.attrib['v'] for tag in obj.findall('tag')}
                  object_summary = {'type': 'node', 'id': osm_id, 'lat': point[0], 'lon': point[1], 'tags': tags}
              else:
                  nodes = {n.attrib['id']: (float(n.attrib['lat']), float(n.attrib['lon'])) for n in root.findall('node')}
                  way = root.find('way')
                  refs = [nd.attrib['ref'] for nd in way.findall('nd') if nd.attrib['ref'] in nodes]
                  coords = [nodes[ref] for ref in refs]
                  centroid = polygon_centroid(coords)
                  tags = {tag.attrib['k']: tag.attrib['v'] for tag in way.findall('tag')}
                  object_summary = {'type': 'way', 'id': osm_id, 'lat': centroid[0], 'lon': centroid[1], 'node_count': len(coords), 'tags': tags}

          bbox = (named_point[1] - 0.008, named_point[0] - 0.006, named_point[1] + 0.008, named_point[0] + 0.006)
          map_url = 'https://api.openstreetmap.org/api/0.6/map?bbox=' + ','.join(f'{v:.7f}' for v in bbox)
          map_raw = fetch(map_url)
          save('osm-nannestad-bygdemuseum-bbox.xml', map_raw)
          root = ET.fromstring(map_raw)
          nodes = {n.attrib['id']: (float(n.attrib['lat']), float(n.attrib['lon'])) for n in root.findall('node')}
          relevant = []

          for n in root.findall('node'):
              tags = {tag.attrib['k']: tag.attrib['v'] for tag in n.findall('tag')}
              point = (float(n.attrib['lat']), float(n.attrib['lon']))
              d = haversine(named_point, point)
              if d <= 500 and tags and (tags.get('name') or tags.get('tourism') or tags.get('historic') or tags.get('amenity') or tags.get('addr:housenumber')):
                  relevant.append({'type': 'node', 'id': n.attrib['id'], 'lat': point[0], 'lon': point[1], 'distance_to_named_point_m': round(d, 1), 'tags': tags})

          for way in root.findall('way'):
              tags = {tag.attrib['k']: tag.attrib['v'] for tag in way.findall('tag')}
              refs = [nd.attrib['ref'] for nd in way.findall('nd') if nd.attrib['ref'] in nodes]
              coords = [nodes[ref] for ref in refs]
              if not coords:
                  continue
              centroid = polygon_centroid(coords)
              d = haversine(named_point, centroid)
              if d <= 500 and (tags.get('name') or tags.get('building') or tags.get('tourism') or tags.get('historic') or tags.get('amenity')):
                  relevant.append({'type': 'way', 'id': way.attrib['id'], 'lat': centroid[0], 'lon': centroid[1], 'distance_to_named_point_m': round(d, 1), 'node_count': len(coords), 'tags': tags})

          lines = [
              'named_result=' + json.dumps(named, ensure_ascii=False, sort_keys=True),
              f'named_point_lat={named_point[0]:.12f}',
              f'named_point_lon={named_point[1]:.12f}',
              f'named_point_distance_from_legacy_m={haversine(legacy, named_point):.1f}',
              'object_summary=' + json.dumps(object_summary, ensure_ascii=False, sort_keys=True),
              f'address_total={address_data.get("metadata", {}).get("totaltAntallTreff", 0)} exact={len(exact_addresses)}',
          ]
          for item in exact_addresses:
              lines.append('ADDRESS distance_to_named_point_m={distance_to_named_point_m:.1f} distance_from_legacy_m={distance_from_legacy_m:.1f} data={data}'.format(
                  distance_to_named_point_m=haversine(named_point, item['point']),
                  distance_from_legacy_m=haversine(legacy, item['point']),
                  data=json.dumps(item['data'], ensure_ascii=False, sort_keys=True),
              ))
          lines.append('bbox_relevant=' + json.dumps(sorted(relevant, key=lambda x: x['distance_to_named_point_m']), ensure_ascii=False, sort_keys=True))
          (out / 'source-summary.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Remove probe workflow and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/probe-nannestad-bygdemuseum.yml
          git add reports/akershus-coordinate-nannestad-bygdemuseum-source-probe
          git commit -m "Materialize Nannestad bygdemuseum coordinate sources"
          git push origin HEAD:agent/akershus-nannestad-bygdemuseum-production
