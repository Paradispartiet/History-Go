name: Oslo People batch 1 refinement

on:
  push:
    branches:
      - agent/oslo-people-zero-gap-batch1

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-people-zero-gap-batch1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refine People batch
        run: npx tsx tools/refine-oslo-people-zero-gap-batch1.mts

      - name: Publish clean data commit
        run: |
          rm -f tools/refine-oslo-people-zero-gap-batch1.mts
          rm -f .github/workflows/oslo-people-zero-gap-batch1-refine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refine Oslo People batch 1 with named founders"
          git push origin HEAD:agent/oslo-people-zero-gap-batch1
