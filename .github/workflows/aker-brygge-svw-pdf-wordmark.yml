name: Aker Brygge — authentic Simonsen Vogt Wiig source PDF wordmark candidate
on:
  push:
    branches:
      - feature/aker-brygge-last-two-brands-20261119
    paths:
      - .github/workflows/aker-brygge-svw-pdf-wordmark.yml
      - scripts/produce-aker-brygge-svw-wordmark-from-pdf.mjs
      - tests/aker-brygge-svw-pdf-wordmark.test.mjs
permissions:
  contents: write
concurrency:
  group: aker-brygge-svw-wordmark-source-candidate
  cancel-in-progress: false
jobs:
  source-based-logo:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aker-brygge-last-two-brands-20261119
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Ensure PDF page renderer is available
        run: |
          if ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
      - name: Download documented published PDF and crop authentic SVW wordmark
        run: node scripts/produce-aker-brygge-svw-wordmark-from-pdf.mjs
      - name: Verify source crop, hashes, WebP and hold status
        run: node --test tests/aker-brygge-svw-pdf-wordmark.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: aker-brygge-svw-authentic-pdf-wordmark-candidate
          path: |
            bilder/kort/brands/source/aker_brygge/simonsen_vogt_wiig_chambers_2024_authentic_wordmark_crop.png
            bilder/kort/brands/candidates/aker_brygge/simonsen_vogt_wiig.webp
            reports/place-production/aker-brygge-svw-authentic-pdf-wordmark-2026-11-19.json
          if-no-files-found: error
      - name: Store only non-published binary candidate and provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bilder/kort/brands/source/aker_brygge/simonsen_vogt_wiig_chambers_2024_authentic_wordmark_crop.png bilder/kort/brands/candidates/aker_brygge/simonsen_vogt_wiig.webp reports/place-production/aker-brygge-svw-authentic-pdf-wordmark-2026-11-19.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(aker-brygge): archive source-backed SVW wordmark candidate"
            git push origin HEAD:refs/heads/feature/aker-brygge-last-two-brands-20261119
          fi
