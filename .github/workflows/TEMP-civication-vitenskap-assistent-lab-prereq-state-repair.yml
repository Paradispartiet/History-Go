name: TEMP Civication Vitenskap Assistent lab prerequisite state repair

on:
  push:
    branches:
      - agent/civication-vitenskap-assistent-og-laboratorium-prerequisite-test-state-repair-20260908
    paths:
      - .github/workflows/TEMP-civication-vitenskap-assistent-lab-prereq-state-repair.yml

permissions:
  contents: write

concurrency:
  group: temp-civication-vitenskap-assistent-lab-prereq-state-repair
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-vitenskap-assistent-og-laboratorium-prerequisite-test-state-repair-20260908
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Require fresh main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "Branch is not based on current main" >&2; exit 1; }

      - name: Make prerequisite test state-aware
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const p='tests/civication-vitenskap-assistent-og-laboratorium-prerequisites.test.js';
          let s=fs.readFileSync(p,'utf8');
          const old1="assert.equal(ready.dimensions[['situated','reputation'].join('_')].status,'needs_role_authored_work');assert.deepEqual(ready.authored_work_required,[['situated','reputation'].join('_')]);";
          const new1="const roleWorldComplete=fs.existsSync(path.join(ROOT,'data/Civication/roleWorlds/vitenskap/vitenskap_assistent_og_laboratorium.json'));assert.equal(ready.dimensions[['situated','reputation'].join('_')].status,roleWorldComplete?'foundation_ready':'needs_role_authored_work');assert.deepEqual(ready.authored_work_required,roleWorldComplete?[]:[['situated','reputation'].join('_')]);";
          const old2="assert.ok(readiness.rollout_queue.some(r=>r.key===KEY&&r.classification==='rollout_ready'));";
          const new2="assert.equal(readiness.rollout_queue.some(r=>r.key===KEY&&r.classification==='rollout_ready'),!roleWorldComplete);";
          if(!s.includes(old1)) throw new Error('Reserved Role World assertions not found');
          if(!s.includes(old2)) throw new Error('Rollout queue assertion not found');
          s=s.replace(old1,new1).replace(old2,new2);
          fs.writeFileSync(p,s);
          NODE

      - name: Verify focused prerequisite test
        run: node tests/civication-vitenskap-assistent-og-laboratorium-prerequisites.test.js

      - name: Verify full Civication suite
        run: node tests/run-civication-tests.mjs

      - name: Require exact repair scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          [ "${#changed[@]}" -eq 1 ] || { echo "Expected exactly one generated repair path" >&2; exit 1; }
          [ "${changed[0]}" = "tests/civication-vitenskap-assistent-og-laboratorium-prerequisites.test.js" ] || { echo "Unexpected repair path" >&2; exit 1; }
          git diff --check

      - name: Require fresh main before permanent commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "main moved during verification" >&2; exit 1; }

      - name: Commit permanent prerequisite test repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/TEMP-civication-vitenskap-assistent-lab-prereq-state-repair.yml
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Make Vitenskap lab prerequisite test Role World aware"
          git push origin HEAD:agent/civication-vitenskap-assistent-og-laboratorium-prerequisite-test-state-repair-20260908
