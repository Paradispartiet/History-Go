name: Oslo coordinate batch 22 integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'agent/oslo-coordinate-control-batch-22'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Find address coordinates
        run: |
          set -o pipefail
          mkdir -p reports/oslo-coordinate-control-batch-22
          npm run places:coords:find:address -- --address "Grønland 4 Oslo" | tee reports/oslo-coordinate-control-batch-22/klassekampen_redaksjon-geonorge.json
          npm run places:coords:find:address -- --address "Storgata 36C Oslo" | tee reports/oslo-coordinate-control-batch-22/oslo_gassverk-geonorge.json
          npm run places:coords:find:address -- --address "Dronningens gate 15 Oslo" | tee reports/oslo-coordinate-control-batch-22/oslo_posthus-geonorge.json
          set +e
          npm run places:coords:find:address -- --address "Kongens gate 21 Oslo" | tee reports/oslo-coordinate-control-batch-22/telegrafbygningen-geonorge.json
          telegraf_exit=${PIPESTATUS[0]}
          set -e
          printf 'telegrafbygningen\t%s\n' "$telegraf_exit" > reports/oslo-coordinate-control-batch-22/telegrafbygningen-geonorge-exit.tsv
      - name: Apply batch
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/tmp-complete-oslo-coordinate-batch22.mjs 2>&1 | tee /tmp/apply-batch22.log
      - name: Upload apply failure log
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch22-apply-log
          path: /tmp/apply-batch22.log
          if-no-files-found: error
      - name: Stop on apply failure
        if: steps.apply.outcome == 'failure'
        run: exit 1
      - name: Rebuild place index
        run: npm run places:index:build
      - name: Check place index
        run: npm run places:index:check
      - name: Check split manifest sync
        run: npm run audit:places-split-manifest-sync
      - name: Check coordinate quality
        run: npm run places:coords:quality
      - name: Check strict coordinate intake
        run: |
          COORD_INTAKE_BASE="$(git merge-base HEAD origin/main)" npm run places:coords:intake
      - name: Check coordinate evidence
        run: npm run places:coords:evidence:audit
      - name: Check whitespace
        run: git diff --check
      - name: Remove temporary integration files
        run: |
          rm scripts/tmp-complete-oslo-coordinate-batch22.mjs
          rm .github/workflows/oslo-coordinate-batch22-integration.yml
      - name: Commit integrated batch
        run: |
          git config user.name 'history-go-coordinate-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Complete Oslo coordinate control batch 22'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
