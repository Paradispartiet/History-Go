name: One-time History V5.8 Cold War expansion

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/history-v5-8-cold-war-runner.part-*'
      - '.github/workflows/one-time-history-v5-8-cold-war.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/history-v5-8-cold-war
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize and validate V5.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/historie-v5 reports/historie-universal-coverage

          cat .github/history-v5-8-cold-war-runner.part-* > /tmp/history-v5-8-cold-war.b64
          printf '%s  %s\n' \
            '8fe22e546dfbd5a4b2095fb5c72d8ad8283089ff782f31bb660c05f1183780dc' \
            '/tmp/history-v5-8-cold-war.b64' | sha256sum --check
          base64 -d /tmp/history-v5-8-cold-war.b64 \
            | gunzip > /tmp/apply-history-v5-8-cold-war.mjs
          node --check /tmp/apply-history-v5-8-cold-war.mjs

          node /tmp/apply-history-v5-8-cold-war.mjs 2>&1 \
            | tee reports/historie-v5/historie-v5-8-cold-war-apply.log
          node tools/validate-historie-kald-krig-etterkrig.mjs 2>&1 \
            | tee reports/historie-v5/historie-v5-8-cold-war-domain-validation.log

          node scripts/build-quiz-production-context.mjs 2>&1 \
            | tee reports/historie-v5/historie-v5-8-quiz-context-rebuild.log
          npm run audit:quiz-production-context 2>&1 \
            | tee reports/historie-v5/historie-v5-8-quiz-production-context-audit.log
          npm run audit:quiz-progression 2>&1 \
            | tee reports/historie-v5/historie-v5-8-quiz-progression-audit.log
          npm run audit:quiz-theory-binding 2>&1 \
            | tee reports/historie-v5/historie-v5-8-quiz-theory-binding-audit.log
          npm run test:quiz-content-audit 2>&1 \
            | tee reports/historie-v5/historie-v5-8-quiz-content-test.log
          npm run test:quiz-production 2>&1 \
            | tee reports/historie-v5/historie-v5-8-quiz-production-test.log

          node tools/audit-historie-v5-5-quality-depth.mjs --write-freeze \
            --reason='V5.8 adds universal Cold War and postwar-society coverage, including rural, religious-community and marginalized-actor histories.' 2>&1 \
            | tee reports/historie-v5/historie-v5-8-quality-freeze-write.log
          node tools/audit-historie-v5-5-quality-depth.mjs 2>&1 \
            | tee reports/historie-v5/historie-v5-8-quality-freeze-verify.log

          node tools/audit-historie-universal-coverage.mjs 2>&1 \
            | tee reports/historie-universal-coverage/audit-command.log
          node tools/audit-historie-universal-coverage.mjs --check 2>&1 \
            | tee -a reports/historie-universal-coverage/audit-command.log

          node - <<'NODE' 2>&1 | tee reports/historie-v5/historie-v5-8-coverage-target-check.log
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('reports/historie-universal-coverage/historie-universal-coverage.json'));
          const required = {
            time: ['kald_krig_1945_1991'],
            actors: ['bonder_landsbygd', 'religiøse_fellesskap', 'fattige_marginaliserte']
          };
          const result = {};
          for (const [axis, ids] of Object.entries(required)) {
            const cells = new Map(report.axes[axis].cells.map(cell => [cell.id, cell]));
            result[axis] = {};
            for (const id of ids) {
              const cell = cells.get(id);
              result[axis][id] = cell?.status || 'MISSING_FROM_REPORT';
              if (cell?.status !== 'COVERED') process.exitCode = 1;
            }
          }
          const expectedSummary = {covered_cells: 58, partial_cells: 1, missing_cells: 0};
          for (const [key, expected] of Object.entries(expectedSummary)) {
            if (report.summary?.[key] !== expected) process.exitCode = 1;
          }
          console.log(JSON.stringify({status: report.status, expectedSummary, actualSummary: report.summary, required: result}, null, 2));
          NODE

          node - <<'NODE' 2>&1 | tee reports/historie-v5/historie-v5-8-inventory-check.log
          const fs = require('fs');
          const h = 'data/fag/historie/';
          const p = JSON.parse(fs.readFileSync(h+'historiepensum_canonical_v4_5.json'));
          const e = JSON.parse(fs.readFileSync(h+'emner_historie_canonical_v4_5.json'));
          const m = JSON.parse(fs.readFileSync(h+'emnemapping_historie_canonical_v4_5.json'));
          const c = JSON.parse(fs.readFileSync(h+'concepts_historie_canonical_v5_5.json'));
          const t = JSON.parse(fs.readFileSync(h+'theory_objects_historie_canonical_v5_5.json'));
          const methods = JSON.parse(fs.readFileSync(h+'methods_historie_canonical_v4_5.json')).methods;
          const expected = {domains:23, emner:230, mappings:230, concepts:976, theories:230, methods:105};
          const actual = {domains:p.domains.length, emner:e.length, mappings:m.length, concepts:c.length, theories:t.length, methods:methods.length};
          console.log(JSON.stringify({expected, actual}, null, 2));
          for (const key of Object.keys(expected)) if (actual[key] !== expected[key]) process.exitCode = 1;
          NODE

      - name: Publish validated V5.8 data
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/history-v5-8-cold-war-runner.part-*
          git restore --source=HEAD -- .github/workflows/history-v5-5-quality-freeze.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short 2>&1 \
            | tee reports/historie-v5/historie-v5-8-cold-war-git-status.log
          git add -A
          git commit -m 'Utvid Historie V5.8 med den kalde krigen og etterkrigssamfunnet'
          git push origin HEAD:agent/history-v5-8-cold-war 2>&1 \
            | tee /tmp/historie-v5-8-publish.log

      - name: Upload V5.8 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-v5-8-cold-war-diagnostics
          path: |
            reports/historie-v5/**
            reports/historie-universal-coverage/**
            /tmp/historie-v5-8-publish.log
          if-no-files-found: warn
