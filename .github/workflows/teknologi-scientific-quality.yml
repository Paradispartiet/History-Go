name: Technology scientific quality

on:
  pull_request:
    paths:
      - 'data/fag/fag_manifest.json'
      - 'data/fag/teknologi/**'
      - 'data/quiz/manifest.json'
      - 'data/quiz/teknologi/**'
      - 'data/quiz/regler/QUIZ_QUESTION_SCHEMA_V2.json'
      - 'data/quiz/regler/QUIZ_TEMPLATE_REGISTRY_V2.json'
      - 'data/quiz/regler/QUIZ_SUBJECT_PATHWAY_PACKAGE_SCHEMA_V1.json'
      - 'data/knowledge/knowledge_manifest.json'
      - 'data/knowledge/*.generated.json'
      - 'scripts/knowledge-canonical-data.mts'
      - 'scripts/validate-teknologi-editorial-v3.mjs'
      - 'tools/build-teknologi-evidence-v2_3.mjs'
      - 'tools/build-teknologi-editorial-v3.mjs'
      - 'tools/validate-teknologi-quality-v2_1.mjs'
      - 'tools/validate-teknologi-ontology-v2_2.mjs'
      - 'tools/validate-teknologi-evidence-v2_3.mjs'
      - 'reports/teknologi-*'
      - 'package.json'
      - '.github/workflows/teknologi-scientific-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-quality:
    name: Technology V2 source layers and V3 editorial canonical integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build script runtime
        run: npm run build:scripts

      - name: Check active Technology editorial model V3
        run: node tools/build-teknologi-editorial-v3.mjs --check

      - name: Check canonical Knowledge sync
        run: node dist/scripts/knowledge-canonical-data.mjs --check

      - name: Validate scientific quality V2.1 source layer
        run: node tools/validate-teknologi-quality-v2_1.mjs

      - name: Validate ontology depth V2.2 source layer
        run: node tools/validate-teknologi-ontology-v2_2.mjs

      - name: Validate evidence and production V2.3 source layer
        run: node tools/validate-teknologi-evidence-v2_3.mjs

      - name: Validate editorial canonical integration V3
        run: node scripts/validate-teknologi-editorial-v3.mjs

      - name: Upload scientific quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teknologi-scientific-quality-reports
          path: |
            reports/teknologi-scientific-quality-validation.json
            reports/teknologi-ontology-depth-validation.json
            reports/teknologi-evidence-production-validation.json
            reports/teknologi-editorial-v3-validation.json
          if-no-files-found: error
