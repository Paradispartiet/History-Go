name: Grand Hotel one-time artifact regeneration
on:
  push:
    branches:
      - fix/grand-hotel-naeringsliv-category-20261030
    paths:
      - .github/workflows/zz-grand-hotel-artifact-rebuild.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/grand-hotel-naeringsliv-category-20261030
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate authoritative artifacts and verify local Grand Hotel contract
        run: |
          set -euo pipefail
          node scripts/build-epoke-place-index.mjs
          node scripts/build-place-open-payloads.mjs
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target grand_hotel --output data/quiz/production_context/naeringsliv/grand_hotel.json
          node scripts/build-fagverk-release-manifest.mjs
          node --test tests/grand-hotel-naeringsliv.test.mjs
      - name: Commit only scoped generated files and remove the one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/epoker/epoke-place-index.json data/fagverk/fagverk_release.json data/runtime/place-open/grand_hotel.json data/quiz/production_context/naeringsliv/grand_hotel.json
          git rm -- .github/workflows/zz-grand-hotel-artifact-rebuild.yml
          git diff --cached --stat
          git commit -m "chore(grand-hotel): regenerate epoke, Fagverk, place-open and quiz context"
          git push origin HEAD:fix/grand-hotel-naeringsliv-category-20261030
