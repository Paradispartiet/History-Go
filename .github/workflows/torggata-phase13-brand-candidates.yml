name: Torggata phase 13 brand candidates

on:
  push:
    branches:
      - agent/torggata-phase13-brands
    paths:
      - .github/workflows/torggata-phase13-brand-candidates.yml
      - scripts/torggata-phase13-brand-deep-candidates.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Install browser review dependency
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Build deep candidate package
        run: node scripts/torggata-phase13-brand-deep-candidates.mjs

      - name: Upload deep candidate review package
        uses: actions/upload-artifact@v4
        with:
          name: torggata-phase13-brand-deep-candidates
          path: reports/place-production/torggata-phase13-deep-candidate-work
          if-no-files-found: error
          retention-days: 7
