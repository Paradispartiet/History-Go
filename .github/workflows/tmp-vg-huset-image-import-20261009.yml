name: Temporary VG-huset licensed image import
on:
  push:
    branches:
      - agent/vg-huset-source-preflight-20261009
    paths:
      - .github/workflows/tmp-vg-huset-image-import-20261009.yml

permissions:
  contents: write

jobs:
  import:
    name: Import two distinct licensed VG-huset photos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image inspection dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Download Commons originals (strict two-file source contract)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vg-huset-sources
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 120 \
            --user-agent 'HistoryGoMediaImport/1.0 (source at Wikimedia Commons; attribution in place JSON)' \
            'https://upload.wikimedia.org/wikipedia/commons/9/97/Akersgata_55_med_VG_og_Aftenposten_i_2026.jpg' \
            -o /tmp/vg-huset-sources/akersgata55-2026.jpg
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 120 \
            --user-agent 'HistoryGoMediaImport/1.0 (source at Wikimedia Commons; attribution in place JSON)' \
            'https://upload.wikimedia.org/wikipedia/commons/b/b8/Verdens_Gang_Akersgata.jpg' \
            -o /tmp/vg-huset-sources/vg-huset-2007.jpg
          sha256sum /tmp/vg-huset-sources/*.jpg
      - name: Verify originals and export independent WebP files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import hashlib
          originals = [
              (Path('/tmp/vg-huset-sources/akersgata55-2026.jpg'), Path('bilder/places/vg_huset_akersgata_55_2026.webp'), 'landscape'),
              (Path('/tmp/vg-huset-sources/vg-huset-2007.jpg'), Path('bilder/places/vg_huset_front_2007.webp'), 'portrait'),
          ]
          originals_sha = []
          for src, dst, orientation in originals:
              if dst.exists():
                  raise RuntimeError(f'Destination already exists, refusing overwrite: {dst}')
              original_bytes = src.read_bytes()
              originals_sha.append(hashlib.sha256(original_bytes).hexdigest())
              with Image.open(src) as im:
                  if im.format != 'JPEG':
                      raise RuntimeError(f'Unexpected original image format: {src} {im.format}')
                  image = ImageOps.exif_transpose(im).convert('RGB')
                  width, height = image.size
                  if width < 1000 or height < 1000:
                      raise RuntimeError(f'Original unexpectedly small: {src} {width}x{height}')
                  if orientation == 'landscape' and not width > height:
                      raise RuntimeError(f'Expected landscape source: {src} {width}x{height}')
                  if orientation == 'portrait' and not height > width:
                      raise RuntimeError(f'Expected portrait source: {src} {width}x{height}')
                  image.thumbnail((1900, 1900), Image.Resampling.LANCZOS)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  image.save(dst, 'WEBP', quality=87, method=6)
                  with Image.open(dst) as check:
                      w, h = check.size
                      if orientation == 'landscape' and not w > h:
                          raise RuntimeError(f'Output not landscape: {dst}')
                      if orientation == 'portrait' and not h > w:
                          raise RuntimeError(f'Output not portrait: {dst}')
                      print(f'{dst}: {w} x {h}, source {width} x {height}, {len(original_bytes)} source bytes')
          if originals_sha[0] == originals_sha[1]:
              raise RuntimeError('Source photos must be independent original files.')
          PY
      - name: Commit exactly two sourced images
        shell: bash
        run: |
          set -euo pipefail
          git add -- bilder/places/vg_huset_akersgata_55_2026.webp bilder/places/vg_huset_front_2007.webp
          if [ "$(git diff --cached --name-only | wc -l)" -ne 2 ]; then
            echo '::error::Both expected binary assets must be newly staged.'
            exit 1
          fi
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in
              bilder/places/vg_huset_akersgata_55_2026.webp|bilder/places/vg_huset_front_2007.webp)
                echo "ALLOW $file" ;;
              *) echo "::error::Unexpected changed file $file"; exit 1 ;;
            esac
          done
          test -z "$(git diff --name-only)"
          git config user.name history-go-sync-bot
          git config user.email history-go-sync-bot@users.noreply.github.com
          git commit -m 'assets(place): import independently licensed VG-huset photos'
          git push origin HEAD:agent/vg-huset-source-preflight-20261009
