name: History universal coverage

on:
  pull_request:
    paths:
      - 'data/fag/historie/**'
      - 'data/fag/profiles/**'
      - 'tools/audit-historie-universal-coverage.mjs'
      - 'tools/audit-historie-geographic-profile.mjs'
      - 'tools/validate-historie-profile-evidence.mjs'
      - 'reports/historie-universal-coverage/**'
      - 'reports/historie-geographic-profiles/**'
      - 'docs/HISTORY_UNIVERSAL_COVERAGE.md'
      - 'docs/HISTORY_V5_5_FREEZE.md'
      - '.github/workflows/history-universal-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  universal-coverage:
    name: History subject coverage matrix
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate separate profile and evidence layer
        shell: bash
        run: |
          set -euo pipefail
          node tools/validate-historie-profile-evidence.mjs
          node tools/audit-historie-geographic-profile.mjs --check

      - name: Materialize universal coverage audit
        run: node tools/audit-historie-universal-coverage.mjs

      - name: Verify committed reports are current
        shell: bash
        run: |
          git diff --exit-code -- \
            reports/historie-universal-coverage/historie-universal-coverage.json \
            reports/historie-universal-coverage/historie-universal-coverage.md
          test -z "$(git status --porcelain --untracked-files=all -- reports/historie-universal-coverage)"
          node tools/audit-historie-universal-coverage.mjs --check

      - name: Upload universal coverage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historie-universal-coverage
          path: |
            reports/historie-universal-coverage/historie-universal-coverage.json
            reports/historie-universal-coverage/historie-universal-coverage.md
            reports/historie-geographic-profiles/oslo-akershus-profile.json
            reports/historie-geographic-profiles/oslo-akershus-profile.md
            reports/historie-geographic-profiles/sapmi-nordlige-kontaktsoner-profile.json
            reports/historie-geographic-profiles/sapmi-nordlige-kontaktsoner-profile.md
          if-no-files-found: error
