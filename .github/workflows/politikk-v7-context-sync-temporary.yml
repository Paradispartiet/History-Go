name: Politikk v7 one-time context synchronization

on:
  pull_request:
    paths:
      - '.github/workflows/politikk-v7-context-sync-temporary.yml'

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/politikk-poland-pathway-activation-v7-20261021'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild only nine impacted Politics production contexts
        run: |
          node scripts/build-quiz-production-context.mjs --category politikk --target tinghuset --output data/quiz/production_context/politikk/tinghuset.json
          node scripts/build-quiz-production-context.mjs --check --category politikk --target tinghuset --output data/quiz/production_context/politikk/tinghuset.json
          node scripts/build-quiz-production-context.mjs --category politikk --target regjeringskvartalet --output data/quiz/production_context/politikk/regjeringskvartalet.json
          node scripts/build-quiz-production-context.mjs --check --category politikk --target regjeringskvartalet --output data/quiz/production_context/politikk/regjeringskvartalet.json
          node scripts/build-quiz-production-context.mjs --category politikk --target youngstorget --output data/quiz/production_context/politikk/youngstorget.json
          node scripts/build-quiz-production-context.mjs --check --category politikk --target youngstorget --output data/quiz/production_context/politikk/youngstorget.json
          node scripts/build-quiz-production-context.mjs --category politikk --target oslo_radhus --output data/quiz/production_context/politikk/oslo_radhus.json
          node scripts/build-quiz-production-context.mjs --check --category politikk --target oslo_radhus --output data/quiz/production_context/politikk/oslo_radhus.json
          node scripts/build-quiz-production-context.mjs --category politikk --target stortinget --output data/quiz/production_context/politikk/stortinget.json
          node scripts/build-quiz-production-context.mjs --check --category politikk --target stortinget --output data/quiz/production_context/politikk/stortinget.json
          node scripts/build-quiz-production-context.mjs --category politikk --target slottet --output data/quiz/production_context/politikk/slottet.json
          node scripts/build-quiz-production-context.mjs --check --category politikk --target slottet --output data/quiz/production_context/politikk/slottet.json
          node scripts/build-quiz-production-context.mjs --category politikk --target slottsplassen --output data/quiz/production_context/politikk/slottsplassen.json
          node scripts/build-quiz-production-context.mjs --check --category politikk --target slottsplassen --output data/quiz/production_context/politikk/slottsplassen.json
          node scripts/build-quiz-production-context.mjs --category politikk --target eidsvolls_plass --output data/quiz/production_context/politikk/eidsvolls_plass.json
          node scripts/build-quiz-production-context.mjs --check --category politikk --target eidsvolls_plass --output data/quiz/production_context/politikk/eidsvolls_plass.json
          node scripts/build-quiz-production-context.mjs --category politikk --target 22_juli_senteret --output data/quiz/production_context/politikk/22_juli_senteret.json
          node scripts/build-quiz-production-context.mjs --check --category politikk --target 22_juli_senteret --output data/quiz/production_context/politikk/22_juli_senteret.json
      - name: Verify changes are limited to deterministic metadata
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          while IFS= read -r change; do
            file="${change:3}"
            case "$file" in
              data/quiz/production_context/politikk/*.json)
                case "$file" in
                  data/quiz/production_context/politikk/tinghuset.json) ;;
                  data/quiz/production_context/politikk/regjeringskvartalet.json) ;;
                  data/quiz/production_context/politikk/youngstorget.json) ;;
                  data/quiz/production_context/politikk/oslo_radhus.json) ;;
                  data/quiz/production_context/politikk/stortinget.json) ;;
                  data/quiz/production_context/politikk/slottet.json) ;;
                  data/quiz/production_context/politikk/slottsplassen.json) ;;
                  data/quiz/production_context/politikk/eidsvolls_plass.json) ;;
                  data/quiz/production_context/politikk/22_juli_senteret.json) ;;
                  *) echo "Unexpected Politics context: $file" >&2; exit 1 ;;
                esac
                ;; ;;
              *) echo "Unexpected build output: $file" >&2; exit 1 ;;
            esac
          done < <(git status --porcelain)
          git add -- data/quiz/production_context/politikk/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(politikk): refresh nine quiz source-context checksums'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
