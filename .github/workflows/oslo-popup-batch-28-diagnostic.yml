name: One-time Oslo popup batch 28 diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/oslo-popup-batch-28-diagnostic-trigger.txt

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-popup-v4-batch-28-science-ten
          fetch-depth: 0
      - name: Measure texts and protocol preconditions
        run: |
          node <<'NODE'
          const fs=require('fs');
          const patches=['.github/oslo-popup-batch-28-science-patch-a.json','.github/oslo-popup-batch-28-science-patch-b.json'].flatMap(p=>JSON.parse(fs.readFileSync(p,'utf8')).places);
          const supplements={
            meteorologisk_institutt:' Sammenligning mellom prognose og observert vær brukes videre til å forbedre både modellene og hvordan usikkerheten kommuniseres til publikum.',
            naturhistorisk_museum:' Samlingsnumre og databaser gjør det mulig å koble publikasjoner tilbake til bestemte eksemplarer, slik at analyser kan kontrolleres eller gjentas med nye metoder.',
            oslo_met_pilestredet:' Dette gjør campus til et godt sted for å studere hvordan offentlig finansiert kunnskap møter krav om nytte, kvalitet, personvern og profesjonelt ansvar.',
            oslo_reptilpark:' Formidlingen blir sterkest når det publikum ser, kobles til dokumentert artskunnskap og til tydelige grenser for hva én observasjon kan vise.',
            radiumhospitalet:' Sykehusets historie viser også hvordan begrepet kreftbehandling har endret seg gjennom nye målemetoder, legemidler, teknologier og mer presis klassifisering av sykdom.',
            rikshospitalet:' Institusjonens lange historie gjør det mulig å se hvordan sykehusets organisering, teknologi og kunnskapsgrunnlag har endret seg uten at årstallet 1826 beskriver dagens bygninger.',
            teknisk_museum:' Et objekt kan dermed brukes til å undersøke både oppfinnelse, produksjon, bruk, vedlikehold og hvilke samfunnsproblemer teknologien skapte eller forsøkte å løse.',
            tvergastein:' Hytta viser derfor både kraften og begrensningen i stedbundet tenkning: erfaring kan åpne spørsmål, mens argumentene fortsatt må vurderes uavhengig av stedets symbolverdi.',
            universitetet_i_oslo_blindern:' Campus er også et arbeidssted med administrative og tekniske systemer som gjør forskning mulig, fra datasikkerhet og verksteder til bibliotek, dyrehold og laboratoriedrift.',
            universitetets_gamle_hovedbygning:' Anlegget viser hvordan kunnskapsinstitusjoner både trenger arbeidsrom og bruker arkitektur til å uttrykke hvem som har autoritet til å tale offentlig.'
          };
          const fallback=' Stedet bør derfor undersøkes gjennom dokumenterte kilder, tydelig metode og presise grenser for hva observasjonene faktisk kan støtte.';
          const words=t=>(String(t).match(/[\p{L}\p{N}]+(?:[’'\-][\p{L}\p{N}]+)*/gu)||[]).length;
          const paras=t=>String(t).trim().split(/\n\s*\n/).filter(Boolean).length;
          const rows=patches.map(x=>{let p=x.popupDesc;const original=words(p);if(words(p)<300)p+=supplements[x.id];const supplemented=words(p);if(words(p)<300)p+=fallback;return{id:x.id,descWords:words(x.desc),originalPopupWords:original,supplementedPopupWords:supplemented,finalPopupWords:words(p),paragraphs:paras(p)};});
          const protocol=fs.readFileSync('reports/place-description-revision-protocol.md','utf8');
          fs.writeFileSync('.github/oslo-popup-batch-28-diagnostic.json',JSON.stringify({rows,protocolChecks:{total228:protocol.includes('Ferdige etter alle mergede revisjonsbatcher: **228 steder**'),remaining284:protocol.includes('Gjenstår: **284 steder**'),sentence284:protocol.includes('Det gjenstår **284 aktive Oslo-steder**'),science11:protocol.includes('- vitenskap: **11**'),batch27:/\| Oslo V4 batch 27 \| 10 \| #[0-9]+ – første produksjonsbatch fra vitenskapskøen \|/.test(protocol)}},null,2)+'\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/oslo-popup-batch-28-diagnostic.json
          git commit -m "Record Batch 28 diagnostics"
          git push origin HEAD:agent/oslo-popup-v4-batch-28-science-ten
