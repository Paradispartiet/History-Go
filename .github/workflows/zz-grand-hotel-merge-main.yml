name: Grand Hotel final main sync after Næringsliv closure
on:
  push:
    branches:
      - fix/grand-hotel-naeringsliv-category-20261030
    paths:
      - .github/workflows/zz-grand-hotel-merge-main.yml
permissions:
  contents: write
concurrency:
  group: grand-hotel-final-main-sync
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/grand-hotel-naeringsliv-category-20261030
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Merge latest main and preserve unrelated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          echo "Integrating main: $(git rev-parse origin/main)"
          git merge --no-commit --no-ff origin/main || true
          test -f .git/MERGE_HEAD
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True)
          def version(side, path):
              return json.loads(git("show", f":{side}:{path}"))
          def finish(path, data):
              Path(path).write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
              subprocess.run(["git", "add", "--", path], check=True)

          regen = {
              "data/epoker/epoke-place-index.json",
              "data/fagverk/fagverk_release.json",
              "data/knowledge/knowledge_units.generated.json"
          }
          conflicts = git("diff", "--name-only", "--diff-filter=U").splitlines()
          print("CONFLICTS:", *conflicts, sep="\n  ")
          allowed = regen | {
              "data/places/manifest.json",
              "data/places/places_index.json",
              "data/fagverk/fagverk_registry.json",
              "data/quiz/manifest.json",
          }
          unexpected = [p for p in conflicts if p not in allowed]
          if unexpected:
              raise RuntimeError("Do not automatically resolve unknown conflicts: " + ", ".join(unexpected))

          for path in conflicts:
              if path in regen:
                  subprocess.run(["git", "checkout", "--theirs", "--", path], check=True)
                  subprocess.run(["git", "add", "--", path], check=True)
                  continue
              ours, theirs = version(2, path), version(3, path)
              if path == "data/places/manifest.json":
                  old = "places/media/oslo/grand_hotel.json"
                  new = "places/naeringsliv/oslo/grand_hotel.json"
                  assert new in ours["files"]
                  files = [new if x == old else x for x in theirs["files"]]
                  if new not in files:
                      files.append(new)
                  theirs["files"] = list(dict.fromkeys(files))
              elif path == "data/places/places_index.json":
                  edited = next(x for x in ours if x.get("id") == "grand_hotel")
                  matches = [i for i, x in enumerate(theirs) if x.get("id") == "grand_hotel"]
                  assert len(matches) == 1
                  theirs[matches[0]] = edited
              elif path == "data/fagverk/fagverk_registry.json":
                  theirs["placeLinks"]["grand_hotel"] = ours["placeLinks"]["grand_hotel"]
              elif path == "data/quiz/manifest.json":
                  qold = "data/quiz/media/grand_hotel_sets.json"
                  qnew = "data/quiz/naeringsliv/grand_hotel_sets.json"
                  theirs["files"] = list(dict.fromkeys([qnew if x == qold else x for x in theirs["files"]]))
                  for set_ in ours["sets"]:
                      if set_.get("targetId") != "grand_hotel":
                          continue
                      matches = [i for i, v in enumerate(theirs["sets"]) if v.get("targetId") == "grand_hotel" and v.get("order") == set_.get("order")]
                      assert len(matches) == 1, set_
                      theirs["sets"][matches[0]] = set_
                  if "grand_hotel" in ours.get("targets", {}):
                      theirs.setdefault("targets", {})["grand_hotel"] = ours["targets"]["grand_hotel"]
              finish(path, theirs)
          assert not git("diff", "--name-only", "--diff-filter=U").strip(), "unresolved conflicts"
          PY
      - name: Regenerate merged canonical artifacts and validate Grand Hotel
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node scripts/build-epoke-place-index.mjs
          node scripts/build-place-open-payloads.mjs
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target grand_hotel --output data/quiz/production_context/naeringsliv/grand_hotel.json
          npm run knowledge:canonical:write
          node scripts/build-fagverk-release-manifest.mjs
          npm run knowledge:canonical:check
          node --test tests/grand-hotel-naeringsliv.test.mjs
      - name: Commit merge and remove temporary workflow
        run: |
          set -euo pipefail
          git add -- data/epoker/epoke-place-index.json data/fagverk/fagverk_release.json data/knowledge/knowledge_units.generated.json data/runtime/place-open/grand_hotel.json data/quiz/production_context/naeringsliv/grand_hotel.json
          git rm -- .github/workflows/zz-grand-hotel-merge-main.yml
          git restore .
          git diff --cached --stat
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "merge(main): integrate newer production data without losing Grand Hotel Næringsliv migration"
          git push origin HEAD:fix/grand-hotel-naeringsliv-category-20261030
