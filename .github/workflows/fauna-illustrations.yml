name: Finn Fauna original illustrations
on:
  pull_request:
    paths:
      - 'js/ui/nature-fauna-approved.js'
      - 'js/ui/nature-explorer.js'
      - 'finn-fauna.html'
      - 'css/nature-explorer.css'
      - 'data/natur/fauna/illustration-quality-*.json'
      - 'bilder/natur/fauna/godkjent/**'
      - 'scripts/test-fauna-approved-*.mjs'
      - 'scripts/test-fauna-*.mjs'
      - '.github/workflows/fauna-illustrations.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fauna-illustrations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  illustration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-fauna-graaspurv-001.mjs
      - run: node scripts/test-fauna-kraake-002.mjs
      - run: node scripts/test-fauna-skjaere-003.mjs
      - run: node scripts/test-fauna-svarttrost-004.mjs
      - run: node scripts/test-fauna-blaameis-005.mjs
      - run: node scripts/test-fauna-kjottmeis-006.mjs
      - run: node scripts/test-fauna-ringdue-007.mjs
      - run: node scripts/test-fauna-stokkand-008.mjs
      - run: node scripts/test-fauna-graamaake-009.mjs
      - run: node scripts/test-fauna-fiskemaake-010.mjs
      - run: node scripts/test-fauna-knoppsvane-011.mjs
      - run: node scripts/test-fauna-graagaas-012.mjs
      - run: node scripts/test-fauna-toppand-013.mjs
      - run: node scripts/test-fauna-sothone-014.mjs
      - run: node scripts/test-fauna-storskarv-015.mjs
      - run: node scripts/test-fauna-hettemaake-016.mjs
      - run: node scripts/test-fauna-sildemaake-017.mjs
      - run: node scripts/test-fauna-graahegre-018.mjs
      - run: node scripts/test-fauna-flaggspett-019.mjs
      - run: node scripts/test-fauna-gronnfink-020.mjs
      - run: node scripts/test-fauna-rodstrupe-021.mjs
      - run: node scripts/test-fauna-graatrost-022.mjs
      - run: node scripts/test-fauna-linerle-023.mjs
      - run: node scripts/test-fauna-spettmeis-024.mjs
      - run: node scripts/test-fauna-maaltrost-025.mjs
      - run: node scripts/test-fauna-notteskrike-026.mjs
      - run: node scripts/test-fauna-pilfink-027.mjs
      - run: node scripts/test-fauna-stillits-028.mjs
      - run: node scripts/test-fauna-kaie-029.mjs
      - run: node scripts/test-fauna-staer-030.mjs
      - run: node scripts/test-fauna-bokfink-031.mjs
      - run: node scripts/test-fauna-taarnseiler-032.mjs
      - run: node scripts/test-fauna-hvitkinngaas-033.mjs
