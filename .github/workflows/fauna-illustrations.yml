      - run: node scripts/test-fauna-sjoorre-036.mjs
      - run: node scripts/test-fauna-lovsanger-037-candidate.mjs
      - run: node scripts/test-fauna-lovsanger-037.mjs
      - run: node scripts/test-fauna-svarthvit-fluesnapper-038.mjs
