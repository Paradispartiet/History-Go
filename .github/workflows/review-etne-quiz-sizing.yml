name: Apply source-sized Etne quiz revision

on:
  push:
    branches:
      - agent/etne-quiz-source-sizing-revision

permissions:
  contents: write

jobs:
  revise-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-quiz-source-sizing-revision
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Remove repeated questions and preserve source-sized packages
        run: |
          node <<'NODE'
          const fs = require('fs');

          const plan = {
            varhaug_nervik: {
              expected: 10,
              keep: [
                'varhaug_nervik_quiz_2',
                'varhaug_nervik_quiz_4',
                'varhaug_nervik_quiz_5',
                'varhaug_nervik_quiz_7',
                'varhaug_nervik_quiz_8',
                'varhaug_nervik_quiz_9',
                'varhaug_nervik_quiz_10',
                'varhaug_nervik_quiz_11',
                'varhaug_nervik_quiz_12',
                'varhaug_nervik_quiz_13'
              ]
            },
            nesjarhaugen_byrkjenes: {
              expected: 12,
              keep: [
                'nesjarhaugen_byrkjenes_quiz_2',
                'nesjarhaugen_byrkjenes_quiz_3',
                'nesjarhaugen_byrkjenes_quiz_4',
                'nesjarhaugen_byrkjenes_quiz_5',
                'nesjarhaugen_byrkjenes_quiz_6',
                'nesjarhaugen_byrkjenes_quiz_7',
                'nesjarhaugen_byrkjenes_quiz_9',
                'nesjarhaugen_byrkjenes_quiz_10',
                'nesjarhaugen_byrkjenes_quiz_11',
                'nesjarhaugen_byrkjenes_quiz_12',
                'nesjarhaugen_byrkjenes_quiz_13',
                'nesjarhaugen_byrkjenes_quiz_14'
              ]
            },
            keisarhaugen_frette: {
              expected: 11,
              keep: [
                'keisarhaugen_frette_quiz_2',
                'keisarhaugen_frette_quiz_3',
                'keisarhaugen_frette_quiz_4',
                'keisarhaugen_frette_quiz_6',
                'keisarhaugen_frette_quiz_7',
                'keisarhaugen_frette_quiz_8',
                'keisarhaugen_frette_quiz_9',
                'keisarhaugen_frette_quiz_10',
                'keisarhaugen_frette_quiz_11',
                'keisarhaugen_frette_quiz_12',
                'keisarhaugen_frette_quiz_13'
              ]
            },
            vardahaugen_lauareid: {
              expected: 12,
              keep: [
                'vardahaugen_lauareid_quiz_2',
                'vardahaugen_lauareid_quiz_3',
                'vardahaugen_lauareid_quiz_4',
                'vardahaugen_lauareid_quiz_5',
                'vardahaugen_lauareid_quiz_6',
                'vardahaugen_lauareid_quiz_7',
                'vardahaugen_lauareid_quiz_8',
                'vardahaugen_lauareid_quiz_9',
                'vardahaugen_lauareid_quiz_10',
                'vardahaugen_lauareid_quiz_11',
                'vardahaugen_lauareid_quiz_12',
                'vardahaugen_lauareid_quiz_13'
              ]
            }
          };

          for (const [targetId, cfg] of Object.entries(plan)) {
            const path = `data/quiz/historie/${targetId}_sets.json`;
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const keep = new Set(cfg.keep);
            const originalIds = data.sets.flatMap(set => set.questions.map(q => q.id));

            for (const set of data.sets) {
              set.questions = set.questions.filter(q => keep.has(q.id));
              set.questions.forEach((q, index) => {
                q.quiz_id = `${set.set_id}_q${index + 1}`;
              });
              if (set.questions.length < 3 || set.questions.length > 5) {
                throw new Error(`${targetId}: ${set.set_id} has ${set.questions.length} questions after revision`);
              }
            }

            const questions = data.sets.flatMap(set => set.questions);
            if (questions.length !== cfg.expected) {
              throw new Error(`${targetId}: expected ${cfg.expected}, got ${questions.length}`);
            }
            if (new Set(questions.map(q => q.id)).size !== questions.length) {
              throw new Error(`${targetId}: duplicate question ids`);
            }
            for (const id of cfg.keep) {
              if (!originalIds.includes(id)) throw new Error(`${targetId}: missing planned id ${id}`);
            }

            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          }
          NODE

      - name: Validate source-sized content balance
        run: |
          node <<'NODE'
          const fs = require('fs');
          const expected = {
            varhaug_nervik: { total: 10, concrete: 5, context: 3, concept: 2 },
            nesjarhaugen_byrkjenes: { total: 12, concrete: 6, context: 3, concept: 3 },
            keisarhaugen_frette: { total: 11, concrete: 6, context: 3, concept: 2 },
            vardahaugen_lauareid: { total: 12, concrete: 7, context: 3, concept: 2 }
          };
          for (const [targetId, want] of Object.entries(expected)) {
            const data = JSON.parse(fs.readFileSync(`data/quiz/historie/${targetId}_sets.json`, 'utf8'));
            const qs = data.sets.flatMap(s => s.questions);
            const got = {
              total: qs.length,
              concrete: qs.filter(q => ['fact', 'observation'].includes(q.question_type)).length,
              context: qs.filter(q => ['analysis', 'context', 'comparison'].includes(q.question_type)).length,
              concept: qs.filter(q => q.question_type === 'concept').length
            };
            if (JSON.stringify(got) !== JSON.stringify(want)) {
              throw new Error(`${targetId}: balance ${JSON.stringify(got)} != ${JSON.stringify(want)}`);
            }
            for (const q of qs) {
              if (q.targetId !== targetId || q.placeId !== targetId || q.question_scope !== 'place') {
                throw new Error(`${targetId}: invalid target contract in ${q.id}`);
              }
              if (!Array.isArray(q.options) || !q.options.includes(q.answer) || q.options[q.answerIndex] !== q.answer) {
                throw new Error(`${targetId}: invalid answer contract in ${q.id}`);
              }
            }
          }
          NODE

      - name: Rebuild canonical Knowledge links
        run: npm run knowledge:canonical:write

      - name: Run quiz and Knowledge validation
        run: |
          npm run audit:quiz-content
          npm run audit:quiz-templates
          npm run test:quiz-content-audit
          npm run knowledge:canonical:check

      - name: Remove temporary review files
        run: |
          rm -f .tmp/etne-quiz-sizing-review.json
          rm -f .tmp/trigger-etne-quiz-sizing.txt
          rm -f .github/workflows/review-etne-quiz-sizing.yml

      - name: Commit revised packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Revise Etne quizzes to source-sized question counts"
          git push
