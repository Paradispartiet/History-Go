name: Oslo Oppdag Kvadraturen batch 4 coordinates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-oppdag-kvadraturen-batch-4-coordinates.yml'

permissions:
  contents: write

jobs:
  coordinates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Resolve Tollpakkhuset identity variants with OSM Nominatim
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-batch-4/coordinates'
          mkdir -p "$outdir"
          : > "$outdir/tollpakkhuset_variant_status.txt"

          fetch_variant() {
            local slug="$1"
            local query="$2"
            local outfile="$outdir/${slug}_nominatim.json"
            curl --max-time 30 --retry 2 --fail --silent --show-error \
              -H 'User-Agent: History-Go coordinate audit (github.com/Paradispartiet/History-Go)' \
              --get 'https://nominatim.openstreetmap.org/search' \
              --data-urlencode 'format=jsonv2' \
              --data-urlencode "q=${query}, Oslo, Norge" \
              --data-urlencode 'countrycodes=no' \
              --data-urlencode 'limit=10' \
              --data-urlencode 'addressdetails=1' \
              --data-urlencode 'namedetails=1' \
              --data-urlencode 'polygon_geojson=1' \
              --data-urlencode 'viewbox=10.70,59.94,10.80,59.88' \
              --data-urlencode 'bounded=1' \
              -o "$outfile"
            printf '%s\t%s\t%s\n' "$slug" "$(jq 'length' "$outfile")" "$query" \
              | tee -a "$outdir/tollpakkhuset_variant_status.txt"
            sleep 1
          }

          fetch_variant tollpakkhuset_steinpakkhuset 'Steinpakkhuset'
          fetch_variant tollpakkhuset_stenpakkhuset 'Stenpakkhuset'
          fetch_variant tollpakkhuset_norsk_tollmuseum 'Norsk Tollmuseum'
          fetch_variant tollpakkhuset_tollboden 'Tollboden'
          fetch_variant tollpakkhuset_1a 'Tollbugata 1A'

      - name: Persist Tollpakkhuset coordinate evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/oslo-oppdag-kvadraturen-batch-4/coordinates
          git commit -m 'Resolve Tollpakkhuset coordinate identity'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
