name: Oslo Oppdag Kvadraturen batch 4 finalize

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-oppdag-kvadraturen-batch-4-coordinates.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Register batch sources
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/places/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const additions = [
            'places/historie/oslo/places_historie_oslo_oppdag_kvadraturen_batch_04.json',
            'places/by/oslo/places_by_oslo_oppdag_kvadraturen_batch_04.json',
            'places/naeringsliv/oslo/places_naeringsliv_oslo_oppdag_kvadraturen_batch_04.json'
          ];
          for (const file of additions) {
            if (!manifest.files.includes(file)) manifest.files.push(file);
          }
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          fs.mkdirSync('reports/oslo-oppdag-kvadraturen-batch-4/validation', { recursive: true });
          NODE

      - name: Validate JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          jq empty data/places/historie/oslo/places_historie_oslo_oppdag_kvadraturen_batch_04.json
          jq empty data/places/by/oslo/places_by_oslo_oppdag_kvadraturen_batch_04.json
          jq empty data/places/naeringsliv/oslo/places_naeringsliv_oslo_oppdag_kvadraturen_batch_04.json
          jq empty data/wonderkammer/oslo_oppdag_kvadraturen_microplaces_batch_1.json
          echo 'Batch 4 JSON syntax: OK' \
            | tee reports/oslo-oppdag-kvadraturen-batch-4/validation/json-syntax.txt

      - name: Build places index
        shell: bash
        run: |
          set -o pipefail
          npm run places:index:build \
            | tee reports/oslo-oppdag-kvadraturen-batch-4/validation/places-index-build.txt

      - name: Check places index
        shell: bash
        run: |
          set -o pipefail
          npm run places:index:check \
            | tee reports/oslo-oppdag-kvadraturen-batch-4/validation/places-index-check.txt

      - name: Check strict coordinate intake against branch merge-base
        shell: bash
        run: |
          set -o pipefail
          BASE="$(git merge-base HEAD origin/main)"
          COORD_INTAKE_BASE="$BASE" npm run places:coords:intake \
            | tee reports/oslo-oppdag-kvadraturen-batch-4/validation/coordinate-intake.txt

      - name: Check canonical emne IDs
        shell: bash
        run: |
          set -o pipefail
          npm run places:emner:check \
            | tee reports/oslo-oppdag-kvadraturen-batch-4/validation/emne-check.txt

      - name: Capture place health and hold baseline
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run health:places \
            | tee reports/oslo-oppdag-kvadraturen-batch-4/validation/health-places.txt
          HEALTH_STATUS=${PIPESTATUS[0]}
          set -e
          grep -q '^Errors: 40$' reports/oslo-oppdag-kvadraturen-batch-4/validation/health-places.txt
          echo "Raw health exit: ${HEALTH_STATUS}; baseline errors remain 40."

      - name: Check split manifest sync
        shell: bash
        run: |
          set -o pipefail
          npm run audit:places-split-manifest-sync \
            | tee reports/oslo-oppdag-kvadraturen-batch-4/validation/split-manifest-sync.txt

      - name: Check coordinate source contract
        shell: bash
        run: |
          set -o pipefail
          npm run test:coordinate-source-contract \
            | tee reports/oslo-oppdag-kvadraturen-batch-4/validation/coordinate-contract.txt

      - name: Check Wonderkammer parent integration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' | tee reports/oslo-oppdag-kvadraturen-batch-4/validation/wonderkammer-parent-check.txt
          const fs = require('fs');
          const places = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const ids = new Set(places.map((p) => p.id));
          const wk = JSON.parse(fs.readFileSync('data/wonderkammer/oslo_oppdag_kvadraturen_microplaces_batch_1.json', 'utf8'));
          const missing = wk.places.map((p) => p.place_id).filter((id) => !ids.has(id));
          if (missing.length) {
            console.error(`Missing Wonderkammer parent IDs: ${missing.join(', ')}`);
            process.exit(1);
          }
          if (!wk.places.some((p) => p.place_id === 'norges_bank_bankplassen_4')) {
            console.error('Expected Christiania Theater parent is missing from Wonderkammer batch.');
            process.exit(1);
          }
          console.log('Wonderkammer parent IDs resolve against places_index.json.');
          NODE

      - name: Check whitespace
        shell: bash
        run: |
          set -o pipefail
          git diff --check \
            | tee reports/oslo-oppdag-kvadraturen-batch-4/validation/git-diff-check.txt

      - name: Remove temporary workflow and commit final results
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/oslo-oppdag-kvadraturen-batch-4-coordinates.yml
          git add data/places/manifest.json
          git add data/places/places_index.json
          git add reports/oslo-oppdag-kvadraturen-batch-4/validation
          git add -u .github/workflows/oslo-oppdag-kvadraturen-batch-4-coordinates.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize Oppdag Kvadraturen batch 4'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
