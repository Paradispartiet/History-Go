name: Oslo Oppdag Kvadraturen batch 4 coordinates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-oppdag-kvadraturen-batch-4-coordinates.yml'

permissions:
  contents: write

jobs:
  coordinates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve addressed candidates
        shell: bash
        run: |
          set -u
          set -o pipefail
          outdir='reports/oslo-oppdag-kvadraturen-batch-4/coordinates'
          mkdir -p "$outdir"
          : > "$outdir/address_status.txt"

          run_lookup() {
            local slug="$1"
            local address="$2"
            set +e
            npm run places:coords:find:address -- --address "$address" \
              | tee "$outdir/${slug}_address.json"
            local status=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\t%s\n' "$slug" "$status" "$address" \
              | tee -a "$outdir/address_status.txt"
          }

          set -e
          run_lookup tollpakkhuset 'Tollbugata 1 Oslo'
          run_lookup ostbanestasjonen 'Jernbanetorget 1 Oslo'
          run_lookup norges_bank_bankplassen_4 'Bankplassen 4 Oslo'

      - name: Resolve named site geometries with OSM Nominatim
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-batch-4/coordinates'
          : > "$outdir/nominatim_status.txt"

          fetch_site() {
            local slug="$1"
            local query="$2"
            local outfile="$outdir/${slug}_nominatim.json"
            curl --max-time 30 --retry 2 --fail --silent --show-error \
              -H 'User-Agent: History-Go coordinate audit (github.com/Paradispartiet/History-Go)' \
              --get 'https://nominatim.openstreetmap.org/search' \
              --data-urlencode 'format=jsonv2' \
              --data-urlencode "q=${query}, Oslo, Norge" \
              --data-urlencode 'countrycodes=no' \
              --data-urlencode 'limit=10' \
              --data-urlencode 'addressdetails=1' \
              --data-urlencode 'namedetails=1' \
              --data-urlencode 'polygon_geojson=1' \
              --data-urlencode 'viewbox=10.60,60.05,10.95,59.85' \
              --data-urlencode 'bounded=1' \
              -o "$outfile"
            local count
            count="$(jq 'length' "$outfile")"
            printf '%s\t%s\t%s\n' "$slug" "$count" "$query" \
              | tee -a "$outdir/nominatim_status.txt"
            sleep 1
          }

          fetch_site kontraskjaeret 'Kontraskjæret'
          fetch_site tollpakkhuset 'Tollpakkhuset'
          fetch_site ostbanestasjonen 'Østbanehallen'
          fetch_site christian_frederiks_plass 'Christian Frederiks plass'
          fetch_site norges_bank_bankplassen_4 'Bankplassen 4'

      - name: Persist coordinate evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/oslo-oppdag-kvadraturen-batch-4/coordinates
          git commit -m 'Save Oppdag Kvadraturen batch 4 coordinate evidence'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
