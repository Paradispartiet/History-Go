name: Apply Oslo popupDesc V4 batch 04

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/oslo-popup-v4-batch-04-ten-protocol' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone, apply and commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir repo
          git clone --quiet --depth 1 --branch agent/oslo-popup-v4-batch-04-ten-protocol "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          cat .tmp/oslo-popup-v4-batch-04/payload-*.txt > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.gz
          gzip -t /tmp/payload.gz
          gunzip -c /tmp/payload.gz > /tmp/apply-oslo.js
          node /tmp/apply-oslo.js
          rm -rf .tmp/oslo-popup-v4-batch-04
          rm .github/workflows/oslo-popup-v4-batch-04.yml
          node -e "for (const f of process.argv.slice(1)) JSON.parse(require('fs').readFileSync(f, 'utf8'))" \
            data/places/by/oslo/places/kampen_kirke.json \
            data/places/by/oslo/places/ullevål_hageby.json \
            data/places/by/oslo/places/romsaås.json \
            data/places/by/oslo/places/grunerlokka_helgesens_tm.json \
            data/places/by/oslo/places/spikersuppa.json \
            data/places/by/oslo/places/bankplassen.json \
            data/places/by/oslo/places/christiania_torv.json \
            data/places/by/oslo/places/botsparken.json \
            data/places/by/oslo/places/slottsparken.json \
            data/places/by/oslo/places/tjuvholmen.json
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Revider fjerde gruppe på ti Oslo-steder"
          git push --quiet origin HEAD:agent/oslo-popup-v4-batch-04-ten-protocol
