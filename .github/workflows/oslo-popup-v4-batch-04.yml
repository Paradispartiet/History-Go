name: Apply Oslo popupDesc V4 batch 04

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/oslo-popup-v4-batch-04-ten-protocol' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone, apply and commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir repo
          git clone --quiet --depth 1 --branch agent/oslo-popup-v4-batch-04-ten-protocol "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          shopt -s nullglob
          payloads=(.tmp/oslo-popup-v4-batch-04/data/*.json)
          if [ "${#payloads[@]}" -ne 10 ] || [ ! -f .tmp/oslo-popup-v4-batch-04/protocol.md ]; then
            echo "Venter på komplett payload: ${#payloads[@]}/10"
            exit 0
          fi
          node <<'NODE'
          const fs = require('fs');
          const dir = '.tmp/oslo-popup-v4-batch-04/data';
          const files = fs.readdirSync(dir).filter((name) => name.endsWith('.json')).sort();
          const countWords = (s) => (s.match(/[A-Za-zÀ-ÖØ-öø-ÿ0-9]+(?:[–-][A-Za-zÀ-ÖØ-öø-ÿ0-9]+)*/g) || []).length;
          if (files.length !== 10) throw new Error(`Expected 10 payloads, got ${files.length}`);
          for (const name of files) {
            const payload = JSON.parse(fs.readFileSync(`${dir}/${name}`, 'utf8'));
            let src = fs.readFileSync(payload.path, 'utf8');
            const before = src;
            src = src.replace(/^  "desc": .*,$/m, `  "desc": ${JSON.stringify(payload.desc)},`);
            src = src.replace(/^  "popupDesc": .*,$/m, `  "popupDesc": ${JSON.stringify(payload.popupDesc)},`);
            if (src === before) throw new Error(`No change for ${payload.path}`);
            if (countWords(payload.desc) < 40 || countWords(payload.desc) > 80) throw new Error(`Invalid desc count for ${payload.path}`);
            if (countWords(payload.popupDesc) < 300) throw new Error(`Invalid popupDesc count for ${payload.path}`);
            if (payload.popupDesc.split('\n\n').length < 3) throw new Error(`Too few paragraphs for ${payload.path}`);
            JSON.parse(src);
            fs.writeFileSync(payload.path, src);
            console.log(`${payload.path}: ${countWords(payload.desc)} / ${countWords(payload.popupDesc)} / ${payload.popupDesc.split('\n\n').length}`);
          }
          fs.copyFileSync('.tmp/oslo-popup-v4-batch-04/protocol.md', 'reports/place-description-revision-protocol.md');
          NODE
          rm -rf .tmp/oslo-popup-v4-batch-04
          rm .github/workflows/oslo-popup-v4-batch-04.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Revider fjerde gruppe på ti Oslo-steder"
          git push --quiet origin HEAD:agent/oslo-popup-v4-batch-04-ten-protocol
