name: Fagverk Natur coverage

on:
  pull_request:
    paths:
      - 'fagverk.html'
      - 'fagverk-forside.html'
      - 'data/categories/category_contract.json'
      - 'data/fag/natur/**'
      - 'data/badges/natur.json'
      - 'data/fagverk/natur/**'
      - 'js/fagverk-subject-core.js'
      - 'js/fagverk-subject-model.js'
      - 'js/fagverk.js'
      - 'scripts/audit-fagverk-subject-inventory.mjs'
      - 'scripts/audit-fagverk-general-engine.mjs'
      - 'scripts/materialize-natur-biology-phase-1.mjs'
      - 'scripts/materialize-natur-biology-phase-2.mjs'
      - 'scripts/audit-natur-universal-coverage.mjs'
      - 'scripts/audit-fagverk-natur-pilot.mjs'
      - 'tools/audit-natur-theory-integrity.mjs'
      - 'tests/fagverk-subject-inventory.test.mjs'
      - 'tests/fagverk-general-engine.test.mjs'
      - 'tests/natur-universal-coverage.test.mjs'
      - 'tests/fagverk-natur-pilot.test.mjs'
      - 'tests/natur-theory-integrity.test.mjs'
      - 'reports/fagverk/**'
      - '.github/workflows/fagverk-natur-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'data/fag/natur/**'
      - 'data/fagverk/natur/**'
      - 'scripts/materialize-natur-biology-phase-1.mjs'
      - 'scripts/materialize-natur-biology-phase-2.mjs'
      - 'scripts/audit-natur-universal-coverage.mjs'
      - 'scripts/audit-fagverk-natur-pilot.mjs'
      - 'tools/audit-natur-theory-integrity.mjs'
      - 'tests/natur-universal-coverage.test.mjs'
      - 'tests/fagverk-natur-pilot.test.mjs'
      - 'tests/natur-theory-integrity.test.mjs'
      - 'reports/fagverk/**'
      - '.github/workflows/fagverk-natur-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Filnavnet beholdes for workflow-kontinuitet; porten validerer nå ærlig fagdekning og videre utbygging.
    name: Validate Nature coverage and expansion status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate syntax and deterministic reports
        run: |
          node --check scripts/materialize-natur-biology-phase-1.mjs
          node --check scripts/materialize-natur-biology-phase-2.mjs
          node --check scripts/audit-natur-universal-coverage.mjs
          node --check scripts/audit-fagverk-natur-pilot.mjs
          node --check tools/audit-natur-theory-integrity.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-natur-universal-coverage.mjs
          node scripts/audit-fagverk-natur-pilot.mjs
          node tools/audit-natur-theory-integrity.mjs
      - name: Validate Fagverk and Nature contracts
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/natur-universal-coverage.test.mjs
          node --test tests/fagverk-natur-pilot.test.mjs
          node --test tests/natur-theory-integrity.test.mjs
