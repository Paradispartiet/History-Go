name: One-off Vitenskap v4 embroidery proof
on:
  push:
    branches:
      - art/vitenskap-forskning-v4-embroidery-20261112
    paths:
      - scripts/revise-vitenskap-v4-embroidery.py
      - .github/workflows/oneoff-vitenskap-v4-embroidery.yml
permissions:
  contents: write
concurrency:
  group: science-v4-thread-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/vitenskap-forskning-v4-embroidery-20261112
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow numpy
      - name: Enhance only French lettering bands and keep the central illustration
        run: python scripts/revise-vitenskap-v4-embroidery.py --lang fr
      - name: Verify WebP and checksum against generated manifest
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image
          m=json.loads(Path('data/badges/vitenskap_forskning_v4_embroidered_candidates_20261112.json').read_text())
          assert len(m['items'])==1
          v=m['items'][0]
          assert v['locale']=='fr'
          data=Path(v['path']).read_bytes()
          assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
          assert hashlib.sha256(data).hexdigest()==v['sha256']
          with Image.open(v['path']) as im:
            assert im.size==(1024,1024)
          print('Validated candidate',v['gitBlobSha'])
          PY
      - name: Commit only non-active French candidate and audit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bilder/merker/vitenskap/kandidater/revisjoner/fr/forskning_og_metode-v4-broderi.webp
          git add bilder/merker/vitenskap/kandidater/revisjoner/fr/forskning_og_metode-v4-comparison.jpg
          git add data/badges/vitenskap_forskning_v4_embroidered_candidates_20261112.json
          if ! git diff --cached --quiet; then
            git commit -m 'art(science): French research v4 thread-relief preview candidate'
            git push
          fi
