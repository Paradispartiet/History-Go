name: Scenekunst venues batch 5

on:
  pull_request:
    branches:
      - agent/scenekunst-venues-04

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/scenekunst-venues-05
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply official Bærum address spelling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/add-scenekunst-venues-batch-5.mjs')
          s = p.read_text()
          old = "street: 'Claude Monets allé', number: 27"
          new = "street: 'Claude Monets alle', number: 27"
          if old not in s:
              raise SystemExit('Bærum address fragment not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f reports/scenekunst-new-venues-batch-5-runner-error.log

      - name: Build five venue packages
        id: venue_build
        shell: bash
        run: |
          set +e
          node tools/add-scenekunst-venues-batch-5.mjs > /tmp/scenekunst-batch-5.log 2>&1
          status=$?
          cat /tmp/scenekunst-batch-5.log
          if [ "$status" -ne 0 ]; then
            mkdir -p reports
            cp /tmp/scenekunst-batch-5.log reports/scenekunst-new-venues-batch-5-runner-error.log
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit diagnostic on builder failure
        if: steps.venue_build.outputs.failed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/scenekunst-new-venues-batch-5-runner-error.log
          git diff --cached --quiet || git commit -m "Record Scenekunst batch 5 failure"
          git push origin HEAD:agent/scenekunst-venues-05
          exit 1

      - name: Build tools and regenerate place index
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          npm run build:tools
          npm run places:index:build

      - name: Validate places and categories
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          bash scripts/check-places.sh
          npm run audit:categories

      - name: Mark report validated
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'reports/scenekunst-new-venues-batch-5-2026-07-23.json';
          const report = JSON.parse(fs.readFileSync(p, 'utf8'));
          report.status = 'validated';
          report.validatedAt = new Date().toISOString();
          report.validation = {
            geonorgeExactAddressLookup: 'pass',
            overlapAudit: 'pass',
            placesIndexBuild: 'pass',
            placesChecks: 'pass',
            categoryAudit: 'pass'
          };
          fs.writeFileSync(p, JSON.stringify(report, null, 2) + '\n');
          NODE

      - name: Commit production result
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/manifest.json
          git add data/places/places_index.json
          git add data/places/scenekunst/oslo/teater_manu.json
          git add data/places/scenekunst/oslo/dramatikkens_hus.json
          git add data/places/scenekunst/oslo/vega_scene.json
          git add data/places/scenekunst/akershus/baerum_kulturhus.json
          git add data/places/scenekunst/buskerud/drammens_teater.json
          git add reports/scenekunst-new-venues-batch-5-2026-07-23.json
          git add reports/scenekunst-new-venues-batch-5-2026-07-23.md
          git diff --cached --stat
          git diff --cached --quiet && { echo "No production changes produced"; exit 1; }
          git commit -m "Add fifth Scenekunst venue batch"
          git push origin HEAD:agent/scenekunst-venues-05
