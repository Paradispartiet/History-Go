name: Sync Oslo v1 Knowledge links (one-time)

on:
  push:
    branches:
      - production/minimum-v1-oslo-by-20261017
    paths:
      - .github/workflows/sync-v1-oslo-knowledge-once.yml

permissions:
  contents: write

jobs:
  sync-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Backfill canonical Knowledge IDs and generated index
        run: |
          npm run knowledge:canonical:write
          npm run knowledge:canonical:check
      - name: Commit source-safe Knowledge sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/quiz/by/bislett_minimum_v1_sets.json
          git add data/quiz/by/majorstuen_tbanestasjon_minimum_v1_sets.json
          git add data/quiz/by/nationaltheatret_stasjon_minimum_v1_sets.json
          git add data/quiz/by/voienvolden_minimum_v1_sets.json
          git add data/knowledge/knowledge_units.generated.json reports/knowledge-id-backfill.json
          if ! git diff --cached --quiet; then
            git commit -m 'Backfill canonical Knowledge links for 40 Oslo v1 questions'
            git push origin HEAD:production/minimum-v1-oslo-by-20261017
          fi
