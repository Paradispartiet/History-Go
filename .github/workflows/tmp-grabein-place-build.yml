name: Temporary Grabein place derived-data verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'data/places/historie/oslo/places_historie/museumsleiligheten_grabein.json'
      - 'data/leksikon/sprak/manifest.json'
      - 'data/fagverk/fagverk_registry.json'
      - '.github/workflows/tmp-grabein-place-build.yml'

permissions:
  contents: write

concurrency:
  group: tmp-grabein-place-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'place/museumsleiligheten-grabein-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build Places index
        run: npm run places:index:build
      - name: Build place-open
        run: npm run place-open:build
      - name: Build canonical Fagverk
        run: |
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
      - name: Derivation diff ownership check
        run: |
          git status --short
          node - <<'NODE'
          const {execFileSync}=require('node:child_process');
          const paths=execFileSync('git',['status','--porcelain','-uall'],{encoding:'utf8'}).split('\n').filter(Boolean).map(s=>s.slice(3));
          const allowed=p=>p.startsWith('reports/fagverk/')||p.startsWith('data/runtime/place-open/')||p.startsWith('data/places/places_index')||p==='data/fagverk/fagverk_release.json';
          const bad=paths.filter(p=>!allowed(p));
          if(bad.length){console.error('Unexpected generated files:',bad);process.exit(1);}
          console.log('All derived paths owned:', paths.length);
          NODE
      - name: Commit generated artifacts
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- reports/fagverk/ data/runtime/place-open/ data/places/places_index* data/fagverk/fagverk_release.json
          if ! git diff --cached --quiet; then
            git commit -m "Materialize Grabein derived Place and Fagverk data"
            git push origin "HEAD:$BRANCH"
          fi
      - name: Verify Fagverk and source integration
        run: |
          npm run place-open:check
          node --test tests/fagverk-place-pages.test.mjs tests/fagverk-place-rendering.test.mjs tests/fagverk-place-substance-audit.test.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run leksikon:ids:check
