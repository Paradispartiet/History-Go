name: Tjuvholmen official BAHR and Brandstrup runtime one-shot
on:
  pull_request:
    paths:
      - '.github/workflows/tjuvholmen-brands-runtime-one-shot.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tjuvholmen-all-brands-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/tjuvholmen-bahr-brandstrup-logos-20261112
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate Tjuvholmen official Brand runtime and enforce original hashes
        run: |
          npm run place-open:build
          node tests/tjuvholmen-brand-logo-contract.mjs
          npm run place-open:check
      - name: Commit only canonical Tjuvholmen Brand payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/place-open/tjuvholmen.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "build(tjuvholmen): sync three verified logo assets in Place-open runtime"
            git reset --hard HEAD
            git clean -fd
            git fetch origin content/tjuvholmen-bahr-brandstrup-logos-20261112
            git rebase origin/content/tjuvholmen-bahr-brandstrup-logos-20261112
            git push origin HEAD:content/tjuvholmen-bahr-brandstrup-logos-20261112
          fi
