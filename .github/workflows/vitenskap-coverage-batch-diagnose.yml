name: Vitenskap coverage batch diagnose

on:
  push:
    branches:
      - agent/vitenskap-editorial-coverage-repair-1
    paths:
      - '.github/workflows/vitenskap-coverage-batch-diagnose.yml'
  pull_request:
    paths:
      - '.github/workflows/vitenskap-coverage-batch-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inventory uncovered canonical emner
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const emners = read('data/fag/vitenskap/emner_vitenskap_canonical_v4_6.json');
          const mappings = read('data/fag/vitenskap/emnemapping_vitenskap_canonical_v4_6.json');
          const pensum = read('data/fag/vitenskap/vitenskappensum_canonical_v4_6.json');
          const registry = read('data/fagverk/fagverk_registry.json');
          const chapters = registry.subjects.vitenskap.chapters || [];
          const owned = new Set(chapters.flatMap((c) => c.emne_ids || []));
          const uncovered = emners.filter((e) => !owned.has(e.emne_id));
          const mappingById = new Map(mappings.map((m) => [m.emne_id, m]));
          const candidateKeys = ['domain_id','domain','family_id','family','subfield_id','subfield','area_id','area','fagomrade_id','fagomrade','category_id','category','strand_id','strand'];
          const groups = {};
          for (const key of candidateKeys) {
            const counts = {};
            for (const e of uncovered) {
              const m = mappingById.get(e.emne_id) || {};
              const value = e[key] ?? m[key];
              if (value !== undefined && value !== null) counts[String(value)] = (counts[String(value)] || 0) + 1;
            }
            if (Object.keys(counts).length) groups[key] = counts;
          }
          const report = {
            generated_from: process.env.GITHUB_SHA,
            summary: {
              total: emners.length,
              owned_unique_ids: owned.size,
              uncovered: uncovered.length,
              pensum: pensum.summary || null
            },
            groups,
            uncovered: uncovered.map((e) => ({
              emne_id: e.emne_id,
              title: e.title,
              registry_version: e.registry_version,
              definition: e.definition,
              why_it_matters: e.why_it_matters,
              key_questions: e.key_questions,
              methods: e.methods,
              mapping: mappingById.get(e.emne_id) || null
            }))
          };
          fs.mkdirSync('.tmp', { recursive: true });
          fs.writeFileSync('.tmp/vitenskap-coverage-diagnosis.json', JSON.stringify(report, null, 2) + '\n');
          console.log('SUMMARY', JSON.stringify(report.summary));
          console.log('GROUPS', JSON.stringify(report.groups));
          NODE
      - name: Persist diagnosis on repair branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp/vitenskap-coverage-diagnosis.json
          git commit -m 'Persist Vitenskap coverage diagnosis'
          git push origin HEAD:${GITHUB_REF_NAME}
