name: PlaceCard generated bundle sync (temporary)
on:
  push:
    branches:
      - fix/placecard-postmerge-build-browser-20261102
    paths:
      - .github/workflows/placecard-postmerge-build-fix.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build canonical browser bundles
        run: |
          npm ci --no-audit --no-fund
          npm run build:web
      - name: Commit generated Place Sheet bundle only
        shell: bash
        run: |
          set -euo pipefail
          changes="$(git status --porcelain -- dist/web)"
          echo "$changes"
          if [ -z "$changes" ]; then
            echo "Generated bundles already synchronized"
            exit 0
          fi
          other="$(git status --porcelain -- dist/web | grep -Ev 'dist/web/place-unified-surface.js(\.map)?$' || true)"
          if [ -n "$other" ]; then
            echo "Unexpected generated files: $other" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/web/place-unified-surface.js dist/web/place-unified-surface.js.map
          git commit -m 'build(web): sync Place Sheet runtime with canonical TypeScript'
          git push origin HEAD:fix/placecard-postmerge-build-browser-20261102
