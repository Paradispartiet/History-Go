name: Temporary Minneparken PD-historical-photo integration
on:
  push:
    branches:
      - content/minneparken-kildebasert-leksikon-20261103
    paths:
      - .github/workflows/minneparken-historical-photo-temp.yml
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/minneparken-kildebasert-leksikon-20261103
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve original public-domain photo from Commons and verify image
        shell: bash
        run: |
          set -euo pipefail
          target="bilder/places/minneparken_gamlebyen_2007.jpg"
          test ! -e "$target" || { echo "Refusing to overwrite existing photo"; exit 1; }
          mkdir -p bilder/places
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent "History-Go-Content-Audit/1.0 (PD historic photo provenance)" \
            --output "$target" \
            "https://upload.wikimedia.org/wikipedia/commons/8/82/Ruinparken1.JPG"
          file "$target"
          test "$(file -b --mime-type "$target")" = "image/jpeg"
          sha256sum "$target"
      - name: Integrate explicitly dated historical photo without altering review gates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='data/places/historie/oslo/places_historie_oslo_kultureiendommer_batch_11/minneparken_gamlebyen.json';
          const history=JSON.parse(fs.readFileSync('data/places/historie-production/minneparken_gamlebyen.json','utf8'));
          const p=JSON.parse(fs.readFileSync(file,'utf8'));
          if(p.id!=='minneparken_gamlebyen'||p.image||p.cardImage||p.frontImage)throw Error('Unexpected existing Minneparken photo');
          if(history.status!=='blocked'||history.gates.F.status!=='N/A')throw Error('Historie status must stay blocked');
          const photo='bilder/places/minneparken_gamlebyen_2007.jpg';
          const caption='Historisk fotografi av Minneparken 15. juli 2007, før avdekkingsarbeidene i 2024. Foto: Helge Høifødt (public domain).';
          p.image=photo;
          p.cardImage=photo;
          p.imageCaption=caption;
          p.imageCredit='Helge Høifødt / Wikimedia Commons';
          p.imageLicense='Public domain (PD-self)';
          p.imageSourceUrl='https://commons.wikimedia.org/wiki/File:Ruinparken1.JPG';
          p.imageMeta={
            source:'wikimedia_commons',
            sourcePage:'https://commons.wikimedia.org/wiki/File:Ruinparken1.JPG',
            creator:'Helge Høifødt',
            credit:p.imageCredit,
            license:p.imageLicense,
            licenseUrl:'https://commons.wikimedia.org/wiki/File:Ruinparken1.JPG#Licensing',
            assetType:'historical_documentary_photo',
            date:'2007-07-15',
            verifiedAt:'2026-11-03',
            historicalOnly:true,
            historicalCaption:caption,
            transformation:'Original JPEG, no crop or compositing.'
          };
          fs.writeFileSync(file,JSON.stringify(p,null,2)+'\n');
          NODE
          node --test tests/minneparken-historical-photo-provenance.test.mjs
          node --test tests/minneparken-quiz-source-parity.test.mjs
      - name: Commit only licensed image and place metadata to draft PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/places/minneparken_gamlebyen_2007.jpg
          git add data/places/historie/oslo/places_historie_oslo_kultureiendommer_batch_11/minneparken_gamlebyen.json
          git diff --cached --stat
          git diff --cached --quiet && { echo "No photo changes"; exit 1; }
          git commit -m "assets: add licensed, explicitly dated 2007 Minneparken documentary photo"
          git push origin HEAD:content/minneparken-kildebasert-leksikon-20261103
          echo "Historic photo integrated; Historie gate F remains N/A."
