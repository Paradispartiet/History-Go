name: House of Nerds one-shot Place-open sync
on:
  push:
    branches: [place/house-of-nerds-text-20261101]
    paths: [.github/workflows/hon-one-shot-place-open.yml]
permissions:
  contents: write
jobs:
  generate:
    if: github.ref == 'refs/heads/place/house-of-nerds-text-20261101'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild canonical place-open artifacts
        run: node scripts/build-place-open-payloads.mjs
      - name: Commit bounded generated runtime only
        shell: bash
        run: |
          set -eu
          git add -A -- data/runtime/
          changed=$(git diff --cached --name-only | wc -l)
          echo "Generated files changed: $changed"
          git diff --cached --name-only
          if [ "$changed" -gt 25 ]; then
            echo "Too many generated changes; require manual source review"
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync House of Nerds canonical place-open projection"
            git push origin HEAD:place/house-of-nerds-text-20261101
          fi
