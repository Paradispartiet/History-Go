name: Materialize Oslo v1 photos (one-time)
# Final incremental pass after accepting Commons CC BY-SA 3.0 Norway

on:
  push:
    branches:
      - production/oslo-v1-photo-batch-20261018
    paths:
      - .github/workflows/oslo-v1-photo-once.yml

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Materialize photos and source-licensed portrait/card assets
        run: python scripts/produce-oslo-v1-photos-20261018.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install JS tooling
        run: npm ci --no-audit --no-fund
      - name: Regenerate dependent place and epoch indices
        run: |
          npm run places:index:build
          npm run epoker:places:build
          npm run place-open:build
      - name: Commit materialized assets and related production data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bilder/places bilder/kort/places data/places data/epoker data/runtime
          git add data/places_index.json 2>/dev/null || true
          echo "Changed files included:"
          git diff --cached --stat | tail -25
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize licensed Oslo river and music photo assets in one batch'
            git push origin HEAD:production/oslo-v1-photo-batch-20261018
          fi
