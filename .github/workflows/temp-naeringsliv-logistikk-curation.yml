name: Temporary Næringsliv logistics-domain curation

on:
  pull_request:
    paths:
      - '.github/workflows/temp-naeringsliv-logistikk-curation.yml'

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Curate three logistics emners individually
        run: |
          node scripts/temp-curate-naeringsliv-byrom-emne.mjs
          node scripts/temp-curate-naeringsliv-havn-emne.mjs
          node scripts/temp-curate-naeringsliv-verdikjede-emne.mjs
          node scripts/temp-mark-naeringsliv-logistikk-curation.mjs
      - name: Regenerate Næringsliv production contexts
        run: |
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target telegrafbygningen --output data/quiz/production_context/naeringsliv/telegrafbygningen.json
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target oslo_posthus --output data/quiz/production_context/naeringsliv/oslo_posthus.json
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target havnelageret --output data/quiz/production_context/naeringsliv/havnelageret.json
      - name: Validate curation
        run: |
          npm run audit:quiz-templates
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run test:quiz-content-audit
          node <<'NODE'
          const fs=require('fs');
          const ids=['em_naering_byens_okonomiske_rom','em_naering_havn_transport','em_naering_logistikk_verdikjeder'];
          const all=JSON.parse(fs.readFileSync('data/fag/naeringsliv/emner_naeringsliv_canonical_v4_5.json','utf8'));
          const selected=ids.map(id=>all.find(item=>item.emne_id===id));
          if(selected.some(item=>!item))throw new Error('Mangler kuratert logistikkemne');
          const fields=['definition','why_it_matters','key_questions','conflicts','ideological_dimensions','analysis_axes','blindspots','generator_use_note','overlap_resolution_note','anti_patterns'];
          for(const field of fields){const values=selected.map(item=>JSON.stringify(item[field]));if(new Set(values).size!==3)throw new Error(`${field} er ikke individuelt`);}
          if(selected.some(item=>item.curation_status!=='individually_curated'))throw new Error('Kurateringsstatus mangler');
          const pensum=JSON.parse(fs.readFileSync('data/fag/naeringsliv/naeringslivpensum_canonical_v4_5.json','utf8'));
          if(pensum.summary.individually_curated_core_emne_count!==33)throw new Error('Kuraterte emner skal være 33');
          if(pensum.summary.remaining_core_emne_count!==3)throw new Error('Gjenstående emner skal være 3');
          if(pensum.content_curation.curated_domain_ids.length!==5)throw new Error('Fem domener skal være kuratert');
          NODE
      - name: Commit curated data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fag/naeringsliv/emner_naeringsliv_canonical_v4_5.json
          git add data/fag/naeringsliv/naeringslivpensum_canonical_v4_5.json
          git add data/quiz/production_context/naeringsliv/telegrafbygningen.json
          git add data/quiz/production_context/naeringsliv/oslo_posthus.json
          git add data/quiz/production_context/naeringsliv/havnelageret.json
          git commit -m 'Kurater logistikk- og romemnene individuelt'
          git push origin HEAD:${{ github.head_ref }}
