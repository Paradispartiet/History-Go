name: House of Nerds one-shot runtime regeneration for chronology
on:
  push:
    branches: [place/house-of-nerds-chronology-20261101]
    paths: [.github/workflows/hon-runtime-chronology-once.yml]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/place/house-of-nerds-chronology-20261101'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize deterministic place-open runtime
        run: node scripts/build-place-open-payloads.mjs
      - name: Verify runtime exact match
        run: node scripts/build-place-open-payloads.mjs --check
      - name: Commit runtime changes only with change-count guard
        shell: bash
        run: |
          set -eu
          git add -A -- data/runtime
          count=$(git diff --cached --name-only | wc -l | tr -d ' ')
          echo "Changed runtime assets: $count"
          git diff --cached --name-only
          if [ "$count" -gt 20 ]; then
            echo "Refusing broad generated runtime diff" >&2
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync House of Nerds lexicon and canonical place-open runtime"
            git push origin HEAD:place/house-of-nerds-chronology-20261101
          fi
