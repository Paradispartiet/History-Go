name: Oset 4x7 canonical migration (one-time)
on:
  pull_request:
    paths:
      - ".github/workflows/oset-quiz-knowledge-migrate-once-20261117.yml"
permissions:
  contents: write
concurrency:
  group: oset-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 7342
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate canonical History subject context
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-quiz-production-context.mjs --category historie --target frysjadammen --output data/quiz/production_context/historie/frysjadammen.json
          node scripts/build-quiz-production-context.mjs --category historie --target frysjadammen --output data/quiz/production_context/historie/frysjadammen.json --check
          node scripts/build-fagverk-release-manifest.mjs --output data/fagverk/fagverk_release.json
          node scripts/build-fagverk-release-manifest.mjs --output data/fagverk/fagverk_release.json --check
      - name: Generate Knowledge and QuizCard with source and ID parity
        run: |
          npm run knowledge:canonical:write
          npm run knowledge:canonical:check
          node scripts/sync-oset-slusebru-quizcard.mjs
          node scripts/sync-oset-slusebru-quizcard.mjs --check
          node --test tests/oset-quiz-migration-draft-guard.test.mjs
      - name: Verify full canonical quiz standards
        run: |
          node scripts/audit-quiz-production-context.mjs
          node scripts/audit-quiz-progression.mjs
          node scripts/audit-quiz-theory-binding.mjs
      - name: Publish only deterministic data and retire one-time workflow
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oset-quiz-knowledge-migrate-once-20261117.yml
          git status --short
          unexpected="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | grep -vE '^(\.github/workflows/oset-quiz-knowledge-migrate-once-20261117\.yml|data/quiz/production_context/historie/frysjadammen\.json|data/quiz/historie/frysjadammen_sets\.json|data/quizcards/historie/oset_slusebru_quizcard_v1\.json|data/fagverk/fagverk_release\.json|data/knowledge/(knowledge_units\.generated\.json|knowledge_emne_review_queue\.generated\.json)|reports/knowledge-id-backfill\.json)$' || true)"
          if [ -n "$unexpected" ]; then echo "Unexpected changed files: $unexpected"; exit 1; fi
          git add data/fagverk/fagverk_release.json
          git add data/quiz/production_context/historie/frysjadammen.json data/quiz/historie/frysjadammen_sets.json data/quizcards/historie/oset_slusebru_quizcard_v1.json data/knowledge/knowledge_units.generated.json data/knowledge/knowledge_emne_review_queue.generated.json reports/knowledge-id-backfill.json
          git commit -m "feat(oset): canonical 4x7 Knowledge and source-exact QuizCard with 32 archived legacy claims"
          git push origin "HEAD:refs/heads/$HEAD_REF"
