name: TEMP Materialize Sprak field9 field10
on:
  push:
    branches:
      - agent/fagverk-sprak-lingvistikk-field-9-fulltext-field-10-source-first-20260831

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized-field9-10]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize phase files
        run: node scripts/tmp-materialize-sprak-field9-field10-phase.mjs
      - name: Validate generated phase
        run: |
          node scripts/brief-sprak-lingvistikk-historical-linguistics-language-change-genealogy-contact-sources-v1.mjs
          node scripts/audit-sprak-lingvistikk-historical-linguistics-language-change-genealogy-contact-fulltext-v1.mjs
          node scripts/brief-sprak-lingvistikk-language-typology-universals-diversity-sources-v1.mjs
          node scripts/materialize-sprak-lingvistikk-historical-linguistics-language-change-genealogy-contact-fulltext-v1.mjs
          node --test tests/sprak-lingvistikk-historical-linguistics-language-change-genealogy-contact-fulltext-v1.test.mjs
          node --test tests/sprak-lingvistikk-language-typology-universals-diversity-source-brief-v1.test.mjs
          node --test tests/sprak-lingvistikk-reconciliation-v1.test.mjs
      - name: Remove temporary generator
        run: |
          rm -f .github/tmp/sprak-field9-10-payload-0.b64
          rm -f .github/tmp/sprak-field9-10-payload-1.b64
          rm -f .github/tmp/sprak-field9-10-payload-2.b64
          rm -f .github/tmp/sprak-field9-10-payload-3.b64
          rm -f scripts/tmp-materialize-sprak-field9-field10-phase.mjs
          rm -f .github/workflows/tmp-materialize-sprak-field9-field10.yml
      - name: Commit generated materialization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Materialize Språk og lingvistikk field 9 [materialized-field9-10]"
          git push
