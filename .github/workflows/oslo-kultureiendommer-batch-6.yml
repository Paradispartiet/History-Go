name: Oslo kultureiendommer batch 6 coordinate lookup

on:
  push:
    branches:
      - agent/oslo-kultureiendommer-batch-6

permissions:
  contents: write

jobs:
  coordinates:
    if: github.event.head_commit.message != 'Save Oslo kultureiendommer batch 6 coordinates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-kultureiendommer-batch-6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Find and save Geonorge address candidate
        run: |
          mkdir -p reports/oslo-kultureiendommer-batch-6/coordinates
          npm run places:coords:find:address -- --address "Odvar Solbergs vei 83 Oslo" \
            | tee reports/oslo-kultureiendommer-batch-6/coordinates/villa-romsli.json
      - name: Commit coordinate report
        run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add reports/oslo-kultureiendommer-batch-6/coordinates
          if git diff --cached --quiet; then
            echo "No coordinate report changes."
          else
            git commit -m "Save Oslo kultureiendommer batch 6 coordinates"
            git push
          fi
