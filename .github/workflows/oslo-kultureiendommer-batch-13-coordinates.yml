name: Oslo kultureiendommer batch 13 coordinates

on:
  push:
    branches:
      - agent/oslo-kultureiendommer-batch-13
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  coordinates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-kultureiendommer-batch-13
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve and save coordinate evidence
        shell: bash
        run: |
          mkdir -p reports/oslo-kultureiendommer-batch-13/coordinates
          npm run places:coords:find:address -- --address "Trondheimsveien 640 Oslo" \
            | tee reports/oslo-kultureiendommer-batch-13/coordinates/bankall_gard.json
          npm run places:coords:find:address -- --address "Kjelsåsveien 151C Oslo" \
            | tee reports/oslo-kultureiendommer-batch-13/coordinates/frysja_33.json
      - name: Persist coordinate results and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/oslo-kultureiendommer-batch-13-coordinates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/oslo-kultureiendommer-batch-13/coordinates .github/workflows/oslo-kultureiendommer-batch-13-coordinates.yml
          git commit -m "Save Oslo kultureiendommer batch 13 coordinate results"
          git push origin HEAD:agent/oslo-kultureiendommer-batch-13
