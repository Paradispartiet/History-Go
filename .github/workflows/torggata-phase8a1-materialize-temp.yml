name: Torggata phase 8A1 materialize temp

on:
  push:
    branches:
      - agent/torggata-phase8a1-people
    paths:
      - .github/workflows/torggata-phase8a1-materialize-temp.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/torggata-phase8a1-people
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Materialize existing People links and manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, value) => fs.writeFileSync(p, JSON.stringify(value, null, 2) + '\n');
          const addUnique = (arr, value) => {
            if (!Array.isArray(arr)) throw new Error(`Expected array while adding ${value}`);
            if (!arr.includes(value)) arr.push(value);
          };
          const addSourceUrl = (person, url) => {
            if (!Array.isArray(person.source_urls)) person.source_urls = [];
            addUnique(person.source_urls, url);
          };
          const addExternalSource = (person, label, url) => {
            if (!Array.isArray(person.externalLinks)) person.externalLinks = [];
            if (!person.externalLinks.some(link => link && link.url === url)) {
              person.externalLinks.push({ type: 'source', label, url, verifiedAt: '2026-08-11' });
            }
          };
          const appendSentence = (text, sentence) => text.includes(sentence) ? text : `${text} ${sentence}`;

          const historyPath = 'data/people/historie/oslo/people_historie_oslo.json';
          const history = read(historyPath);
          const thorvaldMatches = history.filter(person => person.id === 'thorvald_meyer');
          if (thorvaldMatches.length !== 1) throw new Error(`Expected exactly one thorvald_meyer, got ${thorvaldMatches.length}`);
          const thorvald = thorvaldMatches[0];
          if (thorvald.placeId !== 'birkelunden') throw new Error(`thorvald_meyer primary anchor changed: ${thorvald.placeId}`);
          addUnique(thorvald.places, 'torggata');
          addUnique(thorvald.tags, 'torggata');
          addUnique(thorvald.tags, 'torggata_bad');
          thorvald.popupDesc = appendSentence(
            thorvald.popupDesc,
            'Torggata legges til som et direkte sekundæranker fordi Meyer lot murmester Thøger Binneballe oppføre Bade- og Vadskeanstalten i Torggata 16 i 1861 og gav anlegget til Christiania kommune året etter.'
          );
          addSourceUrl(thorvald, 'https://oslobyleksikon.no/side/Torggata_bad');
          thorvald.verifiedAt = '2026-08-11';
          write(historyPath, history);

          const byPath = 'data/people/by/oslo/people_by_oslo.json';
          const byPeople = read(byPath);
          const bullMatches = byPeople.filter(person => person.id === 'henrik_bull');
          if (bullMatches.length !== 1) throw new Error(`Expected exactly one henrik_bull, got ${bullMatches.length}`);
          const bull = bullMatches[0];
          if (bull.placeId !== 'nationaltheatret') throw new Error(`henrik_bull primary anchor changed: ${bull.placeId}`);
          addUnique(bull.places, 'torggata');
          addUnique(bull.tags, 'torggata');
          addUnique(bull.tags, 'fahlstroms_theater');
          if (!Array.isArray(bull.works)) throw new Error('henrik_bull works missing');
          if (!bull.works.some(work => work && work.id === 'fahlstroms_theater_henrik_bull')) {
            bull.works.push({
              id: 'fahlstroms_theater_henrik_bull',
              title: 'Ombyggingen til Fahlstrøms Theater',
              year: 1903,
              material: 'ombygging i jugendstil',
              place: 'Torggata 9, Kristiania',
              summary: 'Eldorado ble bygget om i jugendstil etter Bulls tegninger før Fahlstrøms Theater åpnet 22. august 1903.'
            });
          }
          bull.popupDesc = appendSentence(
            bull.popupDesc,
            'Torggata legges til som et direkte sekundæranker fordi Bull tegnet jugendombyggingen av Eldorado i Torggata 9 før Fahlstrøms Theater åpnet der i 1903.'
          );
          addExternalSource(bull, 'Oslo byleksikon – Fahlstrøms Theater', 'https://oslobyleksikon.no/side/Fahlstr%C3%B8ms_Theater');
          addSourceUrl(bull, 'https://oslobyleksikon.no/side/Fahlstr%C3%B8ms_Theater');
          bull.verifiedAt = '2026-08-11';
          write(byPath, byPeople);

          const manifestPath = 'data/people/manifest.json';
          const manifest = read(manifestPath);
          if (!Array.isArray(manifest.files)) throw new Error('People manifest files array missing');
          for (const path of [
            'people/by/oslo/torggata/thoger_binneballe.json',
            'people/by/oslo/torggata/harald_olsen.json',
            'people/litteratur/oslo/torggata/alma_fahlstrom.json',
            'people/litteratur/oslo/torggata/johan_fahlstrom.json'
          ]) addUnique(manifest.files, path);
          write(manifestPath, manifest);
          NODE

          git diff --check
          git diff --exit-code --quiet -- data/people/historie/oslo/people_historie_oslo.json && { echo 'thorvald_meyer was not materialized'; exit 1; } || true
          git diff --exit-code --quiet -- data/people/by/oslo/people_by_oslo.json && { echo 'henrik_bull was not materialized'; exit 1; } || true
          git diff --exit-code --quiet -- data/people/manifest.json && { echo 'people manifest was not materialized'; exit 1; } || true

      - name: Commit materialized files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/people/historie/oslo/people_historie_oslo.json data/people/by/oslo/people_by_oslo.json data/people/manifest.json
          git commit -m "Materialiser Torggata 8A1 eksisterende People-koblinger"
          git push origin HEAD:agent/torggata-phase8a1-people
