name: TEMP Kunstnerforbundet R6 People audit

on:
  push:
    branches:
      - agent/kunstnerforbundet-place-production-r2-20260913

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: agent/kunstnerforbundet-place-production-r2-20260913
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit canonical People claims
        run: node tools/audit-people-profile-canonical.mjs --require-claims

      - name: Remove temporary workflow after PASS
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-kunstnerforbundet-r6-people-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-kunstnerforbundet-r6-people-audit.yml
          git commit -m 'Remove temporary R6 People audit workflow'
          git push origin HEAD:agent/kunstnerforbundet-place-production-r2-20260913
