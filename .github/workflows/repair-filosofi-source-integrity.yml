name: Repair Philosophy source integrity

on:
  push:
    branches:
      - agent/philosophy-quality-repair-source-integrity
    paths:
      - 'scripts/repair-filosofi-source-integrity.mjs'
      - '.github/workflows/repair-filosofi-source-integrity.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/philosophy-quality-repair-source-integrity
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize debate-aligned source integrity
        shell: bash
        run: |
          set +e
          node scripts/repair-filosofi-source-integrity.mjs > /tmp/filosofi-materialize.log 2>&1
          code=$?
          cat /tmp/filosofi-materialize.log
          if [ "$code" -ne 0 ]; then
            mkdir -p reports
            cp /tmp/filosofi-materialize.log reports/filosofi-source-integrity-materialize-error.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add reports/filosofi-source-integrity-materialize-error.log
            git commit -m 'Persist Philosophy materializer failure'
            git push origin HEAD:agent/philosophy-quality-repair-source-integrity
            exit "$code"
          fi
      - name: Verify source-integrity gate
        shell: bash
        run: |
          set +e
          node --test tests/fagverk-filosofi-source-integrity.test.mjs > /tmp/filosofi-source-integrity-gate.log 2>&1
          code=$?
          cat /tmp/filosofi-source-integrity-gate.log
          if [ "$code" -ne 0 ]; then
            mkdir -p reports
            cp /tmp/filosofi-source-integrity-gate.log reports/filosofi-source-integrity-gate-error.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add reports/filosofi-source-integrity-gate-error.log
            git commit -m 'Persist Philosophy source-integrity gate failure'
            git push origin HEAD:agent/philosophy-quality-repair-source-integrity
            exit "$code"
          fi
      - name: Verify existing Philosophy final-quality gate
        shell: bash
        run: |
          set +e
          node --test tests/fagverk-filosofi-final-quality.test.mjs > /tmp/filosofi-final-quality-gate.log 2>&1
          code=$?
          cat /tmp/filosofi-final-quality-gate.log
          if [ "$code" -ne 0 ]; then
            mkdir -p reports
            cp /tmp/filosofi-final-quality-gate.log reports/filosofi-final-quality-gate-error.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add reports/filosofi-final-quality-gate-error.log
            git commit -m 'Persist Philosophy final-quality gate failure'
            git push origin HEAD:agent/philosophy-quality-repair-source-integrity
            exit "$code"
          fi
      - name: Verify existing Philosophy university-depth gate
        run: node --test tests/fagverk-filosofi-university-depth.test.mjs
      - name: Commit materialized repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No repair changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fagverk/filosofi/articles data/fagverk/filosofi/filosofi_article_registry_v1.json data/fagverk/filosofi/filosofi_completion_v1.json
          git commit -m 'Materialize Philosophy source integrity repair'
          git push origin HEAD:agent/philosophy-quality-repair-source-integrity
