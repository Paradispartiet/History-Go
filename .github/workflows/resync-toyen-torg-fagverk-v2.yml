name: Resync Tøyen torg Fagverk v2

on:
  push:
    branches:
      - work/toyen-torg-fagverk-v2-20260901
    paths:
      - .github/workflows/resync-toyen-torg-fagverk-v2.yml

permissions:
  contents: write

jobs:
  resync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Merge current main and reset shared generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge -X ours --no-edit origin/main
          git checkout origin/main -- \
            data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            data/places/place_image_backlog_summary.json \
            data/places/places_index.json \
            data/runtime/place-open/toyen_torg.json \
            reports/fagverk/fagverk-place-page-coverage-v2.json
      - name: Reapply Tøyen registry and image backlog delta
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const placePath = 'data/places/by/oslo/places/toyen_torg.json';
          const registryPath = 'data/fagverk/fagverk_registry.json';
          const backlogPath = 'data/places/place_image_backlog_summary.json';
          const place = JSON.parse(fs.readFileSync(placePath, 'utf8'));
          if (place.fagverk?.schema !== 'history_go_place_fagverk_v2' || place.fagverk?.status !== 'curated') {
            throw new Error('Tøyen curated Fagverk source was not preserved during main sync');
          }
          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          registry.placeLinks ||= {};
          registry.placeLinks.toyen_torg = {
            sourceFile: 'places/by/oslo/places/toyen_torg.json',
            field: 'fagverk',
            schema: 'history_go_place_fagverk_v2',
            level: 'full',
            status: 'curated'
          };
          fs.writeFileSync(registryPath, JSON.stringify(registry, null, 2) + '\n');

          const mainPlace = JSON.parse(cp.execFileSync('git', ['show', 'origin/main:data/places/by/oslo/places/toyen_torg.json'], { encoding: 'utf8' }));
          const mainStale = mainPlace.image === 'bilder/places/toyen_torg.JPG' && mainPlace.cardImage === 'bilder/kort/places/toyen_torg.PNG';
          const currentRemote = /^https?:\/\//.test(place.image || '') && /^https?:\/\//.test(place.cardImage || '');
          if (mainStale && currentRemote) {
            const backlog = JSON.parse(fs.readFileSync(backlogPath, 'utf8'));
            backlog.generatedAt = '2026-09-01';
            backlog.generatedFromCommit = 'toyen_torg_fagverk_v2_resync_20260901';
            backlog.summary.validRemote += 1;
            backlog.summary.invalidLocalPath -= 1;
            backlog.summary.remaining -= 1;
            backlog.byCategory.by.valid += 1;
            backlog.byCategory.by.invalid -= 1;
            fs.writeFileSync(backlogPath, JSON.stringify(backlog, null, 2) + '\n');
          }
          NODE
      - name: Regenerate canonical and Fagverk state
        run: |
          npm run places:index:build
          node scripts/build-place-open-payloads.mjs
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate generated canonical state
        run: |
          npm run places:index:check
          node scripts/build-place-open-payloads.mjs --check
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Validate Fagverk contracts
        run: |
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/fagverk-place-rendering.test.mjs
          node --test tests/fagverk-place-substance-audit.test.mjs
          node --test tests/fagverk-link-audit.test.mjs
      - name: Validate Tøyen torg remote image
        env:
          PLACE_IMAGE_REMOTE_FETCH_TIMEOUT_MS: '45000'
        run: node scripts/audit-place-images.mjs --mode=changed --require-any-place-image --require-remote-image
      - name: Verify full place image backlog
        run: node scripts/audit-place-images.mjs --mode=all --report=/tmp/place-image-audit.json --verify-summary=data/places/place_image_backlog_summary.json
      - name: Validate generated web runtime
        run: npm run build:web:check
      - name: Validate diff whitespace
        run: git diff --check
      - name: Commit resynced production result
        run: |
          git add \
            data/places/by/oslo/places/toyen_torg.json \
            data/places/places_index.json \
            data/places/place_image_backlog_summary.json \
            data/runtime/place-open/toyen_torg.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/fagverk-place-page-coverage-v2.json
          git rm .github/workflows/resync-toyen-torg-fagverk-v2.yml
          git diff --cached --quiet && { echo "No resync changes to commit"; exit 1; }
          git commit -m "Resync Tøyen torg Fagverk v2"
          git push origin HEAD:${GITHUB_REF_NAME}
