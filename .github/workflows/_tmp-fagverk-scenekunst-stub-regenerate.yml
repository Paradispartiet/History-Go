name: Fagverk IA v3 Scenekunst stub regenerate probe

on:
  pull_request:
    paths:
      - 'data/fag/scenekunst/**'
      - 'data/fagverk/fagverk_portal.json'
      - 'scripts/audit-fagverk-scenekunst-*.mjs'
      - 'tests/fagverk-scenekunst-*.test.mjs'
      - 'reports/fagverk/scenekunst-phase3-audit.json'
      - 'reports/fagverk/general-engine-audit.json'
      - '.github/workflows/_tmp-fagverk-scenekunst-stub-regenerate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-and-clean:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Scenekunst stub retirement and regenerate deterministic reports
        run: |
          node scripts/audit-fagverk-scenekunst-legacy-stub.mjs
          node scripts/audit-fagverk-scenekunst-phase3.mjs --write-report
          node scripts/audit-fagverk-scenekunst-phase3.mjs
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/fagverk-scenekunst-legacy-stub-retirement.test.mjs tests/fagverk-scenekunst-phase3.test.mjs tests/fagverk-badge-equivalence.test.mjs
      - name: Commit generated reports and remove probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/_tmp-fagverk-scenekunst-stub-regenerate.yml
          git add reports/fagverk/scenekunst-phase3-audit.json reports/fagverk/general-engine-audit.json .github/workflows/_tmp-fagverk-scenekunst-stub-regenerate.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Regenerate Scenekunst route audits'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
