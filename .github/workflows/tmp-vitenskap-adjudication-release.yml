name: Temporary Vitenskap adjudication release materializer

on:
  push:
    branches:
      - agent/fagverk-ia-v3-vitenskap-legacy-adjudication-20260830
    paths:
      - '.github/workflows/tmp-vitenskap-adjudication-release.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build release manifest
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Commit generated release manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fagverk/fagverk_release.json
          if git diff --cached --quiet; then
            echo 'Release manifest already current.'
            exit 0
          fi
          git commit -m 'Regenerate Vitenskap adjudication release manifest'
          git push origin HEAD:${{ github.ref_name }}
