name: Oslo bolk 05 - two remaining v4.2 scoped final
on:
  push:
    branches:
      - research/oslo-sentrum-bolk05-tekst-20261101
    paths:
      - .github/workflows/oslo-bolk05-v42-finalize-20261102.yml
permissions:
  contents: write
concurrency:
  group: oslo-bolk05-v42-finalize-20261102
  cancel-in-progress: false
jobs:
  finalize:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate and finish only Historisk museum and Blitzhuset
        run: |
          node --check scripts/finish-oslo-bolk05-v42.mjs
          node scripts/finish-oslo-bolk05-v42.mjs
      - name: Verify all six v4.2 production packets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {validatePacket} from './scripts/validate-place-description-production-v4_2.mjs';
          const ids=['folketeateret','kunstnernes_hus','historisk_museum','ibsen_museum_teater','blitzhuset','kulturkirken_jakob_litteratur'];
          for(const id of ids){
            const file='data/places/production/'+id+'.json';
            const packet=JSON.parse(fs.readFileSync(file,'utf8'));
            const place=JSON.parse(fs.readFileSync(packet.placeFile,'utf8'));
            const issues=validatePacket({packet,place,packetFile:file}).issues;
            if(packet.status!=='ready_v4_2'||issues.length){
              console.error(id,packet.status,issues);
              process.exitCode=1;
            }else console.log(id,'ready_v4_2',packet.claims.length,'verified claims');
            const runtime=JSON.parse(fs.readFileSync('data/runtime/place-open/'+id+'.json','utf8'));
            if(runtime.place.id!==id||runtime.place.desc!==place.desc||runtime.place.popupDesc!==place.popupDesc)throw Error('Runtime/Place drift '+id);
          }
          NODE
          node scripts/build-oslo-bolk05-quizzes.mjs --check
      - name: Regenerate and verify only derived epoch index
        run: |
          npm run epoker:places:build
          npm run epoker:places:check
      - name: Commit bounded two-place production
        env:
          BRANCH_NAME: research/oslo-sentrum-bolk05-tekst-20261101
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/places/historie/oslo/places_historie/historisk_museum.json data/places/subkultur/oslo/places_subkultur/blitzhuset.json
          git add -- data/places/production/historisk_museum.json data/places/production/blitzhuset.json
          git add -- data/runtime/place-open/historisk_museum.json data/runtime/place-open/blitzhuset.json
          git add -- data/epoker/epoke-place-index.json
          git rm -- .github/workflows/oslo-bolk05-v42-finalize-20261102.yml .github/workflows/oslo-bolk05-final-v42-once.yml
          git diff --cached --check
          git commit -m "Finish Historisk museum and Blitzhuset source-reviewed v4.2 packages"
          git fetch origin "$BRANCH_NAME"
          if [ "$(git rev-parse "origin/$BRANCH_NAME")" != "$(git rev-parse HEAD^)" ]; then
            echo "::error::Branch changed during run; refuse overwrite"
            exit 1
          fi
          git push origin "HEAD:$BRANCH_NAME"
