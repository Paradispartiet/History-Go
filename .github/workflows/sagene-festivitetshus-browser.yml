name: Sagene festivitetshus browser acceptance
on:
  push:
    branches: [work/oslo-akerselva-v1-bolk-20261116]
    paths:
      - '.github/workflows/sagene-festivitetshus-browser.yml'
      - 'tests/sagene-festivitetshus-quiz-browser.mjs'
      - 'data/runtime/place-open/sagene_festivitetshus.json'
      - 'data/quiz/historie/sagene_festivitetshus_sets.json'
      - 'data/quizcards/historie/sagene_festivitetshus_quizcard_v1.json'
      - 'bilder/places/sagene_festivitetshus_*.webp'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/sagene-festivitetshus-quiz-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sagene-festivitetshus-browser
          path: artifacts/sagene_festivitetshus-4x7-real-app/
