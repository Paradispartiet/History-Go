name: TEMP Birkelunden brand materialize

on:
  push:
    branches:
      - agent/content-factory-pilot-02-birkelunden-canonical-completion
    paths:
      - '.github/workflows/tmp-birkelunden-brand-materialize.yml'
      - 'scripts/tmp-materialize-birkelunden-brand.mjs'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-birkelunden-brand-materialize.yml'
      - 'scripts/tmp-materialize-birkelunden-brand.mjs'

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref == 'agent/content-factory-pilot-02-birkelunden-canonical-completion') && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Download official Bondens marked logo
        run: |
          mkdir -p bilder/kort/brands
          curl --fail --location --retry 3 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 History-Go/1.0' \
            --referer 'https://bondensmarked.no/om-oss/bilder' \
            --header 'Accept: image/svg+xml,image/*,*/*;q=0.8' \
            'https://bondensmarked.no/bm-logo.svg' \
            --output bilder/kort/brands/bondens_marked.svg
          grep -q '<svg' bilder/kort/brands/bondens_marked.svg

      - name: Materialize canonical brand and mapping
        run: node scripts/tmp-materialize-birkelunden-brand.mjs

      - name: Validate JSON and asset
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/brands/brands_master.json','utf8')); JSON.parse(require('fs').readFileSync('data/brands/brands_by_place.json','utf8'));"
          test -s bilder/kort/brands/bondens_marked.svg

      - name: Commit one-shot output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/brands/brands_master.json data/brands/brands_by_place.json bilder/kort/brands/bondens_marked.svg
          if git diff --cached --quiet; then
            echo 'No materialized changes.'
            exit 0
          fi
          git commit -m 'Materialize Birkelunden Bondens marked brand [skip ci]'
          git push origin HEAD:${TARGET_BRANCH}
