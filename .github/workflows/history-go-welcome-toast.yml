name: History Go welcome and toast regression

on:
  pull_request:
    paths:
      - 'js/ui/onboarding-welcome.js'
      - 'js/ui/toast.js'
      - 'css/onboarding.css'
      - 'tests/history-go-toast-onboarding-handoff.test.js'
      - 'tests/civication-history-go-mode.test.js'
      - 'tests/civication-history-go-task-bridge.test.js'
      - 'tests/civication-history-go-mission-badge-points.test.js'
      - 'js/Civication/systems/civicationHistoryGoTaskBridge.js'
      - 'tests/onboarding-touch-guard.test.js'
      - '.github/workflows/history-go-welcome-toast.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify onboarding and Civication toast behavior
        run: |
          node tests/history-go-toast-onboarding-handoff.test.js
          node tests/onboarding-touch-guard.test.js
          node tests/civication-history-go-mode.test.js
          node tests/civication-history-go-mission-badge-points.test.js
          node tests/civication-history-go-task-bridge.test.js
