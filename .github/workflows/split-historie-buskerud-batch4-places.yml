name: Split Historie Buskerud batch 4 places

# Split aggregate batch 4 into per-place files on this data branch.
on:
  workflow_dispatch:
  push:
    branches:
      - data/split-buskerud-batch4-places

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/split-buskerud-batch4-places
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/split-historie-buskerud-batch4-places.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/historie/buskerud/places_historie_buskerud_batch4 data/places/historie/buskerud/places_historie_buskerud_batch4_manifest.json data/places/historie/buskerud/places_historie_buskerud_batch4_index.json data/places/historie/buskerud/places_historie_buskerud_batch4_split_report.txt
          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Generate split Historie Buskerud batch 4 place files"
            git push
          fi
