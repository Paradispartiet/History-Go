name: Temporary Investor final verification

on:
  push:
    branches:
      - civication/naeringsliv-investor-role-world
    paths:
      - .github/workflows/tmp-investor-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rebuild verified Investor state
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('.github/workflows/tmp-investor-author-v2.yml','utf8');
          const start="          node <<'NODE'\n";
          const end="\n          NODE\n          node scripts/audit-civication-life-position-role-world-readiness.mjs --write";
          const a=text.indexOf(start),b=text.indexOf(end,a+start.length);
          if(a<0||b<0) throw new Error('Investor v2 authoring script boundaries not found');
          let script=text.slice(a+start.length,b).split('\n').map(line=>line.startsWith('          ')?line.slice(10):line).join('\n');
          script=script.replaceAll('likviditet','betalingsberedskap').replaceAll('Likviditet','Betalingsberedskap');
          fs.writeFileSync('/tmp/author-investor-final.js',script);
          NODE
          node /tmp/author-investor-final.js
          node <<'NODE'
          const fs=require('fs');
          const p='tests/civication-gallerist-life-position-readiness.test.js';
          let s=fs.readFileSync(p,'utf8');
          const old="const unrelated=['naeringsliv/investor'].map(key=>audit.positions.find(x=>x.key===key));";
          const next="const unrelated=['scenekunst/dramaturg'].map(key=>audit.positions.find(x=>x.key===key));";
          if(!s.includes(old)) throw new Error('stale Gallerist Investor sentinel not found');
          s=s.replace(old,next);
          fs.writeFileSync(p,s);
          NODE
          node scripts/audit-civication-life-position-role-world-readiness.mjs --write
      - name: Verify complete Investor state
        run: |
          node tests/civication-naeringsliv-investor-authored-depth.test.js
          node tests/civication-gallerist-life-position-readiness.test.js
          node scripts/build-civication-scene-registry.mjs --check
          npm run test:civication
      - name: Commit verified Investor Role World
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm \
            .github/workflows/tmp-investor-author.yml \
            .github/workflows/tmp-investor-recover.yml \
            .github/workflows/tmp-investor-author-v2.yml \
            .github/workflows/tmp-investor-leak-repair.yml \
            .github/workflows/tmp-investor-finalize.yml
          git add data/Civication reports/civication-life-position-role-world-readiness.md tests/civication-*.test.js
          git diff --cached --check
          git commit -m "Civication: author Næringsliv Investor Role World"
          git push origin HEAD:civication/naeringsliv-investor-role-world
