name: TEMP Film TV theory canon diagnosis

on:
  pull_request:
    paths:
      - 'data/fag/TV_og_Film/**'
      - 'data/fagverk/film_tv/**'
      - '.github/workflows/film-tv-theory-canon-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Print research/theory anchors by Film TV domain
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const reg=JSON.parse(fs.readFileSync('data/fagverk/fagverk_registry.json','utf8')).subjects.film_tv;
          const grouped=new Map();
          for(const ch of reg.chapters){
            const domain=ch.primary_domain_id||ch.primaryDomainId;
            if(!grouped.has(domain))grouped.set(domain,{emnes:new Set(),sources:new Map(),claims:[]});
            const g=grouped.get(domain); for(const id of ch.emne_ids||[])g.emnes.add(id);
            const doc=JSON.parse(fs.readFileSync(ch.claimsFile,'utf8'));
            for(const s of doc.sources||[]){
              const text=`${s.type||''} ${s.evidence_role||''} ${s.publisher||''}`;
              if(/peer|scholar|academic|journal|book|monograph|research|methodolog|university press/i.test(text))g.sources.set(s.id,s);
            }
            for(const c of doc.claims||[]){
              const text=`${c.claim||''} ${c.kind||''} ${c.evidence_mode||''} ${c.evidence_role||''}`;
              if(/theor|model|framework|construct|method|spectator|affect|identif|reception|historiograph|representation|gaze|genre|narrat|serial|platform|public sphere|archive|memory|heritage|documentary|evidence/i.test(text))g.claims.push(c);
            }
          }
          for(const [domain,g] of grouped){
            console.log(`\n=== DOMAIN ${domain} | EMNES=${g.emnes.size} | SCHOLARLY_SOURCES=${g.sources.size} | THEORYLIKE_CLAIMS=${g.claims.length} ===`);
            for(const s of [...g.sources.values()].slice(0,30))console.log(`SOURCE ${s.id} | ${s.author||s.creators||''} | ${s.title||''} | ${s.publisher||''} | ${s.type||''} | ${s.evidence_role||''}`);
            for(const c of g.claims.slice(0,20))console.log(`CLAIM ${c.id} | ${c.emne_id||c.topic_id||''} | ${(c.source_ids||[]).join(',')} | ${String(c.claim||'').slice(0,320)}`);
          }
          NODE
