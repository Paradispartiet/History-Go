name: TEMP Utdanning Didaktikk materialize
on:
  push:
    branches:
      - agent/utdanning-didaktikk-fulltext-v1
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify fresh main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
      - name: Repair materializer emner write
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='scripts/materialize-utdanning-didactics-fulltext-v1.mjs';
          const before=fs.readFileSync(file,'utf8');
          const oldText='write(P.emner,emners=emner)';
          if (before.includes(oldText)) fs.writeFileSync(file,before.replace(oldText,'write(P.emner,emner)'));
          const after=fs.readFileSync(file,'utf8');
          if(!after.includes('write(P.emner,emner)') || after.includes(oldText)) throw new Error('Materializer repair failed');
          NODE
      - name: Audit next source-first port
        run: node scripts/brief-utdanning-early-childhood-learning-sources-v1.mjs --write-report
      - name: Materialize Didaktikk 2 of 14
        run: node scripts/materialize-utdanning-didactics-fulltext-v1.mjs
      - name: Audit Didaktikk fulltext
        run: node scripts/audit-utdanning-didactics-fulltext-v1.mjs --write-report
      - name: Audit Fagverk subject inventory
        run: node scripts/audit-fagverk-subject-inventory.mjs --write-report --no-check-report
      - name: Audit Fagverk general engine
        run: node scripts/audit-fagverk-general-engine.mjs --write-report --no-check-report
      - name: Audit Fagverk theory quality
        run: node scripts/audit-fagverk-theory-quality.mjs --write-report --no-check-report
      - name: Audit Fagverk theory integrity
        run: node scripts/audit-fagverk-theory-integrity.mjs --write-report --no-check-report
      - name: Build Fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Commit materialized 2 of 14 locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/materialize-utdanning-didactics-fulltext-v1.mjs data/fag/fag_manifest.json data/fag/utdanning data/fagverk reports/fagverk
          if ! git diff --cached --quiet; then git commit -m "Materialize Utdanning Didaktikk at 2/14"; fi
      - name: Canonical next source-first check
        run: node scripts/brief-utdanning-early-childhood-learning-sources-v1.mjs
      - name: Canonical deterministic Didaktikk rematerialization
        run: node scripts/materialize-utdanning-didactics-fulltext-v1.mjs
      - name: Canonical Didaktikk audit check
        run: node scripts/audit-utdanning-didactics-fulltext-v1.mjs
      - name: Canonical shared inventory check
        run: node scripts/audit-fagverk-subject-inventory.mjs
      - name: Canonical shared general-engine check
        run: node scripts/audit-fagverk-general-engine.mjs
      - name: Canonical shared theory-quality check
        run: node scripts/audit-fagverk-theory-quality.mjs
      - name: Canonical shared theory-integrity check
        run: node scripts/audit-fagverk-theory-integrity.mjs
      - name: Canonical release check
        run: node scripts/build-fagverk-release-manifest.mjs --check
      - name: Test early-childhood source brief
        run: node --test tests/utdanning-early-childhood-learning-source-brief-v1.test.mjs
      - name: Test Didaktikk fulltext
        run: node --test tests/utdanning-didactics-fulltext-v1.test.mjs
      - name: Test Fagverk subject inventory
        run: node --test tests/fagverk-subject-inventory.test.mjs
      - name: Test Fagverk general engine
        run: node --test tests/fagverk-general-engine.test.mjs
      - name: Test Fagverk release manifest
        run: node --test tests/fagverk-release-manifest.test.mjs
      - name: Canonical deterministic output diff
        run: >-
          git diff --exit-code --
          data/fag/utdanning
          data/fagverk/utdanning
          data/fagverk/fagverk_registry.json
          data/fagverk/subject_status.json
          data/fagverk/fagverk_release.json
          reports/fagverk
      - name: Full canonical Utdanning registry CI
        run: node scripts/run-utdanning-domain-ci-v1.mjs
      - name: Push materialized head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:${GITHUB_REF_NAME}
