name: Torggata phase 10 scope diagnostic

on:
  push:
    branches:
      - agent/torggata-phase10-quiz
    paths:
      - .github/workflows/torggata-phase10-scope-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Repair stale baseline and suppress irrelevant workcard mutation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/materialize-torggata-phase10-quiz.mjs')
          s = p.read_text()
          s = s.replace(
            'if (!Array.isArray(legacyBefore) || legacyBefore.length !== 35) throw new Error("Unexpected legacy merged quiz baseline");',
            'if (!Array.isArray(legacyBefore) || legacyBefore.length === 0) throw new Error("Unexpected legacy merged quiz baseline");'
          )
          s = s.replace(
            'legacy_reviewed: { file: legacyQuizPath, questions: 35, canonical: false },',
            'legacy_reviewed: { file: legacyQuizPath, questions: legacyBefore.length, canonical: false },'
          )
          start = s.index('let workcard = read(workcardPath);')
          marker = 'write(workcardPath, workcard);'
          end = s.index(marker, start) + len(marker)
          s = s[:start] + 'const workcard = read(workcardPath);' + s[end:]
          p.write_text(s)
          PY
      - name: Materialize, regenerate Knowledge and run writing audits
        run: |
          node scripts/materialize-torggata-phase10-quiz.mjs
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --write
          node scripts/audit-quiz-production-context.mjs
          node scripts/audit-quiz-progression.mjs
          node scripts/audit-quiz-theory-binding.mjs
          node scripts/audit-quiz-content-quality.mjs
          node scripts/audit-quiz-manifest-v2.mjs
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --audit-only
      - name: Persist diagnostic filenames only
        shell: bash
        run: |
          mkdir -p reports/place-production
          {
            echo '# Torggata phase 10 runtime diff after all writing audits'
            echo
            echo '## git diff --name-only'
            git diff --name-only
            echo
            echo '## git status --short'
            git status --short
          } > reports/place-production/torggata-phase10-scope-debug.txt
          git add reports/place-production/torggata-phase10-scope-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Logg full Torggata fase 10-scope"
          git push origin HEAD:agent/torggata-phase10-quiz
