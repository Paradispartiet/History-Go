name: Natur subject quality

on:
  pull_request:
    paths:
      - 'data/fag/natur/**'
      - 'data/fagverk/natur/**'
      - 'js/fagverk-subject-core.js'
      - 'js/fagverk.js'
      - 'scripts/materialize-natur-biology-phase-1.mjs'
      - 'scripts/materialize-natur-biology-phase-2.mjs'
      - 'scripts/audit-natur-subject-quality.mjs'
      - 'scripts/audit-natur-fagkart-quality.mjs'
      - 'scripts/audit-natur-universal-coverage.mjs'
      - 'scripts/audit-fagverk-natur-pilot.mjs'
      - 'tests/natur-subject-quality.test.mjs'
      - 'tests/natur-fagkart-quality.test.mjs'
      - 'tests/natur-universal-coverage.test.mjs'
      - 'tests/fagverk-natur-pilot.test.mjs'
      - 'reports/fagverk/natur-quality-audit.json'
      - 'reports/fagverk/natur-fagkart-quality-audit.json'
      - 'reports/fagverk/natur-universal-coverage-audit.json'
      - 'reports/fagverk/natur-pilot-audit.json'
      - '.github/workflows/natur-subject-quality.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate Natur quality and universal coverage
        run: |
          node --check scripts/materialize-natur-biology-phase-1.mjs
          node --check scripts/materialize-natur-biology-phase-2.mjs
          node --check scripts/audit-natur-subject-quality.mjs
          node --check scripts/audit-natur-fagkart-quality.mjs
          node --check scripts/audit-natur-universal-coverage.mjs
          node --check scripts/audit-fagverk-natur-pilot.mjs
          node scripts/audit-natur-subject-quality.mjs
          node scripts/audit-natur-fagkart-quality.mjs
          node scripts/audit-natur-universal-coverage.mjs
          node scripts/audit-fagverk-natur-pilot.mjs
          node --test tests/natur-subject-quality.test.mjs tests/natur-fagkart-quality.test.mjs tests/natur-universal-coverage.test.mjs tests/fagverk-natur-pilot.test.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node --test tests/fagverk-general-engine.test.mjs tests/fagverk-subject-inventory.test.mjs
          npm run typecheck:web
