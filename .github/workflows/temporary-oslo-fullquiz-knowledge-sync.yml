name: Temporary Oslo fullquiz Knowledge sync
# Retry after earlier run lost the branch update race; no other edits during this run.
on:
  push:
    branches:
      - content/oslo-fullquiz-fact-quality-20261021
    paths:
      - .github/workflows/temporary-oslo-fullquiz-knowledge-sync.yml
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/oslo-fullquiz-fact-quality-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Synchronize all relevant canonical Knowledge data
        run: |
          npm ci --no-audit --no-fund
          npm run knowledge:canonical:write
          npm run knowledge:canonical:check
      - name: Commit canonical Knowledge output
        shell: bash
        run: |
          git add -- \
            data/quiz/kunst/munch_museet_sets.json \
            data/quiz/kunst/nasjonalmuseet_sets.json \
            data/quiz/naeringsliv/oslo_gassverk_sets_merged.json \
            data/quiz/subkultur/brugata_storgata_rusmiljo_sets.json \
            data/knowledge/knowledge_units.generated.json \
            data/knowledge/knowledge_emne_review_queue.generated.json \
            data/knowledge/subjects/subkultur/knowledge_units.generated.json \
            reports/knowledge-id-backfill.json
          if git diff --cached --quiet; then
            echo 'Knowledge canonical output in sync'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(knowledge): synchronize subject-level quiz Knowledge'
          git pull --rebase origin content/oslo-fullquiz-fact-quality-20261021
          git push origin HEAD:refs/heads/content/oslo-fullquiz-fact-quality-20261021
