name: House of Nerds integration regeneration (temporary)
on:
  push:
    branches:
      - place/house-of-nerds-integration-20261102
    paths:
      - .github/workflows/house-of-nerds-integration-build.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate canonical quiz and Knowledge data
        run: |
          node scripts/build-quiz-production-context.mjs --category subkultur --target house_of_nerds --output data/quiz/production_context/subkultur/house_of_nerds.json
          npm run knowledge:canonical:write
      - name: Regenerate Fagverk and People projections
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          npm run civication:history-people:build
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - name: Regenerate epochs and Place-open projections
        run: |
          npm run epoker:places:build
          npm run place-open:build
      - name: Review bounded generated diff and commit
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --stat
          changed=$(git diff --name-only | wc -l)
          echo "Generated changed files: $changed"
          test "$changed" -le 80
          git add -A -- data/fagverk/fagverk_release.json data/knowledge/ data/quiz/subkultur/house_of_nerds_sets.json data/quiz/production_context/subkultur/house_of_nerds.json reports/knowledge-id-backfill.json data/Civication/historyPeople_index.json data/Civication/scenarioPeople/ data/Civication/scenarioPeople_index.json data/epoker/epoke-place-index.json data/runtime/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Regenerate integrated House of Nerds runtime and Knowledge projections'
            git push origin HEAD:place/house-of-nerds-integration-20261102
          fi
