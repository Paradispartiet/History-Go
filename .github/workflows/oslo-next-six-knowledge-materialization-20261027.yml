name: Oslo remaining five canonical quiz and Knowledge materialization
on:
  push:
    branches: [research/oslo-sentrum-v1-six-next-20261027]
    paths:
      - 'data/quiz/by/egertorget_sets.json'
      - 'data/quiz/production_briefs/**'
      - 'scripts/materialize-oslo-next-six-quizcards-20261027.mjs'
      - 'tests/oslo-next-six-quiz-parity.test.mjs'
      - 'data/quiz/historie/kontraskjaeret_sets.json'
      - 'data/quiz/historie/palehaven_paleet_sets.json'
      - 'data/quiz/historie/avisen_tiden_radhusgata_10_sets.json'
      - 'data/quiz/historie/mustadgarden_kongens_gate_3_sets.json'
      - '.github/workflows/oslo-next-six-knowledge-materialization-20261027.yml'
permissions:
  contents: write
concurrency:
  group: oslo-next-six-knowledge-materialization
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-v1-six-next-20261027
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile main and validate five-place canonical production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git show HEAD:data/fagverk/fagverk_registry.json > /tmp/pr-oslo-fagverk-registry.json
            set +e
            git merge --no-commit --no-ff origin/main
            result=$?
            set -e
            if [ "$result" -ne 0 ]; then
              expected=$(printf '%s\n' \
                data/fag/fag_manifest.json \
                data/fagverk/fagverk_registry.json \
                data/fagverk/fagverk_release.json \
                data/knowledge/knowledge_units.generated.json \
                data/quiz/manifest.json \
                data/quizcards/by/manifest.json \
                data/quizcards/historie/manifest.json \
                reports/knowledge-id-backfill.json | LC_ALL=C sort)
              actual=$(git diff --name-only --diff-filter=U | LC_ALL=C sort)
              if [ "$expected" != "$actual" ]; then
                echo "Unexpected conflicts; refusing unsafe automatic merge"
                printf 'UNEXPECTED_CONFLICTS:\n%s\n' "$actual"
                exit 1
              fi
              while IFS= read -r f; do
                git checkout --theirs -- "$f"
                git add -- "$f"
              done <<< "$actual"
            fi
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='data/fagverk/fagverk_registry.json';
          const main=JSON.parse(fs.readFileSync(p,'utf8'));
          const pr=JSON.parse(fs.readFileSync('/tmp/pr-oslo-fagverk-registry.json','utf8'));
          const scope=['kontraskjaeret','palehaven_paleet','avisen_tiden_radhusgata_10','egertorget','mustadgarden_kongens_gate_3'];
          for(const id of scope){
            if(!pr.placeLinks?.[id])throw Error('Missing scoped Fagverk link: '+id);
            if(main.placeLinks?.[id] && JSON.stringify(main.placeLinks[id])!==JSON.stringify(pr.placeLinks[id]))throw Error('Conflicting existing Fagverk link: '+id);
            main.placeLinks[id]=pr.placeLinks[id];
          }
          for(const id of ['wessels_plass','ostbanestasjonen','valerenga_kirke','voldslokka_pumptrack']){
            if(!main.placeLinks?.[id])throw Error('Previously merged Fagverk link lost: '+id);
          }
          fs.writeFileSync(p,JSON.stringify(main,null,2)+'\n');
          NODE
          fi
          test -f data/quiz/by/wessels_plass_sets.json
          test -f data/quiz/by/ostbanestasjonen_sets.json
          node scripts/materialize-oslo-next-six-quizcards-20261027.mjs
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-epoke-place-index.mjs
          node scripts/build-place-open-payloads.mjs
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --check
          node --test tests/oslo-next-six-quiz-parity.test.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          git add -A
          count=$(git diff --cached --name-only | wc -l)
          echo "STAGED_FILE_COUNT=$count"
          if [ "$count" -gt 450 ]; then
            echo "Too many generated changes; refusing unexpected bulk write"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Canonical files are already current"
            exit 0
          fi
          git commit -m "Integrate current main while preserving five Oslo v1 places and canonical quizzes"
          git push origin HEAD:research/oslo-sentrum-v1-six-next-20261027
