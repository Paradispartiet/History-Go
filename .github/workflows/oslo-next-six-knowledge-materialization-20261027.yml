name: Oslo next six canonical Knowledge materialization
on:
  push:
    branches: [research/oslo-sentrum-v1-six-next-20261027]
    paths:
      - 'data/quiz/by/egertorget_sets.json'
      - 'data/quiz/by/wessels_plass_sets.json'
      - 'data/quiz/historie/kontraskjaeret_sets.json'
      - 'data/quiz/historie/palehaven_paleet_sets.json'
      - 'data/quiz/historie/avisen_tiden_radhusgata_10_sets.json'
      - 'data/quiz/historie/mustadgarden_kongens_gate_3_sets.json'
      - '.github/workflows/oslo-next-six-knowledge-materialization-20261027.yml'
permissions:
  contents: write
concurrency:
  group: oslo-next-six-knowledge-materialization
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-v1-six-next-20261027
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate Knowledge with the existing canonical builder
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f data/quiz/historie/kontraskjaeret_sets.json; then
            echo "Quiz recovery checkpoint has not been uploaded yet."
            exit 0
          fi
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --write
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --check
          git add data/knowledge/knowledge_units.generated.json reports/knowledge-id-backfill.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate canonical Knowledge for the reviewed Oslo quizzes"
          git push origin HEAD:research/oslo-sentrum-v1-six-next-20261027
