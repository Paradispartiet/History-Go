name: TEMP Bogstadveien brand asset discovery

on:
  push:
    branches:
      - control/bogstadveien-brand-assets-20260904

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Discover official brand asset candidates
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request, urllib.parse
          pages = {
            'by_timo':'https://bytimo.com/',
            'henri_lloyd':'https://www.henrilloyd.com/',
            'janus':'https://www.janus.no/',
            'moo':'https://www.moo.no/',
            'varsity_headwear':'https://varsityheadwear.com/'
          }
          ua='History-Go-place-production/1.0 (https://github.com/Paradispartiet/History-Go)'
          for brand,url in pages.items():
            print(f'=== {brand} {url} ===')
            req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                html=r.read().decode('utf-8','ignore')
                base=r.geturl()
                print('STATUS',r.status,'FINAL',base,'BYTES',len(html))
            except Exception as e:
              print('FETCH_ERROR',repr(e)); continue
            candidates=[]
            for m in re.finditer(r'''(?is)(?:src|href|content)=["']([^"']+)["']''',html):
              raw=m.group(1).strip()
              low=raw.lower()
              if any(k in low for k in ['logo','wordmark','brandmark','header','favicon']):
                candidates.append(urllib.parse.urljoin(base,raw))
            # also capture nearby tags whose alt/class/id mention logo
            for tag in re.findall(r'(?is)<(?:img|source|link|meta)\b[^>]*>',html):
              low=tag.lower()
              if not any(k in low for k in ['logo','wordmark','brandmark']): continue
              for attr in ['src','srcset','href','content']:
                mm=re.search(rf'''(?is)\b{attr}=["']([^"']+)["']''',tag)
                if mm:
                  for raw in mm.group(1).split(','):
                    raw=raw.strip().split(' ')[0]
                    if raw: candidates.append(urllib.parse.urljoin(base,raw))
            seen=[]
            for c in candidates:
              if c not in seen: seen.append(c)
            for c in seen[:30]: print('CANDIDATE',c)
            print('COUNT',len(seen))
          PY

      - name: Discover Blue Master historical source
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.parse, re
          ua='History-Go-place-production/1.0 (https://github.com/Paradispartiet/History-Go)'
          title='Bogstadveien 53 OB.Ø64 1727.jpg'
          api='https://commons.wikimedia.org/w/api.php?action=query&format=json&prop=imageinfo&iiprop=url%7Cextmetadata&titles=File:'+urllib.parse.quote(title)
          req=urllib.request.Request(api,headers={'User-Agent':ua})
          with urllib.request.urlopen(req,timeout=30) as r:
            data=r.read().decode('utf-8','ignore')
            print('COMMONS_API',data)
          PY
