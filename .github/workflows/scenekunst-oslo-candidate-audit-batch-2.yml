name: Scenekunst Oslo candidate audit batch 2

on:
  push:
    branches:
      - agent/scenekunst-source-migration-01

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/scenekunst-source-migration-01
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit all active Oslo places
        run: node scripts/audit-scenekunst-oslo-candidates-batch-2.mjs

      - name: Publish audit and remove one-shot runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/scenekunst-oslo-candidates-batch-2-2026-07-21.json
          git add reports/scenekunst-oslo-candidates-batch-2-2026-07-21.md
          git rm scripts/audit-scenekunst-oslo-candidates-batch-2.mjs
          git rm .github/workflows/scenekunst-oslo-candidate-audit-batch-2.yml
          git commit -m "Audit remaining Oslo Scenekunst candidates"
          git push origin HEAD:agent/scenekunst-source-migration-01
