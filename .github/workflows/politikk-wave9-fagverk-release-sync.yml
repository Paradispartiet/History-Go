name: Politikk wave 9 Fagverk release sync

on:
  push:
    branches:
      - 'feature/politikk-hungary-comparison-wave9-ready-20261021'
    paths:
      - '.github/workflows/politikk-wave9-fagverk-release-sync.yml'
      - 'data/places/**'
      - 'data/quiz/politikk/politikk_subject_pathways_v1.json'

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/politikk-hungary-comparison-wave9-ready-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild and validate the canonical Fagverk release
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          git diff --check
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != "data/fagverk/fagverk_release.json" ]; then
            echo "Unexpected Fagverk build output: $changed"
            exit 1
          fi
      - name: Commit canonical release output only
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk/fagverk_release.json
          git commit -m "build(fagverk): refresh release manifest for Politikk wave 9"
          git push origin HEAD:feature/politikk-hungary-comparison-wave9-ready-20261021
