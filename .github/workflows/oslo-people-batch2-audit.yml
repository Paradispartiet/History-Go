name: Oslo People zero-gap batch 2 materialize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-people-zero-gap-batch2
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize batch
        run: npx tsx tools/materialize-oslo-people-zero-gap-batch2.mts

      - name: Publish clean data commit
        run: |
          rm -f tools/audit-oslo-people-batch2-candidates.mts
          rm -f tools/materialize-oslo-people-zero-gap-batch2.mts
          rm -f .github/workflows/oslo-people-batch2-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f reports/people-oslo-zero-gap-batch2-validation.md
          git diff --cached --check
          git commit -m "Add Oslo People zero-gap batch 2"
          git push origin HEAD:agent/oslo-people-zero-gap-batch2
