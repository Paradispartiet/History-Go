name: Tjuvholmen single-purpose places index correction
on:
  push:
    branches:
      - fix/tjuvholmen-places-index-imagemeta-20261113
    paths:
      - '.github/workflows/tjuvholmen-index-once.yml'
permissions:
  contents: write
jobs:
  sync-index:
    if: github.repository == 'Paradispartiet/History-Go' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tjuvholmen-places-index-imagemeta-20261113
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run canonical places-index generator and verify the exact scope
        shell: bash
        run: |
          set -euo pipefail
          cp data/places/places_index.json /tmp/tjuvholmen-places-index-before.json
          npm run places:index:build
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const before=JSON.parse(fs.readFileSync('/tmp/tjuvholmen-places-index-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('data/places/places_index.json','utf8'));
          assert.equal(after.length,before.length,'Unexpected place index length change');
          let updated=0;
          for(let i=0;i<before.length;i++){
            const a=structuredClone(after[i]),b=structuredClone(before[i]);
            assert.equal(a.id,b.id,'Unexpected place reorder');
            if(a.id==='tjuvholmen'){
              assert.equal(Object.hasOwn(b,'imageMeta'),false,'Tjuvholmen was not missing imageMeta');
              assert.ok(a.imageMeta?.sourcePage,'Tjuvholmen source metadata not generated');
              delete a.imageMeta;
              updated++;
            }
            assert.deepStrictEqual(a,b,'Unexpected other index change at '+i+' '+a.id);
          }
          assert.equal(updated,1,'Expected exactly one Tjuvholmen metadata repair');
          console.log('TJUVHOLMEN_IMAGE_META_ONLY_DIFF_PASS');
          JS
          npm run places:index:check
      - name: Commit exactly one generated index file
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "data/places/places_index.json"
          git add -- data/places/places_index.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(tjuvholmen): restore imageMeta in generated places index'
          git push origin HEAD:fix/tjuvholmen-places-index-imagemeta-20261113
