name: Temporary Civication reachability diagnosis

on:
  push:
    branches:
      - fix/civication-legacy-jobbmails-reachability

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/civication-legacy-jobbmails-reachability
          fetch-depth: 0
      - name: Apply source patch in workspace only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/audit-civication-scene-pipeline.mjs')
          s = p.read_text()
          s = s.replace(
            'const DEFAULT_LEGACY_PLAN_TYPES = Object.freeze([\n',
            'const LEGACY_INVENTORY_SCENE_ROOTS = Object.freeze([\n  "data/Civication/jobbmails"\n]);\n\nconst DEFAULT_LEGACY_PLAN_TYPES = Object.freeze([\n',
            1
          )
          helper = '''function isLegacyInventorySceneSource(sourcePath) {\n  const relative = norm(sourcePath).replace(/\\\\/g, "/");\n  return LEGACY_INVENTORY_SCENE_ROOTS.some(\n    (root) => relative === root || relative.startsWith(`${root}/`)\n  );\n}\n\nexport function findDuplicateSceneIds(sceneRecords, ignoredSourceFiles = []) {\n  const ignored = ignoredSourceFiles instanceof Set\n    ? ignoredSourceFiles\n    : new Set(uniq(ignoredSourceFiles));\n  const ids = new Map();\n  for (const record of Array.isArray(sceneRecords) ? sceneRecords : []) {\n    if (!norm(record?.id)) continue;\n    if (ignored.has(record.source_path) || isLegacyInventorySceneSource(record.source_path)) continue;\n    if (!ids.has(record.id)) ids.set(record.id, []);\n    ids.get(record.id).push(record);\n  }\n  return [...ids.entries()]\n    .filter(([, rows]) => rows.length > 1)\n    .map(([id, rows]) => ({\n      id,\n      occurrences: rows.map((row) => ({\n        path: row.source_path,\n        pointer: row.pointer,\n        type: row.mail_type,\n        family: row.mail_family\n      }))\n    }))\n    .sort((a, b) => a.id.localeCompare(b.id, "en"));\n}\n\n'''
          marker = 'export function auditRepository(repoRoot = DEFAULT_REPO_ROOT) {\n'
          assert marker in s
          s = s.replace(marker, helper + marker, 1)
          start = s.index('  const compilerIgnoredSourceFiles = new Set(uniq(compiledRegistry?.ignored_source_files));\n')
          end = s.index('\n\n  const missingInternalReferences = [];', start)
          s = s[:start] + '  const compilerIgnoredSourceFiles = new Set(uniq(compiledRegistry?.ignored_source_files));\n  const duplicateSceneIds = findDuplicateSceneIds(sceneRecords, compilerIgnoredSourceFiles);' + s[end:]
          p.write_text(s)
          PY
      - name: Capture diagnosis
        shell: bash
        run: |
          set +e
          node --input-type=module <<'NODE' > .tmp-civication-reachability-diagnostic.log 2>&1
          import { auditRepository, DEFAULT_REPO_ROOT, findDuplicateSceneIds } from './scripts/audit-civication-scene-pipeline.mjs';
          const audit = auditRepository(DEFAULT_REPO_ROOT);
          const legacySources = [
            'data/Civication/jobbmails/byCivic.json',
            'data/Civication/jobbmails/mediaCivic.json',
            'data/Civication/jobbmails/naeringCivic.json'
          ];
          const inventoried = new Set((audit.inventory?.formats || []).flatMap((row) => row.paths || []));
          const synthetic = findDuplicateSceneIds([
            { id: 'runtime_duplicate_probe', source_path: 'data/Civication/mailFamilies/probe/a.json' },
            { id: 'runtime_duplicate_probe', source_path: 'data/Civication/mailFamilies/probe/b.json' },
            { id: 'legacy_duplicate_probe', source_path: 'data/Civication/jobbmails/a.json' },
            { id: 'legacy_duplicate_probe', source_path: 'data/Civication/jobbmails/b.json' }
          ]);
          console.log(JSON.stringify({
            import_ok: true,
            summary: audit.summary,
            duplicate_ids: (audit.inventory?.duplicate_scene_ids || []).map((row) => row.id),
            duplicate_occurrences: audit.inventory?.duplicate_scene_ids || [],
            legacy_inventory: Object.fromEntries(legacySources.map((source) => [source, inventoried.has(source)])),
            synthetic_duplicate_ids: synthetic.map((row) => row.id)
          }, null, 2));
          NODE
          status=$?
          echo "node_exit=$status" >> .tmp-civication-reachability-diagnostic.log
          cat .tmp-civication-reachability-diagnostic.log
      - name: Commit diagnosis only
        shell: bash
        run: |
          git restore scripts/audit-civication-scene-pipeline.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-civication-reachability-diagnostic.log
          git commit -m "chore: capture Civication reachability diagnosis"
          git push origin HEAD:fix/civication-legacy-jobbmails-reachability
