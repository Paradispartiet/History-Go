name: TEMP Fagverk theory quality baseline diagnosis

on:
  pull_request:
    paths:
      - 'data/fag/fagverk_theory_quality_contract_v1.json'
      - 'scripts/audit-fagverk-theory-quality.mjs'
      - '.github/workflows/fagverk-theory-quality-baseline-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Identify active Musikk JSON parse failures
        run: |
          while IFS= read -r -d '' file; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file" || { echo "INVALID_JSON=$file"; exit 1; }
          done < <(find data/fag/musikk data/fagverk/musikk -type f -name '*.json' ! -path '*/arkiv/*' ! -path '*/archive/*' -print0)
      - name: Print tightened theory-quality baseline
        run: |
          node --check scripts/audit-fagverk-theory-quality.mjs
          node scripts/audit-fagverk-theory-quality.mjs --no-check-report --diagnostic
