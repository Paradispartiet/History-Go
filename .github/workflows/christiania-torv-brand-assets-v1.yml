name: Christiania Torv brand finish (one-shot)

on:
  push:
    branches:
      - content/christiania-torv-brands-v1-20261031
    paths:
      - .github/workflows/christiania-torv-brand-assets-v1.yml

permissions:
  contents: write

concurrency:
  group: christiania-torv-brand-finish-v1
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build canonical Place-open and targeted quiz context
        run: |
          node scripts/build-place-open-payloads.mjs
          node scripts/build-quiz-production-context.mjs --category by --target christiania_torv --output data/quiz/production_context/by/christiania_torv.json
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run only relevant Brand and PlaceCard tests
        run: |
          node --test tests/christiania-torv-brands-v1.test.mjs tests/christiania-torv-placecard-collections-v2.test.mjs tests/place-card-profile-schema.test.mjs
          node scripts/build-quiz-production-context.mjs --category by --target christiania_torv --output data/quiz/production_context/by/christiania_torv.json --check
      - name: Commit only deterministically generated files for Christiania Torv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/place-open/christiania_torv.json data/quiz/production_context/by/christiania_torv.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "build(christiania-torv): synchronize Brand runtime and quiz context"
          git push
