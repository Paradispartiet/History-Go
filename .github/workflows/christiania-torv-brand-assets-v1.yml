name: Christiania Torv authentic brand wordmarks (one-shot)

on:
  push:
    branches:
      - content/christiania-torv-brands-v1-20261031
    paths:
      - .github/workflows/christiania-torv-brand-assets-v1.yml

permissions:
  contents: write

concurrency:
  group: christiania-torv-brand-assets-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download source photography and crop original signs, never recreate logos
        run: |
          python -m pip install --quiet pillow
          python scripts/materialize-christiania-torv-brand-marks.py
      - name: Verify source mapping and two on-disk Brand assets
        run: node --test tests/christiania-torv-brands-v1.test.mjs
      - name: Commit only canonical brands, attributes, audit and real images to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/brands/brands_master.json data/brands/brands_catalog.json data/brands/brands_by_place.json
          git add data/brands/christiania_torv_asset_attributions.json reports/place-production/christiania-torv-brands-v1.json
          git add bilder/kort/brands/brasserie_hansken.webp bilder/kort/brands/kafe_celsius.webp
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "feat(christiania-torv): publish two source-backed Brands and authentic sign crops"
          git push
