name: Finalize final Fagverk legacy batch

on:
  push:
    branches:
      - agent/fagverk-legacy-final-20260901
    paths:
      - .github/workflows/finalize-fagverk-legacy-final.yml
      - tools/finalize-fagverk-legacy-final.mjs
      - tools/patch-fagverk-place-foundation-support.mjs
      - tests/fagverk-place-foundation-support.test.mjs

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync branch to current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Add foundation subject support to Place Fagverk audit
        run: node tools/patch-fagverk-place-foundation-support.mjs
      - name: Curate final four completed Place Fagverk packages
        run: node tools/finalize-fagverk-legacy-final.mjs
      - name: Rebuild deterministic quiz contexts
        run: |
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target lilleborg_fabrikker --output data/quiz/production_context/naeringsliv/lilleborg_fabrikker.json
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target ovre_foss --output data/quiz/production_context/naeringsliv/ovre_foss.json
          node scripts/build-quiz-production-context.mjs --category religion --target akershus_slottskirke --output data/quiz/production_context/religion/akershus_slottskirke.json
          node scripts/build-quiz-production-context.mjs --category religion --target det_kongelige_mausoleum --output data/quiz/production_context/religion/det_kongelige_mausoleum.json
      - name: Regenerate Place-open runtime
        run: node scripts/build-place-open-payloads.mjs
      - name: Regenerate Fagverk place coverage
        run: node scripts/audit-fagverk-place-pages.mjs --write
      - name: Regenerate Fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Validate foundation subject support
        run: node --test tests/fagverk-place-foundation-support.test.mjs
      - name: Validate Fagverk page contract
        run: node scripts/audit-fagverk-place-pages.mjs
      - name: Validate Place-open and release artifacts
        run: |
          node scripts/build-place-open-payloads.mjs --check
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Test Fagverk page and substance contracts
        run: |
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/fagverk-place-substance-audit.test.mjs
      - name: Test Fagverk links
        run: node --test tests/fagverk-link-audit.test.mjs
      - name: Validate changed Place images
        run: node scripts/audit-place-images.mjs --mode=changed
      - name: Validate quiz production context
        run: npm run audit:quiz-production-context
      - name: Validate quiz progression
        run: npm run audit:quiz-progression
      - name: Validate quiz theory binding
        run: npm run audit:quiz-theory-binding
      - name: Validate diff whitespace
        run: git diff --check
      - name: Commit final production result and remove temporary tooling
        run: |
          git add \
            data/places/naeringsliv/oslo/places_naeringsliv/lilleborg_fabrikker.json \
            data/places/naeringsliv/oslo/places_naeringsliv/ovre_foss.json \
            data/places/religion/oslo/akershus_slottskirke/akershus_slottskirke.json \
            data/places/religion/oslo/det_kongelige_mausoleum/det_kongelige_mausoleum.json \
            data/quiz/production_context/naeringsliv/lilleborg_fabrikker.json \
            data/quiz/production_context/naeringsliv/ovre_foss.json \
            data/quiz/production_context/religion/akershus_slottskirke.json \
            data/quiz/production_context/religion/det_kongelige_mausoleum.json \
            data/runtime \
            data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/fagverk-place-page-coverage-v2.json \
            scripts/audit-fagverk-place-pages.mjs \
            tests/fagverk-place-foundation-support.test.mjs
          git rm \
            tools/finalize-fagverk-legacy-final.mjs \
            tools/patch-fagverk-place-foundation-support.mjs \
            .github/workflows/finalize-fagverk-legacy-final.yml
          git diff --cached --quiet && { echo "No production changes to commit"; exit 1; }
          git commit -m "Complete legacy Place Fagverk v2 migration"
          git push origin HEAD:${GITHUB_REF_NAME}
