name: TEMP Bogstadveien fresh-main replay v4

on:
  push:
    branches:
      - control/bogstadveien-finalize-20260904-v3
    paths:
      - '.github/workflows/tmp-bogstadveien-fresh-main-replay-v4.yml'

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: control/bogstadveien-finalize-20260904-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Replay permanent Bogstadveien commits on fresh main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main work/bogstadveien-production-final-20260904
          git checkout -B candidate/bogstadveien-fresh-main-20260904-v4 origin/main
          git cherry-pick 3e26318672763f9c7f598d0c2ac0523185fe7050
          git cherry-pick 630547684c7cb6db96f25a21797734a9d76fd383
          git cherry-pick 44b693d32bed03f516da8098523e5d08f1d63bfb
          if git diff --name-only origin/main...HEAD | grep -E '^\.github/workflows/tmp-bogstadveien'; then
            echo 'TEMP Bogstadveien workflow leaked into candidate' >&2
            exit 1
          fi
          git log --oneline -4
      - name: Install dependencies
        run: npm ci
      - name: Validate replayed Bogstadveien candidate
        run: |
          set -euo pipefail
          node --test tests/bogstadveien-completion.test.mjs
          node scripts/audit-quiz-answer-position-bias.mjs --file data/quiz/by/bogstadveien_sets.json
          bash scripts/check-places.sh
          git diff --check origin/main...HEAD
      - name: Push validated candidate
        run: |
          git push --force origin HEAD:candidate/bogstadveien-fresh-main-20260904-v4

# rerun against main 38ce7a8451d9b277f113793e60daea1ab41be29c
