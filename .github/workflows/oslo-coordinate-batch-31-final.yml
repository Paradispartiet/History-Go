name: Complete Oslo coordinate control batch 31

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-31-final
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply researched batch 31 decisions
        run: node scripts/tmp-complete-oslo-coordinate-batch31.mjs

      - name: Regenerate Alna source split data
        run: |
          set -euo pipefail
          node scripts/split-natur-oslo-alna-places.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('data/places/natur/oslo/places_oslo_alna_split_report.txt')
          p.write_text(p.read_text().rstrip() + '\n')
          PY

      - name: Build repository tools without npm install
        run: |
          set -euo pipefail
          rm -rf dist/tools
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { stripTypeScriptTypes } = require('node:module');
          const sourceRoot = path.resolve('tools');
          const outputRoot = path.resolve('dist/tools');
          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : (/\.(?:mts|ts|cts)$/.test(entry.name) ? [full] : []);
            });
          }
          let count = 0;
          for (const file of walk(sourceRoot)) {
            const rel = path.relative(sourceRoot, file);
            const ext = path.extname(rel);
            const outExt = ext === '.mts' ? '.mjs' : ext === '.cts' ? '.cjs' : '.js';
            const dest = path.join(outputRoot, rel.slice(0, -ext.length) + outExt);
            const source = fs.readFileSync(file, 'utf8');
            const newline = source.indexOf('\n');
            const hasShebang = source.startsWith('#!');
            const shebang = hasShebang ? source.slice(0, newline + 1) : '';
            const body = hasShebang ? source.slice(newline + 1) : source;
            const transformed = stripTypeScriptTypes(body, { mode: 'transform' });
            fs.mkdirSync(path.dirname(dest), { recursive: true });
            fs.writeFileSync(dest, shebang + transformed);
            count += 1;
          }
          console.log(`Built ${count} tool files without npm install.`);
          NODE
          test -f dist/tools/build_places_index.mjs
          test -f dist/tools/audit-places-split-manifest-sync.mjs
          test -f dist/tools/audit-coordinate-evidence.mjs

      - name: Rebuild global runtime index
        run: node dist/tools/build_places_index.mjs

      - name: Prove exact batch scope
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const file = 'data/places/natur/oslo/places_oslo_alna.json';
          const before = JSON.parse(cp.execFileSync('git', ['show', `origin/main:${file}`], { encoding: 'utf8' }));
          const after = JSON.parse(fs.readFileSync(file, 'utf8'));
          const beforeById = new Map(before.map((place) => [place.id, place]));
          const changed = after.filter((place) => JSON.stringify(place) !== JSON.stringify(beforeById.get(place.id))).map((place) => place.id);
          const expected = new Set([
            'alnaelva','alnaelvstien','loelva_historisk','trosterud_friomrade',
            'furuset_haugerud_skogbelte','hellerud_gard','alnabru_jernbane_og_logistikk'
          ]);
          const unexpected = changed.filter((id) => !expected.has(id));
          if (unexpected.length) throw new Error(`Unexpected Alna aggregate changes: ${unexpected.join(', ')}`);
          for (const id of expected) if (!changed.includes(id)) throw new Error(`Expected batch record did not change: ${id}`);
          console.log('Changed Alna records:', changed.join(', '));
          NODE

          unexpected_splits=$(git diff --name-only origin/main -- data/places/natur/oslo/places_oslo_alna/ \
            | grep -vE '(^|/)(alnaelva|alnaelvstien|loelva_historisk|trosterud_friomrade|furuset_haugerud_skogbelte|hellerud_gard|alnabru_jernbane_og_logistikk)\.json$' || true)
          if [ -n "$unexpected_splits" ]; then
            echo "Unexpected split changes:" >&2
            echo "$unexpected_splits" >&2
            exit 1
          fi

      - name: Run all hard validation gates
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-31/validation
          mkdir -p "$out"
          node dist/tools/audit-places-split-manifest-sync.mjs | tee "$out/split-manifest-sync.txt"
          node dist/tools/check_no_lng_coordinates.mjs | tee "$out/places-index-check.txt"
          node dist/tools/check_places_index_sync.mjs | tee -a "$out/places-index-check.txt"
          node tests/place-coordinate-index-parity.test.js | tee -a "$out/places-index-check.txt"
          node tests/coordinate-source-contract-anchor-trust.test.mjs | tee "$out/coordinate-source-contract.txt"
          node dist/tools/place-coordinate-quality-gate.mjs | tee "$out/coordinate-quality.txt"
          node dist/tools/place-coordinate-intake-gate.mjs --strict-new | tee "$out/coordinate-intake.txt"
          node dist/tools/audit-coordinate-evidence.mjs | tee "$out/coordinate-evidence-audit.txt"
          git diff --check | tee "$out/git-diff-check.txt"

      - name: Assert exact canonical split runtime and protocol result
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const aggregate = read('data/places/natur/oslo/places_oslo_alna.json');
          const runtime = read('data/places/places_index.json');
          const byId = new Map(aggregate.map((place) => [place.id, place]));
          const runtimeById = new Map(runtime.map((place) => [place.id, place]));
          const verified = byId.get('alnabru_jernbane_og_logistikk');
          if (verified.name !== 'Alnabru godsterminal' || verified.lat !== 59.9336032 || verified.lon !== 10.8382823 || verified.sourceObjectId !== 'osm-way:84268939' || verified.coordStatus !== 'verified_geometry') {
            throw new Error('Alnabru final result mismatch');
          }
          const needs = ['alnaelva','alnaelvstien','loelva_historisk','trosterud_friomrade','furuset_haugerud_skogbelte','hellerud_gard'];
          for (const id of needs) {
            const place = byId.get(id);
            if (!place || place.coordStatus !== 'needs_source') throw new Error(`${id} is not needs_source`);
          }
          for (const id of ['alnabru_jernbane_og_logistikk', ...needs]) {
            const split = read(`data/places/natur/oslo/places_oslo_alna/${id}.json`);
            const canonical = byId.get(id);
            if (JSON.stringify(split) !== JSON.stringify(canonical)) throw new Error(`${id} split/aggregate mismatch`);
            const rt = runtimeById.get(id);
            if (!rt || rt.lat !== canonical.lat || rt.lon !== canonical.lon || rt.coordStatus !== canonical.coordStatus) throw new Error(`${id} runtime mismatch`);
          }
          const protocol = fs.readFileSync('docs/coordinates/coordinate-control-protocol.md', 'utf8');
          if (!protocol.includes('| 31 | `alnabru_jernbane_og_logistikk`')) throw new Error('Batch 31 verified protocol row missing');
          if (!protocol.includes('151 verifiserte eller kildekontrollerte canonical steder')) throw new Error('Protocol count 151 missing');
          for (const id of needs) if (!protocol.includes(`\`${id}\``)) throw new Error(`Protocol needs_review row missing: ${id}`);
          NODE

      - name: Render old/new Alnabru map QA
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-31/visual-qa
          mkdir -p "$out"
          cat > "$out/map.html" <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><style>
          html,body{margin:0;width:1600px;height:900px;font-family:Arial,sans-serif;background:#fff}.wrap{display:grid;grid-template-columns:1fr 1fr;width:1600px;height:900px}.panel{position:relative}.map{width:800px;height:900px}.label{position:absolute;z-index:9999;top:18px;left:18px;background:rgba(255,255,255,.94);padding:12px 16px;border:3px solid #111;font-size:23px;font-weight:700}.sub{display:block;font-size:15px;font-weight:400;margin-top:5px}.marker{width:28px;height:28px;border-radius:50%;background:#fff;border:7px solid #111;box-sizing:border-box}</style>
          <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script></head><body>
          <div class="wrap"><div class="panel"><div class="label">Alnabru – gammel markør<span class="sub">59.9360000, 10.8140000 · legacy</span></div><div id="old" class="map"></div></div><div class="panel"><div class="label">Alnabru godsterminal – ny<span class="sub">59.9336032, 10.8382823 · OSM way 84268939</span></div><div id="new" class="map"></div></div></div>
          <script>
          const icon=L.divIcon({className:'',html:'<div class="marker"></div>',iconSize:[28,28],iconAnchor:[14,14]});
          for(const [id,lat,lon] of [['old',59.936,10.814],['new',59.9336032,10.8382823]]){const m=L.map(id,{zoomControl:false,attributionControl:false}).setView([lat,lon],16);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(m);L.marker([lat,lon],{icon}).addTo(m);}
          setTimeout(()=>document.body.dataset.ready='1',3500);
          </script></body></html>
          EOF
          (cd "$out" && python3 -m http.server 8765 >/tmp/b31-http.log 2>&1 & echo $! >/tmp/b31-http.pid)
          sleep 2
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$chrome" ]; then echo 'No headless Chrome found' >&2; exit 1; fi
          "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1600,900 \
            --virtual-time-budget=7000 --screenshot="$PWD/$out/alnabru-old-new.png" http://127.0.0.1:8765/map.html
          kill "$(cat /tmp/b31-http.pid)" 2>/dev/null || true
          test -s "$out/alnabru-old-new.png"
          rm "$out/map.html"
          cat > "$out/README.md" <<'EOF'
          # Batch 31 visual map QA

          Side-by-side old/new marker comparison for the only physical coordinate move in batch 31: `alnabru_jernbane_og_logistikk` → Alnabru godsterminal.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch-31-visual-qa
          path: reports/oslo-coordinate-control-batch-31/visual-qa/alnabru-old-new.png
          if-no-files-found: error

      - name: Commit clean completed batch
        run: |
          set -euo pipefail
          rm .github/workflows/oslo-coordinate-batch-31-final.yml
          rm scripts/tmp-complete-oslo-coordinate-batch31.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs reports .github/workflows/oslo-coordinate-batch-31-final.yml scripts/tmp-complete-oslo-coordinate-batch31.mjs
          git commit -m "Complete Oslo coordinate control batch 31"
          git push origin HEAD:refs/heads/agent/oslo-coordinate-control-batch-31-final
