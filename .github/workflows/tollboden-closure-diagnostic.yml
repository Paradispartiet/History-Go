name: Tollboden closure diagnostic

on:
  push:
    branches:
      - agent/tollboden-closure-diagnostic-20260914

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Knowledge place-source contract
        run: |
          echo '=== generator branches ==='
          grep -n -B 18 -A 36 -E 'sourceMapping|source_mapping|place.*source|source.*place|build-quiz-manifest|quiz.manifest' scripts/knowledge-canonical-data.mts || true
          echo '=== exact Tollpakkhuset references near source/manifest data ==='
          grep -R -n -I --exclude='*.webp' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' 'tollpakkhuset' data/knowledge data/quiz data/places scripts 2>/dev/null | head -n 400 || true
          echo '=== likely mapping files ==='
          find data -type f \( -iname '*source*' -o -iname '*mapping*' -o -iname '*manifest*' \) | sort | head -n 400
