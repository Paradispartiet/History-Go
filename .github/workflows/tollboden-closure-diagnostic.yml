name: Tollboden image backlog diagnostic

on:
  push:
    branches:
      - agent/tollboden-closure-diagnostic-20260914

permissions:
  contents: read

env:
  PR_HEAD: 431256cf6d154f46021a6cca2dc217a132b97ad3
  TARGET_BRANCH: agent/tollboden-production-20260912

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Lock exact PR head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$PR_HEAD"
      - name: Build authoritative image audit and summary
        run: |
          set -euo pipefail
          mkdir -p reports/tollboden-image-backlog
          node scripts/audit-place-images.mjs --mode=all --report=reports/tollboden-image-backlog/place-image-audit.json
          node - <<'NODE'
          const fs = require('fs');
          const reportPath = 'reports/tollboden-image-backlog/place-image-audit.json';
          const sourcePath = 'data/places/place_image_backlog_summary.json';
          const outPath = 'reports/tollboden-image-backlog/place_image_backlog_summary.generated.json';
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const source = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          const generated = {
            ...source,
            generatedAt: '2026-09-14',
            generatedFromCommit: process.env.PR_HEAD,
            totalPlaces: report.totalPlaces,
            summary: {
              validLocal: report.summary.local,
              validRemote: report.summary.remote,
              optionalMissing: report.summary.optional,
              missing: report.summary.missing,
              invalidLocalPath: report.summary.invalid,
              remaining: report.summary.missing + report.summary.invalid
            },
            byCategory: Object.fromEntries(Object.entries(report.byCategory).map(([category, row]) => [category, {
              total: row.total,
              valid: row.local + row.remote,
              optional: row.optional,
              missing: row.missing,
              invalid: row.invalid
            }]))
          };
          fs.writeFileSync(outPath, JSON.stringify(generated, null, 2) + '\n');
          console.log(JSON.stringify({totalPlaces: generated.totalPlaces, summary: generated.summary, byCategory: generated.byCategory.naeringsliv}, null, 2));
          NODE
          node scripts/audit-place-images.mjs --mode=all --verify-summary=reports/tollboden-image-backlog/place_image_backlog_summary.generated.json
      - name: Upload exact generated summary
        uses: actions/upload-artifact@v4
        with:
          name: tollboden-image-backlog-summary
          path: reports/tollboden-image-backlog
          if-no-files-found: error
