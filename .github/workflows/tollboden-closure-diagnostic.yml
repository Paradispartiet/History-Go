name: Tollboden closure diagnostic

on:
  push:
    branches:
      - agent/tollboden-closure-diagnostic-20260914

permissions:
  contents: read

env:
  SOURCE_HEAD: c21e6d557c4a6cf22fe09b1f4c976afab6d64897

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Restore Tollboden closure inputs only
        run: |
          git fetch origin "$SOURCE_HEAD"
          git checkout "$SOURCE_HEAD" -- \
            data/quiz/naeringsliv/tollboden_oslo_sets.json \
            data/quiz/production_briefs/naeringsliv/tollboden_oslo.json \
            data/quiz/production_context/naeringsliv/tollboden_oslo.json \
            reports/place-production/tollboden-materialization-state.json \
            reports/place-production/tollboden-workcard-current.json
      - name: Register Tollboden quiz and apply deterministic closure semantics
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const fagPath = 'data/fag/fag_manifest.json';
          const fag = JSON.parse(fs.readFileSync(fagPath, 'utf8'));
          let naeringsliv = fag.categories?.naeringsliv;
          if (!naeringsliv && Array.isArray(fag.categories)) {
            naeringsliv = fag.categories.find(x => x.categoryId === 'naeringsliv' || x.id === 'naeringsliv');
          }
          if (!naeringsliv) throw new Error('naeringsliv missing from data/fag/fag_manifest.json');
          naeringsliv.quizProduction ??= {};
          naeringsliv.quizProduction.targets ??= {};
          naeringsliv.quizProduction.targets.tollboden_oslo = {
            source_brief: '../quiz/production_briefs/naeringsliv/tollboden_oslo.json',
            context_artifact: '../quiz/production_context/naeringsliv/tollboden_oslo.json',
            quiz_file: '../quiz/naeringsliv/tollboden_oslo_sets.json'
          };
          fs.writeFileSync(fagPath, JSON.stringify(fag, null, 2) + '\n');

          const manifestPath = 'data/quiz/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.sets = manifest.sets.filter(x => x.targetId !== 'tollboden_oslo');
          manifest.sets.push({ targetId: 'tollboden_oslo', file: 'data/quiz/naeringsliv/tollboden_oslo_sets.json' });
          manifest.sets.sort((a,b) => (a.targetId || '').localeCompare(b.targetId || '') || (a.file || '').localeCompare(b.file || ''));
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

          const quizPath = 'data/quiz/naeringsliv/tollboden_oslo_sets.json';
          const quiz = JSON.parse(fs.readFileSync(quizPath, 'utf8'));
          const questions = quiz.sets.flatMap(s => s.questions);
          const frozen = new Set(['tollboden_oslo_quiz_01','tollboden_oslo_quiz_02','tollboden_oslo_quiz_03','tollboden_oslo_quiz_12']);
          const candidates = questions.filter(q => !frozen.has(q.id) && q.answerIndex === 0);
          if (candidates.length !== 17) throw new Error(`expected 17 zero-index candidates, got ${candidates.length}`);
          candidates.sort((a,b) => {
            const ha = crypto.createHash('sha256').update(`tollboden_oslo:${a.id}`).digest('hex');
            const hb = crypto.createHash('sha256').update(`tollboden_oslo:${b.id}`).digest('hex');
            return ha.localeCompare(hb) || a.id.localeCompare(b.id);
          });
          const to1 = new Set(candidates.slice(0,4).map(q => q.id));
          const to2 = new Set(candidates.slice(4,10).map(q => q.id));
          for (const q of questions) {
            const target = to1.has(q.id) ? 1 : to2.has(q.id) ? 2 : q.answerIndex;
            if (target !== q.answerIndex) {
              [q.options[q.answerIndex], q.options[target]] = [q.options[target], q.options[q.answerIndex]];
              q.answerIndex = target;
            }
          }
          const q16 = questions.find(q => q.id === 'tollboden_oslo_quiz_16');
          if (!q16) throw new Error('q16 missing');
          q16.topic_hook_id = 'regulering_og_ansvar';
          q16.thinker_id = 'karl_polanyi';
          q16.theory_ref = {
            topic_hook_id: 'regulering_og_ansvar',
            thinker_id: 'karl_polanyi',
            why_it_helps: 'Polanyis perspektiv på marked, samfunn og regulering gjør Tollbodens administrative kontroll til et konkret eksempel på at handel og vareflyt er institusjonelt regulert.'
          };
          quiz.production_context.topic_hook_ids = [...new Set([...(quiz.production_context.topic_hook_ids || []), 'regulering_og_ansvar'])];
          quiz.production_context.thinker_ids = [...new Set([...(quiz.production_context.thinker_ids || []), 'karl_polanyi'])];
          fs.writeFileSync(quizPath, JSON.stringify(quiz, null, 2) + '\n');

          const briefPath = 'data/quiz/production_briefs/naeringsliv/tollboden_oslo.json';
          const brief = JSON.parse(fs.readFileSync(briefPath, 'utf8'));
          brief.selected_curriculum.topic_hook_ids = [...new Set([...(brief.selected_curriculum.topic_hook_ids || []), 'regulering_og_ansvar'])];
          brief.selected_curriculum.thinker_ids = [...new Set([...(brief.selected_curriculum.thinker_ids || []), 'karl_polanyi'])];
          fs.writeFileSync(briefPath, JSON.stringify(brief, null, 2) + '\n');

          const counts = questions.reduce((a,q) => (a[q.answerIndex]++, a), [0,0,0]);
          console.log('to1=' + [...to1].join(','));
          console.log('to2=' + [...to2].join(','));
          console.log('counts=' + counts.join('/'));
          if (counts.join('/') !== '7/7/7') throw new Error(`bad distribution ${counts.join('/')}`);
          NODE
      - name: Rebuild Tollboden production context
        run: node scripts/build-quiz-production-context.mjs --category naeringsliv --target tollboden_oslo --output data/quiz/production_context/naeringsliv/tollboden_oslo.json
      - name: Materialize canonical Knowledge
        run: npm run knowledge:canonical:write
      - name: Run closure audits
        run: |
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run test:quiz-production
          npm run knowledge:canonical:check
      - name: Report exact candidate diff
        if: always()
        run: |
          echo '=== CHANGED FILES ==='
          git diff --name-only
          echo '=== NUMSTAT ==='
          git diff --numstat
          echo '=== SHORTSTAT ==='
          git diff --shortstat
          echo '=== TOLLPAKKHUSET GUARD ==='
          if git diff --name-only | grep -i tollpakkhuset; then echo 'ERROR: Tollpakkhuset touched'; exit 1; else echo 'PASS: Tollpakkhuset untouched'; fi
