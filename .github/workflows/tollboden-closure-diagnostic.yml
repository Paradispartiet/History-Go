name: Tollboden closure diagnostic

on:
  push:
    branches:
      - agent/tollboden-closure-diagnostic-20260914

permissions:
  contents: read

env:
  PR_HEAD: 306b1509b8032cd51cb4637363e025c4595cf1a6
  MAIN_HEAD: a539c2c4d62b021dc04466e4f5cd13ece06f377e
  TARGET_BRANCH: agent/tollboden-production-20260912

jobs:
  conflicts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Lock heads and inspect merge conflicts
        run: |
          set -euo pipefail
          local_head="$(git rev-parse HEAD)"
          remote_pr="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          printf 'local_pr=%s\nremote_pr=%s\nremote_main=%s\n' "$local_head" "$remote_pr" "$remote_main"
          test "$local_head" = "$PR_HEAD"
          test "$remote_pr" = "$PR_HEAD"
          test "$remote_main" = "$MAIN_HEAD"
          mkdir -p reports
          set +e
          git merge --no-commit --no-ff "$MAIN_HEAD" >/tmp/merge.out 2>&1
          rc=$?
          set -e
          cat /tmp/merge.out
          echo "merge_exit=$rc" | tee reports/tollboden-merge-summary.txt
          git diff --name-only --diff-filter=U | tee reports/tollboden-merge-conflicts.txt
          git ls-files -u > reports/tollboden-merge-unmerged-index.txt
          git status --short > reports/tollboden-merge-status.txt
          cat reports/tollboden-merge-conflicts.txt
          cat reports/tollboden-merge-status.txt
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then git merge --abort; else git reset --hard "$PR_HEAD"; fi
      - name: Upload conflict report
        uses: actions/upload-artifact@v4
        with:
          name: tollboden-merge-conflicts
          path: |
            reports/tollboden-merge-summary.txt
            reports/tollboden-merge-conflicts.txt
            reports/tollboden-merge-unmerged-index.txt
            reports/tollboden-merge-status.txt
          if-no-files-found: error
