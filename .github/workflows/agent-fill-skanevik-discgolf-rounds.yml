name: Fill Skånevik discgolf rounds

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Skånevik discgolf content
        env:
          GENERATOR_GZ_B64: ""
        run: |
          printf '%s' "$GENERATOR_GZ_B64" | base64 -d | gzip -d > /tmp/agent-fill-skanevik-discgolf-rounds.js
          node /tmp/agent-fill-skanevik-discgolf-rounds.js
      - name: Dedicated and inherited tests
        run: |
          node tests/skanevik-discgolf-batch1-round-content.test.js
          node tests/osnes-discgolf-batch1-round-content.test.js
          node tests/skakkeringen-batch1-round-content.test.js
          node tests/engebanen-batch1-round-content.test.js
          node tests/steinsvollen-batch1-round-content.test.js
          node tests/etne-pumptrack-batch1-round-content.test.js
      - name: Leksikon ids
        run: npm run leksikon:ids:check
      - name: People of places
        run: |
          npm run audit:people-of-places
          git checkout -- reports/people-of-places-status.json reports/people-of-places-status.md
      - name: Typecheck tools
        run: npm run typecheck:tools
      - name: Typecheck web
        run: npm run typecheck:web
      - name: Story integrity without new Skånevik discgolf errors
        run: |
          set +e
          npm run check:stories > /tmp/story-integrity.log 2>&1
          set -e
          cat /tmp/story-integrity.log
          if grep -Ei 'story=.*skanevik_dugnad_til_sondagsliga|place_id=skanevik_discgolf|person_id=solve_funderud' /tmp/story-integrity.log; then
            echo 'Skånevik discgolf introduced a story integrity error'
            exit 1
          fi
      - name: Diff check
        run: git diff --check
      - name: Remove temporary workflow
        run: rm .github/workflows/agent-fill-skanevik-discgolf-rounds.yml
      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports tests .github/workflows
          git commit -m "Fill Skånevik discgolf sport rounds batch 1"
          git push
