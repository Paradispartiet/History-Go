name: Fagverk IA v3 Kunst Phase 3 route reconcile probe

on:
  pull_request:
    paths:
      - 'scripts/audit-fagverk-kunst-phase3.mjs'
      - 'reports/fagverk/kunst-phase3-audit.json'
      - '.github/workflows/fagverk-ia-v3-kunst-phase3-route-reconcile-probe.yml'

permissions:
  contents: write

jobs:
  reconcile-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile Kunst Phase 3 route contract
        run: |
          test "$(git hash-object 'data/fag/kunst/archive/merke_kunst_legacy_20260828.html')" = '086d2e19642ad42bfe3b494690d3e1fc250c9d60'
          node --check scripts/audit-fagverk-kunst-phase3.mjs
          node scripts/audit-fagverk-kunst-phase3.mjs --write-report
          node scripts/audit-fagverk-kunst-phase3.mjs
          node scripts/audit-fagverk-kunst-complete.mjs
          node scripts/audit-fagverk-kunst-legacy-theory.mjs
          node scripts/audit-fagverk-kunst-legacy-adjudication.mjs
          node --test tests/fagverk-kunst-legacy-theory-audit.test.mjs
          node --test tests/fagverk-kunst-legacy-theory-adjudication.test.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit reconciled report and remove probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fagverk-ia-v3-kunst-phase3-route-reconcile-probe.yml
          git add reports/fagverk/kunst-phase3-audit.json
          git commit -m 'Reconcile Kunst Phase 3 badge route audit'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
