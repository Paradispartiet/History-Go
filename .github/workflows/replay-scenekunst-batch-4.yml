name: Replay Scenekunst batch 4

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.ref == 'agent/scenekunst-venues-04-replayed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out replay branch
        uses: actions/checkout@v4
        with:
          ref: agent/scenekunst-venues-04-replayed
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Register batch files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'data/places/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const additions = [
            'places/scenekunst/agder/bruddet_fjaereheia.json',
            'places/scenekunst/agder/teateret_kristiansand.json',
            'places/scenekunst/trondelag/rosendal_teater.json',
            'places/scenekunst/vestland/cornerteateret.json',
            'places/scenekunst/vestland/studio_bergen_carte_blanche.json'
          ];
          for (const entry of additions) {
            if (!manifest.files.includes(entry)) manifest.files.push(entry);
          }
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Regenerate place index
        run: npm run places:index:build

      - name: Validate regenerated data
        run: |
          npm run places:index:check
          npm run places:emner:check
          npm run places:coords:check

      - name: Commit regenerated production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/manifest.json data/places/places_index.json
          if git diff --cached --quiet; then
            echo 'No generated changes required.'
            exit 0
          fi
          git commit -m 'Regenerate place manifest and index for Scenekunst batch 4'
          git push origin HEAD:agent/scenekunst-venues-04-replayed
