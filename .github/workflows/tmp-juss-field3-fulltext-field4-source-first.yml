name: TEMP Juss field 3 fulltext field 4 source-first

on:
  push:
    branches:
      - agent/fagverk-juss-rettsvitenskap-field-3-fulltext-field-4-source-first-20260901

permissions:
  contents: write

concurrency:
  group: tmp-juss-field3-fulltext-field4-source-first
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.head_commit.message == 'Run fail-closed Juss field 3 fulltext field 4 source-first'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Juss branch
        uses: actions/checkout@v4
        with:
          ref: agent/fagverk-juss-rettsvitenskap-field-3-fulltext-field-4-source-first-20260901
          fetch-depth: 1
          show-progress: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Correct Field 4 strict boundaries
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='scripts/tmp-materialize-juss-field3-fulltext-field4-source-first.mjs';
          let text=fs.readFileSync(file,'utf8');

          const fairFrom="boundary:'Rettferdig rettergang må analyseres etter om saken faller innenfor artikkel 6 og hvilke konkrete garantier som gjelder. Uavhengighet, upartiskhet, rimelig tid, kontradiksjon og forsvarsrettigheter er forskjellige krav; EMK er ikke en fjerde ordinær ankeinstans for bevis- og lovanvendelse.'";
          const fairTo="boundary:'Rettferdig rettergang etter EMK artikkel 6 og Grunnloven § 95 må analyseres etter om saken faller innenfor bestemmelsenes anvendelsesområde og hvilke konkrete garantier som gjelder. Uavhengighet, upartiskhet, rimelig tid, kontradiksjon og forsvarsrettigheter er forskjellige krav; EMK er ikke en fjerde ordinær ankeinstans for bevis- og lovanvendelse.'";
          if(!text.includes(fairFrom)&&!text.includes(fairTo)) throw new Error('Unexpected Field 4 fair-trial boundary');
          if(text.includes(fairFrom)) text=text.replace(fairFrom,fairTo);

          const expressionFrom="boundary:'Ytringsfrihet etter Grunnloven § 100 og EMK artikkel 10 må analyseres sammen med eventuelle motstående rettigheter, blant annet privatliv etter § 102 og artikkel 8. Avveining krever konkrete kriterier og proporsjonalitet; ingen av rettighetene vinner automatisk bare fordi den påberopes først.'";
          const expressionTo="boundary:'Ytringsfrihet etter Grunnloven § 100 og EMK artikkel 10 må analyseres sammen med eventuelle motstående rettigheter, blant annet personvern og privatliv etter Grunnloven § 102 og EMK artikkel 8. Avveining krever konkrete kriterier og proporsjonalitet; ingen av rettighetene vinner automatisk bare fordi den påberopes først.'";
          if(!text.includes(expressionFrom)&&!text.includes(expressionTo)) throw new Error('Unexpected Field 4 expression/privacy boundary');
          if(text.includes(expressionFrom)) text=text.replace(expressionFrom,expressionTo);

          fs.writeFileSync(file,text);
          NODE

      - name: Syntax-check TEMP generator
        run: node --check scripts/tmp-materialize-juss-field3-fulltext-field4-source-first.mjs

      - name: Generate candidate state or capture exact failure
        run: |
          set +e
          node scripts/tmp-materialize-juss-field3-fulltext-field4-source-first.mjs > /tmp/juss-generator.log 2>&1
          status=$?
          set -e
          cat /tmp/juss-generator.log
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd
            mkdir -p reports/fagverk
            tail -n 120 /tmp/juss-generator.log > reports/fagverk/tmp-juss-field3-field4-generator-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add reports/fagverk/tmp-juss-field3-field4-generator-error.txt
            if ! git diff --cached --quiet; then
              git commit -m 'Capture Juss field 3 field 4 generator error'
              git push origin HEAD:agent/fagverk-juss-rettsvitenskap-field-3-fulltext-field-4-source-first-20260901
            fi
            exit "$status"
          fi

      - name: Syntax-check generated Juss gates
        run: |
          node --check scripts/audit-juss-rettsvitenskap-administrative-law-public-authority-procedure-appeal-fulltext-v1.mjs
          node --check scripts/materialize-juss-rettsvitenskap-administrative-law-public-authority-procedure-appeal-fulltext-v1.mjs
          node --check scripts/brief-juss-rettsvitenskap-human-rights-echr-rights-protection-sources-v1.mjs
          node --check scripts/audit-juss-rettsvitenskap-reconciliation-v1.mjs
          node --check tests/juss-rettsvitenskap-administrative-law-public-authority-procedure-appeal-fulltext-v1.test.mjs
          node --check tests/juss-rettsvitenskap-human-rights-echr-rights-protection-source-brief-v1.test.mjs
          node --check tests/juss-rettsvitenskap-reconciliation-v1.test.mjs

      - name: Run isolated Field 3 and Field 4 gates
        run: |
          node scripts/brief-juss-rettsvitenskap-administrative-law-public-authority-procedure-appeal-sources-v1.mjs
          node scripts/audit-juss-rettsvitenskap-administrative-law-public-authority-procedure-appeal-fulltext-v1.mjs
          node scripts/materialize-juss-rettsvitenskap-administrative-law-public-authority-procedure-appeal-fulltext-v1.mjs
          node scripts/brief-juss-rettsvitenskap-human-rights-echr-rights-protection-sources-v1.mjs
          node --test tests/juss-rettsvitenskap-administrative-law-public-authority-procedure-appeal-source-brief-v1.test.mjs tests/juss-rettsvitenskap-administrative-law-public-authority-procedure-appeal-fulltext-v1.test.mjs tests/juss-rettsvitenskap-human-rights-echr-rights-protection-source-brief-v1.test.mjs tests/juss-rettsvitenskap-reconciliation-v1.test.mjs

      - name: Create local candidate checkpoint for deterministic CI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/tmp-juss-field3-fulltext-field4-source-first.yml
          if git diff --cached --quiet; then
            echo 'No candidate changes generated before deterministic checkpoint' >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing workflow mutation in local candidate checkpoint' >&2
            exit 1
          fi
          git commit -m 'TEMP local Juss field 3 field 4 candidate checkpoint'

      - name: Run registry-driven Juss and shared Fagverk gates
        run: node scripts/run-fagverk-domain-ci-v1.mjs --subject juss_rettsvitenskap

      - name: Verify canonical progress and no premature completion
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const reg=JSON.parse(fs.readFileSync('data/fag/politikk/juss_rettsvitenskap/production_registry_v1.json','utf8'));
          const category=JSON.parse(fs.readFileSync('data/categories/category_contract.json','utf8'));
          const sub=category.canonicalSubcategories.politikk.find(row=>row.id==='juss_rettsvitenskap');
          if(reg.progress.materializedDomains!==3||reg.progress.totalDomains!==12||reg.progress.strictCompletionProven!==false||reg.materialized.length!==3) throw new Error('Expected canonical Juss 3/12 state');
          if(reg.next_gate!=='human_rights_echr_rights_protection_fulltext') throw new Error('Expected Field 4 fulltext as next gate');
          if(reg.materialized[2]?.domain_id!=='forvaltningsrett_myndighetsutovelse_saksbehandling_klage') throw new Error('Expected Forvaltningsrett as materialized Field 3');
          if(sub?.status!=='expansion_planned') throw new Error('Juss category completed prematurely');
          NODE
          git diff --check

      - name: Remove TEMP production surfaces
        run: |
          rm scripts/tmp-materialize-juss-field3-fulltext-field4-source-first.mjs
          rm -f reports/fagverk/tmp-juss-field3-field4-generator-error.txt
          test ! -e scripts/tmp-materialize-juss-field3-fulltext-field4-source-first.mjs
          test ! -e reports/fagverk/tmp-juss-field3-field4-generator-error.txt
          test -e .github/workflows/tmp-juss-field3-fulltext-field4-source-first.yml

      - name: Finalize and push permanent candidate only after all gates pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/tmp-juss-field3-fulltext-field4-source-first.yml
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing workflow mutation from Actions token' >&2
            exit 1
          fi
          git commit --amend -m 'Materialize Juss field 3 and prepare field 4 source-first'
          git push origin HEAD:agent/fagverk-juss-rettsvitenskap-field-3-fulltext-field-4-source-first-20260901
