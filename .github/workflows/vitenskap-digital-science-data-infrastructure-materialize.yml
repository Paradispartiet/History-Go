name: Vitenskap digital science data infrastructure materialize

on:
  push:
    branches:
      - agent/vitenskap-editorial-coverage-repair-4
    paths:
      - '.github/workflows/vitenskap-digital-science-data-infrastructure-materialize.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/vitenskap-digital-science-data-infrastructure-materialize.yml'

permissions:
  contents: write

jobs:
  materialize-and-validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/vitenskap-editorial-coverage-repair-4'
    runs-on: ubuntu-latest
    env:
      REPAIR_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate static batch 4 artifacts and materializer syntax
        run: |
          node --check scripts/materialize-vitenskap-digital-science-data-infrastructure-coverage-batch.mjs
          node --check scripts/audit-fagverk-vitenskap-digital-science-data-infrastructure-coverage.mjs
          node -e "JSON.parse(require('fs').readFileSync('data/fagverk/vitenskap/vitenskap-fra-observasjon-til-etterprovbar-kunnskap/07-teknologi-data-infrastruktur.json','utf8')); JSON.parse(require('fs').readFileSync('data/fagverk/vitenskap/vitenskap-fra-observasjon-til-etterprovbar-kunnskap/07-teknologi-data-infrastruktur-brief.json','utf8'))"
      - name: Materialize canonical digital science data infrastructure coverage
        run: node scripts/materialize-vitenskap-digital-science-data-infrastructure-coverage-batch.mjs
      - name: Regenerate permanent reports and release projection
        run: |
          node scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs --write-report --no-check-report
          node scripts/audit-fagverk-vitenskap-digital-science-data-infrastructure-coverage.mjs --write-report --no-check-report
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate permanent Vitenskap coverage gates
        run: |
          node --test tests/fagverk-vitenskap-digital-science-data-infrastructure-coverage.test.mjs
          node --test tests/fagverk-vitenskap-society-power-ethics-coverage.test.mjs
          node --test tests/fagverk-vitenskap-institutions-knowledge-places-coverage.test.mjs
          node --test tests/fagverk-vitenskap-methods-models-coverage.test.mjs
          node --test tests/fagverk-vitenskap-unit1.test.mjs
          node --test tests/fagverk-vitenskap-holistic-university-breadth-completion.test.mjs
      - name: Validate shared Vitenskap release and nested Teknologi gates
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
          node --test tests/vitenskap-teknologi-category-contract.test.mjs
          node tools/build-teknologi-editorial-v3.mjs --check
          node tools/validate-teknologi-foundation.mjs
          node tools/validate-teknologi-quality-v2_1.mjs
          node tools/validate-teknologi-ontology-v2_2.mjs
          node tools/validate-teknologi-evidence-v2_3.mjs
          node scripts/validate-teknologi-editorial-v3.mjs
      - name: Verify deterministic rerun
        run: |
          git diff > /tmp/vitenskap-batch4-before.diff
          node scripts/materialize-vitenskap-digital-science-data-infrastructure-coverage-batch.mjs
          node scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs --write-report --no-check-report
          node scripts/audit-fagverk-vitenskap-digital-science-data-infrastructure-coverage.mjs --write-report --no-check-report
          node scripts/build-fagverk-release-manifest.mjs
          git diff > /tmp/vitenskap-batch4-after.diff
          cmp /tmp/vitenskap-batch4-before.diff /tmp/vitenskap-batch4-after.diff
          git diff --check
      - name: Remove temporary batch 4 artifacts
        run: |
          rm -f scripts/materialize-vitenskap-digital-science-data-infrastructure-coverage-batch.mjs
          rm -f .github/workflows/vitenskap-digital-science-data-infrastructure-materialize.yml
      - name: Commit canonical digital science data infrastructure coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Materialize Vitenskap digital science data infrastructure coverage'
          git push origin HEAD:${REPAIR_BRANCH}
