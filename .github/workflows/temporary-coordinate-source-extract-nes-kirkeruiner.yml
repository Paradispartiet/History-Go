name: Temporary exact Nes kirkeruiner source extraction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/akershus-nes-kirkeruiner-production
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Persist exact address and ruin geometry
        shell: bash
        run: |
          set -euo pipefail
          OUT='reports/akershus-coordinate-nes-kirkeruiner-source-probe'
          mkdir -p "$OUT"
          UA='History-Go coordinate research (Paradispartiet/History-Go)'

          curl --fail --silent --show-error --location --user-agent "$UA" \
            'https://api.openstreetmap.org/api/0.6/way/134163878/full' \
            | tee "$OUT/osm-way-134163878-full.xml" >/dev/null

          python - <<'PY' | tee "$OUT/exact-summary.txt" >/dev/null
          import json
          import math
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path('reports/akershus-coordinate-nes-kirkeruiner-source-probe')
          legacy = (60.14899, 11.45676)

          def distance_m(a, b):
              lat1, lon1 = map(math.radians, a)
              lat2, lon2 = map(math.radians, b)
              dlat = lat2 - lat1
              dlon = lon2 - lon1
              h = math.sin(dlat / 2) ** 2 + math.cos(lat1) * math.cos(lat2) * math.sin(dlon / 2) ** 2
              return 6371000 * 2 * math.asin(math.sqrt(h))

          def ring_centroid(points):
              pts = list(points)
              if pts[0] != pts[-1]:
                  pts.append(pts[0])
              twice_area = cx = cy = 0.0
              for (x1, y1), (x2, y2) in zip(pts, pts[1:]):
                  cross = x1 * y2 - x2 * y1
                  twice_area += cross
                  cx += (x1 + x2) * cross
                  cy += (y1 + y2) * cross
              if abs(twice_area) < 1e-15:
                  return None
              return cx / (3 * twice_area), cy / (3 * twice_area)

          def flatten_pairs(coords):
              if not isinstance(coords, list):
                  return []
              if len(coords) >= 2 and all(isinstance(v, (int, float)) for v in coords[:2]):
                  return [(float(coords[0]), float(coords[1]))]
              result = []
              for item in coords:
                  result.extend(flatten_pairs(item))
              return result

          address_search = json.loads((out / 'geonorge-ullershovvegen-8.json').read_text())
          address_matches = [
              row for row in address_search.get('adresser', [])
              if row.get('nummer') == 160 and row.get('adressetilleggsnavn') == 'Nes Kirkeruin'
          ]
          if len(address_matches) != 1:
              raise SystemExit(f'Expected exact named address 160, found {len(address_matches)}')
          address = address_matches[0]
          (out / 'geonorge-nes-kirkeruin-ullershovvegen-160.json').write_text(json.dumps(address, ensure_ascii=False, indent=2) + '\n')
          rp = address['representasjonspunkt']
          address_point = (float(rp['lat']), float(rp['lon']))

          individual = json.loads((out / 'riksantikvaren-enkeltminner-exact-80265-1.json').read_text())
          locality = json.loads((out / 'riksantikvaren-lokaliteter-exact-80265.json').read_text())

          individual_pairs = flatten_pairs((individual.get('geometry') or {}).get('coordinates'))
          individual_center = (
              sum(p[1] for p in individual_pairs) / len(individual_pairs),
              sum(p[0] for p in individual_pairs) / len(individual_pairs),
          )
          individual_distances = [distance_m(individual_center, (lat, lon)) for lon, lat in individual_pairs]

          locality_props = locality.get('properties') or {}
          locality_coords = (locality_props.get('senterpunkt') or {}).get('coordinates') or []
          locality_center = (float(locality_coords[1]), float(locality_coords[0]))
          locality_pairs = flatten_pairs((locality.get('geometry') or {}).get('coordinates'))
          locality_distances = [distance_m(locality_center, (lat, lon)) for lon, lat in locality_pairs]

          root = ET.parse(out / 'osm-way-134163878-full.xml').getroot()
          nodes = {
              node.attrib['id']: (float(node.attrib['lat']), float(node.attrib['lon']))
              for node in root.findall('node')
          }
          way = next(item for item in root.findall('way') if item.attrib.get('id') == '134163878')
          refs = [nd.attrib['ref'] for nd in way.findall('nd')]
          osm_points = [nodes[ref] for ref in refs]
          centroid_xy = ring_centroid([(lon, lat) for lat, lon in osm_points])
          osm_center = (centroid_xy[1], centroid_xy[0])
          osm_distances = [distance_m(osm_center, point) for point in osm_points]
          osm_tags = {tag.attrib['k']: tag.attrib['v'] for tag in way.findall('tag')}

          print('INDIVIDUAL ' + json.dumps({
              'feature_id': individual.get('id'),
              'lat': individual_center[0], 'lon': individual_center[1],
              'geometry_type': (individual.get('geometry') or {}).get('type'),
              'geometry_vertex_count': len(individual_pairs),
              'max_vertex_distance_m': round(max(individual_distances), 1),
              'distance_from_legacy_m': round(distance_m(legacy, individual_center), 1),
              'properties': individual.get('properties') or {},
          }, ensure_ascii=False, sort_keys=True))
          print('LOCALITY ' + json.dumps({
              'feature_id': locality.get('id'),
              'lat': locality_center[0], 'lon': locality_center[1],
              'geometry_type': (locality.get('geometry') or {}).get('type'),
              'geometry_vertex_count': len(locality_pairs),
              'max_vertex_distance_m': round(max(locality_distances), 1) if locality_distances else None,
              'distance_to_individual_m': round(distance_m(individual_center, locality_center), 1),
              'properties': locality_props,
          }, ensure_ascii=False, sort_keys=True))
          print('OSM_WAY ' + json.dumps({
              'way_id': '134163878', 'lat': osm_center[0], 'lon': osm_center[1],
              'node_count': len(osm_points),
              'max_vertex_distance_m': round(max(osm_distances), 1),
              'distance_to_individual_m': round(distance_m(individual_center, osm_center), 1),
              'tags': osm_tags,
          }, ensure_ascii=False, sort_keys=True))
          print('ADDRESS ' + json.dumps({
              'data': address,
              'lat': address_point[0], 'lon': address_point[1],
              'distance_to_individual_m': round(distance_m(individual_center, address_point), 1),
          }, ensure_ascii=False, sort_keys=True))
          PY

          rm -f .github/workflows/temporary-coordinate-source-extract-nes-kirkeruiner.yml

          rm -f "$OUT/geonorge-ullershovvegen-8.json"
          rm -f "$OUT/nominatim-nes-gamle-kirke-vormsund-norge.json"
          rm -f "$OUT/nominatim-nes-kirkeruin-vormsund-norge.json"
          mv "$OUT/nominatim-nes-kirkeruiner-vormsund-norge.json" "$OUT/nominatim-nes-kirkeruiner.json"
          rm -f "$OUT/riksantikvaren-enkeltminner-nes-gamle-kirke.json"
          rm -f "$OUT/riksantikvaren-enkeltminner-nes-kirkeruin.json"
          rm -f "$OUT/riksantikvaren-enkeltminner-nes-kirkeruiner.json"
          rm -f "$OUT/riksantikvaren-lokaliteter-nes-gamle-kirke.json"
          rm -f "$OUT/riksantikvaren-lokaliteter-nes-kirkeruin.json"
          rm -f "$OUT/riksantikvaren-lokaliteter-nes-kirkeruiner.json"
          rm -f "$OUT/source-summary.txt"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT" .github/workflows/temporary-coordinate-source-extract-nes-kirkeruiner.yml
          if git diff --cached --quiet; then
            echo 'No exact Nes source changes.'
          else
            git commit -m 'Persist exact Nes kirkeruiner source objects'
            git push origin HEAD:agent/akershus-nes-kirkeruiner-production
          fi
