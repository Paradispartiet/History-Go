name: Det Norske Teatret C50 canonical Objects browser QA

on:
  pull_request:
    paths:
      - '.github/workflows/dnt-objects-c50.yml'
      - 'tests/det-norske-teatret-objects-c50.test.mjs'
      - 'tests/det-norske-teatret-real-objects-c50.mjs'
      - 'js/ui/place-rounds-visual-collections.js'
      - 'css/place-rounds-fill-layout.css'
      - 'data/places/scenekunst/oslo/places_scenekunst/det_norske_teatret.json'
      - 'data/runtime/place-open/det_norske_teatret.json'
      - 'reports/place-production/det-norske-teatret-workcard-current.json'
      - 'bilder/objects/det_norske_teatret/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dnt-c50-objects-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check standalone canonical Object and Place-open integrity
        run: |
          node --test tests/det-norske-teatret-objects-c50.test.mjs
          node --check tests/det-norske-teatret-real-objects-c50.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test actual place route on mobile and desktop
        run: node tests/det-norske-teatret-real-objects-c50.mjs
      - name: Upload gallery screenshots and route audit, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnt-c50-real-objects
          path: artifacts/dnt-c50/*
          if-no-files-found: warn
          retention-days: 10
