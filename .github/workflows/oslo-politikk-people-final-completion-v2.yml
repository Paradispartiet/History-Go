name: Complete Oslo politics People v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  complete:
    if: github.head_ref == 'agent/oslo-politikk-people-final-completion'
    runs-on: ubuntu-latest
    steps:
      - name: Check out final branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-politikk-people-final-completion
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Replay validated batches structurally
        env:
          SOURCE_REF: origin/agent/oslo-politikk-people-full-coverage
        run: |
          git fetch origin agent/oslo-politikk-people-full-coverage
          git show 22e2f6c1f882d0e151d772357e2a205d64cc8fe5:.github/workflows/oslo-politikk-people-refresh-main.yml \
            | sed -n "/python3 <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/replay-politics-people.py
          test -s /tmp/replay-politics-people.py
          python3 /tmp/replay-politics-people.py

      - name: Add final documented people
        run: |
          sed -n "/python3 <<'PY'/,/^          PY$/p" .github/workflows/oslo-politikk-people-final-completion.yml \
            | sed '1d;$d;s/^          //' > /tmp/add-final-politics-people.py
          test -s /tmp/add-final-politics-people.py
          python3 /tmp/add-final-politics-people.py

      - name: Rebuild generated People surfaces
        run: |
          npm run civication:history-people:build
          npm run build:web

      - name: Run locked People tests
        run: |
          set -o pipefail
          mkdir -p reports/oslo-politikk-people-full-coverage
          {
            node tests/oslo-politikk-people-full-coverage.test.js
            node tests/oslo-politikk-remaining-people-expansion.test.js
            node tests/oslo-politikk-final-people-expansion.test.js
          } 2>&1 | tee reports/oslo-politikk-people-full-coverage/coverage-test.log

      - name: Run full gates
        run: |
          set -o pipefail
          bash scripts/check-people.sh 2>&1 | tee reports/oslo-politikk-people-full-coverage/check-people.log
          bash scripts/check-places.sh 2>&1 | tee reports/oslo-politikk-people-full-coverage/check-places.log
          {
            npm run typecheck:web
            npm run typecheck:scripts
            npm run typecheck:tools
          } 2>&1 | tee reports/oslo-politikk-people-full-coverage/typecheck.log

      - name: Publish completed branch
        run: |
          rm .github/workflows/oslo-politikk-people-final-completion.yml
          rm .github/workflows/oslo-politikk-people-final-completion-v2.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fullfør People ved Oslo-politikksteder"
          git push origin HEAD:agent/oslo-politikk-people-final-completion
