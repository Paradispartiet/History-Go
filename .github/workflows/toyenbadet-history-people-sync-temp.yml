name: Tøyenbadet history People index sync (temporary)
on:
  push:
    branches:
      - feat/toyenbadet-four-illustrated-people-20261103
    paths:
      - .github/workflows/toyenbadet-history-people-sync-temp.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build prerequisites
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild Civication History People
        run: |
          npm run civication:history-people:build
          npm run civication:history-people:check
          node --test tests/toyenbadet-illustrated-people.test.mjs
      - name: Commit only generated History People index
        run: |
          git status --short
          git add data/Civication/historyPeople_index.json
          if git diff --cached --quiet; then echo "Already in sync"; exit 0; fi
          git diff --cached --stat
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(toyenbadet): sync Civication history People index for five portraits"
          git push origin HEAD:${{ github.ref_name }}
