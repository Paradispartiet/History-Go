name: TEMP Klassekampen places index hotfix

on:
  push:
    branches:
      - hotfix/klassekampen-places-index-20261004

permissions:
  contents: write

concurrency:
  group: klassekampen-places-index-hotfix
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact hotfix head
        uses: actions/checkout@v5
        with:
          ref: hotfix/klassekampen-places-index-20261004
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate canonical places index
        run: npm run places:index:build

      - name: Enforce bounded generated delta
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "$path" in
              data/places/places_index.json)
                ;;
              *)
                echo "Unexpected generated path: $path"
                exit 1
                ;;
            esac
          done < <(git status --porcelain | sed -E 's/^.. //' | sed '/^$/d')

      - name: Verify regenerated index
        run: npm run places:index:check

      - name: Commit verified index and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/places_index.json
          git rm .github/workflows/tmp-klassekampen-places-index-hotfix.yml
          git commit -m 'Regenerate places index after Klassekampen merge'
          git push origin HEAD:hotfix/klassekampen-places-index-20261004
