name: Materialize Vinderen image and place-open payload

on:
  push:
    branches:
      - place/vinderen-fagverk-v2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: place/vinderen-fagverk-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set verified Vinderen image metadata
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const path = 'data/places/by/oslo/places/vinderen.json';
          const place = JSON.parse(fs.readFileSync(path, 'utf8'));
          const asset = 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Vinderen_Torvet%2C_Oslo.jpg/800px-Vinderen_Torvet%2C_Oslo.jpg';
          place.image = asset;
          place.cardImage = asset;
          place.imageCredit = 'Ssu / Wikimedia Commons';
          place.imageLicense = 'CC BY-SA 4.0';
          place.imageSourceUrl = 'https://commons.wikimedia.org/wiki/File:Vinderen_Torvet,_Oslo.jpg';
          fs.writeFileSync(path, `${JSON.stringify(place, null, 2)}\n`);
          EOF
      - name: Verify changed-place image contract
        run: node scripts/audit-place-images.mjs --mode=changed
      - name: Rebuild canonical place-open payload
        run: |
          npm run place-open:build
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'data/places/by/oslo/places/vinderen.json' 'data/runtime/place-open/vinderen.json' | sort)"
          test "$changed" = "$expected" || {
            echo "Unexpected generated changes:"
            printf '%s\n' "$changed"
            exit 1
          }
      - name: Commit permanent artifacts and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/by/oslo/places/vinderen.json data/runtime/place-open/vinderen.json
          git rm .github/workflows/vinderen-image-place-open-materialize.yml
          git commit -m "fix(place): use verified Vinderen image"
          git push origin HEAD:place/vinderen-fagverk-v2
