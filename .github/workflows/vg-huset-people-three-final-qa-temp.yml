name: VG-huset three People profiles final QA temporary
on:
  push:
    branches: [agent/vg-huset-source-preflight-20261009]
    paths: ['.github/workflows/vg-huset-people-three-final-qa-temp.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate full canonical People claims and source mappings
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:people-profile-canonical
          npm run test:people-profile-canonical
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import sharp from 'sharp';
          const people=JSON.parse(fs.readFileSync('data/people/media/oslo/people_media_oslo.json','utf8'));
          const refs=JSON.parse(fs.readFileSync('data/people/people_image_attributions.json','utf8'));
          const ids=['gard_steiro','hanne_skartveit','torry_pedersen','bernt_olufsen','trine_eilertsen'];
          for(const id of ids) {
            const p=people.find(x=>x.id===id);
            if(!p||p.profileStatus!=='ready_people_v1'||!p.claimsFile)throw new Error('Person lacks finished profile '+id);
            const d=JSON.parse(fs.readFileSync(p.claimsFile,'utf8'));
            if(d.completion.current_status!=='ready_people_v1'||d.completion.fact_review!=='passed'||d.claims.some(x=>x.status!=='verified'))throw new Error('Incomplete claim review '+id);
            if(!p.image||!fs.existsSync(p.image)||p.cardImage!==p.image||p.imageMeta?.source!=='wikimedia_commons')throw new Error('Unresolved image '+id);
            const meta=await sharp(p.image).metadata();
            if(meta.width<350||meta.height<350||!refs.some(r=>r.personId===id&&r.file===p.image&&r.license===p.imageMeta.license))throw new Error('Image attribution mismatch '+id);
            console.log('Reviewed People v1:',id,'claims',d.claims.length,'dimensions',meta.width,meta.height);
          }
          NODE
      - name: Sync runtime source projections
        shell: bash
        run: |
          set -euo pipefail
          npm run place-open:build
          npm run place-open:check
          npm run audit:people-of-places
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const files=execFileSync('git',['status','--porcelain','--untracked-files=all'],{encoding:'utf8'})
            .trimEnd().split(/\r?\n/u).filter(Boolean).map(x=>x.slice(3));
          const allowed=x=>/^data\/runtime\/people-all\/part-\d{3}\.json$/u.test(x)
            || x==='data/runtime/people-all.json'
            || x==='data/runtime/place-open/vg_huset.json'
            || x==='reports/people-of-places-status.json'
            || x==='reports/people-of-places-status.md';
          console.log('Deterministic generated changes:',files);
          if(files.some(x=>!allowed(x)))throw new Error('Unsafe unrelated generated change');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/people-all data/runtime/people-all.json data/runtime/place-open/vg_huset.json
          git add reports/people-of-places-status.json reports/people-of-places-status.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(vg-huset): sync remaining reviewed People v1 profiles"
            git push origin HEAD:agent/vg-huset-source-preflight-20261009
          fi
