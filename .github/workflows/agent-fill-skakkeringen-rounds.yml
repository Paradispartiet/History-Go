name: Fill Skakkeringen rounds

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate round content
        env:
          GENERATOR_GZ_B64: ""
        run: |
          printf '%s' "$GENERATOR_GZ_B64" | base64 -d | gzip -d > /tmp/agent-fill-skakkeringen-rounds.js
          node /tmp/agent-fill-skakkeringen-rounds.js
      - name: Dedicated and inherited tests
        run: |
          node tests/skakkeringen-batch1-round-content.test.js
          node tests/engebanen-batch1-round-content.test.js
          node tests/steinsvollen-batch1-round-content.test.js
          node tests/etne-pumptrack-batch1-round-content.test.js
      - name: Data and TypeScript validation
        run: |
          npm run leksikon:ids:check
          npm run check:stories
          npm run audit:people-of-places
          npm run typecheck:tools
          npm run typecheck:web
          git diff --check
      - name: Remove temporary workflow
        run: rm .github/workflows/agent-fill-skakkeringen-rounds.yml
      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports tests .github/workflows
          git commit -m "Fill Skakkeringen sport rounds batch 1"
          git push
