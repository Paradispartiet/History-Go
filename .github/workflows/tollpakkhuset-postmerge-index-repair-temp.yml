name: Tollpakkhuset post-merge places index repair

on:
  push:
    branches: [agent/tollpakkhuset-postmerge-index-repair-20260912]
    paths:
      - ".github/workflows/tollpakkhuset-postmerge-index-repair-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate only canonical places index
        shell: bash
        run: |
          set -euo pipefail
          npm run places:index:build
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //' | sort)
          printf 'Changed after regeneration:\n%s\n' "${changed[*]:-<none>}"
          if (( ${#changed[@]} != 1 )) || [[ "${changed[0]:-}" != "data/places/places_index.json" ]]; then
            echo "Unexpected regeneration scope" >&2
            git status --short
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const index = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const rows = Array.isArray(index) ? index : (index.places ?? index.items ?? []);
          const row = rows.find((entry) => entry?.id === 'tollpakkhuset' || entry?.placeId === 'tollpakkhuset');
          if (!row) throw new Error('tollpakkhuset missing from places_index');
          const expected = {
            desc: 'Tollpakkhuset i Tollbugata 1A ble oppført 1846–1850 etter tegninger av Johan Henrik Nebelong som lager for Tollvesenet. Bygningen er den eldste bevarte bygningen ved Oslos gamle havnefront, og bueåpninger, pakkhusporter og spor etter veiing og vareheiser gjør den historiske varebehandlingen lesbar. I dag inngår det fredede bygget i et administrativt tollanlegg, mens Tolletatens publikumsekspedisjoner i Oslo ligger andre steder.',
            image: 'bilder/places/tollpakkhuset.webp',
            frontImage: 'bilder/places/tollpakkhuset_front_portrait.webp'
          };
          for (const [key, value] of Object.entries(expected)) {
            if (row[key] !== value) throw new Error(`Unexpected tollpakkhuset ${key}: ${JSON.stringify(row[key])}`);
          }
          NODE
          git diff --check
          git diff -- data/places/places_index.json

      - name: Verify composed canonical data
        run: |
          npm run places:index:check
          npm run knowledge:canonical:check
          node scripts/build-fagverk-release-manifest.mjs --check

      - name: Commit repaired index to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/places_index.json
          git diff --cached --check
          git commit -m "Sync Tollpakkhuset canonical places index"
          git push origin HEAD:main
