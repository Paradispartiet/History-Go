name: Kvadraturen Krigsskolen final production audit and release refresh
on:
  push:
    branches:
      - research/oslo-sentrum-kvadraturen-v1-six-20261023
    paths:
      - '.github/workflows/kvadraturen-krigsskolen-release-refresh-temp.yml'
permissions:
  contents: write
concurrency:
  group: kvadraturen-krigsskolen-release-oneoff
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-kvadraturen-v1-six-20261023
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install canonical audit dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify quiz production context and knowledge parity
        shell: bash
        run: |
          node scripts/audit-quiz-production-context.mjs
          node tests/oslo-sentrum-kvadraturen-six-research-preflight.mjs
      - name: Regenerate Fagverk release against final linked quiz
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit only generated release data
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | grep -v '^data/fagverk/fagverk_release.json$' >/tmp/other || true
          test ! -s /tmp/other || { cat /tmp/other; exit 1; }
          git add data/fagverk/fagverk_release.json
          if git diff --cached --quiet; then echo 'Already synchronized'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh Fagverk release for completed Krigsskolen 21-question quiz'
          git push origin HEAD:research/oslo-sentrum-kvadraturen-v1-six-20261023
