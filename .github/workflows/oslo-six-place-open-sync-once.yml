name: Oslo six place-open photo sync once
on:
  push:
    branches:
      - research/oslo-six-culture-institutions-v1-20261023
    paths:
      - .github/workflows/oslo-six-place-open-sync-once.yml

permissions:
  contents: write

jobs:
  sync-runtime-payloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-six-culture-institutions-v1-20261023
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Regenerate Place-open runtime with canonical project builder
        run: npm run place-open:build
      - name: Verify deterministic Place-open output
        run: npm run place-open:check
      - name: Guard changed files
        shell: bash
        run: |
          git diff --name-only
          CHANGED="$(git diff --name-only | grep -c . || true)"
          if [ "$CHANGED" -gt 12 ]; then
            echo "More than 12 runtime payloads changed; refuse automatic commit"
            exit 1
          fi
          if git diff --name-only | grep -Ev '^data/runtime/place-open/'; then
            echo "Unexpected non-place-open changes; refuse automatic commit"
            exit 1
          fi
      - name: Commit generated runtime and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u data/runtime/place-open
          git rm .github/workflows/oslo-six-place-open-sync-once.yml
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "Synchronize photo-bearing Place-open payloads using canonical generator"
          git push origin HEAD:research/oslo-six-culture-institutions-v1-20261023
