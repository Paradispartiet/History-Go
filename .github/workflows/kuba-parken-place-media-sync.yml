name: Kuba-parken photo import
on:
  push:
    branches: [work/oslo-akerselva-v1-bolk-20261116]
    paths: ['.github/workflows/kuba-parken-place-media-sync.yml']
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Import credited originals and regenerate place data
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          path = Path('data/places/natur/oslo/places_oslo_natur_akerselvarute/kuba_parken.json')
          place = json.loads(path.read_text())
          entries = [
              ('image','Kuba Oslo.JPG','c/c1/Kuba_Oslo.JPG','landscape',(3872,2592),(1500,1004),False,'25e95c482d2c1d23514e196ff84089749c5be64ab0497d4419fd385e8510cc7d','Parken ved den tidligere gassbeholderen, med Grünerløkka studenthus i bakgrunnen.','Helge Høifødt','CC BY-SA 3.0','https://creativecommons.org/licenses/by-sa/3.0/'),
              ('frontImage','Kuba park Kulturmiljø Oslo Akerselva 2026-01-15 01.jpg','d/de/Kuba_park_Kulturmilj%C3%B8_Oslo_Akerselva_2026-01-15_01.jpg','front',(8144,5424),(768,1024),True,'eab6adb35df7c744050fcfa9de07f0a4a9fe7dfd88912df3c793daee87b5bed7','Gangveien gjennom den snødekte parken.','Leonhard Lenz','CC0 1.0','https://creativecommons.org/publicdomain/zero/1.0/'),
          ]
          from urllib.parse import quote
          for field, origin, url_path, suffix, original_size, size, crop, sha, note, author, license_name, license_url in entries:
              output = f'bilder/places/kuba_parken_{suffix}.webp'
              assert Path(output).is_file()
              place[field] = output
              place[field+'Meta'] = {
                  'source':'wikimedia', 'sourcePage':'https://commons.wikimedia.org/wiki/File:' + quote(origin.replace(' ', '_')),
                  'originalUrl':f'https://upload.wikimedia.org/wikipedia/commons/{url_path}',
                  'fileTitle':origin, 'author':author, 'credit':f'{author} / Wikimedia Commons',
                  'licenseShortName':license_name, 'licenseUrl':license_url,
                  'originalWidth':original_size[0], 'originalHeight':original_size[1], 'outputWidth':size[0], 'outputHeight':size[1],
                  'verifiedAt':'2026-11-26', 'scopeNote':note, 'orientation':'portrait' if crop else 'landscape',
                  'transformation':'Beskåret til stående 3:4, nedskalert og konvertert til WebP.' if crop else 'Nedskalert og konvertert til WebP uten beskjæring.',
                  'sourceSha256':sha
              }
          path.write_text(json.dumps(place,ensure_ascii=False,indent=2)+'\n')
          PY
          node scripts/check-distinct-place-photos.mjs --place data/places/natur/oslo/places_oslo_natur_akerselvarute/kuba_parken.json --require-both
          npm run places:index:build
          npm run places:index:check
          npm run place-open:build
          npm run place-open:check
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/beier-image-audit.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('/tmp/beier-image-audit.json'));
          const file = 'data/places/place_image_backlog_summary.json';
          const summary = JSON.parse(fs.readFileSync(file));
          const {local,remote,optional,missing,invalid} = audit.summary;
          if (summary.totalPlaces !== audit.totalPlaces || invalid) throw Error('Unexpected image audit totals');
          Object.assign(summary, {
            generatedAt:'2026-11-26', generatedFromCommit:'Bildeaudit med Kuba-parken', note:'Bildeoversikten inkluderer Kuba-parken.',
            summary:{validLocal:local,validRemote:remote,optionalMissing:optional,missing,invalidLocalPath:invalid,remaining:missing+invalid},
            byCategory:Object.fromEntries(Object.entries(audit.byCategory).map(([key,row])=>[key,{total:row.total,valid:row.local+row.remote,optional:row.optional,missing:row.missing,invalid:row.invalid}]))
          });
          fs.writeFileSync(file,JSON.stringify(summary,null,2)+'\n');
          JS
          node scripts/audit-place-images.mjs --mode=all --verify-summary=data/places/place_image_backlog_summary.json
      - name: Save the verified photos and data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bilder/places/kuba_parken_{landscape,front}.webp data/places/natur/oslo/places_oslo_natur_akerselvarute/kuba_parken.json data/places/{places_index,place_image_backlog_summary}.json data/runtime/place-open/kuba_parken.json data/fagverk/fagverk_release.json
          git rm '.github/workflows/kuba-parken-place-media-sync.yml'
          git diff --cached --check
          git commit -m 'Add two verified photographs to Kuba-parken PlaceCard'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
