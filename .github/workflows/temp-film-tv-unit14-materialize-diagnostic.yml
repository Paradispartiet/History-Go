name: TEMP diagnose Film TV unit 14 materialization

on:
  push:
    branches:
      - agent/film-tv-unit14-archive-preservation-access-authenticity-source-brief
    paths:
      - ".trigger/unit14-materialize-diagnostic"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-tv-unit14-archive-preservation-access-authenticity-source-brief
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Diagnose case evidence overlaps after intended community repair
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const topicFile = 'data/fag/TV_og_Film/film_tv_archive_preservation_access_authenticity_topic_claims_v1.json';
          const caseFile = 'data/fag/TV_og_Film/film_tv_archive_preservation_access_authenticity_cases_v1.json';
          const topicsDoc = JSON.parse(fs.readFileSync(topicFile, 'utf8'));
          const casesDoc = JSON.parse(fs.readFileSync(caseFile, 'utf8'));
          const community = topicsDoc.topic_briefs.find((row) => row.emne_id === 'em_film_tv_dekolonisering_repatriering_og_fellesskapskontroll');
          if (!community) throw new Error('Community-control topic missing');
          if (!community.source_ids.includes('ap01-fiaf-code-ethics-2025')) community.source_ids.unshift('ap01-fiaf-code-ethics-2025');
          const caseById = new Map(casesDoc.cases.map((row) => [row.id, row]));
          const failures = [];
          for (const topic of topicsDoc.topic_briefs) {
            for (const caseId of topic.case_ids || []) {
              const item = caseById.get(caseId);
              if (!item) {
                failures.push({ emne_id: topic.emne_id, case_id: caseId, reason: 'missing_case' });
                continue;
              }
              const overlap = item.source_ids.filter((id) => topic.source_ids.includes(id));
              if (overlap.length === 0) {
                failures.push({
                  emne_id: topic.emne_id,
                  case_id: caseId,
                  topic_source_ids: topic.source_ids,
                  case_source_ids: item.source_ids
                });
              }
            }
          }
          fs.mkdirSync('reports/fagverk', { recursive: true });
          fs.writeFileSync('reports/fagverk/unit14-evidence-overlap-diagnostic.json', `${JSON.stringify({ failure_count: failures.length, failures }, null, 2)}\n`);
          EOF
          git add reports/fagverk/unit14-evidence-overlap-diagnostic.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record Film TV unit 14 evidence overlap gaps"
          git push origin HEAD:agent/film-tv-unit14-archive-preservation-access-authenticity-source-brief
