name: TEMP Subkultur Produksjonsledelse prerequisites

on:
  push:
    branches:
      - agent/civication-subkultur-produksjonsledelse-prerequisites-materialize

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') && !contains(github.event.head_commit.message, '[diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntax check prerequisite materializer
        run: node --check scripts/TEMP-materialize-subkultur-produksjonsledelse-prerequisites.mjs
      - name: Materialize prerequisite package
        run: node scripts/TEMP-materialize-subkultur-produksjonsledelse-prerequisites.mjs
      - name: Regenerate role-pack index
        run: node scripts/audit-civication-role-packs.mjs
      - name: Normalize generated role-pack EOF
        run: node -e "const fs=require('fs');const p='docs/CIVICATION_ROLE_PACK_INDEX.md';const s=fs.readFileSync(p,'utf8');fs.writeFileSync(p,s.replace(/\n+$/,'\n'));"
      - name: Regenerate scenario People
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - name: Verify scenario People parity
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
      - name: Test scenario People invariants
        run: node --test tests/civication-scenario-people.test.mjs
      - name: Regenerate career gameplay matrix
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Regenerate Role World readiness outputs
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Focused prerequisite gate
        shell: bash
        run: |
          set +e
          node tests/civication-subkultur-produksjonsledelse-prerequisites.test.js > /tmp/focused.log 2>&1
          status=$?
          cat /tmp/focused.log
          if [ "$status" -ne 0 ]; then
            mkdir -p reports
            {
              echo "TEMP diagnostic only — Produksjonsledelse prerequisite gate failed"
              echo "run_head=${GITHUB_SHA}"
              echo
              tail -n 120 /tmp/focused.log
            } > reports/TEMP_SUBKULTUR_PRODUKSJONSLEDELSE_PREREQUISITE_FAILURE.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/TEMP_SUBKULTUR_PRODUKSJONSLEDELSE_PREREQUISITE_FAILURE.txt
            git commit -m "TEMP: capture Produksjonsledelse prerequisite failure [diagnostic]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          exit "$status"
      - name: Subkultur career compatibility
        run: node tests/civication-subkultur-career-architecture.test.js
      - name: Career gameplay parity
        run: node scripts/audit-civication-career-gameplay.mjs --check
      - name: Role World readiness parity
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --check
      - name: Regenerate compiled scene registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Compiled scene registry parity
        run: node scripts/build-civication-scene-registry.mjs --check
      - name: Full Civication
        run: npm run test:civication
      - name: Repository diff gate
        run: git diff --check
      - name: Publish clean permanent prerequisite state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/TEMP-subkultur-produksjonsledelse-prerequisites.yml
          rm -f scripts/TEMP-materialize-subkultur-produksjonsledelse-prerequisites.mjs
          rm -f reports/TEMP_SUBKULTUR_PRODUKSJONSLEDELSE_PREREQUISITE_FAILURE.txt
          git add -A
          if git diff --cached --quiet; then
            echo "No permanent changes"
            exit 1
          fi
          git diff --cached --check
          git commit -m "Materialize Subkultur Produksjonsledelse prerequisites [materialized]"
          git push origin HEAD:${GITHUB_REF_NAME}
