name: Temporary sync PR 2142 with main

on:
  push:
    branches:
      - data/people-bislett-vif-historic-batch1-20260714
    paths:
      - .github/workflows/sync-pr2142-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/people-bislett-vif-historic-batch1-20260714
          fetch-depth: 0
      - name: Merge current main and preserve Bislett manifest entries
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          set -e

          manifest='data/people/manifest.json'
          if git ls-files -u -- "$manifest" | grep -q .; then
            git checkout --theirs -- "$manifest"
            python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/people/manifest.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          files = payload['files']
          additions = [
              'people/sport/oslo/bislett_stadion/leif_eriksen.json',
              'people/sport/oslo/bislett_stadion/pal_jacobsen.json',
              'people/sport/oslo/bislett_stadion/vidar_davidsen.json',
              'people/sport/oslo/bislett_stadion/egil_flemming_johansen.json',
              'people/sport/oslo/bislett_stadion/per_edmund_mordt.json',
          ]
          files[:] = [item for item in files if item not in additions]
          anchor = 'people/sport/oslo/people_sport_oslo_bislett_stadion_batch8.json'
          if anchor not in files:
              raise SystemExit('Bislett batch 8 manifest anchor not found')
          insert_at = files.index(anchor) + 1
          files[insert_at:insert_at] = additions
          path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
            git add "$manifest"
          fi

          if git ls-files -u | grep -q .; then
            echo 'Unresolved conflicts remain:'
            git ls-files -u
            exit 1
          fi

          git rm .github/workflows/sync-pr2142-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync Bislett batch with current main'
          git push origin HEAD:data/people-bislett-vif-historic-batch1-20260714
