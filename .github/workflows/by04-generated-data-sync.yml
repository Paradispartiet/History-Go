name: By04 one-time canonical generator
on:
  push:
    branches: [feature/by-bolk04-innlandet-vestfold-20-20261026]
    paths:
      - .github/workflows/by04-generated-data-sync.yml
permissions:
  contents: write
concurrency:
  group: by04-canonical-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout existing PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rebuild canonical place index and Place-open data
        run: |
          npm run places:index:build
          npm run place-open:build
      - name: Rebuild canonical Knowledge data
        id: knowledge
        continue-on-error: true
        run: npm run knowledge:canonical:write
      - name: Rebuild deterministic Fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Audit images and update canonical backlog summary
        run: |
          node scripts/audit-place-images.mjs --mode=all --report=reports/place-image-audit.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='data/places/place_image_backlog_summary.json';
          const old=JSON.parse(fs.readFileSync(path,'utf8'));
          const report=JSON.parse(fs.readFileSync('reports/place-image-audit.json','utf8'));
          if(report.totalPlaces!==old.totalPlaces) throw new Error('Unexpected total place count: '+report.totalPlaces);
          old.generatedAt='2026-10-26';
          old.generatedFromCommit=process.env.GITHUB_SHA||'by04-source-branch';
          old.summary={validLocal:report.summary.local,validRemote:report.summary.remote,optionalMissing:report.summary.optional,missing:report.summary.missing,invalidLocalPath:report.summary.invalid,remaining:report.summary.missing+report.summary.invalid};
          old.byCategory=Object.fromEntries(Object.entries(report.byCategory).map(([category,s])=>[category,{total:s.total,valid:s.local+s.remote,optional:s.optional,missing:s.missing,invalid:s.invalid}]));
          old.note='Oppdatert fra fullstendig place-image-audit etter By-bolk 04; eksterne bildepekere er ikke garanti for reell nettverks- eller lisenskontroll.';
          fs.writeFileSync(path,JSON.stringify(old,null,2)+'\n');
          console.log('Image summary regenerated:',old.summary);
          NODE
      - name: Commit generated snapshots to the existing PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fagverk/fagverk_release.json data/places/places_index.json data/places/place_image_backlog_summary.json data/runtime/place-open data/knowledge data/quiz reports/knowledge-id-backfill.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(by04): synchronize Knowledge Fagverk image and place-open canonical outputs'
            git push origin HEAD:feature/by-bolk04-innlandet-vestfold-20-20261026
          else
            echo 'Canonical outputs already up to date'
          fi
      - name: Verify deterministic releases
        run: |
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run knowledge:canonical:check
