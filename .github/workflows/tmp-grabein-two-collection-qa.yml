name: Gråbein two collection verification (temporary)
on:
  push:
    branches:
      - place/museumsleiligheten-grabein-production-20261009
permissions:
  contents: read
concurrency:
  group: tmp-grabein-rounds-push
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Render authenticated logo in square PlaceCard-safe image (temporary)
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import sharp from 'sharp';
          const original=fs.readFileSync('bilder/kort/brands/oslo_museum.svg');
          const artwork=await sharp(original,{density:200}).resize(490,350,{fit:'inside'}).png().toBuffer();
          const buf=await sharp({create:{width:640,height:640,channels:4,background:'#ffffff'}})
            .composite([{input:artwork,gravity:'centre'}]).webp({lossless:true}).toBuffer();
          fs.writeFileSync('/tmp/oslo_museum_logo_tile.webp',buf);
          const hash=crypto.createHash('sha256').update(buf).digest('hex');
          const b64=buf.toString('base64'),n=Math.ceil(b64.length/1200);
          console.log('HG_BRAND_TILE_SHA256 '+hash);
          console.log('HG_BRAND_TILE_START '+n);
          for(let i=0;i<n;i++)console.log('HG_BRAND_TILE_CHUNK '+i+' '+b64.slice(i*1200,(i+1)*1200));
          console.log('HG_BRAND_TILE_END '+n);
          NODE
      - name: Save full-quality wordmark tile for visual provenance inspection
        uses: actions/upload-artifact@v4
        with:
          name: grabein-oslo-museum-source-logo-tile
          path: /tmp/oslo_museum_logo_tile.webp
      - name: Contract tests
        run: node --test tests/museumsleiligheten-grabein-collections.test.mjs
      - name: Rebuild and verify source projections
        run: |
          node scripts/build-place-open-payloads.mjs --check
          node scripts/build-quiz-production-context.mjs --category historie --target museumsleiligheten_grabein --output data/quiz/production_context/historie/museumsleiligheten_grabein.json
          node scripts/build-quiz-production-context.mjs --category historie --target museumsleiligheten_grabein --output data/quiz/production_context/historie/museumsleiligheten_grabein.json --check
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Emit canonical regenerated artifacts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for(const [key,file] of [
            ['QUIZ','data/quiz/production_context/historie/museumsleiligheten_grabein.json'],
            ['RELEASE','data/fagverk/fagverk_release.json']]) {
            const value=fs.readFileSync(file,'utf8'),n=Math.ceil(value.length/1200);
            console.log('HG_GEN_START '+key+' '+n);
            for(let i=0;i<n;i++)console.log('HG_GEN_CHUNK '+key+' '+i+' '+JSON.stringify(value.slice(i*1200,(i+1)*1200)));
            console.log('HG_GEN_END '+key+' '+n);
          }
          NODE
      - name: Chrome desktop and mobile on actual Gråbein
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          export CHROME_BIN
          node scripts/tmp-grabein-two-collection-qa.mjs
      - name: Screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grabein-two-collections-20261009
          path: grabein-two-collections-*.png
          if-no-files-found: ignore
