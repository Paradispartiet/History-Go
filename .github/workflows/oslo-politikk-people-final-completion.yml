name: Complete Oslo politics People

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  complete:
    if: github.head_ref == 'agent/oslo-politikk-people-final-completion'
    runs-on: ubuntu-latest
    steps:
      - name: Check out final branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-politikk-people-final-completion
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Replay validated first three batches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/oslo-politikk-people-full-coverage
          git cherry-pick fefbdb4b82092249ee1537ec8d0c137fff0631c1

      - name: Add final documented people
        run: |
          python3 <<'PY'
          import json
          import pathlib
          import re
          import unicodedata

          ROOT = pathlib.Path('.')
          MANIFEST = ROOT / 'data/people/manifest.json'
          VERIFIED = '2026-07-24'

          def norm(value):
              text = unicodedata.normalize('NFKD', str(value or ''))
              text = ''.join(ch for ch in text if not unicodedata.combining(ch))
              return re.sub(r'[^a-z0-9]+', '', text.casefold())

          def initials(name):
              words = [w for w in re.split(r'\s+', name.replace('-', ' ')) if w]
              return ''.join(w[0].upper() for w in words)[:5]

          def read_people(path):
              doc = json.loads(path.read_text(encoding='utf-8'))
              if isinstance(doc, list):
                  return doc, True
              if isinstance(doc, dict) and isinstance(doc.get('id'), str):
                  return [doc], False
              raise RuntimeError(f'Unsupported People shape: {path}')

          def write_people(path, people, is_array):
              path.parent.mkdir(parents=True, exist_ok=True)
              value = people if is_array else people[0]
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          candidates = [
              dict(id='knut_knutsen', name='Knut Knutsen', aliases=['Knut Knutsen'], category='by', place='folkets_hus_oslo', year=1958, period='arkitekt_for_folkets_hus', desc='Arkitekten bak Folkets Hus-bygget oppført i 1958–1962.', popup='Knut Knutsen tegnet det nåværende Folkets Hus i Youngs gate, oppført i to byggetrinn 1958–1962 etter arkitektkonkurransen i 1939. Kortet gjelder hans direkte arkitektrolle ved Folkets Hus.', tags=['by','arkitektur','arbeiderbevegelsen','folkets_hus'], sources=['https://oslobyleksikon.no/side/Folkets_hus']),
              dict(id='bengt_espen_knudsen', name='Bengt Espen Knudsen', aliases=['Bengt Espen Knudsen'], category='by', place='folkets_hus_oslo', year=1985, period='arkitekt_for_tredje_byggetrinn', desc='Arkitekten bak Folkets Hus’ tredje byggetrinn fra 1985.', popup='Bengt Espen Knudsen tegnet det tredje byggetrinnet av Folkets Hus mot Hammersborggata og Møllergata, oppført i 1985. Kortet gjelder denne konkrete utvidelsen av anlegget.', tags=['by','arkitektur','arbeiderbevegelsen','folkets_hus'], sources=['https://oslobyleksikon.no/side/Folkets_hus']),
              dict(id='henrik_bull', name='Henrik Bull', aliases=['Henrik Bull'], category='by', place='regjeringskvartalet', year=1906, period='arkitekt_for_g_blokken', desc='Arkitekten bak G-blokken, det eldste bygget i Regjeringskvartalet.', popup='Henrik Bull tegnet G-blokken i Akersgata 40, ferdigstilt i 1906 som første byggetrinn i Regjeringskvartalet. Kortet gjelder hans dokumenterte arkitektrolle for den gamle regjeringsbygningen.', tags=['by','arkitektur','jugendstil','regjeringskvartalet','g_blokken'], sources=['https://www.regjeringen.no/no/tema/plan-bygg-og-eiendom/regjeringskvartalet/bygninger/id712727/','https://www.regjeringen.no/no/dep/fin/dep/om-den-gamle-regjeringsbygningen-g-blokka/id450008/']),
              dict(id='torstein_ramberg', name='Torstein Ramberg', aliases=['Torstein Ramberg'], category='by', place='regjeringskvartalet', year=1996, period='arkitekt_for_r5', desc='Arkitekten bak regjeringsbygget R5, tatt i bruk i 1996.', popup='Torstein Ramberg AS er dokumentert som arkitekt for R5 i Regjeringskvartalet, tatt i bruk i 1996. Kortet gjelder Torstein Rambergs direkte tilknytning til dette byggetrinnet.', tags=['by','arkitektur','regjeringskvartalet','r5'], sources=['https://www.regjeringen.no/no/tema/plan-bygg-og-eiendom/regjeringskvartalet/bygninger/id712727/']),
              dict(id='carl_iii_johan', name='Carl III Johan', aliases=['Carl III Johan','Karl III Johan','Carl Johan','Karl Johan'], category='historie', place='slottet', year=1825, period='byggherre_og_grunnsteinsnedleggelse', desc='Kongen som tok initiativet til Slottet og la ned grunnsteinen i 1825.', popup='Carl III Johan tok det avgjørende initiativet til en kongelig residens i Christiania, valgte ifølge tradisjonen tomten og la ned Slottets grunnstein 1. oktober 1825. Kortet gjelder hans direkte rolle som byggherre.', tags=['historie','monarki','slottet','byggherre'], sources=['https://www.kongehuset.no/kongelige-eiendommer/det-kongelige-slott/slottets-historie-og-arkitektur']),
              dict(id='oscar_i', name='Oscar I', aliases=['Oscar I','Oscar 1'], category='historie', place='slottet', year=1849, period='innviet_det_kongelige_slott', desc='Kongen som innviet Det kongelige slott i 1849.', popup='Oscar I sto for innvielsen av Det kongelige slott 26. juli 1849, fem år etter Carl Johans død. Kortet gjelder den dokumenterte innvielsen og ferdigstillingen av kongeboligen.', tags=['historie','monarki','slottet','innvielse'], sources=['https://www.kongehuset.no/kongelige-eiendommer/det-kongelige-slott/slottets-historie-og-arkitektur']),
              dict(id='heinrich_ernst_schirmer', name='Heinrich Ernst Schirmer', aliases=['Heinrich Ernst Schirmer'], category='by', place='slottet', year=1838, period='arkitektassistent_ved_slottsinnredningen', desc='Arkitektassistent for Linstow under innredningen av Slottet.', popup='Heinrich Ernst Schirmer arbeidet som assistent for Linstow da innredningsarbeidene ved Slottet startet. Kortet gjelder hans direkte arkitektarbeid i bygge- og innredningsfasen.', tags=['by','arkitektur','slottet','slottsinterior'], sources=['https://www.kongehuset.no/kongelige-eiendommer/det-kongelige-slott/slottets-historie-og-arkitektur']),
              dict(id='johan_henrik_nebelong', name='Johan Henrik Nebelong', aliases=['Johan Henrik Nebelong'], category='by', place='slottet', year=1838, period='arkitektassistent_ved_slottsinnredningen', desc='Arkitektassistent for Linstow under innredningen av Slottet.', popup='Johan Henrik Nebelong arbeidet som assistent for Linstow i innredningsfasen ved Det kongelige slott. Kortet gjelder hans konkrete arkitektrolle i anleggets ferdigstilling.', tags=['by','arkitektur','slottet','slottsinterior'], sources=['https://www.kongehuset.no/kongelige-eiendommer/det-kongelige-slott/slottets-historie-og-arkitektur']),
              dict(id='peter_fredrik_wergmann', name='Peter Fredrik Wergmann', aliases=['Peter Fredrik Wergmann','Peder Wergmann','Peter Wergmann'], category='kunst', place='slottet', year=1841, period='dekorasjonsmaler_pa_slottet', desc='Dekorasjonsmaleren bak pompeianske interiører på Slottet.', popup='Peter Fredrik Wergmann utførte blant annet de pompeianske dekorasjonene i Den daglige spisesal og Den store spisesal. Kortet gjelder hans dokumenterte utsmykningsarbeid ved Slottet.', tags=['kunst','dekorasjonsmaleri','slottet','slottsinterior'], sources=['https://www.kongehuset.no/kongelige-eiendommer/det-kongelige-slott/slottets-historie-og-arkitektur','https://www.kongehuset.no/kongelige-eiendommer/det-kongelige-slott/byggingen-av-slottet']),
              dict(id='johannes_flintoe', name='Johannes Flintoe', aliases=['Johannes Flintoe'], category='kunst', place='slottet', year=1841, period='utsmykket_fuglevaerelset', desc='Kunstneren som utsmykket Fugleværelset på Slottet.', popup='Johannes Flintoe utførte dekorasjonene med norske prospekter i Slottets Fugleværelse. Kortet gjelder hans direkte kunstneriske arbeid i kongeboligen.', tags=['kunst','maleri','slottet','fuglevaerelset'], sources=['https://www.kongehuset.no/kongelige-eiendommer/det-kongelige-slott/slottets-historie-og-arkitektur','https://www.kongehuset.no/kongelige-eiendommer/det-kongelige-slott/byggingen-av-slottet']),
              dict(id='peter_petersen_victoria_terrasse', name='Peter Petersen', aliases=['Peter Petersen'], category='naeringsliv', place='victoria_terrasse', year=1884, period='byggherre_for_victoria_terrasse', desc='Generalkonsulen som ledet interessentskapet bak Victoria terrasse.', popup='Peter Petersen ledet interessentskapet som oppførte Victoria terrasse som fasjonable leiegårder 1884–1890. Anlegget ble en tid kalt Petersborg etter ham. Kortet gjelder hans direkte byggherrerolle.', tags=['naeringsliv','eiendomsutvikling','victoria_terrasse','byggherre'], sources=['https://oslobyleksikon.no/side/Victoria_terrasse']),
              dict(id='henrik_thrap_meyer', name='Henrik Thrap-Meyer', aliases=['Henrik Thrap-Meyer','Henrik Thrap Meyer'], category='by', place='victoria_terrasse', year=1884, period='hovedarkitekt_for_victoria_terrasse', desc='Hovedarkitekten for Victoria terrasse.', popup='Henrik Thrap-Meyer var hovedarkitekt for bygningskomplekset Victoria terrasse, oppført 1884–1890. Kortet gjelder hans direkte hovedansvar for anleggets arkitektur.', tags=['by','arkitektur','historisme','victoria_terrasse'], sources=['https://oslobyleksikon.no/side/Victoria_terrasse']),
              dict(id='wilhelm_von_hanno', name='Wilhelm von Hanno', aliases=['Wilhelm von Hanno'], category='by', place='victoria_terrasse', year=1884, period='arkitekt_for_victoria_terrasse', desc='En av arkitektene som assisterte ved Victoria terrasse.', popup='Wilhelm von Hanno er dokumentert som en av arkitektene som assisterte hovedarkitekt Henrik Thrap-Meyer ved Victoria terrasse. Kortet gjelder denne konkrete arkitektrollen.', tags=['by','arkitektur','historisme','victoria_terrasse'], sources=['https://oslobyleksikon.no/side/Victoria_terrasse']),
              dict(id='paul_due', name='Paul Due', aliases=['Paul Due'], category='by', place='victoria_terrasse', year=1884, period='arkitekt_for_victoria_terrasse', desc='En av arkitektene som assisterte ved Victoria terrasse.', popup='Paul Due er dokumentert som en av arkitektene som assisterte hovedarkitekt Henrik Thrap-Meyer ved oppføringen av Victoria terrasse. Kortet gjelder denne direkte arkitektkoblingen.', tags=['by','arkitektur','historisme','victoria_terrasse'], sources=['https://oslobyleksikon.no/side/Victoria_terrasse']),
              dict(id='bernhard_steckmest', name='Bernhard Steckmest', aliases=['Bernhard Steckmest'], category='by', place='victoria_terrasse', year=1884, period='arkitekt_for_victoria_terrasse', desc='En av arkitektene som assisterte ved Victoria terrasse.', popup='Bernhard Steckmest er dokumentert som en av arkitektene som assisterte hovedarkitekt Henrik Thrap-Meyer ved Victoria terrasse. Kortet gjelder denne konkrete arkitektrollen.', tags=['by','arkitektur','historisme','victoria_terrasse'], sources=['https://oslobyleksikon.no/side/Victoria_terrasse']),
              dict(id='henrik_ibsen', name='Henrik Ibsen', aliases=['Henrik Ibsen'], category='litteratur', place='victoria_terrasse', year=1891, period='bodde_og_skrev_pa_victoria_terrasse', desc='Forfatteren som bodde og skrev i Victoria terrasse på 1890-tallet.', popup='Henrik Ibsen bodde i sørkvartalet på Victoria terrasse og skrev blant annet Byggmester Solness og Lille Eyolf der. Kortet gjelder hans dokumenterte bolig- og arbeidssted.', tags=['litteratur','dramatikk','victoria_terrasse','forfatterbolig'], sources=['https://www.regjeringen.no/no/aktuelt/utenriksministerens-tale-ved-markeringen-av-fredningsvedtaket-for-victoria-terrasse/id3093157/']),
              dict(id='johan_nygaardsvold', name='Johan Nygaardsvold', aliases=['Johan Nygaardsvold'], category='politikk', place='victoria_terrasse', year=1940, period='regjeringskonferansen_9_april_1940', desc='Statsministeren under regjeringens avslag på det tyske ultimatumet.', popup='Johan Nygaardsvolds regjering var samlet på Halvdan Kohts kontor i Victoria terrasse da den tidlig 9. april 1940 besluttet å avslå Nazi-Tysklands ultimatum. Kortet gjelder denne konkrete regjeringskonferansen.', tags=['politikk','andre_verdenskrig','victoria_terrasse','9_april_1940'], sources=['https://www.regjeringen.no/no/dep/smk/ansvarsomrader/forloperne/1905-1945/1940-norges-forste-nei/id2405916/']),
              dict(id='curt_brauer', name='Curt Bräuer', aliases=['Curt Bräuer','Curt Brauer'], category='historie', place='victoria_terrasse', year=1940, period='overbrakte_det_tyske_ultimatumet', desc='Den tyske sendemannen som mottok Norges avslag 9. april 1940.', popup='Curt Bräuer kom til Victoria terrasse tidlig 9. april 1940 for å overbringe Nazi-Tysklands ultimatum og mottok avslaget fra utenriksminister Halvdan Koht. Kortet gjelder dette dokumenterte møtet.', tags=['historie','andre_verdenskrig','diplomati','victoria_terrasse'], sources=['https://www.regjeringen.no/no/dep/smk/ansvarsomrader/forloperne/1905-1945/1940-norges-forste-nei/id2405916/']),
              dict(id='christian_mohr', name='Christian Mohr', aliases=['Christian Mohr'], category='historie', place='victoria_terrasse', year=1940, period='tok_imot_curt_brauer', desc='Sekretæren som tok imot Curt Bräuer ved Victoria terrasse.', popup='Christian Mohr, utenriksministerens sekretær, møtte Curt Bräuer ved hovedporten og førte ham opp trappene i Victoria terrasse tidlig 9. april 1940. Kortet gjelder denne direkte hendelsesrollen.', tags=['historie','andre_verdenskrig','utenrikstjenesten','victoria_terrasse'], sources=['https://www.regjeringen.no/no/dep/smk/ansvarsomrader/forloperne/1905-1945/1940-norges-forste-nei/id2405916/']),
              dict(id='christian_p_reusch', name='Christian P. Reusch', aliases=['Christian P. Reusch','Christian Reusch'], category='historie', place='victoria_terrasse', year=1940, period='forte_brauer_til_biblioteket', desc='Byråsjefen som førte Curt Bräuer inn i biblioteket 9. april 1940.', popup='Christian P. Reusch var byråsjef i Utenriksdepartementets politiske avdeling og førte Curt Bräuer til biblioteket i Victoria terrasse før møtet med Halvdan Koht. Kortet gjelder denne dokumenterte hendelsesrollen.', tags=['historie','andre_verdenskrig','utenrikstjenesten','victoria_terrasse'], sources=['https://www.regjeringen.no/no/dep/smk/ansvarsomrader/forloperne/1905-1945/1940-norges-forste-nei/id2405916/']),
          ]

          manifest = json.loads(MANIFEST.read_text(encoding='utf-8'))
          docs = {}
          name_hits = {}
          id_hits = {}
          for rel in manifest['files']:
              path = ROOT / 'data' / rel
              people, is_array = read_people(path)
              docs[path] = [people, is_array]
              for idx, person in enumerate(people):
                  id_hits.setdefault(person.get('id'), []).append((path, idx))
                  name_hits.setdefault(norm(person.get('name')), []).append((path, idx))

          created = {category: [] for category in ['by','historie','kunst','litteratur','naeringsliv','politikk']}
          resolved = []
          for cand in candidates:
              matches = []
              seen = set()
              for alias in cand['aliases']:
                  for hit in name_hits.get(norm(alias), []):
                      if hit not in seen:
                          seen.add(hit)
                          matches.append(hit)
              if len(matches) > 1:
                  raise RuntimeError(f"Ambiguous canonical identity for {cand['name']}: {matches}")
              if len(matches) == 1:
                  path, idx = matches[0]
                  person = docs[path][0][idx]
                  places = list(person.get('places') or [])
                  existing_place = person.get('placeId')
                  if existing_place and existing_place not in places:
                      places.append(existing_place)
                  if cand['place'] not in places:
                      places.append(cand['place'])
                  person['places'] = places
                  person.setdefault('placeId', cand['place'])
                  urls = list(person.get('source_urls') or [])
                  for url in cand['sources']:
                      if url not in urls:
                          urls.append(url)
                  person['source_urls'] = urls
                  person.setdefault('verifiedAt', VERIFIED)
                  resolved.append((person['id'], cand['name'], cand['place'], 'reused', str(path)))
                  continue

              if cand['id'] in id_hits:
                  raise RuntimeError(f"ID collision for new identity {cand['id']}")
              person = {
                  'id': cand['id'],
                  'name': cand['name'],
                  'initials': initials(cand['name']),
                  'desc': cand['desc'],
                  'tags': cand['tags'],
                  'placeId': cand['place'],
                  'places': [cand['place']],
                  'category': cand['category'],
                  'year': cand['year'],
                  'period': cand['period'],
                  'popupDesc': cand['popup'],
                  'image': '',
                  'cardImage': '',
                  'source_urls': cand['sources'],
                  'verifiedAt': VERIFIED,
              }
              created[cand['category']].append(person)
              resolved.append((cand['id'], cand['name'], cand['place'], 'created', cand['category']))

          for path, (people, is_array) in docs.items():
              write_people(path, people, is_array)

          for category, people in created.items():
              if not people:
                  continue
              rel = f'people/{category}/oslo/people_{category}_oslo_politics_places_batch_04.json'
              path = ROOT / 'data' / rel
              write_people(path, people, True)
              if rel not in manifest['files']:
                  manifest['files'].append(rel)

          if len(manifest['files']) != len(set(manifest['files'])):
              raise RuntimeError('Duplicate People manifest entries')
          MANIFEST.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          expected = {cand['name']: cand['place'] for cand in candidates}
          test = '''const fs = require("fs");\nconst path = require("path");\nconst root = path.resolve(__dirname, "..");\nconst manifest = JSON.parse(fs.readFileSync(path.join(root, "data/people/manifest.json"), "utf8"));\nconst people = [];\nfor (const rel of manifest.files) {\n  const doc = JSON.parse(fs.readFileSync(path.join(root, "data", rel), "utf8"));\n  people.push(...(Array.isArray(doc) ? doc : [doc]));\n}\nconst expected = ''' + json.dumps(expected, ensure_ascii=False, indent=2) + ''';\nfor (const [name, placeId] of Object.entries(expected)) {\n  const matches = people.filter((person) => person.name === name || (name === "Carl III Johan" && ["Karl III Johan", "Carl Johan", "Karl Johan"].includes(person.name)) || (name === "Peter Fredrik Wergmann" && ["Peder Wergmann", "Peter Wergmann"].includes(person.name)) || (name === "Curt Bräuer" && person.name === "Curt Brauer") || (name === "Christian P. Reusch" && person.name === "Christian Reusch"));\n  if (matches.length !== 1) throw new Error(`${name}: expected one canonical identity, got ${matches.length}`);\n  const person = matches[0];\n  const places = new Set([...(person.places || []), person.placeId].filter(Boolean));\n  if (!places.has(placeId)) throw new Error(`${name}: missing ${placeId}`);\n  if (!Array.isArray(person.source_urls) || person.source_urls.length === 0) throw new Error(`${name}: missing source_urls`);\n}\nconst minimums = { folkets_hus_oslo: 5, regjeringskvartalet: 12, slottet: 13, victoria_terrasse: 13 };\nfor (const [placeId, minimum] of Object.entries(minimums)) {\n  const count = people.filter((person) => new Set([...(person.places || []), person.placeId].filter(Boolean)).has(placeId)).length;\n  if (count < minimum) throw new Error(`${placeId}: ${count} < ${minimum}`);\n  console.log(`${placeId}: ${count}`);\n}\nconsole.log(`Final politics People expansion OK: ${Object.keys(expected).length} documented identities`);\n'''
          test_path = ROOT / 'tests/oslo-politikk-final-people-expansion.test.js'
          test_path.write_text(test, encoding='utf-8')

          check_path = ROOT / 'scripts/check-people.sh'
          check = check_path.read_text(encoding='utf-8')
          command = 'node tests/oslo-politikk-final-people-expansion.test.js'
          if command not in check:
              marker = 'echo "== People check complete =="'
              if marker not in check:
                  raise RuntimeError('People completion marker missing')
              block = 'echo "== Oslo politics final People expansion =="\n' + command + '\n\n'
              check = check.replace(marker, block + marker)
              check_path.write_text(check, encoding='utf-8')

          report_dir = ROOT / 'reports/oslo-politikk-people-full-coverage'
          report_dir.mkdir(parents=True, exist_ok=True)
          lines = ['# Siste People-utvidelse for Oslo-politikksteder', '', '## Resultat', '', f'- kandidater behandlet: {len(candidates)}', f'- nye personposter: {sum(len(v) for v in created.values())}', f'- eksisterende canonical personer gjenbrukt: {sum(1 for x in resolved if x[3] == "reused")}', '', '## Koblinger', '']
          for pid, name, place, mode, location in resolved:
              lines.append(f'- {name} (`{pid}`) → `{place}` — {mode} ({location})')
          lines += ['', '## Kilder', '', '- Folkets Hus: Oslo byleksikon', '- Regjeringskvartalet: Regjeringen.no', '- Slottet: Kongehuset.no', '- Victoria terrasse: Oslo byleksikon og Regjeringen.no', '']
          (report_dir / 'final-expansion-batch-04.md').write_text('\n'.join(lines), encoding='utf-8')

          print('\n'.join(lines[:8]))
          PY

      - name: Rebuild generated People surfaces
        run: |
          npm run civication:history-people:build
          npm run build:web

      - name: Run locked People tests
        run: |
          set -o pipefail
          mkdir -p reports/oslo-politikk-people-full-coverage
          {
            node tests/oslo-politikk-people-full-coverage.test.js
            node tests/oslo-politikk-remaining-people-expansion.test.js
            node tests/oslo-politikk-final-people-expansion.test.js
          } 2>&1 | tee reports/oslo-politikk-people-full-coverage/coverage-test.log

      - name: Run full gates
        run: |
          set -o pipefail
          bash scripts/check-people.sh 2>&1 | tee reports/oslo-politikk-people-full-coverage/check-people.log
          bash scripts/check-places.sh 2>&1 | tee reports/oslo-politikk-people-full-coverage/check-places.log
          {
            npm run typecheck:web
            npm run typecheck:scripts
            npm run typecheck:tools
          } 2>&1 | tee reports/oslo-politikk-people-full-coverage/typecheck.log

      - name: Publish completed branch
        run: |
          rm .github/workflows/oslo-politikk-people-final-completion.yml
          git diff --check
          git status --short
          git add -A
          git commit -m "Fullfør People ved Oslo-politikksteder"
          git push origin HEAD:agent/oslo-politikk-people-final-completion
