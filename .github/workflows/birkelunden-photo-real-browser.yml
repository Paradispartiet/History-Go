name: Birkelunden photo real-browser acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/birkelunden-photo-real-browser.yml'
      - 'tests/birkelunden-photo-real-browser.test.mjs'
      - 'data/places/by/oslo/places/birkelunden.json'
      - 'data/runtime/place-open/birkelunden.json'
      - 'bilder/places/birkelunden_hero_tore_saetre_2015.jpg'
      - 'bilder/places/birkelunden_front_oslo_byarkiv_1920.jpg'
permissions:
  contents: read
jobs:
  real-browser-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify real Birkelunden main and front photos at four sizes
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node tests/birkelunden-photo-real-browser.test.mjs
      - name: Save photo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birkelunden-photo-real-browser
          path: artifacts/birkelunden-photo-real-browser/**
          if-no-files-found: ignore
          retention-days: 14
