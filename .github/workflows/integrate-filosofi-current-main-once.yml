name: Integrate complete Philosophy on current main once

on:
  push:
    branches:
      - agent/complete-philosophy-fagverk-materialize
    paths:
      - scripts/materialize-filosofi-complete.mjs
      - scripts/polish-filosofi-complete.mjs
      - scripts/audit-fagverk-filosofi-phase3.mjs
      - tests/fagverk-filosofi-complete.test.mjs
      - tests/fagverk-filosofi-editorial-style.test.mjs
      - .github/workflows/integrate-filosofi-current-main-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-philosophy-fagverk-materialize
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preserve newer shared status version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/materialize-filosofi-complete.mjs')
          s=p.read_text()
          old="status.version='1.85.0'; status.updatedAt='2026-08-14';"
          new="status.version=status.version || '1.85.0'; status.updatedAt='2026-08-14';"
          if old not in s:
              raise SystemExit('Expected subject status version assignment not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Materialize Philosophy on current main state
        run: |
          node --check scripts/materialize-filosofi-complete.mjs
          node scripts/materialize-filosofi-complete.mjs
      - name: Apply final Philosophy editorial polish
        run: |
          node --check scripts/polish-filosofi-complete.mjs
          node scripts/polish-filosofi-complete.mjs
      - name: Rebuild shared release and Philosophy audits
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-fagverk-filosofi-phase3.mjs --write-report
          node tools/validate-filosofi-theory-quality.mjs
      - name: Validate completion and editorial quality
        run: |
          node --test tests/fagverk-filosofi-complete.test.mjs
          node --test tests/fagverk-filosofi-editorial-style.test.mjs
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('reports/fagverk/filosofi-complete-audit.json','utf8'));
          if(a.status!=='filosofi_complete') throw new Error('Philosophy completion audit not complete');
          if(Object.values(a.gates).some(v=>v!==true)) throw new Error('Philosophy completion gate failed');
          if(a.summary.minimum_words_per_article<1200) throw new Error('Philosophy article depth below polish threshold');
          const r=JSON.parse(fs.readFileSync('data/fagverk/filosofi/filosofi_article_registry_v1.json','utf8'));
          if(r.counts.standalone_articles!==54 || r.counts.integrated_concepts!==162 || r.counts.chapters!==13) throw new Error('Philosophy coverage incomplete');
          const status=JSON.parse(fs.readFileSync('data/fagverk/subject_status.json','utf8'));
          if(status.version!=='1.86.0') throw new Error(`Shared subject status version regressed: ${status.version}`);
          NODE
      - name: Commit integrated deterministic outputs and remove one-shot workflow
        run: |
          rm .github/workflows/integrate-filosofi-current-main-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fagverk/filosofi data/fagverk/fagverk_registry.json data/fagverk/fagverk_release.json data/fagverk/subject_status.json reports/fagverk/filosofi-complete-audit.json reports/fagverk/filosofi-phase3-audit.json scripts/materialize-filosofi-complete.mjs .github/workflows/integrate-filosofi-current-main-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate complete Philosophy on current main'
          git push origin HEAD:agent/complete-philosophy-fagverk-materialize
