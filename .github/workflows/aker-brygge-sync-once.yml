name: Aker Brygge one-off branch sync

on:
  push:
    branches:
      - work/aker-brygge-fagverk-v2-20260902
    paths:
      - .github/workflows/aker-brygge-sync-once.yml

permissions:
  contents: write

jobs:
  sync-generated-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Merge current main with deterministic conflict handling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "data/fagverk/fagverk_release.json" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --theirs -- data/fagverk/fagverk_release.json
            git add data/fagverk/fagverk_release.json
          fi
          if git diff --cached --quiet; then
            echo "Branch already contains current main."
          else
            git commit -m "Merge current main into Aker Brygge Fagverk"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Regenerate canonical derived artifacts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/materialize-natur-final-registry.mjs
          node scripts/build-fagverk-release-manifest.mjs
          npm run place-open:build
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/place-image-audit.json
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/place-image-audit.json', 'utf8'));
          const target = 'data/places/place_image_backlog_summary.json';
          const saved = JSON.parse(fs.readFileSync(target, 'utf8'));
          const byCategory = {};
          for (const [id, bucket] of Object.entries(report.byCategory || {})) {
            const previous = saved.byCategory?.[id] || {};
            byCategory[id] = {
              total: bucket.total,
              valid: bucket.local + bucket.remote,
              optional: bucket.optional,
              missing: bucket.missing,
              invalid: bucket.invalid
            };
            if (previous.designAlias) byCategory[id].designAlias = previous.designAlias;
          }
          saved.generatedAt = new Date().toISOString().slice(0, 10);
          saved.generatedFromCommit = 'aker_brygge_fagverk_v2_20260902';
          saved.totalPlaces = report.totalPlaces;
          saved.summary = {
            validLocal: report.summary.local,
            validRemote: report.summary.remote,
            optionalMissing: report.summary.optional,
            missing: report.summary.missing,
            invalidLocalPath: report.summary.invalid,
            remaining: report.summary.missing + report.summary.invalid
          };
          saved.byCategory = byCategory;
          fs.writeFileSync(target, JSON.stringify(saved, null, 2) + '\n');
          NODE
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run place-open:check
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/place-image-audit-verified.json --verify-summary=data/places/place_image_backlog_summary.json
          node scripts/audit-fagverk-place-pages.mjs

      - name: Commit merged and generated state, then remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/aker-brygge-sync-once.yml
          git add data/fagverk/fagverk_registry.json
          git add data/fagverk/fagverk_release.json
          git add data/places/place_image_backlog_summary.json
          git add data/runtime/place-open
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Sync Aker Brygge generated artifacts on current main"
          fi
          git push origin HEAD:work/aker-brygge-fagverk-v2-20260902
