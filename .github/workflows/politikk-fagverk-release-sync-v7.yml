name: Politikk v7 one-time Fagverk release synchronization

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/politikk-fagverk-release-sync-v7.yml'

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/politikk-poland-pathway-activation-v7-20261021'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild existing deterministic Fagverk release manifest
        run: |
          node scripts/materialize-natur-final-registry.mjs
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Guard scope and commit
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          while IFS= read -r change; do
            file="${change:3}"
            case "$file" in
              data/fagverk/fagverk_release.json) ;;
              *) echo "Unexpected release generator change: $file" >&2; exit 1 ;;
            esac
          done < <(git status --porcelain)
          git add -- data/fagverk/fagverk_release.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(fagverk): sync release digest for Politikks Poland subject'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
