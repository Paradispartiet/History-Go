name: Prepare Hestehov visual review asset

on:
  push:
    branches:
      - flora/quality-approval-20261028
    paths:
      - 'scripts/prepare-hestehov-approval.py'
      - '.github/workflows/prepare-hestehov-approval.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/prepare-hestehov-approval.py
      - name: Commit prepared image to review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/natur/flora/godkjenningskandidater/hestehov_var_clean.webp data/natur/flora/hestehov-cleanup-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Prepare cleaned Hestehov image for manual botanical review"
            git push
          fi
