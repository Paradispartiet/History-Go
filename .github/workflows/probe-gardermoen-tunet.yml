name: Probe Gardermoen Tunet source objects

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  probe:
    if: github.head_ref == 'agent/akershus-gardermoen-tunet-production'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch museum, tun and address objects
        shell: bash
        run: |
          set -euo pipefail
          out='reports/akershus-coordinate-gardermoen-tunet-source-probe'
          mkdir -p "$out"

          curl --fail --location --retry 4 --retry-delay 3 \
            -A 'History-Go coordinate verification/1.0' \
            'https://api.openstreetmap.org/api/0.6/node/6593405620' \
            | tee "$out/osm-node-6593405620.xml" >/dev/null

          curl --fail --location --retry 4 --retry-delay 3 \
            -A 'History-Go coordinate verification/1.0' \
            'https://nominatim.openstreetmap.org/lookup?osm_ids=N6593405620&format=jsonv2&addressdetails=1&extratags=1&namedetails=1' \
            | tee "$out/nominatim-ullensaker-museum.json" >/dev/null

          curl --fail --location --retry 4 --retry-delay 3 \
            -A 'History-Go coordinate verification/1.0' \
            'https://api.openstreetmap.org/api/0.6/map?bbox=11.0660,60.1880,11.0735,60.1945' \
            | tee "$out/osm-gardermoen-tunet-bbox.xml" >/dev/null

          for query in 'Tunvegen Gardermoen' 'Tunvegen 1 Gardermoen' 'Tunvegen 2 Gardermoen'; do
            slug=$(printf '%s' "$query" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
            curl --fail --location --retry 4 --retry-delay 3 \
              --get 'https://ws.geonorge.no/adresser/v1/sok' \
              --data-urlencode "sok=$query" \
              --data-urlencode 'kommunenummer=3209' \
              --data-urlencode 'treffPerSide=50' \
              | tee "$out/geonorge-${slug}.json" >/dev/null
          done

          python - <<'PY' | tee "$out/source-summary.txt"
          import json
          import math
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out=Path('reports/akershus-coordinate-gardermoen-tunet-source-probe')
          legacy=(60.1986,11.0782)
          museum=(60.1911316,11.0698695)

          def hav(a,b):
              R=6371000.0; p1,p2=map(math.radians,(a[0],b[0])); dp=math.radians(b[0]-a[0]); dl=math.radians(b[1]-a[1]); h=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2; return 2*R*math.asin(math.sqrt(h))

          root=ET.parse(out/'osm-node-6593405620.xml').getroot(); node=root.find('node')
          tags={t.attrib['k']:t.attrib['v'] for t in node.findall('tag')}
          print(f'museum_lat={museum[0]:.12f}')
          print(f'museum_lon={museum[1]:.12f}')
          print(f'museum_distance_from_legacy_m={hav(legacy,museum):.1f}')
          print('museum_tags='+json.dumps(tags,ensure_ascii=False,sort_keys=True))

          nom=json.loads((out/'nominatim-ullensaker-museum.json').read_text())
          print('nominatim='+json.dumps(nom,ensure_ascii=False,sort_keys=True))

          seen=set()
          for filename in ('geonorge-tunvegen-gardermoen.json','geonorge-tunvegen-1-gardermoen.json','geonorge-tunvegen-2-gardermoen.json'):
              payload=json.loads((out/filename).read_text())
              addresses=payload.get('adresser',[]) if isinstance(payload,dict) else []
              print(f'{filename}:total={len(addresses)}')
              for a in addresses:
                  key=(a.get('adressekode'),a.get('nummer'),a.get('bokstav'))
                  if key in seen: continue
                  seen.add(key)
                  p=a.get('representasjonspunkt') or {}
                  if not p: continue
                  point=(float(p['lat']),float(p['lon']))
                  if hav(point,museum)>500: continue
                  print('ADDRESS '+json.dumps(a,ensure_ascii=False,sort_keys=True))
                  print(f'distance_to_museum_m={hav(point,museum):.1f} distance_from_legacy_m={hav(legacy,point):.1f}')

          site=ET.parse(out/'osm-gardermoen-tunet-bbox.xml').getroot()
          nodes={n.attrib['id']:(float(n.attrib['lat']),float(n.attrib['lon'])) for n in site.findall('node')}
          rows=[]
          for elem in list(site):
              etags={t.attrib['k']:t.attrib['v'] for t in elem.findall('tag')}
              hay=' '.join(str(v) for v in etags.values()).lower()
              relevant=any(k in hay for k in ('ullensaker museum','telthuset','kornmagasin','depot 148','ballong','rawind','posthuset','furua','tunet','lilleplassen','gardermoen')) or etags.get('tourism')=='museum'
              if not relevant and not (elem.tag=='way' and etags.get('building')): continue
              row={'type':elem.tag,'id':elem.attrib.get('id'),'tags':etags}
              if elem.tag=='node': row['lat']=float(elem.attrib['lat']); row['lon']=float(elem.attrib['lon'])
              elif elem.tag=='way':
                  pts=[nodes[nd.attrib['ref']] for nd in elem.findall('nd') if nd.attrib['ref'] in nodes]
                  if pts:
                      row['lat']=sum(p[0] for p in pts)/len(pts); row['lon']=sum(p[1] for p in pts)/len(pts)
              if 'lat' in row:
                  row['distance_to_museum_m']=round(hav((row['lat'],row['lon']),museum),1)
                  row['distance_from_legacy_m']=round(hav((row['lat'],row['lon']),legacy),1)
              rows.append(row)
          rows.sort(key=lambda r:(0 if r.get('tags',{}).get('name') else 1,r.get('distance_to_museum_m',999999)))
          print('bbox_relevant='+json.dumps(rows[:80],ensure_ascii=False,sort_keys=True))
          PY

      - name: Remove probe workflow and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/probe-gardermoen-tunet.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/akershus-coordinate-gardermoen-tunet-source-probe .github/workflows/probe-gardermoen-tunet.yml
          git commit -m 'Persist Gardermoen Tunet coordinate source evidence'
          git push origin HEAD:${{ github.head_ref }}
