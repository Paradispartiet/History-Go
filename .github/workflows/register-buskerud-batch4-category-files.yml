name: Register Buskerud batch 4 category files

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/register-buskerud-batch4-category-files.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reduce history batch and update places manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          batch_path = Path('data/places/historie/buskerud/places_historie_buskerud_batch4.json')
          batch = json.loads(batch_path.read_text(encoding='utf-8'))
          keep_ids = {
              'laagdalsmuseet',
              'fiskum_gamle_kirke',
              'hvalsmoen_leir',
              'dagali_museum',
          }
          reduced = [place for place in batch if place.get('id') in keep_ids]
          expected_order = [
              'laagdalsmuseet',
              'fiskum_gamle_kirke',
              'hvalsmoen_leir',
              'dagali_museum',
          ]
          by_id = {place['id']: place for place in reduced}
          if set(by_id) != keep_ids:
              raise SystemExit(f'Unexpected retained IDs: {sorted(by_id)}')
          reduced = [by_id[place_id] for place_id in expected_order]
          if any(place.get('category') != 'historie' for place in reduced):
              raise SystemExit('Retained batch 4 place has non-historie category')
          batch_path.write_text(
              json.dumps(reduced, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          manifest_path = Path('data/places/manifest.json')
          data = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = data['files']
          anchor = 'places/historie/buskerud/places_historie_buskerud_batch4.json'
          additions = [
              'places/naeringsliv/buskerud/kjerraten_i_asa.json',
              'places/naeringsliv/buskerud/hassel_jernverk.json',
              'places/vitenskap/buskerud/bergseminaret_kongsberg.json',
              'places/by/buskerud/gamle_nesbyen.json',
          ]
          for item in additions:
              while item in files:
                  files.remove(item)
          insert_at = files.index(anchor) + 1
          files[insert_at:insert_at] = additions
          manifest_path.write_text(
              json.dumps(data, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8',
          )
          PY
      - name: Commit changes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/historie/buskerud/places_historie_buskerud_batch4.json data/places/manifest.json
          git rm .github/workflows/register-buskerud-batch4-category-files.yml
          git commit -m "Split and register Buskerud batch 4 category files"
          git push origin main

# Triggered after workflow registration on the default branch.
