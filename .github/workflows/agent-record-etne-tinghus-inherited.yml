name: Record Etne Tinghus inherited failures

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  record:
    if: github.head_ref == 'agent/fill-etne-tinghus-rounds-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false
      - name: Reuse embedded Tinghus generator
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, re, zlib
          from pathlib import Path
          workflow = Path('.github/workflows/agent-fill-etne-tinghus-rounds.yml').read_text(encoding='utf-8')
          match = re.search(r"b64decode\('''([^']+)'''\)", workflow, re.S)
          if not match:
              raise SystemExit('Embedded Tinghus generator not found')
          exec(zlib.decompress(base64.b64decode(match.group(1))).decode('utf-8'))
          PY
      - name: Record inherited results
        shell: bash
        run: |
          set +e
          report=reports/etne-tinghus-inherited-test-diagnostic.txt
          : > "$report"
          while IFS= read -r testfile; do
            echo "=== RUN $testfile ===" >> "$report"
            node "$testfile" >> "$report" 2>&1
            status=$?
            if [ $status -ne 0 ]; then
              echo "=== FAILED $testfile ($status) ===" >> "$report"
            else
              echo "=== PASS $testfile ===" >> "$report"
            fi
          done < <(find tests -maxdepth 1 -type f -name '*batch1-round-content.test.js' \
            | grep -E '/(etne|etnesjoen|skanevik|steinsvollen|engebanen|skakkeringen|osnes|sjokanten|fikse)[^/]*batch1-round-content\.test\.js$' \
            | grep -v 'etne-tinghus-batch1-round-content.test.js' \
            | sort)
          cat "$report"
          exit 0
      - name: Commit diagnostic report
        shell: bash
        run: |
          git config user.name "History Go data agent"
          git config user.email "history-go-agent@users.noreply.github.com"
          git add reports/etne-tinghus-inherited-test-diagnostic.txt
          if git diff --cached --quiet; then
            echo "Diagnostic report unchanged"
          else
            git commit -m "Record Etne Tinghus inherited test diagnostic"
            git push origin HEAD:${{ github.head_ref }}
          fi
