name: Temporary Oslo batch04 canonical Knowledge sync
on:
  push:
    branches:
      - history-go/oslo-batch04-final-question-and-browser-20261022
    paths:
      - '.github/workflows/oslo-batch04-temporary-knowledge-sync.yml'
      - 'data/quiz/by/grev_wedels_plass_sets.json'
      - 'data/quiz/production_briefs/by/grev_wedels_plass.json'
      - 'data/quiz/production_context/by/grev_wedels_plass.json'
permissions:
  contents: write
concurrency:
  group: oslo-batch04-temporary-knowledge-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rebuild canonical Knowledge from source quiz
        run: node --experimental-strip-types scripts/knowledge-canonical-data.mts --write
      - name: Commit generated Knowledge on the current branch
        shell: bash
        run: |
          set -euo pipefail
          git add data/knowledge/knowledge_units.generated.json data/knowledge/concepts.generated.json reports/knowledge-id-backfill.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(history): synchronize final Grev Wedels preservation Knowledge'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
