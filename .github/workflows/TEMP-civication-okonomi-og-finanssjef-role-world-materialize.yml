name: TEMP Materialize Økonomi- og finanssjef Role World

on:
  push:
    branches:
      - agent/civication-naeringsliv-okonomi-og-finanssjef-role-world-rollout
    paths:
      - scripts/TEMP_materialize_okonomi_og_finanssjef_role_world.mjs
      - tests/civication-naeringsliv-okonomi-og-finanssjef-role-world-rollout.test.js
      - .github/workflows/TEMP-civication-okonomi-og-finanssjef-role-world-materialize.yml

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-naeringsliv-okonomi-og-finanssjef-role-world-rollout
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preserve canonical Role World order baseline
        run: cp data/Civication/roleWorlds/index.json /tmp/role-world-index-before.json
      - name: Materialize permanent authored data
        run: node scripts/TEMP_materialize_okonomi_og_finanssjef_role_world.mjs
      - name: Restore canonical Role World order
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'data/Civication/roleWorlds/index.json';
          const before = JSON.parse(fs.readFileSync('/tmp/role-world-index-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync(path, 'utf8'));
          const key = row => `${row.category}/${row.role_scope}`;
          const current = new Map((after.roles || []).map(row => [key(row), row]));
          const ordered = [];
          for (const row of before.roles || []) {
            const found = current.get(key(row));
            if (found) {
              ordered.push(found);
              current.delete(key(row));
            }
          }
          const expected = current.get('naeringsliv/okonomi_og_finanssjef');
          if (!expected || current.size !== 1) {
            throw new Error(`Unexpected Role World index delta: ${[...current.keys()].join(', ')}`);
          }
          ordered.push(expected);
          after.roles = ordered;
          fs.writeFileSync(path, JSON.stringify(after, null, 2) + '\n');
          NODE
      - name: Regenerate scene registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Regenerate career gameplay audit
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Regenerate rollout readiness
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify focused rollout and canonical gates
        run: |
          node tests/civication-naeringsliv-okonomi-og-finanssjef-role-world-rollout.test.js
          node tests/civication-naeringsliv-okonomi-og-finanssjef-rollout-playability.test.js
          node tests/civication-role-world-contract.test.js
          node tests/civication-role-world-broad-rollout-policy.test.js
          node scripts/build-civication-scene-registry.mjs --check
          node scripts/audit-civication-career-gameplay.mjs --check
          node scripts/audit-civication-role-world-rollout-readiness.mjs --check
      - name: Run full Civication suite
        run: npm run test:civication
      - name: Remove temporary materialization surface
        run: |
          rm scripts/TEMP_materialize_okonomi_og_finanssjef_role_world.mjs
          rm .github/workflows/TEMP-civication-okonomi-og-finanssjef-role-world-materialize.yml
      - name: Commit exact verified result
        run: |
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Næringsliv Økonomi- og finanssjef Role World rollout"
          git push origin HEAD:agent/civication-naeringsliv-okonomi-og-finanssjef-role-world-rollout
