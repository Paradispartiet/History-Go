name: Sport concussion evidence seed v1

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: sport-concussion-evidence-seed-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: startsWith(github.head_ref, 'agent/sport-concussion-evidence-seed-v1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone branch quietly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch '${{ github.head_ref }}' "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo

      - name: Apply review-level appraisal compatibility
        working-directory: repo
        run: |
          python - <<'PY'
          from pathlib import Path

          builder = Path('tools/build-sport-concussion-evidence-seed-v1.mjs')
          text = builder.read_text()
          text = text.replace(
              'applicability: "Systematiske oversikter og metaanalyser",\n    domains:',
              'applicability: "Systematiske oversikter og metaanalyser",\n    appraisal_level: "review_document",\n    domains:',
              1,
          )
          text = text.replace(
              'applicability: "Kliniske retningslinjer, folkehelseråd og konsensusuttalelser",\n    domains:',
              'applicability: "Kliniske retningslinjer, folkehelseråd og konsensusuttalelser",\n    appraisal_level: "review_document",\n    domains:',
              1,
          )
          text = text.replace(
              'evidenceManifest.pipeline_status = "first_priority_protocol_registered_candidate_seed_ready_screening_pending";',
              'evidenceManifest.pipeline_status = "scientific_pipeline_infrastructure_ready_evidence_materialization_pending";\nevidenceManifest.first_priority_package_status = "protocol_registered_candidate_seed_ready_screening_pending";',
              1,
          )
          text = text.replace(
              'title: "Returning to Sports",',
              'title: "CDC HEADS UP: Returning to Sports After a Concussion",',
              1,
          )
          builder.write_text(text)

          validator = Path('tools/validate-sport-scientific-pipeline-v2.mjs')
          vtext = validator.read_text()
          old = '  require(tool.result_level_required === true, "biasverktøy er ikke resultatspesifikt", tool.tool_id);'
          new = '''  if (tool.appraisal_level === "review_document") {
            require(tool.result_level_required === false, "reviewverktøy er feilaktig resultatspesifikt", tool.tool_id);
          } else {
            require(tool.result_level_required === true, "biasverktøy er ikke resultatspesifikt", tool.tool_id);
          }'''
          if old not in vtext:
              raise SystemExit('Fant ikke resultatnivåkontrollen i V2-validatoren')
          vtext = vtext.replace(old, new, 1)
          old_gate = '    result_level_bias_required: tools.every((item) => item.result_level_required && item.independent_reviewers_required === 2),'
          new_gate = '''    result_level_bias_required: tools
              .filter((item) => item.appraisal_level !== "review_document")
              .every((item) => item.result_level_required && item.independent_reviewers_required === 2),
            review_document_appraisal_requires_dual_review: tools
              .filter((item) => item.appraisal_level === "review_document")
              .every((item) => item.result_level_required === false && item.independent_reviewers_required === 2),'''
          if old_gate not in vtext:
              raise SystemExit('Fant ikke result_level_bias_required-porten')
          validator.write_text(vtext.replace(old_gate, new_gate, 1))
          PY

      - name: Build registered concussion package
        working-directory: repo
        run: node tools/build-sport-concussion-evidence-seed-v1.mjs

      - name: Validate concussion package boundaries
        working-directory: repo
        run: |
          set +e
          node tools/validate-sport-concussion-evidence-seed-v1.mjs --write >/tmp/concussion-validator-output.json
          status=$?
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('reports/sport-concussion-evidence-seed-v1-validation.json', 'utf8'));
          console.log(JSON.stringify({ status: report.status, failures: report.failures }, null, 2));
          NODE
          exit $status

      - name: Validate scientific pipeline and Sport layers
        working-directory: repo
        run: |
          set -euo pipefail
          node tools/validate-sport-scientific-pipeline-v2.mjs
          node tools/validate-sport-theory-depth-v6.mjs
          node tools/validate-sport-theory-quality.mjs
          node tools/validate-sport-evidence.mjs

      - name: Run governance audits
        working-directory: repo
        run: |
          set -euo pipefail
          node scripts/audit-category-governance.mjs
          node scripts/audit-quiz-template-governance.mjs

      - name: Parse generated JSON and inspect diff
        working-directory: repo
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const files = [
            'data/fag/sport/protocols/concussion_acute_safety_protocol_v1.json',
            'data/fag/sport/evidence_packages_sport_v1.json',
            'data/fag/sport/concussion_search_log_sport_v1.json',
            'data/fag/sport/research_questions_sport_v1.json',
            'data/fag/sport/review_protocols_sport_v1.json',
            'data/fag/sport/risk_of_bias_sport_v1.json',
            'data/fag/sport/claims_sport_canonical_v1.json',
            'data/fag/sport/sport_scientific_pipeline_manifest_v2.json',
            'data/fag/sport/sport_scientific_evidence_manifest_v1.json',
            'data/fag/sport/sport_scientific_method_policy_v1.json',
            'data/fag/sport/sport_quality_manifest_v5.json',
            'data/fag/sport/supersetQUIZMAL_sport.json',
            'reports/sport-concussion-evidence-seed-v1-validation.json'
          ];
          for (const file of files) JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log('Sport concussion evidence seed JSON parse: PASS');
          NODE
          git diff --check

      - name: Commit final concussion package files
        working-directory: repo
        run: |
          set -euo pipefail
          rm .github/workflows/sport-concussion-evidence-seed-v1-materialize.yml
          git rm -f --ignore-unmatch reports/sport-concussion-evidence-seed-v1-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fag/sport/protocols/concussion_acute_safety_protocol_v1.json
          git add data/fag/sport/evidence_packages_sport_v1.json
          git add data/fag/sport/concussion_search_log_sport_v1.json
          git add data/fag/sport/research_questions_sport_v1.json
          git add data/fag/sport/review_protocols_sport_v1.json
          git add data/fag/sport/risk_of_bias_sport_v1.json
          git add data/fag/sport/claims_sport_canonical_v1.json
          git add data/fag/sport/sport_scientific_pipeline_manifest_v2.json
          git add data/fag/sport/sport_scientific_evidence_manifest_v1.json
          git add data/fag/sport/sport_scientific_method_policy_v1.json
          git add data/fag/sport/sport_quality_manifest_v5.json
          git add data/fag/sport/supersetQUIZMAL_sport.json
          git add tools/build-sport-concussion-evidence-seed-v1.mjs
          git add tools/validate-sport-concussion-evidence-seed-v1.mjs
          git add tools/validate-sport-scientific-pipeline-v2.mjs
          git add reports/sport-concussion-evidence-seed-v1.md
          git add reports/sport-concussion-evidence-seed-v1-validation.json
          git add -u .github/workflows/sport-concussion-evidence-seed-v1-materialize.yml
          git diff --cached --check
          git commit -m 'Sport: registrer og frø hjernerystelsespakke V1'
          git push origin HEAD:${{ github.head_ref }}
