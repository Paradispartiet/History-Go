name: Probe Losby Gods source objects

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  probe:
    if: github.head_ref == 'agent/akershus-losby-gods-production'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch and persist Losby objects and addresses
        shell: bash
        run: |
          set -euo pipefail
          out='reports/akershus-coordinate-losby-gods-source-probe'
          mkdir -p "$out"

          for query in 'Losbyveien 270 Lørenskog' 'Losbyveien 1 Lørenskog'; do
            slug=$(printf '%s' "$query" | tr '[:upper:]' '[:lower:]' | sed 's/ø/o/g;s/æ/ae/g;s/å/a/g;s/ /-/g')
            curl --fail --location --retry 4 --retry-delay 3 \
              --get 'https://ws.geonorge.no/adresser/v1/sok' \
              --data-urlencode "sok=$query" \
              --data-urlencode 'treffPerSide=20' \
              | tee "$out/geonorge-${slug}.json" >/dev/null
          done

          curl --fail --location --retry 4 --retry-delay 3 \
            -A 'History-Go coordinate verification/1.0' \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'q=Losby Gods, Lørenskog, Norway' \
            --data-urlencode 'format=jsonv2' \
            --data-urlencode 'addressdetails=1' \
            --data-urlencode 'extratags=1' \
            --data-urlencode 'namedetails=1' \
            --data-urlencode 'polygon_geojson=1' \
            --data-urlencode 'limit=10' \
            | tee "$out/nominatim-losby-gods.json" >/dev/null

          curl --fail --location --retry 4 --retry-delay 3 \
            -A 'History-Go coordinate verification/1.0' \
            'https://api.openstreetmap.org/api/0.6/map?bbox=10.9785,59.8848,10.9865,59.8915' \
            | tee "$out/osm-losby-gods-bbox.xml" >/dev/null

          python - <<'PY' | tee "$out/source-summary.txt"
          import json
          import math
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path('reports/akershus-coordinate-losby-gods-source-probe')
          legacy = (59.88685, 10.98411)
          published_gps = (59 + 53/60 + 17.9251/3600, 10 + 58/60 + 55.1772/3600)

          def hav(a, b):
              R = 6371000.0
              p1, p2 = map(math.radians, (a[0], b[0]))
              dp = math.radians(b[0] - a[0])
              dl = math.radians(b[1] - a[1])
              h = math.sin(dp/2)**2 + math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2 * R * math.asin(math.sqrt(h))

          for filename, exact_text in (
              ('geonorge-losbyveien-270-lorenskog.json', 'losbyveien 270'),
              ('geonorge-losbyveien-1-lorenskog.json', 'losbyveien 1'),
          ):
              payload = json.loads((out / filename).read_text())
              addresses = payload.get('adresser', []) if isinstance(payload, dict) else []
              exact = [a for a in addresses if str(a.get('adressetekst', '')).lower() == exact_text]
              print(f'{filename}:address_total={len(addresses)} exact={len(exact)}')
              for item in exact:
                  point = item.get('representasjonspunkt') or {}
                  lat, lon = float(point['lat']), float(point['lon'])
                  print(f'ADDRESS {item.get("adressetekst")} lat={lat:.12f} lon={lon:.12f} distance_from_legacy_m={hav(legacy, (lat, lon)):.1f} distance_to_published_gps_m={hav(published_gps, (lat, lon)):.1f} data=' + json.dumps(item, ensure_ascii=False, sort_keys=True))

          print(f'published_gps_lat={published_gps[0]:.12f}')
          print(f'published_gps_lon={published_gps[1]:.12f}')
          print(f'published_gps_distance_from_legacy_m={hav(legacy, published_gps):.1f}')

          nom = json.loads((out / 'nominatim-losby-gods.json').read_text())
          print('nominatim=' + json.dumps(nom, ensure_ascii=False, sort_keys=True))
          for item in nom:
              lat, lon = float(item['lat']), float(item['lon'])
              print(f'NOMINATIM osm_type={item.get("osm_type")} osm_id={item.get("osm_id")} lat={lat:.12f} lon={lon:.12f} distance_from_legacy_m={hav(legacy, (lat, lon)):.1f} name={item.get("name")} type={item.get("type")}')

          root = ET.parse(out / 'osm-losby-gods-bbox.xml').getroot()
          nodes = {n.attrib['id']: (float(n.attrib['lat']), float(n.attrib['lon'])) for n in root.findall('node')}
          rows = []
          for elem in list(root):
              tags = {t.attrib['k']: t.attrib['v'] for t in elem.findall('tag')}
              hay = ' '.join(str(v) for v in tags.values()).lower()
              relevant = any(k in hay for k in ('losby', 'hotel', 'manor', 'historic')) or tags.get('tourism') == 'hotel'
              if not relevant and not (elem.tag == 'way' and tags.get('building')):
                  continue
              row = {'type': elem.tag, 'id': elem.attrib.get('id'), 'tags': tags}
              if elem.tag == 'node':
                  row['lat'] = float(elem.attrib['lat']); row['lon'] = float(elem.attrib['lon'])
              elif elem.tag == 'way':
                  pts = [nodes[nd.attrib['ref']] for nd in elem.findall('nd') if nd.attrib['ref'] in nodes]
                  if len(pts) >= 3:
                      ring = [(lon, lat) for lat, lon in pts]
                      if ring[0] != ring[-1]: ring.append(ring[0])
                      area2 = cx = cy = 0.0
                      for (x1, y1), (x2, y2) in zip(ring, ring[1:]):
                          cross = x1*y2 - x2*y1
                          area2 += cross; cx += (x1+x2)*cross; cy += (y1+y2)*cross
                      if abs(area2) < 1e-15:
                          row['lat'] = sum(p[0] for p in pts)/len(pts); row['lon'] = sum(p[1] for p in pts)/len(pts)
                      else:
                          row['lon'] = cx/(3*area2); row['lat'] = cy/(3*area2)
              if 'lat' in row:
                  row['distance_from_legacy_m'] = round(hav(legacy, (row['lat'], row['lon'])), 1)
                  row['distance_to_published_gps_m'] = round(hav(published_gps, (row['lat'], row['lon'])), 1)
              rows.append(row)
          rows.sort(key=lambda r: (0 if r.get('tags', {}).get('name') else 1, r.get('distance_to_published_gps_m', 999999)))
          print('bbox_relevant=' + json.dumps(rows[:60], ensure_ascii=False, sort_keys=True))
          PY

      - name: Remove probe workflow and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/probe-losby-gods.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/akershus-coordinate-losby-gods-source-probe .github/workflows/probe-losby-gods.yml
          git commit -m 'Persist Losby Gods coordinate source evidence'
          git push origin HEAD:${{ github.head_ref }}
