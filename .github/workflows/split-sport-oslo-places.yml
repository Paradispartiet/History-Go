name: Split Oslo sport places

on:
  push:
    branches:
      - data/split-sport-oslo-places-20260708

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/split-sport-oslo-places-20260708
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/split-sport-oslo-places.mjs
      - run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add data/places/sport/europa/norway/oslo_sport data/places/sport/europa/norway/oslo_sport_manifest.json data/places/sport/europa/norway/oslo_sport_index.json data/places/sport/europa/norway/oslo_sport_split_report.txt
          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Generate split Oslo sport place files"
            git push
          fi
