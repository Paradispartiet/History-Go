name: Temporary Glads Vaterland Knowledge sync
on:
  push:
    branches:
      - content/glads-vaterland-21q-source-qa-20261021
    paths:
      - .github/workflows/temporary-glads-vaterland-quiz-knowledge-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/glads-vaterland-21q-source-qa-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rebuild Knowledge and check QuizCard parity
        run: |
          npm ci --no-audit --no-fund
          npm run knowledge:canonical:write
          npm run knowledge:canonical:check
          node --test tests/akerselva-glads-vaterland-v1-quiz-qa.test.mjs
      - name: Commit exact generated Knowledge artifacts
        shell: bash
        run: |
          git add -u -- \
            data/quiz/historie/glads_molle_sets.json \
            data/quiz/by/vaterland_historisk_elvelop_sets.json \
            data/knowledge \
            reports/knowledge-id-backfill.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(knowledge): synchronize Glads and Vaterland quiz learning links'
          git pull --rebase origin content/glads-vaterland-21q-source-qa-20261021
          git push origin HEAD:refs/heads/content/glads-vaterland-21q-source-qa-20261021
