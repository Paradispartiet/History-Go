name: Split Oslo history categories

on:
  push:
    branches:
      - main
    paths:
      - .github/oslo-history-category-split-trigger.txt

permissions:
  contents: write

concurrency:
  group: split-oslo-history-categories
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Split category mismatches and update manifest
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          manifest_path = Path('data/places/manifest.json')

          sources = [
              {
                  'path': Path('data/places/historie/oslo/places_historie.json'),
                  'anchor': 'places/historie/oslo/places_historie.json',
                  'original_ids': [
                      'middelalder_oslo',
                      'oslo_domkirke',
                      'damstredet_telthusbakken',
                      'gamle_trikkestallen',
                      'slottet',
                      'sofienberg_kirke',
                      'gamlebyen_gravlund',
                      'akerhus_slott',
                      'akershus_festning',
                      'gamle_aker_kirke',
                      'var_frelsers_gravlund',
                      'hovedoya_kloster',
                      'grini_fangeleir',
                      'villa_grande',
                      'bogstad_gard',
                      'mollergata_19',
                      'sagene_skole',
                      'trefoldighetskirken',
                  ],
                  'retained_ids': [
                      'middelalder_oslo',
                      'gamlebyen_gravlund',
                      'akerhus_slott',
                      'akershus_festning',
                      'gamle_aker_kirke',
                      'var_frelsers_gravlund',
                      'hovedoya_kloster',
                      'grini_fangeleir',
                      'villa_grande',
                      'bogstad_gard',
                      'mollergata_19',
                      'sagene_skole',
                  ],
                  'moves': [
                      ('oslo_domkirke', 'by', Path('data/places/by/oslo/oslo_domkirke.json'), 'places/by/oslo/oslo_domkirke.json'),
                      ('damstredet_telthusbakken', 'by', Path('data/places/by/oslo/damstredet_telthusbakken.json'), 'places/by/oslo/damstredet_telthusbakken.json'),
                      ('gamle_trikkestallen', 'by', Path('data/places/by/oslo/gamle_trikkestallen.json'), 'places/by/oslo/gamle_trikkestallen.json'),
                      ('slottet', 'politikk', Path('data/places/politikk/oslo/slottet.json'), 'places/politikk/oslo/slottet.json'),
                      ('sofienberg_kirke', 'by', Path('data/places/by/oslo/sofienberg_kirke.json'), 'places/by/oslo/sofienberg_kirke.json'),
                      ('trefoldighetskirken', 'by', Path('data/places/by/oslo/trefoldighetskirken.json'), 'places/by/oslo/trefoldighetskirken.json'),
                  ],
              },
              {
                  'path': Path('data/places/historie/oslo/places_historie_added_batch_01.json'),
                  'anchor': 'places/historie/oslo/places_historie_added_batch_01.json',
                  'original_ids': [
                      'nonneseter_kloster',
                      'oslo_ladegard',
                      'gamle_radhus',
                      'galgeberg',
                      'oslo_hospital',
                      'botsfengselet',
                      'prinds_christian_augusts_minde',
                  ],
                  'retained_ids': [
                      'nonneseter_kloster',
                      'oslo_ladegard',
                      'galgeberg',
                      'oslo_hospital',
                      'botsfengselet',
                      'prinds_christian_augusts_minde',
                  ],
                  'moves': [
                      ('gamle_radhus', 'by', Path('data/places/by/oslo/gamle_radhus.json'), 'places/by/oslo/gamle_radhus.json'),
                  ],
              },
          ]

          all_original_ids = []
          all_moves = []

          for source in sources:
              source_path = source['path']
              payload = json.loads(source_path.read_text(encoding='utf-8'))
              if not isinstance(payload, list):
                  raise SystemExit(f'{source_path} must be a JSON array')

              actual_ids = [place.get('id') for place in payload]
              if actual_ids != source['original_ids']:
                  raise SystemExit(f'Unexpected IDs/order in {source_path}: {actual_ids}')
              if any(place.get('category') != 'historie' for place in payload):
                  raise SystemExit(f'Every source entry must start in historie: {source_path}')

              by_id = {place['id']: place for place in payload}
              move_ids = {place_id for place_id, _, _, _ in source['moves']}

              for place_id, category, destination, manifest_path_value in source['moves']:
                  if destination.exists():
                      raise SystemExit(f'Destination already exists: {destination}')
                  original = by_id[place_id]
                  moved = dict(original)
                  moved['category'] = category
                  if {k: v for k, v in moved.items() if k != 'category'} != {
                      k: v for k, v in original.items() if k != 'category'
                  }:
                      raise SystemExit(f'Non-category content changed for {place_id}')
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_text(
                      json.dumps([moved], ensure_ascii=False, indent=2) + '\n',
                      encoding='utf-8',
                  )
                  all_moves.append((place_id, category, destination, manifest_path_value))

              retained = [place for place in payload if place['id'] not in move_ids]
              if [place['id'] for place in retained] != source['retained_ids']:
                  raise SystemExit(f'Retained IDs/order changed in {source_path}')
              if any(place.get('category') != 'historie' for place in retained):
                  raise SystemExit(f'Retained entries must remain historie in {source_path}')

              source_path.write_text(
                  json.dumps(retained, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              all_original_ids.extend(source['original_ids'])

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = manifest.get('files')
          if not isinstance(files, list):
              raise SystemExit('Manifest files must be a list')

          for source in sources:
              anchor = source['anchor']
              additions = [move[3] for move in source['moves']]
              if files.count(anchor) != 1:
                  raise SystemExit(f'Expected one manifest anchor for {anchor}, got {files.count(anchor)}')
              collisions = [path for path in additions if path in files]
              if collisions:
                  raise SystemExit(f'Manifest destinations already registered: {collisions}')
              anchor_index = files.index(anchor)
              files[anchor_index + 1:anchor_index + 1] = additions
              if files[anchor_index:anchor_index + 1 + len(additions)] != [anchor, *additions]:
                  raise SystemExit(f'Manifest insertion order is incorrect after {anchor}')

          if len(files) != len(set(files)):
              raise SystemExit('Duplicate manifest paths after insertion')

          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8',
          )

          id_counts = Counter()
          for relative_path in files:
              path = Path('data/places') / relative_path.removeprefix('places/')
              document = json.loads(path.read_text(encoding='utf-8'))
              if isinstance(document, list):
                  for place in document:
                      if isinstance(place, dict) and isinstance(place.get('id'), str):
                          id_counts[place['id']] += 1

          duplicates = sorted(place_id for place_id, count in id_counts.items() if count > 1)
          if duplicates:
              raise SystemExit(f'Duplicate manifest-loaded place IDs: {duplicates[:20]}')
          for place_id in all_original_ids:
              if id_counts[place_id] != 1:
                  raise SystemExit(f'Expected one manifest-loaded occurrence of {place_id}, got {id_counts[place_id]}')

          for place_id, category, destination, _ in all_moves:
              written = json.loads(destination.read_text(encoding='utf-8'))
              if written[0].get('id') != place_id or written[0].get('category') != category:
                  raise SystemExit(f'Post-write validation failed for {destination}')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/places/historie/oslo/places_historie.json
          git add data/places/historie/oslo/places_historie_added_batch_01.json
          git add data/places/by/oslo/oslo_domkirke.json
          git add data/places/by/oslo/damstredet_telthusbakken.json
          git add data/places/by/oslo/gamle_trikkestallen.json
          git add data/places/politikk/oslo/slottet.json
          git add data/places/by/oslo/sofienberg_kirke.json
          git add data/places/by/oslo/trefoldighetskirken.json
          git add data/places/by/oslo/gamle_radhus.json
          git add data/places/manifest.json
          git rm .github/workflows/register-oslo-history-category-files.yml
          git rm .github/oslo-history-category-split-trigger.txt
          git commit -m "Split and register Oslo history category files"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            sleep 2
          done
          exit 1
