name: Fagverk IA v3 Kunst gatekunst migration probe

on:
  pull_request:
    paths:
      - 'scripts/materialize-kunst-gatekunst-legacy-gap-v1.mjs'
      - 'tests/fagverk-kunst-gatekunst-legacy-gap-v1.test.mjs'
      - 'tests/fagverk-kunst-legacy-theory-audit.test.mjs'
      - '.github/workflows/fagverk-ia-v3-kunst-gatekunst-migration-probe.yml'

permissions:
  contents: write

jobs:
  materialize-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize and validate gatekunst gap
        run: |
          node --check scripts/materialize-kunst-gatekunst-legacy-gap-v1.mjs
          node scripts/materialize-kunst-gatekunst-legacy-gap-v1.mjs
          node scripts/audit-fagverk-kunst-legacy-theory.mjs --write-report
          node --test tests/fagverk-kunst-gatekunst-legacy-gap-v1.test.mjs
          node --test tests/fagverk-kunst-legacy-theory-audit.test.mjs
          node scripts/audit-fagverk-kunst-complete.mjs
      - name: Commit canonical migration and remove probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fagverk-ia-v3-kunst-gatekunst-migration-probe.yml
          git add data/fag/kunst/emner_kunst_canonical_v4_5.json \
                  data/fagverk/kunst/publikum-og-offentlighet/01-grunnlag.json \
                  reports/fagverk/kunst-legacy-theory-audit.json
          git commit -m 'Materialize Kunst gatekunst legacy gap'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
