name: Oset sourced quiz canonical sync (one-off)

on:
  push:
    branches:
      - work/oslo-akerselva-v1-bolk-20261116
    paths:
      - data/quiz/historie/frysjadammen_sets.json
      - tests/oset-slusebru-sourced-quiz.test.mjs
      - .github/workflows/oset-quiz-knowledge-sync-once.yml

permissions:
  contents: write

concurrency:
  group: oset-quiz-canonical-once
  cancel-in-progress: false

jobs:
  oset-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify sourced quiz and progression IDs
        run: node --test tests/oset-slusebru-sourced-quiz.test.mjs
      - name: Generate and verify canonical Knowledge outputs
        run: |
          npm run knowledge:canonical:write
          npm run knowledge:canonical:check
      - name: Guard file scope and commit generated outputs
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const changes = execFileSync('git', ['diff', '--name-only'], {encoding: 'utf8'}).trim().split('\n').filter(Boolean);
          const allowed = (p) => p === 'data/quiz/historie/frysjadammen_sets.json' ||
            p.startsWith('data/knowledge/') ||
            ['reports/knowledge-id-backfill.json','reports/knowledge-contract-audit.json','reports/knowledge-universe-readers.json'].includes(p);
          const extra = changes.filter(p => !allowed(p));
          if (extra.length) { console.error('Unexpected canonical generated file changes:', extra); process.exit(1); }
          console.log('Allowed generated changes:', changes);
          NODE
          git add -u
          if git diff --cached --quiet; then
            echo 'Canonical outputs already synchronized.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "data(oset): synchronize canonical Knowledge for ten sourced quiz questions"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
