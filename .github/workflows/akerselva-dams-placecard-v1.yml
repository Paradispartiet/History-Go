name: Akerselva dams PlaceCard v1 browser
on:
  pull_request:
    paths:
      - 'data/places/natur/oslo/brekkedammen.json'
      - 'data/places/natur/oslo/places_oslo_natur_akerselvarute/nydalsdammen.json'
      - 'data/quizcards/natur/**'
      - 'js/ui/place-card.js'
      - 'js/ui/placeQuizCards.ts'
      - 'js/ui/place-card-quizcards-patch.js'
      - 'tests/akerselva-dams-placecard-v1-browser.test.mjs'
      - '.github/workflows/akerselva-dams-placecard-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dams-placecard:
    name: Brekkedammen and Nydalsdammen QuizCard flip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser check at mobile, tablet and desktop widths
        run: node tests/akerselva-dams-placecard-v1-browser.test.mjs
