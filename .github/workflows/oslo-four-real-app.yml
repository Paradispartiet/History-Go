name: Oslo four real app browser QA

on:
  pull_request:
    paths:
      - 'data/places/historie/oslo/places/linderud_gard.json'
      - 'data/places/historie/oslo/places/sarabraten.json'
      - 'data/places/historie/oslo/places/saeterhytten_bygdoy.json'
      - 'data/places/naeringsliv/oslo/places/kristiania_teglverk_bryn.json'
      - 'data/quiz/historie/linderud_gard_sets.json'
      - 'data/quiz/historie/sarabraten_sets.json'
      - 'data/quiz/historie/saeterhytten_bygdoy_sets.json'
      - 'data/quiz/naeringsliv/kristiania_teglverk_bryn_sets.json'
      - 'data/quizcards/**/oslo_four_20261024.json'
      - 'data/places/manifest.json'
      - 'tests/oslo-four-canonical-app-browser.mjs'
      - '.github/workflows/oslo-four-real-app.yml'
  workflow_dispatch:

concurrency:
  group: oslo-four-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Four Oslo Places app 390/1440
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Build current Places index before browser test
        run: npm run places:index:build
      - name: Materialize app Place-open payloads from new index
        run: npm run place-open:build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test all four canonical Places and quiz interfaces
        run: node tests/oslo-four-canonical-app-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oslo-four-real-app-browser
          path: artifacts/oslo-four/
          if-no-files-found: warn
          retention-days: 14
