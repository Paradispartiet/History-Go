name: Temporary Minneparken web bundle sync
on:
  push:
    branches:
      - content/minneparken-kildebasert-leksikon-20261103
    paths:
      - .github/workflows/minneparken-web-sync-temp.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated PR branch
        uses: actions/checkout@v4
        with:
          ref: content/minneparken-kildebasert-leksikon-20261103
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript and rebuilt bundle parity
        run: |
          npm run typecheck:web
          npm run build:web
          npm run build:web:check
          node --check dist/web/place-unified-surface.js
          node --test tests/epoke-place-index.test.mjs

      - name: Commit only the verified Place surface web bundle
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only -- dist/web)
          for file in "${changed[@]}"; do
            case "$file" in
              dist/web/place-unified-surface.js|dist/web/place-unified-surface.js.map) ;;
              *) echo "Unexpected dist/web change: $file" >&2; exit 1 ;;
            esac
          done
          git add -- dist/web/place-unified-surface.js dist/web/place-unified-surface.js.map
          if git diff --cached --quiet; then
            echo 'Web bundle is already in sync.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git diff --cached --stat
            git commit -m 'Regenerate Place unified surface web bundle for Minneparken PR'
            git push origin HEAD:refs/heads/content/minneparken-kildebasert-leksikon-20261103
          fi
