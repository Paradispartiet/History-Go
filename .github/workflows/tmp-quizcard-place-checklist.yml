name: TEMP QuizCard Place checklist

on:
  push:
    branches:
      - work/quizcard-place-checklist-20260903

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch canonical Place checklist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/PLACE_PRODUCTION_CHECKLIST.md')
          text = path.read_text()

          replacements = [
            (
              '- stående, stedstro `frontImage` når ordinær PlaceCard brukes;\n',
              '- stående, stedstro `frontImage` når ordinær PlaceCard brukes;\n'
              '- dedikert QuizCard/flip-bakside for hvert ordinært PlaceCard, med eksisterende quizkort gjenbrukt når det allerede finnes;\n'
            ),
            (
              '- `frontImage` er den stående hovedflaten og skal være en faktisk stående fil/variant (`height > width`), aldri bare en liggende fil beskåret av CSS;\n',
              '- `frontImage` er den stående hovedflaten og skal være en faktisk stående fil/variant (`height > width`), aldri bare en liggende fil beskåret av CSS;\n'
              '- hvert nytt eller fullprodusert ordinært Place skal ha et dedikert QuizCard som PlaceCard-bakside og kunne flippe fra `frontImage` til quizkortet gjennom den canonicale PlaceCard-runtimeflyten;\n'
              '- før nytt QuizCard produseres skal `bilder/QuizCards/**`, runtime-mapping/resolver og tidligere stedsspesifikke quizkort auditeres, slik at eksisterende quizkort bevares og ikke dobbeltproduseres;\n'
              '- `bilder/QuizCards/**` er kun QuizCard/flip-support og skal aldri brukes som `image`, `cardImage` eller `frontImage`; quizkortet skal være en separat visuell flate;\n'
              '- manglende QuizCard, manglende runtime-binding eller en flip som ikke virker med faktisk input er BLOCKED for ordinær fullproduksjon;\n'
            ),
            (
              'Eksisterende aktive, arkiverte og alternative quizfiler auditeres før profilvalg.\n',
              'Eksisterende aktive, arkiverte og alternative quizfiler auditeres før profilvalg.\n\n'
              'Quiz-auditen omfatter også den synlige QuizCard-flaten. Før nytt kort lages skal eksisterende `bilder/QuizCards/**`, tidligere quizkort og runtime-binding for `targetId` kontrolleres. Et eksisterende godt QuizCard gjenbrukes. Hvis kort mangler, produseres et dedikert stedsspesifikt QuizCard og bindes til PlaceCard-flippen; quizproduksjon er ikke closeout-klar før både quizdata og QuizCard-runtime er operative.\n'
            ),
            (
              '- kontroller `frontImage` som ekte stående fil;\n',
              '- kontroller `frontImage` som ekte stående fil;\n'
              '- kontroller at stedet har dedikert QuizCard, at eksisterende kort er gjenbrukt der det finnes, og at quizkortet ikke brukes som `image`, `cardImage` eller `frontImage`;\n'
              '- flip PlaceCard fra `frontImage` til QuizCard og tilbake på faktisk PR-head; kontroller mus/touch og relevant tastaturinput, at riktig stedskort vises, og at flippen ikke åpner feil sted eller skjuler quiztilgangen;\n'
            ),
            (
              '10. stedsprofil og Quiz-profil er separate beslutninger.\n',
              '10. stedsprofil og Quiz-profil er separate beslutninger;\n'
              '11. hvert ordinært fullprodusert Place har et eget operativt QuizCard som flip-bakside til `frontImage`; eksisterende QuizCards auditeres og gjenbrukes før ny produksjon, og `bilder/QuizCards/**` brukes aldri som ordinært Place-bilde.\n'
            ),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one checklist anchor, found {count}: {old!r}')
            text = text.replace(old, new, 1)

          path.write_text(text)

          test = Path('tests/place-production-checklist-quizcard-contract.test.mjs')
          test.write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";

          const checklist = fs.readFileSync("docs/PLACE_PRODUCTION_CHECKLIST.md", "utf8");

          test("Place production checklist requires QuizCard flip support", () => {
            assert.match(checklist, /hvert nytt eller fullprodusert ordinært Place skal ha et dedikert QuizCard/);
            assert.match(checklist, /flippe fra `frontImage` til quizkortet/);
            assert.match(checklist, /Eksisterende aktive, arkiverte og alternative quizfiler auditeres før profilvalg/);
            assert.match(checklist, /eksisterende `bilder\/QuizCards\/\*\*`/);
            assert.match(checklist, /Et eksisterende godt QuizCard gjenbrukes/);
            assert.match(checklist, /`bilder\/QuizCards\/\*\*` er kun QuizCard\/flip-support/);
            assert.match(checklist, /manglende QuizCard, manglende runtime-binding eller en flip som ikke virker/);
            assert.match(checklist, /flip PlaceCard fra `frontImage` til QuizCard og tilbake på faktisk PR-head/);
          });
          ''')
          PY
      - name: Validate contract
        run: |
          node --test tests/place-production-checklist-quizcard-contract.test.mjs
          git diff --check
      - name: Commit permanent files and remove TEMP workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-quizcard-place-checklist.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PLACE_PRODUCTION_CHECKLIST.md tests/place-production-checklist-quizcard-contract.test.mjs .github/workflows/tmp-quizcard-place-checklist.yml
          git commit -m "Require QuizCard flip for completed Places"
          git push origin HEAD:work/quizcard-place-checklist-20260903
