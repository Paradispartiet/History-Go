name: TEMP Dramatikkens hus Story materialization

on:
  push:
    branches:
      - agent/dramatikkens-hus-workcard-sync-20260915
    paths:
      - .github/workflows/dramatikkens-hus-materialize-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-dramatikkens-hus-story-materialization
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Regenerate Story, reading-track and epoch runtime
        run: |
          npm run place-open:build
          npm run epoker:places:build
      - name: Fail closed on unexpected generator scope
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(data/runtime/stories-all\.json|data/runtime/stories-all/part-[0-9]+\.json|data/runtime/lesespor-all\.json|data/runtime/place-open/dramatikkens_hus\.json|data/epoker/epoke-place-index\.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected generated files:"
            echo "$unexpected"
            exit 1
          fi
      - name: Validate Story and runtime
        run: |
          npm run check:stories
          npm run test:stories-manifest
          npm run place-open:check
          npm run test:place-open
          npm run epoker:places:check
          git diff --check
      - name: Commit generated closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/stories-all.json data/runtime/stories-all/ data/runtime/lesespor-all.json data/runtime/place-open/dramatikkens_hus.json data/epoker/epoke-place-index.json
          if git diff --cached --quiet; then
            echo "Generator outputs already synchronized."
            exit 0
          fi
          git commit -m "Materialize Dramatikkens hus Story and reading tracks"
          git push origin HEAD:agent/dramatikkens-hus-workcard-sync-20260915
