name: TEMP materialize Næringsliv kapital finans v1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'Paradispartiet/History-Go' && github.head_ref == 'agent/naeringsliv-chapter-kapital-eierskap-finans-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/naeringsliv-chapter-kapital-eierskap-finans-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Materialize chapter package
        run: node scripts/materialize-naeringsliv-chapter-kapital-eierskap-finans-v1.mjs
      - name: Validate generated chapter
        run: |
          node --check scripts/audit-naeringsliv-subject-quality.mjs
          node --check scripts/audit-naeringsliv-chapter-arbeid-produksjon-verdiskaping.mjs
          node --check scripts/audit-naeringsliv-chapter-kapital-eierskap-finans.mjs
          node scripts/audit-naeringsliv-chapter-arbeid-produksjon-verdiskaping.mjs
          node scripts/audit-naeringsliv-chapter-kapital-eierskap-finans.mjs
          node scripts/audit-naeringsliv-subject-quality.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node --test tests/naeringsliv-chapter-arbeid-produksjon-verdiskaping.test.mjs tests/naeringsliv-chapter-kapital-eierskap-finans.test.mjs tests/naeringsliv-subject-quality.test.mjs tests/fagverk-general-engine.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-documentation-contract.test.mjs
      - name: Commit materialized chapter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Materialiser Næringsliv-kapittelet Kapital, eierskap og finans"
          git push origin HEAD:agent/naeringsliv-chapter-kapital-eierskap-finans-v1
