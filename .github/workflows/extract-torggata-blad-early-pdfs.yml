name: Extract early Torggata Blad PDF address evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: agent/fix-oslo-address-anchors-torggata-storgata-v2

      - name: Install PDF text tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Download and extract early issues
        shell: bash
        run: |
          set -euo pipefail
          out=reports/oslo-address-anchor-repair-20260719/torggata-blad-early-pdfs
          mkdir -p "$out"
          base=https://torggatablad.no/wp-content/uploads/2020/04

          for issue in \
            torggatablad_nr01_07_web \
            torggatablad_nr02_07_web \
            torggatablad_nr01_08_web \
            torggatablad_nr02_08_web \
            torggatablad_nr03_08_web
          do
            curl --fail --location --silent --show-error "$base/$issue.pdf" -o "$out/$issue.pdf"
            pdftotext -layout "$out/$issue.pdf" "$out/$issue.txt"
            rm "$out/$issue.pdf"
          done

          {
            echo '# Address hits in early Torggata Blad issues'
            echo
            for f in "$out"/*.txt; do
              echo "## $(basename "$f")"
              grep -in -C 6 -E 'Hausmann|Aktbo|redaksjon|adresse|19A|19B|0182' "$f" || true
              echo
            done
          } | tee "$out/address-hits.txt"

      - name: Persist extracted evidence
        run: |
          set -euo pipefail
          rm .github/workflows/extract-torggata-blad-early-pdfs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports .github/workflows/extract-torggata-blad-early-pdfs.yml
          git commit -m "Extract early Torggata Blad address evidence"
          git push origin HEAD
