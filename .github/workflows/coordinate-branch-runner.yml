name: Coordinate branch runner

on:
  push:
    branches:
      - 'agent/regjeringskvartalet-description-baseline-v1'
    paths:
      - '.github/workflows/coordinate-branch-runner.yml'
      - 'scripts/regjeringskvartalet-opening-job.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regjeringskvartalet-opening-production
  cancel-in-progress: false

jobs:
  produce-opening:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/regjeringskvartalet-description-baseline-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate complete opening
        run: node scripts/regjeringskvartalet-opening-job.mjs

      - name: Publish generated data and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/coordinate-branch-runner.yml
          rm -f scripts/regjeringskvartalet-opening-job.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fullfør Regjeringskvartalets normalåpning"
          git push origin HEAD:agent/regjeringskvartalet-description-baseline-v1

