name: Coordinate branch runner

on:
  push:
    branches:
      - 'agent/oslo-coordinate-*'
      - 'agent/audit-oslo-coordinates-*'
    paths:
      - 'scripts/coordinate-branch-job.mjs'
      - 'scripts/.coordinate-branch-job-complete'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'scripts/coordinate-branch-job.mjs'
      - 'scripts/.coordinate-branch-job-complete'
  workflow_dispatch:

concurrency:
  group: coordinate-branch-runner-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-coordinate-job:
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Detect pending coordinate job
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/coordinate-branch-job.mjs && ! -f scripts/.coordinate-branch-job-complete ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.pending.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare validation directory
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          SAFE_REF="${BRANCH_NAME//\//_}"
          echo "JOB_BRANCH=${BRANCH_NAME}" >> "$GITHUB_ENV"
          echo "RUNNER_REPORT_DIR=reports/coordinate-branch-runner/${SAFE_REF}" >> "$GITHUB_ENV"
          mkdir -p "reports/coordinate-branch-runner/${SAFE_REF}"

      - name: Install dependencies
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$RUNNER_REPORT_DIR/npm-ci.log"

      - name: Run coordinate branch job
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/coordinate-branch-job.mjs 2>&1 | tee "$RUNNER_REPORT_DIR/job.log"

      - name: Rebuild runtime place index
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run places:index:build 2>&1 | tee "$RUNNER_REPORT_DIR/places-index-build.log"

      - name: Validate split manifest sync
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:places-split-manifest-sync 2>&1 | tee "$RUNNER_REPORT_DIR/split-manifest-sync.log"

      - name: Validate place index sync
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run places:index:check 2>&1 | tee "$RUNNER_REPORT_DIR/places-index-check.log"

      - name: Validate coordinate source contract
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run test:coordinate-source-contract 2>&1 | tee "$RUNNER_REPORT_DIR/coordinate-source-contract.log"

      - name: Validate coordinate quality
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run places:coords:quality 2>&1 | tee "$RUNNER_REPORT_DIR/coordinate-quality.log"

      - name: Validate coordinate intake
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run places:coords:intake 2>&1 | tee "$RUNNER_REPORT_DIR/coordinate-intake.log"

      - name: Validate coordinate evidence
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run places:coords:evidence:audit 2>&1 | tee "$RUNNER_REPORT_DIR/coordinate-evidence.log"

      - name: Capture place health
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm run health:places 2>&1 | tee "$RUNNER_REPORT_DIR/health-places.log"
          health_status=${PIPESTATUS[0]}
          printf '%s\n' "$health_status" > "$RUNNER_REPORT_DIR/health-places.exit-code.txt"
          echo "health:places exit code: $health_status"
          exit 0

      - name: Validate diff whitespace
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 2>&1 | tee "$RUNNER_REPORT_DIR/git-diff-check.log"

      - name: Upload coordinate runner logs
        if: always() && steps.pending.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coordinate-runner-${{ github.run_id }}
          path: ${{ env.RUNNER_REPORT_DIR }}
          if-no-files-found: warn

      - name: Publish generated changes and remove one-shot runner
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/coordinate-branch-job.mjs scripts/.coordinate-branch-job-complete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply coordinate branch job" 2>&1 | tee "$RUNNER_REPORT_DIR/git-commit.log"
          git pull --rebase origin "$JOB_BRANCH" 2>&1 | tee "$RUNNER_REPORT_DIR/git-pull-rebase.log"
          git push origin "HEAD:${JOB_BRANCH}" 2>&1 | tee "$RUNNER_REPORT_DIR/git-push.log"
