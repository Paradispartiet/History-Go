name: Coordinate branch runner

on:
  push:
    branches:
      - 'agent/historie-gamle-aker-sources-v1'
    paths:
      - 'scripts/coordinate-branch-job.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gamle-aker-sources-coordinate-runner
  cancel-in-progress: false

jobs:
  materialize-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase branch
        uses: actions/checkout@v4
        with:
          ref: agent/historie-gamle-aker-sources-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize and validate Sources phase
        run: node scripts/coordinate-branch-job.mjs

      - name: Publish production diff and restore canonical runner
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/coordinate-branch-job.mjs
          rm -f scripts/gamle-aker-sources-materialize.mjs
          rm -f .github/workflows/gamle-aker-sources-materialize.yml
          git show origin/main:.github/workflows/coordinate-branch-runner.yml > .github/workflows/coordinate-branch-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bygg brukerrettede Kilder for Gamle Aker kirke"
          git pull --rebase origin agent/historie-gamle-aker-sources-v1
          git push origin HEAD:agent/historie-gamle-aker-sources-v1
