name: TEMP Spikersuppa replay diagnose

on:
  push:
    branches:
      - agent/spikersuppa-replay-20260907-temp2

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Diagnose three-way replay conflicts
        run: |
          set -euxo pipefail
          git fetch origin 42b2fad73fbafe1f2450e4501b093587b138f417 f63b86fe591ccb014849ab1d9d4b95490ce19158 7c8f7352bc80f10e769567faf415f314d65b7a61
          git config user.name 'spikersuppa-replay-diagnose'
          git config user.email 'actions@users.noreply.github.com'
          git checkout --detach 7c8f7352bc80f10e769567faf415f314d65b7a61
          set +e
          git cherry-pick --no-commit f63b86fe591ccb014849ab1d9d4b95490ce19158
          rc=$?
          set -e
          echo "cherry_pick_rc=$rc"
          echo '--- unmerged paths ---'
          git diff --name-only --diff-filter=U | sort
          echo '--- status ---'
          git status --short
          if git rev-parse -q --verify CHERRY_PICK_HEAD >/dev/null; then git cherry-pick --abort; fi
