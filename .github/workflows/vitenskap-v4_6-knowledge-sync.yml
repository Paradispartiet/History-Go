name: Sync Vitenskap v4.6 Knowledge outputs

on:
  push:
    branches:
      - agent/vitenskap-university-breadth-reconciliation
    paths:
      - '.github/workflows/vitenskap-v4_6-knowledge-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitenskap-university-breadth-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate canonical Knowledge outputs
        run: npm run knowledge:canonical:write
      - name: Verify only canonical Knowledge outputs changed
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const allowed = new Set([
            'data/quiz/quiz_vitenskap.json',
            'data/knowledge/knowledge_units.generated.json',
            'data/knowledge/knowledge_emne_review_queue.generated.json',
            'reports/knowledge-id-backfill.json',
            'reports/knowledge-contract-audit.json'
          ]);
          const rows = execFileSync('git', ['status', '--porcelain'], { encoding: 'utf8' })
            .split('\n').filter(Boolean);
          const changed = rows.map((row) => row.slice(3));
          const unexpected = changed.filter((file) => !allowed.has(file));
          if (unexpected.length) throw new Error(`Unexpected Knowledge generator outputs: ${unexpected.join(', ')}`);
          for (const file of allowed) {
            if (!changed.includes(file)) throw new Error(`Expected canonical Knowledge drift missing: ${file}`);
          }
          console.log(`Canonical Knowledge regeneration changed exactly ${changed.length} expected files.`);
          NODE
          git diff --check
      - name: Validate canonical Knowledge state
        run: |
          npm run knowledge:canonical:check
          npm run knowledge:legacy:check
          npm run audit:knowledge
      - name: Commit regenerated Knowledge outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/quiz/quiz_vitenskap.json \
            data/knowledge/knowledge_units.generated.json \
            data/knowledge/knowledge_emne_review_queue.generated.json \
            reports/knowledge-id-backfill.json \
            reports/knowledge-contract-audit.json
          git commit -m 'Regenerate Knowledge outputs for Vitenskap v4.6'
          git push origin HEAD:agent/vitenskap-university-breadth-reconciliation
