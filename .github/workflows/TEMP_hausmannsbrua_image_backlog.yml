name: TEMP Hausmannsbrua image backlog reconcile

on:
  push:
    branches:
      - agent/hausmannsbrua-place-production-20260911
    paths:
      - ".github/workflows/TEMP_hausmannsbrua_image_backlog.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/hausmannsbrua-place-production-20260911

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rematerialize Hausmannsbrua
        run: node tools/finalize-hausmannsbrua-completion.mjs

      - name: Validate Hausmannsbrua closure
        run: node --test tests/hausmannsbrua-completion.test.mjs

      - name: Verify image backlog summary
        run: node scripts/audit-place-images.mjs --mode=all --report=/tmp/hausmannsbrua-place-image-audit.json --verify-summary=data/places/place_image_backlog_summary.json

      - name: Remove one-shot workflow
        run: rm .github/workflows/TEMP_hausmannsbrua_image_backlog.yml

      - name: Commit image backlog reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "Reconcile Hausmannsbrua image backlog"
          git push origin HEAD:agent/hausmannsbrua-place-production-20260911
