name: Temporary History Go TEST header restoration

on:
  push:
    branches:
      - fix/history-go-test-mode-header

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/history-go-test-mode-header
          fetch-depth: 0

      - name: Apply exact TEST header restoration
        run: node scripts/tmp-restore-test-mode-header.mjs

      - name: Verify focused regression
        run: |
          node --check js/ui/header-menu.js
          node tests/history-go-test-mode-header.test.js
          git diff --check

      - name: Commit verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html js/ui/header-menu.js css/components.css docs/HG_TEST_MODE.md docs/README.md docs/documentation_registry.json tests/history-go-test-mode-header.test.js
          git diff --cached --quiet && { echo 'No verified changes to commit'; exit 1; }
          git commit -m 'History Go: restore TEST mode in header'
          git push origin HEAD:fix/history-go-test-mode-header
