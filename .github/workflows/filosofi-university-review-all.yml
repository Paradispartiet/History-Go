name: Complete Philosophy university-depth review

on:
  push:
    branches:
      - agent/review-all-philosophy-university-depth
    paths:
      - 'scripts/materialize-filosofi-university-review.mjs'
      - 'scripts/philosophy-review-specs-*.mjs'
      - 'scripts/prepare-filosofi-university-review-sources.mjs'
      - '.github/workflows/filosofi-university-review-all.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: filosofi-university-review-all-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: agent/review-all-philosophy-university-depth
  EXPECTED_SHA: ${{ github.sha }}

jobs:
  review:
    name: Materialize and validate 54 of 54 Philosophy articles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert immutable input SHA
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Materializing immutable input $EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare topic-specific secondary sources
        run: node scripts/prepare-filosofi-university-review-sources.mjs
      - name: Preflight all substantive Philosophy anchors
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import spec1 from './scripts/philosophy-review-specs-1.mjs';
          import spec2 from './scripts/philosophy-review-specs-2.mjs';
          import spec3 from './scripts/philosophy-review-specs-3.mjs';
          import spec4 from './scripts/philosophy-review-specs-4.mjs';
          import spec5 from './scripts/philosophy-review-specs-5.mjs';
          const specs={...spec1,...spec2,...spec3,...spec4,...spec5};
          const registry=JSON.parse(fs.readFileSync('data/fagverk/filosofi/filosofi_article_registry_v1.json','utf8'));
          const rows=new Map(registry.articles.map(row=>[row.id,row]));
          const missing=[];
          for(const [id,spec] of Object.entries(specs)){
            const row=rows.get(id);
            if(!row){ missing.push([id,'<unknown article>']); continue; }
            const article=JSON.parse(fs.readFileSync(row.file,'utf8'));
            const theory=(article.sections.find(section=>section.id==='teorihistorie')?.paragraphs||[]).join(' ');
            const substantive=[spec.debate,...spec.argument,spec.objection,spec.reply,theory].join(' ').toLocaleLowerCase('nb');
            for(const anchor of spec.anchors||[]){
              if(!substantive.includes(String(anchor).toLocaleLowerCase('nb'))) missing.push([id,anchor]);
            }
          }
          if(missing.length){
            for(const [id,anchor] of missing) console.log(`::error title=Philosophy anchor preflight::${id}: faganker ${anchor} finnes ikke i substansiell prosa`);
            throw new Error(`Philosophy anchor preflight found ${missing.length} missing anchors`);
          }
          console.log(`Philosophy anchor preflight passed for ${Object.keys(specs).length} article specs.`);
          NODE
      - name: Materialize substantive article-by-article university review
        run: |
          set +e
          OUTPUT="$(node scripts/materialize-filosofi-university-review.mjs 2>&1)"
          STATUS=$?
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            MESSAGE="$(printf '%s\n' "$OUTPUT" | grep -m1 '^Error:' || printf '%s\n' "$OUTPUT" | head -n 1)"
            MESSAGE="$(printf '%s' "$MESSAGE" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=Philosophy materializer::$MESSAGE"
            exit "$STATUS"
          fi
      - name: Refresh deterministic Philosophy and shared Fagverk reports
        run: |
          node scripts/audit-fagverk-filosofi-phase3.mjs --write-report --no-check-report
          node scripts/audit-fagverk-subject-inventory.mjs --write-report --no-check-report
          node scripts/audit-fagverk-general-engine.mjs --write-report --no-check-report
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate permanent Philosophy university-depth gates
        run: |
          node --test tests/fagverk-filosofi-university-depth.test.mjs
          node --test tests/fagverk-filosofi-complete.test.mjs
          node --test tests/fagverk-filosofi-editorial-style.test.mjs
          node --test tests/fagverk-filosofi-phase3.test.mjs
      - name: Validate shared Fagverk regressions
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
      - name: Assert the materialized review is complete and non-generic
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const registry=JSON.parse(fs.readFileSync('data/fagverk/filosofi/filosofi_article_registry_v1.json','utf8'));
          const completion=JSON.parse(fs.readFileSync('data/fagverk/filosofi/filosofi_completion_v1.json','utf8'));
          const sources=JSON.parse(fs.readFileSync('data/fagverk/filosofi/filosofi_sources_v1.json','utf8'));
          const articles=registry.articles.map(row=>JSON.parse(fs.readFileSync(row.file,'utf8')));
          const reviewed=articles.filter(a=>a.editorial_quality==='university_depth_reviewed');
          if(reviewed.length!==54) throw new Error(`Expected 54 reviewed articles, got ${reviewed.length}`);
          if(!completion.complete_ready || completion.status!=='complete') throw new Error('Completion lifecycle did not close honestly');
          if(new Set(articles.map(a=>a.university_quality?.debate)).size!==54) throw new Error('Duplicate university debate descriptions detected');
          if(new Set(articles.map(a=>a.sections.find(s=>s.id==='argument')?.paragraphs.join('\n'))).size!==54) throw new Error('Duplicate argument reconstructions detected');
          const art=articles.find(a=>a.id==='em_filosofi_kunstverk_kunststatus_institusjon');
          const required=['sep-art-definition','sep-conceptual-art','iep-aesthetics-art-definition'];
          for(const id of required){
            if(!art?.source_ids?.includes(id)) throw new Error(`Institutional art review missing ${id}`);
            if(!sources.sources.some(s=>s.id===id)) throw new Error(`Institutional art source registry missing ${id}`);
          }
          console.log('Philosophy 54/54 substantive university review verified.');
          NODE
      - name: Commit materialized university review
        run: |
          if git diff --quiet; then
            echo 'No materialized changes found.'
            exit 1
          fi
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          if [ "$REMOTE_SHA" != "$EXPECTED_SHA" ]; then
            echo "::notice::Stale Philosophy materialization run: expected $EXPECTED_SHA but branch is $REMOTE_SHA. Discarding generated changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fagverk/filosofi data/fagverk/subject_status.json data/fagverk/fagverk_registry.json reports/fagverk/filosofi-complete-audit.json reports/fagverk/filosofi-phase3-audit.json reports/fagverk/subject-baseline.json reports/fagverk/general-engine-audit.json data/fagverk/fagverk_release.json
          git commit -m 'Complete Philosophy 54 of 54 university-depth review'
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_SHA" origin "HEAD:refs/heads/$TARGET_BRANCH"
