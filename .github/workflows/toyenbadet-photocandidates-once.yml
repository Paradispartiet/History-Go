name: Tøyenbadet modern image — one-time generated data sync
on:
  push:
    branches: [feat/toyenbadet-modern-photos-20261103]
    paths:
      - '.github/workflows/toyenbadet-photocandidates-once.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/toyenbadet-modern-photos-20261103
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Generate only source-owned Place projections
        shell: bash
        run: |
          set -euo pipefail
          npm run places:index:build
          npm run place-open:build
          node --test tests/toyenbadet-modern-photos-before-after.test.mjs
          node - <<'JS'
          const fs=require('node:fs');
          const source=JSON.parse(fs.readFileSync('data/places/sport/europa/norway/oslo_sport/toyenbadet.json','utf8'));
          const opened=JSON.parse(fs.readFileSync('data/runtime/place-open/toyenbadet.json','utf8'));
          if(opened.place?.image!==source.image) throw Error('stale generated image');
          if(opened.place?.for_na?.nowImage!==source.for_na.nowImage) throw Error('stale generated before-after');
          if(Object.hasOwn(opened.place,'cardImage')) throw Error('deprecated cardImage survived generation');
          console.log('Tøyenbadet modern image and for_na generated parity: PASS');
          JS
      - name: Commit only Tøyenbadet-related generated projections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/places_index.json data/runtime/place-open/toyenbadet.json
          if git diff --cached --quiet; then
            echo 'Generated Tøyenbadet data already in sync'
          else
            git commit -m 'build(toyenbadet): synchronize canonical modern hero and before-after runtime'
            git push origin HEAD:refs/heads/feat/toyenbadet-modern-photos-20261103
          fi
