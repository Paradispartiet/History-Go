name: Tøyenbadet two-collection actual app browser QA — one-time
on:
  push:
    branches: [feat/toyenbadet-modern-photos-20261103]
    paths: ['.github/workflows/toyenbadet-photocandidates-once.yml']
permissions:
  contents: write
jobs:
  actual-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/toyenbadet-modern-photos-20261103
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify canonical source and generated runtime
        run: |
          npm run places:index:build
          npm run place-open:build
          node --test tests/toyenbadet-modern-photos-before-after.test.mjs tests/toyenbadet-asplan-viak-brand.test.mjs
          node - <<'JS'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('data/places/sport/europa/norway/oslo_sport/toyenbadet.json'));
          const r=JSON.parse(fs.readFileSync('data/runtime/place-open/toyenbadet.json'));
          if(r.place.image!==p.image || r.place.for_na?.nowImage!==p.for_na.nowImage)throw Error('Tøyenbadet runtime stale');
          if(r.brands.find(x=>x.id==='asplan_viak')?.logo!=='bilder/kort/brands/asplan_viak.webp')throw Error('Tøyenbadet Brand logo absent');
          if(JSON.stringify(r.place.place_card_profile.collection_ids)!==JSON.stringify(['brands','competitions']))throw Error('Tøyenbadet collection mismatch');
          console.log('Tøyenbadet canonical runtime verified');
          JS
      - name: Persist regenerated source-owned Tøyenbadet projections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/places_index.json data/runtime/place-open/toyenbadet.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(toyenbadet): sync verified modern photos and two collections'
            git push origin HEAD:feat/toyenbadet-modern-photos-20261103
          fi
      - name: Find Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Test real Tøyenbadet PlaceCard, hero, before-after, Brands, NM, QuizCard, Fagverk
        run: node tests/toyenbadet-vferdig-real-browser-20261103.test.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toyenbadet-modern-brands-browser
          path: artifacts/toyenbadet-vferdig-real-browser
          if-no-files-found: ignore
          retention-days: 14
