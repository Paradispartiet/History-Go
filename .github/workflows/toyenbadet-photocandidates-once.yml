name: Tøyenbadet licensed 2026 photo candidates — one-time import
on:
  push:
    branches: [main]
    paths: ['.github/workflows/toyenbadet-photocandidates-once.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow
      - name: Download and transcode original Unsplash photos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, os, json, hashlib, urllib.request, time
          from PIL import Image, ImageOps
          path='bilder/places/candidates/oslo-vferdig-20261103'
          os.makedirs(path, exist_ok=True)
          photos=[
           ('toyenbadet_2026_marek_lumi_glass.webp','1790583879980-b45f4de032c9','https://unsplash.com/photos/modern-glass-building-with-park-path-HR21MwYowNY','Modern glass facade and park path at Tøyenbadet'),
           ('toyenbadet_2026_marek_lumi_bicycle.webp','1790583893045-60db0113f559','https://unsplash.com/photos/bicycle-path-beside-white-building-WvWK5YDDet4','Bicycle path beside Tøyenbadet')]
          items=[]
          for filename,photo_id,page,caption in photos:
           url='https://images.unsplash.com/photo-'+photo_id+'?fm=jpg&q=90&w=2200'
           for attempt in range(3):
            try:
             request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (HistoryGo source-licensed media importer)'})
             with urllib.request.urlopen(request,timeout=45) as response: content=response.read()
             break
            except Exception:
             if attempt==2: raise
             time.sleep(2+attempt*2)
           image=Image.open(io.BytesIO(content))
           image.load()
           if image.width<1000 or image.height<650: raise RuntimeError('unexpected image size: '+str(image.size))
           original_size=list(image.size)
           image=ImageOps.fit(image.convert('RGB'),(1400,900),method=Image.Resampling.LANCZOS,centering=(.5,.5))
           local=os.path.join(path,filename)
           image.save(local,'WEBP',quality=87,method=6)
           data=open(local,'rb').read()
           if len(data)<20000: raise RuntimeError('unusually small output: '+filename)
           items.append({'path':local,'sourcePage':page,'sourceImageUrl':url,'photographer':'Marek Lumi','credit':'Marek Lumi / Unsplash','license':'Unsplash License','licenseUrl':'https://unsplash.com/license','datePublished':'2026-09-28','sourceDimensions':original_size,'assetDimensions':[1400,900],'assetSha256':hashlib.sha256(data).hexdigest(),'sourceSha256':hashlib.sha256(content).hexdigest(),'caption':caption,'reviewStatus':'candidate_pending_actual_visual_review','activationStatus':'not_yet_used_by_PlaceCard','locationFromSource':'Tøyenbadet, Helgesens gate, Oslo, Norway'})
          with open(path+'/toyenbadet_modern_media_candidates.json','w') as fp: json.dump({'schema':'history_go_media_candidates_v1','placeId':'toyenbadet','assets':items,'note':'Source and license verified. Visual identity, cropping, and runtime must be checked prior to canonical activation.'},fp,ensure_ascii=False,indent=2)
          print('Imported candidates: '+str([(a['path'],a['assetSha256']) for a in items]))
          PY
      - name: Push candidates on a dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b feat/toyenbadet-modern-photos-20261103
          git add bilder/places/candidates/oslo-vferdig-20261103/toyenbadet_2026_marek_lumi_glass.webp
          git add bilder/places/candidates/oslo-vferdig-20261103/toyenbadet_2026_marek_lumi_bicycle.webp
          git add bilder/places/candidates/oslo-vferdig-20261103/toyenbadet_modern_media_candidates.json
          git commit -m 'assets: source-tracked photographs of new Tøyenbadet for visual review'
          git push origin HEAD:refs/heads/feat/toyenbadet-modern-photos-20261103
