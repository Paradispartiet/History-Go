name: Fagverk By complete
on:
  pull_request:
    paths:
      - 'data/fag/by/**'
      - 'data/fagverk/by/**'
      - 'scripts/audit-fagverk-by-*.mjs'
      - 'tests/fagverk-by-*.test.mjs'
      - 'reports/fagverk/by-*-audit.json'
      - '.github/workflows/fagverk-by-complete.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/audit-fagverk-by-complete.mjs
      - run: node --test tests/fagverk-by-*.test.mjs tests/fagverk-general-engine.test.mjs tests/fagverk-subject-inventory.test.mjs
      - run: node scripts/build-fagverk-release-manifest.mjs --check
