name: People loader root fix v2

on:
  push:
    branches:
      - agent/people-loader-root-fix

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/people-loader-root-fix
          fetch-depth: 0

      - name: Restore known-good People runtime without visibility veto
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin agent/restore-people-runtime-before-revalidation
          git checkout origin/agent/restore-people-runtime-before-revalidation -- \
            js/boot-fast.js \
            js/ui/popup-utils.js \
            tests/background-boot-pacing.test.js \
            tests/torggata-phase12-people-links.test.mjs

          python3 - <<'PY'
          from pathlib import Path

          epoke_path = Path('js/ui/place-card-epoke.js')
          epoke = epoke_path.read_text()
          marker = '// ============================================================\n// People-rundingen – stale-while-revalidate'
          if marker in epoke:
              epoke = epoke.split(marker, 1)[0].rstrip() + '\n'
              epoke_path.write_text(epoke)

          boot = Path('js/boot-fast.js').read_text()
          popup = Path('js/ui/popup-utils.js').read_text()
          epoke = epoke_path.read_text()
          forbidden = [
              'HG_SHOULD_DEFER_PEOPLE_FOR_PLACE',
              'hg:people-place-revalidation-needed',
              'failedRevalidationKeys',
              'revalidateOpenPlacePeopleFiles',
          ]
          for token in forbidden:
              assert token not in boot, f'boot still contains {token}'
              assert token not in popup, f'popup still contains {token}'
          assert 'stale-while-revalidate' not in epoke
          assert 'return [];' not in popup[popup.index('function getPeopleForPlace'):popup.index('function getPlacesForPerson')], 'resolver still has an early empty-list veto'
          PY

      - name: Validate actual People path
        shell: bash
        run: |
          set -euxo pipefail
          node --check js/boot-fast.js
          node --check js/ui/popup-utils.js
          node --check js/ui/place-card-epoke.js
          node tests/background-boot-pacing.test.js
          node --test tests/torggata-phase12-people-links.test.mjs
          git diff --check

      - name: Commit repaired runtime
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "History Go repair bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/people-loader-root-fix-temp.yml .github/workflows/people-loader-root-fix-v2.yml
          git add js/boot-fast.js js/ui/popup-utils.js js/ui/place-card-epoke.js tests/background-boot-pacing.test.js tests/torggata-phase12-people-links.test.mjs
          git commit -m "Gjenopprett fungerende People-lasting"
          git push origin HEAD:agent/people-loader-root-fix
