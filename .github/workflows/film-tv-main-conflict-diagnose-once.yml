name: Film TV main conflict diagnose once

on:
  push:
    branches:
      - agent/film-tv-holistic-192-completion-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: agent/film-tv-holistic-192-completion-audit
          fetch-depth: 0

      - name: Diagnose merge conflicts against latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          merge_output="$(git merge --no-commit --no-ff origin/main 2>&1)"
          merge_rc=$?
          set -e
          printf '%s\n' "$merge_output"
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ -z "$conflicts" ]]; then
            git merge --abort || true
            if [[ $merge_rc -ne 0 ]]; then
              inline_output="$(printf '%s' "$merge_output" | tr '\n' ' ' | cut -c1-900)"
              echo "::error title=Film TV main reconciliation::$inline_output"
              exit 1
            fi
            echo "No merge conflicts against latest main."
            exit 0
          fi
          inline="$(printf '%s\n' "$conflicts" | paste -sd ',' -)"
          echo "::error title=Film TV main reconciliation conflicts::$inline"
          printf '%s\n' "$conflicts"
          git merge --abort || true
          exit 1
