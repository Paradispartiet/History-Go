name: Film TV main reconciliation once

on:
  push:
    branches:
      - agent/film-tv-holistic-192-completion-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: agent/film-tv-holistic-192-completion-audit
          fetch-depth: 0

      - name: Merge latest main and resolve only proven shared registries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          git show HEAD:data/fagverk/fagverk_registry.json > /tmp/ours-registry.json
          git show HEAD:data/fagverk/subject_status.json > /tmp/ours-status.json

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e

          if [[ $merge_rc -eq 0 ]]; then
            echo "Expected the four already-proven shared-file conflicts, but merge completed cleanly. Refusing to guess."
            git merge --abort || true
            exit 1
          fi

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          expected=(
            "data/fagverk/fagverk_registry.json"
            "data/fagverk/fagverk_release.json"
            "data/fagverk/subject_status.json"
            "reports/fagverk/subject-baseline.json"
          )
          if [[ "${conflicts[*]}" != "${expected[*]}" ]]; then
            echo "Unexpected conflict set: ${conflicts[*]}"
            git merge --abort || true
            exit 1
          fi

          git show :3:data/fagverk/fagverk_registry.json > /tmp/main-registry.json
          git show :3:data/fagverk/subject_status.json > /tmp/main-status.json
          git checkout --theirs data/fagverk/fagverk_release.json reports/fagverk/subject-baseline.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, value) => fs.writeFileSync(p, `${JSON.stringify(value, null, 2)}\n`);
          const versionParts = (value) => String(value || '0.0.0').split('.').map((part) => Number.parseInt(part, 10) || 0);
          const maxVersion = (a, b) => {
            const av = versionParts(a);
            const bv = versionParts(b);
            for (let i = 0; i < Math.max(av.length, bv.length); i += 1) {
              const ai = av[i] || 0;
              const bi = bv[i] || 0;
              if (ai > bi) return a;
              if (bi > ai) return b;
            }
            return a || b;
          };
          const maxDate = (a, b) => [a, b].filter(Boolean).sort().at(-1) || null;

          const oursRegistry = read('/tmp/ours-registry.json');
          const mainRegistry = read('/tmp/main-registry.json');
          if (!oursRegistry.subjects?.film_tv || !mainRegistry.subjects?.film_tv) {
            throw new Error('film_tv registry subject missing on ours or main');
          }
          const mergedRegistry = structuredClone(mainRegistry);
          mergedRegistry.subjects.film_tv = oursRegistry.subjects.film_tv;
          mergedRegistry.version = maxVersion(oursRegistry.version, mainRegistry.version);
          mergedRegistry.updatedAt = maxDate(oursRegistry.updatedAt, mainRegistry.updatedAt);
          write('data/fagverk/fagverk_registry.json', mergedRegistry);

          const oursStatus = read('/tmp/ours-status.json');
          const mainStatus = read('/tmp/main-status.json');
          const oursFilm = oursStatus.subjects?.find((item) => item.id === 'film_tv');
          const mainFilmIndex = mainStatus.subjects?.findIndex((item) => item.id === 'film_tv');
          if (!oursFilm || mainFilmIndex < 0) throw new Error('film_tv subject status missing on ours or main');
          const mergedStatus = structuredClone(mainStatus);
          mergedStatus.subjects[mainFilmIndex] = oursFilm;
          mergedStatus.version = maxVersion(oursStatus.version, mainStatus.version);
          mergedStatus.updatedAt = maxDate(oursStatus.updatedAt, mainStatus.updatedAt);
          write('data/fagverk/subject_status.json', mergedStatus);
          NODE

          git add data/fagverk/fagverk_registry.json data/fagverk/subject_status.json
          node scripts/audit-fagverk-subject-inventory.mjs --write-report --no-check-report
          node scripts/build-fagverk-release-manifest.mjs
          git add reports/fagverk/subject-baseline.json data/fagverk/fagverk_release.json

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            git merge --abort || true
            exit 1
          fi

      - name: Validate holistic 192 completion
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-film-tv-holistic-completion-v1.mjs
          node --test tests/film-tv-holistic-completion-v1.test.mjs

      - name: Validate shared subject inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-fagverk-subject-inventory.mjs
          node --test tests/fagverk-subject-inventory.test.mjs

      - name: Validate shared general engine
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-fagverk-general-engine.mjs
          node --test tests/fagverk-general-engine.test.mjs

      - name: Validate Film TV phase3
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-fagverk-film-tv-phase3.mjs
          node --test tests/fagverk-film-tv-phase3.test.mjs

      - name: Validate release manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/fagverk-release-manifest.test.mjs

      - name: Validate Unit15 and monotone completion gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.mjs
          node --test tests/film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.test.mjs
          node --test tests/film-tv-unit15-fulltext-predecessor-monotonicity-v1.test.mjs
          node --test tests/film-tv-final-gate-monotonicity-v1.test.mjs

      - name: Validate terminal Film TV state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const status = JSON.parse(fs.readFileSync('data/fagverk/subject_status.json', 'utf8'));
          const registry = JSON.parse(fs.readFileSync('data/fagverk/fagverk_registry.json', 'utf8'));
          const filmStatus = status.subjects.find((item) => item.id === 'film_tv');
          const filmRegistry = registry.subjects?.film_tv;
          if (filmStatus?.editorialStatus !== 'complete') throw new Error('Film TV completion regressed');
          if (filmStatus?.nextGate !== 'maintenance_source_refresh_and_place_case_expansion') throw new Error('Film TV terminal gate regressed');
          if (filmRegistry?.chapters?.length !== 17) throw new Error(`Film TV chapter count regressed: ${filmRegistry?.chapters?.length}`);
          NODE

      - name: Commit reconciliation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/film-tv-main-conflict-diagnose-once.yml
          git add -A
          git commit -m "Merge latest main into Film TV completion audit"
          git push origin HEAD:agent/film-tv-holistic-192-completion-audit
