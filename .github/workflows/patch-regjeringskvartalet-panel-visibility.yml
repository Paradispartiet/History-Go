name: Patch Regjeringskvartalet panel visibility contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-regjeringskvartalet-panel-visibility.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 4674
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/regjeringskvartalet-phase-13-ui-audit
          fetch-depth: 0

      - name: Patch active-panel contract
        run: python3 scripts/patch_regjeringskvartalet_panel_visibility.py

      - name: Commit panel-contract correction
        run: |
          rm scripts/patch_regjeringskvartalet_panel_visibility.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/regjeringskvartalet-ui-production-audit.test.mjs scripts/patch_regjeringskvartalet_panel_visibility.py
          git commit -m "Test aktivt popupanel med hidden-kontrakten"
          git push origin HEAD:agent/regjeringskvartalet-phase-13-ui-audit
