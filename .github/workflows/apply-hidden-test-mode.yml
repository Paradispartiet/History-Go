name: Apply hidden test mode

on:
  push:
    branches:
      - agent/remove-public-test-mode-toggle
    paths:
      - 'scripts/apply-hidden-test-mode.mjs'
      - '.github/workflows/apply-hidden-test-mode.yml'
  pull_request:
    paths:
      - 'scripts/apply-hidden-test-mode.mjs'
      - '.github/workflows/apply-hidden-test-mode.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-public-test-mode-toggle
          show-progress: false

      - name: Apply migration
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          rm -f reports/hidden-test-mode-apply-error.txt reports/hidden-test-mode-test-error.txt
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-hidden-test-mode.mjs')
          text = path.read_text()
          replacements = [
              (
                  '      const cleanUrl = `${url.pathname}${url.search}${url.hash}`;',
                  '      const cleanUrl = url.pathname + url.search + url.hash;'
              ),
              (
                  '  fs.mkdirSync(path.split("/").slice(0, -1).join("/"), { recursive: true });',
                  '  const directory = path.split("/").slice(0, -1).join("/");\n  if (directory) fs.mkdirSync(directory, { recursive: true });'
              )
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Fant ikke migreringsblokk: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          node scripts/apply-hidden-test-mode.mjs 2>&1 | tee /tmp/hidden-test-mode-apply.log

      - name: Persist migration error
        if: steps.apply.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cp /tmp/hidden-test-mode-apply.log reports/hidden-test-mode-apply-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/hidden-test-mode-apply-error.txt
          git commit -m "Record hidden test mode migration error"
          git push
          exit 1

      - name: Test hidden test mode
        id: test
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            node tests/hg-test-mode.test.js
            node tests/header-search-menu.test.js
            node --check js/debug/HGTestMode.js
            node --check js/ui/dom.js
          } 2>&1 | tee /tmp/hidden-test-mode-test.log

      - name: Persist test error
        if: steps.apply.outcome == 'success' && steps.test.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cp /tmp/hidden-test-mode-test.log reports/hidden-test-mode-test-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/hidden-test-mode-test-error.txt
          git commit -m "Record hidden test mode test error"
          git push
          exit 1

      - name: Commit changes
        if: steps.apply.outcome == 'success' && steps.test.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/debug/HGTestMode.js js/ui/dom.js css/components.css tests/hg-test-mode.test.js tests/header-search-menu.test.js docs/HG_TEST_MODE.md schemas/globals.d.ts schemas/app-globals.d.ts .github/workflows/typescript-guard.yml
          git add -u reports/hidden-test-mode-apply-error.txt reports/hidden-test-mode-test-error.txt || true
          if git diff --cached --quiet; then
            echo "Hidden test mode changes already applied."
            exit 0
          fi
          git commit -m "Hide test mode from public menu"
          git push
