name: Apply hidden test mode

on:
  push:
    branches:
      - agent/remove-public-test-mode-toggle
    paths:
      - 'scripts/apply-hidden-test-mode.mjs'
      - '.github/workflows/apply-hidden-test-mode.yml'

concurrency:
  group: hidden-test-mode-migration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-public-test-mode-toggle
          show-progress: false

      - name: Apply migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f reports/hidden-test-mode-apply-error.txt reports/hidden-test-mode-test-error.txt
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-hidden-test-mode.mjs')
          text = path.read_text()
          replacements = [
              (
                  '      const cleanUrl = `${url.pathname}${url.search}${url.hash}`;',
                  '      const cleanUrl = url.pathname + url.search + url.hash;'
              ),
              (
                  '  fs.mkdirSync(path.split("/").slice(0, -1).join("/"), { recursive: true });',
                  '  const directory = path.split("/").slice(0, -1).join("/");\n  if (directory) fs.mkdirSync(directory, { recursive: true });'
              )
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Fant ikke migreringsblokk: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          node scripts/apply-hidden-test-mode.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/header-search-menu.test.js')
          text = path.read_text()
          replacements = [
              (
                  '  const document = {\n    readyState: "complete",',
                  '  const document = {\n    readyState: "complete",\n    querySelector(selector) {\n      return String(selector).startsWith("link[") ? fakeElement() : null;\n    },'
              ),
              (
                  '  runScript("js/ui/search.js", { window, document, console });',
                  '  class HTMLInputElement {\n    static [Symbol.hasInstance](value) { return value === input; }\n  }\n  class Element {\n    static [Symbol.hasInstance](value) { return !!value && typeof value.closest === "function"; }\n  }\n  class HTMLElement {\n    static [Symbol.hasInstance](value) { return !!value && typeof value === "object" && "dataset" in value; }\n  }\n\n  runScript("js/ui/search.js", { window, document, console, HTMLInputElement, Element, HTMLElement });'
              )
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Fant ikke test-fixture: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Test hidden test mode
        run: |
          node tests/hg-test-mode.test.js
          node tests/header-search-menu.test.js
          node --check js/debug/HGTestMode.js
          node --check js/ui/dom.js

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/debug/HGTestMode.js js/ui/dom.js css/components.css tests/hg-test-mode.test.js tests/header-search-menu.test.js docs/HG_TEST_MODE.md schemas/globals.d.ts schemas/app-globals.d.ts .github/workflows/typescript-guard.yml
          git add -u reports/hidden-test-mode-apply-error.txt reports/hidden-test-mode-test-error.txt || true
          if git diff --cached --quiet; then
            echo "Hidden test mode changes already applied."
            exit 0
          fi
          git commit -m "Hide test mode from public menu"
          git push
