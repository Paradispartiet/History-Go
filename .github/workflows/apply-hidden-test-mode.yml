name: Apply hidden test mode

on:
  push:
    branches:
      - agent/remove-public-test-mode-toggle
    paths:
      - 'scripts/apply-hidden-test-mode.mjs'
      - '.github/workflows/apply-hidden-test-mode.yml'
  pull_request:
    paths:
      - 'scripts/apply-hidden-test-mode.mjs'
      - '.github/workflows/apply-hidden-test-mode.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-public-test-mode-toggle
          show-progress: false

      - name: Apply migration
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/apply-hidden-test-mode.mjs 2>&1 | tee /tmp/hidden-test-mode-apply.log

      - name: Persist migration error
        if: steps.apply.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cp /tmp/hidden-test-mode-apply.log reports/hidden-test-mode-apply-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/hidden-test-mode-apply-error.txt
          git commit -m "Record hidden test mode migration error"
          git push
          exit 1

      - name: Test hidden test mode
        if: steps.apply.outcome == 'success'
        run: |
          node tests/hg-test-mode.test.js
          node tests/header-search-menu.test.js
          node --check js/debug/HGTestMode.js
          node --check js/ui/dom.js

      - name: Commit changes
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/debug/HGTestMode.js js/ui/dom.js css/components.css tests/hg-test-mode.test.js tests/header-search-menu.test.js docs/HG_TEST_MODE.md schemas/globals.d.ts schemas/app-globals.d.ts .github/workflows/typescript-guard.yml
          if git diff --cached --quiet; then
            echo "Hidden test mode changes already applied."
            exit 0
          fi
          git commit -m "Hide test mode from public menu"
          git push
