name: Temporary Litteratur round 3 materializer

on:
  push:
    branches:
      - agent/litteratur-maintenance-source-refresh-round3-20260905
    paths:
      - 'scripts/tmp-materialize-litteratur-maintenance-round3.mjs'
      - '.github/workflows/tmp-litteratur-round3-materialize.yml'

permissions:
  contents: write

concurrency:
  group: litteratur-round3-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Materialize controlled round 3 changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/tmp-materialize-litteratur-maintenance-round3.mjs')
          s = p.read_text()
          old = "  if (!allowed.has(file)) throw new Error(`Unexpected generator drift: ${file}`);"
          new = "  const normalizedFile = file === 'github/workflows/litteratur-maintenance-integrity.yml' ? '.github/workflows/litteratur-maintenance-integrity.yml' : file;\n  if (!allowed.has(normalizedFile)) throw new Error(`Unexpected generator drift: ${file}`);"
          if old not in s:
              raise SystemExit('Expected drift-guard line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node scripts/tmp-materialize-litteratur-maintenance-round3.mjs
      - name: Commit validated non-workflow round 3 tree
        run: |
          git checkout -- .github/workflows/litteratur-maintenance-integrity.yml
          git checkout -- scripts/tmp-materialize-litteratur-maintenance-round3.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Refusing to push workflow mutation from Actions token'
            git diff --cached --name-only
            exit 1
          fi
          git diff --cached --stat
          git commit -m 'Materialize Litteratur maintenance source refresh round 3'
          git push origin HEAD:${GITHUB_REF_NAME}
