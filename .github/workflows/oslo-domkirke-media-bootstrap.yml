name: Oslo domkirke — one-time v1 materialization
on:
  push:
    branches:
      - content/oslo-domkirke-v1-people-photo-20261027
    paths:
      - .github/workflows/oslo-domkirke-media-bootstrap.yml
permissions:
  contents: write
jobs:
  materialize:
    name: Build Fagverk, Quiz Knowledge, QuizCard and Place runtime
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Rebuild canonical Knowledge and runtime
        run: |
          npm run knowledge:canonical:write
          npm run places:index:build
          npm run place-open:build
          npm run epoker:places:build
          node scripts/build-fagverk-release-manifest.mjs
      - name: Check generated files and narrow integrity
        run: |
          npm run place-open:check
          npm run epoker:places:check
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit generated canonical artefacts to the PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short | head -80
          git add data/knowledge/ data/quiz/historie/oslo_domkirke_sets.json data/quizcards/historie/oslo_domkirke_quizkort_v1.json
          git add data/fagverk/fagverk_release.json data/runtime/place-open/ data/places/places_index.json data/epoker/epoke-place-index.json
          git diff --cached --stat | tail -30
          if git diff --cached --quiet; then echo 'Canonical artefacts already synchronized'; exit 0; fi
          git commit -m 'build(oslo): materialize cathedral Knowledge and Fagverk runtime'
          git push origin HEAD:refs/heads/content/oslo-domkirke-v1-people-photo-20261027
