name: Oslo domkirke — one-time documentary photo materialization
on:
  push:
    branches:
      - content/oslo-domkirke-v1-people-photo-20261027
    paths:
      - .github/workflows/oslo-domkirke-media-bootstrap.yml
permissions:
  contents: write
jobs:
  photos:
    name: Fetch licensed photos, materialize and synchronize canonical Place
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Fetch documented sources and produce three independent WebP crops
        run: python scripts/prepare-oslo-domkirke-documentary-photos.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebuild dependent canonical indices
        run: |
          npm run place-open:build
          npm run places:index:build
          npm run epoker:places:build
      - name: Commit only the image and its canonical synchronization to the PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bilder/places/oslo-domkirke-20261027/
          git add data/places/by/oslo/oslo_domkirke/oslo_domkirke.json
          git add data/runtime/place-open/ data/places/places_index.json data/epoker/epoke-place-index.json
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No changes materialized'; exit 1; }
          git commit -m 'media(oslo): add source-licensed cathedral hero, portrait and card images'
          git push origin HEAD:refs/heads/content/oslo-domkirke-v1-people-photo-20261027
