name: Tøyen trafo integrate Lesespor with Story (temporary)
on:
  push:
    branches:
      - feat/toyen-trafo-objects-20261104
    paths:
      - .github/workflows/toyen-trafo-lesespor-sync-temp.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge latest main without losing source-backed Lesespor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge -X ours --no-ff origin/main -m "Sync main Lesespor into illustrated Tøyen trafo Story"
      - name: Rebuild both canonical runtime sources and validate
        run: |
          npm ci --no-audit --no-fund
          npm run place-open:build
          npm run place-open:check
          npm run check:stories
          node --test tests/toyen-trafo-objects-collection.test.mjs
          git status --short
      - name: Commit generated runtime and push integrated branch
        run: |
          git add data/runtime/place-open/toyen_trafo.json data/runtime/stories-all
          if ! git diff --cached --quiet; then
            git commit -m "build(toyen trafo): combine four Lesespor with source-bound Story art"
          fi
          git push origin HEAD:feat/toyen-trafo-objects-20261104
