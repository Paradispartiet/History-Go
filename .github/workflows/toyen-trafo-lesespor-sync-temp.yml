name: Tøyen trafo reading paths runtime sync (temporary)
on:
  push:
    branches:
      - content/toyen-trafo-lesespor-20261104
    paths:
      - .github/workflows/toyen-trafo-lesespor-sync-temp.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Lesespor and regenerate actual Place-open
        run: |
          npm ci --no-audit --no-fund
          npm run build:tools
          node dist/tools/validate_lesespor.mjs
          npm run place-open:build
          npm run place-open:check
          node --test tests/toyen-trafo-lesespor-contract.test.mjs
          git status --short
      - name: Commit generated runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/runtime/lesespor-all.json data/runtime/place-open/toyen_trafo.json
          git diff --cached --name-only
          if ! git diff --cached --quiet; then
            git commit -m "build(toyen trafo): synchronize four canonical Lesespor into Place-open"
            git push origin HEAD:content/toyen-trafo-lesespor-20261104
          fi
