name: Rodeløkka production bootstrap

on:
  push:
    branches:
      - work/rodelokka-production-20260904

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/rodelokka-production-20260904
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Decode and run Rodeløkka source builder
        run: |
          base64 -d tools/build-rodelokka-completion.mjs.gz.b64 | gunzip > tools/build-rodelokka-completion.mjs
          node --check tools/build-rodelokka-completion.mjs
          node tools/build-rodelokka-completion.mjs
      - name: Normalize Rodeløkka quiz phase metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'data/quiz/production_briefs/by/rodelokka.json';
          const brief = JSON.parse(fs.readFileSync(file, 'utf8'));
          const quizClaims = (brief.claims || []).filter((item) => /^claim_rodelokka_quiz_\d+$/.test(item.claim_id || ''));
          if (quizClaims.length !== 35) {
            throw new Error(`Expected 35 Rodeløkka quiz claims, found ${quizClaims.length}`);
          }
          const phaseBySet = new Map([
            [1, 'opening'],
            [2, 'middle'],
            [3, 'middle'],
            [4, 'bridge'],
            [5, 'final'],
          ]);
          for (const claim of quizClaims) {
            const set = Number(claim.planned_set);
            const phase = phaseBySet.get(set);
            if (!phase) throw new Error(`${claim.claim_id}: invalid planned_set ${claim.planned_set}`);
            claim.planned_phase = phase;
          }
          const counts = Object.fromEntries([...phaseBySet.keys()].map((set) => [set, quizClaims.filter((claim) => Number(claim.planned_set) === set).length]));
          for (const set of phaseBySet.keys()) {
            if (counts[set] !== 7) throw new Error(`Set ${set}: expected 7 claims, found ${counts[set]}`);
          }
          fs.writeFileSync(file, `${JSON.stringify(brief, null, 2)}\n`);
          NODE
      - name: Materialize canonical derived data
        run: |
          npm run quiz:context -- --category by --target rodelokka --output data/quiz/production_context/by/rodelokka.json
          npm run epoker:places:build
          npm run places:index:build
          npm run place-open:build
      - name: Focused Rodeløkka gates
        run: |
          node --test tests/rodelokka-completion.test.mjs
          npm run places:emner:check
          npm run check:stories
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-content
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
      - name: Commit permanent production only
        run: |
          rm .github/workflows/rodelokka-production-bootstrap.yml
          rm tools/build-rodelokka-completion.mjs.gz.b64
          rm tools/build-rodelokka-completion.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Rodeløkka Place production"
          git push origin HEAD:work/rodelokka-production-20260904
