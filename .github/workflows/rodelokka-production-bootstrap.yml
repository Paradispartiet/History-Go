name: Rodeløkka production bootstrap

on:
  push:
    branches:
      - work/rodelokka-production-20260904

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/rodelokka-production-20260904
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build Rodeløkka source package
        run: |
          base64 -d tools/build-rodelokka-completion.mjs.gz.b64 | gunzip > tools/build-rodelokka-completion.mjs
          node --check tools/build-rodelokka-completion.mjs
          node tools/build-rodelokka-completion.mjs
          node tools/normalize-rodelokka-production.mjs pre
      - name: Materialize canonical derived data
        run: |
          npm run epoker:places:build
          npm run places:index:build
          npm run place-open:build
          npm run quiz:context -- --category by --target rodelokka --output data/quiz/production_context/by/rodelokka.json
          node tools/normalize-rodelokka-production.mjs post
      - name: Rodeløkka completion tests
        run: node --test tests/rodelokka-completion.test.mjs
      - name: Place emne check
        run: npm run places:emner:check
      - name: Story integrity
        run: npm run check:stories
      - name: Quiz manifest audit
        run: npm run audit:quiz-manifest:v2
      - name: Quiz content audit
        run: npm run audit:quiz-content
      - name: Quiz production context audit
        run: npm run audit:quiz-production-context
      - name: Quiz progression audit
        run: npm run audit:quiz-progression
      - name: Quiz theory binding audit
        run: npm run audit:quiz-theory-binding
      - name: Commit permanent production only
        run: |
          rm .github/workflows/rodelokka-production-bootstrap.yml
          rm tools/build-rodelokka-completion.mjs.gz.b64
          rm tools/build-rodelokka-completion.mjs
          rm tools/normalize-rodelokka-production.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Rodeløkka Place production"
          git push origin HEAD:work/rodelokka-production-20260904
