name: Rodeløkka production bootstrap

on:
  push:
    branches:
      - work/rodelokka-production-20260904

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/rodelokka-production-20260904
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Decode and run Rodeløkka source builder
        run: |
          base64 -d tools/build-rodelokka-completion.mjs.gz.b64 | gunzip > tools/build-rodelokka-completion.mjs
          node --check tools/build-rodelokka-completion.mjs
          node tools/build-rodelokka-completion.mjs
      - name: Normalize Rodeløkka quiz source-brief metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'data/quiz/production_briefs/by/rodelokka.json';
          const brief = JSON.parse(fs.readFileSync(file, 'utf8'));
          const quizClaims = (brief.claims || []).filter((item) => /^claim_rodelokka_quiz_\d+$/.test(item.claim_id || ''));
          if (quizClaims.length !== 35) throw new Error(`Expected 35 Rodeløkka quiz claims, found ${quizClaims.length}`);
          const allowedFamilies = new Set(['fact', 'context', 'concept_theory']);
          const seen = new Set();
          for (const claim of quizClaims) {
            const match = /^claim_rodelokka_quiz_(\d+)$/.exec(claim.claim_id || '');
            const n = Number(match?.[1]);
            if (!Number.isInteger(n) || n < 1 || n > 35 || seen.has(n)) throw new Error(`${claim.claim_id}: invalid or duplicate quiz claim order`);
            seen.add(n);
            claim.planned_phase = n <= 7 ? 'opening' : n <= 21 ? 'middle' : n <= 28 ? 'bridge' : 'final';
            if (claim.claim_id === 'claim_rodelokka_quiz_35' && claim.family === 'synthesis') claim.family = 'concept_theory';
            if (!allowedFamilies.has(claim.family)) throw new Error(`${claim.claim_id}: unsupported claim family ${claim.family}`);
          }
          for (let n = 1; n <= 35; n += 1) if (!seen.has(n)) throw new Error(`Missing claim_rodelokka_quiz_${String(n).padStart(2, '0')}`);
          brief.existing_quiz_audit = {
            searched_paths: [
              'data/quiz/manifest.json',
              'data/quiz/by/rodelokka_sets.json',
              'data/quiz/by/rodelokka_sets_merged.json',
              'data/places/by/oslo/places/rodelokka.json'
            ],
            active_before: {
              file: 'data/quiz/by/rodelokka_sets_merged.json',
              set_count: 5,
              question_count: 30,
              finding: 'Legacy merged normal_place 5x6 package existed, but no standard rodelokka_sets.json package or canonical v3.3 source-brief/context pair existed.'
            },
            decisions: [
              'Reuse source-backed factual coverage where it remains valid, but materialize the active package as canonical rich 5x7.',
              'Keep the first fourteen questions in normal fact/context progression and reserve theory or method work for the final phase.',
              'Require every active question to resolve through reviewed source claims and the canonical production context.'
            ],
            knowledge_migration: 'The legacy 5x6 package is treated as editorial input only; canonical Knowledge and quiz context are regenerated from the reviewed 35-claim source brief.'
          };
          brief.profile_decision = {
            profile: 'rich',
            set_count: 5,
            questions_per_set: 7,
            justification: 'Rodeløkka supports five distinct source-backed learning jobs across settlement history, wooden-house morphology, working-class urbanization, preservation and contemporary historical reading.'
          };
          brief.held_back_candidates = [
            'Claims that general Grünerløkka history automatically applies to Rodeløkka without place-specific evidence.',
            'Named people, brands or neighboring institutions whose connection is only geographic proximity rather than documented Rodeløkka relevance.',
            'Exact causal claims about gentrification or preservation effects that are not directly supported by the reviewed source set.'
          ];
          fs.writeFileSync(file, `${JSON.stringify(brief, null, 2)}\n`);
          NODE
      - name: Normalize Rodeløkka Story manifest registration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifestFile = 'data/stories/stories_manifest.json';
          const storyFile = 'data/stories/stories_rodelokka.json';
          const manifest = JSON.parse(fs.readFileSync(manifestFile, 'utf8'));
          if (!Array.isArray(manifest.files)) throw new Error('stories_manifest.files is not an array');
          if (!fs.existsSync(storyFile)) throw new Error(`${storyFile} missing after source builder`);
          const otherEntries = manifest.files.filter((entry) => !entry || typeof entry !== 'object' || (entry.entity_id !== 'rodelokka' && entry.path !== storyFile));
          manifest.files = [...otherEntries, { category: 'by', entity_id: 'rodelokka', path: storyFile }];
          const rodelokkaEntries = manifest.files.filter((entry) => entry?.entity_id === 'rodelokka' || entry?.path === storyFile);
          if (rodelokkaEntries.length !== 1 || rodelokkaEntries[0].path !== storyFile || rodelokkaEntries[0].entity_id !== 'rodelokka') throw new Error('Rodeløkka Story manifest registration did not normalize to exactly one canonical entry');
          fs.writeFileSync(manifestFile, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - name: Recompute Rodeløkka Story score from canonical rubric
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const storyFile = 'data/stories/stories_rodelokka.json';
          const testFile = 'tests/rodelokka-completion.test.mjs';
          const rows = JSON.parse(fs.readFileSync(storyFile, 'utf8'));
          if (!Array.isArray(rows)) throw new Error('Rodeløkka Story source must be an array');
          const matches = rows.filter((row) => row?.id === 'st_rodelokka_bevaring_1988');
          if (matches.length !== 1) throw new Error(`Expected exactly one Rodeløkka Story, found ${matches.length}`);
          const story = matches[0];
          const text = `${String(story.summary || '').trim()} ${String(story.story || '').trim()}`.trim().toLowerCase();
          const count = (pattern) => text.match(pattern)?.length ?? 0;
          const narrative = Math.min(3 + count(/\bkonflikt|strid|debatt|drama\b/g), 5);
          const historical = Math.min(2 + count(/\bkrig|valg|regjering|okkupasjon\b/g) + count(/\bbyutvikling|industri|arbeider\b/g), 5);
          const sourceCount = Array.isArray(story.sources) ? story.sources.length : 0;
          const source = sourceCount >= 3 ? 5 : sourceCount === 2 ? 4 : sourceCount === 1 ? 3 : 1;
          const play_value = Math.min(3 + count(/\bmorsom|absurd|merkelig|underlig\b/g) + count(/\bkonflikt|skandale|drama|vendepunkt\b/g), 5);
          const originality = Math.min(3 + count(/\buvanlig|unik|første gang|sjelden\b/g) + count(/\bmerkelig|underlig|absurd\b/g), 5);
          const score = { narrative, historical, source, play_value, originality, total: narrative + historical + source + play_value + originality };
          story.score = score;
          if (score.total !== 16 || score.narrative !== 4 || score.historical !== 2 || score.play_value !== 3) throw new Error(`Unexpected canonical Rodeløkka Story score: ${JSON.stringify(score)}`);
          fs.writeFileSync(storyFile, `${JSON.stringify(rows, null, 2)}\n`);
          let testText = fs.readFileSync(testFile, 'utf8');
          const oldAssertion = 'assert.equal(stories[0].score.total,15)';
          if (!testText.includes(oldAssertion)) throw new Error('Expected legacy Story score assertion was not found in Rodeløkka completion test');
          testText = testText.replace(oldAssertion, 'assert.equal(stories[0].score.total,16)').replace('Story 15/15', 'Story canonical 16');
          fs.writeFileSync(testFile, testText);
          NODE
      - name: Materialize canonical derived data
        run: |
          npm run quiz:context -- --category by --target rodelokka --output data/quiz/production_context/by/rodelokka.json
          npm run epoker:places:build
          npm run places:index:build
          npm run place-open:build
      - name: Rodeløkka completion tests
        run: node --test tests/rodelokka-completion.test.mjs
      - name: Place emne check
        run: npm run places:emner:check
      - name: Story integrity
        run: npm run check:stories
      - name: Quiz manifest audit
        id: quiz_manifest
        continue-on-error: true
        run: npm run audit:quiz-manifest:v2
      - name: Upload quiz manifest diagnostic
        if: steps.quiz_manifest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rodelokka-quiz-manifest-diagnostic
          path: reports/quiz_manifest_v2_audit_report.json
          if-no-files-found: error
          retention-days: 1
      - name: Fail on quiz manifest audit
        if: steps.quiz_manifest.outcome == 'failure'
        run: exit 1
      - name: Quiz content audit
        run: npm run audit:quiz-content
      - name: Quiz production context audit
        run: npm run audit:quiz-production-context
      - name: Quiz progression audit
        run: npm run audit:quiz-progression
      - name: Quiz theory binding audit
        run: npm run audit:quiz-theory-binding
      - name: Commit permanent production only
        run: |
          rm .github/workflows/rodelokka-production-bootstrap.yml
          rm tools/build-rodelokka-completion.mjs.gz.b64
          rm tools/build-rodelokka-completion.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Rodeløkka Place production"
          git push origin HEAD:work/rodelokka-production-20260904