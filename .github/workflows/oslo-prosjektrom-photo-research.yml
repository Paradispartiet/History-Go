name: Oslo Prosjektrom photo rights research
on:
  push:
    branches: [place/oslo-prosjektrom-v1-20261103]
    paths:
      - '.github/workflows/oslo-prosjektrom-photo-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original gallery-address photo and rights metadata
        run: python3 scripts/research-oslo-prosjektrom-photo.py
