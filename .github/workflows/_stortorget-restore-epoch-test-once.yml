name: Stortorget restore epoch test once

on:
  push:
    branches:
      - agent/stortorget-production-closure-20260911-replay2
    paths:
      - '.github/workflows/_stortorget-restore-epoch-test-once.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stortorget-production-closure-20260911-replay2
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Restore complete epoch test from last clean head
        run: git checkout 9477bf3999d9a5235615329869cdd186d4b957d8 -- tests/epoke-place-index.test.mjs
      - name: Apply only Stortorget epoch baseline deltas
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/epoke-place-index.test.mjs')
          s = p.read_text()
          replacements = [
              ('assert.equal(index.stats.canonical_story_milestone_count, 236);', 'assert.equal(index.stats.canonical_story_milestone_count, 237);'),
              ('assert.equal(index.stats.verified_place_production_milestone_count, 507);', 'assert.equal(index.stats.verified_place_production_milestone_count, 512);'),
              ('assert.equal(coverage.dated_evidence_place_count, 241);', 'assert.equal(coverage.dated_evidence_place_count, 242);'),
              ('assert.equal(coverage.awaiting_source_backed_history_count, 344);', 'assert.equal(coverage.awaiting_source_backed_history_count, 343);'),
              ('"slottsparken", "peststotten_krist_kirkegard"])', '"slottsparken", "peststotten_krist_kirkegard", "stortorget"])'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match: {old!r}; got {s.count(old)}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Verify epoch index and full epoch test
        run: |
          npm run epoker:places:check
          node --test tests/epoke-place-index.test.mjs
      - name: Remove restore workflow from permanent tree
        run: git rm -- .github/workflows/_stortorget-restore-epoch-test-once.yml
      - name: Commit exact restoration and baseline adjustment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Update epoch coverage for Stortorget'
          git push origin HEAD:agent/stortorget-production-closure-20260911-replay2
