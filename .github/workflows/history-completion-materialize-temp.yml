name: History completion materialize temporary
# Temporary repair/materialization workflow. Remove before History merge.

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/materialize-historie-editorial-chapters.mjs'
      - 'tools/audit-historie-semantic-hook-alignment.mjs'
      - 'data/fag/historie/fagkart_historie_canonical_v4_5.json'
      - '.github/workflows/history-completion-materialize-temp.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/history-completion-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact History branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconcile latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reconcile canonical hook ownership
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const list = (value) => Array.isArray(value) ? value : [];
          const emnePath = 'data/fag/historie/emner_historie_canonical_v4_5.json';
          const mappingPath = 'data/fag/historie/emnemapping_historie_canonical_v4_5.json';
          const fagkartPath = 'data/fag/historie/fagkart_historie_canonical_v4_5.json';
          const emners = read(emnePath);
          const mappings = read(mappingPath);
          const fagkart = read(fagkartPath);
          const mappingByEmne = new Map(mappings.map((row) => [row.emne_id, row]));
          const hookById = new Map();
          for (const category of list(fagkart.categories)) {
            for (const hook of list(category.topic_hooks)) hookById.set(hook.id, hook);
          }
          const additions = [];
          for (const emne of emners) {
            const declared = [...new Set([...list(emne.primary_theory_hooks), ...list(emne.secondary_theory_hooks)])];
            const mapped = new Set(list(mappingByEmne.get(emne.emne_id)?.mappings).map((row) => row.topic_hook));
            for (const hookId of declared) {
              if (!mapped.has(hookId)) throw new Error(`${emne.emne_id}: canonical hook ${hookId} mangler mapping`);
              const hook = hookById.get(hookId);
              if (!hook) throw new Error(`${emne.emne_id}: canonical hook ${hookId} finnes ikke i fagkart`);
              hook.emne_ids = list(hook.emne_ids);
              if (!hook.emne_ids.includes(emne.emne_id)) {
                hook.emne_ids.push(emne.emne_id);
                additions.push(`${hookId}->${emne.emne_id}`);
              }
            }
          }
          fs.writeFileSync(fagkartPath, `${JSON.stringify(fagkart, null, 2)}\n`);
          console.log(JSON.stringify({ canonical_hook_ownership_additions: additions.length, additions }, null, 2));
          NODE

      - name: Install semantic/editorial hook separation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'tools/materialize-historie-editorial-chapters.mjs';
          let source = fs.readFileSync(file, 'utf8');

          if (!source.includes('const EDITORIAL_BLUEPRINT_FILES = [')) {
            const anchor = "const historiographyDocument = readJson('data/fag/historie/historiography_evidence_historie_v1.json');\n";
            if (!source.includes(anchor)) throw new Error('Generator historiography anchor not found');
            const insertion = [
              anchor.trimEnd(),
              "const EDITORIAL_BLUEPRINT_FILES = [",
              "  'reports/historie-canonical-migration/industri-arbeid-question-blueprints.json',",
              "  'reports/historie-canonical-migration/velferd-question-blueprints.json',",
              "  'reports/historie-canonical-migration/byhistorie-question-blueprints.json'",
              "];",
              "const editorialBlueprintByEmneId = new Map(EDITORIAL_BLUEPRINT_FILES",
              "  .flatMap((blueprintFile) => list(readJson(blueprintFile)))",
              "  .map((row) => [row.emne_id, row]));",
              ''
            ].join('\n');
            source = source.replace(anchor, `${insertion}\n`);
          }

          if (!source.includes('const hookById = new Map();')) {
            const anchor = "const theoryByHookId = new Map(theories.map((item) => [item.source_hook_id, item]));\n";
            if (!source.includes(anchor)) throw new Error('Generator theory map anchor not found');
            const insertion = [
              anchor.trimEnd(),
              'const hookById = new Map();',
              'for (const category of list(fagkart.categories)) {',
              '  for (const hook of list(category.topic_hooks)) hookById.set(hook.id, hook);',
              '}',
              ''
            ].join('\n');
            source = source.replace(anchor, `${insertion}\n`);
          }

          const start = source.indexOf('function theoryPackage(category, emne) {');
          const end = source.indexOf('function claimParagraph(claim, emne) {', start);
          if (start < 0 || end < 0) throw new Error('Cannot locate theoryPackage boundaries');
          const replacement = [
            'function theoryPackage(category, emne) {',
            '  const semanticHookId = list(emne.primary_theory_hooks)[0];',
            '  if (!semanticHookId) throw new Error(`${category.id}/${emne.emne_id}: mangler canonical primary_theory_hooks`);',
            '  const editorialBlueprint = editorialBlueprintByEmneId.get(emne.emne_id);',
            '  const editorialHookId = editorialBlueprint?.primary_hook_id || semanticHookId;',
            '  const hook = hookById.get(editorialHookId);',
            '  if (!hook) throw new Error(`${category.id}/${emne.emne_id}: redaksjonell hook ${editorialHookId} finnes ikke i fagkartet`);',
            '  if (!list(hook.emne_ids).includes(emne.emne_id)) throw new Error(`${editorialHookId}: redaksjonell hook er ikke koblet til ${emne.emne_id}`);',
            '  const theory = theoryByHookId.get(editorialHookId);',
            '  if (!theory) throw new Error(`${editorialHookId}: mangler teoriobjekt`);',
            '  const theoryEvidence = evidenceByTheoryId.get(theory.theory_id);',
            "  if (!theoryEvidence || theoryEvidence.status !== 'evidence_ready') throw new Error(`${theory.theory_id}: mangler ferdig evidens`);",
            '  const claims = list(theoryEvidence.claim_ids).map((id) => claimById.get(id)).filter(Boolean);',
            '  if (!claims.length) throw new Error(`${theory.theory_id}: mangler claims`);',
            '  return { emneId: emne.emne_id, semanticHookId, editorialHookId, hook, theory, theoryEvidence, claims };',
            '}',
            ''
          ].join('\n');
          source = `${source.slice(0, start)}${replacement}\n${source.slice(end)}`;

          if (!source.includes('    editorialHookId: pack.editorialHookId,')) {
            const anchor = '    semanticHookId: pack.semanticHookId,\n    theoryId: pack.theory.theory_id,';
            if (!source.includes(anchor)) throw new Error('Materialized section semantic hook anchor not found');
            source = source.replace(anchor, '    semanticHookId: pack.semanticHookId,\n    editorialHookId: pack.editorialHookId,\n    theoryId: pack.theory.theory_id,');
          }
          fs.writeFileSync(file, source);
          NODE

      - name: Validate semantic contracts before materialization
        run: |
          set -euo pipefail
          node tools/audit-historie-canonical-emner.mjs --write-report
          node tools/audit-historie-semantic-hook-alignment.mjs

      - name: Materialize repaired History prose
        run: node tools/materialize-historie-editorial-chapters.mjs

      - name: Verify deterministic materialization
        run: node tools/materialize-historie-editorial-chapters.mjs --check

      - name: Validate repaired History completion gates
        run: |
          set -euo pipefail
          node tools/audit-historie-semantic-hook-alignment.mjs
          node tools/validate-historie-editorial-quality.mjs
          node tools/audit-historie-source-authority.mjs
          node tools/audit-historie-completion.mjs
          node scripts/audit-fagverk-historie.mjs

      - name: Commit permanent repair and materialized corpus
        shell: bash
        run: |
          set -euo pipefail
          git add \
            data/fag/historie/fagkart_historie_canonical_v4_5.json \
            tools/materialize-historie-editorial-chapters.mjs \
            tools/audit-historie-semantic-hook-alignment.mjs \
            reports/fagverk/historie-canonical-emne-identity-audit.json \
            reports/fagverk/historie-completion-gap-report.json \
            data/fagverk/historie \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Separate History semantic identity from editorial theory hooks'
          fi
          git fetch origin "${GITHUB_HEAD_REF}"
          git rebase "origin/${GITHUB_HEAD_REF}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
