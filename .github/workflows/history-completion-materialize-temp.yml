name: History completion materialize temporary
# Temporary repair/materialization workflow. Remove before History merge.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/materialize-historie-editorial-chapters.mjs'
      - 'tools/audit-historie-semantic-hook-alignment.mjs'
      - 'data/fag/historie/fagkart_historie_canonical_v4_5.json'
      - 'data/fag/historie/historiography_evidence_historie_v1.json'
      - '.github/workflows/history-completion-materialize-temp.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/history-completion-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact History branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Configure branch writer and reconcile latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reconcile canonical hook ownership
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const emnePath = 'data/fag/historie/emner_historie_canonical_v4_5.json';
          const mappingPath = 'data/fag/historie/emnemapping_historie_canonical_v4_5.json';
          const fagkartPath = 'data/fag/historie/fagkart_historie_canonical_v4_5.json';
          const emners = JSON.parse(fs.readFileSync(emnePath, 'utf8'));
          const mappings = JSON.parse(fs.readFileSync(mappingPath, 'utf8'));
          const fagkart = JSON.parse(fs.readFileSync(fagkartPath, 'utf8'));
          const list = (value) => Array.isArray(value) ? value : [];
          const mappingByEmne = new Map(mappings.map((row) => [row.emne_id, row]));
          const hookById = new Map();
          for (const category of list(fagkart.categories)) {
            for (const hook of list(category.topic_hooks)) hookById.set(hook.id, hook);
          }

          const additions = [];
          for (const emne of emners) {
            const declared = [...new Set([...list(emne.primary_theory_hooks), ...list(emne.secondary_theory_hooks)])];
            const mapped = new Set(list(mappingByEmne.get(emne.emne_id)?.mappings).map((row) => row.topic_hook));
            for (const hookId of declared) {
              if (!mapped.has(hookId)) throw new Error(`${emne.emne_id}: declared canonical hook ${hookId} mangler mapping`);
              const hook = hookById.get(hookId);
              if (!hook) throw new Error(`${emne.emne_id}: declared canonical hook ${hookId} finnes ikke i fagkart`);
              hook.emne_ids = list(hook.emne_ids);
              if (!hook.emne_ids.includes(emne.emne_id)) {
                hook.emne_ids.push(emne.emne_id);
                additions.push(`${hookId}->${emne.emne_id}`);
              }
            }
          }
          fs.writeFileSync(fagkartPath, `${JSON.stringify(fagkart, null, 2)}\n`);
          console.log(JSON.stringify({ canonical_hook_ownership_additions: additions.length, additions }, null, 2));
          NODE

      - name: Install permanent editorial-hook separation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const generatorPath = 'tools/materialize-historie-editorial-chapters.mjs';
          let generator = fs.readFileSync(generatorPath, 'utf8');

          if (!generator.includes('const EDITORIAL_BLUEPRINT_FILES = [')) {
            const anchor = "const historiographyDocument = readJson('data/fag/historie/historiography_evidence_historie_v1.json');\n";
            if (!generator.includes(anchor)) throw new Error('Generator historiography anchor not found');
            const block = [
              anchor.trimEnd(),
              "const EDITORIAL_BLUEPRINT_FILES = [",
              "  'reports/historie-canonical-migration/industri-arbeid-question-blueprints.json',",
              "  'reports/historie-canonical-migration/velferd-question-blueprints.json',",
              "  'reports/historie-canonical-migration/byhistorie-question-blueprints.json'",
              "];",
              "const editorialBlueprintByEmneId = new Map(EDITORIAL_BLUEPRINT_FILES",
              "  .flatMap((file) => list(readJson(file)))",
              "  .map((row) => [row.emne_id, row]));",
              ''
            ].join('\n');
            generator = generator.replace(anchor, `${block}\n`);
          }

          if (!generator.includes('const hookById = new Map();')) {
            const anchor = "const theoryByHookId = new Map(theories.map((item) => [item.source_hook_id, item]));\n";
            if (!generator.includes(anchor)) throw new Error('Generator theory map anchor not found');
            const block = [
              anchor.trimEnd(),
              'const hookById = new Map();',
              'for (const category of list(fagkart.categories)) {',
              '  for (const hook of list(category.topic_hooks)) hookById.set(hook.id, hook);',
              '}',
              ''
            ].join('\n');
            generator = generator.replace(anchor, `${block}\n`);
          }

          const theoryStart = generator.indexOf('function theoryPackage(category, emne) {');
          const theoryEnd = generator.indexOf('function claimParagraph(claim, emne) {', theoryStart);
          if (theoryStart < 0 || theoryEnd < 0) throw new Error('Cannot locate theoryPackage function boundaries');
          const newTheoryPackage = [
            'function theoryPackage(category, emne) {',
            '  const semanticHookId = list(emne.primary_theory_hooks)[0];',
            '  if (!semanticHookId) throw new Error(`${category.id}/${emne.emne_id}: mangler canonical primary_theory_hooks`);',
            '  const editorialBlueprint = editorialBlueprintByEmneId.get(emne.emne_id);',
            '  const editorialHookId = editorialBlueprint?.primary_hook_id || semanticHookId;',
            '  const hook = hookById.get(editorialHookId);',
            '  if (!hook) throw new Error(`${category.id}/${emne.emne_id}: redaksjonell hook ${editorialHookId} finnes ikke i fagkartet`);',
            '  if (!list(hook.emne_ids).includes(emne.emne_id)) throw new Error(`${editorialHookId}: redaksjonell hook er ikke koblet til ${emne.emne_id}`);',
            '  const theory = theoryByHookId.get(editorialHookId);',
            '  if (!theory) throw new Error(`${editorialHookId}: mangler teoriobjekt`);',
            '  const theoryEvidence = evidenceByTheoryId.get(theory.theory_id);',
            "  if (!theoryEvidence || theoryEvidence.status !== 'evidence_ready') throw new Error(`${theory.theory_id}: mangler ferdig evidens`);",
            '  const claims = list(theoryEvidence.claim_ids).map((id) => claimById.get(id)).filter(Boolean);',
            '  if (!claims.length) throw new Error(`${theory.theory_id}: mangler claims`);',
            '  return { emneId: emne.emne_id, semanticHookId, editorialHookId, hook, theory, theoryEvidence, claims };',
            '}',
            ''
          ].join('\n');
          generator = `${generator.slice(0, theoryStart)}${newTheoryPackage}\n${generator.slice(theoryEnd)}`;

          if (!generator.includes('    editorialHookId: pack.editorialHookId,')) {
            const anchor = '    semanticHookId: pack.semanticHookId,\n    theoryId: pack.theory.theory_id,';
            if (!generator.includes(anchor)) throw new Error('Section semantic hook anchor not found');
            generator = generator.replace(anchor, '    semanticHookId: pack.semanticHookId,\n    editorialHookId: pack.editorialHookId,\n    theoryId: pack.theory.theory_id,');
          }

          fs.writeFileSync(generatorPath, generator);
          NODE

      - name: Write semantic hook diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/fagverk
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const readJson = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const list = (value) => Array.isArray(value) ? value : [];
          const unique = (values) => [...new Set(values.filter(Boolean))];
          const blueprintFiles = [
            'reports/historie-canonical-migration/industri-arbeid-question-blueprints.json',
            'reports/historie-canonical-migration/velferd-question-blueprints.json',
            'reports/historie-canonical-migration/byhistorie-question-blueprints.json'
          ];
          const emners = list(readJson('data/fag/historie/emner_historie_canonical_v4_5.json'));
          const mappings = list(readJson('data/fag/historie/emnemapping_historie_canonical_v4_5.json'));
          const fagkart = readJson('data/fag/historie/fagkart_historie_canonical_v4_5.json');
          const theories = list(readJson('data/fag/historie/theory_objects_historie_canonical_v5_5.json'));
          const hookById = new Map();
          for (const category of list(fagkart.categories)) {
            for (const hook of list(category.topic_hooks)) hookById.set(hook.id, hook);
          }
          const theoryByHookId = new Map(theories.map((theory) => [theory.source_hook_id, theory]));
          const mappingByEmne = new Map(mappings.map((mapping) => [mapping.emne_id, mapping]));
          const emneById = new Map(emners.map((emne) => [emne.emne_id, emne]));

          const canonical = [];
          const primaryKeys = [];
          for (const emne of emners) {
            const primary = list(emne.primary_theory_hooks);
            if (primary.length !== 1) {
              canonical.push({ emne_id: emne.emne_id, role: 'primary', hook_id: null, reasons: [`primary_hook_count_${primary.length}`] });
              continue;
            }
            const primaryHookId = primary[0];
            primaryKeys.push(primaryHookId);
            const mapped = new Set(list(mappingByEmne.get(emne.emne_id)?.mappings).map((row) => row.topic_hook));
            const inspect = (hookId, role) => {
              const hook = hookById.get(hookId);
              const reasons = [];
              if (!hook) reasons.push('missing_hook');
              if (hook && !list(hook.emne_ids).includes(emne.emne_id)) reasons.push('hook_missing_emne');
              if (!theoryByHookId.has(hookId)) reasons.push('missing_theory');
              if (!mapped.has(hookId)) reasons.push('missing_mapping');
              if (role === 'secondary' && hookId === primaryHookId) reasons.push('same_as_primary');
              if (reasons.length) canonical.push({ emne_id: emne.emne_id, role, hook_id: hookId, reasons });
            };
            inspect(primaryHookId, 'primary');
            for (const secondary of list(emne.secondary_theory_hooks)) inspect(secondary, 'secondary');
          }

          const curated = [];
          const blueprintRows = blueprintFiles.flatMap((file) => list(readJson(file)).map((row) => ({ ...row, blueprint_file: file })));
          for (const blueprint of blueprintRows) {
            if (!emneById.has(blueprint.emne_id)) {
              curated.push({ emne_id: blueprint.emne_id, editorial_hook_id: blueprint.primary_hook_id || null, blueprint_file: blueprint.blueprint_file, reasons: ['unknown_emne'] });
              continue;
            }
            for (const hookId of unique([blueprint.primary_hook_id, blueprint.secondary_hook_id])) {
              const hook = hookById.get(hookId);
              const reasons = [];
              if (!hook) reasons.push('missing_hook');
              if (hook && !list(hook.emne_ids).includes(blueprint.emne_id)) reasons.push('hook_missing_emne');
              if (!theoryByHookId.has(hookId)) reasons.push('missing_theory');
              if (reasons.length) curated.push({ emne_id: blueprint.emne_id, editorial_hook_id: hookId, blueprint_file: blueprint.blueprint_file, reasons });
            }
          }

          const report = {
            schema_version: 'history_semantic_hook_diagnostics_v1',
            canonical_emners: emners.length,
            unique_primary_semantic_keys: unique(primaryKeys).length,
            canonical_mismatches: canonical,
            curated_blueprint_rows: blueprintRows.length,
            curated_editorial_mismatches: curated,
            total_mismatches: canonical.length + curated.length
          };
          fs.writeFileSync('reports/fagverk/history-semantic-hook-diagnostics.json', `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Validate canonical and semantic contracts
        id: semantic_validation
        continue-on-error: true
        run: |
          set -euo pipefail
          node tools/audit-historie-canonical-emner.mjs --write-report
          node tools/audit-historie-semantic-hook-alignment.mjs

      - name: Persist semantic diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add reports/fagverk/history-semantic-hook-diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record History semantic hook diagnostics'
            git fetch origin "${GITHUB_HEAD_REF}"
            git rebase "origin/${GITHUB_HEAD_REF}"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Stop on semantic contract mismatch
        if: steps.semantic_validation.outcome != 'success'
        run: |
          echo 'History semantic contract remains red; inspect reports/fagverk/history-semantic-hook-diagnostics.json'
          exit 1

      - name: Materialize repaired History prose
        if: steps.semantic_validation.outcome == 'success'
        run: node tools/materialize-historie-editorial-chapters.mjs

      - name: Verify deterministic materialization
        if: steps.semantic_validation.outcome == 'success'
        run: node tools/materialize-historie-editorial-chapters.mjs --check

      - name: Validate repaired History completion gates
        if: steps.semantic_validation.outcome == 'success'
        run: |
          set -euo pipefail
          node tools/audit-historie-semantic-hook-alignment.mjs
          node tools/validate-historie-editorial-quality.mjs
          node tools/audit-historie-source-authority.mjs
          node tools/audit-historie-completion.mjs
          node scripts/audit-fagverk-historie.mjs

      - name: Commit permanent hook policy and materialized History corpus
        if: steps.semantic_validation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git add \
            data/fag/historie/fagkart_historie_canonical_v4_5.json \
            tools/materialize-historie-editorial-chapters.mjs \
            tools/audit-historie-semantic-hook-alignment.mjs \
            reports/fagverk/historie-canonical-emne-identity-audit.json \
            reports/fagverk/historie-completion-gap-report.json \
            data/fagverk/historie \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Separate History semantic identity from editorial theory hooks'
          fi
          git fetch origin "${GITHUB_HEAD_REF}"
          git rebase "origin/${GITHUB_HEAD_REF}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
