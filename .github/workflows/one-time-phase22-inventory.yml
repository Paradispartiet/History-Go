name: One-time phase 22 inventory update

on:
  pull_request_target:
    types: [synchronize]
    paths:
      - .github/phase22-inventory-trigger.txt

permissions:
  contents: write
  pull-requests: read

jobs:
  update-inventory:
    if: github.event.pull_request.head.ref == 'agent/documentation-governance-phase-22-final' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-governance-phase-22-final
          fetch-depth: 0

      - name: Stop after trigger removal
        id: trigger
        shell: bash
        run: |
          if [ -f .github/phase22-inventory-trigger.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.trigger.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.trigger.outputs.present == 'true'
        run: npm ci --no-audit --no-fund

      - name: Regenerate and validate inventory
        if: steps.trigger.outputs.present == 'true'
        run: |
          npm run build:scripts
          node dist/scripts/check-documentation-governance.mjs

      - name: Reset generated build output
        if: steps.trigger.outputs.present == 'true'
        run: |
          git restore --source=HEAD --worktree --staged -- dist 2>/dev/null || true
          git clean -fd -- dist

      - name: Commit inventory and remove trigger
        if: steps.trigger.outputs.present == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/phase22-inventory-trigger.txt
          git add reports/documentation-governance/inventory.json .github/phase22-inventory-trigger.txt
          git commit -m "Regenerer documentation-governance-inventaret"
          git push origin HEAD:agent/documentation-governance-phase-22-final
