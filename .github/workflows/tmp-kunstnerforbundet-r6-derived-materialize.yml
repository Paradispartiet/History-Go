name: TEMP Kunstnerforbundet R6 derived materialization

on:
  push:
    branches:
      - agent/kunstnerforbundet-place-production-r2-20260913
    paths:
      - .github/workflows/tmp-kunstnerforbundet-r6-derived-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/kunstnerforbundet-place-production-r2-20260913
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize Fagverk registry and release
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'data/fagverk/fagverk_registry.json';
          const registry = JSON.parse(fs.readFileSync(path, 'utf8'));
          registry.placeLinks ||= {};
          const expected = {
            sourceFile: 'places/kunst/oslo/places_kunst/kunstnerforbundet.json',
            field: 'fagverk',
            schema: 'history_go_place_fagverk_v2',
            level: 'standard',
            status: 'curated'
          };
          const current = registry.placeLinks.kunstnerforbundet;
          if (current && JSON.stringify(current) !== JSON.stringify(expected)) {
            console.error('Existing Kunstnerforbundet Fagverk registry row conflicts with expected canonical row');
            console.error(current);
            process.exit(1);
          }
          registry.placeLinks.kunstnerforbundet = expected;
          fs.writeFileSync(path, `${JSON.stringify(registry, null, 2)}\n`);
          NODE
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check

      - name: Materialize runtime and epoch index
        run: |
          set -euo pipefail
          npm run place-open:build
          npm run place-open:check
          npm run epoker:places:build
          npm run epoker:places:check
          node tools/audit-people-profile-canonical.mjs --require-claims

      - name: Enforce derived-output allowlist
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r line; do
            path="${line:3}"
            case "$path" in
              data/fagverk/fagverk_registry.json|data/fagverk/fagverk_release.json|data/epoker/epoke-place-index.json|data/runtime/place-open/*|data/runtime/people-all/*|.github/workflows/tmp-kunstnerforbundet-r6-derived-materialize.yml)
                ;;
              *)
                echo "UNEXPECTED_GENERATED_PATH $path"
                bad=1
                ;;
            esac
          done < <(git status --porcelain)
          git status --short
          test "$bad" -eq 0

      - name: Commit derived outputs and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-kunstnerforbundet-r6-derived-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fagverk/fagverk_registry.json data/fagverk/fagverk_release.json data/epoker/epoke-place-index.json data/runtime/place-open data/runtime/people-all .github/workflows/tmp-kunstnerforbundet-r6-derived-materialize.yml
          git diff --cached --name-only
          git commit -m 'Materialize Kunstnerforbundet R6 derived outputs'
          git push origin HEAD:agent/kunstnerforbundet-place-production-r2-20260913
