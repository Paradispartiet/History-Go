name: Oslo six historical photo framing and parity once
on:
  push:
    branches:
      - research/oslo-sentrum-v1-six-next-20261027
    paths:
      - '.github/workflows/oslo-next-six-historical-media-frames-once.yml'
permissions:
  contents: write
concurrency:
  group: oslo-six-historical-photo-framing
  cancel-in-progress: false
jobs:
  frame:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-v1-six-next-20261027
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Preserve source images and normalize 3 layouts for each of 2 historic photos
        run: node scripts/normalize-oslo-next-six-historical-image-aspects.mjs
      - name: Synchronize Place-open projections with image metadata
        run: |
          npm run place-open:build
          npm run place-open:check
          npm run places:index:check
      - name: Verify candidate-answer and image SHA parity after framing
        run: node scripts/verify-oslo-next-six-editorial-candidates.mjs
      - name: Save frames and drop one-time job
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oslo-next-six-historical-media-frames-once.yml
          git add \
            bilder/places/oslo-sentrum-next-six-20261027/palehaven_paleet_hero.webp \
            bilder/places/oslo-sentrum-next-six-20261027/palehaven_paleet_portrait.webp \
            bilder/kort/places/palehaven_paleet.webp \
            bilder/places/oslo-sentrum-next-six-20261027/mustadgarden_kongens_gate_3_hero.webp \
            bilder/places/oslo-sentrum-next-six-20261027/mustadgarden_kongens_gate_3_portrait.webp \
            bilder/kort/places/mustadgarden_kongens_gate_3.webp \
            data/places/historie/oslo/places_historie_oslo_oppdag_kvadraturen_batch_04/palehaven_paleet.json \
            data/places/historie/oslo/places_historie_oslo_oppdag_kvadraturen_art_sites_batch_01/mustadgarden_kongens_gate_3.json \
            data/runtime/place-open \
            reports/place-production/oslo-sentrum-next-six-media-provenance-20261027.json
          git diff --cached --check
          git commit -m 'media(oslo-v1): improve historic photo proportions in six picture frames'
          git push origin HEAD:research/oslo-sentrum-v1-six-next-20261027
