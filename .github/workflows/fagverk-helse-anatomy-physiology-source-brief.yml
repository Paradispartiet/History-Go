name: Fagverk Helse anatomy physiology source brief

on:
  pull_request:
    paths:
      - 'data/fag/helse/**'
      - 'data/fag/fag_manifest.json'
      - 'data/fagverk/helse/**'
      - 'data/fagverk/fagverk_registry.json'
      - 'data/fagverk/fagverk_release.json'
      - 'data/fagverk/subject_inventory.json'
      - 'data/fagverk/subject_status.json'
      - 'reports/fagverk/helse-anatomy-physiology-source-brief-v1-audit.json'
      - 'scripts/*helse-*'
      - 'tests/helse-*.test.mjs'
      - '.github/workflows/fagverk-helse-anatomy-physiology-source-brief.yml'
  push:
    branches: [main]
    paths:
      - 'data/fag/helse/**'
      - 'data/fagverk/helse/**'
      - 'data/fagverk/fagverk_registry.json'
      - 'data/fagverk/subject_status.json'
      - 'scripts/*helse-*'
      - 'tests/helse-*.test.mjs'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Validate historical or cumulative Health state
        shell: bash
        run: |
          if [[ -f data/fagverk/helse/sykdom-og-patofysiologi-mekanisme-skade-og-systemsvikt.json ]]; then
            node scripts/audit-helse-cumulative-progress-v1.mjs
            node --test tests/helse-cumulative-progress-v1.test.mjs
          else
            node scripts/brief-helse-anatomy-physiology-sources-v1.mjs
            node scripts/brief-helse-medical-ethics-evidence-sources-v1.mjs
            node scripts/materialize-helse-medical-ethics-evidence-fulltext-v1.mjs
            node scripts/audit-helse-medical-ethics-evidence-fulltext-v1.mjs
            node --test tests/helse-anatomy-physiology-source-brief-v1.test.mjs tests/helse-medical-ethics-evidence-source-brief-v1.test.mjs tests/helse-medical-ethics-evidence-fulltext-v1.test.mjs
          fi
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/fagverk-subject-inventory.test.mjs tests/fagverk-release-manifest.test.mjs
