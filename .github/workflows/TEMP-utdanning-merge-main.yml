name: TEMP Utdanning merge main
on:
  push:
    branches:
      - agent/utdanning-pedagogikk-laeringsteori-fulltext-v1
permissions:
  contents: write
concurrency:
  group: temp-utdanning-merge-main
  cancel-in-progress: false
jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge latest main and regenerate Utdanning projections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            printf 'Conflicts: %s\n' "${conflicts[*]}"
            expected=("data/fag/fag_manifest.json" "data/fagverk/fagverk_release.json")
            if [ "${conflicts[*]}" != "${expected[*]}" ]; then
              echo "Unexpected merge conflicts"
              exit 1
            fi
            git checkout --theirs -- data/fag/fag_manifest.json data/fagverk/fagverk_release.json
            git add data/fag/fag_manifest.json data/fagverk/fagverk_release.json
            git commit --no-edit
          fi
          node scripts/materialize-utdanning-pedagogy-learning-theory-fulltext-v1.mjs
          node scripts/audit-utdanning-pedagogy-learning-theory-fulltext-v1.mjs --write-report
          node scripts/audit-fagverk-subject-inventory.mjs --write-report --no-check-report
          node scripts/audit-fagverk-general-engine.mjs --write-report --no-check-report
          node scripts/audit-fagverk-theory-quality.mjs --write-report --no-check-report
          node scripts/audit-fagverk-theory-integrity.mjs --write-report --no-check-report
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/run-utdanning-domain-ci-v1.mjs
          git add data/fag/fag_manifest.json data/fag/utdanning data/fagverk reports/fagverk
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Utdanning 1/14 on latest main"
          fi
          git push origin HEAD:${GITHUB_REF_NAME}
