name: TEMP Utdanning materialize current main
on:
  push:
    branches:
      - agent/utdanning-pedagogikk-laeringsteori-fulltext-v1
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify current main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
      - name: Materialize Utdanning 1 of 14
        run: node scripts/materialize-utdanning-pedagogy-learning-theory-fulltext-v1.mjs
      - name: Audit Utdanning fulltext
        run: node scripts/audit-utdanning-pedagogy-learning-theory-fulltext-v1.mjs --write-report
      - name: Audit Fagverk subject inventory
        run: node scripts/audit-fagverk-subject-inventory.mjs --write-report --no-check-report
      - name: Audit Fagverk general engine
        run: node scripts/audit-fagverk-general-engine.mjs --write-report --no-check-report
      - name: Audit Fagverk theory quality
        run: node scripts/audit-fagverk-theory-quality.mjs --write-report --no-check-report
      - name: Audit Fagverk theory integrity
        run: node scripts/audit-fagverk-theory-integrity.mjs --write-report --no-check-report
      - name: Build Fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Commit regenerated projections locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fag/fag_manifest.json data/fag/utdanning data/fagverk reports/fagverk
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Utdanning 1/14 on current main"
          fi
      - name: Validate Utdanning registry preflight
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const registry=JSON.parse(fs.readFileSync('.github/ci/fagverk-utdanning-domain-registry-v1.json','utf8'));
          const pensum=JSON.parse(fs.readFileSync(registry.canonicalPensum,'utf8'));
          if (registry.version!==1 || registry.subject!=='utdanning' || registry.totalDomains!==14) throw new Error('registry header');
          const domains=[...registry.domains].sort((a,b)=>a.ordinal-b.ordinal);
          if(domains.length!==14) throw new Error(`domain count ${domains.length}`);
          const byId=new Map(pensum.domains.map(row=>[row.domain_id,row]));
          for(let i=0;i<domains.length;i++) {
            if(domains[i].ordinal!==i+1) throw new Error(`ordinal ${i+1}`);
            if(pensum.domain_order[i]!==domains[i].domainId || !byId.has(domains[i].domainId)) throw new Error(`order ${i+1}`);
          }
          const materialized=domains.filter(d=>byId.get(d.domainId)?.status==='materialized').map(d=>d.ordinal);
          if(materialized.join(',')!=='1') throw new Error(`expected materialized 1, got ${materialized.join(',')}`);
          for(const d of domains.slice(1)) if(byId.get(d.domainId)?.status!=='planned') throw new Error(`expected planned ${d.ordinal}: ${byId.get(d.domainId)?.status}`);
          for(const p of [domains[0].fulltextMaterializer,domains[0].fulltextAudit,domains[0].fulltextTest,domains[1].sourceBrief,domains[1].sourceBriefScript,domains[1].sourceBriefTest]) {
            if(!p || !fs.existsSync(p)) throw new Error(`missing ${p}`);
          }
          console.log('Utdanning registry preflight PASS: 1/14 materialized, Didaktikk source-first present');
          NODE
      - name: Rebuild Didaktikk source brief deterministically
        run: node scripts/brief-utdanning-didactics-sources-v1.mjs
      - name: Re-run latest fulltext materializer
        run: node scripts/materialize-utdanning-pedagogy-learning-theory-fulltext-v1.mjs
      - name: Re-run latest fulltext audit
        run: node scripts/audit-utdanning-pedagogy-learning-theory-fulltext-v1.mjs
      - name: Shared subject inventory check
        run: node scripts/audit-fagverk-subject-inventory.mjs
      - name: Shared general engine check
        run: node scripts/audit-fagverk-general-engine.mjs
      - name: Shared theory quality check
        run: node scripts/audit-fagverk-theory-quality.mjs
      - name: Shared theory integrity check
        run: node scripts/audit-fagverk-theory-integrity.mjs
      - name: Release determinism check
        run: node scripts/build-fagverk-release-manifest.mjs --check
      - name: Utdanning active shared tests
        run: node --test tests/utdanning-didactics-source-brief-v1.test.mjs tests/utdanning-pedagogy-learning-theory-fulltext-v1.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-general-engine.test.mjs tests/fagverk-release-manifest.test.mjs
      - name: Verify deterministic Utdanning Fagverk outputs
        run: git diff --exit-code -- data/fag/utdanning data/fagverk/utdanning data/fagverk/fagverk_registry.json data/fagverk/subject_status.json data/fagverk/fagverk_release.json reports/fagverk
      - name: Run canonical Utdanning registry wrapper
        run: node scripts/run-utdanning-domain-ci-v1.mjs
      - name: Push materialized head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:${GITHUB_REF_NAME}
