# Trigger final run with canonical quiz context projection
name: Tullin fail-closed place production

on:
  push:
    branches:
      - work/tullin-completion-20260830
    paths:
      - 'tools/finalize-tullin-completion.mjs'
      - 'tools/tullin-fetch-retry.mjs'
      - '.github/workflows/tullin-place-production.yml'

permissions:
  contents: write

concurrency:
  group: tullin-place-production
  cancel-in-progress: true

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tullin-completion-20260830
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Merge current main without discarding branch work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Normalize Tullin quiz context projection
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          path = Path('tools/finalize-tullin-completion.mjs')
          text = path.read_text()
          old = 'quiz.production_context = { ...builtContext, existing_quiz_audit: brief.existing_quiz_audit, profile_decision: brief.profile_decision, held_back_candidates: brief.held_back_candidates, theory_start_phase: "final", method_start_phase: "final" };'
          new = textwrap.dedent('''\
          quiz.production_context = {
            manifest_category: "by",
            profile: "rich_6x7",
            standard_version: "3.3",
            source_brief: briefFile,
            context_artifact: contextFile,
            resolved_files: {
              pensum: "data/fag/by/pensum_by.json",
              emner: "data/fag/by/emner_by.json",
              fagkart: "data/fag/by/fagkart_by.json",
              methods: "data/fag/by/methods_by.json",
              supersetQuizMal: "data/fag/by/supersetQUIZMAL_by.json",
              quizStandard: "data/quiz/regler/QUIZ_PRODUCTION_CANONICAL.md",
              quizQuestionSchema: "data/quiz/regler/QUIZ_QUESTION_SCHEMA_V2.json"
            },
            required_inputs_loaded: ["pensum", "emner", "fagkart", "methods", "supersetQuizMal", "quizStandard", "quizQuestionSchema"],
            pensum_module_ids: brief.selected_curriculum.module_ids,
            emne_ids: brief.selected_curriculum.emne_ids,
            topic_hook_ids: brief.selected_curriculum.topic_hook_ids,
            method_ids: brief.selected_curriculum.method_ids,
            thinker_ids: brief.selected_curriculum.thinker_ids,
            works: brief.selected_curriculum.works,
            source_review_status: brief.status,
            theory_start_phase: "final",
            method_start_phase: "final",
            existing_quiz_audit: brief.existing_quiz_audit,
            profile_decision: brief.profile_decision,
            held_back_candidates: brief.held_back_candidates
          };''')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one legacy quiz context assignment, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check tools/finalize-tullin-completion.mjs

      - name: Materialize canonical Tullin package
        run: |
          rm -f reports/place-production/tullin-producer-error.log
          set +e
          node --import ./tools/tullin-fetch-retry.mjs tools/finalize-tullin-completion.mjs > /tmp/tullin-producer.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/tullin-producer.log
          if [ "$STATUS" -ne 0 ]; then
            mkdir -p reports/place-production
            cp /tmp/tullin-producer.log reports/place-production/tullin-producer-error.log
            git add -A
            git commit -m "Capture Tullin producer failure"
            git push origin HEAD:work/tullin-completion-20260830
            exit "$STATUS"
          fi

      - name: Record current READ-FIRST rule preflight
        run: |
          node scripts/place-production-rule-preflight.mjs record \
            --workcard reports/place-production/tullin-workcard-current.json \
            --place-id tullin \
            --category by

      - name: Rebuild place and epoch derived data
        run: |
          npm run places:index:build
          npm run place-open:build
          npm run epoker:places:build

      - name: Rebuild People projections
        run: |
          npm run civication:history-people:build
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts

      - name: Rebuild canonical Knowledge
        run: npm run knowledge:canonical:write

      - name: Rebuild Fagverk release after Knowledge
        run: node scripts/build-fagverk-release-manifest.mjs

      - name: Checkpoint materialized Tullin package
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No Tullin checkpoint changes"
          else
            git commit -m "Checkpoint Tullin completion package"
            git push origin HEAD:work/tullin-completion-20260830
          fi

      - name: Validate Tullin target
        run: node --test tests/tullin-completion.test.mjs

      - name: Validate place and epoch projections
        run: |
          npm run places:index:check
          npm run place-open:check
          npm run epoker:places:check

      - name: Audit quiz manifest v2
        run: npm run audit:quiz-manifest:v2

      - name: Audit quiz production context
        run: npm run audit:quiz-production-context

      - name: Audit quiz progression
        run: npm run audit:quiz-progression

      - name: Audit quiz theory binding
        run: npm run audit:quiz-theory-binding

      - name: Check canonical Knowledge
        run: npm run knowledge:canonical:check

      - name: Check Fagverk release manifest
        run: node scripts/build-fagverk-release-manifest.mjs --check

      - name: Validate content integration
        run: |
          npm run check:stories
          npm run leksikon:ids:check
          npm run audit:people-of-places
          npm run civication:history-people:check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check

      - name: Validate READ-FIRST against current main merge base
        run: |
          BASE=$(git merge-base HEAD origin/main)
          node scripts/place-production-rule-preflight.mjs check --base "$BASE"

      - name: Validate repository-local diff
        run: |
          git diff --check
          git status --short

      - name: Commit permanent package and remove temporary producer
        run: |
          rm -f reports/place-production/tullin-producer-error.log
          rm -f tools/tullin-fetch-retry.mjs
          rm .github/workflows/tullin-place-production.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No final cleanup changes were produced"
            exit 1
          fi
          git commit -m "Complete Tullin place production"
          git push origin HEAD:work/tullin-completion-20260830
