name: Jaeger Oslo – Wikimedia media and Knowledge one shot

on:
  pull_request:
    paths:
      - '.github/workflows/jaeger-oslo-v1-one-shot.yml'

permissions:
  contents: write

concurrency:
  group: jaeger-oslo-one-shot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/jaeger-oslo-v1-20261102
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Produce licensed Grensen 9 photographic WebPs
        run: node scripts/build-jaeger-oslo-media-20261102.mjs
      - name: Generate canonical Knowledge IDs and release
        run: |
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --write
          node scripts/build-fagverk-release-manifest.mjs
      - name: Verify data
        run: |
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --check
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/jaeger-oslo-v1-contract-20261102.test.mjs
      - name: Commit output and remove temporary writer
        env:
          REF: content/jaeger-oslo-v1-20261102
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u data/places/subkultur/oslo/places_subkultur/jaeger_oslo.json data/runtime/place-open/jaeger_oslo.json data/quiz/musikk/jaeger_oslo_sets_merged.json data/knowledge reports/knowledge-id-backfill.json data/fagverk/fagverk_release.json
          git add bilder/places/candidates/oslo-v1-20261102/jaeger_oslo_hero.webp bilder/places/candidates/oslo-v1-20261102/jaeger_oslo_portrait.webp bilder/places/candidates/oslo-v1-20261102/jaeger_oslo_card.webp
          git rm .github/workflows/jaeger-oslo-v1-one-shot.yml
          git diff --cached --check
          git commit -m 'Jaeger Oslo: licensed photo WebPs, canonical Knowledge and Fagverk'
          git push origin "HEAD:$REF"
