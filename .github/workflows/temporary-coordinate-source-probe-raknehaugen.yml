name: Temporary Raknehaugen geometry source probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/akershus-raknehaugen-production
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize Raknehaugen geometry sources
        shell: bash
        run: |
          set -euo pipefail
          OUT='reports/akershus-coordinate-raknehaugen-source-probe'
          mkdir -p "$OUT"
          UA='History-Go coordinate research (Paradispartiet/History-Go)'
          RA='https://api.ra.no/LokaliteterEnkeltminnerOgSikringssoner'

          curl --fail --silent --show-error --location --user-agent "$UA" \
            'https://api.openstreetmap.org/api/0.6/way/258836263/full' \
            | tee "$OUT/osm-way-258836263-full.xml" >/dev/null

          curl --fail --silent --show-error --location --user-agent "$UA" \
            'https://api.openstreetmap.org/api/0.6/map?bbox=11.131,60.143,11.142,60.151' \
            | tee "$OUT/osm-raknehaugen-bbox.xml" >/dev/null

          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'q=Raknehaugen, Ullensaker, Norge' \
            --data 'format=jsonv2' --data 'polygon_geojson=1' --data 'extratags=1' \
            --data 'namedetails=1' --data 'limit=20' \
            | tee "$OUT/nominatim-raknehaugen.json" >/dev/null

          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get "$RA/collections/lokaliteter/items" \
            --data-urlencode 'navn=Raknehaugen' --data 'limit=1000' --data 'f=json' \
            | tee "$OUT/riksantikvaren-lokaliteter-navn-raknehaugen.json" >/dev/null

          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get "$RA/collections/enkeltminner/items" \
            --data-urlencode 'navn=Raknehaugen' --data 'limit=1000' --data 'f=json' \
            | tee "$OUT/riksantikvaren-enkeltminner-navn-raknehaugen.json" >/dev/null

          python - <<'PY' | tee "$OUT/source-summary.txt" >/dev/null
          import json
          import math
          import unicodedata
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path('reports/akershus-coordinate-raknehaugen-source-probe')
          legacy = (60.1469, 11.1366)

          def distance_m(a, b):
              lat1, lon1 = map(math.radians, a)
              lat2, lon2 = map(math.radians, b)
              dlat = lat2 - lat1
              dlon = lon2 - lon1
              h = math.sin(dlat / 2) ** 2 + math.cos(lat1) * math.cos(lat2) * math.sin(dlon / 2) ** 2
              return 6371000 * 2 * math.asin(math.sqrt(h))

          def ring_centroid(points):
              if len(points) < 4:
                  return None
              pts = list(points)
              if pts[0] != pts[-1]:
                  pts.append(pts[0])
              twice_area = cx = cy = 0.0
              for (x1, y1), (x2, y2) in zip(pts, pts[1:]):
                  cross = x1 * y2 - x2 * y1
                  twice_area += cross
                  cx += (x1 + x2) * cross
                  cy += (y1 + y2) * cross
              if abs(twice_area) < 1e-15:
                  return None
              return cx / (3 * twice_area), cy / (3 * twice_area)

          def flatten_pairs(coords):
              if not isinstance(coords, list):
                  return []
              if len(coords) >= 2 and all(isinstance(v, (int, float)) for v in coords[:2]):
                  return [(float(coords[0]), float(coords[1]))]
              result = []
              for item in coords:
                  result.extend(flatten_pairs(item))
              return result

          def feature_center(feature):
              props = feature.get('properties') or {}
              center = props.get('senterpunkt')
              if isinstance(center, dict) and center.get('type') == 'Point':
                  coords = center.get('coordinates') or []
                  if len(coords) >= 2:
                      return (float(coords[1]), float(coords[0]), 'official_senterpunkt')
              geometry = feature.get('geometry') or {}
              kind = geometry.get('type')
              coords = geometry.get('coordinates')
              if kind == 'Point' and coords:
                  return (float(coords[1]), float(coords[0]), 'geometry_point')
              pairs = flatten_pairs(coords)
              if not pairs:
                  return None
              if kind == 'Polygon' and coords and coords[0]:
                  centroid = ring_centroid([(float(p[0]), float(p[1])) for p in coords[0]])
                  if centroid:
                      return (centroid[1], centroid[0], 'polygon_centroid')
              if kind == 'MultiPolygon' and coords and coords[0] and coords[0][0]:
                  centroid = ring_centroid([(float(p[0]), float(p[1])) for p in coords[0][0]])
                  if centroid:
                      return (centroid[1], centroid[0], 'multipolygon_first_centroid')
              lon = sum(p[0] for p in pairs) / len(pairs)
              lat = sum(p[1] for p in pairs) / len(pairs)
              return (lat, lon, 'vertex_mean')

          root = ET.parse(out / 'osm-way-258836263-full.xml').getroot()
          nodes = {
              node.attrib['id']: (float(node.attrib['lat']), float(node.attrib['lon']))
              for node in root.findall('node')
          }
          way = next((item for item in root.findall('way') if item.attrib.get('id') == '258836263'), None)
          if way is None:
              raise SystemExit('OSM way 258836263 missing')
          refs = [nd.attrib['ref'] for nd in way.findall('nd')]
          points_latlon = [nodes[ref] for ref in refs]
          centroid_xy = ring_centroid([(lon, lat) for lat, lon in points_latlon])
          if not centroid_xy:
              raise SystemExit('Could not calculate OSM polygon centroid')
          osm_center = (centroid_xy[1], centroid_xy[0])
          vertex_distances = [distance_m(osm_center, point) for point in points_latlon]
          tags = {tag.attrib['k']: tag.attrib['v'] for tag in way.findall('tag')}
          print('OSM_WAY ' + json.dumps({
              'way_id': '258836263', 'lat': osm_center[0], 'lon': osm_center[1],
              'node_count': len(points_latlon),
              'distance_from_legacy_m': round(distance_m(legacy, osm_center), 1),
              'max_vertex_distance_m': round(max(vertex_distances), 1),
              'tags': tags,
          }, ensure_ascii=False, sort_keys=True))

          nominatim = json.loads((out / 'nominatim-raknehaugen.json').read_text())
          print(f'NOMINATIM_COUNT={len(nominatim)}')
          for row in nominatim:
              point = (float(row['lat']), float(row['lon']))
              print('NOMINATIM ' + json.dumps({
                  'name': row.get('name'), 'display_name': row.get('display_name'),
                  'osm_type': row.get('osm_type'), 'osm_id': row.get('osm_id'),
                  'lat': point[0], 'lon': point[1],
                  'distance_from_legacy_m': round(distance_m(legacy, point), 1),
                  'distance_to_osm_centroid_m': round(distance_m(osm_center, point), 1),
                  'extratags': row.get('extratags', {}),
              }, ensure_ascii=False, sort_keys=True))

          exact_localities = []
          for collection in ('lokaliteter', 'enkeltminner'):
              data = json.loads((out / f'riksantikvaren-{collection}-navn-raknehaugen.json').read_text())
              print(f'RA_{collection.upper()} numberMatched={data.get("numberMatched")} numberReturned={data.get("numberReturned")}')
              for feature in data.get('features', []):
                  props = feature.get('properties') or {}
                  center = feature_center(feature)
                  row = {
                      'collection': collection,
                      'feature_id': feature.get('id'),
                      'geometry_type': (feature.get('geometry') or {}).get('type'),
                      'properties': props,
                  }
                  if center:
                      lat, lon, method = center
                      row.update({
                          'lat': lat, 'lon': lon, 'point_method': method,
                          'distance_from_legacy_m': round(distance_m(legacy, (lat, lon)), 1),
                          'distance_to_osm_centroid_m': round(distance_m(osm_center, (lat, lon)), 1),
                      })
                  print('RA_MATCH ' + json.dumps(row, ensure_ascii=False, sort_keys=True))
                  if collection == 'lokaliteter' and str(props.get('kommune')) == '3209' and str(props.get('navn', '')).casefold() == 'raknehaugen':
                      exact_localities.append(feature)

          if len(exact_localities) == 1:
              exact = exact_localities[0]
              (out / 'riksantikvaren-raknehaugen-exact.json').write_text(json.dumps(exact, ensure_ascii=False, indent=2) + '\n')
              props = exact.get('properties') or {}
              center = feature_center(exact)
              pairs = flatten_pairs((exact.get('geometry') or {}).get('coordinates'))
              distances = []
              if center:
                  lat, lon, _ = center
                  distances = [distance_m((lat, lon), (p[1], p[0])) for p in pairs]
              print('RA_EXACT ' + json.dumps({
                  'feature_id': exact.get('id'), 'properties': props,
                  'geometry_type': (exact.get('geometry') or {}).get('type'),
                  'center': center,
                  'geometry_vertex_count': len(pairs),
                  'max_vertex_distance_m': round(max(distances), 1) if distances else None,
              }, ensure_ascii=False, sort_keys=True))
          else:
              print(f'RA_EXACT_COUNT={len(exact_localities)}')

          bbox_root = ET.parse(out / 'osm-raknehaugen-bbox.xml').getroot()
          bbox_nodes = {
              node.attrib['id']: (float(node.attrib['lat']), float(node.attrib['lon']))
              for node in bbox_root.findall('node')
          }
          relevant = []
          for node in bbox_root.findall('node'):
              node_tags = {tag.attrib['k']: tag.attrib['v'] for tag in node.findall('tag')}
              if not node_tags:
                  continue
              if node_tags.get('name') or any(key in node_tags for key in ('historic', 'tourism', 'information', 'amenity')):
                  point = bbox_nodes[node.attrib['id']]
                  relevant.append({
                      'type': 'node', 'id': node.attrib['id'], 'lat': point[0], 'lon': point[1],
                      'distance_to_osm_centroid_m': round(distance_m(osm_center, point), 1),
                      'tags': node_tags,
                  })
          relevant.sort(key=lambda row: row['distance_to_osm_centroid_m'])
          print('OSM_NEARBY=' + json.dumps(relevant[:100], ensure_ascii=False, sort_keys=True))
          PY

          rm -f .github/workflows/temporary-coordinate-source-probe-raknehaugen.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT" .github/workflows/temporary-coordinate-source-probe-raknehaugen.yml
          if git diff --cached --quiet; then
            echo 'No Raknehaugen source changes.'
          else
            git commit -m 'Materialize Raknehaugen geometry sources'
            git push origin HEAD:agent/akershus-raknehaugen-production
          fi
