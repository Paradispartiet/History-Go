name: TEMP Helse rehabilitation function 11/12 writeback
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  writeback:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'agent/helse-rehabilitation-function-fulltext-content'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/helse-rehabilitation-function-fulltext-content
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/brief-helse-rehabilitation-function-sources-v1.mjs
      - run: node scripts/materialize-helse-rehabilitation-function-fulltext-v1.mjs
      - run: node scripts/audit-fagverk-general-engine.mjs --write-report
      - run: node scripts/build-fagverk-release-manifest.mjs
      - run: node scripts/audit-helse-rehabilitation-function-fulltext-v1.mjs --write-report
      - run: node scripts/audit-helse-rehabilitation-function-fulltext-v1.mjs
      - run: node scripts/audit-helse-cumulative-progress-v1.mjs
      - run: node scripts/audit-fagverk-subject-inventory.mjs
      - run: node scripts/audit-fagverk-general-engine.mjs
      - run: node scripts/audit-fagverk-theory-quality.mjs
      - run: node scripts/audit-fagverk-theory-integrity.mjs
      - run: node scripts/build-fagverk-release-manifest.mjs --check
      - run: node --test tests/helse-rehabilitation-function-fulltext-v1.test.mjs tests/helse-cumulative-progress-v1.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-general-engine.test.mjs tests/fagverk-release-manifest.test.mjs
      - name: Commit deterministic writeback
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/fag/fag_manifest.json \
            data/fag/helse/helsepensum_canonical_v1.json \
            data/fag/helse/emner_helse_canonical_v1.json \
            data/fag/helse/methods_helse_canonical_v1.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_inventory.json \
            data/fagverk/subject_status.json \
            data/fagverk/fagverk_release.json \
            data/fagverk/helse/rehabilitering-funksjon-icf-mal-deltakelse-og-tverrprofesjonell-praksis.json \
            data/fagverk/helse/rehabilitering-funksjon-icf-mal-deltakelse-og-tverrprofesjonell-praksis \
            reports/fagverk/helse-rehabilitation-function-fulltext-v1-audit.json \
            reports/fagverk/general-engine-audit.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Materialize Helse rehabilitation function at 11/12"
            git push origin HEAD:agent/helse-rehabilitation-function-fulltext-content
          fi