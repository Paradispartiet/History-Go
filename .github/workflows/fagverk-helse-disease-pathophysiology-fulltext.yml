# TEMP shared projection write-back; restore before merge
name: Fagverk Helse disease pathophysiology fulltext
on:
  pull_request:
    paths: ['data/fag/**','data/fagverk/**','reports/fagverk/**','scripts/**','tests/**','.github/workflows/fagverk-helse-disease-pathophysiology-fulltext.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/helse-disease-pathophysiology-fulltext-unit
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/audit-fagverk-general-engine.mjs --write-report
      - run: node scripts/audit-fagverk-theory-quality.mjs --write-report --no-check-report
      - run: node scripts/audit-fagverk-theory-integrity.mjs --write-report --no-check-report
      - run: node scripts/audit-fagverk-general-engine.mjs
      - run: node scripts/audit-fagverk-theory-quality.mjs
      - run: node scripts/audit-fagverk-theory-integrity.mjs
      - run: node scripts/audit-helse-disease-pathophysiology-fulltext-v1.mjs
      - run: node scripts/audit-helse-cumulative-progress-v1.mjs
      - run: node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit refreshed shared projections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reports/fagverk/general-engine-audit.json
          git add -- reports/fagverk/fagverk-theory-quality-audit.json
          git add -- reports/fagverk/fagverk-theory-integrity-audit.json
          if git diff --cached --quiet; then
            echo "No shared projection changes"
          else
            git commit -m "Refresh Fagverk projections for Health domain 3"
            git push origin HEAD:agent/helse-disease-pathophysiology-fulltext-unit
          fi
