name: Fagverk Helse disease pathophysiology fulltext
on:
  pull_request:
    paths: ['data/fag/helse/**','data/fag/fag_manifest.json','data/fagverk/helse/**','data/fagverk/fagverk_registry.json','data/fagverk/fagverk_release.json','data/fagverk/subject_inventory.json','data/fagverk/subject_status.json','reports/fagverk/helse-disease-pathophysiology-fulltext-v1-audit.json','scripts/*helse-*','tests/helse-*.test.mjs','.github/workflows/fagverk-helse-disease-pathophysiology-fulltext.yml']
  push:
    branches: [main]
    paths: ['data/fag/helse/**','data/fagverk/helse/**','data/fagverk/fagverk_registry.json','data/fagverk/subject_status.json','data/fagverk/fagverk_release.json','reports/fagverk/helse-disease-pathophysiology-fulltext-v1-audit.json','scripts/*helse-*','tests/helse-*.test.mjs']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/materialize-helse-disease-pathophysiology-fulltext-v1.mjs
      - run: node scripts/audit-helse-disease-pathophysiology-fulltext-v1.mjs
      - run: node scripts/audit-helse-cumulative-progress-v1.mjs
      - run: node scripts/audit-fagverk-subject-inventory.mjs
      - run: node scripts/build-fagverk-release-manifest.mjs --check
      - run: node --test tests/helse-disease-pathophysiology-fulltext-v1.test.mjs tests/helse-cumulative-progress-v1.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-release-manifest.test.mjs
      - name: Verify deterministic generated outputs
        shell: bash
        run: |
          git diff --exit-code -- \
            data/fag/fag_manifest.json \
            data/fag/helse/helsepensum_canonical_v1.json \
            data/fag/helse/emner_helse_canonical_v1.json \
            data/fag/helse/methods_helse_canonical_v1.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_status.json \
            data/fagverk/fagverk_release.json \
            data/fagverk/helse/sykdom-og-patofysiologi-mekanisme-skade-og-systemsvikt.json \
            data/fagverk/helse/sykdom-og-patofysiologi-mekanisme-skade-og-systemsvikt \
            reports/fagverk/helse-disease-pathophysiology-fulltext-v1-audit.json
