name: Fagverk Helse disease pathophysiology fulltext
on:
  pull_request:
    paths: ['data/fag/helse/**','data/fag/fag_manifest.json','data/fagverk/helse/**','data/fagverk/fagverk_registry.json','data/fagverk/fagverk_release.json','data/fagverk/subject_inventory.json','data/fagverk/subject_status.json','reports/fagverk/helse-disease-pathophysiology-fulltext-v1-audit.json','reports/fagverk/general-engine-audit.json','reports/fagverk/fagverk-theory-quality-audit.json','reports/fagverk/fagverk-theory-integrity-audit.json','scripts/*helse-*','tests/helse-*.test.mjs','.github/workflows/fagverk-helse-disease-pathophysiology-fulltext.yml']
  push:
    branches: [main]
    paths: ['data/fag/helse/**','data/fagverk/helse/**','data/fagverk/fagverk_registry.json','data/fagverk/subject_status.json','data/fagverk/fagverk_release.json','reports/fagverk/helse-disease-pathophysiology-fulltext-v1-audit.json','reports/fagverk/general-engine-audit.json','reports/fagverk/fagverk-theory-quality-audit.json','reports/fagverk/fagverk-theory-integrity-audit.json','scripts/*helse-*','tests/helse-*.test.mjs']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - id: progress
        shell: bash
        run: |
          count=$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('data/fagverk/fagverk_registry.json','utf8')).subjects.helse.editorialPlan.registeredChapterCount;process.stdout.write(String(r))")
          echo "registered=$count" >> "$GITHUB_OUTPUT"
          if [[ "$count" -ge 4 ]]; then
            echo "advanced=true" >> "$GITHUB_OUTPUT"
            echo "Helse is $count/12; preserve disease/pathophysiology and validate cumulative state."
          else
            echo "advanced=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.progress.outputs.advanced != 'true'
        run: node scripts/materialize-helse-disease-pathophysiology-fulltext-v1.mjs
      - if: steps.progress.outputs.advanced != 'true'
        run: node scripts/audit-helse-disease-pathophysiology-fulltext-v1.mjs
      - run: node scripts/audit-helse-cumulative-progress-v1.mjs
      - run: node scripts/audit-fagverk-subject-inventory.mjs
      - run: node scripts/audit-fagverk-general-engine.mjs
      - run: node scripts/audit-fagverk-theory-quality.mjs
      - run: node scripts/audit-fagverk-theory-integrity.mjs
      - run: node scripts/build-fagverk-release-manifest.mjs --check
      - if: steps.progress.outputs.advanced != 'true'
        run: node --test tests/helse-disease-pathophysiology-fulltext-v1.test.mjs tests/helse-cumulative-progress-v1.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-general-engine.test.mjs tests/fagverk-release-manifest.test.mjs
      - if: steps.progress.outputs.advanced == 'true'
        run: node --test tests/helse-cumulative-progress-v1.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-general-engine.test.mjs tests/fagverk-release-manifest.test.mjs
      - name: Verify deterministic generated outputs
        shell: bash
        run: |
          git diff --exit-code -- \
            data/fag/fag_manifest.json \
            data/fag/helse/helsepensum_canonical_v1.json \
            data/fag/helse/emner_helse_canonical_v1.json \
            data/fag/helse/methods_helse_canonical_v1.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_status.json \
            data/fagverk/fagverk_release.json \
            data/fagverk/helse/sykdom-og-patofysiologi-mekanisme-skade-og-systemsvikt.json \
            data/fagverk/helse/sykdom-og-patofysiologi-mekanisme-skade-og-systemsvikt \
            reports/fagverk/helse-disease-pathophysiology-fulltext-v1-audit.json \
            reports/fagverk/general-engine-audit.json \
            reports/fagverk/fagverk-theory-quality-audit.json \
            reports/fagverk/fagverk-theory-integrity-audit.json
