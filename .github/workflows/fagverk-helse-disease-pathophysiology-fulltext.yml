name: Fagverk Helse disease pathophysiology fulltext
on:
  pull_request:
    paths: ['data/fag/helse/**','data/fag/fag_manifest.json','data/fagverk/helse/**','data/fagverk/fagverk_registry.json','data/fagverk/fagverk_release.json','data/fagverk/subject_inventory.json','data/fagverk/subject_status.json','data/fagverk/fagverk_portal.json','reports/fagverk/helse-disease-pathophysiology-fulltext-v1-audit.json','scripts/*helse-disease-pathophysiology*','scripts/*helse-anatomy-physiology*','scripts/*helse-medical-ethics-evidence*','tests/helse-disease-pathophysiology-fulltext-v1.test.mjs','.github/workflows/fagverk-helse-disease-pathophysiology-fulltext.yml']
  push:
    branches: [main]
    paths: ['data/fagverk/helse/sykdom-og-patofysiologi-mekanisme-skade-og-systemsvikt/**','scripts/*helse-disease-pathophysiology-fulltext*','tests/helse-disease-pathophysiology-fulltext-v1.test.mjs']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - id: fulltext_gate
        shell: bash
        run: |
          if [[ -f scripts/materialize-helse-disease-pathophysiology-fulltext-v1.mjs && -f scripts/audit-helse-disease-pathophysiology-fulltext-v1.mjs && -f tests/helse-disease-pathophysiology-fulltext-v1.test.mjs ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Bootstrap only: fulltext materializer/audit/test not present yet."
          fi
      - if: steps.fulltext_gate.outputs.ready == 'true'
        run: node scripts/materialize-helse-disease-pathophysiology-fulltext-v1.mjs
      - if: steps.fulltext_gate.outputs.ready == 'true'
        run: node scripts/audit-helse-disease-pathophysiology-fulltext-v1.mjs
      - if: steps.fulltext_gate.outputs.ready == 'true'
        run: node scripts/brief-helse-disease-pathophysiology-sources-v1.mjs
      - if: steps.fulltext_gate.outputs.ready == 'true'
        run: node scripts/materialize-helse-anatomy-physiology-fulltext-v1.mjs
      - if: steps.fulltext_gate.outputs.ready == 'true'
        run: node scripts/audit-helse-anatomy-physiology-fulltext-v1.mjs
      - if: steps.fulltext_gate.outputs.ready == 'true'
        run: node scripts/brief-helse-anatomy-physiology-sources-v1.mjs
      - if: steps.fulltext_gate.outputs.ready == 'true'
        run: node scripts/materialize-helse-medical-ethics-evidence-fulltext-v1.mjs
      - if: steps.fulltext_gate.outputs.ready == 'true'
        run: node scripts/audit-helse-medical-ethics-evidence-fulltext-v1.mjs
      - if: steps.fulltext_gate.outputs.ready == 'true'
        run: node scripts/audit-fagverk-subject-inventory.mjs
      - if: steps.fulltext_gate.outputs.ready == 'true'
        run: node scripts/build-fagverk-release-manifest.mjs --check
      - if: steps.fulltext_gate.outputs.ready == 'true'
        run: node --test tests/helse-disease-pathophysiology-source-brief-v1.test.mjs tests/helse-disease-pathophysiology-fulltext-v1.test.mjs tests/helse-anatomy-physiology-source-brief-v1.test.mjs tests/helse-anatomy-physiology-fulltext-v1.test.mjs tests/helse-medical-ethics-evidence-fulltext-v1.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-release-manifest.test.mjs
