name: Integrate Etne sport batch 1 from PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.event.pull_request.head.ref == 'agent/etne-sport-batch-1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-sport-batch-1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          mkdir -p reports/etne-sport-batch-1-integration
          npm install 2>&1 | tee reports/etne-sport-batch-1-integration/npm-install.txt

      - name: Resolve and apply Kartverket anchors
        shell: bash
        run: |
          node <<'NODE' 2>&1 | tee reports/etne-sport-batch-1-integration/address-anchor-lookup.txt
          const fs = require('fs');
          const files = {
            etne: 'data/places/sport/vestland/etne/etne_idrettsanlegg.json',
            steinsvollen: 'data/places/sport/vestland/etne/steinsvollen_fotballanlegg.json',
            enge: 'data/places/sport/vestland/etne/engebanen_etne.json',
            skanevik: 'data/places/sport/vestland/etne/skanevik_idrettsanlegg.json',
            bmx: 'data/places/sport/vestland/etne/etne_bmx_og_skatepark.json'
          };
          const readRecord = (path) => JSON.parse(fs.readFileSync(path, 'utf8'))[0];
          const writeRecord = (path, record) => fs.writeFileSync(path, JSON.stringify([record], null, 2) + '\n');

          async function addressLookup(query) {
            const url = new URL('https://ws.geonorge.no/adresser/v1/sok');
            url.searchParams.set('sok', query);
            url.searchParams.set('treffPerSide', '10');
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Address lookup HTTP ${response.status}: ${query}`);
            const data = await response.json();
            const rows = data.adresser || [];
            if (!rows.length) throw new Error(`No address result: ${query}`);
            const best = rows[0];
            const point = best.representasjonspunkt;
            if (!point || typeof point.lat !== 'number' || typeof point.lon !== 'number') throw new Error(`Missing address representation point: ${query}`);
            return { lat: point.lat, lon: point.lon, raw: best };
          }

          function nameOf(row) {
            return row?.stedsnavn?.skrivemåte || row?.skrivemåte || row?.navn || row?.name || '';
          }

          function pointOf(row) {
            const candidates = [row?.representasjonspunkt, row?.representasjonspunkt?.koordinater, row?.geometry, row?.geometri, row?.punkt].filter(Boolean);
            for (const p of candidates) {
              if (typeof p.lat === 'number' && typeof p.lon === 'number') return { lat: p.lat, lon: p.lon };
              if (typeof p.latitude === 'number' && typeof p.longitude === 'number') return { lat: p.latitude, lon: p.longitude };
              const east = typeof p.øst === 'number' ? p.øst : p.ost;
              if (typeof p.nord === 'number' && typeof east === 'number' && Math.abs(p.nord) <= 90 && Math.abs(east) <= 180) return { lat: p.nord, lon: east };
              if (Array.isArray(p.coordinates) && p.coordinates.length >= 2) {
                const [x, y] = p.coordinates;
                if (typeof x === 'number' && typeof y === 'number' && Math.abs(x) <= 180 && Math.abs(y) <= 90) return { lat: y, lon: x };
              }
            }
            return null;
          }

          async function placeNameLookup(searches, label) {
            for (const search of searches) {
              const url = new URL('https://api.kartverket.no/stedsnavn/v1/navn');
              url.searchParams.set('knr', '4611');
              url.searchParams.set('sok', search);
              url.searchParams.set('treffPerSide', '50');
              url.searchParams.set('side', '1');
              const response = await fetch(url);
              if (!response.ok) {
                console.log(`INFO ${label}: stedsnavn HTTP ${response.status} for ${search}`);
                continue;
              }
              const data = await response.json();
              const rows = Array.isArray(data.navn) ? data.navn : (Array.isArray(data) ? data : []);
              console.log(`INFO ${label}: query=${search} candidates=${rows.length}`);
              rows.slice(0, 15).forEach((row, index) => console.log(`CANDIDATE ${label} ${index + 1}: ${nameOf(row)} | ${JSON.stringify(row.representasjonspunkt || row.geometry || row.geometri || null)}`));
              const usable = rows.map((row) => ({ row, name: nameOf(row), point: pointOf(row) })).filter((item) => item.point);
              if (usable.length) {
                const stem = search.replace(/\*/g, '').toLowerCase();
                const chosen = usable.find((item) => item.name.toLowerCase() === stem || item.name.toLowerCase().includes(stem)) || usable[0];
                return { ...chosen.point, name: chosen.name || search, raw: chosen.row, query: search };
              }
            }
            return null;
          }

          function apply(path, point, note, label) {
            const record = readRecord(path);
            record.lat = point.lat;
            record.lon = point.lon;
            record.quiz_profile.notes += ` ${note}`;
            writeRecord(path, record);
            console.log(`PASS ${record.id}: ${point.lat}, ${point.lon} -> ${label}`);
          }

          (async () => {
            const etne = await addressLookup('Stadionvegen 36, 5590 Etne');
            apply(files.etne, etne, 'Offisielt Kartverket/Geonorge-adressepunkt brukt som anker: Stadionvegen 36, 5590 Etne.', 'Stadionvegen 36, 5590');

            const bmx = await addressLookup('Stadionvegen 12, 5590 Etne');
            apply(files.bmx, bmx, 'Offisielt Kartverket/Geonorge-adressepunkt brukt som anker: Stadionvegen 12, 5590 Etne.', 'Stadionvegen 12, 5590');

            const steinsvollen = await placeNameLookup(['Steinsvollen*', 'Steinsvoll*'], 'Steinsvollen');
            if (!steinsvollen) throw new Error('No usable Kartverket Stedsnavn point for Steinsvollen in Etne municipality');
            apply(files.steinsvollen, steinsvollen, `Kartverket Stedsnavn-representasjonspunkt brukt for ${steinsvollen.name || 'Steinsvollen'} i Etne kommune; punktet representerer fotballområdet og er ikkje påstått å vere sentrum av ei bestemt turneringsoppmerking.`, `Kartverket Stedsnavn: ${steinsvollen.name || 'Steinsvollen'}`);

            let enge = await placeNameLookup(['Engebanen*', 'Enge kunstgrasbane*', 'Engebane*'], 'Engebanen');
            if (enge) {
              apply(files.enge, enge, `Kartverket Stedsnavn-representasjonspunkt brukt for ${enge.name || 'Engebanen'} i Etne kommune.`, `Kartverket Stedsnavn: ${enge.name || 'Engebanen'}`);
            } else {
              enge = await addressLookup('Enge 2, 5590 Etne');
              apply(files.enge, enge, 'Kartverket/Geonorge-adressepunkt for Enge 2 er brukt som eit eksplisitt representativt Enge-områdeanker fordi opne kjelder dokumenterer Engebanen, men ikkje eit eintydig maskinlesbart banepunkt. Punktet er ikkje påstått å vere eksakt senter av fotballbana.', 'representativt Enge-områdeanker: Enge 2, 5590');
            }

            const skanevik = await placeNameLookup(['Skånevik idrettsanlegg*', 'Skånevik stadion*'], 'Skånevik idrettsanlegg');
            if (!skanevik) throw new Error('No usable Kartverket Stedsnavn point for Skånevik idrettsanlegg/stadion in Etne municipality');
            apply(files.skanevik, skanevik, `Kartverket Stedsnavn-representasjonspunkt brukt for ${skanevik.name || 'Skånevik idrettsanlegg'} i Etne kommune; punktet representerer uteanlegget og er ikkje henta frå halladressa.`, `Kartverket Stedsnavn: ${skanevik.name || 'Skånevik idrettsanlegg'}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Register manifest paths
        shell: bash
        run: |
          node <<'NODE' 2>&1 | tee reports/etne-sport-batch-1-integration/manifest-update.txt
          const fs = require('fs');
          const path = 'data/places/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const additions = [
            'places/sport/vestland/etne/etne_idrettsanlegg.json',
            'places/sport/vestland/etne/steinsvollen_fotballanlegg.json',
            'places/sport/vestland/etne/engebanen_etne.json',
            'places/sport/vestland/etne/skanevik_idrettsanlegg.json',
            'places/sport/vestland/etne/etne_bmx_og_skatepark.json'
          ];
          for (const item of additions) if (!manifest.files.includes(item)) manifest.files.push(item);
          for (const item of additions) {
            const count = manifest.files.filter((row) => row === item).length;
            if (count !== 1) throw new Error(`${item}: manifest count ${count}`);
            console.log(`PASS ${item}: exactly once in manifest`);
          }
          fs.writeFileSync(path, JSON.stringify(manifest) + '\n');
          NODE

      - name: Run place validation
        shell: bash
        run: |
          bash scripts/check-places.sh 2>&1 | tee reports/etne-sport-batch-1-integration/check-places.txt

      - name: Run split manifest audit
        shell: bash
        run: |
          npm run audit:places-split-manifest-sync 2>&1 | tee reports/etne-sport-batch-1-integration/split-manifest-sync.txt

      - name: Run coordinate quality gate
        shell: bash
        run: |
          npm run places:coords:quality 2>&1 | tee reports/etne-sport-batch-1-integration/coordinate-quality.txt

      - name: Run targeted runtime validation
        shell: bash
        run: |
          node <<'NODE' 2>&1 | tee reports/etne-sport-batch-1-integration/targeted-validation.txt
          const fs = require('fs');
          const ids = ['etne_idrettsanlegg', 'steinsvollen_fotballanlegg', 'engebanen_etne', 'skanevik_idrettsanlegg', 'etne_bmx_og_skatepark'];
          const rows = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const list = Array.isArray(rows) ? rows : (rows.places || []);
          for (const id of ids) {
            const count = list.filter((row) => row.id === id).length;
            if (count !== 1) throw new Error(`${id}: active runtime count ${count}`);
            console.log(`PASS ${id}: exactly one active runtime row`);
          }
          const counts = new Map();
          for (const row of list) counts.set(row.id, (counts.get(row.id) || 0) + 1);
          const duplicates = [...counts.entries()].filter(([, count]) => count > 1);
          if (duplicates.length) throw new Error(`global duplicate active place IDs: ${duplicates.length}`);
          console.log('PASS global duplicate active place IDs: 0');
          NODE

      - name: Audit anchor distinctions
        shell: bash
        run: |
          node <<'NODE' 2>&1 | tee reports/etne-sport-batch-1-integration/anchor-audit.txt
          const fs = require('fs');
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'))[0];
          const etne = read('data/places/sport/vestland/etne/etne_idrettsanlegg.json');
          const steinsvollen = read('data/places/sport/vestland/etne/steinsvollen_fotballanlegg.json');
          const enge = read('data/places/sport/vestland/etne/engebanen_etne.json');
          const skanevik = read('data/places/sport/vestland/etne/skanevik_idrettsanlegg.json');
          const bmx = read('data/places/sport/vestland/etne/etne_bmx_og_skatepark.json');
          const rows = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const list = Array.isArray(rows) ? rows : (rows.places || []);
          const hall = list.find((row) => row.id === 'skanevik_kultur_og_idrettshall');
          if (!hall) throw new Error('Existing skanevik_kultur_og_idrettshall runtime row missing');
          const hav = (a,b) => {
            const R=6371, rad=(x)=>x*Math.PI/180;
            const dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
            const q=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
            return 2*R*Math.asin(Math.sqrt(q));
          };
          const distances = {
            etne_bmx: hav(etne, bmx),
            etne_enge: hav(etne, enge),
            etne_steinsvollen: hav(etne, steinsvollen),
            skanevik_hall: hav(skanevik, hall)
          };
          for (const [name, distance] of Object.entries(distances)) if (distance < 0.01) throw new Error(`${name}: anchors are effectively identical (${distance.toFixed(3)} km)`);
          if ([etne, steinsvollen, enge, skanevik, bmx].some((row) => row.category !== 'sport')) throw new Error('Not all batch records are category sport');
          if (!steinsvollen.quiz_profile.notes.includes('Stedsnavn')) throw new Error('Steinsvollen official-name anchor disclosure missing');
          if (!skanevik.quiz_profile.notes.includes('Stedsnavn')) throw new Error('Skånevik outdoor anchor disclosure missing');
          console.log(`PASS Etne idrettsanlegg ↔ BMX/skatepark: ${distances.etne_bmx.toFixed(3)} km; distinct facilities`);
          console.log(`PASS Etne idrettsanlegg ↔ Engebanen: ${distances.etne_enge.toFixed(3)} km; distinct facilities`);
          console.log(`PASS Etne idrettsanlegg ↔ Steinsvollen: ${distances.etne_steinsvollen.toFixed(3)} km; distinct facilities`);
          console.log(`PASS Skånevik outdoor idrettsanlegg ↔ culture/idrettshall: ${distances.skanevik_hall.toFixed(3)} km; distinct objects/functions`);
          console.log('PASS all five records categorized as sport');
          NODE

      - name: Check diff whitespace
        shell: bash
        run: |
          git diff --check 2>&1 | tee reports/etne-sport-batch-1-integration/git-diff-check.txt

      - name: Commit integrated batch and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/integrate-etne-sport-batch1.yml
          rm -f .github/workflows/integrate-etne-sport-batch1-pr.yml
          rm -f reports/.etne-sport-batch-1-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/places/sport/vestland/etne data/places/manifest.json data/places/places_index.json reports/etne-sport-batch-1-integration reports/.etne-sport-batch-1-trigger .github/workflows/integrate-etne-sport-batch1.yml .github/workflows/integrate-etne-sport-batch1-pr.yml
          git commit -m 'Integrate Etne sport batch 1 [skip etne sport integration]'
          git push origin HEAD:agent/etne-sport-batch-1
