name: TMP materialize Nature Fagverk reports once

on:
  push:
    branches:
      - feature/fagverk-natur-editorial-complete
    paths:
      - '.github/workflows/tmp-fagverk-natur-report-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fagverk-natur-editorial-complete
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate exact deterministic reports
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs --write-report
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/audit-fagverk-natur-pilot.mjs --write-report --no-check-report
          rm .github/workflows/tmp-fagverk-natur-report-materialize.yml
      - name: Commit generated reports and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/fagverk/subject-baseline.json reports/fagverk/general-engine-audit.json reports/fagverk/natur-pilot-audit.json .github/workflows/tmp-fagverk-natur-report-materialize.yml
          git commit -m "Materialiser Natur completion-rapporter"
          git push origin HEAD:feature/fagverk-natur-editorial-complete
