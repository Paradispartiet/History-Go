name: Temporary quiz registration materialization
on:
  push:
    branches: [audit/quiz-wiring-20261008]
    paths:
      - .github/workflows/tmp-quiz-registration-materialize.yml
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Register valid packages without editing questions
        run: node scripts/register-quiz-sets.mjs --write
      - name: Build canonical Knowledge tooling
        run: npm run build:scripts
      - name: Synchronize canonical Knowledge indices
        run: |
          node dist/scripts/knowledge-canonical-data.mjs --write || {
            node -e 'const r=require("./reports/knowledge-contract-audit.json"); console.log("Knowledge failures", JSON.stringify(r.failures.slice(0,40),null,2))'
            exit 1
          }
      # Question focus may be place, emne, concept or synthesis.
      - name: Verify manifest contract
        run: |
          npm run audit:quiz-manifest:v2 || {
            node -e 'const r=require("./reports/quiz_manifest_v2_audit_report.json"); console.log("Audit failures",JSON.stringify({missingFiles:r.missingFiles.slice(0,8),missingSetIds:r.missingSetIds.slice(0,8),invalidQuestions:r.invalidQuestions.slice(0,15),targetMismatchQuestions:r.targetMismatchQuestions.slice(0,12),duplicateQuizItemIds:r.duplicateQuizItemIds.slice(0,8),duplicateSetKeys:r.duplicateSetKeys.slice(0,8),reasonCounts:Object.fromEntries([...new Set(r.invalidQuestions.map(x=>x.reason))].map(t=>[t,r.invalidQuestions.filter(x=>x.reason===t).length])),counts:{invalidQuestions:r.invalidQuestions.length,targetMismatchQuestions:r.targetMismatchQuestions.length,duplicateSetKeys:r.duplicateSetKeys.length,missingSetIds:r.missingSetIds.length,duplicateQuizItemIds:r.duplicateQuizItemIds.length}},null,2))'
            exit 1
          }
      # Inventory excludes manifest metadata from the playable-set scan.
      - name: Verify registration fixture
        run: npm run test:quiz-wiring
      - name: Commit verified generated registration on PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz data/knowledge reports/quiz-registration-report.json reports/knowledge-id-backfill.json
          if ! git diff --cached --quiet; then
            git commit -m "Materialize validated quiz registrations and canonical knowledge"
            git push origin HEAD:refs/heads/audit/quiz-wiring-20261008
          fi
