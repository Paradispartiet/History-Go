name: Temporary quiz registration materialization
on:
  push:
    branches: [audit/quiz-wiring-20261008]
    paths:
      - .github/workflows/tmp-quiz-registration-materialize.yml
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Register valid packages without editing questions
        run: node scripts/register-quiz-sets.mjs --write
      - name: Build canonical Knowledge tooling
        run: npm run build:scripts
      - name: Synchronize canonical Knowledge indices
        run: |
          node dist/scripts/knowledge-canonical-data.mjs --write || {
            node -e 'const r=require("./reports/knowledge-contract-audit.json"); console.log("Knowledge failures", JSON.stringify(r.failures.slice(0,40),null,2))'
            exit 1
          }
      - name: Verify manifest contract
        run: npm run audit:quiz-manifest:v2
      - name: Verify registration fixture
        run: npm run test:quiz-wiring
      - name: Commit verified generated registration on PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz data/knowledge reports/quiz-registration-report.json reports/knowledge-id-backfill.json
          if ! git diff --cached --quiet; then
            git commit -m "Materialize validated quiz registrations and canonical knowledge"
            git push origin HEAD:refs/heads/audit/quiz-wiring-20261008
          fi
