name: TEMP Civication History archive persistent writeback

on:
  push:
    branches:
      - agent/civication-historie-arkiv-dokumentasjon-playability

permissions:
  contents: write

concurrency:
  group: temp-civication-historie-arkiv-persistent
  cancel-in-progress: true

jobs:
  patch-test-writeback:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out role branch
        uses: actions/checkout@v4
        with:
          ref: agent/civication-historie-arkiv-dokumentasjon-playability
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Wire persistent archive cases and canonical History Go People task
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ROLE = 'historie_arkiv_og_dokumentasjon'
          INSTITUTION = 'historie_arkivinstitusjon_001'

          def load(path):
              return json.loads(Path(path).read_text())

          def write(path, data):
              Path(path).write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          def get_mail(path, mail_id):
              data = load(path)
              for family in data.get('families', []):
                  for mail in family.get('mails', []):
                      if mail.get('id') == mail_id:
                          return data, mail
              raise SystemExit(f'Missing mail {mail_id} in {path}')

          def set_context(mail, object_id, deadline_ref):
              mail['work_context'] = {
                  'object_ids': [object_id],
                  'institution_id': INSTITUTION,
                  'deadline_ref': deadline_ref
              }

          def set_scene_create(mail, create_op):
              effects = mail.setdefault('effects', {})
              effects['work_object_ops'] = [create_op]

          def choice(mail, choice_id):
              for row in mail.get('choices', []):
                  if row.get('id') == choice_id:
                      return row
              raise SystemExit(f"Missing choice {choice_id} in {mail.get('id')}")

          def set_choice_ops(mail, choice_id, ops):
              row = choice(mail, choice_id)
              row.setdefault('effects', {})['work_object_ops'] = ops

          delivery_id = 'historie_arkiv_sak_leveranse_001'
          delivery_create = {
              'op': 'create',
              'event_id': 'historie_arkiv_leveranse_001_opprettet',
              'work_object': {
                  'work_object_id': delivery_id,
                  'kind': 'arkivleveranse',
                  'role_scope': ROLE,
                  'institution_id': INSTITUTION,
                  'title': 'Blandet arkivleveranse med uklart systemspor',
                  'status': 'open',
                  'phase': 'mottak',
                  'people_refs': ['sara_arkivleder_historie', 'yusuf_dokumentforvalter_historie'],
                  'place_refs': ['mottak_arkiv_historie', 'ordningsrom_arkiv_historie'],
                  'knowledge_refs': ['proveniens_og_opprinnelig_orden', 'minimumsmetadata_og_sporbarhet'],
                  'open_questions': ['Hva var avsenders opprinnelige mappestruktur?', 'Hvordan kobles eksportnavn tilbake til systemnøkler?'],
                  'deadline': 'mottaksfrist',
                  'confidentiality': 'intern_arbeidsinformasjon',
                  'flags': ['proveniens_uavklart'],
                  'shared': True
              }
          }

          p = 'data/Civication/mailFamilies/historie/job/historie_arkiv_og_dokumentasjon_job.json'
          data, mail = get_mail(p, 'historie_arkiv_job_mottak_001')
          set_context(mail, delivery_id, 'mottaksfrist')
          set_scene_create(mail, delivery_create)
          set_choice_ops(mail, 'A', [
              {'op':'transition','event_id':'historie_arkiv_leveranse_001_minimumsspor','work_object_id':delivery_id,'to_status':'in_progress','to_phase':'minimumsspor_sikret','note':'Leveranseidentitet, opphav, relasjoner og kjente avvik er registrert uten å gjette på ukjent struktur.'},
              {'op':'add_flag','event_id':'historie_arkiv_leveranse_001_sporbar_flagg','work_object_id':delivery_id,'flag':'minimumsspor_sikret'}
          ])
          set_choice_ops(mail, 'B', [
              {'op':'transition','event_id':'historie_arkiv_leveranse_001_antatt_struktur','work_object_id':delivery_id,'to_status':'at_risk','to_phase':'antatt_struktur','note':'Eksportens mappehierarki er brukt som om det var dokumentert original orden.'},
              {'op':'add_flag','event_id':'historie_arkiv_leveranse_001_metadata_gjeld','work_object_id':delivery_id,'flag':'metadata_gjeld'}
          ])
          write(p, data)

          p = 'data/Civication/mailFamilies/historie/people/historie_arkiv_og_dokumentasjon_people.json'
          data, mail = get_mail(p, 'historie_arkiv_people_systemkontekst_001')
          set_context(mail, delivery_id, 'mottaksfrist')
          set_scene_create(mail, delivery_create)
          set_choice_ops(mail, 'A', [
              {'op':'transition','event_id':'historie_arkiv_leveranse_001_systemkontekst','work_object_id':delivery_id,'to_status':'in_progress','to_phase':'systemkontekst_dokumentert','note':'Koblingsrapporten bevarer relasjonen mellom opprinnelige poster og eksportfiler som eget overføringsspor.'},
              {'op':'remove_flag','event_id':'historie_arkiv_leveranse_001_proveniens_avklart','work_object_id':delivery_id,'flag':'proveniens_uavklart'},
              {'op':'add_flag','event_id':'historie_arkiv_leveranse_001_systemspor_flagg','work_object_id':delivery_id,'flag':'systemspor_sikret'}
          ])
          set_choice_ops(mail, 'B', [
              {'op':'transition','event_id':'historie_arkiv_leveranse_001_eksport_som_original','work_object_id':delivery_id,'to_status':'at_risk','to_phase':'eksportstruktur_som_original','note':'Eksportlayouten er likestilt med original orden uten dokumentert systemkobling.'},
              {'op':'add_flag','event_id':'historie_arkiv_leveranse_001_konteksttap','work_object_id':delivery_id,'flag':'konteksttap_risiko'}
          ])
          write(p, data)

          p = 'data/Civication/mailFamilies/historie/micro/historie_arkiv_og_dokumentasjon_micro.json'
          data, mail = get_mail(p, 'historie_arkiv_micro_minimumsmetadata_001')
          set_context(mail, delivery_id, 'mottaksfrist')
          set_scene_create(mail, delivery_create)
          set_choice_ops(mail, 'A', [
              {'op':'transition','event_id':'historie_arkiv_leveranse_001_operativt_minimum','work_object_id':delivery_id,'to_status':'in_progress','to_phase':'minimumsmetadata_operativt','note':'Materialet kan åpnes for søk med identitet, opphav, relasjon, tidsrom, tilgangsstatus og usikkerhet bevart.'},
              {'op':'add_flag','event_id':'historie_arkiv_leveranse_001_minimum_operativt_flagg','work_object_id':delivery_id,'flag':'minimumsmetadata_operativt'}
          ])
          set_choice_ops(mail, 'B', [
              {'op':'transition','event_id':'historie_arkiv_leveranse_001_tynn_metadata','work_object_id':delivery_id,'to_status':'at_risk','to_phase':'tynn_metadata_publisert','note':'Postene er åpnet med filnavn og enkel tittel før proveniens- og tilgangsminimum er sikret.'},
              {'op':'add_flag','event_id':'historie_arkiv_leveranse_001_kontekstgjeld','work_object_id':delivery_id,'flag':'kontekstgjeld'}
          ])
          write(p, data)

          access_id = 'historie_arkiv_sak_innsyn_001'
          access_create = {
              'op': 'create',
              'event_id': 'historie_arkiv_innsyn_001_opprettet',
              'work_object': {
                  'work_object_id': access_id,
                  'kind': 'innsynssak',
                  'role_scope': ROLE,
                  'institution_id': INSTITUTION,
                  'title': 'Innsynssak med relevante dokumenter og tredjepartsopplysninger',
                  'status': 'open',
                  'phase': 'gjenfinning',
                  'people_refs': ['eline_innsynskoordinator_historie'],
                  'place_refs': ['innsynsrom_arkiv_historie'],
                  'knowledge_refs': ['innsyn_vs_gjenfinning', 'personvern_klausul_og_minimering'],
                  'open_questions': ['Hvilke vedlegg er nødvendige for forespørselen?', 'Hvilke tilgangsbegrensninger må avgjøres av autorisert beslutningseier?'],
                  'deadline': 'innsynsfrist',
                  'confidentiality': 'tredjepartsopplysninger',
                  'flags': ['tilgangsavgjorelse_avventer'],
                  'shared': False
              }
          }

          p = 'data/Civication/mailFamilies/historie/conflict/historie_arkiv_og_dokumentasjon_conflict.json'
          data, mail = get_mail(p, 'historie_arkiv_conflict_innsyn_001')
          set_context(mail, access_id, 'innsynsfrist')
          set_scene_create(mail, access_create)
          set_choice_ops(mail, 'A', [
              {'op':'transition','event_id':'historie_arkiv_innsyn_001_minimert_grunnlag','work_object_id':access_id,'to_status':'awaiting_decision','to_phase':'minimert_beslutningsgrunnlag','note':'Relevans, tredjepartsrisiko og tilgangsstatus er skilt og sendt til autorisert beslutningseier.'},
              {'op':'add_flag','event_id':'historie_arkiv_innsyn_001_minimering_flagg','work_object_id':access_id,'flag':'minimering_dokumentert'}
          ])
          set_choice_ops(mail, 'B', [
              {'op':'transition','event_id':'historie_arkiv_innsyn_001_overutlevering','work_object_id':access_id,'to_status':'at_risk','to_phase':'overutlevering_foreslatt','note':'Hele mappen er foreslått utlevert uten nødvendig avgrensning av tredjepartsopplysninger.'},
              {'op':'add_flag','event_id':'historie_arkiv_innsyn_001_personvernrisiko','work_object_id':access_id,'flag':'personvernrisiko'}
          ])
          write(p, data)

          p = 'data/Civication/mailFamilies/historie/followup/historie_arkiv_og_dokumentasjon_followup.json'
          data, mail = get_mail(p, 'historie_arkiv_followup_innsyn_001')
          set_context(mail, access_id, 'utleveringsfrist')
          set_scene_create(mail, access_create)
          set_choice_ops(mail, 'A', [
              {'op':'remove_flag','event_id':'historie_arkiv_innsyn_001_avgjorelse_mottatt','work_object_id':access_id,'flag':'tilgangsavgjorelse_avventer'},
              {'op':'close','event_id':'historie_arkiv_innsyn_001_korrekt_lukket','work_object_id':access_id,'outcome':'utleveringspakke_verifisert_mot_autorisert_beslutning'}
          ])
          set_choice_ops(mail, 'B', [
              {'op':'close','event_id':'historie_arkiv_innsyn_001_lukket_med_sporbarhetsgap','work_object_id':access_id,'outcome':'arbeidsmappe_sendt_med_sporbarhets_og_overeksponeringsrisiko'}
          ])
          write(p, data)

          digital_id = 'historie_arkiv_sak_digital_bevaring_001'
          digital_create = {
              'op': 'create',
              'event_id': 'historie_arkiv_digital_001_opprettet',
              'work_object': {
                  'work_object_id': digital_id,
                  'kind': 'digital_bevaringssak',
                  'role_scope': ROLE,
                  'institution_id': INSTITUTION,
                  'title': 'Digital serie med formatrisiko og to hashavvik',
                  'status': 'open',
                  'phase': 'integritetskontroll',
                  'people_refs': ['noah_digital_bevaring_historie'],
                  'place_refs': ['digitalt_bevaringsverksted_historie'],
                  'knowledge_refs': ['digital_bevaring', 'autentisitet_og_integritet', 'endringslogg_og_reversibilitet'],
                  'open_questions': ['Hva forklarer hashavviket i fil 1?', 'Hvilken av to kandidater for fil 2 kan autentiseres?'],
                  'deadline': 'formatrisiko_arbeidsplan',
                  'confidentiality': 'intern_bevaringslogg',
                  'flags': ['to_hashavvik'],
                  'shared': False
              }
          }

          p = 'data/Civication/mailFamilies/historie/event/historie_arkiv_og_dokumentasjon_event.json'
          data, mail = get_mail(p, 'historie_arkiv_event_formatrisiko_001')
          set_context(mail, digital_id, 'formatrisiko_arbeidsplan')
          set_scene_create(mail, digital_create)
          set_choice_ops(mail, 'A', [
              {'op':'transition','event_id':'historie_arkiv_digital_001_avvik_isolert','work_object_id':digital_id,'to_status':'in_progress','to_phase':'avvik_isolert_migreringstest','note':'Originalbitstrømmen er bevart, avvikene isolert og migrering testes på kontrollerte kopier.'},
              {'op':'add_flag','event_id':'historie_arkiv_digital_001_original_bevart','work_object_id':digital_id,'flag':'originalbitstrom_bevart'}
          ])
          set_choice_ops(mail, 'B', [
              {'op':'transition','event_id':'historie_arkiv_digital_001_uverifisert_migrering','work_object_id':digital_id,'to_status':'at_risk','to_phase':'uverifisert_migrering','note':'Hele serien er konvertert før hashavvikene er forklart.'},
              {'op':'add_flag','event_id':'historie_arkiv_digital_001_integritet_svekket','work_object_id':digital_id,'flag':'integritetsgrunnlag_svekket'}
          ])
          write(p, data)

          p = 'data/Civication/mailFamilies/historie/consequence/historie_arkiv_og_dokumentasjon_consequence.json'
          data, mail = get_mail(p, 'historie_arkiv_consequence_migrering_001')
          set_context(mail, digital_id, 'etterkontroll')
          set_scene_create(mail, digital_create)
          set_choice_ops(mail, 'A', [
              {'op':'transition','event_id':'historie_arkiv_digital_001_delvis_avklart','work_object_id':digital_id,'to_status':'partially_resolved','to_phase':'ett_autentisitetsavvik_ulost','note':'Verifisert del er migrert kontrollert, mens to kandidater til den siste filen og autentisitetsusikkerheten bevares eksplisitt.'},
              {'op':'remove_flag','event_id':'historie_arkiv_digital_001_to_avvik_redusert','work_object_id':digital_id,'flag':'to_hashavvik'},
              {'op':'add_flag','event_id':'historie_arkiv_digital_001_ett_ulost_flagg','work_object_id':digital_id,'flag':'ett_autentisitetsavvik_ulost'}
          ])
          set_choice_ops(mail, 'B', [
              {'op':'close','event_id':'historie_arkiv_digital_001_prematur_lukking','work_object_id':digital_id,'outcome':'prematurt_lukket_med_uavklart_autentisitet'}
          ])
          write(p, data)

          # Existing Akershus task: preserve place visit flow, but make the canonical People/quiz linkage explicit.
          p = 'data/Civication/mailFamilies/historie/knowledge/historie_arkiv_og_dokumentasjon_knowledge.json'
          data = load(p)
          family = data['families'][0]
          place_mail = next(m for m in family['mails'] if m['id'] == 'historie_arkiv_knowledge_akershus_001')
          evidence = place_mail['task_contract'].setdefault('evidence_refs', [])
          for ref in [
              'data/quiz/historie/akershus_festning_sets.json',
              'data/people/historie/oslo/akershus_festning/knut_alvsson.json',
              'data/people/historie/oslo/akershus_festning/ole_hoiland.json',
              'data/people/historie/oslo/akershus_festning/reidar_haaland.json'
          ]:
              if ref not in evidence:
                  evidence.append(ref)
          place_mail['links'] = [
              {'label':'Knut Alvsson i History Go','ref':'knut_alvsson','kind':'person'},
              {'label':'Ole Høiland i History Go','ref':'ole_hoiland','kind':'person'},
              {'label':'Reidar Haaland i History Go','ref':'reidar_haaland','kind':'person'}
          ]
          rc = place_mail['task_payload'].setdefault('return_context', {})
          rc['related_person_ids'] = ['knut_alvsson', 'ole_hoiland', 'reidar_haaland']
          rc['quiz_ref'] = 'data/quiz/historie/akershus_festning_sets.json'

          person_mail_id = 'historie_arkiv_knowledge_knut_alvsson_001'
          person_mail = {
              'id': person_mail_id,
              'mail_type': 'knowledge',
              'mail_family': 'historie_arkiv_kildebeskrivelse_vs_historisk_fortolkning',
              'role_scope': ROLE,
              'phase': 'advanced',
              'day_phase': 'afternoon',
              'priority': 105,
              'cooldown': 5,
              'repeatable': False,
              'stage': 'stable',
              'from': 'Sara, arkivleder',
              'people_ref': 'sara_arkivleder_historie',
              'person_id': 'sara_arkivleder_historie',
              'place_id': 'ordningsrom_arkiv_historie',
              'thread_key': 'historie_arkiv_kildekontekst_001',
              'subject': 'Åpne Knut Alvsson i History Go: en personprofil er kontekst, ikke dokumentproveniens',
              'summary': 'Sara ber deg åpne den canonicale History Go-profilen for Knut Alvsson, som knytter opprørslederen til Akershus festning i 1502. Profilen kan gi historisk kontekst og bedre spørsmål, men den kan ikke alene avgjøre hvem som skapte et konkret dokument, hvordan dokumentet kom inn i arkivet eller hvilken provenienskjede akkurat dette arkivobjektet har.',
              'purpose': 'Koble arkivrollen direkte til eksisterende canonical History Go People og trene skillet mellom biografisk syntese, dokumentinnhold og arkivproveniens.',
              'stakes': 'Hvis en personprofil brukes som erstatning for dokumentets eget opphavs- og overføringsspor kan en plausibel historisk kobling bli feilaktig registrert som sikker proveniens.',
              'situation': [
                  'Knut Alvsson finnes allerede som canonical History Go Person knyttet til Akershus festning og året 1502.',
                  'Personprofilen oppsummerer en historisk aktør og hendelseskontekst; den er ikke i seg selv metadata for et bestemt brev, regnskap, protokoll eller annet arkivobjekt.',
                  'Et konkret arkivobjekt må fortsatt beskrives ut fra dokumentert skaper, arkivsammenheng, datering, relasjon, overføring og eventuelle usikkerheter.'
              ],
              'task_domain': 'kildekontekst_og_formidling',
              'task_kind': 'knowledge',
              'competency': 'kildekritikk_vs_arkivbeskrivelse',
              'pressure': 'nyttig_personkontekst_vs_udokumentert_proveniensslutning',
              'choice_axis': 'bruk_personprofil_til_sporsmal_og_kontekst_vs_gjor_biografisk_syntese_til_proveniens',
              'consequence_axis': 'bedre_kildekritiske_sporsmal_vs_falsk_opphavssikkerhet',
              'narrative_arc': 'formidling_til_kildegrense_og_bedre_beskrivelse',
              'interaction_mode': 'task',
              'task_contract': {
                  'task_id': 'historie_arkiv_history_go_knut_alvsson',
                  'completion_rule': 'history_go_payload_completed',
                  'failure_rule': 'remain_open',
                  'evidence_refs': [
                      'data/people/historie/oslo/akershus_festning/knut_alvsson.json',
                      'data/places/historie/oslo/places_historie/akershus_festning.json'
                  ]
              },
              'task_payload': {
                  'task_kind': 'history_go_person',
                  'target_type': 'person',
                  'person_id': 'knut_alvsson',
                  'completion_mode': 'read_profile',
                  'title': 'Les Knut Alvsson som historisk personkontekst',
                  'description': 'Åpne den canonicale personprofilen og skill det History Go sammenfatter om aktøren fra proveniens som må dokumenteres for et konkret arkivobjekt.',
                  'return_context': {
                      'source': 'civication',
                      'mail_id': person_mail_id,
                      'role_scope': ROLE,
                      'place_id': 'akershus_festning'
                  }
              },
              'links': [
                  {'label':'Akershus festning i History Go','ref':'akershus_festning','kind':'place'}
              ],
              'choices': [
                  {
                      'id':'A',
                      'label':'Åpne profilen og bruk den til å formulere hva som må verifiseres i selve arkivmaterialet',
                      'reply':'Jeg bruker personprofilen til å forstå tids- og hendelseskontekst, men registrerer bare dokumentets opphav og relasjoner når arkivsporet faktisk dokumenterer dem.',
                      'effect':1,
                      'tags':['history_go_person','source_boundary','provenance_question'],
                      'feedback':'Du kobler History Go-personen til arbeidssaken som et kildekritisk hjelpemiddel uten å gjøre syntesen til arkivbevis.',
                      'effects':{'stats':{'quality':2,'trust':2,'risk':-2,'energy':-1}}
                  },
                  {
                      'id':'B',
                      'label':'Bruk personprofilens kobling til Akershus som tilstrekkelig grunnlag for å fylle inn dokumentets proveniens',
                      'reply':'Når personen og stedet allerede er historisk koblet kan vi føre denne sammenhengen direkte i metadata og spare en ny kontrollrunde.',
                      'effect':-1,
                      'tags':['biography_as_provenance','source_boundary_loss','false_certainty'],
                      'feedback':'Du gjør en historisk plausibel person–sted-kobling til sikker dokumentproveniens uten evidens fra selve arkivkjeden.',
                      'effects':{'stats':{'quality':-3,'trust':-2,'risk':4}}
                  }
              ]
          }
          existing = next((i for i,m in enumerate(family['mails']) if m.get('id') == person_mail_id), None)
          if existing is None:
              family['mails'].append(person_mail)
          else:
              family['mails'][existing] = person_mail
          write(p, data)
          PY

      - name: Add persistent case continuity regression
        shell: bash
        run: |
          cat > tests/civication-historie-arkiv-work-object-continuity.test.js <<'EOF'
          #!/usr/bin/env node
          'use strict';

          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const vm = require('node:vm');

          const root = path.resolve(__dirname, '..');
          const roleScope = 'historie_arkiv_og_dokumentasjon';
          const readJson = rel => JSON.parse(fs.readFileSync(path.join(root, rel), 'utf8'));
          const workWorldFactory = require(path.join(root, 'js/Civication/core/civicationWorkWorld.js'));

          function mail(type, id) {
            const catalog = readJson(`data/Civication/mailFamilies/historie/${type}/${roleScope}_${type}.json`);
            return catalog.families.flatMap(family => family.mails || []).find(row => row.id === id);
          }

          function makeState(initial = {}) {
            let state = JSON.parse(JSON.stringify(initial));
            const deepMerge = (target, patch) => {
              const out = { ...(target || {}) };
              for (const [key, value] of Object.entries(patch || {})) {
                if (value && typeof value === 'object' && !Array.isArray(value)) out[key] = deepMerge(out[key] || {}, value);
                else out[key] = value;
              }
              return out;
            };
            return {
              getState() { return JSON.parse(JSON.stringify(state)); },
              setState(patch) { state = deepMerge(state, patch); return this.getState(); }
            };
          }

          function applyScene(adapter, scene, choiceId, at) {
            const selected = scene.choices.find(choice => choice.id === choiceId);
            assert.ok(selected, `${scene.id} has choice ${choiceId}`);
            adapter.applyOperations(scene.effects?.work_object_ops || [], { scene_id: scene.id, choice_id: choiceId, at });
            adapter.applyOperations(selected.effects?.work_object_ops || [], { scene_id: scene.id, choice_id: choiceId, at });
          }

          const deliveryId = 'historie_arkiv_sak_leveranse_001';
          const accessId = 'historie_arkiv_sak_innsyn_001';
          const digitalId = 'historie_arkiv_sak_digital_bevaring_001';

          const job = mail('job', 'historie_arkiv_job_mottak_001');
          const people = mail('people', 'historie_arkiv_people_systemkontekst_001');
          const micro = mail('micro', 'historie_arkiv_micro_minimumsmetadata_001');
          const conflict = mail('conflict', 'historie_arkiv_conflict_innsyn_001');
          const followup = mail('followup', 'historie_arkiv_followup_innsyn_001');
          const event = mail('event', 'historie_arkiv_event_formatrisiko_001');
          const consequence = mail('consequence', 'historie_arkiv_consequence_migrering_001');

          assert.deepEqual(job.work_context.object_ids, [deliveryId]);
          assert.deepEqual(people.work_context.object_ids, [deliveryId]);
          assert.deepEqual(micro.work_context.object_ids, [deliveryId]);
          assert.deepEqual(conflict.work_context.object_ids, [accessId]);
          assert.deepEqual(followup.work_context.object_ids, [accessId]);
          assert.deepEqual(event.work_context.object_ids, [digitalId]);
          assert.deepEqual(consequence.work_context.object_ids, [digitalId]);
          assert.equal(job.effects.work_object_ops[0].event_id, people.effects.work_object_ops[0].event_id);
          assert.equal(job.effects.work_object_ops[0].event_id, micro.effects.work_object_ops[0].event_id);
          assert.equal(conflict.effects.work_object_ops[0].event_id, followup.effects.work_object_ops[0].event_id);
          assert.equal(event.effects.work_object_ops[0].event_id, consequence.effects.work_object_ops[0].event_id);
          assert.equal(job.effects.work_object_ops[0].work_object.shared, true, 'delivery is reusable shared work-object state');

          const state = makeState({ untouched: { sentinel: 1 } });
          const adapter = workWorldFactory.createAdapter(state);

          applyScene(adapter, job, 'A', '2026-08-23T08:00:00.000Z');
          applyScene(adapter, people, 'A', '2026-08-23T09:00:00.000Z');
          applyScene(adapter, micro, 'A', '2026-08-23T14:00:00.000Z');
          const delivery = adapter.getWorkObject(deliveryId);
          assert.equal(delivery.status, 'in_progress');
          assert.equal(delivery.phase, 'minimumsmetadata_operativt');
          assert.ok(delivery.flags.includes('systemspor_sikret'));
          assert.ok(delivery.flags.includes('minimumsmetadata_operativt'));
          assert.ok(!delivery.flags.includes('proveniens_uavklart'));
          assert.equal(delivery.shared, true);
          assert.ok(delivery.history.length >= 8, 'same delivery accumulates multi-scene history');

          applyScene(adapter, conflict, 'A', '2026-08-23T10:00:00.000Z');
          assert.equal(adapter.getWorkObject(accessId).status, 'awaiting_decision');
          applyScene(adapter, followup, 'A', '2026-08-23T16:00:00.000Z');
          const access = adapter.getWorkObject(accessId);
          assert.equal(access.status, 'closed');
          assert.equal(access.phase, 'closed');
          assert.equal(access.outcome, 'utleveringspakke_verifisert_mot_autorisert_beslutning');

          applyScene(adapter, event, 'A', '2026-08-23T13:00:00.000Z');
          applyScene(adapter, consequence, 'A', '2026-08-23T17:00:00.000Z');
          const digital = adapter.getWorkObject(digitalId);
          assert.equal(digital.status, 'partially_resolved');
          assert.equal(digital.phase, 'ett_autentisitetsavvik_ulost');
          assert.ok(digital.flags.includes('originalbitstrom_bevart'));
          assert.ok(digital.flags.includes('ett_autentisitetsavvik_ulost'));
          assert.ok(!digital.flags.includes('to_hashavvik'));
          assert.equal(digital.closed_at, null, 'unresolved authenticity stays visibly open');

          const world = adapter.getWorldState();
          assert.ok(world.active_object_ids.includes(deliveryId));
          assert.ok(world.active_object_ids.includes(digitalId));
          assert.ok(!world.active_object_ids.includes(accessId));
          assert.deepEqual(state.getState().untouched, { sentinel: 1 });

          // Replay of the same later scene must not duplicate work history.
          const historyCount = digital.history.length;
          applyScene(adapter, consequence, 'A', '2026-08-23T17:00:00.000Z');
          assert.equal(adapter.getWorkObject(digitalId).history.length, historyCount);

          const knowledgeCatalog = readJson(`data/Civication/mailFamilies/historie/knowledge/${roleScope}_knowledge.json`);
          const knowledgeMails = knowledgeCatalog.families.flatMap(family => family.mails || []);
          const placeTask = knowledgeMails.find(row => row.id === 'historie_arkiv_knowledge_akershus_001');
          const personTask = knowledgeMails.find(row => row.id === 'historie_arkiv_knowledge_knut_alvsson_001');
          assert.ok(placeTask && personTask);
          assert.deepEqual(placeTask.task_payload.return_context.related_person_ids, ['knut_alvsson', 'ole_hoiland', 'reidar_haaland']);
          assert.equal(personTask.task_payload.task_kind, 'history_go_person');
          assert.equal(personTask.task_payload.target_type, 'person');
          assert.equal(personTask.task_payload.person_id, 'knut_alvsson');
          assert.equal(personTask.task_payload.completion_mode, 'read_profile');

          const knut = readJson('data/people/historie/oslo/akershus_festning/knut_alvsson.json')[0];
          const ole = readJson('data/people/historie/oslo/akershus_festning/ole_hoiland.json')[0];
          const reidar = readJson('data/people/historie/oslo/akershus_festning/reidar_haaland.json')[0];
          assert.equal(knut.id, 'knut_alvsson');
          assert.equal(ole.id, 'ole_hoiland');
          assert.equal(reidar.id, 'reidar_haaland');
          for (const person of [knut, ole, reidar]) {
            assert.equal(person.placeId, 'akershus_festning');
            assert.equal(person.category, 'historie');
          }

          global.window = global;
          global.document = undefined;
          global.localStorage = { getItem() { return null; }, setItem() {}, removeItem() {} };
          vm.runInThisContext(fs.readFileSync(path.join(root, 'js/Civication/core/civicationTaskEngine.js'), 'utf8'));
          const normalized = global.CivicationTaskEngine.normalizeHistoryGoTaskPayload(personTask.task_payload);
          assert.equal(global.CivicationTaskEngine.isHistoryGoTaskPayload(normalized), true);
          assert.equal(normalized.person_id, 'knut_alvsson');
          assert.equal(normalized.target_id, 'knut_alvsson');

          const registry = readJson('data/Civication/compiledSceneRegistryV1.json');
          for (const [sceneId, objectId] of [
            [job.id, deliveryId], [people.id, deliveryId], [micro.id, deliveryId],
            [conflict.id, accessId], [followup.id, accessId], [event.id, digitalId], [consequence.id, digitalId]
          ]) {
            const entry = registry.entries.find(row => row.id === sceneId);
            assert.ok(entry, `${sceneId} compiled`);
            assert.deepEqual(entry.scene.work_context.object_ids, [objectId]);
            assert.ok(entry.scene.effects.work_object_ops.length >= 1);
            assert.ok(entry.compatibility_projection.effects.work_object_ops.length >= 1);
          }
          const compiledPersonTask = registry.entries.find(row => row.id === personTask.id);
          assert.ok(compiledPersonTask);
          assert.equal(compiledPersonTask.scene.interaction_mode, 'task');
          assert.equal(compiledPersonTask.scene.task_contract.task_id, 'historie_arkiv_history_go_knut_alvsson');
          assert.equal(compiledPersonTask.compatibility_projection.task_payload.person_id, 'knut_alvsson');

          console.log('✓ History archive persistent cases survive across scenes, close/retain uncertainty correctly, and reuse canonical History Go People');
          EOF

      - name: Register canonical History archive role model
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'data/Civication/roleModels/manifest.json';
          const rolePath = 'data/Civication/roleModels/historie/historie_arkiv_og_dokumentasjon.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!manifest.files.includes(rolePath)) {
            manifest.files.push(rolePath);
            manifest.files.sort((a, b) => a.localeCompare(b, 'en'));
            fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          }
          NODE

      - name: Regenerate Scenario People
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts

      - name: Regenerate compiled Scene Registry
        run: node scripts/build-civication-scene-registry.mjs --write

      - name: Regenerate Career Gameplay Matrix
        run: node scripts/audit-civication-career-gameplay.mjs --write

      - name: Verify History archive targeted playability
        run: node tests/civication-historie-arkiv-dokumentasjon-playability.test.js

      - name: Verify persistent case continuity and History Go People reuse
        run: node tests/civication-historie-arkiv-work-object-continuity.test.js

      - name: Run complete Civication suite
        run: node tests/run-civication-tests.mjs

      - name: Verify Scenario People synchronized
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check

      - name: Verify Scene Registry synchronized
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Verify Career Gameplay Matrix synchronized
        run: node scripts/audit-civication-career-gameplay.mjs --check

      - name: Verify Role World contract
        run: node tests/civication-role-world-contract.test.js

      - name: Typecheck web
        run: npm run typecheck:web

      - name: Typecheck scripts
        run: npm run typecheck:scripts

      - name: Typecheck tools
        run: npm run typecheck:tools

      - name: Build scripts
        run: npm run build:scripts

      - name: Verify browser build sync
        run: npm run build:web:check

      - name: Verify whitespace
        run: git diff --check

      - name: Refuse unrelated drift
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -vE '^(data/Civication/mailFamilies/historie/(job|people|micro|conflict|followup|event|consequence|knowledge)/historie_arkiv_og_dokumentasjon_(job|people|micro|conflict|followup|event|consequence|knowledge)\.json|tests/civication-historie-arkiv-work-object-continuity\.test\.js|data/Civication/roleModels/manifest\.json|data/Civication/scenarioPeople/generated/historie\.json|data/Civication/scenarioPeople_index\.json|data/Civication/compiledSceneRegistryV1\.json|data/Civication/careerGameplayMatrix\.json|reports/civication-career-gameplay-matrix\.md)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected drift:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit role integration and fresh projections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/Civication/mailFamilies/historie/job/historie_arkiv_og_dokumentasjon_job.json \
            data/Civication/mailFamilies/historie/people/historie_arkiv_og_dokumentasjon_people.json \
            data/Civication/mailFamilies/historie/micro/historie_arkiv_og_dokumentasjon_micro.json \
            data/Civication/mailFamilies/historie/conflict/historie_arkiv_og_dokumentasjon_conflict.json \
            data/Civication/mailFamilies/historie/followup/historie_arkiv_og_dokumentasjon_followup.json \
            data/Civication/mailFamilies/historie/event/historie_arkiv_og_dokumentasjon_event.json \
            data/Civication/mailFamilies/historie/consequence/historie_arkiv_og_dokumentasjon_consequence.json \
            data/Civication/mailFamilies/historie/knowledge/historie_arkiv_og_dokumentasjon_knowledge.json \
            tests/civication-historie-arkiv-work-object-continuity.test.js \
            data/Civication/roleModels/manifest.json \
            data/Civication/scenarioPeople/generated/historie.json \
            data/Civication/scenarioPeople_index.json \
            data/Civication/compiledSceneRegistryV1.json \
            data/Civication/careerGameplayMatrix.json \
            reports/civication-career-gameplay-matrix.md
          if git diff --cached --quiet; then
            echo "No writeback changes."
            exit 0
          fi
          git commit -m "Wire History archive persistent cases and History Go People"
          git push origin "HEAD:agent/civication-historie-arkiv-dokumentasjon-playability"
