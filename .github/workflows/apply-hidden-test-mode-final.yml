name: Apply hidden test mode final

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'js/debug/HGTestMode.js'
      - 'tests/hg-test-mode.test.js'
      - 'docs/HG_TEST_MODE.md'
      - '.github/workflows/apply-hidden-test-mode-final.yml'
      - 'index.html'
      - 'js/ui/dom.js'
      - 'css/components.css'
      - 'tests/header-search-menu.test.js'

concurrency:
  group: hidden-test-mode-final
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/hide-test-mode-final
          show-progress: false

      - name: Apply direct source changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'{label}: forventet én blokk, fant {text.count(old)}')
                  return text.replace(old, new, 1)
              if new and new in text:
                  return text
              if not new:
                  return text
              raise SystemExit(f'{label}: fant verken gammel eller ny blokk')

          index_path = Path('index.html')
          index = index_path.read_text()
          index = replace_once(
              index,
              '    <button id="btnUnlockAll" class="iconbtn" type="button" aria-label="Unlock all" title="Unlock all" data-hg-i18n-aria-label="ui.attr.unlockAll" data-hg-i18n-title="ui.attr.unlockAll">🔓</button>\n\n',
              '',
              'Unlock all-knapp'
          )
          index = replace_once(
              index,
              '          <label class="header-menu-action header-menu-toggle">\n            <span class="header-menu-action-icon" aria-hidden="true">🔓</span>\n            <span class="header-menu-action-label">Lås opp testmodus</span>\n            <span class="toggle">\n              <input id="openToggle" type="checkbox" aria-label="Lås opp testmodus" />\n              <span></span>\n            </span>\n          </label>\n',
              '',
              'testmodusbryter'
          )
          if '<script src="js/debug/HGTestMode.js"></script>' not in index:
              index = replace_once(
                  index,
                  '  <!-- App scripts -->\n  <script src="js/i18n.js"></script>',
                  '  <!-- App scripts -->\n  <script src="js/debug/HGTestMode.js"></script>\n  <script src="js/i18n.js"></script>',
                  'tidlig testmodus-runtime'
              )
          index_path.write_text(index)

          dom_path = Path('js/ui/dom.js')
          dom = dom_path.read_text()
          dom = dom.replace('  open:       document.getElementById("openToggle"),\n', '', 1)
          dom_path.write_text(dom)

          css_path = Path('css/components.css')
          css = css_path.read_text()
          css = css.replace('#btnUnlockAll{ opacity: .85; }\n#btnUnlockAll:hover{ opacity: 1; }\n\n', '', 1)
          css_path.write_text(css)

          test_path = Path('tests/header-search-menu.test.js')
          test = test_path.read_text()
          fixture_old = '  const document = {\n    readyState: "complete",'
          fixture_new = '  const document = {\n    readyState: "complete",\n    querySelector(selector) {\n      return String(selector).startsWith("link[") ? fakeElement() : null;\n    },'
          if fixture_new not in test:
              test = replace_once(test, fixture_old, fixture_new, 'header document-fixture')

          search_old = '  runScript("js/ui/search.js", { window, document, console });'
          search_new = '  class HTMLInputElement {\n    static [Symbol.hasInstance](value) { return value === input; }\n  }\n  class Element {\n    static [Symbol.hasInstance](value) { return !!value && typeof value.closest === "function"; }\n  }\n  class HTMLElement {\n    static [Symbol.hasInstance](value) { return !!value && typeof value === "object" && "dataset" in value; }\n  }\n\n  runScript("js/ui/search.js", { window, document, console, HTMLInputElement, Element, HTMLElement });'
          if search_new not in test:
              test = replace_once(test, search_old, search_new, 'search browser-fixture')

          menu_old = '''function testMenuLabelsDescribeTheirRealDestinations() {
            const index = fs.readFileSync(path.join(repoRoot, "index.html"), "utf8");

            assert.match(index, /class="header-menu-action[^\\"]*civication-nav-link"[\\s\\S]*aria-label="Civication"[\\s\\S]*<span class="header-menu-action-label">Civication<\\/span>/);
            assert.match(index, /<span class="header-menu-action-label">Lås opp testmodus<\\/span>[\\s\\S]*<input id="openToggle"/);
            assert.doesNotMatch(index, /<span class="header-menu-action-label">Vis åpne steder<\\/span>/);
          }
          '''.replace('          ', '')
          menu_new = '''function testMenuLabelsDescribeTheirRealDestinations() {
            const index = fs.readFileSync(path.join(repoRoot, "index.html"), "utf8");

            assert.match(index, /class="header-menu-action[^\\"]*civication-nav-link"[\\s\\S]*aria-label="Civication"[\\s\\S]*<span class="header-menu-action-label">Civication<\\/span>/);
            assert.doesNotMatch(index, /Lås opp testmodus/);
            assert.doesNotMatch(index, /id="openToggle"/);
            assert.doesNotMatch(index, /id="btnUnlockAll"/);
            assert.match(index, /<script src="js\\/debug\\/HGTestMode\\.js"><\\/script>/);
          }
          '''.replace('          ', '')
          if menu_new not in test:
              test = replace_once(test, menu_old, menu_new, 'header menytest')
          test_path.write_text(test)
          PY

      - name: Test direct changes
        run: |
          node tests/hg-test-mode.test.js
          node tests/header-search-menu.test.js
          node --check js/debug/HGTestMode.js
          node --check js/ui/dom.js

      - name: Commit direct changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/ui/dom.js css/components.css tests/header-search-menu.test.js
          if git diff --cached --quiet; then
            echo "Direct changes already applied."
            exit 0
          fi
          git commit -m "Remove public test mode controls"
          git push
