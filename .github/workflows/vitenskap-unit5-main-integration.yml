name: Vitenskap Unit 5 integrate current main

on:
  push:
    branches: [agent/vitenskap-medicine-biomedicine-public-health-fulltext]
    paths:
      - '.github/workflows/vitenskap-unit5-main-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitenskap-medicine-biomedicine-public-health-fulltext
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lock branch and current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "BRANCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git fetch origin main:refs/remotes/origin/main
          echo "MAIN_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          test "$(git merge-base HEAD origin/main)" = "cc61a8cc70007ef4d32cc33385816ef1cb8100c9"

      - name: Guard shared Vitenskap ownership on main
        env:
          BASE_SHA: cc61a8cc70007ef4d32cc33385816ef1cb8100c9
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const assert = require('node:assert/strict');
          const show = (ref, path) => execFileSync('git', ['show', `${ref}:${path}`], { encoding: 'utf8' });
          const json = (ref, path) => JSON.parse(show(ref, path));
          const base = process.env.BASE_SHA;

          const mainRegistry = json('origin/main', 'data/fagverk/fagverk_registry.json');
          const baseRegistry = json(base, 'data/fagverk/fagverk_registry.json');
          assert.deepEqual(mainRegistry.subjects.vitenskap, baseRegistry.subjects.vitenskap,
            'main har nye Vitenskap-registryendringer etter Unit 5 merge-base; stopp før semantisk merge');

          const mainStatus = json('origin/main', 'data/fagverk/subject_status.json');
          const baseStatus = json(base, 'data/fagverk/subject_status.json');
          const byId = (doc, id) => doc.subjects.find((x) => x.id === id);
          assert.deepEqual(byId(mainStatus, 'vitenskap'), byId(baseStatus, 'vitenskap'),
            'main har nye Vitenskap-statusendringer etter Unit 5 merge-base; stopp før semantisk merge');

          const block = (source) => {
            const start = source.indexOf("  const vitenskap = s.subjects.find((x) => x.id === 'vitenskap');");
            const end = source.indexOf('\n\n  // Filosofi', start);
            assert.ok(start >= 0 && end > start, 'Fant ikke Vitenskap-blokken i shared inventory-test');
            return source.slice(start, end);
          };
          assert.equal(block(show('origin/main', 'tests/fagverk-subject-inventory.test.mjs')),
                       block(show(base, 'tests/fagverk-subject-inventory.test.mjs')),
            'main har nye Vitenskap-assertions i shared inventory-test; stopp før blokkmerge');
          NODE

      - name: Merge current main and resolve only known shared files
        run: |
          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e
          echo "git merge exit code: $merge_rc"
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const assert = require('node:assert/strict');
          const branch = process.env.BRANCH_SHA;
          const show = (ref, path) => execFileSync('git', ['show', `${ref}:${path}`], { encoding: 'utf8' });
          const writeJson = (path, value) => fs.writeFileSync(path, JSON.stringify(value, null, 2) + '\n');
          const byId = (doc, id) => doc.subjects.findIndex((x) => x.id === id);

          const unresolved = execFileSync('git', ['diff', '--name-only', '--diff-filter=U'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean);
          const allowed = new Set([
            'data/fagverk/fagverk_registry.json',
            'data/fagverk/fagverk_release.json',
            'data/fagverk/subject_status.json',
            'reports/fagverk/general-engine-audit.json',
            'tests/fagverk-subject-inventory.test.mjs'
          ]);
          const unexpected = unresolved.filter((p) => !allowed.has(p));
          assert.deepEqual(unexpected, [], `Uventede mergekonflikter: ${unexpected.join(', ')}`);

          const mainRegistry = JSON.parse(show('origin/main', 'data/fagverk/fagverk_registry.json'));
          const branchRegistry = JSON.parse(show(branch, 'data/fagverk/fagverk_registry.json'));
          mainRegistry.subjects.vitenskap = branchRegistry.subjects.vitenskap;
          writeJson('data/fagverk/fagverk_registry.json', mainRegistry);

          const mainStatus = JSON.parse(show('origin/main', 'data/fagverk/subject_status.json'));
          const branchStatus = JSON.parse(show(branch, 'data/fagverk/subject_status.json'));
          const mi = byId(mainStatus, 'vitenskap');
          const bi = byId(branchStatus, 'vitenskap');
          assert.ok(mi >= 0 && bi >= 0, 'Mangler Vitenskap i subject_status');
          mainStatus.subjects[mi] = branchStatus.subjects[bi];
          writeJson('data/fagverk/subject_status.json', mainStatus);

          const extract = (source) => {
            const start = source.indexOf("  const vitenskap = s.subjects.find((x) => x.id === 'vitenskap');");
            const end = source.indexOf('\n\n  // Filosofi', start);
            assert.ok(start >= 0 && end > start, 'Fant ikke Vitenskap-blokken i shared inventory-test');
            return { start, end, text: source.slice(start, end) };
          };
          const mainTest = show('origin/main', 'tests/fagverk-subject-inventory.test.mjs');
          const branchTest = show(branch, 'tests/fagverk-subject-inventory.test.mjs');
          const m = extract(mainTest);
          const b = extract(branchTest);
          fs.writeFileSync('tests/fagverk-subject-inventory.test.mjs', mainTest.slice(0, m.start) + b.text + mainTest.slice(m.end));

          // Generated artifacts are regenerated from the merged source state below.
          fs.writeFileSync('data/fagverk/fagverk_release.json', show('origin/main', 'data/fagverk/fagverk_release.json'));
          fs.writeFileSync('reports/fagverk/general-engine-audit.json', show('origin/main', 'reports/fagverk/general-engine-audit.json'));
          NODE
          git add data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            data/fagverk/subject_status.json \
            reports/fagverk/general-engine-audit.json \
            tests/fagverk-subject-inventory.test.mjs
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m 'Merge current main into Vitenskap Unit 5'

      - name: Regenerate deterministic merged artifacts
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-fagverk-vitenskap-breadth-reconciliation.mjs --write-report --no-check-report
          node scripts/audit-fagverk-vitenskap-pilot.mjs --write-report --no-check-report
          node scripts/audit-fagverk-vitenskap-university-readiness.mjs --write-report --no-check-report
          node scripts/audit-fagverk-subject-inventory.mjs --write-report --no-check-report
          node scripts/audit-fagverk-general-engine.mjs --write-report --no-check-report

      - name: Validate Vitenskap through final-audit-pending state
        run: |
          node scripts/audit-fagverk-vitenskap-breadth-reconciliation.mjs
          node scripts/audit-fagverk-vitenskap-pilot.mjs
          node scripts/audit-fagverk-vitenskap-university-readiness.mjs
          node scripts/audit-fagverk-vitenskap-unit1.mjs
          node scripts/audit-fagverk-vitenskap-mathematics-source-brief.mjs
          node scripts/audit-fagverk-vitenskap-mathematics-fulltext.mjs
          node scripts/audit-fagverk-vitenskap-physics-astronomy-source-brief.mjs
          node scripts/audit-fagverk-vitenskap-physics-astronomy-fulltext.mjs
          node scripts/audit-fagverk-vitenskap-chemistry-material-science-source-brief.mjs
          node scripts/audit-fagverk-vitenskap-chemistry-material-science-fulltext.mjs
          node scripts/audit-fagverk-vitenskap-medicine-biomedicine-public-health-source-brief.mjs
          node scripts/audit-fagverk-vitenskap-medicine-biomedicine-public-health-fulltext.mjs
          node scripts/build-fagverk-release-manifest.mjs --check

      - name: Validate permanent Vitenskap tests
        run: |
          node --test tests/fagverk-vitenskap-breadth-reconciliation.test.mjs
          node --test tests/fagverk-vitenskap-pilot.test.mjs
          node --test tests/fagverk-vitenskap-university-readiness.test.mjs
          node --test tests/fagverk-vitenskap-unit1.test.mjs
          node --test tests/fagverk-vitenskap-mathematics-source-brief.test.mjs
          node --test tests/fagverk-vitenskap-mathematics-fulltext.test.mjs
          node --test tests/fagverk-vitenskap-physics-astronomy-source-brief.test.mjs
          node --test tests/fagverk-vitenskap-physics-astronomy-fulltext.test.mjs
          node --test tests/fagverk-vitenskap-chemistry-material-science-source-brief.test.mjs
          node --test tests/fagverk-vitenskap-chemistry-material-science-fulltext.test.mjs
          node --test tests/fagverk-vitenskap-medicine-biomedicine-public-health-source-brief.test.mjs
          node --test tests/fagverk-vitenskap-medicine-biomedicine-public-health-fulltext.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs

      - name: Validate shared Fagverk, Film preservation and nested Teknologi
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node scripts/audit-film-tv-holistic-completion-v1.mjs
          node --test tests/film-tv-holistic-completion-v1.test.mjs
          node --test tests/vitenskap-teknologi-category-contract.test.mjs
          node tools/build-teknologi-editorial-v3.mjs --check
          node tools/validate-teknologi-foundation.mjs
          node tools/validate-teknologi-quality-v2_1.mjs
          node tools/validate-teknologi-ontology-v2_2.mjs
          node tools/validate-teknologi-evidence-v2_3.mjs
          node scripts/validate-teknologi-editorial-v3.mjs
          git diff --check

      - name: Commit merged generated artifacts and remove integration workflow
        run: |
          git add data/fagverk/fagverk_release.json \
            reports/fagverk/vitenskap-breadth-reconciliation-audit.json \
            reports/fagverk/vitenskap-pilot-audit.json \
            reports/fagverk/vitenskap-university-readiness-audit.json \
            reports/fagverk/subject-baseline.json \
            reports/fagverk/general-engine-audit.json
          git diff --cached --quiet || git commit -m 'Regenerate Fagverk reports after Vitenskap main integration'
          git rm .github/workflows/vitenskap-unit5-main-integration.yml
          git commit -m 'Remove temporary Vitenskap main integration workflow'
          git push origin HEAD:agent/vitenskap-medicine-biomedicine-public-health-fulltext
