name: Temporary Bærums Verk coordinate source probe

on:
  push:
    branches:
      - agent/akershus-baerums-verk-production

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/akershus-baerums-verk-production
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize coordinate sources
        shell: bash
        run: |
          set -euo pipefail
          OUT='reports/akershus-coordinate-baerums-verk-source-probe'
          mkdir -p "$OUT"
          UA='History-Go coordinate research (Paradispartiet/History-Go)'

          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'q=Bærums Verk, Bærum, Norge' \
            --data 'format=jsonv2' --data 'polygon_geojson=1' --data 'extratags=1' \
            --data 'namedetails=1' --data 'limit=20' \
            | tee "$OUT/nominatim-baerums-verk.json" >/dev/null

          sleep 1
          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'q=Bærums Verk jernverk, Bærum, Norge' \
            --data 'format=jsonv2' --data 'polygon_geojson=1' --data 'extratags=1' \
            --data 'namedetails=1' --data 'limit=20' \
            | tee "$OUT/nominatim-baerums-verk-jernverk.json" >/dev/null

          sleep 1
          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'q=Klokkeboden, Bærums Verk, Norge' \
            --data 'format=jsonv2' --data 'polygon_geojson=1' --data 'extratags=1' \
            --data 'namedetails=1' --data 'limit=20' \
            | tee "$OUT/nominatim-klokkeboden.json" >/dev/null

          sleep 1
          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'q=Ovnsmuseet, Bærums Verk, Norge' \
            --data 'format=jsonv2' --data 'polygon_geojson=1' --data 'extratags=1' \
            --data 'namedetails=1' --data 'limit=20' \
            | tee "$OUT/nominatim-ovnsmuseet.json" >/dev/null

          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://ws.geonorge.no/adresser/v1/sok' \
            --data-urlencode 'sok=Verksgata 15 Bærums Verk' \
            --data 'kommunenummer=3201' --data 'treffPerSide=30' \
            | tee "$OUT/geonorge-verksgata-15.json" >/dev/null

          curl --fail --silent --show-error --location --user-agent "$UA" \
            'https://api.openstreetmap.org/api/0.6/map?bbox=10.493,59.933,10.510,59.945' \
            | tee "$OUT/osm-baerums-verk-bbox.xml" >/dev/null

          python - <<'PY' | tee "$OUT/source-summary.txt" >/dev/null
          import json
          import math
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path('reports/akershus-coordinate-baerums-verk-source-probe')
          legacy = (59.93839, 10.50178)

          def distance_m(a, b):
              lat1, lon1 = map(math.radians, a)
              lat2, lon2 = map(math.radians, b)
              dlat = lat2 - lat1
              dlon = lon2 - lon1
              h = math.sin(dlat / 2) ** 2 + math.cos(lat1) * math.cos(lat2) * math.sin(dlon / 2) ** 2
              return 6371000 * 2 * math.asin(math.sqrt(h))

          print(f'legacy_lat={legacy[0]:.12f}')
          print(f'legacy_lon={legacy[1]:.12f}')

          for filename in [
              'nominatim-baerums-verk.json',
              'nominatim-baerums-verk-jernverk.json',
              'nominatim-klokkeboden.json',
              'nominatim-ovnsmuseet.json',
          ]:
              data = json.loads((out / filename).read_text())
              print(f'QUERY {filename} results={len(data)}')
              for row in data:
                  point = (float(row['lat']), float(row['lon']))
                  print('NOMINATIM ' + json.dumps({
                      'name': row.get('name'),
                      'display_name': row.get('display_name'),
                      'category': row.get('category'),
                      'type': row.get('type'),
                      'osm_type': row.get('osm_type'),
                      'osm_id': row.get('osm_id'),
                      'lat': point[0],
                      'lon': point[1],
                      'distance_from_legacy_m': round(distance_m(legacy, point), 1),
                      'extratags': row.get('extratags', {}),
                  }, ensure_ascii=False, sort_keys=True))

          address = json.loads((out / 'geonorge-verksgata-15.json').read_text())
          print(f'address_total={address.get("metadata", {}).get("totaltAntallTreff")}')
          for row in address.get('adresser', []):
              rp = row.get('representasjonspunkt') or {}
              if 'lat' not in rp or 'lon' not in rp:
                  continue
              point = (float(rp['lat']), float(rp['lon']))
              print('ADDRESS ' + json.dumps({
                  'data': row,
                  'distance_from_legacy_m': round(distance_m(legacy, point), 1),
              }, ensure_ascii=False, sort_keys=True))

          root = ET.parse(out / 'osm-baerums-verk-bbox.xml').getroot()
          nodes = {
              node.attrib['id']: (float(node.attrib['lat']), float(node.attrib['lon']))
              for node in root.findall('node')
          }

          def tags(element):
              return {tag.attrib['k']: tag.attrib['v'] for tag in element.findall('tag')}

          def centroid(points):
              if not points:
                  return None
              if len(points) >= 4 and points[0] == points[-1]:
                  xy = [(lon, lat) for lat, lon in points]
                  twice_area = 0.0
                  cx = 0.0
                  cy = 0.0
                  for (x1, y1), (x2, y2) in zip(xy, xy[1:]):
                      cross = x1 * y2 - x2 * y1
                      twice_area += cross
                      cx += (x1 + x2) * cross
                      cy += (y1 + y2) * cross
                  if abs(twice_area) > 1e-15:
                      return (cy / (3 * twice_area), cx / (3 * twice_area))
              return (
                  sum(p[0] for p in points) / len(points),
                  sum(p[1] for p in points) / len(points),
              )

          relevant = []
          interesting_keys = {
              'name', 'historic', 'building', 'tourism', 'amenity', 'man_made',
              'industrial', 'heritage', 'ref:bygningsnr', 'shop', 'craft', 'waterway'
          }

          for node in root.findall('node'):
              t = tags(node)
              if not t:
                  continue
              point = nodes[node.attrib['id']]
              if t.get('name') or any(k in t for k in ('historic', 'tourism', 'industrial', 'man_made')):
                  relevant.append({
                      'type': 'node', 'id': node.attrib['id'], 'lat': point[0], 'lon': point[1],
                      'distance_from_legacy_m': round(distance_m(legacy, point), 1),
                      'tags': {k: v for k, v in t.items() if k in interesting_keys},
                  })

          for way in root.findall('way'):
              t = tags(way)
              refs = [nd.attrib['ref'] for nd in way.findall('nd')]
              points = [nodes[r] for r in refs if r in nodes]
              point = centroid(points)
              if not point:
                  continue
              if t.get('name') or any(k in t for k in ('historic', 'tourism', 'industrial', 'man_made', 'heritage')):
                  relevant.append({
                      'type': 'way', 'id': way.attrib['id'], 'lat': point[0], 'lon': point[1],
                      'node_count': len(points),
                      'distance_from_legacy_m': round(distance_m(legacy, point), 1),
                      'tags': {k: v for k, v in t.items() if k in interesting_keys},
                  })

          relevant.sort(key=lambda row: row['distance_from_legacy_m'])
          print('bbox_relevant=' + json.dumps(relevant[:120], ensure_ascii=False, sort_keys=True))
          PY

          rm -f .github/workflows/temporary-coordinate-source-probe-baerums-verk.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT" .github/workflows/temporary-coordinate-source-probe-baerums-verk.yml
          if git diff --cached --quiet; then
            echo 'No source-probe changes.'
          else
            git commit -m 'Materialize Bærums Verk coordinate sources'
            git push origin HEAD:agent/akershus-baerums-verk-production
          fi
