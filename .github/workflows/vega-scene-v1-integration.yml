name: Vega Scene v1 integration and browser smoke
on:
  push:
    branches:
      - content/oslo-aav-vega-scene-v1-20261027
    paths:
      - '.github/workflows/vega-scene-v1-integration.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vega-scene-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate:
    if: github.ref == 'refs/heads/content/oslo-aav-vega-scene-v1-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/oslo-aav-vega-scene-v1-20261027
          fetch-depth: 120
          persist-credentials: true
      - name: Sync main retaining all unrelated Places
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for file in "${conflicts[@]}"; do
              case "$file" in
                data/fag/fag_manifest.json|data/fagverk/fagverk_registry.json|data/quiz/manifest.json|data/quizcards/scenekunst/manifest.json)
                  git checkout --theirs -- "$file" ;;
                *) echo "Unexpected conflict: $file" >&2; exit 1;;
              esac
            done
            node scripts/reconcile-vega-scene-registries.mjs
            git add data/fag/fag_manifest.json data/fagverk/fagverk_registry.json data/quiz/manifest.json data/quizcards/scenekunst/manifest.json
            git commit -m "Merge latest main preserving Vega Scene registration"
          fi
          node scripts/reconcile-vega-scene-registries.mjs
          git add data/fag/fag_manifest.json data/fagverk/fagverk_registry.json data/quiz/manifest.json data/quizcards/scenekunst/manifest.json
          if ! git diff --cached --quiet; then git commit -m "Reconcile Vega Scene registries"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate quiz context
        run: node scripts/build-quiz-production-context.mjs --category scenekunst --target vega_scene --output data/quiz/production_context/scenekunst/vega_scene.json
      - name: Generate canonical Knowledge
        run: npm run knowledge:canonical:write
      - name: Sync QuizCard Knowledge
        run: node scripts/sync-vega-scene-quizcard-knowledge.mjs
      - name: Generate Place-open and Fagverk release
        run: |
          npm run place-open:build
          node scripts/materialize-natur-final-registry.mjs
          node scripts/build-fagverk-release-manifest.mjs
      - name: Run targeted unit tests
        run: node --test tests/vega-scene-v1-parity.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify app on phone and desktop
        run: node tests/vega-scene-real-app-browser-20261027.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vega_scene-browser
          path: artifacts/vega_scene-browser/
          if-no-files-found: ignore
      - name: Push generated artifacts only
        shell: bash
        run: |
          set -euo pipefail
          git add data/quiz/production_context/scenekunst/vega_scene.json
          git add data/quiz/scenekunst/vega_scene_sets.json data/quizcards/scenekunst/vega_scene_quizcard_v1.json
          git add data/knowledge/knowledge_units.generated.json reports/knowledge-id-backfill.json
          git add data/runtime/place-open/vega_scene.json data/fagverk/fagverk_release.json
          if ! git diff --cached --quiet; then git commit -m "Vega Scene: publish canonical quiz, Knowledge and runtime"; fi
          git push origin HEAD:content/oslo-aav-vega-scene-v1-20261027

# Require category-scoped registry reconciliation before quiz context generation.
