name: Fagverk IA v3 Kunst legacy audit probe

on:
  pull_request:
    paths:
      - '.github/workflows/fagverk-ia-v3-kunst-legacy-audit-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fagverk-ia-v3-kunst-legacy-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and validate Kunst legacy audit
        run: |
          node --check scripts/audit-fagverk-kunst-legacy-theory.mjs
          node scripts/audit-fagverk-kunst-legacy-theory.mjs --write-report
          node scripts/audit-fagverk-kunst-legacy-theory.mjs
          node --test tests/fagverk-kunst-legacy-theory-audit.test.mjs
          node --test tests/kunst-theory-integrity.test.mjs
          node scripts/audit-fagverk-kunst-complete.mjs
      - name: Commit report and remove probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fagverk-ia-v3-kunst-legacy-audit-probe.yml
          git add reports/fagverk/kunst-legacy-theory-audit.json
          if git diff --cached --quiet; then
            echo 'No generated audit changes to commit.'
            exit 1
          fi
          git commit -m 'Generate Kunst legacy theory audit'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
