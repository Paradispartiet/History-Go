name: Apply Nedre Foss source holdback cleanup

on:
  push:
    branches: [agent/cleanup-nedre-foss-source-holdbacks]
    paths:
      - '.github/workflows/nedre-foss-source-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cleanup-nedre-foss-source-holdbacks
          fetch-depth: 0

      - name: Resolve stale source holdbacks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/nedre-foss-source-cleanup/validation

          python - <<'PY'
          import json
          from pathlib import Path

          def read(path):
              return json.loads(Path(path).read_text())

          def write(path, value):
              Path(path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n')

          place_path = Path('data/places/natur/oslo/places_oslo_natur_akerselvarute/nedre_foss.json')
          place = read(place_path)
          assert place['id'] == 'nedre_foss'
          assert place['year'] == 1220

          unresolved = []
          for note in place.get('research_notes', []):
              if note.get('id') in {'nedre_foss_current_businesses', 'nedre_foss_precise_geology_claims'}:
                  unresolved.append(note)
          assert {x['id'] for x in unresolved} == {'nedre_foss_current_businesses', 'nedre_foss_precise_geology_claims'}
          place['research_notes'] = unresolved

          external_links = place.setdefault('externalLinks', [])
          additions = [
              {
                  'type': 'reference',
                  'label': 'Oslo kommune – Nedre Foss park',
                  'url': 'https://www.oslo.kommune.no/natur-kultur-og-fritid/tur-og-friluftsliv/parker-og-lekeplasser/nedre-foss-park',
                  'lang': 'nb',
                  'verifiedAt': '2026-07-19'
              },
              {
                  'type': 'reference',
                  'label': 'Store norske leksikon – Friedrich Grüner',
                  'url': 'https://snl.no/Friedrich_Gr%C3%BCner',
                  'lang': 'nb',
                  'verifiedAt': '2026-07-19'
              }
          ]
          existing_urls = {x.get('url') for x in external_links}
          for link in additions:
              if link['url'] not in existing_urls:
                  external_links.append(link)
                  existing_urls.add(link['url'])

          place['source_summary'] = {
              'safe_sources': [link['label'] for link in external_links],
              'resolved_research': [
                  'Møllekronologien som brukes app-facing er nå kildekontrollert mot Store norske leksikon, Oslo byleksikon og Industrimuseum.',
                  'Bygningsspesifikke hovedfakta om hovedbygningen og den tidligere kornsiloen er nå kildekontrollert.',
                  'Friedrich Grüners kjøp av Nedre Foss i 1672 er kildekontrollert.'
              ],
              'remaining_holdbacks': [
                  'Skiftende nåværende virksomheter skal ikke hardkodes uten ny kildekontroll.',
                  'Presise geologipåstander krever egen geologisk fagkilde.'
              ]
          }
          write(place_path, place)

          article_path = Path('data/leksikon/places/oslo/historie/leksikon_oslo_historie_nedre_foss.json')
          article = read(article_path)
          assert article['place_id'] == 'nedre_foss'
          interpretation = article.setdefault('interpretation', {})
          interpretation['counterpoints'] = [
              '1220 er første dokumenterte omtale av kverna i kildene som brukes her, ikke nødvendigvis et sikkert etableringsår for den første mølla på stedet.',
              'Nåværende virksomheter i området er tidssensitive og bør ikke hardkodes uten ny kildekontroll.',
              'Presise geologipåstander om synlig berg ved fossen krever en egen geologisk fagkilde.'
          ]
          write(article_path, article)

          person_path = Path('data/people/historie/oslo/akerselva/friedrich_gruner.json')
          people = read(person_path)
          assert len(people) == 1 and people[0]['id'] == 'friedrich_gruner'
          person = people[0]
          person['source_urls'] = [
              'https://snl.no/Friedrich_Gr%C3%BCner',
              'https://snl.no/Foss_-_Oslo',
              'https://oslobyleksikon.no/side/Foss_g%C3%A5rd'
          ]
          person['externalLinks'] = [
              {
                  'type': 'reference',
                  'label': 'Store norske leksikon – Friedrich Grüner',
                  'url': 'https://snl.no/Friedrich_Gr%C3%BCner',
                  'lang': 'nb',
                  'verifiedAt': '2026-07-19'
              },
              {
                  'type': 'reference',
                  'label': 'Store norske leksikon – Foss (Oslo)',
                  'url': 'https://snl.no/Foss_-_Oslo',
                  'lang': 'nb',
                  'verifiedAt': '2026-07-19'
              },
              {
                  'type': 'reference',
                  'label': 'Oslo byleksikon – Foss gård',
                  'url': 'https://oslobyleksikon.no/side/Foss_g%C3%A5rd',
                  'lang': 'nb',
                  'verifiedAt': '2026-07-19'
              }
          ]
          write(person_path, people)

          report = '''# Nedre Foss – source holdback cleanup\n\nDato: 2026-07-19\n\n## Formål\n\nPR #2530 fylte Nedre Foss med kildebelagt møllekronologi, bygningshistorie og Friedrich Grüner-relasjon. Eldre research-holdbacks i place-data og leksikon stod likevel igjen og sa at de samme opplysningene fortsatt manglet kildekontroll.\n\nDenne cleanupen fjerner den interne selvmotsigelsen uten å endre canonical år, koordinater, radius, rundinger eller gameplay.\n\n## Endringer\n\n- fjerner de to løste research-holdbackene for møllekronologi og bygningshistorie\n- beholder de reelt uløste holdbackene for skiftende virksomheter og presis geologi\n- oppdaterer `source_summary` til faktisk sluttstatus\n- erstatter det foreldede leksikon-counterpointet med kildekritisk presisering om at 1220 er første dokumenterte omtale, ikke nødvendigvis etableringsåret\n- legger eksplisitte kildelenker på canonical `friedrich_gruner`\n- legger Oslo kommune og SNL Friedrich Grüner inn blant stedets eksterne kilder\n'''
          Path('reports/nedre-foss-source-cleanup.md').write_text(report)
          PY

          npm ci --silent
          node tests/nedre-foss-rounds-batch1.test.js | tee reports/nedre-foss-source-cleanup/validation/nedre-foss-targeted-test.txt
          node tests/place-card-rounds-runtime-audit.test.js | tee reports/nedre-foss-source-cleanup/validation/place-card-rounds-runtime.txt
          npm run audit:people-of-places | tee reports/nedre-foss-source-cleanup/validation/people-of-places.txt
          git checkout origin/main -- reports/people-of-places-status.json reports/people-of-places-status.md 2>/dev/null || true

          node - <<'NODE' | tee reports/nedre-foss-source-cleanup/validation/json-parse.txt
          const fs = require('fs');
          for (const file of [
            'data/places/natur/oslo/places_oslo_natur_akerselvarute/nedre_foss.json',
            'data/leksikon/places/oslo/historie/leksikon_oslo_historie_nedre_foss.json',
            'data/people/historie/oslo/akerselva/friedrich_gruner.json'
          ]) JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log('JSON parse OK');
          NODE

          git diff --check | tee reports/nedre-foss-source-cleanup/validation/git-diff-check.txt
          rm -f .github/workflows/nedre-foss-source-cleanup.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: resolve stale Nedre Foss source holdbacks'
          git push origin HEAD:agent/cleanup-nedre-foss-source-holdbacks
