name: Film TV Unit 15 monotonic reconcile

on:
  push:
    branches:
      - agent/film-tv-unit15-cultural-heritage-canon-stars-memory-source-brief

permissions:
  contents: write

jobs:
  patch-monotonic-gates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-tv-unit15-cultural-heritage-canon-stars-memory-source-brief
          fetch-depth: 0

      - name: Patch Unit 14 gates for legal Unit 15 advancement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          unit15 = "cultural_heritage_canon_stars_memory_source_brief_complete_full_chapter_production"

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected pattern missing in {path}: {old[:120]}")
              p.write_text(text.replace(old, new, 1))

          source = "scripts/brief-film-tv-archive-preservation-access-authenticity-sources-v1.mjs"
          replace_exact(
              source,
              "const FULLTEXT_GATE = 'archive_preservation_access_authenticity_full_chapter_complete_next_unit_source_brief';\nconst UNIT_FOURTEEN_OR_LATER_GATES = new Set([OUTPUT_GATE, FULLTEXT_GATE]);",
              f"const FULLTEXT_GATE = 'archive_preservation_access_authenticity_full_chapter_complete_next_unit_source_brief';\nconst UNIT_FIFTEEN_SOURCE_GATE = '{unit15}';\nconst UNIT_FOURTEEN_OR_LATER_GATES = new Set([OUTPUT_GATE, FULLTEXT_GATE, UNIT_FIFTEEN_SOURCE_GATE]);"
          )
          replace_exact(
              source,
              "  const laterGateAlreadyActive = currentGate === FULLTEXT_GATE;",
              "  const laterGateAlreadyActive = [FULLTEXT_GATE, UNIT_FIFTEEN_SOURCE_GATE].includes(currentGate);"
          )
          replace_exact(
              source,
              "    current_status_is_input_output_or_known_later_gate: [INPUT_GATE, OUTPUT_GATE, FULLTEXT_GATE].includes(currentGate),",
              "    current_status_is_input_output_or_known_later_gate: [INPUT_GATE, OUTPUT_GATE, FULLTEXT_GATE, UNIT_FIFTEEN_SOURCE_GATE].includes(currentGate),"
          )

          materializer = Path("scripts/materialize-film-tv-archive-preservation-access-authenticity-fulltext-v1.mjs")
          text = materializer.read_text()
          old = "const OUTPUT_GATE = 'archive_preservation_access_authenticity_full_chapter_complete_next_unit_source_brief';"
          new = old + f"\nconst UNIT_FIFTEEN_SOURCE_GATE = '{unit15}';"
          if old not in text or "const UNIT_FIFTEEN_SOURCE_GATE" in text:
              raise SystemExit("Unexpected Unit 14 materializer gate constants")
          text = text.replace(old, new, 1)
          old = "  if (![SOURCE_BRIEF_GATE, OUTPUT_GATE].includes(filmStatus.nextGate)) throw new Error(`Uventet Film & TV-gate for enhet 14 fulltekst: ${filmStatus.nextGate}`);"
          new = "  const laterGateAlreadyActive = filmStatus.nextGate === UNIT_FIFTEEN_SOURCE_GATE;\n  if (![SOURCE_BRIEF_GATE, OUTPUT_GATE, UNIT_FIFTEEN_SOURCE_GATE].includes(filmStatus.nextGate)) throw new Error(`Uventet Film & TV-gate for enhet 14 fulltekst: ${filmStatus.nextGate}`);"
          if old not in text:
              raise SystemExit("Unit 14 materializer status guard missing")
          text = text.replace(old, new, 1)
          text, count = re.subn(
              r"(?m)^  registry\.subjects\.film_tv\.canonicalModel\.note = (.+);$",
              r"  if (!laterGateAlreadyActive) registry.subjects.film_tv.canonicalModel.note = \1;",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Unit 14 materializer registry-note guard patch failed")
          pattern = re.compile(
              r"  filmStatus\.editorialStatus = 'chapters_in_progress';\n"
              r"  filmStatus\.nextGate = OUTPUT_GATE;\n"
              r"  filmStatus\.note = (.+);\n"
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit("Unit 14 materializer status write block missing")
          replacement = (
              "  if (!laterGateAlreadyActive) {\n"
              "    filmStatus.editorialStatus = 'chapters_in_progress';\n"
              "    filmStatus.nextGate = OUTPUT_GATE;\n"
              f"    filmStatus.note = {match.group(1)};\n"
              "  }\n"
          )
          text = pattern.sub(replacement, text, count=1)
          materializer.write_text(text)

          audit = "scripts/audit-film-tv-archive-preservation-access-authenticity-fulltext-v1.mjs"
          replace_exact(
              audit,
              "const OUTPUT_GATE = 'archive_preservation_access_authenticity_full_chapter_complete_next_unit_source_brief';",
              f"const OUTPUT_GATE = 'archive_preservation_access_authenticity_full_chapter_complete_next_unit_source_brief';\nconst UNIT_FIFTEEN_SOURCE_GATE = '{unit15}';"
          )
          replace_exact(
              audit,
              "      && filmStatus?.nextGate === OUTPUT_GATE",
              "      && [OUTPUT_GATE, UNIT_FIFTEEN_SOURCE_GATE].includes(filmStatus?.nextGate)"
          )
          PY

      - name: Commit compatibility patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No compatibility changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/brief-film-tv-archive-preservation-access-authenticity-sources-v1.mjs \
            scripts/materialize-film-tv-archive-preservation-access-authenticity-fulltext-v1.mjs \
            scripts/audit-film-tv-archive-preservation-access-authenticity-fulltext-v1.mjs
          git commit -m "Make Film TV Unit 14 gates monotonic for Unit 15"
          git push origin HEAD:agent/film-tv-unit15-cultural-heritage-canon-stars-memory-source-brief
