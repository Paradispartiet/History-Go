name: Kvadraturen Hotel du Nord one-time Place-open runtime regeneration
on:
  push:
    branches:
      - research/oslo-sentrum-kvadraturen-v1-six-20261023
    paths:
      - '.github/workflows/kvadraturen-hotel-runtime-sync-temp.yml'
permissions:
  contents: write
concurrency:
  group: kvadraturen-hotel-runtime-sync-once
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-kvadraturen-v1-six-20261023
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and recheck official Place-open runtime
        run: |
          npm run place-open:build
          npm run place-open:check
      - name: Commit only changed Hotel du Nord runtime payload
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only >/tmp/changed
          cat /tmp/changed
          grep -Ev '^data/runtime/place-open/hotel_du_nord.json$' /tmp/changed >/tmp/unexpected || true
          test ! -s /tmp/unexpected || { cat /tmp/unexpected; exit 1; }
          git add data/runtime/place-open/hotel_du_nord.json
          if git diff --cached --quiet; then echo 'Already in sync'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Sync Hotel du Nord Place-open runtime after supported paragraph revision'
          git push origin HEAD:research/oslo-sentrum-kvadraturen-v1-six-20261023
