name: One-off science research internal labels EN ES PT
on:
  push:
    branches:
      - art/vitenskap-forskning-internal-locales-v3-20261112
    paths:
      - 'scripts/revise-vitenskap-research-other-locales-v3.py'
      - '.github/workflows/oneoff-science-research-v3-locales.yml'
permissions:
  contents: write
concurrency:
  group: science-research-internals-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/vitenskap-forskning-internal-locales-v3-20261112
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow numpy opencv-python-headless
      - name: Render three separate non-active revision candidates
        run: python scripts/revise-vitenskap-research-other-locales-v3.py
      - name: Verify exact SHA256, alpha, dimensions and no active registry changes
        run: |
          python - <<'PY'
          import json, hashlib
          from PIL import Image
          from pathlib import Path
          m=json.loads(Path('data/badges/vitenskap_forskning_internal_locales_v3_20261112.json').read_text())
          a=json.loads(Path('data/badges/vitenskap.json').read_text())
          assert len(m['items'])==3
          assert {r['locale'] for r in m['items']}=={'en','es','pt'}
          assert len(a['subBadgeImages'])==16
          for x in m['items']:
            b=Path(x['path']).read_bytes()
            assert b[:4]==b'RIFF' and b[8:12]==b'WEBP'
            assert len(b)==x['bytes']
            assert hashlib.sha256(b).hexdigest()==x['sha256']
            assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==x['gitBlobSha']
            with Image.open(x['source']) as f:src=f.convert('RGBA')
            with Image.open(x['path']) as f:dst=f.convert('RGBA')
            assert src.size==dst.size==(1024,1024)
            assert src.getchannel('A').tobytes()==dst.getchannel('A').tobytes()
            assert not x['path'] in a['subBadgeImages'].values()
            assert len(x['edits'])==10
          print("Three valid inactive localizations; active registry untouched")
          PY
      - name: Commit only three new candidates and provenance manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bilder/merker/vitenskap/kandidater/revisjoner/en/forskning_og_metode-v3.webp bilder/merker/vitenskap/kandidater/revisjoner/es/forskning_og_metode-v3.webp bilder/merker/vitenskap/kandidater/revisjoner/pt/forskning_og_metode-v3.webp data/badges/vitenskap_forskning_internal_locales_v3_20261112.json
          if ! git diff --cached --quiet; then
            git commit -m 'art(science): research internal-label v3 EN ES PT non-active originals'
            git push
          fi
