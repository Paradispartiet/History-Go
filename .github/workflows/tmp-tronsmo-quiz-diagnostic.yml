name: TEMP Tronsmo fresh-main conflict scan

on:
  push:
    branches:
      - agent/tronsmo-bokhandel-completion-20260910

permissions:
  contents: write

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan merge conflicts without changing branch history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p reports
          REPORT=reports/tmp-tronsmo-main-conflicts.txt
          : > "$REPORT"
          echo "HEAD=$(git rev-parse HEAD)" >> "$REPORT"
          echo "MAIN=$(git rev-parse origin/main)" >> "$REPORT"
          set +e
          git merge --no-commit --no-ff origin/main >/tmp/tronsmo-merge-scan.log 2>&1
          code=$?
          set -e
          echo "MERGE_EXIT=$code" >> "$REPORT"
          echo "=== conflicts ===" >> "$REPORT"
          git diff --name-only --diff-filter=U >> "$REPORT" || true
          echo "=== merge output ===" >> "$REPORT"
          cat /tmp/tronsmo-merge-scan.log >> "$REPORT"
          git merge --abort 2>/dev/null || git reset --hard HEAD
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$REPORT"
          git commit -m "chore: record Tronsmo fresh-main conflicts" || exit 0
          git push
