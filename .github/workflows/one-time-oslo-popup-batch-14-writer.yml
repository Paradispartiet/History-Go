name: One-time Oslo popup batch 14 writer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/oslo-popup-batch-14-trigger.txt

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Batch 14 branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-popup-v4-batch-14-finish-film-tv
          fetch-depth: 0

      - name: Apply isolated desc and popupDesc patches
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const patches = JSON.parse(fs.readFileSync('.github/oslo-popup-batch-14-patches.json', 'utf8')).places;
          const wc = (value) => String(value || '').trim().split(/\s+/u).filter(Boolean).length;
          const pc = (value) => String(value || '').split(/\n\n+/u).filter((part) => part.trim()).length;
          const stripText = (value) => {
            const copy = structuredClone(value);
            delete copy.desc;
            delete copy.popupDesc;
            return copy;
          };
          const rows = [];
          for (const patch of patches) {
            const before = JSON.parse(fs.readFileSync(patch.path, 'utf8'));
            if (before.id !== patch.id) throw new Error(`ID mismatch in ${patch.path}`);
            const beforeNonText = stripText(before);
            const after = structuredClone(before);
            after.desc = patch.desc;
            after.popupDesc = patch.popupDesc;
            const descWords = wc(after.desc);
            const popupWords = wc(after.popupDesc);
            const paragraphs = pc(after.popupDesc);
            if (descWords < 40 || descWords > 80) throw new Error(`${patch.id}: desc ${descWords}`);
            if (popupWords < 300 || popupWords > 600) throw new Error(`${patch.id}: popupDesc ${popupWords}`);
            if (paragraphs < 3) throw new Error(`${patch.id}: paragraphs ${paragraphs}`);
            if (JSON.stringify(beforeNonText) !== JSON.stringify(stripText(after))) throw new Error(`${patch.id}: non-text fields changed`);
            fs.writeFileSync(patch.path, `${JSON.stringify(after, null, 2)}\n`);
            rows.push({ id: patch.id, name: after.name || after.title, descWords, popupWords, paragraphs });
          }

          const protocolPath = 'reports/place-description-revision-protocol.md';
          let protocol = fs.readFileSync(protocolPath, 'utf8');
          const pr = process.env.PR_NUMBER;
          if (!protocol.includes('`cinemateket_oslo`')) {
            const tableRows = rows.map((row, index) => `| ${119 + index} | ${row.name} | \`${row.id}\` | ${row.descWords} | ${row.popupWords} | ${row.paragraphs} | #${pr} |`).join('\n');
            protocol = protocol.replace('## Gjenstående Oslo-kø', `${tableRows}\n\n## Gjenstående Oslo-kø`);
          }
          const anomaly = '- `cinemateket_oslo.year` står som 1956, mens Cinemateket i Oslo startet med visninger i 1984 og flyttet til Filmens hus i 1996.';
          if (!protocol.includes('`cinemateket_oslo.year`')) {
            protocol = protocol.replace('## Oppdagede metadataavvik utenfor denne PR-ens tekstomfang\n', `## Oppdagede metadataavvik utenfor denne PR-ens tekstomfang\n\n${anomaly}\n`);
          }
          fs.writeFileSync(protocolPath, protocol);
          console.log(rows);
          NODE

          node tools/audit-oslo-place-description-scope.mjs --write

          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('reports/oslo-place-description-scope-audit-2026-07-26.json', 'utf8'));
          if (audit.activeOslo.uniqueIds !== 512) throw new Error(`active total ${audit.activeOslo.uniqueIds}`);
          if (audit.protocol.ids !== 120) throw new Error(`protocol ids ${audit.protocol.ids}`);
          if (audit.comparison.additionalActiveOsloIds !== 392) throw new Error(`remaining ${audit.comparison.additionalActiveOsloIds}`);
          if (audit.groupCounts.film_tv) throw new Error(`film_tv still remains: ${audit.groupCounts.film_tv}`);
          NODE

          git diff --check
          git add \
            data/places/film_tv/oslo/cinemateket_oslo.json \
            data/places/film_tv/oslo/colosseum_kino.json \
            reports/oslo-place-description-scope-audit-2026-07-26.json \
            reports/oslo-place-description-scope-audit-2026-07-26.md \
            reports/place-description-revision-protocol.md
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete Oslo film and TV place descriptions"
          git push origin HEAD:agent/oslo-popup-v4-batch-14-finish-film-tv
