name: Civication map canonical reference repair (one-shot)
on:
  push:
    branches:
      - civication/fix-noncanonical-map-references-20261103
    paths:
      - .github/workflows/civication-map-reference-repair-once.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Correct only two known historical mapping references
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const byFile = 'data/Civication/map/historyGoPlaceMapping.by.json';
          const by = read(byFile);
          const tram = by.mappings?.map_trikk_17_18;
          if (!tram || tram.historyGoPlaceId !== 'trikk_17_18' || tram.visibleAs !== 'transit_line_overlay') throw Error('tram mapping changed');
          tram.historyGoPlaceStatus = 'retired_source_snapshot';
          fs.writeFileSync(byFile, JSON.stringify(by, null, 2) + '\n');
          const subFile = 'data/Civication/map/historyGoPlaceMapping.subkultur.json';
          const sub = read(subFile);
          const bla = sub.mappings?.map_bla;
          if (!bla || bla.historyGoPlaceId !== 'bla' || bla.name !== 'Blå') throw Error('Blå mapping changed');
          bla.historyGoPlaceId = 'blaa';
          bla.historyGoSourceFile = 'places/musikk/oslo/places_musikk/blaa.json';
          bla.emne_ids = ['em_musikk_jazz_improvisasjon','em_musikk_scene_klubb_livekultur'];
          fs.writeFileSync(subFile, JSON.stringify(sub, null, 2) + '\n');
          const testFile = 'tests/civication-place-mapping-split-manifest.test.mjs';
          let test = fs.readFileSync(testFile, 'utf8');
          const anchor = '  "vulkan_murvegger",';
          if (!test.includes(anchor)) throw Error('approved snapshot anchor moved');
          test = test.replace(anchor, '  "trikk_17_18", // archived route overlay from removed monolithic By source\n' + anchor);
          fs.writeFileSync(testFile, test);
          NODE
          node --test tests/civication-place-mapping-split-manifest.test.mjs
      - name: Commit only map and test references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/map/historyGoPlaceMapping.by.json data/Civication/map/historyGoPlaceMapping.subkultur.json tests/civication-place-mapping-split-manifest.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Align Blå canonical Place and retired tram overlay snapshot"
            git push origin HEAD:civication/fix-noncanonical-map-references-20261103
          fi
