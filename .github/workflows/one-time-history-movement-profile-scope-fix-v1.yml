name: One-time History movement profile scope fix V1

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/history-movement-profile-scope-fix-v1-trigger.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/history-movement-publics-evidence-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Correct case and mapping scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/historie-theory-evidence/movement-publics-v1-validation
          node --check tools/fix-history-movement-publics-profile-scope-v1.mjs 2>&1 \
            | tee reports/historie-theory-evidence/movement-publics-v1-validation/profile-scope-fix-syntax.log
          node tools/fix-history-movement-publics-profile-scope-v1.mjs 2>&1 \
            | tee reports/historie-theory-evidence/movement-publics-v1-validation/profile-scope-fix.log

      - name: Regenerate dependent reports
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-historie-geographic-profile.mjs 2>&1 \
            | tee reports/historie-theory-evidence/movement-publics-v1-validation/geographic-profile-after-scope-fix.log
          node tools/audit-historie-universal-coverage.mjs 2>&1 \
            | tee reports/historie-theory-evidence/movement-publics-v1-validation/universal-coverage-after-scope-fix.log

      - name: Refresh freeze and validate final scope
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-historie-v5-5-quality-depth.mjs --write-freeze \
            --reason="Reviewed movement publics evidence V1 synchronizes validated case emne scopes and profile mappings without mutating frozen universal concepts or theory objects." 2>&1 \
            | tee reports/historie-theory-evidence/movement-publics-v1-validation/quality-freeze-scope-fix-refresh.log
          node tools/audit-historie-v5-5-quality-depth.mjs 2>&1 \
            | tee reports/historie-theory-evidence/movement-publics-v1-validation/quality-freeze-scope-fix-verify.log
          git restore -- reports/historie-v5/historie-v5-8-quality-depth.json reports/historie-v5/historie-v5-8-quality-depth.md 2>/dev/null || true
          node tools/validate-historie-profile-evidence.mjs 2>&1 \
            | tee reports/historie-theory-evidence/movement-publics-v1-validation/profile-validator-after-scope-fix.log
          node tools/validate-historie-theory-evidence.mjs --check 2>&1 \
            | tee reports/historie-theory-evidence/movement-publics-v1-validation/theory-validator-after-scope-fix.log
          node tools/audit-historie-geographic-profile.mjs --check 2>&1 \
            | tee reports/historie-theory-evidence/movement-publics-v1-validation/geographic-profile-after-scope-fix-check.log
          node tools/audit-historie-universal-coverage.mjs --check 2>&1 \
            | tee reports/historie-theory-evidence/movement-publics-v1-validation/universal-coverage-after-scope-fix-check.log
          git diff --check 2>&1 \
            | tee reports/historie-theory-evidence/movement-publics-v1-validation/profile-scope-fix-diff-check.log

      - name: Upload correction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-movement-profile-scope-fix-v1
          path: |
            reports/historie-theory-evidence/movement-publics-v1-validation
            reports/historie-geographic-profiles/oslo-akershus-profile.json
            reports/historie-geographic-profiles/oslo-akershus-profile.md
            reports/historie-universal-coverage/historie-universal-coverage.json
            reports/historie-universal-coverage/historie-universal-coverage.md
          if-no-files-found: error

      - name: Remove one-time correction files
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/fix-history-movement-publics-profile-scope-v1.mjs
          rm -f .github/workflows/one-time-history-movement-profile-scope-fix-v1.yml
          rm -f .github/history-movement-profile-scope-fix-v1-trigger.txt

      - name: Commit corrected production scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f reports/historie-theory-evidence/movement-publics-v1-validation
          git commit -m "Synchronize History movement case scopes"
          git push origin HEAD:agent/history-movement-publics-evidence-v1
