name: Temporary Blaker skanse coordinate source probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/akershus-blaker-skanse-production
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize Blaker skanse sources
        shell: bash
        run: |
          set -euo pipefail
          OUT='reports/akershus-coordinate-blaker-skanse-source-probe'
          mkdir -p "$OUT"
          UA='History-Go coordinate research (Paradispartiet/History-Go)'
          RA='https://api.ra.no/LokaliteterEnkeltminnerOgSikringssoner'

          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://ws.geonorge.no/adresser/v1/sok' \
            --data-urlencode 'sok=Skanseveien 43 Blaker' \
            --data 'kommunenummer=3205' --data 'treffPerSide=30' \
            | tee "$OUT/geonorge-skanseveien-43.json" >/dev/null

          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'q=Blaker skanse, Blaker, Norge' \
            --data 'format=jsonv2' --data 'polygon_geojson=1' --data 'extratags=1' \
            --data 'namedetails=1' --data 'limit=20' \
            | tee "$OUT/nominatim-blaker-skanse.json" >/dev/null

          for COLLECTION in lokaliteter enkeltminner; do
            curl --fail --silent --show-error --location --user-agent "$UA" \
              --get "$RA/collections/$COLLECTION/items" \
              --data-urlencode 'navn=Blaker skanse' --data 'limit=1000' --data 'f=json' \
              | tee "$OUT/riksantikvaren-${COLLECTION}-navn-blaker-skanse.json" >/dev/null
          done

          curl --fail --silent --show-error --location --user-agent "$UA" \
            'https://api.openstreetmap.org/api/0.6/map?bbox=11.298,59.998,11.315,60.010' \
            | tee "$OUT/osm-blaker-skanse-bbox.xml" >/dev/null

          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('reports/akershus-coordinate-blaker-skanse-source-probe')
          data = json.loads((out / 'nominatim-blaker-skanse.json').read_text())
          candidates = [row for row in data if row.get('name') == 'Blaker skanse' and row.get('osm_type') in ('way', 'relation')]
          if candidates:
              row = candidates[0]
              (out / 'nominatim-selected-object.txt').write_text(f"{row['osm_type']} {row['osm_id']}\n")
          PY

          if [ -f "$OUT/nominatim-selected-object.txt" ]; then
            read -r OSM_TYPE OSM_ID < "$OUT/nominatim-selected-object.txt"
            if [ "$OSM_TYPE" = 'way' ]; then
              curl --fail --silent --show-error --location --user-agent "$UA" \
                "https://api.openstreetmap.org/api/0.6/way/${OSM_ID}/full" \
                | tee "$OUT/osm-way-${OSM_ID}-full.xml" >/dev/null
            elif [ "$OSM_TYPE" = 'relation' ]; then
              curl --fail --silent --show-error --location --user-agent "$UA" \
                "https://api.openstreetmap.org/api/0.6/relation/${OSM_ID}/full" \
                | tee "$OUT/osm-relation-${OSM_ID}-full.xml" >/dev/null
            fi
          fi

          python - <<'PY' | tee "$OUT/source-summary.txt" >/dev/null
          import json
          import math
          import unicodedata
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path('reports/akershus-coordinate-blaker-skanse-source-probe')
          legacy = (60.00361, 11.30611)

          def distance_m(a, b):
              lat1, lon1 = map(math.radians, a)
              lat2, lon2 = map(math.radians, b)
              dlat = lat2 - lat1
              dlon = lon2 - lon1
              h = math.sin(dlat / 2) ** 2 + math.cos(lat1) * math.cos(lat2) * math.sin(dlon / 2) ** 2
              return 6371000 * 2 * math.asin(math.sqrt(h))

          def norm(value):
              return unicodedata.normalize('NFKD', str(value)).encode('ascii', 'ignore').decode().lower()

          def flatten_pairs(coords):
              if not isinstance(coords, list):
                  return []
              if len(coords) >= 2 and all(isinstance(v, (int, float)) for v in coords[:2]):
                  return [(float(coords[0]), float(coords[1]))]
              result = []
              for item in coords:
                  result.extend(flatten_pairs(item))
              return result

          def ring_centroid(points):
              if len(points) < 4:
                  return None
              pts = list(points)
              if pts[0] != pts[-1]:
                  pts.append(pts[0])
              twice_area = cx = cy = 0.0
              for (x1, y1), (x2, y2) in zip(pts, pts[1:]):
                  cross = x1 * y2 - x2 * y1
                  twice_area += cross
                  cx += (x1 + x2) * cross
                  cy += (y1 + y2) * cross
              if abs(twice_area) < 1e-15:
                  return None
              return cx / (3 * twice_area), cy / (3 * twice_area)

          def feature_center(feature):
              props = feature.get('properties') or {}
              center = props.get('senterpunkt')
              if isinstance(center, dict) and center.get('type') == 'Point':
                  coords = center.get('coordinates') or []
                  if len(coords) >= 2:
                      return float(coords[1]), float(coords[0]), 'official_senterpunkt'
              geometry = feature.get('geometry') or {}
              kind = geometry.get('type')
              coords = geometry.get('coordinates')
              if kind == 'Point' and coords:
                  return float(coords[1]), float(coords[0]), 'geometry_point'
              if kind == 'Polygon' and coords and coords[0]:
                  point = ring_centroid([(float(p[0]), float(p[1])) for p in coords[0]])
                  if point:
                      return point[1], point[0], 'polygon_centroid'
              if kind == 'MultiPolygon' and coords and coords[0] and coords[0][0]:
                  point = ring_centroid([(float(p[0]), float(p[1])) for p in coords[0][0]])
                  if point:
                      return point[1], point[0], 'multipolygon_first_centroid'
              pairs = flatten_pairs(coords)
              if not pairs:
                  return None
              return sum(p[1] for p in pairs) / len(pairs), sum(p[0] for p in pairs) / len(pairs), 'vertex_mean'

          address = json.loads((out / 'geonorge-skanseveien-43.json').read_text())
          address_points = []
          print(f'ADDRESS_TOTAL={address.get("metadata", {}).get("totaltAntallTreff")}')
          for row in address.get('adresser', []):
              rp = row.get('representasjonspunkt') or {}
              if 'lat' not in rp or 'lon' not in rp:
                  continue
              point = (float(rp['lat']), float(rp['lon']))
              address_points.append(point)
              print('ADDRESS ' + json.dumps({
                  'data': row,
                  'distance_from_legacy_m': round(distance_m(legacy, point), 1),
              }, ensure_ascii=False, sort_keys=True))

          nominatim = json.loads((out / 'nominatim-blaker-skanse.json').read_text())
          print(f'NOMINATIM_COUNT={len(nominatim)}')
          for row in nominatim:
              point = (float(row['lat']), float(row['lon']))
              print('NOMINATIM ' + json.dumps({
                  'name': row.get('name'), 'display_name': row.get('display_name'),
                  'category': row.get('category'), 'type': row.get('type'),
                  'osm_type': row.get('osm_type'), 'osm_id': row.get('osm_id'),
                  'lat': point[0], 'lon': point[1],
                  'distance_from_legacy_m': round(distance_m(legacy, point), 1),
                  'distance_to_address_m': round(min(distance_m(address_point, point) for address_point in address_points), 1) if address_points else None,
                  'extratags': row.get('extratags', {}),
              }, ensure_ascii=False, sort_keys=True))

          exact_candidates = []
          for collection in ('lokaliteter', 'enkeltminner'):
              path = out / f'riksantikvaren-{collection}-navn-blaker-skanse.json'
              data = json.loads(path.read_text())
              print(f'RA_{collection.upper()} numberMatched={data.get("numberMatched")} numberReturned={data.get("numberReturned")}')
              for feature in data.get('features', []):
                  props = feature.get('properties') or {}
                  center = feature_center(feature)
                  row = {
                      'collection': collection, 'feature_id': feature.get('id'),
                      'geometry_type': (feature.get('geometry') or {}).get('type'),
                      'properties': props,
                  }
                  if center:
                      lat, lon, method = center
                      row.update({
                          'lat': lat, 'lon': lon, 'point_method': method,
                          'distance_from_legacy_m': round(distance_m(legacy, (lat, lon)), 1),
                          'distance_to_address_m': round(min(distance_m(address_point, (lat, lon)) for address_point in address_points), 1) if address_points else None,
                      })
                  print('RA_MATCH ' + json.dumps(row, ensure_ascii=False, sort_keys=True))
                  joined = norm(' '.join(str(v) for v in props.values() if v is not None))
                  if str(props.get('kommune')) == '3205' and 'blaker skanse' in joined:
                      exact_candidates.append((collection, feature))

          unique = {}
          for collection, feature in exact_candidates:
              unique[(collection, str(feature.get('id')))] = feature
          exact_candidates = [(collection, feature) for (collection, _), feature in unique.items()]
          print(f'RA_EXACT_CANDIDATE_COUNT={len(exact_candidates)}')
          for collection, feature in exact_candidates:
              safe_id = str(feature.get('id')).replace('/', '_')
              (out / f'riksantikvaren-{collection}-exact-{safe_id}.json').write_text(json.dumps(feature, ensure_ascii=False, indent=2) + '\n')
              props = feature.get('properties') or {}
              center = feature_center(feature)
              pairs = flatten_pairs((feature.get('geometry') or {}).get('coordinates'))
              distances = []
              if center:
                  lat, lon, _ = center
                  distances = [distance_m((lat, lon), (p[1], p[0])) for p in pairs]
              print('RA_EXACT ' + json.dumps({
                  'collection': collection, 'feature_id': feature.get('id'),
                  'properties': props, 'center': center,
                  'geometry_type': (feature.get('geometry') or {}).get('type'),
                  'geometry_vertex_count': len(pairs),
                  'max_vertex_distance_m': round(max(distances), 1) if distances else None,
              }, ensure_ascii=False, sort_keys=True))

          root = ET.parse(out / 'osm-blaker-skanse-bbox.xml').getroot()
          nodes = {
              node.attrib['id']: (float(node.attrib['lat']), float(node.attrib['lon']))
              for node in root.findall('node')
          }
          def tags(element):
              return {tag.attrib['k']: tag.attrib['v'] for tag in element.findall('tag')}
          relevant = []
          for node in root.findall('node'):
              t = tags(node)
              if not t:
                  continue
              joined = norm(' '.join(f'{k}={v}' for k, v in t.items()))
              if t.get('name') or any(key in t for key in ('historic', 'tourism', 'information', 'amenity')) or 'fort' in joined or 'skanse' in joined:
                  point = nodes[node.attrib['id']]
                  relevant.append({
                      'type': 'node', 'id': node.attrib['id'], 'lat': point[0], 'lon': point[1],
                      'distance_from_legacy_m': round(distance_m(legacy, point), 1), 'tags': t,
                  })
          for way in root.findall('way'):
              t = tags(way)
              refs = [nd.attrib['ref'] for nd in way.findall('nd')]
              points = [nodes[ref] for ref in refs if ref in nodes]
              if not points:
                  continue
              centroid = ring_centroid([(lon, lat) for lat, lon in points]) if len(points) >= 4 and points[0] == points[-1] else None
              point = (centroid[1], centroid[0]) if centroid else (sum(p[0] for p in points) / len(points), sum(p[1] for p in points) / len(points))
              joined = norm(' '.join(f'{k}={v}' for k, v in t.items()))
              if t.get('name') or any(key in t for key in ('historic', 'tourism', 'amenity', 'building', 'landuse')) or 'fort' in joined or 'skanse' in joined:
                  relevant.append({
                      'type': 'way', 'id': way.attrib['id'], 'lat': point[0], 'lon': point[1],
                      'node_count': len(points), 'distance_from_legacy_m': round(distance_m(legacy, point), 1),
                      'tags': t,
                  })
          relevant.sort(key=lambda row: row['distance_from_legacy_m'])
          print('OSM_RELEVANT=' + json.dumps(relevant[:200], ensure_ascii=False, sort_keys=True))
          PY

          rm -f .github/workflows/temporary-coordinate-source-probe-blaker-skanse.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT" .github/workflows/temporary-coordinate-source-probe-blaker-skanse.yml
          if git diff --cached --quiet; then
            echo 'No Blaker skanse source changes.'
          else
            git commit -m 'Materialize Blaker skanse coordinate sources'
            git push origin HEAD:agent/akershus-blaker-skanse-production
          fi
