name: Fagverk Film og TV creative work technology responsibility fulltext

on:
  pull_request:
    paths:
      - "data/fag/TV_og_Film/film_tv_creative_work_technology_responsibility_*.json"
      - "data/fagverk/film_tv/skapende-arbeid-teknologi-og-ansvar.json"
      - "data/fagverk/film_tv/skapende-arbeid-teknologi-og-ansvar/**"
      - "scripts/brief-film-tv-creative-work-technology-responsibility-sources-v1.mjs"
      - "scripts/materialize-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs"
      - "scripts/audit-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs"
      - "tests/film-tv-creative-work-technology-responsibility-source-brief-v1.test.mjs"
      - "tests/film-tv-creative-work-technology-responsibility-fulltext-v1.test.mjs"
      - ".github/workflows/fagverk-film-tv-creative-work-technology-responsibility-source-brief.yml"
  push:
    branches: [main]
    paths:
      - "data/fag/TV_og_Film/film_tv_creative_work_technology_responsibility_*.json"
      - "data/fagverk/film_tv/skapende-arbeid-teknologi-og-ansvar.json"
      - "data/fagverk/film_tv/skapende-arbeid-teknologi-og-ansvar/**"
      - "scripts/brief-film-tv-creative-work-technology-responsibility-sources-v1.mjs"
      - "scripts/materialize-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs"
      - "scripts/audit-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs"
      - "tests/film-tv-creative-work-technology-responsibility-source-brief-v1.test.mjs"
      - "tests/film-tv-creative-work-technology-responsibility-fulltext-v1.test.mjs"
      - ".github/workflows/fagverk-film-tv-creative-work-technology-responsibility-source-brief.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fagverk-film-tv-unit9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate creative work technology responsibility fulltext
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate syntax
        run: |
          node --check scripts/brief-film-tv-creative-work-technology-responsibility-sources-v1.mjs
          node --check scripts/materialize-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs
          node --check scripts/audit-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs
          node --check tests/film-tv-creative-work-technology-responsibility-fulltext-v1.test.mjs

      - name: Validate immutable source brief before registration
        run: |
          node scripts/brief-film-tv-creative-work-technology-responsibility-sources-v1.mjs
          node --test tests/film-tv-creative-work-technology-responsibility-source-brief-v1.test.mjs

      - name: Materialize unit 9 runtime state
        run: node scripts/materialize-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs --write

      - name: Build deterministic release
        run: node scripts/build-fagverk-release-manifest.mjs

      - name: Refresh shared general engine audit
        run: node scripts/audit-fagverk-general-engine.mjs --write-report

      - name: Refresh unit 9 fulltext audit
        run: node scripts/audit-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs --write-report

      - name: Validate unit 9 fulltext
        run: node --test tests/film-tv-creative-work-technology-responsibility-fulltext-v1.test.mjs

      - name: Validate shared Film and TV baseline
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-film-tv-phase3.test.mjs
          node --test tests/film-tv-learning-order-plan-v1.test.mjs
          node --test tests/film-tv-learning-order-monotone-regression-v1.test.mjs
          node --test tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs

      - name: Persist deterministic unit 9 outputs on PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/fagverk/film_tv/skapende-arbeid-teknologi-og-ansvar.json \
            data/fagverk/film_tv/skapende-arbeid-teknologi-og-ansvar/brief.json \
            data/fagverk/film_tv/skapende-arbeid-teknologi-og-ansvar/claims.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_status.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/general-engine-audit.json \
            reports/fagverk/film-tv-creative-work-technology-responsibility-fulltext-v1-audit.json
          if git diff --cached --quiet; then
            echo 'Unit 9 deterministic outputs already match.'
            exit 0
          fi
          git commit -m 'Materialize Film TV unit 9 runtime state'
          git push origin "HEAD:${HEAD_BRANCH}"
