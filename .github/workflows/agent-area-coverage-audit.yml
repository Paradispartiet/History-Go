name: Agent area coverage audit

on:
  push:
    branches: [agent/place-area-coverage-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit semantic area-place signals
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const manifest = JSON.parse(fs.readFileSync('data/places/manifest.json', 'utf8'));
          const rows = [];

          for (const rel of manifest.files || []) {
            const data = JSON.parse(fs.readFileSync(path.join('data', rel), 'utf8'));
            const items = Array.isArray(data) ? data : Array.isArray(data?.places) ? data.places : [data];
            for (const p of items) {
              if (!p || typeof p !== 'object' || (!p.id && !p.name)) continue;
              const bits = rel.split('/');
              const coordType = String(p.coordType || '').trim().toLowerCase();
              const coordRole = String(p.coordRole || '').trim().toLowerCase();
              const locatorType = String(p.locatorType || '').trim().toLowerCase();
              const quizType = String(p.quiz_profile?.place_type || '').trim().toLowerCase();
              const sourceObjectId = String(p.sourceObjectId || '').trim().toLowerCase();
              const coordSource = String(p.coordSource || '').trim().toLowerCase();
              const note = String(p.coordNote || '').trim().toLowerCase();
              const districtAnchor = coordType === 'district_anchor';
              const quizArea = ['omrade', 'område', 'area', 'district', 'neighborhood', 'neighbourhood'].includes(quizType);
              const locatorArea = ['neighborhood','neighbourhood','district','borough','municipality','city','town','village','locality','county','region'].includes(locatorType);
              const explicitStrok = sourceObjectId.includes('strok') || coordSource.includes('strøk') || /\bstrøket\b|\bstrøk\b/.test(note);
              const semanticCandidate = districtAnchor || quizArea || locatorArea || explicitStrok;
              rows.push({
                id: p.id || '', name: p.name || p.title || '', domain: bits[1] || '', region: bits[2] || '',
                category: p.category || '', locatorType, coordRole, coordType, quizType,
                districtAnchor, quizArea, locatorArea, explicitStrok, semanticCandidate, file: rel
              });
            }
          }

          const candidates = rows.filter(x => x.semanticCandidate).sort((a,b) => a.region.localeCompare(b.region) || a.name.localeCompare(b.name));
          const currentCoordinateAreas = rows.filter(x => x.coordRole === 'area_anchor' || x.coordType.endsWith('_area_anchor') || x.coordType === 'district_anchor');
          const coordinateOnly = currentCoordinateAreas.filter(x => !x.semanticCandidate);
          const byRegion = {};
          for (const x of candidates) {
            const r = byRegion[x.region] ||= { totalCandidates: 0, districtAnchor: 0, quizArea: 0, locatorArea: 0, explicitStrok: 0 };
            r.totalCandidates++;
            if (x.districtAnchor) r.districtAnchor++;
            if (x.quizArea) r.quizArea++;
            if (x.locatorArea) r.locatorArea++;
            if (x.explicitStrok) r.explicitStrok++;
          }

          const quizTypeCounts = {};
          for (const x of rows) if (x.quizType) quizTypeCounts[x.quizType] = (quizTypeCounts[x.quizType] || 0) + 1;

          console.log('=== SEMANTIC SUMMARY ===');
          console.log(JSON.stringify({
            totalPlaces: rows.length,
            currentCoordinateAreaAnchors: currentCoordinateAreas.length,
            semanticAreaCandidates: candidates.length,
            coordinateAnchorsWithoutSemanticAreaSignal: coordinateOnly.length,
            quizTypeCounts,
            byRegion
          }, null, 2));
          console.log('=== SEMANTIC AREA CANDIDATES ===');
          console.log(JSON.stringify(candidates, null, 2));
          console.log('=== SAMPLE COORDINATE-ONLY AREA ANCHORS (first 40) ===');
          console.log(JSON.stringify(coordinateOnly.slice(0, 40), null, 2));
          NODE
