name: Agent placeScope migration

on:
  push:
    branches: [agent/place-area-coverage-audit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/place-area-coverage-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply canonical scope migration
        run: python scripts/agent_place_scope_migration.py

      - name: Make scope fixtures manifest-driven
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/map-place-area-lod.test.mjs')
          text = path.read_text(encoding='utf-8')
          pattern = r'test\("eksplisitte område-Places har placeScope, mens geometriske area_anchor ikke arver scope", \(\) => \{[\s\S]*?\n\}\);\n\ntest\("permanent scope-audit'
          replacement = r'''test("eksplisitte område-Places har placeScope, mens geometriske area_anchor ikke arver scope", () => {
            const manifest = json("data/places/manifest.json");
            const byId = new Map();
            for (const rel of manifest.files || []) {
              const file = path.join(root, "data", rel);
              const data = JSON.parse(fs.readFileSync(file, "utf8"));
              const items = Array.isArray(data) ? data : Array.isArray(data?.places) ? data.places : [data];
              for (const place of items) {
                if (place?.id) byId.set(place.id, place);
              }
            }
            const getPlace = id => {
              const place = byId.get(id);
              assert.ok(place, `mangler Place ${id} i canonical manifest`);
              return place;
            };

            for (const id of ["sagene", "lisbon_alfama", "son_ladested", "etnesjoen_tettstad", "svartlamon_trondheim"]) {
              assert.equal(getPlace(id).placeScope, "area", `${id}: mangler canonical area scope`);
            }
            assert.notEqual(getPlace("st_hanshaugen_park").placeScope, "area", "park med area_anchor skal ikke bli område-Place automatisk");
            assert.notEqual(getPlace("radhusplassen").placeScope, "area", "torg/plass med area_anchor skal ikke bli område-Place automatisk");
          });

          test("permanent scope-audit'''
          updated, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one fixture block replacement, got {count}')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Migrate language owner assertions to canonical placeScope
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('tests/place-language-layer.test.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              r'  assert.match(checklist, /coordRole: "area_anchor"/);': r'  assert.match(checklist, /placeScope:\s*"area"/);',
              r'  assert.match(contract, /coordRole: "area_anchor"/);': r'  assert.match(contract, /placeScope:\s*"area"/);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected legacy language assertion not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild canonical indexes and web runtime
        shell: bash
        run: |
          npm run places:index:build
          npm run build:web

      - name: Audit semantic Place scope
        run: node scripts/audit-place-scope.mjs

      - name: Test map Place area LOD
        run: node --test tests/map-place-area-lod.test.mjs

      - name: Test language layer scope contract
        run: node --test tests/place-language-layer.test.mjs

      - name: Typecheck web
        run: npm run typecheck:web

      - name: Verify places index
        run: npm run places:index:check

      - name: Verify place coordinates
        run: npm run places:coords:check

      - name: Verify clean diff syntax
        run: git diff --check

      - name: Commit product migration and remove one-shot helpers
        shell: bash
        run: |
          git config user.name "History Go migration bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/places js/map.ts js/map.js dist/web/map.js dist/web/map.js.map \
            docs/SPRAKLEKSIKON.md docs/PLACE_PRODUCTION_CHECKLIST.md \
            tests/map-place-area-lod.test.mjs tests/place-language-layer.test.mjs \
            scripts/audit-place-scope.mjs
          git rm .github/workflows/agent-area-coverage-audit.yml scripts/agent_place_scope_migration.py
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Skill semantisk Place-scope fra koordinatankre"
          git push origin HEAD:agent/place-area-coverage-audit
