name: Agent area coverage audit

on:
  push:
    branches: [agent/place-area-coverage-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit explicit semantic area types
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const manifest = JSON.parse(fs.readFileSync('data/places/manifest.json', 'utf8'));
          const rows = [];
          const areaQuizTypes = new Set([
            'omrade', 'område', 'boligomrade', 'boligområde', 'bydel', 'by', 'tettstad',
            'ladested', 'ladested_og_ferdselssted', 'alternativ_bydel'
          ]);

          for (const rel of manifest.files || []) {
            const data = JSON.parse(fs.readFileSync(path.join('data', rel), 'utf8'));
            const items = Array.isArray(data) ? data : Array.isArray(data?.places) ? data.places : [data];
            for (const p of items) {
              if (!p || typeof p !== 'object' || (!p.id && !p.name)) continue;
              const bits = rel.split('/');
              const quizType = String(p.quiz_profile?.place_type || '').trim().toLowerCase();
              const coordType = String(p.coordType || '').trim().toLowerCase();
              const locatorType = String(p.locatorType || '').trim().toLowerCase();
              const topLevelType = String(p.placeType || p.place_type || p.type || '').trim().toLowerCase();
              const explicit = coordType === 'district_anchor' || areaQuizTypes.has(quizType);
              if (!explicit) continue;
              rows.push({
                id: p.id || '', name: p.name || p.title || '', domain: bits[1] || '', region: bits[2] || '',
                category: p.category || '', quizType, coordType, coordRole: p.coordRole || '', locatorType,
                topLevelType, file: rel
              });
            }
          }

          const byRegion = {};
          const byQuizType = {};
          for (const x of rows) {
            byRegion[x.region] = (byRegion[x.region] || 0) + 1;
            const key = x.quizType || '(district_anchor without quiz type)';
            byQuizType[key] = (byQuizType[key] || 0) + 1;
          }
          rows.sort((a,b) => a.region.localeCompare(b.region) || a.name.localeCompare(b.name));
          console.log('=== EXPLICIT AREA-TYPE SUMMARY ===');
          console.log(JSON.stringify({ count: rows.length, byRegion, byQuizType }, null, 2));
          console.log('=== EXPLICIT AREA-TYPE RECORDS ===');
          console.log(JSON.stringify(rows, null, 2));
          NODE
