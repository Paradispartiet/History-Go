name: Temporary Civication By-radgiver trigger repair

on:
  push:
    branches:
      - civication/scene-pipeline-strict-blockers-2
    paths:
      - .github/workflows/tmp-scene-pipeline-blockers.yml
      - tests/civication-by-radgiver-trigger-threads.test.js

permissions:
  contents: write

jobs:
  repair-verify-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prove red then materialize missing trigger threads
        shell: bash
        run: |
          set +e
          node tests/civication-by-radgiver-trigger-threads.test.js
          BEFORE=$?
          set -e
          if [ "$BEFORE" -eq 0 ]; then
            echo 'Expected By-rådgiver trigger regression test to fail before repair.' >&2
            exit 1
          fi
          node scripts/tmp-fix-by-radgiver-trigger-threads.cjs
          node scripts/audit-civication-career-gameplay.mjs --write
          node tests/civication-by-radgiver-trigger-threads.test.js
      - name: Verify strict blocker reduction
        shell: bash
        run: |
          node scripts/audit-civication-scene-pipeline.mjs --json > /tmp/scene-pipeline-audit.json
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/scene-pipeline-audit.json','utf8'));
          const counts = {};
          for (const issue of audit.blocking_issues || []) counts[issue.category] = (counts[issue.category] || 0) + 1;
          if (audit.summary.missing_internal_references !== 0) throw new Error(`expected 0 missing internal refs, got ${audit.summary.missing_internal_references}`);
          if ((counts.missing_internal_reference || 0) !== 0) throw new Error('missing_internal_reference blockers remain');
          if ((counts.duplicate_scene_id || 0) !== 35) throw new Error(`expected 35 duplicate_scene_id blockers, got ${counts.duplicate_scene_id || 0}`);
          if ((counts.daily_work_situation_budget_conflict || 0) !== 1) throw new Error(`expected 1 budget blocker, got ${counts.daily_work_situation_budget_conflict || 0}`);
          if (audit.summary.blocking_issues !== 36) throw new Error(`expected 36 blockers after repair, got ${audit.summary.blocking_issues}`);
          console.log(JSON.stringify({ summary: audit.summary, category_counts: counts }, null, 2));
          NODE
      - name: Synchronize compiled scene registry
        shell: bash
        run: |
          if ! node scripts/build-civication-scene-registry.mjs --check; then
            node scripts/build-civication-scene-registry.mjs --write
          fi
          node scripts/build-civication-scene-registry.mjs --check
          node scripts/audit-civication-career-gameplay.mjs --check
      - name: Verify complete Civication state
        run: |
          npm run test:civication
          git diff --check
      - name: Commit permanent By-radgiver trigger repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-scene-pipeline-blockers.yml scripts/tmp-fix-by-radgiver-trigger-threads.cjs
          git add data/Civication/mailFamilies/by/people/by_radgiver_plan_people.json tests/civication-by-radgiver-trigger-threads.test.js data/Civication/compiledSceneRegistryV1.json data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md
          git diff --cached --check
          git commit -m "Civication: repair By-rådgiver trigger threads"
          git push origin HEAD:civication/scene-pipeline-strict-blockers-2
