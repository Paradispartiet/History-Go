name: Temporary Civication scene-pipeline blocker diagnosis

on:
  push:
    branches:
      - civication/scene-pipeline-strict-blockers-2
    paths:
      - .github/workflows/tmp-scene-pipeline-blockers.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inspect compiled trigger semantics
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const reg=JSON.parse(fs.readFileSync('data/Civication/compiledSceneRegistryV1.json','utf8'));
          const scenes=Array.isArray(reg.scenes)?reg.scenes:Object.values(reg.scenes||{});
          const scene=scenes.find(s => s.id === 'by_areal_people_plansjef_004');
          console.log(JSON.stringify(scene, null, 2));
          NODE
