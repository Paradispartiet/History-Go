name: Temporary Civication scene-pipeline blocker diagnosis

on:
  push:
    branches:
      - civication/scene-pipeline-strict-blockers-2
    paths:
      - .github/workflows/tmp-scene-pipeline-blockers.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inspect triggers_on_choice semantics
        shell: bash
        run: |
          echo '=== non-JSON consumers / validators ==='
          grep -R --line-number --exclude='*.json' --exclude='*.md' 'triggers_on_choice' js scripts tests src 2>/dev/null || true
          echo '=== exact missing target occurrences ==='
          grep -R --line-number 'by_areal_people_plansjef_004_presisjon\|by_areal_people_plansjef_004_tempo_risiko\|by_areal_people_skolevei_005_presisjon\|by_areal_people_skolevei_005_tempo_risiko\|by_areal_people_juridisk_006_presisjon\|by_areal_people_juridisk_006_tempo_risiko\|by_areal_people_politisk_007_presisjon\|by_areal_people_politisk_007_tempo_risiko\|by_areal_people_arkitekt_008_presisjon\|by_areal_people_arkitekt_008_tempo_risiko' data js scripts tests 2>/dev/null || true
          echo '=== representative trigger maps ==='
          grep -R --line-number -A8 -B2 '"triggers_on_choice"' data/Civication/mailFamilies/by data/Civication/mailFamilies/naeringsliv 2>/dev/null | head -320 || true
