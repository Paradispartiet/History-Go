name: Tøyenbadet illustrated People sync (temporary)
on:
  push:
    branches:
      - feat/toyenbadet-four-illustrated-people-20261103
    paths:
      - .github/workflows/toyenbadet-illustrated-people-sync-temp.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build People / Place-open / Civication
        run: |
          npm run place-open:build
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
          npm run place-open:check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node --test tests/toyenbadet-illustrated-people.test.mjs tests/toyenbadet-people-staging-source-gate.test.mjs tests/toyenbadet-anne-lindboe-people.test.mjs
      - name: Commit generated runtime changes only
        run: |
          echo "Generated diff:"
          git status --short
          git add data/runtime/people-all data/runtime/place-open/toyenbadet.json data/Civication/scenarioPeople/generated data/Civication/scenarioPeople_index.json
          echo "Staged files:"
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "No generated changes"; exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(toyenbadet): regenerate five-People runtime and Civication"
          git push origin HEAD:${{ github.ref_name }}
