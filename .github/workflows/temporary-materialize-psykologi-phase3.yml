name: Temporary materialize Psykologi phase 3

on:
  pull_request:
    paths:
      - "tools/materialize-psykologi-phase3-once.mjs"
      - ".github/workflows/temporary-materialize-psykologi-phase3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-materialize-psykologi-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Materialize Psykologi sources
        run: node tools/materialize-psykologi-phase3-once.mjs
      - name: Regenerate deterministic Fagverk reports
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs --write-report --no-check-report
          node scripts/audit-fagverk-general-engine.mjs --write-report --no-check-report
          node scripts/audit-fagverk-psykologi-phase3.mjs --write-report --no-check-report
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate final materialization before commit
        run: |
          node --check scripts/audit-fagverk-psykologi-phase3.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-psykologi-phase3.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-psykologi-phase3.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
          git diff --check
      - name: Remove one-time materializer from final diff
        run: git rm tools/materialize-psykologi-phase3-once.mjs .github/workflows/temporary-materialize-psykologi-phase3.yml
      - name: Commit materialized Psykologi state
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fag/fag_manifest.json \
            "data/fag/psykologi/merke_psykologi (1).html" \
            data/fagverk/fagverk_portal.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            data/fagverk/subject_inventory.json \
            data/fagverk/subject_status.json \
            reports/fagverk/README.md \
            reports/fagverk/subject-baseline.json \
            reports/fagverk/general-engine-audit.json \
            reports/fagverk/psykologi-phase3-audit.json \
            tests/fagverk-general-engine.test.mjs \
            tests/fagverk-subject-inventory.test.mjs
          git status --short
          git commit -m 'Materialiser Psykologi som tredje Fase 3-fag'
          git push origin "HEAD:${HEAD_BRANCH}"
