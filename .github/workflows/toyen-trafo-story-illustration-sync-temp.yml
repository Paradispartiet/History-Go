name: Tøyen trafo Story illustration runtime sync (temporary)
on:
  push:
    branches:
      - feat/toyen-trafo-objects-20261104
    paths:
      - .github/workflows/toyen-trafo-story-illustration-sync-temp.yml
      - tests/toyen-trafo-objects-collection.test.mjs
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate source-bounded Place-open / Story
        run: |
          npm ci --no-audit --no-fund
          npm run place-open:build
          npm run place-open:check
          npm run check:stories
          node --test tests/toyen-trafo-objects-collection.test.mjs
          git status --short
      - name: Commit only derived Story and Place-open outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/runtime/place-open/toyen_trafo.json data/runtime/stories-all
          if ! git diff --cached --quiet; then
            git diff --cached --name-only
            git commit -m "build(toyen trafo): synchronize illustrated Story and remove invalid Object runtime"
            git push origin HEAD:feat/toyen-trafo-objects-20261104
          fi
