name: Temporary finalize Civication legacy reachability fix

on:
  push:
    branches:
      - fix/civication-legacy-jobbmails-reachability

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/civication-legacy-jobbmails-reachability
          fetch-depth: 0

      - name: Apply permanent reachability semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          audit = Path('scripts/audit-civication-scene-pipeline.mjs')
          s = audit.read_text()

          constants_marker = 'const DEFAULT_LEGACY_PLAN_TYPES = Object.freeze([\n'
          assert constants_marker in s
          s = s.replace(
            constants_marker,
            'const LEGACY_INVENTORY_SCENE_ROOTS = Object.freeze([\n  "data/Civication/jobbmails"\n]);\n\n' + constants_marker,
            1
          )

          helper_marker = 'export function auditRepository(repoRoot = DEFAULT_REPO_ROOT) {\n'
          helper = '''function isLegacyInventorySceneSource(sourcePath) {\n  const relative = norm(sourcePath).replace(/\\\\/g, "/");\n  return LEGACY_INVENTORY_SCENE_ROOTS.some(\n    (root) => relative === root || relative.startsWith(`${root}/`)\n  );\n}\n\nexport function findDuplicateSceneIds(sceneRecords, ignoredSourceFiles = []) {\n  const ignored = ignoredSourceFiles instanceof Set\n    ? ignoredSourceFiles\n    : new Set(uniq(ignoredSourceFiles));\n  const ids = new Map();\n\n  for (const record of Array.isArray(sceneRecords) ? sceneRecords : []) {\n    if (!norm(record?.id)) continue;\n    if (ignored.has(record.source_path) || isLegacyInventorySceneSource(record.source_path)) continue;\n    if (!ids.has(record.id)) ids.set(record.id, []);\n    ids.get(record.id).push(record);\n  }\n\n  return [...ids.entries()]\n    .filter(([, rows]) => rows.length > 1)\n    .map(([id, rows]) => ({\n      id,\n      occurrences: rows.map((row) => ({\n        path: row.source_path,\n        pointer: row.pointer,\n        type: row.mail_type,\n        family: row.mail_family\n      }))\n    }))\n    .sort((a, b) => a.id.localeCompare(b.id, "en"));\n}\n\n'''
          assert helper_marker in s
          s = s.replace(helper_marker, helper + helper_marker, 1)

          start_marker = '  const compilerIgnoredSourceFiles = new Set(uniq(compiledRegistry?.ignored_source_files));\n'
          end_marker = '\n\n  const missingInternalReferences = [];'
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          s = s[:start] + '  const compilerIgnoredSourceFiles = new Set(uniq(compiledRegistry?.ignored_source_files));\n  const duplicateSceneIds = findDuplicateSceneIds(sceneRecords, compilerIgnoredSourceFiles);' + s[end:]
          audit.write_text(s)

          test = Path('tests/civication-scene-pipeline-ignored-source-duplicates.test.js')
          t = test.read_text()
          t = t.replace(
            '  auditRepository,\n  DEFAULT_REPO_ROOT\n',
            '  auditRepository,\n  DEFAULT_REPO_ROOT,\n  findDuplicateSceneIds\n',
            1
          )
          t = t.replace(
            'const transitionSource = "data/Civication/mailFamilies/naeringsliv/job/mellomleder_fraksjonsvalg.json";\n',
            'const transitionSource = "data/Civication/mailFamilies/naeringsliv/job/mellomleder_fraksjonsvalg.json";\nconst legacyJobmailSources = [\n  "data/Civication/jobbmails/byCivic.json",\n  "data/Civication/jobbmails/mediaCivic.json",\n  "data/Civication/jobbmails/naeringsliv/naeringslivCivic.json"\n];\n',
            1
          )
          duplicate_marker = '''const duplicateBlockers = (audit.blocking_issues || []).filter(\n  (issue) => issue.category === "duplicate_scene_id"\n);\n'''
          inventory_checks = '''const duplicateBlockers = (audit.blocking_issues || []).filter(\n  (issue) => issue.category === "duplicate_scene_id"\n);\nconst inventoriedSceneSources = new Set(\n  (audit.inventory?.formats || []).flatMap((row) => row.paths || [])\n);\n\nfor (const source of legacyJobmailSources) {\n  assert.ok(\n    inventoriedSceneSources.has(source),\n    `${source} must remain inventoried as a legacy scene source`\n  );\n}\n'''
          assert duplicate_marker in t
          t = t.replace(duplicate_marker, inventory_checks, 1)
          occurrence_marker = '''    assert.ok(\n      !ignoredSourceFiles.has(occurrence.path),\n      `duplicate blocker ${issue.id} must not include compiler-ignored source ${occurrence.path}`\n    );\n'''
          occurrence_checks = occurrence_marker + '''    assert.ok(\n      !occurrence.path.startsWith("data/Civication/jobbmails/"),\n      `duplicate blocker ${issue.id} must not include legacy jobbmails source ${occurrence.path}`\n    );\n'''
          assert occurrence_marker in t
          t = t.replace(occurrence_marker, occurrence_checks, 1)
          tail_marker = '''assert.ok(\n  !duplicateBlockers.some((issue) => issue.id === "ml_faction_001"),\n  "ml_faction_001 must not be a canonical duplicate blocker when its transition occurrence is compiler-ignored"\n);\n\nconsole.log("civication-scene-pipeline-ignored-source-duplicates.test.js: OK");\n'''
          tail = '''assert.ok(\n  !duplicateBlockers.some((issue) => issue.id === "ml_faction_001"),\n  "ml_faction_001 must not be a canonical duplicate blocker when its transition occurrence is compiler-ignored"\n);\nassert.ok(\n  !duplicateBlockers.some((issue) => issue.id === "nav_001"),\n  "nav_001 must not be a canonical duplicate blocker when every duplicate occurrence is legacy jobbmails debt"\n);\n\nconst syntheticDuplicates = findDuplicateSceneIds([\n  { id: "runtime_duplicate_probe", source_path: "data/Civication/mailFamilies/probe/a.json" },\n  { id: "runtime_duplicate_probe", source_path: "data/Civication/mailFamilies/probe/b.json" },\n  { id: "legacy_duplicate_probe", source_path: "data/Civication/jobbmails/a.json" },\n  { id: "legacy_duplicate_probe", source_path: "data/Civication/jobbmails/b.json" }\n]);\nassert.deepEqual(\n  syntheticDuplicates.map((issue) => issue.id),\n  ["runtime_duplicate_probe"],\n  "duplicates across active mailFamilies sources must still block while legacy jobbmails duplicates stay non-blocking"\n);\n\nconsole.log("civication-scene-pipeline-ignored-source-duplicates.test.js: OK");\n'''
          assert tail_marker in t
          t = t.replace(tail_marker, tail, 1)
          test.write_text(t)
          PY

      - name: Run focused regression
        run: node tests/civication-scene-pipeline-ignored-source-duplicates.test.js

      - name: Run scene pipeline test family
        run: node tests/run-civication-tests.mjs scene-pipeline

      - name: Verify duplicate audit result
        shell: bash
        run: |
          node scripts/audit-civication-scene-pipeline.mjs --json > /tmp/scene-audit.json
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/scene-audit.json', 'utf8'));
          if (audit.summary.duplicate_scene_ids !== 0) {
            console.error(JSON.stringify(audit.inventory.duplicate_scene_ids, null, 2));
            process.exit(1);
          }
          const leakedLegacy = (audit.inventory.duplicate_scene_ids || []).flatMap((x) => x.occurrences || []).filter((x) => x.path?.startsWith('data/Civication/jobbmails/'));
          if (leakedLegacy.length) {
            console.error(JSON.stringify(leakedLegacy, null, 2));
            process.exit(1);
          }
          console.log(`duplicate_scene_ids=${audit.summary.duplicate_scene_ids}; blocking_issues=${audit.summary.blocking_issues}`);
          NODE

      - name: Commit permanent files only
        shell: bash
        run: |
          git rm .github/workflows/tmp-patch-civication-legacy-jobbmails.yml
          git rm .github/workflows/tmp-diagnose-civication-legacy-jobbmails.yml
          git rm .github/workflows/tmp-finalize-civication-legacy-jobbmails.yml
          git rm .tmp-civication-reachability-diagnostic.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-civication-scene-pipeline.mjs tests/civication-scene-pipeline-ignored-source-duplicates.test.js
          git commit -m "fix(civication): exclude legacy jobbmails from duplicate blockers"
          git push origin HEAD:fix/civication-legacy-jobbmails-reachability
