name: Fagverk Sport legacy adjudication

on:
  pull_request:
    paths:
      - 'data/fag/sport/legacy_theory_adjudication_v1.json'
      - 'data/fag/sport/merke_sport.html'
      - 'data/fagverk/sport/**'
      - 'data/fagverk/fagverk_portal.json'
      - 'scripts/audit-fagverk-sport-legacy-theory.mjs'
      - 'scripts/audit-fagverk-sport-legacy-adjudication.mjs'
      - 'tests/fagverk-sport-legacy-theory-audit.test.mjs'
      - 'tests/fagverk-sport-legacy-theory-adjudication.test.mjs'
      - '.github/workflows/fagverk-sport-legacy-adjudication.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify Sport raw coverage and adjudication
        run: |
          node --check scripts/audit-fagverk-sport-legacy-theory.mjs
          node --check scripts/audit-fagverk-sport-legacy-adjudication.mjs
          node scripts/audit-fagverk-sport-legacy-theory.mjs
          node scripts/audit-fagverk-sport-legacy-adjudication.mjs
          node --test tests/fagverk-sport-legacy-theory-audit.test.mjs
          node --test tests/fagverk-sport-legacy-theory-adjudication.test.mjs
