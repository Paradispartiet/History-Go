name: Scenekunst batch 8 builder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build clean Scenekunst batch 8 branch
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build, validate and publish with stale-main retries
        shell: bash
        run: |
          set -uo pipefail

          FINAL_BRANCH='agent/scenekunst-venues-08-final'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5 6; do
            echo "Batch 8 attempt ${attempt}/6"

            git reset --hard
            git clean -fd
            git fetch origin main
            git checkout -B "${FINAL_BRANCH}" origin/main
            BASE_SHA="$(git rev-parse origin/main)"

            set +e
            (
              set -euo pipefail

              npm run build:tools
              node .github/scripts/build-scenekunst-batch-8.mjs
              npm run places:index:build

              bash scripts/check-places.sh
              bash scripts/check-people.sh
              npm run audit:categories
              npm run audit:quiz-templates
              npm run test:quiz-content-audit
              npm run build:tools
              node dist/tools/validate_nature_maps.mjs
              node dist/tools/validate_lesespor.mjs
              npm run typecheck:web
              npm run build:scripts
              npm run knowledge:canonical:check
              npm run knowledge:legacy:check
              npm run audit:knowledge
              npm run test:knowledge-v2
              node --test tests/knowledge-canonical-storage-contract.test.js
              git diff --check

              node <<'NODE'
              const fs = require('fs');
              const file = 'reports/scenekunst-new-venues-batch-8-2026-07-23.json';
              const report = JSON.parse(fs.readFileSync(file, 'utf8'));
              report.validation.placesIndexBuild = 'pass';
              report.validation.placesChecks = 'pass';
              report.validation.categoryAudit = 'pass';
              report.validation.fullRepositoryGates = 'pass';
              report.validatedAt = new Date().toISOString();
              fs.writeFileSync(file, JSON.stringify(report, null, 2) + '\n');
              NODE

              git add \
                data/places/scenekunst/nordland/figurteatret_i_nordland.json \
                data/places/scenekunst/nordland/teater_nor_stamsund.json \
                data/places/scenekunst/troms/kvaaniteatteri_halti_kulturscene.json \
                data/places/scenekunst/rogaland/ras_sandnes_kulturhus.json \
                data/places/scenekunst/ostfold/parkteatret_moss.json \
                reports/scenekunst-new-venues-batch-8-2026-07-23.json \
                reports/scenekunst-new-venues-batch-8-2026-07-23.md \
                data/places/manifest.json \
                data/places/places_index.json

              CHANGED_COUNT="$(git diff --cached --name-only | wc -l | tr -d ' ')"
              if [ "${CHANGED_COUNT}" != '9' ]; then
                echo "Expected exactly 9 changed files, got ${CHANGED_COUNT}"
                git diff --cached --name-only
                exit 3
              fi

              git fetch origin main
              CURRENT_MAIN="$(git rev-parse origin/main)"
              if [ "${CURRENT_MAIN}" != "${BASE_SHA}" ]; then
                echo "main moved from ${BASE_SHA} to ${CURRENT_MAIN}; retrying"
                exit 2
              fi

              git commit -m 'Add eighth Scenekunst venue batch on current main'
              git push --force origin HEAD:"${FINAL_BRANCH}"
            )
            status=$?
            set -e

            if [ "${status}" -eq 0 ]; then
              echo 'Batch 8 published successfully.'
              exit 0
            fi

            if [ "${status}" -ne 2 ]; then
              echo "Batch 8 failed with non-retryable status ${status}."
              exit "${status}"
            fi

            echo 'main moved during validation; waiting before a clean retry.'
            sleep 20
          done

          echo 'main did not remain stable across six attempts.'
          exit 2
