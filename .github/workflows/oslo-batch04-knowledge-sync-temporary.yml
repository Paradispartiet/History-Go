name: Regenerate Oslo batch04 question Knowledge
on:
  push:
    branches:
      - history-go/oslo-batch04-editorial-debt-20261022
    paths:
      - .github/workflows/oslo-batch04-knowledge-sync-temporary.yml
permissions:
  contents: write
concurrency:
  group: oslo-batch04-knowledge-sync-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rebuild only generated Knowledge against latest branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=history-go/oslo-batch04-editorial-debt-20261022
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard FETCH_HEAD
            npm run knowledge:canonical:write
            npm run knowledge:canonical:check
            git add data/knowledge/knowledge_units.generated.json
            if git diff --cached --quiet; then echo 'Knowledge already synchronized'; exit 0; fi
            git commit -m 'build(history): sync canonical Knowledge after Grev Wedels quiz correction'
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
          done
          echo 'Knowledge sync could not fast-forward after concurrent changes' >&2
          exit 1
