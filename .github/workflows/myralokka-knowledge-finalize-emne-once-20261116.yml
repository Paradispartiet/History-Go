name: Myralokka Knowledge final reviewed emne regenerate (one-time PR)
on:
  pull_request:
    paths:
      - ".github/workflows/myralokka-knowledge-finalize-emne-once-20261116.yml"
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 7342
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate and validate canonical Knowledge
        run: |
          npm ci --no-audit --no-fund
          npm run knowledge:canonical:write
          npm run knowledge:canonical:check
      - name: Verify all 42 reviewed links and retained earned history
        run: |
          node --input-type=commonjs - <<'NODE'
          const assert=require('node:assert/strict');
          const quiz=require('./data/quiz/natur/myralokka_sets.json');
          const preserved=require('./data/knowledge/preserved_quiz_sources/myralokka_myragarden_legacy_20261116.json');
          const units=require('./data/knowledge/knowledge_units.generated.json').units;
          const items=require('./data/knowledge/knowledge_emne_review_queue.generated.json').items;
          const byId=new Map(units.map(x=>[x.knowledge_unit_id,x]));
          const qs=quiz.sets.flatMap(s=>s.questions);
          assert.equal(qs.length,42);
          assert.equal(qs.filter(q=>q.knowledge_link_status==='linked' && q.knowledge_link_evidence?.method==='explicit' && q.knowledge_link_evidence.reviewedAt==='2026-11-16').length,42);
          assert.equal(qs.filter(q=>q.knowledge_link_status==='editorial_review_required').length,0);
          for(const q of qs){
            assert.ok(q.primary_knowledge_unit_id && byId.has(q.primary_knowledge_unit_id),'Missing current KU: '+q.id);
            assert.deepEqual(byId.get(q.primary_knowledge_unit_id).emne_ids,q.emne_ids,'Emne drift: '+q.id);
            assert.ok(q.source.length);
            assert.equal(q.options[q.answerIndex],q.answer);
          }
          for(const q of preserved.questions){
            assert.ok(byId.has(q.primary_knowledge_unit_id),'Historic Knowledge memory missing: '+q.id);
            assert.ok(!qs.some(item=>item.id===q.id||item.quiz_id===q.quiz_id),'Retired history is playable');
          }
          assert.equal(items.filter(x=>x.target_id==='myralokka' && x.file==='data/quiz/natur/myralokka_sets.json').length,0);
          NODE
          node --test tests/myralokka-placecard-collections-v2.test.mjs
      - name: Scope guard and commit canonical outputs
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          changes="$(git diff --name-only)"
          printf 'Generated output files:\n%s\n' "$changes"
          unexpected="$(printf '%s\n' "$changes" | grep -vE '^(data/quiz/natur/myralokka_sets\.json|data/knowledge/knowledge_units\.generated\.json|data/knowledge/knowledge_emne_review_queue\.generated\.json|reports/knowledge-id-backfill\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected regenerated file: $unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz/natur/myralokka_sets.json data/knowledge/knowledge_units.generated.json data/knowledge/knowledge_emne_review_queue.generated.json reports/knowledge-id-backfill.json
          git rm .github/workflows/myralokka-knowledge-finalize-emne-once-20261116.yml
          git commit -m "chore(myralokka): regenerate canonical Knowledge for 42 source-reviewed emner"
          git push origin "HEAD:refs/heads/$HEAD_REF"
