name: Diagnose Oslo coordinate batch 29

on:
  push:
    branches:
      - agent/oslo-coordinate-control-batch-29-v3

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-29-v3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:tools

      - name: Capture normative address-finder results
        shell: bash
        run: |
          set +e
          out=reports/oslo-coordinate-control-batch-29-v3/address-results
          mkdir -p "$out"

          node dist/tools/address-first-coordinate-finder.mjs --address "Hausmanns gate 14 Oslo" | tee "$out/kulturkirken_jakob_litteratur.json"
          jakob=${PIPESTATUS[0]}

          node dist/tools/address-first-coordinate-finder.mjs --address "Universitetsgata 22-24 Oslo" | tee "$out/norli_universitetsgata.json"
          norli=${PIPESTATUS[0]}

          node dist/tools/address-first-coordinate-finder.mjs --address "Dalsbergstien 3 Oslo" | tee "$out/ruth_maier_minne.json"
          ruth=${PIPESTATUS[0]}

          node dist/tools/address-first-coordinate-finder.mjs --address "Prestvegen 1 Rudshøgda" | tee "$out/proysenhuset_rudshogda.json"
          proysen=${PIPESTATUS[0]}

          node dist/tools/address-first-coordinate-finder.mjs --address "Borghild Ruds vei 3 Nittedal" | tee "$out/alf_proysen_statue_nittedal.json"
          alf=${PIPESTATUS[0]}

          cat > "$out/command-status.json" <<EOF
          {
            "kulturkirken_jakob_litteratur": $jakob,
            "norli_universitetsgata": $norli,
            "ruth_maier_minne": $ruth,
            "proysenhuset_rudshogda": $proysen,
            "alf_proysen_statue_nittedal": $alf
          }
          EOF

          exit 0

      - name: Persist diagnostics and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/oslo-coordinate-batch-29-diagnose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/oslo-coordinate-control-batch-29-v3 .github/workflows/oslo-coordinate-batch-29-diagnose.yml
          git commit -m "Capture Oslo coordinate batch 29 address diagnostics"
          git push origin HEAD
