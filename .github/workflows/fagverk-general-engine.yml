name: Fagverk general subject engine

on:
  pull_request:
    paths:
      - 'fagverk.html'
      - 'fagverk-forside.html'
      - 'merke.html'
      - 'data/categories/category_contract.json'
      - 'data/fag/fag_manifest.json'
      - 'data/fag/**/merke*.html'
      - 'data/fag/by/teori.html'
      - 'data/fag/by/pensum_by.json'
      - 'data/fag/by/emner_by.json'
      - 'data/fag/by/fagkart_by.json'
      - 'data/fag/by/methods_by.json'
      - 'data/fagverk/*/**'
      - 'data/badges/**'
      - 'js/fagverk-subject-core.js'
      - 'js/fagverk-subject-model.js'
      - 'js/fagverk.js'
      - 'js/fagverk-ia-v3.js'
      - 'js/fagverk-ia-v3-detail.js'
      - 'js/fagverk-ia-v3-badge-progress.js'
      - 'js/fagverk-forside.js'
      - 'js/merke-fallback.js'
      - 'css/fagverk-general.css'
      - 'css/fagverk-ia-v3.css'
      - 'css/fagverk-ia-v3-detail.css'
      - 'css/fagverk-ia-v3-badge-progress.css'
      - 'css/fagverk-forside.css'
      - 'docs/FAGVERK_NAVIGATION.md'
      - 'docs/FAGVERK_IA_V3_*.md'
      - 'scripts/audit-fagverk-general-engine.mjs'
      - 'scripts/audit-fagverk-badge-equivalence.mjs'
      - 'scripts/audit-fagverk-by-legacy-theory.mjs'
      - 'scripts/audit-fagverk-religion-legacy-stub.mjs'
      - 'scripts/audit-fagverk-scenekunst-legacy-stub.mjs'
      - 'tests/fagverk-general-engine.test.mjs'
      - 'tests/fagverk-ia-v3-shell.test.mjs'
      - 'tests/fagverk-ia-v3-detail.test.mjs'
      - 'tests/fagverk-badge-equivalence.test.mjs'
      - 'tests/fagverk-by-legacy-theory-audit.test.mjs'
      - 'tests/fagverk-religion-legacy-stub-retirement.test.mjs'
      - 'tests/fagverk-scenekunst-legacy-stub-retirement.test.mjs'
      - 'reports/fagverk/general-engine-audit.json'
      - 'tests/politikk-fag-integration.test.mjs'
      - '.github/workflows/fagverk-general-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate manifest-first subject engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check engine and audits
        run: |
          node --check js/fagverk-subject-core.js
          node --check js/fagverk-subject-model.js
          node --check js/fagverk.js
          node --check js/fagverk-ia-v3.js
          node --check js/fagverk-ia-v3-detail.js
          node --check js/fagverk-ia-v3-badge-progress.js
          node --check js/fagverk-forside.js
          node --check js/merke-fallback.js
          node --check scripts/audit-fagverk-subject-inventory.mjs
          node --check scripts/audit-fagverk-general-engine.mjs
          node --check scripts/audit-fagverk-badge-equivalence.mjs
          node --check scripts/audit-fagverk-by-legacy-theory.mjs
          node --check scripts/audit-fagverk-religion-legacy-stub.mjs
          node --check scripts/audit-fagverk-scenekunst-legacy-stub.mjs
      - name: Verify inventory and status progression
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs
          node --test tests/fagverk-subject-inventory.test.mjs
      - name: Verify general subject engine
        run: |
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-badge-equivalence.mjs
          node scripts/audit-fagverk-by-legacy-theory.mjs
          node scripts/audit-fagverk-religion-legacy-stub.mjs
          node scripts/audit-fagverk-scenekunst-legacy-stub.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-ia-v3-shell.test.mjs
          node --test tests/fagverk-ia-v3-detail.test.mjs
          node --test tests/fagverk-badge-equivalence.test.mjs
          node --test tests/fagverk-by-legacy-theory-audit.test.mjs
          node --test tests/fagverk-religion-legacy-stub-retirement.test.mjs
          node --test tests/fagverk-scenekunst-legacy-stub-retirement.test.mjs
          node --test tests/politikk-fag-integration.test.mjs
