name: Vinmonopolets hovedlager Fagverk release
on:
  push:
    branches:
      - content/vinmonopolet-lager-fagverk-v1-20261027
    paths:
      - .github/workflows/vinmonopolet-lager-fagverk-v1.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/vinmonopolet-lager-fagverk-v1-20261027
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild canonical place index, Place-open and Fagverk release
        run: |
          npm run places:index:build
          npm run place-open:build
          node scripts/build-fagverk-release-manifest.mjs
      - name: Commit deterministic runtime outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/places_index.json data/runtime/place-open/ data/fagverk/fagverk_release.json
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize Vinmonopolet Fagverk, Place-open and main index"
            git push
          fi
      - name: Verify Fagverk, existing quiz and image preserved
        run: |
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run place-open:check
          npm run places:index:check
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const fp='data/places/naeringsliv/oslo/places_naeringsliv/vinmonopolet_lager.json';
          const p=JSON.parse(fs.readFileSync(fp,'utf8'));
          const rt=JSON.parse(fs.readFileSync('data/runtime/place-open/vinmonopolet_lager.json','utf8'));
          const rg=JSON.parse(fs.readFileSync('data/fagverk/fagverk_registry.json','utf8'));
          const quiz=JSON.parse(fs.readFileSync('data/quiz/naeringsliv/vinmonopolet_lager_sets_merged.json','utf8'));
          assert.equal(p.id,'vinmonopolet_lager');
          assert.equal(p.year,1933);
          assert.equal(p.fagverk.status,'curated');
          assert.equal(p.fagverk.article.length,3);
          assert.equal(p.fagverk.lenses.length,3);
          assert.equal(rg.placeLinks.vinmonopolet_lager.status,'curated');
          assert.equal(rt.place?.fagverk?.status,'curated');
          assert.equal(p.image,'bilder/places/Vinmonopolets_hovedlager.PNG');
          assert.deepEqual(quiz.sets.map(s=>s.questions.length),[6,6,6,6,6]);
          console.log('PASS: Vinmonopolet Place/Fagverk; existing image and 30 quiz questions retained');
          NODE
      - name: Remove one-time producer without rewriting any canonical place data
        run: |
          git rm .github/workflows/vinmonopolet-lager-fagverk-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time Vinmonopolet Fagverk producer"
          git push
