name: One-time Nationaltheatret factuality audit batch 2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/nationaltheatret-factuality-audit-batch-2-trigger.txt

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize production branch with fresh main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main agent/nationaltheatret-factuality-audit-people-batch-2
          git checkout -B agent/nationaltheatret-factuality-audit-people-batch-2 origin/agent/nationaltheatret-factuality-audit-people-batch-2
          git merge --no-edit origin/main

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run canonical factuality contracts
        run: node --test tests/factuality-contract.test.mjs tests/people-popup-system-contract.test.mjs

      - name: Run existing modern ensemble regression
        run: node --test tests/nationaltheatret-modern-ensemble-people-v2.test.js

      - name: Run factuality audit batch 2 regression
        run: node --test tests/nationaltheatret-factuality-audit-people-batch-2.test.js

      - name: Typecheck and build tools
        run: |
          npm run typecheck:tools
          npm run build:tools

      - name: Regenerate and check people-popup readiness
        run: |
          npm run audit:people-popup-readiness
          npm run audit:people-popup-readiness:check

      - name: Build and check Civication History People index
        run: |
          npm run build:scripts
          npm run civication:history-people:build
          npm run civication:history-people:check

      - name: Run full people validation
        run: bash scripts/check-people.sh

      - name: Verify browser build
        run: npm run build:web:check

      - name: Commit regenerated outputs
        shell: bash
        run: |
          set -euo pipefail
          git add data/Civication/historyPeople_index.json reports/people-popup-readiness.json reports/people-popup-readiness.md
          git status --short
          if git diff --cached --quiet; then
            echo "No regenerated output changes"
          else
            git commit -m "Regenerate people outputs after factuality audit batch 2"
          fi
          git push origin HEAD:agent/nationaltheatret-factuality-audit-people-batch-2
