name: Oslo address anchor visual QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  visual-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-oslo-address-anchors-torggata-storgata-v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build runtime coordinate QA page
        run: |
          mkdir -p reports/oslo-address-anchor-repair-20260719/visual-qa
          cat > reports/oslo-address-anchor-repair-20260719/visual-qa/runtime-marker-map.html <<'HTML'
          <!doctype html>
          <html lang="no">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Runtime marker visual QA</title>
            <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
            <style>
              html, body, #map { width: 100%; height: 100%; margin: 0; }
              body { font-family: system-ui, sans-serif; }
              #title { position: absolute; z-index: 1000; top: 12px; left: 50%; transform: translateX(-50%); background: white; padding: 10px 14px; border: 2px solid #111; border-radius: 8px; font-weight: 700; box-shadow: 0 2px 8px #0003; }
              .qa-label { background: white; border: 2px solid #111; border-radius: 6px; padding: 4px 7px; white-space: nowrap; font-weight: 700; }
            </style>
          </head>
          <body>
            <div id="title">Laster runtime-markør…</div>
            <div id="map"></div>
            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
            <script>
              const old = {
                torggata: [59.91535, 10.75335],
                storgata: [59.9154, 10.7539],
                torggata_blad: [59.91504, 10.75326]
              };
              const params = new URLSearchParams(location.search);
              const id = params.get('id');
              const map = L.map('map', { zoomControl: true });
              L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
              fetch('../../../data/places/places_index.json').then(r => r.json()).then(rows => {
                const place = rows.find(p => p.id === id);
                if (!place) throw new Error(`Mangler runtime place ${id}`);
                const current = [place.lat, place.lon];
                const previous = old[id];
                document.getElementById('title').textContent = `${place.name} – runtime-markør etter koordinatreparasjon`;
                L.circle(current, { radius: place.r || 60, color: '#14833b', weight: 3, fillOpacity: 0.08 }).addTo(map);
                L.circleMarker(current, { radius: 10, color: '#0b5d2a', weight: 4, fillColor: '#21b857', fillOpacity: 1 }).addTo(map)
                  .bindPopup(`<b>NY runtime-markør</b><br>${place.lat}, ${place.lon}`).openPopup();
                L.marker(current, { icon: L.divIcon({ className: '', html: '<div class="qa-label">NY runtime-markør</div>', iconAnchor: [-12, 18] }) }).addTo(map);
                L.circleMarker(previous, { radius: 9, color: '#9d1515', weight: 4, fillColor: '#e24444', fillOpacity: 1 }).addTo(map);
                L.marker(previous, { icon: L.divIcon({ className: '', html: '<div class="qa-label">GAMMEL markør</div>', iconAnchor: [-12, 18] }) }).addTo(map);
                map.fitBounds([current, previous], { padding: [150, 150], maxZoom: 17 });
                window.__QA_READY__ = { id, place, current, previous };
              }).catch(error => {
                document.getElementById('title').textContent = String(error);
                window.__QA_ERROR__ = String(error);
              });
            </script>
          </body>
          </html>
          HTML

      - name: Render runtime marker screenshots
        run: |
          python3 -m http.server 4173 >/tmp/history-go-qa-server.log 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1100, height: 760 }, deviceScaleFactor: 1 });
            const ids = ['torggata', 'storgata', 'torggata_blad'];
            const results = {};
            for (const id of ids) {
              await page.goto(`http://127.0.0.1:4173/reports/oslo-address-anchor-repair-20260719/visual-qa/runtime-marker-map.html?id=${id}`, { waitUntil: 'networkidle' });
              await page.waitForFunction(() => window.__QA_READY__ || window.__QA_ERROR__, null, { timeout: 30000 });
              const error = await page.evaluate(() => window.__QA_ERROR__ || null);
              if (error) throw new Error(`${id}: ${error}`);
              const state = await page.evaluate(() => window.__QA_READY__);
              results[id] = state;
              await page.waitForTimeout(2500);
              await page.screenshot({ path: `reports/oslo-address-anchor-repair-20260719/visual-qa/${id}.png`, fullPage: true });
            }
            fs.writeFileSync('reports/oslo-address-anchor-repair-20260719/visual-qa/runtime-marker-state.json', JSON.stringify(results, null, 2) + '\n');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: oslo-address-anchor-visual-qa
          path: |
            reports/oslo-address-anchor-repair-20260719/visual-qa/*.png
            reports/oslo-address-anchor-repair-20260719/visual-qa/runtime-marker-state.json
          if-no-files-found: error
