name: Oslo coordinate batch 28 evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-coordinate-batch-28-evidence.yml'

permissions:
  contents: read

jobs:
  evidence:
    if: github.event.pull_request.head.ref == 'agent/oslo-coordinate-control-batch-28'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect read-only square-object evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT='reports/oslo-coordinate-control-batch-28'
          mkdir -p "$OUT/sources"

          run_curl() {
            local url="$1"
            local file="$2"
            set +e
            curl --retry 3 --retry-delay 2 -fsSL -A 'History-Go-coordinate-audit/1.0' "$url" \
              | tee "$OUT/sources/$file" >/dev/null
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$code" > "$OUT/sources/$file.exit-status.txt"
          }

          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Bankplassen%20Oslo' 'bankplassen-nominatim.json'
          run_curl 'https://www.wikidata.org/wiki/Special:EntityData/Q4856441.json' 'bankplassen-wikidata-Q4856441.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Christiania%20Torv%20Oslo' 'christiania-torv-nominatim.json'

          cat > "$OUT/source-notes.md" <<'EOF'
          # Batch 28 – identitets- og overlapnotater

          - `bankplassen` representerer selve Bankplassen som offentlig plass, ikke `grunnlovsbygget_bankplassen`/Den gamle Norges Bank som enkeltbygg.
          - `christiania_torv` representerer selve Christiania Torv, ikke `gamle_radhus` som enkeltbygg ved torvet.
          - Eksisterende Wikidata/OSM-kilder brukes bare dersom de eksplisitt identifiserer plassobjektet; ingen bygningsadresse brukes som erstatning for et torg.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch-28-evidence
          path: reports/oslo-coordinate-control-batch-28
          if-no-files-found: error
