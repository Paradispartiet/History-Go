name: Temp Jernbanetorget duplicate migration

on:
  push:
    branches:
      - 'agent/jernbanetorget-duplicate-migration-final'
    paths:
      - 'scripts/jernbanetorget-duplicate-migration-finalizer.mjs'
      - '.github/workflows/temp-jernbanetorget-duplicate-migration.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  rebind-validate-merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: Paradispartiet/History-Go
      BRANCH: agent/jernbanetorget-duplicate-migration-final
    steps:
      - name: Check out trigger branch
        uses: actions/checkout@v4
        with:
          ref: agent/jernbanetorget-duplicate-migration-final
          fetch-depth: 0

      - name: Preserve migration script
        run: cp scripts/jernbanetorget-duplicate-migration-finalizer.mjs /tmp/jernbanetorget-migration.mjs

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebind, migrate, validate and merge
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Jernbanetorget migration attempt $attempt"
            git fetch origin main
            base_sha="$(git rev-parse origin/main)"
            git reset --hard "$base_sha"

            node /tmp/jernbanetorget-migration.mjs
            npm run places:index:build
            npm run audit:places-split-manifest-sync
            npm run places:index:check
            npm run test:coordinate-source-contract
            npm run places:coords:quality
            npm run places:coords:intake
            npm run places:coords:evidence:audit
            npm run places:aliases:check
            set +e
            npm run health:places
            health_exit=$?
            set -e
            echo "health:places exit code: $health_exit"
            if rg -n '"jernbanetorget_trafikknutepunkt"' data; then
              echo "Legacy Jernbanetorget place ID remains in active data" >&2
              exit 1
            fi
            git diff --check

            git fetch origin main
            latest_sha="$(git rev-parse origin/main)"
            if [[ "$latest_sha" != "$base_sha" ]]; then
              echo "Main moved during validation; retrying from newest main"
              continue
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A \
              data/Civication/map/historyGoPlaceMapping.naeringsliv.json \
              data/coordinate-evidence/manifest.json \
              data/coordinate-evidence/oslo/naeringsliv/jernbanetorget_trafikknutepunkt.json \
              data/i18n/content/places/en.json \
              data/i18n/content/places/es.json \
              data/i18n/content/places/pt.json \
              data/places/naeringsliv/oslo/places_naeringsliv.json \
              data/places/naeringsliv/oslo/places_naeringsliv/jernbanetorget_trafikknutepunkt.json \
              data/places/naeringsliv/oslo/places_naeringsliv_index.json \
              data/places/naeringsliv/oslo/places_naeringsliv_manifest.json \
              data/places/places_index.json \
              docs/coordinates/coordinate-control-protocol.md \
              tools/check_place_id_aliases.mts \
              reports/jernbanetorget-duplicate-migration-final/
            git diff --cached --check
            git commit -m "Migrate duplicate Jernbanetorget place id"
            git push --force origin HEAD:"$BRANCH"

            pr_number="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')"
            if [[ -z "$pr_number" ]]; then
              echo "Could not resolve open PR for $BRANCH" >&2
              exit 1
            fi
            gh pr ready "$pr_number" --repo "$REPO" || true
            if gh pr merge "$pr_number" --squash --repo "$REPO"; then
              echo "Merged PR #$pr_number"
              exit 0
            fi
            echo "Merge raced with main; retrying"
          done

          echo "Could not merge after five fresh-main attempts" >&2
          exit 1
