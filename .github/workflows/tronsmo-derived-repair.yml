name: Tronsmo derived-data repair

on:
  push:
    branches:
      - agent/tronsmo-bokhandel-completion-20260910

permissions:
  contents: write

jobs:
  repair:
    if: ${{ contains(github.event.head_commit.message, '[tronsmo-derived-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Reject copy counts as timeline years and update regression fixture
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const builderPath='scripts/build-epoke-place-index.mjs';
          const builderBefore=fs.readFileSync(builderPath,'utf8');
          const oldGuard='      !/\\brema\\s*$/i.test(beforeYear) &&\n      !(/,\\s*$/.test(beforeYear) && /^\\s+oslo\\b/i.test(afterYear))';
          const newGuard='      !/\\brema\\s*$/i.test(beforeYear) &&\n      !/^\\s+(?:nummererte\\s+)?eksemplarer?\\b/i.test(afterYear) &&\n      !(/,\\s*$/.test(beforeYear) && /^\\s+oslo\\b/i.test(afterYear))';
          const builderAfter=builderBefore.replace(oldGuard,newGuard);
          if (builderAfter === builderBefore) throw new Error('Expected production-year guard was not found');
          fs.writeFileSync(builderPath,builderAfter);

          const testPath='tests/epoke-place-index.test.mjs';
          const testBefore=fs.readFileSync(testPath,'utf8');
          let testAfter=testBefore.replace(
            'assert.equal(index.stats.verified_place_production_milestone_count, 494);',
            'assert.equal(index.stats.verified_place_production_milestone_count, 497);'
          );
          const anchor='  assert.deepEqual(exactProductionClaimYears("Den står ved Rema 1000 Frysja."), []);';
          const regression='  assert.deepEqual(exactProductionClaimYears("Produktsiden oppgir 110 bidragsytere og 1500 nummererte eksemplarer."), []);';
          if (!testAfter.includes(regression)) testAfter=testAfter.replace(anchor,`${anchor}\n${regression}`);
          if (testAfter === testBefore) throw new Error('Expected epoch regression fixture was not updated');
          fs.writeFileSync(testPath,testAfter);
          NODE
      - name: Regenerate Fagverk release and epoch index
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          npm run epoker:places:build
      - name: Verify exact derived contracts
        run: |
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run epoker:places:check
          node --test tests/epoke-place-index.test.mjs
          node scripts/validate-place-description-production-v4_2_policy.mjs --all
          node scripts/audit-fagverk-place-pages.mjs
          node --test tests/tronsmo-bokhandel-completion.test.mjs
      - name: Commit generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-epoke-place-index.mjs tests/epoke-place-index.test.mjs data/fagverk/fagverk_release.json data/epoker/epoke-place-index.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No derived changes to commit'
          else
            git commit -m "Regenerate Tronsmo Fagverk and epoch derivatives [tronsmo-derived-materialized]"
            git push
          fi
