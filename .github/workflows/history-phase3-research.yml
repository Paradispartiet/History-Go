name: History phase 3 research extract

on:
  push:
    branches:
      - agent/historie-makt-stat-institusjoner-phase-3

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[phase3-research]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Extract current domain objects
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';

          const read = async (path) => JSON.parse(await fs.readFile(path, 'utf8'));
          const fagkart = await read('data/fag/historie/fagkart_historie_canonical_v4_5.json');
          const pensum = await read('data/fag/historie/historiepensum_canonical_v4_5.json');
          const emnerRaw = await read('data/fag/historie/emner_historie_canonical_v4_5.json');
          const mappingRaw = await read('data/fag/historie/emnemapping_historie_canonical_v4_5.json');
          const methods = await read('data/fag/historie/methods_historie_canonical_v4_5.json');
          const generator = await read('data/fag/historie/quiz_generator_rules_historie_v5_1_source_priority_patch.json');

          const emner = Array.isArray(emnerRaw) ? emnerRaw : emnerRaw.emner || [];
          const mappings = Array.isArray(mappingRaw) ? mappingRaw : mappingRaw.mappings || [];
          const domainId = 'his_makt_stat_institusjoner';
          const category = fagkart.categories.find((item) => item.id === domainId);
          const domain = pensum.domains.find((item) => item.domain_id === domainId);
          const emneIds = domain.emne_ids;
          const selectedEmner = emner.filter((item) => emneIds.includes(item.emne_id));
          const selectedMappings = mappings.filter((item) => emneIds.includes(item.emne_id));
          const methodIds = [...new Set(domain.method_ids || [])];
          const selectedMethods = methods.methods.filter((item) => methodIds.includes(item.method_id));

          const report = {
            generated_at: new Date().toISOString(),
            counts: {
              total_emner: emner.length,
              total_methods: methods.methods.length,
              total_mappings: mappings.length,
              total_hooks: fagkart.categories.flatMap((item) => item.topic_hooks || []).length
            },
            category,
            domain,
            emner: selectedEmner,
            mappings: selectedMappings,
            methods: selectedMethods,
            generator_profile: generator.domain_profiles?.[domainId] || null,
            normal_opening_contract: generator.normal_opening_contract,
            canonical_inputs: generator.canonical_inputs
          };

          await fs.mkdir('reports/historie-canonical-migration', { recursive: true });
          await fs.writeFile(
            'reports/historie-canonical-migration/makt-stat-phase3-research.json',
            `${JSON.stringify(report, null, 2)}\n`
          );
          NODE

          rm .github/workflows/history-phase3-research.yml

      - name: Commit research extract
        run: |
          git add reports/historie-canonical-migration/makt-stat-phase3-research.json \
            .github/workflows/history-phase3-research.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Historie: kartlegg fase 3-grunnlaget [phase3-research]'
          git push origin HEAD:${{ github.ref_name }}
