name: Fix Telegraf method

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/oslo-quiz-telegrafbygningen-5x7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Replace invalid method and regenerate context
        run: node scripts/fix-telegraf-method.mjs
      - name: Commit generated files
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz/production_briefs/naeringsliv/telegrafbygningen.json data/quiz/naeringsliv/telegrafbygningen_sets_merged.json data/quiz/production_context/naeringsliv/telegrafbygningen.json
          git commit -m "Bruk kanonisk metode i Telegrafbygningen-quizen"
          git push origin HEAD:${{ github.head_ref }}
