name: TEMP Kulturkirken Jakob mandatory rule preflight
on:
  push:
    branches:
      - agent/kulturkirken-jakob-collections-evidence-20261103
    paths:
      - '.github/workflows/temp-jakob-preflight-refresh-20261103.yml'
permissions:
  contents: write
concurrency:
  group: kulturkirken-jakob-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refresh-rule-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact current production rule hashes through canonical helper
        run: |
          set -euo pipefail
          node scripts/place-production-rule-preflight.mjs record \
            --workcard reports/place-production/kulturkirken-jakob-workcard-current.json \
            --place-id kulturkirken_jakob_litteratur \
            --category musikk
      - name: Verify workcard rule evidence and commit only it
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/place-production/kulturkirken-jakob-workcard-current.json
          git diff --cached --check
          git commit -m 'docs(jakob): renew canonical READ-FIRST evidence for current rules'
          git push origin "HEAD:${GITHUB_REF_NAME}"
