name: Tøyenbadet People staging claim parity — one-time QA
on:
  push:
    branches: [feat/toyenbadet-people-editorial-profiles-20261103]
    paths:
      - '.github/workflows/toyenbadet-people-staging-qa-once-20261103.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/toyenbadet-people-editorial-profiles-20261103
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify 19 sourced claims, identity separation, and no unlicensed People publication
        run: |
          node --test tests/toyenbadet-people-staging-source-gate.test.mjs
          node --test tests/toyenbadet-source-backed-objects.test.mjs tests/toyenbadet-modern-photos-before-after.test.mjs tests/toyenbadet-asplan-viak-brand.test.mjs
          node - <<'JS'
          const fs=require('node:fs');
          const source=JSON.parse(fs.readFileSync('data/places/sport/europa/norway/oslo_sport/toyenbadet.json'));
          const runtime=JSON.parse(fs.readFileSync('data/runtime/place-open/toyenbadet.json'));
          const staging=JSON.parse(fs.readFileSync('data/people/staging/toyenbadet_people_20261103.json'));
          if(JSON.stringify(source.place_card_profile.collection_ids)!==JSON.stringify(['objects','brands','competitions']))throw Error('People incorrectly activated in canonical');
          if(JSON.stringify(runtime.place.place_card_profile.collection_ids)!==JSON.stringify(source.place_card_profile.collection_ids))throw Error('Runtime drift');
          if(runtime.people?.some(p=>staging.profiles.some(s=>s.id===p.id)))throw Error('Staged People leaked into runtime');
          console.log('Tøyenbadet People staging holdback and existing 3 collections: PASS');
          JS
