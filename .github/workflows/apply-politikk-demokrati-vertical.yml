name: Apply politics democracy vertical quality chain

on:
  push:
    branches:
      - agent/politikk-demokrati-vertical-chain
    paths:
      - .github/workflows/apply-politikk-demokrati-vertical.yml
      - tools/politikk-demokrati-migration-gz/**

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply and validate canonical democracy upgrade
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DIR="reports/politikk-canonical-migration"
          VALIDATION="$REPORT_DIR/demokrati-representasjon-vertical-chain-validation.txt"
          mkdir -p "$REPORT_DIR"
          : > "$VALIDATION"

          {
            echo "# Politikk vertikal validering – politikk-demokrati-vertical-2026-07-24"
            echo "## Reconstruct migration"
          } | tee -a "$VALIDATION"

          cat tools/politikk-demokrati-migration-gz/part-*.b64 \
            | base64 --decode \
            | gunzip \
            > tools/apply-politikk-demokrati-vertical.mjs
          echo "PASS | Migreringsscript rekonstruert" | tee -a "$VALIDATION"

          node --check tools/apply-politikk-demokrati-vertical.mjs 2>&1 | tee -a "$VALIDATION"
          echo "PASS | Migreringsscript har gyldig syntaks" | tee -a "$VALIDATION"

          node tools/apply-politikk-demokrati-vertical.mjs 2>&1 | tee -a "$VALIDATION"
          rm -rf tools/politikk-demokrati-migration-gz tools/politikk-demokrati-migration-parts

          node --check tools/validate-politikk-demokrati-vertical.mjs 2>&1 | tee -a "$VALIDATION"
          echo "PASS | Permanent validator har gyldig syntaks" | tee -a "$VALIDATION"
          node tools/validate-politikk-demokrati-vertical.mjs 2>&1 | tee -a "$VALIDATION"

          node <<'NODE' 2>&1 | tee -a "$VALIDATION"
          const fs = require('node:fs');
          const files = [
            'data/fag/politikk/fagkart_politikk_canonical_v4_5.json',
            'data/fag/politikk/emner_politikk_canonical_v4_5.json',
            'data/fag/politikk/methods_politikk_canonical_v4_5.json',
            'data/fag/politikk/emnemapping_politikk_canonical_v4_5.json',
            'data/fag/politikk/politikkpensum_canonical_v4_5.json',
            'data/fag/politikk/quiz_generator_rules_politikk_v5_1_source_priority_patch.json',
            'reports/politikk-canonical-migration/demokrati-representasjon-question-blueprints.json'
          ];
          for (const file of files) {
            JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(`PASS | Gyldig JSON: ${file}`);
          }
          const absent = [
            '.github/workflows/apply-politikk-demokrati-vertical.yml',
            'tools/apply-politikk-demokrati-vertical.mjs',
            'tools/politikk-demokrati-migration-gz',
            'tools/politikk-demokrati-migration-parts',
            'reports/politikk-canonical-migration/demokrati-domain-compact-audit.json'
          ];
          for (const item of absent) {
            if (fs.existsSync(item)) throw new Error(`FAIL | Midlertidig fil finnes fortsatt: ${item}`);
            console.log(`PASS | Midlertidig fil fjernet: ${item}`);
          }
          NODE

          git status --short | tee -a "$VALIDATION"
          git add -A
          git diff --cached --check 2>&1 | tee -a "$VALIDATION"
          echo "PASS | git diff --cached --check" | tee -a "$VALIDATION"
          git add "$VALIDATION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Politikk: fullfør demokratidomenets kvalitetskjede"
          git push origin "HEAD:${GITHUB_REF_NAME}"
