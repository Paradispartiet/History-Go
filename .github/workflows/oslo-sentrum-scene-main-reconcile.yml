name: Reconcile Sentrum Scene after parallel main merge
on:
  push:
    branches: [content/oslo-sentrum-scene-fagverk-story-v1-20261030]
    paths: ['.github/workflows/oslo-sentrum-scene-main-reconcile.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/oslo-sentrum-scene-fagverk-story-v1-20261030
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify Sentrum Scene source and Story contracts
        run: node --test tests/oslo-sentrum-scene-fagverk-story-v1.test.mjs tests/sentrum-scene-v1-20261030.test.mjs
      - name: Regenerate affected Fagverk, Place-open and epoke data
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          npm run place-open:build
          npm run epoker:places:build
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run place-open:check
          npm run epoker:places:check
      - name: Commit regenerated canonical data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u data/fagverk/fagverk_release.json data/runtime/ data/epoker/epoke-place-index.json
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Sentrum Scene: sync post-merge Fagverk and Story runtime"
            git push origin HEAD:content/oslo-sentrum-scene-fagverk-story-v1-20261030
          fi
