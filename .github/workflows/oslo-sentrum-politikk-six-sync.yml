name: Oslo sentrum Politikk six - sync generated Place and Fagverk data
on:
  push:
    branches:
      - research/oslo-sentrum-politikk-six-v1-20261023
    paths:
      - 'data/places/politikk/oslo/places_politikk/hoyesteretts_hus.json'
      - 'data/places/politikk/oslo/places_politikk/folkets_hus_oslo.json'
      - 'data/places/politikk/oslo/places_politikk/hoyres_hus.json'
      - 'data/places/politikk/oslo/places_politikk/hoyblokka.json'
      - 'data/places/politikk/oslo/places_politikk/victoria_terrasse.json'
      - 'data/places/politikk/oslo/places_politikk/y_blokka.json'
      - 'data/fagverk/fagverk_registry.json'
      - '.github/workflows/oslo-sentrum-politikk-six-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oslo-sentrum-politikk-six-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sync-derived-place-data:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Check out isolated production branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: research/oslo-sentrum-politikk-six-v1-20261023
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate existing canonical derivatives
        run: |
          npm run places:index:build
          npm run place-open:build
          node scripts/build-fagverk-release-manifest.mjs
          npm run place-open:check
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Confirm no unrelated generated paths changed
        shell: bash
        run: |
          git diff --name-only | while IFS= read -r file; do
            case "$file" in
              data/places/places_index.json|data/fagverk/fagverk_release.json|data/runtime/place-open/hoyesteretts_hus.json|data/runtime/place-open/folkets_hus_oslo.json|data/runtime/place-open/hoyres_hus.json|data/runtime/place-open/hoyblokka.json|data/runtime/place-open/victoria_terrasse.json|data/runtime/place-open/y_blokka.json)
                ;;
              *)
                echo "Unexpected generated change outside this six-place scope: $file" >&2
                exit 11
                ;;
            esac
          done
      - name: Commit only scoped generated dependencies
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/places/places_index.json data/fagverk/fagverk_release.json
          git add -- data/runtime/place-open/hoyesteretts_hus.json data/runtime/place-open/folkets_hus_oslo.json data/runtime/place-open/hoyres_hus.json data/runtime/place-open/hoyblokka.json data/runtime/place-open/victoria_terrasse.json data/runtime/place-open/y_blokka.json
          if git diff --cached --quiet; then
            echo 'Six-place derived artifacts already synchronized'
          else
            git commit -m 'build(oslo-sentrum): sync six scoped Place-open and Fagverk outputs'
            git push origin HEAD:research/oslo-sentrum-politikk-six-v1-20261023
          fi
