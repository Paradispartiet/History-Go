name: Diagnose Philosophy source integrity

on:
  push:
    branches:
      - agent/philosophy-quality-repair-source-integrity
    paths:
      - 'scripts/diagnose-filosofi-source-integrity.mjs'
      - '.github/workflows/diagnose-filosofi-source-integrity.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/philosophy-quality-repair-source-integrity
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build gap report
        run: node scripts/diagnose-filosofi-source-integrity.mjs
      - name: Commit gap report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/filosofi-source-integrity-repair-gaps.json
          if git diff --cached --quiet; then
            echo 'Gap report unchanged.'
            exit 0
          fi
          git commit -m 'Record Philosophy source integrity repair gaps'
          git push origin HEAD:agent/philosophy-quality-repair-source-integrity
