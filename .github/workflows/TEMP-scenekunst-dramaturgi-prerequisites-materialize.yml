name: TEMP Scenekunst dramaturgi prerequisite materialization

on:
  push:
    branches:
      - agent/civication-scenekunst-dramaturgi-utvikling-prerequisites
    paths:
      - .github/workflows/TEMP-scenekunst-dramaturgi-prerequisites-materialize.yml

permissions:
  contents: write

concurrency:
  group: temp-scenekunst-dramaturgi-prerequisites
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate canonical Civication state
        run: |
          node scripts/audit-civication-role-packs.mjs
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
          node scripts/build-civication-scene-registry.mjs --write --json
      - name: Verify fail-closed gates
        run: |
          node tests/civication-scenekunst-dramaturgi-og-utvikling-prerequisites.test.js
          node scripts/build-civication-scene-registry.mjs --check --json
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node scripts/audit-civication-career-gameplay.mjs --check
          node scripts/audit-civication-role-world-rollout-readiness.mjs --check
          npm run test:civication
      - name: Publish verified permanent state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/TEMP-scenekunst-dramaturgi-prerequisites-materialize.yml
          git add data/Civication/rolePackIndex.json
          git add data/Civication/careerGameplayMatrix.json
          git add data/Civication/roleWorldRolloutReadiness.json
          git add data/Civication/compiledSceneRegistryV1.json
          git add data/Civication/scenarioPeople_index.json
          git add data/Civication/scenarioPeople/generated
          git add docs/CIVICATION_ROLE_PACK_INDEX.md
          git add reports/civication-career-gameplay-matrix.md
          git add reports/civication-role-world-rollout-readiness.md
          git diff --cached --check
          git commit -m 'Regenerate Scenekunst dramaturgi prerequisite state'
          git push origin HEAD:$GITHUB_REF_NAME
