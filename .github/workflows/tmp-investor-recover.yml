name: Temporary Investor payload recovery

on:
  push:
    branches:
      - civication/naeringsliv-investor-role-world
    paths:
      - .github/workflows/tmp-investor-recover.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Decode and materialize exact Investor payload
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const z=require('zlib');
          const workflow=fs.readFileSync('.github/workflows/tmp-investor-author.yml','utf8');
          const match=workflow.match(/AUTHOR_GZ64:\s*"([A-Za-z0-9+/=]+)"/);
          if(!match) throw new Error('Investor payload not found');
          const input=Buffer.from(match[1],'base64');
          const decoders=[
            ['gunzip', z.gunzipSync],
            ['inflate', z.inflateSync],
            ['inflateRaw', z.inflateRawSync],
            ['brotli', z.brotliDecompressSync]
          ];
          let decoded=null, used=null;
          for(const [name,fn] of decoders){
            try {
              const candidate=fn(input).toString('utf8');
              if(candidate.includes('naeringsliv_investor') && candidate.includes('writeFileSync')) {
                decoded=candidate; used=name; break;
              }
            } catch {}
          }
          if(!decoded) throw new Error('Investor payload is not decodable by gzip/zlib/raw-deflate/brotli');
          console.log('Decoded Investor payload with '+used);
          fs.writeFileSync('/tmp/author-investor.js',decoded);
          NODE
          node /tmp/author-investor.js
          node scripts/audit-civication-life-position-role-world-readiness.mjs --write
      - name: Verify Investor and full Civication suite
        run: |
          node tests/civication-naeringsliv-investor-authored-depth.test.js
          node scripts/build-civication-scene-registry.mjs --check
          npm run test:civication
      - name: Commit verified Investor Role World
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-investor-author.yml .github/workflows/tmp-investor-recover.yml
          git add data/Civication reports/civication-life-position-role-world-readiness.md tests/civication-*.test.js
          git diff --cached --check
          git commit -m "Civication: author Næringsliv Investor Role World"
          git push origin HEAD:civication/naeringsliv-investor-role-world
