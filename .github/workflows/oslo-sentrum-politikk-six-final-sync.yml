name: Oslo sentrum Politikk six QA follow-up (PR 6579)

on:
  push:
    branches:
      - research/oslo-sentrum-politikk-six-v1-20261023
    paths:
      - .github/workflows/oslo-sentrum-politikk-six-final-sync.yml
permissions:
  contents: write
jobs:
  derived-release-and-hygiene-only:
    if: github.repository == 'Paradispartiet/History-Go' && github.ref == 'refs/heads/research/oslo-sentrum-politikk-six-v1-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout scoped PR branch
        uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-politikk-six-v1-20261023
          persist-credentials: true
      - name: Generate exact Fagverk release manifest after quizProduction target registration
        run: |
          node scripts/build-fagverk-release-manifest.mjs --output data/fagverk/fagverk_release.json
          node scripts/build-fagverk-release-manifest.mjs --output data/fagverk/fagverk_release.json --check
      - name: Remove generated diagnostic report that exceeds repo hygiene limit
        run: |
          test -f reports/knowledge-contract-audit.json
          git rm -- reports/knowledge-contract-audit.json
      - name: Validate exactly two scoped changes and commit
        run: |
          git add -- data/fagverk/fagverk_release.json
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'data/fagverk/fagverk_release.json','reports/knowledge-contract-audit.json'}
          assert actual==expected,(actual,expected)
          print('Only Fagverk release and generated large report were touched.')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Synchronize Fagverk release after scoped quiz manifests and drop oversized CI report"
          git push origin HEAD:refs/heads/research/oslo-sentrum-politikk-six-v1-20261023
      - name: Keep PR draft
        if: always()
        run: |
          {
            echo '### Scoped release and hygiene correction'
            echo 'No Place or quiz content was changed.'
            echo 'No merge and no v1 approval performed.'
          } >> "$GITHUB_STEP_SUMMARY"
