name: TEMP Klassekampen place-open resync

on:
  push:
    branches:
      - agent/klassekampen-place-production-v3-20261004
    paths:
      - .github/workflows/tmp-klassekampen-place-open-resync.yml

permissions:
  contents: write

jobs:
  resync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/klassekampen-place-production-v3-20261004
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Materialize canonical place-open runtime
        run: npm run place-open:build
      - name: Guard and commit only Klassekampen runtime output
        shell: bash
        run: |
          set -euo pipefail
          target='data/runtime/place-open/klassekampen_redaksjon.json'
          git status --short
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v -x "$target" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generator drift; refusing to commit:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          if git diff --quiet -- "$target"; then
            echo "No Klassekampen place-open drift to commit"
            exit 0
          fi
          git add "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Klassekampen place-open runtime"
          git push origin HEAD:agent/klassekampen-place-production-v3-20261004
