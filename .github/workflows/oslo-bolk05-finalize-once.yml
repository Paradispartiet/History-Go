name: Oslo bolk 05 – one-time main integration and regeneration
on:
  push:
    branches:
      - research/oslo-sentrum-bolk05-tekst-20261101
    paths:
      - .github/workflows/oslo-bolk05-finalize-once.yml
permissions:
  contents: write
concurrency:
  group: oslo-bolk05-once-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Merge fresh main, allow only the three generated-index conflicts
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'research/oslo-sentrum-bolk05-tekst-20261101'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          status=0
          git merge --no-commit --no-ff origin/main || status=$?
          if [ "$status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [ "${#conflicts[@]}" -ne 3 ]; then
              printf 'Unexpected conflict count (%s):\n%s\n' "${#conflicts[@]}" "${conflicts[*]}"
              exit 1
            fi
            for file in "${conflicts[@]}"; do
              case "$file" in
                data/epoker/epoke-place-index.json|data/knowledge/knowledge_units.generated.json|reports/knowledge-id-backfill.json)
                  git checkout --ours -- "$file"
                  git add -- "$file"
                  ;;
                *) echo "Unexpected conflict: $file"; exit 1 ;;
              esac
            done
          fi
          echo "Merged against $(git rev-parse origin/main) and will regenerate all three conflicts."
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate canonical Knowledge and era place index from combined sources
        run: |
          npm run knowledge:canonical:write
          npm run epoker:places:build
          npm run place-open:build
      - name: Verify regenerated outputs and six approved v4.2 packets
        run: |
          npm run knowledge:canonical:check
          npm run epoker:places:check
          npm run place-open:check
          node scripts/audit-oslo-bolk05-v42.mjs
          node --test tests/oslo-bolk05-v42-knowledge-regression.test.mjs
          node scripts/audit-oslo-bolk05-quiz-candidates.mjs --json
      - name: Commit conflict resolution, remove temporary workflow, and update PR branch
        shell: bash
        run: |
          set -euo pipefail
          # The Knowledge contract report is a large transient diagnostic, not a tracked build output.
          git restore --source=HEAD -- reports/knowledge-contract-audit.json
          git rm -f .github/workflows/oslo-bolk05-finalize-once.yml
          git add -u
          if git ls-files -u | grep -q .; then echo 'Unresolved merges'; exit 1; fi
          echo 'Staged integration and regeneration paths:'
          git diff --cached --name-only
          git commit -m "Merge main into Oslo bolk 05 and regenerate shared indexes"
          git push origin HEAD:research/oslo-sentrum-bolk05-tekst-20261101
