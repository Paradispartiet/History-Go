name: Fagverk release feed

on:
  pull_request:
    paths:
      - 'data/fag/**'
      - 'data/fagverk/**'
      - 'scripts/build-fagverk-release-manifest.mjs'
      - 'tests/fagverk-release-manifest.test.mjs'
      - '.github/workflows/fagverk-release.yml'
  push:
    branches: [main]
    paths:
      - 'data/fag/**'
      - 'data/fagverk/**'
      - 'scripts/build-fagverk-release-manifest.mjs'
      - 'tests/fagverk-release-manifest.test.mjs'
      - '.github/workflows/fagverk-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build deterministic whole-architecture Fagverk release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify builder
        run: |
          node --check scripts/build-fagverk-release-manifest.mjs
          node --test tests/fagverk-release-manifest.test.mjs
      - name: Build release manifest
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Verify release v2 contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const release = JSON.parse(fs.readFileSync('data/fagverk/fagverk_release.json', 'utf8'));
          if (release.schema !== 'history_go_fagverk_release_v2') throw new Error('Unexpected release schema.');
          if (!release.release_sha256 || release.release_sha256.length !== 64) throw new Error('Missing release digest.');
          if (release.summary?.missing_file_count !== 0) throw new Error('Release contains missing files or manifest fields.');
          if (release.summary?.subject_count !== Object.keys(release.subjects || {}).length) throw new Error('Package count mismatch.');
          if (release.summary?.root_subject_count + release.summary?.specialization_count !== release.summary?.subject_count) throw new Error('Subject/specialization count mismatch.');
          for (const [subjectId, subject] of Object.entries(release.subjects || {})) {
            if (!['complete'].includes(subject.package_status)) throw new Error(`${subjectId}: incomplete package.`);
            if (subject.chapter_count !== subject.chapters.length) throw new Error(`${subjectId}: chapter count mismatch.`);
            if (!subject.structure_sha256 || !subject.content_sha256 || !subject.package_content_sha256) throw new Error(`${subjectId}: missing digest.`);
            if (subject.missing_manifest_fields.length || subject.missing_files.length) throw new Error(`${subjectId}: unresolved references.`);
          }
          console.log(`Fagverk release ${release.release_sha256}: ${release.summary.subject_count} packages, ${release.summary.chapter_count} chapters, ${release.summary.module_file_count} modules.`);
          NODE
      - name: Materialize release manifest on PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fagverk/fagverk_release.json
          if git diff --cached --quiet; then
            echo 'Release manifest already matches.'
            exit 0
          fi
          git commit -m 'Materialize whole-architecture Fagverk release v2'
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: history-go-fagverk-release
          path: data/fagverk/fagverk_release.json
          if-no-files-found: error
          retention-days: 30
      - name: Notify AHA-EchoNet after main update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AHA_DISPATCH_TOKEN: ${{ secrets.AHA_ECHONET_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$AHA_DISPATCH_TOKEN" ]; then
            echo 'AHA_ECHONET_DISPATCH_TOKEN is not configured; the AHA scheduled poll remains the fallback.'
            exit 0
          fi
          RELEASE_SHA=$(node -p "require('./data/fagverk/fagverk_release.json').release_sha256")
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $AHA_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Paradispartiet/AHA-EchoNet/dispatches \
            -d "{\"event_type\":\"history-go-fagverk-release\",\"client_payload\":{\"source_sha\":\"${SOURCE_SHA}\",\"release_sha256\":\"${RELEASE_SHA}\"}}"
