name: Fagverk release feed

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'data/fag/**'
      - 'data/fagverk/**'
      - 'scripts/build-fagverk-release-manifest.mjs'
      - 'scripts/natur-final-phase-compose.mjs'
      - 'scripts/materialize-natur-final-registry.mjs'
      - 'tests/fagverk-release-manifest.test.mjs'
      - '.github/workflows/fagverk-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fagverk-release-${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  release:
    name: Verify deterministic whole-architecture Fagverk release
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Materialize composed Natur registry
        run: |
          node --check scripts/materialize-natur-final-registry.mjs
          node scripts/materialize-natur-final-registry.mjs
      - name: Verify builder
        run: |
          node --check scripts/build-fagverk-release-manifest.mjs
          node --test tests/fagverk-release-manifest.test.mjs
      - name: Verify release manifest is current
        run: node scripts/build-fagverk-release-manifest.mjs --check
      - name: Verify release v2 contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const release = JSON.parse(fs.readFileSync('data/fagverk/fagverk_release.json', 'utf8'));
          const registry = JSON.parse(fs.readFileSync('data/fagverk/fagverk_registry.json', 'utf8'));
          if (release.schema !== 'history_go_fagverk_release_v2') throw new Error('Unexpected release schema.');
          if (!release.release_sha256 || release.release_sha256.length !== 64) throw new Error('Missing release digest.');
          if (release.summary?.missing_file_count !== 0) throw new Error('Release contains blocking missing files or manifest fields.');
          if (release.summary?.subject_count !== Object.keys(release.subjects || {}).length) throw new Error('Package count mismatch.');
          if (release.summary?.root_subject_count + release.summary?.specialization_count !== release.summary?.subject_count) throw new Error('Subject/specialization count mismatch.');
          const optionalGapCount = Object.values(release.subjects || {}).reduce(
            (sum, subject) => sum + subject.missing_optional_files.length,
            0
          );
          if (release.summary?.optional_gap_count !== optionalGapCount) throw new Error('Optional gap count mismatch.');
          for (const [subjectId, subject] of Object.entries(release.subjects || {})) {
            if (!['complete', 'complete_with_optional_gaps'].includes(subject.package_status)) {
              throw new Error(`${subjectId}: incomplete package.`);
            }
            if (subject.chapter_count !== subject.chapters.length) throw new Error(`${subjectId}: chapter count mismatch.`);
            if (!subject.structure_sha256 || !subject.content_sha256 || !subject.package_content_sha256) throw new Error(`${subjectId}: missing digest.`);
            if (subject.missing_manifest_fields.length || subject.missing_required_files.length || subject.missing_chapter_files.length) {
              throw new Error(`${subjectId}: unresolved blocking references.`);
            }
            if (subject.package_status === 'complete' && subject.missing_optional_files.length) {
              throw new Error(`${subjectId}: optional gaps are not reflected in package status.`);
            }
            if (subject.package_status === 'complete_with_optional_gaps' && !subject.missing_optional_files.length) {
              throw new Error(`${subjectId}: optional-gap status has no optional gaps.`);
            }
          }
          const naturRegistry = registry.subjects?.natur;
          const naturRelease = release.subjects?.natur;
          if (naturRegistry?.chapters?.length !== 12) throw new Error('Natur registry must materialize 12 chapters.');
          if (!naturRegistry.chapters.some((chapter) => chapter.id === 'sopp_lav_mikroorganismer')) {
            throw new Error('Natur registry is missing sopp_lav_mikroorganismer.');
          }
          if (naturRelease?.chapter_count !== 12 || naturRelease.chapters?.length !== 12) {
            throw new Error('Natur release must contain 12 chapters.');
          }
          if (!naturRelease.chapters.some((chapter) => chapter.chapter_id === 'sopp_lav_mikroorganismer')) {
            throw new Error('Natur release is missing sopp_lav_mikroorganismer.');
          }
          console.log(`Fagverk release ${release.release_sha256}: ${release.summary.subject_count} packages, ${release.summary.chapter_count} chapters, ${release.summary.module_file_count} modules, ${release.summary.optional_gap_count} optional gaps.`);
          NODE
      - name: Reject uncommitted generated release changes
        run: |
          git diff --exit-code -- \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_status.json \
            data/fagverk/fagverk_release.json
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: history-go-fagverk-release
          path: data/fagverk/fagverk_release.json
          if-no-files-found: error
          retention-days: 30
  notify:
    name: Dispatch committed release digest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Notify AHA-EchoNet after main update
        env:
          AHA_DISPATCH_TOKEN: ${{ secrets.AHA_ECHONET_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ -z "$AHA_DISPATCH_TOKEN" ]; then
            echo 'AHA_ECHONET_DISPATCH_TOKEN is not configured; the AHA scheduled poll remains the fallback.'
            exit 0
          fi
          RELEASE_SHA=$(node -p "require('./data/fagverk/fagverk_release.json').release_sha256")
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $AHA_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Paradispartiet/AHA-EchoNet/dispatches \
            -d "{\"event_type\":\"history-go-fagverk-release\",\"client_payload\":{\"source_sha\":\"${SOURCE_SHA}\",\"release_sha256\":\"${RELEASE_SHA}\"}}"
