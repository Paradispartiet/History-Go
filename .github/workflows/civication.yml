name: Civication

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'data/Civication/**'
      - '!data/Civication/historyPeople_index.json'
      - '!data/Civication/scenarioPeople/**'
      - '!data/Civication/scenarioPeople_index.json'
      - 'data/badges/**'
      - 'docs/CIVICATION_FWG_GOVERNANCE.md'
      - 'js/Civication/**'
      - 'tests/civication-*.test.js'
      - 'tests/acceptance-civication-*.test.js'
      # Pure theory/read-only coverage has its own focused workflow.
      - '!tests/civication-psychology-room-theory.test.js'
      - '!tests/civication-psychology-room-coverage.test.js'
      - 'tests/run-civication-tests.mjs'
      - 'scripts/audit-civication-*.mjs'
      - 'scripts/auditJobLearningProfiles.*'
      - 'scripts/auditJobKnowledgeRequirements.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/civication.yml'
      - 'scripts/ci-civication-scope.mjs'
      - 'tests/ci-civication-scope.test.mjs'
      - 'tests/ci-civication-draft-gates.test.mjs'
  workflow_dispatch:
  # Full suite still executes daily; badge artwork-only PRs use lightweight scope QA.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Route Civication CI changes
    runs-on: ubuntu-latest
    outputs:
      regression: ${{ steps.classify.outputs.regression }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test scope classification
        run: node --test tests/ci-civication-scope.test.mjs tests/ci-civication-draft-gates.test.mjs
      - id: classify
        name: Detect relevant Civication changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo 'regression=true' >> "$GITHUB_OUTPUT"
          else
            node scripts/ci-civication-scope.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

  draft-focused:
    needs: scope
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true && needs.scope.outputs.regression == 'true'
    name: Civication focused draft validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate canonical generated Civication data
        run: |
          node scripts/build-civication-scene-registry.mjs --check
          node scripts/audit-civication-career-gameplay.mjs --check
          node scripts/audit-civication-role-world-rollout-readiness.mjs --check
      - name: Run focused tests for the changed role
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/civication-changes.txt"
          node tests/civication-lifestory-shell-role-bridge.test.js
          if grep -Eq '^(data/Civication/lifestory/roles/renholder/|js/Civication/systems/civicationActivePositionRecovery[.]js$|js/Civication/ui/CivicationLifestoryUI[.]js$|tests/civication-(lifestory-renholder|active-position-recovery-clear|lifestory-job-role-persistence))' "$RUNNER_TEMP/civication-changes.txt"; then
            node tests/civication-active-position-recovery-clear.test.js
            node tests/civication-lifestory-renholder.test.js
            node tests/civication-lifestory-renholder-uke2.test.js
            node tests/civication-lifestory-renholder-uke3.test.js
            node tests/civication-lifestory-endings.test.js
            node tests/civication-lifestory-job-role-persistence.test.js
          fi

  regression:
    needs: scope
    if: needs.scope.outputs.regression == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: Civication regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify FWG governance report is synchronized
        run: |
          node scripts/audit-civication-fwg-governance.mjs
          git diff --exit-code -- docs/CIVICATION_FWG_GOVERNANCE.md

      - name: Verify compiled scene registry is synchronized
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Validate career matrix before full suite
        run: node scripts/audit-civication-career-gameplay.mjs --check

      - name: Validate Role World readiness before full suite
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --check

      - name: Verify legacy cloud role migration
        run: node tests/civication-lifestory-shell-role-bridge.test.js

      - name: Verify livelihood game-week settlement
        run: node tests/civication-livelihood-engine.test.js

      - name: Verify network offers follow game weeks
        run: node tests/civication-livelihood-opportunity-bridge.test.js

      - name: Verify continuous 21-day private life across work changes
        run: node tests/acceptance-civication-three-week-private-employment.test.js

      - name: Verify 21-day calendar, earnings and account recovery
        run: node tests/acceptance-civication-21day-economy-cloud-journey.test.js

      - name: Verify three-month NOK account journey and cloud recovery
        run: node tests/acceptance-civication-nok-three-month-cloud-journey.test.js

      - name: Verify account backup conflicts and allowed state
        run: node tests/account-cloud-save.test.cjs

      - name: Run complete Civication suite
        run: npm run test:civication
