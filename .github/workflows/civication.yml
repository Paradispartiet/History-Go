name: Civication

on:
  pull_request:
    paths:
      - 'data/Civication/**'
      - '!data/Civication/historyPeople_index.json'
      - '!data/Civication/scenarioPeople/**'
      - '!data/Civication/scenarioPeople_index.json'
      - 'data/badges/**'
      - 'js/Civication/**'
      - 'tests/civication-*.test.js'
      - 'tests/run-civication-tests.mjs'
      - 'scripts/audit-civication-*.mjs'
      - 'scripts/auditJobLearningProfiles.*'
      - 'scripts/auditJobKnowledgeRequirements.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/civication.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Civication regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify compiled scene registry is synchronized
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Commit PR 6064 generator-exact outputs early
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$PR_HEAD_SHA"
          git reset --hard "$PR_HEAD_SHA"
          node scripts/audit-civication-life-position-role-world-readiness.mjs --write
          node scripts/audit-civication-career-gameplay.mjs --write
          git add \
            data/Civication/lifePositionRoleWorldReadiness.json \
            reports/civication-life-position-role-world-readiness.md \
            data/Civication/careerGameplayMatrix.json \
            reports/civication-career-gameplay-matrix.md
          if git diff --cached --quiet; then
            echo "Generated outputs already exact."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Civication: regenerate generator-exact outputs"
            git push origin HEAD:"$PR_HEAD_REF"
          fi

      - name: Run complete Civication suite
        run: npm run test:civication

      - name: Generate PR 6064 diagnostic outputs
        if: failure()
        run: |
          node scripts/audit-civication-life-position-role-world-readiness.mjs --write
          node scripts/audit-civication-career-gameplay.mjs --write

      - name: Upload PR 6064 generated outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: civication-6064-generated
          path: |
            data/Civication/lifePositionRoleWorldReadiness.json
            reports/civication-life-position-role-world-readiness.md
            data/Civication/careerGameplayMatrix.json
            reports/civication-career-gameplay-matrix.md

      - name: Commit PR 6064 generator-exact outputs
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$PR_HEAD_SHA"
          git reset --hard "$PR_HEAD_SHA"
          node scripts/audit-civication-life-position-role-world-readiness.mjs --write
          node scripts/audit-civication-career-gameplay.mjs --write
          git add             data/Civication/lifePositionRoleWorldReadiness.json             reports/civication-life-position-role-world-readiness.md             data/Civication/careerGameplayMatrix.json             reports/civication-career-gameplay-matrix.md
          if git diff --cached --quiet; then
            echo "Generated outputs already exact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Civication: regenerate generator-exact outputs"
          git push origin HEAD:"$PR_HEAD_REF"
