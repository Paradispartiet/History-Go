name: Civication

on:
  pull_request:
    paths:
      - 'data/Civication/**'
      - '!data/Civication/historyPeople_index.json'
      - '!data/Civication/scenarioPeople/**'
      - '!data/Civication/scenarioPeople_index.json'
      - 'data/badges/**'
      - 'js/Civication/**'
      - 'tests/civication-*.test.js'
      - 'tests/run-civication-tests.mjs'
      - 'scripts/audit-civication-*.mjs'
      - 'scripts/auditJobLearningProfiles.*'
      - 'scripts/auditJobKnowledgeRequirements.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/civication.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Civication regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify compiled scene registry is synchronized
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Generate PR 6064 rollout-readiness diagnostic outputs
        run: |
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
          git diff --unified=0 -- data/Civication/roleWorldRolloutReadiness.json

      - name: Upload PR 6064 rollout-readiness outputs
        uses: actions/upload-artifact@v4
        with:
          name: civication-6064-generated-v5
          path: |
            data/Civication/careerGameplayMatrix.json
            data/Civication/roleWorldRolloutReadiness.json
            reports/civication-role-world-rollout-readiness.md

      - name: Show exact rollout-readiness generator diff
        run: |
          git diff --unified=1 -- data/Civication/roleWorldRolloutReadiness.json
          exit 1
