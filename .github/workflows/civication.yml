name: Civication

on:
  pull_request:
    paths:
      - 'data/Civication/**'
      - 'data/badges/**'
      - 'js/Civication/**'
      - 'tests/civication-*.test.js'
      - 'tests/run-civication-tests.mjs'
      - 'scripts/audit-civication-*.mjs'
      - 'scripts/auditJobLearningProfiles.*'
      - 'scripts/auditJobKnowledgeRequirements.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/civication.yml'
  push:
    branches:
      - main
    paths:
      - 'data/Civication/**'
      - 'data/badges/**'
      - 'js/Civication/**'
      - 'tests/civication-*.test.js'
      - 'tests/run-civication-tests.mjs'
      - 'scripts/audit-civication-*.mjs'
      - 'scripts/auditJobLearningProfiles.*'
      - 'scripts/auditJobKnowledgeRequirements.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/civication.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    name: Civication regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TEMP regenerate professor rollout projections
        if: github.event_name == 'pull_request'
        run: |
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/build-civication-scene-registry.mjs --write

      - name: TEMP commit professor rollout projections
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/careerGameplayMatrix.json data/Civication/compiledSceneRegistryV1.json reports/civication-career-gameplay-matrix.md
          if git diff --cached --quiet; then
            echo "Canonical projections already synchronized"
          else
            git commit -m "Regenerate Psychology professor rollout projections"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Verify compiled scene registry is synchronized
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Run complete Civication suite
        run: npm run test:civication
