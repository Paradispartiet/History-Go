name: Civication

on:
  pull_request:
    paths:
      - 'data/Civication/**'
      - '!data/Civication/historyPeople_index.json'
      - '!data/Civication/scenarioPeople/**'
      - '!data/Civication/scenarioPeople_index.json'
      - 'data/badges/**'
      - 'docs/CIVICATION_FWG_GOVERNANCE.md'
      - 'js/Civication/**'
      - 'tests/civication-*.test.js'
      - 'tests/acceptance-civication-*.test.js'
      # Pure theory/read-only coverage has its own focused workflow.
      - '!tests/civication-psychology-room-theory.test.js'
      - '!tests/civication-psychology-room-coverage.test.js'
      - 'tests/run-civication-tests.mjs'
      - 'scripts/audit-civication-*.mjs'
      - 'scripts/auditJobLearningProfiles.*'
      - 'scripts/auditJobKnowledgeRequirements.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/civication.yml'
  workflow_dispatch:
  # Full suite still executes daily, and on any relevant Civication PR.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Civication regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify FWG governance report is synchronized
        run: |
          node scripts/audit-civication-fwg-governance.mjs
          git diff --exit-code -- docs/CIVICATION_FWG_GOVERNANCE.md

      - name: Verify compiled scene registry is synchronized
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Validate career matrix before full suite
        run: node scripts/audit-civication-career-gameplay.mjs --check

      - name: Validate Role World readiness before full suite
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --check

      - name: Verify legacy cloud role migration
        run: node tests/civication-lifestory-shell-role-bridge.test.js

      - name: Verify livelihood game-week settlement
        run: node tests/civication-livelihood-engine.test.js

      - name: Verify network offers follow game weeks
        run: node tests/civication-livelihood-opportunity-bridge.test.js

      - name: Verify continuous 21-day private life across work changes
        run: node tests/acceptance-civication-three-week-private-employment.test.js

      - name: Verify 21-day calendar, earnings and account recovery
        run: node tests/acceptance-civication-21day-economy-cloud-journey.test.js

      - name: Run complete Civication suite
        run: npm run test:civication
