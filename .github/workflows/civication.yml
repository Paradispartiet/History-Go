name: Civication

on:
  pull_request:
    paths:
      - 'data/Civication/**'
      - '!data/Civication/historyPeople_index.json'
      - '!data/Civication/scenarioPeople/**'
      - '!data/Civication/scenarioPeople_index.json'
      - 'data/badges/**'
      - 'js/Civication/**'
      - 'tests/civication-*.test.js'
      - 'tests/run-civication-tests.mjs'
      - 'scripts/audit-civication-*.mjs'
      - 'scripts/auditJobLearningProfiles.*'
      - 'scripts/auditJobKnowledgeRequirements.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/civication.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Civication regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Leser governance diagnostic
        run: node scripts/audit-civication-leser-governance-diagnostic.mjs

      - name: Upload Leser governance diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: leser-governance-${{ github.sha }}
          if-no-files-found: error
          path: |
            data/Civication/lifePositionRoleWorldReadiness.json
            data/Civication/nonCareerRoleTaxonomy.json
            data/Civication/roleWorldAuthoringChecklist.json
            data/Civication/roleWorldPolicy.json
            data/Civication/roleWorldThemeBank.json
            data/Civication/roleWorlds/index.json
            reports/civication-life-position-role-world-readiness.md
            tests/civication-life-position-role-world-readiness.test.js
            tests/civication-noncareer-role-taxonomy.test.js
            tests/civication-role-world-contract.test.js

      - name: Verify compiled scene registry is synchronized
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Run complete Civication suite
        run: npm run test:civication
