name: Fagverk Psykologi phase 3-4
# Permanent structural + editorial gate for canonical Psychology production.

on:
  pull_request:
    paths:
      - "fagverk.html"
      - "fagverk-forside.html"
      - "data/categories/category_contract.json"
      - "data/fag/fag_manifest.json"
      - "data/fag/psykologi/**"
      - "data/badges/psykologi.json"
      - "data/fagverk/**"
      - "js/fagverk-subject-core.js"
      - "js/fagverk-subject-model.js"
      - "js/fagverk.js"
      - "scripts/audit-fagverk-subject-inventory.mjs"
      - "scripts/audit-fagverk-general-engine.mjs"
      - "scripts/audit-fagverk-psykologi-phase3.mjs"
      - "scripts/materialize-psykologi-psykisk-helse-institusjoner-behandling-phase4.mjs"
      - "scripts/enrich-psykologi-psykisk-helse-source-evidence-phase4.mjs"
      - "scripts/audit-fagverk-psykologi-psykisk-helse-phase4.mjs"
      - "scripts/materialize-psykologi-fagtradisjoner-teori-phase4.mjs"
      - "scripts/audit-fagverk-psykologi-fagtradisjoner-teori-phase4.mjs"
      - "scripts/materialize-psykologi-utvikling-oppvekst-laring-phase4.mjs"
      - "scripts/audit-fagverk-psykologi-utvikling-oppvekst-laring-phase4.mjs"
      - "scripts/materialize-psykologi-kognisjon-folelser-atferd-phase4.mjs"
      - "scripts/audit-fagverk-psykologi-kognisjon-folelser-atferd-phase4.mjs"
      - "scripts/build-fagverk-release-manifest.mjs"
      - "tests/fagverk-subject-inventory.test.mjs"
      - "tests/fagverk-general-engine.test.mjs"
      - "tests/fagverk-psykologi-phase3.test.mjs"
      - "tests/fagverk-psykologi-psykisk-helse-phase4.test.mjs"
      - "tests/fagverk-psykologi-fagtradisjoner-teori-phase4.test.mjs"
      - "tests/fagverk-psykologi-utvikling-oppvekst-laring-phase4.test.mjs"
      - "tests/fagverk-psykologi-kognisjon-folelser-atferd-phase4.test.mjs"
      - "tests/fagverk-release-manifest.test.mjs"
      - "reports/fagverk/**"
      - ".github/workflows/fagverk-psykologi-phase3.yml"
  push:
    branches: [main]
    paths:
      - "data/fag/psykologi/**"
      - "data/badges/psykologi.json"
      - "data/fagverk/**"
      - "scripts/audit-fagverk-psykologi-phase3.mjs"
      - "scripts/materialize-psykologi-psykisk-helse-institusjoner-behandling-phase4.mjs"
      - "scripts/enrich-psykologi-psykisk-helse-source-evidence-phase4.mjs"
      - "scripts/audit-fagverk-psykologi-psykisk-helse-phase4.mjs"
      - "scripts/materialize-psykologi-fagtradisjoner-teori-phase4.mjs"
      - "scripts/audit-fagverk-psykologi-fagtradisjoner-teori-phase4.mjs"
      - "scripts/materialize-psykologi-utvikling-oppvekst-laring-phase4.mjs"
      - "scripts/audit-fagverk-psykologi-utvikling-oppvekst-laring-phase4.mjs"
      - "scripts/materialize-psykologi-kognisjon-folelser-atferd-phase4.mjs"
      - "scripts/audit-fagverk-psykologi-kognisjon-folelser-atferd-phase4.mjs"
      - "tests/fagverk-psykologi-phase3.test.mjs"
      - "tests/fagverk-psykologi-psykisk-helse-phase4.test.mjs"
      - "tests/fagverk-psykologi-fagtradisjoner-teori-phase4.test.mjs"
      - "tests/fagverk-psykologi-utvikling-oppvekst-laring-phase4.test.mjs"
      - "tests/fagverk-psykologi-kognisjon-folelser-atferd-phase4.test.mjs"
      - "reports/fagverk/**"
      - ".github/workflows/fagverk-psykologi-phase3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fagverk-psykologi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Psychology structure and editorial chapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate script syntax
        run: |
          node --check scripts/materialize-psykologi-psykisk-helse-institusjoner-behandling-phase4.mjs
          node --check scripts/enrich-psykologi-psykisk-helse-source-evidence-phase4.mjs
          node --check scripts/materialize-psykologi-fagtradisjoner-teori-phase4.mjs
          node --check scripts/materialize-psykologi-utvikling-oppvekst-laring-phase4.mjs
          node --check scripts/materialize-psykologi-kognisjon-folelser-atferd-phase4.mjs
          node --check scripts/audit-fagverk-psykologi-phase3.mjs
          node --check scripts/audit-fagverk-psykologi-psykisk-helse-phase4.mjs
          node --check scripts/audit-fagverk-psykologi-fagtradisjoner-teori-phase4.mjs
          node --check scripts/audit-fagverk-psykologi-utvikling-oppvekst-laring-phase4.mjs
          node --check scripts/audit-fagverk-psykologi-kognisjon-folelser-atferd-phase4.mjs
          node --check scripts/build-fagverk-release-manifest.mjs

      - name: Materialize Psychology editorial chapters
        run: |
          node scripts/materialize-psykologi-psykisk-helse-institusjoner-behandling-phase4.mjs
          node scripts/enrich-psykologi-psykisk-helse-source-evidence-phase4.mjs
          node scripts/materialize-psykologi-fagtradisjoner-teori-phase4.mjs
          node scripts/materialize-psykologi-utvikling-oppvekst-laring-phase4.mjs
          node scripts/materialize-psykologi-kognisjon-folelser-atferd-phase4.mjs

      - name: Refresh deterministic Psychology audits
        run: |
          node scripts/audit-fagverk-psykologi-phase3.mjs --write-report
          node scripts/audit-fagverk-psykologi-psykisk-helse-phase4.mjs --write-report
          node scripts/audit-fagverk-psykologi-fagtradisjoner-teori-phase4.mjs --write-report
          node scripts/audit-fagverk-psykologi-utvikling-oppvekst-laring-phase4.mjs --write-report
          node scripts/audit-fagverk-psykologi-kognisjon-folelser-atferd-phase4.mjs --write-report

      - name: Refresh and validate shared Fagverk architecture
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs --write-report
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs

      - name: Build deterministic Fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs

      - name: Validate Fagverk and Psychology contracts
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-psykologi-phase3.test.mjs
          node --test tests/fagverk-psykologi-psykisk-helse-phase4.test.mjs
          node --test tests/fagverk-psykologi-fagtradisjoner-teori-phase4.test.mjs
          node --test tests/fagverk-psykologi-utvikling-oppvekst-laring-phase4.test.mjs
          node --test tests/fagverk-psykologi-kognisjon-folelser-atferd-phase4.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs

      - name: Verify chapter 1 rematerializer
        run: node scripts/materialize-psykologi-psykisk-helse-institusjoner-behandling-phase4.mjs

      - name: Verify chapter 1 source enrichment
        run: node scripts/enrich-psykologi-psykisk-helse-source-evidence-phase4.mjs

      - name: Verify chapter 2 rematerializer
        run: node scripts/materialize-psykologi-fagtradisjoner-teori-phase4.mjs

      - name: Verify chapter 3 rematerializer
        run: node scripts/materialize-psykologi-utvikling-oppvekst-laring-phase4.mjs

      - name: Verify chapter 4 rematerializer
        run: node scripts/materialize-psykologi-kognisjon-folelser-atferd-phase4.mjs

      - name: Verify deterministic Psychology reports
        run: |
          node scripts/audit-fagverk-psykologi-phase3.mjs
          node scripts/audit-fagverk-psykologi-psykisk-helse-phase4.mjs
          node scripts/audit-fagverk-psykologi-fagtradisjoner-teori-phase4.mjs
          node scripts/audit-fagverk-psykologi-utvikling-oppvekst-laring-phase4.mjs
          node scripts/audit-fagverk-psykologi-kognisjon-folelser-atferd-phase4.mjs

      - name: Verify deterministic shared Fagverk reports
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs

      - name: Verify deterministic release
        run: node scripts/build-fagverk-release-manifest.mjs --check

      - name: Materialize generated Psychology files on PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/fagverk/psykologi/psykisk-helse-institusjoner-og-behandling.json \
            data/fagverk/psykologi/psykisk-helse-institusjoner-og-behandling \
            data/fagverk/psykologi/fagtradisjoner-teori-og-sinnet.json \
            data/fagverk/psykologi/fagtradisjoner-teori-og-sinnet \
            data/fagverk/psykologi/utvikling-oppvekst-og-laring.json \
            data/fagverk/psykologi/utvikling-oppvekst-og-laring \
            data/fagverk/psykologi/kognisjon-folelser-og-atferd.json \
            data/fagverk/psykologi/kognisjon-folelser-og-atferd \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_status.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/subject-baseline.json \
            reports/fagverk/general-engine-audit.json \
            reports/fagverk/psykologi-phase3-audit.json \
            reports/fagverk/psykologi-psykisk-helse-phase4-audit.json \
            reports/fagverk/psykologi-fagtradisjoner-teori-phase4-audit.json \
            reports/fagverk/psykologi-utvikling-oppvekst-laring-phase4-audit.json \
            reports/fagverk/psykologi-kognisjon-folelser-atferd-phase4-audit.json
          if git diff --cached --quiet; then
            echo 'Psychology materialization already matches.'
            exit 0
          fi
          git commit -m 'Materialize Psychology cognition chapter'
          git push origin "HEAD:${HEAD_BRANCH}"
