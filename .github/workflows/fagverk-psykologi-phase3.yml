name: Fagverk Psykologi phase 3-4
# Permanent structural + editorial + university-readiness gate for canonical Psychology production.

on:
  pull_request:
    paths:
      - "fagverk.html"
      - "fagverk-forside.html"
      - "data/fag/psykologi/**"
      - "data/badges/psykologi.json"
      - "data/fagverk/psykologi/**"
      - "js/fagverk-subject-core.js"
      - "js/fagverk-subject-model.js"
      - "js/fagverk.js"
      - "scripts/audit-fagverk-psykologi-phase3.mjs"
      - "scripts/materialize-psykologi-psykisk-helse-institusjoner-behandling-phase4.mjs"
      - "scripts/enrich-psykologi-psykisk-helse-source-evidence-phase4.mjs"
      - "scripts/audit-fagverk-psykologi-psykisk-helse-phase4.mjs"
      - "scripts/materialize-psykologi-fagtradisjoner-teori-phase4.mjs"
      - "scripts/audit-fagverk-psykologi-fagtradisjoner-teori-phase4.mjs"
      - "scripts/materialize-psykologi-utvikling-oppvekst-laring-phase4.mjs"
      - "scripts/audit-fagverk-psykologi-utvikling-oppvekst-laring-phase4.mjs"
      - "scripts/materialize-psykologi-kognisjon-folelser-atferd-phase4.mjs"
      - "scripts/audit-fagverk-psykologi-kognisjon-folelser-atferd-phase4.mjs"
      - "scripts/materialize-psykologi-sosialpsykologi-normalitet-stigma-phase4.mjs"
      - "scripts/audit-fagverk-psykologi-sosialpsykologi-normalitet-stigma-phase4.mjs"
      - "scripts/materialize-psykologi-traume-krise-resiliens-omsorg-phase4.mjs"
      - "scripts/audit-fagverk-psykologi-traume-krise-resiliens-omsorg-phase4.mjs"
      - "scripts/audit-fagverk-psykologi-complete.mjs"
      - "tools/audit-psykologi-theory-integrity.mjs"
      - "scripts/audit-fagverk-psykologi-biological-university.mjs"
      - "scripts/audit-fagverk-psykologi-cognitive-university.mjs"
      - "scripts/audit-fagverk-psykologi-developmental-university.mjs"
      - "scripts/audit-fagverk-psykologi-social-university.mjs"
      - "scripts/audit-fagverk-psykologi-personality-university.mjs"
      - "scripts/audit-fagverk-psykologi-history-science-theory-university.mjs"
      - "scripts/materialize-psykologi-topic-articles-mental-health-v1.mjs"
      - "scripts/audit-fagverk-psykologi-topic-articles-mental-health-v1.mjs"
      - "scripts/materialize-psykologi-university-completion-v1.mjs"
      - "scripts/lib/psykologi-editorial-curation-v2.mjs"
      - "scripts/lib/preserve-fagverk-metadata.mjs"
      - "scripts/audit-fagverk-psykologi-university-completion-v1.mjs"
      - "scripts/audit-fagverk-psykologi-editorial-quality-v2.mjs"
      - "scripts/audit-fagverk-psykologi-university-readiness.mjs"
      - "scripts/psykologi-subject-state.mjs"
      - "tests/fagverk-psykologi-phase3.test.mjs"
      - "tests/fagverk-psykologi-psykisk-helse-phase4.test.mjs"
      - "tests/fagverk-psykologi-fagtradisjoner-teori-phase4.test.mjs"
      - "tests/fagverk-psykologi-utvikling-oppvekst-laring-phase4.test.mjs"
      - "tests/fagverk-psykologi-kognisjon-folelser-atferd-phase4.test.mjs"
      - "tests/fagverk-psykologi-sosialpsykologi-normalitet-stigma-phase4.test.mjs"
      - "tests/fagverk-psykologi-traume-krise-resiliens-omsorg-phase4.test.mjs"
      - "tests/fagverk-psykologi-complete.test.mjs"
      - "tests/psykologi-theory-integrity.test.mjs"
      - "tests/fagverk-psykologi-biological-university.test.mjs"
      - "tests/fagverk-psykologi-cognitive-university.test.mjs"
      - "tests/fagverk-psykologi-developmental-university.test.mjs"
      - "tests/fagverk-psykologi-social-university.test.mjs"
      - "tests/fagverk-psykologi-personality-university.test.mjs"
      - "tests/fagverk-psykologi-history-science-theory-university.test.mjs"
      - "tests/fagverk-psykologi-topic-articles-mental-health-v1.test.mjs"
      - "tests/fagverk-psykologi-university-completion-v1.test.mjs"
      - "tests/fagverk-psykologi-editorial-quality-v2.test.mjs"
      - "tests/fagverk-psykologi-metadata-monotonic.test.mjs"
      - "tests/fagverk-psykologi-university-readiness.test.mjs"
      - "tests/fagverk-release-manifest.test.mjs"
      - ".github/workflows/fagverk-psykologi-phase3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fagverk-psykologi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Psychology structure, editorial chapters and university readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate script syntax
        run: |
          node --check scripts/materialize-psykologi-psykisk-helse-institusjoner-behandling-phase4.mjs
          node --check scripts/enrich-psykologi-psykisk-helse-source-evidence-phase4.mjs
          node --check scripts/materialize-psykologi-fagtradisjoner-teori-phase4.mjs
          node --check scripts/materialize-psykologi-utvikling-oppvekst-laring-phase4.mjs
          node --check scripts/materialize-psykologi-kognisjon-folelser-atferd-phase4.mjs
          node --check scripts/materialize-psykologi-sosialpsykologi-normalitet-stigma-phase4.mjs
          node --check scripts/materialize-psykologi-traume-krise-resiliens-omsorg-phase4.mjs
          node --check scripts/materialize-psykologi-topic-articles-mental-health-v1.mjs
          node --check scripts/materialize-psykologi-university-completion-v1.mjs
          node --check scripts/lib/psykologi-editorial-curation-v2.mjs
          node --check scripts/lib/preserve-fagverk-metadata.mjs
          node --check scripts/audit-fagverk-psykologi-phase3.mjs
          node --check scripts/audit-fagverk-psykologi-psykisk-helse-phase4.mjs
          node --check scripts/audit-fagverk-psykologi-fagtradisjoner-teori-phase4.mjs
          node --check scripts/audit-fagverk-psykologi-utvikling-oppvekst-laring-phase4.mjs
          node --check scripts/audit-fagverk-psykologi-kognisjon-folelser-atferd-phase4.mjs
          node --check scripts/audit-fagverk-psykologi-sosialpsykologi-normalitet-stigma-phase4.mjs
          node --check scripts/audit-fagverk-psykologi-traume-krise-resiliens-omsorg-phase4.mjs
          node --check scripts/audit-fagverk-psykologi-complete.mjs
          node --check tools/audit-psykologi-theory-integrity.mjs
          node --check scripts/audit-fagverk-psykologi-biological-university.mjs
          node --check scripts/audit-fagverk-psykologi-cognitive-university.mjs
          node --check scripts/audit-fagverk-psykologi-developmental-university.mjs
          node --check scripts/audit-fagverk-psykologi-social-university.mjs
          node --check scripts/audit-fagverk-psykologi-personality-university.mjs
          node --check scripts/audit-fagverk-psykologi-history-science-theory-university.mjs
          node --check scripts/audit-fagverk-psykologi-topic-articles-mental-health-v1.mjs
          node --check scripts/audit-fagverk-psykologi-university-completion-v1.mjs
          node --check scripts/audit-fagverk-psykologi-editorial-quality-v2.mjs
          node --check scripts/audit-fagverk-psykologi-university-readiness.mjs
          node --check scripts/psykologi-subject-state.mjs
          node --check scripts/build-fagverk-release-manifest.mjs

      - name: Materialize Psychology editorial chapters
        run: |
          node scripts/materialize-psykologi-psykisk-helse-institusjoner-behandling-phase4.mjs
          node scripts/enrich-psykologi-psykisk-helse-source-evidence-phase4.mjs
          node scripts/materialize-psykologi-fagtradisjoner-teori-phase4.mjs
          node scripts/materialize-psykologi-utvikling-oppvekst-laring-phase4.mjs
          node scripts/materialize-psykologi-kognisjon-folelser-atferd-phase4.mjs
          node scripts/materialize-psykologi-sosialpsykologi-normalitet-stigma-phase4.mjs
          node scripts/materialize-psykologi-traume-krise-resiliens-omsorg-phase4.mjs
          node scripts/materialize-psykologi-topic-articles-mental-health-v1.mjs
          node scripts/materialize-psykologi-university-completion-v1.mjs

      - name: Refresh deterministic Psychology audits
        run: |
          node scripts/audit-fagverk-psykologi-phase3.mjs --write-report
          node scripts/audit-fagverk-psykologi-psykisk-helse-phase4.mjs --write-report
          node scripts/audit-fagverk-psykologi-fagtradisjoner-teori-phase4.mjs --write-report
          node scripts/audit-fagverk-psykologi-utvikling-oppvekst-laring-phase4.mjs --write-report
          node scripts/audit-fagverk-psykologi-kognisjon-folelser-atferd-phase4.mjs --write-report
          node scripts/audit-fagverk-psykologi-sosialpsykologi-normalitet-stigma-phase4.mjs --write-report
          node scripts/audit-fagverk-psykologi-traume-krise-resiliens-omsorg-phase4.mjs --write-report
          node scripts/audit-fagverk-psykologi-complete.mjs --write-report
          node tools/audit-psykologi-theory-integrity.mjs --write-report
          node scripts/audit-fagverk-psykologi-biological-university.mjs --write-report
          node scripts/audit-fagverk-psykologi-cognitive-university.mjs --write-report
          node scripts/audit-fagverk-psykologi-developmental-university.mjs --write-report
          node scripts/audit-fagverk-psykologi-social-university.mjs --write-report
          node scripts/audit-fagverk-psykologi-personality-university.mjs --write-report
          node scripts/audit-fagverk-psykologi-history-science-theory-university.mjs --write-report
          node scripts/audit-fagverk-psykologi-topic-articles-mental-health-v1.mjs --write-report
          node scripts/audit-fagverk-psykologi-university-completion-v1.mjs --write-report
          node scripts/audit-fagverk-psykologi-editorial-quality-v2.mjs --write-report
          node scripts/audit-fagverk-psykologi-university-readiness.mjs --write-report

      - name: Refresh and validate shared Fagverk architecture
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs --write-report
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs

      - name: Verify deterministic Fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs --check

      - name: Validate Fagverk and Psychology contracts
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-psykologi-phase3.test.mjs
          node --test tests/fagverk-psykologi-psykisk-helse-phase4.test.mjs
          node --test tests/fagverk-psykologi-fagtradisjoner-teori-phase4.test.mjs
          node --test tests/fagverk-psykologi-utvikling-oppvekst-laring-phase4.test.mjs
          node --test tests/fagverk-psykologi-kognisjon-folelser-atferd-phase4.test.mjs
          node --test tests/fagverk-psykologi-sosialpsykologi-normalitet-stigma-phase4.test.mjs
          node --test tests/fagverk-psykologi-traume-krise-resiliens-omsorg-phase4.test.mjs
          node --test tests/fagverk-psykologi-complete.test.mjs
          node --test tests/psykologi-theory-integrity.test.mjs
          node --test tests/fagverk-psykologi-biological-university.test.mjs
          node --test tests/fagverk-psykologi-cognitive-university.test.mjs
          node --test tests/fagverk-psykologi-developmental-university.test.mjs
          node --test tests/fagverk-psykologi-social-university.test.mjs
          node --test tests/fagverk-psykologi-personality-university.test.mjs
          node --test tests/fagverk-psykologi-history-science-theory-university.test.mjs
          node --test tests/fagverk-psykologi-topic-articles-mental-health-v1.test.mjs
          node --test tests/fagverk-psykologi-university-completion-v1.test.mjs
          node --test tests/fagverk-psykologi-editorial-quality-v2.test.mjs
          node --test tests/fagverk-psykologi-metadata-monotonic.test.mjs
          node --test tests/fagverk-psykologi-university-readiness.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs

      - name: Verify chapter 1 rematerializer
        run: node scripts/materialize-psykologi-psykisk-helse-institusjoner-behandling-phase4.mjs

      - name: Verify chapter 1 source enrichment
        run: node scripts/enrich-psykologi-psykisk-helse-source-evidence-phase4.mjs

      - name: Verify chapter 2 rematerializer
        run: node scripts/materialize-psykologi-fagtradisjoner-teori-phase4.mjs

      - name: Verify chapter 3 rematerializer
        run: node scripts/materialize-psykologi-utvikling-oppvekst-laring-phase4.mjs

      - name: Verify chapter 4 rematerializer
        run: node scripts/materialize-psykologi-kognisjon-folelser-atferd-phase4.mjs

      - name: Verify chapter 5 rematerializer
        run: node scripts/materialize-psykologi-sosialpsykologi-normalitet-stigma-phase4.mjs

      - name: Verify chapter 6 rematerializer
        run: node scripts/materialize-psykologi-traume-krise-resiliens-omsorg-phase4.mjs

      - name: Verify complete topic, concept and applied-field rematerialization
        run: |
          node scripts/materialize-psykologi-topic-articles-mental-health-v1.mjs
          node scripts/materialize-psykologi-university-completion-v1.mjs

      - name: Verify deterministic Psychology reports
        run: |
          node scripts/audit-fagverk-psykologi-phase3.mjs
          node scripts/audit-fagverk-psykologi-psykisk-helse-phase4.mjs
          node scripts/audit-fagverk-psykologi-fagtradisjoner-teori-phase4.mjs
          node scripts/audit-fagverk-psykologi-utvikling-oppvekst-laring-phase4.mjs
          node scripts/audit-fagverk-psykologi-kognisjon-folelser-atferd-phase4.mjs
          node scripts/audit-fagverk-psykologi-sosialpsykologi-normalitet-stigma-phase4.mjs
          node scripts/audit-fagverk-psykologi-traume-krise-resiliens-omsorg-phase4.mjs
          node scripts/audit-fagverk-psykologi-complete.mjs
          node tools/audit-psykologi-theory-integrity.mjs
          node scripts/audit-fagverk-psykologi-biological-university.mjs
          node scripts/audit-fagverk-psykologi-cognitive-university.mjs
          node scripts/audit-fagverk-psykologi-developmental-university.mjs
          node scripts/audit-fagverk-psykologi-social-university.mjs
          node scripts/audit-fagverk-psykologi-personality-university.mjs
          node scripts/audit-fagverk-psykologi-history-science-theory-university.mjs
          node scripts/audit-fagverk-psykologi-topic-articles-mental-health-v1.mjs
          node scripts/audit-fagverk-psykologi-university-completion-v1.mjs
          node scripts/audit-fagverk-psykologi-editorial-quality-v2.mjs
          node scripts/audit-fagverk-psykologi-university-readiness.mjs

      - name: Verify deterministic shared Fagverk reports
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs

      - name: Verify deterministic release
        run: node scripts/build-fagverk-release-manifest.mjs --check

      - name: Reject uncommitted generated Psychology changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --stat
            echo 'Run the deterministic Psychology generators locally and commit their outputs.' >&2
            exit 1
          fi
