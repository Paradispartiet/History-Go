name: Oslo People coverage audit

on:
  push:
    branches:
      - agent/oslo-people-zero-gap-audit
    paths:
      - tools/audit-oslo-people-coverage.mts
      - .github/workflows/oslo-people-coverage-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Oslo People coverage
        run: npx tsx tools/audit-oslo-people-coverage.mts

      - name: Validate People data
        run: bash scripts/check-people.sh

      - name: Validate diff
        run: git diff --check

      - name: Publish durable audit
        run: |
          rm .github/workflows/oslo-people-coverage-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/audit-oslo-people-coverage.mts reports/oslo-people-coverage.json reports/oslo-people-coverage.md .github/workflows/oslo-people-coverage-audit.yml
          git commit -m "Audit Oslo People coverage from current main"
          git push origin HEAD:agent/oslo-people-zero-gap-audit
