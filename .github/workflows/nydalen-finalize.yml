name: Nydalen deterministic finalizer

on:
  push:
    branches:
      - agent/nydalen-full-place-production-20260915

permissions:
  contents: write

concurrency:
  group: nydalen-deterministic-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Synchronize description hashes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const placePath = 'data/places/by/oslo/places/nydalen.json';
          const packetPath = 'data/places/production/nydalen.json';
          const place = JSON.parse(fs.readFileSync(placePath, 'utf8'));
          const packet = JSON.parse(fs.readFileSync(packetPath, 'utf8'));
          const hash = value => crypto.createHash('sha256').update(String(value), 'utf8').digest('hex');
          packet.textHashes = packet.textHashes || {};
          packet.textHashes.desc = hash(place.desc);
          packet.textHashes.popupDesc = hash(place.popupDesc);
          fs.writeFileSync(packetPath, JSON.stringify(packet, null, 2) + '\n');
          NODE
      - name: Regenerate quiz production context
        run: npm run quiz:context -- --category by --target nydalen --output data/quiz/production_context/by/nydalen.json
      - name: Regenerate place-open payloads
        run: npm run place-open:build
      - name: Regenerate epoch place index
        run: npm run epoker:places:build
      - name: Regenerate Civication history people index
        run: npm run civication:history-people:build
      - name: Regenerate Fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Record current READ-FIRST evidence
        run: node scripts/place-production-rule-preflight.mjs record --workcard reports/place-production/nydalen-workcard-current.json --place-id nydalen --category by
      - name: Verify deterministic outputs
        run: |
          npm run place-open:check
          npm run epoker:places:check
          npm run civication:history-people:check
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          node scripts/validate-place-description-production-v4_2_policy.mjs --all
          node scripts/place-production-rule-preflight.mjs validate --workcard reports/place-production/nydalen-workcard-current.json
      - name: Commit deterministic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/production/nydalen.json \
                  data/quiz/production_context/by/nydalen.json \
                  data/runtime \
                  data/epoker/epoke-place-index.json \
                  data/Civication/historyPeople_index.json \
                  data/fagverk/fagverk_release.json \
                  reports/place-production/nydalen-workcard-current.json
          if git diff --cached --quiet; then
            echo "No deterministic changes to commit."
          else
            git commit -m "Synchronize Nydalen generated artifacts"
            git push origin HEAD:agent/nydalen-full-place-production-20260915
          fi
