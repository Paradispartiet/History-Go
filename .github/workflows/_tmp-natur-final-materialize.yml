name: Temporary Natur final materialization

on:
  push:
    branches:
      - codex/natur-sluttfase-mikrobiologi-geologi
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && ((github.event_name == 'push' && github.ref_name == 'codex/natur-sluttfase-mikrobiologi-geologi') || (github.event_name == 'pull_request' && github.head_ref == 'codex/natur-sluttfase-mikrobiologi-geologi'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/natur-sluttfase-mikrobiologi-geologi
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Correct final preserved-hook baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/materialize-natur-final-phase.mjs')
          s = p.read_text()
          s = s.replace(
              "final_phase_layer_counts: { emner: 12, methods: 6, mappings: 12, hooks: 20, chapters_added: 1, chapters_rewritten: 1 },",
              "final_phase_layer_counts: { emner: 12, methods: 6, mappings: 12, hooks: 26, chapters_added: 1, chapters_rewritten: 1 },"
          )
          s = s.replace(
              "assert(fagkart.meta.hook_count === 130, `Sluttfasen skal gi 130 hooks, fikk ${fagkart.meta.hook_count}`);",
              "assert(fagkart.meta.hook_count === 136, `Sluttfasen skal gi 136 hooks, fikk ${fagkart.meta.hook_count}`);"
          )
          p.write_text(s)
          PY

      - name: Materialize and regenerate Natur audits
        run: |
          node --check scripts/materialize-natur-final-phase.mjs
          node scripts/materialize-natur-final-phase.mjs
          node scripts/audit-natur-universal-coverage.mjs --write-report --no-check-report
          node scripts/audit-natur-subject-quality.mjs --write-report --no-check-report
          node scripts/audit-natur-fagkart-quality.mjs --write-report --no-check-report
          node scripts/audit-fagverk-natur-pilot.mjs --write-report --no-check-report
          node scripts/audit-fagverk-subject-inventory.mjs --write-report --no-check-report
          node scripts/audit-fagverk-general-engine.mjs --write-report --no-check-report

      - name: Commit generated production data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Materialiser Natur sluttfase"
            git push origin HEAD:codex/natur-sluttfase-mikrobiologi-geologi
          fi
