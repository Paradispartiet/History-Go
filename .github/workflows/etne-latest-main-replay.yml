name: Replay Etne batch on latest main

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/etne-latest-main-replay.yml

permissions:
  contents: write

jobs:
  replay:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/etne-religion-subculture-fresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-religion-subculture-fresh
          fetch-depth: 0

      - name: Save verified place payload
        shell: bash
        run: |
          mkdir -p /tmp/etne-payload/places /tmp/etne-payload/geonorge
          cp data/places/religion/vestland/etne/etne_kyrkje.json /tmp/etne-payload/places/
          cp data/places/religion/vestland/etne/skanevik_kyrkje.json /tmp/etne-payload/places/
          cp data/places/religion/vestland/etne/frette_kapell.json /tmp/etne-payload/places/
          cp reports/etne-religion-subculture-batch/geonorge/etne_kyrkje.json /tmp/etne-payload/geonorge/
          cp reports/etne-religion-subculture-batch/geonorge/skanevik_kyrkje.json /tmp/etne-payload/geonorge/

      - name: Reset branch to latest main
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore and reconcile Etne data
        shell: bash
        run: |
          mkdir -p data/places/religion/vestland/etne \
                   reports/etne-religion-subculture-batch/geonorge \
                   reports/etne-religion-subculture-batch/osm \
                   reports/etne-religion-subculture-batch/validation
          cp /tmp/etne-payload/places/*.json data/places/religion/vestland/etne/
          cp /tmp/etne-payload/geonorge/*.json reports/etne-religion-subculture-batch/geonorge/

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const verifiedAt = '2026-07-23';
          const religionEmner = [
            'em_religion_hellige_rom',
            'em_religion_ritualer_praksis',
            'em_religion_religionshistorie_lokalt',
            'em_religion_kristendom'
          ];
          const unique = (xs) => [...new Set(xs)];
          const writeJson = (file, data) => {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          };

          function records(doc) {
            if (Array.isArray(doc)) return doc;
            if (Array.isArray(doc?.places)) return doc.places;
            return [doc];
          }

          function polygonCentroid(points) {
            const pts = [...points];
            if (pts[0].lat !== pts.at(-1).lat || pts[0].lon !== pts.at(-1).lon) pts.push(pts[0]);
            let area2 = 0, cx = 0, cy = 0;
            for (let i = 0; i < pts.length - 1; i++) {
              const x0 = pts[i].lon, y0 = pts[i].lat, x1 = pts[i + 1].lon, y1 = pts[i + 1].lat;
              const cross = x0 * y1 - x1 * y0;
              area2 += cross;
              cx += (x0 + x1) * cross;
              cy += (y0 + y1) * cross;
            }
            if (Math.abs(area2) < 1e-12) return {
              lat: points.reduce((s, p) => s + p.lat, 0) / points.length,
              lon: points.reduce((s, p) => s + p.lon, 0) / points.length
            };
            return { lat: cy / (3 * area2), lon: cx / (3 * area2) };
          }

          async function verifyFrette() {
            const url = 'https://api.openstreetmap.org/api/0.6/way/557505490/full.json';
            const response = await fetch(url, { headers: { 'user-agent': 'History-Go-Etne-latest-main-replay/1.0' } });
            if (!response.ok) throw new Error(`Frette OSM HTTP ${response.status}`);
            const payload = await response.json();
            writeJson('reports/etne-religion-subculture-batch/osm/frette_kapell.json', { url, response: payload });
            const elements = payload.elements || [];
            const way = elements.find((e) => e.type === 'way' && e.id === 557505490);
            if (!way) throw new Error('Frette OSM way missing');
            if (way.tags?.amenity !== 'place_of_worship' || way.tags?.building !== 'chapel' || !String(way.tags?.name || '').toLowerCase().includes('frette')) {
              throw new Error(`Unexpected Frette OSM tags: ${JSON.stringify(way.tags || {})}`);
            }
            const nodes = new Map(elements.filter((e) => e.type === 'node').map((e) => [e.id, { lat: Number(e.lat), lon: Number(e.lon) }]));
            const points = (way.nodes || []).map((id) => nodes.get(id)).filter(Boolean);
            if (points.length < 3) throw new Error('Frette geometry has too few nodes');
            const center = polygonCentroid(points);
            const file = 'data/places/religion/vestland/etne/frette_kapell.json';
            const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
            const place = records(doc)[0];
            place.lat = center.lat;
            place.lon = center.lon;
            place.sourceProvider = 'osm';
            place.sourceObjectId = 'osm-way:557505490';
            place.geocodeAccuracy = 'building';
            place.coordRole = 'building_center';
            place.coordType = 'building_center';
            place.coordStatus = 'verified_geometry';
            place.coordSource = 'OpenStreetMap building geometry + Norges Kirker';
            place.coordSourceId = 'osm-way:557505490';
            place.coordSourceUrl = 'https://www.openstreetmap.org/way/557505490';
            place.coordVerifiedAt = verifiedAt;
            place.coordNote = 'Object-first: OSM way 557505490 er henta direkte frå OSM API og verifisert fresh som namngitt place_of_worship med building=chapel. Polygoncentroid frå sjølve bygningsgeometrien brukes som canonical marker og er krysskontrollert mot Norges Kirker.';
            writeJson(file, doc);
          }

          function addReligionEmner(file) {
            const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const p of records(doc)) p.emne_ids = unique([...(p.emne_ids || []), ...religionEmner]);
            writeJson(file, doc);
          }

          function addSubcultureLayer(file, paragraph) {
            const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
            const p = records(doc)[0];
            p.secondaryBadgeIds = unique([...(p.secondaryBadgeIds || []), 'subkultur']);
            p.tags = unique([...(p.tags || []), 'subkultur', 'skatekultur', 'scene_og_fellesskap']);
            p.emne_ids = unique([...(p.emne_ids || []), 'em_sub_ungdomskultur_identitet', 'em_sub_tilhorighet_miljo', 'em_sub_scene_fellesskap']);
            if (!String(p.popupDesc || '').includes('sekundært Subkultur-lag')) p.popupDesc = String(p.popupDesc || '') + ' ' + paragraph;
            p.quiz_profile = p.quiz_profile || {};
            p.quiz_profile.primary_angles = unique([...(p.quiz_profile.primary_angles || []), 'skatekultur', 'scene_og_fellesskap']);
            p.quiz_profile.must_include = unique([...(p.quiz_profile.must_include || []), 'at Sport er hovudkategori og Subkultur eit dokumentert sekundært lag']);
            p.quiz_profile.avoid_angles = unique([...(p.quiz_profile.avoid_angles || []), 'a_kalle_all_bruk_eller_alle_brukarar_subkultur']);
            p.quiz_profile.notes = `${p.quiz_profile.notes ? p.quiz_profile.notes + ' ' : ''}Subkultur-laget gjeld den dokumenterte skate/BMX-praksisen, scena og fellesskapet rundt eigenorganisert bruk; det er ikkje ein påstand om at alle brukarar er marginaliserte.`;
            writeJson(file, doc);
          }

          async function main() {
            const index = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
            const existing = new Set(index.map((p) => p.id));
            for (const id of ['etne_kyrkje', 'skanevik_kyrkje', 'frette_kapell']) {
              if (existing.has(id)) throw new Error(`Latest main already contains ${id}; manual reconciliation required`);
            }

            await verifyFrette();
            for (const file of [
              'data/places/religion/vestland/etne/etne_kyrkje.json',
              'data/places/religion/vestland/etne/skanevik_kyrkje.json',
              'data/places/religion/vestland/etne/frette_kapell.json'
            ]) addReligionEmner(file);

            addSubcultureLayer(
              'data/places/sport/vestland/etne/etne_bmx_og_skatepark.json',
              'I History Go er Sport framleis hovudkategorien fordi dette fysisk er eit BMX- og skateanlegg. Samstundes får staden eit sekundært Subkultur-lag: ei eiga BMX-/skateforeining, eigenorganisert bruk og ungdomskultur dokumenterer eit sjølvstendig miljø rundt arenaen.'
            );
            addSubcultureLayer(
              'data/places/sport/vestland/etne/skanevik_skatepark.json',
              'I History Go er Sport framleis hovudkategorien fordi dette fysisk er eit skateanlegg. Samstundes får parken eit sekundært Subkultur-lag fordi den permanente streetprega parken er bygd spesifikt rundt skating og eigenorganisert skatepraksis.'
            );

            const manifest = JSON.parse(fs.readFileSync('data/places/manifest.json', 'utf8'));
            for (const file of [
              'places/religion/vestland/etne/etne_kyrkje.json',
              'places/religion/vestland/etne/skanevik_kyrkje.json',
              'places/religion/vestland/etne/frette_kapell.json'
            ]) if (!manifest.files.includes(file)) manifest.files.push(file);
            writeJson('data/places/manifest.json', manifest);

            fs.writeFileSync('reports/etne-religion-subculture-batch/README.md', `# Etne religion og skatekultur\n\nDato: ${verifiedAt}\n\n## Nye Religion-steder\n\n- Etne kyrkje\n- Skånevik kyrkje\n- Frette kapell\n\n## Utsett stad\n\n- Skånevik bedehus er ikkje aktivert. Kommunen dokumenterer organisasjonen og Tjedlavegen 38, men det er ikkje sikkert at adressa er den fysiske bedehusbygningen. Ingen markør blir gjetta.\n\n## Subkultur-vurdering\n\n- Etne BMX- og skatepark: Sport primært, Subkultur sekundært.\n- Skånevik skatepark: Sport primært, Subkultur sekundært.\n- Etne pumptrack: berre Sport; kjeldegrunnlaget dokumenterer ikkje eit like tydeleg sjølvstendig skate-/subkulturmiljø.\n`);
          }
          main().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Rebuild and validate
        shell: bash
        run: |
          set -o pipefail
          npm run places:index:build
          npm run audit:places-split-manifest-sync 2>&1 | tee reports/etne-religion-subculture-batch/validation/split-manifest-sync.txt
          npm run places:index:check 2>&1 | tee reports/etne-religion-subculture-batch/validation/places-index-check.txt
          npm run places:emner:check 2>&1 | tee reports/etne-religion-subculture-batch/validation/emne-check.txt
          npm run places:coords:intake 2>&1 | tee reports/etne-religion-subculture-batch/validation/coordinate-intake.txt
          set +e
          npm run health:places 2>&1 | tee reports/etne-religion-subculture-batch/validation/health-places.txt
          set -e
          git checkout origin/main -- reports/place-coordinate-intake-gate.md 2>/dev/null || true

      - name: Commit clean latest-main result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Etne religion places and skate culture layers"
          git push --force-with-lease origin HEAD:agent/etne-religion-subculture-fresh
