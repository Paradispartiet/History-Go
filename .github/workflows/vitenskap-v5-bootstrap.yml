name: Vitenskap V5 bootstrap

on:
  push:
    branches:
      - editorial/vitenskap-v5-20260805
    paths:
      - '.github/workflows/vitenskap-v5-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vitenskap-v5-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  expose-sources:
    name: Reconstruct Vitenskap V5 sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/vitenskap-v5-20260805
          fetch-depth: 0
      - name: Reconstruct permanent production sources
        run: |
          cat .bootstrap/vitenskap-v5/builder.part.* | tr -d '\n' | base64 --decode | gzip --decompress > tools/build-vitenskap-editorial-v5.mjs
          tr -d '\n' < .bootstrap/vitenskap-v5/validator.b64 | base64 --decode | gzip --decompress > scripts/validate-vitenskap-editorial-v5.mjs
          tr -d '\n' < .bootstrap/vitenskap-v5/test.b64 | base64 --decode | gzip --decompress > tests/vitenskap-editorial-v5.test.mjs
          chmod +x tools/build-vitenskap-editorial-v5.mjs scripts/validate-vitenskap-editorial-v5.mjs
          node --check tools/build-vitenskap-editorial-v5.mjs
      - name: Commit reconstructed sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build-vitenskap-editorial-v5.mjs scripts/validate-vitenskap-editorial-v5.mjs tests/vitenskap-editorial-v5.test.mjs
          git diff --cached --stat
          git commit -m 'Expose Vitenskap V5 production sources'
          git push origin HEAD:editorial/vitenskap-v5-20260805
