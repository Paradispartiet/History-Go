name: Oslo sentrum Politikk image staging (PR 6579)

on:
  push:
    branches:
      - research/oslo-sentrum-politikk-six-v1-20261023
    paths:
      - .github/workflows/oslo-sentrum-politikk-image-staging.yml
      - scripts/place-production/stage_oslo_sentrum_politikk_photos.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scoped-photo-staging:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed PR branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install 'Pillow>=10,<13'
      - name: Validate script syntax
        run: python -m py_compile scripts/place-production/stage_oslo_sentrum_politikk_photos.py
      - name: Download verified original-file artifact from previous successful GitHub run
        uses: actions/download-artifact@v4
        with:
          name: oslo-politikk-pr6579-three-photo-review
          run-id: 39935997979
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/place-production/media-originals/oslo-sentrum-politikk
      - name: Stage manually composed portrait crops from approved original bytes
        run: |
          python scripts/place-production/stage_oslo_sentrum_politikk_photos.py \
            --place hoyesteretts_hus \
            --source-dir reports/place-production/media-originals/oslo-sentrum-politikk/hoyesteretts_hus
          python scripts/place-production/stage_oslo_sentrum_politikk_photos.py \
            --place folkets_hus_oslo --focus-x 0.92 \
            --source-dir reports/place-production/media-originals/oslo-sentrum-politikk/folkets_hus_oslo
          python scripts/place-production/stage_oslo_sentrum_politikk_photos.py \
            --place hoyblokka --focus-x 0.93 --allow-historical-hoyblokka \
            --source-dir reports/place-production/media-originals/oslo-sentrum-politikk/hoyblokka
      - name: Produce three-place visual review contact sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          root = Path('reports/place-production/media-staging/oslo-sentrum-politikk')
          places = ['hoyesteretts_hus','folkets_hus_oslo','hoyblokka']
          canvas = Image.new('RGB', (2400, 1600), '#f7f7f7')
          d = ImageDraw.Draw(canvas)
          for idx, place in enumerate(places):
              front = root/place/f'{place}_front_portrait.webp'
              hero = root/place/f'{place}.webp'
              with Image.open(front) as im:
                  thumbnail = im.convert('RGB')
                  thumbnail.thumbnail((520, 870))
                  canvas.paste(thumbnail, (idx*800+24, 55))
              with Image.open(hero) as im:
                  thumbnail = im.convert('RGB')
                  thumbnail.thumbnail((745, 520))
                  canvas.paste(thumbnail, (idx*800+24, 1000))
              d.text((idx*800+24, 12), f'{place}: portrait vs. hero (draft review)', fill='#111111')
          canvas.save(root/'three-place-side-by-side-review.jpg', quality=88)
          PY
      - name: Verify the staging is non-runtime with both image roles per place
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('reports/place-production/media-staging/oslo-sentrum-politikk')
          for name in ('hoyesteretts_hus','folkets_hus_oslo','hoyblokka'):
              meta=json.loads((base/name/'staging-metadata.json').read_text())
              assert meta['status']=='STAGED_NOT_PUBLISHED_REQUIRES_HUMAN_QA'
              assert set(meta['assets'])=={'image','frontImage'}
              assert all(Path(item['staged_file']).exists() for item in meta['assets'].values())
              assert all(item['sha256'] for item in meta['assets'].values())
              if name=='hoyblokka':
                  assert meta['historical_only']
              print(name, meta['creator'], meta['license'], meta['original_sha256'])
          print('Non-runtime staging only, no canonical data/places modified.')
          PY
      - name: Upload originals, WebPs and three-place review sheet
        uses: actions/upload-artifact@v4
        with:
          name: oslo-politikk-pr6579-three-photo-review
          path: reports/place-production/media-staging/oslo-sentrum-politikk/
          if-no-files-found: error
          retention-days: 14
      - name: Report hard remaining gates
        if: always()
        run: |
          {
            echo "### Oslo Politikk staged-photo review"
            echo ""
            echo "This job prepares **non-runtime review assets only**."
            echo "No Place image field, binary, production manifest or v1 status has been published."
            echo "Review identity, two crop roles per place, license and credit in app before import."
            echo "Y-blokka remains blocked by artwork rights. Høyblokka needs dated historical-only label."
          } >> "$GITHUB_STEP_SUMMARY"
