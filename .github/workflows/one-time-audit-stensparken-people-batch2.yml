name: One-time audit Stensparken people batch 2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/stensparken-people-batch2-audit-trigger.txt

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build focused audit report
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          ids = {"jo_visdal", "max_roth", "lars_utne", "jens_bjelke"}
          names = {"Jo Visdal", "Max Roth", "Lars Utne", "Jens Bjelke"}
          report = {"targets": sorted(ids), "people_entries": [], "references": []}

          manifest = json.loads(Path("data/people/manifest.json").read_text(encoding="utf-8"))
          for relative in manifest["files"]:
              path = Path("data") / relative
              data = json.loads(path.read_text(encoding="utf-8"))
              entries = data if isinstance(data, list) else [data]
              for index, entry in enumerate(entries):
                  if not isinstance(entry, dict):
                      continue
                  if entry.get("id") in ids or entry.get("name") in names:
                      report["people_entries"].append({"path": str(path), "index": index, "entry": entry})

          for path in sorted(Path("data").rglob("*.json")):
              text = path.read_text(encoding="utf-8")
              matched = sorted(target for target in ids if target in text)
              if matched:
                  report["references"].append({"path": str(path), "ids": matched})

          out = Path("reports/stensparken-people-batch2-audit")
          out.mkdir(parents=True, exist_ok=True)
          (out / "audit.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: stensparken-people-batch2-audit-${{ github.run_id }}
          path: reports/stensparken-people-batch2-audit/audit.json
          if-no-files-found: error
