name: TEMP Fix Ekebergparken places index sync

on:
  push:
    branches:
      - agent/fix-ekebergparken-places-index-sync
    paths:
      - .github/workflows/TEMP-fix-ekebergparken-places-index-sync.yml

concurrency:
  group: fix-ekebergparken-places-index-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ekebergparken-places-index-sync
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate canonical places index
        run: npm run places:index:build
      - name: Verify places index and coordinate parity
        run: npm run places:index:check
      - name: Verify related composed canonical data
        run: |
          npm run knowledge:canonical:check
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Restrict permanent diff to generated places index
        run: |
          git status --short
          test -n "$(git status --porcelain data/places/places_index.json)"
          EXTRA=$(git status --porcelain | grep -v '^.. data/places/places_index.json$' | grep -v '^.. .github/workflows/TEMP-fix-ekebergparken-places-index-sync.yml$' || true)
          if [ -n "$EXTRA" ]; then
            echo "Unexpected generated changes:"
            echo "$EXTRA"
            exit 1
          fi
      - name: Remove temporary workflow
        run: rm .github/workflows/TEMP-fix-ekebergparken-places-index-sync.yml
      - name: Commit exact verified index repair
        run: |
          git config user.name "History Go integrity repair agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Synchronize Ekebergparken Museum places index"
          git push origin HEAD:agent/fix-ekebergparken-places-index-sync
