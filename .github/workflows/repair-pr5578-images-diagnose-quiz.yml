name: Finalize PR5578 Fagverk legacy batch

on:
  push:
    branches:
      - agent/fagverk-legacy-grunerlokka-20260831
    paths:
      - .github/workflows/repair-pr5578-images-diagnose-quiz.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync branch to current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Produce canonical Markveien image assets
        run: node tools/repair-pr5578-images.mjs
      - name: Rebuild four deterministic quiz contexts
        run: |
          node scripts/build-quiz-production-context.mjs --category by --target birkelunden --output data/quiz/production_context/by/birkelunden.json
          node scripts/build-quiz-production-context.mjs --category by --target olaf_ryes_plass --output data/quiz/production_context/by/olaf_ryes_plass.json
          node scripts/build-quiz-production-context.mjs --category by --target sofienbergparken --output data/quiz/production_context/by/sofienbergparken.json
          node scripts/build-quiz-production-context.mjs --category by --target markveien --output data/quiz/production_context/by/markveien.json
      - name: Regenerate Fagverk and runtime artifacts
        run: |
          node scripts/build-place-open-payloads.mjs
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate Fagverk, images and quiz context
        run: |
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-place-open-payloads.mjs --check
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/fagverk-place-substance-audit.test.mjs
          node --test tests/fagverk-link-audit.test.mjs
          node scripts/audit-place-images.mjs --mode=changed
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          git diff --check
      - name: Commit final production result and remove temporary tooling
        run: |
          git add \
            data/places/by/oslo/places/markveien.json \
            bilder/places/markveien.JPG \
            bilder/kort/places/markveien.PNG \
            bilder/places/markveien_front_portrait.webp \
            data/quiz/production_context/by/birkelunden.json \
            data/quiz/production_context/by/olaf_ryes_plass.json \
            data/quiz/production_context/by/sofienbergparken.json \
            data/quiz/production_context/by/markveien.json \
            data/runtime \
            data/fagverk/fagverk_release.json \
            reports/fagverk/fagverk-place-page-coverage-v2.json
          git rm tools/repair-pr5578-images.mjs .github/workflows/repair-pr5578-images-diagnose-quiz.yml
          git diff --cached --quiet && { echo "No production changes to commit"; exit 1; }
          git commit -m "Finalize Grünerløkka Fagverk legacy batch"
          git push origin HEAD:${GITHUB_REF_NAME}
