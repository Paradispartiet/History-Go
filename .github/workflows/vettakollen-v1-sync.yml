name: Vettakollen v1 canonical content generation
on:
  push:
    branches: [history-go/vettakollen-v1-20261021]
    paths:
      - '.github/workflows/vettakollen-v1-sync.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Sync English Spanish Portuguese to current source text
        shell: bash
        run: |
          node --input-type=module <<'VETTA_I18N'
          import fs from 'node:fs';import crypto from 'node:crypto';
          const p=JSON.parse(fs.readFileSync('data/places/natur/oslo/places_natur/vettakollen.json','utf8'));
          const norm=s=>String(s||'').replace(/\r\n/g,'\n').replace(/[ \t]+/g,' ').trim();
          const sourceHash=crypto.createHash('sha256').update(JSON.stringify({name:norm(p.name),desc:norm(p.desc),popupDesc:norm(p.popupDesc||p.popupdesc)})).digest('hex').slice(0,16);
          const translations={"en":{"desc":"From Vettakollen, an old beacon hill above Oslo, the view stretches across the city and fjord. Its name recalls warning fires from earlier times, while the lookout, Holmenkollen railway and the paths towards Fuglemyra show how the hill became an accessible walking destination. The hilltop must not be confused with the residential neighbourhood or metro station of the same name.","popupDesc":"The view opens suddenly when the forest gives way on Vettakollen. Below lies Oslo and the fjord, with Sognsvann to the east. Store norske leksikon gives the wooded hill a height of 419 metres above sea level, while Oslo byleksikon says 418 metres. Farther south, another surveying point at approximately 378 metres offers a celebrated view. The summit and the place where many people stop to admire the city are therefore not quite the same spot.\n\nThe name reaches back beyond modern hiking trails. It comes from vete, a fire beacon once used to transmit warnings. Oslo byleksikon describes Vettakollen as an old beacon site for Oslo and Aker. Tradition connects such beacons to King Haakon the Good, but the date of the actual beacon on this particular hill is uncertain. The name nevertheless preserves an idea of communication: flames on a hilltop could pass an alarm across the landscape.\n\nThe hill also tells a story of work. Vestre Aker historical society describes Vettakollen prospect, east of Båntjern, where the Gotthalf copper works extracted copper from 1704 to 1714. That old mining site is not the same as today's viewpoint. Prospecting connected geology and old tracks with economic activity around the forest. The rocks themselves belong to a much older story, formed in the Permian period, long before Oslo existed.\n\nThe Holmenkollen railway opened in 1898, bringing the surrounding hills closer to the city. The station below the hill was originally called Greveveien and acquired a station building in 1907. A post office remained in that building until 1989. Villa districts developed on the southern slopes after the railway opened, but the neighbourhood and the station are distinct places; this History Go location is the physical hill.\n\nThe Ski Association describes a 3.3-kilometre hike from Sognsvann to the viewpoint via Båntjern, ending with a steeper trail over stones and roots. The paths continue across Fuglemyra, an area that Oslo byleksikon tentatively connects with cultivation in the Bronze Age. Fuglemyrhytta opened in 2018. Today the hill is a walking destination, a geological landscape and a remembered warning site, while the uncertain traditions must not be mistaken for precisely dated facts."},"es":{"desc":"Desde Vettakollen, una antigua colina de señales por encima de Oslo, se contemplan la ciudad y el fiordo. Su nombre recuerda las hogueras de aviso, mientras que el mirador, el ferrocarril de Holmenkollen y los senderos hacia Fuglemyra muestran cómo se convirtió en una excursión accesible. La cima no debe confundirse con el barrio residencial ni con la estación del mismo nombre.","popupDesc":"La vista se abre de repente cuando el bosque deja paso a las rocas de Vettakollen. Abajo quedan Oslo y el fiordo, mientras Sognsvann está al este. Store norske leksikon atribuye a la colina arbolada 419 metros sobre el nivel del mar; Oslo byleksikon señala 418 metros. Más al sur hay otro punto geodésico, a unos 378 metros, famoso por sus vistas. La cumbre y el lugar donde muchas personas se detienen para mirar la ciudad no son exactamente el mismo sitio.\n\nEl nombre se remonta a tiempos anteriores a los senderos actuales. Procede de vete, una hoguera de señales utilizada para transmitir avisos. Oslo byleksikon considera Vettakollen un antiguo lugar de señales para Oslo y Aker. La tradición relaciona este sistema con el rey Haakon el Bueno, pero no se conoce con certeza la fecha de la hoguera local. Aun así, el nombre conserva la idea de comunicación: un fuego visible desde lejos podía transmitir una alarma.\n\nLa colina también fue un paisaje de trabajo. La sociedad histórica de Vestre Aker documenta el pequeño yacimiento minero de Vettakollen, al este de Båntjern, donde la empresa de cobre Gotthalf trabajó entre 1704 y 1714. Ese lugar minero no es el mirador actual. La actividad minera conectaba la geología y los antiguos caminos con la economía del bosque. Las rocas cuentan una historia todavía anterior, formada en el Pérmico, antes de que existiera Oslo.\n\nEl ferrocarril de Holmenkollen abrió en 1898 y acercó las colinas a la ciudad. La estación al pie del monte se llamó inicialmente Greveveien y recibió un edificio en 1907. Allí hubo una oficina postal hasta 1989. Con el ferrocarril surgieron zonas de villas al sur de la colina, pero el barrio y la estación son lugares distintos de esta cima de History Go.\n\nLa Asociación de Esquí describe una ruta de 3,3 kilómetros desde Sognsvann, pasando por Båntjern y terminando con una subida más empinada entre rocas y raíces. Los senderos continúan por Fuglemyra, que Oslo byleksikon relaciona, con reservas, con posibles cultivos en la Edad de Bronce. Fuglemyrhytta abrió en 2018. Hoy la colina es un destino para caminar, estudiar el paisaje y recordar las antiguas señales, siempre separando las tradiciones de las fechas documentadas."},"pt":{"desc":"Do Vettakollen, uma antiga colina de sinais acima de Oslo, avista-se a cidade e o fiorde. O nome recorda fogueiras de aviso, enquanto o miradouro, o caminho de ferro de Holmenkollen e os trilhos até Fuglemyra mostram como a colina se tornou um destino acessível. O cume não deve ser confundido com o bairro residencial ou a estação com o mesmo nome.","popupDesc":"A vista abre-se de repente quando a floresta dá lugar aos rochedos do Vettakollen. Em baixo ficam Oslo e o fiorde, enquanto Sognsvann se encontra a leste. A Store norske leksikon atribui 419 metros de altitude à colina arborizada, mas o Oslo byleksikon indica 418 metros. Mais a sul há outro ponto geodésico, a cerca de 378 metros, conhecido pela bela vista. O ponto mais alto e o lugar onde muitos param para admirar a cidade não são, portanto, exatamente o mesmo.\n\nO nome vem de uma época anterior aos trilhos atuais. Deriva de vete, uma fogueira de sinalização usada para transmitir avisos. O Oslo byleksikon descreve Vettakollen como um antigo local de sinais para Oslo e Aker. A tradição associa este sistema ao rei Haakon, o Bom, mas não se conhece com certeza a data da fogueira nesta colina. O nome conserva, contudo, uma ideia de comunicação: o fogo num ponto alto podia transmitir um alerta à distância.\n\nA colina também guarda memórias de trabalho. A associação histórica de Vestre Aker documenta uma pequena exploração mineira a leste de Båntjern, onde a empresa de cobre Gotthalf trabalhou entre 1704 e 1714. Essa antiga mina não é o miradouro atual. A prospeção ligava a geologia, os caminhos antigos e a economia em redor da floresta. As rochas têm uma história ainda mais antiga, formada durante o Pérmico, muito antes de existir a cidade.\n\nA linha de Holmenkollen abriu em 1898 e aproximou estas colinas de Oslo. A estação ao pé da elevação chamava-se inicialmente Greveveien e recebeu um edifício próprio em 1907. A estação teve serviço postal até 1989. Depois da abertura da linha surgiram bairros de moradias na encosta sul, mas o bairro e a estação são lugares diferentes: este ponto do History Go representa a colina.\n\nA associação de esqui descreve um percurso de 3,3 quilómetros desde Sognsvann, passando por Båntjern e terminando numa subida mais íngreme entre pedras e raízes. Os trilhos continuam por Fuglemyra, que o Oslo byleksikon associa, com alguma incerteza, a possíveis cultivos na Idade do Bronze. A Fuglemyrhytta abriu em 2018. Hoje a colina é destino de caminhada, paisagem geológica e antiga memória de avisos, sem confundir tradições com factos datados."}};
          for(const [lang,translation] of Object.entries(translations)){
           const file='data/i18n/content/places/'+lang+'.json';
           const data=JSON.parse(fs.readFileSync(file,'utf8'));
           data.vettakollen={_sourceHash:sourceHash,_status:'machine_translated',name:'Vettakollen',...translation};
           fs.writeFileSync(file,JSON.stringify(data,null,2)+'\n');
           console.log('Synced Vettakollen',lang,sourceHash);
          }
          VETTA_I18N
          node scripts/check-place-i18n-freshness.mjs vettakollen
      - name: Generate canonical Knowledge IDs
        run: npm run knowledge:canonical:write
      - name: Generate Fagverk release manifest
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Generate Place-open payloads
        run: npm run place-open:build
      - name: Generate epoch index
        run: npm run epoker:places:build
      - name: Generate place catalog
        run: npm run places:index:build
      - name: Verify 21 linked Knowledge units, photos and app payload
        shell: bash
        run: |
          node --input-type=module <<'VETTA_VERIFY'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const q=JSON.parse(fs.readFileSync('data/quiz/natur/vettakollen_sets.json','utf8')).sets.flatMap(s=>s.questions);
          assert.equal(q.length,21);
          q.forEach(x=>{assert.equal(x.answer,x.options[x.answerIndex]);assert.equal(x.knowledge_link_status,'linked',x.id);assert.ok(x.primary_knowledge_unit_id,x.id)});
          const p=JSON.parse(fs.readFileSync('data/runtime/place-open/vettakollen.json','utf8')).place;
          assert.equal(p.id,'vettakollen');
          assert.ok(fs.statSync(p.frontImage).size>12000 && fs.statSync(p.image).size>12000);
          console.log('21/21 linked; both local images and Place-open payload exist');
          VETTA_VERIFY
          node scripts/check-place-i18n-freshness.mjs vettakollen
          npm run knowledge:canonical:check
          npm run place-open:check
          npm run epoker:places:check
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit generated data to same PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/i18n/content/places/en.json data/i18n/content/places/es.json data/i18n/content/places/pt.json
          git add data/quiz/natur/vettakollen_sets.json data/knowledge/knowledge_units.generated.json reports/knowledge-id-backfill.json
          git add data/fagverk/fagverk_release.json data/runtime data/epoker/epoke-place-index.json data/places/places_index.json
          if ! git diff --cached --quiet; then
            git commit -m "build(history-go): sync Vettakollen translations Knowledge and runtime"
            git pull --rebase origin history-go/vettakollen-v1-20261021
            git push origin HEAD:history-go/vettakollen-v1-20261021
          fi
