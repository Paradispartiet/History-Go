name: TEMP Materialize Litteratur Redaksjonsmedarbeider Role World

on:
  push:
    branches:
      - agent/civication-litteratur-redaksjonsmedarbeider-role-world-rollout
    paths:
      - scripts/TEMP_materialize_litteratur_redaksjonsmedarbeider_role_world.mjs
      - tests/civication-litteratur-redaksjonsmedarbeider-role-world-rollout.test.js
      - reports/CIVICATION_LITTERATUR_REDAKSJONSMEDARBEIDER_ROLE_WORLD_ROLLOUT_SOURCE_FIRST.md
      - reports/CIVICATION_LITTERATUR_REDAKSJONSMEDARBEIDER_ROLE_WORLD_ROLLOUT.md
      - .github/workflows/TEMP-civication-litteratur-redaksjonsmedarbeider-role-world-materialize.yml

concurrency:
  group: civication-litteratur-redaksjonsmedarbeider-role-world-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-litteratur-redaksjonsmedarbeider-role-world-rollout
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize Redaksjonsmedarbeider Role World
        run: node scripts/TEMP_materialize_litteratur_redaksjonsmedarbeider_role_world.mjs
      - name: Make Serieskaper queue-head assertion progression-safe
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const testPath = 'tests/civication-film-tv-serieskaper-role-world-rollout.test.js';
          const source = fs.readFileSync(testPath, 'utf8');
          const stale = "assert.equal(readiness.rollout_queue?.[0]?.key, 'litteratur/redaksjonsmedarbeider');";
          const replacement = "assert.notEqual(readiness.rollout_queue?.[0]?.key, KEY, 'Completed Serieskaper cannot return to rollout head');";
          if (source.includes(stale)) {
            fs.writeFileSync(testPath, source.replace(stale, replacement));
          } else if (!source.includes(replacement)) {
            throw new Error('Expected stale or progression-safe Serieskaper queue-head assertion not found');
          }
          NODE
      - name: Regenerate scene registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Regenerate career gameplay audit
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Regenerate rollout readiness
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify focused Redaksjonsmedarbeider and canonical gates
        run: |
          node tests/civication-litteratur-redaksjonsmedarbeider-rollout-playability.test.js
          node tests/civication-litteratur-redaksjonsmedarbeider-role-world-rollout.test.js
          node tests/civication-film-tv-serieskaper-role-world-rollout.test.js
          node tests/civication-role-world-contract.test.js
          node tests/civication-role-world-broad-rollout-policy.test.js
          node scripts/build-civication-scene-registry.mjs --check
          node scripts/audit-civication-career-gameplay.mjs --check
          node scripts/audit-civication-role-world-rollout-readiness.mjs --check
      - name: Run full Civication suite
        run: npm run test:civication
      - name: Remove temporary materialization surface
        run: |
          rm scripts/TEMP_materialize_litteratur_redaksjonsmedarbeider_role_world.mjs
          rm .github/workflows/TEMP-civication-litteratur-redaksjonsmedarbeider-role-world-materialize.yml
      - name: Commit exact verified result
        run: |
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Litteratur Redaksjonsmedarbeider Role World rollout"
          git push origin HEAD:agent/civication-litteratur-redaksjonsmedarbeider-role-world-rollout
