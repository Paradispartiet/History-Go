name: Cleanup Innlandet batch 16 stale split

on:
  push:
    branches: [main]
    paths:
      - .github/innlandet-batch16-stale-split-trigger.txt

permissions:
  contents: write

concurrency:
  group: cleanup-innlandet-batch16-stale-split
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate moved data, remove stale split, rerun global audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from collections import Counter
          from pathlib import Path

          root = Path('.')
          places_root = root / 'data/places'
          main_manifest_path = places_root / 'manifest.json'
          stale_manifest_path = places_root / 'historie/innlandet/places_historie_innlandet_batch16_manifest.json'
          stale_split_dir = places_root / 'historie/innlandet/places_historie_innlandet_batch16'
          missing_source = places_root / 'historie/innlandet/places_historie_innlandet_batch16.json'
          missing_source_rel = 'places/historie/innlandet/places_historie_innlandet_batch16.json'

          mapping = [
              ('moelv_stasjon_mjoslinjen', 'by', 'places/by/innlandet/moelv_stasjon_mjoslinjen.json'),
              ('stange_stasjon_dovrebanen', 'by', 'places/by/innlandet/stange_stasjon_dovrebanen.json'),
              ('gran_stasjon_gjovikbanen', 'by', 'places/by/innlandet/gran_stasjon_gjovikbanen.json'),
              ('lena_stasjon_totenbanen', 'by', 'places/by/innlandet/lena_stasjon_totenbanen.json'),
              ('reinsvoll_stasjon_totenbanen', 'by', 'places/by/innlandet/reinsvoll_stasjon_totenbanen.json'),
              ('dokka_stasjon_valdresbanen', 'by', 'places/by/innlandet/dokka_stasjon_valdresbanen.json'),
              ('skarnes_stasjon_kongsvingerbanen', 'by', 'places/by/innlandet/skarnes_stasjon_kongsvingerbanen.json'),
              ('braskereidfoss_kraftverk', 'naeringsliv', 'places/naeringsliv/innlandet/braskereidfoss_kraftverk.json'),
          ]
          expected_ids = [x[0] for x in mapping]

          if missing_source.exists():
              raise SystemExit('Batch 16 source unexpectedly exists; refusing stale cleanup')
          if not stale_manifest_path.exists() or not stale_split_dir.exists():
              raise SystemExit('Expected stale batch 16 split artifacts are missing')

          main_manifest = json.loads(main_manifest_path.read_text(encoding='utf-8'))
          files = main_manifest.get('files')
          if not isinstance(files, list):
              raise SystemExit('Main manifest files is not a list')
          if missing_source_rel in files:
              raise SystemExit('Missing batch 16 source is still registered in main manifest')

          stale_manifest = json.loads(stale_manifest_path.read_text(encoding='utf-8'))
          stale_entries = stale_manifest.get('places')
          if not isinstance(stale_entries, list):
              raise SystemExit('Stale batch 16 split manifest has no places list')
          if [e.get('id') for e in stale_entries] != expected_ids:
              raise SystemExit('Unexpected IDs/order in stale batch 16 split manifest')

          by_id = {e['id']: e for e in stale_entries}
          for place_id, expected_category, destination_rel in mapping:
              if files.count(destination_rel) != 1:
                  raise SystemExit(f'Expected exactly one active destination for {place_id}: {destination_rel}')
              destination = places_root / destination_rel.removeprefix('places/')
              if not destination.exists():
                  raise SystemExit(f'Missing active destination for {place_id}: {destination}')
              dest_payload = json.loads(destination.read_text(encoding='utf-8'))
              if not isinstance(dest_payload, list) or len(dest_payload) != 1:
                  raise SystemExit(f'Destination must be a one-place array for {place_id}')
              dest_place = dest_payload[0]
              if dest_place.get('id') != place_id or dest_place.get('category') != expected_category:
                  raise SystemExit(f'Unexpected destination ID/category for {place_id}')

              split_file = stale_manifest_path.parent / by_id[place_id]['file']
              if not split_file.exists():
                  raise SystemExit(f'Missing stale split copy for {place_id}')
              stale_place = json.loads(split_file.read_text(encoding='utf-8'))
              if stale_place.get('id') != place_id or stale_place.get('category') != 'historie':
                  raise SystemExit(f'Unexpected stale split content for {place_id}')
              if {k: v for k, v in stale_place.items() if k != 'category'} != {
                  k: v for k, v in dest_place.items() if k != 'category'
              }:
                  raise SystemExit(f'Active destination differs from stale source content for {place_id}')

          shutil.rmtree(stale_split_dir)
          stale_manifest_path.unlink()

          # Global final validation after cleanup.
          manifest = json.loads(main_manifest_path.read_text(encoding='utf-8'))
          files = manifest['files']
          if len(files) != len(set(files)):
              raise SystemExit('Duplicate manifest paths remain')

          id_counts = Counter()
          active_history_files = []
          active_history_places = 0
          for rel in files:
              path = places_root / rel.removeprefix('places/')
              payload = json.loads(path.read_text(encoding='utf-8'))
              if isinstance(payload, list):
                  for place in payload:
                      if isinstance(place, dict) and isinstance(place.get('id'), str):
                          id_counts[place['id']] += 1
              if rel.startswith('places/historie/'):
                  if not isinstance(payload, list):
                      raise SystemExit(f'Active history file is not an array: {rel}')
                  active_history_files.append(rel)
                  active_history_places += len(payload)
                  bad = [p.get('id') for p in payload if not isinstance(p, dict) or p.get('category') != 'historie']
                  if bad:
                      raise SystemExit(f'Non-history entries in active history file {rel}: {bad}')

          duplicate_ids = sorted(k for k, v in id_counts.items() if v > 1)
          if duplicate_ids:
              raise SystemExit(f'Duplicate manifest-loaded place IDs remain: {duplicate_ids[:50]}')

          validated_split_manifests = 0
          for sm_path in sorted((places_root / 'historie').rglob('*_manifest.json')):
              sm = json.loads(sm_path.read_text(encoding='utf-8'))
              source_path_value = sm.get('source_path')
              entries = sm.get('places')
              if not isinstance(source_path_value, str) or not isinstance(entries, list):
                  continue
              validated_split_manifests += 1
              source_path = root / source_path_value
              if not source_path.exists():
                  raise SystemExit(f'Split manifest still has missing source: {sm_path} -> {source_path_value}')
              source_text = source_path.read_text(encoding='utf-8')
              source = json.loads(source_text)
              if not isinstance(source, list):
                  raise SystemExit(f'Split manifest source is not array: {source_path_value}')
              source_ids = [p.get('id') for p in source if isinstance(p, dict)]
              if sm.get('place_count') != len(source):
                  raise SystemExit(f'place_count mismatch: {sm_path}')
              if [e.get('id') for e in entries] != source_ids:
                  raise SystemExit(f'ID/order mismatch: {sm_path}')
              if sm.get('source_sha256') != hashlib.sha256(source_text.encode('utf-8')).hexdigest():
                  raise SystemExit(f'Source SHA mismatch: {sm_path}')
              if any(p.get('category') != 'historie' for p in source if isinstance(p, dict)):
                  raise SystemExit(f'Non-history source entry in split manifest: {sm_path}')
              if any(e.get('category') != 'historie' for e in entries if isinstance(e, dict)):
                  raise SystemExit(f'Non-history split-manifest entry: {sm_path}')
              for order, (entry, source_place) in enumerate(zip(entries, source)):
                  if entry.get('order') != order:
                      raise SystemExit(f'Order mismatch in {sm_path}: {entry.get("id")}')
                  split_path = sm_path.parent / entry['file']
                  if not split_path.exists():
                      raise SystemExit(f'Missing split file: {split_path}')
                  split_text = split_path.read_text(encoding='utf-8')
                  if json.loads(split_text) != source_place:
                      raise SystemExit(f'Split content mismatch: {split_path}')
                  if entry.get('sha256') != hashlib.sha256(split_text.encode('utf-8')).hexdigest():
                      raise SystemExit(f'Split SHA mismatch: {split_path}')

          report = {
              'status': 'ok',
              'active_history_files': len(active_history_files),
              'active_history_places': active_history_places,
              'manifest_total_files': len(files),
              'manifest_unique_place_ids': len(id_counts),
              'duplicate_manifest_paths': [],
              'duplicate_place_ids': [],
              'active_history_category_errors': [],
              'validated_split_manifests': validated_split_manifests,
              'split_manifest_errors': [],
              'other_errors': [],
              'cleanup': {
                  'removed_stale_manifest': 'data/places/historie/innlandet/places_historie_innlandet_batch16_manifest.json',
                  'removed_stale_split_directory': 'data/places/historie/innlandet/places_historie_innlandet_batch16/',
                  'verified_moved_ids': expected_ids,
              },
          }
          report_path = Path('reports/category-audit/history-category-audit-final.json')
          report_path.parent.mkdir(parents=True, exist_ok=True)
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/places/historie/innlandet reports/category-audit/history-category-audit-final.json
          git rm .github/workflows/cleanup-innlandet-batch16-stale-split.yml
          git rm .github/innlandet-batch16-stale-split-trigger.txt
          git commit -m "Remove stale Innlandet batch 16 split artifacts"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            sleep 2
          done
          exit 1
