name: Materialize Philosophy editorial polish once

on:
  push:
    branches:
      - agent/complete-philosophy-fagverk-materialize
    paths:
      - scripts/polish-filosofi-complete.mjs
      - tests/fagverk-filosofi-complete.test.mjs
      - tests/fagverk-filosofi-editorial-style.test.mjs
      - .github/workflows/materialize-filosofi-polish-once.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-philosophy-fagverk-materialize
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Strengthen concept prose and canonical identifier rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/polish-filosofi-complete.mjs')
          s=p.read_text()

          old="  const definition = CONCEPT_OVERRIDE[c.id] || cleanNorwegian(c.definition);"
          new="""  const canonicalDefinition = cleanNorwegian(c.definition);\n  const genericDefinition = /betegner i .* en avgrenset måte å beskrive eller vurdere/i.test(canonicalDefinition);\n  const contextualDefinition = `${c.label.toLowerCase()} brukes i denne artikkelen som et arbeidsbegrep for å analysere ${lowerFirst(String(article.canonical_definition || article.title).replace(/\\.$/, ''))}; den presise rekkevidden må fastsettes gjennom begrepets relasjoner, eksempler, innvendinger og den teorien som brukes`;\n  const definition = CONCEPT_OVERRIDE[c.id] || (genericDefinition ? contextualDefinition : canonicalDefinition);"""
          if old not in s:
              raise SystemExit('Expected concept definition line not found')
          s=s.replace(old,new)

          old="  return `${c.label}: ${definition}. ${contrast} En typisk feil er ${confusion}. ${application}`;"
          new="  return `${c.label}: ${definition}. ${contrast} En typisk feil er ${confusion}. ${application} Hva som teller som et godt eksempel må begrunnes mot artikkelens problemstilling og de relevante moteksemplene, ikke bare mot ordlyden i definisjonen.`;"
          if old not in s:
              raise SystemExit('Expected concept paragraph return not found')
          s=s.replace(old,new)

          old="""  const conceptById=new Map(conceptDoc.concepts.map((c)=>[c.id,c]));\n  const thinkerById=new Map(thinkerDoc.thinkers.map((t)=>[t.id,t]));"""
          new="""  const conceptById=new Map(conceptDoc.concepts.map((c)=>[c.id,c]));\n  const thinkerById=new Map(thinkerDoc.thinkers.map((t)=>[t.id,t]));\n  const methodDoc=await readJson('data/fag/filosofi/methods_filosofi_canonical_v1.json');\n  const emneDoc=await readJson('data/fag/filosofi/emner_filosofi_canonical_v1.json');\n  const fagkartDoc=await readJson('data/fag/filosofi/fagkart_filosofi_canonical_v1.json');\n  const humanLabels=new Map([\n    ...conceptDoc.concepts.map((c)=>[c.id,c.label]),\n    ...thinkerDoc.thinkers.map((t)=>[t.id,t.name]),\n    ...methodDoc.methods.map((m)=>[m.method_id,m.title]),\n    ...emneDoc.map((e)=>[e.emne_id,e.title]),\n    ...(fagkartDoc.categories||[]).map((c)=>[c.id,c.title])\n  ]);\n  for(const e of emneDoc) for(const place of (e.place_relevance||[])) if(place.includes('_')) humanLabels.set(place,place.replaceAll('_',' '));\n  for(const c of (fagkartDoc.categories||[])) for(const h of (c.topic_hooks||[])) if(h.id) humanLabels.set(h.id,h.title||h.label||h.id.replaceAll('_',' '));\n  const renderKnownIdentifiers=(text)=>String(text||'').replace(/\\b[a-zæøå]+(?:_[a-zæøå]+)+\\b/g,(token)=>humanLabels.get(token)||token);"""
          if old not in s:
              raise SystemExit('Expected Philosophy label maps not found')
          s=s.replace(old,new)

          old="    for(const section of article.sections) section.paragraphs=section.paragraphs.map(cleanNorwegian);"
          new="    for(const section of article.sections) section.paragraphs=section.paragraphs.map((p)=>renderKnownIdentifiers(cleanNorwegian(p)));"
          if old not in s:
              raise SystemExit('Expected Philosophy paragraph clean pass not found')
          s=s.replace(old,new)

          old="    if(prose.some((p)=>/\\b[a-zæøå]+_[a-zæøå_]+\\b/.test(p))) throw new Error(`Raw identifier leaked into prose in ${article.id}`);"
          new="""    const rawIdHit = prose.map((p,idx)=>({idx,p,match:p.match(/\\b[a-zæøå]+_[a-zæøå_]+\\b/)})).find((x)=>x.match);\n    if(rawIdHit) throw new Error(`Unresolved raw identifier in ${article.id} paragraph ${rawIdHit.idx}: ${rawIdHit.match[0]} :: ${rawIdHit.p}`);"""
          if old not in s:
              raise SystemExit('Expected raw identifier guard not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Materialize canonical Philosophy corpus
        run: |
          node --check scripts/materialize-filosofi-complete.mjs
          node scripts/materialize-filosofi-complete.mjs
      - name: Polish Philosophy corpus with diagnostic capture
        id: polish
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --check scripts/polish-filosofi-complete.mjs
          node scripts/polish-filosofi-complete.mjs 2>&1 | tee filosofi-polish-debug.log
      - name: Upload polish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filosofi-polish-debug
          path: filosofi-polish-debug.log
          if-no-files-found: warn
      - name: Stop after failed polish
        if: steps.polish.outcome != 'success'
        run: exit 1
      - name: Rebuild release and audits
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-fagverk-filosofi-phase3.mjs --write-report
          node tools/validate-filosofi-theory-quality.mjs
      - name: Validate completion and editorial quality
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            node --test tests/fagverk-filosofi-complete.test.mjs
            node --test tests/fagverk-filosofi-editorial-style.test.mjs
            node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('reports/fagverk/filosofi-complete-audit.json','utf8'));
          if(a.status!=='filosofi_complete') throw new Error('Philosophy completion audit not complete');
          if(Object.values(a.gates).some(v=>v!==true)) throw new Error('Philosophy completion gate failed');
          if(a.summary.minimum_words_per_article<1200) throw new Error('Philosophy article depth below polish threshold');
          const r=JSON.parse(fs.readFileSync('data/fagverk/filosofi/filosofi_article_registry_v1.json','utf8'));
          if(r.counts.standalone_articles!==54 || r.counts.integrated_concepts!==162 || r.counts.chapters!==13) throw new Error('Philosophy coverage incomplete');
          NODE
          } 2>&1 | tee filosofi-validation-debug.log
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filosofi-validation-debug
          path: |
            filosofi-validation-debug.log
            reports/fagverk/filosofi-complete-audit.json
            data/fagverk/filosofi/filosofi_completion_v1.json
            data/fagverk/filosofi/filosofi_article_registry_v1.json
          if-no-files-found: warn
      - name: Stop after failed validation
        if: steps.validate.outcome != 'success'
        run: exit 1
      - name: Commit deterministic polished outputs and remove one-shot workflow
        run: |
          rm .github/workflows/materialize-filosofi-polish-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fagverk/filosofi data/fagverk/fagverk_registry.json data/fagverk/fagverk_release.json data/fagverk/subject_status.json reports/fagverk/filosofi-complete-audit.json reports/fagverk/filosofi-phase3-audit.json scripts/materialize-filosofi-complete.mjs scripts/polish-filosofi-complete.mjs scripts/audit-fagverk-filosofi-phase3.mjs tests/fagverk-filosofi-complete.test.mjs tests/fagverk-filosofi-editorial-style.test.mjs .github/workflows/materialize-filosofi-polish-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Polish complete Philosophy Fagverk'
          git push origin HEAD:agent/complete-philosophy-fagverk-materialize
