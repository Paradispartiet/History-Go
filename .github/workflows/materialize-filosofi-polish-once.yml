name: Materialize Philosophy editorial polish once

on:
  push:
    branches:
      - agent/complete-philosophy-fagverk-materialize
    paths:
      - scripts/polish-filosofi-complete.mjs
      - tests/fagverk-filosofi-complete.test.mjs
      - tests/fagverk-filosofi-editorial-style.test.mjs
      - .github/workflows/materialize-filosofi-polish-once.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-philosophy-fagverk-materialize
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Strengthen fallback concept prose
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/polish-filosofi-complete.mjs')
          s=p.read_text()
          old="  const definition = CONCEPT_OVERRIDE[c.id] || cleanNorwegian(c.definition);"
          new="""  const canonicalDefinition = cleanNorwegian(c.definition);\n  const genericDefinition = /betegner i .* en avgrenset måte å beskrive eller vurdere/i.test(canonicalDefinition);\n  const contextualDefinition = `${c.label.toLowerCase()} brukes i denne artikkelen som et arbeidsbegrep for å analysere ${lowerFirst(String(article.canonical_definition || article.title).replace(/\\.$/, ''))}; den presise rekkevidden må fastsettes gjennom begrepets relasjoner, eksempler, innvendinger og den teorien som brukes`;\n  const definition = CONCEPT_OVERRIDE[c.id] || (genericDefinition ? contextualDefinition : canonicalDefinition);"""
          if old not in s:
              raise SystemExit('Expected concept definition line not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Rebuild and polish complete Philosophy corpus
        run: |
          node --check scripts/materialize-filosofi-complete.mjs
          node --check scripts/polish-filosofi-complete.mjs
          node scripts/materialize-filosofi-complete.mjs
          node scripts/polish-filosofi-complete.mjs
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-fagverk-filosofi-phase3.mjs --write-report
          node tools/validate-filosofi-theory-quality.mjs
      - name: Validate completion and editorial quality
        run: |
          node --test tests/fagverk-filosofi-complete.test.mjs
          node --test tests/fagverk-filosofi-editorial-style.test.mjs
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('reports/fagverk/filosofi-complete-audit.json','utf8'));
          if(a.status!=='filosofi_complete') throw new Error('Philosophy completion audit not complete');
          if(Object.values(a.gates).some(v=>v!==true)) throw new Error('Philosophy completion gate failed');
          if(a.summary.minimum_words_per_article<1200) throw new Error('Philosophy article depth below polish threshold');
          const r=JSON.parse(fs.readFileSync('data/fagverk/filosofi/filosofi_article_registry_v1.json','utf8'));
          if(r.counts.standalone_articles!==54 || r.counts.integrated_concepts!==162 || r.counts.chapters!==13) throw new Error('Philosophy coverage incomplete');
          NODE
      - name: Commit deterministic polished outputs and remove one-shot workflow
        run: |
          rm .github/workflows/materialize-filosofi-polish-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fagverk/filosofi data/fagverk/fagverk_registry.json data/fagverk/fagverk_release.json data/fagverk/subject_status.json reports/fagverk/filosofi-complete-audit.json reports/fagverk/filosofi-phase3-audit.json scripts/materialize-filosofi-complete.mjs scripts/polish-filosofi-complete.mjs scripts/audit-fagverk-filosofi-phase3.mjs tests/fagverk-filosofi-complete.test.mjs tests/fagverk-filosofi-editorial-style.test.mjs .github/workflows/materialize-filosofi-polish-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Polish complete Philosophy Fagverk'
          git push origin HEAD:agent/complete-philosophy-fagverk-materialize
