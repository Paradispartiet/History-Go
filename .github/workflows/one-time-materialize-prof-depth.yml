name: One-time materialize professional depth

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/one-time-materialize-prof-depth.yml'
      - '.tmp/prof-depth/**'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/okonomi-naeringsliv-profesjonsfordypning
          fetch-depth: 0

      - name: Materialize and validate individual professional depth
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/prof-depth/pkg-* | base64 --decode > /tmp/prof-depth.tar.gz
          tar -xzf /tmp/prof-depth.tar.gz -C .

          node tools/validate-okonomi-naeringsliv-universitetsramme.mjs
          node tools/validate-okonomi-naeringsliv-universitetskvalitet.mjs
          node tools/validate-okonomi-naeringsliv-emnerevisjon.mjs
          node tools/validate-okonomi-naeringsliv-handelshogskole.mjs
          node tools/validate-okonomi-naeringsliv-profesjonsfordypning.mjs
          node scripts/audit-category-governance.mjs

      - name: Commit clean production result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          rm -rf .tmp/prof-depth
          rm -f .github/workflows/one-time-materialize-prof-depth.yml

          git add \
            data/fag/naeringsliv/handelshogskolefordypning_manifest_v1.json \
            data/fag/naeringsliv/handelshogskolefordypning_regnskap_v1.json \
            data/fag/naeringsliv/handelshogskolefordypning_markedsstrategi_v1.json \
            data/fag/naeringsliv/handelshogskolefordypning_analyse_v1.json \
            data/fag/naeringsliv/handelshogskolefordypning_jus_v1.json \
            data/fag/naeringsliv/handelshogskolefordypning_internasjonal_operations_v1.json \
            data/fag/naeringsliv/handelshogskoleramme_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/universitetskvalitet_okonomi_og_naeringsliv_v2.json \
            tools/validate-okonomi-naeringsliv-profesjonsfordypning.mjs \
            scripts/audit-category-governance.mjs \
            .tmp/prof-depth \
            .github/workflows/one-time-materialize-prof-depth.yml

          git diff --cached --quiet && exit 0
          git commit -m 'Fordyp alle 25 profesjonsmoduler individuelt'
          git push origin HEAD:agent/okonomi-naeringsliv-profesjonsfordypning
