name: Hent auditkilden for sluttkapittelet

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/naeringsliv-subject-quality.yml'

permissions:
  contents: write

concurrency:
  group: inspect-naeringsliv-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Rekonstruer og kopier auditkilden
        run: |
          cat .bootstrap/naeringsliv-makt-regulering-baerekraft/part-* | base64 --decode > /tmp/naeringsliv-ch6.tar.gz
          mkdir -p /tmp/naeringsliv-ch6
          tar -xzf /tmp/naeringsliv-ch6.tar.gz -C /tmp/naeringsliv-ch6
          mkdir -p .diagnostics
          cp /tmp/naeringsliv-ch6/scripts/audit-naeringsliv-chapter-makt-regulering-baerekraft.mjs .diagnostics/audit-naeringsliv-chapter-makt-regulering-baerekraft.mjs
          cp /tmp/naeringsliv-ch6/scripts/materialize-naeringsliv-chapter-makt-regulering-baerekraft-v1.mjs .diagnostics/materialize-naeringsliv-chapter-makt-regulering-baerekraft-v1.mjs
          node --check .diagnostics/audit-naeringsliv-chapter-makt-regulering-baerekraft.mjs
          node --check .diagnostics/materialize-naeringsliv-chapter-makt-regulering-baerekraft-v1.mjs
      - name: Commit auditkilden
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/audit-naeringsliv-chapter-makt-regulering-baerekraft.mjs .diagnostics/materialize-naeringsliv-chapter-makt-regulering-baerekraft-v1.mjs
          git diff --cached --check
          git commit -m 'Dokumenter auditkilden for sluttkapittelet'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
