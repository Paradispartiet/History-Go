name: Økonomi og næringsliv subject quality

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.bootstrap/naeringsliv-logistikk/**'
      - '.github/workflows/naeringsliv-subject-quality.yml'

permissions:
  contents: write

concurrency:
  group: naeringsliv-logistikk-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Reconstruct materializer
        run: |
          mkdir -p scripts
          cat .bootstrap/naeringsliv-logistikk/part-* \
            | base64 -d \
            | gzip -d \
            > scripts/materialize-naeringsliv-chapter-logistikk-infrastruktur-okonomisk-rom-v1.mjs
          node --check scripts/materialize-naeringsliv-chapter-logistikk-infrastruktur-okonomisk-rom-v1.mjs

      - name: Materialize and validate
        run: |
          node scripts/materialize-naeringsliv-chapter-logistikk-infrastruktur-okonomisk-rom-v1.mjs
          python3 -c 'from pathlib import Path; p=Path("scripts/audit-naeringsliv-chapter-teknologi-innovasjon-plattformer.mjs"); s=p.read_text(); old="""  assert(subjectStatus?.editorialStatus === "chapters_in_progress", "Næringsliv editorial status mismatch");
          assert(subjectStatus.note.includes("4 av 6"), "Næringsliv status must state 4 of 6 chapters");"""; new="""  const registeredChapterCount = subject.chapters.length;
          const canonicalDomainCount = pensum.domains.length;
          const expectedEditorialStatus = registeredChapterCount === canonicalDomainCount ? "complete" : "chapters_in_progress";
          assert(subjectStatus?.editorialStatus === expectedEditorialStatus, `Næringsliv editorial status must be ${expectedEditorialStatus}`);
          assert(String(subjectStatus?.note || "").includes(`${registeredChapterCount} av ${canonicalDomainCount}`), "Næringsliv status chapter count mismatch");"""; assert old in s, "Expected hard-coded chapter-4 status contract"; p.write_text(s.replace(old,new))'
          node --check scripts/audit-naeringsliv-chapter-teknologi-innovasjon-plattformer.mjs
          node --test tests/naeringsliv-*.test.mjs
          node --test tests/fagverk-general-engine.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-documentation-contract.test.mjs
          npm run typecheck:web

      - name: Remove bootstrap and restore permanent workflow
        run: |
          rm -rf .bootstrap/naeringsliv-logistikk
          rm -f scripts/materialize-naeringsliv-chapter-logistikk-infrastruktur-okonomisk-rom-v1.mjs
          git show origin/main:.github/workflows/naeringsliv-subject-quality.yml > .github/workflows/naeringsliv-subject-quality.yml

      - name: Commit materialized production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No materialization changes to commit."
            exit 0
          fi
          git commit -m "Materialiser Næringsliv logistikk, infrastruktur og økonomisk rom"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
