name: Materialiser sluttkapittelet for Økonomi og næringsliv

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/naeringsliv-subject-quality.yml'

permissions:
  contents: write

concurrency:
  group: materialize-naeringsliv-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Rekonstruer og rett produksjonspakken
        run: |
          cat .bootstrap/naeringsliv-makt-regulering-baerekraft/part-* | base64 --decode > /tmp/naeringsliv-ch6.tar.gz
          tar -xzf /tmp/naeringsliv-ch6.tar.gz
          rm -rf .bootstrap .diagnostics
          echo '' | base64 --decode | python
          node --check scripts/materialize-naeringsliv-chapter-makt-regulering-baerekraft-v1.mjs
          node --check scripts/audit-naeringsliv-chapter-makt-regulering-baerekraft.mjs
      - run: npm ci
      - name: Materialiser 6 av 6
        run: node --trace-uncaught scripts/materialize-naeringsliv-chapter-makt-regulering-baerekraft-v1.mjs
      - name: Valider komplett Næringsliv-fagverk
        run: |
          test ! -e .bootstrap
          test ! -e .diagnostics
          test ! -e scripts/materialize-naeringsliv-chapter-makt-regulering-baerekraft-v1.mjs
          ! grep -q 'Materialiser sluttkapittelet' .github/workflows/naeringsliv-subject-quality.yml
          ! grep -q 'permissions:' .github/workflows/naeringsliv-subject-quality.yml
          node --check scripts/audit-naeringsliv-subject-quality.mjs
          for audit in scripts/audit-naeringsliv-chapter-*.mjs; do node --check "$audit"; node "$audit"; done
          node tools/validate-okonomi-naeringsliv-universitetsramme.mjs
          node tools/validate-okonomi-naeringsliv-emnerevisjon.mjs
          node tools/validate-okonomi-naeringsliv-handelshogskole.mjs
          node scripts/audit-naeringsliv-subject-quality.mjs
          node --test tests/naeringsliv-*.test.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node --test tests/fagverk-general-engine.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-documentation-contract.test.mjs
          npm run typecheck:web
      - name: Commit produksjonsdiff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Materialiser sluttkapittelet Makt, regulering og bærekraft'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
