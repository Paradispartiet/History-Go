name: Økonomi og næringsliv subject quality

on:
  push:
    branches:
      - 'agent/naeringsliv-chapter-logistikk-infrastruktur-rom-v1'
    paths:
      - '.github/workflows/naeringsliv-subject-quality.yml'

permissions:
  contents: write

concurrency:
  group: naeringsliv-logistikk-main-sync
  cancel-in-progress: true

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: agent/naeringsliv-chapter-logistikk-infrastruktur-rom-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Merge current main without losing subject work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff -X ours origin/main
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Regenerate shared reports and validate
        run: |
          node scripts/audit-naeringsliv-chapter-logistikk-infrastruktur-okonomisk-rom.mjs --write-report
          node scripts/audit-naeringsliv-chapter-teknologi-innovasjon-plattformer.mjs --write-report
          node scripts/audit-naeringsliv-subject-quality.mjs --write-report
          node scripts/audit-fagverk-general-engine.mjs --write-report
          for audit in scripts/audit-naeringsliv-chapter-*.mjs; do
            node --check "$audit"
            node "$audit"
          done
          node scripts/audit-naeringsliv-subject-quality.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node --test tests/naeringsliv-*.test.mjs
          node --test tests/fagverk-general-engine.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-documentation-contract.test.mjs
          npm run typecheck:web

      - name: Restore permanent workflow and commit sync
        run: |
          git show origin/main:.github/workflows/naeringsliv-subject-quality.yml > .github/workflows/naeringsliv-subject-quality.yml
          git add -A
          git diff --cached --check
          git commit -m "Synkroniser Næringsliv logistikk-kapittelet med main"
          git push origin HEAD:agent/naeringsliv-chapter-logistikk-infrastruktur-rom-v1
