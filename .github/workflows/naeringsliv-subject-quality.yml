name: Materialiser sluttkapittelet for Økonomi og næringsliv

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'data/fagverk/naeringsliv/makt-regulering-baerekraft.json'
      - 'data/fagverk/naeringsliv/makt-regulering-baerekraft/**'
      - 'scripts/audit-naeringsliv-chapter-makt-regulering-baerekraft.mjs'
      - 'scripts/materialize-naeringsliv-chapter-makt-regulering-baerekraft-v1.mjs'
      - 'tests/naeringsliv-chapter-makt-regulering-baerekraft.test.mjs'
      - '.github/workflows/naeringsliv-subject-quality.yml'

permissions:
  contents: write

concurrency:
  group: materialize-naeringsliv-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Rekonstruer produksjonspakken
        run: |
          cat .bootstrap/naeringsliv-makt-regulering-baerekraft/part-* | base64 --decode > /tmp/naeringsliv-ch6.tar.gz
          tar -xzf /tmp/naeringsliv-ch6.tar.gz
          rm -rf .bootstrap
          test -f scripts/materialize-naeringsliv-chapter-makt-regulering-baerekraft-v1.mjs
          python -c 'from pathlib import Path; p=Path("scripts/materialize-naeringsliv-chapter-makt-regulering-baerekraft-v1.mjs"); s=p.read_text(); s=s.replace("/^(\\d+)\\.(\\d+)\\.(\\d+)$/", "/^(.*?)(\\d+)\\.(\\d+)\\.(\\d+)$/").replace("`${match[1]}.${Number(match[2]) + 1}.0`", "`${match[1]}${match[2]}.${Number(match[3]) + 1}.0`").replace("status.generation.generated_at = DATE;", "status.generation = { ...(status.generation || {}), generated_at: DATE };"); p.write_text(s)'
          node --check scripts/materialize-naeringsliv-chapter-makt-regulering-baerekraft-v1.mjs
      - name: Diagnostiser Youngstorget-kilder
        run: |
          echo '--- git grep youngstorget ---'
          git grep -n -i 'youngstorget' -- data/places data/manifests data 2>/dev/null | head -200 || true
          echo '--- JSON-filer med canonical id youngstorget ---'
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const roots = ['data/places'];
          const hits = [];
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const name of fs.readdirSync(dir)) {
              const full = path.join(dir, name);
              const stat = fs.statSync(full);
              if (stat.isDirectory()) walk(full);
              else if (name.endsWith('.json')) {
                try {
                  const value = JSON.parse(fs.readFileSync(full, 'utf8'));
                  const stack = [{ value, pointer: '$' }];
                  while (stack.length) {
                    const current = stack.pop();
                    if (current.value && typeof current.value === 'object') {
                      if (!Array.isArray(current.value) && current.value.id === 'youngstorget') {
                        hits.push({ file: full, pointer: current.pointer, keys: Object.keys(current.value) });
                      }
                      if (Array.isArray(current.value)) current.value.forEach((child, index) => stack.push({ value: child, pointer: `${current.pointer}[${index}]` }));
                      else Object.entries(current.value).forEach(([key, child]) => stack.push({ value: child, pointer: `${current.pointer}.${key}` }));
                    }
                  }
                } catch {}
              }
            }
          }
          roots.forEach(walk);
          console.log(JSON.stringify(hits, null, 2));
          NODE
      - run: npm ci
      - name: Materialiser 6 av 6
        run: node --trace-uncaught scripts/materialize-naeringsliv-chapter-makt-regulering-baerekraft-v1.mjs
      - name: Valider komplett Næringsliv-fagverk
        run: |
          test ! -e scripts/materialize-naeringsliv-chapter-makt-regulering-baerekraft-v1.mjs
          ! grep -q 'Materialiser sluttkapittelet' .github/workflows/naeringsliv-subject-quality.yml
          ! grep -q 'permissions:' .github/workflows/naeringsliv-subject-quality.yml
          node --check scripts/audit-naeringsliv-subject-quality.mjs
          for audit in scripts/audit-naeringsliv-chapter-*.mjs; do
            node --check "$audit"
            node "$audit"
          done
          node --check tools/validate-okonomi-naeringsliv-universitetsramme.mjs
          node --check tools/validate-okonomi-naeringsliv-emnerevisjon.mjs
          node --check tools/validate-okonomi-naeringsliv-handelshogskole.mjs
          node tools/validate-okonomi-naeringsliv-universitetsramme.mjs
          node tools/validate-okonomi-naeringsliv-emnerevisjon.mjs
          node tools/validate-okonomi-naeringsliv-handelshogskole.mjs
          node scripts/audit-naeringsliv-subject-quality.mjs
          node --test tests/naeringsliv-*.test.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node --test tests/fagverk-general-engine.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-documentation-contract.test.mjs
          npm run typecheck:web
      - name: Commit produksjonsdiff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Ingen materialiseringsendringer å committe.'
          else
            git commit -m 'Materialiser sluttkapittelet Makt, regulering og bærekraft'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
