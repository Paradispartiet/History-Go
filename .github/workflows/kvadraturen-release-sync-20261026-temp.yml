name: Kvadraturen one-time official release reconciliation 20261026
on:
  push:
    branches:
      - research/oslo-sentrum-kvadraturen-v1-six-20261023
    paths:
      - '.github/workflows/kvadraturen-release-sync-20261026-temp.yml'
permissions:
  contents: write
concurrency:
  group: kvadraturen-release-sync-20261026
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-kvadraturen-v1-six-20261023
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild using the existing canonical Fagverk builder
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit only official release output
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | grep -v '^data/fagverk/fagverk_release.json$' > /tmp/unrelated || true
          test ! -s /tmp/unrelated || { cat /tmp/unrelated; exit 1; }
          git add data/fagverk/fagverk_release.json
          if git diff --cached --quiet; then echo 'Release already correct'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Synchronize deterministic Fagverk release with all Kvadraturen Place and quiz edits'
          git push origin HEAD:research/oslo-sentrum-kvadraturen-v1-six-20261023
