name: One-time run corrected Næringsliv pilot builder

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - '.github/workflows/one-time-run-corrected-naeringsliv-pilot-builder.yml'

permissions:
  contents: write

jobs:
  run-corrected:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/naeringsliv-pilot-profesjonsmaterialisering-control
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Execute corrected builder body
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/one-time-build-naeringsliv-pilot-final.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          marker = '      - name: Reconstruct, validate and publish clean final branch'
          marker_index = lines.index(marker)
          run_index = next(index for index in range(marker_index, len(lines)) if lines[index] == '        run: |')
          body_lines = lines[run_index + 1:]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body_lines) + '\n'
          old = '''for part in $(seq -w 0 8); do
  git -C "$GITHUB_WORKSPACE" show "origin/${OLD_BRANCH}:.tmp/naeringsliv-pilot/pkg-${part}"
done > /tmp/naeringsliv-pilot.b64
'''
          new = '''for part_index in $(seq 0 8); do
  part=$(printf '%02d' "$part_index")
  git -C "$GITHUB_WORKSPACE" show "origin/${OLD_BRANCH}:.tmp/naeringsliv-pilot/pkg-${part}"
done > /tmp/naeringsliv-pilot.b64
'''
          if old not in body:
              raise SystemExit('Fant ikke pakkeløkken i byggekroppen')
          body = body.replace(old, new, 1)
          Path('/tmp/run-corrected-naeringsliv-pilot-builder.sh').write_text(body, encoding='utf-8')
          PY
          bash /tmp/run-corrected-naeringsliv-pilot-builder.sh
