name: Fagverk Musikk

on:
  pull_request:
    paths:
      - 'fagverk.html'
      - 'data/categories/category_contract.json'
      - 'data/fag/musikk/**'
      - 'data/quiz/musikk/musikk_subject_pathways_v1.json'
      - 'data/badges/musikk.json'
      - 'data/fagverk/musikk/**'
      - 'js/fagverk-subject-core.js'
      - 'js/fagverk-subject-model.js'
      - 'js/fagverk.js'
      - 'scripts/audit-fagverk-subject-inventory.mjs'
      - 'scripts/audit-fagverk-general-engine.mjs'
      - 'scripts/audit-fagverk-musikk.mjs'
      - 'scripts/knowledge-canonical-data.mts'
      - 'tools/build-musikk-melody-subject-pathway-v1.mjs'
      - 'tools/build-musikk-harmony-subject-pathway-v1.mjs'
      - 'tools/build-musikk-form-subject-pathway-v1.mjs'
      - 'tools/build-musikk-timbre-subject-pathway-v1.mjs'
      - 'tools/build-musikk-analytical-listening-subject-pathway-v1.mjs'
      - 'tools/build-musikk-history-source-criticism-subject-pathway-v1.mjs'
      - 'tools/build-musikk-history-reception-recording-subject-pathway-v1.mjs'
      - 'tools/build-musikk-history-institutions-rikskonsertene-subject-pathway-v1.mjs'
      - 'tools/build-musikk-history-periodization-subject-pathway-v1.mjs'
      - 'tools/build-musikk-history-work-canon-subject-pathway-v1.mjs'
      - 'tools/build-musikk-history-transnational-colonial-subject-pathway-v1.mjs'
      - 'tools/build-musikk-subject-pathway-v1.mjs'
      - 'tools/build-musikk-subject-pathway-registration-v1.mjs'
      - 'tools/validate-musikk-emner-fagdybde-v2.mjs'
      - 'tools/validate-musikk-source-dossiers-v1.mjs'
      - 'tools/validate-musikk-fulltext-evidence-v1.mjs'
      - 'tools/validate-musikk-subject-pathway-v1.mjs'
      - 'tools/validate-musikk-subject-pathway-source-metadata-v1.mjs'
      - 'tools/audit-musikk-theory-integrity.mjs'
      - 'tests/musikk-theory-integrity.test.mjs'
      - 'tests/fagverk-subject-inventory.test.mjs'
      - 'tests/fagverk-general-engine.test.mjs'
      - 'tests/fagverk-musikk.test.mjs'
      - 'reports/fagverk/**'
      - 'reports/musikk-canonical-migration/**'
      - '.github/workflows/fagverk-musikk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate materialized Musikk subject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate syntax and deterministic reports
        run: |
          node --check js/fagverk-subject-model.js
          node --check scripts/audit-fagverk-general-engine.mjs
          node --check scripts/audit-fagverk-musikk.mjs
          node --check tools/audit-musikk-theory-integrity.mjs
          node --check tools/build-musikk-melody-subject-pathway-v1.mjs
          node --check tools/build-musikk-harmony-subject-pathway-v1.mjs
          node --check tools/build-musikk-form-subject-pathway-v1.mjs
          node --check tools/build-musikk-timbre-subject-pathway-v1.mjs
          node --check tools/build-musikk-analytical-listening-subject-pathway-v1.mjs
          node --check tools/build-musikk-history-source-criticism-subject-pathway-v1.mjs
          node --check tools/build-musikk-history-reception-recording-subject-pathway-v1.mjs
          node --check tools/build-musikk-history-institutions-rikskonsertene-subject-pathway-v1.mjs
          node --check tools/build-musikk-history-periodization-subject-pathway-v1.mjs
          node --check tools/build-musikk-history-work-canon-subject-pathway-v1.mjs
          node --check tools/build-musikk-history-transnational-colonial-subject-pathway-v1.mjs
          node --check tools/build-musikk-subject-pathway-v1.mjs
          node --check tools/build-musikk-subject-pathway-registration-v1.mjs
          node --check tools/validate-musikk-fulltext-evidence-v1.mjs
          node --check tools/validate-musikk-subject-pathway-v1.mjs
          node --check tools/validate-musikk-subject-pathway-source-metadata-v1.mjs
          node tools/build-musikk-subject-pathway-v1.mjs --check
          node tools/build-musikk-subject-pathway-registration-v1.mjs --check
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-musikk.mjs
          node tools/audit-musikk-theory-integrity.mjs
      - name: Validate Musikk canonical scientific package
        run: |
          node tools/validate-musikk-emner-fagdybde-v2.mjs
          node tools/validate-musikk-source-dossiers-v1.mjs
          node tools/validate-musikk-fulltext-evidence-v1.mjs
          node tools/validate-musikk-subject-pathway-v1.mjs
          node tools/validate-musikk-subject-pathway-source-metadata-v1.mjs
      - name: Validate Fagverk contracts
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-musikk.test.mjs
          node --test tests/musikk-theory-integrity.test.mjs
