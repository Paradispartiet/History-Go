name: Finalize Naeringsliv3 badge

on:
  push:
    branches:
      - fix/naeringsliv3-final
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/naeringsliv3-final
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Materialize badge asset and update category colors
        shell: bash
        run: |
          mkdir -p bilder/merker reports/tmp-naeringsliv3
          cat .tmp/naeringsliv3.part0 .tmp/naeringsliv3.part1 | base64 --decode > bilder/merker/naeringsliv3.webp
          printf '%s  %s\n' '58c8e55000e9ef8be10e99b60ec1d1c77a2176d4e89836c71ab34401fab98b80' 'bilder/merker/naeringsliv3.webp' | sha256sum --check | tee reports/tmp-naeringsliv3/asset-sha256.log

          python - <<'PY' | tee reports/tmp-naeringsliv3/update.log
          from pathlib import Path
          import json
          import re

          primary = '#0E3290'
          secondary = '#AFB0B0'
          image = 'bilder/merker/naeringsliv3.webp'

          badge_path = Path('data/badges/naeringsliv.json')
          badge = json.loads(badge_path.read_text(encoding='utf-8'))
          badge['color'] = primary
          badge['secondaryColor'] = secondary
          badge['image'] = image
          badge_path.write_text(json.dumps(badge, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          categories_path = Path('js/core/categories.ts')
          categories = categories_path.read_text(encoding='utf-8')
          pattern = r'\{ id: "naeringsliv", name: "Næringsliv", icon: "🏭", color: "#[0-9A-Fa-f]{6}", secondaryColor: "#[0-9A-Fa-f]{6}", scope: "runtime_domain" \}'
          replacement = f'{{ id: "naeringsliv", name: "Næringsliv", icon: "🏭", color: "{primary}", secondaryColor: "{secondary}", scope: "runtime_domain" }}'
          categories, count = re.subn(pattern, replacement, categories, count=1)
          if count != 1:
              raise RuntimeError('Fant ikke canonical Næringsliv-kategori')
          categories_path.write_text(categories, encoding='utf-8')

          print(json.dumps({'image': image, 'color': primary, 'secondaryColor': secondary}, ensure_ascii=False))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck browser TypeScript
        run: npm run typecheck:web

      - name: Rebuild browser runtime
        run: npm run build:web

      - name: Keep only intended generated outputs
        shell: bash
        run: |
          git diff --name-only -- dist/web | while IFS= read -r path; do
            [ "$path" = "dist/web/categories.js" ] || git restore --source=HEAD -- "$path"
          done
          for path in \
            js/core/layerManager.js \
            js/map.js \
            js/ui/search.js \
            js/ui/nearby-drawer.js \
            js/core/pos.js; do
            git restore --source=HEAD -- "$path" 2>/dev/null || true
          done

      - name: Validate badge and map color contract
        shell: bash
        run: |
          python - <<'PY' | tee reports/tmp-naeringsliv3/validate.log
          from pathlib import Path
          import json

          primary = '#0E3290'
          secondary = '#AFB0B0'
          image = 'bilder/merker/naeringsliv3.webp'

          badge = json.loads(Path('data/badges/naeringsliv.json').read_text(encoding='utf-8'))
          assert badge['image'] == image
          assert badge['color'] == primary
          assert badge['secondaryColor'] == secondary
          assert Path(image).is_file() and Path(image).stat().st_size > 10000

          for path in ('js/core/categories.ts', 'js/core/categories.js', 'dist/web/categories.js'):
              text = Path(path).read_text(encoding='utf-8')
              assert primary in text, path
              assert secondary in text, path

          print(json.dumps({'image': image, 'color': primary, 'secondaryColor': secondary}, ensure_ascii=False))
          PY
          git diff --check | tee reports/tmp-naeringsliv3/git-diff-check.log

      - name: Commit and push clean implementation
        shell: bash
        run: |
          rm -rf .tmp reports/tmp-naeringsliv3
          rm -f .github/workflows/temp-finalize-naeringsliv3.yml
          git config user.name 'Paradispartiet'
          git config user.email '225725199+Paradispartiet@users.noreply.github.com'
          git add \
            bilder/merker/naeringsliv3.webp \
            data/badges/naeringsliv.json \
            js/core/categories.ts \
            js/core/categories.js \
            dist/web/categories.js \
            .tmp \
            .github/workflows/temp-finalize-naeringsliv3.yml
          git commit -m 'Use Naeringsliv3 badge and matching map colors'
          git push origin HEAD:fix/naeringsliv3-final
