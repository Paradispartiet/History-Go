name: Beierbrua rounds diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/beierbrua-rounds-finalize.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Beierbrua validation step
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set +e
          git clone --quiet --depth=1 --branch "$BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" work
          cd work || exit 1

          echo '=== FINALIZER ==='
          node tools/finalize-beierbrua-rounds.mjs
          finalizer_status=$?
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/people/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.files = manifest.files.filter((file) => file !== 'people/litteratur/oslo/akerselva/oskar_braaten.json');
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          echo "FINALIZER_STATUS=$finalizer_status"

          echo '=== TARGETED TEST ==='
          node tests/beierbrua-rounds-batch1.test.js
          targeted_status=$?
          echo "TARGETED_STATUS=$targeted_status"

          echo '=== PLACECARD RUNTIME ==='
          node tests/place-card-rounds-runtime-audit.test.js
          rounds_status=$?
          echo "ROUNDS_STATUS=$rounds_status"

          echo '=== PEOPLE AUDIT ==='
          npm ci --silent >/tmp/npm-ci.log 2>&1
          npm_status=$?
          echo "NPM_CI_STATUS=$npm_status"
          if [ "$npm_status" -eq 0 ]; then
            npm run audit:people-of-places >/tmp/people-audit.log 2>&1
            people_status=$?
            tail -n 40 /tmp/people-audit.log
          else
            people_status=$npm_status
            tail -n 40 /tmp/npm-ci.log
          fi
          echo "PEOPLE_STATUS=$people_status"

          if [ "$finalizer_status" -ne 0 ] || [ "$targeted_status" -ne 0 ] || [ "$rounds_status" -ne 0 ] || [ "$people_status" -ne 0 ]; then
            exit 1
          fi
