name: Tigeren description gate capture once

on:
  push:
    branches:
      - work/tigeren-fagverk-v2-20260902
    paths:
      - .github/workflows/tigeren-description-scope-repair-once.yml

permissions:
  contents: write

jobs:
  capture-description-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Prepare repaired workspace
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const file = 'data/places/by/oslo/places/tigeren.json';
          const current = JSON.parse(fs.readFileSync(file, 'utf8'));
          const base = JSON.parse(cp.execFileSync('git', ['show', `origin/main:${file}`], {encoding:'utf8'}));
          current.desc = base.desc;
          current.popupDesc = base.popupDesc;
          fs.writeFileSync(file, JSON.stringify(current, null, 2) + '\n');
          NODE
          npm ci
          npm run place-open:build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tigeren-description-scope-repair-once.yml
          git add data/places/by/oslo/places/tigeren.json data/runtime/place-open/tigeren.json
          git diff --cached --check
          git commit -m "fix(scope): keep Tigeren descriptions in v4.2 lane"

      - name: Capture exact Description v4.2 result
        shell: bash
        run: |
          set +e
          node scripts/validate-place-description-production-v4_2.mjs --changed --base origin/main --head HEAD > /tmp/gate.txt 2>&1
          code=$?
          set -e
          {
            echo "validator_exit_code=$code"
            echo "workspace_head=$(git rev-parse HEAD)"
            echo "origin_main=$(git rev-parse origin/main)"
            echo
            echo "=== changed files origin/main...HEAD ==="
            git diff --name-status origin/main...HEAD
            echo
            echo "=== tigeren diff origin/main...HEAD ==="
            git diff origin/main...HEAD -- data/places/by/oslo/places/tigeren.json
            echo
            echo "=== validator output ==="
            cat /tmp/gate.txt
          } > reports/tigeren-description-gate-diagnostic.txt
          cat reports/tigeren-description-gate-diagnostic.txt

      - name: Push diagnostic capture even on validator failure
        shell: bash
        run: |
          set -euo pipefail
          git add reports/tigeren-description-gate-diagnostic.txt
          git commit -m "diag: capture Tigeren description gate"
          git push origin HEAD:work/tigeren-fagverk-v2-20260902
