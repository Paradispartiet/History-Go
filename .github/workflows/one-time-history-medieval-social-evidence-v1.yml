name: One-time History medieval social evidence V1

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/history-medieval-social-evidence-v1-trigger.txt'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/history-medieval-social-evidence-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Assemble and run materializer
        shell: bash
        run: |
          set -euo pipefail
          out=reports/historie-theory-evidence/medieval-social-v1-validation
          mkdir -p "$out"
          wc -c .github/history-medieval-social-evidence-v1-materializer.part* \
            | tee "$out/transport-part-sizes.log"
          cat .github/history-medieval-social-evidence-v1-materializer.part* > "$out/materializer-assembled.b64"
          sha256sum "$out/materializer-assembled.b64" \
            | tee "$out/transport-sha256.log"
          actual_sha="$(sha256sum "$out/materializer-assembled.b64" | cut -d' ' -f1)"
          expected_sha="507547d62cfeafd8f6f744d70785eacb9365edbc018f11daea91afbb8f8a9796"
          printf 'expected=%s\nactual=%s\n' "$expected_sha" "$actual_sha" \
            | tee "$out/transport-sha256-check.log"
          test "$actual_sha" = "$expected_sha"
          base64 -d "$out/materializer-assembled.b64" > "$out/materializer.gz" 2> "$out/base64-decode.log"
          gzip -t "$out/materializer.gz" 2> "$out/gzip-test.log"
          gzip -dc "$out/materializer.gz" > /tmp/materialize-history-medieval-social-v1.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/materialize-history-medieval-social-v1.mjs')
          text = path.read_text()
          old = """    const mapping = mappingByEmne.get(emneId);
              if (!mapping) throw new Error(`Missing reverse profile mapping for ${emneId}`);
              mapping.case_ids = sorted([...(mapping.case_ids || []), ...claim.scope.case_ids]);"""
          new = """    let mapping = mappingByEmne.get(emneId);
              if (!mapping) {
                mapping = {
                  emne_id: emneId,
                  case_ids: [],
                  case_requirement_ids: requirementIds,
                  mapping_status: 'validated_production_added',
                  evidence_status: 'claim_source_linked',
                  provenance: batchId
                };
                mappingByEmne.set(emneId, mapping);
              }
              mapping.case_ids = sorted([...(mapping.case_ids || []), ...claim.scope.case_ids]);"""
          if old not in text:
              raise SystemExit('Expected reverse-mapping block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check /tmp/materialize-history-medieval-social-v1.mjs 2>&1 \
            | tee "$out/materializer-syntax.log"
          node /tmp/materialize-history-medieval-social-v1.mjs 2>&1 \
            | tee "$out/materializer.log"

      - name: Validate and regenerate reports
        shell: bash
        run: |
          set -euo pipefail
          out=reports/historie-theory-evidence/medieval-social-v1-validation
          node --check tools/validate-historie-profile-evidence.mjs 2>&1 \
            | tee "$out/profile-validator-syntax.log"
          node tools/validate-historie-profile-evidence.mjs 2>&1 \
            | tee "$out/profile-validator.log"
          node tools/audit-historie-geographic-profile.mjs 2>&1 \
            | tee "$out/geographic-profile.log"
          node tools/audit-historie-geographic-profile.mjs --check 2>&1 \
            | tee "$out/geographic-profile-check.log"
          node --check tools/validate-historie-theory-evidence.mjs 2>&1 \
            | tee "$out/theory-validator-syntax.log"
          node tools/validate-historie-theory-evidence.mjs 2>&1 \
            | tee "$out/theory-validator.log"
          node tools/validate-historie-theory-evidence.mjs --check 2>&1 \
            | tee "$out/theory-validator-check.log"
          node tools/audit-historie-universal-coverage.mjs 2>&1 \
            | tee "$out/universal-coverage.log"
          node tools/audit-historie-universal-coverage.mjs --check 2>&1 \
            | tee "$out/universal-coverage-check.log"

      - name: Refresh and verify V5.8 freeze
        shell: bash
        run: |
          set -euo pipefail
          out=reports/historie-theory-evidence/medieval-social-v1-validation
          node tools/audit-historie-v5-5-quality-depth.mjs --write-freeze \
            --reason="Reviewed medieval social, economic and legal evidence V1 adds canonical source-specific claims, sources, place evidence and profile scope without mutating frozen universal concepts or theory objects." 2>&1 \
            | tee "$out/quality-freeze-refresh.log"
          node tools/audit-historie-v5-5-quality-depth.mjs 2>&1 \
            | tee "$out/quality-freeze-verify.log"
          git restore -- reports/historie-v5/historie-v5-8-quality-depth.json reports/historie-v5/historie-v5-8-quality-depth.md 2>/dev/null || true

      - name: Verify clean production diff
        shell: bash
        run: |
          set -euo pipefail
          out=reports/historie-theory-evidence/medieval-social-v1-validation
          git diff --check 2>&1 | tee "$out/git-diff-check.log"
          git status --short | tee "$out/git-status.log"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-medieval-social-evidence-v1-diagnostics
          path: |
            reports/historie-theory-evidence/medieval-social-v1-validation
            reports/historie-theory-evidence/history-theory-evidence-foundation-v1.json
            reports/historie-theory-evidence/history-theory-evidence-foundation-v1.md
            reports/historie-theory-evidence/history-theory-evidence-gap-inventory-v6.json
            reports/historie-theory-evidence/history-theory-evidence-gap-inventory-v6.md
            reports/historie-geographic-profiles/oslo-akershus-profile.json
            reports/historie-geographic-profiles/oslo-akershus-profile.md
            reports/historie-profile-evidence/history-profile-evidence-foundation.json
            reports/historie-profile-evidence/history-profile-evidence-foundation.md
            reports/historie-universal-coverage/historie-universal-coverage.json
            reports/historie-universal-coverage/historie-universal-coverage.md
          if-no-files-found: error

      - name: Commit validated production diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f reports/historie-theory-evidence/medieval-social-v1-validation
          git add -f reports/historie-theory-evidence/history-theory-evidence-gap-inventory-v6.json
          git add -f reports/historie-theory-evidence/history-theory-evidence-gap-inventory-v6.md
          git commit -m "Build History medieval social evidence V1"
          git push origin HEAD:agent/history-medieval-social-evidence-v1
