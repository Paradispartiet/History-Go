name: Temporary Fagverk release sync for Oslo quiz QC
on:
  push:
    branches:
      - content/oslo-four-fullquiz-qc-20261021
    paths:
      - .github/workflows/temporary-fagverk-oslo-quiz-release-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/oslo-four-fullquiz-qc-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild deterministic release
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit generated release only
        run: |
          git add data/fagverk/fagverk_release.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(fagverk): refresh deterministic release after Oslo quiz QC'
          git fetch origin content/oslo-four-fullquiz-qc-20261021
          git rebase origin/content/oslo-four-fullquiz-qc-20261021
          git push origin HEAD:refs/heads/content/oslo-four-fullquiz-qc-20261021
