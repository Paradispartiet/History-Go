name: Civication Lillebekk approval fix verification (one-shot)
on:
  push:
    branches:
      - civication/by-radgiver-approval-guard-20261103
    paths:
      - .github/workflows/civication-by-approval-verify-once.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test correct leader-waiting rhythm and complete real role path
        run: |
          node tests/civication-generalized-work-rhythm.test.js
          node tests/civication-by-radgiver-approval-branching.test.js
          node tests/civication-by-radgiver-role-world-realism-pilot.test.js
      - name: Recompile source scenes and dependent registries
        run: |
          node scripts/build-civication-scene-registry.mjs --write
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify compiled contracts and test multiple routes again
        run: |
          node tests/civication-generalized-work-rhythm.test.js
          node tests/civication-by-radgiver-approval-branching.test.js
          node tests/civication-by-radgiver-role-world-realism-pilot.test.js
      - name: Commit derived files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/compiledSceneRegistryV1.json data/Civication/careerGameplayMatrix.json data/Civication/roleWorldRolloutReadiness.json
          if ! git diff --cached --quiet; then
            git commit -m "Keep pending Lillebekk approval throughout knowledge review"
            git push origin HEAD:civication/by-radgiver-approval-guard-20261103
          fi
