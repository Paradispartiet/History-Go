name: Kuba-parken nature rounds diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kuba-parken-nature-rounds-finalize.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone, rebuild and run marked tests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set +e
          git clone --quiet --depth=1 --branch "$BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" work
          cd work || exit 1

          echo '=== REBUILD ==='
          node tools/finalize-kuba-parken-rounds.mjs
          rebuild_status=$?
          node scripts/split-nature-oslo-akerselva-route.mjs
          split_status=$?
          echo "REBUILD_STATUS=$rebuild_status SPLIT_STATUS=$split_status"

          echo '=== TARGETED KUBA TEST ==='
          node tests/kuba-parken-nature-rounds-batch1.test.js
          targeted_status=$?
          echo "TARGETED_STATUS=$targeted_status"

          echo '=== PLACECARD ROUND RUNTIME ==='
          node tests/place-card-rounds-runtime-audit.test.js
          rounds_status=$?
          echo "ROUNDS_STATUS=$rounds_status"

          echo '=== AKERSELVA MID REGRESSION ==='
          node tests/oslo-nature-rounds-batch9-akerselva-mid.test.js
          mid_status=$?
          echo "MID_STATUS=$mid_status"

          if [ "$rebuild_status" -ne 0 ] || [ "$split_status" -ne 0 ] || [ "$targeted_status" -ne 0 ] || [ "$rounds_status" -ne 0 ] || [ "$mid_status" -ne 0 ]; then
            exit 1
          fi
