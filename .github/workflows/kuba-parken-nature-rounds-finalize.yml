name: Kuba-parken nature rounds diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kuba-parken-nature-rounds-finalize.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false

      - name: Rebuild Kuba working state
        shell: bash
        run: |
          set -euo pipefail
          node tools/finalize-kuba-parken-rounds.mjs
          node scripts/split-nature-oslo-akerselva-route.mjs

      - name: Run tests with explicit markers
        shell: bash
        run: |
          set +e
          failed=0
          echo '=== TARGETED KUBA TEST ==='
          node tests/kuba-parken-nature-rounds-batch1.test.js
          status=$?
          echo "TARGETED_STATUS=$status"
          if [ "$status" -ne 0 ]; then failed=1; fi

          echo '=== PLACECARD ROUND RUNTIME ==='
          node tests/place-card-rounds-runtime-audit.test.js
          status=$?
          echo "ROUNDS_STATUS=$status"
          if [ "$status" -ne 0 ]; then failed=1; fi

          echo '=== AKERSELVA MID REGRESSION ==='
          node tests/oslo-nature-rounds-batch9-akerselva-mid.test.js
          status=$?
          echo "MID_STATUS=$status"
          if [ "$status" -ne 0 ]; then failed=1; fi

          exit "$failed"
