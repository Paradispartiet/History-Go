name: Temporary Psykoteori career matrix generated diff

on:
  push:
    branches:
      - codex/diagnose-career-matrix-node-20261009
    paths:
      - .github/workflows/tmp-psykoteori-career-matrix-diff.yml

permissions:
  contents: write

jobs:
  diagnose-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          ref: 5dc64c42d904e4cf1cfab5bb6189d5d9f378fbfe
          path: psychology
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect actual derived career-matrix delta
        run: |
          set -euo pipefail
          cd psychology
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-career-gameplay.mjs --check
          echo "CHANGED_GENERATED_PATHS:"
          git diff --name-only -- data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md
          echo "GENERATED_DELTA_HEAD:"
          git diff --unified=1 -- data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md | sed -n '1,200p'
      - name: Remove temporary workflow and commit cleanup
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-psykoteori-career-matrix-diff.yml
          git add -- .github/workflows/tmp-psykoteori-career-matrix-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary career-matrix generated-diff diagnostic"
          git push origin HEAD:codex/diagnose-career-matrix-node-20261009
