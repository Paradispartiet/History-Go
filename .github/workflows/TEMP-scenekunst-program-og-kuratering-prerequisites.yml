name: TEMP Scenekunst program og kuratering prerequisites

on:
  push:
    branches:
      - agent/civication-scenekunst-program-og-kuratering-prerequisites-materialize

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize authored prerequisite package
        shell: bash
        run: |
          set -euo pipefail
          node .github/TEMP-scenekunst-program-og-kuratering-prerequisites-materializer.mjs
          sed -i 's@assert.deepEqual(p.workplace_ids,\[PLACES\[i\]\])@assert.deepEqual(p.workplace_ids,[({leila_programsjef:PLACES[0],tor_arena_og_produksjonssjef:PLACES[3],mina_rettighets_og_avtalekoordinator:PLACES[2],yusuf_felt_og_publikumsanalytiker:PLACES[1]})[p.id]])@' tests/civication-scenekunst-program-og-kuratering-prerequisites.test.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const role = 'scenekunst_program_og_kuratering';
          const types = ['job','people','conflict','story','event','micro','followup','knowledge','consequence'];
          for (const type of types) {
            const file = `data/Civication/mailFamilies/scenekunst/${type}/${role}_${type}.json`;
            const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const family of doc.families || []) {
              for (const mail of family.mails || []) {
                const topic = String(mail.competency || mail.narrative_arc || mail.id).replaceAll('_', ' ');
                mail.choices[0].label = `Gjør ${topic} sporbar før neste beslutning`;
                mail.choices[1].label = `Lås ${topic} før avklaringen er ferdig`;
              }
            }
            fs.writeFileSync(file, JSON.stringify(doc, null, 2) + '\n');
          }
          NODE

      - name: Regenerate canonical derived state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-civication-role-packs.mjs
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
          node scripts/build-civication-scene-registry.mjs --write
          npm run build:civication:career-gameplay-matrix
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write

      - name: Focused prerequisite gate
        run: node tests/civication-scenekunst-program-og-kuratering-prerequisites.test.js

      - name: Generated-state parity gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-civication-role-packs.mjs
          node scripts/audit-civication-career-gameplay.mjs --check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node scripts/build-civication-scene-registry.mjs --check
          node scripts/audit-civication-role-world-rollout-readiness.mjs --check

      - name: Full Civication gate
        run: npm run test:civication

      - name: Repository diff gate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'docs/CIVICATION_ROLE_PACK_INDEX.md';
          fs.writeFileSync(file, fs.readFileSync(file, 'utf8').replace(/\n+$/, '\n'));
          NODE
          git diff --check
          git status --short

      - name: Publish permanent prerequisite state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/TEMP-scenekunst-program-og-kuratering-prerequisites.yml
          git rm -f .github/TEMP-scenekunst-program-og-kuratering-prerequisites-materializer.mjs
          git add data/Civication docs/CIVICATION_ROLE_PACK_INDEX.md reports tests/civication-scenekunst-program-og-kuratering-prerequisites.test.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No permanent changes to publish"
            exit 1
          fi
          git commit -m "Materialize Scenekunst program og kuratering prerequisites"
          git push origin HEAD:agent/civication-scenekunst-program-og-kuratering-prerequisites-materialize
