name: Myraløkka PlaceCard curation

on:
  pull_request:
    paths:
      - "data/places/natur/oslo/places_oslo_natur_akerselvarute/myralokka.json"
      - "data/runtime/place-open/myralokka.json"
      - "data/brands/brands_by_place.json"
      - "data/brands/brands_master.json"
      - "data/quiz/natur/myralokka_sets.json"
      - "data/quizcards/natur/topp10_natur_akerselva_v1_batch02.json"
      - "tests/myralokka-placecard-collections-v2.test.mjs"
      - "reports/place-production/myralokka-placecard-curation-v1.md"
      - ".github/workflows/myralokka-placecard-curation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  myralokka-collections:
    name: Verify Myraløkka Brands, Knowledge flags, QuizCard and photo parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run focused Myraløkka regression
        run: node --test tests/myralokka-placecard-collections-v2.test.mjs
