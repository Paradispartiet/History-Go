name: Render Oslo coordinate batch 30 visual QA

on:
  push:
    branches:
      - agent/oslo-coordinate-control-batch-30
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: oslo-coordinate-batch-30-visual-qa
  cancel-in-progress: true

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-30
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Render old/new OSM map panels
        run: |
          set -euo pipefail
          mkdir -p reports/oslo-coordinate-control-batch-30/visual-qa
          node <<'NODE'
          const fs = require('fs');
          const https = require('https');
          const sharp = require('sharp');

          const OUT = 'reports/oslo-coordinate-control-batch-30/visual-qa';
          const TILE = 256;
          const Z = 17;
          const PANEL = 768;

          const cases = [
            {title:'Oskar Braaten — gammel', lat:59.938, lon:10.76, note:'legacy Glads vei-punkt'},
            {title:'Oskar Braaten — ny', lat:59.9309838, lon:10.7578832, note:'OSM artwork node 10819902960'},
            {title:'Alexander Kiellands plass — gammel', lat:59.9245, lon:10.766, note:'legacy feilpunkt'},
            {title:'Alexander Kiellands plass — ny', lat:59.9270478, lon:10.7504014, note:'OSM park way 3610607'}
          ];

          function lon2x(lon,z){ return (lon+180)/360*Math.pow(2,z); }
          function lat2y(lat,z){ const r=lat*Math.PI/180; return (1-Math.asinh(Math.tan(r))/Math.PI)/2*Math.pow(2,z); }

          function fetchBuffer(url){
            return new Promise((resolve,reject)=>{
              const req=https.get(url,{headers:{'User-Agent':'History-Go-coordinate-QA/1.0 (Paradispartiet/History-Go)'}},res=>{
                if(res.statusCode>=300&&res.statusCode<400&&res.headers.location){
                  fetchBuffer(res.headers.location).then(resolve,reject); return;
                }
                if(res.statusCode!==200){ reject(new Error(`HTTP ${res.statusCode} ${url}`)); return; }
                const chunks=[]; res.on('data',d=>chunks.push(d)); res.on('end',()=>resolve(Buffer.concat(chunks)));
              });
              req.on('error',reject);
            });
          }

          async function panel(c){
            const xf=lon2x(c.lon,Z), yf=lat2y(c.lat,Z);
            const cx=Math.floor(xf), cy=Math.floor(yf);
            const tiles=[];
            for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
              const x=cx+dx,y=cy+dy;
              const buf=await fetchBuffer(`https://tile.openstreetmap.org/${Z}/${x}/${y}.png`);
              tiles.push({input:buf,left:(dx+1)*TILE,top:(dy+1)*TILE});
            }
            const px=(1+(xf-cx))*TILE;
            const py=(1+(yf-cy))*TILE;
            const overlay=Buffer.from(`<svg width="${PANEL}" height="${PANEL}" xmlns="http://www.w3.org/2000/svg">
              <rect x="0" y="0" width="${PANEL}" height="76" fill="rgba(255,255,255,0.92)"/>
              <text x="20" y="31" font-size="25" font-family="Arial" font-weight="700" fill="#111">${c.title}</text>
              <text x="20" y="59" font-size="17" font-family="Arial" fill="#222">${c.note} · ${c.lat.toFixed(7)}, ${c.lon.toFixed(7)}</text>
              <circle cx="${px}" cy="${py}" r="18" fill="rgba(255,255,255,0.9)" stroke="#111" stroke-width="6"/>
              <circle cx="${px}" cy="${py}" r="7" fill="#111"/>
            </svg>`);
            return sharp({create:{width:PANEL,height:PANEL,channels:3,background:'#ddd'}})
              .composite([...tiles,{input:overlay,left:0,top:0}]).png().toBuffer();
          }

          (async()=>{
            const buffers=[];
            for(const c of cases) buffers.push(await panel(c));
            const gap=16;
            const W=PANEL*2+gap, H=PANEL*2+gap;
            const composite=[
              {input:buffers[0],left:0,top:0},
              {input:buffers[1],left:PANEL+gap,top:0},
              {input:buffers[2],left:0,top:PANEL+gap},
              {input:buffers[3],left:PANEL+gap,top:PANEL+gap}
            ];
            await sharp({create:{width:W,height:H,channels:3,background:'#fff'}})
              .composite(composite)
              .png()
              .toFile(`${OUT}/batch30-map-qa.png`);
            fs.writeFileSync(`${OUT}/README.md`, `# Batch 30 visual map QA\n\nThe 2×2 image compares the old and new map positions for Oskar Braaten and Alexander Kiellands plass on OpenStreetMap tiles at zoom ${Z}. The center marker is the canonical coordinate in each panel.\n`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Commit QA image and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/oslo-coordinate-batch-30-visual-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/oslo-coordinate-control-batch-30/visual-qa .github/workflows/oslo-coordinate-batch-30-visual-qa.yml
          git commit -m "Add Oslo coordinate batch 30 visual map QA"
          git push origin HEAD
