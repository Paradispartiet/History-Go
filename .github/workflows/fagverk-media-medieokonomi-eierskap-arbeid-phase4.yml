name: Fagverk Media Medieøkonomi eierskap arbeid Phase 4

on:
  pull_request:
    paths:
      - 'data/fagverk/media/medieokonomi-eierskap-og-arbeid.json'
      - 'data/fagverk/media/medieokonomi-eierskap-og-arbeid/**'
      - 'reports/fagverk/media-*-audit.json'
      - 'scripts/audit-fagverk-media-*.mjs'
      - 'scripts/materialize-media-medieokonomi-eierskap-arbeid-phase4.mjs'
      - 'tests/fagverk-media-*.test.mjs'
      - '.github/workflows/fagverk-media-medieokonomi-eierskap-arbeid-phase4.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check scripts/materialize-media-medieokonomi-eierskap-arbeid-phase4.mjs
          node --check scripts/audit-fagverk-media-medieokonomi-eierskap-arbeid-phase4.mjs
          node --check scripts/audit-fagverk-media-complete.mjs
      - name: All Media chapter and full-subject audits
        run: |
          node scripts/audit-fagverk-media-phase3.mjs
          node scripts/audit-fagverk-media-presse-redaksjoner-avishus-phase4.mjs
          node scripts/audit-fagverk-media-offentlighet-ytringsfrihet-etikk-phase4.mjs
          node scripts/audit-fagverk-media-kilder-kritikk-sannhet-phase4.mjs
          node scripts/audit-fagverk-media-plattformer-algoritmer-distribusjon-phase4.mjs
          node scripts/audit-fagverk-media-propaganda-pavirkning-informasjonskrig-phase4.mjs
          node scripts/audit-fagverk-media-medieokonomi-eierskap-arbeid-phase4.mjs
          node scripts/audit-fagverk-media-complete.mjs
      - name: General engine, inventory and release
        run: |
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Tests
        run: node --test tests/fagverk-media-*.test.mjs tests/fagverk-general-engine.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-release-manifest.test.mjs
