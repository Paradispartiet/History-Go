name: TEMP publish Film TV unit 14 fulltext

on:
  push:
    branches:
      - "agent/film-tv-unit14-archive-preservation-access-authenticity-fulltext"
    paths:
      - ".trigger/unit14-fulltext-publish"

permissions:
  contents: write

concurrency:
  group: temp-film-tv-unit14-fulltext-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Confirm locked trigger head
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = "agent/film-tv-unit14-archive-preservation-access-authenticity-fulltext"

      - name: Validate new source syntax
        run: |
          node --check scripts/brief-film-tv-archive-preservation-access-authenticity-sources-v1.mjs
          node --check scripts/materialize-film-tv-archive-preservation-access-authenticity-fulltext-v1.mjs
          node --check scripts/audit-film-tv-archive-preservation-access-authenticity-fulltext-v1.mjs
          node --check tests/film-tv-archive-preservation-access-authenticity-fulltext-v1.test.mjs

      - name: Materialize unit 14 fulltext
        run: |
          node scripts/brief-film-tv-archive-preservation-access-authenticity-sources-v1.mjs --write
          node --input-type=module -e "import('./scripts/materialize-film-tv-archive-preservation-access-authenticity-fulltext-v1.mjs').then(m => m.materializeFilmTvArchivePreservationAccessAuthenticityFulltextV1())"
          node scripts/audit-film-tv-archive-preservation-access-authenticity-fulltext-v1.mjs --write-report

      - name: Refresh prior deterministic state
        run: |
          node scripts/brief-film-tv-location-production-place-ethics-sources-v1.mjs --write
          node scripts/materialize-film-tv-location-production-place-ethics-fulltext-v1.mjs
          node scripts/audit-film-tv-location-production-place-ethics-fulltext-v1.mjs --write-report
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/audit-fagverk-film-tv-phase3.mjs --write-report

      - name: Validate unit 14
        run: |
          node scripts/brief-film-tv-archive-preservation-access-authenticity-sources-v1.mjs
          node scripts/audit-film-tv-archive-preservation-access-authenticity-fulltext-v1.mjs
          node --test tests/film-tv-archive-preservation-access-authenticity-source-brief-v1.test.mjs
          node --test tests/film-tv-archive-preservation-access-authenticity-fulltext-v1.test.mjs

      - name: Validate monotone Film TV chain
        run: |
          node scripts/brief-film-tv-location-production-place-ethics-sources-v1.mjs
          node scripts/audit-film-tv-location-production-place-ethics-fulltext-v1.mjs
          node --test tests/film-tv-location-production-place-ethics-source-brief-v1.test.mjs
          node --test tests/film-tv-location-production-place-ethics-fulltext-v1.test.mjs
          node scripts/brief-film-tv-screen-places-identity-circulation-sources-v1.mjs
          node scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
          node --test tests/film-tv-screen-places-identity-circulation-source-brief-v1.test.mjs
          node --test tests/film-tv-screen-places-identity-circulation-fulltext-v1.test.mjs
          node scripts/brief-film-tv-reception-participation-audience-methods-sources-v1.mjs
          node scripts/audit-film-tv-reception-participation-audience-methods-fulltext-v1.mjs
          node --test tests/film-tv-reception-participation-audience-methods-source-brief-v1.test.mjs
          node --test tests/film-tv-reception-participation-audience-methods-fulltext-v1.test.mjs
          node scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs
          node --test tests/film-tv-industry-regulation-distribution-source-brief-v1.test.mjs
          node --test tests/film-tv-industry-regulation-distribution-fulltext-v1.test.mjs
          node scripts/audit-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs
          node --test tests/film-tv-creative-work-technology-responsibility-fulltext-v1.test.mjs

      - name: Validate shared baseline
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-film-tv-phase3.test.mjs
          node --test tests/film-tv-learning-order-plan-v1.test.mjs
          node --test tests/film-tv-learning-order-monotone-regression-v1.test.mjs
          node --test tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs

      - name: Remove one-shot infrastructure and publish generated state
        env:
          BRANCH: agent/film-tv-unit14-archive-preservation-access-authenticity-fulltext
        run: |
          rm -f .github/workflows/temp-film-tv-unit14-fulltext-publish.yml
          rm -f .trigger/unit14-fulltext-publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/fagverk/film_tv/arkiv-bevaring-tilgang-og-autentisitet.json \
            data/fagverk/film_tv/arkiv-bevaring-tilgang-og-autentisitet \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_status.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/film-tv-archive-preservation-access-authenticity-source-brief-v1-audit.json \
            reports/fagverk/film-tv-archive-preservation-access-authenticity-fulltext-v1-audit.json \
            reports/fagverk/film-tv-location-production-place-ethics-source-brief-v1-audit.json \
            reports/fagverk/film-tv-location-production-place-ethics-fulltext-v1-audit.json \
            reports/fagverk/general-engine-audit.json \
            reports/fagverk/film-tv-phase3-audit.json \
            .github/workflows/temp-film-tv-unit14-fulltext-publish.yml \
            .trigger/unit14-fulltext-publish
          git diff --cached --check
          git commit -m "Complete Film TV unit 14 fulltext"
          git push origin "HEAD:refs/heads/${BRANCH}"
