name: Split Oslo places

on:
  push:
    branches:
      - data/split-oslo-places-20260705
    paths:
      - scripts/split-oslo-places.mjs
      - .github/workflows/split-oslo-places.yml
      - data/places/by/oslo/places_by.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-oslo-places:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: data/split-oslo-places-20260705

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate split files
        run: node scripts/split-oslo-places.mjs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add data/places/by/oslo/README_SPLIT.md \
                  data/places/by/oslo/places_by_manifest.json \
                  data/places/by/oslo/places_by_index.json \
                  data/places/by/oslo/places_by_split_report.txt \
                  data/places/by/oslo/places
          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Generate split Oslo place files"
            git push
          fi
