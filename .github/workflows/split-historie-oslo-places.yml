name: Split Historie Oslo places

on:
  push:
    branches:
      - data/split-historie-oslo-places-20260705

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/split-historie-oslo-places-20260705
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/split-historie-oslo-places.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/historie/oslo
          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Generate split Historie Oslo place files"
            git push
          fi
