name: Civication FWG required axes diagnostic

on:
  push:
    branches:
      - 'agent/civication-fwg-required-axes-20260929'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct music FWG required axes
        shell: python
        run: |
          import json
          from pathlib import Path

          axes = [
              'task_domain',
              'competency',
              'pressure',
              'choice_axis',
              'consequence_axis',
              'narrative_arc',
          ]
          roles = ['musikk_scene_og_produksjon', 'musikk_utoving_og_ensemble']
          for role in roles:
              path = Path('data/Civication/workGrammars/musikk') / f'{role}.json'
              data = json.loads(path.read_text())
              data['mail_generation_contract']['required_axes'] = axes
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          diagnostic = Path('reports/fwg-required-axes-diagnostic.json')
          if diagnostic.exists():
              diagnostic.unlink()

      - name: Regenerate FWG governance report
        run: node scripts/audit-civication-fwg-governance.mjs

      - name: Show regenerated summary
        run: grep -E 'FWG-filer auditert|Totalt antall avvik' docs/CIVICATION_FWG_GOVERNANCE.md

      - name: Commit exact diagnostic result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/Civication/workGrammars/musikk docs/CIVICATION_FWG_GOVERNANCE.md reports/fwg-required-axes-diagnostic.json
          git commit -m 'Civication: align music FWG required axes with mail fields'
          git push
