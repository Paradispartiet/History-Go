name: Tjuvholmen TS10 licensed documentary photo integration
on:
  pull_request:
    paths:
      - '.github/workflows/tjuvholmen-ts10-media-one-shot.yml'
      - 'reports/place-production/tjuvholmen-workcard-current.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tjuvholmen-ts10-media-${{ github.ref }}
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/oslo-ts10-tjuvholmen-media-v1-20261111
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow requests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fetch two independently licensed Commons documentary sources
        run: |
          python - <<'PY'
          import hashlib,json,time
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from PIL import Image,ImageOps
          from io import BytesIO
          root=Path('.')
          place=Path('data/places/by/oslo/places/tjuvholmen.json')
          work=Path('reports/place-production/tjuvholmen-workcard-current.json')
          old=json.loads(place.read_text())
          card=json.loads(work.read_text())
          assert old['id']=='tjuvholmen'
          def grab(filename,save_path):
            encoded=quote(filename,safe='')
            candidates=[
             f'https://commons.wikimedia.org/wiki/Special:Redirect/file/{encoded}?width=1600',
             f'https://commons.wikimedia.org/wiki/Special:FilePath/{encoded}?width=1600'
            ]
            s=requests.Session()
            s.headers.update({'User-Agent':'HistoryGo EducationalImageProject/1.0 (attribution Wikimedia Commons; web)'})
            for url in candidates:
              for n in range(2):
                try:
                  resp=s.get(url,timeout=35)
                  resp.raise_for_status()
                  image=Image.open(BytesIO(resp.content))
                  image.verify()
                  save_path.parent.mkdir(parents=True,exist_ok=True)
                  save_path.write_bytes(resp.content)
                  print('Downloaded',filename,'from',url,'bytes',len(resp.content))
                  return
                except Exception as exc:
                  print('Image fetch retry',filename,repr(exc)[:300])
                  time.sleep(3)
            raise RuntimeError('Unable to fetch licensed Commons source '+filename)
          main_source=Path('bilder/places/auto/tjuvholmen_2024_ssu_source_thumb.jpg')
          front_source=Path('bilder/places/auto/tjuvholmen_2026_lenz_source_thumb.jpg')
          grab('Tjuvholmen allé, Oslo.jpg',main_source)
          grab('Tjuvholmen allé Oslo 2026-01-14 02.jpg',front_source)
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest(main_source)!=digest(front_source),'Distinct source photos required'
          main=Path('bilder/places/tjuvholmen_main_2024.webp')
          front=Path('bilder/places/tjuvholmen_front_2026.webp')
          with Image.open(main_source) as image:
            main_img=ImageOps.fit(image.convert('RGB'),(1200,675),Image.Resampling.LANCZOS,centering=(.5,.5))
            main_img.save(main,'WEBP',quality=90,method=6)
            main_dimensions=f'{image.width}x{image.height}'
          with Image.open(front_source) as image:
            front_img=ImageOps.fit(image.convert('RGB'),(900,1200),Image.Resampling.LANCZOS,centering=(.5,.5))
            front_img.save(front,'WEBP',quality=91,method=6)
            front_dimensions=f'{image.width}x{image.height}'
          old['image']=str(main)
          old['cardImage']=str(main)
          old['frontImage']=str(front)
          old['imageMeta']={
           'source':'wikimedia_commons_documentary_photo',
           'sourcePage':'https://commons.wikimedia.org/wiki/File:Tjuvholmen_all%C3%A9,_Oslo.jpg',
           'sourceLocalAsset':str(main_source),
           'sourceSha256':digest(main_source),'sourceLocalSha256':digest(main_source),
           'creator':'Ssu','credit':'Ssu / Wikimedia Commons','license':'CC BY-SA 4.0',
           'licenseUrl':'https://creativecommons.org/licenses/by-sa/4.0/',
           'originalDimensions':'4032x3024','localSourceDimensions':main_dimensions,
           'outputDimensions':'1200x675','outputSha256':digest(main),'assetType':'documentary_place_photo',
           'transformation':'Centrert 16:9 utsnitt av Commons-fotografi fra 2024, ingen KI-generering.',
           'verifiedAt':'2026-11-11'
          }
          old['frontImageMeta']={
           'source':'wikimedia_commons_documentary_photo',
           'sourcePage':'https://commons.wikimedia.org/wiki/File:Tjuvholmen_all%C3%A9_Oslo_2026-01-14_02.jpg',
           'sourceLocalAsset':str(front_source),
           'sourceSha256':digest(front_source),'sourceLocalSha256':digest(front_source),
           'creator':'Leonhard Lenz','credit':'Leonhard Lenz / Wikimedia Commons',
           'license':'CC0 1.0',
           'licenseUrl':'https://creativecommons.org/publicdomain/zero/1.0/',
           'originalDimensions':'8144x5424','localSourceDimensions':front_dimensions,
           'outputDimensions':'900x1200','outputSha256':digest(front),'assetType':'documentary_place_photo',
           'orientation':'portrait','aspectRatio':'3:4',
           'transformation':'Centrert 3:4 utsnitt av selvstendig Commons-fotografi fra januar 2026, ingen KI-generering.',
           'reviewStatus':'pending_editorial_crop_review','verifiedAt':'2026-11-11'
          }
          old['imageCredit']='Ssu / Wikimedia Commons'
          old['imageLicense']='CC BY-SA 4.0'
          old['imageLicenseUrl']='https://creativecommons.org/licenses/by-sa/4.0/'
          old['imageSourceUrl']=old['imageMeta']['sourcePage']
          card['status']='local_binary_images_ready_pending_editorial_and_collections'
          card['new_media']['main_image']['local_source']=str(main_source)
          card['new_media']['main_image']['local_source_sha256']=digest(main_source)
          card['new_media']['main_image']['webp_sha256']=digest(main)
          card['new_media']['front_image']['local_source']=str(front_source)
          card['new_media']['front_image']['local_source_sha256']=digest(front_source)
          card['new_media']['front_image']['webp_sha256']=digest(front)
          card['qa']='Photo sources local and byte-verified; editorial crop/mobile/desktop and People/Brands collection audit PENDING'
          place.write_text(json.dumps(old,ensure_ascii=False,indent=2)+'\n')
          work.write_text(json.dumps(card,ensure_ascii=False,indent=2)+'\n')
          print('Two licensed originals:',digest(main_source),digest(front_source))
          print('WebP outputs:',digest(main),digest(front))
          PY
      - name: Rebuild only required place projections and record READ-FIRST
        run: |
          npm run place-open:build
          npm run places:index:build
          node scripts/build-quiz-production-context.mjs --category by --target tjuvholmen --output data/quiz/production_context/by/tjuvholmen.json
          node scripts/place-production-rule-preflight.mjs record --workcard reports/place-production/tjuvholmen-workcard-current.json --place-id tjuvholmen --category by
          node scripts/place-production-rule-preflight.mjs validate --workcard reports/place-production/tjuvholmen-workcard-current.json
          npm run place-open:check
          npm run places:index:check
          node scripts/build-quiz-production-context.mjs --category by --target tjuvholmen --output data/quiz/production_context/by/tjuvholmen.json --check
          node scripts/check-distinct-place-photos.mjs --place data/places/by/oslo/places/tjuvholmen.json --require-both
      - name: Commit only Tjuvholmen media and deterministic projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/places/auto/tjuvholmen_2024_ssu_source_thumb.jpg bilder/places/auto/tjuvholmen_2026_lenz_source_thumb.jpg
          git add bilder/places/tjuvholmen_main_2024.webp bilder/places/tjuvholmen_front_2026.webp
          git add data/places/by/oslo/places/tjuvholmen.json
          git add data/runtime/place-open/tjuvholmen.json data/places/places_index.json
          git add data/quiz/production_context/by/tjuvholmen.json
          git add reports/place-production/tjuvholmen-workcard-current.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat(tjuvholmen): two source-distinct licensed local Place photos and runtime"
            git fetch origin content/oslo-ts10-tjuvholmen-media-v1-20261111
            git rebase origin/content/oslo-ts10-tjuvholmen-media-v1-20261111
            git push origin HEAD:content/oslo-ts10-tjuvholmen-media-v1-20261111
          fi
