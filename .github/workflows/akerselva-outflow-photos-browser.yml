name: Akerselva PlaceCard photo browser QA
on:
  pull_request:
    paths:
      - "data/places/natur/oslo/places_oslo_natur_akerselvarute/frysjadammen.json"
      - "data/places/natur/oslo/places_oslo_natur_akerselvarute/stilla_nydalen.json"
      - "data/places/natur/oslo/places_oslo_natur_akerselvarute/bjoelsenfossen.json"
      - "data/runtime/place-open/bjoelsenfossen.json"
      - "bilder/places/bjoelsenfossen_*.webp"
      - "data/runtime/place-open/frysjadammen.json"
      - "data/runtime/place-open/stilla_nydalen.json"
      - "bilder/places/oset_slusebru_landscape.webp"
      - "bilder/illustrasjoner/places/oset_slusebru_front_original.svg"
      - "tests/akerselva-outflow-two-place-image-browser.mjs"
      - "scripts/check-distinct-place-photos.mjs"
      - ".github/workflows/akerselva-outflow-photos-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: akerselva-outflow-photos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify changed Place images and genuine independent originals
        run: |
          node scripts/audit-place-images.mjs --mode=changed
          node scripts/check-distinct-place-photos.mjs --place data/places/natur/oslo/places_oslo_natur_akerselvarute/frysjadammen.json --require-both
          node scripts/check-distinct-place-photos.mjs --place data/places/natur/oslo/places_oslo_natur_akerselvarute/stilla_nydalen.json --require-both
          node scripts/check-distinct-place-photos.mjs --place data/places/natur/oslo/places_oslo_natur_akerselvarute/bjoelsenfossen.json --require-both
      - name: Install dependencies and rebuild canonical browser payloads
        run: |
          npm ci --no-audit --no-fund
          npm run places:index:build
          npm run place-open:check
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Check true source images and PlaceCard across phone/iPad/desktop
        run: node tests/akerselva-outflow-two-place-image-browser.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akerselva-placecard-photos
          path: artifacts/akerselva-outflow-photo/
          if-no-files-found: warn
          retention-days: 14
