name: One-time build verified Næringsliv pilot final

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/one-time-materialize-naeringsliv-pilot.yml'

permissions:
  contents: write

jobs:
  build-final:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/naeringsliv-pilot-profesjonsmaterialisering
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build final branch with complete theory references
        shell: bash
        run: |
          set -euo pipefail
          git show 4234d827f9d852a0bde596d928d689a821408b21:.github/workflows/one-time-build-naeringsliv-pilot-final.yml > /tmp/locked.yml
          python - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/locked.yml').read_text(encoding='utf-8').splitlines()
          start = lines.index('      - name: Reconstruct, validate and publish clean final branch')
          run = next(i for i in range(start, len(lines)) if lines[i] == '        run: |')
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[run + 1:]) + '\n'

          package_loop = 'for part in $(seq -w 0 8); do\n  git -C "$GITHUB_WORKSPACE" show "origin/${OLD_BRANCH}:.tmp/naeringsliv-pilot/pkg-${part}"\ndone > /tmp/naeringsliv-pilot.b64\n'
          package_reader = "python -c \"import subprocess,pathlib; c='adf47efbabb88be77cd0413dee695557923a9b97'; p=[subprocess.check_output(['git','show',f'{c}:.tmp/naeringsliv-pilot/pkg-{i:02d}']).strip() for i in range(9)]; pathlib.Path('/tmp/naeringsliv-pilot.b64').write_bytes(b''.join(p))\"\n"
          if package_loop not in body:
              raise SystemExit('Pakkeløkken mangler')
          body = body.replace(package_loop, package_reader, 1)

          binding_fields = "('method_id', 'topic_hook_id', 'thinker_id', 'thinker_name', 'work', 'theory_focus', 'theory_ref')"
          quiz_cleanup = (
              f"    binding_fields = {binding_fields}\n"
              "    for set_row in sets[2:4]:\n"
              "        for question in set_row['questions']:\n"
              "            for field in binding_fields:\n"
              "                question.pop(field, None)\n\n"
              "    theory_explanations = {\n"
              "        'telegrafbygningen': 'Webers begrep om rasjonalisering synliggjør hvordan kommunikasjon, arbeidsdeling, standardiserte rutiner og tekniske systemer ble samlet i én stor organisasjon.',\n"
              "        'oslo_posthus': 'Webers begrep om rasjonalisering forklarer hvordan sortering, ekspedisjon og administrasjon ble samlet i et regelstyrt hovedpostkontor for mer forutsigbar massehåndtering.',\n"
              "    }\n"
              "    for question in sets[4]['questions']:\n"
              "        if question.get('topic_hook_id') and not question.get('theory_ref'):\n"
              "            question['theory_ref'] = {\n"
              "                'topic_hook_id': question['topic_hook_id'],\n"
              "                'why_it_helps': theory_explanations.get(target, 'Teoribindingen forklarer hvordan organisering, arbeidsdeling og standardisering former den dokumenterte virksomheten ved stedet.'),\n"
              "            }\n\n"
          )
          production_marker = "    production = quiz.setdefault('production_context', {})\n"
          if production_marker not in body:
              raise SystemExit('Produksjonsmarkøren mangler')
          body = body.replace(production_marker, quiz_cleanup + production_marker, 1)
          body = body.replace("production['method_start_phase'] = 'bridge'", "production['method_start_phase'] = 'final'", 1)

          brief_marker = "    materialization = brief.setdefault('professional_materialization', {})\n"
          brief_cleanup = (
              "    claim_by_id = {claim['claim_id']: claim for claim in brief.get('claims', [])}\n"
              "    for set_row in sets[2:4]:\n"
              "        for question in set_row['questions']:\n"
              "            claim = claim_by_id.get(question.get('claim_id'))\n"
              "            if claim:\n"
              "                for field in binding_fields:\n"
              "                    claim.pop(field, None)\n"
              "    for question in sets[4]['questions']:\n"
              "        claim = claim_by_id.get(question.get('claim_id'))\n"
              "        if claim and question.get('theory_ref'):\n"
              "            claim['theory_ref'] = question['theory_ref']\n\n"
          )
          if brief_marker not in body:
              raise SystemExit('Briefmarkøren mangler')
          body = body.replace(brief_marker, brief_cleanup + brief_marker, 1)

          Path('/tmp/run-final.sh').write_text(body, encoding='utf-8')
          PY
          bash /tmp/run-final.sh
