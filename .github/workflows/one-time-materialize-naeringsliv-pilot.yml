name: One-time build verified Næringsliv pilot final

# Control v3: byte-exact historical package reconstruction.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/one-time-materialize-naeringsliv-pilot.yml'

permissions:
  contents: write

jobs:
  build-final:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/naeringsliv-pilot-profesjonsmaterialisering
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Execute locked final builder with byte-exact package reconstruction
        shell: bash
        run: |
          set -euo pipefail
          LOCKED_BUILDER_COMMIT='4234d827f9d852a0bde596d928d689a821408b21'
          LOCKED_PACKAGE_COMMIT='adf47efbabb88be77cd0413dee695557923a9b97'
          git show "${LOCKED_BUILDER_COMMIT}:.github/workflows/one-time-build-naeringsliv-pilot-final.yml" > /tmp/locked-builder.yml

          python - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/locked-builder.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Reconstruct, validate and publish clean final branch'
          marker_index = lines.index(marker)
          run_index = next(index for index in range(marker_index, len(lines)) if lines[index] == '        run: |')
          body_lines = lines[run_index + 1:]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body_lines) + '\n'

          old = '''for part in $(seq -w 0 8); do
  git -C "$GITHUB_WORKSPACE" show "origin/${OLD_BRANCH}:.tmp/naeringsliv-pilot/pkg-${part}"
done > /tmp/naeringsliv-pilot.b64
'''
          new = '''python - <<'PACKAGEPY'
import subprocess
from pathlib import Path

commit = 'adf47efbabb88be77cd0413dee695557923a9b97'
chunks = [
    subprocess.check_output([
        'git', '-C', Path.cwd().as_posix(), 'show',
        f'{commit}:.tmp/naeringsliv-pilot/pkg-{index:02d}',
    ])
    for index in range(9)
]
Path('/tmp/naeringsliv-pilot.b64').write_bytes(b''.join(chunk.strip() for chunk in chunks))
PACKAGEPY
'''
          if old not in body:
              raise SystemExit('Fant ikke pakkeløkken i den låste sluttbyggeren')
          body = body.replace(old, new, 1)
          Path('/tmp/run-verified-naeringsliv-pilot-final.sh').write_text(body, encoding='utf-8')
          PY

          bash /tmp/run-verified-naeringsliv-pilot-final.sh
