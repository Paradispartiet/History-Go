name: One-time locate valid Næringsliv pilot package

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/one-time-materialize-naeringsliv-pilot.yml'
      - '.tmp/naeringsliv-pilot/**'

permissions:
  contents: write

jobs:
  locate-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/naeringsliv-pilot-profesjonsmaterialisering
          fetch-depth: 0

      - name: Test every historical package revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/naeringsliv-pilot
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import subprocess
          from pathlib import Path

          expected = 'ce62c5eb4122540b74e7a0687e65a1926a5520ecbd03caf9d15a78763b6c9441'
          paths = [f'.tmp/naeringsliv-pilot/pkg-{index:02d}' for index in range(9)]
          commits = subprocess.check_output(
              ['git', 'rev-list', '--all', '--', paths[0]], text=True
          ).splitlines()

          rows = []
          matches = []
          for commit in commits:
              try:
                  chunks = [subprocess.check_output(['git', 'show', f'{commit}:{path}']) for path in paths]
              except subprocess.CalledProcessError:
                  continue
              encoded = b''.join(chunk.strip() for chunk in chunks)
              try:
                  decoded = base64.b64decode(encoded, validate=True)
                  materializer = gzip.decompress(decoded)
                  digest = hashlib.sha256(materializer).hexdigest()
                  state = 'MATCH' if digest == expected else 'valid-other'
                  rows.append(f'{state}\t{commit}\t{digest}\t{len(materializer)}')
                  if digest == expected:
                      matches.append(commit)
              except Exception as exc:
                  rows.append(f'invalid\t{commit}\t{type(exc).__name__}: {exc}')

          report = [
              f'expected_sha={expected}',
              f'candidate_commits={len(commits)}',
              f'matching_commits={len(matches)}',
              *rows,
          ]
          Path('.tmp/naeringsliv-pilot/package-history.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          if not matches:
              raise SystemExit('Fant ingen historisk pakke med forventet materializer-SHA')
          PY

      - name: Save package history
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .tmp/naeringsliv-pilot/package-history.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp/naeringsliv-pilot/package-history.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Kartlegg historiske materialiseringspakker'
          git push origin HEAD:agent/naeringsliv-pilot-profesjonsmaterialisering
