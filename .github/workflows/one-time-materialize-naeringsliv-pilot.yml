name: One-time capture verified Næringsliv pilot failure

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - '.github/workflows/one-time-materialize-naeringsliv-pilot.yml'

permissions:
  actions: read
  contents: write

jobs:
  capture-failure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/naeringsliv-pilot-profesjonsmaterialisering
          fetch-depth: 0

      - name: Capture failed builder tail
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/naeringsliv-pilot
          gh run view 30260730668 --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/full-failure.log
          tail -n 700 /tmp/full-failure.log > .tmp/naeringsliv-pilot/final-builder-failure.log

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp/naeringsliv-pilot/final-builder-failure.log
          git diff --cached --quiet && exit 0
          git commit -m 'Diagnostiser byteverifisert Næringsliv-pilotbygger'
          git push origin HEAD:agent/naeringsliv-pilot-profesjonsmaterialisering
