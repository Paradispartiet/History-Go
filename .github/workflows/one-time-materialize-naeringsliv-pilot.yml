name: One-time capture synchronized Næringsliv pilot failure

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/one-time-materialize-naeringsliv-pilot.yml'

permissions:
  actions: read
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/naeringsliv-pilot-profesjonsmaterialisering
          fetch-depth: 0
      - name: Save final failure tail
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/naeringsliv-pilot
          gh run view 30261376183 --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/full.log
          tail -n 700 /tmp/full.log > .tmp/naeringsliv-pilot/synchronized-builder-failure.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp/naeringsliv-pilot/synchronized-builder-failure.log
          git diff --cached --quiet && exit 0
          git commit -m 'Diagnostiser synkronisert Næringsliv-pilotbygger'
          git push origin HEAD:agent/naeringsliv-pilot-profesjonsmaterialisering
