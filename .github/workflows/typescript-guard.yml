name: TypeScript guard

on:
  pull_request:
    paths:
      - 'js/**'
      - 'scripts/**'
      - 'tools/**'
      - 'types/**'
      - 'schemas/**'
      - 'build/**'
      - 'dist/web/**'
      - '*.js'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/typescript-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: TypeScript scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.scope.outputs.web }}
      scripts: ${{ steps.scope.outputs.scripts }}
      tools: ${{ steps.scope.outputs.tools }}
      legacy: ${{ steps.scope.outputs.legacy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify affected TypeScript surfaces
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            {
              echo "web=true"
              echo "scripts=true"
              echo "tools=true"
              echo "legacy=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          web=false
          scripts=false
          tools=false
          legacy=false

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/history-go-typescript-changed.txt
          cat /tmp/history-go-typescript-changed.txt

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue

            case "$path" in
              .github/workflows/typescript-guard.yml|package.json|package-lock.json)
                web=true
                scripts=true
                tools=true
                legacy=true
                ;;
              tsconfig.web.json|build/*|dist/web/*)
                web=true
                ;;
              tsconfig.scripts.json|tsconfig.scripts.build.json|scripts/*)
                scripts=true
                ;;
              tsconfig.tools.json|tsconfig.tools.build.json|tools/*|types/*)
                tools=true
                ;;
              tsconfig.json)
                legacy=true
                ;;
              schemas/*)
                web=true
                legacy=true
                ;;
              js/*)
                web=true
                case "$path" in
                  *.js) legacy=true ;;
                esac
                ;;
              *)
                if [[ "$path" != */* && "$path" == *.js ]]; then
                  legacy=true
                  web=true
                else
                  # Any newly added source path that reaches this workflow is
                  # treated conservatively until it receives an explicit scope.
                  web=true
                  scripts=true
                  tools=true
                  legacy=true
                fi
                ;;
            esac

            if [[ "$path" == scripts/*.js ]]; then
              legacy=true
            fi
          done < /tmp/history-go-typescript-changed.txt

          {
            echo "web=$web"
            echo "scripts=$scripts"
            echo "tools=$tools"
            echo "legacy=$legacy"
          } >> "$GITHUB_OUTPUT"

  typecheck-build:
    name: TypeScript typecheck and build guard
    needs: scope
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Root tsconfig checks only the legacy JS/schema surface. Capture the PR
      # base only when that surface actually changed.
      - name: Capture legacy TypeScript baseline from PR base
        if: github.event_name == 'pull_request' && needs.scope.outputs.legacy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          TARGET_SHA="${{ github.sha }}"

          git checkout --detach "$BASE_SHA"
          npm ci --no-audit --no-fund

          set +e
          npm run typecheck > "$RUNNER_TEMP/typecheck-base.log" 2>&1
          BASE_STATUS=$?
          set -e

          {
            grep -E 'error TS[0-9]+:' "$RUNNER_TEMP/typecheck-base.log" || true
          } | sed -E 's/\([0-9]+,[0-9]+\): error /: error /' \
            | sort -u \
            > "$RUNNER_TEMP/typecheck-base.normalized"

          echo "Legacy base typecheck exit code: $BASE_STATUS"
          echo "Legacy base diagnostics: $(wc -l < "$RUNNER_TEMP/typecheck-base.normalized")"

          git checkout --detach "$TARGET_SHA"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck browser TypeScript
        if: needs.scope.outputs.web == 'true'
        run: npm run typecheck:web

      - name: Verify browser build is in sync
        if: needs.scope.outputs.web == 'true'
        id: build-web-check
        shell: bash
        run: |
          mkdir -p reports/typescript-ci
          set -o pipefail
          set +e
          npm run build:web:check 2>&1 \
            | tee reports/typescript-ci/build-web-check.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          git status --porcelain dist/web \
            | tee reports/typescript-ci/dist-web-status.log
          git diff -- dist/web \
            > reports/typescript-ci/dist-web.diff

          exit "$BUILD_STATUS"

      - name: Upload browser build diagnostics
        if: failure() && steps.build-web-check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typescript-browser-build-diagnostics-${{ github.run_id }}
          path: |
            reports/typescript-ci/build-web-check.log
            reports/typescript-ci/dist-web-status.log
            reports/typescript-ci/dist-web.diff
          if-no-files-found: error

      - name: Typecheck scripts
        if: needs.scope.outputs.scripts == 'true'
        run: npm run typecheck:scripts

      - name: Build scripts
        if: needs.scope.outputs.scripts == 'true'
        run: npm run build:scripts

      - name: Typecheck tools
        if: needs.scope.outputs.tools == 'true'
        run: npm run typecheck:tools

      - name: Build tools
        if: needs.scope.outputs.tools == 'true'
        run: npm run build:tools

      - name: Social Meet Spotmeeting browser smoke
        if: needs.scope.outputs.web == 'true'
        run: npm run test:social-meet-spotmeeting-smoke

      - name: Test hidden developer mode
        if: needs.scope.outputs.web == 'true'
        run: node tests/hg-test-mode.test.js && node tests/header-search-menu.test.js

      - name: NextUp progressive PlaceCard regression
        if: needs.scope.outputs.web == 'true'
        run: node tests/nextup-progressive-placecard-state.test.js

      - name: People background loading regression
        if: needs.scope.outputs.web == 'true'
        run: node tests/background-boot-pacing.test.js

      - name: Hyperfast place-open payload regression
        if: needs.scope.outputs.web == 'true'
        run: npm run place-open:check && npm run test:place-open

      - name: Torggata canonical People regression
        if: needs.scope.outputs.web == 'true'
        run: node --test tests/torggata-phase12-people-links.test.mjs

      # For pull requests, root checkJs is a regression gate rather than a
      # zero-debt gate, and now runs only when its included surface changed.
      - name: Guard against new legacy TypeScript regressions
        if: github.event_name == 'pull_request' && needs.scope.outputs.legacy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          set +e
          npm run typecheck > "$RUNNER_TEMP/typecheck-target.log" 2>&1
          TARGET_STATUS=$?
          set -e

          {
            grep -E 'error TS[0-9]+:' "$RUNNER_TEMP/typecheck-target.log" || true
          } | sed -E 's/\([0-9]+,[0-9]+\): error /: error /' \
            | sort -u \
            > "$RUNNER_TEMP/typecheck-target.normalized"

          comm -13 \
            "$RUNNER_TEMP/typecheck-base.normalized" \
            "$RUNNER_TEMP/typecheck-target.normalized" \
            > "$RUNNER_TEMP/typecheck-new.normalized"

          if [[ -s "$RUNNER_TEMP/typecheck-new.normalized" ]]; then
            echo 'New legacy TypeScript diagnostics introduced by this PR:'
            cat "$RUNNER_TEMP/typecheck-new.normalized"
            echo
            echo 'Full target typecheck output:'
            cat "$RUNNER_TEMP/typecheck-target.log"
            exit 1
          fi

          if [[ "$TARGET_STATUS" -ne 0 ]]; then
            echo 'Root legacy typecheck still contains baseline diagnostics, but this PR introduces no new normalized diagnostics.'
          else
            echo 'Root legacy typecheck is fully green.'
          fi

      # On main/manual runs this remains observational. Modern gates above stay
      # mandatory for the surfaces selected by the scope classifier.
      - name: Observe root legacy TypeScript baseline
        if: github.event_name != 'pull_request' && needs.scope.outputs.legacy == 'true'
        continue-on-error: true
        run: npm run typecheck
