name: TypeScript guard

on:
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.cts'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - 'js/**'
      - 'scripts/**'
      - 'tools/**'
      - 'types/**'
      - 'schemas/**'
      - 'build/**'
      - 'dist/web/**'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/typescript-guard.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.cts'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - 'js/**'
      - 'scripts/**'
      - 'tools/**'
      - 'types/**'
      - 'schemas/**'
      - 'build/**'
      - 'dist/web/**'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/typescript-guard.yml'
  workflow_dispatch:

jobs:
  typecheck-build:
    name: TypeScript typecheck and build guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture legacy TypeScript baseline from PR base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          TARGET_SHA="${{ github.sha }}"
          git checkout --detach "$BASE_SHA"
          npm ci --no-audit --no-fund
          set +e
          npm run typecheck > "$RUNNER_TEMP/typecheck-base.log" 2>&1
          BASE_STATUS=$?
          set -e
          { grep -E 'error TS[0-9]+:' "$RUNNER_TEMP/typecheck-base.log" || true; } | sed -E 's/\([0-9]+,[0-9]+\): error /: error /' | sort -u > "$RUNNER_TEMP/typecheck-base.normalized"
          echo "Legacy base typecheck exit code: $BASE_STATUS"
          echo "Legacy base diagnostics: $(wc -l < "$RUNNER_TEMP/typecheck-base.normalized")"
          git checkout --detach "$TARGET_SHA"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck browser TypeScript
        run: npm run typecheck:web
      - name: Verify browser build is in sync
        run: npm run build:web:check
      - name: Typecheck scripts
        run: npm run typecheck:scripts
      - name: Build scripts
        run: npm run build:scripts
      - name: Typecheck tools
        run: npm run typecheck:tools
      - name: Build tools
        run: npm run build:tools
      - name: Guard against new legacy TypeScript regressions
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm run typecheck > "$RUNNER_TEMP/typecheck-target.log" 2>&1
          TARGET_STATUS=$?
          set -e
          { grep -E 'error TS[0-9]+:' "$RUNNER_TEMP/typecheck-target.log" || true; } | sed -E 's/\([0-9]+,[0-9]+\): error /: error /' | sort -u > "$RUNNER_TEMP/typecheck-target.normalized"
          comm -13 "$RUNNER_TEMP/typecheck-base.normalized" "$RUNNER_TEMP/typecheck-target.normalized" > "$RUNNER_TEMP/typecheck-new.normalized"
          if [[ -s "$RUNNER_TEMP/typecheck-new.normalized" ]]; then
            echo 'New legacy TypeScript diagnostics introduced by this PR:'
            cat "$RUNNER_TEMP/typecheck-new.normalized"
            echo
            echo 'Full target typecheck output:'
            cat "$RUNNER_TEMP/typecheck-target.log"
            exit 1
          fi
          if [[ "$TARGET_STATUS" -ne 0 ]]; then echo 'Root legacy typecheck still contains baseline diagnostics, but this PR introduces no new normalized diagnostics.'; else echo 'Root legacy typecheck is fully green.'; fi
      - name: Observe root legacy TypeScript baseline
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: npm run typecheck

  finalize-nearby-place-selector-v4:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/typescript-nearby-place-selector-v4' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply bounded Nearby selector migration
        run: python .github/scripts/finalize-nearby-place-selector-v4.py
      - name: Capture migrated browser TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck:web > nearby-selector-typecheck.log 2>&1
          status=$?
          echo "$status" > nearby-selector-typecheck.status
          exit 0
      - name: Upload selector TypeScript diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: nearby-selector-typecheck-diagnostics
          path: |
            nearby-selector-typecheck.log
            nearby-selector-typecheck.status
          if-no-files-found: error
          retention-days: 1
      - name: Require clean migrated browser TypeScript
        shell: bash
        run: |
          status="$(cat nearby-selector-typecheck.status)"
          if [[ "$status" != "0" ]]; then
            cat nearby-selector-typecheck.log
            exit "$status"
          fi
      - name: Build migrated browser runtime
        run: npm run build:web
      - name: Typecheck remaining legacy JavaScript
        run: npm run typecheck
      - name: Commit selector integration and generated runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire TypeScript Nearby place selector"
          git push origin HEAD:${{ github.head_ref }}
