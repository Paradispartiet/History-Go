name: TypeScript guard

on:
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.cts'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - 'js/**'
      - 'scripts/**'
      - 'tools/**'
      - 'types/**'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/typescript-guard.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.cts'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - 'js/**'
      - 'scripts/**'
      - 'tools/**'
      - 'types/**'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/typescript-guard.yml'
  workflow_dispatch:

jobs:
  typecheck-build:
    name: TypeScript typecheck and build guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck root baseline
        run: npm run typecheck

      - name: Typecheck scripts
        run: npm run typecheck:scripts

      - name: Build scripts
        run: npm run build:scripts

      - name: Typecheck tools
        run: |
          set +e
          npm run typecheck:tools > typecheck-tools.log 2>&1
          status=$?
          cat typecheck-tools.log
          exit "$status"

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-tools-log
          path: typecheck-tools.log
          if-no-files-found: ignore

      - name: Build tools
        run: npm run build:tools
