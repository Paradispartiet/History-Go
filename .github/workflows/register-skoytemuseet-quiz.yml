name: Register Skoytemuseet sport quiz

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  register:
    if: github.event.issue.title == '[automation] Register Skoytemuseet quiz'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create, validate and register quiz
        env:
          QUIZ_GZ_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, json, os
          from pathlib import Path

          quiz_path = Path('data/quiz/sport/skoytemuseet_sets.json')
          quiz_path.parent.mkdir(parents=True, exist_ok=True)
          quiz_path.write_bytes(gzip.decompress(base64.b64decode(os.environ['QUIZ_GZ_B64'])))

          quiz = json.loads(quiz_path.read_text(encoding='utf-8'))
          pensum = json.loads(Path('data/fag/sport/sportpensum_canonical_v4_5.json').read_text(encoding='utf-8'))
          methods = json.loads(Path('data/fag/sport/methods_sport_canonical_v4_5.json').read_text(encoding='utf-8'))
          valid_emner = {e for domain in pensum['domains'] for e in domain['emne_ids']}
          valid_methods = {m['method_id'] for m in methods['methods']}
          blocks = quiz.get('sets', [])
          questions = [q for block in blocks for q in block.get('questions', [])]

          assert quiz.get('targetId') == 'skoytemuseet'
          assert quiz.get('categoryId') == 'sport'
          assert len(blocks) == 2 and len(questions) == 10
          assert len({b['set_id'] for b in blocks}) == 2
          assert len({q['id'] for q in questions}) == 10
          assert len({q['quiz_id'] for q in questions}) == 10
          required = {'source_origin','claim_basis','guidance_basis','method_id','emne_id','sport_anchor_type','source_note'}
          for q in questions:
              assert q['targetId'] == q['placeId'] == 'skoytemuseet'
              assert len(q['options']) == 3 and q['options'][q['answerIndex']] == q['answer']
              assert q['emne_id'] in valid_emner
              assert q['method_id'] in valid_methods
              assert required <= q.keys()
              assert q['source_origin'] == 'external'
              assert q['source'] and all(s.get('url') for s in q['source'])
              assert q['external_source_ratio_target'] >= 0.85

          manifest_path = Path('data/quiz/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          entries = manifest['sets']
          expected = {'targetId':'skoytemuseet','file':str(quiz_path)}
          matches = [e for e in entries if e.get('targetId') == 'skoytemuseet']
          assert len(matches) <= 1
          if matches:
              assert matches[0] == expected
          else:
              after = next((i + 1 for i, e in enumerate(entries) if e.get('targetId') == 'holmlia_bad'), len(entries))
              entries.insert(after, expected)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit data and remove one-time workflow
        run: |
          rm .github/workflows/register-skoytemuseet-quiz.yml
          git config user.name "History Go Data Production"
          git config user.email "history-go-data@users.noreply.github.com"
          git add data/quiz/sport/skoytemuseet_sets.json data/quiz/manifest.json .github/workflows/register-skoytemuseet-quiz.yml
          git commit -m "Add and register Skoytemuseet sport quiz"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
          done
          exit 1
