name: Arbeiderbladet mobile title check
on:
  pull_request:
    branches: [main]
concurrency:
  group: arbeiderbladet-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/audit-arbeiderbladet-youngstorget-visual.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbeiderbladet-mobile-title-check
          path: artifacts/arbeiderbladet-youngstorget-final-20261011/
          if-no-files-found: error
