name: One-time Oslo popup batch 13 writer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/oslo-popup-batch-13-trigger.txt

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Batch 13 branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-popup-v4-batch-13-finish-by
          fetch-depth: 0

      - name: Apply isolated desc and popupDesc patches
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const paths = {
            torshovparken: 'data/places/by/oslo/places/torshovparken.json',
            ulvoya: 'data/places/by/oslo/places/ulvoya.json',
            uranienborg_kirke: 'data/places/by/oslo/places/uranienborg_kirke.json',
            vikaterrassen: 'data/places/by/oslo/places/vikaterrassen.json',
            rudolf_nilsens_plass: 'data/places/by/oslo/rudolf_nilsens_plass.json',
            snippen_lekepark: 'data/places/by/oslo/snippen_lekepark.json',
            sofienbergparken: 'data/places/by/oslo/sofienbergparken.json',
            torshovdalen: 'data/places/by/oslo/torshovdalen.json'
          };
          const names = {
            torshovparken: 'Torshovparken',
            ulvoya: 'Ulvøya',
            uranienborg_kirke: 'Uranienborg kirke',
            vikaterrassen: 'Vikaterrassen',
            rudolf_nilsens_plass: 'Rudolf Nilsens plass',
            snippen_lekepark: 'Snippen lekepark',
            sofienbergparken: 'Sofienbergparken',
            torshovdalen: 'Torshovdalen'
          };
          const patches = [
            ...JSON.parse(fs.readFileSync('reports/oslo-popup-batch-13-part1.json', 'utf8')).places,
            ...JSON.parse(fs.readFileSync('reports/oslo-popup-batch-13-part2.json', 'utf8')).places
          ];
          if (patches.length !== 8) throw new Error(`Expected 8 patches, got ${patches.length}`);
          const wordCount = (value) => String(value).trim().split(/\s+/u).filter(Boolean).length;
          const paragraphCount = (value) => String(value).split(/\n\n+/u).filter((part) => part.trim()).length;
          const rows = [];
          for (const [index, patch] of patches.entries()) {
            const file = paths[patch.id];
            if (!file) throw new Error(`Unknown place id ${patch.id}`);
            const before = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (before.id !== patch.id) throw new Error(`ID mismatch in ${file}`);
            const beforeComparable = structuredClone(before);
            delete beforeComparable.desc;
            delete beforeComparable.popupDesc;
            const after = structuredClone(before);
            after.desc = patch.desc;
            after.popupDesc = patch.popupDesc;
            const afterComparable = structuredClone(after);
            delete afterComparable.desc;
            delete afterComparable.popupDesc;
            if (JSON.stringify(beforeComparable) !== JSON.stringify(afterComparable)) throw new Error(`Non-text fields changed for ${patch.id}`);
            const descWords = wordCount(after.desc);
            const popupWords = wordCount(after.popupDesc);
            const paragraphs = paragraphCount(after.popupDesc);
            if (descWords < 40 || descWords > 80) throw new Error(`${patch.id} desc words ${descWords}`);
            if (popupWords < 300 || popupWords > 600) throw new Error(`${patch.id} popup words ${popupWords}`);
            if (paragraphs !== 6) throw new Error(`${patch.id} paragraphs ${paragraphs}`);
            fs.writeFileSync(file, `${JSON.stringify(after, null, 2)}\n`);
            rows.push(`| ${111 + index} | ${names[patch.id]} | \`${patch.id}\` | ${descWords} | ${popupWords} | ${paragraphs} | #${process.env.PR_NUMBER} |`);
          }

          const protocolPath = 'reports/place-description-revision-protocol.md';
          let protocol = fs.readFileSync(protocolPath, 'utf8');
          if (!protocol.includes('| 111 | Torshovparken |')) {
            protocol = protocol.replace('\n## Gjenstående Oslo-kø', `\n${rows.join('\n')}\n\n## Gjenstående Oslo-kø`);
          }
          const batchRow = `| Oslo V4 batch 13 | 8 | #${process.env.PR_NUMBER} – fullførte hele Oslo-køen for fagområdet by |`;
          if (!protocol.includes('| Oslo V4 batch 13 |')) {
            protocol = protocol.replace(/(\| Oslo V4 batch 12 \|[^\n]+\|)/u, `$1\n${batchRow}`);
          }
          fs.writeFileSync(protocolPath, protocol);
          NODE

          node tools/audit-oslo-place-description-scope.mjs --write

          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('reports/oslo-place-description-scope-audit-2026-07-26.json', 'utf8'));
          if (audit.activeOslo.uniqueIds !== 512) throw new Error(`Active Oslo total ${audit.activeOslo.uniqueIds}`);
          if (audit.protocol.ids !== 118) throw new Error(`Protocol IDs ${audit.protocol.ids}`);
          if (audit.comparison.additionalActiveOsloIds !== 394) throw new Error(`Remaining ${audit.comparison.additionalActiveOsloIds}`);
          if (Object.prototype.hasOwnProperty.call(audit.groupCounts, 'by')) throw new Error(`By queue not empty: ${audit.groupCounts.by}`);
          NODE

          git diff --check
          git add \
            data/places/by/oslo/places/torshovparken.json \
            data/places/by/oslo/places/ulvoya.json \
            data/places/by/oslo/places/uranienborg_kirke.json \
            data/places/by/oslo/places/vikaterrassen.json \
            data/places/by/oslo/rudolf_nilsens_plass.json \
            data/places/by/oslo/snippen_lekepark.json \
            data/places/by/oslo/sofienbergparken.json \
            data/places/by/oslo/torshovdalen.json \
            reports/oslo-place-description-scope-audit-2026-07-26.json \
            reports/oslo-place-description-scope-audit-2026-07-26.md \
            reports/place-description-revision-protocol.md
          test "$(git diff --cached --name-only | wc -l)" -eq 11
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish Oslo by place description queue"
          git push origin HEAD:agent/oslo-popup-v4-batch-13-finish-by
