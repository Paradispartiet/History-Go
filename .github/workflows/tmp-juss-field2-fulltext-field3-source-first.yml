name: TEMP Juss field 2 fulltext field 3 source-first

on:
  push:
    branches:
      - agent/fagverk-juss-rettsvitenskap-field-2-fulltext-field-3-source-first-20260901

permissions:
  contents: write

concurrency:
  group: tmp-juss-field2-fulltext-field3-source-first
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.head_commit.message == 'Run fail-closed Juss field 2 fulltext field 3 source-first'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Juss branch
        uses: actions/checkout@v4
        with:
          ref: agent/fagverk-juss-rettsvitenskap-field-2-fulltext-field-3-source-first-20260901
          fetch-depth: 1
          show-progress: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Correct Field 3 habilitet boundary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='scripts/tmp-materialize-juss-field2-fulltext-field3-source-first.mjs';
          let text=fs.readFileSync(file,'utf8');
          const from="boundary:'Habilitet vurderes etter lovens konkrete tilknytningsregler og den generelle tillitsnormen. Ubehag, uenighet eller tidligere faglig kontakt er ikke automatisk inhabilitet; relevante relasjoner og mulige fordeler eller ulemper må vurderes konkret.'";
          const to="boundary:'Habilitet og upartiskhet vurderes etter lovens konkrete tilknytningsregler og den generelle tillitsnormen. Ubehag, uenighet eller tidligere faglig kontakt er ikke automatisk inhabilitet; relevante relasjoner og mulige fordeler eller ulemper må vurderes konkret.'";
          if(!text.includes(from)&&!text.includes(to)) throw new Error('Unexpected Field 3 habilitet boundary');
          if(text.includes(from)) text=text.replace(from,to);
          fs.writeFileSync(file,text);
          NODE

      - name: Syntax-check TEMP generator
        run: node --check scripts/tmp-materialize-juss-field2-fulltext-field3-source-first.mjs

      - name: Generate candidate state or capture exact failure
        run: |
          set +e
          node scripts/tmp-materialize-juss-field2-fulltext-field3-source-first.mjs > /tmp/juss-generator.log 2>&1
          status=$?
          set -e
          cat /tmp/juss-generator.log
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd
            mkdir -p reports/fagverk
            tail -n 120 /tmp/juss-generator.log > reports/fagverk/tmp-juss-field2-field3-generator-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add reports/fagverk/tmp-juss-field2-field3-generator-error.txt
            if ! git diff --cached --quiet; then
              git commit -m 'Capture Juss field 2 field 3 generator error'
              git push origin HEAD:agent/fagverk-juss-rettsvitenskap-field-2-fulltext-field-3-source-first-20260901
            fi
            exit "$status"
          fi

      - name: Syntax-check generated Juss gates
        run: |
          node --check scripts/audit-juss-rettsvitenskap-constitutional-law-separation-powers-constitutional-review-fulltext-v1.mjs
          node --check scripts/materialize-juss-rettsvitenskap-constitutional-law-separation-powers-constitutional-review-fulltext-v1.mjs
          node --check scripts/brief-juss-rettsvitenskap-administrative-law-public-authority-procedure-appeal-sources-v1.mjs
          node --check scripts/audit-juss-rettsvitenskap-reconciliation-v1.mjs
          node --check tests/juss-rettsvitenskap-constitutional-law-separation-powers-constitutional-review-fulltext-v1.test.mjs
          node --check tests/juss-rettsvitenskap-administrative-law-public-authority-procedure-appeal-source-brief-v1.test.mjs
          node --check tests/juss-rettsvitenskap-reconciliation-v1.test.mjs

      - name: Run isolated Field 2 and Field 3 gates
        run: |
          node scripts/brief-juss-rettsvitenskap-constitutional-law-separation-powers-constitutional-review-sources-v1.mjs
          node scripts/audit-juss-rettsvitenskap-constitutional-law-separation-powers-constitutional-review-fulltext-v1.mjs
          node scripts/materialize-juss-rettsvitenskap-constitutional-law-separation-powers-constitutional-review-fulltext-v1.mjs
          node scripts/brief-juss-rettsvitenskap-administrative-law-public-authority-procedure-appeal-sources-v1.mjs
          node --test tests/juss-rettsvitenskap-constitutional-law-separation-powers-constitutional-review-source-brief-v1.test.mjs tests/juss-rettsvitenskap-constitutional-law-separation-powers-constitutional-review-fulltext-v1.test.mjs tests/juss-rettsvitenskap-administrative-law-public-authority-procedure-appeal-source-brief-v1.test.mjs tests/juss-rettsvitenskap-reconciliation-v1.test.mjs

      - name: Create local candidate checkpoint for deterministic CI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/tmp-juss-field2-fulltext-field3-source-first.yml
          if git diff --cached --quiet; then
            echo 'No candidate changes generated before deterministic checkpoint' >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing workflow mutation in local candidate checkpoint' >&2
            exit 1
          fi
          git commit -m 'TEMP local Juss field 2 field 3 candidate checkpoint'

      - name: Run registry-driven Juss and shared Fagverk gates
        run: node scripts/run-fagverk-domain-ci-v1.mjs --subject juss_rettsvitenskap

      - name: Verify canonical progress and no premature completion
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const reg=JSON.parse(fs.readFileSync('data/fag/politikk/juss_rettsvitenskap/production_registry_v1.json','utf8'));
          const category=JSON.parse(fs.readFileSync('data/categories/category_contract.json','utf8'));
          const sub=category.canonicalSubcategories.politikk.find(row=>row.id==='juss_rettsvitenskap');
          if(reg.progress.materializedDomains!==2||reg.progress.totalDomains!==12||reg.progress.strictCompletionProven!==false||reg.materialized.length!==2) throw new Error('Expected canonical Juss 2/12 state');
          if(reg.next_gate!=='administrative_law_public_authority_procedure_appeal_fulltext') throw new Error('Expected Field 3 fulltext as next gate');
          if(reg.materialized[1]?.domain_id!=='statsrett_grunnlov_maktfordeling_konstitusjonell_kontroll') throw new Error('Expected Statsrett as materialized Field 2');
          if(sub?.status!=='expansion_planned') throw new Error('Juss category completed prematurely');
          NODE
          git diff --check

      - name: Remove TEMP production surfaces
        run: |
          rm scripts/tmp-materialize-juss-field2-fulltext-field3-source-first.mjs
          rm -f reports/fagverk/tmp-juss-field2-field3-generator-error.txt
          test ! -e scripts/tmp-materialize-juss-field2-fulltext-field3-source-first.mjs
          test ! -e reports/fagverk/tmp-juss-field2-field3-generator-error.txt
          test -e .github/workflows/tmp-juss-field2-fulltext-field3-source-first.yml

      - name: Finalize and push permanent candidate only after all gates pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/tmp-juss-field2-fulltext-field3-source-first.yml
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing workflow mutation from Actions token' >&2
            exit 1
          fi
          git commit --amend -m 'Materialize Juss field 2 and prepare field 3 source-first'
          git push origin HEAD:agent/fagverk-juss-rettsvitenskap-field-2-fulltext-field-3-source-first-20260901
