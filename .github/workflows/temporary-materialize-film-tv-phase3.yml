name: Temporary materialize Film og TV phase 3

on:
  pull_request:
    paths:
      - "tools/materialize-film-tv-phase3-once.mjs"
      - ".github/workflows/temporary-materialize-film-tv-phase3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Materialize and validate Film og TV
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set +e
          node tools/materialize-film-tv-phase3-once.mjs > /tmp/film-tv-materialize.log 2>&1
          status=$?
          cat /tmp/film-tv-materialize.log
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd
            mkdir -p reports/fagverk
            cp /tmp/film-tv-materialize.log reports/fagverk/film-tv-phase3-latest-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add reports/fagverk/film-tv-phase3-latest-error.txt
            git diff --cached --check
            git commit -m 'Capture Film og TV Phase 3 materialization failure'
            git push origin "HEAD:${HEAD_BRANCH}"
            exit "$status"
          fi
      - name: Remove one-shot materializer and diagnostics
        run: |
          rm tools/materialize-film-tv-phase3-once.mjs
          rm .github/workflows/temporary-materialize-film-tv-phase3.yml
          rm -f reports/fagverk/film-tv-phase3-latest-error.txt
      - name: Commit materialized tree
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Materialiser Film og TV Fase 3'
          git push origin "HEAD:${HEAD_BRANCH}"
