name: Rockefeller v1 quiz Knowledge synchronization
on:
  pull_request:
    paths:
      - "data/quiz/musikk/rockefeller_sets_merged.json"
      - "data/quizcards/musikk/topp10_musikk_oslo_v1_batch01.json"
      - "data/knowledge/knowledge_units.generated.json"
      - "data/knowledge/concepts.generated.json"
      - "tests/rockefeller-quiz-v1-quality-20261101.test.mjs"
      - ".github/workflows/rockefeller-v1-quiz-knowledge.yml"
permissions:
  contents: read
concurrency:
  group: rockefeller-v1-quiz-knowledge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify generated Knowledge matches reviewed quiz
        run: npm run knowledge:canonical:check
      - name: Validate Rockefeller quiz and QuizCard
        run: node --test tests/rockefeller-quiz-v1-quality-20261101.test.mjs
