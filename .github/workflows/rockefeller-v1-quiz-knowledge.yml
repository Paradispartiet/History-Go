name: Rockefeller v1 quiz Knowledge synchronization
on:
  pull_request:
    paths:
      - "data/quiz/musikk/rockefeller_sets_merged.json"
      - "data/quizcards/musikk/topp10_musikk_oslo_v1_batch01.json"
      - "data/knowledge/knowledge_units.generated.json"
      - "data/knowledge/concepts.generated.json"
      - "tests/rockefeller-quiz-v1-quality-20261101.test.mjs"
      - ".github/workflows/rockefeller-v1-quiz-knowledge.yml"
permissions:
  contents: write
concurrency:
  group: rockefeller-v1-quiz-knowledge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  synchronize-once:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Paradispartiet'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run knowledge:canonical:write
      - run: node --test tests/rockefeller-quiz-v1-quality-20261101.test.mjs
      - name: Commit only generated Knowledge, not large diagnostic reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u data/knowledge data/quiz/musikk/rockefeller_sets_merged.json
          if ! git diff --cached --quiet; then
            git commit -m "Rockefeller: regenerate Knowledge after final editorial cleanup"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
