name: Oslo kultureiendommer batch 9 coordinate lookup

on:
  push:
    branches:
      - agent/oslo-kultureiendommer-batch-9

permissions:
  contents: write

jobs:
  coordinates:
    if: github.event.head_commit.message != 'Save Oslo kultureiendommer batch 9 coordinates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-kultureiendommer-batch-9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Find and save Geonorge address candidates
        run: |
          mkdir -p reports/oslo-kultureiendommer-batch-9/coordinates
          npm run places:coords:find:address -- --address "Kjelsåsveien 151 0491 Oslo" \
            | tee reports/oslo-kultureiendommer-batch-9/coordinates/frysja-33.json
          curl --fail --silent --show-error \
            "https://ws.geonorge.no/adresser/v1/sok?sok=Kjels%C3%A5sveien%20151%200491%20Oslo" \
            | tee reports/oslo-kultureiendommer-batch-9/coordinates/frysja-33-151-raw.json
      - name: Commit coordinate reports
        run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add reports/oslo-kultureiendommer-batch-9/coordinates
          if git diff --cached --quiet; then
            echo "No coordinate report changes."
          else
            git commit -m "Save Oslo kultureiendommer batch 9 coordinates"
            git push
          fi
