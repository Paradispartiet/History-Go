name: TEMP Helse public health source writeback

on:
  pull_request:
    paths:
      - 'scripts/brief-helse-public-health-sources-v1.mjs'
      - 'tests/helse-public-health-source-brief-v1.test.mjs'
      - '.github/workflows/TEMP-fagverk-helse-public-health-source-writeback.yml'

permissions:
  contents: write

jobs:
  writeback:
    if: github.head_ref == 'agent/helse-public-health-source-content'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Materialize canonical Folkehelse source brief
        shell: bash
        env:
          BRIEF_GZ_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os, pathlib
          raw = gzip.decompress(base64.b64decode(os.environ['BRIEF_GZ_B64']))
          path = pathlib.Path('data/fag/helse/public_health_source_claim_brief_v1.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(raw)
          PY
      - name: Generate locked audit report
        run: node scripts/brief-helse-public-health-sources-v1.mjs --write
      - name: Run targeted source-first tests
        run: node --test tests/helse-public-health-source-brief-v1.test.mjs tests/helse-cumulative-progress-v1.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-general-engine.test.mjs tests/fagverk-release-manifest.test.mjs
      - name: Commit only generated source artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/fag/helse/public_health_source_claim_brief_v1.json reports/fagverk/helse-public-health-source-brief-v1-audit.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Materialize public health source brief'
          git push origin HEAD:${{ github.head_ref }}
