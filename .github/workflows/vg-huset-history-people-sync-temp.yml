name: VG-huset historical People and collections sync (temporary)
on:
  push:
    branches:
      - agent/vg-huset-source-preflight-20261009
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/agent/vg-huset-source-preflight-20261009'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vg-huset-source-preflight-20261009
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate actual canonical derived artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm run civication:history-people:build
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
          npm run audit:people-of-places
          npm run places:index:build
          npm run place-open:build
          npm run civication:history-people:check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          npm run places:index:check
          npm run place-open:check
          node --test tests/vg-huset-collections.test.mjs
      - name: Verify only documented generated files were touched
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/vg-derived-diff.txt
          cat /tmp/vg-derived-diff.txt
          node <<'NODE'
          const fs=require("node:fs");
          const files=fs.readFileSync("/tmp/vg-derived-diff.txt","utf8").split("\n").filter(Boolean);
          const allowed=[
            /^data\/Civication\/historyPeople_index\.json$/,
            /^data\/Civication\/scenarioPeople_index\.json$/,
            /^data\/Civication\/scenarioPeople\/generated\/[^/]+\.json$/,
            /^data\/runtime\/people-all\/part-\d+\.json$/,
            /^data\/runtime\/place-open\/vg_huset\.json$/,
            /^data\/places\/places_index\.json$/,
            /^reports\/people-of-places-status\.(json|md)$/
          ];
          const bad=files.filter(file=>!allowed.some(re=>re.test(file)));
          if(bad.length) throw new Error("Unexpected derived data mutation: "+bad.join(", "));
          if(!files.includes("data/runtime/place-open/vg_huset.json"))throw new Error("VG-huset runtime update missing");
          if(!files.includes("data/Civication/historyPeople_index.json"))throw new Error("History People update missing");
          NODE
      - name: Commit derived artifacts and clean one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/historyPeople_index.json data/Civication/scenarioPeople_index.json data/Civication/scenarioPeople/generated data/runtime/people-all data/runtime/place-open/vg_huset.json data/places/places_index.json reports/people-of-places-status.json reports/people-of-places-status.md
          git rm .github/workflows/vg-huset-publication-photo-temp.yml .github/workflows/vg-huset-history-people-sync-temp.yml
          git diff --cached --stat
          git commit -m "Sync VG-huset 1994 People and four collections and retire temporary workflows"
          git push origin HEAD:refs/heads/agent/vg-huset-source-preflight-20261009
