name: TEMP Media editorial leadership materializer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rollout branch
        uses: actions/checkout@v4
        with:
          ref: agent/civication-media-redaksjonell-ledelse-rollout
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize canonical projections
        run: |
          node scripts/build-civication-scene-registry.mjs --write
          node scripts/audit-civication-career-gameplay.mjs --write

      - name: Verify focused editorial leadership rollout
        run: |
          node scripts/build-civication-scene-registry.mjs --check
          node scripts/audit-civication-career-gameplay.mjs --check
          node tests/civication-media-redaksjonell-ledelse-rollout-playability.test.js
          node tests/civication-media-redaksjon-rollout-playability.test.js
          node tests/civication-film-tv-kurator-rollout-playability.test.js
          node tests/civication-compiled-scene-registry.test.js
          node tests/civication-compiled-scene-registry-parity.test.js
          node tests/civication-career-rolemodel-ownership.test.js
          git diff --check

      - name: Verify full Civication regression suite
        run: npm run test:civication

      - name: Commit generated projections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/Civication/compiledSceneRegistryV1.json data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md
          git diff --cached --check
          git status --short
          git commit -m "Materialize Media editorial leadership rollout"
          git push origin HEAD:agent/civication-media-redaksjonell-ledelse-rollout
