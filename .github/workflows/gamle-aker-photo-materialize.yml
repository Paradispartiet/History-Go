name: Regenerate Gamle Aker portrait place payloads

on:
  push:
    branches:
      - history-go/gamle-aker-quizcard-v1-20261021
    paths:
      - .github/workflows/gamle-aker-photo-materialize.yml

permissions:
  contents: write
concurrency:
  group: gamle-aker-photo-payloads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate canonical derived indexes and place-open payload
        shell: bash
        run: |
          set -euo pipefail
          npm run places:index:build
          npm run place-open:build
          npm run epoker:places:build
          npm run place-open:check
          npm run epoker:places:check
      - name: Verify portrait is in derived app records
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'), assert=require('node:assert/strict');
          const id='gamle_aker_kirke', expected='bilder/places/gamle_aker_kirke_front_nemo_bis_2019.webp';
          const src=JSON.parse(fs.readFileSync('data/places/historie/oslo/places_historie/'+id+'.json','utf8'));
          const runtime=JSON.parse(fs.readFileSync('data/runtime/place-open/'+id+'.json','utf8')).place;
          const index=JSON.parse(fs.readFileSync('data/places/places_index.json','utf8'));
          const items=Array.isArray(index)?index:Array.isArray(index.places)?index.places:[];
          const found=items.find(p=>p.id===id);
          for(const [name,place] of [['canonical',src],['place-open',runtime],['places-index',found]]){
            assert.ok(place,name+' missing');
            assert.equal(place.frontImage,expected,name+' wrong frontImage');
          }
          assert.ok(fs.statSync(expected).size>10000);
          console.log('Gamle Aker independent portrait linked throughout runtime');
          NODE
      - name: Commit only derived data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/places_index.json
          git add data/runtime/place-open/gamle_aker_kirke.json
          git add data/epoker/epoke-place-index.json
          if git diff --cached --quiet; then exit 0; fi
          echo 'Regenerated:'
          git diff --cached --name-only
          git commit -m 'build(history): synchronize Gamle Aker portrait into place-open and indexes'
          git push origin 'HEAD:history-go/gamle-aker-quizcard-v1-20261021'
