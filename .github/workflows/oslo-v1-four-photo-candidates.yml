name: Oslo four photo editorial candidates

on:
  push:
    branches:
      - content/oslo-four-photo-candidates-20261018
    paths:
      - scripts/produce-oslo-photo-review-candidates-20261018.py
      - data/places/production-tiers/oslo-v1-photo-candidates-20261018.json
      - .github/workflows/oslo-v1-four-photo-candidates.yml

permissions:
  contents: write

jobs:
  candidates:
    name: Produce four licensed photo candidates
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image encoder
        run: python -m pip install Pillow==11.3.0
      - name: Materialize Commons candidates
        run: python scripts/produce-oslo-photo-review-candidates-20261018.py
      - name: Verify actual candidate assets and manifest pairing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path(".")
          manifest=json.loads(Path("data/places/production-tiers/oslo-v1-photo-candidates-20261018.json").read_text())
          report=json.loads(Path("reports/oslo-v1-photo-candidates-20261018/report.json").read_text())
          assert report["counts"]["produced"]+report["counts"]["held"]==4
          for item in report["produced"]:
              for key,size in manifest["outputs"].items():
                  with Image.open(root/item["output"][key]) as photo:
                      assert photo.format=="WEBP" and list(photo.size)==size
              assert item["license"] and item["creator_credit"]
          assert report["counts"]["live_images_replaced"]==0
          print("Photos created:",len(report["produced"]),"Held:",len(report["held"]))
          PY
      - name: Commit candidate images to review branch (never main)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/places/candidates/oslo-v1-20261018 reports/oslo-v1-photo-candidates-20261018
          if git diff --cached --quiet; then
            echo "No candidate output to commit"
            exit 0
          fi
          git commit -m "assets(oslo): four separately cropped Commons editorial candidates"
          git push origin HEAD:content/oslo-four-photo-candidates-20261018
      - name: Upload editorial preview
        uses: actions/upload-artifact@v4
        with:
          name: oslo-photo-candidate-review
          path: |
            bilder/places/candidates/oslo-v1-20261018/
            reports/oslo-v1-photo-candidates-20261018/
          if-no-files-found: error
