name: Register Korketrekkeren quiz

on:
  push:
    paths:
      - ".github/workflows/register-korketrekkeren.yml"

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register quiz set and validate manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/quiz/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          sets = data.get("sets")
          if not isinstance(sets, list):
              raise SystemExit("manifest sets is not a list")

          target_id = "korketrekkeren"
          file_path = "data/quiz/sport/korketrekkeren_sets.json"
          matches = [item for item in sets if item.get("targetId") == target_id]

          if len(matches) > 1:
              raise SystemExit("duplicate Korketrekkeren manifest entries")
          if matches:
              if matches[0].get("file") != file_path:
                  raise SystemExit("Korketrekkeren points to an unexpected file")
          else:
              entry = {"targetId": target_id, "file": file_path}
              insert_at = next(
                  (index + 1 for index, item in enumerate(sets)
                   if item.get("targetId") == "daelenenga_idrettspark"),
                  len(sets),
              )
              sets.insert(insert_at, entry)

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          quiz = json.loads(Path(file_path).read_text(encoding="utf-8"))
          questions = [q for block in quiz.get("sets", []) for q in block.get("questions", [])]
          if quiz.get("targetId") != target_id:
              raise SystemExit("quiz targetId mismatch")
          if len(quiz.get("sets", [])) != 2 or len(questions) != 10:
              raise SystemExit("expected 2 sets and 10 questions")
          if len({q.get("id") for q in questions}) != len(questions):
              raise SystemExit("duplicate question ids")
          if any(q.get("options", [])[q.get("answerIndex")] != q.get("answer") for q in questions):
              raise SystemExit("answerIndex mismatch")
          PY

      - name: Commit manifest and remove one-time workflow
        run: |
          rm .github/workflows/register-korketrekkeren.yml
          git config user.name "History Go Data Production"
          git config user.email "history-go-data@users.noreply.github.com"
          git add data/quiz/manifest.json .github/workflows/register-korketrekkeren.yml
          git commit -m "Register Korketrekkeren quiz set"
          git push
