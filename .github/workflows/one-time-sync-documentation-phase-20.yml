name: One-time sync documentation phase 20

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-sync-documentation-phase-20.yml

permissions:
  contents: write

jobs:
  sync-and-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-governance-phase-20-historical-routes
          fetch-depth: 0

      - name: Merge current main into documentation branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:agent/documentation-governance-phase-20-historical-routes

      - name: Remove one-time sync workflow from main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm .github/workflows/one-time-sync-documentation-phase-20.yml
          git add .github/workflows/one-time-sync-documentation-phase-20.yml
          git commit -m "Fjern engangssynk for dokumentasjonsfase 20"
          git push origin HEAD:main
