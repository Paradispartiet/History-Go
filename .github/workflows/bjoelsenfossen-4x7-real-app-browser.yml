name: Bjølsenfossen 4x7 real-app Playwright acceptance
on:
  push:
    branches:
      - work/oslo-akerselva-v1-bolk-20261116
    paths:
      - ".github/workflows/bjoelsenfossen-4x7-real-app-browser.yml"
  pull_request:
    paths:
      - "data/quiz/historie/bjoelsenfossen_sets.json"
      - "data/quiz/manifest.json"
      - "data/quizcards/historie/bjoelsenfossen_quizcard_v1.json"
      - "data/quizcards/historie/manifest.json"
      - "data/knowledge/preserved_quiz_sources/bjoelsenfossen_legacy_20261121.json"
      - "data/places/natur/oslo/places_oslo_natur_akerselvarute/bjoelsenfossen.json"
      - "data/runtime/place-open/bjoelsenfossen.json"
      - "tests/bjoelsenfossen-4x7-real-app-browser.mjs"
      - ".github/workflows/bjoelsenfossen-4x7-real-app-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies and build actual app source data
        run: |
          npm ci --no-audit --no-fund
          npm run places:index:build
          npm run place-open:check
          npm run knowledge:canonical:check
          node --test tests/bjoelsenfossen-4x7-migration.test.mjs
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Open actual Bjølsenfossen PlaceCard, quizcard and fullquiz in phone/iPad/desktop
        run: node tests/bjoelsenfossen-4x7-real-app-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bjoelsenfossen-4x7-real-app-screenshots
          path: artifacts/bjoelsenfossen-4x7-real-app/
          if-no-files-found: warn
          retention-days: 14
