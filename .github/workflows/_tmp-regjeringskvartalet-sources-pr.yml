name: Temporary Regjeringskvartalet sources PR runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  produce:
    if: github.head_ref == 'production/regjeringskvartalet-phase-7-sources'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/regjeringskvartalet-phase-7-sources
          fetch-depth: 0

      - name: Execute embedded phase 7 producer
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/_tmp-regjeringskvartalet-sources.yml').read_text(encoding='utf-8')
          opening = "          python - <<'PY'\n"
          closing = "\n          PY\n"
          start = workflow.index(opening) + len(opening)
          end = workflow.index(closing, start)
          lines = workflow[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, 'regjeringskvartalet_phase_7.py', 'exec'))
          PY

      - name: Validate phase 7
        run: node --test tests/regjeringskvartalet-before-after-phase.test.mjs tests/regjeringskvartalet-news-phase.test.mjs tests/regjeringskvartalet-reading-phase.test.mjs tests/regjeringskvartalet-sources-phase.test.mjs

      - name: Remove temporary production files
        run: |
          rm .github/workflows/_tmp-regjeringskvartalet-sources.yml
          rm .github/workflows/_tmp-regjeringskvartalet-sources-pr.yml
          rm .github/_tmp-trigger-regjeringskvartalet-sources.txt

      - name: Commit phase 7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bygg Kilder for Regjeringskvartalet"
          git push origin HEAD:production/regjeringskvartalet-phase-7-sources
