name: Oslo havnefront 06 — Fagverk source audit and real-app QA (one-shot)
on:
  push:
    branches:
      - research/oslo-havnefront-bolk06-tekst-20261109
    paths:
      - .github/workflows/oslo-havnefront06-fagverk-once.yml

permissions:
  contents: write
concurrency:
  group: oslo-havnefront06-fagverk-once
  cancel-in-progress: false

jobs:
  validate:
    name: Curate 3 source-bound Fagverk pages only after static and browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout scoped branch
        uses: actions/checkout@v4
        with:
          ref: research/oslo-havnefront-bolk06-tekst-20261109
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned app and test dependencies
        run: npm ci --no-audit --no-fund
      - name: Stage authored content as curated, with canonical chapter checks
        run: node scripts/promote-oslo-havnefront06-fagverk.mjs
      - name: Rebuild Fagverk coverage and release materialization
        run: |
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/fagverk-place-pages.test.mjs tests/fagverk-place-substance-audit.test.mjs tests/fagverk-place-rendering.test.mjs
      - name: Rebuild canonical Place index and app Place-open payloads
        run: |
          npm run places:index:build
          npm run place-open:build
          npm run places:index:check
          npm run place-open:check
      - name: Choose browser from runner or install pinned Chromium
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$CHROME_BIN" ]; then
            echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
            "$CHROME_BIN" --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Actual browser QA for all 3 Fagverk pages at mobile and desktop size
        run: node tests/oslo-havnefront06-fagverk-browser.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oslo-havnefront06-fagverk-browser-evidence
          path: artifacts/oslo-havnefront06-fagverk/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit only scoped Fagverk files and generated registry, then self-delete
        shell: bash
        run: |
          set -euo pipefail
          git add data/places/kunst/oslo/places_kunst/astrup_fearnley.json
          git add data/places/naeringsliv/oslo/places_naeringsliv_oslo_oppdag_kvadraturen_batch_03/amerikalinjen.json
          git add data/places/natur/oslo/places_oslo_natur_akerselvarute/akerselva_utlop_bjorvika.json
          git add data/fagverk/fagverk_registry.json
          git add data/fagverk/fagverk_release.json
          git add reports/fagverk/fagverk-place-page-coverage-v2.json
          git add data/places/places_index.json
          git add data/runtime/place-open/astrup_fearnley.json
          git add data/runtime/place-open/amerikalinjen.json
          git add data/runtime/place-open/akerselva_utlop_bjorvika.json
          git rm -- .github/workflows/oslo-havnefront06-fagverk-once.yml
          git diff --cached --name-only | while IFS= read -r f; do
            case "$f" in
              data/places/kunst/oslo/places_kunst/astrup_fearnley.json|data/places/naeringsliv/oslo/places_naeringsliv_oslo_oppdag_kvadraturen_batch_03/amerikalinjen.json|data/places/natur/oslo/places_oslo_natur_akerselvarute/akerselva_utlop_bjorvika.json|data/fagverk/fagverk_registry.json|data/fagverk/fagverk_release.json|reports/fagverk/fagverk-place-page-coverage-v2.json|data/places/places_index.json|data/runtime/place-open/astrup_fearnley.json|data/runtime/place-open/amerikalinjen.json|data/runtime/place-open/akerselva_utlop_bjorvika.json|.github/workflows/oslo-havnefront06-fagverk-once.yml) ;;
              *) echo "UNEXPECTED_STAGED_FILE: $f" >&2;exit 1;;
            esac
          done
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Curate three Oslo harborfront Fagverk pages after browser QA"
          git push origin HEAD:research/oslo-havnefront-bolk06-tekst-20261109
