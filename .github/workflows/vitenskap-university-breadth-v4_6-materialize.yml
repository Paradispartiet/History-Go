name: Materialize Vitenskap university breadth v4.6

on:
  push:
    branches:
      - agent/vitenskap-university-breadth-reconciliation
    paths:
      - 'scripts/materialize-vitenskap-university-breadth-v4_6.mjs'
      - '.github/workflows/vitenskap-university-breadth-v4_6-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitenskap-university-breadth-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate materializer syntax
        run: node --check scripts/materialize-vitenskap-university-breadth-v4_6.mjs
      - name: Materialize canonical v4.6 inventory
        run: node scripts/materialize-vitenskap-university-breadth-v4_6.mjs
      - name: Validate generated JSON and invariants
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const e = read('data/fag/vitenskap/emner_vitenskap_canonical_v4_6.json');
          const m = read('data/fag/vitenskap/emnemapping_vitenskap_canonical_v4_6.json');
          const f = read('data/fag/vitenskap/fagkart_vitenskap_canonical_v4_6.json');
          const p = read('data/fag/vitenskap/vitenskappensum_canonical_v4_6.json');
          const methods = read('data/fag/vitenskap/methods_vitenskap_canonical_v4_6.json');
          const r = read('data/fag/vitenskap/vitenskap_university_readiness_v1.json');
          const manifest = read('data/fag/fag_manifest.json');
          const assert = (c, msg) => { if (!c) throw new Error(msg); };
          assert(e.length === 117, 'emner != 117');
          assert(m.length === 117, 'mappinger != 117');
          assert(f.categories.length === 6, 'fagkart domener != 6');
          assert(f.categories.flatMap(x => x.topic_hooks || []).length === 64, 'hooks != 64');
          assert(methods.methods.length === 84, 'metoder != 84');
          assert(p.summary.domain_count === 6 && p.summary.emne_count === 117 && p.summary.mapping_count === 117 && p.summary.topic_hook_count === 64, 'pensum summary mismatch');
          assert(r.complete_ready === false, 'complete_ready må være false');
          assert(r.blocking_gaps.length === 0, 'inventory blocking gaps skal være reconcilet');
          assert(r.editorial_blockers.length === 4, 'fire breadth-familier skal fortsatt være editorial blockers');
          assert(manifest.vitenskap.canonicalModelVersion === '4.6', 'manifest er ikke v4.6');
          assert(manifest.vitenskap.specializations.teknologi.canonicalParentSubject === 'vitenskap', 'Teknologi er ikke nested');
          NODE
          git diff --check
      - name: Commit compiled v4.6 inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/fag/vitenskap/emner_vitenskap_canonical_v4_6.json \
            data/fag/vitenskap/emnemapping_vitenskap_canonical_v4_6.json \
            data/fag/vitenskap/fagkart_vitenskap_canonical_v4_6.json \
            data/fag/vitenskap/methods_vitenskap_canonical_v4_6.json \
            data/fag/vitenskap/vitenskappensum_canonical_v4_6.json \
            data/fag/fag_manifest.json \
            data/fag/vitenskap/quiz_generator_rules_vitenskap_v5_1_source_priority_patch.json \
            data/fag/vitenskap/vitenskap_university_readiness_v1.json \
            data/fagverk/subject_status.json \
            data/fagverk/fagverk_registry.json
          git commit -m 'Materialize Vitenskap canonical university breadth v4.6'
          git push origin HEAD:agent/vitenskap-university-breadth-reconciliation
