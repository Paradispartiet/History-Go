name: Materialize Vitenskap university breadth v4.6

on:
  push:
    branches:
      - agent/vitenskap-university-breadth-reconciliation
    paths:
      - 'scripts/materialize-vitenskap-university-breadth-v4_6.mjs'
      - '.github/workflows/vitenskap-university-breadth-v4_6-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitenskap-university-breadth-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconcile one-shot materializer with canonical mapping schema
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'scripts/materialize-vitenskap-university-breadth-v4_6.mjs';
          let source = fs.readFileSync(file, 'utf8');

          const flat = "const newTopics = spec.families.flatMap((family) => family.topics.map((topic) => ({ ...topic, family })));";
          const wrapped = "const newTopics = spec.families.flatMap((family) => family.topics.map((topic) => ({ topic, family })));";
          if (source.includes(flat)) source = source.replace(flat, wrapped);
          if (!source.includes(wrapped)) throw new Error('Fant ikke forventet topic-family-konstruksjon');

          const start = source.indexOf('function buildMapping(topic, family) {');
          const end = source.indexOf('\nfunction buildHook(family) {', start);
          if (start < 0 || end < 0) throw new Error('Fant ikke buildMapping-blokken');
          const replacement = `function buildMapping(topic, family) {
  const domain = pensumDomainById.get(family.target_domain_id);
  const template = mappings.find((row) => (row.mappings || []).some((mapping) => mapping.fagkart_kategori === family.target_domain_id));
  assert(template, \`Mangler mapping-template for \${family.target_domain_id}\`);
  const record = clone(template);
  const sourceMapping = template.mappings.find((mapping) => mapping.fagkart_kategori === family.target_domain_id) || template.mappings[0];
  const primary = clone(sourceMapping);
  record.emne_id = topic.id;
  record.title = topic.title;
  primary.fagkart_kategori = family.target_domain_id;
  primary.fagkart_kategori_tittel = domain.label;
  primary.topic_hook = family.hook.id;
  primary.topic_hook_tittel = family.hook.title;
  primary.mapping_tier = 'primary';
  primary.priority_score = 10;
  primary.tenkere = [];
  primary.thinker_ids = [];
  primary.norwegian_thinker_ids = [];
  primary.norwegian_thinkers = [];
  primary.comparison_pairs = [];
  primary.recommended_oslo_cases = family.hook.recommended_oslo_cases;
  primary.recommended_method_ids = topic.method_ids;
  primary.generator_constraints = {
    ...(primary.generator_constraints || {}),
    require_concrete_institution_method_model_instrument_or_discovery: true,
    require_external_claim_basis: true,
    do_not_generate_from_hook_label_only: true,
    do_not_generate_from_emne_label_only: true,
    required_emne_prefix: 'em_vit_'
  };
  record.mappings = [primary];
  record.mapping_status = 'tiered+canonical';
  record.primary_hooks = [family.hook.id];
  record.secondary_hooks = [];
  record.reserve_hooks = [];
  record.canonical_thinkers = [];
  record.canonical_thinker_ids = [];
  record.norwegian_thinker_ids = [];
  record.norwegian_thinkers = [];
  record.theory_diversity_score = 0;
  record.has_norwegian_theory_path = false;
  record.recommended_oslo_cases = family.hook.recommended_oslo_cases;
  record.recommended_method_ids = topic.method_ids;
  record.canonical_status = 'canonical';
  record.registry_version = 'vitenskappensum_v4_6';
  record.case_gate_required = true;
  record.method_gate_required = true;
  record.source_anchor_required = true;
  record.external_claim_basis_required = true;
  record.institution_method_model_instrument_or_discovery_anchor_required = true;
  record.breadth_reconciliation = {
    coverage_family_id: family.coverage_family_id,
    hook_id: family.hook.id,
    spec_version: spec.version
  };
  return record;
}
`;
          source = source.slice(0, start) + replacement + source.slice(end);
          fs.writeFileSync(file, source);
          NODE
      - name: Validate materializer syntax
        run: node --check scripts/materialize-vitenskap-university-breadth-v4_6.mjs
      - name: Materialize canonical v4.6 inventory
        shell: bash
        run: |
          set +e
          output=$(node scripts/materialize-vitenskap-university-breadth-v4_6.mjs 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(printf '%s' "$output" | tail -n 16 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error file=scripts/materialize-vitenskap-university-breadth-v4_6.mjs,title=Vitenskap v4.6 materializer failed::$message"
            printf '%s\n' "$output"
            exit "$status"
          fi
          printf '%s\n' "$output"
      - name: Validate generated JSON and invariants
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const e = read('data/fag/vitenskap/emner_vitenskap_canonical_v4_6.json');
          const m = read('data/fag/vitenskap/emnemapping_vitenskap_canonical_v4_6.json');
          const f = read('data/fag/vitenskap/fagkart_vitenskap_canonical_v4_6.json');
          const p = read('data/fag/vitenskap/vitenskappensum_canonical_v4_6.json');
          const methods = read('data/fag/vitenskap/methods_vitenskap_canonical_v4_6.json');
          const r = read('data/fag/vitenskap/vitenskap_university_readiness_v1.json');
          const manifest = read('data/fag/fag_manifest.json');
          const assert = (c, msg) => { if (!c) throw new Error(msg); };
          assert(e.length === 117, 'emner != 117');
          assert(m.length === 117, 'mappinger != 117');
          assert(f.categories.length === 6, 'fagkart domener != 6');
          assert(f.categories.flatMap(x => x.topic_hooks || []).length === 64, 'hooks != 64');
          assert(methods.methods.length === 84, 'metoder != 84');
          assert(p.summary.domain_count === 6 && p.summary.emne_count === 117 && p.summary.mapping_count === 117 && p.summary.topic_hook_count === 64, 'pensum summary mismatch');
          assert(r.complete_ready === false, 'complete_ready må være false');
          assert(r.blocking_gaps.length === 0, 'inventory blocking gaps skal være reconcilet');
          assert(r.editorial_blockers.length === 4, 'fire breadth-familier skal fortsatt være editorial blockers');
          assert(manifest.vitenskap.canonicalModelVersion === '4.6', 'manifest er ikke v4.6');
          assert(manifest.vitenskap.specializations.teknologi.canonicalParentSubject === 'vitenskap', 'Teknologi er ikke nested');
          for (const row of m.slice(93)) {
            assert(row.mappings?.length === 1, `${row.emne_id} skal ha én breadth primary mapping`);
            assert(row.mappings[0].fagkart_kategori, `${row.emne_id} mangler fagkart_kategori`);
            assert(row.mappings[0].topic_hook, `${row.emne_id} mangler topic_hook`);
            assert(row.primary_hooks?.[0] === row.mappings[0].topic_hook, `${row.emne_id} har inkonsistent primary hook`);
          }
          NODE
          git diff --check
      - name: Commit compiled v4.6 inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/materialize-vitenskap-university-breadth-v4_6.mjs \
            data/fag/vitenskap/emner_vitenskap_canonical_v4_6.json \
            data/fag/vitenskap/emnemapping_vitenskap_canonical_v4_6.json \
            data/fag/vitenskap/fagkart_vitenskap_canonical_v4_6.json \
            data/fag/vitenskap/methods_vitenskap_canonical_v4_6.json \
            data/fag/vitenskap/vitenskappensum_canonical_v4_6.json \
            data/fag/fag_manifest.json \
            data/fag/vitenskap/quiz_generator_rules_vitenskap_v5_1_source_priority_patch.json \
            data/fag/vitenskap/vitenskap_university_readiness_v1.json \
            data/fagverk/subject_status.json \
            data/fagverk/fagverk_registry.json
          git commit -m 'Materialize Vitenskap canonical university breadth v4.6'
          git push origin HEAD:agent/vitenskap-university-breadth-reconciliation
