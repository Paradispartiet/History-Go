name: TEMP Vinderen materialize

on:
  push:
    branches:
      - agent/vinderen-place-production-20260907
    paths:
      - .github/workflows/temp-vinderen-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/vinderen-place-production-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Replay on fresh main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Cache verified source images
        run: |
          set -euo pipefail
          cache=/tmp/vinderen-image-cache
          mkdir -p "$cache"
          download_image() {
            local name="$1"
            local url="$2"
            local referer="${3:-}"
            local args=(
              --fail-with-body --silent --show-error --location
              --retry 7 --retry-all-errors --retry-delay 5
              --connect-timeout 20 --max-time 180
              --user-agent 'History-Go-Vinderen-production/1.0 (source materialization)'
              --output "$cache/$name"
            )
            if [ -n "$referer" ]; then args+=(--referer "$referer"); fi
            echo "Caching $name"
            curl "${args[@]}" "$url"
            test -s "$cache/$name"
            file "$cache/$name"
            sleep 5
          }
          # Fetch each remote source exactly once. Train first because Commons had rate-limited it in the previous run.
          download_image train.jpg 'https://upload.wikimedia.org/wikipedia/commons/8/8d/Holmenkollbanen_at_Vindern.jpg'
          download_image place.jpg 'https://upload.wikimedia.org/wikipedia/commons/c/cd/Vinderen_Torvet,_Oslo.jpg'
          download_image station.jpg 'https://upload.wikimedia.org/wikipedia/commons/9/9b/Vinderen_stasjon_-_2010-08-07_at_17-50-16.jpg'
          download_image rasmus.jpg 'https://upload.wikimedia.org/wikipedia/commons/5/53/Rasmus_Larsen_Windern.jpg'
          download_image school.jpg 'https://upload.wikimedia.org/wikipedia/commons/5/5d/Vinderen_skole.jpg'
          download_image conditori.jpg 'https://dms07.dimu.org/image/02RWgryHoU?dimension=600x600' 'https://www.oslobilder.no/BAR/A-20027/Ua/0022/013'
      - name: Materialize Vinderen canonical production
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/materialize-vinderen-place-production.mjs')
          source = path.read_text()
          replacements = {
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Vinderen%20Torvet,%20Oslo.jpg': 'https://upload.wikimedia.org/wikipedia/commons/c/cd/Vinderen_Torvet,_Oslo.jpg',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Vinderen%20stasjon%20-%202010-08-07%20at%2017-50-16.jpg': 'https://upload.wikimedia.org/wikipedia/commons/9/9b/Vinderen_stasjon_-_2010-08-07_at_17-50-16.jpg',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Holmenkollbanen%20at%20Vindern.jpg': 'https://upload.wikimedia.org/wikipedia/commons/8/8d/Holmenkollbanen_at_Vindern.jpg',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Rasmus%20Larsen%20Windern.jpg': 'https://upload.wikimedia.org/wikipedia/commons/5/53/Rasmus_Larsen_Windern.jpg',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Vinderen%20skole.jpg': 'https://upload.wikimedia.org/wikipedia/commons/5/5d/Vinderen_skole.jpg',
              'const condImage = await resolveOgImage(urls.conditoriPhotoPage);': 'const condImage = "https://dms07.dimu.org/image/02RWgryHoU?dimension=600x600";',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Expected materializer token not found: {old}')
              source = source.replace(old, new, 1)
          marker = 'const imageCache = new Map();\nasync function fetchBuffer(url) {\n  if (imageCache.has(url)) return imageCache.get(url);'
          replacement = '''const imageCache = new Map();
const diskImageCache = new Map([
  ["https://upload.wikimedia.org/wikipedia/commons/c/cd/Vinderen_Torvet,_Oslo.jpg", "/tmp/vinderen-image-cache/place.jpg"],
  ["https://upload.wikimedia.org/wikipedia/commons/9/9b/Vinderen_stasjon_-_2010-08-07_at_17-50-16.jpg", "/tmp/vinderen-image-cache/station.jpg"],
  ["https://upload.wikimedia.org/wikipedia/commons/8/8d/Holmenkollbanen_at_Vindern.jpg", "/tmp/vinderen-image-cache/train.jpg"],
  ["https://upload.wikimedia.org/wikipedia/commons/5/53/Rasmus_Larsen_Windern.jpg", "/tmp/vinderen-image-cache/rasmus.jpg"],
  ["https://upload.wikimedia.org/wikipedia/commons/5/5d/Vinderen_skole.jpg", "/tmp/vinderen-image-cache/school.jpg"],
  ["https://dms07.dimu.org/image/02RWgryHoU?dimension=600x600", "/tmp/vinderen-image-cache/conditori.jpg"]
]);
async function fetchBuffer(url) {
  const cachedPath = diskImageCache.get(url);
  if (cachedPath) return fs.readFileSync(cachedPath);
  if (imageCache.has(url)) return imageCache.get(url);'''
          if marker not in source:
              raise SystemExit('Expected fetchBuffer cache marker not found')
          source = source.replace(marker, replacement, 1)
          path.write_text(source)
          PY
          node tools/materialize-vinderen-place-production.mjs
      - name: Regenerate canonical derivatives
        run: |
          npm run places:index:build
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
          npm run knowledge:canonical:write
          npm run place-open:build
          npm run epoker:places:build
          npm run civication:history-people:build
          npm run build:web
      - name: Validate focused production gates
        run: |
          npm run places:index:check
          npm run check:stories
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          node --test tests/fagverk-place-pages.test.mjs tests/fagverk-place-rendering.test.mjs tests/fagverk-place-substance-audit.test.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run knowledge:canonical:check
          npm run place-open:check
          npm run epoker:places:check
          npm run civication:history-people:check
          npm run build:web:check
      - name: Commit permanent Vinderen production
        run: |
          rm -f tools/materialize-vinderen-place-production.mjs .github/workflows/temp-vinderen-materialize.yml
          git add -A
          git commit -m "Complete Vinderen Place production"
          git push origin HEAD:agent/vinderen-place-production-20260907
