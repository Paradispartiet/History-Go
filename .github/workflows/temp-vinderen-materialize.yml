name: TEMP Vinderen materialize

on:
  push:
    branches:
      - agent/vinderen-place-production-20260907
    paths:
      - .github/workflows/temp-vinderen-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/vinderen-place-production-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Replay on fresh main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Cache verified source images
        run: |
          set -euo pipefail
          mkdir -p /tmp/vinderen-image-cache
          curl --fail --silent --show-error --location --retry 7 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 180 -A 'History-Go-Vinderen-production/1.0' -o /tmp/vinderen-image-cache/train.jpg 'https://upload.wikimedia.org/wikipedia/commons/8/8d/Holmenkollbanen_at_Vindern.jpg'
          test -s /tmp/vinderen-image-cache/train.jpg
          sleep 5
          curl --fail --silent --show-error --location --retry 7 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 180 -A 'History-Go-Vinderen-production/1.0' -o /tmp/vinderen-image-cache/place.jpg 'https://upload.wikimedia.org/wikipedia/commons/c/cd/Vinderen_Torvet,_Oslo.jpg'
          test -s /tmp/vinderen-image-cache/place.jpg
          sleep 5
          curl --fail --silent --show-error --location --retry 7 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 180 -A 'History-Go-Vinderen-production/1.0' -o /tmp/vinderen-image-cache/station.jpg 'https://upload.wikimedia.org/wikipedia/commons/9/9b/Vinderen_stasjon_-_2010-08-07_at_17-50-16.jpg'
          test -s /tmp/vinderen-image-cache/station.jpg
          sleep 5
          curl --fail --silent --show-error --location --retry 7 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 180 -A 'History-Go-Vinderen-production/1.0' -o /tmp/vinderen-image-cache/rasmus.jpg 'https://upload.wikimedia.org/wikipedia/commons/5/53/Rasmus_Larsen_Windern.jpg'
          test -s /tmp/vinderen-image-cache/rasmus.jpg
          sleep 5
          curl --fail --silent --show-error --location --retry 7 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 180 -A 'History-Go-Vinderen-production/1.0' -o /tmp/vinderen-image-cache/school.jpg 'https://upload.wikimedia.org/wikipedia/commons/5/5d/Vinderen_skole.jpg'
          test -s /tmp/vinderen-image-cache/school.jpg
          sleep 5
          curl --fail --silent --show-error --location --retry 7 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 180 -A 'Mozilla/5.0 History-Go-Vinderen-production/1.0' -e 'https://www.oslobilder.no/BAR/A-20027/Ua/0022/013' -o /tmp/vinderen-image-cache/conditori.jpg 'https://dms07.dimu.org/image/02RWgryHoU?dimension=600x600'
          test -s /tmp/vinderen-image-cache/conditori.jpg
      - name: Materialize Vinderen canonical production
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/materialize-vinderen-place-production.mjs')
          source = path.read_text()
          replacements = {
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Vinderen%20Torvet,%20Oslo.jpg': 'https://upload.wikimedia.org/wikipedia/commons/c/cd/Vinderen_Torvet,_Oslo.jpg',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Vinderen%20stasjon%20-%202010-08-07%20at%2017-50-16.jpg': 'https://upload.wikimedia.org/wikipedia/commons/9/9b/Vinderen_stasjon_-_2010-08-07_at_17-50-16.jpg',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Holmenkollbanen%20at%20Vindern.jpg': 'https://upload.wikimedia.org/wikipedia/commons/8/8d/Holmenkollbanen_at_Vindern.jpg',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Rasmus%20Larsen%20Windern.jpg': 'https://upload.wikimedia.org/wikipedia/commons/5/53/Rasmus_Larsen_Windern.jpg',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Vinderen%20skole.jpg': 'https://upload.wikimedia.org/wikipedia/commons/5/5d/Vinderen_skole.jpg',
              'const condImage = await resolveOgImage(urls.conditoriPhotoPage);': 'const condImage = "https://dms07.dimu.org/image/02RWgryHoU?dimension=600x600";',
              'planned_phase: index < 7 ? "opening" : index < 21 ? "middle" : index < 28 ? "context" : "theory"': 'planned_phase: index < 7 ? "opening" : index < 21 ? "middle" : index < 28 ? "bridge" : "final"',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Expected materializer token not found: {old}')
              source = source.replace(old, new, 1)
          marker = 'const imageCache = new Map();\nasync function fetchBuffer(url) {\n  if (imageCache.has(url)) return imageCache.get(url);'
          replacement = (
              'const imageCache = new Map();\n'
              'const diskImageCache = new Map([\n'
              '  ["https://upload.wikimedia.org/wikipedia/commons/c/cd/Vinderen_Torvet,_Oslo.jpg", "/tmp/vinderen-image-cache/place.jpg"],\n'
              '  ["https://upload.wikimedia.org/wikipedia/commons/9/9b/Vinderen_stasjon_-_2010-08-07_at_17-50-16.jpg", "/tmp/vinderen-image-cache/station.jpg"],\n'
              '  ["https://upload.wikimedia.org/wikipedia/commons/8/8d/Holmenkollbanen_at_Vindern.jpg", "/tmp/vinderen-image-cache/train.jpg"],\n'
              '  ["https://upload.wikimedia.org/wikipedia/commons/5/53/Rasmus_Larsen_Windern.jpg", "/tmp/vinderen-image-cache/rasmus.jpg"],\n'
              '  ["https://upload.wikimedia.org/wikipedia/commons/5/5d/Vinderen_skole.jpg", "/tmp/vinderen-image-cache/school.jpg"],\n'
              '  ["https://dms07.dimu.org/image/02RWgryHoU?dimension=600x600", "/tmp/vinderen-image-cache/conditori.jpg"]\n'
              ']);\n'
              'async function fetchBuffer(url) {\n'
              '  const cachedPath = diskImageCache.get(url);\n'
              '  if (cachedPath) return fs.readFileSync(cachedPath);\n'
              '  if (imageCache.has(url)) return imageCache.get(url);'
          )
          if marker not in source:
              raise SystemExit('Expected fetchBuffer cache marker not found')
          source = source.replace(marker, replacement, 1)
          path.write_text(source)
          PY
          node tools/materialize-vinderen-place-production.mjs
      - name: Regenerate canonical derivatives
        run: |
          npm run places:index:build
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
          npm run knowledge:canonical:write
          npm run place-open:build
          npm run epoker:places:build
          npm run civication:history-people:build
          npm run build:web
      - name: Validate focused production gates
        run: |
          npm run places:index:check
          npm run check:stories
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          node --test tests/fagverk-place-pages.test.mjs tests/fagverk-place-rendering.test.mjs tests/fagverk-place-substance-audit.test.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run knowledge:canonical:check
          npm run place-open:check
          npm run epoker:places:check
          npm run civication:history-people:check
          npm run build:web:check
      - name: Commit permanent Vinderen production
        run: |
          rm -f tools/materialize-vinderen-place-production.mjs .github/workflows/temp-vinderen-materialize.yml
          git add -A
          git commit -m "Complete Vinderen Place production"
          git push origin HEAD:agent/vinderen-place-production-20260907
