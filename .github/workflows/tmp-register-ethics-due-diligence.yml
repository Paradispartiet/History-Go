name: Register ethics and due diligence v1

on:
  push:
    branches:
      - agent/ethics-due-diligence-v1

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register canonical governance documents
        run: python3 tools/tmp-register-ethics-due-diligence.py

      - name: Validate and commit
        shell: bash
        run: |
          python3 -m json.tool docs/documentation_registry.json >/dev/null
          git diff --check
          rm -f .github/workflows/tmp-register-ethics-due-diligence.yml
          rm -f tools/tmp-register-ethics-due-diligence.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/documentation_registry.json docs/README.md .github/workflows/tmp-register-ethics-due-diligence.yml tools/tmp-register-ethics-due-diligence.py
          git diff --cached --check
          git commit -m "Registrer etikk og aktsomhet som canonical"
          git push origin HEAD:agent/ethics-due-diligence-v1
