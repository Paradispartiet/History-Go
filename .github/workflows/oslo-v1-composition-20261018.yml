name: Oslo v1 image composition (one-shot)
on:
  push:
    branches:
      - fix/oslo-v1-image-composition-20261018
    paths:
      - 'scripts/review-oslo-v1-image-composition-20261018.py'
      - '.github/workflows/oslo-v1-composition-20261018.yml'
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build reviewed crops, focal metadata and preview
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/review-oslo-v1-image-composition-20261018.py
      - name: Update canonical place index and runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run places:index:build
          npm run place-open:build
          node scripts/audit-place-images.mjs --mode=all --verify-summary=data/places/place_image_backlog_summary.json
          node --check js/ui/place-card.js
      - name: Commit real photos, reports and runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/places/ bilder/kort/places/ data/places/ data/runtime/ reports/oslo-v1-image-composition-preview-20261018.jpg
          if git diff --cached --quiet; then echo "No generated changes"; exit 1; fi
          git commit -m "content(oslo): curate crops and focal data for sixteen v1 candidates"
          git push origin HEAD:fix/oslo-v1-image-composition-20261018
