name: Knowledge runtime unification

on:
  pull_request:
    paths:
      - 'js/knowledgeQuizMemory.ts'
      - 'scripts/apply-knowledge-runtime-unification.ts'
      - '.github/workflows/knowledge-runtime-unification.yml'

permissions:
  contents: write

jobs:
  unify:
    if: github.event.pull_request.head.ref == 'agent/unify-knowledge-typescript-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-knowledge-typescript-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply deterministic TypeScript migration
        run: |
          rm -rf /tmp/hg-knowledge-unification
          npx tsc scripts/apply-knowledge-runtime-unification.ts --outDir /tmp/hg-knowledge-unification --target es2022 --module commonjs --moduleResolution node --types node --esModuleInterop --skipLibCheck
          node /tmp/hg-knowledge-unification/apply-knowledge-runtime-unification.js
      - name: Build and typecheck unified runtime
        run: |
          npm run build:web
          npm run typecheck:web
          npm run test:knowledge-core
      - name: Run browser end-to-end flow
        run: |
          npx playwright install --with-deps chromium
          npm run test:knowledge-browser
      - name: Commit unified Knowledge runtime
        run: |
          git config user.name 'History GO CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset -- scripts/apply-knowledge-runtime-unification.ts .github/workflows/knowledge-runtime-unification.yml
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Unify Knowledge in one TypeScript runtime'
          git push origin HEAD:agent/unify-knowledge-typescript-runtime
