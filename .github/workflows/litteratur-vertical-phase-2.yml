name: Literature vertical depth phase 2

on:
  push:
    branches: [agent/litteratur-vertikal-fase-2-historie]

permissions:
  contents: write

jobs:
  build-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/litteratur-vertikal-fase-2-historie
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rebase onto current main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git rebase origin/main

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize and run complete gate
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/litteratur-canonical-migration /tmp/litteratur-phase2-ci
          REPORT='reports/litteratur-canonical-migration/litteratur-phase-2-ci-validation.txt'
          : > "$REPORT"
          exec > >(tee /tmp/litteratur-phase2-ci/full-run.log) 2>&1

          echo 'baa5821f2d0a2fb73bc58d4f6916eee758c8bdb526f2a51cdf0dd2e8717ca17f  tools/build-litteratur-vertical-phase-2.mjs.gz.b64.part00' | sha256sum -c -
          echo 'c31697f668114c0b9156099e3690245a6c76a86aaec087bec8bc0f28fc8361bf  tools/build-litteratur-vertical-phase-2.mjs.gz.b64.part01' | sha256sum -c -
          echo 'f95693b27c600058f55fccc856de061ebe77b4fc9513cd789c5eaefab494ebf5  tools/build-litteratur-vertical-phase-2.mjs.gz.b64.part02' | sha256sum -c -
          echo 'adb33134d45ccc12e4e5c69934a5333546729ecf72323dcb38468c3e27b37fef  tools/build-litteratur-vertical-phase-2.mjs.gz.b64.part03' | sha256sum -c -
          cat tools/build-litteratur-vertical-phase-2.mjs.gz.b64.part* > tools/build-litteratur-vertical-phase-2.mjs.gz.b64
          echo '7d948ff9fe66925f1e395aa92bbb1991dbb27ba9d621e69bc0e4d9946b810918  tools/build-litteratur-vertical-phase-2.mjs.gz.b64' | sha256sum -c -
          base64 -d tools/build-litteratur-vertical-phase-2.mjs.gz.b64 | gzip -d > tools/build-litteratur-vertical-phase-2.mjs
          node --check tools/build-litteratur-vertical-phase-2.mjs
          node tools/build-litteratur-vertical-phase-2.mjs | tee /tmp/litteratur-phase2-ci/builder.log

          rm -f tools/build-litteratur-vertical-phase-2.mjs
          rm -f tools/build-litteratur-vertical-phase-2.mjs.gz.b64
          rm -f tools/build-litteratur-vertical-phase-2.mjs.gz.b64.part*
          rm -f .github/workflows/litteratur-vertical-phase-2.yml
          rm -f reports/litteratur-canonical-migration/litteratur-phase-2-failure.log

          run_check() {
            local name="$1"
            shift
            echo "RUN | $name" | tee -a "$REPORT"
            "$@" 2>&1 | tee "/tmp/litteratur-phase2-ci/${name}.log"
            echo "PASS | $name" | tee -a "$REPORT"
          }

          run_check phase2-validator node tools/validate-litteratur-historie-phase-2.mjs
          run_check phase1-validator node tools/validate-litteratur-poetikk-phase-1.mjs
          run_check people-data bash scripts/check-people.sh
          run_check places-data bash scripts/check-places.sh
          run_check category-audit npm run audit:categories
          run_check quiz-template-audit npm run audit:quiz-templates
          run_check quiz-production-context npm run audit:quiz-production-context
          run_check quiz-progression npm run audit:quiz-progression
          run_check quiz-theory-binding npm run audit:quiz-theory-binding
          run_check quiz-content-tests npm run test:quiz-content-audit
          run_check quiz-production-tests npm run test:quiz-production
          run_check knowledge-web-typecheck npm run typecheck:web
          run_check build-scripts npm run build:scripts
          run_check knowledge-canonical npm run knowledge:canonical:check
          run_check knowledge-legacy npm run knowledge:legacy:check
          run_check knowledge-audit npm run audit:knowledge
          run_check knowledge-v2-tests npm run test:knowledge-v2
          run_check knowledge-storage-test node --test tests/knowledge-canonical-storage-contract.test.js
          run_check browser-build-check npm run build:web:check
          run_check scripts-typecheck npm run typecheck:scripts
          run_check tools-typecheck npm run typecheck:tools
          run_check tools-build npm run build:tools
          run_check social-meet-smoke npm run test:social-meet-spotmeeting-smoke
          run_check hidden-test-mode node tests/hg-test-mode.test.js
          run_check header-search-menu node tests/header-search-menu.test.js
          run_check diff-check git diff --check

          echo 'RESULTAT: PASS' | tee -a "$REPORT"

          git add -A data/fag/litteratur reports/litteratur-canonical-migration tools .github/workflows
          git diff --cached --check
          git commit -m 'Litteratur: bygg historisk og verdenslitterær akse'
          git push --force-with-lease origin HEAD:agent/litteratur-vertikal-fase-2-historie

      - name: Upload complete gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: literature-phase-2-complete-gate-${{ github.run_id }}
          path: |
            /tmp/litteratur-phase2-ci/*.log
            reports/litteratur-canonical-migration/litteratur-phase-2-ci-validation.txt
            reports/litteratur-canonical-migration/litteratur-historie-phase-2-delta.txt
          if-no-files-found: warn

      - name: Publish failure diagnostics
        if: steps.gate.outcome == 'failure'
        run: |
          set -euo pipefail
          cp /tmp/litteratur-phase2-ci/full-run.log reports/litteratur-canonical-migration/litteratur-phase-2-failure.log
          rm -f .github/workflows/litteratur-vertical-phase-2.yml
          git add -A .github/workflows reports/litteratur-canonical-migration/litteratur-phase-2-failure.log
          git diff --cached --check
          git commit -m 'Litteratur: lagre fase 2-feildiagnostikk'
          git push --force-with-lease origin HEAD:agent/litteratur-vertikal-fase-2-historie

      - name: Propagate gate failure
        if: steps.gate.outcome == 'failure'
        run: exit 1
