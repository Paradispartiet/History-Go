name: Oslo six merged canonical regeneration once
on:
  push:
    branches:
      - research/oslo-six-culture-institutions-v1-20261023
    paths:
      - .github/workflows/oslo-six-merge-regenerate-once.yml
      - data/quiz/manifest.json
permissions:
  contents: write
jobs:
  verify-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-six-culture-institutions-v1-20261023
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build canonical place index for both Oslo batches
        run: |
          npm run places:index:build
          npm run places:index:check
      - name: Refresh Place-open and epoch indexes
        run: |
          npm run place-open:build
          npm run place-open:check
          npm run epoker:places:build
          npm run epoker:places:check
      - name: Reconcile five new quiz production contexts
        shell: bash
        run: |
          for target in \
            "politikk arbeidersamfunnets_plass" \
            "politikk politihuset_gronland" \
            "politikk statsministerboligen" \
            "historie nobels_fredssenter" \
            "by vikaterrassen"; do
            set -- $target
            npm run quiz:context -- --category "$1" --target "$2" --output "data/quiz/production_context/$1/$2.json"
          done
      - name: Regenerate canonical Knowledge and Fagverk release after both Oslo additions
        run: |
          npm run knowledge:canonical:write
          npm run knowledge:canonical:check
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Check combined manifests and both place quiz contracts
        run: |
          npm run audit:quiz-manifest:v2 || {
            node -e "const x=require('./reports/quiz_manifest_v2_audit_report.json');console.log(JSON.stringify({status:x.status,notes:x.notes,missingFiles:x.missingFiles,missingSetIds:x.missingSetIds,invalidQuestions:x.invalidQuestions,targetMismatchQuestions:x.targetMismatchQuestions,duplicateQuizItemIds:x.duplicateQuizItemIds,duplicateSetKeys:x.duplicateSetKeys,peopleCoverage:x.norgeFor1500PeopleCoverageComplete,placeCoverage:x.norgeFor1500PlaceCoverageComplete},null,2))"
            exit 1
          }
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          node --test tests/oslo-sentrum-six-6586-integrity.test.mjs
          npm run test:quiz-production
      - name: Fail on unexpected source changes
        shell: bash
        run: |
          git status --short
          if git diff --name-only | grep -E '^data/places/(by|politikk|historie|litteratur)/'; then
            echo "Refusing edits to canonical Place sources"
            exit 1
          fi
          if git diff --name-only | grep -E '^data/quiz/(by|politikk|historie|litteratur)/'; then
            echo "Refusing silent edits to published quiz sources"
            exit 1
          fi
          if git diff --name-only | grep -E '^data/fag/fag_manifest.json|^data/fagverk/fagverk_registry.json|^data/quiz/manifest.json'; then
            echo "Refusing unexpected registry or quiz manifest rewrites"
            exit 1
          fi
      - name: Commit verified generated artifacts and retire workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git rm .github/workflows/oslo-six-merge-regenerate-once.yml
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "Regenerate Knowledge, Place-open, indexes and Fagverk for merged Oslo sets"
          git push origin HEAD:research/oslo-six-culture-institutions-v1-20261023
