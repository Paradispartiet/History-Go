name: Split Agder batch 2

# Trigger generated split outputs.
on:
  workflow_dispatch:
  push:
    branches:
      - data/split-agder-batch2-places

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/split-agder-batch2-places
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/split-agder-historie-batch2-places.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/historie/agder/places_historie_agder_batch2 data/places/historie/agder/places_historie_agder_batch2_manifest.json data/places/historie/agder/places_historie_agder_batch2_index.json data/places/historie/agder/places_historie_agder_batch2_split_report.txt
          git commit -m "Generate split Agder history batch 2 place files" || exit 0
          git push
