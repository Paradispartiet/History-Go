name: Sport expansion readiness

on:
  pull_request:
    paths:
      - 'data/fag/sport/**'
      - 'data/fagverk/sport/**'
      - 'reports/fagverk/sport-phase3-audit.json'
      - 'reports/fagverk/sport-theory-integrity-audit.json'
      - 'reports/fagverk/sport-expanded-quality-audit.json'
      - 'reports/fagverk/fagverk-expanded-subject-by-subject-audit-v1.json'
      - 'scripts/audit-fagverk-sport-phase3.mjs'
      - 'scripts/audit-fagverk-sport-legacy-theory.mjs'
      - 'scripts/audit-fagverk-sport-legacy-adjudication.mjs'
      - 'tools/audit-sport-theory-integrity.mjs'
      - 'tools/audit-sport-expanded-quality.mjs'
      - 'tests/fagverk-sport-phase3.test.mjs'
      - 'tests/sport-theory-integrity.test.mjs'
      - 'tests/fagverk-sport-legacy-theory-audit.test.mjs'
      - 'tests/fagverk-sport-legacy-theory-adjudication.test.mjs'
      - 'tests/sport-expanded-quality.test.mjs'
      - '.github/workflows/sport-expanded-quality.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  expansion-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify bounded Sport whole-subject expansion audit
        run: |
          node --check tools/audit-sport-expanded-quality.mjs
          node scripts/audit-fagverk-sport-phase3.mjs
          node tools/audit-sport-theory-integrity.mjs
          node scripts/audit-fagverk-sport-legacy-theory.mjs > /tmp/sport-legacy-theory.json
          node scripts/audit-fagverk-sport-legacy-adjudication.mjs > /tmp/sport-legacy-adjudication.json
          node tools/audit-sport-expanded-quality.mjs
          node --test tests/fagverk-sport-phase3.test.mjs tests/sport-theory-integrity.test.mjs tests/fagverk-sport-legacy-theory-audit.test.mjs tests/fagverk-sport-legacy-theory-adjudication.test.mjs tests/sport-expanded-quality.test.mjs
      - name: Preserve shared Fagverk contracts
        run: |
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
