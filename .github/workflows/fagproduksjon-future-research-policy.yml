name: Fagproduksjon future research policy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: fagproduksjon-future-research-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: startsWith(github.head_ref, 'agent/fagproduksjon-future-research-policy')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply canonical phase policy
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          policy_root = 'data/fag/FAGPRODUKSJON_CANONICAL.md'
          policy_sport = '../FAGPRODUKSJON_CANONICAL.md'
          deferred = 'deferred_until_financially_sustainable_and_explicitly_reactivated'

          quiz_path = root / 'data/quiz/regler/QUIZ_PRODUCTION_CANONICAL.md'
          quiz = quiz_path.read_text()
          quiz = quiz.replace('**Versjon:** 3.1', '**Versjon:** 3.2', 1)
          marker = '## 6. Adaptiv quizprofil'
          section = '''### 5.1 Produktfase og utsatt institusjonell evidenssyntese

`data/fag/FAGPRODUKSJON_CANONICAL.md` fastsetter gjeldende produktfase for fagproduksjon. Vanlig quizproduksjon skal fortsette med relevante, leste og sporbare kilder, presist språk og nødvendige sikkerhetsforbehold.

En egen systematisk evidenssyntese utført av History Go er ikke et generelt krav for hver vanlig fakta-, teori- eller metodepåstand. Påstandens styrke skal likevel aldri overstige det kontrollerte kildegrunnlaget.

Full systematisk evidenssyntese er en utsatt institusjonell forskningsfase. PRESS-review, betalte databasesøk, dobbelt screening, biasvurdering, syntese og sikkerhetsgradering kan ikke startes eller markeres som utført uten en eksplisitt prosjektbeslutning etter at appen har tilstrekkelig økonomi, databaseadgang og uavhengige menneskelige fagroller.

Forskningsinfrastruktur som allerede finnes skal bevares. Beredskap, schemas og låste søkestrategier er ikke det samme som gjennomført evidensarbeid eller publiseringsklare claims.

'''
          if section not in quiz:
              if marker not in quiz:
                  raise SystemExit('Fant ikke innsettingspunkt i QUIZ_PRODUCTION_CANONICAL.md')
              quiz = quiz.replace(marker, section + marker, 1)
          quiz_path.write_text(quiz)

          global_validator = root / 'tools/validate-global-quiz-normal-opening-alignment.mjs'
          validator_text = global_validator.read_text()
          validator_text = validator_text.replace("standard.includes('**Versjon:** 3.1')", "standard.includes('**Versjon:** 3.2')", 1)
          validator_text = validator_text.replace('Produksjonsstandarden er versjon 3.1', 'Produksjonsstandarden er versjon 3.2', 1)
          global_validator.write_text(validator_text)

          def load(path):
              return json.loads((root / path).read_text())

          def save(path, value):
              (root / path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n')

          pipeline_path = 'data/fag/sport/sport_scientific_pipeline_manifest_v2.json'
          pipeline = load(pipeline_path)
          pipeline['files']['fagproduksjon_policy'] = policy_sport
          pipeline['execution_policy'] = {
              'status': deferred,
              'decision_date': '2026-07-25',
              'policy_document': policy_sport,
              'explicit_reactivation_required': True,
              'rationale': 'Institusjonell evidenssyntese krever finansiering, databaseadgang og uavhengige menneskelige fagroller. Produkt, lansering og økonomisk bærekraft prioriteres nå.',
              'allowed_while_deferred': [
                  'teknisk vedlikehold av eksisterende pipeline',
                  'retting av schemas, validatorer og proveniensfeil',
                  'vanlig fag- og quizproduksjon etter kilde- og sikkerhetsreglene'
              ],
              'forbidden_while_deferred': [
                  'markere databasesøk som utført',
                  'tildele fiktive reviewerroller',
                  'materialisere screeningbeslutninger, studier eller biasvurderinger',
                  'fullføre synteser eller sikkerhetsvurderinger',
                  'opprette publication-ready claims fra V2-pipelinen'
              ],
              'reactivation_requirements': [
                  'eksplisitt beslutning fra prosjektledelsen',
                  'tilstrekkelig og forutsigbar prosjektøkonomi',
                  'nødvendig databaseadgang',
                  'navngitt uavhengig søkefaglig reviewer',
                  'minst to navngitte uavhengige menneskelige screenere',
                  'dokumenterte roller, interessekonflikter og adjudikasjon',
                  'godkjent evidenspakke, tidsplan og budsjett'
              ]
          }
          pipeline['readiness']['execution_phase'] = 'deferred_by_product_phase_policy'
          invariant = 'Avansert evidensutførelse er utsatt til økonomisk bærekraft og en ny eksplisitt prosjektbeslutning.'
          if invariant not in pipeline['invariants']:
              pipeline['invariants'].append(invariant)
          save(pipeline_path, pipeline)

          packages_path = 'data/fag/sport/evidence_packages_sport_v1.json'
          packages = load(packages_path)
          packages['execution_policy'] = {
              'status': deferred,
              'decision_date': '2026-07-25',
              'policy_document': policy_sport,
              'ordinary_product_work_continues': True,
              'research_execution_paused': True
          }
          for package in packages.get('packages', []):
              if package.get('package_id') == 'evidence_package_sport_concussion_acute_safety_v1':
                  package['execution_paused'] = True
                  package['future_research_status'] = 'search_readiness_preserved_execution_deferred'
                  package['reactivation_policy'] = policy_sport
                  package['pause_reason'] = 'Krever finansiering, databaseadgang og uavhengige menneskelige fagroller; gjenopptas kun etter eksplisitt prosjektbeslutning.'
          save(packages_path, packages)

          evidence_path = 'data/fag/sport/sport_scientific_evidence_manifest_v1.json'
          evidence = load(evidence_path)
          evidence['files']['fagproduksjon_policy'] = policy_sport
          evidence['future_research_policy'] = {
              'status': deferred,
              'policy_document': policy_sport,
              'infrastructure_preserved': True,
              'execution_paused': True,
              'ordinary_quiz_production_continues': True,
              'full_scientific_coverage_may_not_be_claimed': True
          }
          save(evidence_path, evidence)

          quality_path = 'data/fag/sport/sport_quality_manifest_v5.json'
          quality = load(quality_path)
          quality['fagproduksjon_documentation'] = {
              'policy': policy_sport,
              'current_phase': 'product_and_launch_priority',
              'advanced_evidence_execution': 'deferred',
              'ordinary_fagproduksjon': 'active'
          }
          quality['production_invariants'] = [
              item for item in quality.get('production_invariants', [])
              if not item.startswith('Ny eller endret vitenskapelig Sport-tekst krever full V2-kjede')
          ]
          for item in [
              'Publiseringsklare kliniske, kausale, risiko- og effektclaims krever full V2-kjede; vanlig fag- og quizproduksjon fortsetter etter FAGPRODUKSJON_CANONICAL.md.',
              'Avansert evidensutførelse er utsatt til økonomisk bærekraft og eksplisitt prosjektbeslutning.'
          ]:
              if item not in quality['production_invariants']:
                  quality['production_invariants'].append(item)
          save(quality_path, quality)

          method_path = 'data/fag/sport/sport_scientific_method_policy_v1.json'
          method = load(method_path)
          method['current_product_phase'] = {
              'policy_document': policy_sport,
              'ordinary_quiz_production_continues': True,
              'advanced_evidence_execution': 'deferred',
              'publication_ready_v2_claims_remain_blocked': True,
              'source_level_rule': 'Vanlig pedagogisk innhold kan produseres fra relevante, leste og sporbare kilder når språk, usikkerhet og sikkerhetsgrenser er riktige.',
              'reactivation_requires': 'økonomisk bærekraft, eksplisitt prosjektbeslutning, databaseadgang og uavhengige menneskelige fagroller'
          }
          method.setdefault('pipeline_v2', {})['execution_status'] = 'infrastructure_preserved_execution_deferred'
          save(method_path, method)

          profile_path = 'data/fag/sport/supersetQUIZMAL_sport.json'
          profile = load(profile_path)
          profile['production_phase_policy'] = {
              'document': policy_root,
              'ordinary_quiz_production': 'active',
              'advanced_evidence_execution': 'deferred',
              'full_scientific_coverage_claim': 'forbidden_until_pipeline_completed'
          }
          rule = 'Avansert systematisk evidenssyntese er utsatt etter FAGPRODUKSJON_CANONICAL.md; dette stopper ikke vanlig kildebelagt fag- og quizproduksjon.'
          if rule not in profile.get('category_rules', []):
              profile.setdefault('category_rules', []).append(rule)
          save(profile_path, profile)
          PY

      - name: Validate policy and existing governance
        run: |
          set -euo pipefail
          node tools/validate-fagproduksjon-phase-policy.mjs --write
          node tools/validate-global-quiz-normal-opening-alignment.mjs
          node tools/validate-sport-concussion-search-readiness-v2.mjs
          node tools/validate-sport-concussion-evidence-seed-v1.mjs
          node tools/validate-sport-scientific-pipeline-v2.mjs
          node tools/validate-sport-theory-depth-v6.mjs
          node tools/validate-sport-evidence.mjs
          node scripts/audit-category-governance.mjs
          node scripts/audit-quiz-template-governance.mjs
          git diff --check

      - name: Parse changed JSON
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const file of [
            'data/fag/sport/sport_scientific_pipeline_manifest_v2.json',
            'data/fag/sport/evidence_packages_sport_v1.json',
            'data/fag/sport/sport_scientific_evidence_manifest_v1.json',
            'data/fag/sport/sport_quality_manifest_v5.json',
            'data/fag/sport/sport_scientific_method_policy_v1.json',
            'data/fag/sport/supersetQUIZMAL_sport.json',
            'reports/fagproduksjon-phase-policy-validation.json'
          ]) JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log('Fagproduksjon policy JSON parse: PASS');
          NODE

      - name: Commit final policy files
        run: |
          set -euo pipefail
          rm .github/workflows/fagproduksjon-future-research-policy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fag/FAGPRODUKSJON_CANONICAL.md
          git add data/quiz/regler/QUIZ_PRODUCTION_CANONICAL.md
          git add data/fag/sport/sport_scientific_pipeline_manifest_v2.json
          git add data/fag/sport/evidence_packages_sport_v1.json
          git add data/fag/sport/sport_scientific_evidence_manifest_v1.json
          git add data/fag/sport/sport_quality_manifest_v5.json
          git add data/fag/sport/sport_scientific_method_policy_v1.json
          git add data/fag/sport/supersetQUIZMAL_sport.json
          git add tools/validate-fagproduksjon-phase-policy.mjs
          git add tools/validate-global-quiz-normal-opening-alignment.mjs
          git add reports/fagproduksjon-phase-policy-validation.json
          git add -u .github/workflows/fagproduksjon-future-research-policy.yml
          git diff --cached --check
          git commit -m 'Fagproduksjon: frys institusjonell evidensfase til framtidig finansiering'
          git push origin HEAD:${{ github.head_ref }}
