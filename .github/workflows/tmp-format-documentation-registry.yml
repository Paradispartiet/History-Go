name: Temporary format documentation registry

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Pretty-print registry and remove temporary workflow
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          path = Path('docs/documentation_registry.json')
          registry = json.loads(path.read_text(encoding='utf-8'))
          path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('.github/workflows/tmp-format-documentation-registry.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/documentation_registry.json .github/workflows/tmp-format-documentation-registry.yml
          git diff --cached --check
          git commit -m "Format documentation registry"
          git push origin "HEAD:${{ github.head_ref }}"
