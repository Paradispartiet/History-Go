name: One-time rebuild business-school quiz contexts retry

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/one-time-rebuild-handelshogskole-contexts-retry.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/okonomi-naeringsliv-handelshogskole
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild the three business quiz contexts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-quiz-production-context.mjs \
            --category naeringsliv \
            --target telegrafbygningen \
            --output data/quiz/production_context/naeringsliv/telegrafbygningen.json
          node scripts/build-quiz-production-context.mjs \
            --category naeringsliv \
            --target oslo_posthus \
            --output data/quiz/production_context/naeringsliv/oslo_posthus.json
          node scripts/build-quiz-production-context.mjs \
            --category naeringsliv \
            --target havnelageret \
            --output data/quiz/production_context/naeringsliv/havnelageret.json

          expected=$(printf '%s\n' \
            data/quiz/production_context/naeringsliv/havnelageret.json \
            data/quiz/production_context/naeringsliv/oslo_posthus.json \
            data/quiz/production_context/naeringsliv/telegrafbygningen.json | sort)
          actual=$(git diff --name-only | sort)
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected rebuild diff:'
            git diff --name-only
            exit 1
          fi

      - name: Validate rebuilt contexts and economics governance
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          node tools/validate-okonomi-naeringsliv-universitetsramme.mjs
          node tools/validate-okonomi-naeringsliv-universitetskvalitet.mjs
          node tools/validate-okonomi-naeringsliv-emnerevisjon.mjs
          node tools/validate-okonomi-naeringsliv-handelshogskole.mjs
          node scripts/audit-category-governance.mjs

      - name: Commit rebuilt contexts to production branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            data/quiz/production_context/naeringsliv/telegrafbygningen.json \
            data/quiz/production_context/naeringsliv/oslo_posthus.json \
            data/quiz/production_context/naeringsliv/havnelageret.json
          git commit -m 'Synkroniser næringslivets quizkontekster med handelshøyskolelaget'
          git push origin HEAD:agent/okonomi-naeringsliv-handelshogskole
