name: Fagverk IA v3 Scenekunst portal format probe

on:
  pull_request:
    paths:
      - 'data/fagverk/fagverk_portal.json'
      - '.github/workflows/_tmp-fagverk-scenekunst-portal-format.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-and-clean:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore canonical portal projection
        run: |
          node tools/materialize-subkultur-runtime-v1.mjs --write
          node tools/materialize-subkultur-runtime-v1.mjs --check
          node scripts/audit-fagverk-scenekunst-legacy-stub.mjs
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/audit-fagverk-general-engine.mjs
      - name: Commit normalized portal/report and remove probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/_tmp-fagverk-scenekunst-portal-format.yml
          git add data/fagverk/fagverk_portal.json reports/fagverk/general-engine-audit.json .github/workflows/_tmp-fagverk-scenekunst-portal-format.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize portal after Scenekunst badge retirement'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
