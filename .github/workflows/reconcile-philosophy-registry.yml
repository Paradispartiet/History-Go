name: Reconcile Philosophy registry contract

on:
  push:
    branches:
      - agent/reconcile-philosophy-registry
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/reconcile-philosophy-registry
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reconcile Philosophy registry
        run: node scripts/reconcile-filosofi-registry-contract.mjs

      - name: Verify Philosophy field coverage and registry lock
        run: node --test tests/fagverk-filosofi-field-coverage.test.mjs

      - name: Verify Philosophy complete gate
        run: node --test tests/fagverk-filosofi-complete.test.mjs

      - name: Verify all-subject inventory
        run: node --test tests/fagverk-subject-inventory.test.mjs

      - name: Verify general subject engine
        run: node --test tests/fagverk-general-engine.test.mjs

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit reconciled registry to clean output branch
        env:
          OUTPUT_BRANCH: agent/reconcile-philosophy-registry-output
        run: |
          set -euo pipefail
          git checkout -B "$OUTPUT_BRANCH"
          git add data/fagverk/fagverk_registry.json
          if git diff --cached --quiet; then
            echo "Expected a registry reconciliation diff, but none was produced" >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "Refusing to commit workflow files in generated output" >&2
            exit 1
          fi
          git commit -m "Synchronize Philosophy registry with canonical contract"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH" --force
