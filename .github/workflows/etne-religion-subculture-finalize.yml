name: Finalize Etne religion and skate culture batch

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/etne-religion-subculture-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/etne-religion-subculture-fresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-religion-subculture-fresh
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Etne data
        shell: bash
        run: |
          mkdir -p reports/etne-religion-subculture-batch/geonorge \
                   reports/etne-religion-subculture-batch/osm \
                   reports/etne-religion-subculture-batch/validation

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const verifiedAt = '2026-07-23';
          const reportRoot = 'reports/etne-religion-subculture-batch';

          const writeJson = (file, value) => {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n');
          };
          const unique = (items) => [...new Set(items)];
          const fetchWithTimeout = (url, options = {}, ms = 15000) => fetch(url, { ...options, signal: AbortSignal.timeout(ms) });

          async function geonorge(key, street, number, postcode, city) {
            const url = new URL('https://ws.geonorge.no/adresser/v1/sok');
            url.searchParams.set('adressenavn', street);
            url.searchParams.set('nummer', String(number));
            url.searchParams.set('kommunenummer', '4611');
            url.searchParams.set('treffPerSide', '100');
            const response = await fetchWithTimeout(url);
            if (!response.ok) throw new Error(`${key}: Geonorge HTTP ${response.status}`);
            const payload = await response.json();
            writeJson(`${reportRoot}/geonorge/${key}.json`, { url: url.toString(), response: payload });
            const hits = (payload.adresser || []).filter((hit) =>
              String(hit.adressenavn || '').toLowerCase() === street.toLowerCase() &&
              String(hit.nummer) === String(number) &&
              String(hit.kommunenummer) === '4611'
            );
            if (hits.length !== 1) throw new Error(`${key}: expected one exact address hit, got ${hits.length}`);
            const hit = hits[0];
            if (String(hit.postnummer) !== String(postcode)) throw new Error(`${key}: postcode mismatch ${hit.postnummer}`);
            return {
              lat: Number(hit.representasjonspunkt.lat), lon: Number(hit.representasjonspunkt.lon),
              id: `geonorge-adresser-v1:${hit.kommunenummer}:${hit.adressekode}:${hit.nummer}`,
              url: url.toString(), address: { street, number: String(number), postcode, city, country: 'NO' }
            };
          }

          async function osmLookup(osmId, key) {
            const url = new URL('https://nominatim.openstreetmap.org/lookup');
            url.searchParams.set('format', 'jsonv2');
            url.searchParams.set('osm_ids', osmId);
            const response = await fetchWithTimeout(url, { headers: { 'user-agent': 'History-Go-Etne-batch/1.0' } });
            if (!response.ok) throw new Error(`${key}: Nominatim lookup HTTP ${response.status}`);
            const payload = await response.json();
            writeJson(`${reportRoot}/osm/${key}.json`, { url: url.toString(), response: payload });
            if (!Array.isArray(payload) || payload.length !== 1) throw new Error(`${key}: expected one OSM object, got ${payload?.length}`);
            return { lat: Number(payload[0].lat), lon: Number(payload[0].lon), raw: payload[0], url: `https://www.openstreetmap.org/${osmId[0] === 'W' ? 'way' : 'node'}/${osmId.slice(1)}` };
          }

          async function findBedehus() {
            const queries = ['Skånevik bedehus, Etne, Norway', 'Tjedlavegen 38, 5593 Skånevik, Norway'];
            for (const query of queries) {
              const url = new URL('https://nominatim.openstreetmap.org/search');
              url.searchParams.set('format', 'jsonv2');
              url.searchParams.set('addressdetails', '1');
              url.searchParams.set('limit', '20');
              url.searchParams.set('q', query);
              try {
                const response = await fetchWithTimeout(url, { headers: { 'user-agent': 'History-Go-Etne-batch/1.0' } });
                if (!response.ok) continue;
                const payload = await response.json();
                writeJson(`${reportRoot}/osm/skanevik_bedehus_${queries.indexOf(query) + 1}.json`, { url: url.toString(), response: payload });
                const exact = payload.find((hit) => {
                  const address = hit.address || {};
                  const label = String(hit.display_name || '').toLowerCase();
                  return label.includes('skånevik') && (label.includes('bedehus') || String(address.house_number || '') === '38');
                });
                if (exact) return { lat: Number(exact.lat), lon: Number(exact.lon), raw: exact, url: exact.osm_type && exact.osm_id ? `https://www.openstreetmap.org/${exact.osm_type}/${exact.osm_id}` : url.toString() };
              } catch (_) {}
            }
            return null;
          }

          const addressCoord = (r, note) => ({
            locatorType: 'building', sourceProvider: 'official_address', sourceObjectId: r.id,
            address: r.address, geocodeAccuracy: 'rooftop', coordRole: 'display_marker',
            coordType: 'address_point', coordStatus: 'verified', coordSource: 'geonorge_adresser_v1',
            coordSourceId: r.id, coordSourceUrl: r.url, coordVerifiedAt: verifiedAt, coordNote: note
          });

          function placeDoc(place) { return { places: [place] }; }

          function addSubcultureLayer(file, reason) {
            const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
            const records = Array.isArray(doc) ? doc : doc.places;
            if (!Array.isArray(records) || records.length !== 1) throw new Error(`${file}: expected exactly one record`);
            const p = records[0];
            p.secondaryBadgeIds = unique([...(p.secondaryBadgeIds || []), 'subkultur']);
            p.tags = unique([...(p.tags || []), 'subkultur', 'skatekultur', 'scene_og_fellesskap']);
            p.emne_ids = unique([...(p.emne_ids || []), 'em_sub_ungdomskultur_identitet', 'em_sub_tilhorighet_miljo', 'em_sub_scene_fellesskap']);
            if (!p.popupDesc.includes('sekundært Subkultur-lag')) p.popupDesc += ` ${reason}`;
            p.quiz_profile = p.quiz_profile || {};
            p.quiz_profile.primary_angles = unique([...(p.quiz_profile.primary_angles || []), 'skatekultur', 'scene_og_fellesskap']);
            p.quiz_profile.must_include = unique([...(p.quiz_profile.must_include || []), 'at Sport er hovudkategori og Subkultur eit sekundært lag']);
            p.quiz_profile.avoid_angles = unique([...(p.quiz_profile.avoid_angles || []), 'a_kalle_all_bruk_eller_alle_brukarar_subkultur']);
            p.quiz_profile.notes = `${p.quiz_profile.notes ? p.quiz_profile.notes + ' ' : ''}Subkultur-laget gjeld den dokumenterte skate/BMX-praksisen, scena og fellesskapet rundt eigenorganisert bruk; det er ikkje ein påstand om at alle brukarar er marginaliserte.`;
            writeJson(file, doc);
          }

          async function main() {
            const index = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
            const ids = new Set(index.map((p) => p.id));
            for (const id of ['etne_kyrkje', 'skanevik_kyrkje', 'frette_kapell', 'skanevik_bedehus']) {
              if (ids.has(id)) throw new Error(`Duplicate canonical id already exists: ${id}`);
            }

            const etne = await geonorge('etne_kyrkje', 'Enge', 5, '5590', 'Etne');
            const skanevik = await geonorge('skanevik_kyrkje', 'Prestavegen', 11, '5593', 'Skånevik');
            const frette = await osmLookup('W557505490', 'frette_kapell');
            if (!String(frette.raw.display_name || '').toLowerCase().includes('frette')) throw new Error('Frette OSM lookup did not identify Frette');
            const bedehus = await findBedehus();

            const entries = [
              {
                file: 'data/places/religion/vestland/etne/etne_kyrkje.json',
                doc: placeDoc({
                  id: 'etne_kyrkje', name: 'Etne kyrkje', lat: etne.lat, lon: etne.lon, r: 180,
                  category: 'religion', fylke: 'vestland', kommune: 'Etne', year: 2013,
                  period: 'Moderne soknekyrkje frå 2013',
                  tags: ['religion', 'kristendom', 'kirke', 'etne', 'soknekyrkje', 'trusliv', '2013'],
                  desc: 'Etne kyrkje er den moderne soknekyrkja i Etne sentrum, teken i bruk i 2013 og i aktiv bruk til gudstenester, trusopplæring og kyrkjelydsarbeid.',
                  popupDesc: 'Etne kyrkje vart teken i bruk i 2013 og er eit aktivt religiøst samlingspunkt i Etne. Kyrkja blir brukt til gudstenester, konfirmantarbeid, babysong, KRIK og anna kyrkjelydsarbeid. I History Go er dette først og fremst eit levande trossted.',
                  ...addressCoord(etne, 'Address-first: eitt eksakt Geonorge-adressepunkt for Enge 5 brukes som display-marker. Punktet samsvarer med den kjende plasseringa til Etne kyrkje og kyrkjekontoret.'),
                  externalLinks: [
                    { type: 'official', label: 'Etne kyrkjelege fellesråd – Kyrkjene våre', url: 'https://www.etne.kyrkja.no/Kyrkjene-v%C3%A5re', lang: 'nn', verifiedAt },
                    { type: 'official', label: 'Etne kyrkjelege fellesråd – aktivitetar for born og unge', url: 'https://www.etne.kyrkja.no/Born-og-unge', lang: 'nn', verifiedAt }
                  ],
                  quiz_profile: {
                    place_type: 'kirke', subtype: 'moderne_aktiv_soknekyrkje_fra_2013',
                    signature_features: ['teken i bruk i 2013', 'aktiv soknekyrkje i Etne', 'arena for gudstenester og trusopplæring'],
                    primary_angles: ['trosliv', 'kristendom', 'ritualer', 'lokalsamfunn'],
                    question_families: ['kirkesteder', 'moderne_kirkebygg', 'etne', 'trosliv'],
                    avoid_angles: ['framstille_som_historisk_middelalderkirke'],
                    must_include: ['året 2013', 'den aktive kyrkjelydsfunksjonen'],
                    contrast_targets: ['gjerde_kyrkje_etne', 'stodle_kyrkje']
                  }
                })
              },
              {
                file: 'data/places/religion/vestland/etne/skanevik_kyrkje.json',
                doc: placeDoc({
                  id: 'skanevik_kyrkje', name: 'Skånevik kyrkje', lat: skanevik.lat, lon: skanevik.lon, r: 180,
                  category: 'religion', fylke: 'vestland', kommune: 'Etne', year: 1900,
                  period: 'Aktiv soknekyrkje frå 1900',
                  tags: ['religion', 'kristendom', 'kirke', 'skanevik', 'soknekyrkje', 'trusliv', '1900'],
                  desc: 'Dagens Skånevik kyrkje vart vigsla i 1900 og er den aktive soknekyrkja i bygda, fysisk skild frå det eldre historiske kyrkjestadsankeret.',
                  popupDesc: 'Skånevik kyrkje er dagens aktive kyrkjebygg i bygda og vart vigsla i 1900. Ho står nord for den eldre kyrkjestaden der tidlegare kyrkjer stod. History Go skil derfor mellom dagens levande trossted og det eldre kyrkjestadsankeret.',
                  ...addressCoord(skanevik, 'Address-first: eitt eksakt Geonorge-adressepunkt for Prestavegen 11 brukes som display-marker for dagens Skånevik kyrkje og holdes skilt fra det eldre kyrkjestad-ankeret.'),
                  externalLinks: [
                    { type: 'official', label: 'Etne kyrkjelege fellesråd – Kyrkjene våre', url: 'https://www.etne.kyrkja.no/Kyrkjene-v%C3%A5re', lang: 'nn', verifiedAt },
                    { type: 'reference', label: 'Norges Kirker – Skånevik kyrkje', url: 'https://norgeskirker.no/wiki/Sk%C3%A5nevik_kyrkje', lang: 'nn', verifiedAt }
                  ],
                  quiz_profile: {
                    place_type: 'kirke', subtype: 'aktiv_soknekyrkje_fra_1900',
                    signature_features: ['vigsla i 1900', 'dagens aktive kyrkje i Skånevik', 'fysisk skild frå den eldre kyrkjestaden'],
                    primary_angles: ['trosliv', 'kristendom', 'ritualer', 'stadskontinuitet'],
                    question_families: ['kirkesteder', 'skanevik', '1900_tallet', 'trosliv'],
                    avoid_angles: ['blande_med_skanevik_kyrkjestad', 'framstille_dagens_bygg_som_middelalderkirke'],
                    must_include: ['at dette er dagens kyrkje frå 1900', 'skiljet frå den eldre kyrkjestaden'],
                    contrast_targets: ['skanevik_kyrkjestad', 'fjaera_kapell']
                  }
                })
              },
              {
                file: 'data/places/religion/vestland/etne/frette_kapell.json',
                doc: placeDoc({
                  id: 'frette_kapell', name: 'Frette kapell', lat: frette.lat, lon: frette.lon, r: 180,
                  category: 'religion', fylke: 'vestland', kommune: 'Etne', year: 1959,
                  period: 'Bedehus frå 1910, vigsla som kapell i 1959',
                  tags: ['religion', 'kristendom', 'kapell', 'bedehus', 'frette', 'stordalsvatnet', '1910', '1959'],
                  desc: 'Frette kapell ved enden av Stordalsvatnet vart oppført som bedehuset Betania i 1910 og ombygd og vigsla til kyrkjeleg bruk i 1959.',
                  popupDesc: 'Bygningen på Frette vart reist som bedehuset Betania i 1910. I 1959 vart han bygd grundig om til kyrkjeleg bruk med den eldre stova som kjerne, og kapellet vart vigsla 13. desember same år.',
                  locatorType: 'building', sourceProvider: 'osm', sourceObjectId: 'osm-way:557505490',
                  geocodeAccuracy: 'building', coordRole: 'building_center', coordType: 'building_center', coordStatus: 'verified_geometry',
                  coordSource: 'OpenStreetMap named chapel object + Norges Kirker', coordSourceId: 'osm-way:557505490', coordSourceUrl: frette.url,
                  coordVerifiedAt: verifiedAt, coordNote: 'Object-first: OSM way 557505490 vart slått opp direkte som det navngitte Frette-kapellet. Identitet og funksjon er kryssjekka mot Norges Kirker.',
                  externalLinks: [
                    { type: 'reference', label: 'Norges Kirker – Frette kapell', url: 'https://norgeskirker.no/wiki/Frette_kapell', lang: 'nn', verifiedAt },
                    { type: 'official', label: 'Etne kyrkjelege fellesråd – Kyrkjene våre', url: 'https://www.etne.kyrkja.no/Kyrkjene-v%C3%A5re', lang: 'nn', verifiedAt }
                  ],
                  quiz_profile: {
                    place_type: 'kapell', subtype: 'bedehus_ombygd_til_kapell_i_1959',
                    signature_features: ['Betania bedehus frå 1910', 'ombygd og vigsla som kapell i 1959', 'ligg ved enden av Stordalsvatnet'],
                    primary_angles: ['trosliv', 'bedehustradisjon', 'kristendom', 'lokalsamfunn'],
                    question_families: ['kapeller', 'bedehus', 'frette', '1950_tallet'],
                    avoid_angles: ['hevde_at_bygningen_var_kapell_fra_1910'],
                    must_include: ['skiljet mellom bedehuset frå 1910 og kapellfunksjonen frå 1959'],
                    contrast_targets: ['fjaera_kapell', 'grindheim_kyrkje_etne']
                  }
                })
              }
            ];

            if (bedehus) {
              const osmType = bedehus.raw.osm_type;
              const osmId = bedehus.raw.osm_id;
              entries.push({
                file: 'data/places/religion/vestland/etne/skanevik_bedehus.json',
                doc: placeDoc({
                  id: 'skanevik_bedehus', name: 'Skånevik bedehus', lat: bedehus.lat, lon: bedehus.lon, r: 140,
                  category: 'religion', fylke: 'vestland', kommune: 'Etne', year: null,
                  period: 'Bedehus og møteplass for kristent organisasjonsliv',
                  tags: ['religion', 'kristendom', 'bedehus', 'indremisjon', 'skanevik', 'moteplass', 'fellesskap'],
                  desc: 'Skånevik bedehus er møteplass for Skånevik Indremisjon og lokalt kristent organisasjonsliv.',
                  popupDesc: 'Etne kommune registrerer Skånevik Indremisjon/Skånevik Bedehus under tru og livssyn med møteaktivitet. History Go-staden representerer bedehustradisjonen og det organiserte kristne fellesskapet utanfor den ordinære soknekyrkja.',
                  locatorType: 'building', sourceProvider: 'osm', sourceObjectId: `osm-${osmType}:${osmId}`,
                  geocodeAccuracy: 'building', coordRole: 'display_marker', coordType: 'external_reference_point', coordStatus: 'verified',
                  coordSource: 'OpenStreetMap/Nominatim + Etne kommune', coordSourceId: `osm-${osmType}:${osmId}`, coordSourceUrl: bedehus.url,
                  coordVerifiedAt: verifiedAt, coordNote: 'Object/address-first fallback: fysisk kartobjekt funnet separat og kryssjekket mot Etne kommunes registrering av Skånevik Indremisjon/Skånevik Bedehus.',
                  externalLinks: [{ type: 'official', label: 'Etne kommune – Skånevik Indremisjon/Skånevik Bedehus', url: 'https://www.etne.kommune.no/Organisasjon/OrganisasjonVis.aspx?MId1=3694&OrganisasjonId=138', lang: 'nn', verifiedAt }],
                  quiz_profile: {
                    place_type: 'bedehus', subtype: 'indremisjonsbedehus_og_lokal_moteplass',
                    signature_features: ['Skånevik Indremisjon', 'kommunalt registrert under tru og livssyn', 'møteaktivitet'],
                    primary_angles: ['bedehustradisjon', 'kristendom', 'fellesskap', 'organisasjonsliv'],
                    question_families: ['bedehus', 'indremisjon', 'skanevik', 'trosliv'],
                    avoid_angles: ['framstille_som_soknekyrkje'], must_include: ['rollen som bedehus og møtestad'],
                    contrast_targets: ['skanevik_kyrkje', 'skanevik_kyrkjestad']
                  }
                })
              });
            }

            for (const entry of entries) writeJson(entry.file, entry.doc);

            addSubcultureLayer(
              'data/places/sport/vestland/etne/etne_bmx_og_skatepark.json',
              'I History Go er Sport framleis hovudkategorien fordi dette fysisk er eit BMX- og skateanlegg. Samstundes får staden eit sekundært Subkultur-lag: ei eiga BMX-/skateforeining, eigenorganisert bruk og ungdomskultur dokumenterer eit sjølvstendig miljø rundt arenaen.'
            );
            addSubcultureLayer(
              'data/places/sport/vestland/etne/skanevik_skatepark.json',
              'I History Go er Sport framleis hovudkategorien fordi dette fysisk er eit skateanlegg. Samstundes får parken eit sekundært Subkultur-lag fordi den permanente streetprega parken er bygd spesifikt rundt skating og eigenorganisert skatepraksis.'
            );

            const manifest = JSON.parse(fs.readFileSync('data/places/manifest.json', 'utf8'));
            for (const entry of entries) {
              const rel = entry.file.replace(/^data\//, '');
              if (!manifest.files.includes(rel)) manifest.files.push(rel);
            }
            writeJson('data/places/manifest.json', manifest);

            const skipped = bedehus ? 'Skånevik bedehus: lagt inn etter separat OSM/Nominatim-verifisering.' : 'Skånevik bedehus: IKKE aktivert. Kommunen dokumenterer organisasjonen og adresseteksten Tjedlavegen 38, men Geonorge ga ikke et eksakt adressetreff og separat kartoppslag fant ikke et sikkert fysisk objekt.';
            fs.writeFileSync(`${reportRoot}/README.md`, `# Etne religion og skatekultur\n\nDato: ${verifiedAt}\n\n## Nye Religion-steder\n\n${entries.map((e) => `- ${e.doc.places[0].name}`).join('\n')}\n\n## Subkultur-vurdering\n\n- Etne BMX- og skatepark: Sport primært, Subkultur sekundært.\n- Skånevik skatepark: Sport primært, Subkultur sekundært.\n- Etne pumptrack: berre Sport; ikkje nok dokumentasjon på eit eige skate-/subkulturmiljø.\n\n## Bedehus\n\n${skipped}\n`);
          }

          main().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Rebuild canonical place index
        run: npm run places:index:build

      - name: Run blocking checks
        shell: bash
        run: |
          set -o pipefail
          npm run audit:places-split-manifest-sync 2>&1 | tee reports/etne-religion-subculture-batch/validation/split-manifest-sync.txt
          npm run places:index:check 2>&1 | tee reports/etne-religion-subculture-batch/validation/places-index-check.txt
          npm run places:emner:check 2>&1 | tee reports/etne-religion-subculture-batch/validation/emne-check.txt
          npm run places:coords:intake 2>&1 | tee reports/etne-religion-subculture-batch/validation/coordinate-intake.txt

      - name: Capture nonblocking health report
        shell: bash
        run: |
          set +e
          npm run health:places 2>&1 | tee reports/etne-religion-subculture-batch/validation/health-places.txt
          exit 0

      - name: Commit final branch state
        shell: bash
        run: |
          rm -f .github/workflows/etne-religion-subculture-fresh.yml \
                .github/workflows/etne-religion-diagnostics.yml \
                .github/workflows/etne-religion-subculture-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Etne religion places and skate culture layers"
          git push origin HEAD:agent/etne-religion-subculture-fresh
