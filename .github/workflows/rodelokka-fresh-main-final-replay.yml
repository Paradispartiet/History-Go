name: Rodeløkka fresh-main final replay

on:
  push:
    branches:
      - agent/rodelokka-production-replay-20260905

permissions:
  contents: write

jobs:
  replay-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rodelokka-production-replay-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rebase exactly onto locked fresh main
        env:
          EXPECTED_MAIN: 1b4f7a58e08d36487eca2c6cdd81c7ce44e0fca1
        run: |
          set -euo pipefail
          BRANCH='agent/rodelokka-production-replay-20260905'
          ORIGINAL_REMOTE_HEAD="$(git rev-parse HEAD)"
          echo "$ORIGINAL_REMOTE_HEAD" > /tmp/original_remote_head
          git fetch origin main "$BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          GIT_EDITOR=true git rebase "$EXPECTED_MAIN"
          rc=$?
          set -e
          while [ "$rc" -ne 0 ]; do
            conflicted="$(git diff --name-only --diff-filter=U)"
            if [ -z "$conflicted" ]; then
              echo "Rebase failed without a resolvable conflict"
              exit "$rc"
            fi
            echo "Conflicts:"
            printf '%s\n' "$conflicted"
            while IFS= read -r file; do
              case "$file" in
                data/fagverk/fagverk_release.json)
                  echo "Taking fresh-main copy of generated $file; it will be regenerated after rebase"
                  git checkout --ours -- "$file"
                  git add "$file"
                  ;;
                *)
                  echo "Unexpected rebase conflict: $file"
                  git rebase --abort || true
                  exit 1
                  ;;
              esac
            done <<< "$conflicted"
            set +e
            GIT_EDITOR=true git rebase --continue
            rc=$?
            set -e
          done
          test "$(git merge-base HEAD "$EXPECTED_MAIN")" = "$EXPECTED_MAIN"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate fresh-main derived state
        run: |
          set -euo pipefail
          npm run places:index:build
          npm run place-open:build
          npm run epoker:places:build
          npm run quiz:context -- --category by --target rodelokka --output data/quiz/production_context/by/rodelokka.json
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs

      - name: Verify complete Rodeløkka owned contract
        run: |
          set -euo pipefail
          node --test tests/rodelokka-completion.test.mjs
          npm run places:emner:check
          npm run check:stories
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-content
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run epoker:places:check
          npm run places:index:check
          npm run place-open:check
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-politikk-runtime-equivalence.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node scripts/validate-place-description-production-v4_2_policy.mjs --all --report reports/place-description-validation-v4_2.json
          node scripts/place-production-rule-preflight.mjs validate --workcard reports/place-production/rodelokka-workcard-current.json

      - name: Verify permanent-only hygiene and push replay
        env:
          EXPECTED_MAIN: 1b4f7a58e08d36487eca2c6cdd81c7ce44e0fca1
        run: |
          set -euo pipefail
          BRANCH='agent/rodelokka-production-replay-20260905'
          rm .github/workflows/rodelokka-fresh-main-final-replay.yml
          rm -rf .cache
          test ! -e .github/workflows/rodelokka-fagverk-v2-repair.yml
          test ! -e .github/workflows/rodelokka-fresh-main-final-replay.yml
          test ! -e tools/normalize-rodelokka-production.mjs
          git add -A
          git commit -m "Replay Rodeløkka production on fresh main"

          git fetch origin main "$BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git ls-files '.cache/**')"
          ORIGINAL_REMOTE_HEAD="$(cat /tmp/original_remote_head)"
          git push --force-with-lease="refs/heads/$BRANCH:$ORIGINAL_REMOTE_HEAD" origin HEAD:"$BRANCH"
