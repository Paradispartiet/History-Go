# Permanent gate for the materialized Scenekunst phase-3 tree.
name: Fagverk Scenekunst phase 3

on:
  pull_request:
    paths:
      - "fagverk.html"
      - "fagverk-forside.html"
      - "data/categories/category_contract.json"
      - "data/fag/fag_manifest.json"
      - "data/fag/scenekunst/**"
      - "data/badges/scenekunst.json"
      - "data/fagverk/**"
      - "js/fagverk-subject-core.js"
      - "js/fagverk-subject-model.js"
      - "js/fagverk.js"
      - "scripts/audit-fagverk-subject-inventory.mjs"
      - "scripts/audit-fagverk-general-engine.mjs"
      - "scripts/audit-fagverk-scenekunst-phase3.mjs"
      - "scripts/build-fagverk-release-manifest.mjs"
      - "tests/fagverk-subject-inventory.test.mjs"
      - "tests/fagverk-general-engine.test.mjs"
      - "tests/fagverk-scenekunst-phase3.test.mjs"
      - "tests/fagverk-release-manifest.test.mjs"
      - "reports/fagverk/**"
      - ".github/workflows/fagverk-scenekunst-phase3.yml"
  push:
    branches: [main]
    paths:
      - "data/fag/scenekunst/**"
      - "data/badges/scenekunst.json"
      - "data/fagverk/**"
      - "scripts/audit-fagverk-scenekunst-phase3.mjs"
      - "tests/fagverk-scenekunst-phase3.test.mjs"
      - "reports/fagverk/**"
      - ".github/workflows/fagverk-scenekunst-phase3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Scenekunst phase 3 materialization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate syntax and deterministic reports
        run: |
          node --check scripts/audit-fagverk-scenekunst-phase3.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-scenekunst-phase3.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Validate Fagverk and Scenekunst contracts
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-scenekunst-phase3.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
