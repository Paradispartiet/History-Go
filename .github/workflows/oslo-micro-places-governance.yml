# Permanent gate for canonical Oslo Micro Place foundations and expansions.
name: Oslo Micro Places governance

on:
  pull_request:
    paths:
      - "data/places/natur/oslo/miljo_gjenbruk/**"
      - "data/places/litteratur/oslo/lesekiosk/**"
      - "data/places/by/oslo/bla_skilt/**"
      - "data/places/helse/oslo/bla_skilt/**"
      - "data/places/historie/oslo/snublestein/**"
      - "data/places/vitenskap/oslo/bla_skilt/**"
      - "data/places/production/**"
      - "data/places/regler/micro_place_profile_v1.schema.json"
      - "data/places/manifest.json"
      - "data/places/places_index.json"
      - "data/places/place_image_backlog_summary.json"
      - "data/runtime/place-open/**"
      - "reports/oslo-micro-places-2026/**"
      - "reports/oslo-micro-place-expansion-2026/**"
      - "reports/oslo-miljo-gjenbruk-2026/**"
      - "reports/lesekiosker-oslo-2026/**"
      - "schemas/place.ts"
      - "docs/MICRO_PLACE_CONTRACT.md"
      - "js/ui/micro-place-card.js"
      - "css/micro-place-card.css"
      - "scripts/promote-oslo-micro-place-review.mjs"
      - "scripts/audit-place-images.mjs"
      - "scripts/lib/place-image-change-classifier.mjs"
      - "scripts/validate-place-description-production-v4_2_policy.mjs"
      - "tests/micro-place-contract.test.mjs"
      - "tests/place-image-audit-changed.test.mjs"
      - "tests/oslo-miljo-gjenbruk-lesekiosk-materialization.test.mjs"
      - "tests/oslo-micro-place-expansion.test.mjs"
      - "tools/materialize-oslo-micro-place-expansion.mjs"
      - "tools/build_places_index.mts"
      - "tools/check_places_index_sync.mts"
      - ".github/workflows/oslo-micro-places-governance.yml"
  push:
    branches: [main]
    paths:
      - "data/places/natur/oslo/miljo_gjenbruk/**"
      - "data/places/litteratur/oslo/lesekiosk/**"
      - "data/places/by/oslo/bla_skilt/**"
      - "data/places/helse/oslo/bla_skilt/**"
      - "data/places/historie/oslo/snublestein/**"
      - "data/places/vitenskap/oslo/bla_skilt/**"
      - "data/places/regler/micro_place_profile_v1.schema.json"
      - "tests/micro-place-contract.test.mjs"
      - "tests/oslo-miljo-gjenbruk-lesekiosk-materialization.test.mjs"
      - "tests/oslo-micro-place-expansion.test.mjs"
      - ".github/workflows/oslo-micro-places-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Validate Micro Place contract, original 11 plus 21, and expansion 15 plus 4 plus 6
        run: node --test tests/micro-place-contract.test.mjs tests/oslo-miljo-gjenbruk-lesekiosk-materialization.test.mjs tests/oslo-micro-place-expansion.test.mjs
      - name: Validate independent review promotion
        run: |
          node scripts/promote-oslo-micro-place-review.mjs
          node scripts/promote-oslo-micro-place-review.mjs --audit=reports/oslo-micro-place-expansion-2026/review-audit.json --report=reports/oslo-micro-place-expansion-2026/review-integrity-report.json --expected=26
      - name: Validate production descriptions under Micro Place policy
        run: node scripts/validate-place-description-production-v4_2_policy.mjs --all
      - name: Validate index, manifest and coordinates
        run: |
          npm run places:index:build
          npm run places:index:check
          npm run audit:places-split-manifest-sync
          npm run places:coords:quality
          npm run places:coords:intake
      - name: Validate compact card runtime syntax
        run: node --check js/ui/micro-place-card.js
      - name: Validate optional Micro Place image policy
        run: |
          node --test tests/place-image-audit-changed.test.mjs
          node scripts/audit-place-images.mjs --mode=changed
          node scripts/audit-place-images.mjs --mode=all --report=reports/place-image-audit.json --verify-summary=data/places/place_image_backlog_summary.json
      - name: Validate committed place-open payloads
        run: |
          npm run place-open:build
          git diff --exit-code -- data/runtime/place-open
