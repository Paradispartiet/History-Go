name: TEMP Diagnose Helse public health payloads

on:
  pull_request:
    paths:
      - '.github/workflows/TEMP-debug-helse-public-health-payloads.yml'
      - '.github/workflows/TEMP-fagverk-helse-public-health-fulltext-writeback.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/helse-public-health-fulltext-content'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Diagnose embedded payloads
        id: diagnose
        shell: bash
        continue-on-error: true
        run: |
          set -u
          python3 - <<'PY'
          import base64
          import gzip
          import pathlib
          import re
          import subprocess

          workflow = pathlib.Path('.github/workflows/TEMP-fagverk-helse-public-health-fulltext-writeback.yml').read_text()
          targets = [
              ('MATERIALIZER_GZ_B64', '/tmp/materializer.mjs'),
              ('FULLTEXT_AUDIT_GZ_B64', '/tmp/fulltext-audit.mjs'),
              ('CUM_AUDIT_GZ_B64', '/tmp/cumulative-audit.mjs'),
          ]

          report = []
          failed = False
          for key, output in targets:
              match = re.search(rf'^\s+{re.escape(key)}:\s+(\S+)\s*$', workflow, re.MULTILINE)
              if not match:
                  report.append(f'{key}: EXTRACT_FAIL')
                  failed = True
                  continue

              encoded = match.group(1)
              report.append(f'{key}: base64_chars={len(encoded)}')
              try:
                  payload = gzip.decompress(base64.b64decode(encoded, validate=True))
                  pathlib.Path(output).write_bytes(payload)
                  pathlib.Path(output).chmod(0o755)
                  report.append(f'{key}: DECODE_OK bytes={len(payload)}')
              except Exception as exc:
                  report.append(f'{key}: DECODE_FAIL {type(exc).__name__}: {exc}')
                  failed = True
                  continue

              checked = subprocess.run(
                  ['node', '--check', output],
                  text=True,
                  capture_output=True,
              )
              if checked.returncode == 0:
                  report.append(f'{key}: NODE_CHECK_OK')
              else:
                  report.append(f'{key}: NODE_CHECK_FAIL exit={checked.returncode}')
                  detail = (checked.stderr or checked.stdout or '').strip()
                  report.append(detail if detail else '(no node --check output)')
                  failed = True

          pathlib.Path('.github/TEMP-helse-public-health-payload-diagnostics.txt').write_text(
              '\n'.join(report) + '\n', encoding='utf-8'
          )
          print('\n'.join(report))
          raise SystemExit(1 if failed else 0)
          PY

      - name: Commit diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/TEMP-helse-public-health-payload-diagnostics.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/TEMP-helse-public-health-payload-diagnostics.txt
          if git diff --cached --quiet; then
            echo 'Diagnostics unchanged.'
            exit 0
          fi
          git commit -m 'chore: capture Helse payload diagnostics'
          git push origin HEAD:${{ github.head_ref }}

      - name: Fail when payload diagnostics failed
        if: steps.diagnose.outcome == 'failure'
        run: exit 1
