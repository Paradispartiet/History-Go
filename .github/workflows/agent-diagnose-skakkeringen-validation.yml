name: Diagnose and finish Skakkeringen rounds

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate content from embedded source
        run: |
          python - <<'PY'
          import base64, gzip, pathlib, re
          workflow = pathlib.Path('.github/workflows/agent-fill-skakkeringen-rounds.yml').read_text()
          payload = re.search(r'GENERATOR_GZ_B64: "([A-Za-z0-9+/=]+)"', workflow).group(1)
          script = gzip.decompress(base64.b64decode(payload)).decode()
          script = script.replace("const root = path.resolve(__dirname, '..');", "const root = process.cwd();")
          pathlib.Path('/tmp/agent-fill-skakkeringen-rounds.js').write_text(script)
          PY
          node /tmp/agent-fill-skakkeringen-rounds.js
      - name: Skakkeringen test
        run: node tests/skakkeringen-batch1-round-content.test.js
      - name: Inherited Etne tests
        run: |
          node tests/engebanen-batch1-round-content.test.js
          node tests/steinsvollen-batch1-round-content.test.js
          node tests/etne-pumptrack-batch1-round-content.test.js
      - name: Leksikon ids
        run: npm run leksikon:ids:check
      - name: Story integrity
        run: npm run check:stories
      - name: People of places
        run: npm run audit:people-of-places
      - name: Typecheck tools
        run: npm run typecheck:tools
      - name: Typecheck web
        run: npm run typecheck:web
      - name: Diff check
        run: git diff --check
      - name: Remove temporary workflows
        run: |
          rm .github/workflows/agent-fill-skakkeringen-rounds.yml
          rm .github/workflows/agent-repair-skakkeringen-generator.yml
          rm .github/workflows/agent-diagnose-skakkeringen-validation.yml
      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports tests .github/workflows
          git commit -m "Fill Skakkeringen sport rounds batch 1"
          git push
