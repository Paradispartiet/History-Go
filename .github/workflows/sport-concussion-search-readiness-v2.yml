name: Sport concussion search readiness v2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: sport-concussion-search-readiness-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: startsWith(github.head_ref, 'agent/sport-concussion-search-readiness-v2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build locked search and screening readiness
        run: |
          set -euo pipefail
          node tools/build-sport-concussion-search-readiness-v2.mjs
          node tools/refine-sport-concussion-search-readiness-v2.mjs

      - name: Validate search readiness and legacy seed boundaries
        run: |
          set -euo pipefail
          node tools/validate-sport-concussion-search-readiness-v2.mjs --write
          node tools/validate-sport-concussion-evidence-seed-v1.mjs --write

      - name: Validate scientific and theory layers
        run: |
          set -euo pipefail
          node tools/validate-sport-scientific-pipeline-v2.mjs
          node tools/validate-sport-theory-depth-v6.mjs
          node tools/validate-sport-theory-quality.mjs
          node tools/validate-sport-evidence.mjs

      - name: Run governance audits
        run: |
          set -euo pipefail
          node scripts/audit-category-governance.mjs
          node scripts/audit-quiz-template-governance.mjs

      - name: Parse JSON and inspect diff
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const files = [
            'data/fag/sport/protocols/concussion_search_strategy_amendment_001.json',
            'data/fag/sport/concussion_search_strategy_sport_v2.json',
            'data/fag/sport/concussion_search_runs_sport_v1.json',
            'data/fag/sport/concussion_deduplication_protocol_sport_v1.json',
            'data/fag/sport/concussion_screening_schema_sport_v1.json',
            'data/fag/sport/concussion_reviewer_roles_sport_v1.json',
            'data/fag/sport/concussion_search_log_sport_v1.json',
            'data/fag/sport/evidence_packages_sport_v1.json',
            'data/fag/sport/sport_scientific_pipeline_manifest_v2.json',
            'data/fag/sport/sport_scientific_evidence_manifest_v1.json',
            'data/fag/sport/sport_scientific_method_policy_v1.json',
            'data/fag/sport/sport_quality_manifest_v5.json',
            'data/fag/sport/supersetQUIZMAL_sport.json',
            'reports/sport-concussion-search-readiness-v2-validation.json',
            'reports/sport-concussion-evidence-seed-v1-validation.json'
          ];
          for (const file of files) JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log('Sport concussion search readiness JSON parse: PASS');
          NODE
          git diff --check

      - name: Commit final search readiness files
        run: |
          set -euo pipefail
          rm .github/workflows/sport-concussion-search-readiness-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fag/sport/protocols/concussion_search_strategy_amendment_001.json
          git add data/fag/sport/concussion_search_strategy_sport_v2.json
          git add data/fag/sport/concussion_search_runs_sport_v1.json
          git add data/fag/sport/concussion_deduplication_protocol_sport_v1.json
          git add data/fag/sport/concussion_screening_schema_sport_v1.json
          git add data/fag/sport/concussion_reviewer_roles_sport_v1.json
          git add data/fag/sport/concussion_search_log_sport_v1.json
          git add data/fag/sport/evidence_packages_sport_v1.json
          git add data/fag/sport/sport_scientific_pipeline_manifest_v2.json
          git add data/fag/sport/sport_scientific_evidence_manifest_v1.json
          git add data/fag/sport/sport_scientific_method_policy_v1.json
          git add data/fag/sport/sport_quality_manifest_v5.json
          git add data/fag/sport/supersetQUIZMAL_sport.json
          git add reports/sport-concussion-search-readiness-v2-validation.json
          git add reports/sport-concussion-search-readiness-v2.md
          git add reports/sport-concussion-evidence-seed-v1-validation.json
          git add tools/build-sport-concussion-search-readiness-v2.mjs
          git add tools/refine-sport-concussion-search-readiness-v2.mjs
          git add tools/validate-sport-concussion-search-readiness-v2.mjs
          git add tools/validate-sport-concussion-evidence-seed-v1.mjs
          git add -u .github/workflows/sport-concussion-search-readiness-v2.yml
          git diff --cached --check
          git commit -m 'Sport: lås komplette søk og screeningberedskap V2'
          git push origin HEAD:${{ github.head_ref }}
