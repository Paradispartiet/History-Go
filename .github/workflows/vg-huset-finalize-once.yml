name: VG-huset final V3 regeneration (one shot)
on:
  push:
    branches:
      - audit/vg-huset-final-ui-20261010
    paths:
      - .github/workflows/vg-huset-finalize-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebuild canonical V3 projections
        run: npm run place:build -- vg_huset
      - name: Confirm no unrelated generated outputs changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -vE '^$|^reports/place-production/vg-huset-(workcard|quality-gate)-current\.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected generated paths: $unexpected"
            exit 1
          fi
      - name: Canonical verification and permanent VG-huset tests
        shell: bash
        run: |
          set -euo pipefail
          npm run place:verify -- vg_huset
          node --test tests/vg-huset-checklist-closeout.test.mjs
      - name: Persist generated projections and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/place-production/vg-huset-workcard-current.json reports/place-production/vg-huset-quality-gate-current.json
          git rm .github/workflows/vg-huset-finalize-once.yml .github/workflows/vg-huset-visual-evidence.yml
          git diff --cached --check
          git commit -m "chore(vg-huset): regenerate verified V3 closeout and remove one-shot workflows"
          git push
