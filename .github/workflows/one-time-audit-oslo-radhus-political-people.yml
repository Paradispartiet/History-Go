name: One-time audit Oslo rådhus political people

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/oslo-radhus-political-people-audit-trigger.txt

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build focused audit report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          ids = {"albert_nordengen", "rolf_stranger", "kirsten_sand", "haakon_vii"}
          names = {"Albert Nordengen", "Rolf Stranger", "Kirsten Sand", "Haakon VII", "Kong Haakon VII"}
          manifest = json.loads(Path("data/people/manifest.json").read_text(encoding="utf-8"))
          report = {"people_entries": [], "references": []}

          for relative in manifest["files"]:
              path = Path("data") / relative
              data = json.loads(path.read_text(encoding="utf-8"))
              entries = data if isinstance(data, list) else [data]
              for index, entry in enumerate(entries):
                  if not isinstance(entry, dict):
                      continue
                  if entry.get("id") in ids or entry.get("name") in names:
                      report["people_entries"].append({"path": str(path), "index": index, "entry": entry})

          for path in sorted(Path("data").rglob("*.json")):
              text = path.read_text(encoding="utf-8")
              matched = sorted(person_id for person_id in ids if person_id in text)
              if matched:
                  report["references"].append({"path": str(path), "ids": matched})

          out = Path("reports/oslo-radhus-political-people-audit")
          out.mkdir(parents=True, exist_ok=True)
          (out / "audit.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: oslo-radhus-political-people-audit-${{ github.run_id }}
          path: reports/oslo-radhus-political-people-audit/audit.json
          if-no-files-found: error
