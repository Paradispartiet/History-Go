name: Sync Grev Wedels plass quiz source context
on:
  push:
    branches:
      - history-go/oslo17-editorial-quiz-fixes-20261022
    paths:
      - '.github/workflows/grev-wedels-quiz-context-sync.yml'
permissions:
  contents: write
concurrency:
  group: grev-wedels-context-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Deterministic quiz context from latest branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=history-go/oslo17-editorial-quiz-fixes-20261022
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard FETCH_HEAD
            OUT=data/quiz/production_context/by/grev_wedels_plass.json
            node scripts/build-quiz-production-context.mjs --category by --target grev_wedels_plass --output "$OUT"
            node scripts/build-quiz-production-context.mjs --category by --target grev_wedels_plass --output "$OUT" --check
            node --test tests/oslo-batch04-v1-quiz-parity.test.mjs
            git add "$OUT"
            if git diff --cached --quiet; then echo 'Already synchronized'; exit 0; fi
            git commit -m "build(history): update reviewed Grev Wedels plass quiz production context"
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
          done
          echo 'Concurrent branch writes prevented sync after 5 attempts' >&2
          exit 1
