name: Teater Manu Place projection sync (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: teater-manu-place-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Sync only canonical Place projections
        run: |
          npm run places:index:build
          npm run place-open:build
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit only Place projections
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | sed 's/^...//' | grep -v -E '^(data/places/places_index.json|data/runtime/place-open/teater_manu.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- data/places/places_index.json data/runtime/place-open/teater_manu.json
            git commit -m "Sync Teater Manu Fagverk Place projections"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
