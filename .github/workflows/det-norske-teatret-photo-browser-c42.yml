name: Det Norske Teatret C42 browser photo QA

on:
  pull_request:
    paths:
      - '.github/workflows/det-norske-teatret-photo-browser-c42.yml'
      - 'tests/det-norske-teatret-photo-browser-c42.mjs'
      - 'tests/det-norske-teatret-source-photo-inline-c41.test.mjs'
      - 'js/ui/place-popup-tabs.js'
      - 'css/place-popup-tabs.css'
      - 'css/place-popup-v2.css'
      - 'bilder/objects/det_norske_teatret/madame_de_sade_1989_tm01641.webp'
      - 'bilder/places/det_norske_teatret_front_bjoertvedt_2013.webp'
      - 'data/places/scenekunst/oslo/places_scenekunst/det_norske_teatret.json'
      - 'reports/place-production/det-norske-teatret/20261020/object-photo-inline-source-c41.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dnt-c42-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-browser-photo-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify C41 metadata and source markup
        run: node --test tests/det-norske-teatret-source-photo-inline-c41.test.mjs
      - name: Verify genuine WebP loading and mobile/desktop rendering
        run: node tests/det-norske-teatret-photo-browser-c42.mjs
      - name: Preserve mobile and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnt-c42-browser-screenshots
          path: artifacts/dnt-c42/*.png
          if-no-files-found: warn
          retention-days: 7
