name: Fagverk Helse medical ethics evidence source brief

on:
  pull_request:
    paths:
      - "data/fag/helse/**"
      - "data/fag/fag_manifest.json"
      - "data/fagverk/fagverk_registry.json"
      - "data/fagverk/fagverk_release.json"
      - "data/fagverk/subject_inventory.json"
      - "data/fagverk/subject_status.json"
      - "reports/fagverk/helse-medical-ethics-evidence-source-brief-v1-audit.json"
      - "scripts/brief-helse-medical-ethics-evidence-sources-v1.mjs"
      - "tests/helse-medical-ethics-evidence-source-brief-v1.test.mjs"
      - ".github/workflows/fagverk-helse-medical-ethics-evidence-source-brief.yml"
  push:
    branches: [main]
    paths:
      - "data/fag/helse/**"
      - "data/fag/fag_manifest.json"
      - "data/fagverk/fagverk_registry.json"
      - "data/fagverk/fagverk_release.json"
      - "data/fagverk/subject_inventory.json"
      - "data/fagverk/subject_status.json"
      - "reports/fagverk/helse-medical-ethics-evidence-source-brief-v1-audit.json"
      - "scripts/brief-helse-medical-ethics-evidence-sources-v1.mjs"
      - "tests/helse-medical-ethics-evidence-source-brief-v1.test.mjs"
      - ".github/workflows/fagverk-helse-medical-ethics-evidence-source-brief.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Helse medical ethics and evidence source brief
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate deterministic source brief and shared contracts
        run: |
          node --check scripts/brief-helse-medical-ethics-evidence-sources-v1.mjs
          node scripts/brief-helse-medical-ethics-evidence-sources-v1.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/helse-medical-ethics-evidence-source-brief-v1.test.mjs
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
