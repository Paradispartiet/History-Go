name: Rodeløkka Fagverk v2 repair

on:
  push:
    branches:
      - agent/rodelokka-production-replay-20260905

permissions:
  contents: write

jobs:
  repair-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rodelokka-production-replay-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Canonicalize Rodeløkka Place Fagverk v2
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const placePath = 'data/places/by/oslo/places/rodelokka.json';
          const registryPath = 'data/fagverk/fagverk_registry.json';
          const place = JSON.parse(fs.readFileSync(placePath, 'utf8'));
          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          const f = place.fagverk;
          if (!f || f.schema !== 'history_go_place_fagverk_v2') throw new Error('Rodeløkka mangler Fagverk v2');

          const oslo = 'https://oslobyleksikon.no/side/Rodel%C3%B8kka_(str%C3%B8k)';
          const langgata = 'https://oslobyleksikon.no/side/Langgata';
          const snl = 'https://snl.no/Rodel%C3%B8kka';
          const lokal = 'https://lokalhistoriewiki.no/wiki/Rodel%C3%B8kka';
          const freia = 'https://oslobyleksikon.no/side/Freia';
          const commonsLanggata = 'https://commons.wikimedia.org/wiki/File:Langgata,_Rodel%C3%B8kka_(7._september_2018).jpg';
          const commonsRodes = 'https://commons.wikimedia.org/wiki/File:Langgata_30_Oslo.jpg';

          f.verified_at = '2026-09-04';
          f.guiding_questions = Array.isArray(f.guiding_questions) ? f.guiding_questions : (Array.isArray(f.questions) ? f.questions : []);
          delete f.questions;

          f.source_urls = [oslo, langgata, snl, lokal, freia, commonsLanggata, commonsRodes];
          delete f.sources;

          f.emne_ids = [
            'em_by_historiske_lag_i_hverdagsrom',
            'em_by_boligstruktur',
            'em_by_bygningstyper_og_typologier'
          ];
          f.chapter_ids = [
            'arkitektur-type-skala-byform',
            'bolig-nabolag-tilgang-endring'
          ];

          f.concepts = (f.concepts || []).map((item) => typeof item === 'string' ? item : item?.term).filter(Boolean);

          f.lenses = (f.lenses || []).map((lens) => lens.id === 'rodelokka-tre-og-murtvang'
            ? { ...lens, emne_id: 'em_by_bygningstyper_og_typologier' }
            : lens);

          f.observable_traces = [
            {
              title: 'Tre, høyde og gatebredde',
              observation: 'Langs Rodeløkkas små gater kan lave trehus, korte fasadeløp og smal gateprofil registreres direkte fra offentlig rom.',
              interpretation_boundary: 'Synlig materiale og skala kan beskrives i felt, men byggeår, murtvang og historisk funksjon må dokumenteres i kilder.',
              source_urls: [oslo, snl, commonsLanggata]
            },
            {
              title: 'Porter og bakgårdsgrenser',
              observation: 'Porter, passasjer og overganger mellom gate, hus og gårdsrom viser den finmaskede tomtestrukturen flere steder i strøket.',
              interpretation_boundary: 'Feltobservasjonen viser dagens fysiske grenser; koblingen til utparselleringen fra 1859 krever historisk kildebelegg.',
              source_urls: [oslo, lokal, commonsLanggata]
            },
            {
              title: 'Rodes hus i Langgata',
              observation: 'Rodes hus kan observeres ved Langgata 30 som et konkret eldre trehus i dagens Rodeløkka.',
              interpretation_boundary: 'Plasseringen alene viser ikke bygningens flyttehistorie; flyttingen fra Tromsøgata 7 i 1984 må leses fra dokumenterte kilder.',
              source_urls: [langgata, oslo, commonsRodes]
            }
          ];

          registry.placeLinks ||= {};
          registry.placeLinks.rodelokka = {
            sourceFile: 'places/by/oslo/places/rodelokka.json',
            field: 'fagverk',
            schema: f.schema,
            level: f.level,
            status: f.status
          };

          fs.writeFileSync(placePath, `${JSON.stringify(place, null, 2)}\n`);
          fs.writeFileSync(registryPath, `${JSON.stringify(registry, null, 2)}\n`);
          NODE

      - name: Verify canonical Place Fagverk contract
        run: |
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-politikk-runtime-equivalence.mjs

      - name: Refresh Rodeløkka derived data after canonical source change
        run: |
          npm run places:index:build
          npm run place-open:build
          npm run epoker:places:build
          npm run quiz:context -- --category by --target rodelokka --output data/quiz/production_context/by/rodelokka.json

      - name: Refresh shared Fagverk release
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check

      - name: Re-run Rodeløkka owned production gates
        run: |
          node --test tests/rodelokka-completion.test.mjs
          npm run places:emner:check
          npm run check:stories
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-content
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run epoker:places:check
          npm run places:index:check
          npm run place-open:check
          node scripts/validate-place-description-production-v4_2_policy.mjs --all --report reports/place-description-validation-v4_2.json
          node scripts/place-production-rule-preflight.mjs validate --workcard reports/place-production/rodelokka-workcard-current.json

      - name: Commit permanent Fagverk repair only
        run: |
          rm .github/workflows/rodelokka-fagverk-v2-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Canonicalize Rodeløkka Place Fagverk v2"
          git push origin HEAD:agent/rodelokka-production-replay-20260905
