name: Dagbladet reviewed source assets
on:
  push:
    branches: ['production/dagbladet-assets-20261010']
    paths: ['.github/workflows/dagbladet-reviewed-assets.yml']
permissions:
  contents: write
jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Authoritative candidate lookup, no approval or apply
        run: |
          npm run people:images:candidates -- --ids=sissel_benneche_osvold --include-existing --limit=1 > reports/place-production/dagbladet-osvold-candidates-20261010.log 2>&1
          cp data/people/people_image_candidates.json reports/place-production/dagbladet-osvold-candidates-20261010.json
          git restore data/people/people_image_candidates.json
      - name: Commit evidence on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/place-production/dagbladet-osvold-candidates-20261010.*
          git commit -m "Record authoritative Osvold portrait candidate audit"
          git push origin HEAD:production/dagbladet-assets-20261010
