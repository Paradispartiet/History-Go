name: Update sport relative set policy

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  update:
    if: github.event.issue.title == '[HG] Oppdater sportfag: relativt antall sett'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update canonical sport guidance
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          readme_path = Path('data/fag/sport/SET_MAL_README_sport_v4_3.md')
          generator_path = Path('data/fag/sport/quiz_generator_rules_sport_v5_1_source_priority_patch.json')
          pensum_path = Path('data/fag/sport/sportpensum_canonical_v4_5.json')
          superset_path = Path('data/fag/sport/supersetQUIZMAL_sport.json')

          section = '''## Relativt antall quizsett

Åtte sett er sportpakkens **fullmodell og øvre ramme**, ikke et fast krav for alle steder eller personer. Antall sett skal bestemmes av objektets faktiske omfang, betydning, idrettslige bredde og dokumentasjonsgrunnlag.

```text
Kompakt objekt: 1–2 sett
Standard objekt: 3–4 sett
Omfattende objekt: 5–6 sett
Svært betydningsfullt eller komplekst objekt: 7–8 sett
```

Vurderingen skal bygge på:

```text
- historisk dybde og tidsmessig spenn
- antall tydelig dokumenterte idrettsroller og fagdomener
- betydning lokalt, regionalt, nasjonalt eller internasjonalt
- dokumenterte klubber, personer, hendelser, rekorder, praksiser og konflikter
- endringer i arena, anlegg, bruk eller samfunnsrolle
- mengde og kvalitet på uavhengige, eksterne kilder
```

Kildedekningen setter et tak: et betydningsfullt sted skal ikke få flere sett enn det finnes klart adskilte, godt dokumenterte læringsspor til. Det skal aldri produseres fyllstoff for å nå et bestemt antall sett.

Settfase 1 er grunnlaget. Deretter velges bare de relevante modulene fra settveiledning 2–7. Settveiledning 8 brukes som syntese bare når objektet har nok bredde og dokumentasjon. Valgte veiledningsfaser trenger ikke være sammenhengende, men produksjonssett nummereres fortløpende. Quizens rotmetadata skal oppgi valgt antall, omfangsnivå, valgte veiledningsfaser og en kort faglig begrunnelse.
'''

          readme = readme_path.read_text(encoding='utf-8')
          marker = '## Faste kontrollspørsmål før et sted legges i sport'
          if '## Relativt antall quizsett' not in readme:
              if marker not in readme:
                  raise SystemExit('README insertion marker not found')
              readme = readme.replace(marker, section + '\n' + marker)
              readme_path.write_text(readme, encoding='utf-8')

          policy = {
              'mode': 'relative_to_object_scope_significance_and_sources',
              'full_model_set_count': 8,
              'eight_sets_are_ceiling_not_default': True,
              'minimum_set_count': 1,
              'maximum_set_count': 8,
              'scope_tiers': {
                  'compact': {
                      'set_count_range': [1, 2],
                      'use_when': 'Objektet har en smal, tydelig idrettsfunksjon, begrenset historisk dybde eller få klart adskilte dokumenterte læringsspor.'
                  },
                  'standard': {
                      'set_count_range': [3, 4],
                      'use_when': 'Objektet har flere dokumenterte funksjoner, perioder, aktører eller praksiser, men ikke bredde nok til full faglig dekning.'
                  },
                  'substantial': {
                      'set_count_range': [5, 6],
                      'use_when': 'Objektet har betydelig historisk dybde, flere sportdomener, mange dokumenterte aktører eller hendelser og godt kildegrunnlag.'
                  },
                  'major': {
                      'set_count_range': [7, 8],
                      'use_when': 'Objektet er svært betydningsfullt eller komplekst lokalt, nasjonalt eller internasjonalt og støtter mange klart adskilte, veldokumenterte læringsspor.'
                  }
              },
              'assessment_dimensions': [
                  'historisk dybde og tidsmessig spenn',
                  'idrettslig bredde og antall relevante sportdomener',
                  'lokal, regional, nasjonal eller internasjonal betydning',
                  'dokumenterte klubber, personer, hendelser, rekorder, praksiser og konflikter',
                  'arenaendringer, anleggsutvikling, bruksendringer eller samfunnsrolle',
                  'mengde, kvalitet og uavhengighet i eksterne kilder'
              ],
              'selection_rules': [
                  'Settfase 1 brukes som grunnlag i alle quizzer.',
                  'Etter grunnsettet velges bare relevante moduler fra settveiledning 2–7.',
                  'Settveiledning 8 er et synteseledd for objekter med tilstrekkelig bredde og dokumentasjon, ikke et obligatorisk sluttsett.',
                  'Valgte settveiledningsfaser kan hoppes over og trenger ikke være sammenhengende; produksjonssettene nummereres likevel fortløpende.',
                  'Hvert sett skal ha et eget læringsformål og skal ikke gjenta andre sett med nye formuleringer.',
                  'Kildedekningen setter øvre grense for antall sett.',
                  'Det skal aldri genereres fyllstoff for å nå et bestemt antall sett.'
              ],
              'required_quiz_root_metadata': [
                  'selected_set_count',
                  'scope_tier',
                  'set_count_basis',
                  'selected_set_guidance_ids',
                  'omitted_set_guidance_ids',
                  'source_coverage_note'
              ]
          }

          generator = json.loads(generator_path.read_text(encoding='utf-8'))
          generator['version'] = 'v5.1-source-priority-relative-set-scope-patch-sport'
          rebuilt = {}
          inserted = False
          for key, value in generator.items():
              if key == 'set_guidance':
                  rebuilt['set_count_policy'] = policy
                  inserted = True
              rebuilt[key] = value
          if not inserted:
              rebuilt['set_count_policy'] = policy
          additions = rebuilt.setdefault('validator_additions', [])
          new_validators = [
              'Avvis quiz som automatisk bruker åtte sett uten at objektets omfang, betydning og kildedekning begrunner det.',
              'Avvis quiz der valgt settantall ikke er forklart i quizens rotmetadata.',
              'Avvis sett som ikke har et eget dokumentert læringsformål, eller som hovedsakelig gjentar et annet sett.',
              'Flagg quiz der betydning brukes til å øke settantallet uten tilsvarende ekstern kildedekning.',
              'Tillat 1–2 sett for smale objekter og 7–8 sett bare for svært betydningsfulle eller komplekse objekter med bred dokumentasjon.'
          ]
          for item in new_validators:
              if item not in additions:
                  additions.append(item)
          generator_path.write_text(json.dumps(rebuilt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          pensum = json.loads(pensum_path.read_text(encoding='utf-8'))
          pensum['updated_at'] = '2026-07-21'
          pensum_policy = {
              'principle': 'Antall quizsett skal være relativt til objektets omfang, betydning, faglige bredde og dokumentasjonsgrunnlag.',
              'full_model_set_count': 8,
              'eight_sets_are_ceiling_not_requirement': True,
              'scope_tiers': {
                  'compact': '1–2 sett',
                  'standard': '3–4 sett',
                  'substantial': '5–6 sett',
                  'major': '7–8 sett'
              },
              'source_coverage_caps_set_count': True,
              'filler_sets_forbidden': True,
              'canonical_rule_file': 'quiz_generator_rules_sport_v5_1_source_priority_patch.json'
          }
          pensum_rebuilt = {}
          inserted = False
          for key, value in pensum.items():
              pensum_rebuilt[key] = value
              if key == 'summary':
                  pensum_rebuilt['quiz_set_scope_policy'] = pensum_policy
                  inserted = True
          if not inserted:
              pensum_rebuilt['quiz_set_scope_policy'] = pensum_policy
          pensum_path.write_text(json.dumps(pensum_rebuilt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          superset = json.loads(superset_path.read_text(encoding='utf-8'))
          superset['set_number'] = 1
          superset['set_guidance_id'] = '1'
          superset['set_guidance_name'] = 'grunnfakta_arena_klubb_sted'
          validation = superset.setdefault('validation', {})
          validation['set_count_matches_scope_assessment'] = True
          validation['eight_sets_treated_as_ceiling_not_default'] = True
          notes = superset.setdefault('template_notes', {})
          notes['quiz_root_set_scope_requirement'] = 'Quizroten skal oppgi selected_set_count, scope_tier, set_count_basis, selected_set_guidance_ids, omitted_set_guidance_ids og source_coverage_note. Antall sett skal følge objektets omfang og betydning; åtte sett er fullmodell, ikke standardkrav.'
          superset_path.write_text(json.dumps(superset, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/update-sport-relative-set-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fag/sport/SET_MAL_README_sport_v4_3.md \
                  data/fag/sport/quiz_generator_rules_sport_v5_1_source_priority_patch.json \
                  data/fag/sport/sportpensum_canonical_v4_5.json \
                  data/fag/sport/supersetQUIZMAL_sport.json \
                  .github/workflows/update-sport-relative-set-policy.yml
          git commit -m "Refine sport quiz set count by place scope"
          git push origin main
