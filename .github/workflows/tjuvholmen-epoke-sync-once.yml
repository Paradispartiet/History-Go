name: Tjuvholmen epoke index one-time sync
on:
  push:
    branches:
      - content/tjuvholmen-story-sprak-closeout-20261112
    paths:
      - .github/workflows/tjuvholmen-epoke-sync-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'Paradispartiet/History-Go' && github.ref == 'refs/heads/content/tjuvholmen-story-sprak-closeout-20261112' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@v4
        with:
          ref: content/tjuvholmen-story-sprak-closeout-20261112
          persist-credentials: true
      - name: Regenerate canonical historical epoch index
        run: node scripts/build-epoke-place-index.mjs
      - name: Verify and commit only the derived index
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-epoke-place-index.mjs --check
          git add -- data/epoker/epoke-place-index.json
          if git diff --cached --quiet; then
            echo "Epoke index already synchronized"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Sync Tjuvholmen epoch index after source-backed Stories'
          git push origin HEAD:content/tjuvholmen-story-sprak-closeout-20261112
