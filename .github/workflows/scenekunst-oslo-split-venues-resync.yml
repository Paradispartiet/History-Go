name: Resync Oslo Scenekunst split venues

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out replacement branch
        uses: actions/checkout@v4
        with:
          ref: agent/scenekunst-oslo-split-venues-01-resynced
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Copy validated place and report files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/scenekunst-oslo-split-venues-01-final
          files=(
            data/places/scenekunst/oslo/places_scenekunst/teater_manu.json
            data/places/scenekunst/oslo/places_scenekunst/vega_scene.json
            data/places/scenekunst/oslo/places_scenekunst/rommen_scene.json
            data/places/scenekunst/oslo/places_scenekunst/salt_oslo.json
            data/places/scenekunst/oslo/places_scenekunst/det_andre_teatret_intimscenen.json
            reports/scenekunst-oslo-split-venues-batch-1-2026-07-23.json
            reports/scenekunst-oslo-split-venues-batch-1-2026-07-23.md
          )
          for file in "${files[@]}"; do
            if [ -e "$file" ]; then
              echo "Target already exists: $file"
              exit 1
            fi
            mkdir -p "$(dirname "$file")"
            git show "origin/agent/scenekunst-oslo-split-venues-01-final:$file" > "$file"
          done

      - name: Rebuild current Oslo aggregate and split metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');

          const aggregatePath = 'data/places/scenekunst/oslo/places_scenekunst.json';
          const splitDir = 'data/places/scenekunst/oslo/places_scenekunst';
          const indexPath = 'data/places/scenekunst/oslo/places_scenekunst_index.json';
          const manifestPath = 'data/places/scenekunst/oslo/places_scenekunst_manifest.json';
          const ids = ['teater_manu', 'vega_scene', 'rommen_scene', 'salt_oslo', 'det_andre_teatret_intimscenen'];
          const aggregate = JSON.parse(fs.readFileSync(aggregatePath, 'utf8'));
          if (!Array.isArray(aggregate)) throw new Error('Unexpected Oslo Scenekunst aggregate shape');
          const existing = new Set(aggregate.map((place) => place.id));
          for (const id of ids) {
            if (existing.has(id)) throw new Error(`Canonical Oslo Scenekunst ID already exists: ${id}`);
            const place = JSON.parse(fs.readFileSync(path.join(splitDir, `${id}.json`), 'utf8'));
            if (!place || place.id !== id) throw new Error(`Unexpected split payload for ${id}`);
            aggregate.push(place);
            existing.add(id);
          }
          fs.writeFileSync(aggregatePath, JSON.stringify(aggregate, null, 2) + '\n');

          const indexEntry = (place) => ({
            id: place.id,
            name: place.name,
            category: place.category,
            lat: place.lat,
            lon: place.lon,
            r: place.r,
            ...(place.year ? { year: place.year } : {}),
            coordStatus: place.coordStatus,
            coordType: place.coordType,
            locatorType: place.locatorType,
            sourceProvider: place.sourceProvider,
            sourceObjectId: place.sourceObjectId,
            geocodeAccuracy: place.geocodeAccuracy,
            coordRole: place.coordRole,
            coordSource: place.coordSource,
            coordSourceUrl: place.coordSourceUrl,
            coordVerifiedAt: place.coordVerifiedAt,
            coordNote: place.coordNote,
            file: `places_scenekunst/${place.id}.json`,
            address: place.address
          });
          fs.writeFileSync(indexPath, JSON.stringify(aggregate.map(indexEntry), null, 2) + '\n');

          const sha256 = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const manifest = {
            version: 'places_scenekunst_split_v1',
            source_file: 'places_scenekunst.json',
            source_path: aggregatePath,
            source_sha256: sha256(aggregatePath),
            generated_at: new Date().toISOString(),
            place_count: aggregate.length,
            layout: {
              place_files_dir: 'places_scenekunst/',
              one_file_per_place: true,
              filename_rule: '<place.id>.json',
              manifest_preserves_original_order: true,
              original_aggregate_left_unchanged: false
            },
            places: aggregate.map((place, order) => ({
              id: place.id,
              name: place.name,
              category: place.category,
              file: `places_scenekunst/${place.id}.json`,
              order,
              sha256: sha256(path.join(splitDir, `${place.id}.json`))
            }))
          };
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

          const reportPath = 'reports/scenekunst-oslo-split-venues-batch-1-2026-07-23.json';
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          report.status = 'resynced_pending_validation';
          report.resyncedFromPullRequest = 3343;
          report.resyncedAt = new Date().toISOString();
          report.base = 'current_main';
          fs.writeFileSync(reportPath, JSON.stringify(report, null, 2) + '\n');
          NODE

      - name: Regenerate global index and validate
        run: |
          npm run build:tools
          npm run places:index:build
          bash scripts/check-places.sh
          npm run audit:categories

      - name: Mark report validated
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'reports/scenekunst-oslo-split-venues-batch-1-2026-07-23.json';
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          report.status = 'validated';
          report.validatedAt = new Date().toISOString();
          report.validation.placesIndexBuild = 'pass';
          report.validation.placesChecks = 'pass';
          report.validation.categoryAudit = 'pass';
          fs.writeFileSync(file, JSON.stringify(report, null, 2) + '\n');
          NODE

      - name: Commit production result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/places_index.json
          git add data/places/scenekunst/oslo/places_scenekunst.json
          git add data/places/scenekunst/oslo/places_scenekunst_index.json
          git add data/places/scenekunst/oslo/places_scenekunst_manifest.json
          git add data/places/scenekunst/oslo/places_scenekunst/teater_manu.json
          git add data/places/scenekunst/oslo/places_scenekunst/vega_scene.json
          git add data/places/scenekunst/oslo/places_scenekunst/rommen_scene.json
          git add data/places/scenekunst/oslo/places_scenekunst/salt_oslo.json
          git add data/places/scenekunst/oslo/places_scenekunst/det_andre_teatret_intimscenen.json
          git add reports/scenekunst-oslo-split-venues-batch-1-2026-07-23.json
          git add reports/scenekunst-oslo-split-venues-batch-1-2026-07-23.md
          git diff --cached --stat
          git diff --cached --quiet && { echo "No production changes produced"; exit 1; }
          git commit -m "Resync five Oslo Scenekunst split venues with main"
          git push origin HEAD:agent/scenekunst-oslo-split-venues-01-resynced
