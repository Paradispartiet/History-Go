name: Fill Etne brannstasjon rounds

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-validate-commit:
    if: github.head_ref == 'agent/fill-etne-brannstasjon-rounds-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Etne brannstasjon content
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, zlib
          exec(zlib.decompress(base64.b64decode('''''')).decode('utf-8'))
          PY
      - name: Etne brannstasjon dedicated test
        run: node tests/etne-brannstasjon-batch1-round-content.test.js
      - name: Inherited Etne round tests
        shell: bash
        run: |
          find tests -maxdepth 1 -type f -name '*batch1-round-content.test.js' \
            | grep -E '/(etne|etnesjoen|skanevik|steinsvollen|engebanen|skakkeringen|osnes|sjokanten|fikse)[^/]*batch1-round-content\.test\.js$' \
            | grep -v 'etne-brannstasjon-batch1-round-content.test.js' \
            | sort \
            | xargs -r -n1 node
      - run: npm run leksikon:ids:check
      - name: People audit
        run: bash scripts/check-people.sh
      - name: Restore generated people audit reports
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- \
            reports/people-invalid-place-refs.json \
            reports/people-invalid-place-refs.md \
            reports/people-of-places-status.json \
            reports/people-of-places-status.md \
            reports/people-place-coverage.json \
            reports/people-place-coverage.md
      - run: npm run typecheck:tools
      - run: npm run typecheck:web
      - name: Story integrity without new Etne brannstasjon errors
        shell: bash
        run: |
          set +e
          npx tsx tools/check_stories_integrity.mts > /tmp/story-integrity.log 2>&1
          status=$?
          set -e
          cat /tmp/story-integrity.log
          if grep -E 'etne_brannstasjon|st_etne_brannstasjon|inge_seim' /tmp/story-integrity.log; then
            echo "New Etne brannstasjon story-integrity error detected"
            exit 1
          fi
          echo "Story integrity exit status: $status; no Etne brannstasjon-specific errors"
      - run: git diff --check
      - name: Remove temporary workflow
        run: rm .github/workflows/agent-fill-etne-brannstasjon-rounds.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name "History Go data agent"
          git config user.email "history-go-agent@users.noreply.github.com"
          git add -A
          git commit -m "Fill Etne brannstasjon place rounds batch 1"
          git push origin HEAD:${{ github.head_ref }}
