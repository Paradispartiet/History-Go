name: Akerselva Historie A-F index sync one-shot
on:
  push:
    branches:
      - content/akerselva-glads-vaterland-source-packets-20261020
    paths:
      - '.github/workflows/akerselva-historie-a-f-index-sync-once-20261020.yml'
permissions:
  contents: write
concurrency:
  group: akerselva-af-epoch-sync-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate affected history index
        run: |
          set -euo pipefail
          npm run epoker:places:build
          npm run epoker:places:check
          npm run place-open:check
          CHANGED="$(git diff --name-only)"
          if test -n "$CHANGED" && test "$CHANGED" != "data/epoker/epoke-place-index.json"; then
            echo "Unexpected changes:"
            echo "$CHANGED"
            exit 1
          fi
          git diff --check
      - name: Commit regenerated history index
        run: |
          set -euo pipefail
          if git diff --quiet -- data/epoker/epoke-place-index.json; then
            echo "Current index matches new emne_ids"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/epoker/epoke-place-index.json
          git commit -m 'fix(history-go): sync epoch index after canonical History topic links'
          git push origin HEAD:content/akerselva-glads-vaterland-source-packets-20261020
