name: Oslo coordinate batch 26 evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-coordinate-batch-26-evidence.yml'

permissions:
  contents: read

jobs:
  evidence:
    if: github.event.pull_request.head.ref == 'agent/oslo-coordinate-control-batch-26'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect read-only address and object evidence
        shell: bash
        run: |
          set -u
          OUT='reports/oslo-coordinate-control-batch-26'
          mkdir -p "$OUT/lookups" "$OUT/sources"

          run_finder() {
            local address="$1"
            local file="$2"
            set +e
            set -o pipefail
            npm run places:coords:find:address -- --address "$address" | tee "$OUT/lookups/$file"
            local code=${PIPESTATUS[0]}
            set +o pipefail
            set -e
            printf '%s\n' "$code" > "$OUT/lookups/$file.exit-status.txt"
            return 0
          }

          run_curl() {
            local url="$1"
            local file="$2"
            set +e
            curl --retry 3 --retry-delay 2 -fsSL -A 'History-Go-coordinate-audit/1.0' "$url" \
              | tee "$OUT/sources/$file" >/dev/null
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$code" > "$OUT/sources/$file.exit-status.txt"
            return 0
          }

          set -e
          run_finder 'Sandakerveien 24C Oslo' 'myrens_verksted-sandakerveien-24c-geonorge.json'
          run_finder 'Fossveien 24 Oslo' 'christiania_seildugsfabrik-fossveien-24-geonorge.json'
          run_finder 'Sandakerveien 54 Oslo' 'lilleborg_fabrikker-sandakerveien-54-geonorge.json'
          run_finder 'Sandakerveien 56 Oslo' 'lilleborg_fabrikker-sandakerveien-56-geonorge.json'

          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Myrens%20Verksted%20Oslo' \
            'myrens_verksted-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Christiania%20Seildugsfabrik%20Oslo' \
            'christiania_seildugsfabrik-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Gr%C3%B8nlikaia%20Oslo' \
            'gronlikaia-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Lilleborg%20Fabrikker%20Oslo' \
            'lilleborg_fabrikker-nominatim.json'

          cat > "$OUT/source-notes.md" <<'EOF'
          # Batch 26 – kilde- og identitetsnotater

          - Myrens Verksted: Oslo byleksikon identifiserer det nedlagte fabrikkanlegget på Sandakerveien 24C.
          - Christiania Seildugsfabrik: Oslo byleksikon identifiserer fabrikkanlegget på Fossveien 24; bygningene brukes i dag av Kunsthøgskolen i Oslo.
          - Lilleborg Fabrikker: Oslo byleksikon dokumenterer fabrikkporten ved Sandakerveien 54 og administrasjonsbygningene ved 56, men aktiv record bruker 1833 selv om Lilleborg Fabriker A/S ble etablert i 1897. Ingen adresse anvendes før identiteten er ryddet.
          - Grønlikaia: Oslo kommune dokumenterer et bredt utviklings-/havneområde; ett punkt er ikke nok uten områdegeometri eller anchors.
          - Akerselva industriområde: Norsk Teknisk Museum/Industrimuseum og Oslo byleksikon dokumenterer en lang industriell korridor med mange separate anlegg; recorden overlapper den allerede canonical Akerselva og flere egne industriplaces.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch-26-evidence
          path: reports/oslo-coordinate-control-batch-26
          if-no-files-found: error
