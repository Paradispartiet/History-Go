name: Temporary FWG report regeneration

on:
  push:
    branches:
      - agent/civication-fwg-blaa-place-20260930

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/civication-fwg-blaa-place-20260930
          fetch-depth: 0

      - name: Regenerate FWG report correctly
        shell: bash
        run: |
          node scripts/audit-civication-fwg-governance.mjs
          grep -Fq -- '- Totalt antall avvik: 30' docs/CIVICATION_FWG_GOVERNANCE.md
          ! grep -Fq -- 'udeklarert sted i mail: blaa' docs/CIVICATION_FWG_GOVERNANCE.md
          head -n 1 docs/CIVICATION_FWG_GOVERNANCE.md | grep -Fxq '# Civication FWG Governance Audit'
          git diff --check

      - name: Commit regenerated report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CIVICATION_FWG_GOVERNANCE.md
          git commit -m 'docs: regenerate FWG governance report'
          git push origin HEAD:agent/civication-fwg-blaa-place-20260930
