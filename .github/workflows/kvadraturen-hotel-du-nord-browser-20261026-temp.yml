name: Kvadraturen Hotel du Nord real desktop-mobile quiz QA 20261026
on:
  push:
    branches:
      - research/oslo-sentrum-kvadraturen-v1-six-20261023
    paths:
      - '.github/workflows/kvadraturen-hotel-du-nord-browser-20261026-temp.yml'
permissions:
  contents: read
jobs:
  playthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
      - name: Detect Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Play full Hotel du Nord quiz in desktop and mobile Chromium
        run: node scripts/verify-place-quiz-browser.mjs hotel_du_nord
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotel-du-nord-browser-evidence
          path: artifacts/place-quiz/hotel_du_nord/
          retention-days: 14
          if-no-files-found: warn
