# One-shot production sync for PR #7342. Delete this workflow after its single successful run.
# Executes the canonical generator; it does not modify test or audit logic.
name: Oslo Akerselva epoke index one-shot

on:
  push:
    branches:
      - work/oslo-akerselva-v1-bolk-20261116
    paths:
      - '.github/workflows/oslo-akerselva-epoke-sync-once.yml'

permissions:
  contents: write

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/work/oslo-akerselva-v1-bolk-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v4
        with:
          ref: work/oslo-akerselva-v1-bolk-20261116
          fetch-depth: 1
          persist-credentials: true
      - name: Generate canonical 5 MB epoke index
        run: |
          node scripts/build-epoke-place-index.mjs
          node scripts/build-epoke-place-index.mjs --check
      - name: Commit generated index only, without bypassing checks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/epoker/epoke-place-index.json
          if git diff --cached --quiet; then
            echo "Epoke index was already in sync."
            exit 0
          fi
          git commit -m "build(epoker): regenerate Frysja 33 source-backed epoch index"
          git push origin HEAD:refs/heads/work/oslo-akerselva-v1-bolk-20261116
