name: Oslo four candidate materialization (one-time branch job)
on:
  push:
    branches: [feat/oslo-four-places-canonical-20261024]
    paths:
      - '.github/workflows/oslo-four-materialize-once.yml'
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'Paradispartiet/History-Go' && github.ref == 'refs/heads/feat/oslo-four-places-canonical-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oslo-four-places-canonical-20261024
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize four candidate Place packs
        run: |
          node --check scripts/build-oslo-four-v1-batch.mjs
          node scripts/build-oslo-four-v1-batch.mjs --write
      - name: Validate generated candidate data without activating public manifests
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const j = p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const rows=j('reports/place-production/oslo-four-release-candidate-20261024.json').generated_places;
          assert.equal(rows.length,4);
          let total=0;
          for(const row of rows){
            const p=j(row.path),q=j(row.quiz);
            assert.equal(p.id,row.id);
            assert.equal(q.targetId,row.id);
            assert.ok(p.desc.length>100&&p.popupDesc.length>600);
            assert.equal(q.sets.length,row.id==='linderud_gard'?4:3);
            const qs=q.sets.flatMap(s=>s.questions);
            assert.equal(qs.length,row.quiz_questions);
            assert.ok(qs.every(v=>v.options[v.answerIndex]===v.answer));
            assert.ok(p.coordNote.includes('ikke')&&p.frontImage);
            total+=qs.length;
          }
          assert.equal(total,91);
          const release=j('reports/place-production/oslo-four-release-candidate-20261024.json');
          assert.equal(release.publication,'RELEASE_CANDIDATES_ONLY_MANIFESTS_NOT_UPDATED');
          console.log('PASS: four candidates, 91 questions, 40 QuizCard entries; no release registration');
          EOF
      - name: Commit only candidate artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/historie/oslo/places/linderud_gard.json data/places/historie/oslo/places/sarabraten.json data/places/historie/oslo/places/saeterhytten_bygdoy.json data/places/naeringsliv/oslo/places/kristiania_teglverk_bryn.json
          git add data/quiz/historie/linderud_gard_sets.json data/quiz/historie/sarabraten_sets.json data/quiz/historie/saeterhytten_bygdoy_sets.json data/quiz/naeringsliv/kristiania_teglverk_bryn_sets.json
          git add data/quizcards/historie/oslo_four_20261024.json data/quizcards/naeringsliv/oslo_four_20261024.json
          git add bilder/places/auto/kristiania_teglverk_bryn__*illustration.svg
          git add reports/place-production/oslo-four-release-candidate-20261024.json reports/place-production/linderud_gard-workcard-current.json reports/place-production/sarabraten-workcard-current.json reports/place-production/saeterhytten_bygdoy-workcard-current.json reports/place-production/kristiania_teglverk_bryn-workcard-current.json
          if ! git diff --cached --quiet; then
            git commit -m "feat(oslo): stage four canonical-shaped sites with 91 quizzes and 40 quizcard questions"
            git push origin HEAD:refs/heads/feat/oslo-four-places-canonical-20261024
          fi
