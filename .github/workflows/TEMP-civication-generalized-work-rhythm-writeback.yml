name: TEMP Civication generalized work rhythm writeback

on:
  push:
    branches:
      - agent/civication-generalized-work-rhythm-v1

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize canonical scene registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Commit registry and remove TEMP workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/compiledSceneRegistryV1.json
          git rm .github/workflows/TEMP-civication-generalized-work-rhythm-writeback.yml
          git commit -m "Materialize generalized work rhythm registry"
          git push
