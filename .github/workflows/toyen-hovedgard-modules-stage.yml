name: Tøyen hovedgård – one-time module materialization
on:
  push:
    branches: [work/toyen-hovedgard-story-leksikon-lesespor-20261110]
    paths:
      - '.github/workflows/toyen-hovedgard-modules-stage.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: toyen-hovedgard-modules-${{ github.ref }}
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/toyen-hovedgard-story-leksikon-lesespor-20261110
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate canonical place-open and global shards
        run: node scripts/build-place-open-payloads.mjs
      - name: Test only Tøyen hovedgård module wiring and retained quiz counts
        run: node --test tests/toyen-hovedgard-modules-integration.test.mjs
      - name: Commit generated runtime only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/runtime
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "build(toyen-hovedgard): synchronize place-open and source shards"
            git push origin HEAD:work/toyen-hovedgard-story-leksikon-lesespor-20261110
          fi
