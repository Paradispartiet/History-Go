name: The Villa v1 – licensed media and canonical generation one-shot

on:
  pull_request:
    paths:
      - '.github/workflows/the-villa-v1-generate-one-shot.yml'

permissions:
  contents: write

concurrency:
  group: the-villa-one-shot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/the-villa-oslo-v1-20261102
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Derive documented CC BY-SA photographs and link Place-open
        run: node scripts/build-the-villa-media-20261102.mjs
      - name: Canonical Knowledge and Fagverk release
        run: |
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --write
          node scripts/build-fagverk-release-manifest.mjs
      - name: Verify source and generated data
        run: |
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --check
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/the-villa-v1-contract-20261102.test.mjs
      - name: Commit generated output and delete temporary writer
        env:
          REF: content/the-villa-oslo-v1-20261102
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u data/places/subkultur/oslo/places_subkultur/the_villa.json data/runtime/place-open/the_villa.json data/quiz/musikk/the_villa_sets_merged.json data/knowledge reports/knowledge-id-backfill.json data/fagverk/fagverk_release.json
          git add bilder/places/candidates/oslo-v1-20261102/the_villa_hero.webp bilder/places/candidates/oslo-v1-20261102/the_villa_portrait.webp bilder/places/candidates/oslo-v1-20261102/the_villa_card.webp
          git rm .github/workflows/the-villa-v1-generate-one-shot.yml
          git diff --cached --check
          git commit -m 'The Villa: licensed photographs, Knowledge IDs and Fagverk-release'
          git push origin "HEAD:$REF"
