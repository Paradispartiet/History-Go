name: Fix Technology V3 generator migration guard

on:
  push:
    branches:
      - editorial/teknologi-v3-20260805
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[tech-v3-generator-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: editorial/teknologi-v3-20260805

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove legacy V2 migrator reinsertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/build-teknologi-editorial-v3.mjs')
          s = p.read_text()
          old = '''  const v3Foundation = "node tools/build-teknologi-editorial-v3.mjs --check\\n          node tools/validate-teknologi-foundation.mjs";
            const sourceAndV3Foundation = "node tools/build-teknologi-canonical-v2_4.mjs --check\\n          node tools/build-teknologi-editorial-v3.mjs --check\\n          node tools/validate-teknologi-foundation.mjs";
            if (!next.includes(sourceAndV3Foundation)) next = next.replace(v3Foundation, sourceAndV3Foundation);
          '''
          if old not in s:
              old = '''  const v3Foundation = "node tools/build-teknologi-editorial-v3.mjs --check\\n          node tools/validate-teknologi-foundation.mjs";
          const sourceAndV3Foundation = "node tools/build-teknologi-canonical-v2_4.mjs --check\\n          node tools/build-teknologi-editorial-v3.mjs --check\\n          node tools/validate-teknologi-foundation.mjs";
          if (!next.includes(sourceAndV3Foundation)) next = next.replace(v3Foundation, sourceAndV3Foundation);
          '''
          new = '''  next = next.replaceAll("          node tools/build-teknologi-canonical-v2_4.mjs --check\\n", "");
          '''
          if old not in s:
              raise SystemExit('Fant ikke V2-reinsertion-blokken i V3-builderen')
          p.write_text(s.replace(old, new))
          PY
          node --check tools/build-teknologi-editorial-v3.mjs

      - name: Verify active V3 materialization
        run: |
          node tools/build-teknologi-editorial-v3.mjs --check
          node scripts/validate-teknologi-editorial-v3.mjs

      - name: Commit permanent generator fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build-teknologi-editorial-v3.mjs
          git commit -m "[tech-v3-generator-fix] Keep V3 as active materialization gate"
          git push origin HEAD:editorial/teknologi-v3-20260805
