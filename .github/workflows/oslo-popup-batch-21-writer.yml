name: One-time Oslo popup batch 21 history closure writer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/oslo-popup-batch-21-trigger.txt

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Batch 21 branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-popup-v4-batch-21-finish-history
          fetch-depth: 0

      - name: Apply isolated desc and popupDesc patches
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const patchFiles = [
            '.github/oslo-popup-batch-21-patches-1.json',
            '.github/oslo-popup-batch-21-patches-2.json'
          ];
          const patches = patchFiles.flatMap((file) => JSON.parse(fs.readFileSync(file, 'utf8')).places);
          if (patches.length !== 7) throw new Error(`Expected 7 patches, got ${patches.length}`);
          const wc = (value) => String(value || '').trim().split(/\s+/u).filter(Boolean).length;
          const pc = (value) => String(value || '').split(/\n\n+/u).filter((part) => part.trim()).length;
          const stripText = (value) => {
            const copy = structuredClone(value);
            delete copy.desc;
            delete copy.popupDesc;
            return copy;
          };
          const rows = [];
          for (const patch of patches) {
            const before = JSON.parse(fs.readFileSync(patch.path, 'utf8'));
            if (before.id !== patch.id) throw new Error(`ID mismatch in ${patch.path}`);
            const beforeNonText = stripText(before);
            const after = structuredClone(before);
            after.desc = patch.desc;
            after.popupDesc = patch.popupDesc;
            const descWords = wc(after.desc);
            const popupWords = wc(after.popupDesc);
            const paragraphs = pc(after.popupDesc);
            if (descWords < 40 || descWords > 80) throw new Error(`${patch.id}: desc ${descWords}`);
            if (popupWords < 300 || popupWords > 600) throw new Error(`${patch.id}: popupDesc ${popupWords}`);
            if (paragraphs !== 6) throw new Error(`${patch.id}: paragraphs ${paragraphs}`);
            if (JSON.stringify(beforeNonText) !== JSON.stringify(stripText(after))) throw new Error(`${patch.id}: non-text fields changed`);
            fs.writeFileSync(patch.path, `${JSON.stringify(after, null, 2)}\n`);
            rows.push({ id: patch.id, name: after.name || after.title, descWords, popupWords, paragraphs });
          }

          const protocolPath = 'reports/place-description-revision-protocol.md';
          let protocol = fs.readFileSync(protocolPath, 'utf8');
          const pr = process.env.PR_NUMBER;
          if (!protocol.includes('`paulus_kirke`')) {
            const tableRows = rows.map((row, index) => `| ${181 + index} | ${row.name} | \`${row.id}\` | ${row.descWords} | ${row.popupWords} | ${row.paragraphs} | #${pr} |`).join('\n');
            protocol = protocol.replace('## Gjenstående Oslo-kø', `${tableRows}\n\n## Gjenstående Oslo-kø`);
          }
          if (!protocol.includes('| Oslo V4 batch 21 |')) {
            protocol = protocol.replace(
              '| Oslo V4 batch 20 | 10 | #4212 – sjette produksjonsbatch fra historiekøen |',
              `| Oslo V4 batch 20 | 10 | #4212 – sjette produksjonsbatch fra historiekøen |\n| Oslo V4 batch 21 | 7 | #${pr} – fullførte hele Oslo-køen for fagområdet historie |`
            );
          }
          fs.writeFileSync(protocolPath, protocol);
          console.log(JSON.stringify(rows, null, 2));
          NODE

          node tools/audit-oslo-place-description-scope.mjs --write

          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('reports/oslo-place-description-scope-audit-2026-07-26.json', 'utf8'));
          if (audit.activeOslo.uniqueIds !== 512) throw new Error(`active total ${audit.activeOslo.uniqueIds}`);
          if (audit.protocol.ids !== 187) throw new Error(`protocol ids ${audit.protocol.ids}`);
          if (audit.comparison.additionalActiveOsloIds !== 325) throw new Error(`remaining ${audit.comparison.additionalActiveOsloIds}`);
          if (Object.prototype.hasOwnProperty.call(audit.groupCounts, 'historie')) throw new Error(`historie still present: ${audit.groupCounts.historie}`);
          NODE

          git diff --check
          git add \
            data/places/historie/oslo/places_historie/paulus_kirke.json \
            data/places/historie/oslo/places_historie/the_mini_bottle_gallery.json \
            data/places/historie/oslo/places_historie/toyen_hovedgard.json \
            data/places/historie/oslo/places_historie/valerenga_kirke.json \
            data/places/historie/oslo/places_historie/vestre_gravlund.json \
            data/places/historie/oslo/places_historie/viking_planet_oslo.json \
            data/places/historie/oslo/places_historie/vikingtidsmuseet.json \
            reports/oslo-place-description-scope-audit-2026-07-26.json \
            reports/oslo-place-description-scope-audit-2026-07-26.md \
            reports/place-description-revision-protocol.md
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish Oslo history place description queue"
          git push origin HEAD:agent/oslo-popup-v4-batch-21-finish-history
