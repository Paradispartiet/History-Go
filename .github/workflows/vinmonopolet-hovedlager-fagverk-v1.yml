name: Vinmonopolets hovedlager Fagverk production
on:
  push:
    branches:
      - content/vinmonopolet-hovedlager-fagverk-v1-20261027
    paths:
      - .github/workflows/vinmonopolet-hovedlager-fagverk-v1.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/vinmonopolet-hovedlager-fagverk-v1-20261027
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build canonical index, place runtime and Fagverk release
        run: |
          npm run places:index:build
          npm run place-open:build
          node scripts/build-fagverk-release-manifest.mjs
      - name: Persist generated integration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/places_index.json data/runtime/place-open/ data/fagverk/fagverk_release.json
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize Vinmonopolet Hasle Place runtime and Fagverk release"
            git push
          fi
      - name: Verify integration and preserve quiz/image/coordinates
        run: |
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run place-open:check
          npm run places:index:check
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const src='data/places/naeringsliv/oslo/places_naeringsliv/vinmonopolet_lager.json';
          const p=JSON.parse(fs.readFileSync(src,'utf8'));
          const rt=JSON.parse(fs.readFileSync('data/runtime/place-open/vinmonopolet_lager.json','utf8'));
          const registry=JSON.parse(fs.readFileSync('data/fagverk/fagverk_registry.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('data/quiz/manifest.json','utf8'));
          assert.equal(p.id,'vinmonopolet_lager');
          assert.equal(p.category,'naeringsliv');
          assert.equal(p.fagverk.status,'curated');
          assert.equal(p.fagverk.article.length,3);
          assert.equal(p.fagverk.lenses.length,3);
          assert.equal(registry.placeLinks.vinmonopolet_lager.status,'curated');
          assert.equal(rt.place?.fagverk?.status,'curated');
          assert.equal(p.lat,59.926820467284585);
          assert.equal(p.lon,10.793178356826628);
          assert.equal(p.image,'bilder/places/Vinmonopolets_hovedlager.PNG');
          assert.equal(p.cardImage,'bilder/kort/places/vinmonopolets-hovedlager.PNG');
          assert.equal(manifest.sets.filter(e=>e.targetId==='vinmonopolet_lager').length,5);
          assert(p.desc.includes('1933') && p.fagverk.source_urls.length>=3);
          console.log('PASS: Vinmonopolet Fagverk, 5 existing sets and existing image preserved.');
          NODE
      - name: Clean one-time production workflow after green checks
        run: |
          git rm .github/workflows/vinmonopolet-hovedlager-fagverk-v1.yml
          git commit -m "Remove Vinmonopolet Fagverk one-time workflow"
          git push
