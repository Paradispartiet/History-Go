name: Temporary Alnsjoen nature rounds materializer

on:
  pull_request:
    paths:
      - 'scripts/_tmp_alnsjoen_materializer_*.b64'
      - '.github/workflows/temporary-alnsjoen-nature-rounds.yml'

permissions:
  contents: write

jobs:
  materialize-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild and run materializer
        run: |
          cat scripts/_tmp_alnsjoen_materializer_*.b64 | base64 --decode | gzip --decompress > scripts/_tmp_alnsjoen_materializer.py
          python -m py_compile scripts/_tmp_alnsjoen_materializer.py
          python scripts/_tmp_alnsjoen_materializer.py

      - name: Run targeted Alnsjoen test
        run: node tests/alnsjoen-nature-rounds-batch1.test.js

      - name: Run existing Alna route test
        run: node tests/oslo-nature-rounds-batch5-alna.test.js

      - name: Run places check
        run: |
          if ! bash scripts/check-places.sh > /tmp/check-places.log 2>&1; then
            tail -n 160 /tmp/check-places.log
            exit 1
          fi
          tail -n 20 /tmp/check-places.log

      - name: Upload places-check log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alnsjoen-check-places-log
          path: /tmp/check-places.log
          if-no-files-found: error

      - name: Run people check
        run: bash scripts/check-people.sh

      - name: Check whitespace
        run: git diff --check

      - name: Commit clean materialized branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/_tmp_alnsjoen_materializer_*.b64
          rm -f scripts/_tmp_alnsjoen_materializer.py
          rm -f .github/workflows/temporary-alnsjoen-nature-rounds.yml
          git add -A
          git commit -m "Fill Alnsjoen nature rounds batch 1"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
