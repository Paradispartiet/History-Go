name: Etne psychology batch 1 integration

on:
  pull_request:
    paths:
      - 'data/places/psykologi/vestland/etne/**'
      - '.github/workflows/etne-psykologi-batch-1-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.number == 2267
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-psykologi-batch-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: |
          mkdir -p reports/etne-psykologi-batch-1-integration
          npm install --no-audit --no-fund 2>&1 | tee reports/etne-psykologi-batch-1-integration/npm-install.txt
      - name: Register places
        run: |
          node --input-type=module <<'NODE' | tee reports/etne-psykologi-batch-1-integration/manifest-update.txt
          import fs from 'node:fs';
          const path = 'data/places/manifest.json';
          const additions = [
            'places/psykologi/vestland/etne/psykisk_helse_rus_etne.json',
            'places/psykologi/vestland/etne/psykisk_helse_rus_skanevik.json'
          ];
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          for (const addition of additions) {
            data.files = data.files.filter((value) => value !== addition);
            data.files.push(addition);
            if (data.files.filter((value) => value === addition).length !== 1) throw new Error(`manifest duplicate: ${addition}`);
            console.log(`PASS ${addition}`);
          }
          fs.writeFileSync(path, JSON.stringify(data));
          NODE
      - name: Build index
        run: npm run places:index:build 2>&1 | tee reports/etne-psykologi-batch-1-integration/index-build.txt
      - name: Coordinate intake
        env:
          COORD_INTAKE_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run places:coords:intake 2>&1 | tee reports/etne-psykologi-batch-1-integration/coordinate-intake.txt
      - name: Validate places
        run: bash scripts/check-places.sh 2>&1 | tee reports/etne-psykologi-batch-1-integration/check-places.txt
      - name: Split sync
        run: npm run audit:places-split-manifest-sync 2>&1 | tee reports/etne-psykologi-batch-1-integration/split-manifest-sync.txt
      - name: Coordinate quality
        run: npm run places:coords:quality 2>&1 | tee reports/etne-psykologi-batch-1-integration/coordinate-quality.txt
      - name: Targeted parity
        run: |
          node --input-type=module <<'NODE' | tee reports/etne-psykologi-batch-1-integration/targeted-source-runtime-validation.json
          import fs from 'node:fs';
          const entries = [
            ['psykisk_helse_rus_etne','data/places/psykologi/vestland/etne/psykisk_helse_rus_etne.json'],
            ['psykisk_helse_rus_skanevik','data/places/psykologi/vestland/etne/psykisk_helse_rus_skanevik.json']
          ];
          const runtime = JSON.parse(fs.readFileSync('data/places/places_index.json','utf8'));
          const counts = new Map();
          for (const place of runtime) counts.set(place.id,(counts.get(place.id)||0)+1);
          const duplicates = [...counts.entries()].filter(([,count]) => count > 1);
          if (duplicates.length) throw new Error(`duplicates: ${JSON.stringify(duplicates)}`);
          const fields = ['lat','lon','r','coordType','coordStatus','coordSource','coordVerifiedAt','coordNote','locatorType','sourceProvider','sourceObjectId','address','geocodeAccuracy','coordRole'];
          const results = [];
          for (const [id,file] of entries) {
            const doc = JSON.parse(fs.readFileSync(file,'utf8'));
            const source = Array.isArray(doc) ? doc.find((place) => place.id === id) : doc;
            const rows = runtime.filter((place) => place.id === id);
            if (rows.length !== 1) throw new Error(`${id}: ${rows.length} runtime rows`);
            if (rows[0].category !== 'psykologi') throw new Error(`${id}: wrong category`);
            const mismatches = fields.filter((field) => JSON.stringify(source[field]) !== JSON.stringify(rows[0][field]));
            if (mismatches.length) throw new Error(`${id}: parity ${mismatches.join(',')}`);
            results.push({id,runtimeRows:1,category:'psykologi',coordinateParity:'PASS',coordStatus:source.coordStatus,sourceObjectId:source.sourceObjectId});
          }
          console.log(JSON.stringify({status:'PASS',globalDuplicateActivePlaceIds:0,results},null,2));
          NODE
      - name: Diff check
        run: git diff --check | tee reports/etne-psykologi-batch-1-integration/git-diff-check.txt
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/manifest.json data/places/places_index.json reports/etne-psykologi-batch-1-integration
          git diff --cached --check
          git commit -m "Integrate Etne psychology batch 1"
          git push origin HEAD:agent/etne-psykologi-batch-1
