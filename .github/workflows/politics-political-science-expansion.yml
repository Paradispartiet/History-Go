name: Politics political science expansion runner

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: politics-political-science-expansion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run-expansion-work:
    if: startsWith(github.head_ref, 'agent/politikk-statsvitenskap-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Export current canonical inputs
        id: export
        if: hashFiles('reports/politikk-canonical-migration/statsvitenskap-expansion-marker.txt') != ''
        run: |
          set -euo pipefail
          phase="$(cat reports/politikk-canonical-migration/statsvitenskap-expansion-marker.txt)"
          if [[ "$phase" != "export-current-canonical" ]]; then
            echo "exported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/politikk-statsvitenskap
          cp data/fag/politikk/{fagkart_politikk_canonical_v4_5.json,emner_politikk_canonical_v4_5.json,methods_politikk_canonical_v4_5.json,emnemapping_politikk_canonical_v4_5.json,politikkpensum_canonical_v4_5.json,quiz_generator_rules_politikk_v5_1_source_priority_patch.json} /tmp/politikk-statsvitenskap/
          echo "exported=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.export.outputs.exported == 'true'
        with:
          name: politics-current-before-political-science-expansion
          path: /tmp/politikk-statsvitenskap/
