name: Fagverk Film og TV source authority quality

on:
  pull_request:
    paths:
      - "data/fag/TV_og_Film/**"
      - "data/fagverk/film_tv/**"
      - "reports/fagverk/film-tv-holistic-completion-v1-audit.json"
      - "scripts/audit-film-tv-source-authority-quality-v1.mjs"
      - "tests/film-tv-source-authority-quality-v1.test.mjs"
      - ".github/workflows/fagverk-film-tv-source-authority-quality.yml"
  push:
    branches: [main]
    paths:
      - "data/fag/TV_og_Film/**"
      - "data/fagverk/film_tv/**"
      - "reports/fagverk/film-tv-holistic-completion-v1-audit.json"
      - "scripts/audit-film-tv-source-authority-quality-v1.mjs"
      - "tests/film-tv-source-authority-quality-v1.test.mjs"
      - ".github/workflows/fagverk-film-tv-source-authority-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Film og TV source authority quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate source authority classification and research evidence
        run: |
          node --check scripts/audit-film-tv-source-authority-quality-v1.mjs
          node --check tests/film-tv-source-authority-quality-v1.test.mjs
          node scripts/audit-film-tv-source-authority-quality-v1.mjs
          node --test tests/film-tv-source-authority-quality-v1.test.mjs
