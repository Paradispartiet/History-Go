name: Majorstua quiz final surface fix

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: majorstua-quiz-final-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: startsWith(github.head_ref, 'agent/quiz-majorstua-normal-opening') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply and diagnose final Majorstua fix
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/majorstua-final-fix-diagnostic.txt"
          : > "$LOG"
          run_step() {
            name="$1"
            shift
            echo "## $name" >> "$LOG"
            "$@" >> "$LOG" 2>&1
            status=$?
            echo "status=$status" >> "$LOG"
            echo >> "$LOG"
            return $status
          }
          failed=0
          run_step patch node tools/fix-majorstua-opening-surface.mjs || failed=1
          run_step knowledge_write npm run knowledge:canonical:write || failed=1
          run_step inventory_build node tools/build-quiz-normal-opening-migration-inventory.mjs || failed=1
          run_step inventory_compact node tools/compact-quiz-normal-opening-migration-reports.mjs || failed=1
          run_step inventory_validate bash -o pipefail -c 'node tools/validate-quiz-normal-opening-migration-inventory.mjs | tee reports/quiz-normal-opening-migration-inventory-validation.txt' || failed=1
          run_step majorstua_validate bash -o pipefail -c 'node tools/validate-majorstua-quiz-normalization.mjs | tee reports/majorstua-quiz-repair-validation.txt' || failed=1
          run_step knowledge_check npm run knowledge:canonical:check || failed=1
          run_step production_context npm run audit:quiz-production-context || failed=1
          run_step diff_check git diff --check || failed=1
          cat "$LOG"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: majorstua-final-fix-diagnostic
          path: ${{ runner.temp }}/majorstua-final-fix-diagnostic.txt
          if-no-files-found: warn
      - name: Commit final Majorstua fix
        id: publish
        continue-on-error: true
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/majorstua-final-fix-publish.txt"
          : > "$LOG"
          {
            rm tools/fix-majorstua-opening-surface.mjs
            rm -f reports/majorstua-final-fix-status.md
            changed_paths=$(git status --porcelain | sed -E 's/^.. //')
            unexpected=$(printf '%s\n' "$changed_paths" | grep -Ev '^(data/quiz/by/majorstua_sets\.json|data/knowledge/(knowledge_units|concepts|terms|stories|knowledge_emne_review_queue)\.generated\.json|reports/(knowledge-id-backfill|knowledge-contract-audit|quiz-content-quality|quiz-normal-opening-migration-inventory)\.json|reports/quiz-normal-opening-migration-inventory\.md|reports/quiz-normal-opening-migration-inventory-validation\.txt|reports/majorstua-quiz-repair-validation\.txt|reports/majorstua-final-fix-status\.md|tools/fix-majorstua-opening-surface\.mjs|tools/validate-majorstua-quiz-normalization\.mjs)$' || true)
            if [[ -n "$unexpected" ]]; then
              echo 'Uventede filer i Majorstua-sluttfiksen:'
              printf '%s\n' "$unexpected"
              exit 1
            fi
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git diff --cached --check
            git diff --cached --stat
            git commit -m 'Quiz: fullfør Majorstua-normalisering'
            git push origin HEAD:${{ github.head_ref }}
          } >> "$LOG" 2>&1
          status=$?
          cat "$LOG"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: majorstua-final-fix-publish
          path: ${{ runner.temp }}/majorstua-final-fix-publish.txt
          if-no-files-found: warn
      - name: Propagate failure
        if: steps.validate.outcome == 'failure' || steps.publish.outcome == 'failure'
        run: exit 1
