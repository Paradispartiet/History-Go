name: Repair Skånevik idrettsanlegg rounds
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  repair-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate and repair canonical badges
        run: |
          python - <<'PY'
          import base64, gzip, pathlib, re
          text = pathlib.Path('.github/workflows/agent-fill-skanevik-idrettsanlegg-rounds.yml').read_text()
          payload = re.search(r'GENERATOR_GZ_B64: "([A-Za-z0-9+/=]+)"', text).group(1)
          pathlib.Path('/tmp/g.js').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          node /tmp/g.js
          node - <<'NODE'
          const fs=require('fs');
          const p='data/places/sport/vestland/etne/skanevik_idrettsanlegg.json';
          const a=JSON.parse(fs.readFileSync(p,'utf8'));
          const x=a.find(v=>v.id==='skanevik_idrettsanlegg');
          x.underbadge_ids=['fotball','stadion','kunstgressbane','koordinasjon','utendors_trening','lokalidrett','frivillighet'];
          fs.writeFileSync(p,JSON.stringify(a,null,2)+'\n');
          NODE
      - name: Dedicated and inherited tests
        run: |
          node tests/skanevik-idrettsanlegg-batch1-round-content.test.js
          node tests/skanevik-discgolf-batch1-round-content.test.js
          node tests/osnes-discgolf-batch1-round-content.test.js
          node tests/skakkeringen-batch1-round-content.test.js
          node tests/engebanen-batch1-round-content.test.js
          node tests/steinsvollen-batch1-round-content.test.js
          node tests/etne-pumptrack-batch1-round-content.test.js
      - run: npm run leksikon:ids:check
      - name: People audit
        run: |
          npm run audit:people-of-places
          git checkout -- reports/people-of-places-status.json reports/people-of-places-status.md
      - run: npm run typecheck:tools
      - run: npm run typecheck:web
      - name: Story integrity without new errors
        run: |
          set +e; npm run check:stories > /tmp/story.log 2>&1; set -e; cat /tmp/story.log
          if grep -Ei 'story=.*skanevik_fra_stadion_til_nytt_kunstgras|place_id=skanevik_idrettsanlegg|person_id=(leif_bjornar_larsen|torleiv_sydnes)' /tmp/story.log; then exit 1; fi
      - run: git diff --check
      - name: Remove temporary workflows
        run: |
          rm .github/workflows/agent-fill-skanevik-idrettsanlegg-rounds.yml
          rm .github/workflows/agent-diagnose-skanevik-idrettsanlegg-rounds.yml
          rm .github/workflows/agent-repair-skanevik-idrettsanlegg-rounds.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports tests .github/workflows
          git commit -m "Fill Skånevik idrettsanlegg sport rounds batch 1"
          git push
