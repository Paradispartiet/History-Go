name: Split London football grounds

on:
  push:
    branches:
      - data/split-sport-london-footballgrounds-20260708

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/split-sport-london-footballgrounds-20260708
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/split-sport-london-footballgrounds.mjs
      - run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add data/places/sport/europa/england/footballgrounds_london data/places/sport/europa/england/footballgrounds_london_manifest.json data/places/sport/europa/england/footballgrounds_london_index.json data/places/sport/europa/england/footballgrounds_london_split_report.txt
          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Generate split London football ground files"
            git push
          fi
