name: TEMP Civication Religion Formidling og kulturarv prerequisites

on:
  push:
    branches:
      - agent/civication-religion-formidling-og-kulturarv-prerequisites-20260908
    paths:
      - scripts/TEMP_materialize_religion_formidling_og_kulturarv_prerequisites.mjs
      - .github/workflows/TEMP-civication-religion-formidling-og-kulturarv-prerequisites.yml

permissions:
  contents: write

concurrency:
  group: temp-civication-religion-formidling-og-kulturarv-prerequisites
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-religion-formidling-og-kulturarv-prerequisites-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Require fresh main ancestry before materialization
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'Branch is stale versus main before materialization.' >&2; exit 1; }
      - name: Patch TEMP materializer syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/TEMP_materialize_religion_formidling_og_kulturarv_prerequisites.mjs')
          s=p.read_text()
          replacements=[
              ("faktisk berører.`,effects:{stats:", "faktisk berører.',effects:{stats:"),
              ("faktisk ble brukt.`,effect:-1,tags:", "faktisk ble brukt.',effect:-1,tags:"),
              ("myndighetsglidningen.`,effects:{stats:", "myndighetsglidningen.',effects:{stats:"),
          ]
          for old,new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one mismatched string terminator for {old!r}, found {s.count(old)}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Syntax
        run: node --check scripts/TEMP_materialize_religion_formidling_og_kulturarv_prerequisites.mjs
      - name: Materialize
        run: node scripts/TEMP_materialize_religion_formidling_og_kulturarv_prerequisites.mjs
      - name: Restore TEMP materializer source
        run: git checkout -- scripts/TEMP_materialize_religion_formidling_og_kulturarv_prerequisites.mjs
      - name: Generate canonical derived surfaces
        run: |
          set -euo pipefail
          node scripts/audit-civication-role-packs.mjs
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
          node scripts/build-civication-scene-registry.mjs --write
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - name: Require zero broken role-pack mappings
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const index=JSON.parse(fs.readFileSync('data/Civication/rolePackIndex.json','utf8'));
          const broken=index.roles.filter((row)=>row.status==='broken_mapping');
          console.log('BROKEN_MAPPING_COUNT='+broken.length);
          if(broken.length){console.log(JSON.stringify(broken,null,2));process.exit(1);}
          NODE
      - name: Verify Religion Formidling og kulturarv prerequisites
        run: node tests/civication-religion-formidling-og-kulturarv-prerequisites.test.js
      - name: Verify Religion life/career split
        run: node tests/civication-religion-life-career-split.test.js
      - name: Verify Career Gameplay Matrix
        run: node tests/civication-career-gameplay-matrix.test.js
      - name: Verify Role World readiness
        run: node tests/civication-role-world-rollout-readiness.test.js
      - name: Verify Scene Registry
        run: node scripts/build-civication-scene-registry.mjs --check
      - name: Verify Scenario People index
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
      - name: Verify Scenario People audit
        run: node --test tests/civication-scenario-people.test.mjs
      - name: Verify full Civication suite
        run: node tests/run-civication-tests.mjs
      - name: Verify job learning profiles
        run: npm run audit:job-learning-profiles
      - name: Verify job knowledge requirements
        run: npm run audit:job-knowledge-requirements
      - name: Require fresh main ancestry before scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'Branch became stale before scope verification.' >&2; exit 1; }
      - name: Verify exact permanent prerequisite scope
        shell: bash
        run: |
          set -euo pipefail
          ROLE=religion_formidling_og_kulturarv
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          if [ "${#changed[@]}" -ne 24 ]; then
            echo "Expected exactly 24 permanent prerequisite paths, found ${#changed[@]}" >&2
            exit 1
          fi
          for f in "${changed[@]}"; do
            case "$f" in
              data/Civication/careerGameplayMatrix.json|data/Civication/compiledSceneRegistryV1.json|data/Civication/roleModels/manifest.json|data/Civication/rolePackIndex.json|data/Civication/roleWorldRolloutReadiness.json|data/Civication/scenarioPeople/generated/religion.json|data/Civication/scenarioPeople_index.json|docs/CIVICATION_ROLE_PACK_INDEX.md|reports/civication-role-packs.md|reports/civication-career-gameplay-matrix.md|reports/civication-role-world-rollout-readiness.md|reports/CIVICATION_RELIGION_FORMIDLING_OG_KULTURARV_PREREQUISITES_SOURCE_FIRST.md|tests/civication-religion-formidling-og-kulturarv-prerequisites.test.js|data/Civication/roleModels/religion/religion_formidling_og_kulturarv.json|data/Civication/workGrammars/religion/religion_formidling_og_kulturarv.json|data/Civication/mailPlans/religion/religion_formidling_og_kulturarv_plan.json|data/Civication/mailFamilies/religion/*/religion_formidling_og_kulturarv_*.json)
                ;;
              *) echo "Unexpected generated path: $f" >&2; exit 1;;
            esac
          done
          for required in \
            data/Civication/roleModels/religion/$ROLE.json \
            data/Civication/workGrammars/religion/$ROLE.json \
            data/Civication/mailPlans/religion/${ROLE}_plan.json \
            reports/CIVICATION_RELIGION_FORMIDLING_OG_KULTURARV_PREREQUISITES_SOURCE_FIRST.md \
            tests/civication-religion-formidling-og-kulturarv-prerequisites.test.js; do
            printf '%s\n' "${changed[@]}" | grep -Fx "$required" >/dev/null || { echo "Missing required generated path: $required" >&2; exit 1; }
          done
          for type in job people conflict story event micro followup knowledge consequence; do
            required="data/Civication/mailFamilies/religion/$type/${ROLE}_${type}.json"
            printf '%s\n' "${changed[@]}" | grep -Fx "$required" >/dev/null || { echo "Missing mail family: $required" >&2; exit 1; }
          done
          git diff --check
      - name: Require fresh main ancestry before permanent commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'Branch became stale before permanent commit.' >&2; exit 1; }
      - name: Commit permanent verified package
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/TEMP_materialize_religion_formidling_og_kulturarv_prerequisites.mjs
          rm -f .github/workflows/TEMP-civication-religion-formidling-og-kulturarv-prerequisites.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then echo 'No permanent changes to commit.' >&2; exit 1; fi
          git diff --cached --check
          git status --short
          git commit -m "Complete Religion Formidling og kulturarv prerequisites"
          git push origin HEAD:agent/civication-religion-formidling-og-kulturarv-prerequisites-20260908
