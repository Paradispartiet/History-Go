name: Fix Møllergata 19 quiz method

on:
  push:
    paths:
      - ".github/workflows/mollergata-19-method-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace invalid method ID
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const quizPath = 'data/quiz/historie/mollergata_19_sets.json';
          const methodsPath = 'data/fag/historie/methods_historie_canonical_v4_5.json';
          const quiz = JSON.parse(fs.readFileSync(quizPath, 'utf8'));
          const methods = JSON.parse(fs.readFileSync(methodsPath, 'utf8'));
          const canonical = new Set((methods.methods || []).map(method => method.method_id));
          const question = (quiz.sets || []).flatMap(set => set.questions || []).find(q => q.id === 'mollergata_19_s1_q5');
          if (!question) throw new Error('Question q5 missing');
          question.method_id = 'met_periodisering';
          question.guidance_basis = { ...(question.guidance_basis || {}), method_id: 'met_periodisering' };
          if (!canonical.has(question.method_id)) throw new Error('Replacement method is not canonical');
          for (const q of (quiz.sets || []).flatMap(set => set.questions || [])) {
            if (!canonical.has(q.method_id)) throw new Error(`Non-canonical method remains: ${q.id} -> ${q.method_id}`);
          }
          fs.writeFileSync(quizPath, JSON.stringify(quiz, null, 2) + '\n');
          NODE

          rm .github/workflows/mollergata-19-method-fix.yml
          git config user.name "history-go-data-bot"
          git config user.email "history-go-data-bot@users.noreply.github.com"
          git add data/quiz/historie/mollergata_19_sets.json .github/workflows/mollergata-19-method-fix.yml
          git commit -m "Use canonical Møllergata 19 quiz method"
          git pull --rebase origin main
          git push
