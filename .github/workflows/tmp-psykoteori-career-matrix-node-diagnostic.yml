name: Temporary Psykoteori career-matrix baseline diagnostic

on:
  push:
    branches:
      - codex/diagnose-career-matrix-node-20261009
    paths:
      - .github/workflows/tmp-psykoteori-career-matrix-node-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          ref: d64f72896ea1186b8cd0b0c00026181c512a2504
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 5dc64c42d904e4cf1cfab5bb6189d5d9f378fbfe
          path: psychology
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node 22 baseline and Psykoteori exact-head comparison
        run: |
          set +e
          echo "NODE=$(node --version)"
          (cd baseline && node scripts/audit-civication-career-gameplay.mjs --check); echo "BASELINE_NODE22_EXIT=$?"
          (cd psychology && node scripts/audit-civication-career-gameplay.mjs --check); echo "PSYKO_NODE22_EXIT=$?"
          exit 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Node 24 baseline and Psykoteori exact-head comparison
        run: |
          set +e
          echo "NODE=$(node --version)"
          (cd baseline && node scripts/audit-civication-career-gameplay.mjs --check); echo "BASELINE_NODE24_EXIT=$?"
          (cd psychology && node scripts/audit-civication-career-gameplay.mjs --check); echo "PSYKO_NODE24_EXIT=$?"
          exit 0
      - name: Remove temporary diagnostics workflow and commit cleanup
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-psykoteori-career-matrix-node-diagnostic.yml
          git add -- .github/workflows/tmp-psykoteori-career-matrix-node-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary career matrix Node-version diagnostic"
          git push origin HEAD:codex/diagnose-career-matrix-node-20261009
