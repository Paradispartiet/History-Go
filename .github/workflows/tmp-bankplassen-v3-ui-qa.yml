name: TEMP Bankplassen v3 UI QA

on:
  push:
    branches:
      - repair/bankplassen-4-v3-clean-20260916
    paths:
      - .github/workflows/tmp-bankplassen-v3-ui-qa.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build web runtime
        run: npm run build:web
      - name: Capture desktop and mobile PlaceCard plus popup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/place-production/qa-bankplassen-v3
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/bankplassen-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const outDir = 'reports/place-production/qa-bankplassen-v3';
          const placeId = 'norges_bank_bankplassen_4';
          const url = `http://127.0.0.1:4173/#/place/${placeId}`;
          const browser = await chromium.launch({ headless: true });
          const audits = [];

          async function capture(name, viewport, isMobile = false) {
            const context = await browser.newContext({
              viewport,
              deviceScaleFactor: 1,
              isMobile,
              hasTouch: isMobile,
              locale: 'nb-NO',
              geolocation: { latitude: 59.9087, longitude: 10.7390 },
              permissions: ['geolocation'],
            });
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() === 'error') pageErrors.push(`console: ${message.text()}`);
            });

            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => window.__HG_ROUTER_STARTED__ === true, null, { timeout: 60000 });
            await page.waitForSelector('#placeCard[aria-hidden="false"]', { state: 'visible', timeout: 60000 });
            await page.waitForFunction(() => (document.querySelector('#pcTitle')?.textContent || '').includes('Norges Bank'), null, { timeout: 30000 });
            await page.waitForFunction(() => {
              const img = document.querySelector('#pcFrontImage');
              return Boolean(img && img.complete && img.naturalWidth > 0 && img.naturalHeight > 0);
            }, null, { timeout: 30000 });

            const placeCardAudit = await page.evaluate(() => {
              const visible = id => {
                const el = document.getElementById(id);
                if (!el || el.hidden) return false;
                const style = getComputedStyle(el);
                return style.display !== 'none' && style.visibility !== 'hidden';
              };
              const img = document.querySelector('#pcFrontImage');
              return {
                title: (document.querySelector('#pcTitle')?.textContent || '').trim(),
                meta: (document.querySelector('#pcMeta')?.textContent || '').trim(),
                description: (document.querySelector('#pcDesc')?.textContent || '').trim(),
                front_image: img?.getAttribute('src') || '',
                front_image_size: [img?.naturalWidth || 0, img?.naturalHeight || 0],
                people_visible: visible('pcPeopleIcon'),
                brands_visible: visible('pcBrandsIcon'),
                works_visible: visible('pcWorksIcon'),
                forna_visible: visible('pcForNaIcon'),
                leksikon_visible: visible('pcLeksikonIcon'),
              };
            });
            if (placeCardAudit.title !== 'Norges Bank – Bankplassen 4') {
              throw new Error(`${name}: unexpected title ${JSON.stringify(placeCardAudit.title)}`);
            }
            if (!placeCardAudit.people_visible || !placeCardAudit.brands_visible) {
              throw new Error(`${name}: expected People and Brands collections to be visible: ${JSON.stringify(placeCardAudit)}`);
            }
            await page.screenshot({ path: `${outDir}/${name}-placecard.png`, fullPage: true });

            await page.click('#pcInfo');
            await page.waitForSelector('.hg-place-popup-v2', { state: 'visible', timeout: 30000 });
            const popupTitle = (await page.locator('.hg-place-popup-v2 .hg-popup-title').first().textContent() || '').trim();
            if (popupTitle !== 'Norges Bank – Bankplassen 4') {
              throw new Error(`${name}: unexpected popup title ${JSON.stringify(popupTitle)}`);
            }
            await page.screenshot({ path: `${outDir}/${name}-popup.png`, fullPage: true });

            audits.push({ name, viewport, isMobile, placeCardAudit, popupTitle, pageErrors });
            await context.close();
          }

          await capture('desktop', { width: 1440, height: 1000 }, false);
          await capture('mobile', { width: 390, height: 844 }, true);
          await browser.close();
          fs.writeFileSync(`${outDir}/audit.json`, JSON.stringify({ placeId, url, audits }, null, 2) + '\n');
          NODE
      - name: Commit QA evidence for inspection
        shell: bash
        run: |
          set -euo pipefail
          git add reports/place-production/qa-bankplassen-v3
          git config user.name 'Bankplassen V3 QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'qa: capture Bankplassen UI screenshots'
          git push origin HEAD:repair/bankplassen-4-v3-clean-20260916
