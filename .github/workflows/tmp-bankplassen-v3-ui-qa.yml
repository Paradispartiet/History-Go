name: TEMP Bankplassen v3 UI QA

on:
  push:
    branches:
      - repair/bankplassen-4-v3-clean-20260916
    paths:
      - .github/workflows/tmp-bankplassen-v3-ui-qa.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build web runtime
        run: npm run build:web
      - name: Capture desktop and mobile PlaceCard plus popup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/place-production/qa-bankplassen-v3
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/bankplassen-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const gha = value => String(value)
            .replace(/%/g, '%25')
            .replace(/\r/g, '%0D')
            .replace(/\n/g, '%0A');

          (async () => {
            const outDir = 'reports/place-production/qa-bankplassen-v3';
            const placeId = 'norges_bank_bankplassen_4';
            const expectedTitle = 'Norges Bank – Bankplassen 4';
            const url = `http://127.0.0.1:4173/#/place/${placeId}`;
            const browser = await chromium.launch({ headless: true });
            const audits = [];

            async function capture(name, viewport, isMobile = false) {
              const context = await browser.newContext({
                viewport,
                deviceScaleFactor: 1,
                isMobile,
                hasTouch: isMobile,
                locale: 'nb-NO',
                geolocation: { latitude: 59.9087, longitude: 10.7390 },
                permissions: ['geolocation'],
              });
              const page = await context.newPage();
              const pageErrors = [];
              let blockerAudit = null;
              page.on('pageerror', error => pageErrors.push(`pageerror: ${error.message}`));
              page.on('console', message => {
                if (message.type() === 'error') pageErrors.push(`console: ${message.text()}`);
              });

              try {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForFunction(() => window.__HG_ROUTER_STARTED__ === true, null, { timeout: 60000 });

                const onboardingModal = page.locator('#hgOnboardingModal');
                const onboardingStart = page.locator('#hgOnboardingModal [data-action="start"]');
                await onboardingModal.waitFor({ state: 'visible', timeout: 30000 });
                if (!await onboardingStart.isVisible().catch(() => false)) {
                  throw new Error(`${name}: onboarding modal visible but start action is not visible`);
                }
                await onboardingStart.click();
                await onboardingModal.waitFor({ state: 'hidden', timeout: 30000 });

                await page.waitForFunction(() => {
                  const pos = window.HGPos?.getPos?.();
                  return Boolean(pos && Number.isFinite(pos.lat) && Number.isFinite(pos.lon));
                }, null, { timeout: 30000 });
                await page.waitForFunction((targetPlaceId) => {
                  const currentId = String(document.querySelector('#placeCard')?.dataset?.currentPlaceId || '').trim();
                  return Boolean(currentId) && currentId !== targetPlaceId;
                }, placeId, { timeout: 30000 });

                await page.evaluate(() => window.HGAppRouter?.render?.());
                await page.waitForSelector('#placeCard[aria-hidden="false"]', { state: 'visible', timeout: 60000 });
                await page.waitForFunction((targetPlaceId) => {
                  return String(document.querySelector('#placeCard')?.dataset?.currentPlaceId || '').trim() === targetPlaceId;
                }, placeId, { timeout: 30000 });
                await page.waitForFunction((title) => (document.querySelector('#pcTitle')?.textContent || '').trim() === title, expectedTitle, { timeout: 30000 });
                await page.waitForFunction(() => {
                  const img = document.querySelector('#pcFrontImage');
                  return Boolean(img && img.complete && img.naturalWidth > 0 && img.naturalHeight > 0);
                }, null, { timeout: 30000 });

                const placeCardAudit = await page.evaluate(() => {
                  const visible = id => {
                    const el = document.getElementById(id);
                    if (!el || el.hidden) return false;
                    const style = getComputedStyle(el);
                    return style.display !== 'none' && style.visibility !== 'hidden';
                  };
                  const img = document.querySelector('#pcFrontImage');
                  return {
                    title: (document.querySelector('#pcTitle')?.textContent || '').trim(),
                    meta: (document.querySelector('#pcMeta')?.textContent || '').trim(),
                    description: (document.querySelector('#pcDesc')?.textContent || '').trim(),
                    front_image: img?.getAttribute('src') || '',
                    front_image_size: [img?.naturalWidth || 0, img?.naturalHeight || 0],
                    people_visible: visible('pcPeopleIcon'),
                    brands_visible: visible('pcBrandsIcon'),
                    works_visible: visible('pcWorksIcon'),
                    forna_visible: visible('pcForNaIcon'),
                    leksikon_visible: visible('pcLeksikonIcon'),
                  };
                });
                if (placeCardAudit.title !== expectedTitle) {
                  throw new Error(`${name}: unexpected title ${JSON.stringify(placeCardAudit.title)}`);
                }
                if (!placeCardAudit.people_visible || !placeCardAudit.brands_visible) {
                  throw new Error(`${name}: expected People and Brands collections to be visible: ${JSON.stringify(placeCardAudit)}`);
                }
                await page.screenshot({ path: `${outDir}/${name}-placecard.png`, fullPage: true });

                blockerAudit = await page.evaluate(() => {
                  const button = document.querySelector('#pcInfo');
                  if (!button) return { error: 'pcInfo missing' };
                  const rect = button.getBoundingClientRect();
                  const x = rect.left + rect.width / 2;
                  const y = rect.top + rect.height / 2;
                  const top = document.elementFromPoint(x, y);
                  const describe = el => {
                    if (!el) return null;
                    const chain = [];
                    let cur = el;
                    for (let i = 0; cur && i < 6; i += 1, cur = cur.parentElement) {
                      chain.push({
                        tag: cur.tagName,
                        id: cur.id || '',
                        className: typeof cur.className === 'string' ? cur.className : '',
                        role: cur.getAttribute?.('role') || '',
                        ariaModal: cur.getAttribute?.('aria-modal') || '',
                        text: (cur.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 240),
                      });
                    }
                    return chain;
                  };
                  const visibleCandidates = [...document.querySelectorAll('[role="dialog"], [aria-modal="true"], .modal, [class*="modal" i], [class*="overlay" i], [class*="welcome" i], [class*="consent" i]')]
                    .filter(el => {
                      const style = getComputedStyle(el);
                      const r = el.getBoundingClientRect();
                      return style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity || 1) !== 0 && r.width > 0 && r.height > 0;
                    })
                    .slice(0, 20)
                    .map(el => {
                      const r = el.getBoundingClientRect();
                      return {
                        tag: el.tagName,
                        id: el.id || '',
                        className: typeof el.className === 'string' ? el.className : '',
                        role: el.getAttribute('role') || '',
                        ariaModal: el.getAttribute('aria-modal') || '',
                        rect: [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)],
                        text: (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 500),
                      };
                    });
                  return {
                    buttonRect: [Math.round(rect.left), Math.round(rect.top), Math.round(rect.width), Math.round(rect.height)],
                    center: [Math.round(x), Math.round(y)],
                    topAtCenter: describe(top),
                    buttonChain: describe(button),
                    visibleCandidates,
                  };
                });
                console.log(`BLOCKER_DIAG ${name} ${JSON.stringify(blockerAudit)}`);
                console.error(`::notice title=BLOCKER_DIAG ${name}::${gha(JSON.stringify(blockerAudit))}`);

                await page.click('#pcInfo');
                await page.waitForFunction((targetPlaceId) => {
                  const card = document.querySelector('#placeCard');
                  const shell = card?.querySelector('[data-hg-place-sheet-shell="1"]');
                  const about = card?.querySelector('[data-hg-place-sheet-section="about"]');
                  if (!card || !shell || !about) return false;
                  const cardRect = card.getBoundingClientRect();
                  const aboutRect = about.getBoundingClientRect();
                  const aboutNearTop = aboutRect.top >= cardRect.top - 32
                    && aboutRect.top <= cardRect.top + Math.min(260, cardRect.height * 0.4);
                  return String(card.dataset.currentPlaceId || '').trim() === targetPlaceId
                    && String(card.dataset.hgUnifiedPlaceId || '').trim() === targetPlaceId
                    && String(shell.dataset.placeId || '').trim() === targetPlaceId
                    && card.classList.contains('is-unified-place')
                    && card.dataset.hgPlaceSheetRenderState === 'full-ready'
                    && about.dataset.hgPlaceSheetRenderState === 'rendered'
                    && aboutNearTop;
                }, placeId, { timeout: 30000 });
                const popupTitle = (await page.locator('#pcTitle').textContent() || '').trim();
                if (popupTitle !== expectedTitle) {
                  throw new Error(`${name}: unexpected info-surface title ${JSON.stringify(popupTitle)}`);
                }
                await page.screenshot({ path: `${outDir}/${name}-popup.png`, fullPage: true });

                audits.push({ name, viewport, isMobile, placeCardAudit, popupTitle, pageErrors });
              } catch (error) {
                const locatorState = await page.evaluate(() => {
                  const button = document.querySelector('#pcInfo');
                  if (!button) return { error: 'pcInfo missing' };
                  const rect = button.getBoundingClientRect();
                  const style = getComputedStyle(button);
                  const centerX = rect.left + rect.width / 2;
                  const centerY = rect.top + rect.height / 2;
                  const top = document.elementFromPoint(centerX, centerY);
                  const describe = el => el ? {
                    tag: el.tagName,
                    id: el.id || '',
                    className: typeof el.className === 'string' ? el.className : '',
                    text: (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 500),
                  } : null;
                  return {
                    rect: [Math.round(rect.left), Math.round(rect.top), Math.round(rect.width), Math.round(rect.height)],
                    display: style.display,
                    visibility: style.visibility,
                    opacity: style.opacity,
                    disabled: Boolean(button.disabled),
                    ariaHidden: button.getAttribute('aria-hidden'),
                    ariaDisabled: button.getAttribute('aria-disabled'),
                    topAtCenter: describe(top),
                  };
                }).catch(locatorError => ({ error: `locator audit failed: ${locatorError.message}` }));
                const failure = {
                  name,
                  viewport,
                  isMobile,
                  requestedUrl: url,
                  currentUrl: page.url(),
                  message: error?.message || String(error),
                  stack: error?.stack || '',
                  locatorState,
                  blockerAudit,
                  pageErrors,
                };
                fs.writeFileSync(`${outDir}/${name}-failure.json`, JSON.stringify(failure, null, 2) + '\n');
                await page.screenshot({ path: `${outDir}/${name}-failure.png`, fullPage: true }).catch(screenshotError => {
                  fs.writeFileSync(`${outDir}/${name}-screenshot-error.txt`, `${screenshotError.stack || screenshotError.message || screenshotError}\n`);
                });
                const html = await page.content().catch(contentError => `<!-- page.content failed: ${contentError.message} -->`);
                fs.writeFileSync(`${outDir}/${name}-failure.html`, html);
                console.error(`FAILURE_DIAG ${name} ${JSON.stringify(failure)}`);
                throw error;
              } finally {
                await context.close().catch(() => {});
              }
            }

            await capture('desktop', { width: 1440, height: 1000 }, false);
            await capture('mobile', { width: 390, height: 844 }, true);
            await browser.close();
            fs.writeFileSync(`${outDir}/audit.json`, JSON.stringify({ placeId, url, audits }, null, 2) + '\n');
          })().catch(error => {
            console.error(error);
            const detail = error?.stack || error?.message || String(error);
            console.error(`::error title=Bankplassen UI QA::${gha(detail)}`);
            process.exit(1);
          });
          NODE
      - name: Upload QA failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bankplassen-v3-ui-qa-${{ github.run_id }}
          path: reports/place-production/qa-bankplassen-v3
          if-no-files-found: error
          retention-days: 7
      - name: Commit QA evidence for inspection
        shell: bash
        run: |
          set -euo pipefail
          git add reports/place-production/qa-bankplassen-v3
          git config user.name 'Bankplassen V3 QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'qa: capture Bankplassen UI screenshots'
          git push origin HEAD:repair/bankplassen-4-v3-clean-20260916
