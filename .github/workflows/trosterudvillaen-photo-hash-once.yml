name: Trosterudvillaen Civication People index reconciliation (temporary)
on:
  push:
    branches:
      - content/trosterudvillaen-visual-story-20261110
    paths:
      - '.github/workflows/trosterudvillaen-photo-hash-once.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/trosterudvillaen-visual-story-20261110
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate Civication people registry from canonical People sources
        run: npm run civication:history-people:build
      - name: Commit only derived Civication index
        run: |
          git add data/Civication/historyPeople_index.json
          if git diff --cached --quiet; then
            echo "Civication People registry already current"
            exit 0
          fi
          git -c user.name="HistoryGo CI" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Sync Aimée Sommerfelt in Civication People index"
          git push origin HEAD:content/trosterudvillaen-visual-story-20261110
