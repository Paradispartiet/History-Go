name: Generate Oslo posthus production

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/oslo-quiz-oslo-posthus-5x7' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-quiz-oslo-posthus-5x7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate canonical package
        run: node scripts/repair-oslo-posthus-production.mjs
      - name: Commit generated files
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fag/fag_manifest.json \
            data/quiz/naeringsliv/oslo_posthus_sets_merged.json \
            data/quiz/production_briefs/naeringsliv/oslo_posthus.json \
            data/quiz/production_context/naeringsliv/oslo_posthus.json \
            tests/quiz-production-pipeline.test.mjs
          git commit -m "Generer kanonisk Oslo posthus-quiz"
          git push origin HEAD:agent/oslo-quiz-oslo-posthus-5x7
