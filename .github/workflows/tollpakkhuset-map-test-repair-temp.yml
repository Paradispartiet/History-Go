name: Tollpakkhuset map cache assertion repair

on:
  push:
    branches: [agent/tollpakkhuset-completion-20260911-v2]
    paths:
      - ".github/workflows/tollpakkhuset-map-test-repair-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Repair only the stale index cache-bust assertion
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'tests/map-place-area-lod.test.mjs';
          const before = fs.readFileSync(path, 'utf8');
          const oldLine = '  assert.match(index, /js\\/app\\.js\\?v=20260824-area-square-dom3/);';
          const newLine = '  assert.match(index, /js\\/app\\.js\\?v=20260911-explore-meet-runtime2/);';
          const occurrences = before.split(oldLine).length - 1;
          if (occurrences !== 1) throw new Error(`Expected exactly one stale assertion, found ${occurrences}`);
          const after = before.replace(oldLine, newLine);
          fs.writeFileSync(path, after);
          NODE
          git diff --check
          git diff -- tests/map-place-area-lod.test.mjs

      - name: Verify Map LOD contract
        run: node --test tests/map-place-area-lod.test.mjs

      - name: Commit self-cleaned repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/tollpakkhuset-map-test-repair-temp.yml
          git add tests/map-place-area-lod.test.mjs .github/workflows/tollpakkhuset-map-test-repair-temp.yml
          git diff --cached --check
          git commit -m "Align Map LOD cache assertion with current app runtime"
          git push origin HEAD:${GITHUB_REF_NAME}
