name: Temporary Minneparken latest-main semantic refresh with full QA
on:
  push:
    branches:
      - content/minneparken-kildebasert-leksikon-20261103
    paths:
      - .github/workflows/minneparken-final-main-refresh-temp.yml
permissions:
  contents: write
jobs:
  verify-and-refresh-draft:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/minneparken-kildebasert-leksikon-20261103
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Freeze latest main snapshot, verify all new paths, and merge to staged draft
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/minneparken-final-main-qa
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          base="$(git merge-base HEAD origin/main)"
          git rev-parse HEAD > artifacts/minneparken-final-main-qa/pr-head-before.txt
          git rev-parse origin/main > artifacts/minneparken-final-main-qa/main-snapshot.txt
          git diff --name-only "$base" origin/main > artifacts/minneparken-final-main-qa/new-main-paths.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const paths=fs.readFileSync('artifacts/minneparken-final-main-qa/new-main-paths.txt','utf8').trim().split('\n').filter(Boolean);
          const allowed=new Set([
            'css/place-card-round-gallery.css',
            'data/Civication/careerGameplayMatrix.json',
            'data/Civication/compiledSceneRegistryV1.json',
            'data/Civication/mailFamilies/naeringsliv/followup/renholder_followup.json',
            'data/Civication/mailFamilies/naeringsliv/job/renholder_job.json',
            'data/Civication/roleWorldRolloutReadiness.json',
            'data/people/staging/toyenbadet_people_20261103.json',
            'index.html',
            'js/ui/place-card-round-gallery.js',
            'reports/civication-realism-inspiration-symposium-audit-20261103.md',
            'reports/place-production/toyenbadet-people-field-claims-20261103.json',
            'reports/place-production/toyenbadet-workcard-current.json',
            'scripts/audit-civication-realism-triad.cjs',
            'tests/civication-realism-triad-coverage.test.js',
            'tests/civication-renholder-persistent-zone-case.test.js',
            'tests/place-card-round-gallery.test.mjs',
            'tests/toyenbadet-people-staging-source-gate.test.mjs',
            'tests/toyenbadet-source-backed-objects.test.mjs',
          ]);
          assert.ok(paths.length>0,'Expected latest main changes');
          const unknown=paths.filter(p=>!allowed.has(p));
          console.log('Scoped main snapshot changes:',JSON.stringify(paths));
          if(unknown.length)throw Error('New main paths not yet reviewed: '+unknown.join(', '));
          NODE
          git merge --no-ff --no-commit origin/main > artifacts/minneparken-final-main-qa/merge-log.txt 2>&1 || {
            echo 'New main has conflicts requiring another source-aware review:' >&2
            cat artifacts/minneparken-final-main-qa/merge-log.txt >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          }
          test -f .git/MERGE_HEAD
          test -z "$(git diff --name-only --diff-filter=U)"
          echo "PASS clean staged main snapshot: $(git rev-parse origin/main)"
      - run: npm ci --no-audit --no-fund
      - name: Full canonical generator checks, Story integrity and strict Knowledge register
        shell: bash
        run: |
          set -euo pipefail
          npm run places:index:check
          npm run epoker:places:check
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run knowledge:canonical:check
          npm run check:stories
          node --test tests/minneparken-historical-photo-provenance.test.mjs tests/minneparken-quiz-source-parity.test.mjs tests/minneparken-knowledge-registry.test.mjs tests/minneparken-story-candidate.test.mjs
          node --test tests/place-card-round-gallery.test.mjs tests/toyenbadet-people-staging-source-gate.test.mjs tests/toyenbadet-source-backed-objects.test.mjs
          node --test tests/civication-realism-triad-coverage.test.js tests/civication-renholder-persistent-zone-case.test.js
      - name: Real PlaceCard, Fagverk, quiz and QuizCard browser on merged main (both viewports)
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          node tests/minneparken-readonly-app-browser.test.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const id='minneparken_gamlebyen';
          const qp='data/quiz/manifest.json',cp='data/quizcards/historie/manifest.json';
          const q=read(qp),c=read(cp),h=read('data/places/historie-production/'+id+'.json');
          assert.ok(!q.sets.some(s=>s.targetId===id));
          assert.ok(!c.collections.includes(id+'_quizcard_v1.json'));
          assert.equal(h.status,'blocked');
          for(const gate of ['F','G','H'])assert.equal(h.gates[gate].status,'N/A');
          q.sets.push({targetId:id,file:'data/quiz/historie/'+id+'_sets.json'});
          c.collections.push(id+'_quizcard_v1.json');
          fs.writeFileSync(qp,JSON.stringify(q,null,2)+'\n');
          fs.writeFileSync(cp,JSON.stringify(c,null,2)+'\n');
          console.log('Temporary quiz registration ONLY in CI worktree');
          NODE
          node scripts/verify-minneparken-quizcard-real-browser.mjs
          node scripts/verify-place-quiz-browser.mjs minneparken_gamlebyen
          git restore --worktree -- data/quiz/manifest.json data/quizcards/historie/manifest.json
          echo 'PASS merged real-browser source, card, fullquiz and no physical visit write'
      - name: Final scope and fail-closed gate review, then commit only draft-branch main merge
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const id='minneparken_gamlebyen';
          const h=read('data/places/historie-production/'+id+'.json');
          assert.equal(h.status,'blocked');
          for(const gate of ['F','G','H'])assert.equal(h.gates[gate].status,'N/A');
          assert.ok(!read('data/quiz/manifest.json').sets.some(s=>s.targetId===id));
          assert.ok(!read('data/quizcards/historie/manifest.json').collections.includes(id+'_quizcard_v1.json'));
          assert.ok(!read('data/stories/stories_manifest.json').files.some(s=>s.path==='data/stories/stories_'+id+'.json'));
          const q=read('data/quiz/historie/'+id+'_sets.json').sets.flatMap(s=>s.questions);
          assert.equal(q.filter(x=>x.knowledge_link_status==='linked').length,21);
          assert.equal(new Set(q.flatMap(x=>x.knowledge_unit_ids)).size,32);
          for(const place of ['minneparken_gamlebyen','oslo_prosjektrom','fotogalleriet']){
            assert.ok(read('data/fagverk/fagverk_registry.json').placeLinks[place]);
          }
          console.log('PASS strict unpublished F/G/H and all three source contributions');
          NODE
          git diff --quiet
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Merge updated main into Minneparken draft after Knowledge and full browser QA"
          git push origin HEAD:content/minneparken-kildebasert-leksikon-20261103
          git rev-parse HEAD > artifacts/minneparken-final-main-qa/merged-draft-head.txt
          echo 'PASS branch-only merge. PR remains draft; no release or main merge.'
      - name: Upload QA proof and fixed main snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minneparken-final-main-integration-qa
          path: artifacts/minneparken-final-main-qa/
          retention-days: 30
          if-no-files-found: warn
