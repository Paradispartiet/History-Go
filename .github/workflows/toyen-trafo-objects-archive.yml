name: Tøyen trafo – archive Objects integration
on:
  push:
    branches: [content/toyen-trafo-objects-apparatpult-kjerne-20261105]
    paths:
      - 'data/places/naeringsliv/oslo/places_naeringsliv_oslo_kultureiendommer_batch_04/toyen_trafo.json'
      - 'bilder/objects/toyen_trafo_*_illustrasjon.svg'
      - '.github/workflows/toyen-trafo-objects-archive.yml'
      - 'tests/toyen-trafo-objects-archive.test.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: toyen-trafo-archive-objects-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate:
    name: Build source-grounded Objects and verify runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Record canonical READ-FIRST rule evidence for Næringsliv
        run: |
          node scripts/place-production-rule-preflight.mjs record --place-id toyen_trafo --category naeringsliv --workcard reports/place-production/toyen-trafo-workcard-current.json
          node scripts/place-production-rule-preflight.mjs validate --workcard reports/place-production/toyen-trafo-workcard-current.json
      - name: Rebuild canonical Places index and Place-open
        run: |
          npm run places:index:build
          npm run place-open:build
      - name: Verify Objects, source mapping, all prior collections, and index parity
        run: |
          node --test tests/toyen-trafo-objects-archive.test.mjs tests/toyen-trafo-people-contract.test.mjs tests/toyen-trafo-people-illustrations.test.mjs tests/toyen-trafo-brands-contract.test.mjs
          npm run places:index:check
          npm run place-open:check
      - name: Install Chromium for actual PlaceCard inspection
        run: npx playwright install --with-deps chromium
      - name: Verify Tøyen trafo People and Objects in mobile and desktop UI
        run: node tests/toyen-trafo-objects-real-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toyen-trafo-objects-browser
          path: artifacts/toyen-trafo-objects/
          if-no-files-found: ignore
      - name: Commit generated index and runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/places_index.json data/runtime/place-open/toyen_trafo.json reports/place-production/toyen-trafo-workcard-current.json
          if ! git diff --cached --quiet; then
            git commit -m "Tøyen trafo: sync Places index and Place-open for archived Objects"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
