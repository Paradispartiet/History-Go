name: TEMP Civication Vitenskap Doktorlop postdoktor knowledge repair

on:
  push:
    branches:
      - agent/civication-vitenskap-doktorlop-postdoktor-knowledge-repair-20260908
    paths:
      - scripts/TEMP_repair_vitenskap_doktorlop_postdoktor_knowledge.mjs
      - .github/workflows/TEMP-civication-vitenskap-doktorlop-postdoktor-knowledge-repair.yml
permissions:
  contents: write
concurrency:
  group: temp-civication-vitenskap-doktorlop-postdoktor-knowledge-repair
  cancel-in-progress: true
jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-vitenskap-doktorlop-postdoktor-knowledge-repair-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Require fresh main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'Branch is stale versus main.' >&2; exit 1; }
      - name: Syntax
        run: node --check scripts/TEMP_repair_vitenskap_doktorlop_postdoktor_knowledge.mjs
      - name: Repair career knowledge foundation
        run: node scripts/TEMP_repair_vitenskap_doktorlop_postdoktor_knowledge.mjs
      - name: Regenerate career and readiness surfaces
        run: |
          set -euo pipefail
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Require knowledge component complete and only Role World authored work left
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const key='vitenskap/vitenskap_doktorlop_og_postdoktor';
          const career=JSON.parse(fs.readFileSync('data/Civication/careerGameplayMatrix.json','utf8')).worlds.find(r=>r.key===key);
          if(!career)throw new Error('career row missing');
          if(career.audit?.components?.knowledge?.level!=='complete')throw new Error('career knowledge not complete: '+JSON.stringify(career.audit?.components?.knowledge));
          const readiness=JSON.parse(fs.readFileSync('data/Civication/roleWorldRolloutReadiness.json','utf8')).roles.find(r=>r.key===key);
          if(!readiness)throw new Error('readiness row missing');
          if((readiness.authored_work_required||[]).includes('career:knowledge'))throw new Error('career:knowledge still open');
          const expected=['history_go_affordance','situated_reputation'];
          if(JSON.stringify(readiness.authored_work_required)!==JSON.stringify(expected))throw new Error('unexpected authored work: '+JSON.stringify(readiness.authored_work_required));
          console.log('Doktorlop/postdoktor knowledge foundation complete; Role World-only authored work remains.');
          NODE
      - name: Verify Career Gameplay Matrix
        run: node tests/civication-career-gameplay-matrix.test.js
      - name: Verify Role World readiness
        run: node tests/civication-role-world-rollout-readiness.test.js
      - name: Verify full Civication suite
        run: node tests/run-civication-tests.mjs
      - name: Verify job learning profiles
        run: npm run audit:job-learning-profiles
      - name: Verify job knowledge requirements
        run: npm run audit:job-knowledge-requirements
      - name: Require fresh main ancestry before scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'main moved during repair verification.' >&2; exit 1; }
      - name: Verify exact permanent repair scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          [ "${#changed[@]}" -eq 5 ] || { echo "Expected exactly 5 permanent repair paths, found ${#changed[@]}" >&2; exit 1; }
          for f in "${changed[@]}"; do
            case "$f" in
              data/Civication/workGrammars/vitenskap/vitenskap_doktorlop_og_postdoktor.json|data/Civication/careerGameplayMatrix.json|data/Civication/roleWorldRolloutReadiness.json|reports/civication-career-gameplay-matrix.md|reports/civication-role-world-rollout-readiness.md) ;;
              *) echo "Unexpected repair path: $f" >&2; exit 1;;
            esac
          done
          git diff --check
      - name: Require fresh main ancestry before permanent commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'main moved before permanent commit.' >&2; exit 1; }
      - name: Commit permanent verified repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/TEMP_repair_vitenskap_doktorlop_postdoktor_knowledge.mjs
          rm -f .github/workflows/TEMP-civication-vitenskap-doktorlop-postdoktor-knowledge-repair.yml
          git diff --check
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Complete Doktorlop postdoktor knowledge foundation"
          git push origin HEAD:agent/civication-vitenskap-doktorlop-postdoktor-knowledge-repair-20260908
