name: Tronsmo Litteratur Knowledge partition repair

on:
  push:
    branches:
      - agent/tronsmo-bokhandel-completion-20260910

permissions:
  contents: write

jobs:
  repair:
    if: ${{ contains(github.event.head_commit.message, '[tronsmo-litteratur-knowledge-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate canonical Knowledge registries
        run: npm run knowledge:canonical:write
      - name: Verify canonical Knowledge contract
        run: npm run knowledge:canonical:check
      - name: Commit Litteratur subject registries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/knowledge/subjects/litteratur/knowledge_units.generated.json \
            data/knowledge/subjects/litteratur/concepts.generated.json \
            data/knowledge/subjects/litteratur/terms.generated.json \
            data/knowledge/subjects/litteratur/stories.generated.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No Litteratur Knowledge partition changes to commit'
          else
            git commit -m "Materialize Tronsmo Litteratur Knowledge registries [tronsmo-litteratur-knowledge-materialized]"
            git push
          fi
