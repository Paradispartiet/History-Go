name: TEMP Kulturkirken Jakob people index repair

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-kulturkirken-jakob-people-index-repair.yml'
      - 'data/Civication/historyPeople_index.json'
      - 'data/people/**'

permissions:
  contents: read

concurrency:
  group: tmp-kulturkirken-jakob-people-index-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Civication history people index through canonical owner
        run: npm run civication:history-people:build
      - name: Verify Civication history people index parity
        run: npm run civication:history-people:check
      - name: Commit generated history people index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/historyPeople_index.json
          if git diff --cached --quiet; then
            echo "historyPeople_index is current."
          else
            git commit -m "build: regenerate Kulturkirken Jakob people index"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
