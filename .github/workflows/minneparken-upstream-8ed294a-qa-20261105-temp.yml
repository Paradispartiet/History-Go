name: Temporary Minneparken upstream 8ed294a read-only QA
on:
  push:
    branches:
      - qa/minneparken-upstream-8ed294a-20261105
    paths:
      - .github/workflows/minneparken-upstream-8ed294a-qa-20261105-temp.yml
permissions:
  contents: read
jobs:
  targeted-upstream-and-epoker-qa:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify exact pinned base and five-path allowlist
        shell: bash
        run: |
          set -euo pipefail
          BASE=8ed294acb466314c3b63f34b951357532676460d
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | sort > /tmp/observed-paths.txt
          cat > /tmp/expected-paths.txt <<'EXPECTED'
          .github/workflows/minneparken-upstream-8ed294a-qa-20261105-temp.yml
          docs/PEOPLE_AI_ILLUSTRATION_RULE.md
          scripts/verify-byplanlegging-asset-v1.mjs
          tests/badge-by-byplanlegging-v1-production.test.mjs
          tests/badge-by-samtidsarkitektur-v1-production.test.mjs
          EXPECTED
          diff -u /tmp/expected-paths.txt /tmp/observed-paths.txt
          git diff --check "$BASE" HEAD
          echo 'PASS: pinned main + only four upstream fix files + temporary read-only workflow'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify strict WebP assets and locale contracts
        run: |
          node scripts/verify-byplanlegging-asset-v1.mjs
          node --test tests/badge-by-samtidsarkitektur-v1-production.test.mjs tests/badge-by-byplanlegging-v1-production.test.mjs tests/badge-by-funksjonalisme-v1-locales.test.mjs
      - name: Verify current Epoker generator and index without modification
        run: |
          npm run epoker:places:check
          node --test tests/epoke-place-index.test.mjs
      - name: Check place-open and canonical places index
        run: |
          npm run place-open:check
          npm run places:index:check
      - name: Enforce read-only checkout and no release-manifest changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'PASS: no repository files changed during QA'
