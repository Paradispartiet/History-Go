name: Gråbein Lesespor UI QA (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-grabein-lesespor-ui.yml'
permissions:
  contents: read
concurrency:
  group: tmp-grabein-lesespor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check latest canonical data
        run: |
          node scripts/build-place-open-payloads.mjs --check
          node --test tests/museumsleiligheten-grabein-collections.test.mjs
      - name: Run real Lesespor popup on Chrome desktop/mobile
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          export CHROME_BIN
          node scripts/tmp-grabein-lesespor-qa.mjs
