name: Apply Bislett Vålerenga cross-links

on:
  push:
    branches:
      - data/people-bislett-crosslinks-20260714
    paths:
      - .github/workflows/apply-bislett-vif-crosslinks.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/people-bislett-crosslinks-20260714
      - name: Update existing people and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          # Apply the two canonical cross-link corrections.
          python - <<'PY'
          import json
          from pathlib import Path

          sport_path = Path('data/people/sport/oslo/people_sport_oslo.json')
          sport = json.loads(sport_path.read_text(encoding='utf-8'))
          klanen = next((item for item in sport if item.get('id') == 'klanen'), None)
          if klanen is None:
              raise SystemExit('klanen not found')

          klanen['desc'] = 'Vålerengas organiserte supporterfellesskap gjennom Bislett-, Ullevaal- og Intility-epokene.'
          klanen['tags'] = [
              'sport', 'fotball', 'valerenga', 'supporter', 'tifo',
              'tribunekultur', 'bislett', 'ullevaal', 'intility', 'oslo_ost'
          ]
          klanen['year'] = 1991
          klanen['popupDesc'] = (
              'Klanen ble etablert som Vålerengas uavhengige supporterklubb i 1991. '
              'Supporterkulturen fikk sin første organiserte hjemmeperiode på Bislett, '
              'fulgte klubben videre til Ullevaal fra 1999 og har siden 2017 hatt Intility Arena '
              'som sin direkte hjemmebane. Intility beholdes som hovedanker, mens Bislett og '
              'Ullevaal dokumenterer den historiske utviklingen og Valle Hovin beholdes som områdekobling.'
          )
          klanen['places'] = [
              'intility_arena',
              'bislett_stadion',
              'ullevaal_stadion',
              'valle_hovin_stadion',
          ]
          sport_path.write_text(json.dumps(sport, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          berg_path = Path('data/people/sport/oslo/ullevaal_stadion/henning_berg.json')
          berg_payload = json.loads(berg_path.read_text(encoding='utf-8'))
          berg = berg_payload[0] if isinstance(berg_payload, list) else berg_payload
          if berg.get('id') != 'henning_berg':
              raise SystemExit('henning_berg not found')

          berg['desc'] = 'Vålerenga-gjennombrudd på Bislett og forsvarsspiller i Norges mesterskapsgenerasjon på Ullevaal.'
          berg['tags'] = [
              'sport', 'fotball', 'landslaget', 'forsvar', 'valerenga',
              'bislett_stadion', 'ullevaal_stadion'
          ]
          berg['popupDesc'] = (
              'Henning Berg startet toppkarrieren i Vålerenga i 1988 og spilte for klubben til 1991, '
              'med Bislett som arena for gjennombruddsperioden. Senere ble han en sentral forsvarsspiller '
              'for Norge i 1990-årenes sterke landslagsperiode og nådde 100 landskamper. Ullevaal beholdes '
              'som hovedanker for mesterskapsgenerasjonen, mens Bislett dokumenterer starten på toppkarrieren.'
          )
          berg['places'] = ['ullevaal_stadion', 'bislett_stadion']
          berg_path.write_text(json.dumps([berg], ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/apply-bislett-vif-crosslinks.yml
          git add data/people/sport/oslo/people_sport_oslo.json \
                  data/people/sport/oslo/ullevaal_stadion/henning_berg.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Cross-link Klanen and Henning Berg to Bislett'
          git push origin HEAD:data/people-bislett-crosslinks-20260714
