name: tmp Ullevål Hageby fresh-main replay
on:
  push:
    branches:
      - work/ulleval-hageby-completion-20260902
permissions:
  contents: write
jobs:
  replay:
    if: github.event.head_commit.message != 'Replay Ullevål Hageby on fresh main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ulleval-hageby-completion-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Merge fresh main
        run: |
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Regenerate shared canonical state
        run: |
          npm ci --no-audit --no-fund
          npm run places:index:build
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
          npm run epoker:places:build
          npm run place-open:build
          npm run knowledge:canonical:write
          node - <<'NODE'
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const report = path.join(os.tmpdir(), 'ullevål-hageby-replay-image-audit.json');
          execFileSync(process.execPath, ['scripts/audit-place-images.mjs', '--mode=all', `--report=${report}`], { stdio: 'ignore' });
          const audit = JSON.parse(fs.readFileSync(report, 'utf8'));
          const file = 'data/places/place_image_backlog_summary.json';
          const backlog = JSON.parse(fs.readFileSync(file, 'utf8'));
          backlog.generatedAt = '2026-09-02';
          backlog.generatedFromCommit = 'ullevål_hageby_completion_replay_20260902';
          backlog.totalPlaces = audit.totalPlaces;
          backlog.summary = { validLocal: audit.summary.local, validRemote: audit.summary.remote, optionalMissing: audit.summary.optional, missing: audit.summary.missing, invalidLocalPath: audit.summary.invalid, remaining: audit.summary.missing + audit.summary.invalid };
          for (const [category, row] of Object.entries(audit.byCategory || {})) backlog.byCategory[category] = { ...backlog.byCategory[category], total: row.total, valid: row.local + row.remote, optional: row.optional, missing: row.missing, invalid: row.invalid };
          fs.writeFileSync(file, `${JSON.stringify(backlog, null, 2)}\n`);
          NODE
      - name: Verify replayed candidate
        run: |
          node tests/ullevål-hageby-completion.test.mjs
          npm run places:index:check
          npm run place-open:check
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          git diff --check
      - name: Publish replayed candidate
        run: |
          git add -A
          git commit -m "Replay Ullevål Hageby on fresh main"
          git push origin HEAD:work/ulleval-hageby-completion-20260902 --force
