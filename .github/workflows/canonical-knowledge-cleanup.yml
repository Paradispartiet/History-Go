name: Canonical Knowledge cleanup

on:
  pull_request:
    paths:
      - 'scripts/knowledge-canonical-data.mts'
      - 'scripts/apply-canonical-knowledge-cleanup.py'
      - '.github/workflows/canonical-knowledge-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/canonical-knowledge-data-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-knowledge-data-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply controlled source migration
        run: python scripts/apply-canonical-knowledge-cleanup.py
      - name: Build canonical data tooling
        run: npm run build:scripts
      - name: Backfill canonical IDs and registries
        run: node dist/scripts/knowledge-canonical-data.mjs --write
      - name: Build browser runtimes
        run: npm run build:web
      - name: Typecheck and verify canonical data
        run: |
          npm run typecheck:web
          npm run typecheck:scripts
          node dist/scripts/knowledge-canonical-data.mjs --check
          node dist/scripts/knowledge-canonical-data.mjs --legacy-only
          node dist/scripts/knowledge-canonical-data.mjs --audit-only
      - name: Run Knowledge tests
        run: npm run test:knowledge-core
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Knowledge browser E2E
        run: npm run test:knowledge-browser
      - name: Run Places check
        run: bash scripts/check-places.sh
      - name: Upload cleanup reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-knowledge-cleanup-reports
          path: |
            reports/knowledge-id-backfill.json
            reports/knowledge-contract-audit.json
            reports/knowledge-universe-readers.json
          if-no-files-found: warn
      - name: Commit verified cleanup
        run: |
          git config user.name 'History GO CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset -- scripts/apply-canonical-knowledge-cleanup.py .github/workflows/canonical-knowledge-cleanup.yml
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Canonicalize Knowledge data and retire legacy storage'
          git push origin HEAD:agent/canonical-knowledge-data-cleanup
