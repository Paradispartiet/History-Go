name: Canonical Knowledge cleanup

on:
  pull_request:
    paths:
      - 'scripts/knowledge-canonical-data.mts'
      - 'scripts/apply-canonical-knowledge-cleanup.py'
      - 'scripts/apply-canonical-review-queue.py'
      - 'scripts/apply-claim-id-separation.py'
      - '.github/workflows/canonical-knowledge-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/canonical-knowledge-data-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-knowledge-data-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply controlled source migration
        run: |
          python scripts/apply-canonical-knowledge-cleanup.py
          python scripts/apply-canonical-review-queue.py
          python scripts/apply-claim-id-separation.py
      - name: Build canonical data tooling
        run: npm run build:scripts
      - name: Backfill canonical IDs and registries
        run: node dist/scripts/knowledge-canonical-data.mjs --write
      - name: Build browser runtimes
        run: npm run build:web
      - name: Typecheck browser runtime
        run: npm run typecheck:web 2>&1 | tee reports/canonical-typecheck-web.log
      - name: Typecheck data tooling
        run: npm run typecheck:scripts 2>&1 | tee reports/canonical-typecheck-scripts.log
      - name: Verify canonical data has no drift
        run: node dist/scripts/knowledge-canonical-data.mjs --check 2>&1 | tee reports/canonical-data-check.log
      - name: Verify legacy readers are gone
        run: node dist/scripts/knowledge-canonical-data.mjs --legacy-only 2>&1 | tee reports/canonical-legacy-check.log
      - name: Verify Knowledge contract
        run: node dist/scripts/knowledge-canonical-data.mjs --audit-only 2>&1 | tee reports/canonical-contract-check.log
      - name: Run Knowledge tests
        run: npm run test:knowledge-core 2>&1 | tee reports/canonical-knowledge-tests.log
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Knowledge browser E2E
        run: npm run test:knowledge-browser 2>&1 | tee reports/canonical-browser-tests.log
      - name: Run Places check
        run: bash scripts/check-places.sh 2>&1 | tee reports/canonical-places-check.log
      - name: Upload cleanup reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-knowledge-cleanup-reports
          path: |
            reports/knowledge-id-backfill.json
            reports/knowledge-contract-audit.json
            reports/knowledge-universe-readers.json
            reports/canonical-*.log
            data/knowledge/knowledge_emne_review_queue.generated.json
          if-no-files-found: warn
      - name: Commit verified cleanup
        run: |
          git config user.name 'History GO CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset -- scripts/apply-canonical-knowledge-cleanup.py scripts/apply-canonical-review-queue.py scripts/apply-claim-id-separation.py .github/workflows/canonical-knowledge-cleanup.yml .github/workflows/knowledge-checks.yml .github/workflows/data-checks.yml
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Canonicalize Knowledge data and retire legacy storage'
          git push origin HEAD:agent/canonical-knowledge-data-cleanup
