name: TEMP validate and clean history power freeze

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/history-makt-quality-validator-cleanup
          fetch-depth: 0
      - name: Remove transient artifacts and complete the recorded emne correction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reports/coordinate-branch-runner/agent_oslo-coordinate-history-v5-5-power-curation-v3
          git checkout 746c21c18c3cab9ee2e3d5547732c74e3141754c -- \
            reports/coordinate-evidence-audit.md \
            reports/place-coordinate-intake-gate.md \
            reports/place-coordinate-quality-gate.md \
            reports/place-source-layout-audit.json
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'data/fag/historie/emner_historie_canonical_v4_5.json';
          const emners = JSON.parse(fs.readFileSync(path, 'utf8'));
          const target = emners.find((item) => item.emne_id === 'em_his_statlig_kapasitet_skatt_infrastruktur');
          if (!target) throw new Error('Target emne is missing');
          let replacements = 0;
          for (const key of ['key_concepts', 'core_concepts', 'sub_concepts']) {
            if (!Array.isArray(target[key])) continue;
            target[key] = target[key].map((label) => {
              if (label !== 'statlig') return label;
              replacements += 1;
              return 'territoriell konsolidering';
            });
          }
          if (replacements < 1 || replacements > 3) {
            throw new Error(`Expected 1-3 stale references in one emne, found ${replacements}`);
          }
          fs.writeFileSync(path, JSON.stringify(emners, null, 2) + '\n');
          console.log(`Replaced ${replacements} stale emne concept reference(s)`);
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Run permanent history freeze validators and dependent rebuilds
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/history-makt-quality-cleanup.log
          : > "$LOG"
          run() {
            printf '\n$ %s\n\n' "$*" | tee -a "$LOG"
            "$@" 2>&1 | tee -a "$LOG"
          }
          run node tools/validate-historie-makt-stat-institusjoner.mjs
          run node tools/validate-historie-quality-tid-periodisering.mjs
          run node tools/validate-historie-quality-kilder-arkiv-spor.mjs
          run node tools/validate-historie-v5.mjs
          run node scripts/build-quiz-production-context.mjs --category historie --target grindheim_runestein --output data/quiz/production_context/historie/grindheim_runestein.json
          run node scripts/build-quiz-production-context.mjs --category historie --target grindheim_steinkross --output data/quiz/production_context/historie/grindheim_steinkross.json
          run node scripts/build-quiz-production-context.mjs --category historie --target grindheimsveien_nord_gravfelt --output data/quiz/production_context/historie/grindheimsveien_nord_gravfelt.json
          run node scripts/build-quiz-production-context.mjs --category historie --target hoyland_gravhaug_etne --output data/quiz/production_context/historie/hoyland_gravhaug_etne.json
          run npm run audit:quiz-production-context
          run npm run audit:quiz-theory-binding
          run npm run test:quiz-production
          run npm run knowledge:canonical:write
          run npm run knowledge:canonical:check
          run npm run knowledge:legacy:check
          run git diff --check
      - name: Enforce cleanup scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | tee /tmp/history-makt-changed-files.txt
          unexpected="$(cat /tmp/history-makt-changed-files.txt | grep -Ev '^(tools/validate-historie-makt-stat-institusjoner\.mjs|data/fag/historie/emner_historie_canonical_v4_5\.json|data/quiz/production_context/historie/(grindheim_runestein|grindheim_steinkross|grindheimsveien_nord_gravfelt|hoyland_gravhaug_etne)\.json|reports/historie-v5/makt-stat-institusjoner-curation-command-v2\.log|reports/coordinate-branch-runner/agent_oslo-coordinate-history-v5-5-power-curation-v3/|reports/coordinate-evidence-audit\.md|reports/place-coordinate-intake-gate\.md|reports/place-coordinate-quality-gate\.md|reports/place-source-layout-audit\.json)$' || true)"
          test -z "$unexpected" || { echo 'Unexpected changed files:'; echo "$unexpected"; exit 1; }
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-makt-quality-cleanup-log
          path: |
            /tmp/history-makt-quality-cleanup.log
            /tmp/history-makt-changed-files.txt
          if-no-files-found: warn
      - name: Publish clean final branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-history-makt-quality-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'No cleanup changes'; exit 1; }
          git commit -m 'Historie: lås og rydd makt-, stat- og institusjonsfrysen'
          git push origin HEAD:refs/heads/agent/history-makt-quality-validator-cleanup
