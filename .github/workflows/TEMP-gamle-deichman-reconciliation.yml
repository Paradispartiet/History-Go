name: TEMP Gamle Deichman reconciliation

on:
  push:
    branches:
      - agent/gamle-deichman-reconciliation-20260908

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fix canonical People audit report EOF normalization
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'tools/audit-people-of-places-status.mts';
          let source = fs.readFileSync(file, 'utf8');
          const buggy = "  lines.push('');\n  return `${lines.join('\\n')}\\n`;\n}";
          const fixed = "  return `${lines.join('\\n')}\\n`;\n}";
          if (source.includes(buggy)) {
            source = source.replace(buggy, fixed);
            fs.writeFileSync(file, source);
            console.log('Normalized People audit markdown EOF in canonical generator source.');
          } else if (source.includes(fixed)) {
            console.log('People audit markdown EOF already normalized.');
          } else {
            throw new Error('People audit markdown renderer shape changed; refusing blind patch.');
          }
          NODE
      - name: Materialize canonical reconciliation
        run: node tools/TEMP-materialize-gamle-deichman-reconciliation.mjs
      - name: Build sourced image assets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import sharp from 'sharp';
          const root=process.cwd();
          const exterior='https://commons.wikimedia.org/wiki/Special:Redirect/file/Deichman_V.jpg';
          const interior='https://commons.wikimedia.org/wiki/Special:Redirect/file/K48-002_Deichmanske_bibliotek,_hovedutl%C3%A5net_(10265508123).jpg';
          async function get(url){const r=await fetch(url,{headers:{'User-Agent':'History-Go/1.0 reconciliation'}});if(!r.ok)throw new Error(`${r.status} ${url}`);return Buffer.from(await r.arrayBuffer());}
          const [ext,int]=await Promise.all([get(exterior),get(interior)]);
          async function out(buf,file,w,h,fit='cover'){const p=path.join(root,file);fs.mkdirSync(path.dirname(p),{recursive:true});await sharp(buf).rotate().resize(w,h,{fit,position:'attention'}).webp({quality:86}).toFile(p);}
          await Promise.all([
            out(ext,'bilder/places/gamle_deichman.webp',1200,675),
            out(ext,'bilder/places/gamle_deichman_front_portrait.webp',900,1200),
            out(ext,'bilder/QuizCards/Gamle_Deichman.webp',1200,675),
            out(int,'bilder/kort/objects/gamle_deichman_revold_freske.webp',900,520),
            out(int,'bilder/kort/structures/gamle_deichman_sentralhall.webp',900,520),
            out(ext,'bilder/kort/structures/gamle_deichman_monumentaltrapper.webp',900,520),
            out(int,'bilder/kort/historical_events/gamle_deichman_apning_1933.webp',900,520),
            out(ext,'bilder/kort/historical_events/gamle_deichman_22_juli_2011.webp',900,520),
            out(ext,'bilder/kort/historical_events/gamle_deichman_flytting_2019.webp',900,520)
          ]);
          NODE
      - name: Rebuild canonical derivatives
        run: |
          npm run place-open:build
          npm run places:index:build
          npm run civication:history-people:build
      - name: Validate Gamle Deichman focused contracts
        run: |
          node --test tests/gamle-deichman-reconciliation.test.mjs
          npm run place-open:check
          npm run places:index:check
          npm run places:emner:check
          npm run leksikon:ids:check
          npm run check:stories
          npm run audit:people-of-places
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          node --test tests/place-rounds-visual-collections.test.mjs
      - name: Verify temporary production files
        run: |
          set -euxo pipefail
          test -f .github/workflows/TEMP-gamle-deichman-reconciliation.yml
          test -f tools/TEMP-materialize-gamle-deichman-reconciliation.mjs
      - name: Remove temporary production files
        run: |
          set -euxo pipefail
          rm .github/workflows/TEMP-gamle-deichman-reconciliation.yml
          rm tools/TEMP-materialize-gamle-deichman-reconciliation.mjs
      - name: Configure Git identity
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Stage permanent tree
        run: |
          set -euxo pipefail
          git status --short
          git add -A
          git status --short
      - name: Enforce staged diff check
        run: |
          set -euxo pipefail
          git diff --cached --check
      - name: Commit permanent reconciliation
        run: |
          set -euxo pipefail
          git commit -m 'Complete Gamle Deichman reconciliation'
      - name: Push permanent reconciliation
        run: |
          set -euxo pipefail
          git push origin HEAD:agent/gamle-deichman-reconciliation-20260908
