name: TEMP Civication Musikk Scene og produksjon prerequisites

on:
  push:
    branches:
      - agent/civication-musikk-scene-og-produksjon-prerequisites-20260909
    paths:
      - scripts/TEMP_materialize_musikk_scene_og_produksjon_prerequisites.mjs
      - .github/workflows/TEMP-civication-musikk-scene-og-produksjon-prerequisites.yml

permissions:
  contents: write

concurrency:
  group: temp-civication-musikk-scene-og-produksjon-prerequisites
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-musikk-scene-og-produksjon-prerequisites-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Require fresh main ancestry before materialization
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'Branch is stale versus main before materialization.' >&2; exit 1; }
      - name: Syntax
        run: node --check scripts/TEMP_materialize_musikk_scene_og_produksjon_prerequisites.mjs
      - name: Materialize
        run: node scripts/TEMP_materialize_musikk_scene_og_produksjon_prerequisites.mjs
      - name: Generate canonical derived surfaces
        run: |
          set -euo pipefail
          node scripts/audit-civication-role-packs.mjs
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
          node scripts/build-civication-scene-registry.mjs --write
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - name: Require zero broken role-pack mappings
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const index=JSON.parse(fs.readFileSync('data/Civication/rolePackIndex.json','utf8'));
          const broken=index.roles.filter((row)=>row.status==='broken_mapping');
          console.log('BROKEN_MAPPING_COUNT='+broken.length);
          if(broken.length){console.log(JSON.stringify(broken,null,2));process.exit(1);}
          NODE
      - name: Require Scene og produksjon prerequisite debt closed
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const key='musikk/musikk_scene_og_produksjon';
          const matrix=JSON.parse(fs.readFileSync('data/Civication/careerGameplayMatrix.json','utf8'));
          const career=matrix.worlds.find(x=>x.key===key);
          if(!career) throw new Error('Target missing from Career Gameplay Matrix');
          console.log(JSON.stringify({status:career.status,runtime_gate:career.audit?.runtime_gate,missing:career.audit?.missing_components},null,2));
          if(career.status!=='playable') throw new Error('Expected playable, got '+career.status);
          if(career.audit?.runtime_gate!==true) throw new Error('Expected runtime_gate true');
          if((career.audit?.missing_components||[]).length) throw new Error('Career components remain: '+JSON.stringify(career.audit.missing_components));
          const r=JSON.parse(fs.readFileSync('data/Civication/roleWorldRolloutReadiness.json','utf8'));
          const row=r.roles.find(x=>x.key===key);
          if(!row) throw new Error('Target missing from readiness roles');
          console.log(JSON.stringify(row,null,2));
          if(row.classification!=='rollout_ready') throw new Error('Expected rollout_ready, got '+row.classification);
          if((row.blockers||[]).length) throw new Error('Blockers remain: '+JSON.stringify(row.blockers));
          const authored=row.authored_work_required||[];
          for(const forbidden of ['career:authority','career:day_one','career:knowledge','career:mail','career:people','career:places','career:workday_loop']) if(authored.includes(forbidden)) throw new Error('Prerequisite debt remains: '+forbidden);
          const allowed=new Set(['history_go_affordance','situated_reputation']);
          for(const item of authored) if(!allowed.has(item)) throw new Error('Unexpected authored work remains: '+item);
          NODE
      - name: Verify Scene og produksjon prerequisites
        run: node tests/civication-musikk-scene-og-produksjon-prerequisites.test.js
      - name: Verify Career Gameplay Matrix
        run: node tests/civication-career-gameplay-matrix.test.js
      - name: Verify Role World readiness
        run: node tests/civication-role-world-rollout-readiness.test.js
      - name: Verify Scene Registry
        run: node scripts/build-civication-scene-registry.mjs --check
      - name: Verify Scenario People index
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
      - name: Verify Scenario People audit
        run: node --test tests/civication-scenario-people.test.mjs
      - name: Verify full Civication suite
        run: node tests/run-civication-tests.mjs
      - name: Verify job learning profiles
        run: npm run audit:job-learning-profiles
      - name: Verify job knowledge requirements
        run: npm run audit:job-knowledge-requirements
      - name: Require fresh main ancestry before scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'Branch became stale before scope verification.' >&2; exit 1; }
      - name: Verify exact permanent prerequisite scope
        shell: bash
        run: |
          set -euo pipefail
          ROLE=musikk_scene_og_produksjon
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          if [ "${#changed[@]}" -ne 24 ]; then
            echo "Expected exactly 24 permanent prerequisite paths, found ${#changed[@]}" >&2
            exit 1
          fi
          expected=(
            data/Civication/careerGameplayMatrix.json
            data/Civication/compiledSceneRegistryV1.json
            data/Civication/mailFamilies/musikk/conflict/${ROLE}_conflict.json
            data/Civication/mailFamilies/musikk/consequence/${ROLE}_consequence.json
            data/Civication/mailFamilies/musikk/event/${ROLE}_event.json
            data/Civication/mailFamilies/musikk/followup/${ROLE}_followup.json
            data/Civication/mailFamilies/musikk/job/${ROLE}_job.json
            data/Civication/mailFamilies/musikk/knowledge/${ROLE}_knowledge.json
            data/Civication/mailFamilies/musikk/micro/${ROLE}_micro.json
            data/Civication/mailFamilies/musikk/people/${ROLE}_people.json
            data/Civication/mailFamilies/musikk/story/${ROLE}_story.json
            data/Civication/mailPlans/musikk/${ROLE}_plan.json
            data/Civication/roleModels/manifest.json
            data/Civication/roleModels/musikk/${ROLE}.json
            data/Civication/rolePackIndex.json
            data/Civication/roleWorldRolloutReadiness.json
            data/Civication/scenarioPeople/generated/musikk.json
            data/Civication/scenarioPeople_index.json
            data/Civication/workGrammars/musikk/${ROLE}.json
            docs/CIVICATION_ROLE_PACK_INDEX.md
            reports/CIVICATION_MUSIKK_SCENE_OG_PRODUKSJON_PREREQUISITES_SOURCE_FIRST.md
            reports/civication-career-gameplay-matrix.md
            reports/civication-role-world-rollout-readiness.md
            tests/civication-musikk-scene-og-produksjon-prerequisites.test.js
          )
          for f in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx "$f" >/dev/null || { echo "Missing expected generated path: $f" >&2; exit 1; }
          done
          for f in "${changed[@]}"; do
            printf '%s\n' "${expected[@]}" | grep -Fx "$f" >/dev/null || { echo "Unexpected generated path: $f" >&2; exit 1; }
          done
          git diff --check
      - name: Require fresh main ancestry before permanent commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'Branch became stale before permanent commit.' >&2; exit 1; }
      - name: Commit permanent verified package
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/TEMP_materialize_musikk_scene_og_produksjon_prerequisites.mjs
          rm -f .github/workflows/TEMP-civication-musikk-scene-og-produksjon-prerequisites.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then echo 'No permanent changes to commit.' >&2; exit 1; fi
          git diff --cached --check
          git status --short
          git commit -m "Complete Musikk Scene og produksjon prerequisites"
          git push origin HEAD:agent/civication-musikk-scene-og-produksjon-prerequisites-20260909
