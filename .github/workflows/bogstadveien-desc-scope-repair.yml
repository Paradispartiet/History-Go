name: Bogstadveien description-scope repair

on:
  push:
    branches:
      - work/bogstadveien-fagverk-v2-20260902
    paths:
      - '.github/workflows/bogstadveien-desc-scope-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/bogstadveien-fagverk-v2-20260902
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore description fields from current main
        run: |
          git fetch origin main
          python3 - <<'PY'
          import json, subprocess
          path = 'data/places/by/oslo/places/bogstadveien.json'
          base = json.loads(subprocess.check_output(['git','show',f'origin/main:{path}'], text=True))
          with open(path, encoding='utf-8') as f:
              head = json.load(f)
          head['desc'] = base['desc']
          head['popupDesc'] = base['popupDesc']
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(head, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Regenerate affected artifacts
        run: |
          npm run places:index:build
          npm run place-open:build
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs

      - name: Remove one-off workflow and commit repaired final tree
        run: |
          git rm .github/workflows/bogstadveien-desc-scope-repair.yml
          git add data/places/by/oslo/places/bogstadveien.json data/places/places_index.json data/runtime/place-open/bogstadveien.json data/fagverk/fagverk_release.json reports/fagverk/fagverk-place-page-coverage-v2.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: keep Bogstadveien Fagverk description-neutral'

      - name: Verify repaired scope and Fagverk
        run: |
          node scripts/validate-place-description-production-v4_2_policy.mjs --changed --base origin/main --head HEAD
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run places:index:check
          npm run place-open:check
          node --test tests/fagverk-place-pages.test.mjs tests/fagverk-place-rendering.test.mjs tests/fagverk-place-substance-audit.test.mjs
          git diff --check origin/main...HEAD

      - name: Push repaired branch
        run: git push origin HEAD:work/bogstadveien-fagverk-v2-20260902
