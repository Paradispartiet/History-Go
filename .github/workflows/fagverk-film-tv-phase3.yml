name: Fagverk Film og TV phase 3
# Permanent regression gate for the canonical Film & TV baseline.
# Historical production units are verified through monotone regressions instead of being materialized again.

on:
  pull_request:
    paths:
      - "fagverk.html"
      - "fagverk-forside.html"
      - "data/fag/TV_og_Film/**"
      - "docs/FILM_TV_CURRICULUM_COMPLETENESS_V1.md"
      - "data/badges/film_tv.json"
      - "data/fagverk/film_tv/**"
      - "js/fagverk-subject-core.js"
      - "js/fagverk-subject-model.js"
      - "js/fagverk.js"
      - "scripts/audit-fagverk-film-tv-phase3.mjs"
      - "scripts/audit-film-tv-curriculum-completeness-v1.mjs"
      - "scripts/audit-film-tv-legacy-emne-classification-v1.mjs"
      - "scripts/audit-film-tv-variable-inventory-v1.mjs"
      - "scripts/reaudit-film-tv-existing-chapters-v1.mjs"
      - "scripts/plan-film-tv-learning-order-v1.mjs"
      - "scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.mjs"
      - "scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs"
      - "scripts/audit-film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.mjs"
      - "scripts/audit-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs"
      - "tests/fagverk-film-tv-phase3.test.mjs"
      - "tests/film-tv-curriculum-completeness-v1.test.mjs"
      - "tests/film-tv-legacy-emne-classification-v1.test.mjs"
      - "tests/film-tv-variable-inventory-v1.test.mjs"
      - "tests/film-tv-canonical-migration-monotone-regression-v1.test.mjs"
      - "tests/film-tv-existing-chapter-reaudit-v1.test.mjs"
      - "tests/film-tv-learning-order-plan-v1.test.mjs"
      - "tests/film-tv-learning-order-monotone-regression-v1.test.mjs"
      - "tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs"
      - "tests/film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.test.mjs"
      - "tests/film-tv-cultural-heritage-canon-stars-memory-registry-v1.test.mjs"
      - "tests/film-tv-unit15-fulltext-predecessor-monotonicity-v1.test.mjs"
      - "tests/fagverk-release-manifest.test.mjs"
      - ".github/workflows/fagverk-film-tv-phase3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Film og TV phase 3 materialization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate stable Film and TV baseline
        run: |
          node --check scripts/audit-fagverk-film-tv-phase3.mjs
          node --check scripts/audit-film-tv-curriculum-completeness-v1.mjs
          node --check scripts/audit-film-tv-legacy-emne-classification-v1.mjs
          node --check scripts/audit-film-tv-variable-inventory-v1.mjs
          node --check scripts/reaudit-film-tv-existing-chapters-v1.mjs
          node --check scripts/plan-film-tv-learning-order-v1.mjs
          node --check scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.mjs
          node --check scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs
          node --check scripts/audit-film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.mjs
          node --check scripts/audit-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs
          node --check tests/film-tv-canonical-migration-monotone-regression-v1.test.mjs
          node --check tests/film-tv-existing-chapter-reaudit-v1.test.mjs
          node --check tests/film-tv-learning-order-plan-v1.test.mjs
          node --check tests/film-tv-learning-order-monotone-regression-v1.test.mjs
          node --check tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs
          node --check tests/film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.test.mjs
          node --check tests/film-tv-cultural-heritage-canon-stars-memory-registry-v1.test.mjs
          node --check tests/film-tv-unit15-fulltext-predecessor-monotonicity-v1.test.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-film-tv-phase3.mjs
          node scripts/audit-film-tv-curriculum-completeness-v1.mjs
          node scripts/audit-film-tv-legacy-emne-classification-v1.mjs
          node scripts/audit-film-tv-variable-inventory-v1.mjs
          node scripts/reaudit-film-tv-existing-chapters-v1.mjs
          node scripts/plan-film-tv-learning-order-v1.mjs
          node scripts/audit-film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.mjs
          node scripts/build-fagverk-release-manifest.mjs --check

      - name: Validate stable Film and TV contracts
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-film-tv-phase3.test.mjs
          node --test tests/film-tv-curriculum-completeness-v1.test.mjs
          node --test tests/film-tv-legacy-emne-classification-v1.test.mjs
          node --test tests/film-tv-variable-inventory-v1.test.mjs
          node --test tests/film-tv-canonical-migration-monotone-regression-v1.test.mjs
          node --test tests/film-tv-existing-chapter-reaudit-v1.test.mjs
          node --test tests/film-tv-learning-order-plan-v1.test.mjs
          node --test tests/film-tv-learning-order-monotone-regression-v1.test.mjs
          node --test tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs
          node --test tests/film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.test.mjs
          node --test tests/film-tv-cultural-heritage-canon-stars-memory-registry-v1.test.mjs
          node --test tests/film-tv-unit15-fulltext-predecessor-monotonicity-v1.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
