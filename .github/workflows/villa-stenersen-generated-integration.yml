name: Villa Stenersen generated integration
on:
  pull_request:
    paths:
      - 'data/quiz/manifest.json'
      - 'data/quiz/historie/villa_stenersen_sets.json'
      - 'data/quiz/production_briefs/historie/villa_stenersen.json'
      - 'scripts/sync-villa-stenersen-quizcard-knowledge.mjs'
      - '.github/workflows/villa-stenersen-generated-integration.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regenerate:
    permissions:
      contents: write
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'content/oslo-aav-villa-stenersen-v1-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 120
      - name: Sync current main before regenerating shared artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Build canonical quiz production context
        run: node scripts/build-quiz-production-context.mjs --category historie --target villa_stenersen --output data/quiz/production_context/historie/villa_stenersen.json
      - name: Build canonical Knowledge links
        run: npm run knowledge:canonical:write
      - name: Synchronize QuizCard canonical Knowledge IDs
        run: node scripts/sync-villa-stenersen-quizcard-knowledge.mjs
      - name: Materialize canonical Natur registry before Fagverk release
        run: node scripts/materialize-natur-final-registry.mjs
      - name: Rebuild Fagverk release manifest
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Verify target quiz parity
        run: node --test tests/villa-stenersen-v1-parity.test.mjs
      - name: Commit only generated integration artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk/fagverk_registry.json data/fagverk/subject_status.json data/fagverk/fagverk_release.json
          git add data/quiz/production_context/historie/villa_stenersen.json
          git add data/quiz/historie/villa_stenersen_sets.json data/quizcards/historie/villa_stenersen_quizcard_v1.json
          git add -u data/knowledge/ reports/knowledge-id-backfill.json
          if ! git diff --cached --quiet; then
            git commit -m "Villa Stenersen: regenerate canonical quiz context and Knowledge"
          fi
          # Push the main-sync merge as well, even when generated files were already current.
          git push origin HEAD:${{ github.head_ref }}
