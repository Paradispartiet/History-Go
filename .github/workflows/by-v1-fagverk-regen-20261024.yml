name: By v1 final one-time Fagverk release sync
on:
  push:
    branches: [content/by-v1-twenty-20261024]
    paths: ['.github/workflows/by-v1-fagverk-regen-20261024.yml']
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/by-v1-twenty-20261024
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deterministically rebuild Fagverk release
        run: |
          node scripts/materialize-natur-final-registry.mjs
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Persist generated release only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk/fagverk_registry.json data/fagverk/fagverk_release.json
          if git diff --cached --quiet; then
            echo 'Fagverk already current'
            exit 0
          fi
          git commit -m "chore(by): refresh Fagverk digest after Knowledge backfill"
          git push origin HEAD:refs/heads/content/by-v1-twenty-20261024
