name: Civication Renholder role readiness regeneration (one-shot)
on:
  push:
    branches:
      - civication/renholder-persistent-zone-case-20261103
    paths:
      - .github/workflows/civication-renholder-readiness-once.yml
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Regenerate role readiness from current tests
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Commit generated readiness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/roleWorldRolloutReadiness.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Renholder Role World readiness evidence"
            git push origin HEAD:civication/renholder-persistent-zone-case-20261103
          fi
