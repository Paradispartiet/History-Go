name: TEMP Fagverk release hotfix

on:
  push:
    branches:
      - agent/place-production-fagverk-release-hotfix-20261007
    paths:
      - .github/workflows/tmp-fagverk-release-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/place-production-fagverk-release-hotfix-20261007
          fetch-depth: 0

      - name: Regenerate canonical Fagverk release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-fagverk-release-manifest.mjs

      - name: Enforce exact regeneration scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          printf '%s\n' data/fagverk/fagverk_release.json > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Verify canonical rebuild
        run: node scripts/build-fagverk-release-manifest.mjs --check

      - name: Commit regenerated manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk/fagverk_release.json
          git commit -m "Regenerate Fagverk release manifest"
          git push origin HEAD:agent/place-production-fagverk-release-hotfix-20261007
