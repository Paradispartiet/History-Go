name: TEMP Civication Psychology researcher materializer

on:
  push:
    branches:
      - agent/civication-psykologi-forsker-rollout

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[forsker-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out rollout branch
        uses: actions/checkout@v4
        with:
          ref: agent/civication-psykologi-forsker-rollout
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize canonical career gameplay matrix
        run: node scripts/audit-civication-career-gameplay.mjs --write

      - name: Materialize compiled scene registry
        run: node scripts/build-civication-scene-registry.mjs --write

      - name: Verify researcher rollout contract
        run: node tests/civication-psykologi-forsker_psykologi-rollout-playability.test.js

      - name: Verify compiled scene registry
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Commit generated projections only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/Civication/careerGameplayMatrix.json data/Civication/compiledSceneRegistryV1.json reports/civication-career-gameplay-matrix.md
          if git diff --cached --quiet; then
            echo "No generated projection changes"
            exit 0
          fi
          git commit -m "Regenerate Psychology researcher projections [forsker-materialized]"
          git push origin HEAD:agent/civication-psykologi-forsker-rollout
