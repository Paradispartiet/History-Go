name: Temporary Aker Brygge place-open build

on:
  push:
    branches:
      - work/aker-brygge-fagverk-v2-20260902

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/aker-brygge-fagverk-v2-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild generated place-open payload
        run: |
          node scripts/build-place-open-payloads.mjs
          rm .github/workflows/tmp-aker-brygge-place-open-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/place-open/aker_brygge.json .github/workflows/tmp-aker-brygge-place-open-build.yml
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild Aker Brygge place-open payload"
            git push origin HEAD:work/aker-brygge-fagverk-v2-20260902
          fi
