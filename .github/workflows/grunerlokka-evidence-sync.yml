name: Grünerløkka evidence sync

# One-shot synchronization after the production evidence parity audit.
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-and-validate:
    if: github.head_ref == 'agent/visitoslo-grunerlokka-production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize evidence currentCoordinate fields
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          pairs = [
              ('data/places/historie/oslo/places_historie/paulus_kirke.json', 'data/coordinate-evidence/oslo/historie/paulus_kirke.json'),
              ('data/places/kunst/oslo/places_kunst/purenkel_galleri.json', 'data/coordinate-evidence/oslo/kunst/purenkel_galleri.json'),
              ('data/places/by/oslo/places/torshovparken.json', 'data/coordinate-evidence/oslo/by/torshovparken.json'),
              ('data/places/kunst/oslo/places_kunst/hodet_nn_torshovdalen.json', 'data/coordinate-evidence/oslo/kunst/hodet_nn_torshovdalen.json'),
          ]
          keys = ('lat', 'lon', 'r', 'coordStatus', 'coordSource', 'coordType', 'coordNote')
          for place_path, evidence_path in pairs:
              place = json.loads(Path(place_path).read_text())
              evidence = json.loads(Path(evidence_path).read_text())
              evidence['currentCoordinate'] = {key: place[key] for key in keys}
              Path(evidence_path).write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Rebuild runtime index
        run: npm run places:index:build

      - name: Run blocking gates and persist exit codes
        shell: bash
        run: |
          set -uo pipefail
          OUT="reports/coordinate-branch-runner/agent_visitoslo-grunerlokka-production"
          mkdir -p "$OUT"

          run_gate() {
            name="$1"
            shift
            set +e
            "$@" 2>&1 | tee "$OUT/${name}.log"
            code=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$code" > "$OUT/${name}.exit-code.txt"
          }

          set -e
          run_gate split-manifest-sync npm run audit:places-split-manifest-sync
          run_gate places-index-check npm run places:index:check
          run_gate coordinate-source-contract npm run test:coordinate-source-contract
          run_gate coordinate-quality npm run places:coords:quality
          run_gate coordinate-intake npm run places:coords:intake -- --strict-new
          run_gate coordinate-evidence npm run places:coords:evidence:audit
          run_gate git-diff-check git diff --check
          run_gate health-places npm run health:places

      - name: Remove one-shot workflow and commit synchronized state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/grunerlokka-evidence-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize Grünerløkka coordinate evidence"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Enforce blocking gate results
        shell: bash
        run: |
          set -euo pipefail
          OUT="reports/coordinate-branch-runner/agent_visitoslo-grunerlokka-production"
          failed=0
          for gate in split-manifest-sync places-index-check coordinate-source-contract coordinate-quality coordinate-intake coordinate-evidence git-diff-check; do
            code=$(cat "$OUT/${gate}.exit-code.txt")
            echo "$gate=$code"
            if [ "$code" != "0" ]; then
              failed=1
            fi
          done
          exit "$failed"
