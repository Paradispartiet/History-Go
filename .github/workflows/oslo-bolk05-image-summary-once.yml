name: Oslo bolk 05 — update image backlog once
on:
  push:
    branches:
      - research/oslo-sentrum-bolk05-tekst-20261101
    paths:
      - .github/workflows/oslo-bolk05-image-summary-once.yml
permissions:
  contents: write
jobs:
  update-image-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compute current place-image audit
        run: node scripts/audit-place-images.mjs --mode=all --report=reports/place-image-audit.json
      - name: Sync backlog summary from audited place records
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const p='data/places/place_image_backlog_summary.json';
          const data=JSON.parse(fs.readFileSync(p,'utf8'));
          const audit=JSON.parse(fs.readFileSync('reports/place-image-audit.json','utf8'));
          data.generatedAt=new Date().toISOString().slice(0,10);
          data.generatedFromCommit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          data.totalPlaces=audit.totalPlaces;
          data.summary={
            validLocal:audit.summary.local,
            validRemote:audit.summary.remote,
            optionalMissing:audit.summary.optional,
            missing:audit.summary.missing,
            invalidLocalPath:audit.summary.invalid,
            remaining:audit.summary.missing+audit.summary.invalid
          };
          data.byCategory=Object.fromEntries(Object.entries(audit.byCategory).map(([category,s])=>[category,{total:s.total,valid:s.local+s.remote,optional:s.optional,missing:s.missing,invalid:s.invalid}]));
          data.note='Regenerert fra canonical stedsposter etter lokale WebP-bilder for Oslo-bolk 05, uten endring i bildekvalitetskrav.';
          fs.writeFileSync(p,JSON.stringify(data,null,2)+'\n');
          NODE
          node scripts/audit-place-images.mjs --mode=all --verify-summary=data/places/place_image_backlog_summary.json
      - name: Commit only backlog summary and remove this one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/places/place_image_backlog_summary.json
          git rm -- .github/workflows/oslo-bolk05-image-summary-once.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Sync place image backlog after Oslo bolk 05 WebP assets"
          git push origin HEAD:research/oslo-sentrum-bolk05-tekst-20261101
