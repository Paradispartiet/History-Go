name: Svartdalen PlaceCard curation

on:
  pull_request:
    paths:
      - "data/places/natur/oslo/places_oslo_natur_alnaelva_rute/svartdalen.json"
      - "data/runtime/place-open/svartdalen.json"
      - "data/brands/brands_by_place.json"
      - "data/brands/brands_master.json"
      - "data/quiz/natur/svartdalen_sets.json"
      - "data/quizcards/natur/topp10_natur_alna_v1_batch01.json"
      - "tests/svartdalen-placecard-collections-v2.test.mjs"
      - "reports/place-production/svartdalen-placecard-curation-v1.md"
      - ".github/workflows/svartdalen-placecard-curation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  svartdalen-collections:
    name: Validate scoped PlaceCard collections and preserved quiz
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify source/runtime Brands, Knowledge, QuizCard and photo identity
        run: node --test tests/svartdalen-placecard-collections-v2.test.mjs
