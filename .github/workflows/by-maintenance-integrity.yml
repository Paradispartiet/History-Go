name: By maintenance integrity

on:
  pull_request:
    paths:
      - 'data/fagverk/by/maintenance/**'
      - 'scripts/audit-by-source-refresh-place-case-expansion.mjs'
      - 'scripts/audit-by-source-refresh-place-case-expansion-round2.mjs'
      - 'scripts/audit-by-source-refresh-place-case-expansion-round3.mjs'
      - 'tests/by-source-refresh-place-case-expansion.test.mjs'
      - 'tests/by-source-refresh-place-case-expansion-round2.test.mjs'
      - 'tests/by-source-refresh-place-case-expansion-round3.test.mjs'
      - '.github/workflows/by-maintenance-integrity.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Audit By maintenance rounds 1, 2 and 3
        run: |
          node --check scripts/audit-by-source-refresh-place-case-expansion.mjs
          node --check scripts/audit-by-source-refresh-place-case-expansion-round2.mjs
          node --check scripts/audit-by-source-refresh-place-case-expansion-round3.mjs
          node scripts/audit-by-source-refresh-place-case-expansion.mjs
          node scripts/audit-by-source-refresh-place-case-expansion-round2.mjs
          node scripts/audit-by-source-refresh-place-case-expansion-round3.mjs
          node --test tests/by-source-refresh-place-case-expansion.test.mjs tests/by-source-refresh-place-case-expansion-round2.test.mjs tests/by-source-refresh-place-case-expansion-round3.test.mjs
      - name: Preserve By completion, theory and editorial integrity
        run: |
          node scripts/audit-fagverk-by-complete.mjs
          node tools/audit-by-theory-integrity.mjs
          node scripts/validate-by-editorial-integrity.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
