# One-shot generated-data refresh for the Wave C source changes.
# This workflow removes itself in its sole generated commit.
name: Civication matrix sync Wave C
on:
  push:
    branches:
      - civication/wave-c-story-content-20261018
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize career gameplay matrix
        run: |
          node scripts/audit-civication-career-gameplay.mjs --write
          rm .github/workflows/civication-matrix-sync-wave-c.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md .github/workflows/civication-matrix-sync-wave-c.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(civication): synchronize generated career matrix after Wave C'
          git push
