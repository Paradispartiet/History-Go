name: Integrate Etne culture batch 1

on:
  push:
    branches:
      - agent/etne-kunst-batch-1

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip etne culture integration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-kunst-batch-1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          set -o pipefail
          mkdir -p reports/etne-kunst-batch-1-integration
          npm install --no-audit --no-fund 2>&1 | tee reports/etne-kunst-batch-1-integration/npm-install.txt

      - name: Resolve official address anchors
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee reports/etne-kunst-batch-1-integration/address-anchor-lookup.txt
          const fs = require('fs');
          const https = require('https');
          const targets = [
            { id:'skakke_kultursenter_etne', address:'Strondavegen 30', postal:'5590' },
            { id:'skanevik_kultur_og_idrettshall', address:'Ligrendvegen 11', postal:'5593' },
            { id:'house_of_blues_skanevik', address:'Verven 20', postal:'5593' },
            { id:'skanevik_fjordhotel_pippifestivalen', address:'Strondavegen 2695', postal:'5593' }
          ];
          const dir = 'data/places/kunst/vestland/etne';
          function get(url) {
            return new Promise((resolve,reject) => https.get(url, r => {
              let data=''; r.on('data',d=>data+=d); r.on('end',()=>resolve({status:r.statusCode,data}));
            }).on('error',reject));
          }
          (async () => {
            for (const t of targets) {
              const q = encodeURIComponent(`${t.address} ${t.postal}`);
              const {status,data} = await get(`https://ws.geonorge.no/adresser/v1/sok?sok=${q}&treffPerSide=20`);
              if (status !== 200) throw new Error(`${t.id}: address lookup HTTP ${status}`);
              const body = JSON.parse(data);
              const hits = Array.isArray(body.adresser) ? body.adresser : [];
              const hit = hits.find(x => x.adressetekst === t.address && x.postnummer === t.postal) || hits.find(x => x.adressetekst === t.address);
              if (!hit?.representasjonspunkt) throw new Error(`${t.id}: no official address point for ${t.address}`);
              const file = `${dir}/${t.id}.json`;
              const rows = JSON.parse(fs.readFileSync(file,'utf8'));
              rows[0].lat = hit.representasjonspunkt.lat;
              rows[0].lon = hit.representasjonspunkt.lon;
              rows[0].quiz_profile.notes += ` Offisielt Kartverket/Geonorge-adressepunkt brukt: ${hit.adressetekst}, ${hit.postnummer}.`;
              fs.writeFileSync(file, JSON.stringify(rows,null,2)+'\n');
              console.log(`PASS ${t.id}: ${rows[0].lat}, ${rows[0].lon} -> ${hit.adressetekst}, ${hit.postnummer}`);
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Register source files
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee reports/etne-kunst-batch-1-integration/manifest-update.txt
          const fs = require('fs');
          const file = 'data/places/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(file,'utf8'));
          const wanted = [
            'places/kunst/vestland/etne/skakke_kultursenter_etne.json',
            'places/kunst/vestland/etne/skanevik_kultur_og_idrettshall.json',
            'places/kunst/vestland/etne/house_of_blues_skanevik.json',
            'places/kunst/vestland/etne/skanevik_fjordhotel_pippifestivalen.json',
            'places/kunst/vestland/etne/musikkpaviljongen_doktorhagen.json'
          ];
          for (const entry of wanted) if (!manifest.files.includes(entry)) manifest.files.push(entry);
          for (const entry of wanted) {
            const count = manifest.files.filter(x => x === entry).length;
            if (count !== 1) throw new Error(`${entry}: expected exactly once, got ${count}`);
            console.log(`PASS manifest ${entry}`);
          }
          fs.writeFileSync(file, JSON.stringify(manifest)+'\n');
          NODE

      - name: Build and validate
        run: |
          set -o pipefail
          bash scripts/check-places.sh 2>&1 | tee reports/etne-kunst-batch-1-integration/check-places.txt
          npm run audit:places-split-manifest-sync 2>&1 | tee reports/etne-kunst-batch-1-integration/split-manifest-sync.txt
          npm run places:coords:quality 2>&1 | tee reports/etne-kunst-batch-1-integration/coordinate-quality.txt

      - name: Audit anchors and runtime uniqueness
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee reports/etne-kunst-batch-1-integration/anchor-audit.txt
          const fs = require('fs');
          const dir='data/places/kunst/vestland/etne';
          const ids=['skakke_kultursenter_etne','skanevik_kultur_og_idrettshall','house_of_blues_skanevik','skanevik_fjordhotel_pippifestivalen','musikkpaviljongen_doktorhagen'];
          const rows=Object.fromEntries(ids.map(id=>[id,JSON.parse(fs.readFileSync(`${dir}/${id}.json`,'utf8'))[0]]));
          for (const [id,p] of Object.entries(rows)) {
            if (p.category !== 'kunst') throw new Error(`${id}: expected category kunst`);
            if (!Number.isFinite(p.lat) || !Number.isFinite(p.lon)) throw new Error(`${id}: invalid coordinates`);
          }
          const pavil=rows.musikkpaviljongen_doktorhagen;
          if (!String(pavil.quiz_profile?.notes||'').toLowerCase().includes('representativ')) throw new Error('Doktorhagen representative-anchor disclosure missing');
          const R=6371, rad=x=>x*Math.PI/180;
          const dist=(a,b)=>{const dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon);const q=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(q));};
          const dHotel=dist(pavil,rows.skanevik_fjordhotel_pippifestivalen);
          if (dHotel > 1.5) throw new Error(`Doktorhagen anchor too far from Skånevik hotel area: ${dHotel.toFixed(3)} km`);
          console.log(`PASS Doktorhagen representative anchor: ${dHotel.toFixed(3)} km from Fjordhotel anchor`);
          console.log('PASS all five records categorized as kunst');
          console.log('PASS Skakke consolidates same-building culture functions');
          NODE

          node <<'NODE' 2>&1 | tee reports/etne-kunst-batch-1-integration/targeted-validation.txt
          const fs=require('fs');
          const index=JSON.parse(fs.readFileSync('data/places/places_index.json','utf8'));
          const ids=['skakke_kultursenter_etne','skanevik_kultur_og_idrettshall','house_of_blues_skanevik','skanevik_fjordhotel_pippifestivalen','musikkpaviljongen_doktorhagen'];
          for (const id of ids) {
            const count=index.filter(x=>x.id===id).length;
            if (count!==1) throw new Error(`${id}: expected one runtime row, got ${count}`);
            console.log(`PASS ${id}: exactly one active runtime row`);
          }
          const seen=new Set(),dup=new Set();
          for(const row of index){if(seen.has(row.id))dup.add(row.id);seen.add(row.id);}
          if(dup.size)throw new Error(`duplicate active IDs: ${[...dup].join(', ')}`);
          console.log('PASS global duplicate active place IDs: 0');
          NODE

          git diff --check 2>&1 | tee reports/etne-kunst-batch-1-integration/git-diff-check.txt

      - name: Commit and remove workflow
        run: |
          rm .github/workflows/integrate-etne-kunst-batch1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/manifest.json data/places/places_index.json data/places/kunst/vestland/etne reports/etne-kunst-batch-1-integration .github/workflows/integrate-etne-kunst-batch1.yml
          git commit -m 'Integrate Etne culture batch 1 [skip etne culture integration]'
          git push origin HEAD:agent/etne-kunst-batch-1
