name: Finalize Bjørvika Fagverk v2 r2

on:
  push:
    branches:
      - work/bjorvika-fagverk-v2-20260901
    paths:
      - .github/workflows/finalize-bjorvika-fagverk-v2-r2.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Sync branch to current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Reuse approved Bjørvika source materialization
        run: |
          sed -n "/node <<'NODE'/,/^          NODE$/p" .github/workflows/finalize-bjorvika-fagverk-v2.yml \
            | sed '1d;$d;s/^          //' > /tmp/materialize-bjorvika.cjs
          test -s /tmp/materialize-bjorvika.cjs
          node /tmp/materialize-bjorvika.cjs
      - name: Complete controlled sources and registry ownership
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const placePath = 'data/places/by/oslo/places/bjorvika.json';
          const registryPath = 'data/fagverk/fagverk_registry.json';
          const extraUrl = 'https://magasin.oslo.kommune.no/byplan/fjordbysjefens-statusrapport-for-bjorvika-miljoeffektene-gleder-meg-aller-mest';
          const place = JSON.parse(fs.readFileSync(placePath, 'utf8'));
          if (!place.fagverk.source_urls.includes(extraUrl)) place.fagverk.source_urls.push(extraUrl);
          if (!place.externalLinks.some((item) => item.url === extraUrl)) {
            place.externalLinks.push({
              type: 'source',
              label: 'Oslo kommune – statusrapport for Bjørvika',
              url: extraUrl,
              verifiedAt: '2026-09-01'
            });
          }
          fs.writeFileSync(placePath, JSON.stringify(place, null, 2) + '\n');

          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          registry.placeLinks ||= {};
          registry.placeLinks.bjorvika = {
            sourceFile: 'places/by/oslo/places/bjorvika.json',
            field: 'fagverk',
            schema: 'history_go_place_fagverk_v2',
            level: 'full',
            status: 'curated'
          };
          fs.writeFileSync(registryPath, JSON.stringify(registry, null, 2) + '\n');
          NODE
      - name: Regenerate derived Place and Fagverk state
        run: |
          node scripts/build-place-open-payloads.mjs
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate generated state
        run: |
          npm run places:index:check
          node scripts/build-place-open-payloads.mjs --check
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Validate Fagverk contracts
        run: |
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/fagverk-place-rendering.test.mjs
          node --test tests/fagverk-place-substance-audit.test.mjs
          node --test tests/fagverk-link-audit.test.mjs
      - name: Validate changed Place image
        run: node scripts/audit-place-images.mjs --mode=changed
      - name: Validate generated web runtime
        run: npm run build:web:check
      - name: Validate diff whitespace
        run: git diff --check
      - name: Commit clean production result
        run: |
          git add \
            data/places/by/oslo/places/bjorvika.json \
            data/runtime/place-open/bjorvika.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/fagverk-place-page-coverage-v2.json
          git rm \
            .github/workflows/finalize-bjorvika-fagverk-v2.yml \
            .github/workflows/finalize-bjorvika-fagverk-v2-r2.yml
          git diff --cached --quiet && { echo "No production changes to commit"; exit 1; }
          git commit -m "Curate Bjørvika Fagverk v2"
          git push origin HEAD:${GITHUB_REF_NAME}
