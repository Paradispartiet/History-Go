name: TEMP Gamle Deichman brand crop

on:
  push:
    branches:
      - agent/gamle-deichman-reconciliation-20260908
    paths:
      - .github/workflows/TEMP-gamle-deichman-brand-crop.yml

permissions:
  contents: read

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build diagnostic crops
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import fs from 'node:fs/promises';
          const src='bilder/places/gamle_deichman.webp';
          const meta=await sharp(src).metadata();
          const W=meta.width, H=meta.height;
          const specs=[];
          for (let y=0;y<0.65;y+=0.1) {
            specs.push({left:0, top:Math.floor(H*y), width:W, height:Math.min(Math.floor(H*0.18),H-Math.floor(H*y)), label:`y${Math.round(y*100)}`});
          }
          await fs.mkdir('brand-crop-diagnostic',{recursive:true});
          const tiles=[];
          for (const s of specs) {
            const out=`brand-crop-diagnostic/${s.label}.png`;
            await sharp(src).extract({left:s.left,top:s.top,width:s.width,height:s.height}).resize({width:1200}).png().toFile(out);
            tiles.push({input:out});
          }
          const tileH=220;
          const canvas=sharp({create:{width:1200,height:tileH*tiles.length,channels:3,background:'#fff'}});
          const comps=[];
          for (let i=0;i<tiles.length;i++) {
            const buf=await sharp(tiles[i].input).resize({width:1200,height:tileH,fit:'contain',background:'#fff'}).png().toBuffer();
            comps.push({input:buf,left:0,top:i*tileH});
          }
          await canvas.composite(comps).png().toFile('brand-crop-diagnostic/contact-sheet.png');
          console.log({W,H,specs});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: gamle-deichman-brand-crop-diagnostic
          path: brand-crop-diagnostic
          if-no-files-found: error
