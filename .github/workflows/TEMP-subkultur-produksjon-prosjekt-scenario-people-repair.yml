name: TEMP Subkultur Produksjon prosjekt scenario People repair

on:
  push:
    branches:
      - agent/civication-subkultur-produksjon-prosjekt-prerequisites-replay

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[scenario-people-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate scenario People catalog
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - name: Verify generated scenario People catalog
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
      - name: Test scenario People invariants
        run: node --test tests/civication-scenario-people.test.mjs
      - name: Full Civication
        run: npm run test:civication
      - name: Diff cleanliness
        run: git diff --check
      - name: Publish clean permanent repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/TEMP-subkultur-produksjon-prosjekt-scenario-people-repair.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No scenario People repair changes"
            exit 1
          fi
          git diff --cached --check
          git commit -m "Regenerate Subkultur scenario People index [scenario-people-materialized]"
          git push origin HEAD:${GITHUB_REF_NAME}
