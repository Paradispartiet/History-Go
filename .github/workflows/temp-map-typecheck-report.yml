name: TEMP Map TypeScript report

on:
  push:
    branches:
      - agent/typescript-map-runtime-v2

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/typescript-map-runtime-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture map TypeScript errors
        run: |
          mkdir -p reports
          npx tsc -p tsconfig.web.json --pretty false > reports/map-typescript-errors.txt 2>&1 || true
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/map-typescript-errors.txt
          if ! git diff --cached --quiet; then
            git commit -m "TEMP capture map TypeScript diagnostics"
            git push origin HEAD:agent/typescript-map-runtime-v2
          fi
