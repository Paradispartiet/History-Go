name: Full index tap regression (diagnostic)

on:
  pull_request:
    paths:
      - 'tests/index-real-touch-debug-browser.mjs'
      - 'tests/device-tap-trace.test.mjs'
      - 'js/debug/tap-trace.js'
      - '.github/workflows/index-real-touch-debug.yml'
      - 'index.html'
      - 'js/app.js'
      - 'js/ui/home-favorite-map-picker.js'
      - 'css/home-favorite-map-picker.css'
      - 'tests/home-favorite-map-picker-visibility.test.mjs'
      - 'css/layout.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: index-tap-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-index-taps:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/device-tap-trace.test.mjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Load actual HistoryGo index and test pointer taps
        run: node tests/index-real-touch-debug-browser.mjs
