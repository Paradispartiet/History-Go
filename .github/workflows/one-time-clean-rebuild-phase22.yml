name: One-time clean rebuild documentation phase 22

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-clean-rebuild-phase22.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reset target branch to current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -C agent/documentation-governance-phase-22-people-of-places origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply People of Places governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          registry_path = Path("docs/documentation_registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          method_path = "docs/people-of-places-method.md"
          registry["documents"] = [entry for entry in registry["documents"] if entry.get("path") != method_path]
          method_entry = {
              "path": method_path,
              "status": "canonical",
              "role": "Bindende redaksjonell metode for relevante, kildebelagte og ikke-dupliserte person–sted-koblinger",
              "owns": ["people_of_places_method"],
              "last_verified": "2026-07-26",
          }
          insert_at = next(
              index + 1
              for index, entry in enumerate(registry["documents"])
              if entry.get("path") == "docs/DATA_PRODUCTION_CONTRACT.md"
          )
          registry["documents"].insert(insert_at, method_entry)
          registry["last_verified"] = "2026-07-26"
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          readme_path = Path("docs/README.md")
          readme = readme_path.read_text(encoding="utf-8")
          section = '''### People-produksjon, stedskobling og bilder

1. [`people-of-places-method.md`](./people-of-places-method.md) — canonical relevans-, kilde-, gjenbruks- og batchmetode for person–sted-koblinger
2. [`../data/people/manifest.json`](../data/people/manifest.json) — aktive canonical people-source-filer
3. [`../tools/audit-people-of-places-status.mts`](../tools/audit-people-of-places-status.mts) — status-, schema-, referanse- og struktur-audit
4. [`../tools/check-people-of-places-gate.mts`](../tools/check-people-of-places-gate.mts) — blokkerer duplikater, ugyldige refs, manglende primæranker og tomme `places`
5. [`PEOPLE_IMAGES.md`](./PEOPLE_IMAGES.md) — canonical kilde-, lisens-, godkjennings- og attribusjonskontrakt for people-bilder
6. [`../tools/people-image-pipeline.mts`](../tools/people-image-pipeline.mts) — implementert kandidat-, review-, apply- og audit-pipeline
7. [`../tests/people-images.test.mjs`](../tests/people-images.test.mjs) — lisens-, identitets-, quality-, apply- og attribusjonsregresjoner

People of Places-metoden eier den redaksjonelle relevans- og kildegaten. Dagens CI blokkerer dupliserte people-ID-er, ugyldige place-referanser, manglende gyldige primærankere og tomme `places`, men beregner ikke full place-for-place-dekning og avgjør ikke historisk relevans. Dekningsmål og relevans må derfor dokumenteres i batchen. Runtime leser bare manifest-loadede canonical people-filer. Kandidat-, attribusjons- og statusrapporter er arbeids- og sporbarhetsdata, ikke parallelle people-sannheter.
'''
          starts = [
              readme.find("### People-bilder og rettigheter\n"),
              readme.find("### People-produksjon, stedskobling og bilder\n"),
          ]
          starts = [value for value in starts if value >= 0]
          if not starts:
              raise SystemExit("Fant ikke People-seksjonen")
          start = min(starts)
          end_marker = "\n### Koordinater og geografisk evidens\n"
          end = readme.find(end_marker, start)
          if end < 0:
              raise SystemExit("Fant ikke slutten på People-seksjonen")
          readme = readme[:start] + section.rstrip("\n") + readme[end:]

          completed = "- `people-of-places-method.md` synkronisert med manifest/audit/gate og registrert som canonical redaksjonell metode"
          if completed not in readme:
              anchor = "- `PEOPLE_IMAGES.md` synkronisert med pipeline og registrert som canonical bilde- og rettighetskontrakt"
              if anchor not in readme:
                  raise SystemExit("Fant ikke People Images-ankeret")
              readme = readme.replace(anchor, anchor + "\n" + completed, 1)
          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Remove temporary files from target branch
        shell: bash
        run: |
          rm -f .github/people-of-places-governance-trigger.txt
          rm -f .github/rebuild-phase22-trigger.txt
          rm -f .github/workflows/one-time-register-people-of-places-governance.yml
          rm -f .github/workflows/one-time-rebuild-phase22.yml
          rm -f .github/workflows/one-time-clean-rebuild-phase22.yml

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate documentation governance
        shell: bash
        run: |
          npm run build:scripts
          node dist/scripts/check-documentation-governance.mjs

      - name: Reset generated build output
        shell: bash
        run: |
          git restore --source=HEAD --worktree --staged -- dist 2>/dev/null || true
          git clean -fd -- dist

      - name: Verify target result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          readme = Path("docs/README.md").read_text(encoding="utf-8")
          for token in (
              "dupliserte people-ID-er",
              "ugyldige place-referanser",
              "manglende gyldige primærankere",
              "tomme `places`",
              "avgjør ikke historisk relevans",
          ):
              assert token in readme

          registry = json.loads(Path("docs/documentation_registry.json").read_text(encoding="utf-8"))
          entry = next(item for item in registry["documents"] if item["path"] == "docs/people-of-places-method.md")
          assert entry["status"] == "canonical"
          assert entry["owns"] == ["people_of_places_method"]

          inventory = json.loads(Path("reports/documentation-governance/inventory.json").read_text(encoding="utf-8"))
          assert "docs/people-of-places-method.md" not in inventory["unregistered_governance_candidates"]
          PY

      - name: Commit and replace target branch
        shell: bash
        run: |
          git add -A
          git commit -m "Registrer canonical People of Places-governance"
          git push --force origin HEAD:agent/documentation-governance-phase-22-people-of-places

      - name: Remove rebuild workflows from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C main origin/main
          changed=0
          for path in \
            .github/workflows/one-time-clean-rebuild-phase22.yml \
            .github/workflows/one-time-rebuild-phase22.yml; do
            if [ -f "$path" ]; then
              git rm "$path"
              changed=1
            fi
          done
          if [ "$changed" -eq 0 ]; then
            exit 0
          fi
          git commit -m "Fjern rebuild-workflows for dokumentasjonsfase 22"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1

# Retry clean phase 22 rebuild.
