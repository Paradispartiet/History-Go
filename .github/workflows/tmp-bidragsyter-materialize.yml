name: Temporary Bidragsyter materialization
on:
  push:
    branches:
      - civication/media-bidragsyter-role-world
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: civication/media-bidragsyter-role-world
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Materialize Bidragsyter canonical Role World
        run: node scripts/tmp-materialize-media-bidragsyter.mjs
      - name: Regenerate life-position readiness
        run: node scripts/audit-civication-life-position-role-world-readiness.mjs --write
      - name: Verify Bidragsyter readiness
        run: node tests/civication-bidragsyter-life-position-readiness.test.js
      - name: Verify Bidragsyter Role World
        run: node tests/civication-bidragsyter-role-world.test.js
      - name: Verify global life-position readiness
        run: node tests/civication-life-position-role-world-readiness.test.js
      - name: Verify noncareer taxonomy
        run: node tests/civication-noncareer-role-taxonomy.test.js
      - name: Verify Role World contract
        run: node tests/civication-role-world-contract.test.js
      - name: Verify Skribent regression
        run: node tests/civication-skribent-life-position-readiness.test.js
      - name: Verify Frilanser source inventory regression
        run: node tests/civication-naeringsliv-frilanser-life-position-readiness.test.js
      - name: Commit canonical Bidragsyter state
        run: |
          git add \
            data/Civication/lifePositionRoleWorldReadiness.json \
            data/Civication/nonCareerRoleTaxonomy.json \
            data/Civication/roleWorldAuthoringChecklist.json \
            data/Civication/roleWorldPolicy.json \
            data/Civication/roleWorldThemeBank.json \
            data/Civication/roleWorlds/index.json \
            data/Civication/roleWorlds/media/media_bidragsyter.json \
            reports/civication-life-position-role-world-readiness.md \
            tests/civication-life-position-role-world-readiness.test.js \
            tests/civication-naeringsliv-frilanser-life-position-readiness.test.js \
            tests/civication-noncareer-role-taxonomy.test.js \
            tests/civication-role-world-contract.test.js
          if git diff --cached --quiet; then
            echo 'Bidragsyter canonical state already synchronized.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Synchronize Bidragsyter canonical Role World state'
          git push origin HEAD:civication/media-bidragsyter-role-world
