name: Oslo coordinate batch 24 integration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-coordinate-batch-24-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'agent/oslo-coordinate-control-batch-24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect persistent coordinate evidence
        shell: bash
        run: |
          set -u
          OUT='reports/oslo-coordinate-control-batch-24'
          mkdir -p "$OUT/lookups" "$OUT/sources"

          run_finder() {
            local address="$1"
            local file="$2"
            set +e
            set -o pipefail
            npm run places:coords:find:address -- --address "$address" | tee "$OUT/lookups/$file"
            local code=${PIPESTATUS[0]}
            set +o pipefail
            set -e
            printf '%s\n' "$code" > "$OUT/lookups/$file.exit-status.txt"
            return 0
          }

          run_curl() {
            local url="$1"
            local file="$2"
            set +e
            curl --retry 3 --retry-delay 2 -fsSL -A 'History-Go-coordinate-audit/1.0' "$url" \
              | tee "$OUT/sources/$file" >/dev/null
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$code" > "$OUT/sources/$file.exit-status.txt"
            return 0
          }

          set -e
          run_finder 'Sagveien 23 Oslo' 'ovre_foss-sagveien-23-geonorge.json'
          run_finder 'Trondheimsveien 2 Oslo' 'schous_bryggeri-trondheimsveien-2-geonorge.json'
          run_finder 'Thorvald Meyers gate 2 Oslo' 'ringnes_bryggeri-thorvald-meyers-gate-2-geonorge.json'
          run_finder 'Thorvald Meyers gate 2A Oslo' 'ringnes_bryggeri-thorvald-meyers-gate-2a-geonorge.json'
          run_finder 'Pilestredet 75C Oslo' 'st_halvard_bryggeri-pilestredet-75c-geonorge.json'

          run_curl 'https://www.wikidata.org/wiki/Special:EntityData/Q11975545.json' \
            'ovre_foss-hjula-wikidata-Q11975545.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Bakeriet%20Akershus%20festning%20Oslo' \
            'akershus_slott_bakeriet-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Kornmagasinet%20Akershus%20festning%20Oslo' \
            'oslo_kornmagasin-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Sagene%20m%C3%B8lle%20og%20kvernhus%20Oslo' \
            'sagene_kvernhus-nominatim.json'

          cat > "$OUT/source-notes.md" <<'EOF'
          # Batch 24 – kilde- og identitetsnotater

          - Hjula Væverier: Oslo byleksikon identifiserer anlegget i Sagveien 23. Geonorge-oppslaget er tvetydig, så batchen bruker det navngitte kildeobjektet Wikidata Q11975545 som fysisk hovedanker for `ovre_foss`.
          - Schous bryggeri: Oslo byleksikon identifiserer bryggerianlegget ved Trondheimsveien 2. Geonorge gir ett eksakt adressetreff.
          - Ringnes bryggeri: Oslo byleksikon identifiserer det gamle brygghuset som Thorvald Meyers gate 2A. Det brede nr. 2-oppslaget er tvetydig; 2A gir ett entydig Geonorge-treff.
          - Sagene mølle og kvernhus: aktiv record dekker flere historiske anlegg og har ikke ett entydig fysisk hovedobjekt.
          - St. Halvard bryggeri: Pilestredet 75C gir et entydig adressepunkt, men aktiv record har materiell konflikt i år, geografi og historisk identitet. Punktet anvendes ikke.
          - Christiania kornmagasin: et konkret Kornmagasinet-bygg finnes på Akershus, men det dokumenterte bygget er inventar 0008 fra 1788, mens aktiv record oppgir 1785. Punktet anvendes ikke før identiteten er avklart.
          - Bakeriet ved Akershus: OSM way 669390521 er navngitt Bakeriet på Akershus festning; Lovdatas fredningsforskrift identifiserer inventar 14 som Bakeriet fra 1759.
          EOF

      - name: Normalize coordinate source providers
        run: |
          sed -i "s/sourceProvider: 'wikidata'/sourceProvider: 'manual_research'/g" scripts/tmp-complete-oslo-coordinate-batch24.mjs
          sed -i "s/sourceProvider: 'openstreetmap'/sourceProvider: 'osm'/g" scripts/tmp-complete-oslo-coordinate-batch24.mjs

      - name: Apply batch 24
        run: node scripts/tmp-complete-oslo-coordinate-batch24.mjs

      - name: Keep protocol verified-count wording in sync
        run: |
          sed -i 's/Disse kontrollene er fullført, men teller ikke blant de 131 verifiserte eller kildekontrollerte canonical Oslo-stedene\./Disse kontrollene er fullført, men teller ikke blant de 135 verifiserte eller kildekontrollerte canonical Oslo-stedene./' docs/coordinates/coordinate-control-protocol.md

      - name: Build global place index
        run: |
          set -o pipefail
          npm run places:index:build | tee reports/oslo-coordinate-control-batch-24/places-index-build.txt

      - name: Validate split manifest sync
        run: |
          set -o pipefail
          npm run audit:places-split-manifest-sync | tee reports/oslo-coordinate-control-batch-24/split-manifest-audit.txt

      - name: Validate source and runtime parity
        run: |
          set -o pipefail
          npm run places:index:check | tee reports/oslo-coordinate-control-batch-24/places-index-check.txt

      - name: Validate coordinate quality
        run: |
          set -o pipefail
          npm run places:coords:quality | tee reports/oslo-coordinate-control-batch-24/coordinate-quality.txt

      - name: Validate strict coordinate intake against merge-base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE="$(git merge-base HEAD origin/main)"
          echo "COORD_INTAKE_BASE=$BASE" | tee reports/oslo-coordinate-control-batch-24/strict-intake-base.txt
          COORD_INTAKE_BASE="$BASE" npm run places:coords:intake \
            | tee reports/oslo-coordinate-control-batch-24/strict-intake.txt

      - name: Validate coordinate evidence
        id: evidence
        continue-on-error: true
        run: |
          set -o pipefail
          npm run places:coords:evidence:audit | tee reports/oslo-coordinate-control-batch-24/evidence-audit.txt

      - name: Upload evidence audit failure report
        if: steps.evidence.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch-24-evidence-audit-failure
          path: |
            reports/coordinate-evidence-audit.md
            reports/oslo-coordinate-control-batch-24/evidence-audit.txt
          if-no-files-found: error

      - name: Stop on evidence audit failure
        if: steps.evidence.outcome == 'failure'
        run: exit 1

      - name: Validate diff whitespace
        run: git diff --check

      - name: Remove temporary integration files and commit result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/oslo-coordinate-batch-24-evidence.yml
          rm -f .github/workflows/oslo-coordinate-batch-24-integrate.yml
          rm -f scripts/tmp-complete-oslo-coordinate-batch24.mjs
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete Oslo coordinate control batch 24'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
