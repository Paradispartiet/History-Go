name: Apply Subkultur3 badge colors

on:
  push:
    branches:
      - fix/subkultur3-badge-map-colors
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'fix/subkultur3-badge-map-colors'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/subkultur3-badge-map-colors
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read Subkultur3 pixels and update badge colors
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sharp = require('sharp');

          const IMAGE = 'bilder/merker/Subkultur3.PNG';

          function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            const l = (max + min) / 2;
            if (max === min) return { h: 0, s: 0, l };
            const d = max - min;
            const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            let h;
            if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
            else if (max === g) h = (b - r) / d + 2;
            else h = (r - g) / d + 4;
            h *= 60;
            return { h, s, l };
          }

          function dominantCentroid(samples, step = 16) {
            if (!samples.length) throw new Error('No pixel samples matched');
            const buckets = new Map();
            for (const p of samples) {
              const key = [p.r, p.g, p.b].map(v => Math.min(255, Math.floor(v / step) * step)).join(',');
              let bucket = buckets.get(key);
              if (!bucket) bucket = { count: 0, r: 0, g: 0, b: 0 };
              bucket.count += 1;
              bucket.r += p.r;
              bucket.g += p.g;
              bucket.b += p.b;
              buckets.set(key, bucket);
            }
            const winner = [...buckets.values()].sort((a, b) => b.count - a.count)[0];
            return {
              r: Math.round(winner.r / winner.count),
              g: Math.round(winner.g / winner.count),
              b: Math.round(winner.b / winner.count),
              count: winner.count,
            };
          }

          function hex({ r, g, b }) {
            return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
          }

          (async () => {
            const { data, info } = await sharp(IMAGE).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
            const { width, height, channels } = info;
            const cx = (width - 1) / 2;
            const cy = (height - 1) / 2;
            const radius = Math.min(width, height) / 2;
            const dark = [];
            const orange = [];

            for (let y = 0; y < height; y++) {
              for (let x = 0; x < width; x++) {
                const i = (y * width + x) * channels;
                const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
                if (a < 160) continue;
                const rn = Math.hypot(x - cx, y - cy) / radius;
                const hsl = rgbToHsl(r, g, b);

                // Badgeflaten: mørke, lavmettede stoffpiksler innenfor ytterkanten.
                if (rn < 0.78 && hsl.s < 0.28 && hsl.l >= 0.055 && hsl.l <= 0.34) {
                  dark.push({ r, g, b });
                }

                // Ytterkanten: mettede varme oransje broderipiksler nær kanten.
                if (rn >= 0.72 && rn <= 1.02 && hsl.h >= 12 && hsl.h <= 52 && hsl.s >= 0.42 && hsl.l >= 0.18 && hsl.l <= 0.78) {
                  orange.push({ r, g, b });
                }
              }
            }

            const primary = hex(dominantCentroid(dark));
            const secondary = hex(dominantCentroid(orange));
            console.log(`[Subkultur3] primary=${primary} secondary=${secondary} darkSamples=${dark.length} orangeSamples=${orange.length}`);

            const badgePath = 'data/badges/subkultur.json';
            const badge = JSON.parse(fs.readFileSync(badgePath, 'utf8'));
            badge.color = primary;
            badge.secondaryColor = secondary;
            badge.image = IMAGE;
            fs.writeFileSync(badgePath, JSON.stringify(badge, null, 2) + '\n');

            const categoriesPath = 'js/core/categories.ts';
            let categories = fs.readFileSync(categoriesPath, 'utf8');
            const before = categories;
            categories = categories.replace(
              /\{ id: "subkultur", name: "Subkultur", icon: "🧷", color: "#[0-9A-Fa-f]{6}", secondaryColor: "#[0-9A-Fa-f]{6}", scope: "runtime_domain" \}/,
              `{ id: "subkultur", name: "Subkultur", icon: "🧷", color: "${primary}", secondaryColor: "${secondary}", scope: "runtime_domain" }`
            );
            if (categories === before) throw new Error('Could not update Subkultur category registry');
            fs.writeFileSync(categoriesPath, categories);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Typecheck browser TypeScript
        run: npm run typecheck:web

      - name: Rebuild browser runtime
        run: npm run build:web

      - name: Validate result
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const badge = JSON.parse(fs.readFileSync('data/badges/subkultur.json', 'utf8'));
          const categories = fs.readFileSync('js/core/categories.ts', 'utf8');
          if (badge.image !== 'bilder/merker/Subkultur3.PNG') throw new Error(`Wrong image path: ${badge.image}`);
          if (!/^#[0-9A-F]{6}$/.test(badge.color)) throw new Error(`Invalid primary: ${badge.color}`);
          if (!/^#[0-9A-F]{6}$/.test(badge.secondaryColor)) throw new Error(`Invalid secondary: ${badge.secondaryColor}`);
          if (!categories.includes(`color: "${badge.color}", secondaryColor: "${badge.secondaryColor}"`)) {
            throw new Error('Runtime category colors do not match badge colors');
          }
          console.log(`[validated] image=${badge.image} primary=${badge.color} secondary=${badge.secondaryColor}`);
          NODE
          git diff --check

      - name: Commit and push final implementation
        shell: bash
        run: |
          rm -f .github/workflows/temp-subkultur3-colors.yml
          git config user.name "Paradispartiet"
          git config user.email "225725199+Paradispartiet@users.noreply.github.com"
          git add \
            data/badges/subkultur.json \
            js/core/categories.ts \
            js/core/categories.js \
            dist/web/categories.js \
            .github/workflows/temp-subkultur3-colors.yml
          git commit -m "Use Subkultur3 badge and matching map colors"
          git push origin HEAD:fix/subkultur3-badge-map-colors
