name: Tøyenbadet final derived-index sync (temporary)
on:
  push:
    branches:
      - feat/toyenbadet-verified-news-final-gate-20261104
    paths:
      - .github/workflows/toyenbadet-final-index-sync-temp.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate canonical derived indexes
        run: |
          npm ci --no-audit --no-fund
          npm run place-open:build
          npm run epoker:places:build
          npm run place-open:check
          npm run epoker:places:check
          echo "Generated changes:"
          git status --short
      - name: Commit synchronized outputs only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/runtime/leksikon-all data/runtime/place-open data/epoker/epoke-place-index.json
          echo "Committing derived output files:"
          git diff --cached --name-only
          if ! git diff --cached --quiet; then
            git commit -m "build(toyenbadet): regenerate Leksikon and epoke indexes for October 2026 news"
            git push origin HEAD:feat/toyenbadet-verified-news-final-gate-20261104
          fi
