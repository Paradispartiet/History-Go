name: Civication 4H-B materialize and verify

on:
  push:
    branches:
      - agent/civication-4hb-compiled-registry-cutover
    paths:
      - .github/workflows/civication-4hb-diagnose.yml

permissions:
  contents: write

concurrency:
  group: civication-4hb-materialize
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-4hb-compiled-registry-cutover
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Apply 4H-B cutover patch set
        run: python scripts/.tmp-civication-4hb-cutover.py
      - name: Materialize compiled registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Verify registry sync and zero shadowed duplicates
        run: |
          node scripts/build-civication-scene-registry.mjs --check
          node --input-type=module <<'NODE'
          import { compileRegistryFromRepo } from './scripts/build-civication-scene-registry.mjs';
          const registry = await compileRegistryFromRepo(process.cwd());
          if (registry.stats.shadowed_duplicate_count !== 0) {
            throw new Error(`Expected zero shadowed duplicates, got ${registry.stats.shadowed_duplicate_count}`);
          }
          console.log(`4H-B registry: ${registry.stats.scene_count} scenes / ${registry.stats.role_count} roles / 0 shadowed`);
          NODE
      - name: Run 4H-B focused gates
        run: |
          node tests/civication-compiled-scene-registry.test.js
          node tests/civication-compiled-scene-registry-parity.test.js
          node tests/civication-scene-director-daily-catalog.test.js
      - name: Run full Civication suite
        run: node tests/run-civication-tests.mjs
      - name: Verify clean patch
        run: git diff --check
      - name: Commit materialized 4H-B cutover
        run: |
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add \
            data/Civication/compiledSceneRegistryV1.json \
            data/Civication/COMPILED_SCENE_REGISTRY_V1.md \
            data/Civication/SCENE_PIPELINE_V1.md \
            data/Civication/scenePipelinePolicyV1.json \
            js/Civication/systems/civicationWorkdayMailBuilder.js \
            tests/civication-compiled-scene-registry.test.js \
            tests/civication-compiled-scene-registry-parity.test.js \
            tests/civication-scene-director-daily-catalog.test.js \
            .github/workflows/civication.yml
          git diff --cached --quiet && { echo "No materialized changes to commit"; exit 1; }
          git commit -m "Complete Civication 4H-B compiled registry cutover"
          git push origin HEAD:agent/civication-4hb-compiled-registry-cutover
