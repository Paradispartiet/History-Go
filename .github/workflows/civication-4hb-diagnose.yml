name: Civication 4H-B materialize and verify

on:
  push:
    branches:
      - agent/civication-4hb-compiled-registry-cutover
    paths:
      - .github/workflows/civication-4hb-diagnose.yml

permissions:
  contents: write

concurrency:
  group: civication-4hb-materialize
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-4hb-compiled-registry-cutover
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Repair one-shot anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/.tmp-civication-4hb-cutover.py')
          text = p.read_text(encoding='utf-8')

          start = "test = replace_regex_once(\n    test,\n    r'  // To canonicale runtime-paths har i dagens datatre samme scene-ID.*?"
          end = "    'compiler duplicate debt block'\n)"
          i = text.find(start)
          if i < 0:
              raise SystemExit('compiler duplicate replacement start not found')
          j = text.find(end, i)
          if j < 0:
              raise SystemExit('compiler duplicate replacement end not found')
          j += len(end)
          replacement = '''test = replace_once(
              test,
              ''' + repr('''  // To canonicale runtime-paths har i dagens datatre samme scene-ID og identisk\n  // routing-signatur. Runtime laster job-kilden først; compileren skal derfor\n  // beholde den første og inventere den senere kopien som eksplisitt gjeld.\n  const duplicateEntries = first.entries.filter((entry) => entry.id === duplicateSceneId);\n  assert.equal(duplicateEntries.length, 1);\n  assert.equal(duplicateEntries[0].source_path, keptDuplicateSource);\n  const duplicateDebt = first.shadowed_duplicates.find((entry) => entry.id === duplicateSceneId);\n  assert(duplicateDebt, "kjent route-ekvivalent duplicate skal inventeres");\n  assert.equal(duplicateDebt.kept_source_path, keptDuplicateSource);\n  assert.equal(duplicateDebt.shadowed_source_path, shadowedDuplicateSource);\n  assert(duplicateDebt.kept_source_rank < duplicateDebt.shadowed_source_rank);\n  assert.match(duplicateDebt.routing_signature, /^[a-f0-9]{64}$/);\n''') + ''',
              ''' + repr('''  // 4H-B fjerner den eneste runtime-reachable skyggekopien uten å endre vinnerscenen.\n  assert.equal(first.stats.shadowed_duplicate_count, 0, "4H-B krever null shadowed duplicate-gjeld");\n  assert.deepEqual(first.shadowed_duplicates, []);\n  assert.equal(first.entries.filter((entry) => entry.id === duplicateSceneId).length, 1);\n''') + ''',
              'compiler duplicate debt block'
          )'''
          text = text[:i] + replacement + text[j:]

          old_ci = ("    '      - name: Run Civication tests\\n        run: node tests/run-civication-tests.mjs\\n',\n"
                    "    '      - name: Verify compiled scene registry is synchronized\\n        run: node scripts/build-civication-scene-registry.mjs --check\\n      - name: Run Civication tests\\n        run: node tests/run-civication-tests.mjs\\n',\n")
          new_ci = ("    '      - name: Run complete Civication suite\\n        run: npm run test:civication\\n',\n"
                    "    '      - name: Verify compiled scene registry is synchronized\\n        run: node scripts/build-civication-scene-registry.mjs --check\\n      - name: Run complete Civication suite\\n        run: npm run test:civication\\n',\n")
          count = text.count(old_ci)
          if count != 1:
              raise SystemExit(f'CI registry replacement anchor: expected one source block, found {count}')
          text = text.replace(old_ci, new_ci, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Apply 4H-B cutover patch set
        run: python scripts/.tmp-civication-4hb-cutover.py
      - name: Preserve legacy runtime semantics in compiler
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-civication-scene-registry.mjs')
          text = p.read_text(encoding='utf-8')

          old_choices = '''function normalizeRuntimeChoices(choices) {
            return (Array.isArray(choices) ? choices : [])
              .filter((choice) => choice && typeof choice === "object")
              .map((choice, index) => ({
                ...choice,
                id: norm(choice.id) || String.fromCharCode(65 + index),
                label: norm(choice.label || choice.text || choice.id),
                effect: numberOr(choice.effect, 0),
                tags: uniqueStrings(choice.tags),
                feedback: norm(choice.feedback)
              }))
              .filter((choice) => choice.id && choice.label);
          }
'''
          new_choices = '''function normalizeRuntimeChoices(choices) {
            // Must mirror CivicationSceneCatalog.normalizeChoices() exactly.
            // Compatibility projection preserves tag order and duplicates because
            // stable candidate semantics include the legacy normalized mail shape.
            return (Array.isArray(choices) ? choices : [])
              .filter(Boolean)
              .map((choice) => ({
                ...choice,
                id: norm(choice?.id),
                label: norm(choice?.label),
                effect: Number(choice?.effect || 0),
                tags: Array.isArray(choice?.tags) ? choice.tags.map(norm).filter(Boolean) : [],
                feedback: norm(choice?.feedback)
              }))
              .filter((choice) => choice.id && choice.label);
          }
'''
          if text.count(old_choices) != 1:
              raise SystemExit(f'compiler runtime-choice anchor count={text.count(old_choices)}')
          text = text.replace(old_choices, new_choices, 1)

          old_order = '''  entries.sort((a, b) =>
            a.category.localeCompare(b.category, "en") ||
            a.role_scope.localeCompare(b.role_scope, "en") ||
            a.mail_type.localeCompare(b.mail_type, "en") ||
            a.id.localeCompare(b.id, "en")
          );
          shadowedDuplicates.sort((a, b) =>
            a.id.localeCompare(b.id, "en") || a.shadowed_source_path.localeCompare(b.shadowed_source_path, "en")
          );

          const roleIndex = {};
          for (const entry of entries) {
            const key = `${entry.category}/${entry.role_scope}`;
            if (!roleIndex[key]) roleIndex[key] = [];
            roleIndex[key].push(entry.id);
          }
          const sortedRoleIndex = Object.fromEntries(
            Object.entries(roleIndex)
              .sort(([a], [b]) => a.localeCompare(b, "en"))
              .map(([key, ids]) => [key, [...ids].sort((a, b) => a.localeCompare(b, "en"))])
          );
'''
          new_order = '''  // role_index is runtime-semantic: preserve source-rank, source-file and in-file mail order.
          // entries may still be canonically sorted for stable reviewable output after the index is captured.
          const roleIndex = {};
          for (const entry of entries) {
            const key = `${entry.category}/${entry.role_scope}`;
            if (!roleIndex[key]) roleIndex[key] = [];
            roleIndex[key].push(entry.id);
          }

          entries.sort((a, b) =>
            a.category.localeCompare(b.category, "en") ||
            a.role_scope.localeCompare(b.role_scope, "en") ||
            a.mail_type.localeCompare(b.mail_type, "en") ||
            a.id.localeCompare(b.id, "en")
          );
          shadowedDuplicates.sort((a, b) =>
            a.id.localeCompare(b.id, "en") || a.shadowed_source_path.localeCompare(b.shadowed_source_path, "en")
          );

          const sortedRoleIndex = Object.fromEntries(
            Object.entries(roleIndex)
              .sort(([a], [b]) => a.localeCompare(b, "en"))
          );
'''
          if text.count(old_order) != 1:
              raise SystemExit(f'compiler role-index anchor count={text.count(old_order)}')
          p.write_text(text.replace(old_order, new_order, 1), encoding='utf-8')
          PY
      - name: Materialize compiled registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Verify registry sync and zero shadowed duplicates
        run: |
          node scripts/build-civication-scene-registry.mjs --check
          node --input-type=module <<'NODE'
          import { compileRegistryFromRepo } from './scripts/build-civication-scene-registry.mjs';
          const registry = await compileRegistryFromRepo(process.cwd());
          if (registry.stats.shadowed_duplicate_count !== 0) {
            throw new Error(`Expected zero shadowed duplicates, got ${registry.stats.shadowed_duplicate_count}`);
          }
          console.log(`4H-B registry: ${registry.stats.scene_count} scenes / ${registry.stats.role_count} roles / 0 shadowed`);
          NODE
      - name: Registry contract gate
        run: node tests/civication-compiled-scene-registry.test.js
      - name: Before-after parity gate
        id: parity
        continue-on-error: true
        run: node tests/civication-compiled-scene-registry-parity.test.js > .tmp-civication-4hb-parity.log 2>&1
      - name: Persist exact parity failure
        if: steps.parity.outcome == 'failure'
        run: |
          cat .tmp-civication-4hb-parity.log
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add -f .tmp-civication-4hb-parity.log
          git commit -m "Capture 4H-B parity failure [skip ci]"
          git push origin HEAD:agent/civication-4hb-compiled-registry-cutover
          exit 1
      - name: SceneCatalog daily cutover gate
        run: node tests/civication-scene-director-daily-catalog.test.js
      - name: Run full Civication suite
        run: npm run test:civication
      - name: Verify clean patch
        run: git diff --check
      - name: Commit materialized 4H-B cutover
        run: |
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add \
            scripts/build-civication-scene-registry.mjs \
            data/Civication/compiledSceneRegistryV1.json \
            data/Civication/COMPILED_SCENE_REGISTRY_V1.md \
            data/Civication/SCENE_PIPELINE_V1.md \
            data/Civication/scenePipelinePolicyV1.json \
            js/Civication/systems/civicationWorkdayMailBuilder.js \
            tests/civication-compiled-scene-registry.test.js \
            tests/civication-compiled-scene-registry-parity.test.js \
            tests/civication-scene-director-daily-catalog.test.js \
            .github/workflows/civication.yml
          git diff --cached --quiet && { echo "No materialized changes to commit"; exit 1; }
          git commit -m "Complete Civication 4H-B compiled registry cutover"
          git push origin HEAD:agent/civication-4hb-compiled-registry-cutover
