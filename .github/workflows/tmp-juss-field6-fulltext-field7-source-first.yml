name: TEMP Juss field 6 fulltext field 7 source-first

on:
  push:
    branches:
      - agent/fagverk-juss-rettsvitenskap-field-6-fulltext-field-7-source-first-20260901

permissions:
  contents: write

concurrency:
  group: tmp-juss-field6-fulltext-field7-source-first
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.head_commit.message == 'Run fail-closed Juss field 6 fulltext field 7 source-first'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Juss branch
        uses: actions/checkout@v4
        with:
          ref: agent/fagverk-juss-rettsvitenskap-field-6-fulltext-field-7-source-first-20260901
          fetch-depth: 1
          show-progress: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax-check TEMP inputs
        run: |
          node --check scripts/tmp-materialize-juss-field6-fulltext-field7-source-first.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const seed=JSON.parse(fs.readFileSync('scripts/tmp-juss-field7-procedure-evidence-source-seed.json','utf8'));
          const claims=seed.topic_briefs.flatMap(t=>t.planned_claims||[]);
          if(seed.sources.length!==13||seed.topic_briefs.length!==8||claims.length!==32||seed.planned_assessments.length!==8||seed.decision_scenarios.length!==6) throw new Error('TEMP Felt 7 seed contract mismatch');
          NODE

      - name: Generate candidate state or capture exact failure
        run: |
          set +e
          node scripts/tmp-materialize-juss-field6-fulltext-field7-source-first.mjs > /tmp/juss-generator.log 2>&1
          status=$?
          set -e
          cat /tmp/juss-generator.log
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd
            mkdir -p reports/fagverk
            tail -n 160 /tmp/juss-generator.log > reports/fagverk/tmp-juss-field6-field7-generator-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add reports/fagverk/tmp-juss-field6-field7-generator-error.txt
            if ! git diff --cached --quiet; then
              git commit -m 'Capture Juss field 6 field 7 generator error'
              git push origin HEAD:agent/fagverk-juss-rettsvitenskap-field-6-fulltext-field-7-source-first-20260901
            fi
            exit "$status"
          fi

      - name: Syntax-check generated Juss gates
        run: |
          node --check scripts/audit-juss-rettsvitenskap-criminal-law-liability-culpability-offences-sanctions-fulltext-v1.mjs
          node --check scripts/materialize-juss-rettsvitenskap-criminal-law-liability-culpability-offences-sanctions-fulltext-v1.mjs
          node --check scripts/brief-juss-rettsvitenskap-procedure-evidence-civil-criminal-process-sources-v1.mjs
          node --check scripts/audit-juss-rettsvitenskap-reconciliation-v1.mjs
          node --check tests/juss-rettsvitenskap-criminal-law-liability-culpability-offences-sanctions-fulltext-v1.test.mjs
          node --check tests/juss-rettsvitenskap-procedure-evidence-civil-criminal-process-source-brief-v1.test.mjs
          node --check tests/juss-rettsvitenskap-reconciliation-v1.test.mjs

      - name: Run isolated Field 6 and Field 7 gates
        run: |
          node scripts/brief-juss-rettsvitenskap-criminal-law-liability-culpability-offences-sanctions-sources-v1.mjs
          node scripts/audit-juss-rettsvitenskap-criminal-law-liability-culpability-offences-sanctions-fulltext-v1.mjs
          node scripts/materialize-juss-rettsvitenskap-criminal-law-liability-culpability-offences-sanctions-fulltext-v1.mjs
          node scripts/brief-juss-rettsvitenskap-procedure-evidence-civil-criminal-process-sources-v1.mjs
          node --test tests/juss-rettsvitenskap-criminal-law-liability-culpability-offences-sanctions-source-brief-v1.test.mjs tests/juss-rettsvitenskap-criminal-law-liability-culpability-offences-sanctions-fulltext-v1.test.mjs tests/juss-rettsvitenskap-procedure-evidence-civil-criminal-process-source-brief-v1.test.mjs tests/juss-rettsvitenskap-reconciliation-v1.test.mjs

      - name: Create local candidate checkpoint for deterministic CI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/tmp-juss-field6-fulltext-field7-source-first.yml scripts/tmp-materialize-juss-field6-fulltext-field7-source-first.mjs scripts/tmp-juss-field7-procedure-evidence-source-seed.json
          if git diff --cached --quiet; then
            echo 'No candidate changes generated before deterministic checkpoint' >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing workflow mutation in local candidate checkpoint' >&2
            exit 1
          fi
          git commit -m 'TEMP local Juss field 6 field 7 candidate checkpoint'

      - name: Run registry-driven Juss and shared Fagverk gates
        run: node scripts/run-fagverk-domain-ci-v1.mjs --subject juss_rettsvitenskap

      - name: Verify canonical progress and no premature completion
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const reg=JSON.parse(fs.readFileSync('data/fag/politikk/juss_rettsvitenskap/production_registry_v1.json','utf8'));
          const category=JSON.parse(fs.readFileSync('data/categories/category_contract.json','utf8'));
          const sub=category.canonicalSubcategories.politikk.find(row=>row.id==='juss_rettsvitenskap');
          if(reg.progress.materializedDomains!==6||reg.progress.totalDomains!==12||reg.progress.strictCompletionProven!==false||reg.materialized.length!==6) throw new Error('Expected canonical Juss 6/12 state');
          if(reg.next_gate!=='procedure_evidence_civil_criminal_process_fulltext') throw new Error('Expected Field 7 fulltext as next gate');
          if(reg.materialized[5]?.domain_id!=='strafferett_ansvar_skyld_straffebud_reaksjoner') throw new Error('Expected Strafferett as materialized Field 6');
          if(sub?.status!=='expansion_planned') throw new Error('Juss category completed prematurely');
          NODE
          git diff --check

      - name: Remove TEMP production surfaces
        run: |
          rm scripts/tmp-materialize-juss-field6-fulltext-field7-source-first.mjs
          rm scripts/tmp-juss-field7-procedure-evidence-source-seed.json
          rm -f reports/fagverk/tmp-juss-field6-field7-generator-error.txt
          test ! -e scripts/tmp-materialize-juss-field6-fulltext-field7-source-first.mjs
          test ! -e scripts/tmp-juss-field7-procedure-evidence-source-seed.json
          test ! -e reports/fagverk/tmp-juss-field6-field7-generator-error.txt
          test -e .github/workflows/tmp-juss-field6-fulltext-field7-source-first.yml

      - name: Finalize and push permanent candidate only after all gates pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/tmp-juss-field6-fulltext-field7-source-first.yml
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing workflow mutation from Actions token' >&2
            exit 1
          fi
          git commit --amend -m 'Materialize Juss field 6 and prepare field 7 source-first'
          git push origin HEAD:agent/fagverk-juss-rettsvitenskap-field-6-fulltext-field-7-source-first-20260901
