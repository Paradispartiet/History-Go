name: Oslo-20 temporary epoke index materialization
on:
  push:
    branches:
      - oslo-20-final-three-source-texts-20261019
    paths:
      - '.github/workflows/oslo-20-epoke-materialize-temp-20261019.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical source-backed epoch index
        run: npm run epoker:places:build
      - name: Commit generated index and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/oslo-20-epoke-materialize-temp-20261019.yml
          git add data/epoker/epoke-place-index.json .github/workflows/oslo-20-epoke-materialize-temp-20261019.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(oslo-20): regenerate epoch index from verified claims"
          git push origin "HEAD:refs/heads/oslo-20-final-three-source-texts-20261019"
