name: Oslo Sentrum Scene v1 integration
on:
  push:
    branches: [content/oslo-sentrum-scene-v1-20261030]
    paths: ['.github/workflows/sentrum-scene-v1-20261030.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/oslo-sentrum-scene-v1-20261030
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Record current Badge/Place read-first evidence
        run: node scripts/place-production-rule-preflight.mjs record --workcard reports/place-production/sentrum-scene-workcard-current.json --place-id sentrum_scene --category musikk
      - name: Regenerate canonical Knowledge and Scene runtime
        run: |
          npm run knowledge:canonical:write
          node scripts/build-fagverk-release-manifest.mjs
          npm run place-open:build
      - name: Verify exact quiz, Fagverk and Story revision
        run: |
          node --test tests/sentrum-scene-v1-20261030.test.mjs
          npm run knowledge:canonical:check
          npm run place-open:check
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit generated data and preflight
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u data/quiz/musikk/sentrum_scene_sets_merged.json data/knowledge/ data/fagverk/fagverk_release.json data/runtime/ reports/knowledge-id-backfill.json reports/knowledge-contract-audit.json
          git add reports/place-production/sentrum-scene-workcard-current.json
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Sync Sentrum Scene canonical Knowledge, Fagverk and Place-open"
            git restore .
            git push origin HEAD:content/oslo-sentrum-scene-v1-20261030
          fi
