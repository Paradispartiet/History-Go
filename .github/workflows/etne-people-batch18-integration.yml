name: Etne People of Places batch 18 integration

on:
  pull_request:
    paths:
      - 'data/people/sport/vestland/etne/people_sjokanten_trivsel_batch1.json'
      - 'tests/etne-people-of-places-batch18.test.js'
      - '.github/workflows/etne-people-batch18-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Batch 18 branch
        uses: actions/checkout@v4
        with:
          ref: agent/etne-people-of-places-batch18-sjokanten
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit baseline identities and place links
        run: |
          mkdir -p reports/etne-people-of-places-batch18
          node <<'NODE' | tee reports/etne-people-of-places-batch18/duplicate-audit.log
          const fs = require('fs');
          const path = require('path');
          const norm = (v) => String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
          const candidates = [
            {id:'heidi_wannberg',aliases:['Heidi Wannberg','H. Wannberg']},
            {id:'arne_tveit',aliases:['Arne Tveit','A. Tveit','Arne Tveit frå Vikebygd']},
            {id:'jarle_vik',aliases:['Jarle Vik','J. Vik']}
          ];
          const manifest = JSON.parse(fs.readFileSync('data/people/manifest.json','utf8'));
          const identityHits = Object.fromEntries(candidates.map((c)=>[c.id,[]]));
          const placeLinkHits = [];
          let entries = 0;
          for (const rel of manifest.files) {
            const raw = JSON.parse(fs.readFileSync(path.join('data',rel),'utf8'));
            for (const person of (Array.isArray(raw)?raw:[raw])) {
              entries += 1;
              const fields = [person.id,person.name,...(person.aliases||[])].map(norm);
              for (const c of candidates) {
                const aliases = [c.id,...c.aliases].map(norm);
                if (fields.some((field)=>aliases.includes(field))) identityHits[c.id].push({file:rel,id:person.id,name:person.name});
              }
              if (person.placeId === 'sjokanten_trivsel_skanevik' || (person.places||[]).includes('sjokanten_trivsel_skanevik')) placeLinkHits.push({file:rel,id:person.id,name:person.name});
            }
          }
          if (Object.values(identityHits).some((hits)=>hits.length)) throw new Error(`Pre-existing identity: ${JSON.stringify(identityHits)}`);
          if (placeLinkHits.length) throw new Error(`Pre-existing place link: ${JSON.stringify(placeLinkHits)}`);
          console.log(JSON.stringify({status:'PASS',baseline:{files:manifest.files.length,entries,identityHits,placeLinkHits},expectedAfter:{files:manifest.files.length+1,entries:entries+3,placeLinks:candidates.map((c)=>c.id)}},null,2));
          NODE

      - name: Register source and regression gate exactly once
        run: |
          node <<'NODE' | tee reports/etne-people-of-places-batch18/integration-patch.log
          const fs = require('fs');
          const source = 'people/sport/vestland/etne/people_sjokanten_trivsel_batch1.json';
          const manifestPath = 'data/people/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          manifest.files = manifest.files.filter((file)=>file!==source);
          manifest.files.push(source);
          fs.writeFileSync(manifestPath,JSON.stringify(manifest,null,2)+'\n');
          const scriptPath = 'scripts/check-people.sh';
          let script = fs.readFileSync(scriptPath,'utf8');
          script = script.replace(/\necho "== Etne People of Places batch 18 =="\nnode tests\/etne-people-of-places-batch18\.test\.js\n/g,'\n');
          const marker = 'echo "== People check complete =="';
          script = script.replace(marker,'echo "== Etne People of Places batch 18 =="\nnode tests/etne-people-of-places-batch18.test.js\n\n'+marker);
          if (manifest.files.filter((file)=>file===source).length!==1) throw new Error('Manifest count mismatch');
          if ((script.match(/etne-people-of-places-batch18\.test\.js/g)||[]).length!==1) throw new Error('Regression gate count mismatch');
          fs.writeFileSync(scriptPath,script);
          console.log('PASS manifest and people gate registered exactly once');
          NODE

      - name: Run Batch 18 and full people checks
        run: |
          node tests/etne-people-of-places-batch18.test.js 2>&1 | tee reports/etne-people-of-places-batch18/batch18-test.log
          bash scripts/check-people.sh 2>&1 | tee reports/etne-people-of-places-batch18/check-people.log

      - name: Run typecheck
        run: npm run typecheck 2>&1 | tee reports/etne-people-of-places-batch18/typecheck.log

      - name: Run tools check against known main story baseline
        run: |
          set +e
          npm run tools:check 2>&1 | tee reports/etne-people-of-places-batch18/tools-check.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          node <<'NODE'
          const fs=require('fs');
          const log=fs.readFileSync('reports/etne-people-of-places-batch18/tools-check.log','utf8');
          const actual=log.split(/\r?\n/).filter((line)=>line.startsWith('- Ugyldig place_id:'));
          if (!log.includes('Stories integrity FAILED') || actual.length!==5 || !actual.some((line)=>line.includes('place_id=utoya')) || actual.filter((line)=>line.includes('place_id=norges_hjemmefrontmuseum')).length!==2 || actual.filter((line)=>line.includes('place_id=operaen')).length!==2) throw new Error(`Story baseline changed: ${JSON.stringify(actual,null,2)}`);
          console.log('PASS known five-reference story baseline');
          NODE

      - name: Commit clean integration and saved output
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const name of ['duplicate-audit.log','integration-patch.log','batch18-test.log','check-people.log','typecheck.log','tools-check.log']){
            const p='reports/etne-people-of-places-batch18/'+name;
            fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace(/\n+$/,'\n'));
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/etne-people-batch18-integration.yml
          git add data/people/manifest.json scripts/check-people.sh
          git add -f reports/etne-people-of-places-batch18/*.log
          git diff --cached --check
          git commit -m "Integrate Etne People of Places batch 18"
          git push origin HEAD:agent/etne-people-of-places-batch18-sjokanten
