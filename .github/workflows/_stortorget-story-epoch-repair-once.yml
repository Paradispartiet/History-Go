name: Stortorget story epoch repair once

on:
  push:
    branches:
      - agent/stortorget-production-closure-20260911-replay2
    paths:
      - '.github/workflows/_stortorget-story-epoch-repair-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stortorget-production-closure-20260911-replay2
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply Stortorget story integrity contract
        run: node tools/finalize-stortorget-story-contract.mjs
      - name: Rebuild place-open after story change
        run: npm run place-open:build
      - name: Rebuild epoch index last
        run: npm run epoker:places:build
      - name: Verify place-open
        run: npm run place-open:check
      - name: Verify epoch index
        run: npm run epoker:places:check
      - name: Build story integrity tools
        run: npm run build:tools --silent
      - name: Verify Stories integrity
        run: node dist/tools/check_stories_integrity.mjs
      - name: Remove repair workflow from permanent tree
        run: git rm -- .github/workflows/_stortorget-story-epoch-repair-once.yml
      - name: Verify Stortorget regressions
        run: node --test tests/stortorget-production-closure.test.mjs tests/stortorget-story-integrity.test.mjs
      - name: Commit permanent story and epoch repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Align Stortorget story and epoch derivatives'
          git push origin HEAD:agent/stortorget-production-closure-20260911-replay2
