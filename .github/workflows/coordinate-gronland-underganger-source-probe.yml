name: One-time Grønland underpass coordinate source probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Olafiagangen and Nylandsbrua map sources
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/gronland-underganger"
          mkdir -p "$OUT"
          UA='History-Go coordinate research (Paradispartiet/History-Go)'

          curl --fail --silent --show-error --location --user-agent "$UA" \
            'https://api.openstreetmap.org/api/0.6/map?bbox=10.7575,59.9110,10.7640,59.9142' \
            | tee "$OUT/osm-olafiagangen-nylandsbrua-bbox.xml" >/dev/null

          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'q=Olafiagangen, Oslo, Norway' \
            --data 'format=jsonv2' --data 'polygon_geojson=1' --data 'extratags=1' --data 'namedetails=1' --data 'limit=20' \
            | tee "$OUT/nominatim-olafiagangen.json" >/dev/null

          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'q=Nylandsbrua, Oslo, Norway' \
            --data 'format=jsonv2' --data 'polygon_geojson=1' --data 'extratags=1' --data 'namedetails=1' --data 'limit=20' \
            | tee "$OUT/nominatim-nylandsbrua.json" >/dev/null

          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'q=Grønland T, Oslo, Norway' \
            --data 'format=jsonv2' --data 'extratags=1' --data 'namedetails=1' --data 'limit=20' \
            | tee "$OUT/nominatim-gronland-t.json" >/dev/null

          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://api.kartverket.no/stedsnavn/v1/sted' \
            --data-urlencode 'sok=Olafiagangen' --data 'utkoordsys=4258' --data 'treffPerSide=50' --data 'side=1' \
            | tee "$OUT/kartverket-ssr-olafiagangen.json" >/dev/null

          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://api.kartverket.no/stedsnavn/v1/sted' \
            --data-urlencode 'sok=Nylandsbrua' --data 'utkoordsys=4258' --data 'treffPerSide=50' --data 'side=1' \
            | tee "$OUT/kartverket-ssr-nylandsbrua.json" >/dev/null

      - name: Upload raw source artifact
        uses: actions/upload-artifact@v4
        with:
          name: gronland-underganger-coordinate-source-probe
          path: ${{ runner.temp }}/gronland-underganger
