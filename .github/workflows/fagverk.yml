name: Fagverk and place learning

on:
  pull_request:
    paths:
      - 'fagverk.html'
      - 'fagverk-sted.html'
      - 'data/fagverk/**'
      - 'data/fag/politikk/merke_politikk.html'
      - 'data/fag/politikk/politikk_runtime_manifest.json'
      - 'data/fag/politikk/*canonical_v4_5.json'
      - 'js/fagverk.js'
      - 'js/fagverk-sted.js'
      - 'js/fagverk-canonical-integration.js'
      - 'js/fagverk-place-canonical-integration.js'
      - 'js/politikk-fag-model.js'
      - 'js/politikk-fagportal.js'
      - 'js/emnerLoader.ts'
      - 'dist/web/emnerLoader.js'
      - 'js/ui/place-learning-surface.js'
      - 'js/ui/place-learning-canonical.js'
      - 'js/ui/place-card-status-surface.js'
      - 'css/fagverk.css'
      - 'css/fagverk-learning-v2.css'
      - 'css/fagverk-sted.css'
      - 'css/fagverk-canonical.css'
      - 'css/politikk-fagportal.css'
      - 'css/place-learning-surface.css'
      - 'docs/FAGVERK.md'
      - 'tests/fagverk-content.test.mjs'
      - 'tests/fagverk-place-pages.test.mjs'
      - 'tests/place-learning-surface.test.js'
      - 'tests/politikk-fag-integration.test.mjs'
      - '.github/workflows/fagverk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate canonical subject, textbook, place pages and UI links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check runtimes
        run: |
          node --check js/politikk-fag-model.js
          node --check js/politikk-fagportal.js
          node --check js/fagverk.js
          node --check js/fagverk-sted.js
          node --check js/fagverk-canonical-integration.js
          node --check js/fagverk-place-canonical-integration.js
          node --check js/ui/place-learning-surface.js
          node --check js/ui/place-learning-canonical.js
          node --check js/ui/place-card-status-surface.js
      - name: Validate canonical politics, textbook data and place integration
        run: |
          node --test tests/politikk-fag-integration.test.mjs
          node --test tests/fagverk-content.test.mjs
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/place-learning-surface.test.js
