name: Fagverk and place learning

on:
  pull_request:
    paths:
      - 'fagverk-forside.html'
      - 'fagverk.html'
      - 'fagverk-sted.html'
      - 'merke.html'
      - 'data/fag/fag_manifest.json'
      - 'data/fag/fagverk_theory_quality_contract_v1.json'
      - 'data/fagverk/*/**'
      - 'data/places/**'
      - 'data/badges/**'
      - 'data/fag/politikk/merke_politikk.html'
      - 'data/fag/politikk/archive/**'
      - 'data/fag/politikk/politikk_runtime_manifest.json'
      - 'data/fag/politikk/*canonical_v4_5.json'
      - 'js/fagverk-forside.js'
      - 'js/fagverk-subject-core.js'
      - 'js/fagverk-subject-model.js'
      - 'js/fagverk.js'
      - 'js/fagverk-sted.js'
      - 'js/fagverk-place-theme.js'
      - 'js/merke-fallback.js'
      - 'js/fagverk-canonical-integration.js'
      - 'js/fagverk-place-canonical-integration.js'
      - 'js/politikk-fag-model.js'
      - 'js/emnerLoader.ts'
      - 'dist/web/emnerLoader.js'
      - 'js/ui/header-menu.js'
      - 'js/ui/place-learning-surface.js'
      - 'js/ui/place-learning-canonical.js'
      - 'js/ui/place-card-status-surface.js'
      - 'css/fagverk-forside.css'
      - 'css/fagverk.css'
      - 'css/fagverk-learning-v2.css'
      - 'css/fagverk-sted.css'
      - 'css/fagverk-canonical.css'
      - 'css/fagverk-premium.css'
      - 'css/fagverk-general.css'
      - 'css/fagverk-place-category-themes.css'
      - 'css/merke-fallback.css'
      - 'css/header-learning-menu.css'
      - 'css/place-learning-surface.css'
      - 'DOCS.md'
      - 'README/README.pensum.md'
      - 'README/fagstrukturREADME.md'
      - 'docs/README.md'
      - 'docs/documentation_registry.json'
      - 'docs/FACTUALITY_CONTRACT.md'
      - 'docs/DATA_PRODUCTION_CONTRACT.md'
      - 'docs/SUBJECT_FILE_CONTRACT.md'
      - 'docs/PROGRESSION_MODEL.md'
      - 'docs/PLACE_PRODUCTION_CHECKLIST.md'
      - 'docs/PLACE_STANDARD.md'
      - 'docs/COMPLETION_DEFINITIONS.md'
      - 'docs/HISTORY_GO_PRODUCT_MAP.md'
      - 'docs/TYPESCRIPT_FIRST_POLICY.md'
      - 'docs/FAGVERK.md'
      - 'docs/FAGVERK_NAVIGATION.md'
      - 'docs/FAGVERK_PLACE_DESIGN.md'
      - 'docs/FAGVERK_PLACE_V2_WORKCARD.md'
      - 'scripts/audit-place-images.mjs'
      - 'scripts/audit-fagverk-place-pages.mjs'
      - 'scripts/audit-fagverk-politikk-runtime-equivalence.mjs'
      - 'scripts/lib/place-image-change-classifier.mjs'
      - 'tests/fagverk-documentation-contract.test.mjs'
      - 'tests/fagverk-content.test.mjs'
      - 'tests/fagverk-portal.test.mjs'
      - 'tests/fagverk-place-pages.test.mjs'
      - 'tests/fagverk-place-rendering.test.mjs'
      - 'tests/fagverk-place-substance-audit.test.mjs'
      - 'tests/fagverk-place-category-design.test.mjs'
      - 'tests/fagverk-link-audit.test.mjs'
      - 'tests/place-learning-surface.test.js'
      - 'tests/place-image-audit-changed.test.mjs'
      - 'tests/politikk-fag-integration.test.mjs'
      - 'tests/fagverk-politikk-runtime-equivalence.test.mjs'
      - 'tests/header-search-menu.test.js'
      - '.github/workflows/fagverk.yml'
      - '.github/workflows/fagverk-general-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation-contract:
    name: Validate canonical fagverk documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            DOCS.md
            docs/README.md
            docs/documentation_registry.json
            docs/FAGVERK.md
            docs/FAGVERK_NAVIGATION.md
            docs/SUBJECT_FILE_CONTRACT.md
            docs/FACTUALITY_CONTRACT.md
            docs/DOMAIN_CONTRACT.md
            docs/DATA_PRODUCTION_CONTRACT.md
            docs/KNOWLEDGE_ARCHITECTURE.md
            docs/PROGRESSION_MODEL.md
            docs/FAGVERK_PLACE_DESIGN.md
            docs/FAGVERK_PLACE_V2_WORKCARD.md
            docs/PLACE_PRODUCTION_CHECKLIST.md
            docs/PLACE_STANDARD.md
            docs/COMPLETION_DEFINITIONS.md
            docs/HISTORY_GO_PRODUCT_MAP.md
            docs/TYPESCRIPT_FIRST_POLICY.md
            docs/HISTORY_GO_TECHNICAL_ARCHITECTURE.md
            README/README.pensum.md
            README/fagstrukturREADME.md
            README/README_DEV.md
            README/TEAM_WORKFLOW.md
            data/categories/category_contract.json
            data/fag/fag_manifest.json
            data/fag/fagverk_theory_quality_contract_v1.json
            data/fagverk/fagverk_portal.json
            data/fagverk/fagverk_registry.json
            data/knowledge/knowledge_system_policy_v1.json
            data/knowledge/knowledge_unit_schema_v1.json
            data/quiz/quiz_knowledge_delivery_contract_v1.json
            data/quiz/regler/QUIZ_PRODUCTION_CANONICAL.md
            data/quiz/regler/QUIZ_TEMPLATE_REGISTRY_V2.json
            tests/fagverk-documentation-contract.test.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check documentation contract test
        run: node --check tests/fagverk-documentation-contract.test.mjs
      - name: Validate master contract identity
        run: node --test --test-name-pattern="explicit canonical all-subject" tests/fagverk-documentation-contract.test.mjs
      - name: Validate referenced owners and sources
        run: node --test --test-name-pattern="points to every relevant" tests/fagverk-documentation-contract.test.mjs
      - name: Validate canonical subject baseline
        run: node --test --test-name-pattern="baseline matches" tests/fagverk-documentation-contract.test.mjs
      - name: Validate documentation registry ownership
        run: node --test --test-name-pattern="documentation registry gives" tests/fagverk-documentation-contract.test.mjs
      - name: Validate narrow navigation ownership
        run: node --test --test-name-pattern="navigation remains narrow" tests/fagverk-documentation-contract.test.mjs
      - name: Validate integrated Place Fagverk production
        run: node --test --test-name-pattern="place checklist makes" tests/fagverk-documentation-contract.test.mjs
      - name: Validate documentation entry pointers
        run: node --test --test-name-pattern="repository and subject documentation" tests/fagverk-documentation-contract.test.mjs
      - name: Validate honest portal status
        run: node --test --test-name-pattern="portal status remains honest" tests/fagverk-documentation-contract.test.mjs

  validate:
    name: Validate canonical subjects, textbook, category design, images and links
    needs: documentation-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Syntax check runtimes
        run: |
          node --check js/fagverk-subject-core.js
          node --check js/fagverk-subject-model.js
          node --check js/politikk-fag-model.js
          node --check js/fagverk-forside.js
          node --check js/fagverk.js
          node --check js/fagverk-sted.js
          node --check js/fagverk-place-theme.js
          node --check js/merke-fallback.js
          node --check js/fagverk-canonical-integration.js
          node --check js/fagverk-place-canonical-integration.js
          node --check js/ui/header-menu.js
          node --check js/ui/place-learning-surface.js
          node --check js/ui/place-learning-canonical.js
          node --check js/ui/place-card-status-surface.js
          node --check scripts/audit-place-images.mjs
          node --check scripts/audit-fagverk-place-pages.mjs
          node --check scripts/lib/place-image-change-classifier.mjs
          node --check tests/place-image-audit-changed.test.mjs
          node --check scripts/audit-fagverk-subject-inventory.mjs
          node --check scripts/audit-fagverk-general-engine.mjs
          node --check scripts/audit-fagverk-politikk-runtime-equivalence.mjs
      - name: Validate canonical subjects, textbook data, category design, links and place integration
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-politikk-runtime-equivalence.mjs
          node scripts/audit-fagverk-place-pages.mjs
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/politikk-fag-integration.test.mjs
          node --test tests/fagverk-politikk-runtime-equivalence.test.mjs
          node --test tests/fagverk-content.test.mjs
          node --test tests/fagverk-portal.test.mjs
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/fagverk-place-rendering.test.mjs
          node --test tests/fagverk-place-substance-audit.test.mjs
          node --test tests/fagverk-place-category-design.test.mjs
          node --test tests/fagverk-link-audit.test.mjs
          node --test tests/place-learning-surface.test.js
          node tests/header-search-menu.test.js
          node --test tests/place-image-audit-changed.test.mjs
      - name: Require valid images on new and changed places
        run: node scripts/audit-place-images.mjs --mode=changed
      - name: Build and verify full place image backlog
        run: node scripts/audit-place-images.mjs --mode=all --report=reports/place-image-audit.json --verify-summary=data/places/place_image_backlog_summary.json
      - name: Upload place image backlog
        uses: actions/upload-artifact@v4
        with:
          name: place-image-audit
          path: reports/place-image-audit.json
          if-no-files-found: error
