name: Fagverk and place learning

on:
  pull_request:
    paths:
      - 'fagverk.html'
      - 'fagverk-sted.html'
      - 'data/fagverk/**'
      - 'js/fagverk.js'
      - 'js/fagverk-sted.js'
      - 'js/ui/place-learning-surface.js'
      - 'js/ui/place-card-status-surface.js'
      - 'css/fagverk.css'
      - 'css/fagverk-learning-v2.css'
      - 'css/fagverk-sted.css'
      - 'css/place-learning-surface.css'
      - 'tests/fagverk-content.test.mjs'
      - 'tests/fagverk-place-pages.test.mjs'
      - 'tests/place-learning-surface.test.js'
      - 'tmp/fagverk-upgrade/**'
      - '.github/workflows/fagverk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Materialize and validate learning content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fagverk-place-pages-and-content-20260728
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct package
        run: |
          cat tmp/fagverk-upgrade/chunk-*.b64 | tr -d '\n\r' | base64 --decode > /tmp/fagverk-upgrade.tar.gz
          tar -tzf /tmp/fagverk-upgrade.tar.gz
          tar -xzf /tmp/fagverk-upgrade.tar.gz -C .
      - name: Validate materialized fagverk
        run: |
          node --check js/fagverk.js
          node --check js/fagverk-sted.js
          node --check js/ui/place-learning-surface.js
          node --check js/ui/place-card-status-surface.js
          node --test tests/fagverk-content.test.mjs
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/place-learning-surface.test.js
      - name: Remove all temporary materialization files
        run: |
          rm -rf tmp/fagverk-upgrade tmp/ignore tmp/ignore2 tmp/ignore3
          rm -f .github/workflows/tmp-materialize-fagverk-upgrade.yml
          git checkout origin/main -- .github/workflows/fagverk.yml
      - name: Commit tested non-workflow files
        run: |
          git config user.name "history-go-fagverk-bot"
          git config user.email "history-go-fagverk-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Skill fagkapitler fra egne stedssider"
          git push origin HEAD:agent/fagverk-place-pages-and-content-20260728
