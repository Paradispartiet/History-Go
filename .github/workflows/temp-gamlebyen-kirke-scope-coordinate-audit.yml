name: Temporary Gamlebyen kirke scope and coordinate audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'data/oslo-gamlebyen-kirke-scope-coordinate-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: data/oslo-gamlebyen-kirke-scope-coordinate-audit
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run and save Geonorge address lookup
        shell: bash
        run: |
          set -euo pipefail
          REPORTDIR="reports/visitoslo-oslo-east-audit-20260720/gamlebyen-kirke"
          mkdir -p "$REPORTDIR"
          npm run places:coords:find:address -- --address "Ekebergveien 1 Oslo" \
            2>&1 | tee "$REPORTDIR/geonorge-address-lookup.txt"

      - name: Resolve hospital scope and church duplicate gate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const reportDir = 'reports/visitoslo-oslo-east-audit-20260720/gamlebyen-kirke';
          const readJson = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const writeJson = (p, value) => fs.writeFileSync(p, JSON.stringify(value, null, 2) + '\n');

          const lookupText = fs.readFileSync(path.join(reportDir, 'geonorge-address-lookup.txt'), 'utf8');
          const jsonStart = lookupText.indexOf('{\n');
          if (jsonStart < 0) throw new Error('No JSON result found in Geonorge output');
          const lookup = JSON.parse(lookupText.slice(jsonStart));
          if (!lookup.ok || lookup.status !== 'verified_candidate') throw new Error(`Ekebergveien 1 did not resolve cleanly: ${JSON.stringify(lookup)}`);

          const manifest = readJson('data/places/manifest.json');
          let hospital = null;
          let hospitalFile = null;
          const identityMatches = [];
          const normalize = s => String(s || '').toLowerCase().normalize('NFD').replace(/[^a-z0-9æøå]+/g, ' ');

          for (const rel of manifest.files) {
            const full = path.join('data', rel);
            if (!fs.existsSync(full)) continue;
            let json;
            try { json = readJson(full); } catch { continue; }
            const rows = Array.isArray(json) ? json : [json];
            for (const row of rows) {
              if (!row || typeof row !== 'object') continue;
              if (row.id === 'oslo_hospital') {
                hospital = row;
                hospitalFile = `data/${rel}`;
              }
              const hay = normalize([row.id,row.name,row.desc,row.popupDesc].join(' '));
              if (hay.includes('gamlebyen kirke') || hay.includes('oslo hospitals kirke') || hay.includes('oslo hospital kirke')) {
                identityMatches.push({ id: row.id, name: row.name, category: row.category, file: `data/${rel}` });
              }
            }
          }
          if (!hospital) throw new Error('Could not resolve manifest-backed oslo_hospital record');

          const index = readJson('data/places/places_index.json');
          const lat = lookup.coordinate.lat;
          const lon = lookup.coordinate.lon;
          const haversine = (aLat,aLon,bLat,bLon) => {
            const R=6371000;
            const dLat=(bLat-aLat)*Math.PI/180;
            const dLon=(bLon-aLon)*Math.PI/180;
            const x=Math.sin(dLat/2)**2+Math.cos(aLat*Math.PI/180)*Math.cos(bLat*Math.PI/180)*Math.sin(dLon/2)**2;
            return 2*R*Math.asin(Math.sqrt(x));
          };
          const nearby=index
            .filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon))
            .map(p=>({id:p.id,name:p.name,category:p.category,distanceMeters:Math.round(haversine(lat,lon,p.lat,p.lon)*10)/10}))
            .filter(p=>p.distanceMeters<=350)
            .sort((a,b)=>a.distanceMeters-b.distanceMeters);

          const hospitalDistance = Number.isFinite(hospital.lat) && Number.isFinite(hospital.lon)
            ? Math.round(haversine(lat,lon,hospital.lat,hospital.lon)*10)/10
            : null;

          const decision = {
            version: '2026-07-20-scope-and-address-first',
            placeId: 'gamlebyen_kirke',
            candidateName: 'Gamlebyen kirke',
            status: 'verified_address_candidate',
            productionGate: 'ready_for_canonical_production',
            primaryCategory: 'religion',
            identity: {
              currentName: 'Gamlebyen kirke',
              alternateName: 'Oslo Hospitals kirke',
              currentAddress: 'Ekebergveien 1, Oslo',
              consecrated: 'May 1796',
              currentFunction: 'Active church used for worship and cultural events',
              physicalContext: 'Church building within the historic Oslo Hospital complex'
            },
            coordinate: lookup.coordinate,
            source: {
              sourceProvider: lookup.sourceProvider,
              sourceName: lookup.sourceName,
              sourceUrl: lookup.sourceUrl,
              sourceObjectId: lookup.sourceObjectId
            },
            existingHospitalScope: {
              file: hospitalFile,
              record: hospital,
              distanceFromChurchAddressPointMeters: hospitalDistance,
              conclusion: 'The existing oslo_hospital record represents the hospital/institutional complex. Gamlebyen kirke is a distinct active church building within that complex and should not be treated merely as an alias of the whole hospital place.'
            },
            duplicateGate: {
              canonicalIdentityMatches: identityMatches.filter(x => x.id !== 'oslo_hospital'),
              osloHospitalTextMatch: identityMatches.find(x => x.id === 'oslo_hospital') || null,
              nearbyWithin350m: nearby,
              conclusion: 'No dedicated Gamlebyen kirke canonical identity exists. Any text overlap in oslo_hospital reflects shared complex history, not same-place identity.'
            },
            sourceBasis: [
              'Current VisitOSLO listing identifies Gamlebyen kirke as a church at Ekebergveien 1 and dates the present church to its 1796 consecration.',
              'Church of Norway identifies Gamlebyen kirke also as Oslo Hospitals kirke and documents current worship/event use.',
              'The existing canonical oslo_hospital place is retained as the broader hospital/institutional complex.'
            ],
            guardrails: [
              'Do not replace or move oslo_hospital.',
              'Do not model the church as a mere alias of the hospital complex.',
              'Keep 1796 tied to the present church building/consecration, not to the much older Franciscan and hospital history of the site.',
              'Use religion as runtime primary category under the current primary-function rule.'
            ]
          };
          writeJson(path.join(reportDir,'decision.json'),decision);
          console.log(JSON.stringify(decision,null,2));
          NODE

      - name: Commit durable audit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-gamlebyen-kirke-scope-coordinate-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Audit Gamlebyen kirke against Oslo Hospital scope"
          git push origin HEAD:data/oslo-gamlebyen-kirke-scope-coordinate-audit
