name: Fagverk Film og TV screen places identity circulation fulltext

on:
  pull_request:
    paths:
      - "data/fag/TV_og_Film/film_tv_screen_places_identity_circulation_*.json"
      - "data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon.json"
      - "data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/**"
      - "scripts/brief-film-tv-screen-places-identity-circulation-sources-v1.mjs"
      - "scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs"
      - "scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs"
      - "scripts/brief-film-tv-reception-participation-audience-methods-sources-v1.mjs"
      - "scripts/materialize-film-tv-reception-participation-audience-methods-fulltext-v1.mjs"
      - "scripts/audit-film-tv-reception-participation-audience-methods-fulltext-v1.mjs"
      - "scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs"
      - "tests/film-tv-screen-places-identity-circulation-source-brief-v1.test.mjs"
      - "tests/film-tv-screen-places-identity-circulation-fulltext-v1.test.mjs"
      - "tests/film-tv-reception-participation-audience-methods-fulltext-v1.test.mjs"
      - "reports/fagverk/film-tv-screen-places-identity-circulation-source-brief-v1-audit.json"
      - "reports/fagverk/film-tv-screen-places-identity-circulation-fulltext-v1-audit.json"
      - "reports/fagverk/film-tv-industry-regulation-distribution-fulltext-v1-audit.json"
      - "reports/fagverk/film-tv-phase3-audit.json"
      - "reports/fagverk/general-engine-audit.json"
      - ".github/workflows/fagverk-film-tv-screen-places-identity-circulation-fulltext.yml"
      - ".github/workflows/fagverk-film-tv-screen-places-identity-circulation-source-brief.yml"
  push:
    branches: [main]
    paths:
      - "data/fag/TV_og_Film/film_tv_screen_places_identity_circulation_*.json"
      - "data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon.json"
      - "data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/**"
      - "scripts/brief-film-tv-screen-places-identity-circulation-sources-v1.mjs"
      - "scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs"
      - "scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs"
      - "scripts/brief-film-tv-reception-participation-audience-methods-sources-v1.mjs"
      - "scripts/materialize-film-tv-reception-participation-audience-methods-fulltext-v1.mjs"
      - "scripts/audit-film-tv-reception-participation-audience-methods-fulltext-v1.mjs"
      - "scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs"
      - "tests/film-tv-screen-places-identity-circulation-source-brief-v1.test.mjs"
      - "tests/film-tv-screen-places-identity-circulation-fulltext-v1.test.mjs"
      - "tests/film-tv-reception-participation-audience-methods-fulltext-v1.test.mjs"
      - "reports/fagverk/film-tv-screen-places-identity-circulation-source-brief-v1-audit.json"
      - "reports/fagverk/film-tv-screen-places-identity-circulation-fulltext-v1-audit.json"
      - "reports/fagverk/film-tv-industry-regulation-distribution-fulltext-v1-audit.json"
      - "reports/fagverk/film-tv-phase3-audit.json"
      - "reports/fagverk/general-engine-audit.json"
      - ".github/workflows/fagverk-film-tv-screen-places-identity-circulation-fulltext.yml"
      - ".github/workflows/fagverk-film-tv-screen-places-identity-circulation-source-brief.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fagverk-film-tv-unit12-fulltext-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate screen places identity circulation fulltext
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate syntax
        run: |
          node --check scripts/brief-film-tv-screen-places-identity-circulation-sources-v1.mjs
          node --check scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
          node --check scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
          node --check scripts/brief-film-tv-reception-participation-audience-methods-sources-v1.mjs
          node --check scripts/materialize-film-tv-reception-participation-audience-methods-fulltext-v1.mjs
          node --check scripts/audit-film-tv-reception-participation-audience-methods-fulltext-v1.mjs
          node --check scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs
          node --check tests/film-tv-screen-places-identity-circulation-source-brief-v1.test.mjs
          node --check tests/film-tv-screen-places-identity-circulation-fulltext-v1.test.mjs
          node --check tests/film-tv-reception-participation-audience-methods-fulltext-v1.test.mjs

      - name: Materialize unit 12 fulltext state
        run: node scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs --write

      - name: Refresh unit 12 source brief audit
        run: node scripts/brief-film-tv-screen-places-identity-circulation-sources-v1.mjs --write-report

      - name: Build deterministic release
        run: node scripts/build-fagverk-release-manifest.mjs

      - name: Refresh shared general engine audit
        run: node scripts/audit-fagverk-general-engine.mjs --write-report

      - name: Refresh shared Film and TV phase 3 audit
        run: node scripts/audit-fagverk-film-tv-phase3.mjs --write-report

      - name: Refresh unit 10 monotone audit
        run: node scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs --write-report

      - name: Refresh unit 12 fulltext audit
        run: node scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs --write-report

      - name: Verify committed deterministic outputs
        run: |
          git diff --exit-code -- \
            data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon.json \
            data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/brief.json \
            data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/claims.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_status.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/general-engine-audit.json \
            reports/fagverk/film-tv-phase3-audit.json \
            reports/fagverk/film-tv-industry-regulation-distribution-fulltext-v1-audit.json \
            reports/fagverk/film-tv-screen-places-identity-circulation-source-brief-v1-audit.json \
            reports/fagverk/film-tv-screen-places-identity-circulation-fulltext-v1-audit.json

      - name: Validate unit 12 source brief and fulltext
        run: |
          node scripts/brief-film-tv-screen-places-identity-circulation-sources-v1.mjs
          node scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
          node --test tests/film-tv-screen-places-identity-circulation-source-brief-v1.test.mjs
          node --test tests/film-tv-screen-places-identity-circulation-fulltext-v1.test.mjs

      - name: Validate completed unit 11 remains monotone
        run: |
          node scripts/brief-film-tv-reception-participation-audience-methods-sources-v1.mjs
          node scripts/audit-film-tv-reception-participation-audience-methods-fulltext-v1.mjs
          node --test tests/film-tv-reception-participation-audience-methods-source-brief-v1.test.mjs
          node --test tests/film-tv-reception-participation-audience-methods-fulltext-v1.test.mjs

      - name: Validate completed unit 10 remains monotone
        run: |
          node scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs
          node --test tests/film-tv-industry-regulation-distribution-fulltext-v1.test.mjs
          node --test tests/film-tv-industry-regulation-distribution-source-brief-v1.test.mjs

      - name: Validate completed unit 9 remains monotone
        run: |
          node scripts/audit-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs
          node --test tests/film-tv-creative-work-technology-responsibility-fulltext-v1.test.mjs

      - name: Validate shared Film and TV baseline
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-film-tv-phase3.test.mjs
          node --test tests/film-tv-learning-order-plan-v1.test.mjs
          node --test tests/film-tv-learning-order-monotone-regression-v1.test.mjs
          node --test tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
