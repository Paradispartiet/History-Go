name: Temporary Investor authoring and verification

on:
  push:
    branches:
      - civication/naeringsliv-investor-role-world
    paths:
      - .github/workflows/tmp-investor-author.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Materialize governed Investor files
        shell: bash
        env:
          AUTHOR_GZ64: ""
        run: |
          node - <<'NODE'
          const fs=require('fs'),z=require('zlib');
          const js=z.gunzipSync(Buffer.from(process.env.AUTHOR_GZ64,'base64')).toString('utf8');
          fs.writeFileSync('/tmp/author-investor.js',js);
          NODE
          node /tmp/author-investor.js
          node scripts/audit-civication-life-position-role-world-readiness.mjs --write
      - name: Verify Investor and full Civication suite
        run: |
          node tests/civication-naeringsliv-investor-authored-depth.test.js
          node scripts/build-civication-scene-registry.mjs --check
          npm run test:civication
      - name: Commit verified Investor Role World
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-investor-author.yml
          git add data/Civication reports/civication-life-position-role-world-readiness.md tests/civication-*.test.js
          git diff --cached --check
          git commit -m "Civication: author Næringsliv Investor Role World"
          git push origin HEAD:civication/naeringsliv-investor-role-world
