name: TEMP materialize Supporter Role World state

on:
  push:
    branches:
      - agent/civication-supporter-role-world-20260911
    paths:
      - scripts/audit-civication-life-position-role-world-readiness.mjs
      - data/Civication/roleWorlds/**
      - data/Civication/narratives/leisure/football_supporter.json
      - .github/workflows/temp-civication-supporter-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-supporter-role-world-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize life-position readiness
        run: node scripts/audit-civication-life-position-role-world-readiness.mjs --write
      - name: Refresh compiled scene registry if needed
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Commit generated outputs
        shell: bash
        run: |
          git add data/Civication/lifePositionRoleWorldReadiness.json reports/civication-life-position-role-world-readiness.md data/Civication/compiledSceneRegistryV1.json
          if git diff --cached --quiet; then
            echo "No generated drift."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[skip ci] Materialize Supporter Role World state"
          git push origin HEAD:agent/civication-supporter-role-world-20260911
