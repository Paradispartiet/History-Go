name: Fagverk domain registry gate

on:
  pull_request:
    paths:
      - 'data/fag/helse/**'
      - 'data/fag/utdanning/**'
      - 'data/fag/politikk/sosiologi_antropologi/**'
      - 'data/fag/natur/geografi/**'
      - 'data/fag/litteratur/sprak_lingvistikk/**'
      - 'data/fagverk/helse/**'
      - 'data/fagverk/utdanning/**'
      - 'data/fagverk/politikk/sosiologi_antropologi/**'
      - 'data/fagverk/natur/geografi/**'
      - 'data/fagverk/litteratur/sprak_lingvistikk/**'
      - 'data/fagverk/subject_inventory.json'
      - 'reports/fagverk/sosiologi-antropologi-*.json'
      - 'reports/fagverk/geografi-*.json'
      - 'reports/fagverk/sprak-lingvistikk-*.json'
      - 'scripts/*helse*'
      - 'scripts/*utdanning*'
      - 'scripts/*sosiologi-antropologi*'
      - 'scripts/*geografi*'
      - 'scripts/*sprak-lingvistikk*'
      - 'scripts/audit-fagverk-theory-quality.mjs'
      - 'scripts/audit-fagverk-theory-integrity.mjs'
      - 'scripts/run-fagverk-domain-ci-v1.mjs'
      - 'tests/helse-*.test.mjs'
      - 'tests/utdanning-*.test.mjs'
      - 'tests/sosiologi-antropologi-*.test.mjs'
      - 'tests/geografi-*.test.mjs'
      - 'tests/sprak-lingvistikk-*.test.mjs'
      - 'tests/fagverk-release-manifest.test.mjs'
      - 'tests/fagverk-domain-ci-registry.test.mjs'
      - '.github/ci/fagverk-helse-domain-registry-v1.json'
      - '.github/ci/fagverk-utdanning-domain-registry-v1.json'
      - '.github/ci/fagverk-sosiologi-antropologi-domain-registry-v1.json'
      - '.github/ci/fagverk-geografi-domain-registry-v1.json'
      - '.github/ci/fagverk-sprak-lingvistikk-domain-registry-v1.json'
      - '.github/workflows/fagverk-domain-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fagverk-domain-registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate affected registry-driven domains
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run affected domain gates and shared Fagverk gates once
        env:
          FAGVERK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FAGVERK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/run-fagverk-domain-ci-v1.mjs
