name: Place description governance

on:
  pull_request:
    paths:
      - 'data/places/**'
      - 'scripts/tmp-rewrite-regjeringskvartalet-desc.mjs'
      - '.github/workflows/place-description-governance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonical-v4-2:
    name: Materialize Regjeringskvartalet ingress
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: agent/regjeringskvartalet-desc-ingress-20260728
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rewrite desc and update production packet
        run: node scripts/tmp-rewrite-regjeringskvartalet-desc.mjs

      - name: Validate complete 4.2 repository state
        run: |
          node --check scripts/validate-place-description-production-v4_2.mjs
          node --check scripts/validate-place-description-production-v4_2_policy.mjs
          node --test tests/place-description-production-v4_2.test.mjs
          node --test tests/place-description-length-policy.test.mjs
          node --test tests/place-description-ingress-policy.test.mjs
          node scripts/validate-place-description-production-v4_2_policy.mjs --all --report reports/place-description-validation-v4_2.json

      - name: Remove temporary production machinery
        run: |
          rm scripts/tmp-rewrite-regjeringskvartalet-desc.mjs
          git checkout origin/main -- .github/workflows/place-description-governance.yml

      - name: Commit only canonical place and production packet
        run: |
          git config user.name "history-go-description-bot"
          git config user.email "history-go-description-bot@users.noreply.github.com"
          git add data/places/politikk/oslo/places_politikk/regjeringskvartalet.json \
                  data/places/production/regjeringskvartalet.json \
                  scripts/tmp-rewrite-regjeringskvartalet-desc.mjs \
                  .github/workflows/place-description-governance.yml
          git diff --cached --quiet && exit 0
          git commit -m "Skriv Regjeringskvartalets desc som en samlet ingress"
          git push origin HEAD:agent/regjeringskvartalet-desc-ingress-20260728
