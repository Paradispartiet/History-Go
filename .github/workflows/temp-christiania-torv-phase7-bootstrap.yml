name: TEMP Christiania Torv phase 7 bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  bootstrap:
    if: github.head_ref == 'agent/christiania-torv-phase7-quiz-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/christiania-torv-phase7-quiz-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - name: Materialize canonical source brief, quiz and registrations
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/temp-christiania-torv-quiz-writeback-v2.yml').read_text().splitlines()
          blocks = []
          i = 0
          while i < len(source):
              line = source[i]
              if line.strip() == 'run: |':
                  indent = len(line) - len(line.lstrip())
                  i += 1
                  block = []
                  while i < len(source):
                      current = source[i]
                      if current.strip() and len(current) - len(current.lstrip()) <= indent:
                          break
                      block.append(current[indent + 2:] if len(current) >= indent + 2 else '')
                      i += 1
                  blocks.append('\n'.join(block).rstrip() + '\n')
                  continue
              i += 1

          if len(blocks) < 1:
              raise SystemExit('No materializer block found')
          subprocess.run(['bash', '-euo', 'pipefail', '-c', blocks[0]], check=True)
          PY
          node <<'NODE'
          const fs = require('fs');
          const p = 'data/quiz/production_briefs/by/christiania_torv.json';
          const brief = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (!Array.isArray(brief.claims) || brief.claims.length !== 35) {
            throw new Error(`Expected 35 source-brief claims, got ${Array.isArray(brief.claims) ? brief.claims.length : typeof brief.claims}`);
          }
          const quiz = JSON.parse(fs.readFileSync('data/quiz/by/christiania_torv_sets.json', 'utf8'));
          const questions = quiz.sets.flatMap(set => set.questions || []);
          if (quiz.sets.length !== 5 || questions.length !== 35) {
            throw new Error(`Expected 5x7 quiz, got ${quiz.sets.length} sets / ${questions.length} questions`);
          }
          console.log(`Source brief ${brief.claims.length}/35 and quiz ${questions.length}/35 materialized.`);
          NODE
      - name: Build deterministic context, Knowledge and Fagverk release
        run: |
          npm run quiz:context -- --category by --target christiania_torv --output data/quiz/production_context/by/christiania_torv.json
          npm run knowledge:canonical:write
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate phase 7 before writeback
        run: |
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run audit:quiz-content
          npm run knowledge:canonical:check
          npm run test:quiz-production
      - name: Commit canonical phase-7 writeback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fag/fag_manifest.json data/fagverk/fagverk_release.json data/quiz/manifest.json data/quiz/production_briefs/by/christiania_torv.json data/quiz/production_context/by/christiania_torv.json data/quiz/by/christiania_torv_sets.json data/knowledge reports/knowledge-contract-audit.json reports/knowledge-id-backfill.json reports/quiz_manifest_v2_audit_report.json
          if git diff --cached --quiet; then
            echo "No phase-7 writeback needed."
            exit 0
          fi
          git commit -m "Materialize Christiania Torv Quiz and Knowledge"
          git push origin HEAD:agent/christiania-torv-phase7-quiz-v1
