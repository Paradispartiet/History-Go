name: Religion legacy sewn patches render
on:
  push:
    branches: [design/religion-heritage-sewn-border-v2-20261030]
    paths:
      - bilder/merker/religion.svg
      - 'bilder/merker/religion/familie/*.svg'
      - .github/workflows/qa-religion-legacy-border.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and rasterize nine embroidered SVGs
        run: |
          python -m pip install --quiet pillow cairosvg
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          import io,json,xml.etree.ElementTree as ET
          import cairosvg
          root=Path('.')
          badge=json.loads((root/'data/badges/religion.json').read_text())
          imgs=[('Religion',badge['image'])]+[(k,v) for k,v in badge['subBadgeImages'].items()]
          assert len(imgs)==9
          sheet=Image.new('RGB',(1020,1100),'#17202a')
          draw=ImageDraw.Draw(sheet)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',18)
          for i,(name,path) in enumerate(imgs):
              src=Path(path)
              svg=src.read_text()
              ET.fromstring(svg)
              assert svg.count('M')>250 and 'hg-embroidery-yarn' in svg,src
              data=cairosvg.svg2png(bytestring=svg.encode(),output_width=780,output_height=780)
              image=Image.open(io.BytesIO(data)).convert('RGBA')
              assert image.getpixel((0,0))[3]==0
              dest=src.with_suffix('.webp')
              image.save(dest,format='WEBP',quality=91,method=6)
              x=10+(i%3)*340
              y=12+(i//3)*365
              view=image.resize((310,310),Image.Resampling.LANCZOS)
              sheet.paste(view,(x+10,y+10),view)
              draw.text((x+14,y+323),name.replace('_',' '),font=font,fill='#f4e6c3')
              print(src,dest.stat().st_size)
          Path('out').mkdir(exist_ok=True)
          sheet.save('out/religion-heritage-sewn-qa.png')
          PY
      - name: Check existing category badge contracts
        run: node --test tests/badge-artwork-coverage.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: religion-heritage-sewn-preview
          path: out/religion-heritage-sewn-qa.png
          retention-days: 3
      - name: Commit validated WebP exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/merker/religion.webp bilder/merker/religion/familie/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Refresh nine Religion WebP patch images with stitched gold hems"
            git push
          fi
