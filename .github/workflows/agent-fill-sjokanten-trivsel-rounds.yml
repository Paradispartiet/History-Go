name: Fill Sjøkanten Trivsel rounds
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Sjøkanten content
        env:
          GENERATOR_GZ_B64: ""
        run: |
          printf '%s' "$GENERATOR_GZ_B64" | base64 -d | gzip -d > /tmp/g.js
          node /tmp/g.js
      - name: Dedicated and inherited tests
        run: |
          node tests/sjokanten-trivsel-batch1-round-content.test.js
          node tests/skanevik-idrettsanlegg-batch1-round-content.test.js
          node tests/skanevik-discgolf-batch1-round-content.test.js
          node tests/osnes-discgolf-batch1-round-content.test.js
          node tests/skakkeringen-batch1-round-content.test.js
          node tests/engebanen-batch1-round-content.test.js
          node tests/steinsvollen-batch1-round-content.test.js
          node tests/etne-pumptrack-batch1-round-content.test.js
      - run: npm run leksikon:ids:check
      - name: People audit
        run: |
          npm run audit:people-of-places
          git checkout -- reports/people-of-places-status.json reports/people-of-places-status.md
      - run: npm run typecheck:tools
      - run: npm run typecheck:web
      - name: Story integrity without new Sjøkanten errors
        run: |
          set +e; npm run check:stories > /tmp/story.log 2>&1; set -e; cat /tmp/story.log
          if grep -Ei 'story=.*sjokanten_fra_tv_ide_til_dugnadsbasseng|place_id=sjokanten_trivsel_skanevik|person_id=(heidi_wannberg|arne_tveit|jarle_vik)' /tmp/story.log; then exit 1; fi
      - run: git diff --check
      - run: rm .github/workflows/agent-fill-sjokanten-trivsel-rounds.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports tests .github/workflows
          git commit -m "Fill Sjøkanten Trivsel sport rounds batch 1"
          git push
