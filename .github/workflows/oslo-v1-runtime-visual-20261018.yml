name: Oslo v1 actual PlaceCard visual acceptance
on:
  push:
    branches:
      - audit/oslo-v1-runtime-visual-20261018
    paths:
      - 'tests/oslo-v1-actual-runtime-visual-browser-audit.mjs'
      - '.github/workflows/oslo-v1-runtime-visual-20261018.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser and contact-sheet tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m pip install --disable-pip-version-check pillow
      - name: Audit real app PlaceCards, quiz flip and image cropping for 16 places
        run: node tests/oslo-v1-actual-runtime-visual-browser-audit.mjs
      - name: Create editorial preview contact sheets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageOps
          out=Path("reports/oslo-v1-runtime-visual-20261018")
          data=json.loads((out/"report.json").read_text())
          paths=Path(".tmp/oslo-v1-runtime-captures")
          places=list(dict.fromkeys(x["id"] for x in data["places"]))
          for width in (390,768):
              bg=Image.new("RGB",(520*4,485*4),"#11151d")
              draw=ImageDraw.Draw(bg)
              for i,pid in enumerate(places):
                  x=(i%4)*520
                  y=(i//4)*485
                  row=next(r for r in data["places"] if r["id"]==pid and r["width"]==width)
                  draw.text((x+12,y+12),pid,fill="#ffdd55")
                  status="PASS" if not row["problems"] else "BLOCKED: "+", ".join(row["problems"])[:65]
                  draw.text((x+12,y+31),status,fill="#dddddd")
                  for kind,px,py,size in (("hero",10,54,(500,138)),("front",10,204,(244,264)),("reverse",263,204,(244,264))):
                      img=paths/(pid+"-"+str(width)+"-"+kind+".png")
                      if img.is_file():
                          with Image.open(img) as original:
                              content=ImageOps.contain(original.convert("RGB"),size)
                              bg.paste(content,(x+px+(size[0]-content.width)//2,y+py+(size[1]-content.height)//2))
                      else:
                          draw.text((x+px+12,y+py+30),kind+" not captured",fill="#999999")
              dest=out/("actual-placecard-"+str(width)+".jpg")
              bg.save(dest,"JPEG",quality=88,optimize=True)
              print(dest)
          PY
      - name: Commit visible evidence and actual results (not v1 approval)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/oslo-v1-runtime-visual-20261018/
          git diff --cached --quiet && exit 1
          git commit -m "report(oslo): capture actual app runtime PlaceCards at 390 and 768 pixels"
          git push origin HEAD:audit/oslo-v1-runtime-visual-20261018
