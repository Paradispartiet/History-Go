name: House of Nerds integrated generated-data sync
on:
  push:
    branches: [place/house-of-nerds-integration-20261102]
    paths: [.github/workflows/hon-integrated-regeneration-20261102.yml]
permissions:
  contents: write
concurrency:
  group: hon-integrated-regeneration-20261102
  cancel-in-progress: true
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build all canonical integrated generated files
        run: |
          npm run knowledge:canonical:write
          node tools/materialize-subkultur-runtime-v1.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
          npm run civication:history-people:build
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
          npm run epoker:places:build
          npm run place-open:build
      - name: Check all generated files
        run: |
          npm run knowledge:canonical:check
          node tools/materialize-subkultur-runtime-v1.mjs --check
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run civication:history-people:check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          npm run epoker:places:check
          npm run place-open:check
      - name: Commit bounded generated changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --stat
          git diff --name-only > /tmp/hon-changed.txt
          changed=$(wc -l < /tmp/hon-changed.txt)
          echo "Generated changes: $changed"
          test "$changed" -le 45
          unexpected=$(grep -Ev '^(data/fag/subkultur/subkultur_runtime_manifest.json|data/fag/fag_manifest.json|data/fagverk/|data/knowledge/|data/Civication/historyPeople_index.json|data/Civication/scenarioPeople/|data/Civication/scenarioPeople_index.json|data/epoker/epoke-place-index.json|data/runtime/|reports/knowledge-)' /tmp/hon-changed.txt || true)
          if [[ -n "$unexpected" ]]; then echo "Unexpected changes: $unexpected"; exit 1; fi
          git add -A -- data/fag/subkultur/subkultur_runtime_manifest.json data/fag/fag_manifest.json data/fagverk/ data/knowledge/ data/Civication/historyPeople_index.json data/Civication/scenarioPeople/ data/Civication/scenarioPeople_index.json data/epoker/epoke-place-index.json data/runtime/ reports/knowledge-*.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate merged House of Nerds and main runtime projections"
            git fetch origin place/house-of-nerds-integration-20261102
            git rebase origin/place/house-of-nerds-integration-20261102
            git push origin HEAD:place/house-of-nerds-integration-20261102
          fi
