name: Politikk Wave4 Regenerate Temporary
on:
  push:
    branches:
      - fagverk/political-science-canonical-enrichment-wave4-20261021
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fagverk/political-science-canonical-enrichment-wave4-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize Politikk curriculum
        run: npm run materialize:politikk-curriculum
      - name: Build release manifest
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Commit generated outputs to wave4 branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fag/politikk/curriculum_architecture_politikk_v1.json data/fagverk/fagverk_release.json
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize Politikk and Fagverk release for wave4"
            git push origin HEAD:fagverk/political-science-canonical-enrichment-wave4-20261021
          fi
