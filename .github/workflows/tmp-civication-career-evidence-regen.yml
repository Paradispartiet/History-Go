name: Temporary Civication career evidence audit and regeneration

on:
  push:
    branches:
      - codex/civication-career-test-evidence-boundary-20261009
    paths:
      - .github/workflows/tmp-civication-career-evidence-regen.yml

permissions:
  contents: write

jobs:
  verify-and-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify deterministic career evidence and regenerate only if needed
        run: |
          set -euo pipefail
          if node scripts/audit-civication-career-gameplay.mjs --check; then
            echo "Canonical career matrix remains unchanged by the boundary fix"
          else
            node scripts/audit-civication-career-gameplay.mjs --write
          fi
          node scripts/audit-civication-career-gameplay.mjs --check
          node tests/civication-career-gameplay-matrix.test.js
          git diff --stat
          git diff --name-only | sort > /tmp/derived-files.txt
          cat /tmp/derived-files.txt
          if grep -Ev '^(data/Civication/careerGameplayMatrix.json|reports/civication-career-gameplay-matrix.md)$' /tmp/derived-files.txt; then
            echo "Unexpected changed files" >&2
            exit 1
          fi
      - name: Remove temporary workflow and commit derived results only
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-civication-career-evidence-regen.yml
          git add -- .github/workflows/tmp-civication-career-evidence-regen.yml data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(civication): verify matrix after excluding noncareer psychology tests"
          git push origin HEAD:codex/civication-career-test-evidence-boundary-20261009
