name: Agent Språkatlas interaksjon v1

on:
  push:
    branches:
      - agent/sprakatlas-interaction-v1
    paths:
      - .github/workflows/agent-sprakatlas-interaction-v1.yml
      - scripts/agent_sprakatlas_interaction_v1.py

permissions:
  contents: write

jobs:
  build-interaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sprakatlas-interaction-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize interactive atlas navigation
        run: |
          python -m py_compile scripts/agent_sprakatlas_interaction_v1.py
          python scripts/agent_sprakatlas_interaction_v1.py
      - name: Check runtime syntax
        run: node --check js/ui/place-language-layer.js
      - name: Run language regressions
        run: |
          node --test tests/place-language-dialect-scope.test.mjs tests/place-language-layer.test.mjs
          git diff --check
      - name: Commit permanent product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ui/place-language-layer.js \
                  css/place-language-layer.css \
                  docs/SPRAKLEKSIKON.md \
                  tests/place-language-dialect-scope.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Gjør Språkatlas Norge interaktivt"
          git push origin HEAD:agent/sprakatlas-interaction-v1
