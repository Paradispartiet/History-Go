name: Oslo coordinate batch 26 integration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-coordinate-batch-26-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'agent/oslo-coordinate-control-batch-26'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect persistent coordinate evidence
        shell: bash
        run: |
          set -u
          OUT='reports/oslo-coordinate-control-batch-26'
          mkdir -p "$OUT/lookups" "$OUT/sources"

          run_finder() {
            local address="$1"
            local file="$2"
            set +e
            set -o pipefail
            npm run places:coords:find:address -- --address "$address" | tee "$OUT/lookups/$file"
            local code=${PIPESTATUS[0]}
            set +o pipefail
            set -e
            printf '%s\n' "$code" > "$OUT/lookups/$file.exit-status.txt"
            return 0
          }

          run_curl() {
            local url="$1"
            local file="$2"
            set +e
            curl --retry 3 --retry-delay 2 -fsSL -A 'History-Go-coordinate-audit/1.0' "$url" \
              | tee "$OUT/sources/$file" >/dev/null
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$code" > "$OUT/sources/$file.exit-status.txt"
            return 0
          }

          set -e
          run_finder 'Sandakerveien 24C Oslo' 'myrens_verksted-sandakerveien-24c-geonorge.json'
          run_finder 'Fossveien 24 Oslo' 'christiania_seildugsfabrik-fossveien-24-geonorge.json'
          run_finder 'Sandakerveien 54 Oslo' 'lilleborg_fabrikker-sandakerveien-54-geonorge.json'
          run_finder 'Sandakerveien 56 Oslo' 'lilleborg_fabrikker-sandakerveien-56-geonorge.json'

          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Myrens%20Verksted%20Oslo' \
            'myrens_verksted-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Gr%C3%B8nlikaia%20Oslo' \
            'gronlikaia-nominatim.json'

          cat > "$OUT/source-notes.md" <<'EOF'
          # Batch 26 – kilde- og identitetsnotater

          - Myrens Verksted: Geonorge finner ikke legacy-adressen Sandakerveien 24C. Oslo byleksikon dokumenterer likevel det konkrete fabrikkomplekset, og OSM way 99757039 er eksplisitt navngitt Myrens Verksted. Det navngitte områdeobjektets senter brukes som site-center.
          - Christiania Seildugsfabrik: Fossveien 24 gir ett entydig Geonorge-treff og adressen er dokumentert av Oslo byleksikon.
          - Lilleborg Fabrikker: Sandakerveien 54 gir ett entydig treff for fabrikkporten, mens 56 er tvetydig. Aktiv record blander 1833-oljemøllen, 1842-såpeproduksjonen og A/S Lilleborg Fabriker fra 1897, så ingen adresse anvendes.
          - Grønlikaia: OSM-søket returnerer serviceveier med navnet Grønlikaia, ikke et områdeobjekt for hele tidligere havne-/containerområdet.
          - Akerselva industriområde: kildene dokumenterer en lang industrihistorisk korridor med mange separate anlegg. Ett punkt kan ikke representere hele korridoren.
          EOF

      - name: Apply batch 26
        run: node scripts/tmp-complete-oslo-coordinate-batch26.mjs

      - name: Build global place index
        run: |
          set -o pipefail
          npm run places:index:build | tee reports/oslo-coordinate-control-batch-26/places-index-build.txt

      - name: Validate split manifest sync
        run: |
          set -o pipefail
          npm run audit:places-split-manifest-sync | tee reports/oslo-coordinate-control-batch-26/split-manifest-audit.txt

      - name: Validate source and runtime parity
        run: |
          set -o pipefail
          npm run places:index:check | tee reports/oslo-coordinate-control-batch-26/places-index-check.txt

      - name: Validate coordinate quality
        run: |
          set -o pipefail
          npm run places:coords:quality | tee reports/oslo-coordinate-control-batch-26/coordinate-quality.txt

      - name: Validate strict coordinate intake against merge-base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE="$(git merge-base HEAD origin/main)"
          echo "COORD_INTAKE_BASE=$BASE" | tee reports/oslo-coordinate-control-batch-26/strict-intake-base.txt
          COORD_INTAKE_BASE="$BASE" npm run places:coords:intake \
            | tee reports/oslo-coordinate-control-batch-26/strict-intake.txt

      - name: Validate coordinate evidence
        id: evidence
        continue-on-error: true
        run: |
          set -o pipefail
          npm run places:coords:evidence:audit | tee reports/oslo-coordinate-control-batch-26/evidence-audit.txt

      - name: Upload evidence audit failure report
        if: steps.evidence.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch-26-evidence-audit-failure
          path: |
            reports/coordinate-evidence-audit.md
            reports/oslo-coordinate-control-batch-26/evidence-audit.txt
          if-no-files-found: error

      - name: Stop on evidence audit failure
        if: steps.evidence.outcome == 'failure'
        run: exit 1

      - name: Validate diff whitespace
        run: git diff --check

      - name: Remove temporary integration files and commit result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/oslo-coordinate-batch-26-evidence.yml
          rm -f .github/workflows/oslo-coordinate-batch-26-integrate.yml
          rm -f scripts/tmp-complete-oslo-coordinate-batch26.mjs
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete Oslo coordinate control batch 26'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
