name: Civication Scene Interaction 4D temp
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-scene-interaction-4d
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove synthetic choices and add regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = [Path('js/Civication/systems/civicationDailyMailBuilder.js'), Path('js/Civication/systems/civicationWorkdayMailBuilder.js')]
          pattern = re.compile(r'(?ms)^(?P<i>\s*)if \(normalized\.length >= 2\) return normalized;\n(?P=i)\n(?P=i)return \[\n.*?label: "Gjør dette ryddig og dokumenter det".*?label: "Løs det raskt og gå videre".*?^(?P=i)\];')
          for path in files:
              text = path.read_text(encoding='utf-8')
              new, count = pattern.subn(lambda m: f"{m.group('i')}return normalized;", text, count=1)
              if count != 1: raise SystemExit(f'Expected one synthetic-choice block in {path}, got {count}')
              if '__civi_fallback_choice' in new: raise SystemExit(f'Fallback marker remains in {path}')
              path.write_text(new, encoding='utf-8')
          doc = Path('data/Civication/SCENE_PIPELINE_V1.md')
          text = doc.read_text(encoding='utf-8')
          old = 'Den globale auditten står fortsatt i `observe`. Generiske standardvalg, svarwrappere, gammel dagskvote og manglende compiled registry er separate, synlige porter som ennå ikke er lukket.'
          new = 'Den globale auditten står fortsatt i `observe`. Generiske standardvalg er nå fjernet fra både legacy-Daily og `CivicationSceneCatalog`; svarwrappere, gammel dagskvote og manglende compiled registry er separate, synlige porter som ennå ikke er lukket.'
          if old not in text: raise SystemExit('Expected 4C debt sentence not found')
          doc.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('tests/civication-scene-interaction-no-fallback.test.js').write_text('''const assert = require("node:assert/strict");\nconst fs = require("node:fs");\nconst path = require("node:path");\nconst vm = require("node:vm");\nconst repoRoot = process.env.CIVICATION_TEST_REPO_ROOT || path.resolve(__dirname, "..");\nconst workdayPath = path.join(repoRoot, "js/Civication/systems/civicationWorkdayMailBuilder.js");\nconst dailyPath = path.join(repoRoot, "js/Civication/systems/civicationDailyMailBuilder.js");\nconst workdaySource = fs.readFileSync(workdayPath, "utf8");\nconst dailySource = fs.readFileSync(dailyPath, "utf8");\nfor (const source of [workdaySource, dailySource]) { assert(!source.includes("__civi_fallback_choice")); assert(!source.includes("Gjør dette ryddig og dokumenter det")); assert(!source.includes("Løs det raskt og gå videre")); }\nconst windowObject = { DEBUG:false, CivicationState:{getState:()=>({}),getActivePosition:()=>null}, CivicationMailRuntime:{makeCandidateMailsForActiveRole:async()=>[]} }; windowObject.window=windowObject;\nvm.runInContext(workdaySource, vm.createContext({window:windowObject,console,Date,Array,Object,String,Number,Promise,Set,Map,Math}), {filename:workdayPath});\nconst normalize=windowObject.CivicationSceneCatalog.normalizeChoices;\nassert.deepEqual(Array.from(normalize([])), []);\nconst one=Array.from(normalize([{id:"ack",label:"Bekreft"}])); assert.equal(one.length,1); assert.equal(one[0].id,"ack");\nconst two=Array.from(normalize([{id:"A",label:"Undersøk"},{id:"B",label:"Eskaler"}])); assert.equal(two.length,2); assert.deepEqual(two.map(c=>c.id),["A","B"]);\nconsole.log("civication-scene-interaction-no-fallback.test.js: PASS");\n''', encoding='utf-8')
          PY
      - name: Validate 4D
        run: |
          node tests/civication-scene-interaction-no-fallback.test.js
          node tests/civication-scene-director-daily-catalog.test.js
          node tests/civication-scene-director-ownership.test.js
          node tests/civication-scene-pipeline-reachability.test.js
          node scripts/audit-civication-scene-pipeline.mjs --strict
      - name: Commit migration and remove temp workflow
        run: |
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git rm .github/workflows/civication-scene-interaction-4d-temp.yml
          git add js/Civication/systems/civicationDailyMailBuilder.js js/Civication/systems/civicationWorkdayMailBuilder.js data/Civication/SCENE_PIPELINE_V1.md tests/civication-scene-interaction-no-fallback.test.js
          git commit -m "Fjern generiske runtimevalg fra SceneCatalog"
          git push origin HEAD:agent/civication-scene-interaction-4d
