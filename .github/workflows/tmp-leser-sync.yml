name: Temporary Leser canonical sync
on:
  push:
    branches:
      - civication/litteratur-leser-role-world
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: civication/litteratur-leser-role-world
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Synchronize canonical Leser Role World contracts
        run: node scripts/audit-civication-leser-governance-diagnostic.mjs
      - name: Remove diagnostic machinery and commit generated state
        run: |
          git checkout 8783ef370152cd9830ba9b0d6638c5d21e1fa572 -- .github/workflows/civication.yml
          rm -f scripts/audit-civication-leser-governance-diagnostic.mjs .github/workflows/tmp-leser-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize Leser canonical Role World state"
          git push origin HEAD:civication/litteratur-leser-role-world
