name: Temporary Publikum deltaker authored depth
on:
  push:
    branches:
      - civication/musikk-publikum-deltaker-role-world
permissions:
  contents: write
jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: civication/musikk-publikum-deltaker-role-world
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate life-position readiness
        run: node scripts/audit-civication-life-position-role-world-readiness.mjs --write
      - name: Verify Publikum deltaker readiness
        run: node tests/civication-musikk-publikum-deltaker-life-position-readiness.test.js
      - name: Verify neighboring Music evidence remains isolated
        run: |
          node - <<'NODE'
          const a=require('./data/Civication/lifePositionRoleWorldReadiness.json');
          const src='data/Civication/narratives/leisure/musikk_publikum_deltaker.json';
          for(const key of ['musikk/konsertgjenger','musikk/scenehenger','musikk/musikknerd','musikk/plategraver']){
            const row=a.positions.find(x=>x.key===key);
            if(!row) throw new Error(key+' missing');
            if((row.evidence.exact_source_refs||[]).includes(src)) throw new Error(src+' leaked as exact evidence into '+key);
            if((row.evidence.thematic_source_refs||[]).includes(src)) throw new Error(src+' leaked as thematic evidence into '+key);
          }
          console.log('Neighboring Music evidence remains isolated');
          NODE
      - name: Commit authored Publikum deltaker state
        run: |
          git add \
            data/Civication/lifePositionRoleWorldReadiness.json \
            reports/civication-life-position-role-world-readiness.md
          if git diff --cached --quiet; then
            echo 'Publikum deltaker authored-depth state already synchronized.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Synchronize Publikum deltaker authored-depth state'
          git push origin HEAD:civication/musikk-publikum-deltaker-role-world
