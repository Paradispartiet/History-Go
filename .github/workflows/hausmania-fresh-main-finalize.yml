name: Hausmania fresh-main finalize

on:
  push:
    branches:
      - agent/hausmania-completion-20260910
    paths:
      - .github/workflows/hausmania-fresh-main-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hausmania-completion-20260910
          fetch-depth: 0
          persist-credentials: true
      - name: Configure git
        run: |
          git config user.name 'Paradispartiet'
          git config user.email 'paradispartiet@gmail.com'
      - name: Replay on fresh main with generated-file reconciliation
        shell: bash
        run: |
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            git diff --name-only --diff-filter=U | sort > /tmp/conflicts.txt
            cat > /tmp/expected.txt <<'EOF'
          data/epoker/epoke-place-index.json
          data/fagverk/fagverk_release.json
          data/leksikon/manifest.json
          data/leksikon/sprak/manifest.json
          data/runtime/leksikon-all/part-008.json
          tests/epoke-place-index.test.mjs
          EOF
            sort -o /tmp/expected.txt /tmp/expected.txt
            echo "Merge conflicts:"
            cat /tmp/conflicts.txt
            diff -u /tmp/expected.txt /tmp/conflicts.txt
            while IFS= read -r file; do
              git checkout --theirs -- "$file"
              git add "$file"
            done < /tmp/conflicts.txt
            git diff --name-only --diff-filter=U | grep . && { echo "Unresolved conflicts remain"; exit 1; } || true
            git commit -m 'Merge fresh main into Hausmania production'
          fi
          git merge-base --is-ancestor origin/main HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize Hausmania on fresh main
        run: node tools/finalize-hausmania-completion.mjs
      - name: Verify focused Hausmania contracts
        run: |
          npm run check:stories
          node scripts/validate-place-description-production-v4_2_policy.mjs --all --report /tmp/hausmania-place-description.json
          node --test tests/place-language-layer.test.mjs
          node tools/build-subkultur-data-audit-v1.mjs
          node scripts/audit-subkultur-data-v1.mjs
          node tools/build-subkultur-case-evidence-v1.mjs --check
          node tools/build-subkultur-place-reports-batch-v1.mjs
          node scripts/audit-subkultur-place-production.mjs --all
          node scripts/audit-subkultur-case-evidence-v1.mjs
          node tools/build-subkultur-quiz-knowledge-v1.mjs --check
          node scripts/audit-subkultur-quiz-knowledge-v1.mjs
          node tools/materialize-subkultur-runtime-v1.mjs --check
          node scripts/audit-subkultur-runtime-final-v1.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const quiz=JSON.parse(fs.readFileSync('data/quiz/subkultur/hausmania_sets.json','utf8'));
          const qs=quiz.sets.flatMap(s=>s.questions);
          const counts=[];
          for(const q of qs){
            if(q.answerIndex !== q.options.indexOf(q.answer)) throw new Error(`answerIndex mismatch: ${q.id}`);
            counts[q.answerIndex]=(counts[q.answerIndex]||0)+1;
          }
          const max=Math.max(...counts.map(x=>x||0));
          if(max/qs.length > 0.75) throw new Error(`answer-position bias: ${counts.join(',')}`);
          console.log('Hausmania answer positions OK:', counts.join('/'));
          NODE
          node scripts/audit-repository-hygiene-v1.mjs
          git diff --check
      - name: Commit fresh-main Hausmania package
        run: |
          rm -f .github/workflows/hausmania-fresh-main-finalize.yml
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Replay Hausmania on fresh main'
          fi
          git push origin HEAD:agent/hausmania-completion-20260910
