name: Temporary Næringsliv field-module normalization

on:
  push:
    branches:
      - agent/naeringsliv-field-module-normalization
    paths:
      - '.github/workflows/temp-naeringsliv-field-module-normalization.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Normalize field-module ids and schema
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const replacements = new Map([
            ['em_naer_felt_arbeid_verdiskaping', 'em_naering_felt_arbeid_verdiskaping'],
            ['em_naer_geografi_infrastruktur', 'em_naering_geografi_infrastruktur']
          ]);

          const changed = [];
          function walk(current) {
            if (!fs.existsSync(current)) return;
            const stat = fs.statSync(current);
            if (stat.isDirectory()) {
              if (['node_modules', '.git', 'reports'].includes(path.basename(current))) return;
              for (const name of fs.readdirSync(current)) walk(path.join(current, name));
              return;
            }
            if (!current.endsWith('.json') || stat.size > 8_000_000) return;
            const before = fs.readFileSync(current, 'utf8');
            let after = before;
            for (const [from, to] of replacements) after = after.split(from).join(to);
            if (after !== before) {
              fs.writeFileSync(current, after);
              changed.push(current.split(path.sep).join('/'));
            }
          }
          walk('data');

          const canonicalPath = 'data/fag/naeringsliv/emner_naeringsliv_canonical_v4_5.json';
          const legacyPath = 'data/fag/naeringsliv/emner_naeringsliv2.json';
          const pensumPath = 'data/fag/naeringsliv/naeringslivpensum_canonical_v4_5.json';

          const workMethods = [
            'met_naering_arbeidslivsanalyse',
            'met_naering_verdiskapingsanalyse',
            'met_naering_logistikk_og_verdikjedeanalyse',
            'met_naering_omstilling_og_endringsanalyse',
            'met_naering_makt_og_ulikhetsanalyse',
            'met_naering_industrihistorisk_analyse'
          ];
          const geographyMethods = [
            'met_naering_romlig_okonomisk_analyse',
            'met_naering_infrastrukturanalyse',
            'met_naering_logistikk_og_verdikjedeanalyse',
            'met_naering_investering_og_eiendomsanalyse',
            'met_naering_byhistorisk_naeringsanalyse',
            'met_naering_statistikk_og_indikatoranalyse'
          ];

          function normalizeModule(item, config) {
            const tasks = Array.isArray(item.methods) && item.methods.some(value => typeof value === 'string' && !value.startsWith('met_naering_'))
              ? item.methods
              : (Array.isArray(item.field_tasks) ? item.field_tasks : []);
            item.module_type = 'cross_domain_field_module';
            item.emne_role = 'field_module';
            item.canonical_status = 'canonical_supplement';
            item.canonical_file_role = 'supplementary_active';
            item.quiz_priority = 'medium';
            item.direct_quiz_ok = false;
            item.opening_use_ok = false;
            item.bridge_use_ok = true;
            item.late_use_ok = true;
            item.mapping_required = false;
            item.primary_domain_ids = config.domains;
            item.method_ids = config.methods;
            item.methods = config.methods;
            item.recommended_methods = config.methods;
            item.field_tasks = tasks;
            item.requires_business_anchor = true;
            item.requires_external_claim_basis = true;
            item.requires_documented_economic_context = true;
            item.requires_work_capital_firm_or_infrastructure_anchor = true;
            item.scope_guard = 'Brukes som tverrgående feltmodul når spilleren kan undersøke konkrete virksomheter, arbeidsformer, kapitalstrømmer, markeder, teknologier, logistikk eller infrastruktur.';
          }

          function updateEmneFile(file) {
            if (!fs.existsSync(file)) return;
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const list = Array.isArray(data) ? data : data.emner;
            if (!Array.isArray(list)) throw new Error(`${file}: emneliste mangler`);
            const work = list.find(item => item.emne_id === 'em_naering_felt_arbeid_verdiskaping');
            const geo = list.find(item => item.emne_id === 'em_naering_geografi_infrastruktur');
            if (!work || !geo) throw new Error(`${file}: begge feltmoduler må finnes`);
            normalizeModule(work, {
              domains: [
                'arbeid_produksjon_verdiskaping',
                'handel_forbruk_marked',
                'teknologi_innovasjon_plattform',
                'logistikk_infrastruktur_rom',
                'makt_regulering_baerekraft'
              ],
              methods: workMethods
            });
            normalizeModule(geo, {
              domains: [
                'logistikk_infrastruktur_rom',
                'kapital_eierskap_finans',
                'teknologi_innovasjon_plattform',
                'makt_regulering_baerekraft'
              ],
              methods: geographyMethods
            });
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          }

          updateEmneFile(canonicalPath);
          updateEmneFile(legacyPath);

          const pensum = JSON.parse(fs.readFileSync(pensumPath, 'utf8'));
          pensum.version = 'v4.6-canonical';
          pensum.canonical_registry_version = 'naeringslivpensum_v4_6';
          pensum.updated_at = new Date().toISOString().slice(0, 10);
          pensum.summary = {
            ...pensum.summary,
            emne_count: 38,
            core_emne_count: 36,
            field_module_count: 2,
            mapping_count: 36,
            core_mapping_count: 36,
            field_module_mapping_count: 0,
            all_emner_have_mapping: false,
            all_core_emner_have_mapping: true,
            field_modules_require_mapping: false
          };
          pensum.field_modules = [
            {
              emne_id: 'em_naering_felt_arbeid_verdiskaping',
              title: 'Næringsliv som arbeid og verdiskaping',
              module_type: 'cross_domain_field_module',
              status: 'canonical_supplement',
              mapping_required: false,
              primary_domain_ids: [
                'arbeid_produksjon_verdiskaping',
                'handel_forbruk_marked',
                'teknologi_innovasjon_plattform',
                'logistikk_infrastruktur_rom',
                'makt_regulering_baerekraft'
              ],
              purpose: 'Tverrgående feltmodul for å kartlegge arbeid, verdiskaping, produksjonskjeder, teknologisk endring og ulikhet i konkrete virksomheter og arbeidssteder.'
            },
            {
              emne_id: 'em_naering_geografi_infrastruktur',
              title: 'Økonomiens geografi og infrastruktur',
              module_type: 'cross_domain_field_module',
              status: 'canonical_supplement',
              mapping_required: false,
              primary_domain_ids: [
                'logistikk_infrastruktur_rom',
                'kapital_eierskap_finans',
                'teknologi_innovasjon_plattform',
                'makt_regulering_baerekraft'
              ],
              purpose: 'Tverrgående feltmodul for å undersøke hvor arbeidsplasser, lager, havner, transport, eierskap og teknisk infrastruktur ligger og hvordan de former byens økonomiske rom.'
            }
          ];
          pensum.legacy_policy = {
            ...pensum.legacy_policy,
            naeringsliv_emne_prefix_required: 'em_naering_',
            field_module_ids_normalized: true,
            normalized_field_module_ids: [
              'em_naering_felt_arbeid_verdiskaping',
              'em_naering_geografi_infrastruktur'
            ]
          };
          fs.writeFileSync(pensumPath, JSON.stringify(pensum, null, 2) + '\n');

          for (const oldId of replacements.keys()) {
            const hits = [];
            function findOld(current) {
              if (!fs.existsSync(current)) return;
              const stat = fs.statSync(current);
              if (stat.isDirectory()) {
                if (['node_modules', '.git', 'reports'].includes(path.basename(current))) return;
                for (const name of fs.readdirSync(current)) findOld(path.join(current, name));
                return;
              }
              if (stat.size > 8_000_000) return;
              let text; try { text = fs.readFileSync(current, 'utf8'); } catch { return; }
              if (text.includes(oldId)) hits.push(current);
            }
            findOld('data');
            if (hits.length) throw new Error(`${oldId} finnes fortsatt i: ${hits.join(', ')}`);
          }

          const methodsRaw = JSON.parse(fs.readFileSync('data/fag/naeringsliv/methods_naeringsliv_canonical_v4_5.json', 'utf8'));
          const methods = Array.isArray(methodsRaw) ? methodsRaw : methodsRaw.methods || [];
          const methodIds = new Set(methods.map(item => item.method_id));
          const canonical = JSON.parse(fs.readFileSync(canonicalPath, 'utf8'));
          for (const moduleId of ['em_naering_felt_arbeid_verdiskaping', 'em_naering_geografi_infrastruktur']) {
            const module = canonical.find(item => item.emne_id === moduleId);
            for (const methodId of module.method_ids) {
              if (!methodIds.has(methodId)) throw new Error(`${moduleId}: ukjent metode ${methodId}`);
            }
            if (!Array.isArray(module.field_tasks) || module.field_tasks.length < 5) throw new Error(`${moduleId}: feltoppgavene ble ikke bevart`);
          }

          console.log(`Oppdaterte ${changed.length} JSON-filer med normaliserte ID-er.`);
          NODE

      - name: Regenerate Næringsliv production contexts
        run: |
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target telegrafbygningen --output data/quiz/production_context/naeringsliv/telegrafbygningen.json
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target oslo_posthus --output data/quiz/production_context/naeringsliv/oslo_posthus.json
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target havnelageret --output data/quiz/production_context/naeringsliv/havnelageret.json

      - name: Validate migration
        run: |
          npm run places:emner:check
          npm run places:index:check
          npm run audit:quiz-templates
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding

      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m 'Normaliser næringslivets to feltmoduler'
          git push origin HEAD:${{ github.ref_name }}
