name: TEMP Gangster readiness finalizer

on:
  push:
    branches:
      - feat/civication-subkultur-gangster-role-world-20260913

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[gangster-finalized]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/civication-subkultur-gangster-role-world-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate life-position readiness
        run: node scripts/audit-civication-life-position-role-world-readiness.mjs
      - name: Commit generated readiness state
        run: |
          if git diff --quiet -- data/Civication/lifePositionRoleWorldReadiness.json reports/civication-life-position-role-world-readiness.md; then
            echo "No readiness changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/lifePositionRoleWorldReadiness.json reports/civication-life-position-role-world-readiness.md
          git commit -m "Finalize Gangster Role World state [gangster-finalized]"
          git push origin HEAD:feat/civication-subkultur-gangster-role-world-20260913
