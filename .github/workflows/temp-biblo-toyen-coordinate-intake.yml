name: Temporary Biblo Tøyen coordinate intake

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  intake:
    if: github.head_ref == 'data/oslo-biblo-toyen-coordinate-intake'
    runs-on: ubuntu-latest
    steps:
      - name: Check out intake branch
        uses: actions/checkout@v4
        with:
          ref: data/oslo-biblo-toyen-coordinate-intake
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run and save Geonorge address lookup
        shell: bash
        run: |
          set -euo pipefail
          REPORTDIR="reports/visitoslo-oslo-east-audit-20260720/biblo-toyen"
          mkdir -p "$REPORTDIR"
          npm run places:coords:find:address -- --address "Hagegata 22 Oslo" \
            2>&1 | tee "$REPORTDIR/geonorge-address-lookup.txt"

      - name: Parse coordinate and duplicate gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          from pathlib import Path

          reportdir = Path('reports/visitoslo-oslo-east-audit-20260720/biblo-toyen')
          text = (reportdir / 'geonorge-address-lookup.txt').read_text()
          start = text.find('{\n')
          if start < 0:
              raise SystemExit('No JSON object found in Geonorge lookup output')
          lookup = json.loads(text[start:])
          if not lookup.get('ok') or lookup.get('status') != 'verified_candidate':
              raise SystemExit(f'Geonorge lookup not verified: {lookup}')

          coord = lookup['coordinate']
          lat, lon = coord['lat'], coord['lon']
          index = json.loads(Path('data/places/places_index.json').read_text())

          def haversine(lat1, lon1, lat2, lon2):
              R = 6371000
              p1, p2 = math.radians(lat1), math.radians(lat2)
              dp = math.radians(lat2-lat1)
              dl = math.radians(lon2-lon1)
              a = math.sin(dp/2)**2 + math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*R*math.asin(math.sqrt(a))

          keyword_matches = []
          for p in index:
              hay = ' '.join(str(p.get(k, '')) for k in ('id', 'name', 'desc')).lower()
              if 'biblo' in hay or 'hagegata 22' in hay or 'deichman tøyen' in hay or 'deichman toyen' in hay:
                  keyword_matches.append({k: p.get(k) for k in ('id','name','category','lat','lon')})

          nearby = []
          for p in index:
              if isinstance(p.get('lat'), (int,float)) and isinstance(p.get('lon'), (int,float)):
                  d = haversine(lat, lon, p['lat'], p['lon'])
                  if d <= 350:
                      nearby.append({
                          'id': p.get('id'), 'name': p.get('name'), 'category': p.get('category'),
                          'distanceMeters': round(d, 1)
                      })
          nearby.sort(key=lambda x: x['distanceMeters'])

          decision = {
              'version': '2026-07-20-address-first-clean',
              'placeId': 'biblo_toyen',
              'candidateName': 'Biblo Tøyen',
              'status': 'verified_address_candidate',
              'productionGate': 'ready_for_canonical_production' if not keyword_matches else 'manual_duplicate_review_required',
              'primaryCategory': 'litteratur',
              'identity': {
                  'currentName': 'Deichman Biblo Tøyen',
                  'currentAddress': 'Hagegata 22, Oslo',
                  'distinctFrom': 'Deichman Tøyen, Hagegata 28',
                  'opened': '2016-03-31',
                  'audience': '10–15 år',
                  'summary': 'Eget fysisk Deichman-bibliotek og møte-/aktivitetssted for unge 10–15 år, adskilt fra den ordinære Tøyen-filialen.'
              },
              'coordinate': coord,
              'source': {
                  'sourceProvider': lookup['sourceProvider'],
                  'sourceName': lookup['sourceName'],
                  'sourceUrl': lookup['sourceUrl'],
                  'sourceObjectId': lookup['sourceObjectId']
              },
              'duplicateGate': {
                  'canonicalIdentityMatches': keyword_matches,
                  'nearbyWithin350m': nearby,
                  'conclusion': 'No Biblo/Hagegata 22 identity match exists in the current canonical index.' if not keyword_matches else 'Potential identity match requires review.'
              },
              'categoryDecision': 'litteratur is primary because the place is a dedicated public-library branch; social meeting-place and learning functions belong in content layers, not a different primary category.',
              'historyGuardrails': {
                  'documentedCore': [
                      'Biblo Tøyen opened 31 March 2016 as a dedicated Deichman library for ages 10–15.',
                      'The current physical address is Hagegata 22, while ordinary Deichman Tøyen is separately located at Hagegata 28.',
                      'Books and reading remain central, alongside coding, workshops, cooking, film and other youth activities.'
                  ],
                  'avoid': [
                      'Do not merge Biblo with the ordinary Deichman Tøyen branch.',
                      'Do not describe the site merely as an activity club; it is a dedicated library branch.',
                      'Do not generalize Biblo as open to all ages.'
                  ]
              }
          }
          (reportdir / 'decision.json').write_text(json.dumps(decision, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(decision, ensure_ascii=False, indent=2))
          PY

      - name: Commit durable intake and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-biblo-toyen-coordinate-intake.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record Biblo Tøyen address-first coordinate intake"
          git push origin HEAD:data/oslo-biblo-toyen-coordinate-intake
