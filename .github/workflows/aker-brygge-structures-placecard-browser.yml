name: Aker Brygge — Brands and Structures real browser
on:
  pull_request:
    paths:
      - 'data/places/by/oslo/places/aker_brygge.json'
      - 'data/runtime/place-open/aker_brygge.json'
      - 'data/people/by/oslo/aker_brygge/niels_torp.json'
      - 'bilder/kort/people/niels_torp.jpg'
      - 'tests/aker-brygge-niels-torp-portrait.test.mjs'
      - 'data/brands/brands_by_place.json'
      - 'data/brands/brands_master.json'
      - 'data/brands/aker_brygge_asset_attributions.json'
      - 'bilder/kort/brands/*.webp'
      - 'js/ui/popup-utils.js'
      - 'css/popups.css'
      - 'tests/aker-brygge-brand-publication.test.mjs'
      - 'tests/aker-brygge-brand-place-boundaries.test.mjs'
      - 'bilder/kort/structures/aker_brygge_*.webp'
      - 'tests/aker-brygge-structures-real-browser.test.mjs'
      - 'tests/aker-brygge-structures-placecard-real-browser.test.mjs'
      - 'js/ui/place-rounds-visual-collections.js'
      - 'css/place-rounds-fill-layout.css'
      - 'css/place-sheet.css'
      - '.github/workflows/aker-brygge-structures-placecard-browser.yml'
permissions:
  contents: read
concurrency:
  group: aker-brygge-structures-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real-structures:
    name: Aker Brygge Brands and Structures 390px and 1440px
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Check canonical Aker Brygge Place-open parity
        run: npm run place-open:check
      - name: Verify reviewed Niels Torp portrait and synchronized People data
        run: node --test tests/aker-brygge-niels-torp-portrait.test.mjs
      - name: Verify sourced Brand boundaries and preserved candidate archive
        run: node --test tests/aker-brygge-brand-publication.test.mjs tests/aker-brygge-brand-place-boundaries.test.mjs tests/aker-brygge-brand-logo-candidates.test.mjs tests/aker-brygge-inline-svg-candidates.test.mjs tests/aker-brygge-svw-pdf-wordmark.test.mjs tests/aker-brygge-tiger-press-wordmark.test.mjs tests/aker-brygge-v1-contract.test.mjs
      - name: Install Chromium only
        run: npx playwright install --with-deps chromium
      - name: Open both Structures and all five Brand details at 390px and 1440px
        run: node tests/aker-brygge-structures-real-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aker-brygge-structures-real-browser
          path: artifacts/aker-brygge-structures-browser/
          if-no-files-found: warn
          retention-days: 14

