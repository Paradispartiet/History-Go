name: Fagverk Film og TV unit 8 regression

on:
  pull_request:
    paths:
      - "data/fag/TV_og_Film/film_tv_screen_public_sphere_community_society_source_claim_brief_v1.json"
      - "data/fag/TV_og_Film/film_tv_screen_public_sphere_community_society_topic_claims_v1.json"
      - "data/fagverk/film_tv/skjermoffentlighet-fellesskap-og-samfunn.json"
      - "data/fagverk/film_tv/skjermoffentlighet-fellesskap-og-samfunn/**"
      - "scripts/brief-film-tv-screen-public-sphere-community-society-sources-v1.mjs"
      - "scripts/materialize-film-tv-screen-public-sphere-community-society-fulltext-v1.mjs"
      - "scripts/audit-film-tv-screen-public-sphere-community-society-fulltext-v1.mjs"
      - "tests/film-tv-screen-public-sphere-community-society-source-brief-v1.test.mjs"
      - "tests/film-tv-screen-public-sphere-community-society-fulltext-v1.test.mjs"
      - ".github/workflows/fagverk-film-tv-screen-public-sphere-fulltext.yml"
  push:
    branches: [main]
    paths:
      - "data/fag/TV_og_Film/film_tv_screen_public_sphere_community_society_source_claim_brief_v1.json"
      - "data/fag/TV_og_Film/film_tv_screen_public_sphere_community_society_topic_claims_v1.json"
      - "data/fagverk/film_tv/skjermoffentlighet-fellesskap-og-samfunn.json"
      - "data/fagverk/film_tv/skjermoffentlighet-fellesskap-og-samfunn/**"
      - "scripts/brief-film-tv-screen-public-sphere-community-society-sources-v1.mjs"
      - "scripts/materialize-film-tv-screen-public-sphere-community-society-fulltext-v1.mjs"
      - "scripts/audit-film-tv-screen-public-sphere-community-society-fulltext-v1.mjs"
      - "tests/film-tv-screen-public-sphere-community-society-source-brief-v1.test.mjs"
      - "tests/film-tv-screen-public-sphere-community-society-fulltext-v1.test.mjs"
      - ".github/workflows/fagverk-film-tv-screen-public-sphere-fulltext.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate completed unit 8 assets without pinning global progression
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const chapter = read('data/fagverk/film_tv/skjermoffentlighet-fellesskap-og-samfunn.json');
          const claims = read('data/fagverk/film_tv/skjermoffentlighet-fellesskap-og-samfunn/claims.json');
          const modules = chapter.moduleFiles.map(read);
          const sections = modules.flatMap((m) => m.sections || []);
          const paragraphIds = sections.flatMap((s) => s.paragraphClaimIds || []).flat();
          if (chapter.emne_ids.length !== 9) throw new Error('Enhet 8 har ikke 9 canonicale emner');
          if (modules.length !== 4 || sections.length !== 9) throw new Error('Enhet 8 har feil modul- eller seksjonsstruktur');
          if (paragraphIds.length !== 36 || new Set(paragraphIds).size !== 36) throw new Error('Enhet 8 har ikke 36 entydige avsnittsclaims');
          if (claims.claims.length !== 36 || claims.sources.length !== 28) throw new Error('Enhet 8 har feil claim- eller kildetall');
          console.log('Enhet 8 regresjon OK uten å pinne global Film & TV-port.');
          NODE
