name: Fagverk Film og TV screen public sphere fulltext

on:
  pull_request:
    paths:
      - "data/fag/TV_og_Film/film_tv_screen_public_sphere_community_society_source_claim_brief_v1.json"
      - "data/fag/TV_og_Film/film_tv_screen_public_sphere_community_society_topic_claims_v1.json"
      - "data/fagverk/film_tv/skjermoffentlighet-fellesskap-og-samfunn.json"
      - "data/fagverk/film_tv/skjermoffentlighet-fellesskap-og-samfunn/**"
      - "data/fagverk/fagverk_registry.json"
      - "data/fagverk/subject_status.json"
      - "data/fagverk/fagverk_release.json"
      - "reports/fagverk/film-tv-screen-public-sphere-community-society-source-brief-v1-audit.json"
      - "reports/fagverk/film-tv-screen-public-sphere-community-society-fulltext-v1-audit.json"
      - "scripts/brief-film-tv-screen-public-sphere-community-society-sources-v1.mjs"
      - "scripts/materialize-film-tv-screen-public-sphere-community-society-fulltext-v1.mjs"
      - "scripts/audit-film-tv-screen-public-sphere-community-society-fulltext-v1.mjs"
      - "tests/film-tv-screen-public-sphere-community-society-source-brief-v1.test.mjs"
      - "tests/film-tv-screen-public-sphere-community-society-fulltext-v1.test.mjs"
      - "tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs"
      - ".github/workflows/fagverk-film-tv-screen-public-sphere-fulltext.yml"
  push:
    branches: [main]
    paths:
      - "data/fag/TV_og_Film/film_tv_screen_public_sphere_community_society_source_claim_brief_v1.json"
      - "data/fag/TV_og_Film/film_tv_screen_public_sphere_community_society_topic_claims_v1.json"
      - "data/fagverk/film_tv/skjermoffentlighet-fellesskap-og-samfunn.json"
      - "data/fagverk/film_tv/skjermoffentlighet-fellesskap-og-samfunn/**"
      - "data/fagverk/fagverk_registry.json"
      - "data/fagverk/subject_status.json"
      - "data/fagverk/fagverk_release.json"
      - "reports/fagverk/film-tv-screen-public-sphere-community-society-source-brief-v1-audit.json"
      - "reports/fagverk/film-tv-screen-public-sphere-community-society-fulltext-v1-audit.json"
      - "scripts/brief-film-tv-screen-public-sphere-community-society-sources-v1.mjs"
      - "scripts/materialize-film-tv-screen-public-sphere-community-society-fulltext-v1.mjs"
      - "scripts/audit-film-tv-screen-public-sphere-community-society-fulltext-v1.mjs"
      - "tests/film-tv-screen-public-sphere-community-society-source-brief-v1.test.mjs"
      - "tests/film-tv-screen-public-sphere-community-society-fulltext-v1.test.mjs"
      - "tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs"
      - ".github/workflows/fagverk-film-tv-screen-public-sphere-fulltext.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fagverk-film-tv-screen-public-sphere-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate screen public sphere fulltext
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate syntax
        run: |
          node --check scripts/brief-film-tv-screen-public-sphere-community-society-sources-v1.mjs
          node --check scripts/materialize-film-tv-screen-public-sphere-community-society-fulltext-v1.mjs
          node --check scripts/audit-film-tv-screen-public-sphere-community-society-fulltext-v1.mjs

      - name: Materialize monotone fulltext state
        run: node scripts/materialize-film-tv-screen-public-sphere-community-society-fulltext-v1.mjs --write

      - name: Build deterministic release
        run: node scripts/build-fagverk-release-manifest.mjs

      - name: Refresh fulltext audit
        run: node scripts/audit-film-tv-screen-public-sphere-community-society-fulltext-v1.mjs --write-report

      - name: Validate Film and TV contracts
        run: |
          node scripts/brief-film-tv-screen-public-sphere-community-society-sources-v1.mjs
          node scripts/audit-film-tv-screen-public-sphere-community-society-fulltext-v1.mjs
          node --test tests/film-tv-screen-public-sphere-community-society-source-brief-v1.test.mjs
          node --test tests/film-tv-screen-public-sphere-community-society-fulltext-v1.test.mjs
          node --test tests/film-tv-learning-order-plan-v1.test.mjs
          node --test tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs

      - name: Persist deterministic fulltext outputs on PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/fag/TV_og_Film/film_tv_screen_public_sphere_community_society_source_claim_brief_v1.json \
            data/fag/TV_og_Film/film_tv_screen_public_sphere_community_society_topic_claims_v1.json \
            data/fagverk/film_tv/skjermoffentlighet-fellesskap-og-samfunn/claims.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_status.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/film-tv-screen-public-sphere-community-society-source-brief-v1-audit.json \
            reports/fagverk/film-tv-screen-public-sphere-community-society-fulltext-v1-audit.json
          if git diff --cached --quiet; then
            echo 'Screen public sphere fulltext already matches.'
            exit 0
          fi
          git commit -m 'Materialize Film TV screen public sphere fulltext state'
          git push origin "HEAD:${HEAD_BRANCH}"
