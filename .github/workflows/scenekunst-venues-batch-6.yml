name: Scenekunst venues batch 6

on:
  pull_request:
    branches:
      - agent/scenekunst-venues-05

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/scenekunst-venues-06
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build five venue packages
        id: venue_build
        shell: bash
        run: |
          set +e
          node tools/add-scenekunst-venues-batch-6.mjs > /tmp/scenekunst-batch-6.log 2>&1
          status=$?
          cat /tmp/scenekunst-batch-6.log
          if [ "$status" -ne 0 ]; then
            mkdir -p reports
            cp /tmp/scenekunst-batch-6.log reports/scenekunst-new-venues-batch-6-runner-error.log
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit diagnostic on builder failure
        if: steps.venue_build.outputs.failed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/scenekunst-new-venues-batch-6-runner-error.log
          git diff --cached --quiet || git commit -m "Record Scenekunst batch 6 failure"
          git push origin HEAD:agent/scenekunst-venues-06
          exit 1

      - name: Build tools and regenerate place index
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          npm run build:tools
          npm run places:index:build

      - name: Validate places and categories
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          bash scripts/check-places.sh
          npm run audit:categories

      - name: Mark report validated
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'reports/scenekunst-new-venues-batch-6-2026-07-23.json';
          const report = JSON.parse(fs.readFileSync(p, 'utf8'));
          report.status = 'validated';
          report.validatedAt = new Date().toISOString();
          report.validation = {
            geonorgeExactAddressLookup: 'pass',
            overlapAudit: 'pass',
            placesIndexBuild: 'pass',
            placesChecks: 'pass',
            categoryAudit: 'pass'
          };
          fs.writeFileSync(p, JSON.stringify(report, null, 2) + '\n');
          NODE

      - name: Commit production result
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/manifest.json
          git add data/places/places_index.json
          git add data/places/scenekunst/akershus/sandvika_teater.json
          git add data/places/scenekunst/akershus/lille_scene_sandvika.json
          git add data/places/scenekunst/vestfold/papirhuset_teater.json
          git add data/places/scenekunst/rogaland/rimi_imir_scenekunst.json
          git add data/places/scenekunst/more_og_romsdal/fabrikken_kulturscene.json
          git add reports/scenekunst-new-venues-batch-6-2026-07-23.json
          git add reports/scenekunst-new-venues-batch-6-2026-07-23.md
          git diff --cached --stat
          git diff --cached --quiet && { echo "No production changes produced"; exit 1; }
          git commit -m "Add sixth Scenekunst venue batch"
          git push origin HEAD:agent/scenekunst-venues-06
