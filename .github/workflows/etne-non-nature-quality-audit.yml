name: Etne non-nature quality audit

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'agent/etne-all-rounds-quality-audit-uplift'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/etne-all-rounds-quality-audit-uplift
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize and audit Etne uplift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          node tools/materialize-etne-non-nature-quality-uplift.mjs
          export AUDIT_GENERATED_AT="$(git show -s --format=%cI origin/main)"
          node tools/audit-etne-non-nature-round-quality.mjs \
            > reports/etne-non-nature-quality-audit/audit.log 2>&1
          printf '0\n' > reports/etne-non-nature-quality-audit/audit-exit-code.txt
          sed -i 's/[[:space:]]\+$//' reports/etne-non-nature-quality-audit/report.md

      - name: Publish uplift and audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places tools/audit-etne-non-nature-round-quality.mjs reports/etne-non-nature-quality-audit
          if git diff --cached --quiet; then
            echo 'Etne uplift and audit are already current.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Uplift Etne non-nature round quality'
          git push origin HEAD:agent/etne-all-rounds-quality-audit-uplift
