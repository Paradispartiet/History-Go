name: Etne non-nature quality audit

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'agent/etne-all-rounds-quality-audit-uplift'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/etne-all-rounds-quality-audit-uplift
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run deterministic Etne audit
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin main
          export AUDIT_GENERATED_AT="$(git show -s --format=%cI origin/main)"
          mkdir -p reports/etne-non-nature-quality-audit
          set +e
          node tools/audit-etne-non-nature-round-quality.mjs \
            > reports/etne-non-nature-quality-audit/audit.log 2>&1
          STATUS=$?
          set -e
          printf '%s\n' "${STATUS}" > reports/etne-non-nature-quality-audit/audit-exit-code.txt
          if [ -f reports/etne-non-nature-quality-audit/report.md ]; then
            sed -i 's/[[:space:]]\+$//' reports/etne-non-nature-quality-audit/report.md
          fi

      - name: Publish audit report and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/etne-non-nature-quality-audit
          if git diff --cached --quiet; then
            echo 'Audit report already current.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Add Etne non-nature quality audit'
          git push origin HEAD:agent/etne-all-rounds-quality-audit-uplift
