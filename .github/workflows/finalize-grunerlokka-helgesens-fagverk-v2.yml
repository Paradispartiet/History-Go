name: Finalize Grünerløkka Helgesens Fagverk v2

on:
  push:
    branches:
      - work/grunerlokka-helgesens-fagverk-v2-20260901
    paths:
      - .github/workflows/finalize-grunerlokka-helgesens-fagverk-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Sync branch to current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Materialize Grünerløkka Helgesens Fagverk source and image repair
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const placePath = 'data/places/by/oslo/places/grunerlokka_helgesens_tm.json';
          const registryPath = 'data/fagverk/fagverk_registry.json';
          const backlogPath = 'data/places/place_image_backlog_summary.json';
          const place = JSON.parse(fs.readFileSync(placePath, 'utf8'));

          const imageUrl = 'https://upload.wikimedia.org/wikipedia/commons/d/d8/Thorvald_Meyers_gate_%28121429%29.jpg';
          const imagePage = 'https://commons.wikimedia.org/wiki/File:Thorvald_Meyers_gate_(121429).jpg';
          const staleImage = place.image === 'bilder/places/grunerlokka.JPG' && place.cardImage === 'bilder/kort/places/grunerlokka.PNG';
          if (staleImage) {
            place.image = imageUrl;
            place.cardImage = imageUrl;
          }

          const sources = [
            ['Oslo Byleksikon – Thorvald Meyers gate', 'https://oslobyleksikon.no/side/Thorvald_Meyers_gate'],
            ['Oslo kommune – Trikk og fotgjengere prioriteres i Thorvald Meyers gate', 'https://magasin.oslo.kommune.no/byplan/trikk-og-fotgjengere-prioriteres-i-thorvald-meyers-gate'],
            ['Oslo kommune – Nå skal Oslo få ny gatenormal', 'https://magasin.oslo.kommune.no/byplan/na-skal-oslo-fa-ny-gatenormal'],
            ['Oslo kommune – Vil gjøre byen mer bymessig', 'https://magasin.oslo.kommune.no/byplan/vil-gjore-byen-mer-bymessig']
          ];
          const existingLinks = Array.isArray(place.externalLinks) ? place.externalLinks : [];
          const byUrl = new Map(existingLinks.filter((row) => row?.url).map((row) => [row.url, row]));
          for (const [label, url] of sources) byUrl.set(url, { type: 'source', label, url, verifiedAt: '2026-09-01' });
          byUrl.set(imagePage, {
            type: 'source',
            label: 'Wikimedia Commons – Thorvald Meyers gate (121429), Tore Sætre, CC BY-SA 4.0',
            url: imagePage,
            verifiedAt: '2026-09-01'
          });
          place.externalLinks = [...byUrl.values()];

          place.fagverk = {
            schema: 'history_go_place_fagverk_v2',
            level: 'full',
            status: 'curated',
            intro: 'Krysset Helgesens gate og Thorvald Meyers gate kan leses som et lite laboratorium for gateliv. Her møtes hjørnearkitektur, butikkvinduer, innganger, trikkegate, fotgjengerfelt og korte opphold i et tett gateplan. Fagverket undersøker hvordan kantsonene organiserer bevegelse og møter, og hvordan historiske lag kan ligge skjult bak en aktiv kommersiell fasade.',
            article: [
              'Thorvald Meyers gate ble navngitt i 1864 etter grosserer Thorvald Meyer, som eide store deler av området og startet utparsellering omkring 1860. Før gaten kunne utvikles som sammenhengende hovedakse, måtte Torshovbekken legges i rør. Deretter vokste en tett bygate fram med boliger, handel og kollektivtransport. Krysset med Helgesens gate er derfor ikke bare et veikryss, men et punkt der to forskjellige gateforløp kobles sammen og fordeler bevegelser videre gjennom Grünerløkka.',
              'Hjørnegården Thorvald Meyers gate 34 gjør krysset særlig lesbart. Bygningen ble oppført i 1900 for vinhandler Andreas Løvlie etter tegninger av Eilert Paulsen, og det høye hjørnespiret markerer møtet mellom gatene på avstand. På bakkenivå skjer noe annet: dører, vinduer og butikklokaler ligger tett på fortauet. Hjørnet får dermed både en monumental rolle i bybildet og en hverdagslig rolle som aktiv kantsone der fotgjengere passerer, stopper, orienterer seg og går inn eller ut.',
              'Halvorsens Bokhandel åpnet i gården i 1939 og viser hvordan en gatefasade kan være inngang til flere lag av økonomisk og kulturell aktivitet. Bokhandel, antikvariat, forlagsvirksomhet og trykking var samlet i samme hus. For feltarbeid er det viktig å skille mellom det som kan observeres i dag og det som bare kan dokumenteres historisk: vinduer, innganger og romlig plassering kan registreres på stedet, mens tidligere virksomheter og deres forbindelser må hentes fra kilder.',
              'Den samme forskjellen blir enda tydeligere i historien om okkupasjonsårene. Et skjult rom i kjelleren ble brukt av Max Manus til radiosamband, og en stensilmaskin ble brukt til illegale aviser. Ingen som studerer dagens fasade kan slutte seg sikkert til denne virksomheten bare ved å se på bygningen. Krysset demonstrerer derfor et sentralt kildekritisk poeng: synlige byrom kan bære usynlige historiske funksjoner, og observasjon må kombineres med dokumentasjon når fortiden ikke lenger er materiell lesbar.',
              'Nyere gateplanlegging har også endret hvordan kantsonene brukes. Oslo kommune har prioritert trikk og fotgjengere i Thorvald Meyers gate, fjernet mye ordinær bilparkering og lagt til rette for varelevering, sykkelparkering, bredere gangareal og mer plass til byliv. Kommunens arbeid med gatenormal og bymessig utforming beskriver førsteetasjer, åpne fasader og sonen mellom bygning og fortau som viktige for aktivitet. Dette gjør krysset egnet til å undersøke hvordan transport, handel og opphold konkurrerer om de samme få meterne.',
              'Et systematisk feltbesøk kan telle innganger, sammenligne åpne og lukkede fasadepartier, registrere butikkvinduer, notere hvor mennesker stopper og tegne ganglinjer gjennom krysset. Man kan også observere hvordan varelevering, trikk, gående og andre trafikanter fordeles i gateprofilet. Slike spor kan beskrive fysisk tilgjengelighet og sosial koreografi, men de kan ikke alene fastslå omsetning, hvem som føler tilhørighet, hvor representative tilfeldige møter er, eller hvilke historiske hendelser som faktisk fant sted. Slike spørsmål krever andre kilder og datasett.'
            ],
            subject_ids: ['by'],
            emne_ids: [
              'em_by_gateliv_kantsoner',
              'em_by_butikkfasader_vindusutstillinger',
              'em_by_smaprat_blikk_sosial_koreografi'
            ],
            chapter_ids: [
              'arkitektur-gatekant-makt-ombruk',
              'byliv-sosial-offentlighet'
            ],
            lenses: [
              {
                id: 'lokka-kantsoner-inngangsrytme',
                title: 'Kantsoner og inngangsrytme',
                prompt: 'Hvordan påvirker tettheten av dører og innganger måten folk beveger seg langs hjørnet?',
                subject_id: 'by',
                emne_id: 'em_by_gateliv_kantsoner',
                evidence: 'Registrer alle synlige innganger rundt hjørnet og sammenlign avstand, orientering og kontakt med fortauets bevegelseslinjer.'
              },
              {
                id: 'lokka-butikkvindu-grense',
                title: 'Butikkvindu som grenseflate',
                prompt: 'Hvordan fungerer butikkvinduer som både fysisk grense og visuell forbindelse mellom fortau og interiør?',
                subject_id: 'by',
                emne_id: 'em_by_butikkfasader_vindusutstillinger',
                evidence: 'Sammenlign transparente, tildekkede og åpne fasadepartier og noter hvilke som inviterer til blikk, stopp eller inngang.'
              },
              {
                id: 'lokka-sosial-koreografi',
                title: 'Små møter i gateplanet',
                prompt: 'Hvilke mønstre av blikk, venting, passering og korte samtaler oppstår i kryssets mest brukte soner?',
                subject_id: 'by',
                emne_id: 'em_by_smaprat_blikk_sosial_koreografi',
                evidence: 'Observer korte tidsvinduer fra samme ståsted og skill mellom passering, orientering, venting, møte og planlagt opphold.'
              },
              {
                id: 'lokka-hjornet-fordeler-strommer',
                title: 'Hjørnet fordeler strømmer',
                prompt: 'Hvordan fordeler selve hjørneformen fotgjengere mellom Helgesens gate og Thorvald Meyers gate?',
                subject_id: 'by',
                emne_id: 'em_by_gateliv_kantsoner',
                evidence: 'Tegn ganglinjer gjennom fotgjengerfeltene og langs fortauene og noter hvor retningsskifter, køer eller omveier oppstår.'
              },
              {
                id: 'lokka-synlig-fasade-skjult-historie',
                title: 'Synlig fasade, skjult historie',
                prompt: 'Hva kan dagens fasade fortelle sikkert om bygningen, og hvilke historiske funksjoner krever skriftlige kilder?',
                subject_id: 'by',
                emne_id: 'em_by_gateliv_kantsoner',
                evidence: 'Skill eksplisitt mellom observerbare bygnings- og gateegenskaper og Byleksikonets dokumenterte opplysninger om tidligere bokhandel, trykking og motstandsarbeid.'
              }
            ],
            guiding_questions: [
              'Hvordan påvirker hjørnegårdens form retningene folk velger gjennom krysset?',
              'Hva gjør en førsteetasje mer eller mindre aktiv mot fortauet?',
              'Hvor oppstår korte stopp og møter uten at området er en egen plass?',
              'Hvordan fordeles begrenset gateareal mellom trikk, fotgjengere, varelevering og opphold?',
              'Hvilke historiske påstander kan ikke bekreftes gjennom feltobservasjon alene?'
            ],
            concepts: [
              'kantsone',
              'aktivt gatenivå',
              'inngangsrytme',
              'butikkfasade',
              'vindusutstilling',
              'hjørnegård',
              'sosial koreografi',
              'ganglinje',
              'opphold og gjennomgang',
              'feltobservasjon'
            ],
            observable_traces: [
              {
                title: 'Hjørnegårdens innganger og fasader',
                observation: 'Registrer dører, vinduer, butikkfronter og hjørnets retningsendring rundt Thorvald Meyers gate 34.',
                interpretation_boundary: 'Dagens fasade viser fysisk organisering, men tidligere virksomheter og brukere må dokumenteres med historiske kilder.',
                source_urls: [sources[0][1], sources[3][1]]
              },
              {
                title: 'Opphold langs den aktive kanten',
                observation: 'Noter hvor mennesker stopper, venter eller orienterer seg i forhold til butikkvinduer, innganger og fortausbredde.',
                interpretation_boundary: 'Observerte stopp viser et tidsavgrenset bruksmønster, men motivasjon, tilhørighet og representativitet kan ikke leses direkte.',
                source_urls: [sources[2][1], sources[3][1]]
              },
              {
                title: 'Transport og varelevering i samme gate',
                observation: 'Registrer hvordan trikk, gangareal, varelevering og annen ferdsel er fysisk fordelt langs Thorvald Meyers gate ved krysset.',
                interpretation_boundary: 'Gateprofilet kan observeres, men faktisk trafikkmengde, leveringsbehov og fremkommelighet krever målinger og driftsdata.',
                source_urls: [sources[1][1], sources[2][1]]
              },
              {
                title: 'Synlige og usynlige historiske lag',
                observation: 'Sammenlign det som er synlig ved hjørnegården i dag med de historiske funksjonene Byleksikon dokumenterer inne i bygningen.',
                interpretation_boundary: 'Feltobservasjon kan ikke i seg selv bevise bokhandelens virksomhet, radiosamband eller produksjon av illegale aviser.',
                source_urls: [sources[0][1]]
              }
            ],
            source_urls: sources.map((row) => row[1]),
            verified_at: '2026-09-01'
          };

          fs.writeFileSync(placePath, JSON.stringify(place, null, 2) + '\n');

          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          registry.placeLinks ||= {};
          registry.placeLinks.grunerlokka_helgesens_tm = {
            sourceFile: 'places/by/oslo/places/grunerlokka_helgesens_tm.json',
            field: 'fagverk',
            schema: 'history_go_place_fagverk_v2',
            level: 'full',
            status: 'curated'
          };
          fs.writeFileSync(registryPath, JSON.stringify(registry, null, 2) + '\n');

          if (staleImage) {
            const backlog = JSON.parse(fs.readFileSync(backlogPath, 'utf8'));
            backlog.generatedAt = '2026-09-01';
            backlog.generatedFromCommit = 'grunerlokka_helgesens_tm_fagverk_v2_20260901';
            backlog.summary.validRemote += 1;
            backlog.summary.invalidLocalPath -= 1;
            backlog.summary.remaining -= 1;
            backlog.byCategory.by.valid += 1;
            backlog.byCategory.by.invalid -= 1;
            fs.writeFileSync(backlogPath, JSON.stringify(backlog, null, 2) + '\n');
          }
          NODE
      - name: Regenerate canonical and Fagverk state
        run: |
          npm run places:index:build
          node scripts/build-place-open-payloads.mjs
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate generated canonical state
        run: |
          npm run places:index:check
          node scripts/build-place-open-payloads.mjs --check
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Validate Fagverk contracts
        run: |
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/fagverk-place-rendering.test.mjs
          node --test tests/fagverk-place-substance-audit.test.mjs
          node --test tests/fagverk-link-audit.test.mjs
      - name: Validate Grünerløkka Helgesens remote image
        env:
          PLACE_IMAGE_REMOTE_FETCH_TIMEOUT_MS: '45000'
        run: node scripts/audit-place-images.mjs --mode=changed --require-any-place-image --require-remote-image
      - name: Build and verify full place image backlog
        run: node scripts/audit-place-images.mjs --mode=all --report=/tmp/place-image-audit.json --verify-summary=data/places/place_image_backlog_summary.json
      - name: Validate generated web runtime
        run: npm run build:web:check
      - name: Validate diff whitespace
        run: git diff --check
      - name: Commit clean production result
        run: |
          git add \
            data/places/by/oslo/places/grunerlokka_helgesens_tm.json \
            data/places/places_index.json \
            data/places/place_image_backlog_summary.json \
            data/runtime/place-open/grunerlokka_helgesens_tm.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/fagverk-place-page-coverage-v2.json
          git rm .github/workflows/finalize-grunerlokka-helgesens-fagverk-v2.yml
          git diff --cached --quiet && { echo "No production changes to commit"; exit 1; }
          git commit -m "Curate Grünerløkka Helgesens Fagverk v2"
          git push origin HEAD:${GITHUB_REF_NAME}
