name: Revolver Knowledge and Fagverk release – one shot

on:
  pull_request:
    paths:
      - '.github/workflows/revolver-oslo-knowledge-one-shot.yml'

permissions:
  contents: write

concurrency:
  group: revolver-knowledge-one-shot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.event.pull_request.number == 6925 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/revolver-oslo-sourced-fagverk-20261102
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build canonical Knowledge from source-linked quiz, and Fagverk release
        run: |
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --write
          node scripts/build-fagverk-release-manifest.mjs
      - name: Verify canonical generated contracts
        run: |
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --check
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/revolver-oslo-sourced-fagverk-20261102.test.mjs
      - name: Commit generated data only; delete one-shot workflow
        env:
          REF: content/revolver-oslo-sourced-fagverk-20261102
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u data/quiz/musikk/revolver_oslo_sets_merged.json data/knowledge reports/knowledge-id-backfill.json data/fagverk/fagverk_release.json
          git rm .github/workflows/revolver-oslo-knowledge-one-shot.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Revolver: synkroniser Knowledge IDs og Fagverk-release'
          git push origin "HEAD:$REF"
