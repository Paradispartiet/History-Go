name: Generate quiz visit bundle

on:
  push:
    branches:
      - agent/typescript-quiz-visit-motor
    paths:
      - '.github/workflows/generate-quiz-visit-bundle.yml'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build browser TypeScript
        run: npm run build:web

      - name: Commit generated runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/web/place-card-quizcards-patch.js js/ui/place-card-quizcards-patch.js
          if git diff --cached --quiet; then
            echo "Generated runtime already in sync."
            exit 0
          fi
          git commit -m "Build TypeScript quiz and visit runtime"
          git push
