name: TEMP Post-merge Redaktor Bok places index repair

on:
  push:
    branches:
      - agent/post-merge-redaktor-bok-places-index-repair
    paths:
      - .github/workflows/TEMP-post-merge-redaktor-bok-places-index-repair.yml

concurrency:
  group: post-merge-redaktor-bok-places-index-repair-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-merge-redaktor-bok-places-index-repair
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate authoritative places index
        run: npm run places:index:build
      - name: Verify places index parity
        run: npm run places:index:check
      - name: Verify canonical knowledge and Fagverk manifest
        run: |
          npm run knowledge:canonical:check
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Verify Civication remains green
        run: npm run test:civication
      - name: Remove temporary repair workflow
        run: rm .github/workflows/TEMP-post-merge-redaktor-bok-places-index-repair.yml
      - name: Commit exact verified repair
        run: |
          git config user.name "History Go integrity agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair post-merge places index parity"
          git push origin HEAD:agent/post-merge-redaktor-bok-places-index-repair
