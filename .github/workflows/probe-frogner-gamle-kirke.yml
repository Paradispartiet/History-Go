name: Probe Frogner old church source objects

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  probe:
    if: github.head_ref == 'agent/akershus-frogner-gamle-kirke-production'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch and persist old/new church geometry
        shell: bash
        run: |
          set -euo pipefail
          out='reports/akershus-coordinate-frogner-gamle-kirke-source-probe'
          mkdir -p "$out"

          for id in 558572036 558572035; do
            curl --fail --location --retry 4 --retry-delay 3 \
              -A 'History-Go coordinate verification/1.0' \
              "https://api.openstreetmap.org/api/0.6/way/${id}/full" \
              | tee "$out/osm-way-${id}-full.xml" >/dev/null
          done

          curl --fail --location --retry 4 --retry-delay 3 \
            -A 'History-Go coordinate verification/1.0' \
            'https://nominatim.openstreetmap.org/lookup?osm_ids=W558572036,W558572035&format=jsonv2&addressdetails=1&extratags=1&namedetails=1&polygon_geojson=1' \
            | tee "$out/nominatim-frogner-churches.json" >/dev/null

          curl --fail --location --retry 4 --retry-delay 3 \
            -A 'History-Go coordinate verification/1.0' \
            'https://api.openstreetmap.org/api/0.6/map?bbox=11.1020,60.0188,11.1070,60.0220' \
            | tee "$out/osm-frogner-church-site-bbox.xml" >/dev/null

          python - <<'PY' | tee "$out/source-summary.txt"
          import json
          import math
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path('reports/akershus-coordinate-frogner-gamle-kirke-source-probe')
          legacy = (60.0247, 11.1035)

          def hav(a, b):
              R = 6371000.0
              p1, p2 = map(math.radians, (a[0], b[0]))
              dp = math.radians(b[0] - a[0])
              dl = math.radians(b[1] - a[1])
              h = math.sin(dp/2)**2 + math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2 * R * math.asin(math.sqrt(h))

          def centroid(path, way_id):
              root = ET.parse(path).getroot()
              nodes = {n.attrib['id']: (float(n.attrib['lat']), float(n.attrib['lon'])) for n in root.findall('node')}
              way = next(w for w in root.findall('way') if w.attrib['id'] == str(way_id))
              pts = [nodes[nd.attrib['ref']] for nd in way.findall('nd') if nd.attrib['ref'] in nodes]
              tags = {t.attrib['k']: t.attrib['v'] for t in way.findall('tag')}
              ring = [(lon, lat) for lat, lon in pts]
              if ring[0] != ring[-1]: ring.append(ring[0])
              area2 = cx = cy = 0.0
              for (x1, y1), (x2, y2) in zip(ring, ring[1:]):
                  cross = x1*y2 - x2*y1
                  area2 += cross; cx += (x1+x2)*cross; cy += (y1+y2)*cross
              if abs(area2) < 1e-15:
                  lat = sum(p[0] for p in pts)/len(pts); lon = sum(p[1] for p in pts)/len(pts)
              else:
                  lon = cx/(3*area2); lat = cy/(3*area2)
              return lat, lon, tags, len(pts)

          results = {}
          for way_id in (558572036, 558572035):
              lat, lon, tags, n = centroid(out / f'osm-way-{way_id}-full.xml', way_id)
              results[str(way_id)] = (lat, lon)
              print(f'WAY {way_id} centroid_lat={lat:.12f} centroid_lon={lon:.12f} node_count={n} distance_from_legacy_m={hav(legacy, (lat, lon)):.1f} tags=' + json.dumps(tags, ensure_ascii=False, sort_keys=True))
          print(f'old_to_new_church_m={hav(results["558572036"], results["558572035"]):.1f}')

          nom = json.loads((out / 'nominatim-frogner-churches.json').read_text())
          print('nominatim=' + json.dumps(nom, ensure_ascii=False, sort_keys=True))

          root = ET.parse(out / 'osm-frogner-church-site-bbox.xml').getroot()
          tagged = []
          for elem in list(root):
              tags = {t.attrib['k']: t.attrib['v'] for t in elem.findall('tag')}
              hay = ' '.join(str(v) for v in tags.values()).lower()
              if any(k in hay for k in ('frogner', 'church', 'kirke', 'grave', 'cemetery')) or tags.get('landuse') == 'cemetery':
                  tagged.append({'type': elem.tag, 'id': elem.attrib.get('id'), 'lat': elem.attrib.get('lat'), 'lon': elem.attrib.get('lon'), 'tags': tags})
          print('bbox_tagged=' + json.dumps(tagged, ensure_ascii=False, sort_keys=True))
          PY

      - name: Remove probe workflow and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/probe-frogner-gamle-kirke.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/akershus-coordinate-frogner-gamle-kirke-source-probe .github/workflows/probe-frogner-gamle-kirke.yml
          git commit -m 'Persist Frogner old church coordinate source evidence'
          git push origin HEAD:${{ github.head_ref }}
