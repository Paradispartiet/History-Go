name: Civication Renholder career matrix regeneration (one-shot)
on:
  push:
    branches:
      - civication/renholder-persistent-zone-case-20261103
    paths:
      - .github/workflows/civication-renholder-matrix-once.yml
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Recompute career evidence matrix from source tests
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Commit generated career evidence matrix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/careerGameplayMatrix.json
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild Renholder career evidence matrix"
            git push origin HEAD:civication/renholder-persistent-zone-case-20261103
          fi
