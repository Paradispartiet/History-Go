name: TEMP materialize okonomi naeringsliv quality

on:
  push:
    branches:
      - agent/okonomi-naeringsliv-universitetskvalitet-v2
    paths:
      - '.github/workflows/temp-materialize-okonomi-naeringsliv-quality.yml'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/temp-materialize-okonomi-naeringsliv-quality.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/okonomi-naeringsliv-universitetskvalitet-v2
          fetch-depth: 0

      - name: Materialize canonical quality files
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/okonomi-quality/part-* > /tmp/okonomi-quality.b64
          base64 --decode /tmp/okonomi-quality.b64 > /tmp/okonomi-quality.tgz
          mkdir -p /tmp/okonomi-quality
          tar -xzf /tmp/okonomi-quality.tgz -C /tmp/okonomi-quality
          cp /tmp/okonomi-quality/teorikort_okonomi_og_naeringsliv_v1.json data/fag/naeringsliv/
          cp /tmp/okonomi-quality/metodeprotokoller_okonomi_og_naeringsliv_v1.json data/fag/naeringsliv/
          cp /tmp/okonomi-quality/modellregister_okonomi_og_naeringsliv_v1.json data/fag/naeringsliv/
          cp /tmp/okonomi-quality/maleregister_okonomi_og_naeringsliv_v1.json data/fag/naeringsliv/
          cp /tmp/okonomi-quality/emneutvidelser_okonomi_og_naeringsliv_v1.json data/fag/naeringsliv/
          cp /tmp/okonomi-quality/vurderingsmatrise_okonomi_og_naeringsliv_v1.json data/fag/naeringsliv/
          cp /tmp/okonomi-quality/validate-okonomi-naeringsliv-universitetskvalitet.mjs tools/
          node tools/validate-okonomi-naeringsliv-universitetskvalitet.mjs

      - name: Commit materialized files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            data/fag/naeringsliv/teorikort_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/metodeprotokoller_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/modellregister_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/maleregister_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/emneutvidelser_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/vurderingsmatrise_okonomi_og_naeringsliv_v1.json \
            tools/validate-okonomi-naeringsliv-universitetskvalitet.mjs
          git commit -m 'Materialiser Økonomi og næringsliv universitetskvalitet'
          git push origin HEAD:agent/okonomi-naeringsliv-universitetskvalitet-v2
