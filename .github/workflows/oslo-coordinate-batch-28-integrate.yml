name: Oslo coordinate batch 28 integration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-coordinate-batch-28-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'agent/oslo-coordinate-control-batch-28'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect persistent square-object evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT='reports/oslo-coordinate-control-batch-28'
          mkdir -p "$OUT/sources"

          run_curl() {
            local url="$1"
            local file="$2"
            set +e
            curl --retry 3 --retry-delay 2 -fsSL -A 'History-Go-coordinate-audit/1.0' "$url" \
              | tee "$OUT/sources/$file" >/dev/null
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$code" > "$OUT/sources/$file.exit-status.txt"
          }

          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Bankplassen%20Oslo' 'bankplassen-nominatim.json'
          run_curl 'https://www.wikidata.org/wiki/Special:EntityData/Q4856441.json' 'bankplassen-wikidata-Q4856441.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Christiania%20Torv%20Oslo' 'christiania-torv-nominatim.json'

          cat > "$OUT/source-notes.md" <<'EOF'
          # Batch 28 – objekt- og overlapvalg

          - Bankplassen: OSM relation 12044741 er eksplisitt `place=square` med navnet Bankplassen. Wikidata Q4856441 gir en uavhengig navne-/lokasjonskryssjekk. Den separate canonical `grunnlovsbygget_bankplassen` representerer Den gamle Norges Bank og er ikke et duplikat av selve plassen.
          - Christiania torv: OSM way 594329484 er eksplisitt `place=square` med navnet Christiania torv. Den separate canonical `gamle_radhus` representerer bygget Gamle Rådhus og er ikke et duplikat av selve torvet.
          - Ingen adressepunkt eller nærliggende bygg brukes som representativt anker for plassene.
          EOF

      - name: Apply batch 28
        run: node scripts/tmp-complete-oslo-coordinate-batch28.mjs

      - name: Build global place index
        run: |
          set -o pipefail
          npm run places:index:build | tee reports/oslo-coordinate-control-batch-28/places-index-build.txt

      - name: Validate split manifest sync
        run: |
          set -o pipefail
          npm run audit:places-split-manifest-sync | tee reports/oslo-coordinate-control-batch-28/split-manifest-audit.txt

      - name: Validate source and runtime parity
        run: |
          set -o pipefail
          npm run places:index:check | tee reports/oslo-coordinate-control-batch-28/places-index-check.txt

      - name: Validate coordinate quality
        run: |
          set -o pipefail
          npm run places:coords:quality | tee reports/oslo-coordinate-control-batch-28/coordinate-quality.txt

      - name: Validate strict coordinate intake against merge-base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE="$(git merge-base HEAD origin/main)"
          echo "COORD_INTAKE_BASE=$BASE" | tee reports/oslo-coordinate-control-batch-28/strict-intake-base.txt
          COORD_INTAKE_BASE="$BASE" npm run places:coords:intake \
            | tee reports/oslo-coordinate-control-batch-28/strict-intake.txt

      - name: Validate coordinate evidence
        id: evidence
        continue-on-error: true
        run: |
          set -o pipefail
          npm run places:coords:evidence:audit | tee reports/oslo-coordinate-control-batch-28/evidence-audit.txt

      - name: Upload evidence audit failure report
        if: steps.evidence.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch-28-evidence-audit-failure
          path: |
            reports/coordinate-evidence-audit.md
            reports/oslo-coordinate-control-batch-28/evidence-audit.txt
          if-no-files-found: error

      - name: Stop on evidence audit failure
        if: steps.evidence.outcome == 'failure'
        run: exit 1

      - name: Validate diff whitespace
        run: git diff --check

      - name: Remove temporary integration files and commit result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/oslo-coordinate-batch-28-evidence.yml
          rm -f .github/workflows/oslo-coordinate-batch-28-integrate.yml
          rm -f scripts/tmp-complete-oslo-coordinate-batch28.mjs
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete Oslo coordinate control batch 28'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
