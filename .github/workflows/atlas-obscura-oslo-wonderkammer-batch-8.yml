name: Validate Atlas Obscura Oslo Wonderkammer batch 8

on:
  push:
    branches:
      - agent/atlas-obscura-oslo-wonderkammer-batch-8

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Save Atlas Obscura Wonderkammer batch 8 validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atlas-obscura-oslo-wonderkammer-batch-8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Audit Wonderkammer data
        run: |
          mkdir -p reports/atlas-obscura-oslo-wonderkammer-batch-8
          node scripts/audit-wonderkammer-data.mjs \
            | tee reports/atlas-obscura-oslo-wonderkammer-batch-8/wonderkammer-audit.txt
      - name: Verify parent places and merge behavior
        run: |
          mkdir -p reports/atlas-obscura-oslo-wonderkammer-batch-8
          node <<'NODE' | tee reports/atlas-obscura-oslo-wonderkammer-batch-8/parent-and-merge-check.txt
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('data/places/manifest.json', 'utf8'));
          const placeIds = new Set();
          for (const rel of manifest.files || []) {
            const path = `data/${rel.replace(/^data\//, '')}`;
            if (!fs.existsSync(path)) continue;
            const raw = JSON.parse(fs.readFileSync(path, 'utf8'));
            const rows = Array.isArray(raw) ? raw : Array.isArray(raw.places) ? raw.places : [raw];
            for (const row of rows) if (row?.id) placeIds.add(row.id);
          }
          const needed = ['oslo_domkirke', 'operahuset', 'spikersuppa'];
          for (const id of needed) {
            if (!placeIds.has(id)) throw new Error(`Missing parent place: ${id}`);
            console.log(`parent OK: ${id}`);
          }
          const index = JSON.parse(fs.readFileSync('data/wonderkammer/index.json', 'utf8'));
          const batch = 'data/wonderkammer/atlas_obscura_oslo_microplaces_batch_1.json';
          if (!(index.files || []).includes(batch)) throw new Error('Wonderkammer batch missing from index');
          const data = JSON.parse(fs.readFileSync(batch, 'utf8'));
          const ids = new Set();
          for (const row of data.places || []) {
            for (const chamber of row.chambers || []) {
              if (ids.has(chamber.id)) throw new Error(`Duplicate chamber id: ${chamber.id}`);
              ids.add(chamber.id);
            }
          }
          console.log(`batch index OK: ${batch}`);
          console.log(`unique new chambers: ${ids.size}`);
          NODE
      - name: Commit validation reports
        run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add reports/atlas-obscura-oslo-wonderkammer-batch-8
          if git diff --cached --quiet; then
            echo "No validation report changes."
          else
            git commit -m "Save Atlas Obscura Wonderkammer batch 8 validation"
            git push
          fi
