name: Oset original media fingerprints and canonical Knowledge sync (one-time)
on:
  pull_request:
    paths:
      - ".github/workflows/oset-photo-provenance-knowledge-regenerate-once-20261117.yml"
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 7342
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python image source verification dependencies
        run: python -m pip install --quiet --break-system-packages requests Pillow
      - name: Verify actual source photographs and register original SHA-256 fingerprints
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.parse import quote
          from PIL import Image
          import hashlib, json, requests, time
          root=Path('data/places/natur/oslo/places_oslo_natur_akerselvarute')
          def download_and_verify(filename, expected, host):
              urls=[]
              if host=='oslobyleksikon':
                  urls=['https://oslobyleksikon.no/images/5/51/Oset_slusebru.jpg']
              else:
                  orig=filename.replace('File:','').replace(' ','_')
                  digest=hashlib.md5(orig.encode('utf-8')).hexdigest()
                  urls=[
                      f"https://upload.wikimedia.org/wikipedia/commons/{digest[0]}/{digest[:2]}/{quote(orig)}",
                      f"https://commons.wikimedia.org/wiki/Special:FilePath/{quote(orig)}"
                  ]
              errors=[]
              for url in urls:
                  for attempt in range(2):
                      try:
                          response=requests.get(url,timeout=60,headers={
                              'User-Agent':'HistoryGoPhotoAudit/1.0 (open-source educational photo provenance; github.com/Paradispartiet/History-Go)'
                          })
                          response.raise_for_status()
                          payload=response.content
                          size=Image.open(BytesIO(payload)).size
                          if tuple(size)!=tuple(expected):
                              raise ValueError(f"Refusing wrong original from {url}: {size} != {expected}")
                          sha=hashlib.sha256(payload).hexdigest()
                          print(f"Verified actual {filename}: {size} SHA256 {sha[:16]}... ({len(payload)} bytes)")
                          return sha
                      except Exception as error:
                          errors.append(f"{type(error).__name__}: {str(error)[:120]}")
                          time.sleep(2)
              raise RuntimeError('All full original photograph endpoints failed: '+repr(errors))
          oset=root/'frysjadammen.json'
          nydalen=root/'stilla_nydalen.json'
          a=json.loads(oset.read_text())
          b=json.loads(nydalen.read_text())
          assert a['id']=='frysjadammen' and b['id']=='stilla_nydalen'
          assert a['frontImageMeta']['mediaType']=='editorial_illustration'
          assert a['frontImage']=='bilder/illustrasjoner/places/oset_slusebru_front_original.svg'
          a['imageMeta']['sourceSha256']=download_and_verify('Oset_slusebru.jpg',(3008,2000),'oslobyleksikon')
          b['imageMeta']['sourcePage']=b['imageMeta']['pageUrl']
          b['imageMeta']['sourceSha256']=download_and_verify('Nydalsdammen_-_Oslo,_Norway_2020-08-06_(05).jpg',(5757,3838),'wikimedia')
          b['frontImageMeta']['sourceSha256']=download_and_verify('Akerselva_-_Oslo,_Norway_2020-08-06_(01).jpg',(3895,5842),'wikimedia')
          assert len({a['imageMeta']['sourceSha256'],b['imageMeta']['sourceSha256'],b['frontImageMeta']['sourceSha256']})==3, 'Original photographs must be independent'
          for filename,obj in [(oset,a),(nydalen,b)]:
              filename.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install repository tools and regenerate both canonical surfaces
        run: |
          npm ci --no-audit --no-fund
          npm run place-open:build
          npm run place-open:check
          npm run knowledge:canonical:write
          npm run knowledge:canonical:check
          node scripts/check-distinct-place-photos.mjs --place data/places/natur/oslo/places_oslo_natur_akerselvarute/frysjadammen.json --require-both
          node scripts/check-distinct-place-photos.mjs --place data/places/natur/oslo/places_oslo_natur_akerselvarute/stilla_nydalen.json --require-both
          node --test tests/distinct-place-photo-originals.test.mjs
          node scripts/audit-place-images.mjs --mode=changed
      - name: Scope guard, retire the cropped-photo duplicate, self-remove and publish
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm bilder/places/oset_slusebru_front_portrait.webp
          git rm .github/workflows/oset-photo-provenance-knowledge-regenerate-once-20261117.yml
          printf 'Final pending scope:\n'
          git status --short
          unexpected="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | grep -vE '^(bilder/places/oset_slusebru_front_portrait\.webp|\.github/workflows/oset-photo-provenance-knowledge-regenerate-once-20261117\.yml|data/places/natur/oslo/places_oslo_natur_akerselvarute/(frysjadammen|stilla_nydalen)\.json|data/runtime/place-open/(frysjadammen|stilla_nydalen)\.json|data/knowledge/(knowledge_units\.generated\.json|knowledge_emne_review_queue\.generated\.json)|reports/knowledge-id-backfill\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated paths: $unexpected"
            exit 1
          fi
          git add data/places/natur/oslo/places_oslo_natur_akerselvarute/frysjadammen.json data/places/natur/oslo/places_oslo_natur_akerselvarute/stilla_nydalen.json
          git add data/runtime/place-open/frysjadammen.json data/runtime/place-open/stilla_nydalen.json
          git add data/knowledge/knowledge_units.generated.json data/knowledge/knowledge_emne_review_queue.generated.json reports/knowledge-id-backfill.json
          git commit -m "fix(oset): verify independent photo origins and regenerate canonical Knowledge"
          git push origin "HEAD:refs/heads/$HEAD_REF"
