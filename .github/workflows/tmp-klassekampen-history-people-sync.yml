name: TEMP Klassekampen history people sync

on:
  push:
    branches:
      - agent/klassekampen-phase2-v3-20261004

permissions:
  contents: write

concurrency:
  group: klassekampen-history-people-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/klassekampen-phase2-v3-20261004
          fetch-depth: 0

      - name: Setup cached Node workspace
        uses: ./.github/actions/setup-node-npm

      - name: Regenerate Civication history people index
        shell: bash
        run: |
          set -euo pipefail
          npm run civication:history-people:build
          npm run civication:history-people:check
          changed="$(git status --porcelain | awk '{print $2}' | sort | tr '\n' ' ')"
          if [ "$changed" != "data/Civication/historyPeople_index.json " ]; then
            echo "Unexpected generated changes: $changed"
            git status --short
            exit 1
          fi

      - name: Commit generated index
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-klassekampen-history-people-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/Civication/historyPeople_index.json .github/workflows/tmp-klassekampen-history-people-sync.yml
          git status --short
          git commit -m 'Regenerate Civication history people index for Klassekampen'
          git push origin HEAD:agent/klassekampen-phase2-v3-20261004
