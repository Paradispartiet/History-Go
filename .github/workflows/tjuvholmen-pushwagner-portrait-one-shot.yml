name: Tjuvholmen source-licensed Pushwagner portrait one-shot
on:
  pull_request:
    paths:
      - '.github/workflows/tjuvholmen-pushwagner-portrait-one-shot.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tjuvholmen-pushwagner-portrait-${{ github.ref }}
  cancel-in-progress: true
jobs:
  import-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/tjuvholmen-people-pushwagner-portrait-20261112
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow requests
      - name: Import authenticated Commons CC BY-SA portrait without cropping
        run: |
          python - <<'PY'
          import hashlib,json,requests
          from pathlib import Path
          from io import BytesIO
          from PIL import Image,ImageOps
          site='https://commons.wikimedia.org/wiki/File:Hariton_Pushwagner.jpg'
          asset='https://upload.wikimedia.org/wikipedia/commons/a/af/Hariton_Pushwagner.jpg'
          headers={'User-Agent':'HistoryGoEducationalSourceAudit/1.0 (https://github.com/Paradispartiet/History-Go; open-source local history project)'}
          response=requests.get(asset,timeout=60,headers=headers)
          response.raise_for_status()
          if len(response.content)>2_000_000 or not response.content.startswith(b'\xff\xd8\xff'):
            raise RuntimeError('Expected authentic Wikimedia Commons portrait JPEG')
          source=Path('bilder/kort/people/source/hariton_pushwagner_2014_gulosten.jpg')
          output=Path('bilder/kort/people/hariton_pushwagner.webp')
          source.parent.mkdir(parents=True,exist_ok=True)
          output.parent.mkdir(parents=True,exist_ok=True)
          source.write_bytes(response.content)
          im=Image.open(BytesIO(response.content)).convert('RGB')
          if im.width<700 or im.height<900 or im.width>4000 or im.height>4000:
            raise RuntimeError('Commons full portrait unexpected geometry')
          fitted=ImageOps.contain(im,(900,1200),method=Image.Resampling.LANCZOS)
          canvas=Image.new('RGB',(900,1200),(19,25,32))
          canvas.paste(fitted,((900-fitted.width)//2,(1200-fitted.height)//2))
          canvas.save(output,'WEBP',quality=93,method=6)
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          meta={
            'schema':'history_go_people_portrait_attribution_v1',
            'personId':'hariton_pushwagner',
            'path':str(output),'sourceLocalPath':str(source),
            'sourcePage':site,'sourceAsset':asset,
            'sourceSha256':digest(source),'assetSha256':digest(output),
            'sourceDimensions':[im.width,im.height],
            'outputDimensions':[900,1200],
            'creator':'Gulosten','credit':'Gulosten / Wikimedia Commons',
            'license':'CC BY-SA 3.0','licenseUrl':'https://creativecommons.org/licenses/by-sa/3.0/',
            'sourceForm':'documentary_portrait_photo_commons_2014',
            'transformation':'Downscaled proportionally, complete source kept; dark padding to 900x1200 with no crop or retouch',
            'identityEvidence':'Wikimedia Commons file description explicitly identifies Hariton Pushwagner at Bærum Kunstforening 2014',
            'reviewStatus':'source_verified_visual_review_pending',
            'dateVerified':'2026-11-12'
          }
          provenance=Path('data/people/hariton_pushwagner_image_provenance.json')
          provenance.write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          people_path=Path('data/people/subkultur/oslo/people_subkultur_oslo.json')
          people=json.loads(people_path.read_text())
          person=next((p for p in people if p.get('id')=='hariton_pushwagner'),None)
          if person is None or person.get('image')!='bilder/kort/people/hariton_pushwagner.PNG':
            raise RuntimeError('Unexpected canonical Pushwagner portrait pointer')
          person['image']=str(output)
          person['cardImage']=str(output)
          person['imageMeta']={
            'sourcePage':site,'sourceAsset':asset,
            'sourceSha256':meta['sourceSha256'],'assetSha256':meta['assetSha256'],
            'creator':'Gulosten','credit':'Gulosten / Wikimedia Commons',
            'license':'CC BY-SA 3.0','licenseUrl':meta['licenseUrl'],
            'outputDimensions':[900,1200],
            'reviewStatus':'source_verified_visual_review_pending',
            'transformation':meta['transformation']
          }
          person['source_urls']=list(dict.fromkeys((person.get('source_urls') or [])+[site]))
          people_path.write_text(json.dumps(people,ensure_ascii=False,indent=2)+'\n')
          print('PUSHWAGNER_SOURCE',json.dumps(meta,ensure_ascii=False))
          PY
      - run: npm ci --no-audit --no-fund
      - name: Rebuild actual Place-open and People runtime with source image
        run: |
          npm run place-open:build
          npm run place-open:check
          npm run civication:history-people:build
          npm run civication:history-people:check
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          const p=JSON.parse(fs.readFileSync('data/people/subkultur/oslo/people_subkultur_oslo.json','utf8')).find(x=>x.id==='hariton_pushwagner');
          const r=JSON.parse(fs.readFileSync('data/runtime/place-open/tjuvholmen.json','utf8'));
          const q=r.people.find(x=>x.id==='hariton_pushwagner');
          const src=JSON.parse(fs.readFileSync('data/people/hariton_pushwagner_image_provenance.json','utf8'));
          const sha=f=>crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          assert.equal(q?.image,src.path);
          assert.equal(q?.cardImage,src.path);
          assert.equal(p?.image,src.path);
          assert.equal(sha(src.sourceLocalPath),src.sourceSha256);
          assert.equal(sha(src.path),src.assetSha256);
          assert.equal(src.license,'CC BY-SA 3.0');
          console.log('PUSHWAGNER_PEOPLE_RUNTIME_PASS',src.path,src.assetSha256);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tjuvholmen-pushwagner-authentic-portrait
          path: |
            bilder/kort/people/hariton_pushwagner.webp
            data/people/hariton_pushwagner_image_provenance.json
          if-no-files-found: ignore
      - name: Commit verified binary image and associated canonical data only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/kort/people/source/hariton_pushwagner_2014_gulosten.jpg bilder/kort/people/hariton_pushwagner.webp data/people/hariton_pushwagner_image_provenance.json data/people/subkultur/oslo/people_subkultur_oslo.json
          git add -u data/runtime/place-open data/runtime/people-all data/Civication/historyPeople_index.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat(tjuvholmen): source-licensed Pushwagner portrait and synchronized People runtime"
            git reset --hard HEAD
            git clean -fd
            git fetch origin content/tjuvholmen-people-pushwagner-portrait-20261112
            git rebase origin/content/tjuvholmen-people-pushwagner-portrait-20261112
            git push origin HEAD:content/tjuvholmen-people-pushwagner-portrait-20261112
          fi
