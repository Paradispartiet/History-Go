name: Temporary Nøstvet visitor-site source probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/akershus-nostvet-boplass-production
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize visitor-site context
        shell: bash
        run: |
          set -euo pipefail
          OUT='reports/akershus-coordinate-nostvet-source-probe'
          mkdir -p "$OUT"
          UA='History-Go coordinate research (Paradispartiet/History-Go)'

          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://ws.geonorge.no/adresser/v1/sok' \
            --data-urlencode 'sok=Sjøskogenveien 25 Vinterbro' \
            --data 'kommunenummer=3218' --data 'treffPerSide=30' \
            | tee "$OUT/geonorge-sjoskogenveien-25.json" >/dev/null

          curl --fail --silent --show-error --location --user-agent "$UA" \
            'https://api.openstreetmap.org/api/0.6/map?bbox=10.775,59.742,10.807,59.756' \
            | tee "$OUT/osm-nostvet-expanded-bbox.xml" >/dev/null

          cat > "$OUT/overpass-query.txt" <<'QUERY'
          [out:json][timeout:60];
          (
            nwr["name"~"Nøst|Nost|Tusse|Sjøskog|Sj0skog",i](59.742,10.775,59.756,10.807);
            nwr["tourism"="information"](59.742,10.775,59.756,10.807);
            nwr["information"](59.742,10.775,59.756,10.807);
            nwr["amenity"="shelter"](59.742,10.775,59.756,10.807);
            nwr["shelter_type"](59.742,10.775,59.756,10.807);
            nwr["leisure"="firepit"](59.742,10.775,59.756,10.807);
            nwr["tourism"="picnic_site"](59.742,10.775,59.756,10.807);
            nwr["historic"="archaeological_site"](59.742,10.775,59.756,10.807);
            nwr["archaeological_site"](59.742,10.775,59.756,10.807);
          );
          out center tags;
          QUERY

          curl --fail --silent --show-error --location --user-agent "$UA" \
            --data-urlencode "data@${OUT}/overpass-query.txt" \
            'https://overpass-api.de/api/interpreter' \
            | tee "$OUT/overpass-nostvet-visitor-objects.json" >/dev/null

          python - <<'PY' | tee "$OUT/visitor-site-summary.txt" >/dev/null
          import json
          import math
          import re
          import unicodedata
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path('reports/akershus-coordinate-nostvet-source-probe')
          legacy = (59.75109, 10.7996)

          def distance_m(a, b):
              lat1, lon1 = map(math.radians, a)
              lat2, lon2 = map(math.radians, b)
              dlat = lat2 - lat1
              dlon = lon2 - lon1
              h = math.sin(dlat / 2) ** 2 + math.cos(lat1) * math.cos(lat2) * math.sin(dlon / 2) ** 2
              return 6371000 * 2 * math.asin(math.sqrt(h))

          def norm(value):
              return unicodedata.normalize('NFKD', str(value)).encode('ascii', 'ignore').decode().lower()

          address = json.loads((out / 'geonorge-sjoskogenveien-25.json').read_text())
          print(f'address_total={address.get("metadata", {}).get("totaltAntallTreff")}')
          for row in address.get('adresser', []):
              rp = row.get('representasjonspunkt') or {}
              if 'lat' not in rp or 'lon' not in rp:
                  continue
              point = (float(rp['lat']), float(rp['lon']))
              print('ADDRESS ' + json.dumps({
                  'data': row,
                  'distance_from_legacy_m': round(distance_m(legacy, point), 1),
              }, ensure_ascii=False, sort_keys=True))

          overpass = json.loads((out / 'overpass-nostvet-visitor-objects.json').read_text())
          objects = []
          for element in overpass.get('elements', []):
              lat = element.get('lat')
              lon = element.get('lon')
              if lat is None or lon is None:
                  center = element.get('center') or {}
                  lat = center.get('lat')
                  lon = center.get('lon')
              if lat is None or lon is None:
                  continue
              point = (float(lat), float(lon))
              objects.append({
                  'type': element.get('type'),
                  'id': element.get('id'),
                  'lat': point[0],
                  'lon': point[1],
                  'distance_from_legacy_m': round(distance_m(legacy, point), 1),
                  'tags': element.get('tags', {}),
              })
          objects.sort(key=lambda row: row['distance_from_legacy_m'])
          print('OVERPASS_OBJECTS=' + json.dumps(objects, ensure_ascii=False, sort_keys=True))

          keywords = (
              'sjoskog', 'nostvet', 'nostvedt', 'tussebo', 'oksefunn', 'okse',
              'flintoks', 'steinoks', 'boplass', 'steinalder', 'kulturhistorisk informasjon'
          )
          for collection in ('lokaliteter', 'enkeltminner'):
              path = out / f'riksantikvaren-ogc-{collection}-kommune-3218.json'
              data = json.loads(path.read_text())
              matches = []
              for feature in data.get('features', []):
                  props = feature.get('properties') or {}
                  joined = ' '.join(str(v) for v in props.values() if v is not None)
                  normalized = norm(joined)
                  if any(keyword in normalized for keyword in keywords):
                      matches.append({
                          'feature_id': feature.get('id'),
                          'geometry': feature.get('geometry'),
                          'properties': props,
                      })
              print(f'RA_TEXT_MATCHES {collection} count={len(matches)}')
              for match in matches:
                  props = match['properties']
                  info = ' '.join((props.get('informasjon') or '').split())
                  print('RA_MATCH ' + json.dumps({
                      'collection': collection,
                      'feature_id': match.get('feature_id'),
                      'name': props.get('navn'),
                      'kulturminneId': props.get('kulturminneId'),
                      'lokalitetId': props.get('lokalitetId'),
                      'lokalitetsart': props.get('lokalitetsart'),
                      'enkeltminneart': props.get('enkeltminneart'),
                      'datering': props.get('datering'),
                      'opprinneligFunksjon': props.get('opprinneligFunksjon'),
                      'vernetype': props.get('vernetype'),
                      'senterpunkt': props.get('senterpunkt'),
                      'geometry_type': (match.get('geometry') or {}).get('type'),
                      'information': info[:1400],
                      'linkKulturminnesøk': props.get('linkKulturminnesøk'),
                  }, ensure_ascii=False, sort_keys=True))

          root = ET.parse(out / 'osm-nostvet-expanded-bbox.xml').getroot()
          nodes = {
              node.attrib['id']: (float(node.attrib['lat']), float(node.attrib['lon']))
              for node in root.findall('node')
          }
          def tags(element):
              return {tag.attrib['k']: tag.attrib['v'] for tag in element.findall('tag')}
          relevant = []
          interesting = ('nost', 'tusse', 'sjoskog', 'information', 'shelter', 'firepit', 'archae')
          for node in root.findall('node'):
              t = tags(node)
              if not t:
                  continue
              joined = norm(' '.join(f'{k}={v}' for k, v in t.items()))
              if t.get('name') or any(token in joined for token in interesting):
                  point = nodes[node.attrib['id']]
                  relevant.append({
                      'type': 'node', 'id': node.attrib['id'], 'lat': point[0], 'lon': point[1],
                      'distance_from_legacy_m': round(distance_m(legacy, point), 1), 'tags': t,
                  })
          relevant.sort(key=lambda row: row['distance_from_legacy_m'])
          print('OSM_RELEVANT=' + json.dumps(relevant[:150], ensure_ascii=False, sort_keys=True))
          PY

          rm -f .github/workflows/temporary-coordinate-source-probe-nostvet-visitor.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT" .github/workflows/temporary-coordinate-source-probe-nostvet-visitor.yml
          if git diff --cached --quiet; then
            echo 'No visitor-context changes.'
          else
            git commit -m 'Materialize Nøstvet visitor-site context'
            git push origin HEAD:agent/akershus-nostvet-boplass-production
          fi
