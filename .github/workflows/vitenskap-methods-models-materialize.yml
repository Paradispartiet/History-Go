name: Vitenskap methods and models coverage materialize

# Temporary one-shot materializer for the first substantive editorial coverage batch.
on:
  push:
    branches:
      - agent/vitenskap-editorial-coverage-repair-1
    paths:
      - '.github/workflows/vitenskap-methods-models-materialize.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/vitenskap-methods-models-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/vitenskap-editorial-coverage-repair-1'
    runs-on: ubuntu-latest
    env:
      REPAIR_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Make temporary materializer replay-safe
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'scripts/materialize-vitenskap-methods-models-coverage-batch.mjs';
          const before = `const oldCoreEmnes = [...chapter.emne_ids];
          for (const id of EXPECTED_BATCH) if (!chapter.emne_ids.includes(id)) chapter.emne_ids.push(id);
          assert(chapter.emne_ids.length === oldCoreEmnes.length + EXPECTED_BATCH.length, 'Chapter emne extension has unexpected size');
          assert(new Set(chapter.emne_ids).size === chapter.emne_ids.length, 'Chapter emne IDs are not unique');`;
          const after = `const existingBatchCount = EXPECTED_BATCH.filter((id) => chapter.emne_ids.includes(id)).length;
          assert(existingBatchCount === 0 || existingBatchCount === EXPECTED_BATCH.length, \`Chapter has partial methods/models coverage state: \${existingBatchCount}/17\`);
          for (const id of EXPECTED_BATCH) if (!chapter.emne_ids.includes(id)) chapter.emne_ids.push(id);
          assert(EXPECTED_BATCH.every((id) => chapter.emne_ids.includes(id)), 'Chapter is missing a methods/models batch emne after materialization');
          assert(new Set(chapter.emne_ids).size === chapter.emne_ids.length, 'Chapter emne IDs are not unique');`;
          const text = fs.readFileSync(file, 'utf8');
          if (!text.includes(after)) {
            if (!text.includes(before)) throw new Error('Replay-safety patch target not found');
            fs.writeFileSync(file, text.replace(before, after));
          }
          NODE
      - name: Materialize canonical methods/models coverage
        run: node scripts/materialize-vitenskap-methods-models-coverage-batch.mjs
      - name: Regenerate holistic and batch reports
        run: |
          node scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs --write-report --no-check-report
          node scripts/audit-fagverk-vitenskap-methods-models-coverage.mjs --write-report --no-check-report
      - name: Validate permanent coverage gates
        run: |
          node --test tests/fagverk-vitenskap-methods-models-coverage.test.mjs
          node --test tests/fagverk-vitenskap-unit1.test.mjs
          node --test tests/fagverk-vitenskap-holistic-university-breadth-completion.test.mjs
      - name: Validate shared Vitenskap and nested Teknologi gates
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
          node --test tests/vitenskap-teknologi-category-contract.test.mjs
      - name: Verify deterministic rerun
        run: |
          node scripts/materialize-vitenskap-methods-models-coverage-batch.mjs
          node scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs --write-report --no-check-report
          node scripts/audit-fagverk-vitenskap-methods-models-coverage.mjs --write-report --no-check-report
          git diff --check
      - name: Remove temporary diagnosis and materializer artifacts
        run: |
          rm -f .github/workflows/vitenskap-coverage-batch-diagnose.yml
          rm -f .tmp/vitenskap-coverage-diagnosis.json
          rmdir .tmp 2>/dev/null || true
          rm -f scripts/materialize-vitenskap-methods-models-coverage-batch.mjs
          rm -f .github/workflows/vitenskap-methods-models-materialize.yml
      - name: Commit canonical coverage materialization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Materialize Vitenskap methods and models coverage'
          git push origin HEAD:${REPAIR_BRANCH}
