name: Temporary Etne sport batch 4 coordinate fix

on:
  push:
    branches:
      - agent/etne-sport-batch-4

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-sport-batch-4
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          mkdir -p reports/etne-sport-batch-4-integration
          npm ci 2>&1 | tee reports/etne-sport-batch-4-integration/npm-install.txt

      - name: Rebuild runtime index
        run: npm run places:index:build 2>&1 | tee reports/etne-sport-batch-4-integration/index-build.txt

      - name: Run coordinate intake gate
        run: npm run places:coords:intake 2>&1 | tee reports/etne-sport-batch-4-integration/coordinate-intake.txt

      - name: Run places validation
        run: bash scripts/check-places.sh 2>&1 | tee reports/etne-sport-batch-4-integration/check-places.txt

      - name: Run split manifest sync
        run: npm run audit:places-split-manifest-sync 2>&1 | tee reports/etne-sport-batch-4-integration/split-manifest-sync.txt

      - name: Run coordinate quality gate
        run: npm run places:coords:quality 2>&1 | tee reports/etne-sport-batch-4-integration/coordinate-quality.txt

      - name: Validate repaired source and runtime metadata
        run: |
          node --input-type=module <<'NODE' | tee reports/etne-sport-batch-4-integration/coordinate-metadata-fix.txt
          import fs from 'node:fs';
          const source = JSON.parse(fs.readFileSync('data/places/sport/vestland/etne/skanevik_skytebane.json', 'utf8'))[0];
          const runtime = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8')).find((p) => p.id === 'skanevik_skytebane');
          const fields = ['lat','lon','r','coordType','coordStatus','coordSource','coordVerifiedAt','coordNote','locatorType','sourceProvider','sourceObjectId','geocodeAccuracy','coordRole'];
          for (const field of fields) {
            if (JSON.stringify(source[field]) !== JSON.stringify(runtime?.[field])) {
              throw new Error(`FAIL source/runtime mismatch for ${field}: source=${JSON.stringify(source[field])} runtime=${JSON.stringify(runtime?.[field])}`);
            }
          }
          console.log('PASS skanevik_skytebane coordinate metadata present and source/runtime aligned');
          console.log(`PASS coordType=${source.coordType}`);
          console.log(`PASS coordStatus=${source.coordStatus}`);
          console.log(`PASS coordRole=${source.coordRole}`);
          console.log(`PASS radius r=${source.r} explained as an area anchor in coordNote`);
          NODE

      - name: Run diff whitespace check
        run: git diff --check | tee reports/etne-sport-batch-4-integration/git-diff-check.txt

      - name: Commit integration output and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-etne-sport-batch-4-coordinate-fix.yml
          git add data/places/places_index.json reports/etne-sport-batch-4-integration
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
          else
            git commit -m "Validate Skånevik skytebane coordinate metadata"
            git push origin HEAD:agent/etne-sport-batch-4
          fi
