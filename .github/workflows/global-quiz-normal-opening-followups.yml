name: Global quiz normal opening followups

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: global-quiz-normal-opening-followups-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  followups:
    if: startsWith(github.head_ref, 'agent/global-quiz-normal-opening-alignment') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply deterministic followups
        if: hashFiles('tools/fix-global-normal-opening-followups.mjs') != ''
        run: |
          set -euo pipefail
          node tools/fix-global-normal-opening-followups.mjs
          npm run knowledge:canonical:write
          node tools/validate-global-quiz-normal-opening-alignment.mjs | tee reports/quiz-global-normal-opening-alignment-validation.txt
          npm run audit:quiz-production-context
          npm run knowledge:canonical:check
          git diff --check
      - name: Commit deterministic followups
        if: hashFiles('tools/fix-global-normal-opening-followups.mjs') != ''
        run: |
          set -euo pipefail
          rm tools/fix-global-normal-opening-followups.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/quiz/by/deichman_bjorvika_sets.json
          git add data/knowledge/knowledge_units.generated.json
          git add data/knowledge/concepts.generated.json
          git add data/knowledge/terms.generated.json
          git add data/knowledge/stories.generated.json
          git add data/knowledge/knowledge_emne_review_queue.generated.json
          git add reports/knowledge-id-backfill.json
          git add reports/quiz-global-normal-opening-alignment-validation.txt
          git add tools/validate-global-quiz-normal-opening-alignment.mjs
          git add -u tools/fix-global-normal-opening-followups.mjs
          git diff --cached --check
          git commit -m 'Quiz: synkroniser Deichman og Knowledge etter normalisering'
          git push origin HEAD:${{ github.head_ref }}
