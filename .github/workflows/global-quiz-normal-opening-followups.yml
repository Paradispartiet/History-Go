name: Global quiz normal opening followups

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: global-quiz-normal-opening-followups-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  followups:
    if: startsWith(github.head_ref, 'agent/global-quiz-normal-opening-alignment') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply and diagnose deterministic followups
        id: followup
        continue-on-error: true
        if: hashFiles('tools/fix-global-normal-opening-followups.mjs') != ''
        shell: bash
        run: |
          set +e
          LOG=reports/global-quiz-normal-opening-followup-diagnostic.txt
          : > "$LOG"
          run_step() {
            name="$1"
            shift
            echo "## $name" >> "$LOG"
            "$@" >> "$LOG" 2>&1
            status=$?
            echo "status=$status" >> "$LOG"
            echo >> "$LOG"
            return $status
          }
          failed=0
          run_step fixer node tools/fix-global-normal-opening-followups.mjs || failed=1
          run_step knowledge_write npm run knowledge:canonical:write || failed=1
          run_step production_context_write node tools/rebuild-active-quiz-production-contexts.mjs || failed=1
          run_step global_validator node tools/validate-global-quiz-normal-opening-alignment.mjs || failed=1
          run_step production_context_check npm run audit:quiz-production-context || failed=1
          run_step knowledge_check npm run knowledge:canonical:check || failed=1
          run_step diff_check git diff --check || failed=1
          cp "$LOG" reports/quiz-global-normal-opening-alignment-validation.txt
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-quiz-normal-opening-followup-diagnostic
          path: reports/global-quiz-normal-opening-followup-diagnostic.txt
          if-no-files-found: warn
      - name: Commit deterministic followups
        if: steps.followup.outcome == 'success'
        run: |
          set -euo pipefail
          rm tools/fix-global-normal-opening-followups.mjs
          rm tools/rebuild-active-quiz-production-contexts.mjs
          rm -f reports/global-quiz-normal-opening-followup-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/quiz/by/deichman_bjorvika_sets.json
          git add data/quiz/production_context
          git add data/knowledge/knowledge_units.generated.json
          git add data/knowledge/concepts.generated.json
          git add data/knowledge/terms.generated.json
          git add data/knowledge/stories.generated.json
          git add data/knowledge/knowledge_emne_review_queue.generated.json
          git add reports/knowledge-id-backfill.json
          git add reports/quiz-global-normal-opening-alignment-validation.txt
          git add tools/validate-global-quiz-normal-opening-alignment.mjs
          git add -u tools/fix-global-normal-opening-followups.mjs tools/rebuild-active-quiz-production-contexts.mjs
          git diff --cached --check
          git commit -m 'Quiz: synkroniser normalåpning, Knowledge og produksjonskontekst'
          git push origin HEAD:${{ github.head_ref }}
      - name: Propagate followup failure
        if: steps.followup.outcome == 'failure'
        run: exit 1
