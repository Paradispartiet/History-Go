name: Fagverk Kunst Produksjon og praksis Phase 4

on:
  pull_request:
    paths:
      - 'data/fagverk/kunst/produksjon-og-praksis.json'
      - 'data/fagverk/kunst/produksjon-og-praksis/**'
      - 'reports/fagverk/kunst-phase3-audit.json'
      - 'reports/fagverk/kunst-produksjon-praksis-phase4-audit.json'
      - 'reports/fagverk/subject-baseline.json'
      - 'reports/fagverk/general-engine-audit.json'
      - 'scripts/audit-fagverk-kunst-phase3.mjs'
      - 'scripts/audit-fagverk-kunst-produksjon-praksis-phase4.mjs'
      - 'scripts/materialize-kunst-produksjon-praksis-phase4.mjs'
      - 'tests/fagverk-kunst-phase3.test.mjs'
      - 'tests/fagverk-kunst-produksjon-praksis-phase4.test.mjs'
      - 'tests/fagverk-general-engine.test.mjs'
      - '.github/workflows/fagverk-kunst-produksjon-praksis-phase4.yml'
  push:
    branches: [main]
    paths:
      - 'data/fagverk/kunst/produksjon-og-praksis.json'
      - 'data/fagverk/kunst/produksjon-og-praksis/**'
      - 'reports/fagverk/kunst-phase3-audit.json'
      - 'reports/fagverk/kunst-produksjon-praksis-phase4-audit.json'
      - 'reports/fagverk/subject-baseline.json'
      - 'reports/fagverk/general-engine-audit.json'
      - 'scripts/audit-fagverk-kunst-phase3.mjs'
      - 'scripts/audit-fagverk-kunst-produksjon-praksis-phase4.mjs'
      - 'scripts/materialize-kunst-produksjon-praksis-phase4.mjs'
      - 'tests/fagverk-kunst-phase3.test.mjs'
      - 'tests/fagverk-kunst-produksjon-praksis-phase4.test.mjs'
      - 'tests/fagverk-general-engine.test.mjs'
      - '.github/workflows/fagverk-kunst-produksjon-praksis-phase4.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check scripts/materialize-kunst-produksjon-praksis-phase4.mjs
          node --check scripts/audit-fagverk-kunst-produksjon-praksis-phase4.mjs
      - name: Kunst structural audit
        run: node scripts/audit-fagverk-kunst-phase3.mjs
      - name: Kunst Produksjon og praksis audit
        run: node scripts/audit-fagverk-kunst-produksjon-praksis-phase4.mjs
      - name: General engine
        run: node scripts/audit-fagverk-general-engine.mjs
      - name: Subject inventory
        run: node scripts/audit-fagverk-subject-inventory.mjs
      - name: Release feed
        run: node scripts/build-fagverk-release-manifest.mjs --check
      - name: Tests
        run: node --test tests/fagverk-kunst-phase3.test.mjs tests/fagverk-kunst-produksjon-praksis-phase4.test.mjs tests/fagverk-general-engine.test.mjs
