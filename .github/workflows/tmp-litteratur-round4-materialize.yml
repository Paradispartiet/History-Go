            if(byId.get(id)?.url!==u.old) throw new Error(`${id}: unexpected canonical baseline URL`);
            byId.get(id).url=u.current;
          }
          for(const [id,url] of Object.entries(retained)) if(byId.get(id)?.url!==url) throw new Error(`${id}: retained baseline URL drift`);
          writeJSON(claimsPath,claims);

          const occurrenceCounts={};
          for(const path of [materializerPath,pathwayPath,knowledgePath]){
            let text=fs.readFileSync(path,'utf8');
            for(const [id,u] of Object.entries(repl)){
              const count=text.split(u.old).length-1;
              occurrenceCounts[id]??={}; occurrenceCounts[id][path]=count;
              text=text.split(u.old).join(u.current);
            }
            fs.writeFileSync(path,text);
          }
          for(const [id,u] of Object.entries(repl)){
            const materializer=fs.readFileSync(materializerPath,'utf8');
            const pathway=fs.readFileSync(pathwayPath,'utf8');
            if(!materializer.includes(u.current)||!pathway.includes(u.current)) throw new Error(`${id}: current URL not materialized`);
            if(materializer.includes(u.old)||pathway.includes(u.old)||fs.readFileSync(knowledgePath,'utf8').includes(u.old)) throw new Error(`${id}: old URL remains`);
          }

          const sourceChecks=[
            {claims_source_id:'sna01',title:'Narrative Discourse',publisher:'Cornell University Press',verification_state:'verified_live_redirect_same_resource',canonical_url:retained.sna01,evidence:'The canonical Cornell University Press URL resolves to the same Narrative Discourse product path with the www host normalized away.',action:'retain_canonical_url'},
            {claims_source_id:'sna02',title:'Narrative Theory: Core Concepts and Critical Debates',publisher:'The Ohio State University Press',verification_state:'verified_authoritative_replacement',old_url:repl.sna02.old,canonical_url:repl.sna02.current,evidence:'Ohio State University Press currently serves the same title and ISBN 978-0-8142-5184-3 at its BookPages/HermanNarrative product page.',action:'replace_canonical_url'},
            {claims_source_id:'sna03',title:'The Cambridge Companion to Narrative',publisher:'Cambridge University Press',verification_state:'verified_authoritative_replacement',old_url:repl.sna03.old,canonical_url:repl.sna03.current,evidence:'Cambridge Core currently identifies the same David Herman-edited volume, ISBN 9780521673662 / DOI 10.1017/CCOL0521856965, under the replacement Core identity.',action:'replace_canonical_url'},
            {claims_source_id:'sna04',title:'The Rhetoric of Fiction',publisher:'University of Chicago Press',verification_state:'verified_authoritative_replacement',old_url:repl.sna04.old,canonical_url:repl.sna04.current,evidence:'University of Chicago Press currently serves Wayne C. Booth’s The Rhetoric of Fiction, second edition, at the replacement book identity bo5965941.',action:'replace_canonical_url'},
            {claims_source_id:'sna05',title:'Story and Discourse',publisher:'Cornell University Press',verification_state:'verified_live_redirect_same_resource',canonical_url:retained.sna05,evidence:'The canonical Cornell University Press URL resolves to the same Story and Discourse product path with the www host normalized away.',action:'retain_canonical_url'},
            {claims_source_id:'sna06',title:'The Cambridge Introduction to Narrative',publisher:'Cambridge University Press',verification_state:'verified_authoritative_replacement',old_url:repl.sna06.old,canonical_url:repl.sna06.current,evidence:'Cambridge Higher Education currently serves H. Porter Abbott’s third edition (2020/2021), DOI 10.1017/9781108913928, under the replacement Aspire identity.',action:'replace_canonical_url'},
            {claims_source_id:'sna07',title:'Emma',publisher:'Project Gutenberg',verification_state:'verified_live',canonical_url:retained.sna07,evidence:'Project Gutenberg ebook 158 remained live during the round-4 source check.',action:'retain_canonical_url'},
            {claims_source_id:'sna08',title:'Pride and Prejudice',publisher:'Project Gutenberg',verification_state:'verified_live',canonical_url:retained.sna08,evidence:'Project Gutenberg ebook 1342 remained live during the round-4 source check.',action:'retain_canonical_url'},
            {claims_source_id:'sna09',title:'Le Père Goriot',publisher:'Project Gutenberg',verification_state:'verified_live',canonical_url:retained.sna09,evidence:'Project Gutenberg ebook 1237 remained live during the round-4 source check.',action:'retain_canonical_url'},
            {claims_source_id:'sna10',title:'The Tell-Tale Heart',publisher:'Project Gutenberg',verification_state:'verified_authoritative_replacement',old_url:repl.sna10.old,canonical_url:repl.sna10.current,evidence:'Project Gutenberg ebook 2147 is Volume 1 and its contents do not contain The Tell-Tale Heart; ebook 2148 is Volume 2 and explicitly lists The tell-tale heart in its contents.',action:'replace_canonical_url'},
            {claims_source_id:'sna11',title:'The Garden Party and Other Stories',publisher:'Project Gutenberg',verification_state:'verified_live',canonical_url:retained.sna11,evidence:'Project Gutenberg ebook 1429 remained live during the round-4 source check.',action:'retain_canonical_url'},
