            quality_gates:{all_12_area_sources_accounted_for:true,five_authoritative_replacements_materialized:true,replacement_identity_preserved:true,no_unverified_replacement:true,canonical_source_ids_preserved:true,pathway_source_count_preserved:true,claim_provenance_scope_unchanged:true,theory_integrity_scope_unchanged:true,canonical_subject_architecture_unchanged:true,completion_status_preserved:true,knowledge_provenance_checked_source_id_aware:true}
