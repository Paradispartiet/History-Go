          const audit=`#!/usr/bin/env node\nimport fs from 'node:fs';\nimport path from 'node:path';\nimport { fileURLToPath } from 'node:url';\n\nconst ROOT=path.resolve(path.dirname(fileURLToPath(import.meta.url)),'..');\nconst P={evidence:'${evidencePath}',round1:'data/fagverk/litteratur/maintenance/source-refresh-round1-2026-09-04.json',round2:'data/fagverk/litteratur/maintenance/source-refresh-round2-2026-09-05.json',round3:'data/fagverk/litteratur/maintenance/source-refresh-round3-2026-09-05.json',claims:'${claimsPath}',materializer:'${materializerPath}',pathway:'${pathwayPath}',knowledge:'${knowledgePath}',coverage:'data/fag/litteratur/litteraturvitenskap_canonical_v1/coverage_contract_v1.json',status:'data/fagverk/subject_status.json'};\nconst BASELINE='${BASE}'; const AREA='${AREA}';\nconst REPL=${JSON.stringify(repl)};\nconst RET=${JSON.stringify(retained)};\nconst read=f=>JSON.parse(fs.readFileSync(path.join(ROOT,f),'utf8')); const text=f=>fs.readFileSync(path.join(ROOT,f),'utf8'); const assert=(c,m)=>{if(!c)throw new Error(m)}; const countBy=(xs,k)=>xs.filter(x=>x.verification_state===k).length; const sid=id=>\`src_lit_\${AREA}_\${id}\`;\nexport function auditLitteraturMaintenanceSourceRefreshRound4(){\n const evidence=read(P.evidence),r1=read(P.round1),r2=read(P.round2),r3=read(P.round3),claims=read(P.claims),pathway=read(P.pathway),knowledge=read(P.knowledge),coverage=read(P.coverage),materializer=text(P.materializer),status=read(P.status).subjects.find(x=>x.id==='litteratur');\n assert(evidence.schema==='history_go_litteratur_maintenance_source_refresh_v1'&&evidence.round_id==='source_refresh_round4_2026_09_05','Feil round-4 identitet'); assert(evidence.baseline_main_sha===BASELINE,'Round 4 baseline mismatch'); assert(evidence.checked_at==='2026-09-05'&&evidence.status==='verified','Round 4 mangler verifisert datostatus'); assert(evidence.scope?.area_id===AREA&&evidence.scope?.canonical_source_mutation===true,'Round 4 scope mismatch'); assert(evidence.scope?.new_strict_subcategory===false&&evidence.scope?.place_production===false,'Round 4 har utvidet scope');\n assert(r1.scope?.area_id==='faggrunnlag_metode_forskningspraksis'&&r2.scope?.area_id==='poetikk_estetikk_litteraritet'&&r3.scope?.area_id==='sprak_stil_retorikk','Tidligere maintenance-runder mangler');\n assert(Array.isArray(evidence.source_checks)&&evidence.source_checks.length===12&&new Set(evidence.source_checks.map(x=>x.claims_source_id)).size===12,'Round 4 må ha 12 unike kildekontroller'); assert(claims.chapter_id===AREA&&claims.sources.length===12&&new Set(claims.sources.map(x=>x.id)).size===12,'Narratologi-claims må ha 12 unike kilder');\n const expected=[...Object.keys(REPL),...Object.keys(RET)].sort(); assert(JSON.stringify(claims.sources.map(x=>x.id).sort())===JSON.stringify(expected),'Canonical source-ID-settet er endret'); assert(JSON.stringify(evidence.source_checks.map(x=>x.claims_source_id).sort())===JSON.stringify(expected),'Evidensen dekker ikke eksakt source-ID-sett');\n assert(pathway.schema==='history_go_subject_pathway_package_v1'&&pathway.subject_id==='litteratur','Pathway-identitet feil'); assert(pathway.sources.length===384&&new Set(pathway.sources.map(x=>x.source_id)).size===384,'Pathway må ha 384 unike kilder'); assert(pathway.sets.length===28,'Pathway må ha 28 områder'); const articleIds=pathway.sets.flatMap(s=>s.article_ids||[]); assert(articleIds.length===168&&new Set(articleIds).size===168,'Pathway må dekke 168 artikler eksakt én gang'); assert(coverage.completion_definition?.required_area_count===28&&coverage.completion_definition?.required_topic_count===168,'Coverage 28/168-baseline flyttet');\n assert(knowledge.schema==='history_go_knowledge_unit_registry_v1'&&knowledge.subject_id==='litteratur'&&Array.isArray(knowledge.units)&&knowledge.units.length>0,'Generert Litteratur-Knowledge identitet feil');\n const cb=new Map(claims.sources.map(x=>[x.id,x])),eb=new Map(evidence.source_checks.map(x=>[x.claims_source_id,x])),pb=new Map(pathway.sources.map(x=>[x.source_id,x])); const ks=knowledge.units.flatMap(u=>Array.isArray(u.sources)?u.sources:[]); const canonicalCorpus=JSON.stringify(claims)+'\\n'+JSON.stringify(pathway)+'\\n'+materializer; const knowledgeCorpus=JSON.stringify(knowledge);\n for(const [id,urls] of Object.entries(REPL)){const c=cb.get(id),e=eb.get(id),p=pb.get(sid(id)); assert(c?.url===urls.current,\`\${id}: claims mangler current URL\`); assert(e?.verification_state==='verified_authoritative_replacement'&&e?.old_url===urls.old&&e?.canonical_url===urls.current&&e?.action==='replace_canonical_url',\`\${id}: replacement-evidens feil\`); assert(p?.url===urls.current,\`\${id}: pathway root source mangler current URL\`); assert(materializer.includes(urls.current),\`\${id}: materializer mangler current URL\`); assert(!canonicalCorpus.includes(urls.old),\`\${id}: gammel URL finnes i canonical/materialized flater\`); assert(!knowledgeCorpus.includes(urls.old),\`\${id}: gammel URL finnes i Knowledge\`); const materialized=ks.filter(s=>s?.source_id===sid(id)); assert(materialized.every(s=>s?.url===urls.current),\`\${id}: Knowledge-materialisering bruker ikke current URL\`);}\n for(const [id,url] of Object.entries(RET)){const c=cb.get(id),e=eb.get(id),p=pb.get(sid(id)); assert(c?.url===url&&e?.canonical_url===url&&p?.url===url,\`\${id}: retained URL drift\`); assert(e?.action==='retain_canonical_url',\`\${id}: ugyldig retain-action\`);}\n assert(countBy(evidence.source_checks,'verified_authoritative_replacement')===5,'Round 4 skal ha fem replacements'); assert(countBy(evidence.source_checks,'verified_live')===5,'Round 4 skal ha fem direkte live-retentions'); assert(countBy(evidence.source_checks,'verified_live_redirect_same_resource')===2,'Round 4 skal ha to redirect-retentions'); assert(countBy(evidence.source_checks,'retained_fail_closed_no_authoritative_replacement')===0,'Round 4 skal ikke ha fail-closed retentions'); assert(evidence.summary?.canonical_sources_checked===12&&evidence.summary?.canonical_url_replacements===5,'Round 4 summary feil'); assert(Object.values(evidence.quality_gates||{}).length===11&&Object.values(evidence.quality_gates).every(Boolean),'Alle elleve round-4 quality gates må være sanne');\n assert(status?.navigationStatus==='materialized'&&status?.assessmentStatus==='audited'&&status?.editorialStatus==='complete'&&status?.nextGate==='maintenance_and_source_refresh','Litteratur completion-status driftet');\n return {status:'passed',round:4,area_id:AREA,sources_checked:12,authoritative_replacements:5,direct_live:5,redirect_retained:2,pathway_sources:pathway.sources.length,knowledge_units:knowledge.units.length,canonical_areas:pathway.sets.length,assessed_articles:new Set(articleIds).size,maintained_areas_total:new Set([r1.scope.area_id,r2.scope.area_id,r3.scope.area_id,evidence.scope.area_id]).size,next_gate:status.nextGate};}\nif(process.argv[1]&&path.resolve(process.argv[1])===fileURLToPath(import.meta.url)){try{const r=auditLitteraturMaintenanceSourceRefreshRound4();console.log(\`Litteratur maintenance round 4 OK: \${r.sources_checked}/12 kilder, \${r.authoritative_replacements} autoritative URL-erstatninger, \${r.direct_live} direkte live, \${r.redirect_retained} redirects, \${r.pathway_sources} pathway-kilder, \${r.knowledge_units} Knowledge units og \${r.maintained_areas_total}/28 områder vedlikeholdt.\`)}catch(error){console.error(\`Litteratur maintenance round 4 FEIL: \${error.message}\`);process.exitCode=1;}}\n`;
          fs.writeFileSync(auditPath,audit);
          fs.writeFileSync(testPath,"import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { auditLitteraturMaintenanceSourceRefreshRound4 } from '../scripts/audit-litteratur-maintenance-source-refresh-round4.mjs';\n\ntest('Litteratur maintenance round 4 refreshes narratology sources without widening scope',()=>{const r=auditLitteraturMaintenanceSourceRefreshRound4();assert.equal(r.status,'passed');assert.equal(r.round,4);assert.equal(r.area_id,'narratologi_prosa');assert.equal(r.sources_checked,12);assert.equal(r.authoritative_replacements,5);assert.equal(r.direct_live,5);assert.equal(r.redirect_retained,2);assert.equal(r.pathway_sources,384);assert.equal(r.canonical_areas,28);assert.equal(r.assessed_articles,168);assert.equal(r.maintained_areas_total,4);assert.equal(r.next_gate,'maintenance_and_source_refresh');});\n");

          let workflow=fs.readFileSync(workflowPath,'utf8');
          const pathAnchor="      - 'data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/sprak_stil_retorikk/claims.json'\n";
          if(!workflow.includes("foundation_texts/narratologi_prosa/claims.json")) workflow=workflow.replace(pathAnchor,pathAnchor+"      - 'data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/narratologi_prosa/claims.json'\n");
          const matAnchor="      - 'scripts/materialize-litteratur-poetics-style-v1.mjs'\n";
          if(!workflow.includes("scripts/materialize-litteratur-narrative-poetry-v1.mjs")) workflow=workflow.replace(matAnchor,matAnchor+"      - 'scripts/materialize-litteratur-narrative-poetry-v1.mjs'\n");
          const auditAnchor="      - 'scripts/audit-litteratur-maintenance-source-refresh-round3.mjs'\n";
          if(!workflow.includes("scripts/audit-litteratur-maintenance-source-refresh-round4.mjs")) workflow=workflow.replace(auditAnchor,auditAnchor+"      - 'scripts/audit-litteratur-maintenance-source-refresh-round4.mjs'\n");
          const testAnchor="      - 'tests/litteratur-maintenance-source-refresh-round3.test.mjs'\n";
          if(!workflow.includes("tests/litteratur-maintenance-source-refresh-round4.test.mjs")) workflow=workflow.replace(testAnchor,testAnchor+"      - 'tests/litteratur-maintenance-source-refresh-round4.test.mjs'\n");
          const stepAnchor="          node --test tests/litteratur-maintenance-source-refresh-round3.test.mjs\n";
          if(!workflow.includes('Audit Litteratur source refresh round 4')) workflow=workflow.replace(stepAnchor,stepAnchor+"      - name: Audit Litteratur source refresh round 4\n        run: |\n          node --check scripts/audit-litteratur-maintenance-source-refresh-round4.mjs\n          node scripts/audit-litteratur-maintenance-source-refresh-round4.mjs\n          node --test tests/litteratur-maintenance-source-refresh-round4.test.mjs\n");
          fs.writeFileSync(workflowPath,workflow);
          NODE

          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-fagverk-litteratur-legacy-theory.mjs --write-report
          node --check scripts/audit-litteratur-maintenance-source-refresh-round4.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round1.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round2.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round3.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round4.mjs
          node --test tests/litteratur-maintenance-source-refresh-round1.test.mjs tests/litteratur-maintenance-source-refresh-round2.test.mjs tests/litteratur-maintenance-source-refresh-round3.test.mjs tests/litteratur-maintenance-source-refresh-round4.test.mjs
          node scripts/audit-litteratur-assessment-v1.mjs
