          node --test tests/litteratur-assessment-v1.test.mjs tests/litteratur-theory-integrity.test.mjs tests/fagverk-litteratur-legacy-theory-audit.test.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/build-fagverk-release-manifest.mjs --check

          allowed='^.github/workflows/litteratur-maintenance-integrity.yml$|^data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/narratologi_prosa/claims.json$|^data/fagverk/fagverk_release.json$|^data/fagverk/litteratur/maintenance/source-refresh-round4-2026-09-05.json$|^data/knowledge/subjects/litteratur/knowledge_units.generated.json$|^data/quiz/litteratur/litteratur_subject_pathways_v1.json$|^reports/fagverk/litteratur-legacy-theory-audit.json$|^scripts/audit-litteratur-maintenance-source-refresh-round4.mjs$|^scripts/materialize-litteratur-narrative-poetry-v1.mjs$|^tests/litteratur-maintenance-source-refresh-round4.test.mjs$|^.github/workflows/tmp-litteratur-round4-materialize.yml$'
