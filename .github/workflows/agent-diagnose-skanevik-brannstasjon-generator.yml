name: Diagnose Skånevik brannstasjon generator

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/fill-skanevik-brannstasjon-rounds-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false
      - name: Run embedded generator and record traceback
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, re, traceback, zlib
          from pathlib import Path
          workflow = Path('.github/workflows/agent-fill-skanevik-brannstasjon-rounds.yml').read_text(encoding='utf-8')
          match = re.search(r"b64decode\('''([^']+)'''\)", workflow, re.S)
          report = Path('reports/skanevik-brannstasjon-generator-error.txt')
          try:
              if not match:
                  raise RuntimeError('Embedded generator not found')
              code = zlib.decompress(base64.b64decode(match.group(1))).decode('utf-8')
              exec(code, {})
              report.write_text('GENERATOR_OK\n', encoding='utf-8')
          except Exception:
              report.write_text(traceback.format_exc(), encoding='utf-8')
          print(report.read_text(encoding='utf-8'))
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "History Go data agent"
          git config user.email "history-go-agent@users.noreply.github.com"
          git add reports/skanevik-brannstasjon-generator-error.txt
          if git diff --cached --quiet; then
            echo "Diagnostic unchanged"
          else
            git commit -m "Record Skånevik brannstasjon generator diagnostic"
            git push origin HEAD:${{ github.head_ref }}
          fi
