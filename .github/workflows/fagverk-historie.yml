name: Fagverk Historie

on:
  pull_request:
    paths:
      - 'fagverk.html'
      - 'fagverk-forside.html'
      - 'css/fagverk-general.css'
      - 'data/fag/historie/**'
      - 'data/fag/profiles/**'
      - 'data/badges/historie.json'
      - 'data/fagverk/historie/**'
      - 'js/fagverk-subject-core.js'
      - 'js/fagverk-subject-model.js'
      - 'js/fagverk.js'
      - 'scripts/audit-fagverk-historie.mjs'
      - 'tools/audit-historie-universal-coverage.mjs'
      - 'tools/validate-historie-curriculum-architecture.mjs'
      - 'tools/validate-historie-period-modules.mjs'
      - 'tools/materialize-historie-period-modules.mjs'
      - 'tools/audit-historie-canonical-emner.mjs'
      - 'tools/audit-historie-semantic-hook-alignment.mjs'
      - 'tools/audit-historie-source-authority.mjs'
      - 'tools/audit-historie-completion.mjs'
      - 'tools/audit-historie-theory-integrity.mjs'
      - 'tools/validate-historie-editorial-quality.mjs'
      - 'tools/materialize-historie-editorial-chapters.mjs'
      - 'package.json'
      - 'tests/fagverk-historie.test.mjs'
      - 'tests/historie-curriculum-architecture.test.mjs'
      - 'tests/historie-period-modules.test.mjs'
      - 'tests/historie-canonical-emne-identity.test.mjs'
      - 'tests/historie-curriculum-rendering.test.mjs'
      - 'tests/historie-editorial-quality.test.mjs'
      - 'tests/historie-completion.test.mjs'
      - 'tests/historie-theory-integrity.test.mjs'
      - 'docs/HISTORY_CURRICULUM_ARCHITECTURE_V1.md'
      - 'reports/historie-canonical-migration/**'
      - 'reports/historie-universal-coverage/**'
      - '.github/workflows/fagverk-historie.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate materialized Historie subject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate syntax and deterministic reports
        run: |
          node --check scripts/audit-fagverk-historie.mjs
          node --check tools/validate-historie-curriculum-architecture.mjs
          node --check tools/validate-historie-period-modules.mjs
          node --check tools/materialize-historie-period-modules.mjs
          node --check tools/audit-historie-canonical-emner.mjs
          node --check tools/audit-historie-semantic-hook-alignment.mjs
          node --check tools/audit-historie-source-authority.mjs
          node --check tools/audit-historie-completion.mjs
          node --check tools/audit-historie-theory-integrity.mjs
          node --check tools/validate-historie-editorial-quality.mjs
          node --check tools/materialize-historie-editorial-chapters.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node tools/validate-historie-curriculum-architecture.mjs
          node tools/validate-historie-period-modules.mjs
          node tools/materialize-historie-period-modules.mjs --check
          node tools/audit-historie-canonical-emner.mjs
          node tools/audit-historie-semantic-hook-alignment.mjs
          node tools/validate-historie-editorial-quality.mjs
          node tools/materialize-historie-editorial-chapters.mjs --check
          node scripts/audit-fagverk-historie.mjs
          node tools/audit-historie-universal-coverage.mjs
          node tools/audit-historie-source-authority.mjs
          node tools/audit-historie-completion.mjs
          node tools/audit-historie-theory-integrity.mjs
      - name: Validate Fagverk and Historie contracts
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/historie-curriculum-architecture.test.mjs
          node --test tests/historie-period-modules.test.mjs
          node --test tests/historie-canonical-emne-identity.test.mjs
          node --test tests/historie-curriculum-rendering.test.mjs
          node --test tests/historie-editorial-quality.test.mjs
          node --test tests/historie-completion.test.mjs
          node --test tests/historie-theory-integrity.test.mjs
          node --test tests/fagverk-historie.test.mjs
