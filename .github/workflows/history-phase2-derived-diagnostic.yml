name: History phase 2 derived sync

on:
  push:
    branches:
      - agent/historie-tid-periodisering-phase-2-main-refresh

permissions:
  contents: write

jobs:
  sync-derived:
    if: ${{ !contains(github.event.head_commit.message, '[derived-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate canonical Knowledge data
        run: npm run knowledge:canonical:write

      - name: Rebuild History production contexts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { runBuildQuizProductionContext } from './scripts/build-quiz-production-context.mjs';

          const manifest = JSON.parse(await fs.readFile('data/fag/fag_manifest.json', 'utf8'));
          const targets = manifest.historie?.quizProduction?.targets || {};
          for (const [targetId, config] of Object.entries(targets)) {
            const outputPath = path.resolve('data/fag', config.context_artifact);
            await runBuildQuizProductionContext({
              root: process.cwd(),
              categoryId: 'historie',
              targetId,
              outputPath
            });
            console.log(`Rebuilt ${targetId}: ${path.relative(process.cwd(), outputPath)}`);
          }
          NODE

      - name: Validate derived contracts
        run: |
          npm run knowledge:canonical:check
          npm run knowledge:legacy:check
          npm run audit:knowledge
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding

      - name: Capture generated diff
        if: always()
        shell: bash
        run: |
          git status --short | tee /tmp/history-phase2-derived-status.txt
          git diff --stat | tee /tmp/history-phase2-derived-stat.txt
          git diff --name-only | tee /tmp/history-phase2-derived-files.txt
          git diff --binary > /tmp/history-phase2-derived.patch

      - name: Commit deterministic derived files
        shell: bash
        run: |
          git add data/knowledge data/quiz \
            reports/knowledge-contract-audit.json \
            reports/knowledge-id-backfill.json \
            reports/knowledge-universe-readers.json
          if git diff --cached --quiet; then
            echo 'No derived changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Historie: synkroniser avledede kontrakter [derived-sync]'
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-phase2-derived-sync
          path: |
            /tmp/history-phase2-derived-status.txt
            /tmp/history-phase2-derived-stat.txt
            /tmp/history-phase2-derived-files.txt
            /tmp/history-phase2-derived.patch
          if-no-files-found: warn
