name: Temporary Fagverk Natur pilot

on:
  push:
    branches: [feature/fagverk-natur-pilot]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fagverk-natur-pilot
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Materialize Natur pilot
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const writeJson = (file, value) => fs.writeFileSync(file, `${JSON.stringify(value, null, 2)}\n`);

          const portalPath = 'data/fagverk/fagverk_portal.json';
          const portal = JSON.parse(fs.readFileSync(portalPath, 'utf8'));
          portal.version = '1.1.0';
          portal.updatedAt = '2026-07-29';
          const portalNature = portal.categories.find((row) => row.id === 'natur');
          if (!portalNature) throw new Error('Natur mangler i Fagverk-portalen');
          portalNature.subjectPage = 'fagverk.html?subject=natur';
          portalNature.subjectStatus = 'materialized';
          writeJson(portalPath, portal);

          const statusPath = 'data/fagverk/subject_status.json';
          const status = JSON.parse(fs.readFileSync(statusPath, 'utf8'));
          status.version = '1.3.0';
          status.updatedAt = '2026-07-29';
          const statusNature = status.subjects.find((row) => row.id === 'natur');
          if (!statusNature) throw new Error('Natur mangler i Fagverk-status');
          statusNature.navigationStatus = 'materialized';
          statusNature.assessmentStatus = 'audited';
          statusNature.editorialStatus = 'structure_ready';
          statusNature.nextGate = 'phase_4_chapters';
          statusNature.note = 'Natur er første fase-2-pilot og er individuelt auditert gjennom standard canonical v4.5-adapteren.';
          writeJson(statusPath, status);

          const badgePath = 'data/fag/natur/merke_natur (1).html';
          let badgeHtml = fs.readFileSync(badgePath, 'utf8');
          const oldBackLink = '    <a href="../../../merker/merker.html" class="tilbake-knapp">← Tilbake til merker</a>';
          const newBackLinks = `    <a href="../../../merker/merker.html" class="tilbake-knapp">← Tilbake til merker</a>\n    <a href="../../../fagverk-forside.html" class="tilbake-knapp">Fagverket</a>\n    <a href="../../../fagverk.html?subject=natur" class="tilbake-knapp">Åpne faget →</a>`;
          if (!badgeHtml.includes('fagverk.html?subject=natur')) {
            if (!badgeHtml.includes(oldBackLink)) throw new Error('Fant ikke innsettingspunkt i Natur-merkesiden');
            badgeHtml = badgeHtml.replace(oldBackLink, newBackLinks);
          }
          fs.writeFileSync(badgePath, badgeHtml);

          const auditScript = `#!/usr/bin/env node
          import fs from 'node:fs';
          import path from 'node:path';
          import vm from 'node:vm';
          import { fileURLToPath } from 'node:url';
          import { isDeepStrictEqual } from 'node:util';

          const ROOT = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const PATHS = Object.freeze({
            core: 'js/fagverk-subject-core.js',
            categories: 'data/categories/category_contract.json',
            manifest: 'data/fag/fag_manifest.json',
            portal: 'data/fagverk/fagverk_portal.json',
            inventory: 'data/fagverk/subject_inventory.json',
            status: 'data/fagverk/subject_status.json',
            registry: 'data/fagverk/fagverk_registry.json',
            badge: 'data/badges/natur.json',
            badgePage: 'data/fag/natur/merke_natur (1).html',
            report: 'reports/fagverk/natur-pilot-audit.json'
          });

          const absolute = (relativePath) => path.join(ROOT, relativePath);
          const read = (relativePath) => fs.readFileSync(absolute(relativePath), 'utf8');
          const readJson = (relativePath) => JSON.parse(read(relativePath));
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          function loadCore() {
            const sandbox = { console };
            sandbox.globalThis = sandbox;
            vm.runInNewContext(read(PATHS.core), sandbox, { filename: PATHS.core });
            assert(sandbox.HGFagverkSubjectCore, 'Fagverk-core ble ikke eksponert');
            return sandbox.HGFagverkSubjectCore;
          }

          export function auditNaturePilot({ writeReport = false, checkReport = true } = {}) {
            const CORE = loadCore();
            const categories = readJson(PATHS.categories);
            const manifest = readJson(PATHS.manifest);
            const portal = readJson(PATHS.portal);
            const inventory = readJson(PATHS.inventory);
            const status = readJson(PATHS.status);
            const registry = readJson(PATHS.registry);
            const badge = readJson(PATHS.badge);
            const portalEntry = portal.categories.find((row) => row.id === 'natur');
            const inventoryEntry = inventory.subjects.find((row) => row.id === 'natur');
            const statusEntry = status.subjects.find((row) => row.id === 'natur');
            const manifestEntry = manifest.natur;

            assert(categories.fagSubjects.includes('natur'), 'Natur mangler i kategorikontrakten');
            assert(manifestEntry && portalEntry && inventoryEntry && statusEntry, 'Natur mangler i manifest, portal, inventar eller status');
            assert(portalEntry.subjectStatus === 'materialized', 'Natur er ikke materialized i portalen');
            assert(portalEntry.subjectPage === 'fagverk.html?subject=natur', 'Natur har feil canonical fagsiderute');
            assert(statusEntry.navigationStatus === 'materialized', 'Natur har usynkron navigasjonsstatus');
            assert(statusEntry.assessmentStatus === 'audited', 'Natur er ikke individuelt audited');
            assert(statusEntry.editorialStatus === 'structure_ready', 'Natur er ikke structure_ready');
            assert(inventoryEntry.schemaFamily === 'standard_canonical', 'Natur bruker feil schemafamilie');

            const source = {};
            for (const field of ['pensum', 'emner', 'fagkart', 'methods']) {
              const relativePath = CORE.resolveManifestPointer(manifestEntry[field]);
              assert(fs.existsSync(absolute(relativePath)), `Natur mangler required source: \${field}`);
              source[field === 'emner' ? 'emners' : field] = readJson(relativePath);
            }

            const model = CORE.normalizeSubject({
              subjectId: 'natur',
              categoryLabel: categories.labels.natur,
              categoryDescription: categories.decisions?.natur,
              schemaFamily: inventoryEntry.schemaFamily,
              manifestEntry,
              portalEntry,
              inventoryEntry,
              statusEntry,
              registry,
              badge,
              source
            });

            const expectedDomainOrder = [
              'okosystem_mangfold_habitat',
              'vann_hydrologi_kretslop',
              'klima_energi_resiliens',
              'geologi_landskap_tid',
              'urban_okologi_gronnstruktur',
              'miljopavirkning_forvaltning_regenerasjon'
            ];
            const actualDomainOrder = model.domains.map((domain) => domain.id);
            assert(model.subject.id === 'natur', 'Normalisert subject-id er feil');
            assert(model.subject.title === 'Natur & miljø', `Uventet Natur-tittel: \${model.subject.title}`);
            assert(model.subject.adapter === 'standard', 'Natur bruker ikke standard-adapteren');
            assert(model.subject.routes.subject === portalEntry.subjectPage, 'Fagsideruten løses ikke gjennom portalregisteret');
            assert(model.subject.routes.badge === portalEntry.badgePage, 'Merkesideruten løses ikke gjennom portalregisteret');
            assert(isDeepStrictEqual(actualDomainOrder, expectedDomainOrder), 'Natur-fagområdene vises ikke i canonical rekkefølge');
            assert(model.summary.domainCount === 6, `Forventet 6 fagområder, fikk \${model.summary.domainCount}`);
            assert(model.summary.emneCount === 33, `Forventet 33 emner, fikk \${model.summary.emneCount}`);
            assert(model.summary.methodCount === 30, `Forventet 30 metoder, fikk \${model.summary.methodCount}`);
            assert(model.summary.mappingCount === 33, `Forventet 33 mappings, fikk \${model.summary.mappingCount}`);
            assert(model.summary.hookCount === 60, `Forventet 60 hooks, fikk \${model.summary.hookCount}`);
            assert(model.chapters.length === 0, 'Natur skal ikke få oppdiktede lærekapitler ved materialisering');

            for (const domain of model.domains) {
              assert(domain.label && domain.definition, `Natur-fagområdet \${domain.id} mangler label eller definisjon`);
              for (const emneId of domain.emneIds) assert(model.emnersById.has(emneId), `Natur-fagområdet \${domain.id} peker til ukjent emne \${emneId}`);
              for (const methodId of domain.methodIds) assert(model.methodsById.has(methodId), `Natur-fagområdet \${domain.id} peker til ukjent metode \${methodId}`);
            }
            for (const emne of model.emners) {
              assert(emne.subjectId === 'natur', `Emnet \${emne.id} har feil subject-id`);
              assert(model.domainsById.has(emne.domainId), `Emnet \${emne.id} peker til ukjent fagområde`);
              assert(emne.title && emne.definition, `Emnet \${emne.id} mangler tittel eller definisjon`);
              for (const methodId of emne.methodIds) assert(model.methodsById.has(methodId), `Emnet \${emne.id} peker til ukjent metode \${methodId}`);
            }
            for (const method of model.methods) assert(method.title && method.description, `Metoden \${method.id} mangler navn eller forklaring`);

            const badgePage = read(PATHS.badgePage);
            assert(badgePage.includes('../../../fagverk.html?subject=natur'), 'Natur-merkesiden lenker ikke til fagsiden');
            assert(badgePage.includes('../../../fagverk-forside.html'), 'Natur-merkesiden lenker ikke til Fagverkforsiden');
            assert(!JSON.stringify(model.subject).toLocaleLowerCase('nb-NO').includes('politikk'), 'Natur-modellen inneholder politikkspesifikk resttekst');

            const report = {
              schema: 'history_go_fagverk_natur_pilot_audit_v1',
              version: '1.0.0',
              status: 'phase_2_natur_pilot_passed',
              generatedFrom: PATHS,
              subject: {
                id: model.subject.id,
                title: model.subject.title,
                schemaFamily: inventoryEntry.schemaFamily,
                adapter: model.subject.adapter,
                badgePage: model.subject.routes.badge,
                subjectPage: model.subject.routes.subject,
                assessmentStatus: statusEntry.assessmentStatus,
                editorialStatus: statusEntry.editorialStatus
              },
              summary: {
                domainCount: model.summary.domainCount,
                emneCount: model.summary.emneCount,
                methodCount: model.summary.methodCount,
                mappingCount: model.summary.mappingCount,
                hookCount: model.summary.hookCount,
                chapterCount: model.chapters.length,
                placeCount: model.places.length
              },
              canonicalDomainOrder: actualDomainOrder,
              gates: {
                manifestFirst: true,
                normalizedModel: true,
                canonicalDomainOrder: true,
                emneReferencesResolved: true,
                methodReferencesResolved: true,
                mappingsResolved: true,
                badgeAndSubjectRoutes: true,
                noGeneratedChapters: true,
                politicsResiduals: 0
              }
            };

            if (writeReport) {
              fs.mkdirSync(path.dirname(absolute(PATHS.report)), { recursive: true });
              fs.writeFileSync(absolute(PATHS.report), `\${JSON.stringify(report, null, 2)}\\n`);
            }
            if (checkReport) {
              const committed = readJson(PATHS.report);
              assert(isDeepStrictEqual(committed, report), `\${PATHS.report} er utdatert`);
            }
            return { report, model };
          }

          function main() {
            const args = new Set(process.argv.slice(2));
            try {
              const result = auditNaturePilot({ writeReport: args.has('--write-report'), checkReport: !args.has('--no-check-report') });
              console.log(`Natur-pilot OK: \${result.report.summary.domainCount} fagområder, \${result.report.summary.emneCount} emner og \${result.report.summary.methodCount} metoder.`);
            } catch (error) {
              console.error(`Natur-pilot FEIL: \${error.message}`);
              process.exitCode = 1;
            }
          }

          if (process.argv[1] && path.resolve(process.argv[1]) === fileURLToPath(import.meta.url)) main();
          `;
          fs.writeFileSync('scripts/audit-fagverk-natur-pilot.mjs', auditScript.replace(/^          /gm, ''));

          const testFile = `import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { auditNaturePilot } from '../scripts/audit-fagverk-natur-pilot.mjs';

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');

          test('Natur er individuelt materialisert gjennom standard canonical-adapteren', () => {
            const { report } = auditNaturePilot();
            assert.equal(report.subject.id, 'natur');
            assert.equal(report.subject.adapter, 'standard');
            assert.equal(report.subject.assessmentStatus, 'audited');
            assert.equal(report.subject.editorialStatus, 'structure_ready');
            assert.deepEqual(report.summary, {
              domainCount: 6,
              emneCount: 33,
              methodCount: 30,
              mappingCount: 33,
              hookCount: 60,
              chapterCount: 0,
              placeCount: 0
            });
          });

          test('Natur-merkesiden tilbyr både Fagverket og den materialiserte fagsiden', () => {
            const html = fs.readFileSync(path.join(root, 'data/fag/natur/merke_natur (1).html'), 'utf8');
            assert.match(html, /fagverk-forside\\.html/);
            assert.match(html, /fagverk\\.html\\?subject=natur/);
          });
          `;
          fs.writeFileSync('tests/fagverk-natur-pilot.test.mjs', testFile.replace(/^          /gm, ''));

          const readmePath = 'reports/fagverk/README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          readme = readme.replace(
            '- `general-engine-audit.json` — evidens for den felles fagsidemotoren, manifest-first lasting, adaptergrensen, normalisert modell og fravær av politikkfallback.',
            '- `general-engine-audit.json` — evidens for den felles fagsidemotoren, manifest-first lasting, adaptergrensen, normalisert modell og fravær av politikkfallback.\n- `natur-pilot-audit.json` — individuell fase-2-evidens for Natur: canonical rekkefølge, 6 fagområder, 33 emner, 30 metoder, 33 mappings og 60 hooks.'
          );
          readme = readme.replace(
            'Politikk er første fag som er individuelt auditert gjennom den generelle motoren og står derfor `materialized`, `audited` og `structure_ready`. Dette betyr at fagstruktur, dypkoblinger, metoder, progresjonslesing og eksisterende kapitler kan vises gjennom felles runtime. Det betyr ikke at politikk er redaksjonelt `complete`.\n\nDe fire neste pilotene er `natur`, `religion`, `by` og `vitenskap`. De skal materialiseres individuelt og må passere samme gate før portalstatusen endres.',
            'Politikk og Natur er individuelt auditert gjennom den generelle motoren og står `materialized`, `audited` og `structure_ready`. Natur er første fase-2-pilot og dokumenterer standard canonical v4.5-familien med 6 fagområder, 33 emner, 30 metoder, 33 mappings og 60 hooks. Statusen betyr at fagstruktur, dypkoblinger, metoder og progresjonslesing kan vises gjennom felles runtime; den betyr ikke at fagene er redaksjonelt `complete`.\n\nDe gjenstående fase-2-pilotene er `religion`, `by` og `vitenskap`, med Teknologi som nested spesialisering under Vitenskap. Hvert fag skal materialiseres individuelt og må passere samme gate før portalstatusen endres.'
          );
          fs.writeFileSync(readmePath, readme);
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Generate deterministic reports
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs --write-report --no-check-report
          node scripts/audit-fagverk-general-engine.mjs --write-report --no-check-report
          node scripts/audit-fagverk-natur-pilot.mjs --write-report --no-check-report
      - name: Validate Natur pilot
        run: |
          node --check scripts/audit-fagverk-natur-pilot.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-natur-pilot.mjs
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-natur-pilot.test.mjs
          node --test tests/fagverk-portal.test.mjs
          node --test tests/fagverk-documentation-contract.test.mjs
          npm run typecheck:web
      - name: Commit materialized pilot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk/fagverk_portal.json data/fagverk/subject_status.json 'data/fag/natur/merke_natur (1).html' scripts/audit-fagverk-natur-pilot.mjs tests/fagverk-natur-pilot.test.mjs reports/fagverk/README.md reports/fagverk/subject-baseline.json reports/fagverk/general-engine-audit.json reports/fagverk/natur-pilot-audit.json
          git commit -m "Materialiser Natur som første fase-2-pilot"
          git push origin HEAD:feature/fagverk-natur-pilot
