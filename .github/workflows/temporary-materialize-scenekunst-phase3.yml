name: Temporary materialize Scenekunst phase 3

on:
  pull_request:
    paths:
      - "tools/materialize-scenekunst-phase3-once.mjs"
      - ".github/workflows/temporary-materialize-scenekunst-phase3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Materialize and validate Scenekunst
        run: node tools/materialize-scenekunst-phase3-once.mjs
      - name: Remove one-shot materializer
        run: |
          rm tools/materialize-scenekunst-phase3-once.mjs
          rm .github/workflows/temporary-materialize-scenekunst-phase3.yml
      - name: Commit materialized tree
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Materialiser Scenekunst Fase 3'
          git push origin "HEAD:${HEAD_BRANCH}"
