name: Targeted Knowledge review

on:
  pull_request:
    paths:
      - 'scripts/apply-targeted-knowledge-review.mjs'
      - '.github/workflows/targeted-knowledge-review.yml'

permissions:
  contents: write

jobs:
  review:
    if: github.event.pull_request.head.ref == 'agent/targeted-knowledge-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/targeted-knowledge-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply targeted review migration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-targeted-knowledge-review.mjs')
          source = path.read_text()
          source = source.replace('throw new Error(`Missing ${label}`);', 'throw new Error("Missing " + label);')
          source = source.replace('const meta = { correctAnswers, conceptsCorrect, emnersTouched: emnerTouched, emnerTouched, answers };', 'const meta = { correctAnswers, conceptsCorrect, emnerTouched, answers };')
          source = source.replace('${', '\\${')
          path.write_text(source)
          PY
          node scripts/apply-targeted-knowledge-review.mjs
      - name: Build and test review flow
        run: |
          npm run build:web
          npm run typecheck:web
          npm run test:knowledge-core
          npx playwright install --with-deps chromium
          npm run test:knowledge-browser
      - name: Commit verified review runtime
        run: |
          git config user.name 'History GO CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset -- scripts/apply-targeted-knowledge-review.mjs .github/workflows/targeted-knowledge-review.yml
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Add targeted Knowledge repetition'
          git push origin HEAD:agent/targeted-knowledge-review
