name: TEMP materialize Språk field 11 and field 12 source-first

on:
  push:
    branches:
      - agent/fagverk-sprak-lingvistikk-field-11-fulltext-field-12-source-first-20260831

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify field 11 source-first baseline
        run: |
          node scripts/brief-sprak-lingvistikk-psycholinguistics-language-acquisition-processing-sources-v1.mjs
          node --test tests/sprak-lingvistikk-psycholinguistics-language-acquisition-processing-source-brief-v1.test.mjs
      - name: Materialize field 11 and prepare field 12
        run: node scripts/tmp-materialize-sprak-field11-field12-phase.mjs
      - name: Fix metadata verifier regex
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/brief-sprak-lingvistikk-corpus-field-documentation-language-resources-reproducibility-sources-v1.mjs')
          s = p.read_text()
          old = "/metadata/u.test(bd)&&/stable identifiers/u.test(bd)&&/olac/cmdi/u.test(bd)"
          new = "/metadata/u.test(bd)&&/stable identifiers/u.test(bd)&&/olac/u.test(bd)&&/cmdi/u.test(bd)"
          if old not in s:
              raise SystemExit('Expected invalid OLAC/CMDI verifier token not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Run strict field gates
        run: |
          node --check scripts/audit-sprak-lingvistikk-psycholinguistics-language-acquisition-processing-fulltext-v1.mjs
          node --check scripts/brief-sprak-lingvistikk-corpus-field-documentation-language-resources-reproducibility-sources-v1.mjs
          node --check scripts/materialize-sprak-lingvistikk-psycholinguistics-language-acquisition-processing-fulltext-v1.mjs
          node scripts/audit-sprak-lingvistikk-psycholinguistics-language-acquisition-processing-fulltext-v1.mjs
          node scripts/brief-sprak-lingvistikk-corpus-field-documentation-language-resources-reproducibility-sources-v1.mjs
          node --test tests/sprak-lingvistikk-psycholinguistics-language-acquisition-processing-fulltext-v1.test.mjs
          node --test tests/sprak-lingvistikk-corpus-field-documentation-language-resources-reproducibility-source-brief-v1.test.mjs
          node scripts/audit-sprak-lingvistikk-reconciliation-v1.mjs
          node --test tests/sprak-lingvistikk-reconciliation-v1.test.mjs
          node scripts/materialize-sprak-lingvistikk-psycholinguistics-language-acquisition-processing-fulltext-v1.mjs
          git diff --check
      - name: Commit permanent canonical state only after green gates
        run: |
          rm -f scripts/tmp-materialize-sprak-field11-field12-phase.mjs
          rm -f .github/workflows/tmp-materialize-sprak-field11-field12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Materialize Språk og lingvistikk field 11 [materialized-field11-12]"
          git push origin HEAD:agent/fagverk-sprak-lingvistikk-field-11-fulltext-field-12-source-first-20260831
