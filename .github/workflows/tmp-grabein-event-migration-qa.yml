name: Gråbein event migration QA (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-grabein-event-migration-qa.yml'
permissions:
  contents: read
concurrency:
  group: tmp-grabein-event-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify source and runtime contracts
        run: node --test tests/museumsleiligheten-grabein-collections.test.mjs
      - name: Rebuild quiz context and Fagverk release
        run: |
          node scripts/build-place-open-payloads.mjs --check
          node scripts/build-quiz-production-context.mjs --category historie --target museumsleiligheten_grabein --output data/quiz/production_context/historie/museumsleiligheten_grabein.json
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Emit generated data
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const [id,path] of [['QUIZ','data/quiz/production_context/historie/museumsleiligheten_grabein.json'],['RELEASE','data/fagverk/fagverk_release.json']]) {
            const s=fs.readFileSync(path,'utf8'),n=Math.ceil(s.length/1200);
            console.log('HG_GEN_START '+id+' '+n);
            for(let i=0;i<n;i++) console.log('HG_GEN_CHUNK '+id+' '+i+' '+JSON.stringify(s.slice(i*1200,(i+1)*1200)));
            console.log('HG_GEN_END '+id+' '+n);
          }
          NODE
      - name: Verify real PlaceCard Chrome for event collection
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          export CHROME_BIN
          node scripts/tmp-grabein-event-qa.mjs
