name: Temporary Jordal ungdomshall geometry intake

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  intake:
    if: github.head_ref == 'data/oslo-jordal-ungdomshall-geometry-intake'
    runs-on: ubuntu-latest
    steps:
      - name: Check out intake branch
        uses: actions/checkout@v4
        with:
          ref: data/oslo-jordal-ungdomshall-geometry-intake
          fetch-depth: 0

      - name: Query named map objects and save raw results
        shell: bash
        run: |
          set -euo pipefail
          REPORTDIR="reports/geonorge-address-jordal-ungdomshall-20260720/geometry-resolution"
          mkdir -p "$REPORTDIR"

          curl -fsSLG \
            -A "History-Go coordinate audit/1.0" \
            --data-urlencode "q=Jordal ungdomshall, Oslo, Norway" \
            --data-urlencode "format=jsonv2" \
            --data-urlencode "limit=10" \
            --data-urlencode "polygon_geojson=1" \
            "https://nominatim.openstreetmap.org/search" \
            | tee "$REPORTDIR/nominatim-jordal-ungdomshall.json"

          cat > /tmp/jordal-overpass.ql <<'EOF'
          [out:json][timeout:60];
          (
            nwr["name"~"^Jordal ungdomshall$",i](59.905,10.775,59.916,10.793);
            nwr["name"~"Jordal.*ungdomshall",i](59.905,10.775,59.916,10.793);
          );
          out center tags geom;
          EOF

          curl -fsSL \
            -A "History-Go coordinate audit/1.0" \
            --data-urlencode "data@/tmp/jordal-overpass.ql" \
            "https://overpass-api.de/api/interpreter" \
            | tee "$REPORTDIR/overpass-jordal-ungdomshall.json"

      - name: Resolve exact building identity and geometry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          from pathlib import Path

          reportdir = Path('reports/geonorge-address-jordal-ungdomshall-20260720/geometry-resolution')
          nom = json.loads((reportdir / 'nominatim-jordal-ungdomshall.json').read_text())
          over = json.loads((reportdir / 'overpass-jordal-ungdomshall.json').read_text())
          index = json.loads(Path('data/places/places_index.json').read_text())

          def norm(s):
              return ''.join(ch.lower() for ch in str(s) if ch.isalnum())

          exact_name = norm('Jordal ungdomshall')
          nom_exact = [x for x in nom if norm(x.get('name') or x.get('display_name','').split(',')[0]) == exact_name]
          over_exact = [x for x in over.get('elements',[]) if norm(x.get('tags',{}).get('name','')) == exact_name]

          chosen = None
          source = None

          # Prefer explicit polygon/way/relation center from Overpass.
          if over_exact:
              ranked = sorted(over_exact, key=lambda x: 0 if x.get('type') in ('way','relation') else 1)
              e = ranked[0]
              if 'center' in e:
                  lat, lon = e['center']['lat'], e['center']['lon']
              else:
                  lat, lon = e.get('lat'), e.get('lon')
              chosen = {
                  'lat': lat,
                  'lon': lon,
                  'osmType': e.get('type'),
                  'osmId': e.get('id'),
                  'tags': e.get('tags',{}),
                  'geometryPointCount': len(e.get('geometry',[]) or [])
              }
              source = 'openstreetmap_named_object_overpass'
          elif nom_exact:
              e = nom_exact[0]
              chosen = {
                  'lat': float(e['lat']),
                  'lon': float(e['lon']),
                  'osmType': e.get('osm_type'),
                  'osmId': e.get('osm_id'),
                  'displayName': e.get('display_name'),
                  'geojsonType': (e.get('geojson') or {}).get('type')
              }
              source = 'openstreetmap_named_object_nominatim'

          def haversine(lat1, lon1, lat2, lon2):
              R = 6371000
              p1, p2 = math.radians(lat1), math.radians(lat2)
              dp = math.radians(lat2-lat1)
              dl = math.radians(lon2-lon1)
              a = math.sin(dp/2)**2 + math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*R*math.asin(math.sqrt(a))

          nearby = []
          if chosen and chosen['lat'] is not None and chosen['lon'] is not None:
              for p in index:
                  if isinstance(p.get('lat'), (int,float)) and isinstance(p.get('lon'), (int,float)):
                      d = haversine(chosen['lat'], chosen['lon'], p['lat'], p['lon'])
                      if d <= 350:
                          nearby.append({
                              'id': p.get('id'), 'name': p.get('name'), 'category': p.get('category'),
                              'distanceMeters': round(d, 1)
                          })
              nearby.sort(key=lambda x: x['distanceMeters'])

          decision = {
              'version': '2026-07-20-named-object-geometry',
              'placeId': 'jordal_ungdomshall',
              'candidateName': 'Jordal ungdomshall',
              'status': 'verified_geometry_candidate' if chosen else 'needs_manual_geometry_review',
              'productionGate': 'ready_for_canonical_production' if chosen else 'blocked',
              'primaryCategory': 'sport',
              'identity': {
                  'currentName': 'Jordal ungdomshall',
                  'currentAddress': 'Jordalgata 12, 0657 Oslo',
                  'built': '1988/1989',
                  'function': 'Separate indoor ice hall for training, figure skating, ice hockey and public skating.',
                  'distinctFrom': ['Jordal Amfi', 'Jordal idrettshall']
              },
              'namedObjectResolution': {
                  'source': source,
                  'chosen': chosen,
                  'nominatimExactMatches': nom_exact,
                  'overpassExactMatches': over_exact
              },
              'coordinate': None if not chosen else {
                  'lat': chosen['lat'],
                  'lon': chosen['lon'],
                  'r': 60,
                  'locatorType': 'building',
                  'sourceProvider': 'openstreetmap',
                  'sourceObjectId': f"osm:{chosen['osmType']}:{chosen['osmId']}",
                  'geocodeAccuracy': 'named_object_geometry',
                  'coordRole': 'display_marker',
                  'coordStatus': 'verified_geometry',
                  'coordSource': 'openstreetmap_named_object',
                  'coordType': 'building_centroid',
                  'coordNote': 'Navngitt bygnings-/objektgeometri for Jordal ungdomshall, brukt for å skille hallen fra Jordal Amfi som deler besøksadressen Jordalgata 12.'
              },
              'duplicateGate': {
                  'nearbyWithin350m': nearby,
                  'conclusion': 'Named-object geometry resolves Jordal ungdomshall as a separate physical identity from Jordal Amfi.' if chosen else 'No exact named object geometry was resolved.'
              },
              'sourceBasis': [
                  'Oslo kommune: Jordal idrettspark has two separate ice halls, Jordal Amfi and Jordal ungdomshall.',
                  'Oslo byleksikon: Jordalgata 12 is Jordal ungdomshall; Jordalgata 12a is Jordal idrettshall.',
                  'Oslo kommune: Jordal ungdomshall is an active indoor ice hall with public skating.'
              ],
              'guardrails': [
                  'Do not reuse the Jordal Amfi marker for Jordal ungdomshall.',
                  'Do not apply an arbitrary shared-address point when named building geometry is available.',
                  'Treat the VisitOSLO Jordal skøytebane listing as the public-skating use of Jordal ungdomshall, not as a separate third ice venue.'
              ]
          }
          (reportdir / 'decision.json').write_text(json.dumps(decision, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(decision, ensure_ascii=False, indent=2))
          if not chosen:
              raise SystemExit('No exact named Jordal ungdomshall object resolved')
          PY

      - name: Commit durable geometry intake and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-jordal-ungdomshall-geometry-intake.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve Jordal ungdomshall named building geometry"
          git push origin HEAD:data/oslo-jordal-ungdomshall-geometry-intake
