name: Kvadraturen temporary Garmanngården browser QA
on:
  push:
    branches:
      - research/oslo-sentrum-kvadraturen-v1-six-20261023
    paths:
      - '.github/workflows/kvadraturen-garmanngarden-browser-qa-temp.yml'
permissions:
  contents: read
jobs:
  playthrough:
    name: Garmanngården desktop and mobile quiz playthrough
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Resolve Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Play canonical fullquiz on desktop and mobile
        run: node scripts/verify-place-quiz-browser.mjs garmanngarden
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garmanngarden-browser-evidence
          path: artifacts/place-quiz/garmanngarden/
          retention-days: 14
          if-no-files-found: warn
