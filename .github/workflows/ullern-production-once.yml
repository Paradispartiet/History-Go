name: TEMP Ullern production once

on:
  push:
    branches:
      - agent/ullern-place-production-20260907

permissions:
  contents: write

jobs:
  produce:
    if: startsWith(github.event.head_commit.message, 'Run Ullern production')
    runs-on: ubuntu-latest
    env:
      LOCKED_MAIN: f49051806d941a8d946f7c64c8a3eaf106586a08
      BRANCH: agent/ullern-place-production-20260907
    steps:
      - name: Checkout Ullern branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Lock fresh main
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$LOCKED_MAIN"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize Ullern production
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/ullern-production-once.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const familyBefore = 'family: spec[0], statement:';
          const familyAfter = 'family: spec[0] === "concept" ? "concept_theory" : spec[0], statement:';
          if (!source.includes(familyBefore)) throw new Error('Ullern claim-family patch target missing');
          source = source.replace(familyBefore, familyAfter);
          const storiesBefore = 'storyManifest.files ||= []; addOnce(storyManifest.files, "data/stories/stories_ullern.json"); write("data/stories/stories_manifest.json", storyManifest);';
          const storiesAfter = 'storyManifest.files ||= []; const storyPath = "data/stories/stories_ullern.json"; storyManifest.files = storyManifest.files.filter(entry => typeof entry === "string" ? entry !== storyPath : entry?.path !== storyPath); storyManifest.files.push({ category: "by", entity_id: placeId, path: storyPath }); write("data/stories/stories_manifest.json", storyManifest);';
          if (!source.includes(storiesBefore)) throw new Error('Ullern stories-manifest patch target missing');
          source = source.replace(storiesBefore, storiesAfter);
          const storyTypeBefore = 'id: "st_ullern_banene_apner_boliglandet", quality_profile: "episode_v1", type: "transformation", title: "Da banene åpnet Ullern"';
          const storyTypeAfter = 'id: "st_ullern_banene_apner_boliglandet", quality_profile: "episode_v1", type: "turning_point", title: "Da banene åpnet Ullern"';
          if (!source.includes(storyTypeBefore)) throw new Error('Ullern canonical story-type patch target missing');
          source = source.replace(storyTypeBefore, storyTypeAfter);
          const quizSourcesBefore = 'profile_snapshot: place.quiz_profile, sets';
          const quizSourcesAfter = 'sources: Object.fromEntries(Object.entries(sourceDefs).map(([id, source]) => [id, source.url])), profile_snapshot: place.quiz_profile, sets';
          if (!source.includes(quizSourcesBefore)) throw new Error('Ullern quiz-sources patch target missing');
          source = source.replace(quizSourcesBefore, quizSourcesAfter);
          const contextBefore = 'await runBuildQuizProductionContext({ root, categoryId: "by", targetId: placeId, outputPath: "data/quiz/production_context/by/ullern.json" });';
          const contextAfter = 'const built = await runBuildQuizProductionContext({ root, categoryId: "by", targetId: placeId, outputPath: "data/quiz/production_context/by/ullern.json" }); const quizPack = read(quizFile); quizPack.production_context = { manifest_category: "by", profile: built.profile, standard_version: "3.4", source_brief: "data/quiz/production_briefs/by/ullern.json", context_artifact: "data/quiz/production_context/by/ullern.json", resolved_files: Object.fromEntries(Object.entries(built.resolved_files).map(([key, value]) => [key, value.path])), required_inputs_loaded: built.required_inputs_loaded, pensum_module_ids: built.selected_curriculum.module_ids, emne_ids: built.selected_curriculum.emne_ids, topic_hook_ids: built.selected_curriculum.topic_hook_ids, method_ids: built.selected_curriculum.method_ids, thinker_ids: built.selected_curriculum.thinker_ids, works: built.selected_curriculum.works, source_review_status: built.source_review_status, existing_quiz_audit: built.existing_quiz_audit, profile_decision: built.profile_decision, held_back_candidates: built.held_back_candidates, theory_start_phase: "final", method_start_phase: "final" }; write(quizFile, quizPack);';
          if (!source.includes(contextBefore)) throw new Error('Ullern production-context patch target missing');
          source = source.replace(contextBefore, contextAfter);
          const theoryBefore = 'if (methodId) q.method_ids = [methodId];\n  return q;';
          const theoryAfter = 'if (methodId) q.method_ids = [methodId];\n  if (index === specs.length - 1) { q.topic_hook_id = "urb_byidealer"; q.method_id = methodId; q.thinker_id = "aldo_rossi"; q.work = "The Architecture of the City"; q.theory_ref = { topic_hook_id: q.topic_hook_id, thinker_id: q.thinker_id, work: q.work, why_it_helps: "Aldo Rossi brukes som et avgrenset canonicalt perspektiv på spørsmålets byfaglige emne; Ullerns konkrete påstander må fortsatt dokumenteres med lokale kilder." }; }\n  return q;';
          if (!source.includes(theoryBefore)) throw new Error('Ullern final theory/method binding patch target missing');
          source = source.replace(theoryBefore, theoryAfter);
          const popupBefore = 'De to kildetypene må holdes fra hverandre når man forklarer hvorfor området ser ut som det gjør.";';
          const popupAfter = 'De to kildetypene må holdes fra hverandre når man forklarer hvorfor området ser ut som det gjør, og observasjoner i felt bør derfor brukes til å beskrive synlige trekk ved bygg, gater, terreng og banespor, mens historiske forklaringer må knyttes til de dokumenterte kildene som faktisk daterer og beskriver endringene.";';
          if (!source.includes(popupBefore)) throw new Error('Ullern popup-length patch target missing');
          source = source.replace(popupBefore, popupAfter);
          source = source.replaceAll('51e627276bc3b95fc47a4caf65ac47e45b737796', 'f49051806d941a8d946f7c64c8a3eaf106586a08');
          fs.writeFileSync(file, source);
          NODE
          set -o pipefail
          node scripts/ullern-production-once.mjs 2>&1 | tee /tmp/ullern-materialize.log
          npm run place-open:build
          node scripts/build-quiz-production-context.mjs --category by --target ullern --output data/quiz/production_context/by/ullern.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const read = file => JSON.parse(fs.readFileSync(file, 'utf8'));
          const write = (file, value) => fs.writeFileSync(file, `${JSON.stringify(value, null, 2)}\n`);
          const sha256 = value => crypto.createHash('sha256').update(String(value)).digest('hex');
          const placeFile = 'data/places/by/oslo/places/ullern.json';
          const packetFile = 'data/places/production/ullern.json';
          const brief = read('data/quiz/production_briefs/by/ullern.json');
          const place = read(placeFile);
          const packet = read(packetFile);
          const sourceDefs = brief.sources;
          const verifiedAt = '2026-09-07';
          const sentences = text => [...new Intl.Segmenter('nb', { granularity: 'sentence' }).segment(String(text))].map(entry => entry.segment.trim()).filter(Boolean);
          const strongPattern = /\b(første|eldste|største|minste|eneste|viktigste|ledende|særlig kjent for|avgjørende|førte til|på grunn av|derfor|dermed|revolusjonerte|endret for alltid)\b/iu;
          const sourceTypeFor = id => id === 'church' ? 'institutional' : 'reputable_secondary';
          const sourceIdForSentence = sentence => /kirke|Bødtker|Peterssen|Kielland|baldakin|apsis/iu.test(sentence) ? 'church' : /Smestadbanen|Røabanen|Røa|Sørbyhaugen|Ullernåsen|Kolsås|Jar/iu.test(sentence) ? 'bydel' : 'byleksikon';
          const makeTextClaims = (field, text) => sentences(text).map((sentence, index) => {
            const sourceId = sourceIdForSentence(sentence);
            const sourceUrl = sourceDefs[sourceId].url;
            const strong = strongPattern.test(sentence);
            const identity = field === 'popupDesc' && index === 0;
            const claim = {
              id: `claim_ullern_${field}_${String(index + 1).padStart(2, '0')}`,
              claim: sentence,
              sourceUrl,
              sourceLocation: `${sourceId} reviewed source; ${field} sentence ${index + 1}`,
              sourceType: sourceTypeFor(sourceId),
              verifiedAt,
              status: 'verified',
              claimKind: identity ? 'identity' : strong ? 'strong' : 'fact',
              evidenceMode: strong ? 'explicit' : 'direct',
              temporalStatus: /dagens|finnes|er et boligstrøk/iu.test(sentence) ? 'current' : 'historical'
            };
            if (strong) claim.independentSourceUrls = [sourceDefs.bydel.url === sourceUrl ? sourceDefs.byleksikon.url : sourceDefs.bydel.url];
            return claim;
          });
          const descClaims = makeTextClaims('desc', place.desc);
          const popupClaims = makeTextClaims('popupDesc', place.popupDesc);
          const quizFacts = [
            ['Hva har Ullern navn etter?', 'Ullern-gårdene', 'hva', 'Ullern har navn etter Ullern-gårdene.', 'byleksikon'],
            ['Når ble Ullern kirke innviet?', '1903', 'når', 'Ullern kirke ble innviet i 1903.', 'church'],
            ['Hvem tegnet Ullern kirke?', 'Harald Bødtker', 'hvem', 'Harald Bødtker tegnet Ullern kirke.', 'church'],
            ['Mellom hvilke områder ligger Ullern-strøket?', 'Røa, Bestum, Lilleaker, Smestad og Skøyen', 'hvor', 'Ullern-strøket ligger mellom Røa, Bestum, Lilleaker, Smestad og Skøyen.', 'byleksikon'],
            ['Hva skjedde med Smestadbanen i 1935?', 'Den ble forlenget til Røa og fikk navnet Røabanen.', 'hva_skjedde', 'Smestadbanen ble forlenget til Røa i 1935 og fikk navnet Røabanen.', 'smestadbanen'],
            ['Hvilket verk utførte Eilif Peterssen i apsis?', '«Kristi himmelfart»', 'hvilket_verk_eller_objekt', 'Eilif Peterssen utførte «Kristi himmelfart» i apsis i 1908–1909.', 'church'],
            ['Når åpnet Radiumhospitalet?', '1931', 'når', 'Det Norske Radiumhospital åpnet i 1931.', 'byleksikon'],
            ['Hva åpnet over Ullernåsen i 1942?', 'Forbindelsen Sørbyhaugen–Jar.', 'hva_ble_bygget_produsert_eller_endret', 'Forbindelsen Sørbyhaugen–Jar over Ullernåsen åpnet i 1942.', 'sorbyhaugen']
          ];
          const quizClaims = quizFacts.map((item, index) => ({
            id: `claim_ullern_quiz_ready_${String(index + 1).padStart(2, '0')}`,
            claim: item[3],
            sourceUrl: sourceDefs[item[4]].url,
            sourceLocation: `${item[4]} reviewed source; quiz-readiness fact ${index + 1}`,
            sourceType: sourceTypeFor(item[4]),
            verifiedAt,
            status: 'verified',
            claimKind: 'fact',
            evidenceMode: 'direct',
            temporalStatus: 'historical'
          }));
          const packetClaims = [...descClaims, ...popupClaims, ...quizClaims];
          packet.claims = packetClaims;
          packet.sentenceCoverage = {
            desc: descClaims.map((claim, index) => ({ sentence: index + 1, claimIds: [claim.id] })),
            popupDesc: popupClaims.map((claim, index) => ({ sentence: index + 1, claimIds: [claim.id] }))
          };
          packet.reviews = {
            factual: { status: 'passed', reviewedAt: verifiedAt, reviewer: 'Ullern source review', notes: 'All user-facing sentences are mapped to inspected Ullern sources; rail, church, institution and housing claims are separated.' },
            editorial: { status: 'passed', reviewedAt: verifiedAt, reviewer: 'Ullern editorial review', introducedNewFacts: false, notes: 'Editorial pass preserves source limits and does not infer resident income, class or causation from morphology alone.' }
          };
          packet.quizReadiness = {
            status: 'canonical_rich_5x7',
            quizTargetId: 'ullern',
            sourceBrief: 'data/quiz/production_briefs/by/ullern.json',
            productionContext: 'data/quiz/production_context/by/ullern.json',
            normalOpeningQuestions: 21,
            totalQuestions: 35,
            questions: quizFacts.map((item, index) => ({ question: item[0], answer: item[1], type: item[2], normalKnowledgeQuestion: true, claimIds: [quizClaims[index].id] }))
          };
          packet.completion = {
            ...packet.completion,
            completedUnder: '4.2',
            currentStatus: 'current',
            sourceVerifiedAt: verifiedAt,
            claimsVerified: { verified: packetClaims.length, total: packetClaims.length },
            factualReview: 'passed',
            editorialReview: 'passed',
            validatorVersion: packet.validatorVersion
          };
          packet.textHashes = { algorithm: 'sha256', desc: sha256(place.desc), popupDesc: sha256(place.popupDesc) };
          write(packetFile, packet);
          NODE
          node scripts/build-epoke-place-index.mjs

      - name: Preserve materialization diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ullern-materialize-diagnostics
          path: /tmp/ullern-materialize.log
          if-no-files-found: error

      - name: Record canonical READ-FIRST evidence
        run: |
          node scripts/place-production-rule-preflight.mjs record --workcard reports/place-production/ullern-workcard-current.json --place-id ullern --category by
          node scripts/place-production-rule-preflight.mjs check --base "$LOCKED_MAIN"

      - name: Validate Ullern focused contracts
        run: |
          set -o pipefail
          {
            node --test tests/ullern-completion.test.mjs
            npm run places:index:check
            npm run place-open:check
            npm run test:place-open
            npm run leksikon:ids:check
            npm run check:stories
            npm run audit:quiz-manifest:v2
            npm run audit:quiz-production-context
            npm run audit:quiz-progression
            npm run audit:quiz-theory-binding
            node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; import { validatePacket } from "./scripts/validate-place-description-production-v4_2.mjs"; const read=(file)=>JSON.parse(fs.readFileSync(file,"utf8")); const place=read("data/places/by/oslo/places/ullern.json"); const packet=read("data/places/production/ullern.json"); const result=validatePacket({packet,place,packetFile:"data/places/production/ullern.json",now:new Date("2026-09-07T12:00:00Z")}); assert.deepEqual(result.issues, []); assert.equal(packet.status, "ready_v4_2");'
          } 2>&1 | tee /tmp/ullern-focused-validation.log

      - name: Preserve focused-gate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ullern-focused-validation-diagnostics
          path: /tmp/ullern-focused-validation.log
          if-no-files-found: error

      - name: Validate Fagverk and images
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/ullern-place-image-audit.json --verify-summary=data/places/place_image_backlog_summary.json
          npm run epoker:places:check
          node --test tests/epoke-place-index.test.mjs
          npm run civication:history-people:check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check

      - name: Commit clean permanent Ullern tree
        run: |
          git rm -f .github/workflows/ullern-production-once.yml scripts/ullern-production-once.mjs reports/place-production/ullern-run-trigger.txt
          git restore --source="$LOCKED_MAIN" -- reports/knowledge-contract-audit.json
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete Ullern Place production'

      - name: Run exact repository hygiene
        run: REPO_HYGIENE_BASE_SHA="$LOCKED_MAIN" REPO_HYGIENE_HEAD_SHA="$(git rev-parse HEAD)" node scripts/audit-repository-hygiene-v1.mjs

      - name: Publish clean fast-forward result
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$LOCKED_MAIN"
          git push origin "HEAD:refs/heads/$BRANCH"
