name: Fagverk Psykologi complete topic articles

on:
  pull_request:
    paths:
      - "data/fagverk/psykologi/emneartikler/**"
      - "data/fag/psykologi/psykologi_university_readiness_v1.json"
      - "data/fag/psykologi/begreper_psykologi_canonical_v1.json"
      - "data/fag/psykologi/anvendte_fagfelt_psykologi_university_v1.json"
      - "scripts/materialize-psykologi-topic-articles-mental-health-v1.mjs"
      - "scripts/audit-fagverk-psykologi-topic-articles-mental-health-v1.mjs"
      - "scripts/materialize-psykologi-university-completion-v1.mjs"
      - "scripts/lib/psykologi-editorial-curation-v2.mjs"
      - "scripts/audit-fagverk-psykologi-university-completion-v1.mjs"
      - "scripts/audit-fagverk-psykologi-editorial-quality-v2.mjs"
      - "scripts/audit-fagverk-psykologi-university-readiness.mjs"
      - "tests/fagverk-psykologi-topic-articles-mental-health-v1.test.mjs"
      - "tests/fagverk-psykologi-university-completion-v1.test.mjs"
      - "tests/fagverk-psykologi-editorial-quality-v2.test.mjs"
      - "reports/fagverk/psykologi-topic-articles-mental-health-v1-audit.json"
      - "reports/fagverk/psykologi-university-completion-v1-audit.json"
      - "reports/fagverk/psykologi-editorial-quality-v2-audit.json"
      - ".github/workflows/fagverk-psykologi-topic-articles-mental-health.yml"
  push:
    branches: [main]
    paths:
      - "data/fagverk/psykologi/emneartikler/**"
      - "data/fag/psykologi/psykologi_university_readiness_v1.json"
      - "data/fag/psykologi/begreper_psykologi_canonical_v1.json"
      - "data/fag/psykologi/anvendte_fagfelt_psykologi_university_v1.json"
      - "scripts/materialize-psykologi-topic-articles-mental-health-v1.mjs"
      - "scripts/audit-fagverk-psykologi-topic-articles-mental-health-v1.mjs"
      - "scripts/materialize-psykologi-university-completion-v1.mjs"
      - "scripts/lib/psykologi-editorial-curation-v2.mjs"
      - "scripts/audit-fagverk-psykologi-university-completion-v1.mjs"
      - "scripts/audit-fagverk-psykologi-editorial-quality-v2.mjs"
      - "scripts/audit-fagverk-psykologi-university-readiness.mjs"
      - "tests/fagverk-psykologi-topic-articles-mental-health-v1.test.mjs"
      - "tests/fagverk-psykologi-university-completion-v1.test.mjs"
      - "tests/fagverk-psykologi-editorial-quality-v2.test.mjs"
      - "reports/fagverk/psykologi-topic-articles-mental-health-v1-audit.json"
      - "reports/fagverk/psykologi-university-completion-v1-audit.json"
      - "reports/fagverk/psykologi-editorial-quality-v2-audit.json"
      - ".github/workflows/fagverk-psykologi-topic-articles-mental-health.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Psychology 58/58 standalone topic articles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate scripts
        run: |
          node --check scripts/materialize-psykologi-topic-articles-mental-health-v1.mjs
          node --check scripts/audit-fagverk-psykologi-topic-articles-mental-health-v1.mjs
          node --check scripts/materialize-psykologi-university-completion-v1.mjs
          node --check scripts/lib/psykologi-editorial-curation-v2.mjs
          node --check scripts/audit-fagverk-psykologi-university-completion-v1.mjs
          node --check scripts/audit-fagverk-psykologi-editorial-quality-v2.mjs
      - name: Verify deterministic materialization
        run: |
          node scripts/materialize-psykologi-topic-articles-mental-health-v1.mjs
          node scripts/materialize-psykologi-university-completion-v1.mjs
      - name: Verify deterministic article audit
        run: |
          node scripts/audit-fagverk-psykologi-topic-articles-mental-health-v1.mjs
          node scripts/audit-fagverk-psykologi-university-completion-v1.mjs
          node scripts/audit-fagverk-psykologi-editorial-quality-v2.mjs
      - name: Test article quality contract
        run: node --test tests/fagverk-psykologi-topic-articles-mental-health-v1.test.mjs tests/fagverk-psykologi-university-completion-v1.test.mjs tests/fagverk-psykologi-editorial-quality-v2.test.mjs
      - name: Verify university readiness consumes 58/58
        run: node scripts/audit-fagverk-psykologi-university-readiness.mjs --no-check-report
