name: Tinghuset TS09 distinct photo provenance
on:
  pull_request:
    paths:
      - '.github/workflows/tinghuset-ts09-photo-one-shot.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tinghuset-ts09-photo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/oslo-ts-09-tinghuset-vferdig-20261111
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Create genuinely distinct 2022 documentary portrait, with full provenance
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image,ImageOps
          source=Path('data/places/politikk/oslo/places_politikk/tinghuset.json')
          work=Path('reports/place-production/tinghuset-workcard-current.json')
          hero=Path('bilder/places/auto/tinghuset__oslo_tinghus.jpg')
          neworiginal=Path('bilder/places/auto/tinghuset__oslo_tinghus_2022.jpg')
          out=Path('bilder/places/tinghuset_front_portrait_2022.webp')
          obj=json.loads(source.read_text())
          card=json.loads(work.read_text())
          assert obj['id']=='tinghuset' and obj['for_na']['nowImage']==str(neworiginal)
          assert obj['for_na']['nowImageMeta']['sourcePage']=='https://commons.wikimedia.org/wiki/File:Oslo_Tinghus,_2022.jpg'
          hero_hash=hashlib.sha256(hero.read_bytes()).hexdigest()
          neworiginal_hash=hashlib.sha256(neworiginal.read_bytes()).hexdigest()
          assert hero_hash!=neworiginal_hash,'original photos must be distinct'
          with Image.open(neworiginal) as original:
            source_dimensions=f'{original.width}x{original.height}'
            portrait=ImageOps.fit(original.convert('RGB'),(900,1200),method=Image.Resampling.LANCZOS,centering=(0.5,0.5))
            portrait.save(out,'WEBP',quality=91,method=6)
          with Image.open(out) as check:
            assert check.size==(900,1200)
          out_hash=hashlib.sha256(out.read_bytes()).hexdigest()
          obj['imageMeta']['sourceSha256']=hero_hash
          obj['imageMeta']['sourcePage']=obj['imageMeta']['sourceUrl']
          obj['frontImage']=str(out)
          obj['frontImageMeta']={
            'source':'documented_distinct_commons_photo',
            'sourcePage':'https://commons.wikimedia.org/wiki/File:Oslo_Tinghus,_2022.jpg',
            'sourceLocalAsset':str(neworiginal),
            'sourceSha256':neworiginal_hash,
            'sourceLocalSha256':neworiginal_hash,
            'creator':'Ssu',
            'credit':'Ssu / Wikimedia Commons',
            'license':'CC BY-SA 4.0',
            'licenseUrl':'https://creativecommons.org/licenses/by-sa/4.0/',
            'originalLocalDimensions':source_dimensions,
            'outputDimensions':'900x1200',
            'orientation':'portrait',
            'aspectRatio':'3:4',
            'outputSha256':out_hash,
            'assetType':'documentary_place_photo',
            'transformation':'Sentrert stående 3:4-utsnitt av selvstendig fotografi fra 2022, med uendret dokumentarisk motiv og uten generativ endring.',
            'reviewStatus':'pending_editorial_crop_review',
            'verifiedAt':'2026-11-11'
          }
          card['front_image']=str(out)
          card['front_image_editorial_review']='PENDING – separat fotografi fra 2022 (Ssu / CC BY-SA 4.0) erstatter utsnitt av samme original; crop må vurderes i ny mobil-/desktop-QA.'
          card['status']='photo_ready_pending_browser'
          source.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
          work.write_text(json.dumps(card,ensure_ascii=False,indent=2)+'\n')
          print('Distinct hero photograph source:',hero_hash)
          print('Distinct portrait photograph source:',neworiginal_hash)
          print('Generated portrait:',str(out),out_hash)
          PY
      - name: Regenerate canonical derived state
        run: |
          npm run place-open:build
          npm run quiz:context
          npm run place-open:check
          npm run audit:quiz-production-context
          node scripts/check-distinct-place-photos.mjs --place data/places/politikk/oslo/places_politikk/tinghuset.json --require-both
      - name: Commit only the affected Place source, photo and derived outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/politikk/oslo/places_politikk/tinghuset.json
          git add bilder/places/tinghuset_front_portrait_2022.webp
          git add data/runtime/place-open/tinghuset.json
          git add data/quiz/production_context/politikk/tinghuset.json
          git add reports/place-production/tinghuset-workcard-current.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix(tinghuset): separate 2022 portrait original and synchronize place quiz runtime"
            git fetch origin content/oslo-ts-09-tinghuset-vferdig-20261111
            git rebase origin/content/oslo-ts-09-tinghuset-vferdig-20261111
            git push origin HEAD:content/oslo-ts-09-tinghuset-vferdig-20261111
          fi
