name: TEMP Place Sheet special profiles build

on:
  push:
    branches:
      - agent/place-sheet-phase5-special-profiles-20260909
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-place-sheet-special-profiles-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/place-sheet-phase5-special-profiles-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck:web
      - run: npm run build:web
      - run: node --test tests/place-sheet-special-profiles.test.mjs tests/place-sheet-render-queue.test.mjs tests/place-sheet-direct-routing.test.mjs tests/place-unified-surface.test.mjs tests/place-sheet-sources-renderer.test.mjs tests/place-sheet-learning-renderer.test.mjs tests/place-sheet-language-renderer.test.mjs tests/place-sheet-reading-renderer.test.mjs tests/place-sheet-news-renderer.test.mjs tests/place-sheet-before-after-renderer.test.mjs
      - name: Commit generated web bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/web/place-unified-surface.js dist/web/place-unified-surface.js.map
          if git diff --cached --quiet; then
            echo "Bundle already in sync"
            exit 0
          fi
          git commit -m "Build Phase 5 special-profile runtime"
          git push origin HEAD:agent/place-sheet-phase5-special-profiles-20260909
