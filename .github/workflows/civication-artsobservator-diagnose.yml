name: Civication Artsobservator Diagnose

on:
  push:
    branches:
      - civication/natur-artsobservator-role-world-clean

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generate canonical outputs
        run: |
          node scripts/audit-civication-life-position-role-world-readiness.mjs --write
          node scripts/audit-civication-career-gameplay.mjs --write
      - name: Require zero generator diff
        run: |
          git --no-pager diff -- data/Civication/lifePositionRoleWorldReadiness.json reports/civication-life-position-role-world-readiness.md data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md
          git diff --exit-code -- data/Civication/lifePositionRoleWorldReadiness.json reports/civication-life-position-role-world-readiness.md data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md
