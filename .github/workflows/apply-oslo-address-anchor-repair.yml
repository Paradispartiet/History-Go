name: Apply Oslo address anchor repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fix-oslo-address-anchors-torggata-storgata-v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build coordinate tools
        run: npm run build:tools

      - name: Run normative Geonorge address finder
        shell: bash
        run: |
          set -euo pipefail
          out=reports/oslo-address-anchor-repair-20260719/verified-coordinates
          mkdir -p "$out"

          node dist/tools/address-first-coordinate-finder.mjs --address "Hausmanns gate 19A Oslo" \
            | tee "$out/torggata_blad.json"
          test "$(jq -r '.status' "$out/torggata_blad.json")" = "verified_candidate"

          node dist/tools/address-first-coordinate-finder.mjs --address "Torggata 22 Oslo" \
            | tee "$out/torggata.json"
          test "$(jq -r '.status' "$out/torggata.json")" = "verified_candidate"

          node dist/tools/address-first-coordinate-finder.mjs --address "Storgata 26 Oslo" \
            | tee "$out/storgata.json"
          test "$(jq -r '.status' "$out/storgata.json")" = "verified_candidate"

      - name: Apply verified coordinates and repair Torggata Blad identity
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const verifiedAt = '2026-07-19';
          const resultDir = 'reports/oslo-address-anchor-repair-20260719/verified-coordinates';
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const write = (file, value) => fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n');

          function result(id) {
            const value = read(path.join(resultDir, `${id}.json`));
            if (!value.ok || value.status !== 'verified_candidate' || !value.coordinate) {
              throw new Error(`${id}: not a verified_candidate`);
            }
            return value;
          }

          const geo = {
            torggata: result('torggata'),
            storgata: result('storgata'),
            torggata_blad: result('torggata_blad'),
          };

          const splitFiles = {
            torggata: 'data/places/by/oslo/places/torggata.json',
            storgata: 'data/places/by/oslo/places/storgata.json',
            torggata_blad: 'data/places/subkultur/oslo/places_subkultur/torggata_blad.json',
          };

          function applyAddress(place, geocode, options) {
            const c = geocode.coordinate;
            place.lat = c.lat;
            place.lon = c.lon;
            place.coordType = 'address_point';
            place.coordStatus = 'verified';
            place.locatorType = options.locatorType;
            place.sourceProvider = 'official_address';
            place.sourceObjectId = geocode.sourceObjectId;
            place.address = c.address;
            place.geocodeAccuracy = c.geocodeAccuracy || 'rooftop';
            place.coordRole = options.coordRole;
            place.coordSource = 'geonorge_adresser_v1';
            place.coordSourceId = geocode.sourceObjectId;
            place.coordSourceUrl = geocode.sourceUrl;
            place.coordVerifiedAt = verifiedAt;
            place.coordNote = options.coordNote;
            delete place.coordPrecisionM;
          }

          const torggata = read(splitFiles.torggata);
          applyAddress(torggata, geo.torggata, {
            locatorType: 'street',
            coordRole: 'line_anchor',
            coordNote: 'Offisiell Geonorge-adressekoordinat for Torggata 22 brukes som konkret representativt hovedanker for Torggata. Punktet ligger på den sentrale oppgraderte gate- og serveringsstrekningen. Det er ikke et beregnet midtpunkt og gjør ingen påstand om at hele gaten ligger i bygningen på adressen.',
          });
          write(splitFiles.torggata, torggata);

          const storgata = read(splitFiles.storgata);
          applyAddress(storgata, geo.storgata, {
            locatorType: 'street',
            coordRole: 'line_anchor',
            coordNote: 'Offisiell Geonorge-adressekoordinat for Storgata 26 brukes som konkret representativt hovedanker for Storgata. Punktet ligger på den sentrale handels-, bylivs- og sporveisstrekningen. Det er ikke et beregnet midtpunkt og gjør ingen påstand om at hele gaten ligger i bygningen på adressen.',
          });
          write(splitFiles.storgata, storgata);

          const blad = read(splitFiles.torggata_blad);
          applyAddress(blad, geo.torggata_blad, {
            locatorType: 'building',
            coordRole: 'display_marker',
            coordNote: 'Historiske Torggata Blad-utgaver fra 2007–2008 dokumenterer redaksjonen/Aktbo-kontoret i Hausmannsgate 19, 6. etasje. Dagens matrikkel deler samme eiendom i 19A og 19B; 19A brukes som dagens offisielle adresse-normalisering og displayanker for det historiske kontorstedet. Bokstaven A er ikke gjengitt som et historisk 2008-sitat.',
          });
          blad.r = 60;
          blad.name = 'Torggata Blad – historisk redaksjon';
          blad.desc = 'Historisk redaksjons- og publiseringssted for det uavhengige kulturbladet Torggata Blad i Hausmanns gate 19.';
          blad.popupDesc = 'De tidlige papirutgavene av Torggata Blad dokumenterer at redaksjonen holdt til i Hausmannsgate 19, 6. etasje. Her ble det uavhengige lokal- og kulturbladet utviklet i miljøet rundt Bror Wyller, Paul Brady og andre bidragsytere. History Go-markøren representerer dette dokumenterte historiske redaksjons- og publiseringsstedet. Dagens offisielle adressepunkt Hausmanns gate 19A brukes som displayanker for eiendommen; dette er en moderne adresse-normalisering, ikke en påstand om at 2007–2008-utgavene skrev bokstaven A.';
          blad.quiz_profile = {
            ...blad.quiz_profile,
            place_type: 'redaksjonssted',
            subtype: 'uavhengig_kulturblad_og_publiseringsmiljo',
            signature_features: [
              'historisk redaksjon i Hausmannsgate 19, 6. etasje',
              'tidlig uavhengig lokal- og kulturpublisering fra 2007–2008',
              'kobling mellom Torggata-miljøet, Aktbo-kontoret og alternative publiseringsnettverk'
            ],
            primary_angles: ['historie', 'uavhengig_kultur', 'publisering', 'subkulturelt_miljo'],
            must_include: [
              'rollen som uavhengig kulturpublikasjon',
              'Hausmannsgate 19 som dokumentert historisk redaksjonssted'
            ],
            avoid_angles: ['generisk_bokhandel', 'nåværende_redaksjonsadresse'],
            notes: 'Spør som historisk redaksjons- og publiseringssted, ikke som bokhandel.'
          };
          write(splitFiles.torggata_blad, blad);

          function replaceAggregate(file, replacements) {
            const data = read(file);
            if (!Array.isArray(data)) throw new Error(`${file}: expected array`);
            for (const [id, record] of Object.entries(replacements)) {
              const index = data.findIndex((item) => item?.id === id);
              if (index < 0) throw new Error(`${file}: missing ${id}`);
              data[index] = record;
            }
            write(file, data);
          }

          replaceAggregate('data/places/by/oslo/places_by.json', { torggata, storgata });
          replaceAggregate('data/places/subkultur/oslo/places_subkultur.json', { torggata_blad: blad });

          function updateLightIndex(file, records) {
            const data = read(file);
            if (!Array.isArray(data)) throw new Error(`${file}: expected array`);
            for (const record of records) {
              const item = data.find((candidate) => candidate?.id === record.id);
              if (!item) throw new Error(`${file}: missing ${record.id}`);
              item.name = record.name;
              item.lat = record.lat;
              item.lon = record.lon;
              item.r = record.r;
              item.coordStatus = record.coordStatus;
              item.coordType = record.coordType;
            }
            write(file, data);
          }

          updateLightIndex('data/places/by/oslo/places_by_index.json', [torggata, storgata]);
          updateLightIndex('data/places/subkultur/oslo/places_subkultur_index.json', [blad]);

          function streetEvidence(place, geocode, sourceName, sourceUrl, sourceId) {
            const c = geocode.coordinate;
            return {
              schemaVersion: '1.0',
              placeId: place.id,
              category: place.category,
              municipality: 'Oslo',
              country: 'NO',
              evidenceStatus: 'applied_to_place',
              coordinateDecision: 'change_coordinates_to_documented_address_anchor',
              currentCoordinate: {
                lat: place.lat,
                lon: place.lon,
                r: place.r,
                coordStatus: place.coordStatus,
                coordSource: place.coordSource,
                coordType: place.coordType,
                coordNote: place.coordNote,
              },
              identity: {
                placeName: place.name,
                resolvedIdentity: `${place.name} representert med konkret offisielt adresseanker ${c.address.street} ${c.address.number} innenfor det dokumenterte gateløpet.`,
              },
              evidence: [
                {
                  sourceProvider: 'manual_research',
                  sourceName,
                  sourceUrl,
                  sourceObjectId: sourceId,
                  sourceQuality: 'documented_street_extent',
                  finding: 'Kilden dokumenterer gateidentiteten og gateløpet. Den brukes ikke som koordinatgenerator.',
                  canVerifyCoordinate: false,
                  reason: 'Koordinatet kommer fra det separate offisielle adresseankeret.',
                },
                {
                  sourceProvider: 'official_address',
                  sourceName: 'Geonorge Adresser API v1',
                  sourceUrl: geocode.sourceUrl,
                  sourceObjectId: geocode.sourceObjectId,
                  sourceQuality: 'official_address_point',
                  finding: `${c.address.street} ${c.address.number} ga ett entydig verified_candidate.`,
                  canVerifyCoordinate: true,
                  reason: place.coordNote,
                }
              ],
              addressCandidates: [{
                query: geocode.query,
                sourceProvider: 'official_address',
                sourceObjectId: geocode.sourceObjectId,
                lat: c.lat,
                lon: c.lon,
                canApplyToPlace: true,
              }],
              sourceObjectCandidates: [{
                sourceProvider: 'official_address',
                sourceObjectId: geocode.sourceObjectId,
                canApplyToPlace: true,
              }],
              geometryCandidates: [],
              coordinateCandidates: [{ lat: c.lat, lon: c.lon, coordRole: 'line_anchor', canApplyToPlace: true }],
              decision: {
                canBecomeVerified: true,
                blockedReason: '',
                nextAction: 'Det offisielle adresseankeret er anvendt på canonical record, aggregate og runtime-indekser.',
              },
              notes: [place.coordNote],
            };
          }

          write('data/coordinate-evidence/oslo/by/torggata.json', streetEvidence(
            torggata, geo.torggata, 'Oslo byleksikon – Torggata', 'https://oslobyleksikon.no/side/Torggata', 'oslobyleksikon:torggata'
          ));
          write('data/coordinate-evidence/oslo/by/storgata.json', streetEvidence(
            storgata, geo.storgata, 'Oslo byleksikon – Storgata', 'https://oslobyleksikon.no/side/Storgata', 'oslobyleksikon:storgata'
          ));

          fs.mkdirSync('data/coordinate-evidence/oslo/subkultur', { recursive: true });
          const bladCoord = geo.torggata_blad.coordinate;
          write('data/coordinate-evidence/oslo/subkultur/torggata_blad.json', {
            schemaVersion: '1.0',
            placeId: 'torggata_blad',
            category: 'subkultur',
            municipality: 'Oslo',
            country: 'NO',
            evidenceStatus: 'applied_to_place',
            coordinateDecision: 'change_coordinates_to_historical_editorial_address_anchor',
            currentCoordinate: {
              lat: blad.lat,
              lon: blad.lon,
              r: blad.r,
              coordStatus: blad.coordStatus,
              coordSource: blad.coordSource,
              coordType: blad.coordType,
              coordNote: blad.coordNote,
            },
            identity: {
              placeName: blad.name,
              resolvedIdentity: 'Torggata Blads dokumenterte historiske redaksjons- og Aktbo-kontorsted i Hausmannsgate 19, 6. etasje.',
            },
            evidence: [
              {
                sourceProvider: 'primary_publication',
                sourceName: 'Torggata Blad nr. 2, 2007',
                sourceUrl: 'https://torggatablad.no/wp-content/uploads/2020/04/torggatablad_nr02_07_web.pdf',
                sourceObjectId: 'torggatablad_nr02_07_web',
                sourceQuality: 'primary_historical_publication',
                finding: 'Bladet oppgir at redaksjonen holder til i Hausmannsgate 19, 6. etasje, og beskriver utsikten og takterrassen.',
                canVerifyCoordinate: false,
                reason: 'Primærkilden dokumenterer historisk sted og etasje, men bruker den daværende adressen uten dagens A/B-bokstav.',
              },
              {
                sourceProvider: 'primary_publication',
                sourceName: 'Torggata Blad nr. 1 og nr. 2, 2008',
                sourceUrl: 'https://torggatablad.no/torggata-blad-total/',
                sourceObjectId: 'torggatablad_2008_early_issues',
                sourceQuality: 'primary_historical_publication',
                finding: 'Mastheadene gjentar Torggata Blad, Hausmannsgate 19, 0182 Oslo; nr. 2 oppgir også Vitar Eiendom c/o Aktbo på samme adresse.',
                canVerifyCoordinate: false,
                reason: 'Dokumenterer kontinuitet i den historiske redaksjons-/Aktbo-adressen.',
              },
              {
                sourceProvider: 'official_address',
                sourceName: 'Geonorge Adresser API v1',
                sourceUrl: geo.torggata_blad.sourceUrl,
                sourceObjectId: geo.torggata_blad.sourceObjectId,
                sourceQuality: 'official_address_point',
                finding: 'Hausmanns gate 19A ga ett entydig verified_candidate og brukes som dagens offisielle displayanker for den historiske eiendommen/kontoradressen.',
                canVerifyCoordinate: true,
                reason: blad.coordNote,
              }
            ],
            addressCandidates: [{
              query: geo.torggata_blad.query,
              sourceProvider: 'official_address',
              sourceObjectId: geo.torggata_blad.sourceObjectId,
              lat: bladCoord.lat,
              lon: bladCoord.lon,
              canApplyToPlace: true,
            }],
            sourceObjectCandidates: [{ sourceProvider: 'official_address', sourceObjectId: geo.torggata_blad.sourceObjectId, canApplyToPlace: true }],
            geometryCandidates: [],
            coordinateCandidates: [{ lat: bladCoord.lat, lon: bladCoord.lon, coordRole: 'display_marker', canApplyToPlace: true }],
            decision: {
              canBecomeVerified: true,
              blockedReason: '',
              nextAction: 'Historisk sted er dokumentert av primærpublikasjonen; dagens offisielle 19A-adressepunkt er anvendt som displayanker med eksplisitt normaliseringsnote.',
            },
            notes: [blad.coordNote],
          });

          const old = {
            torggata: [59.91535, 10.75335],
            storgata: [59.9154, 10.7539],
            torggata_blad: [59.91504, 10.75326],
          };
          const updated = { torggata, storgata, torggata_blad: blad };
          const rad = (n) => n * Math.PI / 180;
          function distance(a, b) {
            const R = 6371000;
            const dLat = rad(b[0] - a[0]);
            const dLon = rad(b[1] - a[1]);
            const h = Math.sin(dLat/2)**2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLon/2)**2;
            return 2 * R * Math.asin(Math.sqrt(h));
          }
          const movement = {};
          for (const [id, place] of Object.entries(updated)) {
            const meters = distance(old[id], [place.lat, place.lon]);
            if (meters < 20) throw new Error(`${id} moved only ${meters.toFixed(1)} m`);
            movement[id] = {
              old: { lat: old[id][0], lon: old[id][1] },
              new: { lat: place.lat, lon: place.lon },
              movedMeters: Math.round(meters),
              sourceObjectId: place.coordSourceId,
            };
          }
          write('reports/oslo-address-anchor-repair-20260719/marker-movement.json', movement);
          write('reports/oslo-address-anchor-repair-20260719/applied-summary.json', {
            appliedAt: new Date().toISOString(),
            addresses: {
              torggata: geo.torggata,
              storgata: geo.storgata,
              torggata_blad: geo.torggata_blad,
            },
            movement,
          });
          NODE

      - name: Rebuild global runtime index
        run: npm run places:index:build

      - name: Validate coordinate and data contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/oslo-address-anchor-repair-20260719/validation

          npm run audit:places-split-manifest-sync \
            | tee reports/oslo-address-anchor-repair-20260719/validation/split-manifest-sync.txt
          npm run places:index:check \
            | tee reports/oslo-address-anchor-repair-20260719/validation/places-index-check.txt
          npm run test:coordinate-source-contract \
            | tee reports/oslo-address-anchor-repair-20260719/validation/coordinate-source-contract.txt
          npm run places:coords:quality \
            | tee reports/oslo-address-anchor-repair-20260719/validation/coordinate-quality.txt
          npm run places:coords:intake \
            | tee reports/oslo-address-anchor-repair-20260719/validation/coordinate-intake.txt
          npm run places:coords:evidence:audit \
            | tee reports/oslo-address-anchor-repair-20260719/validation/coordinate-evidence-audit.txt
          git diff --check \
            | tee reports/oslo-address-anchor-repair-20260719/validation/git-diff-check.txt

      - name: Persist final repaired state
        run: |
          set -euo pipefail
          rm .github/workflows/apply-oslo-address-anchor-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports .github/workflows/apply-oslo-address-anchor-repair.yml
          git commit -m "Fix Oslo address anchors for Torggata, Storgata and Torggata Blad"
          git push origin HEAD
