name: Materialize Nydalen visual assets

on:
  push:
    branches:
      - agent/nydalen-full-place-production-20260915
    paths:
      - .github/workflows/nydalen-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nydalen-full-place-production-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow requests cairosvg
      - name: Download, normalize and cite Nydalen assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from urllib.parse import quote
          import requests
          import time
          from PIL import Image, ImageDraw, ImageFont, ImageEnhance
          import cairosvg

          UA={"User-Agent":"History-Go asset materialization/1.0 (educational project)"}
          def commons(name):
              return "https://commons.wikimedia.org/wiki/Special:Redirect/file/" + quote(name, safe="") + "?width=1800"
          def fetch(name):
              url=commons(name)
              for attempt in range(6):
                  r=requests.get(url,headers=UA,timeout=60)
                  if r.status_code == 200:
                      time.sleep(2.0)
                      return r.content
                  if r.status_code == 429:
                      delay=float(r.headers.get("Retry-After") or min(30, 3*(2**attempt)))
                      time.sleep(delay)
                      continue
                  r.raise_for_status()
              r.raise_for_status()
          def crop_save(data,path,size):
              im=Image.open(BytesIO(data)).convert("RGB")
              tw,th=size; tr=tw/th; r=im.width/im.height
              if r>tr:
                  nw=int(im.height*tr); left=(im.width-nw)//2
                  im=im.crop((left,0,left+nw,im.height))
              else:
                  nh=int(im.width/tr); top=(im.height-nh)//2
                  im=im.crop((0,top,im.width,top+nh))
              im=im.resize(size,Image.Resampling.LANCZOS)
              Path(path).parent.mkdir(parents=True,exist_ok=True)
              im.save(path,"WEBP",quality=88,method=6)

          front=fetch("Akerselva - Oslo, Norway 2020-08-06 (06).jpg")
          crop_save(front,"bilder/places/nydalen_front_portrait.webp",(900,1200))
          crop_save(fetch("Adam Hiorth A-10093 Ua 0001 180.jpg"),"bilder/kort/people/adam_severin_hiorth_nydalen.webp",(900,1200))
          crop_save(fetch("Oluf Onsum - ca. 1870 - Mimi Frellsen - Oslo Museum - OB.F03348A.jpg"),"bilder/kort/people/oluf_onsum_christiania_spigerverk.webp",(900,1200))
          crop_save(fetch("Christian Olsen - Portrett av havnedirektør Oluf N. Roll - Oslo Museum - OMu.k00073.jpg"),"bilder/kort/people/oluf_nicolai_roll_nydalen.webp",(900,1200))
          crop_save(fetch("Tunnel of Light.JPG"),"bilder/kort/objects/nydalen_tunnel_of_light.webp",(900,600))
          crop_save(fetch("RK 165570 - Industrianlegg - Nydalen Compagnie Bomullsspinneri nedre spinneri 1847 IMG 6420.JPG"),"bilder/kort/structures/nydalen_nedre_spinneri.webp",(900,600))

          logo_data=fetch("Snøhetta logo.svg")
          logo=Image.open(BytesIO(logo_data)).convert("RGBA")
          canvas=Image.new("RGBA",(900,520),(255,255,255,0))
          logo.thumbnail((760,300),Image.Resampling.LANCZOS)
          canvas.alpha_composite(logo,((900-logo.width)//2,(520-logo.height)//2))
          Path("bilder/kort/brands").mkdir(parents=True,exist_ok=True)
          canvas.convert("RGB").save("bilder/kort/brands/snohetta.webp","WEBP",quality=92,method=6)

          # Dedicated Nydalen QuizCard, derived from the cited place photograph.
          try:
              ref=Image.open("bilder/QuizCards/Rodelokka.PNG")
              size=ref.size
          except Exception:
              size=(900,1200)
          base=Image.open("bilder/places/nydalen_front_portrait.webp").convert("RGB")
          tw,th=size; tr=tw/th; r=base.width/base.height
          if r>tr:
              nw=int(base.height*tr); left=(base.width-nw)//2; base=base.crop((left,0,left+nw,base.height))
          else:
              nh=int(base.width/tr); top=(base.height-nh)//2; base=base.crop((0,top,base.width,top+nh))
          base=base.resize(size,Image.Resampling.LANCZOS)
          base=ImageEnhance.Brightness(base).enhance(0.62)
          draw=ImageDraw.Draw(base,"RGBA")
          draw.rectangle((0,int(th*0.62),tw,th),fill=(0,0,0,125))
          font_paths=["/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf","/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"]
          fp=next((p for p in font_paths if Path(p).exists()),None)
          title=ImageFont.truetype(fp,max(34,int(th*0.065))) if fp else ImageFont.load_default()
          sub=ImageFont.truetype(fp,max(20,int(th*0.028))) if fp else ImageFont.load_default()
          margin=int(tw*0.07)
          draw.text((margin,int(th*0.70)),"NYDALEN",font=title,fill=(255,255,255,255))
          draw.text((margin,int(th*0.82)),"QUIZ · 10 SPØRSMÅL",font=sub,fill=(255,255,255,235))
          Path("bilder/QuizCards").mkdir(parents=True,exist_ok=True)
          base.save("bilder/QuizCards/Nydalen.PNG","PNG",optimize=True)
          PY
      - name: Commit assets and remove temporary workflow
        run: |
          git config user.name "History-Go Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add bilder/places/nydalen_front_portrait.webp \
                  bilder/kort/people/adam_severin_hiorth_nydalen.webp \
                  bilder/kort/people/oluf_onsum_christiania_spigerverk.webp \
                  bilder/kort/people/oluf_nicolai_roll_nydalen.webp \
                  bilder/kort/objects/nydalen_tunnel_of_light.webp \
                  bilder/kort/structures/nydalen_nedre_spinneri.webp \
                  bilder/kort/brands/snohetta.webp \
                  bilder/QuizCards/Nydalen.PNG
          git rm .github/workflows/nydalen-assets.yml
          git commit -m "Materialize cited Nydalen visual assets"
          git push origin HEAD:agent/nydalen-full-place-production-20260915
