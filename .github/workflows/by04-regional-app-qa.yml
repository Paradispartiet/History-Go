name: By04 regional twenty real app QA
on:
  pull_request:
    paths:
      - '.github/workflows/by04-regional-app-qa.yml'
      - 'tests/by-v1-twenty-real-app-browser-20261024.mjs'
      - 'tests/by-bolk04-regional-source-contract.test.mjs'
      - 'data/places/by/innlandet/**'
      - 'data/places/by/vestfold/**'
      - 'data/quiz/by/*_regional_v1_sets.json'
      - 'data/quizcards/by/regional_bolk04_*'
      - 'data/quiz/manifest.json'
      - 'data/quizcards/by/manifest.json'
      - 'data/runtime/place-open/**'
      - 'data/places/places_index.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: by04-real-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regional-app-qa:
    name: Five By04 Places 390/1440 — shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify By04 editorial, image and quiz-source contracts
        run: node --test tests/by-bolk04-regional-source-contract.test.mjs
      - name: Test twenty regional Places in the real app
        env:
          HG_BY_BATCH: regional04
          HG_BY_SHARD: ${{ matrix.shard }}
        run: node tests/by-v1-twenty-real-app-browser-20261024.mjs
      - name: Preserve screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: by04-regional-app-shard-${{ matrix.shard }}
          path: artifacts/by04-regional-browser/shard-${{ matrix.shard }}/
          if-no-files-found: ignore
