name: History phase 2 quiz test sync

on:
  push:
    branches:
      - agent/historie-tid-periodisering-phase-2-main-refresh

permissions:
  contents: write

jobs:
  sync-test-contract:
    if: ${{ !contains(github.event.head_commit.message, '[quiz-test-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Update synchronized History counts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/quiz-production-pipeline.test.mjs')
          text = path.read_text()
          replacements = {
              'assert.equal(context.considered_curriculum.counts.emner, 49);':
                  'assert.equal(context.considered_curriculum.counts.emner, 53);',
              'assert.equal(context.considered_curriculum.counts.topic_hooks, 23);':
                  'assert.equal(context.considered_curriculum.counts.topic_hooks, 31);',
              'assert.equal(context.considered_curriculum.counts.methods, 18);':
                  'assert.equal(context.considered_curriculum.counts.methods, 23);',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 4:
                  raise SystemExit(f'Expected 4 occurrences of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

          rm .github/workflows/history-phase2-quiz-diagnostic.yml
          rm reports/history-phase2-quiz-test-diagnostic.md

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate synchronized test contract
        run: |
          node tools/validate-historie-tid-periodisering.mjs
          npm run knowledge:canonical:check
          npm run test:quiz-content-audit
          npm run test:quiz-production
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding

      - name: Commit final test synchronization
        run: |
          git add tests/quiz-production-pipeline.test.mjs \
            .github/workflows/history-phase2-quiz-diagnostic.yml \
            reports/history-phase2-quiz-test-diagnostic.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Historie: synkroniser produksjonstestene [quiz-test-sync]'
          git push origin HEAD:${{ github.ref_name }}
