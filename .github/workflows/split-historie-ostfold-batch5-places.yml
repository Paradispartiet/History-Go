name: Split Historie Ostfold batch 5 places

# Split aggregate batch 5 into per-place files on this data branch.
# Touch workflow to trigger generated split outputs.
on:
  workflow_dispatch:
  push:
    branches:
      - data/split-historie-ostfold-batch5-places-20260707

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/split-historie-ostfold-batch5-places-20260707
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/split-historie-ostfold-batch5-places.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/historie/ostfold/places_historie_ostfold_batch5 data/places/historie/ostfold/places_historie_ostfold_batch5_manifest.json data/places/historie/ostfold/places_historie_ostfold_batch5_index.json data/places/historie/ostfold/places_historie_ostfold_batch5_split_report.txt
          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Generate split Historie Ostfold batch 5 place files"
            git push
          fi
