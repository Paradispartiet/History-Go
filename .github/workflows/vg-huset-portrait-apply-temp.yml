name: VG-huset portrait apply (temporary)
on:
  push:
    branches: [agent/vg-huset-source-preflight-20261009]
    paths: ['.github/workflows/vg-huset-portrait-apply-temp.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate approved source candidate IDs and current empty image fields
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const candidates=JSON.parse(fs.readFileSync('data/people/people_image_candidates.json','utf8'));
          const people=JSON.parse(fs.readFileSync('data/people/media/oslo/people_media_oslo.json','utf8'));
          const expected=new Map([
            ['gard_steiro','gard_steiro__nmd_2019_toppm_tet_2019_13_46893491935_cropped_jpg'],
            ['hanne_skartveit','hanne_skartveit__hanne_skartveit_0002_jpg']
          ]);
          const approved=candidates.filter(x=>x.approved===true);
          if(approved.length!==2)throw new Error('Unexpected approved candidate count');
          for(const [id,cid] of expected) {
            const a=approved.filter(x=>x.personId===id&&x.candidateId===cid);
            const p=people.find(x=>x.id===id);
            if(a.length!==1||!p||p.image||p.cardImage)throw new Error('Approved image entry or person state has drifted for '+id);
            if(a[0].identity?.status!=='strong'||a[0].quality?.hardErrors?.length)throw new Error('Candidate identity or quality not approved');
            console.log('Approved Commons metadata:',id,cid,a[0].creator,a[0].license);
          }
          NODE
      - name: Dry-run then apply two reviewed Commons originals
        shell: bash
        run: |
          set -euo pipefail
          npm run people:images:apply -- --approved-ids=gard_steiro,hanne_skartveit
          npm run people:images:apply:write -- --approved-ids=gard_steiro,hanne_skartveit
      - name: Rebuild People and VG-huset runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run place-open:build
          npm run place-open:check
          npm run audit:people-profile-canonical
          npm run audit:people-of-places
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import sharp from 'sharp';
          const people=JSON.parse(fs.readFileSync('data/people/media/oslo/people_media_oslo.json','utf8'));
          const attribution=JSON.parse(fs.readFileSync('data/people/people_image_attributions.json','utf8'));
          for(const id of ['gard_steiro','hanne_skartveit']){
            const p=people.find(x=>x.id===id);
            if(!p?.image||p.image!==p.cardImage||!p.image.startsWith('bilder/kort/people/'))throw new Error('Missing image mapping for '+id);
            if(p.imageMeta?.source!=='wikimedia_commons'||p.imageMeta?.reviewStatus!=='manually_approved')throw new Error('Not approved source meta for '+id);
            const meta=await sharp(p.image).metadata();
            if(meta.width<300||meta.height<300)throw new Error('Bad physical image dimensions for '+id);
            if(!attribution.some(a=>a.personId===id&&a.file===p.image&&a.license===p.imageMeta.license))throw new Error('Missing attribution for '+id);
            console.log('Verified materialized portrait:',id,p.image,meta.width,meta.height,p.imageMeta.creator,p.imageMeta.license);
          }
          NODE
      - name: Protect scoped generated changes then commit
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const files=execFileSync('git',['status','--porcelain','--untracked-files=all'],{encoding:'utf8'})
            .trimEnd().split(/\r?\n/u).filter(Boolean).map(s=>s.slice(3));
          const allowed=new Set([
            'data/people/media/oslo/people_media_oslo.json',
            'data/people/people_image_attributions.json',
            'data/runtime/people-all/part-004.json',
            'data/runtime/place-open/vg_huset.json',
            'reports/people-of-places-status.json',
            'reports/people-of-places-status.md',
            'bilder/kort/people/gard_steiro.jpg',
            'bilder/kort/people/hanne_skartveit.jpg'
          ]);
          console.log('Generated changes:',files);
          if(files.some(x=>!allowed.has(x)))throw new Error('Unexpected source or runtime output, refusing commit');
          if(files.length<5)throw new Error('Expected materialized image and runtime outputs absent');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/people/media/oslo/people_media_oslo.json data/people/people_image_attributions.json
          git add data/runtime/people-all/part-004.json data/runtime/place-open/vg_huset.json
          git add reports/people-of-places-status.json reports/people-of-places-status.md
          git add bilder/kort/people/gard_steiro.jpg bilder/kort/people/hanne_skartveit.jpg
          git commit -m "feat(vg-huset): materialize two reviewed licensed People portraits"
          git push origin HEAD:agent/vg-huset-source-preflight-20261009
