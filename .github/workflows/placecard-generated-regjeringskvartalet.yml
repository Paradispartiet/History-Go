name: Temporary deterministic Regjeringskvartalet payload audit

on:
  pull_request:
    paths:
      - ".github/workflows/placecard-generated-regjeringskvartalet.yml"

permissions:
  contents: read

concurrency:
  group: placecard-generated-rkv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-generated-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate complete deterministic data locally without committing
        run: |
          node scripts/build-place-open-payloads.mjs
          git diff --name-only data/runtime > generated-drift.txt
          cp data/runtime/place-open/regjeringskvartalet.json place-open-regjeringskvartalet.json
          cat generated-drift.txt
      - name: Upload exact generated file for review
        uses: actions/upload-artifact@v4
        with:
          name: placecard-generated-rkv-diagnostics
          path: |
            generated-drift.txt
            place-open-regjeringskvartalet.json
          retention-days: 2
