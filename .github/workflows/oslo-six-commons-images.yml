name: Oslo six Commons crop preparation

on:
  pull_request:
    paths:
      - '.github/workflows/oslo-six-commons-images.yml'
      - 'scripts/prepare-oslo-six-commons-webp.py'
      - 'reports/place-production/oslo-six-image-rights-shortlist-20261022.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oslo-six-commons-crops-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    # Only the existing internal six-place PR may generate bytes, not a fork PR.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 6563 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the source branch, not the merge ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible crop dependency
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Fetch four source-checked Commons originals, verify SHA-1 and crop WebP
        run: python scripts/prepare-oslo-six-commons-webp.py
      - name: Upload image candidates for visual review
        uses: actions/upload-artifact@v4
        with:
          name: oslo-six-commons-image-review
          path: |
            bilder/places/auto/*__commons_*.webp
            reports/place-production/oslo-six-generated-image-attribution-20261022.json
          if-no-files-found: error
          retention-days: 14
      - name: Commit prepared candidates to this PR only
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git add bilder/places/auto/*__commons_*.webp reports/place-production/oslo-six-generated-image-attribution-20261022.json
          if git diff --cached --quiet; then
            echo "Prepared image files already match the PR branch."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "History Go: add four credited Commons image triplets for visual QA"
          git push origin "HEAD:${HEAD_BRANCH}"
