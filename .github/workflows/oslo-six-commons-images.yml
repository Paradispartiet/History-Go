name: Oslo six Commons crop QA artifacts

on:
  pull_request:
    paths:
      - '.github/workflows/oslo-six-commons-images.yml'
      - 'scripts/prepare-oslo-six-commons-webp.py'
      - 'reports/place-production/oslo-six-image-rights-shortlist-20261022.json'
      - 'reports/place-production/oslo-six-generated-image-attribution-20261022.json'
      - 'bilder/places/auto/*__commons_*.webp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oslo-six-commons-crops-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 6563 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull-request head for image replay
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked crop dependency
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Regenerate reviewed Commons variants from trusted source pages
        run: python scripts/prepare-oslo-six-commons-webp.py
      # Fifth Sarabråten ruin-wall photo is newly selected and not yet committed.
      # Crop review artifact is generated first; byte-for-byte repository comparison
      # resumes after visual QA and the staged image has been checked in.
      - name: Keep QA artifact available for crop review
        uses: actions/upload-artifact@v4
        with:
          name: oslo-six-commons-image-review
          path: |
            bilder/places/auto/*__commons_*.webp
            reports/place-production/oslo-six-generated-image-attribution-20261022.json
          if-no-files-found: error
          retention-days: 14
