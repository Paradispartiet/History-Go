name: Oslo six Commons one-time asset import

on:
  push:
    branches:
      - 'research/oslo-next-places-20261022'
    paths:
      - '.github/workflows/oslo-six-commons-images.yml'
  workflow_dispatch:

# This is a branch-scoped one-time asset import, NOT a pull_request
# validation workflow. Restore read-only PR QA when complete.
permissions:
  contents: write

concurrency:
  group: oslo-six-one-time-image-import
  cancel-in-progress: false

jobs:
  import:
    if: ${{ github.repository == 'Paradispartiet/History-Go' && github.ref == 'refs/heads/research/oslo-next-places-20261022' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted existing six-place branch
        uses: actions/checkout@v4
        with:
          ref: 'research/oslo-next-places-20261022'
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked image tool
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Regenerate source-checked and SHA1-verified approved Commons images
        run: python scripts/prepare-oslo-six-commons-webp.py
      - name: Verify exact four reviewed IDs and twelve expected output files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f = Path('reports/place-production/oslo-six-generated-image-attribution-20261022.json')
          record=json.loads(f.read_text(encoding='utf-8'))
          expected={'linderud_gard','ekebergrestauranten','frognerseteren','saeterhytten_bygdoy'}
          assert {p['place_id'] for p in record['places']} == expected
          assert len(record['places'])==4
          assert record['status']=='PREPARED_BYTES_NOT_VISUALLY_QA_NOT_REGISTERED'
          paths=[v['path'] for p in record['places'] for v in p['variants']]
          assert len(paths)==12 and len(set(paths))==12
          assert all(Path(p).exists() and p.startswith('bilder/places/auto/') for p in paths)
          assert all(p['visual_quality_approved'] is False and p['canonical_place_bound'] is False for p in record['places'])
          print('Verified 12 candidate images and sidecar credits, 0 active Place bindings')
          PY
      - name: Commit generated binary image assets on this same PR branch
        env:
          HEAD_BRANCH: 'research/oslo-next-places-20261022'
        run: |
          git add bilder/places/auto/*__commons_*.webp reports/place-production/oslo-six-generated-image-attribution-20261022.json
          if git diff --cached --quiet; then
            echo "Reviewed image candidates already committed"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "History Go: import four licensed photo triplets as noncanonical candidates"
          git push origin "HEAD:${HEAD_BRANCH}"
