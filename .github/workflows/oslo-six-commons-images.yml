name: Oslo six Commons crop QA artifacts

on:
  pull_request:
    paths:
      - '.github/workflows/oslo-six-commons-images.yml'
      - 'scripts/prepare-oslo-six-commons-webp.py'
      - 'reports/place-production/oslo-six-image-rights-shortlist-20261022.json'
      - 'reports/place-production/oslo-six-generated-image-attribution-20261022.json'
      - 'bilder/places/auto/*__commons_*.webp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oslo-six-commons-crops-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 6563 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull-request head for image replay
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked crop dependency
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Regenerate reviewed Commons variants from trusted source pages
        run: python scripts/prepare-oslo-six-commons-webp.py
      - name: Check reproducibility against twelve committed image assets
        run: |
          git diff --exit-code -- bilder/places/auto/*__commons_*.webp reports/place-production/oslo-six-generated-image-attribution-20261022.json
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          report=json.loads(Path('reports/place-production/oslo-six-generated-image-attribution-20261022.json').read_text(encoding='utf-8'))
          assert len(report['places']) == 4
          expected = {'linderud_gard','ekebergrestauranten','frognerseteren','saeterhytten_bygdoy'}
          assert {p['place_id'] for p in report['places']} == expected
          paths=[v['path'] for p in report['places'] for v in p['variants']]
          assert len(paths)==len(set(paths))==12
          for p in report['places']:
              assert p['canonical_place_bound'] is False
              assert p['attribution_display_checked'] is False
              for v in p['variants']:
                  assert hashlib.sha256(Path(v['path']).read_bytes()).hexdigest()==v['sha256']
          print('Twelve checked-in credited crops match source originals and per-file SHA256')
          PY
      - name: Keep QA artifact available for crop review
        uses: actions/upload-artifact@v4
        with:
          name: oslo-six-commons-image-review
          path: |
            bilder/places/auto/*__commons_*.webp
            reports/place-production/oslo-six-generated-image-attribution-20261022.json
          if-no-files-found: error
          retention-days: 14
