name: Politics two normal opening sets

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: politics-two-normal-opening-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: startsWith(github.head_ref, 'agent/politikk-two-normal-opening-sets')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply and diagnose normal opening contract
        id: apply
        continue-on-error: true
        if: hashFiles('tools/apply-politikk-two-normal-opening-sets.mjs') != ''
        run: |
          set +e
          mkdir -p reports/politikk-canonical-migration
          LOG=reports/politikk-canonical-migration/politikk-two-normal-opening-sets-diagnostic.txt
          : > "$LOG"
          node tools/apply-politikk-two-normal-opening-sets.mjs >> "$LOG" 2>&1
          apply_status=$?
          echo "apply_status=$apply_status" >> "$LOG"
          validate_status=99
          parse_status=99
          diff_status=99
          if [ "$apply_status" -eq 0 ]; then
            node tools/validate-politikk-two-normal-opening-sets.mjs >> "$LOG" 2>&1
            validate_status=$?
            node -e 'JSON.parse(require("fs").readFileSync("data/fag/politikk/quiz_generator_rules_politikk_v5_1_source_priority_patch.json","utf8")); JSON.parse(require("fs").readFileSync("reports/politikk-canonical-migration/politikk-two-normal-opening-sets-blueprints.json","utf8")); console.log("JSON parse: PASS")' >> "$LOG" 2>&1
            parse_status=$?
            git diff --check >> "$LOG" 2>&1
            diff_status=$?
          fi
          echo "validate_status=$validate_status" >> "$LOG"
          echo "parse_status=$parse_status" >> "$LOG"
          echo "diff_status=$diff_status" >> "$LOG"
          if [ "$apply_status" -ne 0 ] || [ "$validate_status" -ne 0 ] || [ "$parse_status" -ne 0 ] || [ "$diff_status" -ne 0 ]; then
            exit 1
          fi
          cp "$LOG" reports/politikk-canonical-migration/politikk-two-normal-opening-sets-validation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: politics-two-normal-opening-diagnostics
          path: reports/politikk-canonical-migration/politikk-two-normal-opening-sets-diagnostic.txt
          if-no-files-found: warn
      - name: Commit normal opening contract
        if: steps.apply.outcome == 'success'
        run: |
          set -euo pipefail
          rm tools/apply-politikk-two-normal-opening-sets.mjs
          rm -f reports/politikk-canonical-migration/politikk-two-normal-opening-sets-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/fag/politikk/quiz_generator_rules_politikk_v5_1_source_priority_patch.json
          git add reports/politikk-canonical-migration/politikk-two-normal-opening-sets-blueprints.json
          git add reports/politikk-canonical-migration/politikk-two-normal-opening-sets.md
          git add reports/politikk-canonical-migration/politikk-two-normal-opening-sets-validation.txt
          git add tools/validate-politikk-two-normal-opening-sets.mjs
          git add -u tools/apply-politikk-two-normal-opening-sets.mjs
          git diff --cached --check
          git commit -m 'Politikk: lås to normale åpningssett'
          git push origin HEAD:${{ github.head_ref }}
      - name: Propagate failure
        if: steps.apply.outcome == 'failure'
        run: exit 1
