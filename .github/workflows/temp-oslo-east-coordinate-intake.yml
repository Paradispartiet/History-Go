name: Temporary Oslo East coordinate intake

on:
  push:
    branches:
      - agent/oslo-east-coordinate-intake-valerenga-kunsthall

permissions:
  contents: write

jobs:
  coordinate-intake:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-east-coordinate-intake-valerenga-kunsthall
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run and save Geonorge address lookups
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/visitoslo-oslo-east-audit-20260720/valerenga-kirke-coordinate-intake
          mkdir -p reports/visitoslo-oslo-east-audit-20260720/kunsthall-oslo-coordinate-intake

          npm run places:coords:find:address -- --address "Hjaltlandsgata 3 Oslo" \
            2>&1 | tee reports/visitoslo-oslo-east-audit-20260720/valerenga-kirke-coordinate-intake/geonorge-address-lookup.txt

          npm run places:coords:find:address -- --address "Kjølberggata 21 Oslo" \
            2>&1 | tee reports/visitoslo-oslo-east-audit-20260720/kunsthall-oslo-coordinate-intake/geonorge-address-lookup.txt

      - name: Commit durable intake output and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-oslo-east-coordinate-intake.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/temp-oslo-east-coordinate-intake.yml reports/visitoslo-oslo-east-audit-20260720/valerenga-kirke-coordinate-intake reports/visitoslo-oslo-east-audit-20260720/kunsthall-oslo-coordinate-intake
          git commit -m "Record Oslo East Geonorge coordinate intake"
          git push origin HEAD:agent/oslo-east-coordinate-intake-valerenga-kunsthall
