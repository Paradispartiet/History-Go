name: Temp Holmenkollen batch 1 manifest

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-manifest:
    if: github.head_ref == 'data/people-holmenkollen-batch1-20260718'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/people-holmenkollen-batch1-20260718
          fetch-depth: 0
      - name: Register Holmenkollen people and remove temporary workflow
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('data/people/manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          files = data['files']
          additions = [
              'people/sport/oslo/holmenkollen_nasjonalanlegg/thorleif_haug.json',
              'people/sport/oslo/holmenkollen_nasjonalanlegg/birger_ruud.json',
              'people/sport/oslo/holmenkollen_nasjonalanlegg/gjermund_eggen.json',
              'people/sport/oslo/holmenkollen_nasjonalanlegg/matti_nykanen.json',
              'people/sport/oslo/holmenkollen_nasjonalanlegg/maren_lundby.json',
          ]
          files = [f for f in files if f not in additions]
          anchor = 'people/sport/oslo/people_sport_oslo.json'
          i = files.index(anchor) + 1
          files[i:i] = additions
          data['files'] = files
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('.github/workflows/temp-holmenkollen-batch1-manifest.yml').unlink()
      - name: Commit manifest registration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/people/manifest.json .github/workflows/temp-holmenkollen-batch1-manifest.yml
          git commit -m "data: register Holmenkollen people batch 1"
          git push origin HEAD:data/people-holmenkollen-batch1-20260718
