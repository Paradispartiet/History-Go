name: Minneparken pinned completion verification 20261111
on:
  push:
    branches:
      - qa/minneparken-final-1a3c2a4-20261111
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Source contracts and deterministic generators
        run: |
          npm run build:tools
          npm run build:scripts
          node --test tests/minneparken-historical-photo-provenance.test.mjs tests/minneparken-knowledge-registry.test.mjs tests/minneparken-quiz-source-parity.test.mjs tests/minneparken-story-candidate.test.mjs tests/epoke-place-index.test.mjs tests/badge-by-byplanlegging-v1-production.test.mjs tests/badge-by-samtidsarkitektur-v1-production.test.mjs
          node scripts/verify-byplanlegging-asset-v1.mjs
          node scripts/build-epoke-place-index.mjs --check
          node scripts/build-fagverk-release-manifest.mjs --check
          node scripts/build-place-open-payloads.mjs --check
          node dist/tools/check_places_index_sync.mjs
          node dist/scripts/knowledge-canonical-data.mjs --check
      - name: Find Chrome
        if: always()
        run: echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Minneparken text and Fagverk mobile and desktop
        if: always()
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const launch=chromium.launch.bind(chromium);
          chromium.launch=options=>launch({...options,executablePath:process.env.CHROME_BIN});
          await import('./tests/minneparken-readonly-app-browser.test.mjs');
          JS
      - name: Minneparken temporary QuizCard and fullquiz mobile and desktop
        if: always()
        run: |
          set -euo pipefail
          trap 'git restore data/quiz/manifest.json data/quizcards/historie/manifest.json' EXIT
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const q='data/quiz/manifest.json',c='data/quizcards/historie/manifest.json';
          const qm=JSON.parse(fs.readFileSync(q)),cm=JSON.parse(fs.readFileSync(c));
          const id='minneparken_gamlebyen',file='data/quiz/historie/'+id+'_sets.json';
          if(!qm.files.includes(file))qm.files.push(file);
          if(!qm.sets.some(x=>x.targetId===id))qm.sets.push({targetId:id,file});
          cm.collections.push(id+'_quizcard_v1.json');
          fs.writeFileSync(q,JSON.stringify(qm,null,2)+'\n');
          fs.writeFileSync(c,JSON.stringify(cm,null,2)+'\n');
          JS
          node scripts/verify-minneparken-quizcard-real-browser.mjs
          node scripts/verify-place-quiz-browser.mjs minneparken_gamlebyen
      - name: Grini real mobile and desktop regression
        if: always()
        run: node scripts/verify-grini-collections-browser.mjs grini_fangeleir
      - name: Oslo Politikk real mobile and desktop regression
        if: always()
        run: node tests/oslo-politikk-six-browser.mjs
      - name: Confirm no runtime manifest activation
        if: always()
        run: |
          git diff --exit-code data/quiz/manifest.json data/quizcards/historie/manifest.json data/stories/stories_manifest.json data/stories/stories_episode_v1_manifest.json
          node --test tests/minneparken-knowledge-registry.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minneparken-pinned-completion-20261111
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
