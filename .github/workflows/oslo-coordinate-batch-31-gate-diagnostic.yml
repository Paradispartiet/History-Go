name: Diagnose Oslo coordinate batch 31 gates

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose-gates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-31-final
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply batch 31 in working tree
        run: |
          node scripts/tmp-complete-oslo-coordinate-batch31.mjs
          node scripts/split-natur-oslo-alna-places.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('data/places/natur/oslo/places_oslo_alna_split_report.txt')
          p.write_text(p.read_text().rstrip()+'\n')
          PY
      - name: Build tools dependency-free
        run: |
          rm -rf dist/tools
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');const {stripTypeScriptTypes}=require('node:module');
          const src=path.resolve('tools'),out=path.resolve('dist/tools');
          function walk(d){return fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const f=path.join(d,e.name);return e.isDirectory()?walk(f):(/\.(?:mts|ts|cts)$/.test(e.name)?[f]:[])});}
          for(const f of walk(src)){const rel=path.relative(src,f),ext=path.extname(rel),oe=ext==='.mts'?'.mjs':ext==='.cts'?'.cjs':'.js',dest=path.join(out,rel.slice(0,-ext.length)+oe),s=fs.readFileSync(f,'utf8'),nl=s.indexOf('\n'),sh=s.startsWith('#!')?s.slice(0,nl+1):'',b=s.startsWith('#!')?s.slice(nl+1):s;fs.mkdirSync(path.dirname(dest),{recursive:true});fs.writeFileSync(dest,sh+stripTypeScriptTypes(b,{mode:'transform'}));}
          NODE
          node dist/tools/build_places_index.mjs
      - name: Gate — split manifest sync
        run: node dist/tools/audit-places-split-manifest-sync.mjs
      - name: Gate — no lng coordinates
        run: node dist/tools/check_no_lng_coordinates.mjs
      - name: Gate — places index sync
        run: node dist/tools/check_places_index_sync.mjs
      - name: Gate — coordinate index parity
        run: node tests/place-coordinate-index-parity.test.js
      - name: Gate — coordinate source contract
        run: node tests/coordinate-source-contract-anchor-trust.test.mjs
      - name: Gate — coordinate quality
        run: node dist/tools/place-coordinate-quality-gate.mjs
      - name: Gate — strict intake
        run: node dist/tools/place-coordinate-intake-gate.mjs --strict-new
      - name: Gate — coordinate evidence audit
        run: node dist/tools/audit-coordinate-evidence.mjs
      - name: Gate — git diff check
        run: git diff --check
