name: Civication Wave G focused check (temporary)

on:
  push:
    branches:
      - civication/wave-g-continuations-first-16-20261027

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test actual Wave G decisions and role switching
        run: node tests/civication-lifestory-wave-g-first-16.test.js
      - name: Report canonical readiness drift
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const path = 'data/Civication/lifePositionRoleWorldReadiness.json';
          const before = JSON.parse(fs.readFileSync(path, 'utf8'));
          cp.execFileSync(process.execPath, ['scripts/audit-civication-life-position-role-world-readiness.mjs', '--write'], {stdio:'pipe', timeout:120000});
          const after = JSON.parse(fs.readFileSync(path, 'utf8'));
          const report = fs.readFileSync('reports/civication-life-position-role-world-readiness.md', 'utf8');
          const eq = (a,b)=>JSON.stringify(a)===JSON.stringify(b);
          const changed=(a,b)=>{
            if(eq(a,b)) return undefined;
            if(!a || !b || Array.isArray(a) || Array.isArray(b) || typeof a!=='object' || typeof b!=='object') return b;
            const out={};
            for(const k of Object.keys(b)){const x=changed(a[k],b[k]);if(x!==undefined)out[k]=x}
            return out;
          };
          const patch=changed({...before,positions:[]},{...after,positions:[]})||{};
          patch.positions=after.positions.flatMap((p,i)=>{
            const delta=changed(before.positions[i],p);
            return delta===undefined?[]:[{key:p.key,delta}];
          });
          const data=JSON.stringify({patch,report});
          const chunk=6500,n=Math.ceil(data.length/chunk);
          for(let i=0;i<n;i++) console.log('WAVEG_DELTA_'+String(i+1).padStart(2,'0')+'_'+String(n).padStart(2,'0')+'='+data.slice(i*chunk,(i+1)*chunk));
          console.log('WAVEG_DIAGNOSTIC='+JSON.stringify({changes:patch.positions.length,chars:data.length,parts:n}));
          NODE
