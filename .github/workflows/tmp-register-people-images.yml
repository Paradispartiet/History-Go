name: Temporary people image documentation registration

on:
  pull_request:

permissions:
  contents: write

jobs:
  register:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Register canonical people image contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          registry_path = Path("docs/documentation_registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          path = "docs/PEOPLE_IMAGES.md"
          if any(entry.get("path") == path for entry in registry["documents"]):
              raise SystemExit(f"Registry entry already exists: {path}")
          entry = {
              "path": path,
              "status": "canonical",
              "role": "Bindende source-, license-, approval-, local-storage- og attribution-kontrakt for people-bilder",
              "owns": ["people_image_rights_contract"],
              "last_verified": "2026-07-26",
          }
          insert_at = None
          for index, existing in enumerate(registry["documents"]):
              if existing.get("path") == "docs/DATA_PRODUCTION_CONTRACT.md":
                  insert_at = index + 1
                  break
          if insert_at is None:
              raise SystemExit("DATA_PRODUCTION_CONTRACT registry anchor missing")
          registry["documents"].insert(insert_at, entry)
          registry["last_verified"] = "2026-07-26"
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          replace_exact(
              "docs/README.md",
              "Dataproduksjonskontrakten er synkronisert med manifeststyrte, splittede politikk-places. Ved konflikt mellom dokumentasjon og et aktivt manifest er manifestet/runtime-koden sannhetskilden, og dokumentasjonen skal korrigeres.\n\n### Koordinater og geografisk evidens",
              "Dataproduksjonskontrakten er synkronisert med manifeststyrte, splittede politikk-places. Ved konflikt mellom dokumentasjon og et aktivt manifest er manifestet/runtime-koden sannhetskilden, og dokumentasjonen skal korrigeres.\n\n### People-bilder og rettigheter\n\n1. [`PEOPLE_IMAGES.md`](./PEOPLE_IMAGES.md) — canonical kilde-, lisens-, godkjennings- og attribusjonskontrakt\n2. [`../tools/people-image-pipeline.mts`](../tools/people-image-pipeline.mts) — implementert kandidat-, review-, apply- og audit-pipeline\n3. [`../tests/people-images.test.mjs`](../tests/people-images.test.mjs) — lisens-, identitets-, quality-, apply- og attribusjonsregresjoner\n4. [`../data/people/manifest.json`](../data/people/manifest.json) — aktive canonical people-source-filer\n\nPeople-bilder skal komme fra Wikidata/Wikimedia Commons gjennom lisensporten. Runtime leser lokale bildepaths og `imageMeta` fra canonical manifest-loadede people-filer; kandidat- og attribusjonsfilene er arbeids- og sporbarhetsdata, ikke en parallell people-sannhet.\n\n### Koordinater og geografisk evidens",
          )
          replace_exact(
              "docs/README.md",
              "- `PROFILE_PROGRESS_READER_RUNTIME.md` synkronisert og registrert som operational read-only runtime-guide",
              "- `PROFILE_PROGRESS_READER_RUNTIME.md` synkronisert og registrert som operational read-only runtime-guide\n- `PEOPLE_IMAGES.md` synkronisert med pipeline og registrert som canonical bilde- og rettighetskontrakt",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/README.md docs/documentation_registry.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Register canonical people image rights contract"
            git push origin HEAD:${{ github.head_ref }}
          fi
