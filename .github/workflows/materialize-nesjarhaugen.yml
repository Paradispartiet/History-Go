name: Materialize Nesjarhaugen quiz

on:
  push:
    branches:
      - agent/etne-nesjarhaugen-quiz

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-nesjarhaugen-quiz
          fetch-depth: 0

      - name: Extract and run assembly script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/build-nesjarhaugen-quiz.yml').read_text()
          marker = "          node <<'NODE'\n"
          start = text.index(marker) + len(marker)
          end = text.index('\n          NODE', start)
          block = text[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/assemble-nesjarhaugen.js').write_text('\n'.join(lines) + '\n')
          PY
          node /tmp/assemble-nesjarhaugen.js

      - name: Commit materialized quiz
        shell: bash
        run: |
          rm -f .github/workflows/build-nesjarhaugen-quiz.yml
          rm -f .github/workflows/materialize-nesjarhaugen.yml
          rm -f reports/nesjarhaugen-build-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize Nesjarhaugen quiz data'
          git push origin HEAD:agent/etne-nesjarhaugen-quiz
