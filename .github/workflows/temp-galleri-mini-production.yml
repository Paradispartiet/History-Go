name: Temporary Galleri Mini production

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  produce:
    if: github.head_ref == 'agent/oslo-coordinate-galleri-mini-production'
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-galleri-mini-production
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize Galleri Mini
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const placeId = 'galleri_mini_oslo';
          const placeRel = 'places/kunst/oslo/places_kunst/galleri_mini_oslo.json';
          const evidenceRel = 'oslo/kunst/galleri_mini_oslo.json';
          const lat = 59.90820098960685;
          const lon = 10.768031854087935;
          const sourceObjectId = 'geonorge-adresser-v1:0301:14861:1';
          const sourceUrl = 'https://ws.geonorge.no/adresser/v1/sok?sok=Munkegata%201%20Oslo';
          const coordNote = 'Offisiell adressekoordinat fra Geonorge Adresser API for Munkegata 1, OSLO. Punktet brukes som display- og unlock-anker for Galleri Mini. Munkegata 10 ble eksplisitt testet og ga ikke adressetreff; den tidligere tvetydigheten skyldtes en sammenklistret visning av Munkegata 1 og postnummer 0656.';

          const readJson = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const writeJson = (p, value) => {
            fs.mkdirSync(path.dirname(p), { recursive: true });
            fs.writeFileSync(p, JSON.stringify(value, null, 2) + '\n');
          };
          const haversine = (aLat, aLon, bLat, bLon) => {
            const R = 6371000;
            const dLat = (bLat - aLat) * Math.PI / 180;
            const dLon = (bLon - aLon) * Math.PI / 180;
            const x = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * Math.PI / 180) * Math.cos(bLat * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(x));
          };

          const currentIndex = readJson('data/places/places_index.json');
          if (currentIndex.some(p => p.id === placeId)) throw new Error(`${placeId} already exists in runtime index`);
          const nearby = currentIndex
            .filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon))
            .map(p => ({ id: p.id, name: p.name, category: p.category, distanceMeters: Math.round(haversine(lat, lon, p.lat, p.lon) * 10) / 10 }))
            .filter(p => p.distanceMeters <= 350)
            .sort((a, b) => a.distanceMeters - b.distanceMeters);

          const place = {
            id: placeId,
            name: 'Galleri Mini',
            lat,
            lon,
            r: 60,
            category: 'kunst',
            year: 2016,
            period: 'Galleri etablert i 2016',
            emne_ids: [
              'em_kunst_institusjonskritikk_og_representasjon',
              'em_kunst_kvalitet_kritikk_og_symbolsk_kapital',
              'em_kunst_okonomi_og_finansiering'
            ],
            desc: 'Lite samtidskunstgalleri i Munkegata 1 i Gamlebyen, etablert i 2016 med en tydelig profil mot yngre kunstnere og nye stemmer i kunstfeltet.',
            popupDesc: 'Galleri Mini holder til i Munkegata 1 i Gamlebyen og ble etablert i 2016 av Cecilia Kristensen. Galleriet har profilert seg som et lite visningssted med særlig oppmerksomhet mot unge kunstnere og kunstnere tidlig i karrieren.\n\nDen fysiske adressen har vært kilde til en konkret parsefeil i eksterne oppføringer: teksten «Munkegata 10656 Oslo» kan leses som husnummer 10, men er en sammenklistret visning av Munkegata 1 og postnummer 0656. Geonorge returnerer et entydig adressepunkt for Munkegata 1, mens et eksplisitt søk etter Munkegata 10 ikke gir treff. History Go bruker derfor Munkegata 1 som eneste canonical galleriadresse.\n\nSom lite galleri er Galleri Mini relevant for spørsmål om hvem som får sin første utstillingsmulighet, hvordan mindre visningssteder bygger nettverk og symbolsk kapital, og hvordan kunstscenen bæres av flere nivåer enn de store institusjonene. Stedet skal spørres som et konkret galleri med dokumentert adresse og profil, ikke som en generell markør for Gamlebyen.',
            quiz_profile: {
              place_type: 'kunstgalleri',
              subtype: 'lite_galleri_med_fokus_pa_yngre_kunstnere',
              signature_features: [
                'fast galleriadresse i Munkegata 1',
                'etablert i 2016',
                'grunnlagt av Cecilia Kristensen',
                'profil mot unge kunstnere og nye stemmer',
                'lite visningssted i Gamlebyen'
              ],
              primary_angles: [
                'galleripraksis',
                'unge_kunstnere_og_representasjon',
                'utstillingsmuligheter_og_karriere',
                'små_visningssteder',
                'kunstfelt_og_symbolsk_kapital'
              ],
              question_families: [
                'institusjonshistorie',
                'utstillingspraksis',
                'representasjon_og_karriere',
                'kunstfelt_og_nettverk',
                'kontrast'
              ],
              avoid_angles: [
                'generisk_gamlebyen_kunst',
                'forveksle_munkegata_1_med_munkegata_10',
                'presentere_grunnleggerens_egen_kunstpraksis_som_galleriets_start',
                'generisk_salgsgalleri'
              ],
              must_include: [
                'den konkrete adressen Munkegata 1',
                'etableringen i 2016',
                'profilen mot yngre kunstnere',
                'rollen som lite visningssted i kunstfeltet'
              ],
              contrast_targets: [
                'galleri_map',
                'kosk_oslo',
                'kunsthall_oslo'
              ],
              notes: 'Spør Galleri Mini som et konkret lite galleri og inngangspunkt i kunstfeltet. Eksterne utstillings-, galleri- og kunstkritiske kilder skal dominere synlig quizinnhold.'
            },
            locatorType: 'building',
            sourceProvider: 'official_address',
            sourceObjectId,
            address: {
              street: 'Munkegata',
              number: '1',
              postcode: '0656',
              city: 'Oslo',
              country: 'NO'
            },
            geocodeAccuracy: 'rooftop',
            coordRole: 'display_marker',
            coordStatus: 'verified',
            coordSource: 'geonorge_adresser_v1',
            coordSourceId: sourceObjectId,
            coordSourceUrl: sourceUrl,
            coordType: 'address_point',
            coordVerifiedAt: '2026-07-20',
            coordNote
          };
          writeJson(path.join('data', placeRel), place);

          const evidence = {
            schemaVersion: '1.0',
            placeId,
            placeFile: `data/${placeRel}`,
            evidenceStatus: 'applied_to_place',
            coordinateDecision: 'do_not_change_coordinates_yet',
            currentCoordinate: {
              lat,
              lon,
              r: 60,
              coordStatus: 'verified',
              coordSource: 'geonorge_adresser_v1',
              coordType: 'address_point',
              coordNote
            },
            identity: {
              currentName: 'Galleri Mini',
              resolvedIdentity: 'Galleri Mini at Munkegata 1, 0656 Oslo',
              identityStatus: 'resolved',
              identityProblem: '',
              locatorTypeCandidate: 'building',
              requiresSplit: false,
              splitReason: ''
            },
            requiredEvidence: [
              'entydig offisielt adressepunkt for Munkegata 1',
              'eksplisitt test av den feiltolkede Munkegata 10-kandidaten',
              'duplikat- og fysisk overlap-kontroll mot eksisterende Gamlebyen-steder'
            ],
            evidence: [
              {
                sourceProvider: 'official_address',
                sourceName: 'geonorge_adresser_v1',
                sourceUrl,
                sourceObjectId,
                sourceQuality: 'official_address_plus_resolved_address_parse',
                finding: 'Geonorge returnerer ett entydig adressepunkt for Munkegata 1. Et separat kontrolloppslag for Munkegata 10 returnerer ingen adresse. Den eksterne teksten Munkegata 10656 Oslo tolkes derfor som Munkegata 1 etterfulgt av postnummer 0656.',
                canVerifyCoordinate: true,
                reason: 'Det offisielle adressepunktet representerer den dokumenterte galleriadressen og den alternative husnummerlesningen er eksplisitt avvist.'
              }
            ],
            addressCandidates: [
              {
                address: 'Munkegata 1 Oslo',
                sourceProvider: 'official_address',
                sourceObjectId,
                lat,
                lon,
                canApplyToPlace: true
              },
              {
                address: 'Munkegata 10 Oslo',
                sourceProvider: 'official_address',
                sourceObjectId: null,
                canApplyToPlace: false
              }
            ],
            sourceObjectCandidates: [
              { sourceProvider: 'official_address', sourceObjectId, canApplyToPlace: true }
            ],
            geometryCandidates: [],
            coordinateCandidates: [
              { lat, lon, coordRole: 'display_marker', canApplyToPlace: true }
            ],
            decision: {
              canBecomeVerified: true,
              blockedReason: '',
              nextAction: 'Kildekontrakt, adresseparse-audit og representasjonsanker er anvendt på canonical place.'
            },
            notes: [coordNote]
          };
          writeJson(path.join('data/coordinate-evidence', evidenceRel), evidence);

          const placeManifestPath = 'data/places/manifest.json';
          const placeManifest = readJson(placeManifestPath);
          if (!placeManifest.files.includes(placeRel)) placeManifest.files.push(placeRel);
          writeJson(placeManifestPath, placeManifest);

          const evidenceManifestPath = 'data/coordinate-evidence/manifest.json';
          const evidenceManifest = readJson(evidenceManifestPath);
          if (!evidenceManifest.files.includes(evidenceRel)) evidenceManifest.files.push(evidenceRel);
          writeJson(evidenceManifestPath, evidenceManifest);

          const protocolPath = 'docs/coordinates/coordinate-control-protocol.md';
          let protocol = fs.readFileSync(protocolPath, 'utf8');
          const osloStart = protocol.indexOf('## Oslo');
          const noCoordStart = protocol.indexOf('### Dokumenterte Oslo-kontroller uten godkjent koordinat');
          if (osloStart < 0 || noCoordStart < 0) throw new Error('Could not locate bounded Oslo protocol section');
          const osloSection = protocol.slice(osloStart, noCoordStart);
          const rows = [...osloSection.matchAll(/^\| (\d+) \| `([^`]+)` \|.*$/gm)];
          if (!rows.length) throw new Error('No Oslo protocol rows found');
          const lastRow = rows[rows.length - 1];
          const maxBatch = Math.max(...rows.map(m => Number(m[1])));
          const nextBatch = maxBatch + 1;
          const newRow = `| ${nextBatch} | \`${placeId}\` | Galleri Mini | verified | \`${sourceObjectId}\` |`;
          const insertAt = osloStart + lastRow.index + lastRow[0].length;
          protocol = protocol.slice(0, insertAt) + '\n' + newRow + protocol.slice(insertAt);

          const summaryRe = /Oslo-tabellen inneholder nå (\d+) verifiserte eller kildekontrollerte canonical steder\. Batch \d+ legger til .*? Antallet fullførte kontroller uten godkjent Oslo-koordinat er (\d+)\./;
          const summaryMatch = protocol.match(summaryRe);
          if (!summaryMatch) throw new Error('Could not locate Oslo protocol summary');
          const newTotal = Number(summaryMatch[1]) + 1;
          const noCoordCount = Number(summaryMatch[2]);
          protocol = protocol.replace(summaryRe, `Oslo-tabellen inneholder nå ${newTotal} verifiserte eller kildekontrollerte canonical steder. Batch ${nextBatch} legger til Galleri Mini med den entydige offisielle Geonorge-adressekoordinaten for Munkegata 1; kontrolloppslaget for Munkegata 10 ga ingen adresse og parsekonflikten er eksplisitt lukket. Antallet fullførte kontroller uten godkjent Oslo-koordinat er ${noCoordCount}.`);
          fs.writeFileSync(protocolPath, protocol);

          const reportDir = 'reports/visitoslo-oslo-east-audit-20260720/galleri-mini';
          writeJson(path.join(reportDir, 'production-decision.json'), {
            placeId,
            decision: 'produce_single_gallery_place_at_munkegata_1',
            primaryCategory: 'kunst',
            coordinate: { lat, lon, sourceObjectId },
            nearbyWithin350m: nearby,
            identityDecision: 'Galleri Mini is the gallery at Munkegata 1. Munkegata 10 was a parse ambiguity only and does not resolve as an address in the normative finder.',
            protocolBatch: nextBatch
          });

          console.log(JSON.stringify({ placeId, nextBatch, nearby }, null, 2));
          NODE

      - name: Run and persist validation gates
        shell: bash
        run: |
          set -u
          LOGDIR="reports/coordinate-branch-runner/agent_oslo-coordinate-galleri-mini-production"
          mkdir -p "$LOGDIR"
          : > "$LOGDIR/gate-status.txt"
          BLOCKING_FAIL=0

          run_gate() {
            name="$1"
            shift
            set +e
            "$@" > >(tee "$LOGDIR/$name.log") 2>&1
            code=$?
            set -e
            printf '%s\n' "$code" > "$LOGDIR/$name.exit-code.txt"
            echo "$name=$code" >> "$LOGDIR/gate-status.txt"
            if [ "$code" -ne 0 ]; then BLOCKING_FAIL=1; fi
            return 0
          }

          set -e
          run_gate places-index-build npm run places:index:build
          run_gate split-manifest-sync npm run audit:places-split-manifest-sync
          run_gate places-index-check npm run places:index:check
          run_gate coordinate-source-contract npm run test:coordinate-source-contract
          run_gate coordinate-quality npm run places:coords:quality
          run_gate coordinate-intake npm run places:coords:intake -- --strict-new
          run_gate coordinate-evidence npm run places:coords:evidence:audit
          run_gate git-diff-check git diff --check

          set +e
          npm run health:places 2>&1 | tee "$LOGDIR/health-places.log"
          HEALTH_CODE=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$HEALTH_CODE" > "$LOGDIR/health-places.exit-code.txt"
          echo "health-places=$HEALTH_CODE" >> "$LOGDIR/gate-status.txt"
          printf '%s\n' "$BLOCKING_FAIL" > "$LOGDIR/blocking-fail.txt"

      - name: Commit production result
        shell: bash
        run: |
          set -euo pipefail
          LOGDIR="reports/coordinate-branch-runner/agent_oslo-coordinate-galleri-mini-production"
          BLOCKING_FAIL=$(cat "$LOGDIR/blocking-fail.txt")
          rm -f .github/workflows/temp-galleri-mini-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Galleri Mini as canonical Oslo art place"
          git push origin HEAD:agent/oslo-coordinate-galleri-mini-production
          if [ "$BLOCKING_FAIL" -ne 0 ]; then exit 1; fi
