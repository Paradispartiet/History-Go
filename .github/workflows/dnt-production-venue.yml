name: DNT production venue guard
on:
  pull_request:
    paths:
      - 'reports/place-production/det-norske-teatret/20261013/productions-c10.json'
      - 'reports/place-production/det-norske-teatret/20261020/productions-c30-venue-and-image-rights.md'
      - 'reports/place-production/det-norske-teatret-workcard-current.json'
      - 'data/quizcards/scenekunst/**'
      - 'data/quiz/musikk/det_norske_teatret_sets_merged.json'
      - 'js/ui/place-card-quizcards-patch.js'
      - 'tests/det-norske-teatret-quizcard-house-dom.test.mjs'
      - 'tests/det-norske-teatret-production-venue.test.mjs'
      - 'tests/det-norske-teatret-objects-rights-c31.test.mjs'
      - 'reports/place-production/det-norske-teatret/20261020/objects-c31-candidates.json'
      - 'reports/place-production/det-norske-teatret/20261020/portrait-rights-c31.json'
      - 'reports/place-production/det-norske-teatret/20261020/objects-and-portrait-rights-c31.md'
      - '.github/workflows/dnt-production-venue.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-venue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-npm
      - name: Confirm venue/media guards and place-focused QuizCard source/DOM parity
        run: node --test tests/det-norske-teatret-production-venue.test.mjs tests/det-norske-teatret-quizcard-house-dom.test.mjs tests/det-norske-teatret-objects-rights-c31.test.mjs
