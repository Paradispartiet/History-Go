      - '.github/workflows/dnt-production-venue.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-venue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-npm
      - name: Confirm venue/media guards and place-focused QuizCard source/DOM parity
        run: node --test tests/det-norske-teatret-production-venue.test.mjs tests/det-norske-teatret-quizcard-house-dom.test.mjs tests/det-norske-teatret-objects-rights-c31.test.mjs tests/det-norske-teatret-objects-rights-c37.test.mjs tests/det-norske-teatret-costume-visual-review-c38.test.mjs tests/det-norske-teatret-rights-routing-c39.test.mjs tests/det-norske-teatret-source-image-links-c40.test.mjs tests/det-norske-teatret-source-photo-inline-c41.test.mjs tests/det-norske-teatret-foyer-sources-c47.test.mjs tests/det-norske-teatret-public-proof-objects-c48.test.mjs tests/det-norske-teatret-illustration-fallback-c49.test.mjs tests/det-norske-teatret-objects-c50.test.mjs tests/det-norske-teatret-object-image-c32.test.mjs tests/det-norske-teatret-costume-asset-c33.test.mjs tests/det-norske-teatret-front-image-c34.test.mjs tests/det-norske-teatret-front-asset-c35.test.mjs tests/det-norske-teatret-front-activation-c36.test.mjs
