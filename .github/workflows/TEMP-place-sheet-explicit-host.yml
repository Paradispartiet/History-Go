name: TEMP Place Sheet explicit host materialization

on:
  push:
    branches:
      - agent/place-sheet-explicit-host-20260909

permissions:
  contents: write

concurrency:
  group: temp-place-sheet-explicit-host
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/place-sheet-explicit-host-20260909
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize explicit host contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              source = p.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              p.write_text(source.replace(old, new, 1))

          replace_once(
              "js/ui/place-popup-v2.js",
              "  async function showPlacePopupV2(inputPlace) {",
              "  async function showPlacePopupV2(inputPlace, options = null) {"
          )

          replace_once(
              "js/ui/place-popup-v2.js",
              '''    makePopup(html, "place-popup place-popup-v2");\n\n    const popup = document.querySelector(".hg-popup.place-popup-v2");\n    attachHeroImage(popup, candidates);''',
              '''    const unifiedHost = options && typeof options === "object" ? options.unifiedHost : null;\n    let popup = null;\n    if (unifiedHost && typeof unifiedHost.replaceChildren === "function") {\n      // Explicit Place Sheet target: keep the canonical renderer, but do not\n      // instantiate a standalone modal first. The compatibility shell remains\n      // until the Unified adapter no longer needs the legacy popup CSS contract.\n      try { helper("closePopup")?.(); } catch {}\n      const shell = document.createElement("div");\n      shell.className = "hg-popup place-popup place-popup-v2";\n      shell.dataset.hgUnifiedDirectHost = "1";\n      shell.innerHTML = `\n        <div class="hg-popup-inner hg-modal-card">\n          <button class="hg-popup-close hg-modal-close" data-close-popup hidden aria-hidden="true" tabindex="-1">✕</button>\n          ${html}\n        </div>\n      `;\n      unifiedHost.replaceChildren(shell);\n      popup = shell;\n      try {\n        global.dispatchEvent?.(new CustomEvent("hg:place-unified-host-rendered", {\n          detail: { placeId: String(place?.id || "") }\n        }));\n      } catch {}\n    } else {\n      makePopup(html, "place-popup place-popup-v2");\n      popup = document.querySelector(".hg-popup.place-popup-v2");\n    }\n    attachHeroImage(popup, candidates);'''
          )

          replace_once(
              "js/ui/place-unified-surface.ts",
              "    host.replaceChildren(popup);",
              "    if (popup.parentElement !== host) host.replaceChildren(popup);"
          )

          replace_once(
              "js/ui/place-unified-surface.ts",
              "      const result = legacyShowPlacePopup(place);",
              "      const result = legacyShowPlacePopup(place, { unifiedHost: host instanceof HTMLElement ? host : null });"
          )

          replace_once(
              ".github/workflows/place-open-payloads.yml",
              "      - 'tests/place-popup-unified-host-bridge.test.mjs'\n      - 'tests/place-unified-surface.test.mjs'",
              "      - 'tests/place-popup-unified-host-bridge.test.mjs'\n      - 'tests/place-popup-v2-unified-target.test.mjs'\n      - 'tests/place-unified-surface.test.mjs'"
          )

          replace_once(
              ".github/workflows/place-open-payloads.yml",
              "          node --check tests/place-popup-unified-host-bridge.test.mjs\n          node --test tests/place-unified-surface.test.mjs tests/place-popup-unified-host-bridge.test.mjs",
              "          node --check tests/place-popup-unified-host-bridge.test.mjs\n          node --check tests/place-popup-v2-unified-target.test.mjs\n          node --test tests/place-unified-surface.test.mjs tests/place-popup-unified-host-bridge.test.mjs tests/place-popup-v2-unified-target.test.mjs"
          )
          PY

      - name: Validate source contract before build
        run: |
          node --check js/ui/place-popup-v2.js
          node --check tests/place-popup-v2-unified-target.test.mjs
          npm run typecheck:web
          node --test tests/place-popup-v2-unified-target.test.mjs tests/place-popup-unified-host-bridge.test.mjs tests/place-unified-surface.test.mjs

      - name: Regenerate committed browser runtime
        run: npm run build:web

      - name: Commit canonical source and generated runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            js/ui/place-popup-v2.js \
            js/ui/place-unified-surface.ts \
            dist/web/place-unified-surface.js \
            dist/web/place-unified-surface.js.map \
            .github/workflows/place-open-payloads.yml
          git diff --cached --check
          git commit -m "Add explicit Unified Place renderer target"
          git push origin HEAD:agent/place-sheet-explicit-host-20260909
