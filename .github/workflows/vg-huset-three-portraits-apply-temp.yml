name: VG-huset three People portraits apply (temporary)
on:
  push:
    branches: [agent/vg-huset-source-preflight-20261009]
    paths: ['.github/workflows/vg-huset-three-portraits-apply-temp.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify three explicit manually approved Commons candidates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cs=JSON.parse(fs.readFileSync('data/people/people_image_candidates.json','utf8'));
          const ps=JSON.parse(fs.readFileSync('data/people/media/oslo/people_media_oslo.json','utf8'));
          const expected=new Map([
            ['torry_pedersen','torry_pedersen__torry_pedersen_190633_jpg'],
            ['bernt_olufsen','bernt_olufsen__bernt_olufsen_mediedagene_2010_jpg'],
            ['trine_eilertsen','trine_eilertsen__trine_eilertsen_192054_jpg']
          ]);
          for(const [id,cid] of expected){
            const cs1=cs.filter(x=>x.personId===id&&x.candidateId===cid);
            const person=ps.find(x=>x.id===id);
            if(cs1.length!==1||cs1[0].approved!==true||!person||person.image||person.cardImage)throw new Error('Candidate/target drift '+id);
            if(!cs1[0].creator||!cs1[0].credit||cs1[0].quality?.hardErrors?.length)throw new Error('No approved creator or clean quality for '+id);
            console.log('Reviewed subject and attribution:',id,cid,cs1[0].creator,cs1[0].license);
          }
          NODE
      - name: Import only three requested originals using canonical People image pipeline
        shell: bash
        run: |
          set -euo pipefail
          npm run people:images:apply -- --approved-ids=torry_pedersen,bernt_olufsen,trine_eilertsen
          npm run people:images:apply:write -- --approved-ids=torry_pedersen,bernt_olufsen,trine_eilertsen
      - name: Verify actual pixels, attribution and deterministic runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run place-open:build
          npm run place-open:check
          npm run audit:people-of-places
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import sharp from 'sharp';
          const ps=JSON.parse(fs.readFileSync('data/people/media/oslo/people_media_oslo.json','utf8'));
          const at=JSON.parse(fs.readFileSync('data/people/people_image_attributions.json','utf8'));
          for(const id of ['torry_pedersen','bernt_olufsen','trine_eilertsen']){
            const p=ps.find(x=>x.id===id);
            if(!p.image||p.cardImage!==p.image||p.imageMeta?.source!=='wikimedia_commons'||p.imageMeta?.reviewStatus!=='manually_approved')throw new Error('Bad canonical People photo '+id);
            const dims=await sharp(p.image).metadata();
            if(dims.width<350||dims.height<350||!at.some(x=>x.personId===id&&x.file===p.image&&x.license===p.imageMeta.license))throw new Error('Bad real pixels/credits '+id);
            console.log('Verified real person photo',id,p.image,dims.width,dims.height,p.imageMeta.creator,p.imageMeta.license);
          }
          NODE
      - name: Commit only bounded People runtime and three photo assets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const files=execFileSync('git',['status','--porcelain','--untracked-files=all'],{encoding:'utf8'})
            .trimEnd().split(/\r?\n/u).filter(Boolean).map(x=>x.slice(3));
          const images=new Set([
            'bilder/kort/people/torry_pedersen.jpg',
            'bilder/kort/people/bernt_olufsen.jpg',
            'bilder/kort/people/trine_eilertsen.jpg'
          ]);
          const allowed=x=>images.has(x)
            || /^data\/runtime\/people-all\/part-\d{3}\.json$/u.test(x)
            || new Set([
              'data/people/media/oslo/people_media_oslo.json',
              'data/people/people_image_attributions.json',
              'data/runtime/people-all.json',
              'data/runtime/place-open/vg_huset.json',
              'reports/people-of-places-status.json',
              'reports/people-of-places-status.md'
            ]).has(x);
          console.log('Scoped modified assets:',files);
          if(files.some(x=>!allowed(x))||[...images].some(x=>!files.includes(x)))throw new Error('Unexpected outputs or missing image');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/kort/people/torry_pedersen.jpg bilder/kort/people/bernt_olufsen.jpg bilder/kort/people/trine_eilertsen.jpg
          git add data/people/media/oslo/people_media_oslo.json data/people/people_image_attributions.json
          git add data/runtime/people-all data/runtime/people-all.json data/runtime/place-open/vg_huset.json
          git add reports/people-of-places-status.json reports/people-of-places-status.md
          git commit -m "feat(vg-huset): import three reviewed licensed People photos"
          git push origin HEAD:agent/vg-huset-source-preflight-20261009
