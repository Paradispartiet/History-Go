name: Litteratur maintenance integrity

on:
  pull_request:
    paths:
      - 'data/fagverk/litteratur/maintenance/**'
      - 'data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/poetikk_estetikk_litteraritet/claims.json'
      - 'data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/sprak_stil_retorikk/claims.json'
      - 'data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/narratologi_prosa/claims.json'
      - 'data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/lyrikk_poetiske_former/claims.json'
      - 'data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/drama_teatertekst_framforing/claims.json'
      - 'data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/sjanger_modus_form/claims.json'
      - 'data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/leser_resepsjon_affekt/claims.json'
      - 'data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/forfatterskap_intertekstualitet/claims.json'
      - 'data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/tekstkritikk_bokhistorie_arkiv/claims.json'
      - 'data/quiz/litteratur/litteratur_subject_pathways_v1.json'
      - 'data/knowledge/subjects/litteratur/knowledge_units.generated.json'
      - 'scripts/materialize-litteratur-poetics-style-v1.mjs'
      - 'scripts/materialize-litteratur-narrative-poetry-v1.mjs'
      - 'scripts/materialize-litteratur-drama-genre-v1.mjs'
      - 'scripts/materialize-litteratur-drama-full-field-v1.mjs'
      - 'scripts/materialize-litteratur-reader-reception-full-field-v1.mjs'
      - 'scripts/materialize-litteratur-authorship-textual-full-fields-v1.mjs'
      - 'scripts/audit-litteratur-maintenance-source-refresh-round1.mjs'
      - 'scripts/audit-litteratur-maintenance-source-refresh-round2.mjs'
      - 'scripts/audit-litteratur-maintenance-source-refresh-round3.mjs'
      - 'scripts/audit-litteratur-maintenance-source-refresh-round4.mjs'
      - 'scripts/audit-litteratur-maintenance-source-refresh-round5.mjs'
      - 'scripts/audit-litteratur-maintenance-source-refresh-round6.mjs'
      - 'scripts/audit-litteratur-maintenance-source-refresh-round7.mjs'
      - 'scripts/audit-litteratur-maintenance-source-refresh-round8.mjs'
      - 'scripts/audit-litteratur-maintenance-source-refresh-round9.mjs'
      - 'scripts/audit-litteratur-maintenance-source-refresh-round10.mjs'
      - 'tests/litteratur-maintenance-source-refresh-round1.test.mjs'
      - 'tests/litteratur-maintenance-source-refresh-round2.test.mjs'
      - 'tests/litteratur-maintenance-source-refresh-round3.test.mjs'
      - 'tests/litteratur-maintenance-source-refresh-round4.test.mjs'
      - 'tests/litteratur-maintenance-source-refresh-round5.test.mjs'
      - 'tests/litteratur-maintenance-source-refresh-round6.test.mjs'
      - 'tests/litteratur-maintenance-source-refresh-round7.test.mjs'
      - 'tests/litteratur-maintenance-source-refresh-round8.test.mjs'
      - 'tests/litteratur-maintenance-source-refresh-round9.test.mjs'
      - 'tests/litteratur-maintenance-source-refresh-round10.test.mjs'
      - '.github/workflows/litteratur-maintenance-integrity.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit Litteratur source refresh round 1
        run: |
          node --check scripts/audit-litteratur-maintenance-source-refresh-round1.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round1.mjs
          node --test tests/litteratur-maintenance-source-refresh-round1.test.mjs
      - name: Audit Litteratur source refresh round 2
        run: |
          node --check scripts/audit-litteratur-maintenance-source-refresh-round2.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round2.mjs
          node --test tests/litteratur-maintenance-source-refresh-round2.test.mjs
      - name: Audit Litteratur source refresh round 3
        run: |
          node --check scripts/audit-litteratur-maintenance-source-refresh-round3.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round3.mjs
          node --test tests/litteratur-maintenance-source-refresh-round3.test.mjs
      - name: Audit Litteratur source refresh round 4
        run: |
          node --check scripts/audit-litteratur-maintenance-source-refresh-round4.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round4.mjs
          node --test tests/litteratur-maintenance-source-refresh-round4.test.mjs
      - name: Audit Litteratur source refresh round 5
        run: |
          node --check scripts/audit-litteratur-maintenance-source-refresh-round5.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round5.mjs
          node --test tests/litteratur-maintenance-source-refresh-round5.test.mjs
      - name: Audit Litteratur source refresh round 6
        run: |
          node --check scripts/audit-litteratur-maintenance-source-refresh-round6.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round6.mjs
          node --test tests/litteratur-maintenance-source-refresh-round6.test.mjs
      - name: Audit Litteratur source refresh round 7
        run: |
          node --check scripts/audit-litteratur-maintenance-source-refresh-round7.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round7.mjs
          node --test tests/litteratur-maintenance-source-refresh-round7.test.mjs
      - name: Audit Litteratur source refresh round 8
        run: |
          node --check scripts/audit-litteratur-maintenance-source-refresh-round8.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round8.mjs
          node --test tests/litteratur-maintenance-source-refresh-round8.test.mjs
      - name: Audit Litteratur source refresh round 9
        run: |
          node --check scripts/audit-litteratur-maintenance-source-refresh-round9.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round9.mjs
          node --test tests/litteratur-maintenance-source-refresh-round9.test.mjs
      - name: Audit Litteratur source refresh round 10
        run: |
          node --check scripts/audit-litteratur-maintenance-source-refresh-round10.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round10.mjs
          node --test tests/litteratur-maintenance-source-refresh-round10.test.mjs
      - name: Preserve Litteratur assessment and theory integrity
        run: |
          node scripts/audit-litteratur-assessment-v1.mjs
          node tools/audit-litteratur-theory-integrity.mjs
          node --test tests/litteratur-assessment-v1.test.mjs tests/litteratur-theory-integrity.test.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
