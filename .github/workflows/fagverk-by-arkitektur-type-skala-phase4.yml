name: Fagverk By Arkitektur type skala phase 4

on:
  pull_request:
    paths:
      - "data/fagverk/by/**"
      - "data/fagverk/fagverk_registry.json"
      - "data/fagverk/subject_status.json"
      - "data/fagverk/fagverk_release.json"
      - "data/fag/by/**"
      - "js/fagverk-subject-core.js"
      - "scripts/audit-fagverk-subject-inventory.mjs"
      - "scripts/audit-fagverk-general-engine.mjs"
      - "scripts/audit-fagverk-by-pilot.mjs"
      - "scripts/audit-fagverk-by-byliv-offentlige-rom-phase4.mjs"
      - "scripts/audit-fagverk-by-byliv-sosial-offentlighet-phase4.mjs"
      - "scripts/audit-fagverk-by-byliv-hendelser-midlertidighet-phase4.mjs"
      - "scripts/audit-fagverk-by-byliv-stemning-mikrokomfort-phase4.mjs"
      - "scripts/audit-fagverk-by-byliv-rytmer-miks-konflikt-phase4.mjs"
      - "scripts/audit-fagverk-by-arkitektur-type-skala-phase4.mjs"
      - "scripts/build-fagverk-release-manifest.mjs"
      - "tests/fagverk-subject-inventory.test.mjs"
      - "tests/fagverk-general-engine.test.mjs"
      - "tests/fagverk-by-pilot.test.mjs"
      - "tests/fagverk-by-byliv-offentlige-rom-phase4.test.mjs"
      - "tests/fagverk-by-byliv-sosial-offentlighet-phase4.test.mjs"
      - "tests/fagverk-by-byliv-hendelser-midlertidighet-phase4.test.mjs"
      - "tests/fagverk-by-byliv-stemning-mikrokomfort-phase4.test.mjs"
      - "tests/fagverk-by-byliv-rytmer-miks-konflikt-phase4.test.mjs"
      - "tests/fagverk-by-arkitektur-type-skala-phase4.test.mjs"
      - "tests/fagverk-release-manifest.test.mjs"
      - "reports/fagverk/**"
      - ".github/workflows/fagverk-by-arkitektur-type-skala-phase4.yml"
  push:
    branches: [main]
    paths:
      - "data/fagverk/by/**"
      - "data/fagverk/fagverk_registry.json"
      - "data/fagverk/subject_status.json"
      - "data/fagverk/fagverk_release.json"
      - "scripts/audit-fagverk-by-pilot.mjs"
      - "scripts/audit-fagverk-by-byliv-offentlige-rom-phase4.mjs"
      - "scripts/audit-fagverk-by-byliv-sosial-offentlighet-phase4.mjs"
      - "scripts/audit-fagverk-by-byliv-hendelser-midlertidighet-phase4.mjs"
      - "scripts/audit-fagverk-by-byliv-stemning-mikrokomfort-phase4.mjs"
      - "scripts/audit-fagverk-by-byliv-rytmer-miks-konflikt-phase4.mjs"
      - "scripts/audit-fagverk-by-arkitektur-type-skala-phase4.mjs"
      - "tests/fagverk-by-pilot.test.mjs"
      - "tests/fagverk-by-byliv-offentlige-rom-phase4.test.mjs"
      - "tests/fagverk-by-byliv-sosial-offentlighet-phase4.test.mjs"
      - "tests/fagverk-by-byliv-hendelser-midlertidighet-phase4.test.mjs"
      - "tests/fagverk-by-byliv-stemning-mikrokomfort-phase4.test.mjs"
      - "tests/fagverk-by-byliv-rytmer-miks-konflikt-phase4.test.mjs"
      - "tests/fagverk-by-arkitektur-type-skala-phase4.test.mjs"
      - "reports/fagverk/**"
      - ".github/workflows/fagverk-by-arkitektur-type-skala-phase4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate By Arkitektur type og skala phase 4 chapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate deterministic By chapter audits
        run: |
          node --check scripts/audit-fagverk-by-byliv-offentlige-rom-phase4.mjs
          node --check scripts/audit-fagverk-by-byliv-sosial-offentlighet-phase4.mjs
          node --check scripts/audit-fagverk-by-byliv-hendelser-midlertidighet-phase4.mjs
          node --check scripts/audit-fagverk-by-byliv-stemning-mikrokomfort-phase4.mjs
          node --check scripts/audit-fagverk-by-byliv-rytmer-miks-konflikt-phase4.mjs
          node --check scripts/audit-fagverk-by-arkitektur-type-skala-phase4.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-by-pilot.mjs
          node scripts/audit-fagverk-by-byliv-offentlige-rom-phase4.mjs
          node scripts/audit-fagverk-by-byliv-sosial-offentlighet-phase4.mjs
          node scripts/audit-fagverk-by-byliv-hendelser-midlertidighet-phase4.mjs
          node scripts/audit-fagverk-by-byliv-stemning-mikrokomfort-phase4.mjs
          node scripts/audit-fagverk-by-byliv-rytmer-miks-konflikt-phase4.mjs
          node scripts/audit-fagverk-by-arkitektur-type-skala-phase4.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Validate Byliv preservation and first Arkitektur chapter
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-by-pilot.test.mjs
          node --test tests/fagverk-by-byliv-offentlige-rom-phase4.test.mjs
          node --test tests/fagverk-by-byliv-sosial-offentlighet-phase4.test.mjs
          node --test tests/fagverk-by-byliv-hendelser-midlertidighet-phase4.test.mjs
          node --test tests/fagverk-by-byliv-stemning-mikrokomfort-phase4.test.mjs
          node --test tests/fagverk-by-byliv-rytmer-miks-konflikt-phase4.test.mjs
          node --test tests/fagverk-by-arkitektur-type-skala-phase4.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
