# TEMP 4H-D integration diagnose; remove before PR
name: TEMP Civication 4H-D semantic playthrough diagnose

on:
  push:
    branches:
      - agent/civication-4hd-semantic-playthrough-gate-20260817
    paths:
      - .github/workflows/civication-4hd-semantic-playthrough-diagnose.yml

permissions:
  contents: write

concurrency:
  group: civication-4hd-semantic-playthrough-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-4hd-semantic-playthrough-gate-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply 4H-D runtime/compiler/harness patch
        run: |
          python scripts/.tmp-civication-4hd-semantic-playthrough.py
          python scripts/.tmp-civication-4hd-mail-loop-debug.py
          python scripts/.tmp-civication-4hd-stage2.py
          python scripts/.tmp-civication-4hd-film-harness.py
          node scripts/build-civication-scene-registry.mjs --write
          node scripts/build-civication-scene-registry.mjs --check
          node scripts/audit-civication-career-gameplay.mjs --write
      - name: Run focused 4H-D gate
        run: node tests/civication-semantic-playthrough-gate.test.js
      - name: Run brand runtime regression
        run: node tests/civication-brand-mail-runtime.test.js
      - name: Run Film TV runtime regression
        run: node tests/civication-film-tv-produksjonsassistent-playability.test.js
      - name: Run legacy mail-loop regression
        run: node tests/civication-mail-loop.test.js
      - name: Run full Civication suite
        shell: bash
        run: |
          set +e
          npm run test:civication > .tmp-civication-4hd-full-suite.log 2>&1
          status=$?
          cat .tmp-civication-4hd-full-suite.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f .tmp-civication-4hd-full-suite.log
            if ! git diff --cached --quiet; then
              git commit -m "Capture Civication 4H-D full-suite failure"
              git push origin HEAD:agent/civication-4hd-semantic-playthrough-gate-20260817
            fi
          fi
          exit "$status"
      - name: Commit verified permanent 4H-D changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/build-civication-scene-registry.mjs \
            data/Civication/compiledSceneRegistryV1.json \
            data/Civication/careerGameplayMatrix.json \
            reports/civication-career-gameplay-matrix.md \
            js/Civication/systems/civicationMailRuntime.js \
            js/Civication/systems/civicationWorkdayMailBuilder.js \
            tests/civication-mail-loop.test.js \
            tests/civication-semantic-playthrough-gate.test.js \
            tests/civication-brand-mail-runtime.test.js \
            tests/civication-controller-day1-daily-builder.test.js \
            tests/civication-controller-two-week-flow.test.js \
            tests/civication-ekspeditor-brand-flow.test.js \
            tests/civication-ekspeditor-ui-flow.test.js \
            tests/civication-fagarbeider-two-week-flow.test.js \
            tests/civication-film-tv-produksjonsassistent-playability.test.js \
            tests/civication-first-week-praksisfortellinger.test.js \
            tests/civication-mellomleder-two-week-flow.test.js \
            tests/civication-praksisfortellinger-cross-role.test.js \
            tests/civication-praksisfortellinger-two-week-flow.test.js \
            tests/civication-second-week-praksisfortellinger.test.js
          if git diff --cached --quiet; then
            echo "No verified changes to commit"
          else
            git commit -m "Complete Civication 4H-D semantic playthrough gate"
            git push origin HEAD:agent/civication-4hd-semantic-playthrough-gate-20260817
          fi
