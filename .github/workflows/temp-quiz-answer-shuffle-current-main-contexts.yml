name: TEMP quiz answer shuffle current-main contexts

on:
  push:
    branches:
      - governance/quiz-answer-shuffle-20260829
    paths:
      - ".github/workflows/temp-quiz-answer-shuffle-current-main-contexts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-quiz-answer-shuffle-current-main-contexts
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out quiz branch
        uses: actions/checkout@v4
        with:
          ref: governance/quiz-answer-shuffle-20260829
          fetch-depth: 0

      - name: Fetch current main and PR merge tree
        run: |
          git fetch origin main
          git fetch origin +refs/pull/5506/merge:refs/remotes/origin/pr-5506-merge

      - name: Create current merged worktree
        run: git worktree add /tmp/pr-5506-merge refs/remotes/origin/pr-5506-merge

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies in merged worktree
        working-directory: /tmp/pr-5506-merge
        run: npm ci

      - name: Rebuild every production context against current main plus PR
        working-directory: /tmp/pr-5506-merge
        run: |
          npm run quiz:context
          npm run audit:quiz-production-context
          git diff --check

      - name: Copy regenerated contexts back to PR branch
        run: |
          rm -rf data/quiz/production_context
          cp -a /tmp/pr-5506-merge/data/quiz/production_context data/quiz/production_context

      - name: Commit contexts and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-quiz-answer-shuffle-current-main-contexts.yml
          git add data/quiz/production_context
          git diff --cached --check
          git commit -m "Refresh quiz contexts against current main"
          git push origin HEAD:governance/quiz-answer-shuffle-20260829
