name: One-time run documentation phase 20 historical routes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-run-documentation-phase-20-historical-routes.yml

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-governance-phase-20-historical-routes
          fetch-depth: 0

      - name: Synchronize latest main
        shell: bash
        run: |
          git fetch origin main
          git merge --no-edit origin/main

      - name: Run the reviewed consolidation specification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/temporary-documentation-phase-20-historical-routes.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          marker = "          python - <<'PY'"
          end = "          PY"
          start_index = lines.index(marker) + 1
          end_index = lines.index(end, start_index)
          script_lines = []
          for line in lines[start_index:end_index]:
              if line.startswith('          '):
                  line = line[10:]
              script_lines.append(line)
          Path('/tmp/consolidate_historical_routes_docs.py').write_text(
              '\n'.join(script_lines) + '\n', encoding='utf-8'
          )
          PY
          python /tmp/consolidate_historical_routes_docs.py

      - name: Remove temporary workflows from target branch
        shell: bash
        run: |
          rm .github/workflows/temporary-documentation-phase-20-historical-routes.yml
          rm .github/workflows/one-time-run-documentation-phase-20-historical-routes.yml

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate documentation and historical routes
        shell: bash
        run: |
          npm run build:scripts
          node dist/scripts/check-documentation-governance.mjs
          npm run test:historical-routes
          npm run test:nextup-historical-routes
          npm run test:historical-routes:audit

      - name: Verify archive identity and final target scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          active = Path('docs/README_HistoryGo_Historiske_Ruter.md')
          archive = Path('reports/archive/2026-07/historical-routes/README_HistoryGo_Historiske_Ruter_PRE_CONSOLIDATION_2026-07-26.md')
          registry = json.loads(Path('docs/documentation_registry.json').read_text(encoding='utf-8'))
          entries = {entry['path']: entry for entry in registry['documents']}

          assert entries[str(active)]['status'] == 'operational'
          assert entries[str(active)]['owns'] == ['historical_routes_runtime_guide']
          schema = entries['data/routes/historical/schema_historical_route.json']
          assert schema['status'] == 'canonical'
          assert schema['owns'] == ['historical_routes_data_schema']
          assert entries[str(archive)]['status'] == 'historical'
          assert 'v0.6 — Nextup-kobling' not in active.read_text(encoding='utf-8')
          assert 'Første byggefase: v0.1' in archive.read_text(encoding='utf-8')

          original_blob = subprocess.check_output([
              'git', 'show', 'HEAD^1:docs/README_HistoryGo_Historiske_Ruter.md'
          ])
          assert hashlib.sha256(original_blob).hexdigest() == hashlib.sha256(archive.read_bytes()).hexdigest()

          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD']).decode().splitlines())
          expected = {
              '.github/workflows/one-time-run-documentation-phase-20-historical-routes.yml',
              '.github/workflows/temporary-documentation-phase-20-historical-routes.yml',
              'docs/README.md',
              'docs/README_HistoryGo_Historiske_Ruter.md',
              'docs/documentation_registry.json',
              'reports/archive/2026-07/README.md',
              'reports/archive/2026-07/historical-routes/README.md',
              'reports/archive/2026-07/historical-routes/README_HistoryGo_Historiske_Ruter_PRE_CONSOLIDATION_2026-07-26.md',
          }
          assert changed == expected, (changed, expected)
          PY

      - name: Commit final target branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Konsolider dokumentasjonen for Historiske ruter"
          git push origin HEAD:agent/documentation-governance-phase-20-historical-routes

      - name: Remove one-time runner from main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm .github/workflows/one-time-run-documentation-phase-20-historical-routes.yml
          git add .github/workflows/one-time-run-documentation-phase-20-historical-routes.yml
          git commit -m "Fjern engangsrunner for dokumentasjonsfase 20"
          git push origin HEAD:main

# Touch 2026-07-26: ensure the default-branch push trigger is materialized.
