name: History editorial separation materialize temporary
# Self-reporting one-shot writer. It either commits the repaired generator/corpus or only a failure report. Delete before merge.
# Materialization is branch-SHA locked; latest main is reconciled again before final CI and merge.
# Retriggered after semantic-owner correction on the main-synchronized History head.

on:
  push:
    branches:
      - agent/history-completion-audit
    paths:
      - '.github/workflows/history-editorial-separation-materialize-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact History branch
        uses: actions/checkout@v4
        with:
          ref: agent/history-completion-audit
          fetch-depth: 0

      - name: Lock History head and observe current main
        shell: bash
        run: |
          set -euo pipefail
          echo "INITIAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main agent/history-completion-audit
          echo "OBSERVED_MAIN=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run materialization stages and record exact result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/fagverk
          python3 <<'PY'
          import json
          import os
          import subprocess

          stages = [
              ('patch_generator', ['python3', 'tools/patch-historie-editorial-separation-temp.py']),
              ('semantic_alignment', ['node', 'tools/audit-historie-semantic-hook-alignment.mjs']),
              ('materialize_corpus', ['node', 'tools/materialize-historie-editorial-chapters.mjs']),
              ('deterministic_replay', ['node', 'tools/materialize-historie-editorial-chapters.mjs', '--check']),
              ('editorial_quality', ['node', 'tools/validate-historie-editorial-quality.mjs']),
              ('shared_history_audit', ['node', 'scripts/audit-fagverk-historie.mjs']),
          ]
          results = []
          blocked = False
          for stage_id, command in stages:
              if blocked:
                  results.append({'id': stage_id, 'status': 'SKIPPED', 'exit_code': None, 'stdout': '', 'stderr': 'blocked by earlier failure'})
                  continue
              run = subprocess.run(command, text=True, capture_output=True)
              results.append({
                  'id': stage_id,
                  'status': 'PASS' if run.returncode == 0 else 'FAIL',
                  'exit_code': run.returncode,
                  'stdout': run.stdout.strip(),
                  'stderr': run.stderr.strip(),
              })
              if run.returncode != 0:
                  blocked = True

          failed = [row['id'] for row in results if row['status'] == 'FAIL']
          report = {
              'schema': 'history_go_historie_editorial_materialization_temp_v1',
              'generated_from_head': os.environ.get('INITIAL_HEAD'),
              'observed_main': os.environ.get('OBSERVED_MAIN'),
              'status': 'FAIL' if failed else 'PASS',
              'failed_checks': failed,
              'checks': results,
          }
          with open('reports/fagverk/historie-editorial-materialization-temp.json', 'w') as handle:
              json.dump(report, handle, indent=2, ensure_ascii=False)
              handle.write('\n')
          print(json.dumps({'status': report['status'], 'failed_checks': failed}, ensure_ascii=False))
          PY

      - name: Commit repaired corpus or diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          status="$(python3 - <<'PY'
          import json
          print(json.load(open('reports/fagverk/historie-editorial-materialization-temp.json'))['status'])
          PY
          )"

          if [ "$status" = 'PASS' ]; then
            git add \
              tools/materialize-historie-editorial-chapters.mjs \
              data/fagverk/historie \
              data/fagverk/fagverk_registry.json \
              data/fagverk/subject_status.json \
              reports/fagverk/historie-editorial-materialization-temp.json
            message='Separate History semantic identity from editorial theory selection'
          else
            git restore --source="$INITIAL_HEAD" --worktree --staged -- \
              tools/materialize-historie-editorial-chapters.mjs \
              data/fagverk/historie \
              data/fagverk/fagverk_registry.json \
              data/fagverk/subject_status.json || true
            git add reports/fagverk/historie-editorial-materialization-temp.json
            message='Record History editorial materialization diagnosis'
          fi

          if git diff --cached --quiet; then
            echo 'No materialization/report changes to commit.'
            exit 0
          fi
          git commit -m "$message"
          git fetch origin agent/history-completion-audit
          remote_head="$(git rev-parse origin/agent/history-completion-audit)"
          if [ "$remote_head" != "$INITIAL_HEAD" ]; then
            echo "History branch moved during materialization: started $INITIAL_HEAD, remote is $remote_head" >&2
            exit 1
          fi
          git push origin HEAD:agent/history-completion-audit
