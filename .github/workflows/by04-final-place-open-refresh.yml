name: By04 temporary final place-open refresh
on:
  push:
    branches: [feature/by-bolk04-innlandet-vestfold-20-20261026]
    paths:
      - .github/workflows/by04-final-place-open-refresh.yml
concurrency:
  group: by04-final-place-open-refresh
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rebuild canonical index and all Place-open payloads
        run: |
          npm run places:index:build
          npm run place-open:build
          npm run place-open:check
      - name: Commit generated snapshots to existing PR
        shell: bash
        run: |
          git add data/places/places_index.json data/runtime/place-open
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(by04): finalize all 20 Fagverk place-open source snapshots'
            git push origin HEAD:feature/by-bolk04-innlandet-vestfold-20-20261026
          fi
# Rebuild from the final 20 curated Fagverk introductions.
