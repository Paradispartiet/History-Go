name: Produce sewn Religion badge raster assets
on:
  push:
    branches: [design/religion-stitch-badges-artwork-20261030]
    paths:
      - scripts/render-religion-embroidered-badges.py
      - .github/workflows/render-religion-embroidered-badges.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies
        run: python -m pip install --quiet pillow numpy cairosvg
      - name: Create and validate nine stitched badge images
        run: python scripts/render-religion-embroidered-badges.py
      - uses: actions/upload-artifact@v4
        with:
          name: religion-stitched-badges-preview
          path: out/religion-stitch-preview.png
          retention-days: 3
      - name: Commit generated images to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/merker/religion-brodert.webp bilder/merker/religion/familie/brodert/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add nine sewn embroidered religion badge images"
            git push
          fi
