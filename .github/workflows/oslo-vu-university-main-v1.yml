name: Oslo V-U University main buildings targeted integration
on:
  push:
    branches: [content/oslo-vu-universitetets-hovedbygning-v1-20261028]
    paths:
      - '.github/workflows/oslo-vu-university-main-v1.yml'
      - 'data/quiz/production_briefs/vitenskap/universitetets_gamle_hovedbygning.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/oslo-vu-universitetets-hovedbygning-v1-20261028
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate canonical Knowledge
        run: |
          npm run knowledge:canonical:write
          node scripts/sync-university-main-quizcard.mjs
      - name: Generate runtime and Fagverk release
        run: |
          npm run place-open:build
          node scripts/build-fagverk-release-manifest.mjs
      - name: Targeted production parity only
        run: node --test tests/oslo-vu-university-main-parity.test.mjs
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz/vitenskap/universitetets_gamle_hovedbygning_sets.json data/quizcards/vitenskap/universitetets_gamle_hovedbygning_quizcard_v1.json
          git add data/knowledge/knowledge_units.generated.json reports/knowledge-id-backfill.json data/runtime/place-open/universitetets_gamle_hovedbygning.json data/fagverk/fagverk_release.json
          if ! git diff --cached --quiet; then git commit -m "University main buildings: generated Knowledge and runtime"; fi
          git push origin HEAD:content/oslo-vu-universitetets-hovedbygning-v1-20261028

# Reconciled with main while retaining existing canonical place registrations
