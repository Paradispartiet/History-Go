name: Oslo bolk 05 — sync Folketeateret Knowledge once
on:
  push:
    branches:
      - research/oslo-sentrum-bolk05-tekst-20261101
    paths:
      - .github/workflows/oslo-bolk05-knowledge-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebuild canonical Knowledge with existing IDs and check determinism
        run: |
          npm run knowledge:canonical:write
          npm run knowledge:canonical:check
      - name: Limit generated changes to Knowledge and Folketeateret quiz
        run: |
          git status --short
          changed=$(git diff --name-only)
          invalid=$(printf '%s\n' "$changed" | grep -Ev '^(data/knowledge/|data/quiz/scenekunst/folketeateret_sets\.json$|reports/knowledge[^/]*\.json$|$)' || true)
          if [ -n "$invalid" ]; then
            echo "Unexpected generated changes: $invalid"
            exit 1
          fi
      - name: Commit generated Knowledge and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/knowledge data/quiz/scenekunst/folketeateret_sets.json
          git add -u -- reports/knowledge-id-backfill.json reports/knowledge-contract-audit.json reports/knowledge-universe-readers.json
          git rm -- .github/workflows/oslo-bolk05-knowledge-once.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Regenerate canonical Knowledge for Folketeateret quiz correction"
          git push origin HEAD:research/oslo-sentrum-bolk05-tekst-20261101
