name: Oslo bolk 05 - engangs Knowledge-synk for Folketeateret

on:
  push:
    branches:
      - research/oslo-sentrum-bolk05-tekst-20261101
    paths:
      - .github/workflows/oslo-bolk05-knowledge-once.yml

permissions:
  contents: write

concurrency:
  group: oslo-bolk05-knowledge-once
  cancel-in-progress: false

jobs:
  sync-folketeateret:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bounded PR branch
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project
        run: npm ci --no-audit --no-fund
      - name: Regenerate Knowledge and sync ten QuizCards
        run: |
          npm run knowledge:canonical:write
          node scripts/sync-oslo-bolk05-folketeateret-quizcard.mjs --write
          npm run knowledge:canonical:check
          node scripts/sync-oslo-bolk05-folketeateret-quizcard.mjs --check
      - name: Commit canonical Knowledge and Folketeateret artifacts only
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz/scenekunst/folketeateret_sets.json
          git add data/quizcards/scenekunst/folketeateret_quizkort_v1.json
          git add data/knowledge/knowledge_units.generated.json
          git add data/knowledge/concepts.generated.json
          git add reports/knowledge-id-backfill.json
          git add reports/knowledge-contract-audit.json
          git rm -- .github/workflows/oslo-bolk05-knowledge-once.yml
          git diff --cached --check
          git commit -m "Oslo bolk 05: link Folketeateret 3x7 Knowledge and ten QuizCards"
          git fetch origin "${BRANCH_NAME}"
          git rebase FETCH_HEAD
          git push origin "HEAD:${BRANCH_NAME}"
