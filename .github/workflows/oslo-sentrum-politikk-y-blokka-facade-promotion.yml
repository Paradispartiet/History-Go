name: Oslo sentrum Y-blokka building-only photo promotion (PR 6579)

on:
  push:
    branches:
      - research/oslo-sentrum-politikk-six-v1-20261023
    paths:
      - .github/workflows/oslo-sentrum-politikk-y-blokka-facade-promotion.yml

permissions:
  actions: read
  contents: write

jobs:
  promote-reviewed-y-blokka-only:
    if: github.repository == 'Paradispartiet/History-Go' && github.ref == 'refs/heads/research/oslo-sentrum-politikk-six-v1-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out isolated PR branch
        uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-politikk-six-v1-20261023
          persist-credentials: true
          fetch-depth: 1
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scoped promotion script
        run: python -m py_compile scripts/place-production/promote_oslo_politikk_y_blokka_facade.py
      - name: Download verified Y-blokka review artifact
        uses: actions/download-artifact@v4
        with:
          name: oslo-politikk-pr6579-y-blokka-facade-review
          run-id: 39937248441
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/place-production/media-staging/oslo-sentrum-politikk/y_blokka
      - name: Check exact original, WebPs, historical flag and lack of other artwork
        run: python scripts/place-production/promote_oslo_politikk_y_blokka_facade.py
      - name: Apply only the reviewed Y-blokka image pair to canonical draft files
        run: python scripts/place-production/promote_oslo_politikk_y_blokka_facade.py --apply
      - name: Inspect decoded image dimensions and original role
        run: |
          python -m pip install 'Pillow>=10,<13'
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for suffix, size in (('.webp',(1400,900)),('_front_portrait.webp',(900,1350))):
              with Image.open(Path('bilder/places')/('y_blokka'+suffix)) as im:
                  assert im.format=='WEBP' and im.size==size
          print('Y-blokka facade pair successfully decoded')
          PY
      - name: Stage exactly three changes, no other Oslo locations
        run: |
          git add -- \
            bilder/places/y_blokka.webp \
            bilder/places/y_blokka_front_portrait.webp \
            data/places/politikk/oslo/places_politikk/y_blokka.json
          git diff --cached --check
          python - <<'PY'
          import subprocess
          expected={
            'bilder/places/y_blokka.webp',
            'bilder/places/y_blokka_front_portrait.webp',
            'data/places/politikk/oslo/places_politikk/y_blokka.json'
          }
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==expected, (actual,expected)
          print('Only Y-blokka was modified.')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integrate Y-blokka facade-only historic image; art rights remain separate"
          git push origin HEAD:refs/heads/research/oslo-sentrum-politikk-six-v1-20261023
      - name: Require remaining full v1 quality gates
        if: always()
        run: |
          {
            echo "### Y-blokka exterior only"
            echo "Y-blokka historical exterior (2008), photographer Geir Hval, CC BY-SA 4.0."
            echo "No Picasso/Nesjar murals are reproduced in the image."
            echo "Do not merge: full quiz, image display/attribution, modern/historical captions and mobile/desktop QA still pending."
          } >> "$GITHUB_STEP_SUMMARY"
