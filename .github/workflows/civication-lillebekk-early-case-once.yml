name: Civication Lillebekk early case materialization (one-shot)
on:
  push:
    branches:
      - civication/byradgiver-lillebekk-early-case-20261104
    paths:
      - .github/workflows/civication-lillebekk-early-case-once.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test two realistic planning paths
        run: node tests/civication-by-radgiver-lillebekk-early-work-case.test.js
      - name: Rebuild compiled scene registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Rebuild derived career matrix
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Rebuild rollout readiness
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify repeated choices and output files
        run: |
          node tests/civication-by-radgiver-lillebekk-early-work-case.test.js
          git status --short
      - name: Commit only regenerated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/compiledSceneRegistryV1.json data/Civication/careerGameplayMatrix.json data/Civication/roleWorldRolloutReadiness.json
          if ! git diff --cached --quiet; then
            git commit -m "Materialize Lillebekk early case in canonical indexes"
            git push origin HEAD:civication/byradgiver-lillebekk-early-case-20261104
          fi
