name: Finalize Ekeberg Myrens Fagverk legacy batch

on:
  push:
    branches:
      - agent/fagverk-legacy-ekeberg-myrens-20260901
    paths:
      - .github/workflows/finalize-fagverk-legacy-ekeberg-myrens.yml
      - tools/finalize-fagverk-legacy-ekeberg-myrens.mjs

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync branch to current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Curate four completed Place Fagverk packages
        run: node tools/finalize-fagverk-legacy-ekeberg-myrens.mjs
      - name: Rebuild existing deterministic quiz contexts
        run: |
          node scripts/build-quiz-production-context.mjs --category historie --target ekebergparken_museum --output data/quiz/production_context/historie/ekebergparken_museum.json
          node scripts/build-quiz-production-context.mjs --category historie --target ekeberg_helleristninger --output data/quiz/production_context/historie/ekeberg_helleristninger.json
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target myrens_verksted --output data/quiz/production_context/naeringsliv/myrens_verksted.json
      - name: Regenerate Place-open runtime
        run: node scripts/build-place-open-payloads.mjs
      - name: Regenerate Fagverk place coverage
        run: node scripts/audit-fagverk-place-pages.mjs --write
      - name: Regenerate Fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Validate Fagverk page contract
        run: node scripts/audit-fagverk-place-pages.mjs
      - name: Validate Place-open and release artifacts
        run: |
          node scripts/build-place-open-payloads.mjs --check
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Test Fagverk page and substance contracts
        run: |
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/fagverk-place-substance-audit.test.mjs
      - name: Test Fagverk links
        run: node --test tests/fagverk-link-audit.test.mjs
      - name: Validate changed Place images
        run: node scripts/audit-place-images.mjs --mode=changed
      - name: Validate quiz production context
        run: npm run audit:quiz-production-context
      - name: Validate quiz progression
        run: npm run audit:quiz-progression
      - name: Validate quiz theory binding
        run: npm run audit:quiz-theory-binding
      - name: Validate diff whitespace
        run: git diff --check
      - name: Commit final production result and remove temporary tooling
        run: |
          git add \
            data/places/historie/oslo/places_historie/ekebergparken_museum.json \
            data/places/historie/oslo/places_historie/ekeberg_helleristninger.json \
            data/places/sport/europa/norway/oslo_sport/daelenenga_idrettspark.json \
            data/places/naeringsliv/oslo/places_naeringsliv/myrens_verksted.json \
            data/quiz/production_context/historie/ekebergparken_museum.json \
            data/quiz/production_context/historie/ekeberg_helleristninger.json \
            data/quiz/production_context/naeringsliv/myrens_verksted.json \
            data/runtime \
            data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/fagverk-place-page-coverage-v2.json
          git rm tools/finalize-fagverk-legacy-ekeberg-myrens.mjs .github/workflows/finalize-fagverk-legacy-ekeberg-myrens.yml
          git diff --cached --quiet && { echo "No production changes to commit"; exit 1; }
          git commit -m "Curate Ekeberg Myrens Fagverk legacy batch"
          git push origin HEAD:${GITHUB_REF_NAME}
