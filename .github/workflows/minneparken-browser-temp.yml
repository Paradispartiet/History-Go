name: Temporary Minneparken read-only browser verification
on:
  push:
    branches:
      - content/minneparken-kildebasert-leksikon-20261103
    paths:
      - .github/workflows/minneparken-browser-temp.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/minneparken-kildebasert-leksikon-20261103
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify implemented Minneparken PlaceCard text and Fagverk on mobile/desktop
        run: node tests/minneparken-readonly-app-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minneparken-readonly-mobile-desktop
          path: artifacts/minneparken-readonly-browser/
          if-no-files-found: warn
          retention-days: 14
