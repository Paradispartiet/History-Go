name: TEMP Place-open resync

on:
  push:
    branches:
      - agent/repair-people-claims-v1-20260913
    paths:
      - .github/workflows/tmp-place-open-resync.yml

permissions:
  contents: write

jobs:
  resync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-people-claims-v1-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Materialize place-open runtime
        run: npm run place-open:build
      - name: Commit deterministic runtime output
        run: |
          git status --short data/runtime
          git add data/runtime
          if git diff --cached --quiet; then
            echo "No runtime drift to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate place-open runtime after People repair"
          git push origin HEAD:agent/repair-people-claims-v1-20260913
