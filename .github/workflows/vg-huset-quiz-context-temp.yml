name: VG-huset quiz canonical context one-shot
on:
  push:
    branches: [agent/vg-huset-quiz-source-revision-20261010]
permissions:
  contents: write
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vg-huset-quiz-source-revision-20261010
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Generate source-led context deterministically
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-quiz-production-context.mjs --category media --target vg_huset --output data/quiz/production_context/media/vg_huset.json
          node scripts/build-quiz-production-context.mjs --category media --target vg_huset --output data/quiz/production_context/media/vg_huset.json --check
      - name: Run canonical quiz audits
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run audit:quiz-templates
          npm run audit:quiz-content
          npm run test:quiz-production
      - name: Commit exactly derived context and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/vg-quiz-context-diff
          cat /tmp/vg-quiz-context-diff
          node <<'NODE'
          const fs=require("node:fs");
          const paths=fs.readFileSync("/tmp/vg-quiz-context-diff","utf8").split("\n").filter(Boolean);
          if(paths.some(x=>x!=="data/quiz/production_context/media/vg_huset.json"))throw new Error("Unrelated audit mutation detected: "+paths.join(","));
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz/production_context/media/vg_huset.json
          git rm .github/workflows/vg-huset-quiz-context-temp.yml
          git diff --cached --name-only
          git commit -m "Verify and materialize VG-huset source-led quiz context"
          git push origin HEAD:refs/heads/agent/vg-huset-quiz-source-revision-20261010
