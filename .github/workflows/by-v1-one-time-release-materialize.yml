name: By v1 one-time Fagverk release materialization
on:
  push:
    branches:
      - content/by-v1-twenty-20261024
    paths:
      - '.github/workflows/by-v1-one-time-release-materialize.yml'
permissions:
  contents: write
jobs:
  update-release:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/by-v1-twenty-20261024
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize canonical Fagverk release
        run: |
          node scripts/materialize-natur-final-registry.mjs
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit only the derived release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk/fagverk_registry.json data/fagverk/fagverk_release.json
          if git diff --cached --quiet; then
            echo "Canonical Fagverk release already current."
            exit 0
          fi
          git commit -m "chore(by): synchronize canonical Fagverk release"
          git push origin HEAD:refs/heads/content/by-v1-twenty-20261024
