name: By v1 one-time generated-data sync
on:
  push:
    branches:
      - content/by-v1-twenty-20261024
    paths:
      - '.github/workflows/by-v1-one-time-release-materialize.yml'
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/by-v1-twenty-20261024
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Verify 11 canonical quiz/card links
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const quizManifest=JSON.parse(fs.readFileSync('data/quiz/manifest.json','utf8'));
          const cManifest=JSON.parse(fs.readFileSync('data/quizcards/by/manifest.json','utf8'));
          const name='oslo_v1_historiske_fakta_20261024.json';
          assert.ok(cManifest.collections.includes(name),'QuizCard manifest missing new collection');
          const collection=JSON.parse(fs.readFileSync('data/quizcards/by/'+name,'utf8'));
          assert.equal(collection.cards.length,11);
          for(const card of collection.cards){
            const ref=quizManifest.sets.find(s=>s.categoryId==='by'&&s.targetId===card.targetId);
            assert.ok(ref,card.targetId+' absent from fullquiz manifest');
            assert.equal(card.questions.length,10);
            const full=JSON.parse(fs.readFileSync(ref.file,'utf8'));
            const questions=full.sets.flatMap(s=>s.questions);
            assert.equal(questions.length,10);
            assert.equal(new Set(questions.map(q=>q.id)).size,10);
            for(const q of card.questions){
              const src=questions.find(candidate=>candidate.id===q.sourceQuestionId);
              assert.ok(src,'missing source question '+q.sourceQuestionId);
              assert.equal(src.answer,q.answer);
              assert.equal(q.options[q.answerIndex],q.answer);
              assert.ok(q.source_urls?.every(url=>url.startsWith('https://')));
            }
          }
          console.log('By Oslo v1: 11 quiz cards, 110 linked source questions, all answers match.');
          NODE
      - name: Build committed Fagverk and runtime data
        run: |
          node scripts/materialize-natur-final-registry.mjs
          node scripts/build-fagverk-release-manifest.mjs
          npm run epoker:places:build
          npm run place-open:build
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run place-open:check
          npm run epoker:places:check
      - name: Commit deterministic generated files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk/fagverk_registry.json data/fagverk/fagverk_release.json data/epoker/epoke-place-index.json data/runtime/place-open/
          if git diff --cached --quiet; then
            echo "All required generated data already current"
            exit 0
          fi
          git commit -m "chore(by): rebuild source-backed Oslo runtime after quizzes and images"
          git push origin HEAD:refs/heads/content/by-v1-twenty-20261024
