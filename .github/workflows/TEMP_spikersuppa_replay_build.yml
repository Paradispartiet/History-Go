name: TEMP Spikersuppa replay build

on:
  push:
    branches:
      - agent/spikersuppa-replay-20260907-temp2
    paths:
      - '.github/workflows/TEMP_spikersuppa_replay_build.yml'

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Rebase verified Spikersuppa delta onto fresh main
        env:
          BASE_SHA: 42b2fad73fbafe1f2450e4501b093587b138f417
          SPIKE_SHA: f63b86fe591ccb014849ab1d9d4b95490ce19158
          MAIN_SHA: 7c8f7352bc80f10e769567faf415f314d65b7a61
        run: |
          set -euxo pipefail
          git checkout --detach "$MAIN_SHA"
          set +e
          git cherry-pick --no-commit "$SPIKE_SHA"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            cat /tmp/conflicts.txt
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              git checkout --ours -- "$file"
              git add "$file"
            done < /tmp/conflicts.txt
          fi
          cat > /tmp/spikersuppa-replay.mjs <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const SPIKE = process.env.SPIKE_SHA;
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p,v) => fs.writeFileSync(p, JSON.stringify(v,null,2)+'\n');
          const spike = p => JSON.parse(execFileSync('git',['show',`${SPIKE}:${p}`],{encoding:'utf8'}));
          const uniqPush = (arr, rows, keyFn) => {
            const seen = new Set(arr.map(keyFn));
            for (const row of rows) { const k=keyFn(row); if(k&&!seen.has(k)){arr.push(row);seen.add(k);} }
          };
          {
            const p='data/brands/brands_by_place.json', cur=read(p), src=spike(p);
            cur.spikersuppa=src.spikersuppa; write(p,cur);
          }
          function copyNamedKey(cur,src,name){
            if(!cur||!src||typeof cur!=='object'||typeof src!=='object'||Array.isArray(cur)||Array.isArray(src)) return;
            if(Object.prototype.hasOwnProperty.call(src,name)) cur[name]=src[name];
            for(const k of Object.keys(src)) if(k!==name&&cur[k]&&typeof cur[k]==='object'&&src[k]&&typeof src[k]==='object') copyNamedKey(cur[k],src[k],name);
          }
          for(const p of ['data/fag/fag_manifest.json','data/fagverk/fagverk_registry.json']){
            const cur=read(p), src=spike(p); copyNamedKey(cur,src,'spikersuppa'); write(p,cur);
          }
          {
            const p='data/leksikon/manifest.json', cur=read(p), src=spike(p);
            const wanted=(src.files||[]).filter(x=>String(x).includes('spikersuppa'));
            cur.files ||= []; uniqPush(cur.files,wanted,x=>String(x)); write(p,cur);
          }
          {
            const p='data/leksikon/places/oslo/by/leksikon_oslo_by_batch3.json', cur=read(p);
            write(p,cur.filter(x=>x?.place_id!=='spikersuppa'));
          }
          {
            const p='data/lesespor/oslo/lesespor_oslo_by.json', cur=read(p), src=spike(p);
            cur.items ||= []; const rows=(src.items||[]).filter(x=>(x.place_ids||[]).includes('spikersuppa'));
            uniqPush(cur.items,rows,x=>x?.id); write(p,cur);
          }
          {
            const p='data/quiz/manifest.json', cur=read(p), src=spike(p);
            cur.sets ||= []; const rows=(src.sets||[]).filter(x=>x?.targetId==='spikersuppa');
            uniqPush(cur.sets,rows,x=>`${x?.targetId}::${x?.file}`); write(p,cur);
          }
          {
            const p='data/stories/stories_episode_v1_manifest.json', cur=read(p), src=spike(p);
            cur.files ||= []; const rows=(src.files||[]).filter(x=>String(x).includes('spikersuppa'));
            uniqPush(cur.files,rows,x=>String(x)); write(p,cur);
          }
          {
            const p='data/stories/stories_manifest.json', cur=read(p), src=spike(p);
            cur.files ||= []; const rows=(src.files||[]).filter(x=>x?.entity_id==='spikersuppa'||String(x?.path||'').includes('spikersuppa'));
            uniqPush(cur.files,rows,x=>`${x?.entity_id||''}::${x?.path||x}`); write(p,cur);
          }
          {
            const p='js/ui/place-card.js'; let s=fs.readFileSync(p,'utf8');
            if(!s.includes('spikersuppa: "bilder/QuizCards/Spikersuppa.webp"')){
              s=s.replace(/(\s+vaalerenga:\s*"bilder\/QuizCards\/Vaalerenga\.PNG",)/, '$1\n  spikersuppa: "bilder/QuizCards/Spikersuppa.webp",');
              if(!s.includes('spikersuppa: "bilder/QuizCards/Spikersuppa.webp"')) throw new Error('Could not insert Spikersuppa QuizCard mapping');
              fs.writeFileSync(p,s);
            }
          }
          NODE
          node /tmp/spikersuppa-replay.mjs
          git add data/brands/brands_by_place.json data/fag/fag_manifest.json data/fagverk/fagverk_registry.json data/leksikon/manifest.json data/leksikon/places/oslo/by/leksikon_oslo_by_batch3.json data/lesespor/oslo/lesespor_oslo_by.json data/quiz/manifest.json data/stories/stories_episode_v1_manifest.json data/stories/stories_manifest.json js/ui/place-card.js
          git diff --name-only --diff-filter=U | tee /tmp/unmerged-left.txt
          test ! -s /tmp/unmerged-left.txt
      - name: Install dependencies
        run: npm ci
      - name: Regenerate deterministic global outputs
        run: |
          set -euxo pipefail
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --write
          npm run place-open:build
          npm run epoker:places:build
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-quiz-manifest-v2.mjs
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/place-image-audit.json
          node - <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('/tmp/place-image-audit.json','utf8'));
          const p='data/places/place_image_backlog_summary.json';
          const s=JSON.parse(fs.readFileSync(p,'utf8'));
          s.generatedAt='2026-09-07'; s.generatedFromCommit='spikersuppa_replay_20260907'; s.totalPlaces=report.totalPlaces;
          s.summary={validLocal:report.summary.local,validRemote:report.summary.remote,optionalMissing:report.summary.optional,missing:report.summary.missing,invalidLocalPath:report.summary.invalid,remaining:report.summary.missing+report.summary.invalid};
          s.byCategory ||= {};
          for(const [k,v] of Object.entries(report.byCategory||{})) s.byCategory[k]={total:v.total,valid:v.local+v.remote,optional:v.optional,missing:v.missing,invalid:v.invalid};
          fs.writeFileSync(p,JSON.stringify(s,null,2)+'\n');
          NODE
      - name: Reconcile epoch contract expectations to regenerated canonical index
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const index=JSON.parse(fs.readFileSync('data/epoker/epoke-place-index.json','utf8'));
          const p='tests/epoke-place-index.test.mjs'; let s=fs.readFileSync(p,'utf8');
          const stats=index.stats, cov=index.domains.historie.oslo_coverage;
          const reps={
            canonical_story_milestone_count:stats.canonical_story_milestone_count,
            verified_place_production_milestone_count:stats.verified_place_production_milestone_count,
            canonical_place_count:cov.canonical_place_count,
            dated_evidence_place_count:cov.dated_evidence_place_count,
            documented_case_place_count:cov.documented_case_place_count,
            awaiting_source_backed_history_count:cov.awaiting_source_backed_history_count
          };
          for(const [k,v] of Object.entries(reps)){
            const re=new RegExp(`(assert\\.equal\\((?:index\\.stats|coverage)\\.${k}, )\\d+(\\);)`);
            if(!re.test(s)) throw new Error(`Missing epoch expectation ${k}`);
            s=s.replace(re,`$1${v}$2`);
          }
          if(!/\"spikersuppa\"/.test(s)){
            s=s.replace('"ullern"]', '"ullern", "spikersuppa"]');
          }
          fs.writeFileSync(p,s);
          console.log(reps);
          NODE
      - name: Validate replay fail-closed
        run: |
          set -euxo pipefail
          node --test tests/spikersuppa-completion.test.mjs
          npm run place-open:check
          npm run epoker:places:check
          node scripts/build-fagverk-release-manifest.mjs --check
          node scripts/audit-place-images.mjs --mode=all --verify-summary=data/places/place_image_backlog_summary.json
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run leksikon:ids:check
          npm run check:stories
          npm run audit:knowledge
          test -z "$(git diff --name-only --diff-filter=U)"
          if git diff --name-only "$MAIN_SHA" | grep -E '(^|/)(TEMP|temp)[^/]*|^\.github/workflows/TEMP' ; then
            echo 'TEMP path leaked into clean replay' >&2; exit 1
          fi
      - name: Commit and push clean replay output
        env:
          MAIN_SHA: 7c8f7352bc80f10e769567faf415f314d65b7a61
        run: |
          set -euxo pipefail
          git add -A
          git status --short
          git config user.name 'history-go-replay'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Materialize Spikersuppa on fresh main'
          test "$(git rev-parse HEAD^)" = "$MAIN_SHA"
          test -z "$(git diff --name-only "$MAIN_SHA"..HEAD | grep -E '(^|/)(TEMP|temp)[^/]*|^\.github/workflows/TEMP' || true)"
          git push --force origin HEAD:refs/heads/agent/spikersuppa-replay-output-20260907
