name: Temporary coordinate documentation repair runner

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/fix-coordinate-doc-governance-review'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-coordinate-doc-governance-review
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          registry_path = Path("docs/documentation_registry.json")
          registry = registry_path.read_text(encoding="utf-8")
          profile_path = '"path": "docs/PROFILE_PROGRESS_READER_RUNTIME.md"'
          if registry.count(profile_path) != 0:
              raise SystemExit(f"Expected missing profile reader entry, found {registry.count(profile_path)}")

          anchor = '''    {
                "path": "docs/DATA_PRODUCTION_CONTRACT.md",'''
          profile_entry = '''    {
                "path": "docs/PROFILE_PROGRESS_READER_RUNTIME.md",
                "status": "operational",
                "role": "Aktiv read-only runtimeguide for HGProfileProgressReader og eksisterende progresjonskilder",
                "owns": [
                  "profile_progress_reader_runtime"
                ],
                "last_verified": "2026-07-25"
              },
'''
          if registry.count(anchor) != 1:
              raise SystemExit("Expected one DATA_PRODUCTION_CONTRACT registry anchor")
          registry_path.write_text(registry.replace(anchor, profile_entry + anchor, 1), encoding="utf-8")

          package_path = Path("package.json")
          package = package_path.read_text(encoding="utf-8")
          tools_line = package.split('"tools:check":', 1)[1].split('\n', 1)[0]
          if "npm run places:coords:evidence:audit" in tools_line:
              raise SystemExit("Evidence audit is already present in tools:check")
          anchor = "node tests/coordinate-source-contract-anchor-trust.test.mjs && npm run audit:places-split-manifest-sync"
          replacement = "node tests/coordinate-source-contract-anchor-trust.test.mjs && npm run places:coords:evidence:audit && npm run audit:places-split-manifest-sync"
          if package.count(anchor) != 1:
              raise SystemExit("Expected one tools:check coordinate anchor")
          package_path.write_text(package.replace(anchor, replacement, 1), encoding="utf-8")
          PY

      - name: Validate registry and JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path("docs/documentation_registry.json").read_text(encoding="utf-8"))
          documents = registry["documents"]
          profile = [d for d in documents if d.get("path") == "docs/PROFILE_PROGRESS_READER_RUNTIME.md"]
          assert len(profile) == 1
          assert profile[0]["status"] == "operational"
          assert profile[0]["owns"] == ["profile_progress_reader_runtime"]

          owners = {}
          for document in documents:
              path = document["path"]
              assert Path(path).exists(), f"Registered document does not exist: {path}"
              for owner in document.get("owns", []):
                  assert owner not in owners, f"Duplicate ownership {owner}: {owners[owner]} and {path}"
                  owners[owner] = path

          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          tools_check = package["scripts"]["tools:check"]
          assert tools_check.count("npm run places:coords:evidence:audit") == 1
          assert "node tests/coordinate-source-contract-anchor-trust.test.mjs && npm run places:coords:evidence:audit && npm run audit:places-split-manifest-sync" in tools_check
          print(f"Validated {len(documents)} registered documents and {len(owners)} unique ownership keys")
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run targeted coordinate gates
        run: |
          npm run test:coordinate-source-contract
          npm run places:coords:evidence:audit

      - name: Commit repair
        shell: bash
        run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "docs/documentation_registry.json package.json "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/documentation_registry.json package.json
          git commit -m "Fix coordinate documentation governance review findings"
          git push origin HEAD:agent/fix-coordinate-doc-governance-review
