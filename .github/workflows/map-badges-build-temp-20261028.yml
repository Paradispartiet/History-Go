name: Temporary badge marker runtime regeneration
on:
  push:
    branches:
      - feat/map-badges-all-zoom-reversible-20261028
    paths:
      - '.github/workflows/map-badges-build-temp-20261028.yml'
permissions:
  contents: write
jobs:
  regenerate-map-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build exact esbuild map outputs
        run: |
          npx esbuild js/map.ts --bundle --format=iife --target=es2019 --platform=browser --outfile=dist/web/map.js
          cp dist/web/map.js js/map.js
      - name: Commit runtime output
        run: |
          git add js/map.js dist/web/map.js
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: sync History Go map runtime for badge experiment'
          git push origin HEAD:feat/map-badges-all-zoom-reversible-20261028
