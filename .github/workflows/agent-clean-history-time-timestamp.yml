name: Agent clean History time timestamp

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    if: github.event.pull_request.number == 4544
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Restore frozen V5.8 report and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- reports/historie-v5/historie-v5-8-quality-depth.json
          rm -f .github/workflows/agent-clean-history-time-timestamp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fjern timestamp-støy fra Historie tidsevidens'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
