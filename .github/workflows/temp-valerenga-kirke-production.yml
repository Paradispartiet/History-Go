name: Temporary Vålerenga kirke production

on:
  push:
    branches:
      - agent/oslo-coordinate-valerenga-kirke-production

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-valerenga-kirke-production
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize canonical place and coordinate evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const placeId = 'valerenga_kirke';
          const placeRel = 'places/historie/oslo/places_historie/valerenga_kirke.json';
          const placePath = path.join('data/places', placeRel);
          const evidenceRel = 'oslo/historie/valerenga_kirke.json';
          const evidencePath = path.join('data/coordinate-evidence', evidenceRel);
          const lat = 59.906858612988856;
          const lon = 10.788310607669317;
          const sourceObjectId = 'geonorge-adresser-v1:0301:12974:3';
          const sourceUrl = 'https://ws.geonorge.no/adresser/v1/sok?sok=Hjaltlandsgata%203%20Oslo';

          const readJson = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const writeJson = (p, value) => {
            fs.mkdirSync(path.dirname(p), { recursive: true });
            fs.writeFileSync(p, JSON.stringify(value, null, 2) + '\n');
          };
          const haversine = (aLat, aLon, bLat, bLon) => {
            const R = 6371000;
            const dLat = (bLat - aLat) * Math.PI / 180;
            const dLon = (bLon - aLon) * Math.PI / 180;
            const x = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * Math.PI / 180) * Math.cos(bLat * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(x));
          };

          const indexPath = 'data/places/places_index.json';
          const currentIndex = readJson(indexPath);
          if (currentIndex.some(p => p.id === placeId)) throw new Error(`${placeId} already exists in runtime index`);
          const nearby = currentIndex
            .filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon))
            .map(p => ({ id: p.id, name: p.name, category: p.category, distanceMeters: Math.round(haversine(lat, lon, p.lat, p.lon) * 10) / 10 }))
            .filter(p => p.distanceMeters <= 350)
            .sort((a, b) => a.distanceMeters - b.distanceMeters);

          const place = {
            id: placeId,
            name: 'Vålerenga kirke',
            lat,
            lon,
            r: 60,
            category: 'historie',
            year: 1902,
            desc: 'Aktiv menighetskirke i Hjaltlandsgata 3, innviet i 1902 og gjenreist etter den ødeleggende brannen i 1979. Kirken er både trossted, arkitektur- og kunsthistorisk bygg og et sterkt lokalt minnepunkt på Vålerenga.',
            popupDesc: 'Vålerenga kirke ble innviet i 1902 som sognekirke for et raskt voksende østkantstrøk. Granittbygget med det asymmetrisk plasserte tårnet ble et tydelig landemerke og et fysisk sentrum for menighetsliv på Vålerenga.\n\n18. september 1979 ble kirken rammet av en voldsom brann. I hovedsak sto murveggene igjen, mens store deler av interiøret og den opprinnelige utsmykningen gikk tapt. Brannen ble et sterkt lokalt minnepunkt, og gjenreisningen fram mot ny innvielse i 1984 viser hvordan et trossted kan bære kontinuitet selv gjennom et dramatisk fysisk brudd.\n\nKunsthistorien består derfor av flere tidslag. Emanuel Vigelands opprinnelige utsmykning hører til 1902-kirken, mens den gjenreiste kirken fikk nye kunstneriske lag, blant annet glassarbeid av Håkon Bleken. History Go behandler stedet som den konkrete aktive kirken i Hjaltlandsgata 3, ikke som et generelt symbol for Vålerenga eller som en del av den bredere nabolagsmarkøren `vaalerenga`.',
            emne_ids: [
              'em_his_historiske_lag_i_byrom',
              'em_his_spor_materialitet',
              'em_his_sosialhistorie_hverdagsliv'
            ],
            quiz_profile: {
              place_type: 'religiost_institusjonsbygg',
              subtype: 'aktiv_sognekirke_gjenreist_etter_brann',
              signature_features: [
                'innviet som sognekirke i 1902',
                'granittkirke med asymmetrisk plassert tårn',
                'ødelagt av brann i 1979 og gjeninnviet i 1984',
                'flere kunsthistoriske lag før og etter brannen',
                'sterk kobling til Vålerengas lokale identitet'
              ],
              primary_angles: [
                'religionshistorie',
                'arkitektur_og_materialitet',
                'brann_gjenreisning_og_kollektivt_minne',
                'kunsthistoriske_tidslag',
                'menighet_og_lokal_tilhorighet'
              ],
              question_families: [
                'institusjonshistorie',
                'historisk_endring',
                'arkitekturhistorie',
                'materialitet',
                'minne_og_tilhorighet',
                'kontrast'
              ],
              avoid_angles: [
                'generisk_kirkequiz_uten_stedlig_kilde',
                'slå_fast_usikker_arkitektattribusjon',
                'påstå_at_all_opprinnelig_utsmykning_overlevde_brannen',
                'blande_kirken_med_vaalerenga_som_bydelsanker'
              ],
              must_include: [
                '1902-kirken som aktivt trossted',
                'brannen i 1979 som fysisk og lokalhistorisk brudd',
                'gjeninnvielsen i 1984',
                'skillet mellom den konkrete kirken og det brede Vålerenga-stedet'
              ],
              contrast_targets: [
                'central_jam_e_mosque',
                'st_hallvard_kirke_kloster',
                'gronland_kirke'
              ],
              notes: 'Spør stedet som konkret aktiv kirke med dokumenterte historiske tidslag. Eksterne kirke-, lokalhistorie- og arkitekturkilder skal dominere synlig quizinnhold.'
            },
            locatorType: 'building',
            sourceProvider: 'official_address',
            sourceObjectId,
            address: {
              street: 'Hjaltlandsgata',
              number: '3',
              postcode: '0658',
              city: 'Oslo',
              country: 'NO'
            },
            geocodeAccuracy: 'rooftop',
            coordRole: 'display_marker',
            coordType: 'address_point',
            coordStatus: 'verified',
            coordSource: 'geonorge_adresser_v1',
            coordSourceId: sourceObjectId,
            coordSourceUrl: sourceUrl,
            coordVerifiedAt: '2026-07-20',
            coordNote: 'Offisiell adressekoordinat fra Geonorge Adresser API for Hjaltlandsgata 3, OSLO, source object geonorge-adresser-v1:0301:12974:3. Punktet brukes som display- og unlock-anker for Vålerenga kirke. Det representerer ikke Vålerenga som nabolag eller Vålerenga park som område.',
            externalLinks: [
              {
                type: 'official',
                label: 'Vålerenga menighet – om Vålerenga kirke',
                url: 'https://www.kirken.no/nb-NO/fellesrad/kirkene-i-gamle-oslo/kirkene-i-gamle-oslo/valerenga/omvaalerengakirke/',
                lang: 'nb',
                verifiedAt: '2026-07-20'
              },
              {
                type: 'reference',
                label: 'Lokalhistoriewiki – Hjaltlandsgata',
                url: 'https://lokalhistoriewiki.no/wiki/Hjaltlandsgata_(Oslo)',
                lang: 'nb',
                verifiedAt: '2026-07-20'
              }
            ]
          };
          writeJson(placePath, place);

          const evidence = {
            schemaVersion: '1.0',
            placeId,
            placeFile: `data/places/${placeRel}`,
            evidenceStatus: 'applied_to_place',
            coordinateDecision: 'do_not_change_coordinates_yet',
            currentCoordinate: {
              lat,
              lon,
              r: 60,
              coordStatus: 'verified',
              coordSource: 'geonorge_adresser_v1',
              coordType: 'address_point',
              coordNote: 'Offisiell adressekoordinat fra Geonorge Adresser API for Hjaltlandsgata 3, OSLO. Punktet brukes som display- og unlock-anker for Vålerenga kirke og holdes separat fra det bredere Vålerenga-området.'
            },
            identity: {
              currentName: 'Vålerenga kirke',
              resolvedIdentity: 'Vålerenga kirke, aktiv sognekirke i Hjaltlandsgata 3',
              identityStatus: 'resolved',
              identityProblem: '',
              locatorTypeCandidate: 'building',
              requiresSplit: false,
              splitReason: ''
            },
            requiredEvidence: [
              'entydig offisielt adressepunkt',
              'dokumentert aktiv kirkeidentitet og besøksadresse',
              'duplikat- og fysisk overlap-kontroll mot bredere Vålerenga-steder'
            ],
            evidence: [
              {
                sourceProvider: 'official_address',
                sourceName: 'geonorge_adresser_v1',
                sourceUrl,
                sourceObjectId,
                sourceQuality: 'official_address_plus_current_church_identity',
                finding: 'Geonorge returnerer ett tydelig adressetreff for Hjaltlandsgata 3. Kandidatauditten skiller den konkrete kirkebygningen fra det bredere canonical Vålerenga-stedet.',
                canVerifyCoordinate: true,
                reason: 'Det offisielle adressepunktet er et stabilt bygningsanker for den aktive kirken og brukes ikke som proxy for park eller nabolag.'
              }
            ],
            addressCandidates: [
              {
                address: 'Hjaltlandsgata 3 Oslo',
                sourceProvider: 'official_address',
                sourceObjectId,
                lat,
                lon,
                canApplyToPlace: true
              }
            ],
            sourceObjectCandidates: [
              { sourceProvider: 'official_address', sourceObjectId, canApplyToPlace: true }
            ],
            geometryCandidates: [],
            coordinateCandidates: [
              { lat, lon, coordRole: 'display_marker', canApplyToPlace: true }
            ],
            decision: {
              canBecomeVerified: true,
              blockedReason: '',
              nextAction: 'Kildekontrakt, kirkeidentitet og representasjonsanker er anvendt på canonical place.'
            },
            notes: [
              'Kandidatauditten godkjenner Vålerenga kirke som egen fysisk identitet, separat fra `vaalerenga` og omkringliggende parkrom.',
              'Primær runtime-kategori settes til religion gjennom den eksisterende category override-modellen.'
            ]
          };
          writeJson(evidencePath, evidence);

          const placeManifestPath = 'data/places/manifest.json';
          const placeManifest = readJson(placeManifestPath);
          if (!placeManifest.files.includes(placeRel)) placeManifest.files.push(placeRel);
          writeJson(placeManifestPath, placeManifest);

          const evidenceManifestPath = 'data/coordinate-evidence/manifest.json';
          const evidenceManifest = readJson(evidenceManifestPath);
          if (!evidenceManifest.files.includes(evidenceRel)) evidenceManifest.files.push(evidenceRel);
          writeJson(evidenceManifestPath, evidenceManifest);

          const overridesPath = 'data/places/category_overrides.json';
          const overrides = readJson(overridesPath);
          if (!overrides.some(row => row.id === placeId)) {
            overrides.push({
              id: placeId,
              category: 'religion',
              note: 'Aktiv sognekirke på Vålerenga; primært trossted. Historie-, kunst- og arkitekturlag beholdes i innholdet.'
            });
          }
          writeJson(overridesPath, overrides);

          const protocolPath = 'docs/coordinates/coordinate-control-protocol.md';
          let protocol = fs.readFileSync(protocolPath, 'utf8');
          const osloStart = protocol.indexOf('## Oslo');
          const noCoordStart = protocol.indexOf('### Dokumenterte Oslo-kontroller uten godkjent koordinat');
          if (osloStart < 0 || noCoordStart < 0) throw new Error('Could not locate bounded Oslo protocol section');
          const osloSection = protocol.slice(osloStart, noCoordStart);
          const rows = [...osloSection.matchAll(/^\| (\d+) \| `([^`]+)` \|.*$/gm)];
          if (!rows.length) throw new Error('No Oslo protocol rows found');
          const lastRow = rows[rows.length - 1];
          const maxBatch = Math.max(...rows.map(m => Number(m[1])));
          const nextBatch = maxBatch + 1;
          const newRow = `| ${nextBatch} | \`${placeId}\` | Vålerenga kirke | verified | \`${sourceObjectId}\` |`;
          const insertAt = osloStart + lastRow.index + lastRow[0].length;
          protocol = protocol.slice(0, insertAt) + '\n' + newRow + protocol.slice(insertAt);

          const summaryRe = /Oslo-tabellen inneholder nå (\d+) verifiserte eller kildekontrollerte canonical steder\. Batch \d+ legger til .*? Antallet fullførte kontroller uten godkjent Oslo-koordinat er (\d+)\./;
          const summaryMatch = protocol.match(summaryRe);
          if (!summaryMatch) throw new Error('Could not locate Oslo protocol summary');
          const newTotal = Number(summaryMatch[1]) + 1;
          const noCoordCount = Number(summaryMatch[2]);
          protocol = protocol.replace(summaryRe, `Oslo-tabellen inneholder nå ${newTotal} verifiserte eller kildekontrollerte canonical steder. Batch ${nextBatch} legger til Vålerenga kirke med den entydige offisielle Geonorge-adressekoordinaten for Hjaltlandsgata 3, etter eksplisitt identitets- og overlap-audit mot det bredere Vålerenga-stedet. Antallet fullførte kontroller uten godkjent Oslo-koordinat er ${noCoordCount}.`);
          fs.writeFileSync(protocolPath, protocol);

          const reportDir = 'reports/visitoslo-oslo-east-audit-20260720/valerenga-kirke-coordinate-intake';
          fs.mkdirSync(reportDir, { recursive: true });
          writeJson(path.join(reportDir, 'production-decision.json'), {
            placeId,
            decision: 'produce_distinct_canonical_place',
            primaryRuntimeCategory: 'religion',
            sourceStorageCategory: 'historie',
            coordinate: { lat, lon, sourceObjectId },
            nearbyWithin350m: nearby,
            identityDecision: 'Vålerenga kirke is the specific active church building; broader neighbourhood/park records are different physical scopes.',
            protocolBatch: nextBatch
          });

          console.log(JSON.stringify({ placeId, nextBatch, nearby }, null, 2));
          NODE

      - name: Build index and run coordinate validation stack
        shell: bash
        run: |
          set -euo pipefail
          LOGDIR="reports/coordinate-branch-runner/agent_oslo-coordinate-valerenga-kirke-production"
          mkdir -p "$LOGDIR"

          npm run places:index:build 2>&1 | tee "$LOGDIR/places-index-build.log"
          npm run audit:places-split-manifest-sync 2>&1 | tee "$LOGDIR/split-manifest-sync.log"
          npm run places:index:check 2>&1 | tee "$LOGDIR/places-index-check.log"
          npm run test:coordinate-source-contract 2>&1 | tee "$LOGDIR/coordinate-source-contract.log"
          npm run places:coords:quality 2>&1 | tee "$LOGDIR/coordinate-quality.log"
          npm run places:coords:intake -- --strict-new 2>&1 | tee "$LOGDIR/coordinate-intake.log"
          npm run places:coords:evidence:audit 2>&1 | tee "$LOGDIR/coordinate-evidence.log"
          git diff --check 2>&1 | tee "$LOGDIR/git-diff-check.log"

          set +e
          npm run health:places 2>&1 | tee "$LOGDIR/health-places.log"
          HEALTH_CODE=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$HEALTH_CODE" > "$LOGDIR/health-places.exit-code.txt"

      - name: Commit production result and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-valerenga-kirke-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Vålerenga kirke as canonical Oslo place"
          git push origin HEAD:agent/oslo-coordinate-valerenga-kirke-production
