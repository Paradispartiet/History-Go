name: Van Etten v1 integration and browser smoke
# Revalidate the revised historical-sequence quiz question before publishing generated Knowledge.
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/van-etten-v1-integration.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: van-etten-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate:
    if: github.event_name == 'pull_request' && github.head_ref == 'content/oslo-aav-van-etten-v1-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/oslo-aav-van-etten-v1-20261028
          fetch-depth: 120
          persist-credentials: true
      - name: Sync main retaining all unrelated Places
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for file in "${conflicts[@]}"; do
              case "$file" in
                data/fag/fag_manifest.json|data/fagverk/fagverk_registry.json|data/quiz/manifest.json|data/quizcards/kunst/manifest.json)
                  git checkout --theirs -- "$file" ;;
                *) echo "Unexpected conflict: $file" >&2; exit 1;;
              esac
            done
            node scripts/reconcile-van-etten-registries.mjs
            git add data/fag/fag_manifest.json data/fagverk/fagverk_registry.json data/quiz/manifest.json data/quizcards/kunst/manifest.json
            git commit -m "Merge latest main preserving Van Etten registration"
          fi
          node scripts/reconcile-van-etten-registries.mjs
          git add data/fag/fag_manifest.json data/fagverk/fagverk_registry.json data/quiz/manifest.json data/quizcards/kunst/manifest.json
          if ! git diff --cached --quiet; then git commit -m "Reconcile Van Etten registries"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate quiz context
        run: node scripts/build-quiz-production-context.mjs --category kunst --target van_etten --output data/quiz/production_context/kunst/van_etten.json
      - name: Generate canonical Knowledge
        run: npm run knowledge:canonical:write
      - name: Sync QuizCard Knowledge
        run: node scripts/sync-van-etten-quizcard-knowledge.mjs
      - name: Generate Place-open and Fagverk release
        run: |
          npm run place-open:build
          node scripts/materialize-natur-final-registry.mjs
          node scripts/build-fagverk-release-manifest.mjs
      - name: Run targeted unit tests
        run: node --test tests/van-etten-v1-parity.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify app on phone and desktop
        run: node tests/van-etten-real-app-browser-20261028.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: van_etten-browser
          path: artifacts/van_etten-browser/
          if-no-files-found: ignore
      - name: Push generated artifacts only
        shell: bash
        run: |
          set -euo pipefail
          git add data/quiz/production_context/kunst/van_etten.json
          git add data/quiz/kunst/van_etten_sets.json data/quizcards/kunst/van_etten_quizcard_v1.json
          git add data/knowledge/knowledge_units.generated.json reports/knowledge-id-backfill.json
          git add data/runtime/place-open/van_etten.json data/fagverk/fagverk_release.json
          if ! git diff --cached --quiet; then git commit -m "Van Etten: publish canonical quiz, Knowledge and runtime"; fi
          git push origin HEAD:content/oslo-aav-van-etten-v1-20261028
