name: House of Nerds one-shot merged-view People sync
on:
  push:
    branches: [place/house-of-nerds-person-evidence-20261101]
    paths: [.github/workflows/hon-mergeview-people-one-shot.yml]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/place/house-of-nerds-person-evidence-20261101'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build exact PR merge-view in disposable worktree
        shell: bash
        run: |
          set -eu
          git fetch --no-tags origin main
          git config user.name "House of Nerds CI"
          git config user.email "ci@users.noreply.github.com"
          git worktree add -b hon-tmp-mergeview /tmp/hon-mergeview HEAD
          git -C /tmp/hon-mergeview merge --no-ff origin/main -m "Temporary CI merge for generated People data"
          cp -a node_modules /tmp/hon-mergeview/node_modules
      - name: Build canonical indexes from merged source data
        shell: bash
        run: |
          set -eu
          cd /tmp/hon-mergeview
          npm run civication:history-people:build
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
          npm run civication:history-people:check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
      - name: Publish only bounded generated catalog output to original branch
        shell: bash
        run: |
          set -eu
          cp /tmp/hon-mergeview/data/Civication/historyPeople_index.json data/Civication/historyPeople_index.json
          cp /tmp/hon-mergeview/data/Civication/scenarioPeople_index.json data/Civication/scenarioPeople_index.json
          cp /tmp/hon-mergeview/data/Civication/scenarioPeople/generated/subkultur.json data/Civication/scenarioPeople/generated/subkultur.json
          git add -- data/Civication/historyPeople_index.json data/Civication/scenarioPeople_index.json data/Civication/scenarioPeople/generated/subkultur.json
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync House of Nerds People indexes against current main merge view"
            git push origin HEAD:place/house-of-nerds-person-evidence-20261101
          fi
