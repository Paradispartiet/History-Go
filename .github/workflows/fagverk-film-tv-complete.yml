name: Fagverk Film og TV complete

on:
  pull_request:
    paths:
      - 'data/fag/TV_og_Film/**'
      - 'data/fagverk/film_tv/**'
      - 'data/fagverk/fagverk_registry.json'
      - 'data/fagverk/subject_status.json'
      - 'data/fagverk/fagverk_release.json'
      - 'reports/fagverk/film-tv-completion-v1.json'
      - 'scripts/audit-film-tv-completion-v1.mjs'
      - 'tests/film-tv-completion-v1.test.mjs'
      - '.github/workflows/fagverk-film-tv-complete.yml'
  push:
    branches: [main]
    paths:
      - 'data/fag/TV_og_Film/**'
      - 'data/fagverk/film_tv/**'
      - 'data/fagverk/fagverk_registry.json'
      - 'data/fagverk/subject_status.json'
      - 'data/fagverk/fagverk_release.json'
      - 'reports/fagverk/film-tv-completion-v1.json'
      - 'scripts/audit-film-tv-completion-v1.mjs'
      - 'tests/film-tv-completion-v1.test.mjs'
      - '.github/workflows/fagverk-film-tv-complete.yml'

permissions:
  contents: read

jobs:
  completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate completion audit syntax
        run: |
          node --check scripts/audit-film-tv-completion-v1.mjs
          node --check tests/film-tv-completion-v1.test.mjs
      - name: Validate Film TV completion contract
        run: |
          node scripts/audit-film-tv-completion-v1.mjs
          node --test tests/film-tv-completion-v1.test.mjs
      - name: Preserve existing Film TV baseline
        run: |
          node scripts/audit-fagverk-film-tv-phase3.mjs
          node --test tests/fagverk-film-tv-phase3.test.mjs
      - name: Verify deterministic release
        run: node scripts/build-fagverk-release-manifest.mjs --check
