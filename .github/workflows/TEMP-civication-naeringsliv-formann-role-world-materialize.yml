name: TEMP Materialize Formann Role World

on:
  push:
    branches:
      - agent/civication-naeringsliv-formann-role-world-rollout
    paths:
      - scripts/TEMP_materialize_formann_role_world.mjs
      - tests/civication-formann-role-world-rollout.test.js
      - tests/civication-formann-readiness-prerequisites.test.js
      - reports/CIVICATION_NAERINGSLIV_FORMANN_ROLE_WORLD_ROLLOUT_SOURCE_FIRST.md
      - .github/workflows/TEMP-civication-naeringsliv-formann-role-world-materialize.yml
  workflow_dispatch:

concurrency:
  group: civication-naeringsliv-formann-role-world-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-naeringsliv-formann-role-world-rollout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Materialize Formann Role World
        run: node scripts/TEMP_materialize_formann_role_world.mjs
      - name: Regenerate Career Gameplay audit
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Regenerate rollout readiness
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify Formann Role World contract
        run: node tests/civication-formann-role-world-rollout.test.js
      - name: Verify Formann prerequisite foundations remain strict
        run: node tests/civication-formann-readiness-prerequisites.test.js
      - name: Verify rollout readiness gate
        run: node tests/civication-role-world-rollout-readiness.test.js
      - name: Verify Career Gameplay baseline remains intact
        run: node tests/civication-career-gameplay-matrix.test.js
      - name: Run full Civication suite
        run: |
          set +e
          npm run test:civication > /tmp/civication.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "=== relevant Civication failure output ==="
            grep -E -B 8 -A 24 'AssertionError|ERR_ASSERTION|not ok|FAIL|Error:|error:' /tmp/civication.log | tail -n 220 || tail -n 220 /tmp/civication.log
            exit "$status"
          fi
          echo "Full Civication suite passed."
          tail -n 50 /tmp/civication.log
      - name: Remove temporary Role World surface
        run: rm scripts/TEMP_materialize_formann_role_world.mjs .github/workflows/TEMP-civication-naeringsliv-formann-role-world-materialize.yml
      - name: Commit exact verified Formann Role World
        run: |
          git diff --check
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No permanent changes produced"; exit 1; }
          git commit -m "Complete Formann Role World rollout"
          git push origin HEAD:agent/civication-naeringsliv-formann-role-world-rollout
