name: Oslo coordinate batch 25 integration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-coordinate-batch-25-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'agent/oslo-coordinate-control-batch-25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect persistent coordinate evidence
        shell: bash
        run: |
          set -u
          OUT='reports/oslo-coordinate-control-batch-25'
          mkdir -p "$OUT/lookups" "$OUT/sources"

          run_finder() {
            local address="$1"
            local file="$2"
            set +e
            set -o pipefail
            npm run places:coords:find:address -- --address "$address" | tee "$OUT/lookups/$file"
            local code=${PIPESTATUS[0]}
            set +o pipefail
            set -e
            printf '%s\n' "$code" > "$OUT/lookups/$file.exit-status.txt"
            return 0
          }

          run_curl() {
            local url="$1"
            local file="$2"
            set +e
            curl --retry 3 --retry-delay 2 -fsSL -A 'History-Go-coordinate-audit/1.0' "$url" \
              | tee "$OUT/sources/$file" >/dev/null
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$code" > "$OUT/sources/$file.exit-status.txt"
            return 0
          }

          set -e
          run_finder 'Sommerrogata 1 Oslo' 'oslo_kraftselskap-sommerrogata-1-geonorge.json'
          run_finder 'Akershusstranda 23 Oslo' 'vippetangen_fisketorg-akershusstranda-23-geonorge.json'

          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Grensen%20Oslo' \
            'grensen_kjopesenter-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Frysja%20industriomr%C3%A5de%20Oslo' \
            'frysja_industriomrade-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Bryn%20industriomr%C3%A5de%20Oslo' \
            'bryn_industriomrade-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Norges%20Varemesse%20Sj%C3%B8lyst%20Oslo' \
            'norges_varemesse-sjolyst-nominatim.json'

          cat > "$OUT/source-notes.md" <<'EOF'
          # Batch 25 – kilde- og identitetsnotater

          - Jernbanetorget: `jernbanetorget_trafikknutepunkt` representerer samme fysiske byrom som canonical `jernbanetorget`.
          - Oslo Lysverker: Oslo byleksikon identifiserer Sommerrogata 1 som den monumentale tidligere hovedbygningen. Dette brukes som representativt institusjonsanker, ikke som sentrum for hele energinettet.
          - Grensen: Oslo byleksikon dokumenterer hele gaten som handelsgate. OSM-resultatet er delt i flere way-segmenter; ingen enkelt way brukes som hele gaten.
          - Vippetangen fisketorg: Oslo byleksikon dokumenterer flytting av fisketorget/fiskehavna til Vippetangen i 1905 og en senere Fiskehallen i Akershusstranda 23. Aktiv 1890-record må avgrenses før adressen eventuelt brukes.
          - Frysja industriområde: Oslo kommune beskriver et gammelt industri- og lagerområde under transformasjon; batchen har ingen kildebelagt polygon/fleranker.
          - Norges Varemesse: stiftelsens egen historie dokumenterer Akershus, Sjølyst og Lillestrøm som ulike hovedarenaer over tid.
          - Bryn industriområde: Oslo byleksikon og kommuneplanen beskriver et større industri-/utviklingsområde; batchen har ingen eksplisitt områdegeometri.
          EOF

      - name: Apply batch 25
        run: node scripts/tmp-complete-oslo-coordinate-batch25.mjs

      - name: Build global place index
        run: |
          set -o pipefail
          npm run places:index:build | tee reports/oslo-coordinate-control-batch-25/places-index-build.txt

      - name: Validate split manifest sync
        run: |
          set -o pipefail
          npm run audit:places-split-manifest-sync | tee reports/oslo-coordinate-control-batch-25/split-manifest-audit.txt

      - name: Validate source and runtime parity
        run: |
          set -o pipefail
          npm run places:index:check | tee reports/oslo-coordinate-control-batch-25/places-index-check.txt

      - name: Validate coordinate quality
        run: |
          set -o pipefail
          npm run places:coords:quality | tee reports/oslo-coordinate-control-batch-25/coordinate-quality.txt

      - name: Validate strict coordinate intake against merge-base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE="$(git merge-base HEAD origin/main)"
          echo "COORD_INTAKE_BASE=$BASE" | tee reports/oslo-coordinate-control-batch-25/strict-intake-base.txt
          COORD_INTAKE_BASE="$BASE" npm run places:coords:intake \
            | tee reports/oslo-coordinate-control-batch-25/strict-intake.txt

      - name: Validate coordinate evidence
        id: evidence
        continue-on-error: true
        run: |
          set -o pipefail
          npm run places:coords:evidence:audit | tee reports/oslo-coordinate-control-batch-25/evidence-audit.txt

      - name: Upload evidence audit failure report
        if: steps.evidence.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch-25-evidence-audit-failure
          path: |
            reports/coordinate-evidence-audit.md
            reports/oslo-coordinate-control-batch-25/evidence-audit.txt
          if-no-files-found: error

      - name: Stop on evidence audit failure
        if: steps.evidence.outcome == 'failure'
        run: exit 1

      - name: Validate diff whitespace
        run: git diff --check

      - name: Remove temporary integration files and commit result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/oslo-coordinate-batch-25-evidence.yml
          rm -f .github/workflows/oslo-coordinate-batch-25-integrate.yml
          rm -f scripts/tmp-complete-oslo-coordinate-batch25.mjs
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete Oslo coordinate control batch 25'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
