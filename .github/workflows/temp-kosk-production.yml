name: Temporary KÖSK production

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  produce:
    if: github.head_ref == 'agent/oslo-coordinate-kosk-production'
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-kosk-production
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize KÖSK
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const placeId = 'kosk_oslo';
          const placeRel = 'places/kunst/oslo/places_kunst/kosk_oslo.json';
          const evidenceRel = 'oslo/kunst/kosk_oslo.json';
          const lat = 59.90679399014945;
          const lon = 10.758198688033378;
          const sourceObjectId = 'geonorge-adresser-v1:0301:21508:63C';
          const sourceUrl = 'https://ws.geonorge.no/adresser/v1/sok?sok=Operagata%2063C%20Oslo';
          const coordNote = 'Offisiell adressekoordinat fra Geonorge Adresser API for Operagata 63C, OSLO. Punktet brukes som display- og unlock-anker for KÖSKs nåværende offentlige galleriadresse. Operagata 63A beholdes kun som alternativ hentings-/eldre oppføring og skal ikke ha en egen aktiv markør.';

          const readJson = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const writeJson = (p, value) => {
            fs.mkdirSync(path.dirname(p), { recursive: true });
            fs.writeFileSync(p, JSON.stringify(value, null, 2) + '\n');
          };
          const haversine = (aLat, aLon, bLat, bLon) => {
            const R = 6371000;
            const dLat = (bLat - aLat) * Math.PI / 180;
            const dLon = (bLon - aLon) * Math.PI / 180;
            const x = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * Math.PI / 180) * Math.cos(bLat * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(x));
          };

          const currentIndex = readJson('data/places/places_index.json');
          if (currentIndex.some(p => p.id === placeId)) throw new Error(`${placeId} already exists in runtime index`);
          const nearby = currentIndex
            .filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon))
            .map(p => ({ id: p.id, name: p.name, category: p.category, distanceMeters: Math.round(haversine(lat, lon, p.lat, p.lon) * 10) / 10 }))
            .filter(p => p.distanceMeters <= 350)
            .sort((a, b) => a.distanceMeters - b.distanceMeters);

          const place = {
            id: placeId,
            name: 'KÖSK',
            lat,
            lon,
            r: 60,
            category: 'kunst',
            year: 2020,
            period: 'Dokumentert utstillingsprogram fra 2020',
            emne_ids: [
              'em_kunst_institusjonskritikk_og_representasjon',
              'em_kunst_kvalitet_kritikk_og_symbolsk_kapital',
              'em_kunst_okonomi_og_finansiering'
            ],
            desc: 'Samtidskunstgalleri i Operagata 63C i Bjørvika/Bispevika med tydelig profil mot yngre norske kunstnere. KÖSK kombinerer skiftende utstillinger, kunstsalg og en digital salgsplattform.',
            popupDesc: 'KÖSK er et galleri for norsk samtidskunst i Operagata 63C. Galleriet profilerer særlig yngre kunstnere og arbeider både som fysisk visningssted, salgsarena og digital plattform. Eget utstillingsarkiv dokumenterer program tilbake til 2020, og en Kunstavisen-artikkel fra 2021 beskrev KÖSK som et nytt tilskudd til Oslos galleriscene etablert under koronapandemien.\n\nDen nåværende offentlige adressen er Operagata 63C. KÖSKs hovedside, kontakt- og om-side bruker denne adressen konsekvent i 2026. Operagata 63A finnes samtidig på en hentingsside og i VisitOSLOs oppføring. History Go behandler derfor 63C som dagens canonical galleriadresse og 63A som en alternativ hentings-/eldre adresse, ikke som et eget sted.\n\nKÖSK er interessant som eksempel på hvordan mindre kommersielle gallerier kan gi yngre kunstnere utstillingsplass, synlighet og markedsadgang i et område dominert av store kulturinstitusjoner og omfattende byutvikling. Stedet skal spørres som et konkret galleri med dokumentert program, ikke som en generell markør for Bjørvika eller norsk samtidskunst.',
            quiz_profile: {
              place_type: 'kunstgalleri',
              subtype: 'samtidskunstgalleri_med_vekt_pa_yngre_norske_kunstnere',
              signature_features: [
                'nåværende offentlig galleriadresse i Operagata 63C',
                'dokumentert utstillingsprogram tilbake til 2020',
                'profil mot yngre norske samtidskunstnere',
                'kombinerer fysisk galleri, kunstsalg og nettbutikk',
                'ligger i Bjørvika/Bispevika nær store kulturinstitusjoner'
              ],
              primary_angles: [
                'galleripraksis',
                'yngre_kunstnere_og_representasjon',
                'kunstmarked_og_salg',
                'utstillingsprogram',
                'små_gallerier_i_nytt_byomrade'
              ],
              question_families: [
                'institusjonshistorie',
                'utstillingshistorie',
                'kunstfelt_og_marked',
                'representasjon_og_karriere',
                'kontrast'
              ],
              avoid_angles: [
                'presentere_2020_som_formell_stiftelsesdato',
                'lage_to_aktive_steder_for_63A_og_63C',
                'generisk_bjorvika_kunst',
                'omtale_galleriet_som_ikke_kommersielt'
              ],
              must_include: [
                'den konkrete nåværende adressen Operagata 63C',
                'profilen mot yngre norske kunstnere',
                'skiftende utstillinger og kunstsalg',
                'skillet mellom dagens galleriadresse og 63A som alternativ oppføring'
              ],
              contrast_targets: [
                'galleri_map',
                'kunsthall_oslo',
                'munch_museet'
              ],
              notes: 'Spør KÖSK som et konkret samtidskunstgalleri og markeds-/visningssted. Eksterne utstillings- og institusjonskilder skal dominere synlig quizinnhold.'
            },
            locatorType: 'building',
            sourceProvider: 'official_address',
            sourceObjectId,
            address: {
              street: 'Operagata',
              number: '63C',
              postcode: '0194',
              city: 'Oslo',
              country: 'NO'
            },
            geocodeAccuracy: 'rooftop',
            coordRole: 'display_marker',
            coordStatus: 'verified',
            coordSource: 'geonorge_adresser_v1',
            coordSourceId: sourceObjectId,
            coordSourceUrl: sourceUrl,
            coordType: 'address_point',
            coordVerifiedAt: '2026-07-20',
            coordNote,
            externalLinks: [
              {
                type: 'official',
                label: 'KÖSK – galleri og utstillinger',
                url: 'https://koskoslo.no/',
                lang: 'nb',
                verifiedAt: '2026-07-20'
              },
              {
                type: 'official',
                label: 'KÖSK – om galleriet',
                url: 'https://koskoslo.no/pages/om-kosk',
                lang: 'nb',
                verifiedAt: '2026-07-20'
              }
            ]
          };
          writeJson(path.join('data', placeRel), place);

          const evidence = {
            schemaVersion: '1.0',
            placeId,
            placeFile: `data/${placeRel}`,
            evidenceStatus: 'applied_to_place',
            coordinateDecision: 'do_not_change_coordinates_yet',
            currentCoordinate: {
              lat,
              lon,
              r: 60,
              coordStatus: 'verified',
              coordSource: 'geonorge_adresser_v1',
              coordType: 'address_point',
              coordNote
            },
            identity: {
              currentName: 'KÖSK',
              resolvedIdentity: 'KÖSK contemporary art gallery at current public address Operagata 63C',
              identityStatus: 'resolved',
              identityProblem: '',
              locatorTypeCandidate: 'building',
              requiresSplit: false,
              splitReason: ''
            },
            requiredEvidence: [
              'entydig offisielt adressepunkt for Operagata 63C',
              'eksplisitt to-adresse-audit mot Operagata 63A',
              'dokumentert nåværende offentlig galleriadresse på KÖSKs egne sider',
              'duplikat- og fysisk overlap-kontroll mot Bjørvika-steder'
            ],
            evidence: [
              {
                sourceProvider: 'official_address',
                sourceName: 'geonorge_adresser_v1',
                sourceUrl,
                sourceObjectId,
                sourceQuality: 'official_address_plus_current_gallery_identity',
                finding: 'Geonorge returnerer entydige adressepunkter for både Operagata 63A og 63C. KÖSKs nåværende hoved-, kontakt- og om-sider bruker 63C konsekvent som offentlig galleriadresse; 63A opptrer som hentings-/VisitOSLO-adresse og produseres ikke som separat aktiv markør.',
                canVerifyCoordinate: true,
                reason: '63C er det sterkeste nåværende besøksankeret og har et eget entydig offisielt adressepunkt.'
              }
            ],
            addressCandidates: [
              {
                address: 'Operagata 63C Oslo',
                sourceProvider: 'official_address',
                sourceObjectId,
                lat,
                lon,
                canApplyToPlace: true
              },
              {
                address: 'Operagata 63A Oslo',
                sourceProvider: 'official_address',
                sourceObjectId: 'geonorge-adresser-v1:0301:21508:63A',
                lat: 59.906685874683745,
                lon: 10.758291323082018,
                canApplyToPlace: false
              }
            ],
            sourceObjectCandidates: [
              { sourceProvider: 'official_address', sourceObjectId, canApplyToPlace: true },
              { sourceProvider: 'official_address', sourceObjectId: 'geonorge-adresser-v1:0301:21508:63A', canApplyToPlace: false }
            ],
            geometryCandidates: [],
            coordinateCandidates: [
              { lat, lon, coordRole: 'display_marker', canApplyToPlace: true }
            ],
            decision: {
              canBecomeVerified: true,
              blockedReason: '',
              nextAction: 'Kildekontrakt, to-adresse-audit og representasjonsanker er anvendt på canonical place.'
            },
            notes: [coordNote]
          };
          writeJson(path.join('data/coordinate-evidence', evidenceRel), evidence);

          const placeManifestPath = 'data/places/manifest.json';
          const placeManifest = readJson(placeManifestPath);
          if (!placeManifest.files.includes(placeRel)) placeManifest.files.push(placeRel);
          writeJson(placeManifestPath, placeManifest);

          const evidenceManifestPath = 'data/coordinate-evidence/manifest.json';
          const evidenceManifest = readJson(evidenceManifestPath);
          if (!evidenceManifest.files.includes(evidenceRel)) evidenceManifest.files.push(evidenceRel);
          writeJson(evidenceManifestPath, evidenceManifest);

          const protocolPath = 'docs/coordinates/coordinate-control-protocol.md';
          let protocol = fs.readFileSync(protocolPath, 'utf8');
          const osloStart = protocol.indexOf('## Oslo');
          const noCoordStart = protocol.indexOf('### Dokumenterte Oslo-kontroller uten godkjent koordinat');
          if (osloStart < 0 || noCoordStart < 0) throw new Error('Could not locate bounded Oslo protocol section');
          const osloSection = protocol.slice(osloStart, noCoordStart);
          const rows = [...osloSection.matchAll(/^\| (\d+) \| `([^`]+)` \|.*$/gm)];
          if (!rows.length) throw new Error('No Oslo protocol rows found');
          const lastRow = rows[rows.length - 1];
          const maxBatch = Math.max(...rows.map(m => Number(m[1])));
          const nextBatch = maxBatch + 1;
          const newRow = `| ${nextBatch} | \`${placeId}\` | KÖSK | verified | \`${sourceObjectId}\` |`;
          const insertAt = osloStart + lastRow.index + lastRow[0].length;
          protocol = protocol.slice(0, insertAt) + '\n' + newRow + protocol.slice(insertAt);

          const summaryRe = /Oslo-tabellen inneholder nå (\d+) verifiserte eller kildekontrollerte canonical steder\. Batch \d+ legger til .*? Antallet fullførte kontroller uten godkjent Oslo-koordinat er (\d+)\./;
          const summaryMatch = protocol.match(summaryRe);
          if (!summaryMatch) throw new Error('Could not locate Oslo protocol summary');
          const newTotal = Number(summaryMatch[1]) + 1;
          const noCoordCount = Number(summaryMatch[2]);
          protocol = protocol.replace(summaryRe, `Oslo-tabellen inneholder nå ${newTotal} verifiserte eller kildekontrollerte canonical steder. Batch ${nextBatch} legger til KÖSK med den entydige offisielle Geonorge-adressekoordinaten for dagens offentlige galleriadresse i Operagata 63C; 63A beholdes kun som alternativ hentings-/eldre adresse. Antallet fullførte kontroller uten godkjent Oslo-koordinat er ${noCoordCount}.`);
          fs.writeFileSync(protocolPath, protocol);

          const reportDir = 'reports/visitoslo-oslo-east-audit-20260720/kosk';
          writeJson(path.join(reportDir, 'production-decision.json'), {
            placeId,
            decision: 'produce_single_current_gallery_place_at_63C',
            primaryCategory: 'kunst',
            coordinate: { lat, lon, sourceObjectId },
            nearbyWithin350m: nearby,
            identityDecision: 'KÖSK is one gallery institution. Operagata 63C is the current public gallery address; 63A remains alternate pickup/older listing only.',
            protocolBatch: nextBatch
          });

          console.log(JSON.stringify({ placeId, nextBatch, nearby }, null, 2));
          NODE

      - name: Run and persist validation gates
        shell: bash
        run: |
          set -u
          LOGDIR="reports/coordinate-branch-runner/agent_oslo-coordinate-kosk-production"
          mkdir -p "$LOGDIR"
          : > "$LOGDIR/gate-status.txt"
          BLOCKING_FAIL=0

          run_gate() {
            name="$1"
            shift
            set +e
            "$@" > >(tee "$LOGDIR/$name.log") 2>&1
            code=$?
            set -e
            printf '%s\n' "$code" > "$LOGDIR/$name.exit-code.txt"
            echo "$name=$code" >> "$LOGDIR/gate-status.txt"
            if [ "$code" -ne 0 ]; then BLOCKING_FAIL=1; fi
            return 0
          }

          set -e
          run_gate places-index-build npm run places:index:build
          run_gate split-manifest-sync npm run audit:places-split-manifest-sync
          run_gate places-index-check npm run places:index:check
          run_gate coordinate-source-contract npm run test:coordinate-source-contract
          run_gate coordinate-quality npm run places:coords:quality
          run_gate coordinate-intake npm run places:coords:intake -- --strict-new
          run_gate coordinate-evidence npm run places:coords:evidence:audit
          run_gate git-diff-check git diff --check

          set +e
          npm run health:places 2>&1 | tee "$LOGDIR/health-places.log"
          HEALTH_CODE=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$HEALTH_CODE" > "$LOGDIR/health-places.exit-code.txt"
          echo "health-places=$HEALTH_CODE" >> "$LOGDIR/gate-status.txt"
          printf '%s\n' "$BLOCKING_FAIL" > "$LOGDIR/blocking-fail.txt"

      - name: Commit production result
        shell: bash
        run: |
          set -euo pipefail
          LOGDIR="reports/coordinate-branch-runner/agent_oslo-coordinate-kosk-production"
          BLOCKING_FAIL=$(cat "$LOGDIR/blocking-fail.txt")
          rm -f .github/workflows/temp-kosk-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add KÖSK as canonical Oslo art place"
          git push origin HEAD:agent/oslo-coordinate-kosk-production
          if [ "$BLOCKING_FAIL" -ne 0 ]; then exit 1; fi
