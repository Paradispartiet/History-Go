name: Smalvoll source timeline regeneration (one-shot)
on:
  push:
    branches:
      - content/alna-smalvoll-sourced-prose-only-20261020
    paths:
      - '.github/workflows/smalvoll-source-epoch-sync-once-20261020.yml'
permissions:
  contents: write
concurrency:
  group: smalvoll-source-epoch-once-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild source-backed timeline and validate runtime
        run: |
          set -euo pipefail
          npm run epoker:places:build
          npm run epoker:places:check
          npm run place-open:check
          CHANGED="$(git diff --name-only)"
          if test -n "$CHANGED" && test "$CHANGED" != "data/epoker/epoke-place-index.json"; then
            printf '%s\n' "Unexpected generated changes" "$CHANGED"
            exit 1
          fi
          git diff --check
      - name: Commit only regenerated index
        run: |
          set -euo pipefail
          if git diff --quiet -- data/epoker/epoke-place-index.json; then
            echo 'Epoch index already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/epoker/epoke-place-index.json
          git commit -m 'build(alna): synchronize Smalvoll source-backed epoch place index'
          git push origin HEAD:content/alna-smalvoll-sourced-prose-only-20261020
