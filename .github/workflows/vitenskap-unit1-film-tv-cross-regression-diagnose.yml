name: Repair Vitenskap Unit 1 Film TV cross-regression

on:
  push:
    branches:
      - agent/vitenskap-unit1-registry-integration
    paths:
      - '.github/workflows/vitenskap-unit1-film-tv-cross-regression-diagnose.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitenskap-unit1-registry-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Make Unit 15 shared updatedAt mutations monotonic
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const registryBefore = "  registry.updatedAt = '2026-08-15';";
          const registryAfter = "  if (!registry.updatedAt || registry.updatedAt < '2026-08-15') registry.updatedAt = '2026-08-15';";
          const statusBefore = "  status.updatedAt = '2026-08-15';";
          const statusAfter = "  if (!status.updatedAt || status.updatedAt < '2026-08-15') status.updatedAt = '2026-08-15';";
          if (!source.includes(registryBefore)) throw new Error('Fant ikke gammel ubetinget registry.updatedAt-mutasjon');
          if (!source.includes(statusBefore)) throw new Error('Fant ikke gammel ubetinget status.updatedAt-mutasjon');
          source = source.replace(registryBefore, registryAfter).replace(statusBefore, statusAfter);
          fs.writeFileSync(file, source);
          NODE
      - name: Commit permanent cross-subject isolation fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.mjs
          git commit -m 'Preserve newer shared metadata in Film TV Unit 15 materializer'
          git push origin HEAD:agent/vitenskap-unit1-registry-integration
      - name: Validate shared Fagverk state
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Validate Film TV Unit 15 no longer regresses Vitenskap metadata
        run: |
          node scripts/audit-film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.mjs
          node --test tests/film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.test.mjs
          node --test tests/film-tv-unit15-fulltext-predecessor-monotonicity-v1.test.mjs
      - name: Validate Vitenskap permanent gates remain green
        run: |
          node scripts/audit-fagverk-vitenskap-university-readiness.mjs
          node scripts/audit-fagverk-vitenskap-unit1.mjs
          node --test tests/fagverk-vitenskap-university-readiness.test.mjs
          node --test tests/fagverk-vitenskap-unit1.test.mjs
      - name: Validate clean diff
        run: git diff --check
