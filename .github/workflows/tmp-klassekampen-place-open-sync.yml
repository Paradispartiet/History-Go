# One-shot generated runtime sync after correcting Klassekampen story source.
name: TEMP Klassekampen place-open sync

on:
  push:
    branches:
      - agent/klassekampen-final-ui-closeout-20261007
    paths:
      - .github/workflows/tmp-klassekampen-place-open-sync.yml
      - data/stories/stories_klassekampen_redaksjon.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4

      - name: Regenerate canonical place-open runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run place-open:build

          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "place-open runtime already in sync"
            exit 0
          fi

          for file in "${changed[@]}"; do
            case "$file" in
              data/runtime/place-open/klassekampen_redaksjon.json|data/runtime/stories-all.json|data/runtime/stories-all/*)
                ;;
              *)
                echo "::error::Unexpected generated drift: $file"
                exit 1
                ;;
            esac
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/place-open/klassekampen_redaksjon.json data/runtime/stories-all.json data/runtime/stories-all
          git commit -m "Regenerate Klassekampen place-open runtime"
          git push origin "HEAD:${GITHUB_REF_NAME}"
