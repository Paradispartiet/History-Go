name: TEMP regenerate Film TV unit 12 outputs

on:
  push:
    branches:
      - agent/film-tv-unit12-screen-places-fulltext-complete
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-film-tv-unit12-regenerate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-tv-unit12-screen-places-fulltext-complete
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Regenerate unit 12 on current main baseline
        run: |
          node scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs --write
          node scripts/brief-film-tv-screen-places-identity-circulation-sources-v1.mjs --write-report
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/audit-fagverk-film-tv-phase3.mjs --write-report
          node scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs --write-report
          node scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs --write-report

      - name: Commit regenerated deterministic outputs
        shell: bash
        run: |
          git add -- \
            data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon.json \
            data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/brief.json \
            data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/claims.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_status.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/general-engine-audit.json \
            reports/fagverk/film-tv-phase3-audit.json \
            reports/fagverk/film-tv-industry-regulation-distribution-fulltext-v1-audit.json \
            reports/fagverk/film-tv-screen-places-identity-circulation-source-brief-v1-audit.json \
            reports/fagverk/film-tv-screen-places-identity-circulation-fulltext-v1-audit.json

          if git diff --cached --quiet; then
            echo "No deterministic output changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Film TV unit 12 outputs on current main"
          git push origin HEAD:agent/film-tv-unit12-screen-places-fulltext-complete
