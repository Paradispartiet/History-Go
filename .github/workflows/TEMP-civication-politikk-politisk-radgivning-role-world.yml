name: TEMP Civication Politikk Politisk rådgivning Role World

on:
  push:
    branches:
      - agent/civication-politikk-politisk-radgivning-role-world-20260907
    paths:
      - scripts/TEMP_materialize_politikk_politisk_radgivning_role_world.mjs
      - .github/workflows/TEMP-civication-politikk-politisk-radgivning-role-world.yml

permissions:
  contents: write

concurrency:
  group: temp-civication-politikk-politisk-radgivning-role-world
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-politikk-politisk-radgivning-role-world-20260907
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Syntax
        run: node --check scripts/TEMP_materialize_politikk_politisk_radgivning_role_world.mjs

      - name: Materialize Politisk rådgivning Role World
        run: node scripts/TEMP_materialize_politikk_politisk_radgivning_role_world.mjs

      - name: Deepen primary relationship threads
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='data/Civication/roleWorlds/politikk/politikk_politisk_radgivning.json';
          const world=JSON.parse(fs.readFileSync(path,'utf8'));
          const common='Standing bygges og brytes langsomt gjennom gjentatte valg, ikke gjennom ett enkelt riktig svar. Spilleren skal senere møte hukommelsen om hva som ble sagt, hvilke premisser som ble synliggjort, hvem som fikk tilgang, og om tidligere usikkerhet ble behandlet redelig. Tillit kan derfor utvikle seg ulikt mellom politisk ledelse, fagmiljø, presse, interessenter, kolleger, gjennomføringsledd og private relasjoner, uten at noen av disse reaksjonene blir formell myndighet.';
          const specific={
            beslutningseier_og_rad:'Når Ingrid vender tilbake til saken, skal hun kunne se om rådgiveren tidligere utfordret henne på et vanskelig premiss, om anbefalingen faktisk ble fulgt, og om uenigheten ble bevart uten å omskrive beslutningen. Det gjør lederens tillit avhengig av både politisk nytte og etterprøvbar rolleintegritet.',
            kilde_usikkerhet_og_alternativer:'Når nye kilder eller resultater kommer, skal Marius og andre kontrollaktører kunne sammenligne dem med den opprinnelige versjonen og se om rådgiveren var tydelig om usikkerhet. Korrigering styrker standing når den er sporbar; opportunistisk historieskriving svekker den.',
            interessenttilgang_og_representasjon:'Når de samme organisasjonene eller berørte gruppene vender tilbake, skal møteloggen vise hvem som tidligere ble hørt, hvem som manglet, hvilke interesser som var eksplisitte, og om noen fikk uautoriserte løfter. Relasjonell tillit avhenger av redelig representasjon, ikke lik møtefrekvens.',
            fortrolighet_og_informasjonsmakt:'Når sensitiv informasjon senere blir offentlig, erstattet eller irrelevant, skal tidligere valg om tilgang fortsatt kunne vurderes. Den som avsto fra taktisk lekkasje kan ha tapt kortsiktig status og samtidig bygget varig tillit; den som misbrukte nærhet kan møte forsinket institusjonell og privat kostnad.',
            kommunikasjon_og_offentlig_korrigering:'Når et gammelt talepunkt siteres på nytt, skal Samira og offentligheten kunne skille hva som var kjent da, hva som senere ble korrigert, og hva beslutningseieren faktisk vedtok. Standing følger evnen til å korrigere uten å late som den tidligere formuleringen aldri eksisterte.',
            gjennomforing_og_bounded_rework:'Når forvaltningen møter konsekvensene i praksis, skal handoff og rådgivningslogg gjøre det mulig å se hvilke risikoer som var varslet, hvilke premisser som sviktet, og hvilket ansvar som faktisk ble tildelt. Sen læring skal endre framtidige råd uten å slette beslutningshistorien.',
            maktnaerhet_karriere_og_privatrand:'Når rådgiverens interne status øker eller faller, skal tidligere lojalitetsvalg og private grenser fortsatt ha sosial virkning. Nærhet til ledelsen kan åpne samtaler og skape forventninger, men den må aldri bli delegasjon, særtilgang for venner eller et krav om at faglige motargumenter tones ned.'
          };
          for(const thread of world.primary_threads||[]){
            const extra=specific[thread.id];
            if(!extra) throw new Error(`Missing relationship extension for ${thread.id}`);
            thread.relationship=`${thread.relationship} ${common} ${extra}`;
            if(thread.relationship.length<350) throw new Error(`Relationship still too short: ${thread.id}/${thread.relationship.length}`);
          }
          fs.writeFileSync(path,JSON.stringify(world,null,2)+'\n');
          NODE

      - name: Generate canonical rollout surfaces
        run: |
          set -euo pipefail
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write

      - name: Verify Politisk rådgivning Role World
        run: node tests/civication-politikk-politisk-radgivning-role-world-rollout.test.js

      - name: Verify global Role World contract
        run: node tests/civication-role-world-contract.test.js

      - name: Verify Career Gameplay Matrix
        run: node tests/civication-career-gameplay-matrix.test.js

      - name: Verify Role World readiness
        run: node tests/civication-role-world-rollout-readiness.test.js

      - name: Verify Scene Registry
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Verify Scenario People index
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check

      - name: Verify Scenario People audit
        run: node --test tests/civication-scenario-people.test.mjs

      - name: Verify full Civication suite
        run: node tests/run-civication-tests.mjs

      - name: Verify job learning profiles
        run: npm run audit:job-learning-profiles

      - name: Verify job knowledge requirements
        run: npm run audit:job-knowledge-requirements

      - name: Verify exact permanent Role World scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          if [ "${#changed[@]}" -ne 9 ]; then
            echo "Expected exactly 9 permanent Role World paths, found ${#changed[@]}" >&2
            exit 1
          fi
          for f in "${changed[@]}"; do
            case "$f" in
              data/Civication/careerGameplayMatrix.json|data/Civication/roleWorldAuthoringChecklist.json|data/Civication/roleWorldRolloutReadiness.json|data/Civication/roleWorldThemeBank.json|data/Civication/roleWorlds/index.json|data/Civication/roleWorlds/politikk/politikk_politisk_radgivning.json|reports/CIVICATION_POLITIKK_POLITISK_RADGIVNING_ROLE_WORLD_ROLLOUT_SOURCE_FIRST.md|reports/civication-role-world-rollout-readiness.md|tests/civication-politikk-politisk-radgivning-role-world-rollout.test.js)
                ;;
              *)
                echo "Unexpected generated path: $f" >&2
                exit 1
                ;;
            esac
          done
          for required in \
            data/Civication/careerGameplayMatrix.json \
            data/Civication/roleWorldAuthoringChecklist.json \
            data/Civication/roleWorldRolloutReadiness.json \
            data/Civication/roleWorldThemeBank.json \
            data/Civication/roleWorlds/index.json \
            data/Civication/roleWorlds/politikk/politikk_politisk_radgivning.json \
            reports/CIVICATION_POLITIKK_POLITISK_RADGIVNING_ROLE_WORLD_ROLLOUT_SOURCE_FIRST.md \
            reports/civication-role-world-rollout-readiness.md \
            tests/civication-politikk-politisk-radgivning-role-world-rollout.test.js; do
            printf '%s\n' "${changed[@]}" | grep -Fx "$required" >/dev/null || { echo "Missing required permanent path: $required" >&2; exit 1; }
          done
          git diff --check

      - name: Commit permanent verified Role World
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/TEMP_materialize_politikk_politisk_radgivning_role_world.mjs
          rm -f .github/workflows/TEMP-civication-politikk-politisk-radgivning-role-world.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.' >&2
            exit 1
          fi
          git diff --cached --check
          git status --short
          git commit -m "Complete Politikk Politisk rådgivning Role World"
          git push origin HEAD:agent/civication-politikk-politisk-radgivning-role-world-20260907
