name: Fagverk By Administrasjon og plan phase 4

on:
  pull_request:
    paths:
      - "data/fagverk/by/administrasjon-plan-kontroll-beredskap.json"
      - "data/fagverk/by/administrasjon-plan-kontroll-beredskap/**"
      - "data/fagverk/fagverk_registry.json"
      - "data/fagverk/subject_status.json"
      - "data/fagverk/fagverk_release.json"
      - "scripts/audit-fagverk-by-administrasjon-plan-kontroll-beredskap-phase4.mjs"
      - "scripts/audit-fagverk-by-*.mjs"
      - "tests/fagverk-by-administrasjon-plan-kontroll-beredskap-phase4.test.mjs"
      - "tests/fagverk-by-*.test.mjs"
      - "tests/fagverk-general-engine.test.mjs"
      - "reports/fagverk/by-administrasjon-plan-kontroll-beredskap-phase4-audit.json"
      - "reports/fagverk/by-*-audit.json"
      - ".github/workflows/fagverk-by-administrasjon-plan-kontroll-beredskap-phase4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Audit Administrasjon og plan 3 av 3
        run: node scripts/audit-fagverk-by-administrasjon-plan-kontroll-beredskap-phase4.mjs
      - name: Test Administrasjon og plan og bevar tidligere By-domener
        run: |
          node --test tests/fagverk-by-administrasjon-plan-kontroll-beredskap-phase4.test.mjs
          node --test tests/fagverk-by-bolig-nabolag-tilgang-endring-phase4.test.mjs
          node --test tests/fagverk-by-arkitektur-gatekant-makt-ombruk-phase4.test.mjs
          node --test tests/fagverk-by-pilot.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
      - name: Verifiser release-manifest
        run: node scripts/build-fagverk-release-manifest.mjs --check
