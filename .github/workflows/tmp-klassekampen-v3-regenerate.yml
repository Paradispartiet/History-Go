name: TEMP Klassekampen v3 regenerate

on:
  push:
    branches:
      - agent/klassekampen-place-production-v3-20261004

permissions:
  contents: write

concurrency:
  group: klassekampen-v3-regenerate
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/klassekampen-place-production-v3-20261004
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Replace legacy workcard with canonical v3 projections
        shell: bash
        run: |
          set -euo pipefail
          rm -f reports/place-production/klassekampen-workcard-current.json
          npm run place:build -- klassekampen_redaksjon

      - name: Regenerate source-backed epoch place index
        run: npm run epoker:places:build

      - name: Verify generated outputs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-place-production-v3-projections.mjs klassekampen_redaksjon --check
          npm run epoker:places:check
          node scripts/place-production-rule-preflight.mjs validate --workcard reports/place-production/klassekampen-redaksjon-workcard-current.json

      - name: Commit generated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Regenerate Klassekampen v3 projections and epoch index'
          git push origin HEAD:agent/klassekampen-place-production-v3-20261004
