name: TEMP Næringsliv theory integrity probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate existing Næringsliv quality layers
        run: |
          node --check tools/probe-naeringsliv-theory-integrity.mjs
          node --check tools/audit-naeringsliv-theory-integrity.mjs
          node scripts/audit-naeringsliv-subject-quality.mjs
          node tools/validate-okonomi-naeringsliv-universitetskvalitet.mjs
      - name: Run read-only diagnostic probe
        run: node tools/probe-naeringsliv-theory-integrity.mjs
      - name: Materialize permanent subject report and test gate
        run: |
          node tools/audit-naeringsliv-theory-integrity.mjs --write-report --no-check-report
          node --test tests/naeringsliv-theory-integrity.test.mjs
      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: naeringsliv-theory-integrity-reconciliation
          path: |
            /tmp/naeringsliv-theory-integrity-probe.json
            reports/fagverk/naeringsliv-theory-integrity-audit.json
