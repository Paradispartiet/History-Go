name: TEMP Næringsliv theory integrity probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate committed Næringsliv subject gate
        run: |
          node --check tools/audit-naeringsliv-theory-integrity.mjs
          node tools/audit-naeringsliv-theory-integrity.mjs
          node --test tests/naeringsliv-theory-integrity.test.mjs
      - name: Materialize current-main plus Næringsliv shared gate
        run: |
          node --check tools/temp-reconcile-naeringsliv-theory-integrity.mjs
          node tools/temp-reconcile-naeringsliv-theory-integrity.mjs
          node --check scripts/audit-fagverk-theory-integrity.mjs
          node scripts/audit-fagverk-theory-integrity.mjs --write-report --no-check-report
          node --test tests/fagverk-theory-integrity.test.mjs
          node --test tests/naeringsliv-theory-integrity.test.mjs
      - name: Commit exact permanent reconciliation and remove TEMP
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tar -cf /tmp/naeringsliv-permanent.tar \
            data/fag/fagverk_theory_integrity_evidence_v1.json \
            scripts/audit-fagverk-theory-integrity.mjs \
            tests/fagverk-theory-integrity.test.mjs \
            .github/workflows/fagverk-theory-integrity.yml \
            .github/workflows/naeringsliv-subject-quality.yml \
            reports/fagverk/fagverk-theory-integrity-audit.json
          git reset --hard HEAD
          git fetch origin "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          git fetch origin "${BASE_SHA}"
          git checkout -B finalize "refs/remotes/origin/${HEAD_BRANCH}"
          git merge --no-ff --no-commit "${BASE_SHA}"
          tar -xf /tmp/naeringsliv-permanent.tar
          git add -- \
            data/fag/fagverk_theory_integrity_evidence_v1.json \
            scripts/audit-fagverk-theory-integrity.mjs \
            tests/fagverk-theory-integrity.test.mjs \
            .github/workflows/fagverk-theory-integrity.yml \
            .github/workflows/naeringsliv-subject-quality.yml \
            reports/fagverk/fagverk-theory-integrity-audit.json
          git rm -- \
            .github/workflows/temp-naeringsliv-theory-integrity-probe.yml \
            tools/probe-naeringsliv-theory-integrity.mjs \
            tools/temp-reconcile-naeringsliv-theory-integrity.mjs
          git diff --cached --check
          git commit -m "Finalize Næringsliv strict theory integrity reconciliation"
          git push origin HEAD:"refs/heads/${HEAD_BRANCH}"
