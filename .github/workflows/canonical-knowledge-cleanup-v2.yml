name: Canonical Knowledge cleanup v2

on:
  pull_request:
    paths:
      - 'scripts/knowledge-canonical-data.mts'
      - 'scripts/apply-canonical-knowledge-cleanup.py'
      - 'scripts/apply-claim-id-separation.py'
      - 'scripts/apply-storage-test-audit-allowlist.py'
      - 'scripts/apply-legacy-id-label-preservation.py'
      - 'scripts/apply-emne-inference-fixed-point.py'
      - 'scripts/apply-canonical-array-contract.py'
      - 'scripts/apply-explicit-id-precedence.py'
      - 'scripts/apply-unique-explicit-id-ownership.py'
      - 'scripts/apply-current-holmenkollen-classification.py'
      - 'tests/knowledge-canonical-storage-contract.test.js'
      - '.github/workflows/canonical-knowledge-cleanup-v2.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/canonical-knowledge-data-cleanup-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-knowledge-data-cleanup-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply controlled source migration
        run: |
          python scripts/apply-canonical-knowledge-cleanup.py
          python scripts/apply-claim-id-separation.py
          python scripts/apply-storage-test-audit-allowlist.py
          python scripts/apply-legacy-id-label-preservation.py
          python scripts/apply-emne-inference-fixed-point.py
          python scripts/apply-canonical-array-contract.py
          python scripts/apply-explicit-id-precedence.py
          python scripts/apply-unique-explicit-id-ownership.py
          python scripts/apply-current-holmenkollen-classification.py
      - name: Build canonical data tooling
        run: npm run build:scripts
      - name: Backfill canonical IDs and registries
        run: node dist/scripts/knowledge-canonical-data.mjs --write
      - name: Build browser runtimes
        run: npm run build:web
      - name: Typecheck browser runtime
        run: npm run typecheck:web
      - name: Typecheck data tooling
        run: npm run typecheck:scripts
      - name: Verify canonical data has no drift
        run: node dist/scripts/knowledge-canonical-data.mjs --check
      - name: Verify legacy readers are gone
        run: node dist/scripts/knowledge-canonical-data.mjs --legacy-only
      - name: Verify Knowledge contract
        run: node dist/scripts/knowledge-canonical-data.mjs --audit-only
      - name: Run Knowledge tests
        shell: bash
        run: |
          set -o pipefail
          { npm run test:knowledge-core; node --test tests/knowledge-canonical-storage-contract.test.js; } 2>&1 | tee reports/canonical-knowledge-tests.log
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Knowledge browser E2E
        run: npm run test:knowledge-browser
      - name: Run Places check
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check-places.sh 2>&1 | tee reports/canonical-places-check.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-knowledge-cleanup-v2-reports
          path: |
            reports/canonical-knowledge-tests.log
            reports/canonical-places-check.log
            reports/knowledge-id-backfill.json
            reports/knowledge-contract-audit.json
            reports/knowledge-universe-readers.json
            data/knowledge/knowledge_emne_review_queue.generated.json
          if-no-files-found: warn
      - name: Commit verified implementation
        run: |
          git config user.name 'History GO CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset -- reports/canonical-knowledge-tests.log reports/canonical-places-check.log scripts/apply-canonical-knowledge-cleanup.py scripts/apply-claim-id-separation.py scripts/apply-storage-test-audit-allowlist.py scripts/apply-legacy-id-label-preservation.py scripts/apply-emne-inference-fixed-point.py scripts/apply-canonical-array-contract.py scripts/apply-explicit-id-precedence.py scripts/apply-unique-explicit-id-ownership.py scripts/apply-current-holmenkollen-classification.py .github/workflows/canonical-knowledge-cleanup-v2.yml .github/workflows/knowledge-checks.yml .github/workflows/data-checks.yml
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Canonicalize Knowledge data and retire legacy storage'
          git push origin HEAD:agent/canonical-knowledge-data-cleanup-v2
