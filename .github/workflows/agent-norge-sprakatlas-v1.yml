name: Agent Norge språkatlas v1

on:
  push:
    branches:
      - agent/norge-sprakatlas-v1
    paths:
      - .github/workflows/agent-norge-sprakatlas-v1.yml
      - scripts/agent_build_norge_sprakatlas_v1.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-norge-sprakatlas-v1.yml
      - scripts/agent_build_norge_sprakatlas_v1.py

permissions:
  contents: write

jobs:
  build-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/norge-sprakatlas-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Register existing Trondheim area Place
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'data/places/manifest.json';
          const relative = 'places/subkultur/trondelag/svartlamon_trondheim/svartlamon_trondheim.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          manifest.files = Array.isArray(manifest.files) ? manifest.files : [];
          if (!manifest.files.includes(relative)) manifest.files.push(relative);
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Materialize national language atlas
        run: |
          python -m py_compile scripts/agent_build_norge_sprakatlas_v1.py
          python scripts/agent_build_norge_sprakatlas_v1.py
      - name: Check generated runtime and language regressions
        run: |
          node --check js/ui/place-language-layer.js
          node --test tests/place-language-dialect-scope.test.mjs tests/place-language-layer.test.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              'data/leksikon/sprak/norge_atlas_v1.json',
              'data/leksikon/sprak/schema_v2.json',
              'data/leksikon/sprak/manifest.json',
              'data/leksikon/sprak/places/europe/norway/trondelag/svartlamon_trondheim.json',
          ]:
              json.loads(Path(path).read_text(encoding='utf-8'))
          PY
      - name: Commit generated product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/manifest.json \
                  data/leksikon/sprak \
                  js/ui/place-language-layer.js \
                  css/place-language-layer.css \
                  docs/SPRAKLEKSIKON.md \
                  tests/place-language-dialect-scope.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Bygg Språkatlas Norge v1"
          git push origin HEAD:agent/norge-sprakatlas-v1
