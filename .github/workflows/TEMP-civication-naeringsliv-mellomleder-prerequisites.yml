name: TEMP Materialize Mellomleder Prerequisites

on:
  push:
    branches:
      - agent/civication-naeringsliv-mellomleder-prerequisites
    paths:
      - scripts/TEMP_materialize_mellomleder_prerequisites.mjs
      - tests/civication-mellomleder-readiness-prerequisites.test.js
      - reports/CIVICATION_NAERINGSLIV_MELLOMLEDER_PREREQUISITES_SOURCE_FIRST.md
      - .github/workflows/TEMP-civication-naeringsliv-mellomleder-prerequisites.yml
  workflow_dispatch:

concurrency:
  group: civication-naeringsliv-mellomleder-prerequisites-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-naeringsliv-mellomleder-prerequisites
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Materialize Mellomleder prerequisites
        run: node scripts/TEMP_materialize_mellomleder_prerequisites.mjs
      - name: Regenerate Scenario People
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - name: Regenerate compiled Scene Registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Regenerate Career Gameplay audit
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Regenerate rollout readiness
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify focused prerequisite contract
        run: node tests/civication-mellomleder-readiness-prerequisites.test.js
      - name: Verify existing rollout playability
        run: node tests/civication-mellomleder-rollout-playability.test.js
      - name: Verify first practice week
        run: node tests/civication-mellomleder-first-week-praksisfortellinger.test.js
      - name: Verify second practice week
        run: node tests/civication-mellomleder-second-week-praksisfortellinger.test.js
      - name: Verify two-week flow
        run: node tests/civication-mellomleder-two-week-flow.test.js
      - name: Verify Career Gameplay baseline
        run: node tests/civication-career-gameplay-matrix.test.js
      - name: Verify rollout readiness gate
        run: node tests/civication-role-world-rollout-readiness.test.js
      - name: Verify compiled Scene Registry parity
        run: node scripts/build-civication-scene-registry.mjs --check
      - name: Verify Scenario People generated state
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
      - name: Verify Scenario People invariants
        run: node --test tests/civication-scenario-people.test.mjs
      - name: Run full Civication suite
        run: |
          set +e
          npm run test:civication > /tmp/civication.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "=== relevant Civication failure output ==="
            grep -E -B 8 -A 24 'AssertionError|ERR_ASSERTION|not ok|FAIL|Error:|error:' /tmp/civication.log | tail -n 220 || tail -n 220 /tmp/civication.log
            exit "$status"
          fi
          echo "Full Civication suite passed."
          tail -n 50 /tmp/civication.log
      - name: Remove temporary prerequisite surfaces
        run: rm scripts/TEMP_materialize_mellomleder_prerequisites.mjs .github/workflows/TEMP-civication-naeringsliv-mellomleder-prerequisites.yml
      - name: Commit exact verified prerequisite state
        run: |
          git diff --check
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No permanent changes produced"; exit 1; }
          git commit -m "Complete Mellomleder prerequisites"
          git push origin HEAD:agent/civication-naeringsliv-mellomleder-prerequisites
