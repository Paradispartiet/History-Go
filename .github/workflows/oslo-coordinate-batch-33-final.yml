name: Complete Oslo coordinate control batch 33

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-33-final
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge latest main before applying coordinates
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Capture normative Geonorge and exact OSM source results
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-33/sources
          mkdir -p "$out"
          node --experimental-strip-types tools/address-first-coordinate-finder.mts --address 'Sandakerveien 10A Oslo' \
            | tee "$out/glads-molle-geonorge.json"
          node --experimental-strip-types tools/address-first-coordinate-finder.mts --address 'Maridalsveien 120 Oslo' \
            | tee "$out/voienvolden-geonorge.json"
          python3 - <<'PY' | tee "$out/source-resolution-summary.json"
          import json, urllib.parse, urllib.request
          from pathlib import Path
          out=Path('reports/oslo-coordinate-control-batch-33/sources')
          headers={'User-Agent':'History-Go-coordinate-control/1.0 contact=repository-audit'}
          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=45) as r:
                  return json.load(r)
          lookup='https://nominatim.openstreetmap.org/lookup?'+urllib.parse.urlencode({
              'osm_ids':'W4648305,R1103963,W532768329,N4171862592',
              'format':'jsonv2','addressdetails':1,'extratags':1,'namedetails':1,
          })
          lookup_data=get_json(lookup)
          (out/'osm-lookup.json').write_text(json.dumps(lookup_data,ensure_ascii=False,indent=2)+'\n')
          search='https://nominatim.openstreetmap.org/search?'+urllib.parse.urlencode({
              'q':'Vøyenfallene, Oslo, Norway','format':'jsonv2','limit':10,'addressdetails':1,'extratags':1,'namedetails':1,
          })
          search_data=get_json(search)
          (out/'voienfallene-nominatim.json').write_text(json.dumps(search_data,ensure_ascii=False,indent=2)+'\n')
          wd_url='https://www.wikidata.org/wiki/Special:EntityData/Q114345801.json'
          wd=get_json(wd_url)['entities']['Q114345801']
          coords=[]
          for claim in wd.get('claims',{}).get('P625',[]):
              value=claim.get('mainsnak',{}).get('datavalue',{}).get('value',{})
              if isinstance(value,dict): coords.append(value)
          wd_result={'ok':True,'id':'Q114345801','coordinates':coords}
          (out/'voienfallene-wikidata.json').write_text(json.dumps(wd_result,ensure_ascii=False,indent=2)+'\n')
          expected={('way',4648305),('relation',1103963),('way',532768329),('node',4171862592)}
          found={(r.get('osm_type'),r.get('osm_id')) for r in lookup_data}
          if found != expected:
              raise SystemExit(f'Unexpected OSM lookup set: {found}')
          if search_data:
              raise SystemExit('Vøyenfallene unexpectedly has a Nominatim exact-name candidate; manual re-audit required')
          if coords:
              raise SystemExit('Vøyenfallene Wikidata entity now has coordinates; manual re-audit required')
          print(json.dumps({'osm_objects':sorted([f'{t}:{i}' for t,i in found]),'voienfallene_nominatim_hits':len(search_data),'voienfallene_wikidata_coordinates':len(coords)},ensure_ascii=False,indent=2))
          PY
      - name: Apply researched batch 33 decisions safely
        run: node scripts/tmp-complete-oslo-coordinate-batch33.mjs
      - name: Build repository tools without npm install
        run: |
          rm -rf dist/tools
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),{stripTypeScriptTypes}=require('node:module');
          const src=path.resolve('tools'),out=path.resolve('dist/tools');
          function walk(d){return fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const f=path.join(d,e.name);return e.isDirectory()?walk(f):(/\.(mts|ts|cts)$/.test(e.name)?[f]:[])});}
          for(const f of walk(src)){const rel=path.relative(src,f),ext=path.extname(rel),oe=ext==='.mts'?'.mjs':ext==='.cts'?'.cjs':'.js',dest=path.join(out,rel.slice(0,-ext.length)+oe),s=fs.readFileSync(f,'utf8'),nl=s.indexOf('\n'),sh=s.startsWith('#!')?s.slice(0,nl+1):'',body=s.startsWith('#!')?s.slice(nl+1):s;fs.mkdirSync(path.dirname(dest),{recursive:true});fs.writeFileSync(dest,sh+stripTypeScriptTypes(body,{mode:'transform'}));}
          NODE
      - name: Rebuild global runtime index
        run: node dist/tools/build_places_index.mjs
      - name: Prove exact batch scope against merged main
        run: |
          node <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const file='data/places/natur/oslo/places_oslo_natur_akerselvarute.json';
          const before=JSON.parse(cp.execFileSync('git',['show',`origin/main:${file}`],{encoding:'utf8'}));
          const after=JSON.parse(fs.readFileSync(file,'utf8'));
          const b=new Map(before.map(p=>[p.id,p]));
          const changed=after.filter(p=>JSON.stringify(p)!==JSON.stringify(b.get(p.id))).map(p=>p.id);
          const expected=['glads_molle','voienfossen','voien_gard_voienvolden','myralokka','kuba_parken','beierbrua','nedre_foss'];
          const bad=changed.filter(id=>!expected.includes(id));
          if(bad.length)throw new Error('Unexpected aggregate changes: '+bad.join(','));
          for(const id of expected)if(!changed.includes(id))throw new Error('Expected aggregate record unchanged: '+id);
          console.log(changed.join('\n'));
          NODE
      - name: Run all hard validation gates
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-33/validation
          mkdir -p "$out"
          node dist/tools/audit-places-split-manifest-sync.mjs | tee "$out/split-manifest-sync.txt"
          node dist/tools/check_no_lng_coordinates.mjs | tee "$out/places-index-check.txt"
          node dist/tools/check_places_index_sync.mjs | tee -a "$out/places-index-check.txt"
          node tests/place-coordinate-index-parity.test.js | tee -a "$out/places-index-check.txt"
          node tests/coordinate-source-contract-anchor-trust.test.mjs | tee "$out/coordinate-source-contract.txt"
          node dist/tools/place-coordinate-quality-gate.mjs | tee "$out/coordinate-quality.txt"
          node dist/tools/place-coordinate-intake-gate.mjs --strict-new | tee "$out/coordinate-intake.txt"
          node dist/tools/audit-coordinate-evidence.mjs | tee "$out/coordinate-evidence-audit.txt"
          git diff --check | tee "$out/git-diff-check.txt"
      - name: Assert canonical split runtime content and protocol result
        run: node scripts/tmp-assert-oslo-coordinate-batch33.mjs
      - name: Render old/new map QA for every coordinate change
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-33/visual-qa
          mkdir -p "$out"
          python3 - <<'PY'
          import json, html
          from pathlib import Path
          root=Path('reports/oslo-coordinate-control-batch-33')
          qa=root/'visual-qa'
          data=json.loads((root/'applied-summary.json').read_text())['moves']
          groups=[
              ('major-moves',['glads_molle','myralokka','beierbrua','nedre_foss']),
              ('minor-normalizations',['voien_gard_voienvolden','kuba_parken']),
          ]
          labels={
              'glads_molle':'Glads mølle','myralokka':'Myraløkka','beierbrua':'Beierbrua','nedre_foss':'Nedre Foss',
              'voien_gard_voienvolden':'Vøienvolden gård','kuba_parken':'Kuba-parken',
          }
          for slug,ids in groups:
              rows=[]
              for id in ids:
                  move=data[id]
                  for phase,coords in [('gammel',move['from']),('ny',move['to'])]:
                      lat,lon=coords
                      rows.append((labels[id],phase,lat,lon))
              height=500*(len(rows)//2)
              cells=[]
              script=[]
              for i,(label,phase,lat,lon) in enumerate(rows):
                  mid=f'm{i}'
                  cells.append(f'<div class="p"><div class="l">{html.escape(label)} – {phase}<span class="s">{lat}, {lon}</span></div><div id="{mid}" class="m"></div></div>')
                  script.append(f"mk('{mid}',{lat},{lon});")
              doc=f'''<!doctype html><html><head><meta charset="utf-8"><style>html,body{{margin:0;width:1600px;height:{height}px;font-family:Arial}}.grid{{display:grid;grid-template-columns:1fr 1fr;width:1600px;height:{height}px}}.p{{position:relative;height:500px}}.m{{width:800px;height:500px}}.l{{position:absolute;z-index:9999;top:12px;left:12px;background:#fff;padding:9px 12px;border:3px solid #111;font-size:19px;font-weight:700}}.s{{display:block;font-size:13px;font-weight:400;margin-top:3px}}.mk{{width:26px;height:26px;border-radius:50%;background:#fff;border:7px solid #111;box-sizing:border-box}}</style><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script></head><body><div class="grid">{''.join(cells)}</div><script>const I=L.divIcon({{className:'',html:'<div class="mk"></div>',iconSize:[26,26],iconAnchor:[13,13]}});function mk(id,lat,lon){{const m=L.map(id,{{zoomControl:false,attributionControl:false}}).setView([lat,lon],17);L.tileLayer('https://tile.openstreetmap.org/{{z}}/{{x}}/{{y}}.png',{{maxZoom:19}}).addTo(m);L.marker([lat,lon],{{icon:I}}).addTo(m);}}{''.join(script)}</script></body></html>'''
              (qa/f'{slug}.html').write_text(doc)
              (qa/f'{slug}.size').write_text(f'1600,{height}')
          (qa/'README.md').write_text('# Batch 33 visual map QA\n\nOld/new map comparisons for all six records whose lat/lon changed.\n')
          PY
          (cd "$out" && python3 -m http.server 8767 >/tmp/b33-http.log 2>&1 & echo $! >/tmp/b33-http.pid)
          sleep 2
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          IFS=, read -r w h < "$out/major-moves.size"
          "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size="$w,$h" --virtual-time-budget=9000 --screenshot="$PWD/$out/major-moves.png" http://127.0.0.1:8767/major-moves.html
          IFS=, read -r w h < "$out/minor-normalizations.size"
          "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size="$w,$h" --virtual-time-budget=7000 --screenshot="$PWD/$out/minor-normalizations.png" http://127.0.0.1:8767/minor-normalizations.html
          kill "$(cat /tmp/b33-http.pid)" 2>/dev/null || true
          rm "$out"/*.html "$out"/*.size
          test -s "$out/major-moves.png"
          test -s "$out/minor-normalizations.png"
      - uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch-33-visual-qa
          path: reports/oslo-coordinate-control-batch-33/visual-qa/*.png
          if-no-files-found: error
      - name: Commit clean completed batch
        run: |
          rm -f .github/workflows/oslo-coordinate-batch-33-final.yml .github/workflows/fix-oslo-coordinate-batch-33-workflow.yml scripts/tmp-complete-oslo-coordinate-batch33.mjs scripts/tmp-assert-oslo-coordinate-batch33.mjs
          git add data docs reports .github/workflows/oslo-coordinate-batch-33-final.yml .github/workflows/fix-oslo-coordinate-batch-33-workflow.yml scripts/tmp-complete-oslo-coordinate-batch33.mjs scripts/tmp-assert-oslo-coordinate-batch33.mjs
          git commit -m 'Complete Oslo coordinate control batch 33'
          git push origin HEAD:refs/heads/agent/oslo-coordinate-control-batch-33-final
