name: Build Etne prestebustad source-sized quiz

on:
  push:
    branches:
      - agent/etne-prestebustad-source-sized-quiz

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-prestebustad-source-sized-quiz
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Materialize source-sized Etne prestebustad quiz
        run: |
          node <<'NODE'
          const fs = require('fs');
          const targetId = 'etne_prestebustad';
          const quizPath = `data/quiz/historie/${targetId}_sets.json`;
          const guidanceFiles = [
            'data/fag/historie/emner_historie_canonical_v4_5.json',
            'data/fag/historie/supersetQUIZMAL_historie.json',
            'data/fag/historie/methods_historie_canonical_v4_5.json'
          ];

          function q({n, set, local, text, options, answer, knowledge, type, difficulty, emne, method, concepts, tags, claim, sources, focus = []}) {
            const answerIndex = options.indexOf(answer);
            if (answerIndex < 0) throw new Error(`Answer missing for ${n}`);
            return {
              id: `${targetId}_quiz_${n}`,
              quiz_id: `historie_${targetId}_set_${set}_q${local}`,
              categoryId: 'historie',
              placeId: targetId,
              targetId,
              question_scope: 'place',
              question: text,
              options,
              answer,
              answerIndex,
              knowledge,
              difficulty,
              question_type: type,
              year: null,
              epoke_id: null,
              epoke_domain: 'historie',
              emne_id: emne,
              related_emner: [],
              source: sources,
              source_origin: 'mixed',
              claim_basis: claim,
              guidance_basis: {
                emne_id: emne,
                canonical_files_used_as_guidance_only: guidanceFiles,
                method_id: method
              },
              method_id: method,
              core_concepts: concepts,
              concept_focus: focus,
              tags: [targetId, ...tags]
            };
          }

          const sets = [
            {
              set_id: `historie_${targetId}_set_1`, level: 1, order: 1, xp: 50,
              title: 'Hovudbygning og eldre borgstove',
              questions: [
                q({
                  n: 1, set: 1, local: 1,
                  text: 'Når vart hovudbygningen i det noverande prestegardstunet reist?',
                  options: ['1871', '1671', '1971'],
                  answer: '1871',
                  knowledge: 'Den noverande hovudbygningen vart reist i 1871 på ein ny tunplass lenger frå elva.',
                  type: 'fact', difficulty: 1,
                  emne: 'em_his_spor_materialitet', method: 'met_periodisering',
                  concepts: ['1871', 'hovudbygning', 'prestegardstun'], tags: ['arstal', 'hovudbygning'],
                  claim: 'Etne kommune daterer hovudbygningen i det noverande tunet til 1871.',
                  sources: ['etne_kommune_prestegard', 'riksantikvaren_prestegard']
                }),
                q({
                  n: 2, set: 1, local: 2,
                  text: 'Kva stil og hovudform har hovudbygningen?',
                  options: ['Enkel sveitsarstil i halvannan etasje', 'Barokk steinbygning i fire etasjar', 'Funksjonalistisk betonghus i éin etasje'],
                  answer: 'Enkel sveitsarstil i halvannan etasje',
                  knowledge: 'Hovudbygningen er eit trehus i halvannan etasje, utforma i ein enkel variant av sveitsarstilen.',
                  type: 'fact', difficulty: 1,
                  emne: 'em_his_spor_materialitet', method: 'met_sporlesning',
                  concepts: ['sveitsarstil', 'trehus', 'halvannan etasje'], tags: ['arkitektur', 'stil'],
                  claim: 'Kulturmiljøplanen skildrar hovudbygningen som trehus i halvannan etasje og enkel sveitsarstil.',
                  sources: ['etne_kommune_prestegard']
                }),
                q({
                  n: 3, set: 1, local: 3,
                  text: 'Kva alder blir den eldre borgstova knytt til?',
                  options: ['1600-talet', '1900-talet', 'Vikingtida'],
                  answer: '1600-talet',
                  knowledge: 'Kjelda seier at borgstova skal vere frå 1600-talet. Formuleringa bevarer eit atterhald om den presise dateringa.',
                  type: 'fact', difficulty: 1,
                  emne: 'em_his_kildekritikk_arkiv_spor', method: 'met_kildekritikk',
                  concepts: ['borgstove', '1600-talet', 'dateringsatterhald'], tags: ['borgstove', 'eldre_bygningslag'],
                  claim: 'Borgstova blir i den kommunale dokumentasjonen knytt til 1600-talet med atterhald.',
                  sources: ['etne_kommune_prestegard']
                }),
                q({
                  n: 4, set: 1, local: 4,
                  text: 'Kva skjedde med borgstova då det nye tunet vart etablert?',
                  options: ['Ho vart flytta frå den gamle prestegarden og sett opp som tilbygg', 'Ho vart riven og erstatta av ein kopi i betong', 'Ho vart ståande ved elva utan samband med det nye tunet'],
                  answer: 'Ho vart flytta frå den gamle prestegarden og sett opp som tilbygg',
                  knowledge: 'Borgstova vart teken med frå den eldre prestegarden og knytt fysisk til hovudbygningen frå 1871.',
                  type: 'fact', difficulty: 1,
                  emne: 'em_his_spor_materialitet', method: 'met_sporlesning',
                  concepts: ['flytta bygning', 'tilbygg', 'bygningshistorie'], tags: ['flytting', 'gjenbruk'],
                  claim: 'Dokumentasjonen skildrar borgstova som flytta frå den gamle staden og sett opp som tilbygg.',
                  sources: ['etne_kommune_prestegard']
                }),
                q({
                  n: 5, set: 1, local: 5,
                  text: 'Kvifor vart den nye hovudbygningen lagd lenger frå elva?',
                  options: ['På grunn av flaumfare', 'For å kome nærare sjøen', 'Fordi kyrkja vart flytta samtidig'],
                  answer: 'På grunn av flaumfare',
                  knowledge: 'Flaumfare ved den eldre tunplassen var grunnen til at hovudbygningen frå 1871 vart reist lenger frå elva.',
                  type: 'fact', difficulty: 1,
                  emne: 'em_his_landskap_makt_identitet', method: 'met_arsak_virkning',
                  concepts: ['flaumfare', 'tunflytting', 'landskapstilpassing'], tags: ['flaum', 'plassering'],
                  claim: 'Kulturmiljøplanen knyter flyttinga av tunplassen direkte til flaumfare.',
                  sources: ['etne_kommune_prestegard']
                })
              ]
            },
            {
              set_id: `historie_${targetId}_set_2`, level: 2, order: 2, xp: 50,
              title: 'Driftsbygningar, freding og fleiraldra tun',
              questions: [
                q({
                  n: 6, set: 2, local: 1,
                  text: 'Kva to driftsbygningar er dokumenterte som eldre enn 1870?',
                  options: ['Eldhus og stabbur', 'Garasje og verkstad', 'Skulehus og rådhus'],
                  answer: 'Eldhus og stabbur',
                  knowledge: 'Eldhuset og stabburet er frå før 1870 og høyrer til dei eldre bygningane i tunet.',
                  type: 'fact', difficulty: 2,
                  emne: 'em_his_hverdagsliv_praksiser', method: 'met_sporlesning',
                  concepts: ['eldhus', 'stabbur', 'driftsbygningar'], tags: ['uthus', 'for_1870'],
                  claim: 'Stedsposten og kulturmiljøplanen daterer eldhus og stabbur til før 1870.',
                  sources: ['etne_kommune_prestegard', 'riksantikvaren_prestegard']
                }),
                q({
                  n: 7, set: 2, local: 2,
                  text: 'Kva annan driftsbygning inngår i det freda tunet?',
                  options: ['Ved- og vognskjul', 'Lokomotivstall', 'Fiskefabrikk'],
                  answer: 'Ved- og vognskjul',
                  knowledge: 'Ved- og vognskjulet viser lagring, transport og praktisk drift ved prestegarden.',
                  type: 'fact', difficulty: 2,
                  emne: 'em_his_hverdagsliv_praksiser', method: 'met_sporlesning',
                  concepts: ['vedskjul', 'vognskjul', 'gardsdrift'], tags: ['driftsbygning', 'arbeid'],
                  claim: 'Ved- og vognskjul er dokumentert som del av det verna bygningsmiljøet.',
                  sources: ['etne_kommune_prestegard', 'riksantikvaren_prestegard']
                }),
                q({
                  n: 8, set: 2, local: 3,
                  text: 'Kor mange bygningar vart freda, og når?',
                  options: ['Fem bygningar i 1991', 'To bygningar i 1871', 'Ti bygningar i 2011'],
                  answer: 'Fem bygningar i 1991',
                  knowledge: 'Fem bygningar i prestegardstunet vart freda i 1991 som eit samla kulturhistorisk miljø.',
                  type: 'fact', difficulty: 2,
                  emne: 'em_his_kulturminner_bevaring', method: 'met_periodisering',
                  concepts: ['freding', '1991', 'fem bygningar'], tags: ['fredning', 'arstal'],
                  claim: 'Kjeldene oppgir freding av fem bygningar i 1991.',
                  sources: ['etne_kommune_prestegard', 'riksantikvaren_prestegard']
                }),
                q({
                  n: 9, set: 2, local: 4,
                  text: 'Korleis viser flyttinga i 1871 ei tilpassing til landskapet?',
                  options: ['Tunet vart flytta bort frå den mest flaumutsette plasseringa', 'Alle bygningane vart lagde nærare elveløpet', 'Flaumfaren vart ignorert fordi tunet var freda'],
                  answer: 'Tunet vart flytta bort frå den mest flaumutsette plasseringa',
                  knowledge: 'Flyttinga var ei praktisk respons på naturfare. Ho endra tunplassen, men ikkje prestegarden sin institusjonelle funksjon.',
                  type: 'analysis', difficulty: 2,
                  emne: 'em_his_landskap_makt_identitet', method: 'met_arsak_virkning',
                  concepts: ['klimatilpassing', 'naturfare', 'tunplassering'], tags: ['analyse', 'flaumhistorie'],
                  claim: 'Samanhengen mellom flaumfare og ny plassering dokumenterer ei historisk landskapstilpassing.',
                  sources: ['etne_kommune_prestegard']
                }),
                q({
                  n: 10, set: 2, local: 5,
                  text: 'Kvifor er det feil å omtale alle bygningane som oppførte i 1871?',
                  options: ['Tunet inneheld både eldre, flytta og seinare bygningar', '1871 er berre adressen til eigedomen', 'Alle bygningane er moderne kopiar'],
                  answer: 'Tunet inneheld både eldre, flytta og seinare bygningar',
                  knowledge: 'Hovudbygningen er frå 1871, borgstova blir knytt til 1600-talet, og fleire uthus er eldre enn 1870. Tunet er fleiraldra.',
                  type: 'analysis', difficulty: 2,
                  emne: 'em_his_kildekritikk_arkiv_spor', method: 'met_periodisering',
                  concepts: ['fleiraldra bygningsmiljø', 'periodisering', 'bygningslag'], tags: ['analyse', 'fleire_periodar'],
                  claim: 'Dei dokumenterte bygningsdateringane viser at tunet ikkje har éin felles byggjedato.',
                  sources: ['etne_kommune_prestegard', 'riksantikvaren_prestegard']
                })
              ]
            },
            {
              set_id: `historie_${targetId}_set_3`, level: 3, order: 3, xp: 50,
              title: 'Embetsgard, gjenbruk og samla vern',
              questions: [
                q({
                  n: 11, set: 3, local: 1,
                  text: 'Kva viser eldhus, stabbur og vognskjul om prestegarden?',
                  options: ['Han var også eit arbeidande driftsmiljø', 'Han var berre ein representativ bustad utan praktisk drift', 'Han vart brukt som fabrikk for eksport'],
                  answer: 'Han var også eit arbeidande driftsmiljø',
                  knowledge: 'Uthusa viser matlaging, lagring, brensel, transport og dagleg arbeid. Prestegarden var både bustad, embetsstad og gard.',
                  type: 'analysis', difficulty: 3,
                  emne: 'em_his_hverdagsliv_praksiser', method: 'met_sporlesning',
                  concepts: ['driftsmiljø', 'arbeidsliv', 'tunfunksjon'], tags: ['analyse', 'hverdagsliv'],
                  claim: 'Bygningssamansetjinga dokumenterer praktiske funksjonar utover representasjonsbustaden.',
                  sources: ['etne_kommune_prestegard', 'riksantikvaren_prestegard']
                }),
                q({
                  n: 12, set: 3, local: 2,
                  text: 'Kva betyr «embetsgard» ved Etne prestebustad?',
                  options: ['Ein gard knytt til bustad, arbeid og rolle for ein offentleg embetsperson', 'Ein gard utan bustad eller offentleg funksjon', 'Eit mellomalderfort med militær garnison'],
                  answer: 'Ein gard knytt til bustad, arbeid og rolle for ein offentleg embetsperson',
                  knowledge: 'Ein embetsgard kombinerte bustad og arbeidsstad for ein embetsperson med praktisk gardsdrift og representasjon.',
                  type: 'concept', difficulty: 2,
                  emne: 'em_his_landskap_makt_identitet', method: 'met_sporlesning',
                  concepts: ['embetsgard', 'prest', 'institusjonell bustad'], focus: ['embetsgard'], tags: ['begrep', 'embetsstand'],
                  claim: 'Etne prestegard kombinerte prestebustad, embetsfunksjon og driftsmiljø.',
                  sources: ['etne_kommune_prestegard', 'riksantikvaren_prestegard']
                }),
                q({
                  n: 13, set: 3, local: 3,
                  text: 'Kva betyr «bygningsgjenbruk» i historia til borgstova?',
                  options: ['At eit eldre hus vart flytta og fekk plass i det nye tunet', 'At bygningen vart kopiert utan å flyttast', 'At berre namnet vart teke med til ny stad'],
                  answer: 'At eit eldre hus vart flytta og fekk plass i det nye tunet',
                  knowledge: 'Bygningsgjenbruk bevarer materiale og historiske lag ved å gi ein eldre bygning ein ny plass eller funksjon.',
                  type: 'concept', difficulty: 2,
                  emne: 'em_his_kulturminner_bevaring', method: 'met_sporlesning',
                  concepts: ['bygningsgjenbruk', 'flytting', 'historisk kontinuitet'], focus: ['bygningsgjenbruk'], tags: ['begrep', 'borgstove'],
                  claim: 'Den eldre borgstova vart fysisk flytta og innlemma i det nye 1871-tunet.',
                  sources: ['etne_kommune_prestegard']
                }),
                q({
                  n: 14, set: 3, local: 4,
                  text: 'Kva betyr det å frede prestegarden som eit samla bygningsmiljø?',
                  options: ['At samanhengen mellom fleire bygningar og tunfunksjonar blir verna', 'At berre hovudbygningen tel, medan uthusa er utan verdi', 'At alle bygningane må førast tilbake til same byggjeår'],
                  answer: 'At samanhengen mellom fleire bygningar og tunfunksjonar blir verna',
                  knowledge: 'Eit samla vern tek vare på relasjonane mellom hovudhus, eldre borgstove, uthus og tunstruktur, ikkje berre eitt enkelt bygg.',
                  type: 'concept', difficulty: 3,
                  emne: 'em_his_kulturminner_bevaring', method: 'met_kildekritikk',
                  concepts: ['samla bygningsmiljø', 'freding', 'tunstruktur'], focus: ['samla bygningsmiljø'], tags: ['begrep', 'kulturminnevern'],
                  claim: 'Fredinga omfattar fem bygningar og vernar prestegarden som eit samansett kulturmiljø.',
                  sources: ['etne_kommune_prestegard', 'riksantikvaren_prestegard']
                })
              ]
            }
          ];

          const quiz = {
            targetId,
            categoryId: 'historie',
            generator_version: 'quiz_standard_canonical_v2_manual_source_based_source_sized',
            generated_from: [
              'data/places/historie/vestland/etne/etne_prestebustad.json',
              'data/stories/stories_etne_historie_rounds_batch6.json',
              'data/quiz/regler/QUIZ_STANDARD_CANONICAL_V2.md'
            ],
            sources: {
              etne_kommune_prestegard: 'https://www.etne.kommune.no/organisasjon/planar-og-strategiar/kommunedelplan-for-kulturmiljo-2022-2026/kulturmiljoplan/del-2-kunnskapsgrunnlaget/',
              riksantikvaren_prestegard: 'https://riksantikvaren.no/etne-prestegard-klage-pa-avslag-pa-soknad-om-dispensasjon-til-montering-av-elektronisk-lassystem-kulturminneloven-15-a/'
            },
            profile_snapshot: {
              place_type: 'prestegard',
              subtype: 'fredet_embetsgardstun_med_bygninger_fra_1600_og_1800_tallet',
              signature_features: [
                'hovudbygning frå 1871 i enkel sveitsarstil',
                'eldre borgstove flytta frå den gamle prestegarden',
                'eldhus, stabbur og ved- og vognskjul som driftsmiljø',
                'fem bygningar freda i 1991'
              ],
              primary_angles: ['embetsgard', 'byggehistorie', 'flaumtilpassing', 'kulturminnevern'],
              avoid_angles: [
                'framstille alle bygningane som frå 1871',
                'gjere borgstova si 1600-talsdatering sikrare enn kjelda',
                'redusere prestegarden til berre representasjonsbustad'
              ]
            },
            sets
          };

          fs.mkdirSync('data/quiz/historie', { recursive: true });
          fs.writeFileSync(quizPath, JSON.stringify(quiz, null, 2) + '\n');

          const manifestPath = 'data/quiz/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.sets = manifest.sets.filter(entry => entry.targetId !== targetId);
          manifest.sets.push({ targetId, file: quizPath });
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Validate source-sized contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const targetId = 'etne_prestebustad';
          const data = JSON.parse(fs.readFileSync(`data/quiz/historie/${targetId}_sets.json`, 'utf8'));
          const qs = data.sets.flatMap(set => set.questions);
          const counts = {
            total: qs.length,
            concrete: qs.filter(q => ['fact', 'observation'].includes(q.question_type)).length,
            context: qs.filter(q => ['analysis', 'context', 'comparison'].includes(q.question_type)).length,
            concept: qs.filter(q => q.question_type === 'concept').length
          };
          const expected = { total: 14, concrete: 8, context: 3, concept: 3 };
          if (JSON.stringify(counts) !== JSON.stringify(expected)) throw new Error(`${JSON.stringify(counts)} != ${JSON.stringify(expected)}`);
          const sizes = data.sets.map(set => set.questions.length);
          if (JSON.stringify(sizes) !== JSON.stringify([5,5,4])) throw new Error(`Invalid set sizes: ${sizes}`);
          for (const question of qs) {
            if (question.targetId !== targetId || question.placeId !== targetId || question.question_scope !== 'place') throw new Error(`${question.id}: invalid target contract`);
            if (!question.options.includes(question.answer) || question.options[question.answerIndex] !== question.answer) throw new Error(`${question.id}: invalid answer contract`);
          }
          NODE

      - name: Build canonical Knowledge links
        run: npm run knowledge:canonical:write

      - name: Run quiz and Knowledge validation
        run: |
          npm run audit:quiz-content
          npm run audit:quiz-templates
          npm run test:quiz-content-audit
          npm run knowledge:canonical:check

      - name: Remove temporary files
        run: |
          rm -f .github/workflows/build-etne-prestebustad-source-sized-quiz.yml
          rm -f .tmp/trigger-etne-prestebustad-source-sized-quiz.txt

      - name: Commit final Etne prestebustad package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add source-sized Etne prestebustad quiz"
          git push
