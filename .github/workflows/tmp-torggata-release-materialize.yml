name: Torggata release materialize

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/tmp-torggata-release-materialize.yml'
      - 'data/fag/**'
      - 'data/fagverk/**'

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Materialize composed Natur registry
        run: node scripts/materialize-natur-final-registry.mjs
      - name: Build exact release
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Upload exact release
        uses: actions/upload-artifact@v4
        with:
          name: torggata-fagverk-release-materialized
          path: data/fagverk/fagverk_release.json
          if-no-files-found: error
          retention-days: 1
