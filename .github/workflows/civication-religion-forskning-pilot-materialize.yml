name: Civication Religion forskning pilot cleanup

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: civication-religion-forskning-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/civication-religion-forskning-pilot-playable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore minimal manifest delta
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=0325e7221701fcf43983010c8fa22bdcf69591f3
          git show "$BASE_SHA:data/Civication/roleModels/manifest.json" > data/Civication/roleModels/manifest.json
          node - <<'NODE'
          const fs = require('fs');
          const p = 'data/Civication/roleModels/manifest.json';
          const target = 'data/Civication/roleModels/religion/religion_forskning.json';
          const manifest = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (!Array.isArray(manifest.files)) throw new Error('roleModels manifest has no files array');
          if (!manifest.files.includes(target)) manifest.files.push(target);
          fs.writeFileSync(p, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Remove temporary materializer infrastructure
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/civication-religion-forskning-pilot-materialize.yml \
            scripts/materialize-civication-religion-forskning-pilot.mjs \
            scripts/register-civication-religion-forskning-role-model.mjs \
            scripts/register-civication-religion-forskning-model.mjs

      - name: Regenerate audit and verify permanent Religion pilot
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-civication-career-gameplay.mjs
          node scripts/generate-civication-scene-registry-v1.mjs --check
          node tests/civication-religion-forskning-playability.test.js
          node tests/civication-mail-choice-uniqueness.test.js
          node tests/civication-produksjonsassistent-playability.test.js
          node tests/civication-avdelingsleder-playability.test.js
          node tests/civication-role-world-contract.test.js
          git diff --check

      - name: Commit clean permanent outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Religion forskning pilot already clean; nothing to commit."
            exit 0
          fi
          git commit -m "Finalize Religion forskning knowledge-work pilot"
          git push origin HEAD:${{ github.head_ref }}
