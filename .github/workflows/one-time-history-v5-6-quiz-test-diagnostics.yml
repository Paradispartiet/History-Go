name: One-time History V5.6 quiz test diagnostics

on:
  push:
    branches:
      - agent/history-v5-6-prehistory-archaeology
    paths:
      - '.github/workflows/one-time-history-v5-6-quiz-test-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/history-v5-6-prehistory-archaeology

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run quiz tests separately
        shell: bash
        run: |
          mkdir -p reports/historie-v5
          set +e
          npm run test:quiz-content-audit 2>&1 \
            | tee reports/historie-v5/historie-v5-6-quiz-content-test.log
          content_status=${PIPESTATUS[0]}
          npm run test:quiz-production 2>&1 \
            | tee reports/historie-v5/historie-v5-6-quiz-production-test.log
          production_status=${PIPESTATUS[0]}
          printf 'quiz-content=%s\nquiz-production=%s\n' \
            "$content_status" "$production_status" \
            | tee reports/historie-v5/historie-v5-6-quiz-test-status.log
          exit $((content_status || production_status))

      - name: Upload quiz test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-v5-6-quiz-test-diagnostics
          path: reports/historie-v5/historie-v5-6-quiz-*-test*.log
          if-no-files-found: error
