name: One-time Oslo popup batch 24 psychology closure writer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/oslo-popup-batch-24-psychology-trigger.txt

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Batch 24 branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-popup-v4-batch-24-finish-psychology
          fetch-depth: 0

      - name: Apply isolated desc and popupDesc patch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const patch = JSON.parse(fs.readFileSync('.github/oslo-popup-batch-24-psychology-patch.json', 'utf8'));
          const words = text => (String(text).match(/[\p{L}\p{N}]+(?:[’'\-][\p{L}\p{N}]+)*/gu) || []).length;
          const paragraphs = text => String(text).trim().split(/\n\s*\n/).filter(Boolean).length;
          const withoutText = value => {
            const copy = JSON.parse(JSON.stringify(value));
            delete copy.desc;
            delete copy.popupDesc;
            return copy;
          };

          for (const item of patch.places) {
            const before = JSON.parse(fs.readFileSync(item.path, 'utf8'));
            if (before.id !== item.id) throw new Error(`ID mismatch for ${item.path}`);
            const after = { ...before, desc: item.desc, popupDesc: item.popupDesc };
            if (JSON.stringify(withoutText(before)) !== JSON.stringify(withoutText(after))) {
              throw new Error(`Non-text parity failed for ${item.id}`);
            }
            const descWords = words(after.desc);
            const popupWords = words(after.popupDesc);
            const paraCount = paragraphs(after.popupDesc);
            if (descWords < 40 || descWords > 80) throw new Error(`desc words ${descWords}`);
            if (popupWords < 300 || popupWords > 600) throw new Error(`popup words ${popupWords}`);
            if (paraCount !== 6) throw new Error(`paragraphs ${paraCount}`);
            fs.writeFileSync(item.path, JSON.stringify(after, null, 2) + '\n');
          }

          const protocolPath = 'reports/place-description-revision-protocol.md';
          let protocol = fs.readFileSync(protocolPath, 'utf8');
          const row = '| 200 | Psykologisk institutt, UiO | `psykologisk_institutt_uio` | 48 | 311 | 6 | #4261 |';
          if (!protocol.includes(row)) {
            protocol = protocol
              .replace('Ferdige etter alle mergede revisjonsbatcher: **199 steder**', 'Ferdige etter alle mergede revisjonsbatcher: **200 steder**')
              .replace('Gjenstår: **313 steder**', 'Gjenstår: **312 steder**')
              .replace('\n## Gjenstående Oslo-kø', `\n\n${row}\n\n## Gjenstående Oslo-kø`)
              .replace('- psykologi: **1**\n', '')
              .replace('| Oslo V4 batch 23 | 5 | #4257 – fullførte hele Oslo-køen for fagområdet musikk |', '| Oslo V4 batch 23 | 5 | #4257 – fullførte hele Oslo-køen for fagområdet musikk |\n| Oslo V4 batch 24 | 1 | #4261 – fullførte hele Oslo-køen for fagområdet psykologi |');
          }
          fs.writeFileSync(protocolPath, protocol);
          NODE

          node tools/audit-oslo-place-description-scope.mjs --write

          node <<'NODE'
          const fs = require('fs');
          const protocol = fs.readFileSync('reports/place-description-revision-protocol.md', 'utf8');
          const audit = fs.readFileSync('reports/oslo-place-description-scope-audit-2026-07-26.md', 'utf8');
          if (!protocol.includes('Ferdige etter alle mergede revisjonsbatcher: **200 steder**')) throw new Error('protocol total');
          if (!protocol.includes('Gjenstår: **312 steder**')) throw new Error('protocol remaining');
          if (!protocol.includes('| 200 | Psykologisk institutt, UiO | `psykologisk_institutt_uio` | 48 | 311 | 6 | #4261 |')) throw new Error('protocol row');
          if (protocol.includes('- psykologi: **1**')) throw new Error('psychology remains in protocol');
          if (!audit.includes('IDs in the current revision protocol: **200**')) throw new Error('audit protocol count');
          if (!audit.includes('Additional active Oslo IDs outside the protocol: **312**')) throw new Error('audit remaining count');
          if (audit.includes('| psykologi |')) throw new Error('psychology remains in audit');
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/places/psykologi/oslo/places_psykologi/psykologisk_institutt_uio.json \
            reports/oslo-place-description-scope-audit-2026-07-26.json \
            reports/oslo-place-description-scope-audit-2026-07-26.md \
            reports/place-description-revision-protocol.md
          if git diff --cached --quiet; then
            echo "No material changes to commit"
          else
            git commit -m "Complete Oslo psychology description revision"
            git push origin HEAD:agent/oslo-popup-v4-batch-24-finish-psychology
          fi
