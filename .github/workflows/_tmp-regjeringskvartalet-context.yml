name: Temporary Regjeringskvartalet context sync

on:
  push:
    branches:
      - production/regjeringskvartalet-phase-4-before-after
    paths:
      - '.github/workflows/_tmp-regjeringskvartalet-context.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: production/regjeringskvartalet-phase-4-before-after
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild deterministic context and remove bootstrap workflow
        run: |
          node scripts/build-quiz-production-context.mjs \
            --category politikk \
            --target regjeringskvartalet \
            --output data/quiz/production_context/politikk/regjeringskvartalet.json
          rm .github/workflows/_tmp-regjeringskvartalet-context.yml

      - name: Commit generated artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz/production_context/politikk/regjeringskvartalet.json .github/workflows/_tmp-regjeringskvartalet-context.yml
          git diff --cached --quiet && exit 0
          git commit -m "Synkroniser Regjeringskvartalets quizkontekst"
          git push origin HEAD:production/regjeringskvartalet-phase-4-before-after
