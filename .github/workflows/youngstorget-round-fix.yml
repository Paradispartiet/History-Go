name: Youngstorget round fix

on:
  push:
    paths:
      - ".github/workflows/youngstorget-round-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace nature with tasks for Youngstorget
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/places/politikk/oslo/places_politikk/youngstorget.json';
          const place = JSON.parse(fs.readFileSync(path, 'utf8'));

          if (place.id !== 'youngstorget') throw new Error('Wrong place file');

          delete place.nature_profile;
          place.rounds = [
            'people', 'works', 'badges',
            'før_nå', 'civication', 'brands',
            'tasks', 'fortellinger', 'leksikon'
          ];
          place.tasks_profile = {
            title: 'Les Youngstorget som politisk rom',
            summary: 'Tre konkrete oppgaver som bruker torgets fysiske spor til å forstå markedshistorie, arbeiderbevegelse og offentlig mobilisering.',
            tasks: [
              {
                id: 'youngstorget_finn_talerstolen',
                title: 'Finn talerstolen',
                instruction: 'Finn basararkaden mot Møllergata og pek ut balkongpartiet som brukes som talerstol mot torget.',
                why: 'Arkitekturen viser hvordan et tidligere markedstorg også ble en scene for appeller og politiske samlinger.'
              },
              {
                id: 'youngstorget_sammenlign_monumentene',
                title: 'Sammenlign monumentene',
                instruction: 'Finn Pioneren og Fredsmonumentet. Beskriv forskjellen mellom arbeiderfiguren i bronse og fredsbudskapet i granitt.',
                why: 'De to monumentene gjør ulike sider av organisert politisk kamp synlige i samme byrom.'
              },
              {
                id: 'youngstorget_les_forsamlingsrommet',
                title: 'Les forsamlingsrommet',
                instruction: 'Still deg slik at du ser torget, Folkets Hus og basararkaden samtidig. Vurder hvor en taler, en folkemengde og medier naturlig plasserer seg.',
                why: 'Oppgaven viser hvordan plassens form støtter mobilisering, synlighet og offentlig debatt.'
              }
            ]
          };

          if (place.rounds.length !== 9 || new Set(place.rounds).size !== 9) {
            throw new Error('Youngstorget must have nine unique round ids');
          }
          if (place.rounds.includes('nature') || !place.rounds.includes('tasks')) {
            throw new Error('Round replacement failed');
          }
          if (!Array.isArray(place.tasks_profile.tasks) || place.tasks_profile.tasks.length !== 3) {
            throw new Error('Tasks profile malformed');
          }

          fs.writeFileSync(path, JSON.stringify(place, null, 2) + '\n');
          NODE

          rm .github/workflows/youngstorget-round-fix.yml

          git config user.name "history-go-data-bot"
          git config user.email "history-go-data-bot@users.noreply.github.com"
          git add data/places/politikk/oslo/places_politikk/youngstorget.json .github/workflows/youngstorget-round-fix.yml
          git commit -m "Replace Youngstorget nature round with tasks"
          git push
