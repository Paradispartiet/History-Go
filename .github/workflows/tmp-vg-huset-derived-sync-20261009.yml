name: Temporary VG-huset derived sync
on:
  push:
    branches:
      - agent/vg-huset-source-preflight-20261009
    paths:
      - .github/workflows/tmp-vg-huset-derived-sync-20261009.yml

permissions:
  contents: write

jobs:
  build:
    name: Rebuild exact VG-huset-derived artifacts after image import
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Materialize canonical derived files
        shell: bash
        run: |
          set -euo pipefail
          npm run places:index:build
          npm run place-open:build
          node scripts/build-fagverk-release-manifest.mjs
          npm run epoker:places:build
          node scripts/audit-fagverk-place-pages.mjs --write
          echo 'Derived changes:'
          git status --short
      - name: Strict expected-only diff and commit
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              data/places/places_index.json|data/runtime/place-open/vg_huset.json|data/fagverk/fagverk_release.json|data/epoker/epoke-place-index.json|reports/fagverk/fagverk-place-page-coverage-v2.json)
                echo "ALLOW $file" ;;
              *)
                echo "::error::Unexpected generated change: $file"
                exit 1 ;;
            esac
          done < <(git diff --name-only)
          test -z "$(git ls-files --others --exclude-standard)"
          git add -- data/places/places_index.json data/runtime/place-open/vg_huset.json data/fagverk/fagverk_release.json data/epoker/epoke-place-index.json reports/fagverk/fagverk-place-page-coverage-v2.json
          if git diff --cached --quiet; then
            echo 'No derived files changed.'
            exit 0
          fi
          git config user.name 'history-go-sync-bot'
          git config user.email 'history-go-sync-bot@users.noreply.github.com'
          git commit -m 'build(place): sync VG-huset media and Fagverk projections'
          git push origin HEAD:agent/vg-huset-source-preflight-20261009
