name: Refresh Fagverk subject baseline

on:
  push:
    branches:
      - agent/fagverk-subject-baseline-refresh-20260819

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fagverk-subject-baseline-refresh-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh canonical subject baseline
        run: |
          set -euo pipefail
          node scripts/audit-fagverk-subject-inventory.mjs --write-report
          node scripts/audit-fagverk-subject-inventory.mjs
          git diff --check
      - name: Commit refreshed baseline
        run: |
          set -euo pipefail
          if git diff --quiet -- reports/fagverk/subject-baseline.json; then
            echo 'Baseline already current'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/fagverk/subject-baseline.json
          git commit -m 'Refresh Fagverk subject baseline'
          git push origin HEAD:agent/fagverk-subject-baseline-refresh-20260819
