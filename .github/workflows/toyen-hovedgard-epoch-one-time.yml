name: Tøyen hovedgård – one-time epoch index materialization
on:
  push:
    branches: [content/toyen-hovedgard-personer-hendelser-20261110]
    paths:
      - '.github/workflows/toyen-hovedgard-epoch-one-time.yml'
permissions:
  contents: write
concurrency:
  group: toyen-hovedgard-epoch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/toyen-hovedgard-personer-hendelser-20261110
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build only source-backed epoch index
        run: node scripts/build-epoke-place-index.mjs
      - name: Commit only the synchronized index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/epoker/epoke-place-index.json
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "build(toyen-hovedgard): synchronize source-backed epoch place index"
            git push origin HEAD:content/toyen-hovedgard-personer-hendelser-20261110
          fi
