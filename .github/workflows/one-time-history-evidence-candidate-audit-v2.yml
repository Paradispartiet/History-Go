name: One-time History evidence candidate audit V2

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-history-evidence-candidate-audit-v2.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/history-evidence-candidate-audit-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build candidate audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/historie-profile-evidence/candidate-audit-v2
          node <<'NODE' 2>&1 | tee reports/historie-profile-evidence/candidate-audit-v2/audit-command.log
          const fs = require('fs');
          const path = require('path');

          const root = process.cwd();
          const reportDir = path.join(root, 'reports/historie-profile-evidence/candidate-audit-v2');
          const profilePath = path.join(root, 'data/fag/profiles/historie/oslo_akershus/profile.json');
          const profile = JSON.parse(fs.readFileSync(profilePath, 'utf8'));

          const normalize = (value) => String(value ?? '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .replace(/æ/g, 'ae')
            .replace(/ø/g, 'o')
            .replace(/å/g, 'a')
            .replace(/[^a-z0-9]+/g, '_')
            .replace(/^_+|_+$/g, '');

          const sourceKey = /(source|sources|external.?links?|reference|references|bibliography|url|links?)/i;
          const richKey = /(fact|facts|chronology|timeline|history|historie|description|popupDesc|sections|underpunkter|contributions)/i;
          const imageUrl = /\.(?:png|jpe?g|gif|webp|svg)(?:\?|$)/i;
          const excludedUrl = /(images\.unsplash\.com|upload\.wikimedia\.org|commons\.wikimedia\.org\/wiki\/Special:FilePath)/i;

          function listJsonFiles(dir, out = []) {
            if (!fs.existsSync(dir)) return out;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name.startsWith('.')) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) listJsonFiles(full, out);
              else if (entry.isFile() && entry.name.endsWith('.json')) out.push(full);
            }
            return out;
          }

          function collectUrls(value, keyPath = [], out = []) {
            if (typeof value === 'string') {
              if (/^https?:\/\//i.test(value) && !imageUrl.test(value) && !excludedUrl.test(value)) {
                const context = keyPath.join('.');
                if (sourceKey.test(context) || !/image|photo|card|thumbnail|media/i.test(context)) out.push(value);
              }
              return out;
            }
            if (Array.isArray(value)) {
              value.forEach((item, index) => collectUrls(item, [...keyPath, String(index)], out));
              return out;
            }
            if (value && typeof value === 'object') {
              for (const [key, child] of Object.entries(value)) collectUrls(child, [...keyPath, key], out);
            }
            return out;
          }

          function richness(value) {
            let score = 0;
            function visit(node, key = '') {
              if (Array.isArray(node)) {
                if (richKey.test(key)) score += Math.min(node.length, 8);
                node.forEach((item) => visit(item, key));
              } else if (node && typeof node === 'object') {
                for (const [childKey, child] of Object.entries(node)) {
                  if (richKey.test(childKey)) score += 1;
                  visit(child, childKey);
                }
              } else if (typeof node === 'string' && richKey.test(key) && node.length >= 80) {
                score += 1;
              }
            }
            visit(value);
            return score;
          }

          function collectYears(value, out = []) {
            if (typeof value === 'number' && value >= 800 && value <= 2100) out.push(value);
            else if (typeof value === 'string') {
              for (const match of value.matchAll(/\b(1[0-9]{3}|20[0-9]{2}|9[0-9]{2}|8[0-9]{2})\b/g)) {
                const year = Number(match[1]);
                if (year >= 800 && year <= 2100) out.push(year);
              }
            } else if (Array.isArray(value)) value.forEach((item) => collectYears(item, out));
            else if (value && typeof value === 'object') Object.values(value).forEach((item) => collectYears(item, out));
            return out;
          }

          function collectNamedObjects(value, file, objectPath = '$', out = []) {
            if (Array.isArray(value)) {
              value.forEach((item, index) => collectNamedObjects(item, file, `${objectPath}[${index}]`, out));
              return out;
            }
            if (!value || typeof value !== 'object') return out;
            const ids = ['id', 'place_id', 'placeId', 'slug', 'key'].map((key) => value[key]).filter((v) => typeof v === 'string');
            const names = ['name', 'title', 'label', 'displayName'].map((key) => value[key]).filter((v) => typeof v === 'string');
            if (ids.length || names.length) {
              const urls = [...new Set(collectUrls(value))];
              const years = collectYears(value);
              out.push({
                file: path.relative(root, file).split(path.sep).join('/'),
                object_path: objectPath,
                ids,
                names,
                normalized_ids: ids.map(normalize),
                normalized_names: names.map(normalize),
                urls,
                richness: richness(value),
                years,
                in_places: file.includes(`${path.sep}data${path.sep}places${path.sep}`),
                in_leksikon: file.includes(`${path.sep}data${path.sep}leksikon${path.sep}`),
                in_coordinate_evidence: file.includes(`${path.sep}data${path.sep}coordinate-evidence${path.sep}`),
                in_people: file.includes(`${path.sep}data${path.sep}people${path.sep}`),
                in_stories: file.includes(`${path.sep}data${path.sep}stories${path.sep}`),
              });
            }
            for (const [key, child] of Object.entries(value)) collectNamedObjects(child, file, `${objectPath}.${key}`, out);
            return out;
          }

          const roots = [
            'data/places',
            'data/leksikon',
            'data/coordinate-evidence',
            'data/people',
            'data/stories',
          ];
          const files = roots.flatMap((dir) => listJsonFiles(path.join(root, dir)));
          const records = [];
          const parseFailures = [];
          for (const file of files) {
            try {
              collectNamedObjects(JSON.parse(fs.readFileSync(file, 'utf8')), file, '$', records);
            } catch (error) {
              parseFailures.push({file: path.relative(root, file), error: String(error.message || error)});
            }
          }

          function periodFromYears(years) {
            const usable = years.filter((year) => year >= 800 && year <= 2026).sort((a, b) => a - b);
            if (!usable.length) return 'unknown';
            const year = usable[0];
            if (year < 1500) return 'medieval';
            if (year < 1800) return 'early_modern';
            if (year < 1914) return 'long_nineteenth_century';
            if (year < 1945) return 'world_wars_and_interwar';
            if (year < 1990) return 'postwar';
            return 'contemporary';
          }

          function themeFromEmner(emneIds) {
            const joined = emneIds.join(' ');
            const themes = [
              ['war_state', /(krig|okkupasjon|militaer|statsdannelse|kongemakt|festning)/],
              ['urban_change', /(byhistorie|sanering|byfornyelse|gentrifisering|byrom|arkitektur|riving|ombruk)/],
              ['labour_industry', /(arbeid|industri|klasse|fabrikk|produksjon)/],
              ['politics_institutions', /(politikk|stat_|institusjon|demokrati|forvaltning|rettigheter|bystyre)/],
              ['culture_memory', /(kultur|minne|museum|monument|historiebruk|visuelle|teater)/],
              ['science_knowledge', /(vitenskap|kunnskap|ekspert|teknologi|måling|kart|arkiv)/],
              ['religion_medieval', /(kirke|religion|kristning|middelalder|kloster)/],
              ['environment_landscape', /(miljo|klima|landskap|natur|elv)/],
              ['migration_minorities', /(migrasjon|minorit|sami|urfolk|tilhorighet)/],
            ];
            return themes.find(([, pattern]) => pattern.test(joined))?.[0] ?? 'mixed';
          }

          function scoreRecord(record, caseNorm, labelNorm, tokens) {
            let score = 0;
            const values = [...record.normalized_ids, ...record.normalized_names];
            if (values.includes(caseNorm) || values.includes(labelNorm)) score += 55;
            else if (values.some((value) => value.includes(caseNorm) || caseNorm.includes(value) || value.includes(labelNorm) || labelNorm.includes(value))) score += 35;
            const fileNorm = normalize(record.file);
            const tokenHits = tokens.filter((token) => token.length >= 4 && fileNorm.includes(token)).length;
            score += Math.min(tokenHits * 6, 18);
            if (record.in_places) score += 16;
            if (record.in_leksikon) score += 18;
            if (record.in_coordinate_evidence) score += 8;
            if (record.in_stories) score += 6;
            score += Math.min(record.urls.length * 4, 20);
            score += Math.min(record.richness, 18);
            return score;
          }

          const cases = profile.cases.filter((item) => item.evidence_status !== 'claim_source_linked');
          const candidates = cases.map((item) => {
            const caseNorm = normalize(item.case_id.replace(/^case_his_/, ''));
            const labelNorm = normalize(item.label);
            const tokens = [...new Set(`${caseNorm}_${labelNorm}`.split('_').filter(Boolean))];
            const matches = records
              .map((record) => ({record, score: scoreRecord(record, caseNorm, labelNorm, tokens)}))
              .filter((entry) => entry.score >= 30)
              .sort((a, b) => b.score - a.score || a.record.file.localeCompare(b.record.file))
              .slice(0, 12);
            const urls = [...new Set(matches.flatMap((entry) => entry.record.urls))];
            const placeIds = [...new Set(matches.filter((entry) => entry.record.in_places).flatMap((entry) => entry.record.ids))];
            const years = matches.flatMap((entry) => entry.record.years);
            const repoPaths = [...new Set(matches.map((entry) => entry.record.file))];
            const leksikonMatches = matches.filter((entry) => entry.record.in_leksikon).length;
            const placeMatches = matches.filter((entry) => entry.record.in_places).length;
            const sourceDomains = [...new Set(urls.map((url) => {
              try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return null; }
            }).filter(Boolean))];
            const score = Math.min(100,
              (placeIds.length ? 20 : 0) +
              Math.min(placeMatches * 8, 16) +
              Math.min(leksikonMatches * 12, 24) +
              Math.min(urls.length * 4, 24) +
              Math.min(sourceDomains.length * 4, 12) +
              Math.min(matches.reduce((sum, entry) => sum + entry.record.richness, 0), 20)
            );
            return {
              case_id: item.case_id,
              label: item.label,
              readiness_score: score,
              place_ids: placeIds.slice(0, 8),
              source_urls: urls.slice(0, 12),
              source_domains: sourceDomains.slice(0, 10),
              repository_paths: repoPaths.slice(0, 12),
              match_count: matches.length,
              leksikon_matches: leksikonMatches,
              place_matches: placeMatches,
              period: periodFromYears(years),
              earliest_year: years.length ? Math.min(...years) : null,
              latest_year: years.length ? Math.max(...years) : null,
              dominant_theme: themeFromEmner(item.emne_ids || []),
              emne_count: (item.emne_ids || []).length,
              qualifying: placeIds.length > 0 && (urls.length >= 2 || leksikonMatches > 0),
              top_matches: matches.slice(0, 5).map((entry) => ({
                score: entry.score,
                file: entry.record.file,
                object_path: entry.record.object_path,
                ids: entry.record.ids,
                names: entry.record.names,
                url_count: entry.record.urls.length,
                richness: entry.record.richness,
              })),
            };
          }).sort((a, b) => b.readiness_score - a.readiness_score || a.label.localeCompare(b.label, 'nb'));

          const selected = [];
          const periodCounts = new Map();
          const themeCounts = new Map();
          for (const candidate of candidates) {
            if (!candidate.qualifying || candidate.readiness_score < 48) continue;
            const periodCount = periodCounts.get(candidate.period) || 0;
            const themeCount = themeCounts.get(candidate.dominant_theme) || 0;
            if (periodCount >= 2 || themeCount >= 2) continue;
            selected.push(candidate);
            periodCounts.set(candidate.period, periodCount + 1);
            themeCounts.set(candidate.dominant_theme, themeCount + 1);
            if (selected.length === 9) break;
          }
          if (selected.length < 9) {
            for (const candidate of candidates) {
              if (selected.some((item) => item.case_id === candidate.case_id)) continue;
              if (!candidate.qualifying || candidate.readiness_score < 40) continue;
              selected.push(candidate);
              if (selected.length === 9) break;
            }
          }

          const report = {
            schema_version: '2.0',
            report_id: 'history_oslo_akershus_evidence_candidate_audit_v2',
            repository_head: process.env.GITHUB_SHA || null,
            profile_id: profile.profile_id,
            current_verified_cases: profile.cases.filter((item) => item.evidence_status === 'claim_source_linked').map((item) => item.case_id),
            scanned: {
              json_files: files.length,
              named_records: records.length,
              parse_failures: parseFailures.length,
              profile_cases_considered: cases.length,
            },
            selection_policy: {
              target_cases: 9,
              minimum_readiness_score: 48,
              requires_canonical_place_match: true,
              requires_two_source_urls_or_leksikon_match: true,
              diversity_caps: {max_per_period: 2, max_per_theme: 2},
            },
            recommended_batch: selected,
            candidates,
            parse_failures: parseFailures,
          };

          const markdown = [
            '# Historie — kandidat-audit for Oslo/Akershus-evidens V2',
            '',
            `- Skannede JSON-filer: **${files.length}**`,
            `- Navngitte records: **${records.length}**`,
            `- Profilcaser vurdert: **${cases.length}**`,
            `- Anbefalte caser: **${selected.length}**`,
            '',
            '## Anbefalt batch',
            '',
            '| Case | Score | Periode | Tema | Place-ID-er | Kildedomener |',
            '|---|---:|---|---|---|---|',
            ...selected.map((item) => `| ${item.label} | ${item.readiness_score} | ${item.period} | ${item.dominant_theme} | ${item.place_ids.join(', ') || '—'} | ${item.source_domains.join(', ') || '—'} |`),
            '',
            '## Topp 30 kandidater',
            '',
            '| Case | Score | Kvalifiserer | Periode | Place | Leksikon | URL-er |',
            '|---|---:|---:|---|---:|---:|---:|',
            ...candidates.slice(0, 30).map((item) => `| ${item.label} | ${item.readiness_score} | ${item.qualifying ? 'ja' : 'nei'} | ${item.period} | ${item.place_matches} | ${item.leksikon_matches} | ${item.source_urls.length} |`),
            '',
            'Auditen rangerer eksisterende repositorygrunnlag. Den gjør ingen historiske claims og markerer ingen case som validert.',
            '',
          ].join('\n');

          fs.writeFileSync(path.join(reportDir, 'candidate-audit.json'), `${JSON.stringify(report, null, 2)}\n`);
          fs.writeFileSync(path.join(reportDir, 'candidate-audit.md'), markdown);
          console.log(JSON.stringify({selected: selected.map((item) => item.case_id), scanned: report.scanned}, null, 2));
          NODE

          git diff --check 2>&1 | tee reports/historie-profile-evidence/candidate-audit-v2/git-diff-check.log
          git status --short 2>&1 | tee reports/historie-profile-evidence/candidate-audit-v2/git-status.log

      - name: Publish candidate audit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/historie-profile-evidence/candidate-audit-v2
          git rm .github/workflows/one-time-history-evidence-candidate-audit-v2.yml
          git commit -m 'Kartlegg kandidater for neste Historie-evidensbatch'
          git push origin HEAD:agent/history-evidence-candidate-audit-v2 2>&1 \
            | tee /tmp/history-evidence-candidate-audit-v2-publish.log

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-evidence-candidate-audit-v2
          path: |
            reports/historie-profile-evidence/candidate-audit-v2/**
            /tmp/history-evidence-candidate-audit-v2-publish.log
          if-no-files-found: warn
