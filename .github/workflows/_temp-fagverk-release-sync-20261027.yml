name: Temporary Fagverk release manifest regeneration

on:
  push:
    branches:
      - fix/fagverk-release-main-integrity-20261027
    paths:
      - .github/workflows/_temp-fagverk-release-sync-20261027.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Regenerate canonical Fagverk release manifest
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit only the generated release file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/fagverk/fagverk_release.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate canonical Fagverk release manifest"
            git push origin HEAD:fix/fagverk-release-main-integrity-20261027
          fi
