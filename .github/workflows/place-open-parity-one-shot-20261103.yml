name: Place-open parity on latest main (one-shot)
on:
  push:
    branches:
      - fix/place-open-generated-parity-main-20261103
    paths:
      - reports/maintenance/place-open-parity-trigger-20261103.txt

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/place-open-generated-parity-main-20261103
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Rebuild and check scoped generated place-open data
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run place-open:build
          echo "Generated runtime differences:"
          git status --short -- data/runtime
          git diff --numstat -- data/runtime
          while IFS= read -r file; do
            case "$file" in
              data/runtime/nature-all/flora-001.json|data/runtime/place-open/oslo_prosjektrom.json|data/runtime/place-open/regjeringskvartalet.json)
                ;;
              data/runtime/place-open/toyenbadet.json)
                echo "STOP: generator would replace Tøyenbadet's newly curated live image/Brand fields" >&2
                exit 1
                ;;
              *)
                echo "STOP: unexpected generated output $file" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only -- data/runtime)
          if test -n "$(git ls-files --others --exclude-standard -- data/runtime)"; then
            echo "STOP: unexpected new runtime shard files" >&2
            exit 1
          fi
          npm run place-open:check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/runtime/nature-all/flora-001.json data/runtime/place-open/oslo_prosjektrom.json data/runtime/place-open/regjeringskvartalet.json
          git rm .github/workflows/place-open-parity-one-shot-20261103.yml reports/maintenance/place-open-parity-trigger-20261103.txt
          git diff --cached --check
          git diff --cached --stat
          git commit -m "build(runtime): sync only reproducible canonical place-open outputs"
          git push origin HEAD:refs/heads/fix/place-open-generated-parity-main-20261103
