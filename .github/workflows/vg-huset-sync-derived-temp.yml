name: VG-huset quiz synchronized derived artifacts one-shot
on:
  push:
    branches:
      - agent/vg-huset-quiz-source-revision-20261010
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vg-huset-quiz-source-revision-20261010
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build only canonical derived Knowledge and Fagverk artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm run knowledge:canonical:write
          node scripts/build-fagverk-release-manifest.mjs
          npm run knowledge:canonical:check
          node scripts/build-fagverk-release-manifest.mjs --check
          node scripts/build-quiz-production-context.mjs --category media --target vg_huset --output data/quiz/production_context/media/vg_huset.json --check
      - name: Test quiz and knowledge quality gates
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run audit:quiz-content
          npm run audit:quiz-templates
          npm run test:quiz-production
          npm run test:quiz-content-audit
      - name: Verify diff restricted to canonical derived files
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/vg-quiz-sync
          cat /tmp/vg-quiz-sync
          node <<'NODE'
          const fs=require("node:fs");
          const paths=fs.readFileSync("/tmp/vg-quiz-sync","utf8").trim().split("\n").filter(Boolean);
          const allowed=new Set(["data/quiz/media/vg_huset_sets.json","data/knowledge/knowledge_units.generated.json","reports/knowledge-id-backfill.json","data/fagverk/fagverk_release.json","reports/knowledge-contract-audit.json","reports/knowledge-link-audit.json"]);
          const bad=paths.filter(x=>!allowed.has(x));
          if(bad.length)throw Error("Unexpected derived mutation: "+bad.join(", "));
          if(!paths.includes("data/fagverk/fagverk_release.json"))throw Error("Missing new Fagverk release");
          NODE
      - name: Commit generated files and retire temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz/media/vg_huset_sets.json data/knowledge/knowledge_units.generated.json reports/knowledge-id-backfill.json data/fagverk/fagverk_release.json
          git rm .github/workflows/vg-huset-sync-derived-temp.yml
          git diff --cached --stat
          git commit -m "Synchronize VG quiz Knowledge and deterministic Fagverk release"
          git push origin HEAD:refs/heads/agent/vg-huset-quiz-source-revision-20261010
