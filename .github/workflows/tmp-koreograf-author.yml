name: Temporary Koreograf Role World authoring

on:
  push:
    branches:
      - civication/scenekunst-koreograf-role-world
    paths:
      - .github/workflows/tmp-koreograf-author.yml

permissions:
  contents: write

jobs:
  author-verify-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Author and materialize Koreograf
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>{fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n')};
          const streamPath='data/Civication/narratives/leisure/scenekunst_koreograf.json';
          const worldPath='data/Civication/roleWorlds/scenekunst/scenekunst_koreograf.json';
          const lifeKey='scenekunst/koreograf';
          const lifeScope='scenekunst_koreograf';
          const storyData=[
            ['bevegelsesmateriale_uten_fasit','Utøveren','Bevegelsesmaterialet har flere mulige retninger',['Du har samlet korte bevegelsesfraser fra prøven, men materialet peker ikke mot én opplagt struktur.','Koreografisk praksis må skille observasjon av bevegelse fra beslutningen om hva materialet skal bli.','Et arbeidskart skal gjøre rytme, retning og kontrast synlig uten å late som første lesning er den eneste mulige.'],'Sorter frasene etter rytme, retning og overgang, og prøv to ulike organiseringshypoteser før du låser formen.','Velg den første sammenhengende sekvensen og behandle den som verkets endelige struktur.',['movement_observation','structural_reversibility'],'Materialet forblir undersøkbart og kan endres av neste prøve.','Et tidlig mønster får status som fasit før alternativene er prøvd.'],
            ['bidraget_som_blir_usynlig','Medskapende utøver','Hvem eier frasen som oppstod i rommet?',['En utøver utvikler en bevegelsesløsning som raskt blir sentral i helheten.','Koreografisk arbeid kan være både individuelt komponert og medskapt; opphav, bearbeiding og kreditering må kunne skilles.','Sporbar kreditering beskytter både samarbeid og senere offentlig presentasjon.'],'Noter hva utøveren utviklet, hva du bearbeidet, og avklar krediteringen mens prosessen fortsatt er fersk.','La materialet inngå uten særskilt spor fordi alt som skjer i prøverommet uansett tilhører koreografien.',['authorship_trace','credit_discipline'],'Bidraget får en synlig historie uten at samarbeidet fryses til juridisk språk.','Medskaping forsvinner inn i en generell kunstneridentitet.'],
            ['beroring_som_forutsetter_samtykke','Utøveren','En kontaktsekvens krever mer enn teknisk presisjon',['En ny sekvens bygger på løft, vektføring og tett fysisk kontakt.','Samtykke i kroppslig arbeid må være konkret, reversibelt og mulig å trekke tilbake uten sosial straff.','Koreografisk tydelighet kan ikke erstatte utøverens rett til å markere grenser i egen kropp.'],'Avklar kontaktpunkter, alternativer og stopptegn før sekvensen repeteres i høyere intensitet.','Be alle gjennomføre sekvensen som planlagt først, og ta eventuelle grenser etterpå når formen er tydelig.',['embodied_consent','reversible_contact'],'Sekvensen kan utvikles med tydelige grenser og reelle alternativer.','Formpress blir brukt som grunn til å utsette kroppslig samtykke.'],
            ['proven_som_motfunn','Prøvepartneren','Kroppen motsier planen',['En overgang som ser presis ut i notatet faller fra hverandre når den gjentas i faktisk tempo.','Prøven gir situert evidens om timing, tyngde og koordinasjon, men én gjennomkjøring er ikke universell fasit.','Koreografen må la kroppslige motfunn endre hypotesen uten å gjøre enkeltopplevelsen til ny regel.'],'Beskriv hva som faktisk svikter, juster én variabel og prøv overgangen igjen før du konkluderer.','Forsvar notatet og be utøverne repetere til kroppen tilpasser seg den opprinnelige planen.',['rehearsal_evidence','embodied_counterevidence'],'Planen blir korrigerbar mot det som faktisk skjer i rommet.','Dokumentet får høyere status enn den observerte bevegelsen.'],
            ['belastningen_som_ikke_synes','Utøveren','Presisjonen koster mer enn den ser ut til',['En utøver leverer sekvensen rent, men forteller at gjentakelsen gir økende belastning.','Belastning er faglig informasjon, ikke et tegn på svak innsats, og koreografisk kontinuitet må tåle tilpasning.','Praksisen må skille ønsket uttrykk fra én bestemt fysisk løsning.'],'Reduser repetisjonsmengden, finn en alternativ mekanikk og behold uttrykksmålet som egen variabel.','Behold sekvensen uendret fordi den fortsatt ser kontrollert ut fra salen.',['load_visibility','adaptive_composition'],'Uttrykket kan bevares samtidig som arbeidsmåten korrigeres.','Synlig resultat brukes til å overstyre kroppslig belastningsinformasjon.'],
            ['ulik_kropp_samme_intensjon','Ny utøver','Materialet må kunne flytte inn i en annen kropp',['En ny utøver overtar deler av materialet og løser vekt, rekkevidde og tempo annerledes.','Koreografisk overføring handler ikke om å kopiere overflate nøyaktig, men om å identifisere hvilke relasjoner og intensjoner som faktisk må bestå.','Tilpasning kan derfor være en presisering av verket, ikke et avvik fra det.'],'Navngi hvilke kvaliteter som er bærende, og bygg en versjon som fungerer med den nye utøverens faktiske forutsetninger.','Krev identisk utførelse fordi koreografien ellers mister autentisitet.',['transferable_intent','adaptive_authorship'],'Materialet beholder sin funksjon uten å late som kropper er utskiftbare.','Likhet i form blir forvekslet med troskap mot verkets hensikt.'],
            ['musikken_som_laser_tellingen','Lydpartneren','Tellingen og lyden trekker i hver sin retning',['En sekvens er utviklet mot en foreløpig lydflate, men det nye lydmaterialet endrer opplevelsen av puls og varighet.','Koreografisk timing kan organiseres mot telling, pust, hendelse eller lyd, og disse systemene må ikke skjules under ett felles tempo.','Samarbeidet trenger et tydelig grensesnitt for hva som er fast og hva som fortsatt kan forhandles.'],'Skill de koreografiske ankerpunktene fra lydens struktur og prøv hvor koblingen faktisk må være presis.','Lås lyden til den gamle tellingen fordi bevegelsen ble laget først.',['temporal_interface','collaboration_boundary'],'Begge faglige systemer kan endres uten at ansvar blir uklart.','Førsterett i prosessen blir gjort til kunstnerisk myndighet.'],
            ['rommet_endrer_koreografien','Teknisk partner','Scenerommet tåler ikke laboratorieversjonen',['Materialet er utviklet i et stort rom, men spillestedet har smalere passasjer og andre siktlinjer.','Romlige begrensninger er koreografisk informasjon fordi avstand, retning og risiko inngår i bevegelsens virkning.','Tilpasning må være sporbar slik at produksjonskrav ikke kamufleres som kunstnerisk smak.'],'Kartlegg hvilke avstander som er funksjonelle, bygg en stedstilpasset variant og marker hva som er teknisk begrunnet.','Press laboratorieversjonen inn i rommet og be teknikken løse resten rundt den.',['spatial_adaptation','constraint_visibility'],'Rommet blir en eksplisitt del av komposisjonen framfor en skjult feilmargin.','Produksjonsbegrensningen skyves over på andre fag uten ny koreografisk vurdering.'],
            ['vikaren_kommer_inn_sent','Produksjonslederen','En sen utskifting gjør kunnskapen synlig',['Kort før visning må en annen utøver inn i flere sekvenser.','Koreografisk kunnskap ligger både i notater, video, kroppslig hukommelse og relasjoner mellom utøvere.','Et sent handoff må prioritere hva som faktisk er sikkerhetskritisk, strukturelt bærende og mulig å lære på tiden som finnes.'],'Lag en prioritert overføring med bærende ankerpunkter, trygge forenklinger og tydelig restusikkerhet.','Forsøk å presse hele originalversjonen inn på samme tid fordi enhver forenkling svekker verket.',['handoff_priority','knowledge_distribution'],'Den nye utøveren får et realistisk og sporbar arbeidsgrunnlag.','Fullstendighet blir viktigere enn faktisk lærbarhet og sikker gjennomføring.'],
            ['videoen_som_blir_arkiv','Dokumentasjonspartneren','Prøvevideoen får et nytt liv',['Video er tatt opp for intern hukommelse, men noen vil bruke klippet i presentasjon og søknadsmateriale.','Dokumentasjon av kroppslig arbeid kan skifte formål, og samtykke til intern prøvebruk er ikke automatisk samtykke til offentlig sirkulasjon.','Koreografisk dokumentasjon trenger derfor både formålsgrense og sporbar godkjenning.'],'Avklar nytt formål og hvem som er synlig før klippet brukes utenfor den avtalte prøvefunksjonen.','Bruk klippet fordi alle allerede visste at kameraet var i rommet.',['documentation_consent','purpose_boundary'],'Materialet kan få ny bruk uten at den opprinnelige situasjonen omskrives i ettertid.','Tilstedeværelse foran kamera blir tolket som generelt publiseringssamtykke.'],
            ['fristen_som_fryser_materialet','Produksjonslederen','En teknisk frist gjør utkastet permanent',['Lys og scene trenger en stabil struktur før flere koreografiske spørsmål er ferdig prøvd.','Produksjonsfrister er reelle avhengigheter, men de gjør ikke et foreløpig bevegelsesvalg kunstnerisk endelig.','God overlevering skiller det som må låses fra det som fortsatt kan endres innenfor kjente rammer.'],'Marker hvilke sekvenser som låses av produksjonsbehov, hvilke som fortsatt er reversible, og hvem som eier neste beslutning.','Kall hele koreografien ferdig slik at ingen andre fag trenger å forholde seg til usikkerhet.',['production_lock','rework_visibility'],'Teamet får en presis beslutningsgrense uten å gjøre utkast til sannhet.','Usikkerheten skjules og vender senere tilbake som dyrt omarbeid.'],
            ['krediteringen_i_programmet','Kommunikasjonsansvarlig','Én linje skal forklare hvem som skapte hva',['Programteksten skal komprimere en lang prosess til få krediteringslinjer.','Når koreografi er utviklet gjennom både komposisjon og medskaping, kan en for enkel kreditering gjøre bidrag usynlige.','Offentlig tekst må være kort uten å viske ut forskjellen mellom hovedansvar, medskaping og utøverarbeid.'],'Formuler en kort kreditering som skiller hovedansvar fra dokumenterte medskapende bidrag, og la de berørte lese den før publisering.','Bruk bare Koreograf som samlet kreditering fordi publikum ikke trenger prosessdetaljer.',['public_credit','attribution_trace'],'Den offentlige teksten blir kort og samtidig sporbar mot faktisk prosess.','Institusjonell enkelhet kjøpes ved å gjøre medskapende arbeid usynlig.'],
            ['materialet_som_folger_hjem','Nærpersonen','Kroppen og notatene fortsetter etter prøven',['Du merker at du fortsatt går gjennom timing, feil og andres fysiske valg lenge etter at prøven er slutt.','Koreografisk arbeid kan gjøre både egen kropp og andres bevegelse til et kontinuerlig analysefelt; grenseløst etterarbeid svekker neste dags oppmerksomhet.','Privatlivet må kunne romme belastningen uten at fortrolig prøveinnhold eller ubetalt reservearbeid blir normalen.'],'Beskriv presset uten å dele andres fortrolige detaljer, legg bort materialet og bestem når neste arbeidsøkt faktisk begynner.','Fortsett å analysere hjemme fordi den som leder materialet må være mentalt tilgjengelig hele tiden.',['private_containment','invisible_work'],'En tydelig slutt på arbeidsøkten beskytter både relasjonen og neste dags presisjon.','Usynlig arbeid blir gjort til permanent personlig beredskap.'],
            ['sesongslutt_hva_er_en_koreograf','Koreografkollegaen','Hva slags myndighet følger egentlig Koreograf-identiteten?',['Etter to uker har du komponert, prøvd, tilpasset, kreditert og dokumentert bevegelsesmateriale gjennom flere arbeidsflater.','Koreograf er her en employment-independent choreographic_practice_or_self_employment: Badge-identiteten kan eksistere som selvstendig praksis uten arbeidsgiveransettelse eller institusjonelt mandat.','Formell Koreograf-jobb krever fortsatt appointment_required; livsposisjonen gjør deg ikke automatisk til Regissør, Skuespiller / danser, Dramaturg, Produsent, Scenekunstkurator eller Kunstnerisk leder.'],'Oppsummer praksisen som kroppslig komposisjon, sporbar medskaping, korrigerbar prøveevidens og tydelig mandatgrense, og la formell myndighet følge faktisk avtale.','Bruk Badge-identiteten som bevis på at du kan styre andre utøvere, produksjon og offentlig kreditering uten særskilt avtale.',['role_boundary','employment_independence'],'Rollen blir tydelig som praksis og mulig selvstendig levevei uten å late som den gir institusjonell fullmakt.','Identitet glir over i ubegrunnet arbeidsgiver- og beslutningsmyndighet.']
          ];
          const storylets=storyData.map(x=>({
            id:x[0],message_type:'decision',time_slot:['people','personal'],from:x[1],subject:x[2],situation:x[3],
            choices:[
              {id:'A',label:x[4],effect:1,tags:x[6],feedback:x[7]},
              {id:'B',label:x[5],effect:-1,tags:x[6].map(t=>t+'_failure'),feedback:x[8]}
            ],opens_streams:[],adds_flags:['koreograf_'+x[0]],risk_links:['reputation_risk','relationship_risk'],links:[]
          }));
          const stream={schema:'civication_narrative_stream_v1',id:'scenekunst_koreograf_stream',type:'leisure',title:'Koreograf — kroppslig komposisjon, medskaping, samtykke og sporbar overføring',sociological_theme:'scenekunst_koreograf_kroppslig_komposisjon_medskaping_samtykke_proveevidens_belastning_tilpasning_kreditering_dokumentasjon_produksjonsgrense_og_mandatseparasjon',applies_when:{any_tags:['scenekunst:koreograf']},time_slots:['personal','home','people','leisure'],storylets};
          write(streamPath,stream);

          const manifest=read('data/Civication/narratives/manifest.json');
          manifest.streams=manifest.streams.filter(x=>x.id!==stream.id&&x.path!==streamPath);
          manifest.streams.push({id:stream.id,path:streamPath});
          write('data/Civication/narratives/manifest.json',manifest);

          const themeIds=['professional_culture','invisible_work','loyalty_up_down','public_attention','shame_reputation','public_private_leakage','local_knowledge_vs_system'];
          const people=[
            ['nora_utover','Utøver som gjør kroppslig motfunn, belastning og samtykke synlig i en prosess som ellers lett blir lest utenfra.','medskapende utøver','høy situert troverdighet om egen kropp og faktisk gjennomføring','kan sette grenser for egen kropp og bidra med motfunn, men gir ikke koreografen arbeidsgivermandat over andre','at bevegelsesmaterialet kan være krevende uten å gjøre kroppen utskiftbar','hvor ofte hun tidligere har presset gjennom ubehag for å unngå å forsinke gruppen','konkret om timing, belastning og kontakt','at kroppslig kunnskap må kunne endre komposisjonen'],
            ['amir_medskaper','Medskapende utøver som utfordrer hvor koreografisk opphav slutter og kollektiv utvikling begynner.','kunstnerisk samarbeidspartner','sterk faglig posisjon i materiale han selv har utviklet','kan kreve tydelig attribusjon av eget bidrag, men eier ikke automatisk hele verkets struktur','at kreditering følger faktisk arbeid uten å splitte samarbeidet i symbolske revir','at han er usikker på hvor mye av materialet som fortsatt oppleves som hans eget','presis om konkrete fraser og mindre opptatt av titler','at opphav og bearbeiding trenger sporbarhet'],
            ['maja_produksjonsleder','Produksjonsleder som gjør tid, rom, utskifting og tekniske låsepunkter synlige før usikkerhet blir kostbar.','produksjonsleder med delegert prosessansvar','sterk posisjon i frister, koordinering og gjennomførbarhet','kan sette produksjonsgrenser og stanse uforsvarlig framdrift, men kan ikke definere koreografisk mening','et arbeidsgrunnlag med tydelig låsegrad, avhengighet og restarbeid','hvor mye usikkerhet hun absorberer for å skjerme de kunstneriske fagene','kort og konkret om ansvar, tid og reversibilitet','at produksjonsgrensen er reell uten å være kunstnerisk fasit'],
            ['leila_koreografkollega','Fagfelle som kan se blinde flekker i komposisjon, medskaping og rollegrense uten å være prosjektets beslutningstaker.','selvstendig koreografisk fagfelle','kollegial status uten personalmyndighet','kan utfordre metode, attribusjon og prøvehypoteser, men kan ikke tildele formell stilling eller institusjonsmandat','at uenighet brukes til kvalitetskontroll framfor statuskamp','at hun selv ønsker å framstå som den som ser strukturen raskest','analytisk, kroppsnær og tydelig om egne forbehold','at koreografisk autoritet må tåle korrigering'],
            ['erik_teknisk_partner','Teknisk samarbeidspartner som gjør rom, siktlinjer og gjennomføringsgrenser konkrete.','teknisk fagpartner','autoritet på avgrensede romlige og tekniske forhold','kan definere tekniske sikkerhets- og gjennomføringsgrenser, men ikke alene bestemme koreografisk form','at endringer kommer tidlig nok til å kunne løses uten skjult omarbeid','hvor liten margin enkelte løsninger faktisk har','nøktern, målorientert og konkret om fysiske begrensninger','at romlig begrensning må inn i komposisjonen som informasjon'],
            ['sara_dokumentasjonspartner','Dokumentasjonspartner som holder intern hukommelse, samtykke og ny offentlig bruk fra hverandre.','dokumenterende samarbeidspartner','praktisk kontroll over opptak og filflyt innen avtalt oppgave','kan stoppe uavklart viderebruk av materiale, men kan ikke gi samtykke på vegne av dem som er filmet','at opptak kan være nyttige uten å få et ubegrenset liv utenfor prøven','hvor lett intern dokumentasjon blir hentet fram igjen til nye formål','rolig og presis om formål, tilgang og godkjenning','at dokumentasjon trenger ny avklaring når formålet endres']
          ].map(x=>({id:x[0],social_function:x[1],class_position:x[2],status:x[3],power_over_player:x[4],wants:x[5],conceals:x[6],speech_style:x[7],teaches_player:x[8]}));
          const slowAxes=[
            ['embodied_consent','Hvor godt kroppslig samtykke, stoppgrenser og alternativer forblir reelle gjennom prøven.','editorial_only_until_governed'],
            ['authorship_trace','Hvor tydelig opphav, medskaping og bearbeiding kan spores uten å fryse samarbeidet.','editorial_only_until_governed'],
            ['rehearsal_evidence','Hvor korrigerbar komposisjonen er mot det som faktisk skjer i bevegelse.','editorial_only_until_governed'],
            ['adaptive_composition','Hvor godt uttrykksmål kan bevares når kropp, rom eller bemanning endrer forutsetningene.','editorial_only_until_governed'],
            ['credit_discipline','Hvor presist offentlig kreditering følger faktisk ansvar og dokumenterte bidrag.','editorial_only_until_governed'],
            ['mandate_separation','Hvor tydelig selvstendig koreografisk praksis holdes atskilt fra arbeidsgiver-, regi-, produksjons- og institusjonsmyndighet.','editorial_only_until_governed']
          ].map(x=>({id:x[0],meaning:x[1],runtime_binding:x[2]}));
          const phases=['morning','lunch','afternoon','evening'];
          const phaseTypes={morning:'info',lunch:'conversation',afternoon:'decision',evening:'private_consequence'};
          const phaseText={morning:'materialet åpnes og premissene skilles',lunch:'en annen person utfordrer komposisjonen',afternoon:'spilleren må avgrense handling, kropp og mandat',evening:'arbeidet får privat etterklang uten å gjøre andre menneskers kropper til grenseløst råstoff'};
          const coverage=[];
          for(let day=1;day<=14;day++){
            const s=storylets[day-1];
            for(const phase of phases) coverage.push({day,phase,beat_type:phaseTypes[phase],summary:`Dag ${day} ${phase}: ${s.subject}. ${phaseText[phase]}; neste prøve beholder sporbarhet mellom observasjon, kroppslig respons, beslutning og restspørsmål.`,thread_ids:[`koreograf_thread_${String(day).padStart(2,'0')}`],materialization_refs:[`${streamPath}#${s.id}`]});
          }
          const beat=(day,phase)=>`${day}/${phase}`;
          const primaryThreads=[];
          for(let day=1;day<=14;day++){
            const d2=(day%14)+1,d3=((day+1)%14)+1,d4=((day+2)%14)+1;
            primaryThreads.push({id:`koreograf_thread_${String(day).padStart(2,'0')}`,relationship:`${storylets[day-1].from}: ${storylets[day-1].subject} utvikles fra bevegelsesmateriale til sosial reaksjon og senere korrigering uten at Koreograf-identiteten overtar andres kropp eller mandat.`,beat_refs:[beat(day,'morning'),beat(day,'lunch'),beat(d2,'afternoon'),beat(d3,'lunch'),beat(d4,'morning')]});
          }
          const privateAftermath=[0,3,6,9,12].map((idx,n)=>({id:`private_aftermath_${n+1}`,description:`Etter ${storylets[idx].subject.toLowerCase()} må spilleren skille koreografisk ansvar fra privat beredskap, beskytte andres kroppslige og fortrolige materiale og la hvile være en del av presisjonen.`,materialization_refs:[`${streamPath}#${storylets[idx].id}`]}));
          const delayedPairs=[[1,4,['narrative','relationship']],[2,6,['relationship','reputation']],[3,8,['narrative','reputation']],[5,10,['reputation','narrative']],[7,12,['relationship','psyche']],[9,14,['job','reputation']]];
          const delayedConsequences=delayedPairs.map((x,i)=>({id:`koreograf_delayed_${i+1}`,setup_ref:beat(x[0],'afternoon'),return_ref:beat(x[1],'afternoon'),domains:x[2]}));
          const world={schema:'civication_role_world_v1',version:1,category:'scenekunst',role_scope:lifeScope,title:'Koreograf — kroppslig komposisjon, sporbar medskaping og tydelig mandat',status:'role_world_complete',subject_type:'life_position',life_position_ref:{badge_id:'scenekunst',id:'koreograf',label:'Koreograf'},sociological_core:{main_problem:'kunstnerisk komposisjonsmakt over materiale som samtidig finnes i andre menneskers kropper',description:'Koreograf som employment-independent choreographic_practice_or_self_employment handler om å komponere og utvikle bevegelsesmateriale med sporbar medskaping, konkret samtykke, korrigerbar prøveevidens, belastningssynlighet, tilpasning og kreditering. Badge-identiteten kan romme selvstendig praksis eller selvstendig levevei, men gir ingen automatisk ansettelse eller institusjonell myndighet: formell Koreograf-jobb krever fortsatt appointment_required. Rollen må skilles fra Regissør, Skuespiller / danser, Dramaturg, Produsent, Scenekunstkurator og Kunstnerisk leder, og ingen ny runtime opprettes.'},theme_ids:themeIds,social_environments:['bevegelseslaboratorium_og_proverom','medskapende_utoverarbeid','romlig_og_teknisk_tilpasning','overforing_og_dokumentasjon','kreditering_og_offentlig_presentasjon','privat_etterklang_uten_materiallekkasje'],recurring_people_archetypes:people,slow_axes:slowAxes,season:{days:14,day_phases:phases,coverage},primary_threads:primaryThreads,private_aftermath:privateAftermath,delayed_consequences:delayedConsequences,materialization:{no_new_runtime:true,source_refs:storylets.map(s=>`${streamPath}#${s.id}`)}};
          write(worldPath,world);

          const index=read('data/Civication/roleWorlds/index.json');
          index.roles=index.roles.filter(x=>x.life_position_key!==lifeKey&&x.path!==worldPath);
          index.roles.push({category:'scenekunst',role_scope:lifeScope,subject_type:'life_position',life_position_key:lifeKey,life_position_ref:{badge_id:'scenekunst',id:'koreograf',label:'Koreograf'},status:'role_world_complete',path:worldPath});
          const total=index.roles.length,career=index.roles.filter(r=>r.subject_type!=='life_position').length,life=index.roles.filter(r=>r.subject_type==='life_position').length;
          if(total!==241||career!==85||life!==156) throw new Error(`unexpected index ${total}/${career}/${life}`);
          index.status=`${total}_role_worlds_materialized`;
