          write('data/Civication/roleWorldThemeBank.json',themeBank);

          const taxonomy=read('data/Civication/nonCareerRoleTaxonomy.json');
          taxonomy.canonical_counts.life_position_role_worlds=life;taxonomy.canonical_counts.total_role_worlds=total;
          if(!taxonomy.role_world_rollout_boundary.completed_life_position_role_worlds.includes(lifeKey))taxonomy.role_world_rollout_boundary.completed_life_position_role_worlds.push(lifeKey);
          write('data/Civication/nonCareerRoleTaxonomy.json',taxonomy);

          const policy=read('data/Civication/roleWorldPolicy.json');
          policy.noncareer_subject_boundary.life_position_readiness.completed_life_position_role_worlds=life;
          write('data/Civication/roleWorldPolicy.json',policy);

          const test=`#!/usr/bin/env node\n'use strict';\nconst assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path');const ROOT=path.resolve(__dirname,'..');const read=r=>JSON.parse(fs.readFileSync(path.join(ROOT,r),'utf8'));\nconst audit=read('data/Civication/lifePositionRoleWorldReadiness.json'),index=read('data/Civication/roleWorlds/index.json'),taxonomy=read('data/Civication/nonCareerRoleTaxonomy.json'),checklist=read('data/Civication/roleWorldAuthoringChecklist.json'),themeBank=read('data/Civication/roleWorldThemeBank.json'),policy=read('data/Civication/roleWorldPolicy.json'),badge=read('data/badges/scenekunst.json');\nconst lifeKey='scenekunst/koreograf',lifeScope='scenekunst_koreograf',streamPath='data/Civication/narratives/leisure/scenekunst_koreograf.json',worldPath='data/Civication/roleWorlds/scenekunst/scenekunst_koreograf.json';\nconst tier=badge.tiers.find(x=>x.life_position?.id==='koreograf');assert.ok(tier);assert.equal(tier.label,'Koreograf');assert.equal(tier.life_position.kind,'choreographic_practice_or_self_employment');assert.equal(tier.life_position.employment_independent,true);assert.equal(tier.career_unlock.title,'Koreograf');assert.equal(tier.career_unlock.policy,'appointment_required');assert.equal(tier.career_unlock.role_scope,'scenekunst_regi_og_koreografi');\nconst stream=read(streamPath);assert.equal(stream.schema,'civication_narrative_stream_v1');assert.equal(stream.id,'scenekunst_koreograf_stream');assert.deepEqual(stream.applies_when.any_tags,['scenekunst:koreograf']);assert.deepEqual(read('data/Civication/narratives/manifest.json').streams.filter(x=>x.id===stream.id),[{id:stream.id,path:streamPath}]);assert.equal(stream.storylets.length,14);assert.equal(new Set(stream.storylets.map(x=>x.id)).size,14);for(const s of stream.storylets){assert.ok(s.situation.length>=3);assert.equal(s.choices.length,2);assert.deepEqual(s.choices.map(c=>c.effect),[1,-1]);assert.ok(s.choices.every(c=>c.tags.length>=2));}\nconst row=audit.positions.find(x=>x.key===lifeKey);assert.ok(row);assert.equal(row.runtime_source,'badge_tier');assert.equal(row.semantic_mode,'livelihood_or_ownership_identity');assert.equal(row.classification,'ready');assert.equal(row.authored_depth.exact_source_ref_count,1);assert.equal(row.authored_depth.thematic_source_ref_count,0);assert.equal(row.authored_depth.max_narrative_depth,14);assert.deepEqual(row.evidence.exact_source_refs,[streamPath]);assert.deepEqual(row.evidence.thematic_source_refs,[]);for(const other of audit.positions.filter(x=>x.key!==lifeKey)){assert.ok(!(other.evidence.exact_source_refs||[]).includes(streamPath),streamPath+' leaked exact into '+other.key);assert.ok(!(other.evidence.thematic_source_refs||[]).includes(streamPath),streamPath+' leaked thematic into '+other.key);}\nconst indexed=index.roles.find(x=>x.life_position_key===lifeKey),world=read(worldPath);assert.ok(indexed);assert.equal(indexed.role_scope,lifeScope);assert.equal(indexed.status,'role_world_complete');assert.deepEqual(indexed.life_position_ref,{badge_id:'scenekunst',id:'koreograf',label:'Koreograf'});assert.equal(row.role_world_status,'role_world_complete');assert.equal(row.role_world_path,worldPath);assert.ok(!audit.queue.some(x=>x.key===lifeKey));assert.equal(audit.queue[0].key,'scenekunst/regissor');\nassert.equal(world.schema,'civication_role_world_v1');assert.equal(world.subject_type,'life_position');assert.equal(world.status,'role_world_complete');assert.deepEqual(world.life_position_ref,{badge_id:'scenekunst',id:'koreograf',label:'Koreograf'});assert.equal(world.materialization.no_new_runtime,true);assert.match(world.sociological_core.description,/choreographic_practice_or_self_employment|employment-independent/i);assert.match(world.sociological_core.description,/appointment_required/i);assert.match(world.sociological_core.description,/Regissør|Skuespiller|Dramaturg|Produsent|Scenekunstkurator/i);assert.match(world.sociological_core.description,/ingen ny runtime/i);\nassert.equal(world.season.days,14);assert.deepEqual(world.season.day_phases,['morning','lunch','afternoon','evening']);assert.equal(world.season.coverage.length,56);assert.equal(new Set(world.season.coverage.map(x=>x.day+'/'+x.phase)).size,56);assert.equal(new Set(world.season.coverage.map(x=>x.summary)).size,56);assert.deepEqual([...new Set(world.season.coverage.filter(x=>x.phase==='evening').map(x=>x.beat_type))],['private_consequence']);assert.equal(world.primary_threads.length,14);assert.ok(world.primary_threads.every(x=>x.beat_refs.length===5));assert.ok(world.primary_threads.every(x=>new Set(x.beat_refs.map(ref=>Number(ref.split('/')[0]))).size>=3));assert.equal(world.recurring_people_archetypes.length,6);assert.equal(world.private_aftermath.length,5);assert.equal(world.delayed_consequences.length,6);assert.ok(world.delayed_consequences.every(x=>Number(x.return_ref.split('/')[0])>Number(x.setup_ref.split('/')[0])));assert.equal(world.materialization.source_refs.length,14);assert.equal(new Set(world.materialization.source_refs).size,14);for(const ref of world.materialization.source_refs)assert.ok(ref.startsWith(streamPath+'#'));\nassert.deepEqual(themeBank.reference_profiles['scenekunst/scenekunst_koreograf'],world.theme_ids);assert.ok(checklist.reference_worlds.includes(worldPath));assert.ok(taxonomy.role_world_rollout_boundary.completed_life_position_role_worlds.includes(lifeKey));assert.equal(taxonomy.canonical_counts.life_position_role_worlds,156);assert.equal(taxonomy.canonical_counts.total_role_worlds,241);assert.equal(policy.noncareer_subject_boundary.life_position_readiness.completed_life_position_role_worlds,156);\nassert.match(stream.storylets.find(x=>x.id==='beroring_som_forutsetter_samtykke').situation.join(' '),/samtykke|kropp|grenser/i);assert.match(stream.storylets.find(x=>x.id==='bidraget_som_blir_usynlig').situation.join(' '),/opphav|kreditering|medskapt/i);assert.match(stream.storylets.find(x=>x.id==='belastningen_som_ikke_synes').situation.join(' '),/belastning|tilpasning|uttrykk/i);assert.match(stream.storylets.find(x=>x.id==='sesongslutt_hva_er_en_koreograf').situation.join(' '),/appointment_required|Regissør|Skuespiller|Dramaturg|Produsent/i);assert.equal(new Set(stream.storylets.flatMap(s=>s.choices.map(c=>c.feedback))).size,28);const allowed=new Set(['job','relationship','psyche','livelihood','economy','housing','reputation','narrative']);assert.ok(world.delayed_consequences.every(c=>c.domains.every(d=>allowed.has(d))));console.log('Scenekunst Koreograf authored-depth and Role World gate ok');\n`;
          fs.writeFileSync('tests/civication-scenekunst-koreograf-authored-depth.test.js',test);
          NODE
          node scripts/audit-civication-life-position-role-world-readiness.mjs --write

      - name: Synchronize governed snapshots
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const indexPath='data/Civication/roleWorlds/index.json',index=read(indexPath);
          const total=index.roles.length,career=index.roles.filter(r=>r.subject_type!=='life_position').length,life=index.roles.filter(r=>r.subject_type==='life_position').length;
          if(total!==241||career!==85||life!==156) throw new Error(`unexpected index ${total}/${career}/${life}`);
          index.status=`${total}_role_worlds_materialized`;index.summary={role_worlds_total:total,career_role_worlds:career,life_position_role_worlds:life};index.career_role_world_count=career;index.life_position_role_world_count=life;if(index.canonical_counts){index.canonical_counts.role_worlds_total=total;index.canonical_counts.career_role_worlds=career;index.canonical_counts.life_position_role_worlds=life;}write(indexPath,index);
          const audit=read('data/Civication/lifePositionRoleWorldReadiness.json');
          const nextQueue=audit.queue[0]?.key;
          if(nextQueue!=='scenekunst/regissor') throw new Error(`unexpected queue ${nextQueue}`);
          const leaked=audit.positions.filter(x=>x.key!=='scenekunst/koreograf'&&[...(x.evidence?.exact_source_refs||[]),...(x.evidence?.thematic_source_refs||[])].includes('data/Civication/narratives/leisure/scenekunst_koreograf.json')).map(x=>x.key);
          if(leaked.length) throw new Error(`Koreograf source leaked into ${leaked.join(', ')}`);
          const replaceAssert=(s,expr,value)=>{const e=expr.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return s.replace(new RegExp(`(assert\\.equal\\(\\s*${e}\\s*,\\s*)\\d+`,'g'),`$1${value}`)};
          const changed=[];
          for(const name of fs.readdirSync('tests').filter(n=>/^civication-.*\.test\.js$/.test(n))){
            const p=path.join('tests',name);let s=fs.readFileSync(p,'utf8'),before=s;
            for(const expr of ['index.roles.length','roleWorldIndex.roles.length','index.summary.role_worlds_total','taxonomy.canonical_counts.total_role_worlds'])s=replaceAssert(s,expr,total);
            for(const expr of ['index.life_position_role_world_count','index.summary.life_position_role_worlds','taxonomy.canonical_counts.life_position_role_worlds','policy.noncareer_subject_boundary.life_position_readiness.completed_life_position_role_worlds','lifePositionWorlds.length'])s=replaceAssert(s,expr,life);
            s=s.replace(/(assert\.equal\(\s*audit\.queue\[0\]\.key\s*,\s*)['"]scenekunst\/koreograf['"]/g,`$1'${nextQueue}'`)
               .replace(/const unrelated=\[['"]scenekunst\/koreograf['"]\]/g,`const unrelated=['${nextQueue}']`)
               .replace(/(assert\.deepEqual\(\s*roleWorldIndex\.summary\s*,\s*\{\s*role_worlds_total:\s*)240(,\s*career_role_worlds:\s*85,\s*life_position_role_worlds:\s*)155(\s*\}\s*\))/g,`$1${total}$2${life}$3`);
            if(name==='civication-life-position-role-world-readiness.test.js'){
              const c=audit.summary.classifications;
              s=s.replace(/ready:\s*155,\s*\n\s*needs_authored_depth:\s*4,\s*\n\s*not_a_standalone_world:\s*40/g,`ready: ${c.ready},\n  needs_authored_depth: ${c.needs_authored_depth},\n  not_a_standalone_world: ${c.not_a_standalone_world}`);
              for(const f of ['completed_life_position_role_worlds','pending_ready_positions','livelihood_backed_positions','positions_with_exact_governed_sources','positions_with_multi_scene_narrative_foundation'])s=replaceAssert(s,`audit.summary.${f}`,audit.summary[f]);
            }
            if(name==='civication-noncareer-role-taxonomy.test.js'){
              s=s.replace(/85 karriereverdener \+ 155 life-position worlds/g,`85 karriereverdener + ${life} life-position worlds`)
                 .replace(/155 canonical life-position worlds skal være materialisert, nå også Scenekunst Dramaturg som egen employment-independent dramaturgical practice-posisjon/g,`${life} canonical life-position worlds skal være materialisert, nå også Scenekunst Koreograf som egen employment-independent choreographic practice-posisjon`)
                 .replace(/(const expectedCounts = \{[\s\S]*?life_position_role_worlds:\s*)155(,\s*\n\s*total_role_worlds:\s*)240/g,`$1${life}$2${total}`)
                 .replace(/85 career Role Worlds \+ 155 life-position worlds/g,`85 career Role Worlds + ${life} life-position worlds`);
            }
            if(s!==before){fs.writeFileSync(p,s);changed.push(name)}
          }
          console.log(JSON.stringify({total,career,life,nextQueue,readiness:audit.summary,changed_tests:changed.length},null,2));
          NODE

      - name: Verify complete Koreograf state
        run: |
          node tests/civication-scenekunst-koreograf-authored-depth.test.js
          node tests/civication-role-world-contract.test.js
          node tests/civication-life-position-role-world-readiness.test.js
          node tests/civication-noncareer-role-taxonomy.test.js
          node scripts/build-civication-scene-registry.mjs --check
          npm run test:civication
          git diff --check

      - name: Commit permanent Koreograf state
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-koreograf-author.yml
          git add data/Civication reports/civication-life-position-role-world-readiness.md tests/civication-*.test.js
          git diff --cached --check
          git commit -m "Civication: author Scenekunst Koreograf Role World"
          git push origin HEAD:civication/scenekunst-koreograf-role-world
