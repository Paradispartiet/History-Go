name: Temporary Minneparken release guard verification
on:
  push:
    branches:
      - content/minneparken-kildebasert-leksikon-20261103
    paths:
      - .github/workflows/minneparken-release-guard-temp.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/minneparken-kildebasert-leksikon-20261103
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fail-closed source, QuizCard and release gates on current branch
        run: node --test tests/minneparken-quiz-source-parity.test.mjs
