name: Tronsmo CI contract repair

on:
  push:
    branches:
      - agent/tronsmo-bokhandel-completion-20260910

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[tronsmo-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Repair Tronsmo production contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>{fs.mkdirSync(p.split('/').slice(0,-1).join('/'),{recursive:true});fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n')};
          const placePath='data/places/litteratur/oslo/places_litteratur/tronsmo_bokhandel.json';
          const readingPath='data/lesespor/oslo/lesespor_oslo_litteratur.json';
          const workcardPath='reports/place-production/tronsmo-bokhandel-workcard-current.json';
          const registryPath='data/fagverk/fagverk_registry.json';
          const official='https://www.tronsmo.no/om-tronsmo/';
          const officialBox='https://www.tronsmo.no/produkt/tronsmo-40-ar-jubileumsboks/';
          const snl='https://snl.no/Tronsmo_Bokhandel';
          const petterson='https://snl.no/Per_Petterson';
          const commons='https://commons.wikimedia.org/wiki/File:Tronsmo_Bokhandel_comic_book_store_in_Universitetsgata,_Oslo,_Norway._Window_decorations_by_Lars_Fiske_and_Bendik_Kaltenborn,_2017-12-14.jpg';
          const readings=read(readingPath);
          const readingMeta={
            lesespor_tronsmo_historie:{url:snl,source_quality:'recognized',relevance:'Store norske leksikon dokumenterer bokhandelens etablering, profil og historiske utvikling.'},
            lesespor_tronsmo_kuratering:{url:official,source_quality:'institutional',relevance:'Tronsmos egen presentasjon dokumenterer den uttalte kurateringspraksisen og butikkens selvforståelse.'},
            lesespor_tronsmo_tegneserier:{url:official,source_quality:'institutional',relevance:'Tronsmos egen presentasjon dokumenterer tegneserieavdelingens plass i butikkens litterære profil.'},
            lesespor_tronsmo_jubileum:{url:officialBox,source_quality:'institutional',relevance:'Den offisielle produktsiden dokumenterer jubileumsboksen, bidragsyterne og opplagets utforming.'}
          };
          for(const item of readings.items||[]){const meta=readingMeta[item.id];if(!meta)continue;Object.assign(item,meta,{access:'open',curation_status:'approved'});}
          write(readingPath,readings);

          const place=read(placePath);
          const sourceLinks=[
            ['official','Tronsmo – Om Tronsmo',official],
            ['source','Store norske leksikon – Tronsmo Bokhandel',snl],
            ['source','Store norske leksikon – Per Petterson',petterson],
            ['source','Tronsmo – 40 år-jubileumsboks',officialBox],
            ['image_source','Wikimedia Commons – Tronsmo Bokhandel 2017',commons]
          ];
          place.externalLinks=Array.isArray(place.externalLinks)?place.externalLinks:[];
          for(const [type,label,url] of sourceLinks){if(!place.externalLinks.some(x=>x?.url===url))place.externalLinks.push({type,label,url,verifiedAt:'2026-09-10'});}
          const registry=read(registryPath);
          const subject=registry.subjects?.litteratur;
          const emnes=['em_lit_litteraturfelt_institusjoner','em_lit_lesere_offentlighet_formidling','em_lit_litteraere_steder_og_bytekst'];
          const chapters=[];
          for(const ch of subject?.chapters||[]){if((ch.emne_ids||[]).some(id=>emnes.includes(id)))chapters.push(ch.id);}
          const chapterIds=[...new Set(chapters)].slice(0,3);
          if(!chapterIds.length) throw new Error('No active literature chapter found for Tronsmo emner');
          place.emne_ids=[...new Set([...(place.emne_ids||[]).filter(id=>!['em_lit_litteratur_og_offentlig_debatt','em_lit_bokhistorie_trykk_forlag'].includes(id)),...emnes])];
          place.fagverk={
            schema:'history_go_place_fagverk_v2',level:'standard',status:'curated',verified_at:'2026-09-10',
            intro:'Tronsmo gjør det mulig å undersøke hvordan en uavhengig bokhandel velger, synliggjør og formidler litteratur i byen, og hvordan disse valgene kobler marked, litterær offentlighet og konkrete leserpraksiser.',
            article:[
              'Som bokhandel er Tronsmo både kommersiell virksomhet og litterær mellommann. Utvalget er ikke identisk med litteraturen som finnes, men et resultat av valg om hvilke bøker, tegneserier og uttrykk som får fysisk plass og synlighet. Dermed kan hyller, bord og avdelingsnavn studeres som spor etter institusjonell seleksjon, samtidig som observasjonen må skilles fra påstander om salg, lesing eller historisk betydning.',
              'Stedets historie fra 1973, flyttingen til Universitetsgata i 2015 og jubileumsutgivelsen fra 2013 gir ulike tidslag. Per Pettersons dokumenterte arbeid på Tronsmo viser dessuten hvordan en bokhandel kan være arbeidssted i et litterært felt. Disse kildene gjør det mulig å analysere formidling og offentlighet uten å anta at enhver forfatter i sortimentet har en direkte relasjon til stedet.'
            ],
            subject_ids:['litteratur'],emne_ids:emnes,chapter_ids:chapterIds,
            lenses:[
              {id:'tronsmo-lens-1',title:'Kuratering og utvalg',prompt:'Hvordan viser butikkens fysiske utvalg hvilke litterære uttrykk som prioriteres akkurat nå?',subject_id:'litteratur',emne_id:emnes[0],evidence:'Tronsmo beskriver selv utvalget som kuratert, mens butikkrommet gjør prioriteringene observerbare.'},
              {id:'tronsmo-lens-2',title:'Lesere og offentlighet',prompt:'Hvordan legger rommet til rette for oppdagelse, orientering og møter mellom lesere og verk?',subject_id:'litteratur',emne_id:emnes[1],evidence:'Avdelinger, bord, arrangementer og synlige anbefalinger kan undersøkes som konkrete formidlingsgrep.'},
              {id:'tronsmo-lens-3',title:'Sted og litteratur',prompt:'Hvordan endrer forståelsen av Tronsmo seg når dagens butikk sammenholdes med stedets historiske adresser?',subject_id:'litteratur',emne_id:emnes[2],evidence:'Kildene skiller perioden i Kristian Augusts gate fra dagens butikk i Universitetsgata.'}
            ],
            guiding_questions:[
              'Hvilke typer litteratur får mest synlig plass når du undersøker butikken i dag?',
              'Hvordan skiller kuratering i en bokhandel seg fra bevaring i et nasjonalbibliotek?',
              'Hva kan butikkens inndeling fortelle om hvilke lesergrupper og sjangre den henvender seg til?',
              'Hvilke deler av Tronsmos historie kan observeres på stedet, og hvilke krever eksterne kilder?'
            ],
            concepts:['litterært felt','kuratering','formidling','litterær offentlighet','distribusjon','leserpraksis'],
            observable_traces:[
              {title:'Hyller og avdelinger',observation:'Avdelingsnavn og plassering gjør butikkens nåværende prioritering av sjangre og uttrykk fysisk synlig.',interpretation_boundary:'Et øyeblikksbilde av hyllene beviser ikke historisk kontinuitet, salgstall eller faktisk leseradferd.',source_urls:[official]},
              {title:'Tegneserier i butikkrommet',observation:'Den tydelige tegneserieprofilen kan sammenholdes med Tronsmos egen beskrivelse av avdelingens rolle.',interpretation_boundary:'Synlighet i rommet viser formidling og prioritering, men ikke at alle kunder bruker avdelingen likt.',source_urls:[official]},
              {title:'Fasaden fra 2017',observation:'Dokumentarfotoet viser konkrete vindusdekorasjoner av Lars Fiske og Bendik Kaltenborn ved Tronsmo i 2017.',interpretation_boundary:'Fotografiet dokumenterer ett tidspunkt og kan ikke brukes som bevis for fasadens utforming i dag.',source_urls:[commons]}
            ],
            source_urls:[official,snl,petterson,commons]
          };
          write(placePath,place);

          function findSibling(obj,key){if(!obj||typeof obj!=='object')return null;if(Object.prototype.hasOwnProperty.call(obj,key))return obj;for(const v of Object.values(obj)){const hit=findSibling(v,key);if(hit)return hit;}return null;}
          const index=findSibling(registry,'gamle_deichman');
          if(!index)throw new Error('Could not locate place fagverk index');
          index.tronsmo_bokhandel={sourceFile:'places/litteratur/oslo/places_litteratur/tronsmo_bokhandel.json',field:'fagverk',schema:'history_go_place_fagverk_v2',level:'standard',status:'curated'};
          write(registryPath,registry);

          const workcard=read(workcardPath);workcard.place_id='tronsmo_bokhandel';workcard.category='litteratur';write(workcardPath,workcard);

          const sha=s=>crypto.createHash('sha256').update(s).digest('hex');
          const sentenceRows=(text,claimIds)=>text.split(/\n\s*\n/u).flatMap(p=>p.split(/(?<=[.!?])\s+/u)).filter(Boolean).map((_,i)=>({sentence:i+1,claimIds:[claimIds[Math.min(i,claimIds.length-1)]]}));
          const claims=[
            {id:'claim_tronsmo_foundation',claim:'Tronsmo Bokhandel ble grunnlagt i 1973 og utviklet en uavhengig, radikal profil.',sourceUrl:snl,sourceLocation:'Hovedartikkel',sourceType:'recognized',verifiedAt:'2026-09-10',status:'verified',claimKind:'identity',evidenceMode:'direct',temporalStatus:'historical',timelineYear:1973},
            {id:'claim_tronsmo_address',claim:'Tronsmo holder siden 2015 til i Universitetsgata 12 etter perioden i Kristian Augusts gate.',sourceUrl:snl,sourceLocation:'Historikk og adresse',sourceType:'recognized',verifiedAt:'2026-09-10',status:'verified',claimKind:'ordinary',evidenceMode:'direct',temporalStatus:'current',timelineYear:2015},
            {id:'claim_tronsmo_curation',claim:'Tronsmo beskriver sitt utvalg som kuratert og ikke styrt av bestselgerlister alene.',sourceUrl:official,sourceLocation:'Om Tronsmo',sourceType:'primary',verifiedAt:'2026-09-10',status:'verified',claimKind:'ordinary',evidenceMode:'direct',temporalStatus:'current'},
            {id:'claim_tronsmo_comics',claim:'Tronsmo framhever en omfattende tegneserieavdeling som del av butikkens profil.',sourceUrl:official,sourceLocation:'Om Tronsmo',sourceType:'primary',verifiedAt:'2026-09-10',status:'verified',claimKind:'ordinary',evidenceMode:'direct',temporalStatus:'current'},
            {id:'claim_tronsmo_petterson',claim:'Per Petterson arbeidet mange år på Tronsmo før forfatterskapet ble hovedyrket.',sourceUrl:petterson,sourceLocation:'Biografi',sourceType:'recognized',verifiedAt:'2026-09-10',status:'verified',claimKind:'ordinary',evidenceMode:'direct',temporalStatus:'historical'},
            {id:'claim_tronsmo_anniversary',claim:'Tronsmos 40-årsjubileumsboks fra 2013 samlet 110 bidragsytere og kom i 1500 nummererte eksemplarer.',sourceUrl:officialBox,sourceLocation:'Produktbeskrivelse',sourceType:'primary',verifiedAt:'2026-09-10',status:'verified',claimKind:'ordinary',evidenceMode:'direct',temporalStatus:'historical',timelineYear:2013},
            {id:'claim_tronsmo_facade',claim:'Et Wikimedia Commons-foto fra 2017 identifiserer vindusdekorasjoner av Lars Fiske og Bendik Kaltenborn ved Tronsmo.',sourceUrl:commons,sourceLocation:'File description',sourceType:'institutional',verifiedAt:'2026-09-10',status:'verified',claimKind:'ordinary',evidenceMode:'direct',temporalStatus:'historical',timelineYear:2017}
          ];
          const descIds=['claim_tronsmo_foundation','claim_tronsmo_address','claim_tronsmo_curation'];
          const popupIds=['claim_tronsmo_foundation','claim_tronsmo_address','claim_tronsmo_curation','claim_tronsmo_comics','claim_tronsmo_petterson','claim_tronsmo_anniversary','claim_tronsmo_facade'];
          const packet={schemaVersion:'4.2',validatorVersion:'4.2.1',placeId:place.id,placeFile:placePath,status:'ready_v4_2',identity:{status:'resolved',represents:'Den aktive Tronsmo-butikken i Universitetsgata 12 og dens dokumenterte institusjonshistorie.',period:'1973–',excludes:['andre bokhandler','forfattere uten direkte dokumentert stedstilknytning','den tidligere adressen som dagens kartpunkt']},metadataSnapshot:{name:place.name,year:place.year,category:place.category},textHashes:{algorithm:'sha256',desc:sha(place.desc),popupDesc:sha(place.popupDesc)},claims,sentenceCoverage:{desc:sentenceRows(place.desc,descIds),popupDesc:sentenceRows(place.popupDesc,popupIds)},roundsReadiness:{people:'ready_direct_verified',objects:'ready',brands:'ready',productions:'ready',quiz:'ready_4x7',leksikon:'ready',sprak:'ready',readings:'ready'},quizReadiness:{status:'canonical_standard_4x7',quizTargetId:place.id,sourceBrief:'data/quiz/production_briefs/litteratur/tronsmo_bokhandel.json',productionContext:'data/quiz/production_context/litteratur/tronsmo_bokhandel.json',totalQuestions:28}};
          write('data/places/production/tronsmo_bokhandel.json',packet);
          NODE
          node scripts/place-production-rule-preflight.mjs record --workcard reports/place-production/tronsmo-bokhandel-workcard-current.json --place-id tronsmo_bokhandel --category litteratur
      - name: Run targeted diagnostics without weakening gates
        run: |
          set +e
          LOG=reports/place-production/tronsmo-targeted-ci-diagnostics.txt
          : > "$LOG"
          for CMD in \
            "npx tsx tools/validate_lesespor.mts" \
            "node scripts/place-production-rule-preflight.mjs validate --workcard reports/place-production/tronsmo-bokhandel-workcard-current.json" \
            "node scripts/audit-fagverk-place-pages.mjs" \
            "node scripts/validate-place-description-production-v4_2_policy.mjs --all" \
            "npm run test:quiz-content-audit" \
            "npm run test:quiz-production"
          do
            echo "===== $CMD =====" >> "$LOG"
            bash -lc "$CMD" >> "$LOG" 2>&1
            echo "exit=$?" >> "$LOG"
          done
          cat "$LOG"
          exit 0
      - name: Commit repaired production state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/litteratur/oslo/places_litteratur/tronsmo_bokhandel.json data/lesespor/oslo/lesespor_oslo_litteratur.json data/fagverk/fagverk_registry.json data/places/production/tronsmo_bokhandel.json reports/place-production/tronsmo-bokhandel-workcard-current.json reports/place-production/tronsmo-targeted-ci-diagnostics.txt
          if ! git diff --cached --quiet; then
            git commit -m "Repair Tronsmo production contracts [tronsmo-repair]"
            git push
          fi
