name: One-time refresh Deichman production context

on:
  push:
    branches:
      - agent/stensparken-place-popup-system
    paths:
      - .github/workflows/one-time-refresh-deichman-production-context.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out popup branch
        uses: actions/checkout@v4
        with:
          ref: agent/stensparken-place-popup-system
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild affected production context
        run: npm run quiz:context -- --category by --target deichman_bjorvika --output data/quiz/production_context/by/deichman_bjorvika.json

      - name: Validate production packages
        run: |
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run test:quiz-production

      - name: Commit refreshed context and remove diagnostics
        run: |
          git rm .github/workflows/one-time-refresh-deichman-production-context.yml
          git rm reports/place-popup-quiz-ci-diagnostic.log
          git add data/quiz/production_context/by/deichman_bjorvika.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Deichman quiz context after place index rebuild"
          git push origin HEAD:agent/stensparken-place-popup-system
