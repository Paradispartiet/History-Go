name: Oslo Politikk pointer and reading pane verification
on:
  push:
    branches:
      - fix/oslo-politikk-quizcard-scroll-20261111
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check tests/oslo-politikk-six-browser.mjs
      - run: echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: node tests/oslo-politikk-six-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oslo-politikk-pointer-reading-pane-20261111
          path: artifacts/oslo-politikk-six-browser/
          if-no-files-found: warn
          retention-days: 14
