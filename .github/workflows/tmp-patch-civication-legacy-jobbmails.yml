name: Temporary Civication scene audit patch

on:
  push:
    branches:
      - fix/civication-legacy-jobbmails-reachability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/civication-legacy-jobbmails-reachability
          fetch-depth: 0
      - name: Apply narrow reachability patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          audit_path = Path('scripts/audit-civication-scene-pipeline.mjs')
          text = audit_path.read_text()

          marker = 'const DEFAULT_LEGACY_PLAN_TYPES = Object.freeze([\n'
          insert = '''const LEGACY_INVENTORY_SCENE_ROOTS = Object.freeze([\n  "data/Civication/jobbmails"\n]);\n\n'''
          assert marker in text, 'legacy-root insertion marker missing'
          text = text.replace(marker, insert + marker, 1)

          marker = 'export function auditRepository(repoRoot = DEFAULT_REPO_ROOT) {\n'
          helper = '''function isLegacyInventorySceneSource(sourcePath) {\n  const relative = norm(sourcePath).replace(/\\\\/g, "/");\n  return LEGACY_INVENTORY_SCENE_ROOTS.some(\n    (root) => relative === root || relative.startsWith(`${root}/`)\n  );\n}\n\nexport function findDuplicateSceneIds(sceneRecords, ignoredSourceFiles = []) {\n  const ignored = ignoredSourceFiles instanceof Set\n    ? ignoredSourceFiles\n    : new Set(uniq(ignoredSourceFiles));\n  const ids = new Map();\n\n  for (const record of Array.isArray(sceneRecords) ? sceneRecords : []) {\n    if (!norm(record?.id)) continue;\n    if (ignored.has(record.source_path) || isLegacyInventorySceneSource(record.source_path)) continue;\n    if (!ids.has(record.id)) ids.set(record.id, []);\n    ids.get(record.id).push(record);\n  }\n\n  return [...ids.entries()]\n    .filter(([, rows]) => rows.length > 1)\n    .map(([id, rows]) => ({\n      id,\n      occurrences: rows.map((row) => ({\n        path: row.source_path,\n        pointer: row.pointer,\n        type: row.mail_type,\n        family: row.mail_family\n      }))\n    }))\n    .sort((a, b) => a.id.localeCompare(b.id, "en"));\n}\n\n'''
          assert marker in text, 'audit helper insertion marker missing'
          text = text.replace(marker, helper + marker, 1)

          start_marker = '  const compilerIgnoredSourceFiles = new Set(uniq(compiledRegistry?.ignored_source_files));\n'
          end_marker = '\n\n  const missingInternalReferences = [];'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''  const compilerIgnoredSourceFiles = new Set(uniq(compiledRegistry?.ignored_source_files));\n  const duplicateSceneIds = findDuplicateSceneIds(sceneRecords, compilerIgnoredSourceFiles);'''
          text = text[:start] + replacement + text[end:]
          audit_path.write_text(text)

          test_path = Path('tests/civication-scene-pipeline-ignored-source-duplicates.test.js')
          test_path.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport path from "node:path";\n\nimport {\n  auditRepository,\n  DEFAULT_REPO_ROOT,\n  findDuplicateSceneIds\n} from "../scripts/audit-civication-scene-pipeline.mjs";\n\nconst registryPath = path.join(\n  DEFAULT_REPO_ROOT,\n  "data/Civication/compiledSceneRegistryV1.json"\n);\nconst registry = JSON.parse(fs.readFileSync(registryPath, "utf8"));\nconst ignoredSourceFiles = new Set(registry.ignored_source_files || []);\nconst transitionSource = "data/Civication/mailFamilies/naeringsliv/job/mellomleder_fraksjonsvalg.json";\nconst legacyJobmailSources = [\n  "data/Civication/jobbmails/byCivic.json",\n  "data/Civication/jobbmails/mediaCivic.json",\n  "data/Civication/jobbmails/naeringCivic.json"\n];\n\nassert.ok(\n  ignoredSourceFiles.has(transitionSource),\n  `${transitionSource} must remain compiler-ignored while it is a transition source`\n);\nassert.ok(\n  !(registry.compiled_source_files || []).includes(transitionSource),\n  `${transitionSource} must not be compiled into the runtime registry`\n);\n\nconst audit = auditRepository(DEFAULT_REPO_ROOT);\nconst duplicateBlockers = (audit.blocking_issues || []).filter(\n  (issue) => issue.category === "duplicate_scene_id"\n);\nconst inventoriedSceneSources = new Set(\n  (audit.inventory?.formats || []).flatMap((row) => row.paths || [])\n);\n\nfor (const source of legacyJobmailSources) {\n  assert.ok(\n    inventoriedSceneSources.has(source),\n    `${source} must remain inventoried as legacy scene source`\n  );\n}\n\nfor (const issue of duplicateBlockers) {\n  for (const occurrence of issue.occurrences || []) {\n    assert.ok(\n      !ignoredSourceFiles.has(occurrence.path),\n      `duplicate blocker ${issue.id} must not include compiler-ignored source ${occurrence.path}`\n    );\n    assert.ok(\n      !occurrence.path.startsWith("data/Civication/jobbmails/"),\n      `duplicate blocker ${issue.id} must not include legacy jobbmails source ${occurrence.path}`\n    );\n  }\n}\n\nassert.ok(\n  !duplicateBlockers.some((issue) => issue.id === "ml_faction_001"),\n  "ml_faction_001 must not be a canonical duplicate blocker when its transition occurrence is compiler-ignored"\n);\nassert.ok(\n  !duplicateBlockers.some((issue) => issue.id === "nav_001"),\n  "nav_001 must not be a canonical duplicate blocker when every duplicate occurrence is legacy jobbmails debt"\n);\n\nconst syntheticDuplicates = findDuplicateSceneIds([\n  {\n    id: "runtime_duplicate_probe",\n    source_path: "data/Civication/mailFamilies/probe/a.json",\n    pointer: "$.mails[0]",\n    mail_type: "job",\n    mail_family: "probe"\n  },\n  {\n    id: "runtime_duplicate_probe",\n    source_path: "data/Civication/mailFamilies/probe/b.json",\n    pointer: "$.mails[0]",\n    mail_type: "job",\n    mail_family: "probe"\n  },\n  {\n    id: "legacy_duplicate_probe",\n    source_path: "data/Civication/jobbmails/a.json",\n    pointer: "$.mails[0]",\n    mail_type: "job",\n    mail_family: "probe"\n  },\n  {\n    id: "legacy_duplicate_probe",\n    source_path: "data/Civication/jobbmails/b.json",\n    pointer: "$.mails[0]",\n    mail_type: "job",\n    mail_family: "probe"\n  }\n]);\n\nassert.deepEqual(\n  syntheticDuplicates.map((issue) => issue.id),\n  ["runtime_duplicate_probe"],\n  "duplicate IDs across active mailFamilies sources must still block while legacy jobbmails duplicates stay non-blocking"\n);\n\nconsole.log("civication-scene-pipeline-ignored-source-duplicates.test.js: OK");\n''')
          PY
      - name: Run focused regression
        run: node tests/civication-scene-pipeline-ignored-source-duplicates.test.js
      - name: Verify duplicate audit is clean
        shell: bash
        run: |
          node scripts/audit-civication-scene-pipeline.mjs --json > /tmp/scene-audit.json
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/scene-audit.json', 'utf8'));
          if (audit.summary.duplicate_scene_ids !== 0) {
            console.error(JSON.stringify(audit.inventory.duplicate_scene_ids, null, 2));
            process.exit(1);
          }
          console.log(`duplicate_scene_ids=${audit.summary.duplicate_scene_ids}; blocking_issues=${audit.summary.blocking_issues}`);
          NODE
      - name: Commit permanent files only
        shell: bash
        run: |
          git rm .github/workflows/tmp-patch-civication-legacy-jobbmails.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-civication-scene-pipeline.mjs tests/civication-scene-pipeline-ignored-source-duplicates.test.js
          git commit -m "fix(civication): exclude legacy jobbmails from duplicate blockers"
          git push origin HEAD:fix/civication-legacy-jobbmails-reachability
