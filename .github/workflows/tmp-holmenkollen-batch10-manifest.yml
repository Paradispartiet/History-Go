name: Temporary Holmenkollen batch 10 manifest patch

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/people/sport/oslo/holmenkollen_nasjonalanlegg/**'
      - 'reports/people-holmenkollen-batch10-*.md'
      - '.github/workflows/tmp-holmenkollen-batch10-manifest.yml'
  push:
    branches:
      - data/people-holmenkollen-batch10-20260718

permissions:
  contents: write

jobs:
  patch-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/people-holmenkollen-batch10-20260718
          fetch-depth: 0

      - name: Patch people manifest
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/people/manifest.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const additions = [
            'people/sport/oslo/holmenkollen_nasjonalanlegg/toini_gustafsson.json',
            'people/sport/oslo/holmenkollen_nasjonalanlegg/klavdija_bojarskikh.json',
            'people/sport/oslo/holmenkollen_nasjonalanlegg/helena_takalo.json',
            'people/sport/oslo/holmenkollen_nasjonalanlegg/hilkka_riihivuori.json',
            'people/sport/oslo/holmenkollen_nasjonalanlegg/jelena_valbe.json',
          ];
          const missing = additions.filter((item) => !data.files.includes(item));
          if (!missing.length) {
            console.log('Manifest already contains all batch 10 entries');
            process.exit(0);
          }
          const anchor = 'people/sport/oslo/holmenkollen_nasjonalanlegg/hallgeir_brenden.json';
          const index = data.files.indexOf(anchor);
          if (index === -1) throw new Error(`Manifest anchor missing: ${anchor}`);
          data.files.splice(index + 1, 0, ...missing);
          fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          console.log(`Added ${missing.length} manifest entries`);
          NODE

      - name: Commit manifest patch when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/people/manifest.json
          if git diff --cached --quiet; then
            echo "Manifest already patched"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Register Holmenkollen batch 10 people [manifest-patched]"
          git push origin HEAD:data/people-holmenkollen-batch10-20260718
