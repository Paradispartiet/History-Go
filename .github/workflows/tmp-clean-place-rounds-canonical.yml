name: Temporary canonical rounds cleanup

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/clean-place-rounds-canonical'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply canonical four-round cleanup
        run: python .github/scripts/tmp_clean_rounds.py
      - name: Run focused round tests
        run: |
          node --test tests/place-rounds-visual-collections.test.mjs tests/place-rounds-grid-exclusivity.test.mjs tests/place-rounds-fill-layout.test.mjs
          node tests/place-card-rounds-runtime-audit.test.js
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/README_place_rounds.md docs/PLACE_PRODUCTION_CHECKLIST.md docs/PLACE_STANDARD.md docs/PLACE_POPUP_SYSTEM.md docs/DATA_PRODUCTION_CONTRACT.md docs/HISTORY_GO_PRODUCT_MAP.md schemas/place.ts js/ui/place-rounds-visual-collections.js js/ui/place-card.js js/ui/place-rounds-fill-layout.js css/place-rounds-fill-layout.css .github/workflows/place-rounds-governance.yml tests/place-rounds-visual-collections.test.mjs tests/place-rounds-grid-exclusivity.test.mjs tests/place-rounds-fill-layout.test.mjs tests/place-card-rounds-runtime-audit.test.js tests/beierbrua-rounds-batch1.test.js tests/nedre-foss-rounds-batch1.test.js tests/kuba-parken-nature-rounds-batch1.test.js tests/oslo-blue-plaques-2026-round-content.test.js tests/skanevik-idrettsanlegg-batch1-round-content.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rydd canonical PlaceCard-rundinger til fast fire'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
