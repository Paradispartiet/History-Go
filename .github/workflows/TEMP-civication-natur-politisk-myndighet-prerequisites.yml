name: TEMP Civication Natur Politisk myndighet prerequisites

on:
  push:
    branches:
      - agent/civication-natur-politisk-myndighet-prerequisites-20260907
  workflow_dispatch:

concurrency:
  group: temp-civication-natur-politisk-myndighet-prerequisites
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/civication-natur-politisk-myndighet-prerequisites-20260907
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Syntax-check TEMP materializer
        run: node --check scripts/TEMP_materialize_natur_politisk_myndighet_prerequisites.mjs

      - name: Materialize prerequisite candidate
        run: node scripts/TEMP_materialize_natur_politisk_myndighet_prerequisites.mjs

      - name: Build generated prerequisite surfaces
        run: |
          set -euo pipefail
          node scripts/audit-civication-role-packs.mjs
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
          node scripts/build-civication-scene-registry.mjs --write
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts

      - name: Verify complete prerequisite candidate
        run: |
          set -euo pipefail
          node tests/civication-natur-politisk-myndighet-prerequisites.test.js
          node tests/civication-career-gameplay-matrix.test.js
          node tests/civication-role-world-rollout-readiness.test.js
          node scripts/build-civication-scene-registry.mjs --check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node --test tests/civication-scenario-people.test.mjs
          node tests/run-civication-tests.mjs
          npm run audit:job-learning-profiles
          npm run audit:job-knowledge-requirements

      - name: Repository diff hygiene
        run: git diff --check

      - name: Commit verified permanent prerequisites
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/TEMP_materialize_natur_politisk_myndighet_prerequisites.mjs
          rm -f .github/workflows/TEMP-civication-natur-politisk-myndighet-prerequisites.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.' >&2
            exit 1
          fi
          git diff --cached --check
          git status --short
          git commit -m "Complete Natur Politisk myndighet prerequisites"
          git push origin HEAD:agent/civication-natur-politisk-myndighet-prerequisites-20260907
