name: TEMP place production final polish

on:
  push:
    branches:
      - agent/place-production-checklist-20260728

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/place-production-checklist-20260728
          fetch-depth: 0

      - name: Patch final checklist details
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          checklist = Path('docs/PLACE_PRODUCTION_CHECKLIST.md')
          text = checklist.read_text()
          anchor = '- [ ] place-search finner stedet på forventede navn/aliaser;\n\n---\n\n## 25. Leksikon\n'
          replacement = '''- [ ] place-search finner stedet på forventede navn/aliaser;\n\n### Søk, aliaser og i18n\n\n- [ ] canonical navn er riktig;\n- [ ] relevante aliaser/navnevarianter er vurdert;\n- [ ] stedets i18n-/oversettelsesdata er kontrollert når datasettet støtter dette;\n- [ ] ingen oversettelse eller alias endrer stedets fysiske identitet;\n- [ ] relevant i18n-place-gate kjøres når slike data endres.\n\n### Offentlig hjemsted\n\nVurderes eksplisitt, men er ikke krav for alle steder.\n\n- [ ] stedet er et eksisterende canonical History GO-sted;\n- [ ] det er ikke en privat adresse;\n- [ ] lat/lon/radius er egnet for offentlig representasjon;\n- [ ] privacy/synlighet følger eksisterende hjemstedsmodell;\n- [ ] markér N/A når stedet ikke skal ha denne rollen.\n\n---\n\n## 25. Leksikon\n'''
          if '### Offentlig hjemsted' not in text:
              if anchor not in text:
                  raise SystemExit('Fant ikke relations/NextUp-anker i checklist')
              text = text.replace(anchor, replacement, 1)
          qa_anchor = '- [ ] emne IDs er gyldige.\n'
          if '- [ ] i18n/alias-data er gyldige når de endres.\n' not in text:
              text = text.replace(qa_anchor, qa_anchor + '- [ ] i18n/alias-data er gyldige når de endres.\n', 1)
          final_anchor = '- [ ] Nearby/Søk;\n'
          if '- [ ] offentlig hjemsted vurdert / N/A;\n' not in text:
              text = text.replace(final_anchor, final_anchor + '- [ ] offentlig hjemsted vurdert / N/A;\n', 1)
          checklist.write_text(text)

          standard = Path('docs/PLACE_STANDARD.md')
          text = standard.read_text()
          anchor = 'Ikke opprett koblinger bare for completeness.\n\n---\n\n## 18. Social Meet / Spotmeeting\n'
          replacement = '''Ikke opprett koblinger bare for completeness.\n\nSøk/aliaser og i18n skal også kontrolleres når stedets datasett bruker dette.\n\n### Offentlig hjemsted\n\nEt place kan brukes som offentlig hjemsted bare når det er et eksisterende canonical History GO-sted, ikke er en privat adresse, har egnet koordinat/radius og følger eksisterende privacy-/synlighetsmodell. Dette vurderes per sted og kan være N/A.\n\n---\n\n## 18. Social Meet / Spotmeeting\n'''
          if '### Offentlig hjemsted' not in text:
              if anchor not in text:
                  raise SystemExit('Fant ikke Nearby-anker i PLACE_STANDARD')
              text = text.replace(anchor, replacement, 1)
          standard.write_text(text)

          js = Path('js/ui/place-rounds-visual-collections.js')
          text = js.read_text()
          old = '''    // Legacy place-kategorier beholdes som presentasjonskompatibilitet. De er ikke\n    // en ny badge-taksonomi og endrer ingen eksisterende Brands-data.\n'''
          new = '''    // Full canonical place-kategoridekning beholdes eksplisitt. I tillegg finnes\n    // noen legacy presentasjonskategorier; ingen av dem endrer Brands-semantikken.\n'''
          if old in text:
              text = text.replace(old, new, 1)
          js.write_text(text)
          PY

      - name: Self-remove and commit
        shell: bash
        run: |
          rm .github/workflows/tmp-place-production-final-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PLACE_PRODUCTION_CHECKLIST.md docs/PLACE_STANDARD.md js/ui/place-rounds-visual-collections.js .github/workflows/tmp-place-production-final-polish.yml
          git commit -m "docs: complete place-by-place checklist edge cases"
          git push origin HEAD:agent/place-production-checklist-20260728
