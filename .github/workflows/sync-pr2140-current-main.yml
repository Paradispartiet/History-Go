name: Temporary final sync PR 2140

on:
  push:
    branches:
      - data/people-jordal-amfi-batch1-20260714
    paths:
      - .github/workflows/sync-pr2140-current-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/people-jordal-amfi-batch1-20260714
          fetch-depth: 0
      - name: Merge current main and preserve Jordal manifest entries
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          set -e

          manifest='data/people/manifest.json'
          if git ls-files -u -- "$manifest" | grep -q .; then
            git checkout --theirs -- "$manifest"
            python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/people/manifest.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          files = payload['files']
          additions = [
              'people/sport/oslo/jordal_amfi/valerenga_ishockey.json',
              'people/sport/oslo/jordal_amfi/steinar_bjolbakk.json',
              'people/sport/oslo/jordal_amfi/jim_marthinsen.json',
              'people/sport/oslo/jordal_amfi/geir_myhre.json',
              'people/sport/oslo/jordal_amfi/arne_billkvam.json',
          ]
          files[:] = [item for item in files if item not in additions]
          intility_positions = [
              index for index, item in enumerate(files)
              if item.startswith('people/sport/oslo/intility_arena/')
          ]
          if not intility_positions:
              raise SystemExit('Intility manifest anchor not found')
          insert_at = max(intility_positions) + 1
          files[insert_at:insert_at] = additions
          path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
            git add "$manifest"
          fi

          if git ls-files -u | grep -q .; then
            echo 'Unresolved conflicts remain:'
            git ls-files -u
            exit 1
          fi

          git rm .github/workflows/sync-pr2140-current-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync Jordal batch with current main'
          git push origin HEAD:data/people-jordal-amfi-batch1-20260714
