name: House of Nerds one-shot concept and epoch sync
on:
  push:
    branches:
      - place/house-of-nerds-integration-20261102
    paths:
      - '.github/workflows/house-of-nerds-concepts-sync.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Canonical Knowledge and release rebuild
        run: |
          node scripts/build-quiz-production-context.mjs --category subkultur --target house_of_nerds --output data/quiz/production_context/subkultur/house_of_nerds.json
          npm run knowledge:canonical:write
          node scripts/build-fagverk-release-manifest.mjs
          npm run epoker:places:build
          npm run place-open:build
      - name: Inspect actual Subkultur Knowledge audit
        run: |
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --audit-only
          node - <<'NODE'
          const r=require('./reports/knowledge-contract-audit.json');
          const w=(r.warnings||[]).filter(x=>x.subject_id==='subkultur');
          const f=(r.failures||[]).filter(x=>x.subject_id==='subkultur');
          console.log('Subkultur warning count:',w.length,JSON.stringify(w.slice(0,4)).slice(0,2500));
          console.log('Subkultur failure count:',f.length,JSON.stringify(f.slice(0,4)).slice(0,2500));
          NODE
      - name: Check bounded diff and commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --stat
          changed=$(git diff --name-only | wc -l)
          echo "Generated changed files: $changed"
          test "$changed" -le 50
          git add -A -- data/knowledge/ data/quiz/subkultur/house_of_nerds_sets.json data/quiz/production_context/subkultur/house_of_nerds.json reports/knowledge-id-backfill.json data/fagverk/fagverk_release.json data/epoker/epoke-place-index.json data/runtime/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Sync House of Nerds concept-linked Knowledge and epoch index'
            git push origin HEAD:place/house-of-nerds-integration-20261102
          fi
