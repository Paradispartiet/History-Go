name: Apply collision-safe Nedre Foss rounds batch

on:
  push:
    branches: [agent/fill-nedre-foss-history-rounds-batch1]
    paths:
      - '.github/workflows/nedre-foss-rounds-apply-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fill-nedre-foss-history-rounds-batch1
          fetch-depth: 0
      - name: Materialize collision-safe batch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p reports/nedre-foss-rounds-batch1/validation

          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          def read(p): return json.loads(Path(p).read_text())
          def write(p, v):
              Path(p).parent.mkdir(parents=True, exist_ok=True)
              Path(p).write_text(json.dumps(v, ensure_ascii=False, indent=2) + '\n')

          place_path = Path('data/places/natur/oslo/places_oslo_natur_akerselvarute/nedre_foss.json')
          place = read(place_path)
          assert (place['lat'], place['lon'], place['r']) == (59.9256, 10.7435, 140)

          urls = {
            'park':'https://www.oslo.kommune.no/natur-kultur-og-fritid/tur-og-friluftsliv/parker-og-lekeplasser/nedre-foss-park',
            'snl_foss':'https://snl.no/Foss_-_Oslo',
            'byleks_foss':'https://oslobyleksikon.no/side/Foss_g%C3%A5rd',
            'industri':'https://www.industrimuseum.no/akerselvadigitalt',
            'energi':'https://www.oslo.kommune.no/OBA/tobias/tobiasartikler/Tob2007-2-3_3.htm',
            'miljopark':'https://oslobyleksikon.no/side/Akerselva_Milj%C3%B8park',
            'friedrich':'https://snl.no/Friedrich_Gr%C3%BCner',
            'grunerlokka':'https://snl.no/Gr%C3%BCnerl%C3%B8kka_-_boligstr%C3%B8k_i_Oslo'
          }
          links = [
            {'type':'reference','label':'Oslo kommune – Nedre Foss park','url':urls['park'],'lang':'nb','verifiedAt':'2026-07-19'},
            {'type':'reference','label':'Store norske leksikon – Foss (Oslo)','url':urls['snl_foss'],'lang':'nb','verifiedAt':'2026-07-19'},
            {'type':'reference','label':'Oslo byleksikon – Foss gård','url':urls['byleks_foss'],'lang':'nb','verifiedAt':'2026-07-19'},
            {'type':'reference','label':'Industrimuseum – Akerselva Digitalt','url':urls['industri'],'lang':'nb','verifiedAt':'2026-07-19'},
            {'type':'reference','label':'Oslo kommune / Byarkivet – Energien i elva','url':urls['energi'],'lang':'nb','verifiedAt':'2026-07-19'},
            {'type':'reference','label':'Oslo byleksikon – Akerselva Miljøpark','url':urls['miljopark'],'lang':'nb','verifiedAt':'2026-07-19'},
            {'type':'reference','label':'Store norske leksikon – Friedrich Grüner','url':urls['friedrich'],'lang':'nb','verifiedAt':'2026-07-19'},
            {'type':'reference','label':'Store norske leksikon – Grünerløkka','url':urls['grunerlokka'],'lang':'nb','verifiedAt':'2026-07-19'}
          ]

          place.update({
            'year':1220,
            'desc':'Møllested dokumentert i 1220 ved Akerselvas nederste foss, senere Kongens mølle og et av byens lengstlevende vannkraft- og produksjonssteder.',
            'popupDesc':'Nedre Foss er den nederste fossen i Akerselva og et av Oslos eldste dokumenterte produksjonssteder. Oslo kommune knytter en mølle her til perioden mellom 1148 og 1200, mens den sikre skriftlige omtalen er fra 1220, da kverna lå under Hovedøya kloster. Etter reformasjonen ble anlegget krongods og kjent som Kongens mølle.\n\nFriedrich Grüner kjøpte Nedre Foss av kongen i 1672. Eiendommen omfattet store arealer som senere ble en del av Grünerløkka. Mølle- og kornvirksomheten fortsatte gjennom teknologiske skifter; hovedbygningen fra 1801/1802 står fortsatt, og kornsiloen fra 1953 ble ombygd til studentboliger i 2001.\n\nDagens park bruker møllehistorien aktivt i lekelandskapet. Samtidig viser laksetrapp, regnbed og nye ganglinjer hvordan et gammelt produksjonslandskap også er blitt naturkorridor, klimatilpasning og offentlig byrom.',
            'tags':['akerselva','foss','middelalder','hovedoya_kloster','kornmolle','kongens_molle','vannkraft','friedrich_gruner','industrihistorie','kornsilo','byomforming','miljopark','bynatur'],
            'quiz_profile':{
              'place_type':'middelaldersk møllested, foss og transformert produksjonslandskap','subtype':'akerselva_kornmolle_kongens_molle_og_miljopark',
              'signature_features':['kvern under Hovedøya kloster dokumentert i 1220','Kongens mølle etter reformasjonen','Friedrich Grüners kjøp i 1672','hovedbygning fra 1801/1802','kornsilo fra 1953 ombygd til studentboliger i 2001','park med mølleinspirert lekelandskap, laksetrapp og regnbed'],
              'primary_angles':['middelalder_og_klosterokonomi','vannkraft_og_mollebruk','kongemakt_og_privilegier','eierskap_og_byvekst','industriell_kontinuitet','miljopark_og_byomforming'],
              'question_families':['historisk_endring','stedsspesifikk_funksjon','person_og_eierskap','verk_og_bygning','for_nå','kildekritikk'],
              'avoid_angles':['generisk_akerselva','udokumenterte_geologipastander','hardkoding_av_skiftende_virksomheter','blande_etableringsvinduet_1148_1200_med_forste_skriftlige_belegg_1220'],
              'must_include':['Hovedøya kloster','1220','Kongens mølle','Friedrich Grüner','1672','1801/1802','1953','2001'],
              'contrast_targets':['beierbrua','vulkan_industriomrade','glads_molle'],
              'notes':'Canonical år er 1220 fordi dette er første dokumenterte omtale. Oslo kommunes etableringsvindu 1148–1200 beholdes som en egen, tydelig merket opplysning.'
            },
            'externalLinks':links,
            'underbadge_ids':['middelalder','tidlig_modernetid','attenhundretallet','nittenhundre_1900_1945','etterkrigstid','samtidshistorie','byhistorie','industrihistorie','kulturminner_og_bevaring'],
            'works':[
              {'id':'nedre_foss_middelaldermollen','title':'Mølla ved Nedre Foss','type':'produksjonsanlegg','kind':'water_powered_grain_mill','year':1220,'desc':'Kverna er dokumentert under Hovedøya kloster i 1220; Oslo kommune daterer etableringen til perioden 1148–1200.','why_here':'Fossen ga energien som gjorde langvarig kornmaling mulig akkurat her.'},
              {'id':'nedre_foss_kongens_molle','title':'Kongens mølle','type':'historisk_driftsform','kind':'royal_grain_mill','year':1537,'desc':'Etter reformasjonen ble Nedre Foss krongods og mølla kjent som Kongens mølle.','why_here':'Viser overgangen fra klosterøkonomi til kongelig eiendom.'},
              {'id':'nedre_foss_friedrich_gruner_1672','title':'Friedrich Grüners kjøp','type':'historisk_eierskap','kind':'estate_ownership','year':1672,'desc':'Friedrich Grüner kjøpte Nedre Foss med Kongens mølle av kongen.','why_here':'Kjøpet knytter personen fysisk til stedet og forklarer en viktig del av navnet Grünerløkka.'},
              {'id':'nedre_foss_hovedbygning_1801','title':'Nedre Foss hovedbygning','type':'historisk_bygning','kind':'estate_main_building','year':1801,'desc':'Hovedbygningen ble oppført i 1801/1802 og står fortsatt.','why_here':'Bygningen er et fysisk anker for gårds- og møllehistorien.'},
              {'id':'nedre_foss_kornsilo_1953','title':'Kornsiloen på Nedre Foss','type':'industribygning','kind':'grain_silo','year':1953,'desc':'Den karakteristiske kornsiloen videreførte stedets lange kornhistorie i moderne industriell form.','why_here':'Siloen gjør kontinuiteten fra mølle til moderne kornlagring synlig.'},
              {'id':'nedre_foss_studenthus_2001','title':'Grünerløkka studenthus','type':'ombruk','kind':'adaptive_reuse','year':2001,'desc':'Den tidligere kornsiloen ble ombygd til studentboliger.','why_here':'Et tydelig eksempel på industriarv som får ny funksjon.'},
