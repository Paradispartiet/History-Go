              {'id':'nedre_foss_laksetrapp','title':'Laksetrappen ved Nedre Foss','type':'miljotiltak','kind':'fish_passage','year':None,'desc':'Laksetrappen på østsiden av fossen hjelper fisk forbi fallet.','why_here':'Viser dagens økologiske forvaltning av et gammelt kraftpunkt.'},
              {'id':'nedre_foss_regnbed','title':'Regnbedene i Nedre Foss park','type':'klimatiltak','kind':'stormwater_management','year':None,'desc':'Regnbedene bidrar til å håndtere overvann og flomutfordringer.','why_here':'Knytter moderne klimatilpasning til et sted som alltid har vært formet av vann.'}
            ],
            'civication_store':[
              {'id':'nedre_foss_mollehjul_modell','title':'Møllehjulet ved Nedre Foss','type':'mollehjulmodell','kind':'physical_object','desc':'En fysisk miniatyr inspirert av møllehjulet i parkens lekelandskap.','placeSpecificReason':'Møllehjulet brukes i dagens park for å fortelle Nedre Foss sin møllehistorie.','historicalFunction':'Viser hvordan fossens vannkraft ble omsatt til mekanisk arbeid.','physicalObject':True,'placeSpecific':True,'storePrice':35,'currency':'PC','collection':'nedre_foss_vann_og_molle','collectable':True,'source_urls':[urls['park'],urls['energi']]},
              {'id':'nedre_foss_kongens_molle_skilt','title':'Kongens mølle','type':'historisk_skilt','kind':'physical_object','desc':'Et samlerobjekt formet som et historisk mølleskilt.','placeSpecificReason':'Betegnelsen Kongens mølle er direkte knyttet til Nedre Foss etter reformasjonen.','historicalFunction':'Markerer overgangen fra klostereiendom til krongods.','physicalObject':True,'placeSpecific':True,'storePrice':28,'currency':'PC','collection':'nedre_foss_vann_og_molle','collectable':True,'source_urls':[urls['snl_foss'],urls['byleks_foss']]},
              {'id':'nedre_foss_silo_minimodell','title':'Kornsiloen fra 1953','type':'bygningsminiatyr','kind':'physical_object','desc':'En liten modell av den runde kornsiloen som senere ble studenthus.','placeSpecificReason':'Siloformen er et av de tydeligste fysiske sporene etter moderne kornvirksomhet på Nedre Foss.','historicalFunction':'Viser kontinuiteten fra kornindustri til boligombruk.','physicalObject':True,'placeSpecific':True,'storePrice':42,'currency':'PC','collection':'nedre_foss_vann_og_molle','collectable':True,'source_urls':[urls['snl_foss'],urls['industri']]},
              {'id':'nedre_foss_laksetrapp_kort','title':'Laksetrappen','type':'landskapsmodell','kind':'physical_object','desc':'Et fysisk detaljkort som viser prinsippet bak fiskepassasjen.','placeSpecificReason':'Laksetrappen ligger ved Nedre Foss og er del av dagens elveforvaltning.','historicalFunction':'Setter dagens naturtiltak opp mot århundrer med utnyttelse av fossen.','physicalObject':True,'placeSpecific':True,'storePrice':20,'currency':'PC','collection':'nedre_foss_vann_og_molle','collectable':True,'source_urls':[urls['park']]}
            ],
            'brands':[
              {'id':'hovedoya_kloster_nedre_foss','name':'Hovedøya kloster','brand_kind':'historical_institution','brand_type':'medieval_mill_owner'},
              {'id':'kronen_kongens_molle','name':'Kronen / Kongens mølle','brand_kind':'historical_state_owner','brand_type':'royal_mill_context'},
              {'id':'familien_gruner_nedre_foss','name':'Familien Grüner','brand_kind':'historical_owner_family','brand_type':'estate_and_mill_ownership'},
              {'id':'bjolsen_valsemolle_nedre_foss','name':'Bjølsen Valsemølle','brand_kind':'historical_industry','brand_type':'later_mill_operation'},
              {'id':'grunerlokka_studenthus_nedre_foss','name':'Grünerløkka studenthus','brand_kind':'adaptive_reuse','brand_type':'silo_to_student_housing'},
              {'id':'oslo_kommune_nedre_foss_park','name':'Oslo kommune','brand_kind':'municipality','brand_type':'park_and_environmental_management'},
              {'id':'akerselva_miljopark_nedre_foss','name':'Akerselva Miljøpark','brand_kind':'environmental_program','brand_type':'river_corridor_conservation'}
            ],
            'for_na':{
              'title':'Fra klostermølle til miljøpark','before':'I middelalderen lå en kornmølle under Hovedøya kloster ved fossen. Etter reformasjonen ble den Kongens mølle. I århundrene som fulgte fortsatte vannkraft, kornmaling, eierskap og industri å organisere området.','now':'I dag er Nedre Foss både historisk landskap og offentlig park. Hovedbygningen og den ombygde siloen gjør eldre lag synlige, mens lekelandskap, turvei, laksetrapp og regnbed gir stedet nye sosiale og økologiske funksjoner.','change':'Vannet gikk fra først og fremst å være produksjonskraft til også å være kulturarv, naturkorridor, klimatilpasning og offentlig byrom. Møllehistorien er fortsatt den viktigste nøkkelen til å lese stedet.','look_for':['selve fallet og vannets fart','hovedbygningen fra 1801/1802','den runde tidligere kornsiloen','møllehjulet i lekelandskapet','laksetrappen','regnbed og overvannsløsninger','ganglinjene langs elva','kontrasten mellom gamle produksjonsspor og ny parkbruk']
            },
            'nature_profile':{
              'type':'urban foss / Akerselva / fiskepassasje / klimatilpasning','title':'Fossen som både kraftmaskin og levende elverom',
              'summary':'Nature-rundingen ved Nedre Foss tar utgangspunkt i selve vannfallet og i hvordan samme vannsystem har fått skiftende roller. Fossen ga energi til møller i århundrer, men dagens elverom forvaltes også som naturkorridor og offentlig park. På østsiden ligger en laksetrapp som hjelper fisk forbi fossen, og i parken er det anlagt regnbed som håndterer overvann i et område med flomutfordringer. Besøkende kan derfor lese vann på minst tre måter samtidig: som historisk kraftressurs, som levende økologisk forbindelse og som moderne klimarisiko. Rundingen holder seg til dokumenterte fysiske tiltak og observerbare forhold ved elva og legger ikke inn et udokumentert artsinventar eller presise geologipåstander.',
              'themes':['foss og vannhastighet','Akerselva som blågrønn korridor','laksetrapp og fiskepassasje','regnbed og overvann','historisk vannkraft','elvekant i tett by','miljøpark og tilgjengelighet','møtet mellom kulturminne og bynatur'],
              'nearby_place_ids':['kuba_parken','beierbrua','vulkan_industriomrade','elvestrekning_bla_brenneriveien']
            },
            'research_notes':[
              {'id':'nedre_foss_current_businesses','claim':'Nåværende virksomheter i området kan endres og skal ikke hardkodes uten ny kildekontroll.','status':'time_sensitive','use_in_app':False,'next_source_needed':'Offisielle virksomhets- eller arrangementsider ved behov.'},
              {'id':'nedre_foss_precise_geology_claims','claim':'Presise geologipåstander om synlig berg ved fossen krever egen geologisk kilde.','status':'needs_primary_source_check','use_in_app':False,'next_source_needed':'Naturhistorisk museum eller annen geologisk fagkilde.'}
            ],
            'source_summary':{'safe_sources':[x['label'] for x in links],'resolved_research':['Møllehistorien er forankret i Oslo kommune, SNL, Oslo byleksikon og Industrimuseum.','Friedrich Grüners kjøp i 1672 er kildebelagt.','Parkens laksetrapp, regnbed og mølleformidling er dokumentert av Oslo kommune.'],'remaining_holdbacks':['Skiftende nåværende virksomheter','Presis geologi uten fagkilde']}
          })
          write(place_path, place)

          # Reuse the already-created canonical person rather than creating a duplicate spelling variant.
          person_path = Path('data/people/naeringsliv/oslo/akerselva/friedrich_gruner.json')
          persons = read(person_path)
          assert len(persons) == 1 and persons[0]['id'] == 'friedrich_gruner'
          person = persons[0]
          person.update({
            'name':'Friedrich Grüner','placeId':'nedre_foss','places':['nedre_foss'],'year':1672,
            'desc':'Myntmester og embetsmann som kjøpte Nedre Foss med Kongens mølle av kongen i 1672.',
            'popupDesc':'Friedrich Grüner (1628–1674) var myntmester i Christiania og kjøpte Nedre Foss ved Akerselva med Kongens mølle av kongen i 1672. Den store eiendommen omfattet blant annet området som senere ble Grünerløkka. Nedre Foss er derfor den konkrete fysiske stedskoblingen for denne delen av livet hans.',
            'source_urls':[urls['friedrich'],urls['byleks_foss'],urls['grunerlokka']]
          })
          write(person_path, persons)
          people_manifest_path = Path('data/people/manifest.json')
          people_manifest = read(people_manifest_path)
          rel_person_path = str(person_path).replace('data/','',1)
          if rel_person_path not in people_manifest['files']:
              people_manifest['files'].append(rel_person_path)
          write(people_manifest_path, people_manifest)

          relations_path = Path('data/relations.json')
          relations = read(relations_path)
          rel = {'id':'rel_friedrich_gruner_nedre_foss_eier','type':'eierskap','place':'nedre_foss','person':'friedrich_gruner','label':'Kjøpte Nedre Foss i 1672','why':'Friedrich Grüner kjøpte Nedre Foss med Kongens mølle av kongen i 1672.','source':urls['friedrich']}
