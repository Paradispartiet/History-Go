          if existing is None: relations.append(rel)
          else: relations[existing] = rel
          write(relations_path, relations)

          story_path = Path('data/stories/stories_nedre_foss.json')
          story = [{
            'id':'st_nedre_foss_fra_munkekorn_til_bypark','type':'water_power_mill_and_urban_park_history','title':'Fra munkekorn til bypark','year':1220,'place_id':'nedre_foss','person_id':'friedrich_gruner',
            'summary':'Ved Akerselvas nederste foss ble korn malt fra middelalderen og gjennom århundrer; stedet gikk fra klostermølle og Kongens mølle til Grüner-eiendom, moderne kornindustri, studenthus og offentlig park.',
            'story':'Før Grünerløkka var en bydel, var fossen allerede en arbeidsplass. Oslo kommune daterer etableringen av en mølle her til perioden mellom 1148 og 1200, mens den sikre skriftlige omtalen kommer i 1220, da kverna nevnes under Hovedøya kloster. Korn kom til et sted der vannets fall kunne gjøre det tunge arbeidet, og Nedre Foss ble en del av middelalderens økonomiske landskap.\n\nEtter reformasjonen overtok kronen. Mølla ble kjent som Kongens mølle og hadde privilegium på kornmaling i området rundt Christiania. I 1672 kjøpte Friedrich Grüner Nedre Foss av kongen. Den store eiendommen omfattet arealer som senere ble en del av Grünerløkka, slik at et moderne bydelsnavn fortsatt bærer et minne om eierhistorien ved fossen.\n\nProduksjonen forsvant ikke da byen vokste. Hovedbygningen fra 1801/1802 ble stående, mølledriften ble modernisert, og en ny kornsilo reiste seg i 1953. Da siloen i 2001 ble bygd om til studentboliger, fikk et bygg laget for korn en helt ny funksjon, men beholdt den karakteristiske formen som fortsatt markerer stedet.\n\nDagens Nedre Foss park gjør historien til en del av hverdagen. Et møllehjul inngår i lekelandskapet, turveier fører folk nærmere vannet, en laksetrapp hjelper fisk forbi fossen, og regnbed tar imot overvann. Det gamle kraftpunktet har dermed ikke mistet forbindelsen til vannet; forholdet har skiftet fra å hente energi ut av elva til også å gi plass til natur, klimatilpasning, lek og offentlig byliv.',
            'sources':[{'title':x['label'],'url':x['url']} for x in links],
            'tags':['Nedre Foss','Hovedøya kloster','Kongens mølle','Friedrich Grüner','vannkraft','kornmølle','Akerselva','byomforming'],
            'related_people':['friedrich_gruner'],'related_places':['hovedoya_kloster','vulkan_industriomrade','kuba_parken','beierbrua'],
            'score':{'narrative':5,'historical':5,'source':5,'play_value':5,'originality':5,'total':25},
            'arc':{'start':'En middelaldermølle utnytter den nederste fossen i Akerselva.','middle':'Kloster, krone og Friedrich Grüner knytter makt og eierskap til et produksjonssted som varer gjennom århundrene.','end':'Silo, park, laksetrapp og regnbed viser hvordan samme vannlandskap får nye funksjoner.'},
            'next_scenes':[{'place_id':'vulkan_industriomrade','reason':'Fortsett over elva til industristedet som senere ble et av Oslos tydeligste transformasjonsområder.'}]
          }]
