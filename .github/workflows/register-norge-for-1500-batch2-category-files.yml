name: Split Norge pre-1500 history batch 2 categories

on:
  push:
    branches:
      - main
    paths:
      - .github/norge-for-1500-batch2-category-trigger.txt

permissions:
  contents: write

concurrency:
  group: split-norge-for-1500-history-batch2-categories
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Split category mismatches and reconcile split manifest
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          source_path = Path('data/places/historie/norge/places_historie_norge_for_1500_batch2.json')
          split_manifest_path = Path('data/places/historie/norge/places_historie_norge_for_1500_batch2_manifest.json')
          split_dir = Path('data/places/historie/norge/places_historie_norge_for_1500_batch2')
          manifest_path = Path('data/places/manifest.json')

          original_ids = [
              'stein_ringerike_halvdanshaugen',
              'fitjar_hakonarparken',
              'gulatinget_flolid',
              'hjorungavag',
              'rimol_melhus',
              'bjarkoy_tore_hund',
              'egge_gard_steinkjer',
              'giske_kyrkje',
              'hallvardskirken_oslo',
              'munkeliv_kloster',
              'nordnes_bergen',
              'audunborg_hegrenes',
              'varteig_kirke',
              'elgeseter_kloster',
              'talgje_kyrkje',
          ]
          retained_ids = [
              'stein_ringerike_halvdanshaugen',
              'fitjar_hakonarparken',
              'hjorungavag',
              'rimol_melhus',
              'bjarkoy_tore_hund',
              'egge_gard_steinkjer',
              'giske_kyrkje',
              'hallvardskirken_oslo',
              'munkeliv_kloster',
              'audunborg_hegrenes',
              'varteig_kirke',
              'elgeseter_kloster',
              'talgje_kyrkje',
          ]
          moves = [
              ('gulatinget_flolid', 'politikk', Path('data/places/politikk/vestland/gulatinget_flolid.json'), 'places/politikk/vestland/gulatinget_flolid.json'),
              ('nordnes_bergen', 'by', Path('data/places/by/vestland/nordnes_bergen.json'), 'places/by/vestland/nordnes_bergen.json'),
          ]

          payload = json.loads(source_path.read_text(encoding='utf-8'))
          if not isinstance(payload, list):
              raise SystemExit('Norge pre-1500 batch 2 must be a JSON array')
          actual_ids = [place.get('id') for place in payload]
          if actual_ids != original_ids:
              raise SystemExit(f'Unexpected source IDs/order: {actual_ids}')
          if any(place.get('category') != 'historie' for place in payload):
              raise SystemExit('Every source entry must start in historie')

          by_id = {place['id']: place for place in payload}
          move_ids = {place_id for place_id, _, _, _ in moves}

          for place_id, category, destination, _ in moves:
              if destination.exists():
                  raise SystemExit(f'Destination already exists: {destination}')
              original = by_id[place_id]
              moved = dict(original)
              moved['category'] = category
              if {k: v for k, v in moved.items() if k != 'category'} != {
                  k: v for k, v in original.items() if k != 'category'
              }:
                  raise SystemExit(f'Non-category content changed for {place_id}')
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(
                  json.dumps([moved], ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )

          retained = [place for place in payload if place['id'] not in move_ids]
          if [place['id'] for place in retained] != retained_ids:
              raise SystemExit('Retained IDs/order changed')
          if any(place.get('category') != 'historie' for place in retained):
              raise SystemExit('Retained entries must remain historie')
          source_text = json.dumps(retained, ensure_ascii=False, indent=2) + '\n'
          source_path.write_text(source_text, encoding='utf-8')

          split_manifest = json.loads(split_manifest_path.read_text(encoding='utf-8'))
          existing_meta = {entry['id']: entry for entry in split_manifest.get('places', [])}
          if set(existing_meta) != set(original_ids):
              raise SystemExit('Unexpected IDs in split manifest before reconciliation')

          reconciled_entries = []
          for order, place in enumerate(retained):
              place_id = place['id']
              split_path = split_dir / f'{place_id}.json'
              split_text = json.dumps(place, ensure_ascii=False, indent=2) + '\n'
              split_path.write_text(split_text, encoding='utf-8')
              entry = dict(existing_meta[place_id])
              entry['category'] = 'historie'
              entry['order'] = order
              entry['sha256'] = hashlib.sha256(split_text.encode('utf-8')).hexdigest()
              reconciled_entries.append(entry)

          for place_id in move_ids:
              stale = split_dir / f'{place_id}.json'
              if stale.exists():
                  stale.unlink()

          split_manifest['source_sha256'] = hashlib.sha256(source_text.encode('utf-8')).hexdigest()
          split_manifest['place_count'] = len(retained)
          split_manifest['places'] = reconciled_entries
          split_manifest_path.write_text(
              json.dumps(split_manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = manifest.get('files')
          if not isinstance(files, list):
              raise SystemExit('Manifest files must be a list')
          anchor = 'places/historie/norge/places_historie_norge_for_1500_batch2.json'
          additions = [move[3] for move in moves]
          if files.count(anchor) != 1:
              raise SystemExit(f'Expected one manifest anchor, got {files.count(anchor)}')
          collisions = [path for path in additions if path in files]
          if collisions:
              raise SystemExit(f'Manifest destinations already registered: {collisions}')
          anchor_index = files.index(anchor)
          files[anchor_index + 1:anchor_index + 1] = additions
          if len(files) != len(set(files)):
              raise SystemExit('Duplicate manifest paths after insertion')
          if files[anchor_index:anchor_index + 3] != [anchor, *additions]:
              raise SystemExit('Manifest insertion order is incorrect')
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8',
          )

          id_counts = Counter()
          for relative_path in files:
              path = Path('data/places') / relative_path.removeprefix('places/')
              document = json.loads(path.read_text(encoding='utf-8'))
              if isinstance(document, list):
                  for place in document:
                      if isinstance(place, dict) and isinstance(place.get('id'), str):
                          id_counts[place['id']] += 1
          duplicates = sorted(place_id for place_id, count in id_counts.items() if count > 1)
          if duplicates:
              raise SystemExit(f'Duplicate manifest-loaded place IDs: {duplicates[:20]}')
          for place_id in original_ids:
              if id_counts[place_id] != 1:
                  raise SystemExit(f'Expected one manifest-loaded occurrence of {place_id}, got {id_counts[place_id]}')

          split_check = json.loads(split_manifest_path.read_text(encoding='utf-8'))
          if split_check.get('place_count') != len(retained):
              raise SystemExit('Split manifest place_count mismatch')
          if [entry['id'] for entry in split_check.get('places', [])] != retained_ids:
              raise SystemExit('Split manifest retained order mismatch')
          for place_id, category, destination, _ in moves:
              written = json.loads(destination.read_text(encoding='utf-8'))
              if written[0].get('id') != place_id or written[0].get('category') != category:
                  raise SystemExit(f'Post-write validation failed for {destination}')
              if (split_dir / f'{place_id}.json').exists():
                  raise SystemExit(f'Stale history split copy remains for {place_id}')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/places/historie/norge/places_historie_norge_for_1500_batch2.json
          git add data/places/historie/norge/places_historie_norge_for_1500_batch2_manifest.json
          git add data/places/historie/norge/places_historie_norge_for_1500_batch2
          git add data/places/politikk/vestland/gulatinget_flolid.json
          git add data/places/by/vestland/nordnes_bergen.json
          git add data/places/manifest.json
          git rm .github/workflows/register-norge-for-1500-batch2-category-files.yml
          git rm .github/norge-for-1500-batch2-category-trigger.txt
          git commit -m "Split and register Norge pre-1500 batch 2 category files"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            sleep 2
          done
          exit 1
