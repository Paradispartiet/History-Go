name: One-time inspect okonomi emne revision

on:
  push:
    branches:
      - agent/okonomi-naeringsliv-emne-revision-stage
    paths:
      - '.github/workflows/one-time-inspect-okonomi-emne-revision.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/okonomi-naeringsliv-emne-revision-stage
          fetch-depth: 0

      - name: Decode and inspect package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/okonomi-revision .tmp/okonomi-revision
          cat .tmp/okonomi-revision/part-* > /tmp/okonomi-revision.b64
          base64 --decode /tmp/okonomi-revision.b64 > /tmp/okonomi-revision.tgz
          sha256sum /tmp/okonomi-revision.b64 /tmp/okonomi-revision.tgz > .tmp/okonomi-revision/checksums.txt
          tar -tzf /tmp/okonomi-revision.tgz | sort > .tmp/okonomi-revision/archive-manifest.txt
          tar -xzf /tmp/okonomi-revision.tgz -C /tmp/okonomi-revision
          find /tmp/okonomi-revision -type f -printf '%P\n' | sort > .tmp/okonomi-revision/extracted-files.txt

      - name: Commit inspection result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp/okonomi-revision/checksums.txt .tmp/okonomi-revision/archive-manifest.txt .tmp/okonomi-revision/extracted-files.txt
          git commit -m 'TEMP: inspiser økonomiemnerevisjonspakke'
          git push origin HEAD:agent/okonomi-naeringsliv-emne-revision-stage
