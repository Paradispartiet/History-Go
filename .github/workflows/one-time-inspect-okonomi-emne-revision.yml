name: One-time materialize okonomi emne revision

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/one-time-inspect-okonomi-emne-revision.yml'
      - '.tmp/okonomi-revision/**'
      - 'tools/validate-okonomi-naeringsliv-emnerevisjon.mjs'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/okonomi-naeringsliv-emne-revision-stage
          fetch-depth: 0

      - name: Materialize and validate revision
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p .tmp/okonomi-revision
          sed -i '/quality\["canonical_files"\]\["datasets"\]/d' .tmp/okonomi-revision/repair_and_run.py
          python .tmp/okonomi-revision/repair_and_run.py > .tmp/okonomi-revision/revision.log 2>&1
          revision_status=$?
          framework_status=99
          individual_status=99
          if [ "$revision_status" -eq 0 ]; then
            node tools/validate-okonomi-naeringsliv-universitetskvalitet.mjs > .tmp/okonomi-revision/framework-validation.log 2>&1
            framework_status=$?
            node tools/validate-okonomi-naeringsliv-emnerevisjon.mjs > .tmp/okonomi-revision/individual-validation.log 2>&1
            individual_status=$?
          else
            echo 'Framework validator not run because materialization failed.' > .tmp/okonomi-revision/framework-validation.log
            echo 'Individual validator not run because materialization failed.' > .tmp/okonomi-revision/individual-validation.log
          fi
          {
            echo "revision_status=$revision_status"
            echo "framework_status=$framework_status"
            echo "individual_status=$individual_status"
          } > .tmp/okonomi-revision/materialization-status.txt
          cat .tmp/okonomi-revision/materialization-status.txt
          cat .tmp/okonomi-revision/revision.log
          cat .tmp/okonomi-revision/framework-validation.log
          cat .tmp/okonomi-revision/individual-validation.log
          exit 0

      - name: Commit production outputs and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            data/fag/naeringsliv/teorikort_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/metodeprotokoller_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/modellregister_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/maleregister_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/emneutvidelser_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/datasettregister_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/universitetskvalitet_okonomi_og_naeringsliv_v2.json \
            tools/validate-okonomi-naeringsliv-emnerevisjon.mjs \
            .tmp/okonomi-revision/revision.log \
            .tmp/okonomi-revision/framework-validation.log \
            .tmp/okonomi-revision/individual-validation.log \
            .tmp/okonomi-revision/materialization-status.txt
          git commit -m 'TEMP: materialiser individuell økonomiemnerevisjon'
          git push origin HEAD:agent/okonomi-naeringsliv-emne-revision-stage
