name: Jernbanetorget Fagverk finalizer once

on:
  push:
    branches:
      - work/jernbanetorget-fagverk-v2-20260902
    paths:
      - .github/workflows/jernbanetorget-fagverk-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/jernbanetorget-fagverk-v2-20260902
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Merge current main with generated-file conflict handling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            for f in $conflicts; do
              case "$f" in
                data/fagverk/fagverk_registry.json|data/fagverk/fagverk_release.json|data/places/place_image_backlog_summary.json|data/places/places_index.json|data/runtime/place-open/jernbanetorget.json|reports/fagverk/fagverk-place-page-coverage-v2.json|reports/place-image-audit.json)
                  git checkout --ours -- "$f"
                  git add "$f"
                  ;;
                *)
                  echo "Unexpected non-generated merge conflict: $f" >&2
                  exit 1
                  ;;
              esac
            done
            git commit --no-edit
          fi
      - name: Install dependencies
        run: npm ci
      - name: Register Jernbanetorget and regenerate derived artifacts
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='data/fagverk/fagverk_registry.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          r.placeLinks ||= {};
          r.placeLinks.jernbanetorget={sourceFile:'places/by/oslo/places/jernbanetorget.json',field:'fagverk',schema:'history_go_place_fagverk_v2',level:'full',status:'curated'};
          r.updatedAt='2026-09-02';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          NODE
          npm run places:index:build
          npm run place-open:build
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-place-images.mjs --mode=all --report=reports/place-image-audit.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('reports/place-image-audit.json','utf8'));
          const p='data/places/place_image_backlog_summary.json';
          const s=JSON.parse(fs.readFileSync(p,'utf8'));
          s.generatedAt='2026-09-02';
          s.generatedFromCommit='jernbanetorget_fagverk_v2_20260902';
          s.totalPlaces=report.totalPlaces;
          s.summary={validLocal:report.summary.local,validRemote:report.summary.remote,optionalMissing:report.summary.optional,missing:report.summary.missing,invalidLocalPath:report.summary.invalid,remaining:report.summary.missing+report.summary.invalid};
          s.byCategory ||= {};
          for (const [id,row] of Object.entries(report.byCategory||{})) {
            const prev=s.byCategory[id]||{};
            s.byCategory[id]={...prev,total:row.total,valid:row.local+row.remote,optional:row.optional,missing:row.missing,invalid:row.invalid};
          }
          fs.writeFileSync(p,JSON.stringify(s,null,2)+'\n');
          NODE
      - name: Verify Jernbanetorget production gates
        shell: bash
        run: |
          set -euo pipefail
          npm run places:index:check
          npm run place-open:check
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node scripts/audit-place-images.mjs --mode=changed
          node scripts/audit-place-images.mjs --mode=all --report=reports/place-image-audit.json --verify-summary=data/places/place_image_backlog_summary.json
          node --test tests/fagverk-place-pages.test.mjs tests/fagverk-place-rendering.test.mjs tests/fagverk-place-substance-audit.test.mjs tests/fagverk-link-audit.test.mjs tests/fagverk-place-foundation-support.test.mjs tests/fagverk-release-manifest.test.mjs
          npm run build:web:check
          git diff --check
      - name: Commit generated production state and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/jernbanetorget-fagverk-finalize-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'chore(fagverk): finalize Jernbanetorget artifacts'
            git push origin HEAD:work/jernbanetorget-fagverk-v2-20260902
          fi
