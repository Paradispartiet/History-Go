name: One-time History theory evidence batch 3

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/history-theory-evidence-batch3-trigger.txt'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/history-theory-evidence-batch3-prod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize batch 3 and dependency inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/historie-theory-evidence/batch-3-validation
          node --check tools/materialize-historie-theory-evidence-batch3.mjs 2>&1 \
            | tee reports/historie-theory-evidence/batch-3-validation/materializer-syntax.log
          node tools/materialize-historie-theory-evidence-batch3.mjs 2>&1 \
            | tee reports/historie-theory-evidence/batch-3-validation/materializer.log

      - name: Validate theory evidence and universal integration
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/validate-historie-theory-evidence.mjs 2>&1 \
            | tee reports/historie-theory-evidence/batch-3-validation/validator-syntax.log
          node tools/validate-historie-theory-evidence.mjs 2>&1 \
            | tee reports/historie-theory-evidence/batch-3-validation/validator.log
          node tools/validate-historie-theory-evidence.mjs --check 2>&1 \
            | tee reports/historie-theory-evidence/batch-3-validation/validator-check.log
          node tools/audit-historie-universal-coverage.mjs 2>&1 \
            | tee reports/historie-theory-evidence/batch-3-validation/universal-coverage.log
          node tools/audit-historie-universal-coverage.mjs --check 2>&1 \
            | tee reports/historie-theory-evidence/batch-3-validation/universal-coverage-check.log

      - name: Verify frozen V5.8 base
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-historie-v5-5-quality-depth.mjs 2>&1 \
            | tee reports/historie-theory-evidence/batch-3-validation/quality-freeze.log
          git restore -- reports/historie-v5/historie-v5-8-quality-depth.json reports/historie-v5/historie-v5-8-quality-depth.md 2>/dev/null || true

      - name: Upload batch 3 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-theory-evidence-batch3-diagnostics
          path: |
            reports/historie-theory-evidence/batch-3-validation
            reports/historie-theory-evidence/history-theory-evidence-foundation-v1.json
            reports/historie-theory-evidence/history-theory-evidence-foundation-v1.md
            reports/historie-theory-evidence/history-theory-evidence-gap-inventory-v1.json
            reports/historie-theory-evidence/history-theory-evidence-gap-inventory-v1.md
            reports/historie-universal-coverage/historie-universal-coverage.json
            reports/historie-universal-coverage/historie-universal-coverage.md
          if-no-files-found: error

      - name: Remove one-time transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/materialize-historie-theory-evidence-batch3.mjs
          rm -f .github/workflows/one-time-history-theory-evidence-batch3.yml
          rm -f .github/history-theory-evidence-batch3-trigger.txt

      - name: Commit clean production diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check 2>&1 \
            | tee reports/historie-theory-evidence/batch-3-validation/git-diff-check.log
          git status --short \
            | tee reports/historie-theory-evidence/batch-3-validation/git-status.log
          git add -A
          git add -f reports/historie-theory-evidence/batch-3-validation
          git add -f reports/historie-theory-evidence/history-theory-evidence-gap-inventory-v1.json
          git add -f reports/historie-theory-evidence/history-theory-evidence-gap-inventory-v1.md
          git commit -m "Expand History theory evidence batch 3"
          git push origin HEAD:agent/history-theory-evidence-batch3-prod
