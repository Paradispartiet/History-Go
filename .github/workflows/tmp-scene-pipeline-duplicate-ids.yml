name: Temporary Civication duplicate scene-id audit

on:
  push:
    branches:
      - civication/scene-pipeline-duplicate-ids
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Audit duplicate scene IDs
        shell: bash
        run: |
          node scripts/audit-civication-scene-pipeline.mjs --json > /tmp/scene-pipeline-audit.json
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/scene-pipeline-audit.json', 'utf8'));
          const duplicates = (audit.blocking_issues || []).filter((issue) => issue.category === 'duplicate_scene_id');
          console.log(JSON.stringify({
            summary: audit.summary,
            duplicate_count: duplicates.length,
            duplicates
          }, null, 2));
          NODE

      - name: Trace legacy naeringsliv mirror references
        shell: bash
        run: |
          echo '=== explicit naeringslivCivic2 references ==='
          git grep -n -F 'naeringslivCivic2.json' -- ':!data/Civication/jobbmails/naeringslivCivic2.json' || true
          echo '=== explicit categorized naeringslivCivic references ==='
          git grep -n -F 'jobbmails/naeringsliv/naeringslivCivic.json' || true
          echo '=== file metadata ==='
          node - <<'NODE'
          const fs = require('node:fs');
          for (const p of [
            'data/Civication/jobbmails/naeringslivCivic2.json',
            'data/Civication/jobbmails/naeringsliv/naeringslivCivic.json'
          ]) {
            const data = JSON.parse(fs.readFileSync(p, 'utf8'));
            console.log(JSON.stringify({path:p, role:data.role, version:data.version, mails:(data.mails||[]).length, ids:(data.mails||[]).map(x=>x.id)}, null, 2));
          }
          NODE
