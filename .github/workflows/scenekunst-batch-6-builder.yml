name: Scenekunst batch 6 builder

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/scenekunst-batch-6-final-trigger.txt'
  push:
    branches:
      - agent/scenekunst-batch-6-final-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build clean Scenekunst batch 6 branch
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/scenekunst-batch-6-final-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build, validate and publish final branch
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BRANCH='agent/scenekunst-venues-06'
          FINAL_BRANCH='agent/scenekunst-venues-06-final'
          FILES=(
            'data/places/scenekunst/akershus/lille_scene_sandvika.json'
            'data/places/scenekunst/akershus/sandvika_teater.json'
            'data/places/scenekunst/more_og_romsdal/fabrikken_kulturscene.json'
            'data/places/scenekunst/rogaland/rimi_imir_scenekunst.json'
            'data/places/scenekunst/vestfold/papirhuset_teater.json'
            'reports/scenekunst-new-venues-batch-6-2026-07-23.json'
            'reports/scenekunst-new-venues-batch-6-2026-07-23.md'
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main "${SOURCE_BRANCH}"
          BASE_SHA="$(git rev-parse origin/main)"
          git checkout -B "${FINAL_BRANCH}" "${BASE_SHA}"
          git checkout "origin/${SOURCE_BRANCH}" -- "${FILES[@]}"
          node <<'NODE'
          const fs = require('fs');
          const file = 'data/places/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const additions = [
            'places/scenekunst/akershus/lille_scene_sandvika.json',
            'places/scenekunst/akershus/sandvika_teater.json',
            'places/scenekunst/more_og_romsdal/fabrikken_kulturscene.json',
            'places/scenekunst/rogaland/rimi_imir_scenekunst.json',
            'places/scenekunst/vestfold/papirhuset_teater.json'
          ];
          for (const entry of additions) {
            if (!manifest.files.includes(entry)) manifest.files.push(entry);
          }
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          npm run places:index:build
          bash scripts/check-places.sh
          bash scripts/check-people.sh
          npm run audit:categories
          npm run audit:quiz-templates
          npm run test:quiz-content-audit
          npm run build:tools
          node dist/tools/validate_nature_maps.mjs
          node dist/tools/validate_lesespor.mjs
          npm run typecheck:web
          npm run build:scripts
          npm run knowledge:canonical:check
          npm run knowledge:legacy:check
          npm run audit:knowledge
          npm run test:knowledge-v2
          node --test tests/knowledge-canonical-storage-contract.test.js
          git diff --check
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "${CURRENT_MAIN}" != "${BASE_SHA}" ]; then
            echo "main moved from ${BASE_SHA} to ${CURRENT_MAIN}; refusing stale branch"
            exit 2
          fi
          git add data/places/manifest.json data/places/places_index.json "${FILES[@]}"
          git commit -m 'Add sixth Scenekunst venue batch on current main'
          git push --force origin HEAD:"${FINAL_BRANCH}"
