name: Tveten original photo SHA256 provenance (temporary)
on:
  push:
    branches:
      - content/tveten-gard-vferdig-media-20261110
    paths:
      - '.github/workflows/tveten-photo-sha256-temp.yml'
permissions:
  contents: read
jobs:
  checksum:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and hash original unresized Wikimedia Commons JPEG
        shell: bash
        run: |
          set -euo pipefail
          url='https://commons.wikimedia.org/wiki/Special:Redirect/file/Tveten%20g%C3%A5rd%20(17.%20mars%202018).jpg'
          curl --location --fail --show-error --silent --retry 3 --max-time 90 \
            --user-agent 'HistoryGo-Attribution-Checker/1.0 (https://github.com/Paradispartiet/History-Go)' \
            "$url" --output /tmp/tveten-original.jpg
          mime="$(file --mime-type -b /tmp/tveten-original.jpg)"
          test "$mime" = "image/jpeg"
          bytes="$(wc -c < /tmp/tveten-original.jpg | tr -d ' ')"
          test "$bytes" -gt 100000
          echo "ORIGINAL_TVETEN_FILE_BYTES=$bytes"
          printf "ORIGINAL_TVETEN_SHA256="
          sha256sum /tmp/tveten-original.jpg | cut -d' ' -f1
