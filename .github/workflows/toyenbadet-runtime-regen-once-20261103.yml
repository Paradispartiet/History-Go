name: Tøyenbadet generated-index parity (one-shot)
on:
  push:
    branches: [content/toyenbadet-vferdig-20261103]
    paths:
      - '.github/workflows/toyenbadet-runtime-regen-once-20261103.yml'
      - 'data/stories/stories_toyenbadet.json'
      - 'data/stories/stories_manifest.json'
      - 'data/stories/stories_episode_v1_manifest.json'
      - 'data/leksikon/places/oslo/sport/leksikon_oslo_sport_toyenbadet.json'
permissions:
  contents: write
concurrency:
  group: toyenbadet-runtime-regen-once-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/toyenbadet-vferdig-20261103
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate canonical Stories
        run: npm run check:stories
      - name: Incorporate latest main before regenerating global indexes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Regenerate canonical outputs and inspect exact drift
        shell: bash
        run: |
          set -euo pipefail
          npm run places:index:build
          npm run place-open:build
          npm run epoker:places:build
          echo 'GENERATED_DIFF_BEGIN'
          git status --short | head -80
          echo 'GENERATED_DIFF_END'
      - name: Assert canonical image surfaces and Story at exact source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const place=JSON.parse(fs.readFileSync('data/places/sport/europa/norway/oslo_sport/toyenbadet.json','utf8'));
          const runtime=JSON.parse(fs.readFileSync('data/runtime/place-open/toyenbadet.json','utf8'));
          assert.equal(place.id,'toyenbadet');
          assert.equal(runtime.place.id,'toyenbadet');
          assert.ok(!('cardImage' in place));
          assert.ok(!('cardImage' in runtime.place),'legacy cardImage survived index/build');
          assert.equal(runtime.place.frontImage,place.frontImage);
          assert.equal(runtime.stories.some(x=>x.id==='st_toyenbadet_fra_gammelt_til_nytt_bad_2019'),true);
          assert.equal(runtime.language.entries.length,4);
          NODE
      - name: Stage Tøyenbadet-generated leksikon and reading-trail indexes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/places_index.json
          git add data/runtime/place-open/toyenbadet.json data/runtime/leksikon-all/part-009.json data/runtime/leksikon-all.json data/runtime/lesespor-all.json data/epoker/epoke-place-index.json
          git add -A data/runtime/stories-all/ data/runtime/stories-all.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Tøyenbadet: synchronize generated leksikon and source-backed epoke index'
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/content/toyenbadet-vferdig-20261103)" ]; then
            git push origin HEAD:content/toyenbadet-vferdig-20261103
          fi
