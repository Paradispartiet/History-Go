name: Agent lock dialect layer to area Places

on:
  push:
    branches:
      - agent/lock-dialect-to-area-places
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lock-dialect-to-area-places
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply hard dialect ownership contract
        run: python scripts/agent_lock_dialect_layer.py

      - name: Check language runtime syntax
        run: node --check js/ui/place-language-layer.js

      - name: Check dialect scope test syntax
        run: node --check tests/place-language-dialect-scope.test.mjs

      - name: Run language and dialect regression tests
        run: node --test tests/place-language-layer.test.mjs tests/place-language-dialect-scope.test.mjs tests/place-popup-direct-tabs.test.mjs

      - name: Audit canonical Place scope
        run: node scripts/audit-place-scope.mjs

      - name: Verify clean diff syntax
        run: git diff --check

      - name: Commit permanent product changes
        run: |
          git config user.name "History Go migration bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/agent-lock-dialect-layer.yml scripts/agent_lock_dialect_layer.py
          git add docs/SPRAKLEKSIKON.md docs/PLACE_PRODUCTION_CHECKLIST.md \
            data/leksikon/sprak/schema_v2.json js/ui/place-language-layer.js \
            tests/place-language-layer.test.mjs tests/place-language-dialect-scope.test.mjs \
            .github/workflows/language-layer-checks.yml
          git diff --cached --check
          git commit -m "Lås dialektlaget til område-Places"
          git push origin HEAD:agent/lock-dialect-to-area-places
