name: Repository hygiene

on:
  pull_request:
    paths:
      - 'reports/**'
      - 'scripts/audit-repository-hygiene-v1.mjs'
      - '.github/ci/repository-hygiene-allowlist-v1.json'
      - 'docs/REPOSITORY_HYGIENE.md'
      - '.github/workflows/repository-hygiene.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit tracked size and changed diagnostic artifacts
        env:
          REPO_HYGIENE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO_HYGIENE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/audit-repository-hygiene-v1.mjs
