name: Tullin Claus affected People shards rebuild (temporary)
on:
  push:
    branches:
      - content/tullin-claus-illustration-vferdig-20261110
    paths:
      - '.github/workflows/tullin-claus-shards-sync-temp.yml'
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/tullin-claus-illustration-vferdig-20261110
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate canonical People runtime shards
        run: node scripts/build-place-open-payloads.mjs
      - name: Stage only generated People and Tullin runtime changes
        run: |
          git status --short data/runtime/people-all data/runtime/place-open/tullin.json
          git add data/runtime/people-all/part-*.json data/runtime/place-open/tullin.json
          git diff --cached --stat
          if git diff --cached --quiet; then echo "Already synchronized"; exit 0; fi
          git -c user.name="HistoryGo CI" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Complete Tullin People runtime shard regeneration"
          git push origin HEAD:content/tullin-claus-illustration-vferdig-20261110
