name: TEMP Bogstadveien final candidate v3
on:
  push:
    branches: [control/bogstadveien-finalize-20260904-v3]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Extract validated Brand steps and replay on fresh main
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/tmp-bogstadveien-final-candidate-v2.yml').read_text().splitlines()
          def extract(name,out):
              start=next(i for i,l in enumerate(lines) if l==f'      - name: {name}')
              run=next(i for i in range(start+1,len(lines)) if lines[i]=='        run: |')
              body=[]
              for l in lines[run+1:]:
                  if l.startswith('      - '): break
                  if l.startswith('          '): body.append(l[10:])
                  else: body.append(l)
              Path(out).write_text('\n'.join(body)+'\n')
          extract('Fetch authentic Brand assets','/tmp/bogstad-fetch.sh')
          extract('Materialize Brand assets and canonical audit','/tmp/bogstad-materialize.sh')
          PY
          git fetch origin main work/bogstadveien-production-final-20260904
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -C candidate/bogstadveien-final-20260904-v3 origin/main
          git cherry-pick bd17d6426cb40fd7ab575718d8e6b265e225afbe
          test ! -e .github/workflows/tmp-bogstadveien-final-candidate-v3.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Reapply validated Brand materialization
        run: |
          set -euo pipefail
          bash /tmp/bogstad-fetch.sh
          bash /tmp/bogstad-materialize.sh
      - name: Replace Georg A. Nilsen context photo with official custom logo
        run: |
          set -euo pipefail
          GEORG_LOGO='https://www.georganilsen.no/wp-content/uploads/2016/12/cropped-cropped-logo-georg-a-nilsen-sh-jpg.jpg'
          curl -A 'Mozilla/5.0 History-Go source audit' -L --fail --retry 3 --connect-timeout 15 --max-time 60 "$GEORG_LOGO" -o /tmp/georg-a-nilsen-official-logo.jpg
          file /tmp/georg-a-nilsen-official-logo.jpg
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const sharp=require('sharp');
          (async()=>{
            const logoUrl='https://www.georganilsen.no/wp-content/uploads/2016/12/cropped-cropped-logo-georg-a-nilsen-sh-jpg.jpg';
            const src='/tmp/georg-a-nilsen-official-logo.jpg';
            const meta=await sharp(src).metadata();
            if(meta.format!=='jpeg'||meta.width!==309||meta.height!==250) throw new Error(`Unexpected Georg A. Nilsen official logo: ${meta.format} ${meta.width}x${meta.height}`);
            const localSource='bilder/kort/brands/georg_a_nilsen_source_official_custom_logo.jpg';
            const output='bilder/kort/brands/georg_a_nilsen.webp';
            fs.mkdirSync(path.dirname(localSource),{recursive:true});
            fs.copyFileSync(src,localSource);
            await sharp(src)
              .resize(900,900,{fit:'contain',background:{r:255,g:255,b:255,alpha:0},withoutEnlargement:false})
              .webp({quality:92})
              .toFile(output);
            const outMeta=await sharp(output).metadata();
            if(outMeta.format!=='webp'||outMeta.width!==900||outMeta.height!==900) throw new Error(`Unexpected Georg output: ${outMeta.format} ${outMeta.width}x${outMeta.height}`);
            const brandsPath='data/brands/brands_master.json';
            const brands=JSON.parse(fs.readFileSync(brandsPath,'utf8'));
            const georg=brands.find(row=>row.id==='georg_a_nilsen');
            if(!georg) throw new Error('Georg A. Nilsen Brand missing');
            georg.logo=output;
            georg.source_urls=[...new Set([...(georg.source_urls||[]),'https://www.georganilsen.no/','https://www.georganilsen.no/var-historie/',logoUrl])];
            georg.logoMeta={
              source:'first_party_official_site',
              sourcePage:'https://www.georganilsen.no/',
              sourceUrl:logoUrl,
              creator:'Georg A. Nilsen',
              credit:'Georg A. Nilsen official website custom-logo',
              rightsBasis:'Official brand asset used referentially',
              license:'brand/trademark',
              reviewStatus:'verified',
              assetKind:'official_logo',
              assetType:'first_party_custom_logo',
              temporalScope:'current',
              usageContext:'brand identification',
              noEndorsement:true,
              localSource,
              generated:false,
              reconstructed:false,
              transformation:'Official first-party custom-logo JPEG; proportional resize; centre-square-canvas; WebP q92.',
              outputDimensions:'900x900',
              reviewedAt:'2026-09-04',
              disclosure:'Autentisk offisiell custom-logo fra Georg A. Nilsens eget nettsted; ikke rekonstruert eller generert.'
            };
            fs.writeFileSync(brandsPath,JSON.stringify(brands,null,2)+'\n');
            const auditPath='reports/place-production/bogstadveien-phase8c-brands-audit-v1.json';
            const audit=JSON.parse(fs.readFileSync(auditPath,'utf8'));
            const included=(audit.included||[]).find(row=>row.id==='georg_a_nilsen');
            if(!included) throw new Error('Georg A. Nilsen audit row missing');
            included.source_urls=georg.source_urls;
            included.visual_decision='verified_first_party_official_custom_logo';
            included.visual_source=logoUrl;
            audit.source_corrections=[...(audit.source_corrections||[]).filter(row=>row.candidate!=='georg_a_nilsen'),{
              candidate:'georg_a_nilsen',
              correction:'Replaced documentary storefront context image with first-party official WordPress custom-logo; no reconstruction or generated mark.',
              source_page:'https://www.georganilsen.no/',
              source_url:logoUrl
            }];
            fs.writeFileSync(auditPath,JSON.stringify(audit,null,2)+'\n');
            fs.rmSync('bilder/kort/brands/georg_a_nilsen_source_bogstadveien_30.jpg',{force:true});
            fs.rmSync('bilder/kort/brands/georg_a_nilsen_source_bogstadveien_39.jpg',{force:true});
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
      - name: Rebuild derived payloads and image backlog with schema validation
        run: |
          set -euo pipefail
          npm run places:index:build
          npm run place-open:build
          npm run epoker:places:build
          node scripts/build-fagverk-release-manifest.mjs
          rm -f reports/place-image-audit.json
          node scripts/audit-place-images.mjs --mode=all --report=reports/place-image-audit.json
          node <<'NODE'
          const fs=require('fs');
          const p='data/places/place_image_backlog_summary.json';
          const reportPath='reports/place-image-audit.json';
          const s=JSON.parse(fs.readFileSync(p,'utf8'));
          const r=JSON.parse(fs.readFileSync(reportPath,'utf8'));
          console.log('place-image-audit keys:',Object.keys(r));
          if(!r || typeof r!=='object' || !r.summary || typeof r.summary!=='object'){
            console.log(JSON.stringify(r,null,2).slice(0,12000));
            throw new Error('place-image-audit report missing summary');
          }
          for(const k of ['local','remote','optional','missing','invalid']){
            if(!Number.isInteger(r.summary[k])) throw new Error(`place-image-audit invalid summary.${k}: ${r.summary[k]}`);
          }
          if(!Number.isInteger(r.totalPlaces)) throw new Error(`place-image-audit invalid totalPlaces: ${r.totalPlaces}`);
          s.generatedAt='2026-09-04';
          s.generatedFromCommit='bogstadveien_place_completion_20260904';
          s.totalPlaces=r.totalPlaces;
          s.summary={
            validLocal:r.summary.local,
            validRemote:r.summary.remote,
            optionalMissing:r.summary.optional,
            missing:r.summary.missing,
            invalidLocalPath:r.summary.invalid,
            remaining:r.summary.missing+r.summary.invalid
          };
          fs.writeFileSync(p,JSON.stringify(s,null,2)+'\n');
          NODE
          node scripts/audit-place-images.mjs --mode=all --report=reports/place-image-audit.json --verify-summary=data/places/place_image_backlog_summary.json
      - name: Run Bogstadveien and repository gates
        run: |
          set -euo pipefail
          node --test tests/bogstadveien-completion.test.mjs
          bash scripts/check-places.sh
          node scripts/audit-fagverk-place-pages.mjs
          node --test tests/fagverk-content.test.mjs
          node --test tests/fagverk-portal.test.mjs
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/fagverk-place-rendering.test.mjs
          node --test tests/fagverk-place-substance-audit.test.mjs
          node --test tests/fagverk-place-category-design.test.mjs
          node --test tests/fagverk-link-audit.test.mjs
          node --test tests/place-learning-surface.test.js
          node --test tests/place-image-audit-changed.test.mjs
          node scripts/audit-place-images.mjs --mode=changed
          git diff --check
      - name: Commit and push clean candidate
        run: |
          set -euo pipefail
          test ! -e .github/workflows/tmp-bogstadveien-final-candidate-v3.yml
          test ! -e .github/workflows/tmp-bogstadveien-final-candidate-v2.yml
          git add -A
          git status --short
          git diff --cached --check
          git commit -m "Finalize Bogstadveien Brand audit and image backlog"
          git push --force origin HEAD:candidate/bogstadveien-final-20260904-v3
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Report candidate
        run: echo "$CANDIDATE_SHA"
