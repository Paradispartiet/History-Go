name: Villa Stenersen v1 – main synchronization and browser closeout
on:
  push:
    branches:
      - content/oslo-aav-villa-stenersen-v1-20261027
    paths:
      - '.github/workflows/villa-stenersen-v1-finalize.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: villa-stenersen-main-sync-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/content/oslo-aav-villa-stenersen-v1-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/oslo-aav-villa-stenersen-v1-20261027
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Merge latest main with only seven approved shared JSON files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            test -f .git/MERGE_HEAD || { echo 'Unexpected merge failure'; exit 1; }
          fi
          python3 scripts/reconcile-villa-stenersen-main.py
          git commit -m 'Merge main while retaining Villa Stenersen quiz, Fagverk and other place updates'
      - name: Build canonical quiz production context and Knowledge
        run: |
          node scripts/build-quiz-production-context.mjs --category historie --target villa_stenersen --output data/quiz/production_context/historie/villa_stenersen.json
          npm run knowledge:canonical:write
          node scripts/sync-villa-stenersen-quizcard-knowledge.mjs
          npm run places:index:build
          npm run place-open:build
          node scripts/build-fagverk-release-manifest.mjs
      - name: Verify QuizCard, Knowledge and canonical data
        run: |
          node --test tests/villa-stenersen-v1-parity.test.mjs tests/place-quizcards-category-manifests.test.mjs
          npm run place-open:check
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Install Chromium for actual app QA
        run: npx playwright install --with-deps chromium
      - name: Real iPad-size mobile and desktop QA – 390/1440 px
        run: node tests/villa-stenersen-real-app-browser-20261027.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: villa-stenersen-main-sync-browser
          path: artifacts/villa-stenersen-browser/
          if-no-files-found: ignore
      - name: Commit regenerated Knowledge and runtime without losing concurrent work
        shell: bash
        run: |
          set -euo pipefail
          git add data/quiz/production_context/historie/villa_stenersen.json
          git add data/quiz/historie/villa_stenersen_sets.json data/quizcards/historie/villa_stenersen_quizcard_v1.json
          git add data/knowledge/knowledge_units.generated.json reports/knowledge-id-backfill.json
          git add data/fagverk/fagverk_release.json data/places/places_index.json
          git add data/runtime/place-open/ data/runtime/people-all/
          if ! git diff --cached --quiet; then
            git commit -m 'Villa Stenersen: rebuild canonical Knowledge and Place runtime'
          fi
          git status --short
          git restore --worktree .
          git push origin HEAD:refs/heads/content/oslo-aav-villa-stenersen-v1-20261027
