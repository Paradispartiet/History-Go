name: Apply quiz knowledge runtime v1 from issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == '[RUN] Apply quiz knowledge runtime v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply runtime patch
        run: |
          python scripts/maintenance/apply_quiz_knowledge_runtime_v1.py
          node --check js/quizzes.js

      - name: Commit and clean up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f scripts/maintenance/apply_quiz_knowledge_runtime_v1.py
          rm -f .github/workflows/quiz-knowledge-runtime-v1-issue.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/quizzes.js scripts/maintenance/apply_quiz_knowledge_runtime_v1.py .github/workflows/quiz-knowledge-runtime-v1-issue.yml
          git commit -m 'Make quizzes deliver knowledge and record reading evidence'
          git push
          gh issue close "${{ github.event.issue.number }}" --comment 'Quizmotoren er oppdatert: kunnskapsforklaring vises etter svar, Fortsett registrerer lest, og mestring registreres bare ved riktig svar.'
