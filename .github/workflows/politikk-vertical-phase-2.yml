name: Politics vertical depth phase 2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-validate:
    if: github.head_ref == 'agent/politikk-teori-fase-2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/politikk-teori-fase-2
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and validate phase 2
        id: build
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p reports/politikk-canonical-migration
          exec > >(tee reports/politikk-canonical-migration/politikk-teori-phase-2-full-run.log) 2>&1

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          echo '6b706db777ef0dd78560167119e43ac68e965a056d40f489fab94ed2f1956ce0  tools/build-politikk-vertical-phase-2.mjs.gz.b64' \
            | sha256sum -c - \
            2>&1 | tee reports/politikk-canonical-migration/politikk-teori-phase-2-builder-checksum.txt

          base64 -d tools/build-politikk-vertical-phase-2.mjs.gz.b64 \
            | gzip -d > tools/build-politikk-vertical-phase-2.mjs

          node --check tools/build-politikk-vertical-phase-2.mjs \
            2>&1 | tee reports/politikk-canonical-migration/politikk-teori-phase-2-builder-syntax.txt

          node tools/build-politikk-vertical-phase-2.mjs \
            2>&1 | tee reports/politikk-canonical-migration/politikk-teori-phase-2-builder-output.txt

          python - <<'PY'
          from pathlib import Path
          p = Path('tools/validate-politikk-statsvitenskap-core.mjs')
          s = p.read_text()
          old = "const coreBlueprints=blueprints.filter(b=>b.quality_revision===R||b.quality_revision===P1);"
          new = "const coreBlueprints=blueprints.filter(b=>!b.blueprint_id.startsWith('pol_theory_phase2_'));"
          if old not in s:
              raise SystemExit('FAIL | Fant ikke forventet blueprint-filter i kjernevalidatoren')
          p.write_text(s.replace(old, new))
          PY

          rm -f tools/build-politikk-vertical-phase-2.mjs
          rm -f tools/build-politikk-vertical-phase-2.mjs.gz.b64
          rm -f .github/workflows/politikk-vertical-phase-2.yml
          rm -f reports/politikk-canonical-migration/politikk-teori-phase-2-builder-checksum.txt
          rm -f reports/politikk-canonical-migration/politikk-teori-phase-2-builder-syntax.txt
          rm -f reports/politikk-canonical-migration/politikk-teori-phase-2-builder-output.txt
          rm -f reports/politikk-canonical-migration/politikk-teori-phase-2-full-run.log

          node tools/validate-politikk-teori-phase-2.mjs \
            2>&1 | tee reports/politikk-canonical-migration/politikk-teori-phase-2-validation.txt
          node tools/validate-politikk-institusjoner-phase-1.mjs \
            2>&1 | tee reports/politikk-canonical-migration/politikk-institusjoner-phase-1-validation.txt
          node tools/validate-politikk-statsvitenskap-core.mjs \
            2>&1 | tee reports/politikk-canonical-migration/statsvitenskap-vertical-chain-validation.txt
          node tools/validate-politikk-demokrati-vertical.mjs \
            2>&1 | tee reports/politikk-canonical-migration/demokrati-vertical-validation.txt
          node tools/validate-politikk-konflikt-vertical.mjs \
            2>&1 | tee reports/politikk-canonical-migration/konflikt-vertical-validation.txt

          for file in \
            data/fag/politikk/fagkart_politikk_canonical_v4_5.json \
            data/fag/politikk/emner_politikk_canonical_v4_5.json \
            data/fag/politikk/methods_politikk_canonical_v4_5.json \
            data/fag/politikk/emnemapping_politikk_canonical_v4_5.json \
            data/fag/politikk/politikkpensum_canonical_v4_5.json \
            data/fag/politikk/quiz_generator_rules_politikk_v5_1_source_priority_patch.json \
            reports/politikk-canonical-migration/statsvitenskap-question-blueprints.json; do
              node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log("PASS | Gyldig JSON: "+process.argv[1])' "$file" \
                2>&1 | tee -a reports/politikk-canonical-migration/politikk-teori-phase-2-validation.txt
          done

          git diff --check \
            2>&1 | tee -a reports/politikk-canonical-migration/politikk-teori-phase-2-validation.txt
          echo 'PASS | git diff --check' \
            | tee -a reports/politikk-canonical-migration/politikk-teori-phase-2-validation.txt

          git add -A data/fag/politikk reports/politikk-canonical-migration tools .github/workflows
          git diff --cached --check
          git commit -m 'Politikk: bygg normativ teori- og ideologiakse'
          git push --force-with-lease origin HEAD:agent/politikk-teori-fase-2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: politics-theory-phase-2-diagnostics
          path: |
            reports/politikk-canonical-migration/politikk-teori-phase-2-*
            reports/politikk-canonical-migration/statsvitenskap-vertical-chain-validation.txt
            reports/politikk-canonical-migration/demokrati-vertical-validation.txt
            reports/politikk-canonical-migration/konflikt-vertical-validation.txt
          if-no-files-found: warn

      - name: Propagate build failure
        if: steps.build.outcome == 'failure'
        run: exit 1
