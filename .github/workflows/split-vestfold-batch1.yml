name: Split Vestfold batch 1

on:
  workflow_dispatch:
  push:
    branches:
      - data/split-vestfold-batch1-places-v2

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/split-vestfold-batch1-places-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/split-historie-vestfold-batch1-places.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/historie/vestfold/places_historie_vestfold_batch1 data/places/historie/vestfold/places_historie_vestfold_batch1_manifest.json data/places/historie/vestfold/places_historie_vestfold_batch1_index.json data/places/historie/vestfold/places_historie_vestfold_batch1_split_report.txt
          git commit -m "Generate split Historie Vestfold batch 1 place files" || exit 0
          git push
