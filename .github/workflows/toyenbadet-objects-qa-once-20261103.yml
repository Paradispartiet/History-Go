name: Tøyenbadet Objects — one-time production QA
on:
  push:
    branches: [feat/toyenbadet-objects-people-source-gate-20261103]
    paths: ['.github/workflows/toyenbadet-objects-qa-once-20261103.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/toyenbadet-objects-people-source-gate-20261103
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate canonical place index and place-open
        shell: bash
        run: |
          set -euo pipefail
          npm run places:index:build
          npm run place-open:build
          node --test tests/toyenbadet-source-backed-objects.test.mjs tests/toyenbadet-modern-photos-before-after.test.mjs tests/toyenbadet-asplan-viak-brand.test.mjs
          node - <<'JS'
          const fs=require('node:fs');
          const src=JSON.parse(fs.readFileSync('data/places/sport/europa/norway/oslo_sport/toyenbadet.json'));
          const runtime=JSON.parse(fs.readFileSync('data/runtime/place-open/toyenbadet.json'));
          if(JSON.stringify(runtime.place.objects?.map(x=>x.id))!==JSON.stringify(src.objects?.map(x=>x.id)))throw Error('Tøyenbadet Objects not in generated place-open');
          if(JSON.stringify(runtime.place.place_card_profile.collection_ids)!==JSON.stringify(['objects','brands','competitions']))throw Error('Tøyenbadet 3-collection profile stale');
          if(runtime.brands.find(x=>x.id==='asplan_viak')?.logo!=='bilder/kort/brands/asplan_viak.webp')throw Error('existing Brand lost');
          if(runtime.place.for_na?.nowImage!==src.for_na.nowImage)throw Error('existing Before/After lost');
          console.log('Tøyenbadet Objects, Brand, Competitions canonical-runtime parity: PASS');
          JS
      - name: Save source-owned generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/places_index.json data/runtime/place-open/toyenbadet.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(toyenbadet): synchronize source-backed Objects and three collections'
            git push origin HEAD:feat/toyenbadet-objects-people-source-gate-20261103
          fi
      - name: Locate installed Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Test actual app mobile and desktop, three collections and illustration disclosure
        run: node tests/toyenbadet-vferdig-real-browser-20261103.test.mjs
      - name: Archive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toyenbadet-objects-browser-qa
          path: artifacts/toyenbadet-vferdig-real-browser
          if-no-files-found: ignore
          retention-days: 14
