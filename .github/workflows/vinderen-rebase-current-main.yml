name: Rebase Vinderen onto current main

on:
  push:
    branches:
      - place/vinderen-fagverk-v2

permissions:
  contents: write

jobs:
  rebase:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: place/vinderen-fagverk-v2
          fetch-depth: 0
      - name: Rebase onto locked current main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "0b704807b6272a9a0e8df28daee0d0965ac086a9" || {
            echo "main moved before rebase; refusing stale replay"
            exit 1
          }
          git rebase 0b704807b6272a9a0e8df28daee0d0965ac086a9
      - name: Remove helper and verify Vinderen-only diff
        run: |
          set -euo pipefail
          git rm .github/workflows/vinderen-rebase-current-main.yml
          git commit -m "chore: finish Vinderen replay on current main"
          actual="$(git diff --name-only 0b704807b6272a9a0e8df28daee0d0965ac086a9...HEAD | sort)"
          expected="$(printf '%s\n' \
            'data/fagverk/fagverk_registry.json' \
            'data/fagverk/fagverk_release.json' \
            'data/places/by/oslo/places/vinderen.json' \
            'data/places/place_image_backlog_summary.json' \
            'data/runtime/place-open/vinderen.json' \
            'reports/fagverk/fagverk-place-page-coverage-v2.json' | sort)"
          test "$actual" = "$expected" || {
            echo "Unexpected replay diff:"
            printf '%s\n' "$actual"
            exit 1
          }
      - name: Force-with-lease replayed branch
        run: |
          git push --force-with-lease=refs/heads/place/vinderen-fagverk-v2:${GITHUB_SHA} origin HEAD:place/vinderen-fagverk-v2
