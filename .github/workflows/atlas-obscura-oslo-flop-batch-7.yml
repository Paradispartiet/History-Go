name: Integrate Atlas Obscura Oslo FLOP batch 7

on:
  push:
    branches:
      - agent/atlas-obscura-oslo-flop-batch-7

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'Generate Atlas Obscura FLOP batch 7 data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atlas-obscura-oslo-flop-batch-7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Register active source
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifestPath = 'data/places/manifest.json';
          const source = 'places/naeringsliv/oslo/places_naeringsliv_atlas_obscura_flop_batch_07.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.files ||= [];
          if (!manifest.files.includes(source)) manifest.files.push(source);
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - name: Build and validate place data
        run: |
          mkdir -p reports/atlas-obscura-oslo-flop-batch-7
          npm run places:index:build \
            | tee reports/atlas-obscura-oslo-flop-batch-7/places-index-build.txt
          npm run places:index:check \
            | tee reports/atlas-obscura-oslo-flop-batch-7/places-index-check.txt
          npm run places:coords:intake \
            | tee reports/atlas-obscura-oslo-flop-batch-7/coordinate-intake.txt
          npm run places:emner:check \
            | tee reports/atlas-obscura-oslo-flop-batch-7/emne-check.txt
          npm run health:places \
            | tee reports/atlas-obscura-oslo-flop-batch-7/health-places.txt
      - name: Commit generated data
        if: always()
        run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add \
            data/places/manifest.json \
            data/places/places_index.json \
            reports/atlas-obscura-oslo-flop-batch-7
          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Generate Atlas Obscura FLOP batch 7 data"
            git push
          fi
