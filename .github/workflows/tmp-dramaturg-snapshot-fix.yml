name: Temporary Dramaturg snapshot repair

on:
  push:
    branches:
      - civication/scenekunst-dramaturg-role-world
    paths:
      - .github/workflows/tmp-dramaturg-snapshot-fix.yml

permissions:
  contents: write

jobs:
  repair-verify-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Rebuild corrected Dramaturg state
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('.github/workflows/tmp-dramaturg-author.yml','utf8');
          const start="          node <<'NODE'\n";
          const end="\n          NODE\n          node scripts/audit-civication-life-position-role-world-readiness.mjs --write";
          const a=text.indexOf(start),b=text.indexOf(end,a+start.length);
          if(a<0||b<0) throw new Error('Dramaturg authoring script boundaries not found');
          let script=text.slice(a+start.length,b).split('\n').map(line=>line.startsWith('          ')?line.slice(10):line).join('\n');
          script=script.replace("feedback:x[8]},\n    {id:'B',label:x[5],effect:-1,tags:x[6].map(t=>t+'_failure'),feedback:x[9]}","feedback:x[7]},\n    {id:'B',label:x[5],effect:-1,tags:x[6].map(t=>t+'_failure'),feedback:x[8]}");
          if(script.includes('feedback:x[9]')) throw new Error('stale Dramaturg feedback mapping remains');
          fs.writeFileSync('/tmp/author-dramaturg.js',script);
          NODE
          node /tmp/author-dramaturg.js
          node scripts/audit-civication-life-position-role-world-readiness.mjs --write

      - name: Synchronize canonical snapshots
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const indexPath='data/Civication/roleWorlds/index.json',index=read(indexPath);
          const total=index.roles.length,career=index.roles.filter(r=>r.subject_type!=='life_position').length,life=index.roles.filter(r=>r.subject_type==='life_position').length;
          if(total!==240||career!==85||life!==155) throw new Error(`unexpected index ${total}/${career}/${life}`);
          index.status=`${total}_role_worlds_materialized`;index.summary={role_worlds_total:total,career_role_worlds:career,life_position_role_worlds:life};index.career_role_world_count=career;index.life_position_role_world_count=life;write(indexPath,index);
          const audit=read('data/Civication/lifePositionRoleWorldReadiness.json');
          const nextQueue=audit.queue[0]?.key;
          if(nextQueue!=='scenekunst/koreograf') throw new Error(`unexpected queue ${nextQueue}`);
          const replaceAssert=(s,expr,value)=>{const e=expr.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return s.replace(new RegExp(`(assert\\.equal\\(\\s*${e}\\s*,\\s*)\\d+`,'g'),`$1${value}`)};
          const changed=[];
          for(const name of fs.readdirSync('tests').filter(n=>/^civication-.*\.test\.js$/.test(n))){
            const p=path.join('tests',name);let s=fs.readFileSync(p,'utf8'),before=s;
            for(const expr of ['index.roles.length','roleWorldIndex.roles.length','index.summary.role_worlds_total','taxonomy.canonical_counts.total_role_worlds'])s=replaceAssert(s,expr,total);
            for(const expr of ['index.life_position_role_world_count','index.summary.life_position_role_worlds','taxonomy.canonical_counts.life_position_role_worlds','policy.noncareer_subject_boundary.life_position_readiness.completed_life_position_role_worlds','lifePositionWorlds.length'])s=replaceAssert(s,expr,life);
            s=s.replace(/(assert\.equal\(\s*audit\.queue\[0\]\.key\s*,\s*)['"]scenekunst\/dramaturg['"]/g,`$1'${nextQueue}'`)
               .replace(/const unrelated=\[['"]scenekunst\/dramaturg['"]\]/g,`const unrelated=['${nextQueue}']`)
               .replace(/(assert\.deepEqual\(\s*roleWorldIndex\.summary\s*,\s*\{\s*role_worlds_total:\s*)239(,\s*career_role_worlds:\s*85,\s*life_position_role_worlds:\s*)154(\s*\}\s*\))/g,`$1${total}$2${life}$3`);
            if(name==='civication-life-position-role-world-readiness.test.js'){
              const c=audit.summary.classifications;
              s=s.replace(/ready:\s*154,\s*\n\s*needs_authored_depth:\s*5,\s*\n\s*not_a_standalone_world:\s*40/g,`ready: ${c.ready},\n  needs_authored_depth: ${c.needs_authored_depth},\n  not_a_standalone_world: ${c.not_a_standalone_world}`);
              for(const f of ['completed_life_position_role_worlds','pending_ready_positions','livelihood_backed_positions','positions_with_exact_governed_sources','positions_with_multi_scene_narrative_foundation'])s=replaceAssert(s,`audit.summary.${f}`,audit.summary[f]);
            }
            if(name==='civication-noncareer-role-taxonomy.test.js'){
              s=s.replace(/85 karriereverdener \+ 154 life-position worlds/g,`85 karriereverdener + ${life} life-position worlds`)
                 .replace(/154 canonical life-position worlds skal være materialisert, nå også Næringsliv Investor som egen capital ownership and investment-posisjon/g,`${life} canonical life-position worlds skal være materialisert, nå også Scenekunst Dramaturg som egen employment-independent dramaturgical practice-posisjon`)
                 .replace(/(const expectedCounts = \{[\s\S]*?life_position_role_worlds:\s*)154(,\s*\n\s*total_role_worlds:\s*)239/g,`$1${life}$2${total}`)
                 .replace(/85 career Role Worlds \+ 154 life-position worlds/g,`85 career Role Worlds + ${life} life-position worlds`);
            }
            if(s!==before){fs.writeFileSync(p,s);changed.push(name)}
          }
          console.log(JSON.stringify({total,career,life,nextQueue,readiness:audit.summary,changed_tests:changed.length},null,2));
          NODE

      - name: Verify complete Dramaturg state
        run: |
          node tests/civication-scenekunst-dramaturg-authored-depth.test.js
          node tests/civication-role-world-contract.test.js
          node tests/civication-life-position-role-world-readiness.test.js
          node tests/civication-noncareer-role-taxonomy.test.js
          node scripts/build-civication-scene-registry.mjs --check
          npm run test:civication
          git diff --check

      - name: Commit permanent Dramaturg state
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm \
            .github/workflows/tmp-dramaturg-author.yml \
            .github/workflows/tmp-dramaturg-fix.yml \
            .github/workflows/tmp-dramaturg-governance-sync.yml \
            .github/workflows/tmp-dramaturg-snapshot-fix.yml
          git add data/Civication reports/civication-life-position-role-world-readiness.md tests/civication-*.test.js
          git diff --cached --check
          git commit -m "Civication: author Scenekunst Dramaturg Role World"
          git push origin HEAD:civication/scenekunst-dramaturg-role-world
