name: Oslo coordinate batch 29 artwork audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-coordinate-batch-29-artwork-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/oslo-coordinate-control-batch-29'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query nearby OSM artwork and memorial objects
        shell: bash
        run: |
          set -euo pipefail
          OUT='reports/oslo-coordinate-control-batch-29/artwork-audit'
          mkdir -p "$OUT"

          query_overpass() {
            local query="$1"
            local file="$2"
            set +e
            curl --retry 3 --retry-delay 3 -fsSL -A 'History-Go-coordinate-audit/1.0' \
              --data-urlencode "data=$query" \
              'https://overpass-api.de/api/interpreter' \
              | tee "$OUT/$file" >/dev/null
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$code" > "$OUT/$file.exit-status.txt"
          }

          STENSPARKEN='[out:json][timeout:30];(nwr(around:700,59.928571,10.730418)[tourism=artwork];nwr(around:700,59.928571,10.730418)[historic=memorial];nwr(around:700,59.928571,10.730418)[memorial];);out center tags;'
          FLAMMEN='[out:json][timeout:30];(nwr(around:500,60.04401205900787,10.880400225286696)[tourism=artwork];nwr(around:500,60.04401205900787,10.880400225286696)[historic=memorial];nwr(around:500,60.04401205900787,10.880400225286696)[memorial];);out center tags;'

          query_overpass "$STENSPARKEN" 'stensparken-artwork-overpass.json'
          query_overpass "$FLAMMEN" 'flammen-artwork-overpass.json'

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir = 'reports/oslo-coordinate-control-batch-29/artwork-audit';
          for (const name of ['stensparken-artwork-overpass.json','flammen-artwork-overpass.json']) {
            const file = `${dir}/${name}`;
            let json = { elements: [] };
            try { json = JSON.parse(fs.readFileSync(file, 'utf8')); } catch {}
            const rows = (json.elements ?? []).map((e) => ({
              type: e.type,
              id: e.id,
              lat: e.lat ?? e.center?.lat ?? null,
              lon: e.lon ?? e.center?.lon ?? null,
              tags: e.tags ?? {}
            }));
            fs.writeFileSync(`${dir}/${name.replace('.json','-summary.json')}`, JSON.stringify(rows, null, 2) + '\n');
            console.log(name, JSON.stringify(rows, null, 2));
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch-29-artwork-audit
          path: reports/oslo-coordinate-control-batch-29/artwork-audit
          if-no-files-found: error
