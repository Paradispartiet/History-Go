name: Fagverk Film og TV screen public sphere source brief

on:
  pull_request:
    paths:
      - "data/fag/TV_og_Film/film_tv_screen_public_sphere_community_society_source_claim_brief_v1.json"
      - "data/fag/TV_og_Film/film_tv_screen_public_sphere_community_society_sources_v1.json"
      - "data/fag/TV_og_Film/film_tv_screen_public_sphere_community_society_cases_v1.json"
      - "data/fag/TV_og_Film/film_tv_screen_public_sphere_community_society_topic_claims_v1.json"
      - "scripts/brief-film-tv-screen-public-sphere-community-society-sources-v1.mjs"
      - "tests/film-tv-screen-public-sphere-community-society-source-brief-v1.test.mjs"
      - "reports/fagverk/film-tv-screen-public-sphere-community-society-source-brief-v1-audit.json"
      - ".github/workflows/fagverk-film-tv-screen-public-sphere-source-brief.yml"
  push:
    branches: [main]
    paths:
      - "data/fag/TV_og_Film/film_tv_screen_public_sphere_community_society_source_claim_brief_v1.json"
      - "data/fag/TV_og_Film/film_tv_screen_public_sphere_community_society_sources_v1.json"
      - "data/fag/TV_og_Film/film_tv_screen_public_sphere_community_society_cases_v1.json"
      - "data/fag/TV_og_Film/film_tv_screen_public_sphere_community_society_topic_claims_v1.json"
      - "scripts/brief-film-tv-screen-public-sphere-community-society-sources-v1.mjs"
      - "tests/film-tv-screen-public-sphere-community-society-source-brief-v1.test.mjs"
      - "reports/fagverk/film-tv-screen-public-sphere-community-society-source-brief-v1-audit.json"
      - ".github/workflows/fagverk-film-tv-screen-public-sphere-source-brief.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate screen public sphere source brief
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate source brief syntax and deterministic audit
        run: |
          node --check scripts/brief-film-tv-screen-public-sphere-community-society-sources-v1.mjs
          node scripts/brief-film-tv-screen-public-sphere-community-society-sources-v1.mjs
      - name: Validate source brief and prerequisite contracts
        run: |
          node --test tests/film-tv-screen-public-sphere-community-society-source-brief-v1.test.mjs
          node --test tests/film-tv-learning-order-plan-v1.test.mjs
          node --test tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs
