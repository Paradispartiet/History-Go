name: TEMP Civication Natur Biologi og forskning Role World

on:
  push:
    branches:
      - agent/civication-natur-biologi-og-forskning-role-world
    paths:
      - 'scripts/TEMP_materialize_natur_biologi_og_forskning_role_world.mjs'
      - 'scripts/TEMP_enrich_natur_biologi_og_forskning_role_world.mjs'
      - '.github/workflows/TEMP-civication-natur-biologi-og-forskning-role-world.yml'

permissions:
  contents: write

concurrency:
  group: temp-civication-natur-biologi-og-forskning-role-world
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Syntax-check TEMP materializer
        run: node --check scripts/TEMP_materialize_natur_biologi_og_forskning_role_world.mjs

      - name: Syntax-check TEMP boundary enrichment
        run: node --check scripts/TEMP_enrich_natur_biologi_og_forskning_role_world.mjs

      - name: Materialize Role World candidate
        run: node scripts/TEMP_materialize_natur_biologi_og_forskning_role_world.mjs

      - name: Enrich explicit field-data authority boundary
        run: node scripts/TEMP_enrich_natur_biologi_og_forskning_role_world.mjs

      - name: Regenerate Career Gameplay Matrix
        run: node scripts/audit-civication-career-gameplay.mjs --write

      - name: Regenerate rollout readiness
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write

      - name: Syntax-check focused rollout test
        run: node --check tests/civication-natur-biologi-og-forskning-role-world-rollout.test.js

      - name: Run focused Role World rollout test
        run: node tests/civication-natur-biologi-og-forskning-role-world-rollout.test.js

      - name: Preserve prerequisite contract
        run: node tests/civication-natur-biologi-og-forskning-prerequisites.test.js

      - name: Run global Role World contract
        run: node tests/civication-role-world-contract.test.js

      - name: Verify Career Gameplay parity
        run: node scripts/audit-civication-career-gameplay.mjs --check

      - name: Verify readiness parity
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --check

      - name: Verify compiled Scene Registry parity
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Verify Scenario People generated catalog
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check

      - name: Verify Scenario People invariants
        run: node --test tests/civication-scenario-people.test.mjs

      - name: Run complete Civication suite
        run: npm run test:civication

      - name: Repository diff hygiene
        run: git diff --check

      - name: Commit verified permanent Role World
        run: |
          rm -f scripts/TEMP_materialize_natur_biologi_og_forskning_role_world.mjs
          rm -f scripts/TEMP_enrich_natur_biologi_og_forskning_role_world.mjs
          rm -f .github/workflows/TEMP-civication-natur-biologi-og-forskning-role-world.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No permanent Role World diff produced"
            exit 1
          fi
          if git diff --cached --name-only | grep -E '(^|/)TEMP|reports/TEMP'; then
            echo "TEMP artifact leaked into permanent candidate"
            exit 1
          fi
          git commit -m "Complete Natur Biologi og forskning Role World"
          git push origin "HEAD:${{ github.ref_name }}"
