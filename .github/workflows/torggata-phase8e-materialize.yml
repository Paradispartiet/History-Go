name: Torggata phase 8E materialize

on:
  push:
    branches:
      - agent/torggata-phase8e-rounds-closeout

permissions:
  contents: write

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize Torggata 8E
        run: node scripts/materialize-torggata-phase8e-rounds-closeout.mjs

      - name: Validate syntax and focused 8E
        run: |
          node --check scripts/materialize-torggata-phase8e-rounds-closeout.mjs
          node --check js/ui/area-overview-v2.js
          node --test tests/torggata-phase8e-rounds-closeout.test.mjs
          node tests/area-overview-v2-runtime.test.js
          node --test tests/place-rounds-grid-exclusivity.test.mjs

      - name: Preserve 8D Structures regression
        run: node --test tests/torggata-phase8d-structures.test.mjs

      - name: Preserve 8C Brands regression
        run: node --test tests/torggata-phase8c-brands.test.mjs

      - name: Preserve 8B Objects regression
        run: node --test tests/torggata-phase8b-objects.test.mjs

      - name: Preserve 8A People regression
        run: node --test tests/torggata-phase8a-closeout.test.mjs

      - name: TypeScript hard gates
        run: |
          npm run typecheck:web
          npm run typecheck:scripts
          npm run typecheck:tools

      - name: Build guard
        run: npm run build --if-present

      - name: Persist validated 8E batch
        shell: bash
        run: |
          rm -f .github/workflows/torggata-phase8e-materialize.yml scripts/materialize-torggata-phase8e-rounds-closeout.mjs
          git add -A
          git diff --cached --check
          echo "Validated permanent diff:"
          git diff --cached --name-status
          if git diff --cached --quiet; then
            echo "No validated changes to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Godkjenn Torggata fase 8E rundinger"
          git push origin HEAD:agent/torggata-phase8e-rounds-closeout
