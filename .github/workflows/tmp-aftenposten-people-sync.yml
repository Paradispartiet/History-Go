name: Temporary Aftenposten People synchronization
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'data/people/media/oslo/people_media_oslo.json'
      - '.github/workflows/tmp-aftenposten-people-sync.yml'
permissions:
  contents: read
concurrency:
  group: tmp-aftenposten-people-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  synchronize:
    if: github.event.pull_request.number == 6144 && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate canonical projections and coverage
        run: |
          npm run civication:history-people:build
          npm run place-open:build
          npm run build:tools
          node dist/tools/audit-people-place-coverage.mjs
          node dist/tools/audit-people-invalid-place-refs.mjs
          npm run audit:people-of-places
      - name: Guard generated semantic scope
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const base='be7a1cd6a61c0464668216b26d1dfa1474fc88eb';
          const read=(file)=>JSON.parse(fs.readFileSync(file,'utf8'));
          const old=(file)=>JSON.parse(execFileSync('git',['show',base+':'+file],{encoding:'utf8',maxBuffer:20*1024*1024}));
          const changed=execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed=(p)=>/^data\/runtime\/(people-all|stories-all)\/(index|part-\d+)\.json$/.test(p)||['data/Civication/historyPeople_index.json','data/runtime/place-open/aftenposten_akersgata.json','data/runtime/place-open/vg_huset.json'].includes(p)||/^reports\/people-(place-coverage|invalid-place-refs|of-places-status)\.(json|md)$/.test(p);
          assert.ok(changed.every(allowed), 'Unexpected generated changes: '+changed.filter(p=>!allowed(p)).join(', '));
          function flattened(dir,previous) {
            const paths=previous?execFileSync('git',['ls-tree','-r','--name-only',base,dir],{encoding:'utf8'}).trim().split('\n'):fs.readdirSync(dir).map(n=>dir+'/'+n);
            return paths.filter(p=>/\/part-\d+\.json$/.test(p)).sort().flatMap(p=>previous?old(p):read(p));
          }
          const trine=read('data/people/media/oslo/people_media_oslo.json').find(p=>p.id==='trine_eilertsen');
          const peopleBefore=flattened('data/runtime/people-all',true),peopleAfter=flattened('data/runtime/people-all',false);
          assert.deepEqual(peopleBefore.filter(p=>p.id!==trine.id),peopleAfter.filter(p=>p.id!==trine.id),'Unrelated People changed');
          assert.equal(peopleBefore.length,peopleAfter.length);
          assert.deepEqual(peopleAfter.find(p=>p.id===trine.id),trine);
          const storyId='st_aftenposten_akersgata_schibsted_presseakse_1860';
          const storiesBefore=flattened('data/runtime/stories-all',true),storiesAfter=flattened('data/runtime/stories-all',false);
          for(const story of storiesBefore) if(story.id===storyId) story.related_people=story.related_people.filter(id=>id!==trine.id);
          assert.deepEqual(storiesAfter,storiesBefore,'Unexpected Story changes');
          for(const id of ['aftenposten_akersgata','vg_huset']) {
            const file='data/runtime/place-open/'+id+'.json',before=old(file),after=read(file);
            const afterTrine=after.people.filter(p=>p.id===trine.id);
            assert.equal(afterTrine.length,id==='vg_huset'?1:0);
            if(afterTrine.length) assert.deepEqual(afterTrine[0],trine);
            before.people=before.people.filter(p=>p.id!==trine.id);
            after.people=after.people.filter(p=>p.id!==trine.id);
            for(const story of before.stories) if(story.id===storyId) story.related_people=story.related_people.filter(id=>id!==trine.id);
            assert.deepEqual(after,before,'Unrelated place payload content changed: '+id);
          }
          const civFile='data/Civication/historyPeople_index.json',civBefore=old(civFile),civAfter=read(civFile);
          function stripTrine(value) {
            if(Array.isArray(value)) return value.filter(v=>v?.id!==trine.id).map(stripTrine);
            if(value&&typeof value==='object') return Object.fromEntries(Object.entries(value).map(([k,v])=>[k,stripTrine(v)]));
            return value;
          }
          assert.deepEqual(stripTrine(civAfter),stripTrine(civBefore),'Unrelated Civication content changed');
          console.log('PASS: only Trine, her building anchors and the dependent Story relation changed.');
          console.log('People total:',peopleAfter.length,'Stories total:',storiesAfter.length);
          console.log('Generated files:',changed.join('\n'));
          
          JS
      - name: Validate People, claims, Story integrity and runtime
        run: |
          bash scripts/check-people.sh
          npm run test:factuality-contract
          npm run audit:people-profile-canonical
          npm run check:stories
          npm run test:stories-manifest
          npm run place-open:check
          npm run test:place-open
          npm run civication:history-people:check
      - name: Commit restricted generated files to this PR branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: agent/aftenposten-prior-work-20261008
        run: |
          set -euo pipefail
          actual_head=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$actual_head" = "$EXPECTED_HEAD"
          git add -- data/Civication/historyPeople_index.json data/runtime/people-all data/runtime/stories-all data/runtime/place-open/aftenposten_akersgata.json data/runtime/place-open/vg_huset.json reports/people-place-coverage.json reports/people-place-coverage.md reports/people-invalid-place-refs.json reports/people-invalid-place-refs.md reports/people-of-places-status.json reports/people-of-places-status.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "History Go data synchronization"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: synchronize Aftenposten People projections"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
