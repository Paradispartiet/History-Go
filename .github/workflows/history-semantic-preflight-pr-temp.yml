name: History terminal push temporary
# Temporary post-sync one-shot verifier. Delete before merge.

on:
  push:
    branches:
      - agent/history-completion-audit
    paths:
      - '.github/workflows/history-semantic-preflight-pr-temp.yml'
      - 'tools/run-historie-postsync-final-verify-temp.mjs'

concurrency:
  group: history-terminal-one-shot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    runs-on: macos-latest
    steps:
      - name: Check out exact History branch
        uses: actions/checkout@v4
        with:
          ref: agent/history-completion-audit
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify terminal History on current main
        run: node tools/run-historie-postsync-final-verify-temp.mjs
