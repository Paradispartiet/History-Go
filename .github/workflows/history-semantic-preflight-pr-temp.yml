name: History terminal push temporary
# Final atomic History verifier and cleanup. Deletes itself only after 23/23 PASS. Never merge this file.

on:
  push:
    branches:
      - agent/history-completion-audit
    paths:
      - '.github/workflows/history-semantic-preflight-pr-temp.yml'
      - 'tools/run-historie-final-verify-and-cleanup-temp.mjs'

concurrency:
  group: history-terminal-one-shot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact History branch
        uses: actions/checkout@v4
        with:
          ref: agent/history-completion-audit
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify latest main and remove temp infrastructure
        run: node tools/run-historie-final-verify-and-cleanup-temp.mjs
