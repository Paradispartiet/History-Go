name: Viking Planet CC-BY-SA panorama visual review
on:
  push:
    branches: [content/oslo-vu-viking-planet-licensed-photo-20261028]
    paths:
      - '.github/workflows/viking-planet-photo-review.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/oslo-vu-viking-planet-licensed-photo-20261028
          persist-credentials: true
      - name: Prepare licensed image contact sheet
        run: |
          python3 -m pip install --user --quiet pillow
          python3 scripts/prepare-viking-planet-photo-review.py
      - name: Commit review contact sheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/places/review-viking-planet/
          if ! git diff --cached --quiet; then git commit -m "Add licensed Viking Planet panorama review contact sheet"; fi
          git push origin HEAD:content/oslo-vu-viking-planet-licensed-photo-20261028
