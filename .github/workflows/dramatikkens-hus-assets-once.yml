name: Dramatikkens hus collection assets once

on:
  push:
    branches:
      - agent/dramatikkens-hus-collections-20260915
    paths:
      - .github/workflows/dramatikkens-hus-assets-once.yml

permissions:
  contents: write

jobs:
  materialize-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dramatikkens-hus-collections-20260915
          fetch-depth: 0

      - name: Download reviewed source assets
        shell: bash
        run: |
          set -euo pipefail
          ua='HistoryGoPlaceProduction/1.0 (https://github.com/Paradispartiet/History-Go)'
          curl -L --fail --retry 3 -A "$ua" -o /tmp/kristin.jpg 'https://upload.wikimedia.org/wikipedia/commons/6/6f/20131218_oej5AuestDanielsenWik3.jpg'
          curl -L --fail --retry 3 -A "$ua" -o /tmp/det-aapne.jpg 'https://upload.wikimedia.org/wikipedia/commons/a/a8/Det_%C3%85pne_Teater1.JPG'
          curl -L --fail --retry 3 -A "$ua" -o /tmp/rigg.webp 'https://dramatikkens-hus.imgix.net/riggsak2.jpg?auto=compress%2Cformat&crop=focalpoint&fit=crop&fm=webp&fp-x=0.5&fp-y=0.5&h=715&w=1200'
          curl -L --fail --retry 3 -A "$ua" -o /tmp/hunervred.webp 'https://dramatikkens-hus.imgix.net/hunervred-bergen.png?auto=compress%2Cformat&crop=focalpoint&fit=crop&fm=webp&fp-x=0.5&fp-y=0.5&h=715&w=1200'
          curl -L --fail --retry 3 -A "$ua" -o /tmp/front.jpg 'https://upload.wikimedia.org/wikipedia/commons/e/ec/T%C3%B8yenbekken_34_Dramatikkens_hus.jpg'
          file /tmp/kristin.jpg /tmp/det-aapne.jpg /tmp/rigg.webp /tmp/hunervred.webp /tmp/front.jpg

      - name: Normalize reviewed assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pillow>=11,<12'
          mkdir -p bilder/kort/people bilder/kort/objects bilder/kort/brands bilder/kort/productions bilder/places
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          def load(path):
              return ImageOps.exif_transpose(Image.open(path)).convert("RGB")

          def fit_save(src, dest, size, *, crop=None, centering=(0.5,0.5), quality=84):
              im=load(src)
              if crop is not None:
                  im=im.crop(crop)
              out=ImageOps.fit(im,size,method=Image.Resampling.LANCZOS,centering=centering)
              Path(dest).parent.mkdir(parents=True,exist_ok=True)
              out.save(dest,"WEBP",quality=quality,method=6)
              print(dest, out.size, Path(dest).stat().st_size)

          fit_save("/tmp/kristin.jpg","bilder/kort/people/kristin_auestad_danielsen.webp",(800,800),centering=(0.52,0.48))
          fit_save("/tmp/det-aapne.jpg","bilder/kort/brands/det_aapne_teater.webp",(900,520),crop=(120,500,1420,1400),centering=(0.45,0.42))
          fit_save("/tmp/rigg.webp","bilder/kort/objects/dramatikkens_hus_scenerigg_hallen.webp",(900,520))
          fit_save("/tmp/hunervred.webp","bilder/kort/productions/dramatikkens_hus_hun_er_vred_arg_sint.webp",(900,520))
          fit_save("/tmp/front.jpg","bilder/places/dramatikkens_hus_front_portrait.webp",(900,1200),centering=(0.5,0.5))
          PY

      - name: Commit only normalized assets and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bilder/kort/people/kristin_auestad_danielsen.webp
          git add bilder/kort/brands/det_aapne_teater.webp
          git add bilder/kort/objects/dramatikkens_hus_scenerigg_hallen.webp
          git add bilder/kort/productions/dramatikkens_hus_hun_er_vred_arg_sint.webp
          git add bilder/places/dramatikkens_hus_front_portrait.webp
          git rm .github/workflows/dramatikkens-hus-assets-once.yml
          git commit -m 'Add Dramatikkens hus reviewed collection assets'
          git push origin HEAD:agent/dramatikkens-hus-collections-20260915
