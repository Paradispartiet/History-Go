name: Export Vitenskap stitched badge family
on:
  push:
    branches: [design/vitenskap-brodert-lilla-20261030]
    paths:
      - 'bilder/merker/vitenskap/brodert/*.svg'
      - '.github/workflows/export-vitenskap-badges.yml'
permissions:
  contents: write
jobs:
  export-embroidered-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render all eight SVG badges to transparent WebP
        run: |
          python -m pip install --quiet cairosvg pillow numpy
          python - <<'PY'
          from pathlib import Path
          import json,io,xml.etree.ElementTree as ET
          from PIL import Image,ImageDraw,ImageFont
          import cairosvg
          import numpy as np
          manifest=json.loads(Path('data/badges/vitenskap_underbadge_artwork.json').read_text())
          badge=json.loads(Path('data/badges/vitenskap.json').read_text())
          images=[{'id':'vitenskap','svg':'bilder/merker/vitenskap/brodert/vitenskap.svg','image':badge['image'],'label':'Vitenskap'}]+manifest['assets']
          assert len(images)==8
          Path('out').mkdir(exist_ok=True)
          sheet=Image.new('RGB',(1200,670),'#101421')
          d=ImageDraw.Draw(sheet)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',18)
          for i,asset in enumerate(images):
              src=Path(asset['svg'])
              assert ET.parse(src).getroot().attrib['viewBox']=='0 0 512 512'
              data=cairosvg.svg2png(url=str(src),output_width=720,output_height=720)
              im=Image.open(io.BytesIO(data)).convert('RGBA')
              assert im.getpixel((0,0))[3]==0
              # Stitch-grain: directional thread shading only on colored motifs and the border.
              # Linen and transparency retain their original appearance.
              rgba=np.asarray(im,dtype=np.float32)
              rgb=rgba[:,:,:3]/255.0
              mx=rgb.max(axis=2)
              mn=rgb.min(axis=2)
              sat=(mx-mn)/(mx+1e-6)
              mask=np.clip((sat-0.20)*8.0,0,1)*np.clip((mx-0.13)*4.0,0,1)*(rgba[:,:,3]/255.0)
              yy,xx=np.mgrid[0:rgba.shape[0],0:rgba.shape[1]]
              rng=np.random.default_rng(1088)
              ridges=np.sin(2*np.pi*(xx*0.80+yy*0.55)/8.2)
              cross=np.sin(2*np.pi*(xx*0.55-yy*0.75)/5.3)
              noise=rng.normal(0,0.014,mx.shape)
              multiplier=1.0+mask*(0.09*ridges+0.030*cross+noise)
              rgba[:,:,:3]=np.clip(rgba[:,:,:3]*multiplier[:,:,None],0,255)
              im=Image.fromarray(rgba.astype('uint8'),'RGBA')
              out=Path(asset['image'])
              out.parent.mkdir(parents=True,exist_ok=True)
              im.save(out,'WEBP',quality=94,method=6)
              restored=Image.open(out)
              assert restored.size==(720,720), (out,restored.size)
              assert out.stat().st_size>3000,out
              tile=im.resize((252,252),Image.Resampling.LANCZOS)
              x=20+(i%4)*296
              y=10+(i//4)*322
              sheet.paste(tile,(x,y),tile)
              d.text((x,y+262),asset['label'],font=font,fill='#E6DDFF')
              print(asset['id'],out.stat().st_size)
          sheet.save('out/vitenskap-stitched-badges-review.png')
          print('All eight embroidered images produced')
          PY
      - name: Commit binary artwork on this work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/merker/vitenskap/brodert/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Render science embroidered badge assets to real WebP files"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vitenskap-stitched-badges-review
          path: out/vitenskap-stitched-badges-review.png
          retention-days: 3
