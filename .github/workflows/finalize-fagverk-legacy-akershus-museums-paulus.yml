name: Finalize Akershus museums Paulus Fagverk legacy batch

on:
  push:
    branches:
      - agent/fagverk-legacy-akershus-museums-paulus-20260831
    paths:
      - .github/workflows/finalize-fagverk-legacy-akershus-museums-paulus.yml
      - tools/finalize-fagverk-legacy-akershus-museums-paulus.mjs

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync branch to current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Curate four completed Place Fagverk packages
        run: node tools/finalize-fagverk-legacy-akershus-museums-paulus.mjs
      - name: Rebuild deterministic quiz contexts
        run: |
          node scripts/build-quiz-production-context.mjs --category historie --target akershus_slott --output data/quiz/production_context/historie/akershus_slott.json
          node scripts/build-quiz-production-context.mjs --category historie --target forsvarsmuseet --output data/quiz/production_context/historie/forsvarsmuseet.json
          node scripts/build-quiz-production-context.mjs --category historie --target norges_hjemmefrontmuseum --output data/quiz/production_context/historie/norges_hjemmefrontmuseum.json
          node scripts/build-quiz-production-context.mjs --category historie --target paulus_kirke --output data/quiz/production_context/historie/paulus_kirke.json
      - name: Regenerate Place-open runtime
        run: node scripts/build-place-open-payloads.mjs
      - name: Regenerate Fagverk place coverage
        id: fagverk_coverage
        run: |
          set +e
          node scripts/audit-fagverk-place-pages.mjs --write > /tmp/fagverk-place-audit.log 2>&1
          status=$?
          cat /tmp/fagverk-place-audit.log
          exit "$status"
      - name: Upload Fagverk coverage diagnostic
        if: failure() && steps.fagverk_coverage.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: fagverk-place-audit-diagnostic
          path: /tmp/fagverk-place-audit.log
          if-no-files-found: error
          retention-days: 1
      - name: Regenerate Fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Validate Fagverk page contract
        run: node scripts/audit-fagverk-place-pages.mjs
      - name: Validate Place-open and release artifacts
        run: |
          node scripts/build-place-open-payloads.mjs --check
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Test Fagverk page and substance contracts
        run: |
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/fagverk-place-substance-audit.test.mjs
      - name: Test Fagverk links
        run: node --test tests/fagverk-link-audit.test.mjs
      - name: Validate changed Place images
        run: node scripts/audit-place-images.mjs --mode=changed
      - name: Validate quiz production context
        run: npm run audit:quiz-production-context
      - name: Validate quiz progression
        run: npm run audit:quiz-progression
      - name: Validate quiz theory binding
        run: npm run audit:quiz-theory-binding
      - name: Validate diff whitespace
        run: git diff --check
      - name: Commit final production result and remove temporary tooling
        run: |
          git add \
            data/places/historie/oslo/places_historie/akershus_slott.json \
            data/places/historie/oslo/places_historie_atlas_obscura_museum_batch_06/forsvarsmuseet.json \
            data/places/historie/oslo/places_historie_atlas_obscura_museum_batch_06/norges_hjemmefrontmuseum.json \
            data/places/historie/oslo/places_historie/paulus_kirke.json \
            data/quiz/production_context/historie/akershus_slott.json \
            data/quiz/production_context/historie/forsvarsmuseet.json \
            data/quiz/production_context/historie/norges_hjemmefrontmuseum.json \
            data/quiz/production_context/historie/paulus_kirke.json \
            data/runtime \
            data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/fagverk-place-page-coverage-v2.json
          git rm tools/finalize-fagverk-legacy-akershus-museums-paulus.mjs .github/workflows/finalize-fagverk-legacy-akershus-museums-paulus.yml
          git diff --cached --quiet && { echo "No production changes to commit"; exit 1; }
          git commit -m "Curate Akershus museums Paulus Fagverk legacy batch"
          git push origin HEAD:${GITHUB_REF_NAME}
