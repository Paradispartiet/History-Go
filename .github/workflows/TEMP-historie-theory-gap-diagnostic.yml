name: TEMP Historie legacy theory section ranking

on:
  pull_request:
    paths:
      - '.github/workflows/TEMP-historie-theory-gap-diagnostic.yml'
      - 'data/fag/historie/**'
      - 'data/fagverk/historie/**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rank existing legacy prose for each canonical theory
        run: |
          node <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const A=v=>Array.isArray(v)?v:[];
          const uniq=xs=>[...new Set(xs.filter(Boolean))];
          const norm=v=>String(v||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9æøå]+/g,' ').replace(/\s+/g,' ').trim();
          const stop=new Set(['og','eller','som','for','med','til','fra','ved','mot','uten','etter','under','over','mellom','gjennom','den','det','de','en','et','av','på','i','er','var','blir','kan','skal','må','samt','slik','hvordan','historisk','historiske','historie','analytisk','analyse','analyserer','forklarer','undersøker','modellen','modell']);
          const toks=v=>uniq(norm(v).split(/\s+/).filter(t=>t.length>=4&&!stop.has(t)));
          const bind=(ref,prose)=>{const r=toks(ref),p=new Set(toks(prose)),m=r.filter(t=>p.has(t));return {m:m.length,n:r.length,r:r.length?m.length/r.length:0};};
          const pensum=read('data/fag/historie/historiepensum_canonical_v4_5.json');
          const mapping=read('data/fag/historie/emnemapping_historie_canonical_v4_5.json');
          const theories=read('data/fag/historie/theory_objects_historie_canonical_v5_5.json');
          const evidence=read('data/fag/historie/theory_evidence_historie_canonical_v1.json');
          const eById=new Map(A(evidence.entries).map(e=>[e.theory_id,e]));
          const registry=read('data/fagverk/fagverk_registry.json');
          const wanted=new Set(['his_tid_periodisering','his_kilder_arkiv_spor','his_makt_stat_institusjoner']);
          for(const field of wanted){
            const d=A(pensum.domains).find(x=>x.domain_id===field);
            const row=A(registry.subjects.historie.chapters).find(x=>x.primary_domain_id===field);
            const chapter=read(row.file);
            const secs=A(chapter.moduleFiles).flatMap(file=>A(read(file).sections).map(s=>({file,id:s.id,title:s.title||'',prose:A(s.paragraphs).join(' ')})));
            for(const t of theories.filter(t=>A(t.explanatory_scope).includes(field))){
              const emnes=A(mapping).filter(m=>d.emne_ids.includes(m.emne_id)&&A(m.mappings).some(x=>x.topic_hook===t.source_hook_id)).map(m=>m.emne_id);
              const hookRows=A(mapping).flatMap(m=>A(m.mappings)).filter(x=>x.topic_hook===t.source_hook_id);
              const hookTitle=hookRows[0]?.topic_hook_tittel||t.source_hook_id;
              const ev=eById.get(t.theory_id)||{};
              const ranked=secs.map(s=>{
                const text=`${s.title} ${s.prose}`;
                const label=bind(`${t.label||''} ${hookTitle}`,text);
                const def=bind(t.definition,text);
                const lim=A(t.limitations).map(x=>bind(x,text)).sort((a,b)=>b.r-a.r||b.m-a.m)[0]||{m:0,n:0,r:0};
                const rat=bind(ev.rationale||'',text);
                const score=label.m*4+def.m*2+lim.m*2+rat.m;
                return {file:s.file,section:s.id,score,label_m:label.m,def_m:def.m,def_r:+def.r.toFixed(3),lim_m:lim.m,lim_r:+lim.r.toFixed(3),rationale_m:rat.m};
              }).sort((a,b)=>b.score-a.score||b.def_r-a.def_r||b.lim_r-a.lim_r).slice(0,3);
              console.log(JSON.stringify({field,theory_id:t.theory_id,hook:t.source_hook_id,emne_ids:emnes,top:ranked}));
            }
          }
          NODE
