name: TEMP Historie theory gap diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/TEMP-historie-theory-gap-diagnostic.yml'
      - 'data/fag/historie/**'
      - 'data/fagverk/historie/**'
      - 'data/fagverk/fagverk_registry.json'
      - 'tools/audit-historie-theory-integrity.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive all scholarly-field and thinker attribution gaps
        run: |
          node <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const A=v=>Array.isArray(v)?v:[];
          const norm=v=>String(v||'').toLowerCase().replace(/\s+/g,' ').trim();
          const isAcademic=s=>['academic_monograph','academic_secondary_monograph','peer_reviewed_journal_article'].includes(s?.source_type);
          const isInlineAcademic=s=>['scholarly_book','academic_monograph','academic_secondary_monograph','peer_reviewed_journal_article'].includes(s?.type||s?.source_type);
          const theories=read('data/fag/historie/theory_objects_historie_canonical_v5_5.json');
          const attribution=read('data/fag/historie/theory_attribution_historie_canonical_v1.json');
          const historiography=read('data/fag/historie/historiography_evidence_historie_v1.json');
          const registry=read('data/fagverk/fagverk_registry.json');
          const histById=new Map(A(historiography.sources).map(s=>[s.source_id,s]));
          const histByField=new Map(A(historiography.coverage).map(c=>[c.domain_id,c]));
          const scholarly=[];
          for(const row of A(registry?.subjects?.historie?.chapters)){
            const chapter=read(row.file);
            const ids=new Set(A(chapter.narrativeArchitecture?.historiographyEvidenceSourceIds));
            for(const id of A(histByField.get(row.primary_domain_id)?.source_ids))ids.add(id);
            const inline=new Map();
            let limitationCount=0;
            for(const modulePath of A(chapter.moduleFiles)){
              const module=read(modulePath);
              for(const id of A(module.historiographyEvidence?.sourceIds))ids.add(id);
              limitationCount+=A(module.sourceLimitations).filter(v=>norm(v).length>=45).length;
              for(const s of A(module.sources))if(isInlineAcademic(s))inline.set(`${norm(s.label||s.title)}|${s.url||''}`,s);
            }
            const canonical=[...ids].map(id=>histById.get(id)).filter(Boolean).filter(isAcademic);
            scholarly.push({field:row.primary_domain_id,canonical:canonical.length,inline:inline.size,total:canonical.length+inline.size,inline_limitations:limitationCount,inline_sources:[...inline.values()].map(s=>s.label||s.title)});
          }
          const usedThinkers=[...new Set(theories.flatMap(t=>A(t.thinker_ids)))].sort();
          const attributed=new Set(A(attribution.thinkers).map(t=>t.thinker_id));
          const missingThinkers=usedThinkers.filter(id=>!attributed.has(id));
          console.log('SCHOLARLY_FIELD_GAPS='+JSON.stringify(scholarly.filter(r=>r.total<2)));
          console.log('SCHOLARLY_FIELD_MATRIX='+JSON.stringify(scholarly));
          console.log('REQUIRED_THINKERS_COUNT='+usedThinkers.length);
          console.log('MISSING_THINKERS='+JSON.stringify(missingThinkers));
          NODE
