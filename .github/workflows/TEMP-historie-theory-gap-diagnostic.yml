name: TEMP Historie legacy mapping schema diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/TEMP-historie-theory-gap-diagnostic.yml'
      - 'data/fag/historie/**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual emnemapping schema
        run: |
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('data/fag/historie/emnemapping_historie_canonical_v4_5.json','utf8'));
          const ids=['em_his_tid_periodisering_epoker','em_his_kildekritikk_arkiv_spor','em_his_stat_institusjoner'];
          for(const id of ids){
            const row=m.find(r=>r.emne_id===id);
            console.log(id+'='+JSON.stringify(row));
          }
          NODE
