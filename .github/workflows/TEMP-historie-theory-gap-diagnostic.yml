name: TEMP Historie theory gap diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/TEMP-historie-theory-gap-diagnostic.yml'
      - 'data/fag/**'
      - 'data/fagverk/**'
      - 'tools/audit-historie-theory-integrity.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harvest existing canonical thinker work metadata
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const A=v=>Array.isArray(v)?v:[];
          const pensum=read('data/fag/historie/historiepensum_canonical_v4_5.json');
          const ids=[...new Set(A(pensum.domains).flatMap(d=>A(d.canonical_thinker_ids)))].sort();
          const wanted=new Set(ids),hits=new Map(ids.map(id=>[id,[]]));
          const roots=['data/fag','data/fagverk'];
          function walk(dir){if(!fs.existsSync(dir))return[];let out=[];for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())out=out.concat(walk(p));else if(e.isFile()&&e.name.endsWith('.json'))out.push(p);}return out;}
          function visit(v,file){if(Array.isArray(v)){for(const x of v)visit(x,file);return;}if(!v||typeof v!=='object')return;const id=v.thinker_id||v.id; if(wanted.has(id)){const works=A(v.works).map(w=>typeof w==='string'?w:(w?.title||w?.name)).filter(Boolean);const name=v.name||v.label||null;const why=v.why||v.contribution||v.role||null;if(name||works.length||why)hits.get(id).push({file,name,works,why});}for(const x of Object.values(v))visit(x,file);}
          for(const file of roots.flatMap(walk)){let doc;try{doc=read(file);}catch{continue;}visit(doc,file);}
          const found=ids.filter(id=>hits.get(id).some(h=>h.name&&h.works.length));
          const partial=ids.filter(id=>!found.includes(id)&&hits.get(id).length);
          const missing=ids.filter(id=>!hits.get(id).length);
          console.log('CANONICAL_THINKERS_COUNT='+ids.length);
          console.log('EXISTING_NAME_WORK_COUNT='+found.length);
          console.log('EXISTING_NAME_WORK='+JSON.stringify(Object.fromEntries(found.map(id=>[id,hits.get(id)]))));
          console.log('PARTIAL_EXISTING='+JSON.stringify(Object.fromEntries(partial.map(id=>[id,hits.get(id)]))));
          console.log('NO_EXISTING_METADATA='+JSON.stringify(missing));
          NODE
