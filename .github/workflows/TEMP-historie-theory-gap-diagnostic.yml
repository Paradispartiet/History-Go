name: TEMP Historie strict proof compatibility repair

on:
  push:
    branches:
      - agent/fagverk-historie-theory-integrity-proof-20260820

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Align strict proof with canonical fulltext projection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/audit-historie-theory-integrity.mjs')
          s=p.read_text()
          old1="""  const theories=readJson('data/fag/historie/theory_objects_historie_canonical_v5_5.json');\n  const theoryEvidence=readJson('data/fag/historie/theory_evidence_historie_canonical_v1.json');"""
          new1="""  const theories=readJson('data/fag/historie/theory_objects_historie_canonical_v5_5.json');\n  const emner=readJson('data/fag/historie/emner_historie_canonical_v4_5.json');\n  const emneById=new Map(emner.map(emne=>[emne.emne_id,emne]));\n  const theoryEvidence=readJson('data/fag/historie/theory_evidence_historie_canonical_v1.json');"""
          old2="""        const joined=paragraphs.join(' ');\n        const definition=norm(theory.definition);\n        assert.ok(joined.includes(definition),`${modulePath}/${sec.id}: theory-definition er ikke faktisk brukt i canonical prosa (${theory.theory_id})`);\n        assert.ok(list(theory.limitations).some(l=>joined.includes(norm(l))),`${modulePath}/${sec.id}: theory-begrensning er ikke faktisk brukt i canonical prosa (${theory.theory_id})`);"""
          new2="""        const joined=paragraphs.join(' ');\n        const emne=emneById.get(sec.emneId);\n        assert.ok(emne,`${modulePath}/${sec.id}: canonical emne mangler for theory-projection ${sec.emneId}`);\n        const emneDefinition=norm(emne.definition);\n        const theoryDefinition=norm(theory.definition);\n        const projectedTheoryDefinition=theoryDefinition&&theoryDefinition!==emneDefinition\n          ? (theoryDefinition.startsWith(`${emneDefinition} `)?theoryDefinition.slice(emneDefinition.length).trim():theoryDefinition)\n          : theoryDefinition;\n        assert.ok(projectedTheoryDefinition&&joined.includes(projectedTheoryDefinition),`${modulePath}/${sec.id}: canonical theory-projection er ikke faktisk brukt i prosa (${theory.theory_id})`);\n        assert.ok(list(theory.limitations).some(l=>joined.includes(norm(l))),`${modulePath}/${sec.id}: theory-begrensning er ikke faktisk brukt i canonical prosa (${theory.theory_id})`);"""
          if s.count(old1)!=1: raise SystemExit(f'expected theory load target once, got {s.count(old1)}')
          if s.count(old2)!=1: raise SystemExit(f'expected prose proof target once, got {s.count(old2)}')
          p.write_text(s.replace(old1,new1).replace(old2,new2))
          PY
      - name: Verify strict Historie proof
        run: |
          node --check tools/audit-historie-theory-integrity.mjs
          node tools/audit-historie-theory-integrity.mjs
          node --test tests/historie-theory-integrity.test.mjs
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/audit-historie-theory-integrity.mjs
          rm .github/workflows/TEMP-historie-theory-gap-diagnostic.yml
          git add .github/workflows/TEMP-historie-theory-gap-diagnostic.yml
          git commit -m "fix(historie): prove canonical theory projection"
          git push origin HEAD:${GITHUB_REF_NAME}
