name: Civication Sport-utøver Role World materializer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: civication-sport-utover-role-world-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/civication-sport-utover-role-world'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Materialize and verify Sport-utøver Role World
        shell: bash
        run: |
          set -o pipefail
          {
            node scripts/patch-civication-sport-utover-resolver-alias.mjs
            node scripts/materialize-civication-sport-utover-role-world.mjs
          } 2>&1 | tee /tmp/sport-utover-materializer.log

      - name: Upload materializer failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sport-utover-materializer-log
          path: /tmp/sport-utover-materializer.log
          if-no-files-found: error
          retention-days: 1

      - name: Commit verified permanent outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            js/Civication/systems/civicationCareerRoleResolver.js \
            data/Civication/roleModels/sport/profesjonell_utover.json \
            data/Civication/mailFamilies/sport/job/sport_utover_job.json \
            data/Civication/mailFamilies/sport/people/sport_utover_people.json \
            data/Civication/mailFamilies/sport/conflict/sport_utover_conflict.json \
            data/Civication/mailFamilies/sport/story/sport_utover_story.json \
            data/Civication/mailFamilies/sport/event/sport_utover_event.json \
            data/Civication/mailFamilies/sport/knowledge/sport_utover_knowledge.json \
            data/Civication/mailPlans/sport/sport_utover_plan.json \
            data/Civication/praksisfortellinger_registry.json \
            data/Civication/lifestory/manifest.json \
            data/Civication/lifestory/roles/sport_utover/role.json \
            data/Civication/lifestory/roles/sport_utover/threads.json \
            data/Civication/lifestory/roles/sport_utover/scenes.json \
            data/Civication/roleWorlds/sport/sport_utover.json \
            data/Civication/roleWorlds/index.json \
            data/Civication/roleWorldPolicy.json \
            data/Civication/roleWorldAuthoringChecklist.json \
            data/Civication/careerGameplayPolicy.json \
            data/Civication/careerGameplayMatrix.json \
            data/Civication/compiledSceneRegistryV1.json \
            reports/civication-career-gameplay-matrix.md \
            docs/CIVICATION_ROLE_WORLD_STANDARD.md \
            docs/CIVICATION_ROLE_WORLD_AUTHORING_GUIDE.md \
            tests/civication-sport-utover-role-world.test.js \
            tests/civication-role-world-contract.test.js \
            tests/civication-lifestory-endings.test.js
          if git diff --cached --quiet; then
            echo "Sport-utøver Role World already materialized; nothing to commit."
            exit 0
          fi
          git commit -m "Materialize Sport-utøver as fifth Civication Role World"
          git push origin HEAD:${{ github.head_ref }}
