name: Consolidate Nedre Foss final reports

on:
  push:
    branches: [agent/fill-nedre-foss-history-rounds-batch1]
    paths:
      - '.github/workflows/nedre-foss-clean-final-reports.yml'

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fill-nedre-foss-history-rounds-batch1
          fetch-depth: 0
      - name: Keep only validation from final materialized state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reports/nedre-foss-history-rounds-batch1
          rm -f reports/nedre-foss-history-rounds-batch1.md
          rm -f .github/workflows/nedre-foss-clean-final-reports.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit --no-verify -m 'chore: consolidate Nedre Foss validation reports'
          git push origin HEAD:agent/fill-nedre-foss-history-rounds-batch1
