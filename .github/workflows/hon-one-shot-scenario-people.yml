name: House of Nerds one-shot scenario People sync
on:
  push:
    branches: [place/house-of-nerds-person-evidence-20261101]
    paths: [.github/workflows/hon-one-shot-scenario-people.yml]
permissions:
  contents: write
jobs:
  generate:
    if: github.ref == 'refs/heads/place/house-of-nerds-person-evidence-20261101'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - run: node scripts/build-place-open-payloads.mjs
      - name: Commit bounded generated People and runtime
        shell: bash
        run: |
          set -eu
          git add -A -- data/Civication/scenarioPeople/generated/ data/Civication/scenarioPeople_index.json data/runtime/
          changed=$(git diff --cached --name-only | wc -l)
          echo "Changed generated files: $changed"
          git diff --cached --name-only
          if [ "$changed" -gt 28 ]; then exit 1; fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync House of Nerds scenario People and place-open projection"
            git push origin HEAD:place/house-of-nerds-person-evidence-20261101
          fi
