name: Temporary materialize Sport phase 3

on:
  pull_request:
    paths:
      - "tools/materialize-sport-phase3-once.mjs"
      - ".github/workflows/temporary-materialize-sport-phase3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Diagnose Sport method rows
        run: |
          node - <<'NODE'
          const doc = require('./data/fag/sport/methods_sport_canonical_v4_5.json');
          const rows = doc.methods;
          const invalid = rows.map((row, index) => ({ index, type: row === null ? 'null' : typeof row, method_id: row?.method_id ?? null })).filter((item) => !item.method_id);
          console.log(JSON.stringify({ rowCount: rows.length, validMethodIds: rows.filter((row) => typeof row?.method_id === 'string').length, invalid }, null, 2));
          NODE
      - name: Materialize and validate Sport
        run: node tools/materialize-sport-phase3-once.mjs
      - name: Persist Sport canonical trace after materialization failure
        if: failure()
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          node - <<'NODE' > /tmp/sport-phase3-debug.txt 2>&1
          const fs = require('fs');
          const target = 'em_sport_kropp_konkurranse';
          const files = [
            'data/fag/sport/emner_sport_canonical_v4_5.json',
            'data/fag/sport/pensum_sport_canonical_v4_5.json',
            'data/fag/sport/fagkart_sport_canonical_v4_5.json',
            'data/fag/sport/emnemapping_sport_canonical_v4_5.json'
          ];
          function find(value, path = '$', hits = []) {
            if (Array.isArray(value)) {
              value.forEach((item, index) => find(item, `${path}[${index}]`, hits));
              return hits;
            }
            if (!value || typeof value !== 'object') return hits;
            if (JSON.stringify(value).includes(target)) hits.push({ path, value });
            for (const [key, item] of Object.entries(value)) {
              if (item && typeof item === 'object') find(item, `${path}.${key}`, hits);
            }
            return hits;
          }
          for (const file of files) {
            const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
            const hits = find(doc).filter((hit) => {
              const parentDepth = (hit.path.match(/[.[]/g) || []).length;
              return parentDepth <= 4;
            });
            console.log(`\n=== ${file} ===`);
            console.log(JSON.stringify(hits, null, 2));
          }
          NODE
          set +e
          node --input-type=module - <<'NODE' >> /tmp/sport-phase3-debug.txt 2>&1
          import { auditSportPhase3 } from './scripts/audit-fagverk-sport-phase3.mjs';
          try {
            auditSportPhase3({ writeReport: false, checkReport: false });
          } catch (error) {
            console.error('\n=== AUDIT STACK ===');
            console.error(error.stack || error);
            process.exitCode = 1;
          }
          NODE
          set -e
          cat /tmp/sport-phase3-debug.txt
          git reset --hard HEAD
          mkdir -p reports/fagverk
          cp /tmp/sport-phase3-debug.txt reports/fagverk/sport-phase3-debug.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/fagverk/sport-phase3-debug.txt
          git diff --cached --check
          git commit -m 'Trace Sport Fase 3 canonical orphan'
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Remove one-shot materializer
        run: |
          rm tools/materialize-sport-phase3-once.mjs
          rm .github/workflows/temporary-materialize-sport-phase3.yml
      - name: Commit materialized tree
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Materialiser Sport Fase 3'
          git push origin "HEAD:${HEAD_BRANCH}"
