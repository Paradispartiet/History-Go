name: Oslo Oppdag Kvadraturen art sites batch 1 coordinates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-oppdag-kvadraturen-art-sites-batch-1-coordinates.yml'

permissions:
  contents: write

jobs:
  coordinates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve Mustadgården address
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-sites-batch-1/coordinates'
          mkdir -p "$outdir"
          npm run places:coords:find:address -- --address 'Kongens gate 3 Oslo' \
            | tee "$outdir/mustadgarden_kongens_gate_3.json"

      - name: Resolve Skulptursonen street geometry
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-sites-batch-1/coordinates'

          curl --max-time 30 --retry 2 --fail --silent --show-error \
            -H 'User-Agent: History-Go coordinate audit (github.com/Paradispartiet/History-Go)' \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'format=jsonv2' \
            --data-urlencode 'q=Skulptursonen i Øvre Slottsgate, Oslo, Norge' \
            --data-urlencode 'countrycodes=no' \
            --data-urlencode 'limit=10' \
            --data-urlencode 'addressdetails=1' \
            --data-urlencode 'namedetails=1' \
            --data-urlencode 'polygon_geojson=1' \
            --data-urlencode 'viewbox=10.70,59.94,10.78,59.88' \
            --data-urlencode 'bounded=1' \
            -o "$outdir/skulptursonen_nominatim.json"

          query='[out:json][timeout:25];way["highway"]["name"="Øvre Slottsgate"](59.900,10.720,59.920,10.760);out geom tags;'
          if ! curl --max-time 35 --retry 1 --fail --silent --show-error --get \
            'https://overpass-api.de/api/interpreter' \
            --data-urlencode "data=${query}" \
            -o "$outdir/ovre_slottsgate_overpass.json"; then
            curl --max-time 45 --retry 1 --fail --silent --show-error --get \
              'https://overpass.kumi.systems/api/interpreter' \
              --data-urlencode "data=${query}" \
              -o "$outdir/ovre_slottsgate_overpass.json"
          fi
          jq -e '.elements | length > 0' "$outdir/ovre_slottsgate_overpass.json" >/dev/null

      - name: Persist coordinate evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/oslo-oppdag-kvadraturen-art-sites-batch-1/coordinates
          git commit -m 'Save Oppdag Kvadraturen art site coordinate evidence'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
