name: Oslo Oppdag Kvadraturen art sites batch 1 finalize

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-oppdag-kvadraturen-art-sites-batch-1-coordinates.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Register place sources
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/places/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const additions = [
            'places/historie/oslo/places_historie_oslo_oppdag_kvadraturen_art_sites_batch_01.json',
            'places/kunst/oslo/places_kunst_oslo_oppdag_kvadraturen_art_sites_batch_01.json'
          ];
          for (const file of additions) {
            if (!manifest.files.includes(file)) manifest.files.push(file);
          }
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          fs.mkdirSync('reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation', { recursive: true });
          NODE

      - name: Validate JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          jq empty data/places/historie/oslo/places_historie_oslo_oppdag_kvadraturen_art_sites_batch_01.json
          jq empty data/places/kunst/oslo/places_kunst_oslo_oppdag_kvadraturen_art_sites_batch_01.json
          jq empty data/wonderkammer/oslo_oppdag_kvadraturen_art_microplaces_batch_2.json
          jq empty data/wonderkammer/index.json
          echo 'Art sites batch 1 JSON syntax: OK' \
            | tee reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation/json-syntax.txt

      - name: Build places index
        shell: bash
        run: |
          set -o pipefail
          npm run places:index:build \
            | tee reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation/places-index-build.txt

      - name: Check places index
        shell: bash
        run: |
          set -o pipefail
          npm run places:index:check \
            | tee reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation/places-index-check.txt

      - name: Check strict coordinate intake against branch merge-base
        shell: bash
        run: |
          set -o pipefail
          BASE="$(git merge-base HEAD origin/main)"
          COORD_INTAKE_BASE="$BASE" npm run places:coords:intake \
            | tee reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation/coordinate-intake.txt

      - name: Check canonical emne IDs
        shell: bash
        run: |
          set -o pipefail
          npm run places:emner:check \
            | tee reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation/emne-check.txt

      - name: Capture place health and hold baseline
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run health:places \
            | tee reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation/health-places.txt
          HEALTH_STATUS=${PIPESTATUS[0]}
          set -e
          grep -q '^Errors: 40$' reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation/health-places.txt
          echo "Raw health exit: ${HEALTH_STATUS}; baseline errors remain 40."

      - name: Check split manifest sync
        shell: bash
        run: |
          set -o pipefail
          npm run audit:places-split-manifest-sync \
            | tee reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation/split-manifest-sync.txt

      - name: Check coordinate source contract
        shell: bash
        run: |
          set -o pipefail
          npm run test:coordinate-source-contract \
            | tee reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation/coordinate-contract.txt

      - name: Validate Den røde prikk Wonderkammer integration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' | tee reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation/wonderkammer-validation.txt
          const fs = require('fs');
          const batchPath = 'data/wonderkammer/oslo_oppdag_kvadraturen_art_microplaces_batch_2.json';
          const index = JSON.parse(fs.readFileSync('data/wonderkammer/index.json', 'utf8'));
          const places = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const batch = JSON.parse(fs.readFileSync(batchPath, 'utf8'));

          if (!index.files.includes(batchPath)) throw new Error('Wonderkammer batch 2 is not registered');
          const placeIds = new Set(places.map((p) => p.id));
          if (!placeIds.has('mustadgarden_kongens_gate_3')) throw new Error('Mustadgården parent missing from places index');

          const expectedId = 'wk_mustadgarden_kongens_gate_3_den_rode_prikk_otto_kunzli';
          const batchIds = [];
          for (const entry of batch.places || []) {
            if (!placeIds.has(entry.place_id)) throw new Error(`Missing parent place: ${entry.place_id}`);
            for (const chamber of entry.chambers || []) batchIds.push(chamber.id);
          }
          if (!batchIds.includes(expectedId)) throw new Error('Expected Den røde prikk chamber is missing');
          if (new Set(batchIds).size !== batchIds.length) throw new Error('Duplicate IDs inside new Wonderkammer batch');

          const existingIds = new Map();
          const collect = (value, file) => {
            if (!value || typeof value !== 'object') return;
            if (Array.isArray(value)) {
              for (const item of value) collect(item, file);
              return;
            }
            if (Array.isArray(value.chambers)) {
              for (const chamber of value.chambers) {
                if (chamber?.id && !existingIds.has(chamber.id)) existingIds.set(chamber.id, file);
              }
            }
            for (const child of Object.values(value)) collect(child, file);
          };
          for (const file of index.files) {
            if (file === batchPath) continue;
            if (!fs.existsSync(file)) throw new Error(`Registered Wonderkammer file missing: ${file}`);
            collect(JSON.parse(fs.readFileSync(file, 'utf8')), file);
          }
          const collisions = batchIds.filter((id) => existingIds.has(id));
          if (collisions.length) throw new Error(`New Wonderkammer ID collision: ${collisions.join(', ')}`);

          console.log('Mustadgården parent resolves against places_index.json.');
          console.log(`Den røde prikk chamber ID is unique: ${expectedId}`);
          NODE

      - name: Check whitespace
        shell: bash
        run: |
          set -o pipefail
          git diff --check \
            | tee reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation/git-diff-check.txt

      - name: Remove temporary workflow and commit final results
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/oslo-oppdag-kvadraturen-art-sites-batch-1-coordinates.yml
          git add data/places/manifest.json
          git add data/places/places_index.json
          git add reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation
          git add -u .github/workflows/oslo-oppdag-kvadraturen-art-sites-batch-1-coordinates.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize Oppdag Kvadraturen art sites batch 1'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
