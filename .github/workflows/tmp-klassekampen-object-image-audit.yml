name: TEMP Klassekampen object image audit

on:
  push:
    branches:
      - agent/klassekampen-phase2-v3-20261004

permissions:
  contents: read

concurrency:
  group: klassekampen-object-image-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/klassekampen-phase2-v3-20261004
          fetch-depth: 0

      - name: Inspect object image without modifying it
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='bilder/kort/objects/klassekampen_forste_utgave_1969.jpg'
          test -f "$IMAGE"
          stat -c 'bytes=%s' "$IMAGE"
          sha256sum "$IMAGE"
          file "$IMAGE"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bilder/kort/objects/klassekampen_forste_utgave_1969.jpg')
          data = p.read_bytes()
          i = 2
          if data[:2] != b'\xff\xd8':
              raise SystemExit('not a JPEG')
          while i < len(data):
              if data[i] != 0xFF:
                  i += 1
                  continue
              while i < len(data) and data[i] == 0xFF:
                  i += 1
              marker = data[i]
              i += 1
              if marker in (0xD8, 0xD9):
                  continue
              length = int.from_bytes(data[i:i+2], 'big')
              if marker in {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}:
                  height = int.from_bytes(data[i+3:i+5], 'big')
                  width = int.from_bytes(data[i+5:i+7], 'big')
                  print(f'width={width}')
                  print(f'height={height}')
                  print(f'sof_marker=0x{marker:02x}')
                  break
              i += length
          else:
              raise SystemExit('JPEG dimensions not found')
          PY
          printf 'magick='; command -v magick || true
          printf 'convert='; command -v convert || true
          printf 'jpegoptim='; command -v jpegoptim || true
          printf 'cjpeg='; command -v cjpeg || true
