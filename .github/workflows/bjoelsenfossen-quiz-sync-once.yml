name: Bjølsenfossen one-time 4x7 migration (section-scoped)
on:
  push:
    branches:
      - work/oslo-akerselva-v1-bolk-20261116
    paths:
      - .github/workflows/bjoelsenfossen-quiz-sync-once.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bjoelsenfossen-quiz-once
  cancel-in-progress: false
jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and migrate one place only
        run: |
          npm ci --no-audit --no-fund
          node scripts/migrate-bjoelsenfossen-quiz-once.mjs
      - name: Build deterministic History production context
        run: |
          node scripts/build-quiz-production-context.mjs --category historie --target bjoelsenfossen --output data/quiz/production_context/historie/bjoelsenfossen.json
          node scripts/build-quiz-production-context.mjs --category historie --target bjoelsenfossen --output data/quiz/production_context/historie/bjoelsenfossen.json --check
      - name: Canonical Knowledge update and focused test
        run: |
          npm run knowledge:canonical:write
          npm run knowledge:canonical:check
          node --test tests/bjoelsenfossen-4x7-migration.test.mjs
          node scripts/audit-quiz-manifest-v2.mjs
      - name: Commit only after all focused checks pass; remove one-time job
        run: |
          rm scripts/migrate-bjoelsenfossen-quiz-once.mjs .github/workflows/bjoelsenfossen-quiz-sync-once.yml
          git add data/quiz/historie/bjoelsenfossen_sets.json \
            data/quiz/production_briefs/historie/bjoelsenfossen.json \
            data/quiz/production_context/historie/bjoelsenfossen.json \
            data/quiz/manifest.json data/fag/fag_manifest.json \
            data/quizcards/historie/bjoelsenfossen_quizcard_v1.json \
            data/quizcards/historie/manifest.json \
            data/knowledge/ reports/knowledge-* \
            reports/place-production/oslo-akerselva-sagene-grunerlokka-v1-20261116.md \
            scripts/knowledge-canonical-data.mts \
            scripts/migrate-bjoelsenfossen-quiz-once.mjs \
            .github/workflows/bjoelsenfossen-quiz-sync-once.yml
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Migrate Bjølsenfossen to sourced 4x7 quiz and preserve 37 legacy Knowledge refs'
          git push origin HEAD:work/oslo-akerselva-v1-bolk-20261116
