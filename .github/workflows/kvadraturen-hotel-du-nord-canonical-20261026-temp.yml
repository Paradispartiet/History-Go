name: Kvadraturen Hotel du Nord canonical quiz production 20261026
on:
  push:
    branches:
      - research/oslo-sentrum-kvadraturen-v1-six-20261023
    paths:
      - '.github/workflows/kvadraturen-hotel-du-nord-canonical-20261026-temp.yml'
permissions:
  contents: write
concurrency:
  group: kvadraturen-hotel-du-nord-canonical-oneoff
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-kvadraturen-v1-six-20261023
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing QuizProduction and Knowledge tools
        run: |
          npm ci --no-audit --no-fund
          npm run build:scripts
      - name: Register source brief and generate deterministic Hotel du Nord production context
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import {buildQuizProductionContext} from './scripts/quiz-production-lib.mjs';
          const id='hotel_du_nord',cat='naeringsliv';
          const manifestPath='data/fag/fag_manifest.json';
          const fag=JSON.parse(await fs.readFile(manifestPath,'utf8'));
          assert.equal(fag[cat].quizProduction.targets[id],undefined,'Hotel du Nord already has production owner');
          fag[cat].quizProduction.targets[id]={
            source_brief:'../quiz/production_briefs/'+cat+'/'+id+'.json',
            context_artifact:'../quiz/production_context/'+cat+'/'+id+'.json',
            quiz_file:'../quiz/'+cat+'/'+id+'_sets.json'
          };
          await fs.writeFile(manifestPath,JSON.stringify(fag,null,2)+'\n');
          const ctx=await buildQuizProductionContext({categoryId:cat,targetId:id});
          assert.equal(ctx.profile,'narrow_3x7');
          assert.equal(ctx.claim_bank.length,21);
          assert.deepEqual(ctx.question_balance.counts,{fact:12,context:5,concept_theory:4});
          assert.deepEqual(ctx.set_plan.map(s=>s.planned_questions),[7,7,7]);
          assert.equal(ctx.source_review_status,'reviewed');
          await fs.mkdir('data/quiz/production_context/'+cat,{recursive:true});
          await fs.writeFile('data/quiz/production_context/'+cat+'/'+id+'.json',JSON.stringify(ctx,null,2)+'\n');
          // The canonical builder may resolve additional module, hook and method
          // dependencies. Embed precisely those resolved selections in the quiz.
          const fullQuizPath='data/quiz/'+cat+'/'+id+'_sets.json';
          const fullQuiz=JSON.parse(await fs.readFile(fullQuizPath,'utf8'));
          const selected=ctx.selected_curriculum;
          const fieldPairs=[
            ['pensum_module_ids','module_ids'],['emne_ids','emne_ids'],
            ['topic_hook_ids','topic_hook_ids'],['method_ids','method_ids'],
            ['thinker_ids','thinker_ids'],['works','works']
          ];
          for(const [target,source] of fieldPairs){
            fullQuiz.production_context[target]=selected[source]||[];
          }
          fullQuiz.production_context.required_inputs_loaded=ctx.required_inputs_loaded;
          fullQuiz.production_context.resolved_files=Object.fromEntries(Object.entries(ctx.resolved_files).map(([k,v])=>[k,v.path]));
          fullQuiz.production_context.existing_quiz_audit=ctx.existing_quiz_audit;
          await fs.writeFile(fullQuizPath,JSON.stringify(fullQuiz,null,2)+'\n');
          const qp='data/quiz/manifest.json',qm=JSON.parse(await fs.readFile(qp,'utf8'));
          assert.equal(qm.sets.some(s=>s.targetId===id),false);
          qm.sets.push({targetId:id,file:'data/quiz/'+cat+'/'+id+'_sets.json'});
          qm.sets.sort((a,b)=>a.targetId.localeCompare(b.targetId,'en'));
          await fs.writeFile(qp,JSON.stringify(qm,null,2)+'\n');
          console.log('Hotel du Nord canonical context: 21 sourced claims, 12 facts, five contexts, four concepts.');
          NODE
          node dist/scripts/knowledge-canonical-data.mjs --write
          node dist/scripts/knowledge-canonical-data.mjs --check
      - name: Link QuizCard to fullquiz Knowledge units and register canonical manifest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          const id='hotel_du_nord',cat='naeringsliv';
          const qp='data/quiz/'+cat+'/'+id+'_sets.json',cp='data/quizcards/'+cat+'/'+id+'_quizkort_v1.json';
          const quiz=JSON.parse(await fs.readFile(qp,'utf8'));
          const card=JSON.parse(await fs.readFile(cp,'utf8'));
          const questions=quiz.sets.flatMap(s=>s.questions);
          assert.equal(questions.length,21);
          assert.deepEqual(quiz.sets.map(s=>s.questions.length),[7,7,7]);
          assert.equal(questions.filter(q=>q.knowledge_link_status==='linked'&&q.knowledge_unit_ids?.includes(q.primary_knowledge_unit_id)).length,21);
          assert.equal(questions.filter(q=>q.question_type==='concept').length,4);
          assert.equal(questions.slice(0,14).filter(q=>q.question_type==='concept').length,0);
          assert.equal(questions.filter(q=>/^(når|hvilket år|i hvilket år)/i.test(q.question)||/^\d{4}$/.test(q.answer)).length,0);
          const byId=new Map(questions.map(q=>[q.id,q]));
          assert.equal(card.cards.length,1);
          assert.equal(card.cards[0].questions.length,10);
          for(const [i,item] of card.cards[0].questions.entries()){
            const q=byId.get(item.sourceQuestionId);
            assert.ok(q);
            for(const k of ['question','answer','answerIndex','knowledge','claim_id','emne_id'])assert.deepEqual(item[k],q[k],k+' drift');
            assert.deepEqual(item.options,q.options);
            assert.deepEqual(item.source_refs,q.source);
            for(const k of ['primary_knowledge_unit_id','knowledge_unit_ids','concept_ids','term_ids','knowledge_contract_version','knowledge_link_status'])item[k]=q[k];
            assert.equal(card.cards[0].answerKey[i].answer,q.answer);
          }
          quiz.production_status='manifested_knowledge_linked_pending_browser_qa';
          card.production_status='knowledge_linked_fullquiz_browser_pending';
          await fs.writeFile(qp,JSON.stringify(quiz,null,2)+'\n');
          await fs.writeFile(cp,JSON.stringify(card,null,2)+'\n');
          const manifestPath='data/quizcards/'+cat+'/manifest.json';
          const manifest=JSON.parse(await fs.readFile(manifestPath,'utf8'));
          assert.ok(!manifest.collections.includes(id+'_quizkort_v1.json'));
          manifest.collections.push(id+'_quizkort_v1.json');
          await fs.writeFile(manifestPath,JSON.stringify(manifest,null,2)+'\n');
          console.log('Hotel du Nord Knowledge-linked: 21 fullquiz and 10 QuizCard questions.');
          NODE
          node scripts/audit-quiz-production-context.mjs
          node scripts/audit-quiz-progression.mjs
          node scripts/audit-quiz-theory-binding.mjs
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit only Hotel du Nord, canonical Knowledge, and derived Fagverk release files
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/hotel-changed
          cat /tmp/hotel-changed
          grep -Ev '^(data/fag/fag_manifest.json|data/fagverk/fagverk_release.json|data/quiz/manifest.json|data/quiz/naeringsliv/hotel_du_nord_sets.json|data/quizcards/naeringsliv/hotel_du_nord_quizkort_v1.json|data/quizcards/naeringsliv/manifest.json|data/knowledge/knowledge_units.generated.json|reports/knowledge-id-backfill.json)$' /tmp/hotel-changed > /tmp/hotel-other || true
          test ! -s /tmp/hotel-other || { echo 'Unrelated file changes are not authorized'; cat /tmp/hotel-other; exit 1; }
          git add data/fag/fag_manifest.json data/fagverk/fagverk_release.json data/quiz/manifest.json data/quiz/production_context/naeringsliv/hotel_du_nord.json data/quiz/naeringsliv/hotel_du_nord_sets.json data/quizcards/naeringsliv/hotel_du_nord_quizkort_v1.json data/quizcards/naeringsliv/manifest.json data/knowledge/knowledge_units.generated.json reports/knowledge-id-backfill.json
          if git diff --cached --quiet; then echo 'No canonical changes'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Activate Hotel du Nord canonical 21-question fullquiz and ten Knowledge-linked QuizCards'
          git push origin HEAD:research/oslo-sentrum-kvadraturen-v1-six-20261023

# Replay after source-claim phase alignment (opening 7 / bridge 7 / final 7)

# Rerun with documented infrastructure method and work-organization theory in final set
