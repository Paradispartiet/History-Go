name: Agent Oslo sociolect manifest patch

on:
  push:
    branches:
      - agent/oslo-sociolect-atlas
    paths:
      - .github/workflows/agent-oslo-sociolect-manifest.yml

permissions:
  contents: write

jobs:
  patch-place-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-sociolect-atlas
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Register Frogner and Holmlia in canonical place manifest
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'data/places/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const required = [
            'places/by/oslo/places/frogner.json',
            'places/by/oslo/places/holmlia.json'
          ];
          manifest.files = Array.isArray(manifest.files) ? manifest.files : [];
          for (const relative of required) {
            if (!manifest.files.includes(relative)) manifest.files.push(relative);
          }
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Commit manifest patch
        run: |
          if git diff --quiet -- data/places/manifest.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/manifest.json
          git commit -m "Registrer Frogner og Holmlia i place-manifestet"
          git push origin HEAD:agent/oslo-sociolect-atlas
