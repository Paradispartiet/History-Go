name: Tøyenbadet vFerdig — actual app browser QA
on:
  pull_request:
    paths:
      - 'tests/toyenbadet-vferdig-real-browser-20261103.test.mjs'
      - 'data/places/sport/europa/norway/oslo_sport/toyenbadet.json'
      - 'data/runtime/place-open/toyenbadet.json'
      - 'data/quizcards/sport/toyenbadet_quizcard_v1.json'
      - 'bilder/places/candidates/oslo-vferdig-20261103/**'
      - '.github/workflows/toyenbadet-vferdig-real-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toyenbadet-browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Locate installed Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Test Tøyenbadet in actual app on mobile and desktop
        run: node tests/toyenbadet-vferdig-real-browser-20261103.test.mjs
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toyenbadet-vferdig-real-browser
          path: artifacts/toyenbadet-vferdig-real-browser
          if-no-files-found: ignore
          retention-days: 14
