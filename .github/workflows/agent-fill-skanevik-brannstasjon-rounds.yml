name: Fill Skånevik brannstasjon rounds

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-validate-commit:
    if: github.head_ref == 'agent/fill-skanevik-brannstasjon-rounds-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Skånevik brannstasjon content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def read_json(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def write_json(path, value):
              Path(path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          payload_dir = Path('.github/agent-payloads')
          place_path = Path('data/places/politikk/vestland/etne/skanevik_brannstasjon.json')
          place = read_json(place_path)
          place.update(read_json(payload_dir / 'skanevik-brannstasjon-place.json'))
          write_json(place_path, place)

          relation = read_json(payload_dir / 'skanevik-brannstasjon-relation.json')
          relations_path = Path('data/relations.json')
          relations = [row for row in read_json(relations_path) if row.get('id') != relation['id']]
          relations.append(relation)
          write_json(relations_path, relations)

          story = read_json(payload_dir / 'skanevik-brannstasjon-story.json')
          story['related_places'] = [place_id for place_id in story.get('related_places', []) if place_id != 'skanevik_barnehage']
          stories_path = Path('data/stories/stories_etnesjoen_politikk_rounds_batch1.json')
          stories = [row for row in read_json(stories_path) if row.get('id') != story['id']]
          stories.append(story)
          write_json(stories_path, stories)

          article = read_json(payload_dir / 'skanevik-brannstasjon-article.json')
          article['links']['related_places'] = [place_id for place_id in article['links'].get('related_places', []) if place_id != 'skanevik_barnehage']
          leksikon_path = Path('data/leksikon/places/vestland/etne/politikk/leksikon_etnesjoen_politikk_rounds_batch1.json')
          articles = [row for row in read_json(leksikon_path) if row.get('place_id') != article['place_id']]
          articles.append(article)
          write_json(leksikon_path, articles)
          PY
      - name: Skånevik brannstasjon dedicated test
        run: node tests/skanevik-brannstasjon-batch1-round-content.test.js
      - name: Inherited Etne round tests
        shell: bash
        run: |
          find tests -maxdepth 1 -type f -name '*batch1-round-content.test.js' \
            | grep -E '/(etne|etnesjoen|skanevik|steinsvollen|engebanen|skakkeringen|osnes|sjokanten|fikse)[^/]*batch1-round-content\.test\.js$' \
            | grep -v 'skanevik-brannstasjon-batch1-round-content.test.js' \
            | sort \
            | xargs -r -n1 node
      - run: npm run leksikon:ids:check
      - name: People audit
        run: bash scripts/check-people.sh
      - name: Restore generated people audit reports
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- \
            reports/people-invalid-place-refs.json \
            reports/people-invalid-place-refs.md \
            reports/people-of-places-status.json \
            reports/people-of-places-status.md \
            reports/people-place-coverage.json \
            reports/people-place-coverage.md
      - run: npm run typecheck:tools
      - run: npm run typecheck:web
      - name: Story integrity without new Skånevik brannstasjon errors
        shell: bash
        run: |
          set +e
          npx tsx tools/check_stories_integrity.mts > /tmp/story-integrity.log 2>&1
          status=$?
          set -e
          cat /tmp/story-integrity.log
          if grep -E 'skanevik_brannstasjon|st_skanevik_brannstasjon' /tmp/story-integrity.log; then
            echo "New Skånevik brannstasjon story-integrity error detected"
            exit 1
          fi
          echo "Story integrity exit status: $status; no Skånevik brannstasjon-specific errors"
      - run: git diff --check
      - name: Remove temporary payloads and workflow
        run: |
          rm -rf .github/agent-payloads
          rm .github/workflows/agent-fill-skanevik-brannstasjon-rounds.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name "History Go data agent"
          git config user.email "history-go-agent@users.noreply.github.com"
          git add -A
          git commit -m "Fill Skånevik brannstasjon place rounds batch 1"
          git push origin HEAD:${{ github.head_ref }}
