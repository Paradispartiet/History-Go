name: Embroidered badges batch 02 QA
on:
  pull_request:
    paths:
      - 'bilder/merker/*-brodert-v*.webp'
      - 'data/badges/*.json'
      - 'tests/badge-embroidered-rollout-v2.test.mjs'
      - '.github/workflows/qa-embroidered-batch02.yml'
permissions:
  contents: read
concurrency:
  group: badge-batch02-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  badge-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate new images and protected badges
        run: |
          node --test tests/badge-embroidered-rollout-v2.test.mjs
          node --test tests/badge-embroidered-rollout-v1.test.mjs
