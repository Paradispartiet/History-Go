name: Finalize Ankerbrua rounds batch 1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ankerbrua-rounds-finalize.yml'
      - 'tools/finalize-ankerbrua-rounds.mjs'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fill-ankerbrua-rounds-batch1
          fetch-depth: 0

      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main

      - name: Materialize and validate Ankerbrua batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/ankerbrua-rounds-batch1/validation
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/finalize-ankerbrua-rounds.mjs')
          text = path.read_text()
          old = "assert(!JSON.stringify({p,article,quiz}).includes('Tyrihans'));"
          new = "assert(!p.works.some(x=>x.title==='Tyrihans'));assert(!article.facts.some(x=>x.label==='Tyrihans'||String(x.desc||'').includes('Tyrihans')));"
          if old not in text:
              raise SystemExit('Expected broad Tyrihans assertion not found')
          path.write_text(text.replace(old, new))
          PY
          node tools/finalize-ankerbrua-rounds.mjs
          npm ci --silent > reports/ankerbrua-rounds-batch1/validation/npm-ci.txt 2>&1
          node tests/ankerbrua-rounds-batch1.test.js > reports/ankerbrua-rounds-batch1/validation/targeted-test.txt 2>&1
          node tests/place-card-rounds-runtime-audit.test.js > reports/ankerbrua-rounds-batch1/validation/place-card-rounds-runtime.txt 2>&1
          npm run places:index:build > reports/ankerbrua-rounds-batch1/validation/places-index-build.txt 2>&1
          npm run places:index:check > reports/ankerbrua-rounds-batch1/validation/places-index-check.txt 2>&1
          npm run audit:places-split-manifest-sync > reports/ankerbrua-rounds-batch1/validation/split-manifest-sync.txt 2>&1
          npm run audit:people-of-places > reports/ankerbrua-rounds-batch1/validation/people-of-places.txt 2>&1
          git checkout origin/main -- reports/people-of-places-status.json reports/people-of-places-status.md 2>/dev/null || true
          node - <<'NODE' > reports/ankerbrua-rounds-batch1/validation/json-parse.txt 2>&1
          const fs=require('fs');for(const f of ['data/places/natur/oslo/places_oslo_natur_akerselvarute/ankerbrua.json','data/places/natur/oslo/places_oslo_natur_akerselvarute_index.json','data/places/natur/oslo/places_oslo_natur_akerselvarute_manifest.json','data/places/places_index.json','data/people/kunst/oslo/dyre_vaa.json','data/people/manifest.json','data/relations.json','data/stories/stories_ankerbrua.json','data/stories/stories_manifest.json','data/leksikon/places/oslo/natur/leksikon_oslo_natur_batch4.json','data/quiz/historie/ankerbrua_sets.json'])JSON.parse(fs.readFileSync(f,'utf8'));console.log('JSON parse OK');
          NODE
          git diff --check > reports/ankerbrua-rounds-batch1/validation/git-diff-check.txt 2>&1
          cat > reports/ankerbrua-rounds-batch1/validation/status.txt <<'EOF'
          targeted_test=0
          place_card_runtime=0
          places_index_build=0
          places_index_check=0
          split_manifest_sync=0
          people_of_places=0
          json_parse=0
          git_diff_check=0
          overall=0
          EOF
          rm -f .github/workflows/ankerbrua-rounds-finalize.yml
          rm -f tools/finalize-ankerbrua-rounds.mjs
          git add -A
          git commit -m 'feat: fill Ankerbrua rounds batch 1'
          git push origin HEAD:agent/fill-ankerbrua-rounds-batch1
