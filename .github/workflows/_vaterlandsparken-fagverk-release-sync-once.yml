name: Vaterlandsparken Fagverk release sync
on:
  push:
    branches:
      - agent/vaterlandsparken-production-closure-20260911
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild Fagverk release manifest
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Verify Fagverk release manifest
        run: node scripts/build-fagverk-release-manifest.mjs --check
      - name: Remove one-shot workflow
        run: rm .github/workflows/_vaterlandsparken-fagverk-release-sync-once.yml
      - name: Commit canonical release manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk/fagverk_release.json .github/workflows/_vaterlandsparken-fagverk-release-sync-once.yml
          if git diff --cached --quiet; then
            echo "No release-manifest drift"
            exit 1
          fi
          git commit -m "Sync Vaterlandsparken Fagverk release manifest"
          git push origin HEAD
