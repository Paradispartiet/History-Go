name: Temporary Van Etten production

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  produce:
    if: github.head_ref == 'agent/oslo-coordinate-van-etten-production'
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-van-etten-production
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize Van Etten
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const placeId = 'van_etten';
          const placeRel = 'places/kunst/oslo/places_kunst/van_etten.json';
          const evidenceRel = 'oslo/kunst/van_etten.json';
          const lat = 59.91208993336192;
          const lon = 10.769374391768624;
          const sourceObjectId = 'geonorge-adresser-v1:0301:16675:3';
          const sourceUrl = 'https://ws.geonorge.no/adresser/v1/sok?sok=Smedgata%203%20Oslo';
          const coordNote = 'Offisiell adressekoordinat fra Geonorge Adresser API for Smedgata 3, OSLO. Punktet brukes som display- og unlock-anker for Van Etten. Den eksisterende recorden bla_skilt_enerhaugen_samfund_smedgata_34 viser til Smedgata 34 og er en separat fysisk og semantisk identitet; et tidligere automatisk treff skyldtes bare substring-match mellom Smedgata 3 og Smedgata 34.';

          const readJson = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const writeJson = (p, value) => {
            fs.mkdirSync(path.dirname(p), { recursive: true });
            fs.writeFileSync(p, JSON.stringify(value, null, 2) + '\n');
          };
          const haversine = (aLat, aLon, bLat, bLon) => {
            const R = 6371000;
            const dLat = (bLat - aLat) * Math.PI / 180;
            const dLon = (bLon - aLon) * Math.PI / 180;
            const x = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * Math.PI / 180) * Math.cos(bLat * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(x));
          };

          const currentIndex = readJson('data/places/places_index.json');
          if (currentIndex.some(p => p.id === placeId)) throw new Error(`${placeId} already exists in runtime index`);
          const nearby = currentIndex
            .filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon))
            .map(p => ({ id: p.id, name: p.name, category: p.category, distanceMeters: Math.round(haversine(lat, lon, p.lat, p.lon) * 10) / 10 }))
            .filter(p => p.distanceMeters <= 350)
            .sort((a, b) => a.distanceMeters - b.distanceMeters);

          const place = {
            id: placeId,
            name: 'Van Etten',
            lat,
            lon,
            r: 60,
            category: 'kunst',
            year: 2020,
            period: 'Kunstrom etablert i 2020',
            emne_ids: [
              'em_kunst_institusjonskritikk_og_representasjon',
              'em_kunst_kvalitet_kritikk_og_symbolsk_kapital',
              'em_kunst_okonomi_og_finansiering'
            ],
            desc: 'Uavhengig, non-profit samtidskunststed i Smedgata 3 på Enerhaugen, etablert i 2020 og særlig orientert mot separatutstillinger, kunstnerisk produksjon og kritisk dialog.',
            popupDesc: 'Van Etten er et uavhengig, non-profit samtidskunststed i Smedgata 3 på Enerhaugen. Stedet ble etablert i 2020 og drives av Katja Jarem og Øyvind Sørfjordmo. Programmet har særlig vært orientert mot separatutstillinger og prosjekter som gir kunstnere rom til produksjon, konsentrert presentasjon og kritisk samtale.\n\nSom kunstnerdrevet og ikke-kommersielt visningssted representerer Van Etten en annen institusjonslogikk enn et tradisjonelt salgsgalleri. Det gjør stedet relevant for spørsmål om hvordan kunstnere organiserer egne plattformer, hvordan små institusjoner skaper rom for eksperimentering, og hvordan symbolsk kapital, nettverk og synlighet bygges utenfor de største institusjonene.\n\nDen konkrete adressen er Smedgata 3. Under coordinate-intaken traff en enkel tekstmatch en eksisterende record med ID `bla_skilt_enerhaugen_samfund_smedgata_34`, men dette er et helt annet sted i Smedgata 34. History Go behandler derfor Van Etten som en egen fysisk og institusjonell identitet.',
            quiz_profile: {
              place_type: 'kunstgalleri',
              subtype: 'kunstnerdrevet_non_profit_samtidskunststed',
              signature_features: [
                'fast adresse i Smedgata 3',
                'etablert i 2020',
                'uavhengig og non-profit profil',
                'drevet av Katja Jarem og Øyvind Sørfjordmo',
                'vekt på separatutstillinger, produksjon og kritisk dialog'
              ],
              primary_angles: [
                'kunstnerdrevne_visningssteder',
                'non_profit_institusjonsmodell',
                'separatutstillinger_og_produksjon',
                'kritisk_dialog',
                'kunstfelt_og_symbolsk_kapital'
              ],
              question_families: [
                'institusjonshistorie',
                'utstillingspraksis',
                'kunstnerstyring_og_organisering',
                'kunstfelt_og_nettverk',
                'kontrast'
              ],
              avoid_angles: [
                'generisk_enerhaugen_kunst',
                'omtale_som_tradisjonelt_kommersielt_salgsgalleri',
                'forveksle_smedgata_3_med_smedgata_34',
                'generisk_non_profit_uten_stedsforankring'
              ],
              must_include: [
                'den konkrete adressen Smedgata 3',
                'etableringen i 2020',
                'den uavhengige non-profit profilen',
                'rollen som kunstnerdrevet visnings- og produksjonssted'
              ],
              contrast_targets: [
                'galleri_map',
                'galleri_mini_oslo',
                'kosk_oslo'
              ],
              notes: 'Spør Van Etten som et konkret kunstnerdrevet og non-profit samtidskunststed. Eksterne utstillings-, institusjons- og kunstkritiske kilder skal dominere synlig quizinnhold.'
            },
            locatorType: 'building',
            sourceProvider: 'official_address',
            sourceObjectId,
            address: {
              street: 'Smedgata',
              number: '3',
              postcode: '0651',
              city: 'Oslo',
              country: 'NO'
            },
            geocodeAccuracy: 'rooftop',
            coordRole: 'display_marker',
            coordStatus: 'verified',
            coordSource: 'geonorge_adresser_v1',
            coordSourceId: sourceObjectId,
            coordSourceUrl: sourceUrl,
            coordType: 'address_point',
            coordVerifiedAt: '2026-07-20',
            coordNote
          };
          writeJson(path.join('data', placeRel), place);

          const evidence = {
            schemaVersion: '1.0',
            placeId,
            placeFile: `data/${placeRel}`,
            evidenceStatus: 'applied_to_place',
            coordinateDecision: 'do_not_change_coordinates_yet',
            currentCoordinate: {
              lat,
              lon,
              r: 60,
              coordStatus: 'verified',
              coordSource: 'geonorge_adresser_v1',
              coordType: 'address_point',
              coordNote
            },
            identity: {
              currentName: 'Van Etten',
              resolvedIdentity: 'Van Etten independent non-profit contemporary art space at Smedgata 3',
              identityStatus: 'resolved',
              identityProblem: '',
              locatorTypeCandidate: 'building',
              requiresSplit: false,
              splitReason: ''
            },
            requiredEvidence: [
              'entydig offisielt adressepunkt for Smedgata 3',
              'eksplisitt avvisning av substring-treffet mot en separat Smedgata 34-record',
              'duplikat- og fysisk overlap-kontroll mot eksisterende Enerhaugen- og Grønland-steder'
            ],
            evidence: [
              {
                sourceProvider: 'official_address',
                sourceName: 'geonorge_adresser_v1',
                sourceUrl,
                sourceObjectId,
                sourceQuality: 'official_address_plus_resolved_false_duplicate',
                finding: 'Geonorge returnerer ett entydig adressepunkt for Smedgata 3. Den eneste automatiske identitetsmatchen var en substring-feil mot bla_skilt_enerhaugen_samfund_smedgata_34, som eksplisitt representerer Smedgata 34 og ligger 186,6 meter unna.',
                canVerifyCoordinate: true,
                reason: 'Det offisielle adressepunktet representerer Van Ettens dokumenterte besøkssted, og den potensielle duplikaten er avvist som en separat adresse og identitet.'
              }
            ],
            addressCandidates: [
              {
                address: 'Smedgata 3 Oslo',
                sourceProvider: 'official_address',
                sourceObjectId,
                lat,
                lon,
                canApplyToPlace: true
              }
            ],
            sourceObjectCandidates: [
              { sourceProvider: 'official_address', sourceObjectId, canApplyToPlace: true }
            ],
            geometryCandidates: [],
            coordinateCandidates: [
              { lat, lon, coordRole: 'display_marker', canApplyToPlace: true }
            ],
            decision: {
              canBecomeVerified: true,
              blockedReason: '',
              nextAction: 'Kildekontrakt, false-duplicate-audit og representasjonsanker er anvendt på canonical place.'
            },
            notes: [coordNote]
          };
          writeJson(path.join('data/coordinate-evidence', evidenceRel), evidence);

          const placeManifestPath = 'data/places/manifest.json';
          const placeManifest = readJson(placeManifestPath);
          if (!placeManifest.files.includes(placeRel)) placeManifest.files.push(placeRel);
          writeJson(placeManifestPath, placeManifest);

          const evidenceManifestPath = 'data/coordinate-evidence/manifest.json';
          const evidenceManifest = readJson(evidenceManifestPath);
          if (!evidenceManifest.files.includes(evidenceRel)) evidenceManifest.files.push(evidenceRel);
          writeJson(evidenceManifestPath, evidenceManifest);

          const protocolPath = 'docs/coordinates/coordinate-control-protocol.md';
          let protocol = fs.readFileSync(protocolPath, 'utf8');
          const osloStart = protocol.indexOf('## Oslo');
          const noCoordStart = protocol.indexOf('### Dokumenterte Oslo-kontroller uten godkjent koordinat');
          if (osloStart < 0 || noCoordStart < 0) throw new Error('Could not locate bounded Oslo protocol section');
          const osloSection = protocol.slice(osloStart, noCoordStart);
          const rows = [...osloSection.matchAll(/^\| (\d+) \| `([^`]+)` \|.*$/gm)];
          if (!rows.length) throw new Error('No Oslo protocol rows found');
          const lastRow = rows[rows.length - 1];
          const maxBatch = Math.max(...rows.map(m => Number(m[1])));
          const nextBatch = maxBatch + 1;
          const newRow = `| ${nextBatch} | \`${placeId}\` | Van Etten | verified | \`${sourceObjectId}\` |`;
          const insertAt = osloStart + lastRow.index + lastRow[0].length;
          protocol = protocol.slice(0, insertAt) + '\n' + newRow + protocol.slice(insertAt);

          const summaryRe = /Oslo-tabellen inneholder nå (\d+) verifiserte eller kildekontrollerte canonical steder\. Batch \d+ legger til .*? Antallet fullførte kontroller uten godkjent Oslo-koordinat er (\d+)\./;
          const summaryMatch = protocol.match(summaryRe);
          if (!summaryMatch) throw new Error('Could not locate Oslo protocol summary');
          const newTotal = Number(summaryMatch[1]) + 1;
          const noCoordCount = Number(summaryMatch[2]);
          protocol = protocol.replace(summaryRe, `Oslo-tabellen inneholder nå ${newTotal} verifiserte eller kildekontrollerte canonical steder. Batch ${nextBatch} legger til Van Etten med den entydige offisielle Geonorge-adressekoordinaten for Smedgata 3; det tidligere treffet mot Smedgata 34 er dokumentert som en falsk substring-match og en separat identitet. Antallet fullførte kontroller uten godkjent Oslo-koordinat er ${noCoordCount}.`);
          fs.writeFileSync(protocolPath, protocol);

          const reportDir = 'reports/visitoslo-oslo-east-audit-20260720/van-etten';
          writeJson(path.join(reportDir, 'production-decision.json'), {
            placeId,
            decision: 'produce_distinct_non_profit_art_space_at_smedgata_3',
            primaryCategory: 'kunst',
            coordinate: { lat, lon, sourceObjectId },
            nearbyWithin350m: nearby,
            identityDecision: 'Van Etten is the art space at Smedgata 3. The Smedgata 34 blue-sign record is a separate physical and semantic identity; the prior match was substring-only.',
            protocolBatch: nextBatch
          });

          console.log(JSON.stringify({ placeId, nextBatch, nearby }, null, 2));
          NODE

      - name: Run and persist validation gates
        shell: bash
        run: |
          set -u
          LOGDIR="reports/coordinate-branch-runner/agent_oslo-coordinate-van-etten-production"
          mkdir -p "$LOGDIR"
          : > "$LOGDIR/gate-status.txt"
          BLOCKING_FAIL=0

          run_gate() {
            name="$1"
            shift
            set +e
            "$@" > >(tee "$LOGDIR/$name.log") 2>&1
            code=$?
            set -e
            printf '%s\n' "$code" > "$LOGDIR/$name.exit-code.txt"
            echo "$name=$code" >> "$LOGDIR/gate-status.txt"
            if [ "$code" -ne 0 ]; then BLOCKING_FAIL=1; fi
            return 0
          }

          set -e
          run_gate places-index-build npm run places:index:build
          run_gate split-manifest-sync npm run audit:places-split-manifest-sync
          run_gate places-index-check npm run places:index:check
          run_gate coordinate-source-contract npm run test:coordinate-source-contract
          run_gate coordinate-quality npm run places:coords:quality
          run_gate coordinate-intake npm run places:coords:intake -- --strict-new
          run_gate coordinate-evidence npm run places:coords:evidence:audit
          run_gate git-diff-check git diff --check

          set +e
          npm run health:places 2>&1 | tee "$LOGDIR/health-places.log"
          HEALTH_CODE=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$HEALTH_CODE" > "$LOGDIR/health-places.exit-code.txt"
          echo "health-places=$HEALTH_CODE" >> "$LOGDIR/gate-status.txt"
          printf '%s\n' "$BLOCKING_FAIL" > "$LOGDIR/blocking-fail.txt"

      - name: Commit production result
        shell: bash
        run: |
          set -euo pipefail
          LOGDIR="reports/coordinate-branch-runner/agent_oslo-coordinate-van-etten-production"
          BLOCKING_FAIL=$(cat "$LOGDIR/blocking-fail.txt")
          rm -f .github/workflows/temp-van-etten-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Van Etten as canonical Oslo art place"
          git push origin HEAD:agent/oslo-coordinate-van-etten-production
          if [ "$BLOCKING_FAIL" -ne 0 ]; then exit 1; fi
