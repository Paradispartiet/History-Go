name: TEMP Bankplassen v3 clean materialize

on:
  push:
    branches:
      - repair/bankplassen-4-v3-clean-20260916

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Run locked Bankplassen materializer on fresh main
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE='6aab13c42ec2b74793377a246a4f338a6f0f7c76'
          SOURCE_REPAIR='ae7291e64cb14ef3f31e37c4fc567bb866e823a3'
          git merge-base --is-ancestor "$CLEAN_BASE" HEAD
          git fetch origin "$SOURCE_REPAIR":refs/remotes/origin/bankrepair-source
          git show refs/remotes/origin/bankrepair-source:tests/norges-bank-bankplassen-4-place-production-v3.test.mjs > tests/norges-bank-bankplassen-4-place-production-v3.test.mjs
          git show refs/remotes/origin/bankrepair-source:.github/workflows/tmp-bankplassen-v3-materialize.yml > /tmp/bankplassen-source.yml
          awk 'f{sub(/^          /,""); print} /^        run: \|$/{f=1}' /tmp/bankplassen-source.yml > /tmp/bankplassen-v3-materialize.sh
          python <<'PY'
          from pathlib import Path
          p = Path('/tmp/bankplassen-v3-materialize.sh')
          s = p.read_text()
          context = 'node scripts/build-quiz-production-context.mjs --category naeringsliv --target "$PLACE_ID" --output data/quiz/production_context/naeringsliv/norges_bank_bankplassen_4.json\n'
          release = 'node scripts/build-fagverk-release-manifest.mjs\n'
          place = 'npm run place:build -- "$PLACE_ID"\n'
          push = 'git push origin HEAD:repair/bankplassen-4-v3-20260916\n'
          cleanup = 'rm -f .github/workflows/tmp-bankplassen-v3-materialize.yml\n'
          diff_check = 'git diff --cached --check\n'
          for needle, label in [
              (context, 'context build'),
              (release, 'release build'),
              (place, 'place build'),
              (push, 'old push target'),
              (cleanup, 'cleanup anchor'),
              (diff_check, 'cached diff check'),
          ]:
              if s.count(needle) != 1:
                  raise SystemExit(f'expected exactly one {label}, found {s.count(needle)}')
          s = s.replace(context, '', 1)
          s = s.replace(release, '', 1)
          s = s.replace(place, place + context + release, 1)
          s = s.replace(push, 'git push origin HEAD:repair/bankplassen-4-v3-clean-20260916\n', 1)
          s = s.replace(cleanup, cleanup + 'rm -f .github/workflows/tmp-bankplassen-v3-clean-materialize.yml\n', 1)
          source_review = 'reports/place-production/norges_bank_bankplassen_4-source-review-v1.md'
          protected_check = (
              f'test "$(git hash-object -- {source_review})" = 8182d4f5c071a0ff2f9c3b6362fde3127455bbe5\n'
              f'git diff --cached --check -- . ":(exclude){source_review}"\n'
          )
          s = s.replace(diff_check, protected_check, 1)
          p.write_text(s)
          PY
          bash -n /tmp/bankplassen-v3-materialize.sh
          bash /tmp/bankplassen-v3-materialize.sh
