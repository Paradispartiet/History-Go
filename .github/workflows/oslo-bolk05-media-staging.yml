name: Oslo bolk 05 - avgrenset bildeproduksjon

on:
  push:
    branches:
      - research/oslo-sentrum-bolk05-tekst-20261101
    paths:
      - .github/workflows/oslo-bolk05-media-staging.yml
      - scripts/build-oslo-sentrum-bolk05-place-images.mjs
      - reports/place-production/oslo-sentrum-bolk05-image-sources-20261101.json

permissions:
  contents: write

concurrency:
  group: oslo-bolk05-media-staging
  cancel-in-progress: false

jobs:
  produce:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked image tooling
        run: npm ci --no-audit --no-fund
      - name: Validate the six authorized sources without downloading
        run: node scripts/build-oslo-sentrum-bolk05-place-images.mjs --plan
      - name: Produce licensed WebP candidates and attribution
        run: node scripts/build-oslo-sentrum-bolk05-place-images.mjs
      - name: Commit only the six-place media output to this branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/places/oslo-bolk05-20261101 bilder/kort/places/
          git add reports/place-production/oslo-sentrum-bolk05-media-provenance-20261101.json
          git add data/places/scenekunst/oslo/places_scenekunst/folketeateret.json
          git add data/places/kunst/oslo/places_kunst/kunstnernes_hus.json
          git add data/places/historie/oslo/places_historie/historisk_museum.json
          git add data/places/litteratur/oslo/places_litteratur/ibsen_museum_teater.json
          git add data/places/subkultur/oslo/places_subkultur/blitzhuset.json
          git add data/places/musikk/oslo/places_musikk/kulturkirken_jakob_litteratur.json
          git diff --cached --quiet && exit 0
          git commit -m "Oslo bolk 05: licensed Wikimedia WebP candidates (not QA approved)"
          git push origin "HEAD:${BRANCH_NAME}"
