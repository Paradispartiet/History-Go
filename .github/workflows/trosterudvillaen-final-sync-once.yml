name: Trosterudvillaen final generated data and READ-FIRST sync (temporary)
on:
  push:
    branches:
      - content/trosterudvillaen-visual-story-20261110
    paths:
      - '.github/workflows/trosterudvillaen-final-sync-once.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/trosterudvillaen-visual-story-20261110
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate all derived Place-open shards
        run: npm run place-open:build
      - name: Rebuild historical epoch index
        run: npm run epoker:places:build
      - name: Record current canonical rule preflight into scoped workcard
        run: node scripts/place-production-rule-preflight.mjs record --workcard reports/place-production/trosterudvillaen-workcard-current.json --place-id trosterudvillaen --category historie
      - name: Commit only generated runtime and preflight evidence
        run: |
          git add data/runtime/stories-all/part-*.json data/runtime/leksikon-all/part-*.json data/runtime/lesespor-all.json
          git add data/runtime/place-open/trosterudvillaen.json data/epoker/epoke-place-index.json reports/place-production/trosterudvillaen-workcard-current.json
          if git diff --cached --quiet; then
            echo "All expected derived outputs are already current"
            exit 0
          fi
          git -c user.name="HistoryGo CI" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Synchronize Trosterudvillaen runtime and READ-FIRST evidence"
          git push origin HEAD:content/trosterudvillaen-visual-story-20261110
