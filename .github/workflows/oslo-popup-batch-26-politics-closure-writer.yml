name: One-time Oslo popup batch 26 politics closure writer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/oslo-popup-batch-26-trigger.txt

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Batch 26 branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-popup-v4-batch-26-finish-politics
          fetch-depth: 0

      - name: Apply isolated desc and popupDesc patches
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const parts = [
            '.github/oslo-popup-batch-26-politics-patch-part1.json',
            '.github/oslo-popup-batch-26-politics-patch-part2.json'
          ];
          const places = parts.flatMap(path => JSON.parse(fs.readFileSync(path, 'utf8')).places);
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pr = event.number;
          if (!pr) throw new Error('Missing pull request number');
          if (places.length !== 8) throw new Error(`Expected 8 places, got ${places.length}`);

          const words = text => (String(text).match(/[\p{L}\p{N}]+(?:[’'\-][\p{L}\p{N}]+)*/gu) || []).length;
          const paragraphs = text => String(text).trim().split(/\n\s*\n/).filter(Boolean).length;
          const withoutText = value => {
            const copy = JSON.parse(JSON.stringify(value));
            delete copy.desc;
            delete copy.popupDesc;
            return copy;
          };
          const expected = {
            regjeringskvartalet: [45, 321, 6],
            statsministerboligen: [47, 302, 6],
            stortinget: [46, 303, 6],
            tinghuset: [45, 306, 6],
            victoria_terrasse: [46, 322, 6],
            y_blokka: [50, 306, 6],
            youngstorget: [50, 314, 6],
            slottsplassen: [44, 302, 6]
          };
          const rows = [];
          let nr = 211;

          for (const item of places) {
            const before = JSON.parse(fs.readFileSync(item.path, 'utf8'));
            if (before.id !== item.id) throw new Error(`ID mismatch for ${item.path}`);
            const after = { ...before, desc: item.desc, popupDesc: item.popupDesc };
            if (JSON.stringify(withoutText(before)) !== JSON.stringify(withoutText(after))) {
              throw new Error(`Non-text parity failed for ${item.id}`);
            }
            const counts = [words(after.desc), words(after.popupDesc), paragraphs(after.popupDesc)];
            const wanted = expected[item.id];
            if (!wanted || counts.some((value, index) => value !== wanted[index])) {
              throw new Error(`${item.id}: got ${counts.join('/')}, expected ${wanted?.join('/')}`);
            }
            if (counts[0] < 40 || counts[0] > 80) throw new Error(`${item.id}: desc bounds`);
            if (counts[1] < 300 || counts[1] > 600) throw new Error(`${item.id}: popup bounds`);
            if (counts[2] !== 6) throw new Error(`${item.id}: paragraph count`);
            fs.writeFileSync(item.path, JSON.stringify(after, null, 2) + '\n');
            rows.push(`| ${nr++} | ${after.name} | \`${after.id}\` | ${counts[0]} | ${counts[1]} | ${counts[2]} | #${pr} |`);
          }

          const protocolPath = 'reports/place-description-revision-protocol.md';
          let protocol = fs.readFileSync(protocolPath, 'utf8');
          const sentinel = `| 218 | Slottsplassen | \`slottsplassen\` | 44 | 302 | 6 | #${pr} |`;
          if (!protocol.includes(sentinel)) {
            protocol = protocol
              .replace('Ferdige etter alle mergede revisjonsbatcher: **210 steder**', 'Ferdige etter alle mergede revisjonsbatcher: **218 steder**')
              .replace('Gjenstår: **302 steder**', 'Gjenstår: **294 steder**')
              .replace('\n## Gjenstående Oslo-kø', `\n\n${rows.join('\n')}\n\n## Gjenstående Oslo-kø`)
              .replace('- politikk: **8**\n', '')
              .replace(
                /\| Oslo V4 batch 25 \| 10 \| #(\d+) – første produksjonsbatch fra politikk-køen \|/,
                match => `${match}\n| Oslo V4 batch 26 | 8 | #${pr} – fullførte hele Oslo-køen for fagområdet politikk |`
              );
          }
          fs.writeFileSync(protocolPath, protocol);
          NODE

          node tools/audit-oslo-place-description-scope.mjs --write

          node <<'NODE'
          const fs = require('fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pr = event.number;
          const protocol = fs.readFileSync('reports/place-description-revision-protocol.md', 'utf8');
          const audit = fs.readFileSync('reports/oslo-place-description-scope-audit-2026-07-26.md', 'utf8');
          if (!protocol.includes('Ferdige etter alle mergede revisjonsbatcher: **218 steder**')) throw new Error('protocol total');
          if (!protocol.includes('Gjenstår: **294 steder**')) throw new Error('protocol remaining');
          if (!protocol.includes(`| 218 | Slottsplassen | \`slottsplassen\` | 44 | 302 | 6 | #${pr} |`)) throw new Error('protocol final row');
          if (protocol.includes('- politikk:')) throw new Error('politics remains in protocol');
          if (!audit.includes('IDs in the current revision protocol: **218**')) throw new Error('audit protocol count');
          if (!audit.includes('Additional active Oslo IDs outside the protocol: **294**')) throw new Error('audit remaining count');
          if (audit.includes('| politikk |')) throw new Error('politics remains in audit');
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/places/politikk/oslo/places_politikk/regjeringskvartalet.json \
            data/places/politikk/oslo/places_politikk/statsministerboligen.json \
            data/places/politikk/oslo/places_politikk/stortinget.json \
            data/places/politikk/oslo/places_politikk/tinghuset.json \
            data/places/politikk/oslo/places_politikk/victoria_terrasse.json \
            data/places/politikk/oslo/places_politikk/y_blokka.json \
            data/places/politikk/oslo/places_politikk/youngstorget.json \
            data/places/politikk/oslo/slottsplassen.json \
            reports/oslo-place-description-scope-audit-2026-07-26.json \
            reports/oslo-place-description-scope-audit-2026-07-26.md \
            reports/place-description-revision-protocol.md
          if git diff --cached --quiet; then
            echo "No material changes to commit"
          else
            git commit -m "Complete Oslo politics description revision"
            git push origin HEAD:agent/oslo-popup-v4-batch-26-finish-politics
          fi
