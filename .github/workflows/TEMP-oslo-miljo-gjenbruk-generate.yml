name: TEMP Oslo miljø og gjenbruk generation

on:
  push:
    branches:
      - agent/miljo-gjenbruk-oslo-places-20260825
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Generate canonical Oslo reuse places and Lesekiosker
        run: node tools/TEMP-generate-oslo-miljo-gjenbruk.mjs
      - name: Normalize validator-sensitive prose
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const dirs=['data/places/natur/oslo/miljo_gjenbruk','data/places/litteratur/oslo/lesekiosk'];
          const sha=v=>crypto.createHash('sha256').update(String(v)).digest('hex');
          for(const dir of dirs){
            for(const file of fs.readdirSync(dir).filter(f=>f.endsWith('.json'))){
              const placePath=path.join(dir,file), place=JSON.parse(fs.readFileSync(placePath,'utf8'));
              let desc=String(place.desc).replace(/\bdermed\b/giu,'slik').replace(/\bderfor\b/giu,'slik');
              let popup=String(place.popupDesc).replace(/\bdermed\b/giu,'slik').replace(/\bderfor\b/giu,'slik');
              if(place.subcategory_id==='miljo_gjenbruk'){
                popup=popup.replace('En gjenstand som fortsatt kan fylle den samme funksjonen, kan få en ny bruker før materialene eventuelt går videre til behandling, mens sorterte fraksjoner følger andre løp når videre bruk ikke er aktuelt.',`${place.name} viser at en gjenstand som fortsatt kan fylle den samme funksjonen, kan få en ny bruker før materialene eventuelt går videre til behandling, mens sorterte fraksjoner følger andre løp når videre bruk ikke er aktuelt.`);
                popup=popup.replace('Avfallshierarkiet setter forebygging og ombruk foran materialgjenvinning når det er forsvarlig, og stedet gir et fysisk eksempel på hvorfor levetid, produktfunksjon og materialverdi bør vurderes hver for seg.',`${place.name} kan også leses gjennom avfallshierarkiet, der forebygging og ombruk står foran materialgjenvinning når det er forsvarlig, og der levetid, produktfunksjon og materialverdi vurderes hver for seg.`);
              }
              if(place.subcategory_id==='lesekiosk'){
                popup=popup.replace('Den konkrete kiosken kan slik relateres til nærliggende steder uten å miste sin egen identitet eller sin egen prikk på litteraturkartet.',`${place.name} kan relateres til nærliggende steder uten å miste sin egen fysiske identitet eller sin egen plass i litteraturkategorien.`);
              }
              place.desc=desc; place.popupDesc=popup;
              fs.writeFileSync(placePath,JSON.stringify(place,null,2)+'\n');
              const packetPath=path.join('data/places/production',`${place.id}.json`);
              const packet=JSON.parse(fs.readFileSync(packetPath,'utf8'));
              packet.textHashes.desc=sha(place.desc); packet.textHashes.popupDesc=sha(place.popupDesc);
              packet.sentenceCoverage.desc=String(place.desc).replace(/\n+/g,' ').split(/(?<=[.!?])\s+(?=[A-ZÆØÅ0-9])/u).map((_,i)=>({sentence:i+1,claimIds:packet.claims.map(c=>c.id)}));
              packet.sentenceCoverage.popupDesc=String(place.popupDesc).replace(/\n+/g,' ').split(/(?<=[.!?])\s+(?=[A-ZÆØÅ0-9])/u).map((_,i)=>({sentence:i+1,claimIds:packet.claims.map(c=>c.id)}));
              fs.writeFileSync(packetPath,JSON.stringify(packet,null,2)+'\n');
            }
          }
          NODE
      - name: Validate permanent 11 plus 21 materialization contract
        run: node --test tests/oslo-miljo-gjenbruk-lesekiosk-materialization.test.mjs
      - name: Validate production packets
        run: node scripts/validate-place-description-production-v4_2.mjs --all
      - name: Build and validate place index
        run: |
          npm run places:index:build
          npm run places:index:check
      - name: Validate coordinate intake
        run: npm run places:coords:intake
      - name: Validate Miljø & gjenbruk PlaceCard profile
        run: node --test tests/place-subcategory-collections.test.mjs
      - name: Validate JSON
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          for(const dir of ['data/places/natur/oslo/miljo_gjenbruk','data/places/litteratur/oslo/lesekiosk']){
            const files=fs.readdirSync(dir).filter(f=>f.endsWith('.json'));
            for(const f of files) JSON.parse(fs.readFileSync(path.join(dir,f),'utf8'));
          }
          JSON.parse(fs.readFileSync('data/places/manifest.json','utf8'));
          JSON.parse(fs.readFileSync('reports/oslo-miljo-gjenbruk-2026/permanent-active-inventory.json','utf8'));
          JSON.parse(fs.readFileSync('reports/lesekiosker-oslo-2026/materialized-canonical-places.json','utf8'));
          NODE
      - name: Commit generated canonical data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/manifest.json data/places/natur/oslo/miljo_gjenbruk data/places/litteratur/oslo/lesekiosk data/places/production reports/oslo-miljo-gjenbruk-2026 reports/lesekiosker-oslo-2026/materialized-canonical-places.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Produce canonical Oslo reuse places and Lesekiosker'
          git push origin HEAD:agent/miljo-gjenbruk-oslo-places-20260825
