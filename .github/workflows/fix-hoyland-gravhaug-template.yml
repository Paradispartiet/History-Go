name: Fix Høyland grave-mound prompt template

on:
  push:
    branches:
      - agent/hoyland-gravhaug-template-fix-20260723

permissions:
  contents: write

jobs:
  build:
    name: Regenerate and verify Høyland
    runs-on: ubuntu-latest

    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          ref: agent/hoyland-gravhaug-template-fix-20260723
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Regenerate and verify
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          {
            npm ci --no-audit --no-fund
            npm run knowledge:canonical:write
            TARGET_AUDIT_DIR=$(mktemp -d)
            cp data/quiz/historie/hoyland_gravhaug_etne_sets.json "$TARGET_AUDIT_DIR/"
            node scripts/audit-quiz-content-quality.mjs --root "$TARGET_AUDIT_DIR" --strict
            npm run typecheck:scripts
            npm run audit:quiz-production-context
            npm run audit:quiz-progression
            npm run audit:quiz-theory-binding
            npm run test:quiz-content-audit
            npm run test:quiz-production
            npm run knowledge:canonical:check
          } 2>&1 | tee /tmp/hoyland-gravhaug-template-fix.log

      - name: Commit generated canonical artifacts
        if: always()
        env:
          BRANCH_NAME: agent/hoyland-gravhaug-template-fix-20260723
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          rm .github/workflows/fix-hoyland-gravhaug-template.yml
          if [ "$BUILD_OUTCOME" != "success" ]; then
            mkdir -p reports
            cp /tmp/hoyland-gravhaug-template-fix.log reports/hoyland-gravhaug-template-fix.log
          fi
          git add \
            data/knowledge/concepts.generated.json \
            data/knowledge/knowledge_units.generated.json \
            data/knowledge/terms.generated.json \
            data/knowledge/stories.generated.json \
            data/knowledge/knowledge_emne_review_queue.generated.json \
            data/quiz/historie/hoyland_gravhaug_etne_sets.json \
            reports/knowledge-contract-audit.json \
            reports/knowledge-id-backfill.json \
            reports/knowledge-universe-readers.json \
            .github/workflows/fix-hoyland-gravhaug-template.yml
          if [ "$BUILD_OUTCOME" != "success" ]; then
            git add reports/hoyland-gravhaug-template-fix.log
          fi
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove forbidden Høyland prompt template"
            git push origin "HEAD:$BRANCH_NAME"
          fi
          if [ "$BUILD_OUTCOME" != "success" ]; then
            exit 1
          fi
