name: Build Civication model library

on:
  push:
    branches:
      - agent/civication-model-library-v2

permissions:
  contents: write

jobs:
  build-library:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Build curated model library
        run: python scripts/build_civication_model_library.py

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No generated asset changes"
            exit 0
          fi
          git commit -m "Civication: build broad curated model library"
          git push origin "HEAD:${GITHUB_REF_NAME}"
