name: Grand Hotel one-time Knowledge regeneration
on:
  push:
    branches:
      - fix/grand-hotel-naeringsliv-category-20261030
    paths:
      - .github/workflows/zz-grand-hotel-knowledge-rebuild.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/grand-hotel-naeringsliv-category-20261030
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Regenerate canonical Knowledge and verify stability
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run knowledge:canonical:write
          npm run knowledge:canonical:check
      - name: Commit only canonical Knowledge and remove the one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/knowledge/knowledge_units.generated.json
          git rm -- .github/workflows/zz-grand-hotel-knowledge-rebuild.yml
          git diff --cached --stat
          git commit -m "chore(grand-hotel): synchronize canonical Knowledge units after Næringsliv migration"
          git push origin HEAD:fix/grand-hotel-naeringsliv-category-20261030
