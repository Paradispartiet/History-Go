name: Materialize Vitenskap Unit 1 registry integration

on:
  push:
    branches:
      - agent/vitenskap-unit1-registry-integration
    paths:
      - 'scripts/materialize-vitenskap-unit1-registry-integration.mjs'
      - '.github/workflows/vitenskap-unit1-registry-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitenskap-unit1-registry-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize canonical registry and status
        run: node scripts/materialize-vitenskap-unit1-registry-integration.mjs
      - name: Rebuild deterministic Fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Validate generated state
        run: |
          node scripts/audit-fagverk-vitenskap-university-readiness.mjs || true
          node scripts/audit-fagverk-vitenskap-unit1.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          git diff --check
      - name: Commit generated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fagverk/fagverk_registry.json data/fagverk/subject_status.json data/fag/vitenskap/vitenskap_university_readiness_v1.json data/fagverk/fagverk_release.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Materialize Vitenskap Unit 1 registry integration'
          git push origin HEAD:agent/vitenskap-unit1-registry-integration
