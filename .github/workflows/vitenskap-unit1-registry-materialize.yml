name: Finalize Vitenskap Unit 1 registry integration

on:
  push:
    branches:
      - agent/vitenskap-unit1-registry-integration
    paths:
      - '.github/workflows/vitenskap-unit1-registry-materialize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitenskap-unit1-registry-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate permanent readiness audit report
        run: node scripts/audit-fagverk-vitenskap-university-readiness.mjs --write-report --no-check-report
      - name: Validate permanent Vitenskap gates and release
        run: |
          node scripts/audit-fagverk-vitenskap-university-readiness.mjs
          node scripts/audit-fagverk-vitenskap-unit1.mjs
          node --test tests/fagverk-vitenskap-university-readiness.test.mjs
          node --test tests/fagverk-vitenskap-unit1.test.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          git diff --check
      - name: Commit regenerated permanent report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/fagverk/vitenskap-university-readiness-audit.json
          if git diff --cached --quiet; then
            echo 'Readiness report already current.'
            exit 0
          fi
          git commit -m 'Regenerate Vitenskap Unit 1 readiness audit report'
          git push origin HEAD:agent/vitenskap-unit1-registry-integration
