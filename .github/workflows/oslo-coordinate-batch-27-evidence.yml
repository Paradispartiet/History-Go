name: Oslo coordinate batch 27 evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-coordinate-batch-27-evidence.yml'

permissions:
  contents: read

jobs:
  evidence:
    if: github.event.pull_request.head.ref == 'agent/oslo-coordinate-control-batch-27'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect read-only object and duplicate evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT='reports/oslo-coordinate-control-batch-27'
          mkdir -p "$OUT/sources"

          run_curl() {
            local url="$1"
            local file="$2"
            set +e
            curl --retry 3 --retry-delay 2 -fsSL -A 'History-Go-coordinate-audit/1.0' "$url" \
              | tee "$OUT/sources/$file" >/dev/null
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$code" > "$OUT/sources/$file.exit-status.txt"
          }

          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Ullev%C3%A5l%20Hageby%20Oslo' 'ullevall-hageby-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Roms%C3%A5s%20Oslo' 'romsas-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Rodel%C3%B8kka%20Oslo' 'rodelokka-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=V%C3%A5lerenga%20Oslo' 'valerenga-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Vinderen%20Oslo' 'vinderen-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Ullern%20Oslo' 'ullern-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Spikersuppa%20Oslo' 'spikersuppa-nominatim.json'

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const targets = [
            ['ullevål_hageby', 'Ullevål Hageby'],
            ['romsaås', 'Romsås'],
            ['rodelokka', 'Rodeløkka'],
            ['vaalerenga', 'Vålerenga'],
            ['vinderen', 'Vinderen'],
            ['ullern', 'Ullern'],
            ['spikersuppa', 'Spikersuppa']
          ];
          const normalize = (s) => String(s ?? '').normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase().replace(/[^a-z0-9]+/g, '');
          const rows = [];

          function walk(dir) {
            const out = [];
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, ent.name);
              if (ent.isDirectory()) out.push(...walk(full));
              else if (ent.isFile() && ent.name.endsWith('.json')) out.push(full);
            }
            return out;
          }

          for (const file of walk('data/places')) {
            let data;
            try { data = JSON.parse(fs.readFileSync(file, 'utf8')); } catch { continue; }
            const values = Array.isArray(data) ? data : [data];
            for (const rec of values) {
              if (!rec || typeof rec !== 'object' || !rec.id || !rec.name) continue;
              rows.push({ id: rec.id, name: rec.name, file: file.replaceAll('\\', '/') });
            }
          }

          const result = [];
          for (const [id, name] of targets) {
            const idNorm = normalize(id);
            const nameNorm = normalize(name);
            const matches = rows.filter((row) => row.id !== id && (normalize(row.id) === idNorm || normalize(row.name) === nameNorm));
            result.push({ id, name, matches });
          }
          fs.writeFileSync('reports/oslo-coordinate-control-batch-27/duplicate-audit.json', JSON.stringify(result, null, 2) + '\n');
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch-27-evidence
          path: reports/oslo-coordinate-control-batch-27
          if-no-files-found: error
