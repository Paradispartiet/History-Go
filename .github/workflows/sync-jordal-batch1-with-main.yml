name: Sync Jordal batch 1 with main

on:
  push:
    branches:
      - data/people-jordal-amfi-batch1-20260714

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Jordal branch
        uses: actions/checkout@v4
        with:
          ref: data/people-jordal-amfi-batch1-20260714
          fetch-depth: 0

      - name: Merge current main and resolve people manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge origin/main --no-commit --no-ff
          merge_status=$?
          set -e

          unresolved="$(git diff --name-only --diff-filter=U || true)"
          unexpected="$(printf '%s\n' "$unresolved" | grep -v '^data/people/manifest.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected merge conflicts:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          if printf '%s\n' "$unresolved" | grep -qx 'data/people/manifest.json'; then
            git checkout --theirs data/people/manifest.json
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/people/manifest.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          files = manifest['files']
          additions = [
              'people/sport/oslo/jordal_amfi/valerenga_ishockey.json',
              'people/sport/oslo/jordal_amfi/steinar_bjolbakk.json',
              'people/sport/oslo/jordal_amfi/jim_marthinsen.json',
              'people/sport/oslo/jordal_amfi/geir_myhre.json',
              'people/sport/oslo/jordal_amfi/arne_billkvam.json',
          ]
          for item in additions:
              while item in files:
                  files.remove(item)

          anchor = 'people/sport/oslo/intility_arena/odin_thiago_holm.json'
          if anchor not in files:
              raise SystemExit(f'Missing manifest anchor: {anchor}')
          insert_at = files.index(anchor) + 1
          files[insert_at:insert_at] = additions
          path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          git add data/people/manifest.json
          git rm .github/workflows/sync-jordal-batch1-with-main.yml

          if git diff --cached --quiet && [ "$merge_status" -eq 0 ]; then
            echo "Branch already synchronized."
            exit 0
          fi

          git commit -m "Sync Jordal batch 1 with main"
          git push origin data/people-jordal-amfi-batch1-20260714
