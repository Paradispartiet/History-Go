name: TEMP Christiania Torv phase 9 context writeback

on:
  push:
    branches:
      - agent/christiania-torv-phase9-rounds-entities-v1

permissions:
  contents: write

jobs:
  writeback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/christiania-torv-phase9-rounds-entities-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - name: Rebuild deterministic Christiania Torv context
        run: |
          npm run quiz:context -- --category by --target christiania_torv --output data/quiz/production_context/by/christiania_torv.json
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run knowledge:canonical:check
      - name: Commit deterministic context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz/production_context/by/christiania_torv.json
          if git diff --cached --quiet; then
            echo "No context writeback needed."
            exit 0
          fi
          git commit -m "Refresh Christiania Torv deterministic context"
          git push origin HEAD:agent/christiania-torv-phase9-rounds-entities-v1
