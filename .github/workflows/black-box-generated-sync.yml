name: TEMP Black Box generated data sync
on:
  push:
    branches:
      - production/black-box-quiz-and-quizcard-20261012
    paths:
      - .github/workflows/black-box-generated-sync.yml

permissions:
  contents: write

jobs:
  synchronize-generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/black-box-quiz-and-quizcard-20261012
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build deterministic quiz context
        run: |
          node scripts/build-quiz-production-context.mjs --category scenekunst --target black_box_teater --output data/quiz/production_context/scenekunst/black_box_teater.json
      - name: Generate canonical Knowledge
        run: |
          npm run build:scripts
          node dist/scripts/knowledge-canonical-data.mjs --write
      - name: Generate Fagverk release from complete sources
        run: |
          node scripts/build-fagverk-release-manifest.mjs
      - name: Commit and push only known canonical generated files
        shell: bash
        run: |
          git add data/quiz/production_context/scenekunst/black_box_teater.json
          git add data/quiz/scenekunst/black_box_teater_sets.json
          git add data/knowledge/knowledge_units.generated.json
          git add data/fagverk/fagverk_release.json
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'All generated files already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Black Box: synchronize deterministic quiz, Knowledge and Fagverk outputs'
          git push origin HEAD:production/black-box-quiz-and-quizcard-20261012
