name: TEMP Juss field 1 fulltext field 2 source-first

on:
  push:
    branches:
      - agent/fagverk-juss-rettsvitenskap-field-1-fulltext-field-2-source-first-20260831

permissions:
  contents: write

concurrency:
  group: tmp-juss-field1-fulltext-field2-source-first
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.head_commit.message == 'Run fail-closed Juss field 1 fulltext field 2 source-first'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Juss branch
        uses: actions/checkout@v4
        with:
          ref: agent/fagverk-juss-rettsvitenskap-field-1-fulltext-field-2-source-first-20260831
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax-check TEMP generator
        run: node --check scripts/tmp-materialize-juss-field1-fulltext-field2-source-first.mjs

      - name: Generate candidate state
        run: node scripts/tmp-materialize-juss-field1-fulltext-field2-source-first.mjs

      - name: Syntax-check generated Juss gates
        run: |
          node --check scripts/audit-juss-rettsvitenskap-legal-method-sources-interpretation-argumentation-fulltext-v1.mjs
          node --check scripts/materialize-juss-rettsvitenskap-legal-method-sources-interpretation-argumentation-fulltext-v1.mjs
          node --check scripts/brief-juss-rettsvitenskap-constitutional-law-separation-powers-constitutional-review-sources-v1.mjs
          node --check scripts/audit-juss-rettsvitenskap-reconciliation-v1.mjs
          node --check tests/juss-rettsvitenskap-legal-method-sources-interpretation-argumentation-fulltext-v1.test.mjs
          node --check tests/juss-rettsvitenskap-constitutional-law-separation-powers-constitutional-review-source-brief-v1.test.mjs
          node --check tests/juss-rettsvitenskap-reconciliation-v1.test.mjs

      - name: Run isolated Field 1 and Field 2 gates
        run: |
          node scripts/audit-juss-rettsvitenskap-legal-method-sources-interpretation-argumentation-fulltext-v1.mjs
          node scripts/materialize-juss-rettsvitenskap-legal-method-sources-interpretation-argumentation-fulltext-v1.mjs
          node scripts/brief-juss-rettsvitenskap-constitutional-law-separation-powers-constitutional-review-sources-v1.mjs
          node --test tests/juss-rettsvitenskap-legal-method-sources-interpretation-argumentation-fulltext-v1.test.mjs tests/juss-rettsvitenskap-constitutional-law-separation-powers-constitutional-review-source-brief-v1.test.mjs tests/juss-rettsvitenskap-reconciliation-v1.test.mjs

      - name: Run registry-driven Juss and shared Fagverk gates
        run: node scripts/run-fagverk-domain-ci-v1.mjs --subject juss_rettsvitenskap

      - name: Verify canonical progress and no premature completion
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const reg=JSON.parse(fs.readFileSync('data/fag/politikk/juss_rettsvitenskap/production_registry_v1.json','utf8'));
          const category=JSON.parse(fs.readFileSync('data/categories/category_contract.json','utf8'));
          const sub=category.canonicalSubcategories.politikk.find(row=>row.id==='juss_rettsvitenskap');
          if(reg.progress.materializedDomains!==1||reg.progress.totalDomains!==12||reg.progress.strictCompletionProven!==false||reg.materialized.length!==1) throw new Error('Expected canonical Juss 1/12 state');
          if(reg.next_gate!=='constitutional_law_separation_powers_constitutional_review_fulltext') throw new Error('Expected Field 2 fulltext as next gate');
          if(sub?.status!=='expansion_planned') throw new Error('Juss category completed prematurely');
          NODE
          git diff --check

      - name: Remove TEMP generator only
        run: |
          rm scripts/tmp-materialize-juss-field1-fulltext-field2-source-first.mjs
          test ! -e scripts/tmp-materialize-juss-field1-fulltext-field2-source-first.mjs
          test -e .github/workflows/tmp-juss-field1-fulltext-field2-source-first.yml

      - name: Commit permanent candidate only after all gates pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/tmp-juss-field1-fulltext-field2-source-first.yml
          if git diff --cached --quiet; then
            echo 'No permanent candidate changes generated' >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing workflow mutation from Actions token' >&2
            exit 1
          fi
          git commit -m 'Materialize Juss field 1 and prepare field 2 source-first'
          git push origin HEAD:agent/fagverk-juss-rettsvitenskap-field-1-fulltext-field-2-source-first-20260831
