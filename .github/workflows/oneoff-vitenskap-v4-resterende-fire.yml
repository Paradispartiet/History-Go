name: One-off science v4 remaining four badge candidate export

on:
  push:
    branches:
      - art/vitenskap-v4-resterende-fire-20261112
    paths:
      - scripts/revise-vitenskap-v4-remaining-four.py
      - .github/workflows/oneoff-vitenskap-v4-resterende-fire.yml

permissions:
  contents: write

concurrency:
  group: science-v4-remaining-four-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/vitenskap-v4-resterende-fire-20261112
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image export dependencies
        run: python -m pip install --quiet pillow numpy
      - name: Export sixteen inactive v4 badge candidates with SHA provenance
        run: python scripts/revise-vitenskap-v4-remaining-four.py
      - name: Check all sixteen outputs and immutable active registry
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image
          m=json.loads(Path('data/badges/vitenskap_v4_remaining_four_locales_20261112.json').read_text())
          active=json.loads(Path('data/badges/vitenskap.json').read_text())
          assert m['status']=='sixteen_v4_candidates_not_approved_or_active'
          assert len(m['items'])==16
          assert len(active['subBadgeImages'])==16
          assert len({(r['id'],r['locale']) for r in m['items']})==16
          for x in m['items']:
            data=Path(x['path']).read_bytes()
            assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
            assert len(data)==x['bytes']
            assert hashlib.sha256(data).hexdigest()==x['sha256']
            assert hashlib.sha1(b'blob '+str(len(data)).encode()+bytes([0])+data).hexdigest()==x['gitBlobSha']
            with Image.open(x['path']) as img: assert img.size==(1024,1024)
            assert not x['path'] in active['subBadgeImages'].values()
            assert x['metrics']['sourceAlphaIdentical'] is True
            assert x['centerMeanCodecDifference']<6
          print('16/16 WebP original hash, format, and inactive registry checks passed')
          PY
      - name: Commit isolated candidate files and contact sheet, never activate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bilder/merker/vitenskap/kandidater/revisjoner
          git add bilder/merker/vitenskap/kandidater/contact-sheet-v4-remaining-four.jpg
          git add data/badges/vitenskap_v4_remaining_four_locales_20261112.json
          if ! git diff --cached --quiet; then
            git commit -m 'art(science): store 16 v4 inactive embroidered badge candidates'
            git push
          fi
