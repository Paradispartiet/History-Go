name: Temporary People round filter cleanup

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: temp-people-round-filter-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/clean-place-rounds-canonical-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Detect completed cleanup
        id: guard
        shell: bash
        run: |
          if ! grep -q 'Canonical explicit curation wins' js/ui/popup-utils.js \
             && ! grep -q '"people_ids"' data/places/scenekunst/oslo/places_scenekunst/nationaltheatret.json; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.skip != 'true'
      - name: Remove People filtering override
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          popup = Path('js/ui/popup-utils.js')
          s = popup.read_text(encoding='utf-8')
          s, n = re.subn(r'''\n  const placesArr = Array\.isArray\(window\.PLACES\)[\s\S]*?\n  const seen = new Set\(\);''', '\n  const seen = new Set();', s, count=1)
          if n != 1:
              raise SystemExit('Fant ikke people_ids-overstyringen i popup-utils.js')
          popup.write_text(s, encoding='utf-8')

          place_path = Path('data/places/scenekunst/oslo/places_scenekunst/nationaltheatret.json')
          place = json.loads(place_path.read_text(encoding='utf-8'))
          place.pop('people_ids', None)
          place.pop('rounds', None)
          place_path.write_text(json.dumps(place, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = Path('tests/place-people-ids-runtime.test.js')
          test_path.write_text(r'''const assert = require('assert');
          const fs = require('fs');
          const path = require('path');
          const vm = require('vm');
          const repo = path.resolve(__dirname, '..');
          const source = fs.readFileSync(path.join(repo, 'js/ui/popup-utils.js'), 'utf8');
          const context = {
            console,
            window: {
              PEOPLE: [
                { id: 'p1', places: ['place_a'] },
                { id: 'p2', placeId: 'place_a' },
                { id: 'p3' }
              ],
              PLACES: [{ id: 'place_a', people_ids: ['p2'] }],
              RELATIONS: [{ placeId: 'place_a', personId: 'p3' }]
            },
            document: { addEventListener() {}, createElement() { return {}; }, body: { appendChild() {} }, getElementById() { return null; } },
            requestAnimationFrame() {}, setTimeout, clearTimeout
          };
          context.globalThis = context;
          vm.createContext(context);
          vm.runInContext(source, context, { filename: 'popup-utils.js' });
          const ids = Array.from(context.getPeopleForPlace('place_a'), person => person.id);
          assert.deepStrictEqual(ids, ['p3', 'p1', 'p2'], 'people_ids must not filter relation/place-derived People');
          assert(!source.includes('Canonical explicit curation wins'), 'People runtime must not contain the old curation override');
          console.log('People popup ignores round-preview curation fields OK');
          ''', encoding='utf-8')

          nt = Path('tests/nationaltheatret-people-curation.test.js')
          t = nt.read_text(encoding='utf-8')
          t = t.replace("const expectedIds = ['henrik_bull', 'bjorn_bjornson', 'johanne_dybwad'];\nassert.deepStrictEqual(place.people_ids, expectedIds, 'Nationaltheatret must expose exactly the curated People set');",
                        "const expectedIds = ['henrik_bull', 'bjorn_bjornson', 'johanne_dybwad'];\nassert(!Object.prototype.hasOwnProperty.call(place, 'people_ids'), 'Nationaltheatret must not use people_ids to filter the People popup');\nassert(!Object.prototype.hasOwnProperty.call(place, 'rounds'), 'Nationaltheatret must use the canonical fixed round profile, not a local legacy rounds list');")
          t = t.replace("console.log('Nationaltheatret curated People set OK');", "console.log('Nationaltheatret People images and unfiltered round contract OK');")
          nt.write_text(t, encoding='utf-8')
          PY
      - name: Run focused People tests
        if: steps.guard.outputs.skip != 'true'
        run: |
          node tests/place-people-ids-runtime.test.js
          node tests/nationaltheatret-people-curation.test.js
          node --test tests/place-rounds-visual-collections.test.mjs tests/place-rounds-grid-exclusivity.test.mjs tests/place-rounds-fill-layout.test.mjs
          node tests/place-card-rounds-runtime-audit.test.js
      - name: Commit cleanup
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/ui/popup-utils.js data/places/scenekunst/oslo/places_scenekunst/nationaltheatret.json tests/place-people-ids-runtime.test.js tests/nationaltheatret-people-curation.test.js
          git commit -m 'Fjern People-filter fra rundingspreview'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
