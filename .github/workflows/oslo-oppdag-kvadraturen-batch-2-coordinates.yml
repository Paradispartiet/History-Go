name: Oslo Oppdag Kvadraturen batch 2 coordinates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-oppdag-kvadraturen-batch-2-coordinates.yml'

permissions:
  contents: write

jobs:
  coordinates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve and save address evidence
        shell: bash
        run: |
          set -u
          set -o pipefail
          mkdir -p reports/oslo-oppdag-kvadraturen-batch-2/coordinates
          : > reports/oslo-oppdag-kvadraturen-batch-2/coordinates/status.txt

          run_lookup() {
            local slug="$1"
            local address="$2"
            set +e
            npm run places:coords:find:address -- --address "$address" \
              | tee "reports/oslo-oppdag-kvadraturen-batch-2/coordinates/${slug}.json"
            local status=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\t%s\n' "$slug" "$status" "$address" \
              | tee -a reports/oslo-oppdag-kvadraturen-batch-2/coordinates/status.txt
          }

          set -e
          run_lookup hotel_du_nord "Dronningens gate 13 Oslo"
          run_lookup garmanngarden "Rådhusgata 7 Oslo"
          run_lookup cafe_engebret "Bankplassen 1B Oslo"
          run_lookup stattholdergarden "Rådhusgata 11 Oslo"
          run_lookup waisenhuset "Kongens gate 1 Oslo"
          run_lookup myntgatakvartalet "Myntgata 2 Oslo"
      - name: Persist coordinate results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/oslo-oppdag-kvadraturen-batch-2/coordinates
          git commit -m "Resolve Engebret address and refresh batch 2 coordinates"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
