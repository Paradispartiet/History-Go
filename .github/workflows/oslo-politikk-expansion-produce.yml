name: Oslo politics expansion production

on:
  push:
    branches:
      - agent/oslo-politikk-steder-underkategorier
    paths:
      - scripts/produce-oslo-politikk-expansion.mjs
      - .github/workflows/oslo-politikk-expansion-produce.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-politikk-steder-underkategorier
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build tools
        run: npm run build:tools
      - name: Refresh research
        run: node scripts/research-oslo-politikk-expansion.mjs
      - name: Produce canonical data
        run: node scripts/produce-oslo-politikk-expansion.mjs
      - name: Remove transient research payload
        run: rm -f reports/oslo-politikk-expansion-research.json
      - name: Validate places
        run: bash scripts/check-places.sh
      - name: Validate categories
        run: npm run audit:categories
      - name: Check diff
        run: git diff --check
      - name: Commit production
        run: |
          if git diff --quiet; then
            echo "No production changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs reports
          git commit -m "Utvid Oslo-politikk med steder og underkategorier"
          git push origin HEAD:agent/oslo-politikk-steder-underkategorier
