name: Fagverk IA v3 Religion pilot regenerate probe

on:
  pull_request:
    paths:
      - 'reports/fagverk/religion-pilot-audit.json'
      - 'data/fagverk/fagverk_portal.json'
      - 'data/fag/religion/merke_religion.html'
      - 'scripts/audit-fagverk-religion-legacy-stub.mjs'
      - 'tests/fagverk-religion-pilot.test.mjs'
      - 'tests/fagverk-religion-legacy-stub.test.mjs'
      - '.github/workflows/_tmp-fagverk-religion-pilot-regenerate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-and-clean:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate Religion pilot report and validate
        run: |
          node --input-type=module -e "import { auditReligionPilot } from './scripts/audit-fagverk-religion-pilot.mjs'; auditReligionPilot({ writeReport: true, checkReport: false });"
          node scripts/audit-fagverk-religion-pilot.mjs
          node scripts/audit-fagverk-religion-legacy-stub.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/fagverk-religion-pilot.test.mjs tests/fagverk-religion-legacy-stub.test.mjs tests/fagverk-badge-equivalence.test.mjs
      - name: Commit generated report and remove probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/_tmp-fagverk-religion-pilot-regenerate.yml
          git add reports/fagverk/religion-pilot-audit.json .github/workflows/_tmp-fagverk-religion-pilot-regenerate.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Regenerate Religion pilot audit after badge retirement'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
