name: Tøyenbadet People generated data sync (temporary)
on:
  push:
    branches:
      - feat/toyenbadet-people-anne-lindboe-20261103
    paths:
      - .github/workflows/toyenbadet-people-sync-temp.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate canonical-derived indexes
        shell: bash
        run: |
          set -euo pipefail
          npm run place-open:build
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - name: Scope and verify generated changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          while IFS= read -r changed; do
            [ -n "$changed" ] || continue
            case "$changed" in
              data/runtime/people-all.json|data/runtime/people-all/part-*.json|data/runtime/place-open/toyenbadet.json|data/Civication/scenarioPeople/generated/politikk.json|data/Civication/scenarioPeople_index.json) ;;
              *) echo "STOP: unexpected generated output: $changed" >&2; exit 1 ;;
            esac
          done < <(git ls-files --modified --others --exclude-standard)
          npm run place-open:check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node --test tests/toyenbadet-anne-lindboe-people.test.mjs
      - name: Commit generated output to same PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/runtime/people-all.json data/runtime/people-all data/runtime/place-open/toyenbadet.json data/Civication/scenarioPeople/generated/politikk.json data/Civication/scenarioPeople_index.json
          if git diff --cached --quiet; then echo "Already synchronized"; exit 0; fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(toyenbadet): sync People and Civication generated indexes'
          git push origin "HEAD:${{ github.ref_name }}"
