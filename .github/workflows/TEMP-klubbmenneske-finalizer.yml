name: TEMP Klubbmenneske finalizer

on:
  push:
    branches:
      - agent/civication-sport-klubbmenneske-role-world-20260913
    paths:
      - .github/klubbmenneske-finalize-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/civication-sport-klubbmenneske-role-world-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Align canonical Role World assertions
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = 'tests';
          const files = fs.readdirSync(dir).filter(f => /^civication-.*\.test\.js$/.test(f));
          const replacements = [
            [/97_role_worlds_materialized/g, '98_role_worlds_materialized'],
            [/role_worlds_total:\s*97/g, 'role_worlds_total: 98'],
            [/life_position_role_worlds:\s*12/g, 'life_position_role_worlds: 13'],
            [/life_position_role_world_count,\s*12/g, 'life_position_role_world_count, 13'],
            [/subject_type === 'life_position'\)\.length,\s*12/g, "subject_type === 'life_position').length, 13"],
            [/lifePositionWorlds\.length,\s*12/g, 'lifePositionWorlds.length, 13'],
            [/completed_life_position_role_worlds\.length,\s*12/g, 'completed_life_position_role_worlds.length, 13'],
            [/canonical_counts\.life_position_role_worlds,\s*12/g, 'canonical_counts.life_position_role_worlds, 13'],
            [/canonical_counts\.total_role_worlds,\s*97/g, 'canonical_counts.total_role_worlds, 98'],
            [/total_role_worlds:\s*97/g, 'total_role_worlds: 98'],
            [/life_position_readiness\.completed_life_position_role_worlds,\s*12/g, 'life_position_readiness.completed_life_position_role_worlds, 13'],
            [/summary\.life_position_role_world_complete,\s*12/g, 'summary.life_position_role_world_complete, 13'],
            [/summary\.completed_life_position_role_worlds,\s*12/g, 'summary.completed_life_position_role_worlds, 13'],
            [/summary\.role_worlds_total,\s*97/g, 'summary.role_worlds_total, 98'],
            [/summary\.life_position_role_worlds,\s*12/g, 'summary.life_position_role_worlds, 13'],
            [/summary\.positions_with_exact_governed_sources,\s*12/g, 'summary.positions_with_exact_governed_sources, 13'],
            [/summary\.positions_with_multi_scene_narrative_foundation,\s*12/g, 'summary.positions_with_multi_scene_narrative_foundation, 13'],
            [/summary\.queue_length,\s*147/g, 'summary.queue_length, 146'],
            [/classifications\.ready,\s*12/g, 'classifications.ready, 13'],
            [/classifications\.needs_authored_depth,\s*147/g, 'classifications.needs_authored_depth, 146'],
            [/ready:\s*12/g, 'ready: 13'],
            [/needs_authored_depth:\s*147/g, 'needs_authored_depth: 146'],
            [/roles\.length,\s*97/g, 'roles.length, 98'],
            [/97 total worlds/g, '98 total worlds'],
            [/12 completed life-position worlds/g, '13 completed life-position worlds'],
            [/12 life-position worlds/g, '13 life-position worlds']
          ];
          const changed = [];
          for (const file of files) {
            const p = path.join(dir, file);
            const before = fs.readFileSync(p, 'utf8');
            let after = before;
            for (const [re, to] of replacements) after = after.replace(re, to);
            if (after.includes('completed_life_position_role_worlds') && !after.includes("'sport/klubbmenneske'")) {
              after = after.replace(/'scenekunst\/scenehenger'(\s*\n\s*\])/g, "'scenekunst/scenehenger',\n  'sport/klubbmenneske'$1");
            }
            after = after.replace(/tolv canonical life-position worlds/g, 'tretten canonical life-position worlds');
            if (after !== before) { fs.writeFileSync(p, after); changed.push(p); }
          }
          console.log('assertion-aligned files:', changed.length);
          for (const p of changed) console.log(p);
          NODE
      - name: Regenerate readiness
        run: |
          node scripts/audit-civication-life-position-role-world-readiness.mjs --write
          node scripts/audit-civication-life-position-role-world-readiness.mjs --check
      - name: Run full Civication suite
        run: node tests/run-civication-tests.mjs
      - name: Commit deterministic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/lifePositionRoleWorldReadiness.json reports/civication-life-position-role-world-readiness.md tests
          if git diff --cached --quiet; then
            echo "No deterministic changes to commit"
            exit 0
          fi
          git commit -m "Finalize Klubbmenneske Role World state [klubbmenneske-finalized]"
          git push origin HEAD:agent/civication-sport-klubbmenneske-role-world-20260913
