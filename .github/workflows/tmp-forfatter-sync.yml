name: Temporary Forfatter canonical sync
on:
  push:
    branches:
      - civication/litteratur-forfatter-role-world
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: civication/litteratur-forfatter-role-world
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Normalize stale taxonomy count expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/civication-noncareer-role-taxonomy.test.js')
          text = path.read_text()
          text = text.replace('role_worlds_total: 182', 'role_worlds_total: 183')
          text = text.replace('life_position_role_worlds: 97', 'life_position_role_worlds: 98')
          path.write_text(text)
          PY
      - name: Synchronize Forfatter canonical Role World contracts
        run: node scripts/tmp-sync-forfatter-role-world.mjs
      - name: Remove temporary sync machinery and commit generated state
        run: |
          rm -f scripts/tmp-sync-forfatter-role-world.mjs .github/workflows/tmp-forfatter-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize Forfatter canonical Role World state"
          git push origin HEAD:civication/litteratur-forfatter-role-world