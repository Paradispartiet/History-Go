name: One-time fix History V5.8 audit labels

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-fix-history-v5-8-audit-labels.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/history-v5-8-cold-war
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Correct report labels and denominators
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/historie-v5
          node - <<'NODE'
          const fs = require('fs');
          const file = 'tools/audit-historie-v5-5-quality-depth.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const replacements = [
            ["v6_allowed must be true after the V5.6 freeze.", "v6_allowed must be true for the active V5.8 model."],
            ["Any mutation of an authoritative V5.6 file requires a reviewed PR, a green depth audit, and an intentionally refreshed manifest with an explicit reason.", "Any mutation of an active authoritative Historie file requires a reviewed PR, a green depth audit, and an intentionally refreshed manifest with an explicit reason."],
            ["'# Historie V5.7 quality depth audit','',", "'# Historie V5.8 quality depth audit','',"],
            ["`- Domains: ${metrics.counts.domains}/20`,", "`- Domains: ${metrics.counts.domains}/${contract.coverage_counts.domains}`,"],
            ["`- Emner: ${metrics.counts.emner}/200`,", "`- Emner: ${metrics.counts.emner}/${contract.coverage_counts.emner}`,"],
            ["`- Concepts: ${metrics.counts.concepts}/826`,", "`- Concepts: ${metrics.counts.concepts}/${contract.coverage_counts.concepts}`,"],
            ["`- Theories: ${metrics.counts.theories}/200`,", "`- Theories: ${metrics.counts.theories}/${contract.coverage_counts.theories}`,\n  `- Mappings: ${metrics.counts.mappings}/${contract.coverage_counts.mappings}`,\n  `- Methods: ${metrics.counts.methods}/${contract.coverage_counts.methods}`,"],
            ["Historie V5.7 quality depth audit: ${report.status}", "Historie V5.8 quality depth audit: ${report.status}"]
          ];
          for (const [before, after] of replacements) {
            if (!source.includes(before)) throw new Error(`Expected audit text not found: ${before}`);
            source = source.replace(before, after);
          }
          fs.writeFileSync(file, source);
          NODE

          node --check tools/audit-historie-v5-5-quality-depth.mjs
          node tools/audit-historie-v5-5-quality-depth.mjs 2>&1 \
            | tee reports/historie-v5/historie-v5-8-quality-report-label-fix.log
          grep -F '# Historie V5.8 quality depth audit' reports/historie-v5/historie-v5-8-quality-depth.md
          grep -F -- '- Domains: 23/23' reports/historie-v5/historie-v5-8-quality-depth.md
          grep -F -- '- Emner: 230/230' reports/historie-v5/historie-v5-8-quality-depth.md
          grep -F -- '- Concepts: 976/976' reports/historie-v5/historie-v5-8-quality-depth.md
          grep -F -- '- Theories: 230/230' reports/historie-v5/historie-v5-8-quality-depth.md
          grep -F -- '- Mappings: 230/230' reports/historie-v5/historie-v5-8-quality-depth.md
          grep -F -- '- Methods: 105/105' reports/historie-v5/historie-v5-8-quality-depth.md
          git diff --check 2>&1 \
            | tee reports/historie-v5/historie-v5-8-quality-report-diff-check.log

      - name: Publish corrected permanent audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short 2>&1 \
            | tee reports/historie-v5/historie-v5-8-quality-report-git-status.log
          git add tools/audit-historie-v5-5-quality-depth.mjs \
            reports/historie-v5/historie-v5-8-quality-depth.json \
            reports/historie-v5/historie-v5-8-quality-depth.md \
            reports/historie-v5/historie-v5-8-quality-report-label-fix.log \
            reports/historie-v5/historie-v5-8-quality-report-diff-check.log \
            reports/historie-v5/historie-v5-8-quality-report-git-status.log
          git commit -m 'Rett V5.8-etiketter i Historie-kvalitetsauditen'
          git push origin HEAD:agent/history-v5-8-cold-war 2>&1 \
            | tee /tmp/historie-v5-8-audit-label-publish.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-v5-8-audit-label-fix
          path: |
            reports/historie-v5/historie-v5-8-quality-*.log
            reports/historie-v5/historie-v5-8-quality-depth.*
            /tmp/historie-v5-8-audit-label-publish.log
          if-no-files-found: warn
