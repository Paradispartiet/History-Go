name: One-off PlaceCard bundle sync
on:
  push:
    branches:
      - fix/placecard-image-status-nav-order-20261011
    paths:
      - .github/workflows/placecard-oneoff-build-sync-20261011.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/placecard-image-status-nav-order-20261011
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:web
      - name: Commit deterministic generated bundle maps
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist/web/place-unified-surface.js dist/web/place-unified-surface.js.map
          if git diff --cached --quiet; then
            echo 'No generated diff'
          else
            git commit -m 'Regenerate PlaceCard browser bundle and source map'
            git push origin HEAD:fix/placecard-image-status-nav-order-20261011
          fi
