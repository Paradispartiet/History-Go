name: Voldsløkka editorial epoch index sync
on:
  push:
    branches:
      - content/voldslokka-pumptrack-editorial-v42-20261027
    paths:
      - .github/workflows/voldslokka-epoke-sync-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/voldslokka-pumptrack-editorial-v42-20261027
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate and verify only the deterministic epoke index
        run: |
          npm run epoker:places:build
          npm run epoker:places:check
      - name: Commit epoch index and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/epoker/epoke-place-index.json
          git rm .github/workflows/voldslokka-epoke-sync-20261027.yml
          git commit -m "Synchronize Voldsløkka descriptive text with canonical epoch index"
          git push
