name: Sentrum Scene one-time main reconciliation
on:
  push:
    branches:
      - content/sentrum-scene-v1-20261102
    paths:
      - .github/workflows/sentrum-scene-sync-main-onetime.yml
permissions:
  contents: write
concurrency:
  group: sentrum-scene-main-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Merge current main with tightly scoped generated-file conflict resolution
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "$conflicts"
            while IFS= read -r file; do
              test -z "$file" && continue
              case "$file" in
                data/knowledge/knowledge_units.generated.json|reports/knowledge-id-backfill.json|data/runtime/place-open/salt_oslo.json)
                  git checkout --theirs -- "$file"
                  git add -- "$file"
                  ;;
                *) echo "Unexpected conflict; refusing automatic resolution: $file" >&2; exit 1;;
              esac
            done <<< "$conflicts"
            test -z "$(git diff --name-only --diff-filter=U)"
          fi
      - name: Rebuild generated data over combined source tree
        run: |
          npm run place-open:build
          npm run knowledge:canonical:write
          node scripts/build-fagverk-release-manifest.mjs
          node --test tests/sentrum-scene-v1-fagverk-people-quiz-20261102.test.mjs
      - name: Commit main merge with regenerated artifacts
        run: |
          set -euo pipefail
          git add data/knowledge/knowledge_units.generated.json reports/knowledge-id-backfill.json data/runtime/place-open/salt_oslo.json data/runtime/place-open/sentrum_scene.json data/quiz/musikk/sentrum_scene_sets_merged.json data/fagverk/fagverk_release.json
          git diff --cached --stat | tail -40
          git commit -m "Sentrum Scene: reconcile current main and regenerate conflicting Knowledge and Place-open"
          git restore .
          git push origin HEAD:content/sentrum-scene-v1-20261102
