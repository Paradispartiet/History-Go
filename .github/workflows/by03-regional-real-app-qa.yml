name: Regional By03+04 Places real app QA
on:
  pull_request:
    paths:
      - '.github/workflows/by03-regional-real-app-qa.yml'
      - 'tests/by-v1-twenty-real-app-browser-20261024.mjs'
      - 'data/places/by/akershus/**'
      - 'data/places/by/ostfold/**'
      - 'data/places/by/buskerud/**'
      - 'data/places/by/innlandet/**'
      - 'data/places/by/vestfold/**'
      - 'tests/by-bolk04-regional-source-contract.test.mjs'
      - 'data/quizcards/by/regional_bolk04_*'
      - 'data/quiz/by/*_regional_v1_sets.json'
      - 'data/quizcards/by/regional_bolk03_*'
      - 'data/quiz/manifest.json'
      - 'data/quizcards/by/manifest.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: by03-regional-real-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regional-app-qa:
    name: Five regional Places real app — ${{ matrix.batch }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        batch: [regional03, regional04]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Validate regional quiz-source contracts
        run: node --test tests/by-bolk03-quizcard-source-contract.test.mjs tests/by-bolk04-regional-source-contract.test.mjs
      - name: Test real regional Places on 390px and 1440px
        env:
          HG_BY_BATCH: ${{ matrix.batch }}
          HG_BY_SHARD: ${{ matrix.shard }}
        run: node tests/by-v1-twenty-real-app-browser-20261024.mjs
      - name: Save browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regional-app-${{ matrix.batch }}-shard-${{ matrix.shard }}
          path: artifacts/by*/shard-${{ matrix.shard }}/
          if-no-files-found: ignore
