name: Tollpakkhuset materialize diagnostic one-shot

on:
  push:
    branches: [agent/tollpakkhuset-completion-20260911-v2]
    paths:
      - ".github/workflows/tollpakkhuset-materialize-diagnostic-once.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Reproduce materializer state and persist exact failure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ORIGINAL_SHA="$GITHUB_SHA"
          git fetch origin main
          git merge --no-edit origin/main
          npm ci
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Oslo_Tollbod_stenpakkhuset_rk_117572_IMG_2583.JPG' -o /tmp/tollpakkhuset-place.jpg
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Gad_Frederik_Clement_-_Johan_Henrik_Nebelong_-_Norsk_portrettarkiv_-_Riksantikvaren_-_N000136.jpg' -o /tmp/nebelong.jpg
          curl -L --fail --retry 3 'https://altinncdn.no/orgs/tad/tad.png' -o /tmp/tolletaten.png

          awk '
            /- name: Repair quiz production contract/ { section=1; next }
            section && /        run: \|/ { body=1; next }
            section && /      - name: Materialize Tollpakkhuset/ { exit }
            section && body { sub(/^          /, ""); print }
          ' .github/workflows/tollpakkhuset-completion.yml > /tmp/repair-quiz-contract.sh
          bash /tmp/repair-quiz-contract.sh

          set +e
          {
            echo '=== node --check ==='
            node --check tools/build-tollpakkhuset-completion.mjs
            CHECK_STATUS=$?
            echo "check_status=$CHECK_STATUS"
            echo '=== materializer ==='
            node tools/build-tollpakkhuset-completion.mjs
            RUN_STATUS=$?
            echo "run_status=$RUN_STATUS"
          } > /tmp/tollpakkhuset-materialize-error.log 2>&1
          set -e

          git reset --hard "$ORIGINAL_SHA"
          cp /tmp/tollpakkhuset-materialize-error.log TEMP_tollpakkhuset_materialize_error.log
          git rm .github/workflows/tollpakkhuset-materialize-diagnostic-once.yml
          git add TEMP_tollpakkhuset_materialize_error.log
          git commit -m "Capture Tollpakkhuset materializer failure"
          git push origin HEAD:agent/tollpakkhuset-completion-20260911-v2
