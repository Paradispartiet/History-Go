name: One-time History V5.6 prehistory expansion

on:
  push:
    branches:
      - agent/history-v5-6-prehistory-archaeology
    paths:
      - '.github/history-v5-6-prehistory-runner.part-*'
      - '.github/workflows/one-time-history-v5-6-prehistory.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/history-v5-6-prehistory-runner.part-*'
      - '.github/workflows/one-time-history-v5-6-prehistory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/history-v5-6-prehistory-archaeology
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reassemble and decode reviewed expansion script
        shell: bash
        run: |
          cat .github/history-v5-6-prehistory-runner.part-* > /tmp/history-v5-6-prehistory.b64
          printf '%s  %s\n' \
            '4c5581f15e5accb92d6116b20285b59dc8eabdc8204c36bf8b690a87dbd00f2a' \
            '/tmp/history-v5-6-prehistory.b64' | sha256sum --check
          base64 -d /tmp/history-v5-6-prehistory.b64 \
            | gunzip > /tmp/apply-history-v5-6-prehistory.mjs
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/apply-history-v5-6-prehistory.mjs')
          text = p.read_text()
          expected = text.count('con_his_${')
          if expected != 4:
              raise SystemExit(f'Expected four generated concept-id expressions, found {expected}')
          p.write_text(text.replace('con_his_${', 'con_his_pre_${'))
          PY
          node --check /tmp/apply-history-v5-6-prehistory.mjs

      - name: Apply universal prehistory and archaeology domain
        shell: bash
        run: |
          mkdir -p reports/historie-v5 reports/historie-universal-coverage
          node /tmp/apply-history-v5-6-prehistory.mjs 2>&1 \
            | tee reports/historie-v5/historie-v5-6-prehistory-apply.log

      - name: Validate new domain
        shell: bash
        run: |
          node tools/validate-historie-forhistorie-arkeologi.mjs 2>&1 \
            | tee reports/historie-v5/historie-v5-6-prehistory-domain-validation.log

      - name: Write and verify V5.6 quality freeze
        shell: bash
        run: |
          node tools/audit-historie-v5-5-quality-depth.mjs --write-freeze \
            --reason='V5.6 adds the universal prehistory and archaeology domain after the independent completeness audit.' 2>&1 \
            | tee reports/historie-v5/historie-v5-6-quality-freeze-write.log
          node tools/audit-historie-v5-5-quality-depth.mjs 2>&1 \
            | tee reports/historie-v5/historie-v5-6-quality-freeze-verify.log

      - name: Materialize and verify universal coverage
        shell: bash
        run: |
          node tools/audit-historie-universal-coverage.mjs 2>&1 \
            | tee reports/historie-universal-coverage/audit-command.log
          node tools/audit-historie-universal-coverage.mjs --check 2>&1 \
            | tee -a reports/historie-universal-coverage/audit-command.log

      - name: Verify active inventory
        shell: bash
        run: |
          node - <<'NODE' 2>&1 | tee reports/historie-v5/historie-v5-6-inventory-check.log
          const fs = require('fs');
          const h = 'data/fag/historie/';
          const p = JSON.parse(fs.readFileSync(h+'historiepensum_canonical_v4_5.json'));
          const e = JSON.parse(fs.readFileSync(h+'emner_historie_canonical_v4_5.json'));
          const m = JSON.parse(fs.readFileSync(h+'emnemapping_historie_canonical_v4_5.json'));
          const c = JSON.parse(fs.readFileSync(h+'concepts_historie_canonical_v5_5.json'));
          const t = JSON.parse(fs.readFileSync(h+'theory_objects_historie_canonical_v5_5.json'));
          const methods = JSON.parse(fs.readFileSync(h+'methods_historie_canonical_v4_5.json')).methods;
          const expected = {domains:21, emner:210, mappings:210, concepts:876, theories:210, methods:91};
          const actual = {domains:p.domains.length, emner:e.length, mappings:m.length, concepts:c.length, theories:t.length, methods:methods.length};
          console.log(JSON.stringify({expected, actual}, null, 2));
          for (const key of Object.keys(expected)) if (actual[key] !== expected[key]) process.exitCode = 1;
          NODE

      - name: Upload V5.6 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-v5-6-prehistory-diagnostics
          path: |
            reports/historie-v5/**
            reports/historie-universal-coverage/**
          if-no-files-found: warn

      - name: Remove one-time inputs and publish
        shell: bash
        run: |
          rm -f .github/history-v5-6-prehistory-runner.mjs.gz.b64
          rm -f .github/history-v5-6-prehistory-runner.part-*
          rm .github/workflows/one-time-history-v5-6-prehistory.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short | tee reports/historie-v5/historie-v5-6-prehistory-git-status.log
          git add -A
          git commit -m 'Utvid Historie V5.6 med forhistorie og arkeologi'
          git push origin HEAD:agent/history-v5-6-prehistory-archaeology
