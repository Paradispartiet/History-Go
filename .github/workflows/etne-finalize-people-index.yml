name: Etne final people and quality validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  profile-baseline:
    if: github.head_ref == 'agent/etne-all-rounds-quality-audit-uplift'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-all-rounds-quality-audit-uplift
          fetch-depth: 0
      - name: Compare legacy profile tests with main
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin main
          set +e
          node tests/etne-city-batch1-round-content.test.js > /tmp/branch-city.log 2>&1
          BRANCH_CITY=$?
          node tests/etne-literature-batch1-round-content.test.js > /tmp/branch-literature.log 2>&1
          BRANCH_LITERATURE=$?
          git checkout --detach origin/main
          node tests/etne-city-batch1-round-content.test.js > /tmp/main-city.log 2>&1
          MAIN_CITY=$?
          node tests/etne-literature-batch1-round-content.test.js > /tmp/main-literature.log 2>&1
          MAIN_LITERATURE=$?
          set -e
          echo "branch_city=${BRANCH_CITY} main_city=${MAIN_CITY}"
          echo "branch_literature=${BRANCH_LITERATURE} main_literature=${MAIN_LITERATURE}"
          if [ "${MAIN_CITY}" -eq 0 ] && [ "${BRANCH_CITY}" -ne 0 ]; then exit 1; fi
          if [ "${MAIN_LITERATURE}" -eq 0 ] && [ "${BRANCH_LITERATURE}" -ne 0 ]; then exit 1; fi
          echo 'No new legacy-profile regression relative to main.'

  validate:
    if: github.head_ref == 'agent/etne-all-rounds-quality-audit-uplift'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/etne-all-rounds-quality-audit-uplift
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate Civication people index
        run: npm run civication:history-people:build

      - name: Confirm generated people index is clean
        run: git diff --exit-code -- data/Civication/historyPeople_index.json

      - name: Validate Etne religion rounds
        run: node tests/etne-religion-round-content.test.js

      - name: Refresh and validate consolidated Etne quality
        shell: bash
        run: |
          set -euo pipefail
          export AUDIT_GENERATED_AT="$(node -p "require('./reports/etne-non-nature-quality-audit/report.json').generatedAt")"
          node tools/audit-etne-non-nature-round-quality.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/etne-non-nature-quality-audit/report.json reports/etne-non-nature-quality-audit/report.md
          if git diff --cached --quiet; then
            echo 'Audit report already deterministic and current.'
          else
            git diff --cached --check
            git commit -m 'Refresh deterministic Etne quality audit'
            git push origin HEAD:agent/etne-all-rounds-quality-audit-uplift
          fi

      - name: Validate all People data
        run: bash scripts/check-people.sh

      - name: Validate PlaceCard runtime profiles
        run: node tests/place-card-rounds-runtime-audit.test.js
