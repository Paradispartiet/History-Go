name: Etne final people and quality validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'agent/etne-all-rounds-quality-audit-uplift'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/etne-all-rounds-quality-audit-uplift
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate Civication people index
        run: npm run civication:history-people:build

      - name: Publish generated people index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/Civication/historyPeople_index.json
          if git diff --cached --quiet; then
            echo 'Civication people index already current.'
          else
            git diff --cached --check
            git commit -m 'Sync Civication people index for Etne religion'
            git push origin HEAD:agent/etne-all-rounds-quality-audit-uplift
          fi

      - name: Validate Etne religion rounds
        run: node tests/etne-religion-round-content.test.js

      - name: Validate consolidated Etne quality
        run: node tools/audit-etne-non-nature-round-quality.mjs

      - name: Validate all People data
        run: bash scripts/check-people.sh

      - name: Validate PlaceCard runtime profiles
        run: node tests/place-card-rounds-runtime-audit.test.js

      - name: Validate Etne city profile
        run: node tests/etne-city-batch1-round-content.test.js

      - name: Validate Etne literature profile
        run: node tests/etne-literature-batch1-round-content.test.js

      - name: Publish refreshed audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/etne-non-nature-quality-audit/report.json reports/etne-non-nature-quality-audit/report.md
          if git diff --cached --quiet; then
            echo 'Audit report already current.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Refresh Etne non-nature quality audit'
          git push origin HEAD:agent/etne-all-rounds-quality-audit-uplift
