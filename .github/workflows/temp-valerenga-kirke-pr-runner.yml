name: Temporary Vålerenga kirke PR runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  produce:
    if: github.head_ref == 'agent/oslo-coordinate-valerenga-kirke-production'
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-valerenga-kirke-production
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract and run canonical materializer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/temp-valerenga-kirke-production.yml').read_text()
          start_marker = "          node <<'NODE'\n"
          end_marker = "          NODE\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          Path('/tmp/valerenga-materialize.js').write_text(script)
          PY
          node /tmp/valerenga-materialize.js

      - name: Build index and run coordinate validation stack
        shell: bash
        run: |
          set -euo pipefail
          LOGDIR="reports/coordinate-branch-runner/agent_oslo-coordinate-valerenga-kirke-production"
          mkdir -p "$LOGDIR"

          npm run places:index:build 2>&1 | tee "$LOGDIR/places-index-build.log"
          npm run audit:places-split-manifest-sync 2>&1 | tee "$LOGDIR/split-manifest-sync.log"
          npm run places:index:check 2>&1 | tee "$LOGDIR/places-index-check.log"
          npm run test:coordinate-source-contract 2>&1 | tee "$LOGDIR/coordinate-source-contract.log"
          npm run places:coords:quality 2>&1 | tee "$LOGDIR/coordinate-quality.log"
          npm run places:coords:intake -- --strict-new 2>&1 | tee "$LOGDIR/coordinate-intake.log"
          npm run places:coords:evidence:audit 2>&1 | tee "$LOGDIR/coordinate-evidence.log"
          git diff --check 2>&1 | tee "$LOGDIR/git-diff-check.log"

          set +e
          npm run health:places 2>&1 | tee "$LOGDIR/health-places.log"
          HEALTH_CODE=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$HEALTH_CODE" > "$LOGDIR/health-places.exit-code.txt"

      - name: Commit validated production result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-valerenga-kirke-production.yml
          rm -f .github/workflows/temp-valerenga-kirke-pr-runner.yml
          rm -f reports/coordinate-branch-runner/agent_oslo-coordinate-valerenga-kirke-production/trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Vålerenga kirke as canonical Oslo place"
          git push origin HEAD:agent/oslo-coordinate-valerenga-kirke-production
