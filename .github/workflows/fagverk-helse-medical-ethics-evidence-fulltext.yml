name: Fagverk Helse medical ethics evidence fulltext

on:
  pull_request:
    paths:
      - 'data/fag/helse/**'
      - 'data/fag/fag_manifest.json'
      - 'data/fagverk/helse/**'
      - 'data/fagverk/fagverk_registry.json'
      - 'data/fagverk/fagverk_release.json'
      - 'data/fagverk/fagverk_portal.json'
      - 'data/fagverk/subject_inventory.json'
      - 'data/fagverk/subject_status.json'
      - 'reports/fagverk/helse-medical-ethics-evidence-fulltext-v1-audit.json'
      - 'reports/fagverk/subject-baseline.json'
      - 'scripts/materialize-helse-medical-ethics-evidence-fulltext-v1.mjs'
      - 'scripts/audit-helse-medical-ethics-evidence-fulltext-v1.mjs'
      - 'tests/helse-medical-ethics-evidence-fulltext-v1.test.mjs'
      - '.github/workflows/fagverk-helse-medical-ethics-evidence-fulltext.yml'
  push:
    branches: [main]
    paths:
      - 'data/fag/helse/**'
      - 'data/fagverk/helse/**'
      - 'scripts/*helse-medical-ethics-evidence-fulltext*'
      - 'tests/helse-medical-ethics-evidence-fulltext-v1.test.mjs'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/materialize-helse-medical-ethics-evidence-fulltext-v1.mjs
      - run: node scripts/audit-helse-medical-ethics-evidence-fulltext-v1.mjs
      - run: node scripts/audit-fagverk-subject-inventory.mjs
      - run: node scripts/build-fagverk-release-manifest.mjs --check
      - run: node --test tests/helse-medical-ethics-evidence-source-brief-v1.test.mjs tests/helse-medical-ethics-evidence-fulltext-v1.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-release-manifest.test.mjs
