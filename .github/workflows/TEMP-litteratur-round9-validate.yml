name: TEMP Litteratur round 9 validate

on:
  push:
    branches:
      - agent/litteratur-maintenance-round9-forfatterskap-20260906
    paths:
      - '.github/workflows/TEMP-litteratur-round9-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/litteratur-maintenance-round9-forfatterskap-20260906
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate evidence-only round 9
        run: |
          node --check scripts/audit-litteratur-maintenance-source-refresh-round9.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round9.mjs
          node --test tests/litteratur-maintenance-source-refresh-round9.test.mjs
      - name: Verify derived Knowledge is already current
        run: node --experimental-strip-types scripts/knowledge-canonical-data.mts --check
      - name: Preserve Litteratur assessment theory and Fagverk integrity
        run: |
          node scripts/audit-litteratur-assessment-v1.mjs
          node tools/audit-litteratur-theory-integrity.mjs
          node --test tests/litteratur-assessment-v1.test.mjs tests/litteratur-theory-integrity.test.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node scripts/audit-fagverk-litteratur-legacy-theory.mjs > /tmp/litteratur-legacy-theory-round9-check.json
      - name: Prove validation created no repository drift
        run: |
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
