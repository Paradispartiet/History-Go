name: TEMP Materialize Kunstnerisk ledelse Role World

on:
  push:
    branches: [agent/civication-kunst-kunstnerisk-ledelse-role-world]
    paths:
      - scripts/TEMP_materialize_kunst_kunstnerisk_ledelse_role_world.mjs
      - tests/civication-kunst-kunstnerisk-ledelse-role-world-rollout.test.js
      - tests/civication-kunst-kunstnerisk-ledelse-prerequisites.test.js
      - reports/CIVICATION_KUNST_KUNSTNERISK_LEDELSE_ROLE_WORLD_ROLLOUT_SOURCE_FIRST.md
      - .github/workflows/TEMP-civication-kunst-kunstnerisk-ledelse-role-world.yml
  workflow_dispatch:

concurrency:
  group: civication-kunst-kunstnerisk-ledelse-role-world-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: write }

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/civication-kunst-kunstnerisk-ledelse-role-world, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Materialize Role World
        run: node scripts/TEMP_materialize_kunst_kunstnerisk_ledelse_role_world.mjs
      - name: Regenerate canonical audits
        run: |
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify dedicated and prerequisite contracts
        run: |
          node tests/civication-kunst-kunstnerisk-ledelse-role-world-rollout.test.js
          node tests/civication-kunst-kunstnerisk-ledelse-prerequisites.test.js
          node tests/civication-kunst-life-career-split.test.js
          node tests/civication-role-world-rollout-readiness.test.js
      - name: Verify registries and Scenario People
        run: |
          node scripts/build-civication-scene-registry.mjs --check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node --test tests/civication-scenario-people.test.mjs
      - name: Run full Civication suite
        run: |
          set +e
          npm run test:civication > /tmp/civication.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            grep -E -B 8 -A 24 'AssertionError|ERR_ASSERTION|not ok|FAIL|Error:|error:' /tmp/civication.log | tail -n 220 || tail -n 220 /tmp/civication.log
            exit "$status"
          fi
          tail -n 50 /tmp/civication.log
      - name: Remove temporary rollout surfaces
        run: rm scripts/TEMP_materialize_kunst_kunstnerisk_ledelse_role_world.mjs .github/workflows/TEMP-civication-kunst-kunstnerisk-ledelse-role-world.yml
      - name: Commit exact verified Role World
        run: |
          git diff --check
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No permanent changes produced"; exit 1; }
          git commit -m "Complete Kunstnerisk ledelse Role World"
          git push origin HEAD:agent/civication-kunst-kunstnerisk-ledelse-role-world
