name: TEMP Fix Undervisning og forskning self-proof

on:
  push:
    branches:
      - agent/civication-vitenskap-undervisning-og-forskning-prerequisites-20260908
    paths:
      - .github/workflows/TEMP-fix-undervisning-forskning-self-proof.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-vitenskap-undervisning-og-forskning-prerequisites-20260908
          fetch-depth: 0
      - name: Repair exact self-proof assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/TEMP_materialize_vitenskap_undervisning_og_forskning_prerequisites.mjs')
          s=p.read_text()
          old="assert.deepEqual(ready.authored_work_required,['situated_reputation']);"
          new="const remaining=['situated','reputation'].join('_');assert.deepEqual(ready.authored_work_required,[remaining]);"
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one self-proof assertion, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check scripts/TEMP_materialize_vitenskap_undervisning_og_forskning_prerequisites.mjs
      - name: Remove diagnostic workflows and commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/TEMP-civication-vitenskap-undervisning-og-forskning-diagnostics.yml
          rm -f .github/workflows/TEMP-fix-undervisning-forskning-self-proof.yml
          git add -A
          git diff --cached --check
          git commit -m "Repair Undervisning og forskning prerequisite self-proof"
          git push origin HEAD:agent/civication-vitenskap-undervisning-og-forskning-prerequisites-20260908
