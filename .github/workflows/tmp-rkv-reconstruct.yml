name: Temporary RKV reconstruction

on:
  push:
    branches:
      - 'agent/tmp-rkv-reconstruct-20260727'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tmp-rkv-reconstruct-20260727
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Repair transfer-only substitutions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('data/places/politikk/oslo/places_politikk/regjeringskvartalet.json')
          text = path.read_text(encoding='utf-8')
          text = text.replace('samtid gum', 'samtidig som')
          text = text.replace('ingenør', 'ingeniør')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate exact packet and hashes
        run: node scripts/validate-place-description-production-v4_2_policy.mjs --all
      - name: Commit reconstructed canonical file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/politikk/oslo/places_politikk/regjeringskvartalet.json
          git commit -m 'Reconstruct validated Regjeringskvartalet JSON'
          git push origin HEAD:agent/tmp-rkv-reconstruct-20260727
