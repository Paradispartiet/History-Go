name: Sport QuizCard generated web bundles (one-shot)
on:
  push:
    branches: [fix/sport-quizcard-manifest-20261103]
    paths:
      - '.github/workflows/sport-quizcard-build-once-20261103.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sport-quizcard-manifest-20261103
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build typed web bundles
        run: npm run build:web
      - name: Save only Sport-affected output artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/web/place-card-quizcards-patch.js dist/web/place-unified-surface.js dist/web/place-unified-surface.js.map
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Sync generated Sport QuizCard client bundles'
            git push origin HEAD:fix/sport-quizcard-manifest-20261103
          fi
