name: Temporary Jordal ungdomshall containment resolution

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  resolve:
    if: github.head_ref == 'data/oslo-jordal-ungdomshall-geometry-intake'
    runs-on: ubuntu-latest
    steps:
      - name: Check out intake branch
        uses: actions/checkout@v4
        with:
          ref: data/oslo-jordal-ungdomshall-geometry-intake
          fetch-depth: 0

      - name: Query building polygons around verified facility points
        shell: bash
        run: |
          set -euo pipefail
          REPORTDIR="reports/geonorge-address-jordal-ungdomshall-20260720/geometry-resolution"
          mkdir -p "$REPORTDIR"
          cat > /tmp/jordal-buildings.ql <<'EOF'
          [out:json][timeout:60];
          way(around:120,59.9111696,10.7840617)["building"];
          out center tags geom;
          EOF
          curl -fsSL \
            -A "History-Go coordinate audit/1.0" \
            --data-urlencode "data@/tmp/jordal-buildings.ql" \
            "https://overpass-api.de/api/interpreter" \
            | tee "$REPORTDIR/overpass-buildings-around-youth-hall-point.json"

      - name: Resolve containing building polygon
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          from pathlib import Path

          reportdir = Path('reports/geonorge-address-jordal-ungdomshall-20260720/geometry-resolution')
          data = json.loads((reportdir/'overpass-buildings-around-youth-hall-point.json').read_text())
          point = (10.7840617, 59.9111696)  # lon, lat; two OSM nodes named Jordal Ungdomshall, BYM LHL

          def point_in_poly(point, poly):
              x,y=point; inside=False
              n=len(poly)
              if n < 3: return False
              j=n-1
              for i in range(n):
                  xi,yi=poly[i]; xj,yj=poly[j]
                  if ((yi>y)!=(yj>y)):
                      x_cross=(xj-xi)*(y-yi)/(yj-yi)+xi
                      if x < x_cross: inside=not inside
                  j=i
              return inside

          def polygon_centroid(poly):
              if len(poly) < 3:
                  return None
              if poly[0] != poly[-1]:
                  poly = poly + [poly[0]]
              a=0.0; cx=0.0; cy=0.0
              for i in range(len(poly)-1):
                  x0,y0=poly[i]; x1,y1=poly[i+1]
                  cross=x0*y1-x1*y0
                  a+=cross; cx+=(x0+x1)*cross; cy+=(y0+y1)*cross
              a*=0.5
              if abs(a)<1e-15:
                  return None
              return (cx/(6*a), cy/(6*a))

          candidates=[]
          containing=[]
          for e in data.get('elements',[]):
              geom=e.get('geometry') or []
              poly=[(g['lon'],g['lat']) for g in geom]
              centroid=polygon_centroid(poly)
              row={
                  'osmType':'way',
                  'osmId':e.get('id'),
                  'tags':e.get('tags',{}),
                  'geometryPointCount':len(poly),
                  'containsVerifiedYouthHallInteriorPoint':point_in_poly(point,poly),
                  'center':e.get('center'),
                  'derivedPolygonCentroid':None if centroid is None else {'lat':centroid[1],'lon':centroid[0]}
              }
              candidates.append(row)
              if row['containsVerifiedYouthHallInteriorPoint']:
                  containing.append(row)

          decision={
              'version':'2026-07-20-interior-point-polygon-containment',
              'placeId':'jordal_ungdomshall',
              'verifiedInteriorEvidence':{
                  'point':{'lat':59.9111696,'lon':10.7840617},
                  'osmNodes':[13812181652,13812184888],
                  'sharedName':'Jordal Ungdomshall, BYM LHL',
                  'evidence':'Two separately registered defibrillator nodes at the same coordinate explicitly state they are inside Jordal Ungdomshall, one on each side of the ice rink.'
              },
              'candidateBuildingCount':len(candidates),
              'containingBuildingCount':len(containing),
              'containingBuildings':containing,
              'allNearbyBuildings':candidates,
              'status':'verified_geometry_candidate' if len(containing)==1 else 'needs_manual_geometry_review',
              'productionGate':'ready_for_canonical_production' if len(containing)==1 else 'blocked'
          }
          if len(containing)==1:
              b=containing[0]
              c=b['derivedPolygonCentroid'] or {'lat':b['center']['lat'],'lon':b['center']['lon']}
              decision['resolvedCoordinate']={
                  'lat':c['lat'],'lon':c['lon'],'r':60,
                  'locatorType':'building',
                  'sourceProvider':'openstreetmap',
                  'sourceObjectId':f"osm:way:{b['osmId']}",
                  'geocodeAccuracy':'building_polygon_centroid',
                  'coordRole':'display_marker',
                  'coordStatus':'verified_geometry',
                  'coordSource':'openstreetmap_building_polygon_plus_named_interior_facility_nodes',
                  'coordType':'building_centroid',
                  'coordNote':f"Bygningssenter beregnet fra OSM way {b['osmId']}, den eneste bygningspolygonen som omslutter to separate navngitte anleggspunkter for «Jordal Ungdomshall, BYM LHL» inne i ishallen. Dette skiller ungdomshallen fysisk fra Jordal Amfi til tross for delt besøksadresse."
              }
          (reportdir/'containment-decision.json').write_text(json.dumps(decision,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(decision,ensure_ascii=False,indent=2))
          if len(containing)!=1:
              raise SystemExit(f'Expected exactly one containing building polygon, found {len(containing)}')
          PY

      - name: Commit clean containment evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-jordal-ungdomshall-containment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve Jordal ungdomshall building polygon by containment"
          git push origin HEAD:data/oslo-jordal-ungdomshall-geometry-intake
