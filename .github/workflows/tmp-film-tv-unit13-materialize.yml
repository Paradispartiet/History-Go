name: TEMP materialize Film TV unit 13 fulltext

on:
  push:
    branches:
      - agent/film-tv-unit13-location-production-place-ethics-fulltext

permissions:
  contents: write

concurrency:
  group: tmp-film-tv-unit13-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/film-tv-unit13-location-production-place-ethics-fulltext
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build deterministic unit 13 state
        run: |
          node --check scripts/materialize-film-tv-location-production-place-ethics-fulltext-v1.mjs
          node --check scripts/audit-film-tv-location-production-place-ethics-fulltext-v1.mjs
          node scripts/materialize-film-tv-location-production-place-ethics-fulltext-v1.mjs --write
          node scripts/brief-film-tv-location-production-place-ethics-sources-v1.mjs --write-report
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/audit-fagverk-film-tv-phase3.mjs --write-report
          node scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs --write-report
          node scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs --write-report
          node scripts/audit-film-tv-location-production-place-ethics-fulltext-v1.mjs --write-report
      - name: Commit deterministic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/fagverk/film_tv/location-produksjon-og-stedsetikk.json \
            data/fagverk/film_tv/location-produksjon-og-stedsetikk \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_status.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/general-engine-audit.json \
            reports/fagverk/film-tv-phase3-audit.json \
            reports/fagverk/film-tv-industry-regulation-distribution-fulltext-v1-audit.json \
            reports/fagverk/film-tv-screen-places-identity-circulation-fulltext-v1-audit.json \
            reports/fagverk/film-tv-location-production-place-ethics-source-brief-v1-audit.json \
            reports/fagverk/film-tv-location-production-place-ethics-fulltext-v1-audit.json
          if git diff --cached --quiet; then
            echo "No deterministic output changes"
          else
            git commit -m "Materialize Film TV unit 13 fulltext"
            git push origin HEAD:agent/film-tv-unit13-location-production-place-ethics-fulltext
          fi
