name: Fagverk Subkultur theory attribution

on:
  pull_request:
    paths:
      - 'data/fag/subkultur/theory_objects_subkultur_canonical_v1.json'
      - 'data/fag/subkultur/sources_subkultur_canonical_v1.json'
      - 'data/fag/subkultur/theory_attribution_subkultur_canonical_v1.json'
      - 'data/fag/subkultur/subkulturpensum_canonical_v4_5.json'
      - 'data/fag/subkultur/claims_subkultur_canonical_v1.json'
      - 'data/fag/subkultur/evidence_links_subkultur_canonical_v1.json'
      - 'data/fag/subkultur/emner_subkultur_canonical_v4_5.json'
      - 'scripts/audit-subkultur-theory-attribution-v1.mjs'
      - 'tests/subkultur-theory-attribution-v1.test.mjs'
      - '.github/workflows/fagverk-subkultur-theory-attribution.yml'
  push:
    branches: [main]
    paths:
      - 'data/fag/subkultur/theory_objects_subkultur_canonical_v1.json'
      - 'data/fag/subkultur/sources_subkultur_canonical_v1.json'
      - 'data/fag/subkultur/theory_attribution_subkultur_canonical_v1.json'
      - 'data/fag/subkultur/subkulturpensum_canonical_v4_5.json'
      - 'data/fag/subkultur/claims_subkultur_canonical_v1.json'
      - 'data/fag/subkultur/evidence_links_subkultur_canonical_v1.json'
      - 'data/fag/subkultur/emner_subkultur_canonical_v4_5.json'
      - 'scripts/audit-subkultur-theory-attribution-v1.mjs'
      - 'tests/subkultur-theory-attribution-v1.test.mjs'
      - '.github/workflows/fagverk-subkultur-theory-attribution.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  theory-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify 80 theory objects have researcher, scholarly and prose provenance
        run: |
          node --check scripts/audit-subkultur-theory-attribution-v1.mjs
          node scripts/audit-subkultur-theory-attribution-v1.mjs
          node --test tests/subkultur-theory-attribution-v1.test.mjs
