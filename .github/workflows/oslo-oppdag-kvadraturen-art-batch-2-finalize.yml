name: Oslo Oppdag Kvadraturen art batch 2 finalize

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-oppdag-kvadraturen-art-batch-2-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Register canonical art source
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-batch-2/validation'
          mkdir -p "$outdir"
          node <<'NODE' | tee "$outdir/manifest-registration.txt"
          const fs = require('fs');
          const manifestPath = 'data/places/manifest.json';
          const rel = 'places/kunst/oslo/places_kunst_oslo_oppdag_kvadraturen_art_batch_02.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (!Array.isArray(manifest.files)) throw new Error('data/places/manifest.json missing files[]');
          const before = manifest.files.filter((x) => x === rel).length;
          if (before === 0) manifest.files.push(rel);
          const after = manifest.files.filter((x) => x === rel).length;
          if (after !== 1) throw new Error(`Expected exactly one manifest entry for ${rel}, found ${after}`);
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(`Manifest registration: OK (${rel}; previous=${before}, current=${after})`);
          NODE

      - name: Validate JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-batch-2/validation'
          jq empty data/places/kunst/oslo/places_kunst_oslo_oppdag_kvadraturen_art_batch_02.json
          jq empty data/places/manifest.json
          echo 'JSON syntax: OK' | tee "$outdir/json-syntax.txt"

      - name: Build places index
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-batch-2/validation'
          npm run places:index:build | tee "$outdir/places-index-build.txt"

      - name: Check places index
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-batch-2/validation'
          npm run places:index:check | tee "$outdir/places-index-check.txt"

      - name: Check strict coordinate intake
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-batch-2/validation'
          npm run places:coords:intake | tee "$outdir/coordinate-intake.txt"

      - name: Check canonical emne IDs
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-batch-2/validation'
          npm run places:emner:check | tee "$outdir/emne-check.txt"

      - name: Hold place-health baseline
        shell: bash
        run: |
          set -uo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-batch-2/validation'
          set +e
          npm run health:places | tee "$outdir/health-places.txt"
          status=${PIPESTATUS[0]}
          set -e
          grep -q '^Errors: 40$' "$outdir/health-places.txt"
          if grep -F 'data/places/kunst/oslo/places_kunst_oslo_oppdag_kvadraturen_art_batch_02.json:' "$outdir/health-places.txt" | grep -q '^'; then
            echo 'New art batch introduced a PlaceHealth error or warning requiring review.' >&2
            grep -F 'data/places/kunst/oslo/places_kunst_oslo_oppdag_kvadraturen_art_batch_02.json:' "$outdir/health-places.txt" >&2 || true
            exit 1
          fi
          echo "PlaceHealth baseline held at 40 existing errors (command status=$status)." | tee "$outdir/health-baseline.txt"

      - name: Check split manifest sync
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-batch-2/validation'
          npm run audit:places-split-manifest-sync | tee "$outdir/split-manifest-sync.txt"

      - name: Check coordinate source contract
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-batch-2/validation'
          npm run test:coordinate-source-contract | tee "$outdir/coordinate-contract.txt"

      - name: Check whitespace
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-batch-2/validation'
          git diff --check | tee "$outdir/git-diff-check.txt"

      - name: Remove temporary workflows and commit final results
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/oslo-oppdag-kvadraturen-art-batch-2-coordinates.yml
          rm -f .github/workflows/oslo-oppdag-kvadraturen-art-batch-2-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/manifest.json data/places/places_index.json
          git add reports/oslo-oppdag-kvadraturen-art-batch-2/validation
          git add -u .github/workflows/oslo-oppdag-kvadraturen-art-batch-2-coordinates.yml
          git add -u .github/workflows/oslo-oppdag-kvadraturen-art-batch-2-finalize.yml
          git commit -m 'Integrate Oppdag Kvadraturen art batch 2'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
