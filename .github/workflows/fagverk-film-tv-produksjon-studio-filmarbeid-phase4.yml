name: Fagverk Film TV Produksjon studio filmarbeid Phase 4

on:
  pull_request:
    paths:
      - 'data/fagverk/film_tv/produksjon-studio-og-filmarbeid.json'
      - 'data/fagverk/film_tv/produksjon-studio-og-filmarbeid/**'
      - 'reports/fagverk/film-tv-*-audit.json'
      - 'scripts/audit-fagverk-film-tv-*.mjs'
      - 'scripts/materialize-film-tv-produksjon-studio-filmarbeid-phase4.mjs'
      - 'tests/fagverk-film-tv-*.test.mjs'
      - '.github/workflows/fagverk-film-tv-produksjon-studio-filmarbeid-phase4.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check scripts/materialize-film-tv-produksjon-studio-filmarbeid-phase4.mjs
          node --check scripts/audit-fagverk-film-tv-produksjon-studio-filmarbeid-phase4.mjs
      - name: Film TV structural audit
        run: node scripts/audit-fagverk-film-tv-phase3.mjs
      - name: Film TV chapter audit
        run: node scripts/audit-fagverk-film-tv-produksjon-studio-filmarbeid-phase4.mjs
      - name: General engine and subject inventory
        run: |
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
      - name: Release feed
        run: node scripts/build-fagverk-release-manifest.mjs --check
      - name: Tests
        run: node --test tests/fagverk-film-tv-*.test.mjs tests/fagverk-general-engine.test.mjs tests/fagverk-subject-inventory.test.mjs
