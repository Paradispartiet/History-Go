name: Tøyen trafo Språk derived runtime sync (temporary)
on:
  push:
    branches:
      - content/toyen-trafo-sprakleksikon-20261104
    paths:
      - .github/workflows/toyen-trafo-sprak-sync-temp.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and rebuild canonical Place-open payload
        run: |
          npm ci --no-audit --no-fund
          npm run place-open:build
          npm run place-open:check
          node --test tests/toyen-trafo-language-contract.test.mjs
          git status --short
      - name: Commit generated Tøyen trafo runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/runtime/place-open/toyen_trafo.json
          git diff --cached --name-only
          if ! git diff --cached --quiet; then
            git commit -m "build(toyen trafo): regenerate canonical Språkleksikon Place-open"
            git push origin HEAD:content/toyen-trafo-sprakleksikon-20261104
          fi
