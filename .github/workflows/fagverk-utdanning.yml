name: Fagverk Utdanning registry gate

on:
  pull_request:
    paths:
      - 'data/fag/utdanning/**'
      - 'data/fagverk/utdanning/**'
      - 'data/fagverk/subject_inventory.json'
      - 'reports/fagverk/**'
      - 'scripts/*utdanning*'
      - 'scripts/audit-fagverk-subject-inventory.mjs'
      - 'scripts/audit-fagverk-general-engine.mjs'
      - 'scripts/audit-fagverk-theory-quality.mjs'
      - 'scripts/audit-fagverk-theory-integrity.mjs'
      - 'scripts/build-fagverk-release-manifest.mjs'
      - 'tests/utdanning-*.test.mjs'
      - 'tests/fagverk-subject-inventory.test.mjs'
      - 'tests/fagverk-general-engine.test.mjs'
      - 'tests/fagverk-release-manifest.test.mjs'
      - '.github/ci/fagverk-utdanning-domain-registry-v1.json'
      - '.github/workflows/fagverk-utdanning.yml'
  push:
    branches: [main]
    paths:
      - 'data/fag/utdanning/**'
      - 'data/fagverk/utdanning/**'
      - 'data/fagverk/subject_inventory.json'
      - 'reports/fagverk/**'
      - 'scripts/*utdanning*'
      - 'scripts/audit-fagverk-subject-inventory.mjs'
      - 'scripts/audit-fagverk-general-engine.mjs'
      - 'scripts/audit-fagverk-theory-quality.mjs'
      - 'scripts/audit-fagverk-theory-integrity.mjs'
      - 'scripts/build-fagverk-release-manifest.mjs'
      - 'tests/utdanning-*.test.mjs'
      - 'tests/fagverk-subject-inventory.test.mjs'
      - 'tests/fagverk-general-engine.test.mjs'
      - 'tests/fagverk-release-manifest.test.mjs'
      - '.github/ci/fagverk-utdanning-domain-registry-v1.json'
      - '.github/workflows/fagverk-utdanning.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fagverk-utdanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  utdanning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run registry-driven Utdanning gate
        run: node scripts/run-utdanning-domain-ci-v1.mjs
