name: TEMP situated reputation writeback
on:
  push:
    branches:
      - agent/civication-situated-reputation-v1
permissions:
  contents: write
jobs:
  writeback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-situated-reputation-v1
          fetch-depth: 0
      - name: Apply permanent situated reputation change
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 --decode > /tmp/civication-situated-reputation.patch
          git apply --index /tmp/civication-situated-reputation.patch
          git rm .github/workflows/TEMP-civication-situated-reputation-writeback.yml
          git rm scripts/TEMP_trigger_civication_situated_reputation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add situated Civication reputation"
          git push origin HEAD:agent/civication-situated-reputation-v1
