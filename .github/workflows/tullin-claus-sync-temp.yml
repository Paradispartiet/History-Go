name: Tullin Claus single-use generated index synchronization
on:
  push:
    branches:
      - content/tullin-claus-illustration-vferdig-20261110
    paths:
      - '.github/workflows/tullin-claus-sync-temp.yml'
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/tullin-claus-illustration-vferdig-20261110
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rebuild only canonical generated indexes
        run: |
          node scripts/build-place-open-payloads.mjs
          npm run civication:history-people:build
      - name: Commit exact affected generated artifacts
        run: |
          git add data/runtime/people-all/part-006.json data/runtime/place-open/tullin.json data/Civication/historyPeople_index.json
          git diff --cached --stat
          if git diff --cached --quiet; then echo "All files already synchronized"; exit 0; fi
          git -c user.name="HistoryGo CI" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Sync Tullin People and Civication indexes for original Claus illustration"
          git push origin HEAD:content/tullin-claus-illustration-vferdig-20261110
