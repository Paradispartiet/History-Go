name: Finalize Majorstukrysset Fagverk v2

on:
  push:
    branches:
      - work/majorstuen-krysset-fagverk-v2-20260901
    paths:
      - .github/workflows/finalize-majorstuen-krysset-fagverk-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Sync branch to current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Materialize Majorstukrysset Fagverk source and image repair
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const placePath = 'data/places/by/oslo/places/majorstuen_krysset.json';
          const registryPath = 'data/fagverk/fagverk_registry.json';
          const backlogPath = 'data/places/place_image_backlog_summary.json';
          const place = JSON.parse(fs.readFileSync(placePath, 'utf8'));

          const imageUrl = 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Majorstua_1_TRS.jpg?width=1280';
          const imagePage = 'https://commons.wikimedia.org/wiki/File:Majorstua_1_TRS.jpg';
          const staleImage = place.image === 'bilder/places/majorstuen_krysset.JPG' && place.cardImage === 'bilder/kort/places/majorstuen_krysset.PNG';
          if (staleImage) {
            place.image = imageUrl;
            place.cardImage = imageUrl;
          }

          const sources = [
            ['Oslo Byleksikon – Majorstuhuset', 'https://oslobyleksikon.no/side/Majorstuhuset'],
            ['Oslo Byleksikon – Kirkeveien', 'https://oslobyleksikon.no/side/Kirkeveien'],
            ['Oslo Byleksikon – Valkyriegata', 'https://oslobyleksikon.no/side/Valkyriegata'],
            ['Ruter – I ord og bilder: Majorstuen', 'https://ruter.no/om-oss/kollektivhistorien/i-ord-og-bilder-majorstuen'],
            ['Sporveien – historisk tidslinje', 'https://www.sporveien.no/om-sporveien/historien-var/sporveiens-historiske-i-en-tidslinje/']
          ];
          const existingLinks = Array.isArray(place.externalLinks) ? place.externalLinks : [];
          const byUrl = new Map(existingLinks.filter((row) => row?.url).map((row) => [row.url, row]));
          for (const [label, url] of sources) byUrl.set(url, { type: 'source', label, url, verifiedAt: '2026-09-01' });
          byUrl.set(imagePage, {
            type: 'source',
            label: 'Wikimedia Commons – Majorstua 1 TRS, Trond Strandsberg, CC BY-SA 3.0',
            url: imagePage,
            verifiedAt: '2026-09-01'
          });
          place.externalLinks = [...byUrl.values()];

          place.fagverk = {
            schema: 'history_go_place_fagverk_v2',
            level: 'full',
            status: 'curated',
            intro: 'Majorstukrysset kan undersøkes som et presset overgangsrom der trikk, buss, bil, T-bane, handel og fotgjengere kobles sammen innenfor få meter. Fagverket bruker signaler, gangfelt, ventepunkter og innganger til å skille trygg bevegelse fra kryssfriksjon, og viser samtidig hvordan flere historiske transportsystemer er lagt oppå det samme knutepunktet.',
            article: [
              'Majorstuen ble et kollektivt knutepunkt før det ble et tett bymessig sentrum. Den elektriske sporveien nådde området i 1894, og Holmenkollbanen åpnet Majorstuen stasjon i 1898. Dermed møttes lokal gatebevegelse og en ny forstadsbane i samme område. Dagens kryss kan derfor leses som et sted der ulike transportnett ikke bare passerer, men må bytte skala: fra bane til gate, fra holdeplass til fortau og fra gjennomgående reise til lokal handel og opphold.',
              'Selve Majorstukrysset ligger der Valkyriegata møter Kirkeveien, tett på Majorstuen stasjon og Majorstuhuset. Kirkeveien utviklet seg fra eldre vei til en bred trafikkåre, mens Valkyriegata leder inn mot handelsgatene og kollektivknutepunktet. Når flere retninger møtes i ett signalregulert rom, oppstår kryssfriksjon: trafikanter må vente, prioriteter skifter mellom faser, og en kort geometrisk avstand kan kreve en lengre sikker ganglinje via ordinære gangfelt.',
              'Majorstuhuset, oppført i etapper 1928–1932, viser hvordan transport og handel ble bygd sammen. Den opprinnelige vestibylen var samtidig gjennomgang, venterom og billettkontor, mens butikker og kontorer lå rundt publikumsstrømmen. Bygningen kan derfor studeres som et grensesnitt mellom mobilitet og næring. I felt kan innganger, fasader og forbindelser mot fortauet registreres; den historiske funksjonsblandingen må derimot dokumenteres med kilder.',
              'Undergrunnsbanen mellom Majorstuen og Nationaltheatret åpnet i 1928 og la enda et mobilitetslag under gateplanet. Arbeidene hadde tidligere gitt den dramatiske rasulykken ved Valkyrie plass i 1912, og stasjonen som senere lå der ble tatt ut av bruk i 1985. Disse hendelsene er viktige for å forstå området, men de er ikke direkte avlesbare fra dagens kryss. Majorstukrysset illustrerer derfor forskjellen mellom synlig infrastruktur og historiske systemer som bare kan rekonstrueres gjennom dokumentasjon.',
              'Gangstrømmer gjennom Majorstukrysset kan analyseres uten å gjøre feltarbeidet risikofylt. Fra et ordinært, trygt fortau kan man registrere hvilke gangfelt som brukes, hvor mennesker venter, hvordan signalfasene fordeler bevegelser og hvilke innganger eller holdeplasser som trekker strømmer. En snarvei er ikke nødvendigvis den korteste rette linjen; i et komplekst kryss kan den praktisk raskeste eller tryggeste ruten følge signaler, fortau og oppmerkede krysningspunkter.',
              'Et avgrenset feltbesøk kan derfor kombinere kartlegging av signaler, ventearealer, holdeplasser, innganger og observerbare ganglinjer. Observatøren skal bli på ordinære fortau og bare bruke vanlige gangfelt på grønt signal; oppgaven krever aldri rask gange, løping eller posisjonering i kjørebanen. Slike observasjoner kan dokumentere fysisk organisering og midlertidig friksjon, men de kan ikke alene fastslå årsak til kø, langsiktig trafikkmengde, ulykkesrisiko eller historiske hendelser. Slike påstander krever tellinger, sikkerhetsdata og kilder.'
            ],
            subject_ids: ['by'],
            emne_ids: [
              'em_by_flaskehalser_kryss_friksjon',
              'em_by_gangstrommer_snarveier'
            ],
            chapter_ids: [
              'arbeid-naering-handel-logistikk',
              'byliv-offentlige-rom'
            ],
            lenses: [
              {
                id: 'majorstuen-signalfriksjon',
                title: 'Signalstyrt kryssfriksjon',
                prompt: 'Hvordan fordeler signalfasene venting og bevegelse mellom de ulike retningene gjennom Majorstukrysset?',
                subject_id: 'by',
                emne_id: 'em_by_flaskehalser_kryss_friksjon',
                evidence: 'Observer fra et trygt fortau hvilke bevegelser som får grønt samtidig, hvor køer oppstår og hvordan venting flytter seg mellom signalfasene.'
              },
              {
                id: 'majorstuen-trygge-ganglinjer',
                title: 'Trygge ganglinjer og omveier',
                prompt: 'Når blir den tryggeste ganglinjen gjennom krysset en omvei sammenlignet med den geometrisk korteste linjen?',
                subject_id: 'by',
                emne_id: 'em_by_gangstrommer_snarveier',
                evidence: 'Velg to mål som holdeplass, stasjonsinngang eller butikk og tegn bare lovlige ruter via fortau og ordinære gangfelt uten å gå utenfor dem.'
              },
              {
                id: 'majorstuen-transport-handel-grensesnitt',
                title: 'Transport møter handel',
                prompt: 'Hvordan påvirker Majorstuhusets innganger og publikumsfunksjoner gangstrømmene rundt kollektivknutepunktet?',
                subject_id: 'by',
                emne_id: 'em_by_gangstrommer_snarveier',
                evidence: 'Registrer innganger, fasader, ventepunkter og forbindelser mot holdeplasser, og bruk kildene til å skille dagens rombruk fra den historiske vestibylfunksjonen.'
              },
              {
                id: 'majorstuen-lag-pa-lag',
                title: 'Mobilitetslag over og under gaten',
                prompt: 'Hva kan dagens kryss fortelle om at trikk, forstadsbane og undergrunnsbane ble lagt til området i ulike perioder?',
                subject_id: 'by',
                emne_id: 'em_by_flaskehalser_kryss_friksjon',
                evidence: 'Koble synlige holdeplasser, stasjonsinnganger og gateforløp til den dokumenterte tidslinjen for 1894, 1898 og 1928 uten å anta at alle historiske lag fortsatt er synlige.'
              },
              {
                id: 'majorstuen-feltgrense',
                title: 'Hva feltet ikke kan bevise',
                prompt: 'Hvilke påstander om trafikkpress, sikkerhet og historiske hendelser kan ikke avgjøres ved én observasjon fra fortauet?',
                subject_id: 'by',
                emne_id: 'em_by_flaskehalser_kryss_friksjon',
                evidence: 'Skill mellom det som faktisk observeres i et tidsvindu og påstander som krever trafikkdata, ulykkesstatistikk eller historiske kilder.'
              }
            ],
            guiding_questions: [
              'Hvor i krysset oppstår mest venting når ulike trafikkformer skal passere samme overgangsrom?',
              'Hvordan påvirker signaler og gangfelt den praktiske ganglinjen mellom holdeplasser, stasjon og handel?',
              'Hva forteller Majorstuhuset om koblingen mellom kollektivtransport, venting og handel?',
              'Hvilke transportlag fra 1894, 1898 og 1928 er synlige i dag, og hvilke må rekonstrueres fra kilder?',
              'Hvilke konklusjoner om trafikkmengde og sikkerhet krever andre data enn en kort feltobservasjon?'
            ],
            concepts: [
              'knutepunkt',
              'kryssfriksjon',
              'flaskehals',
              'gangstrøm',
              'snarvei',
              'signalregulering',
              'ventepunkt',
              'overgang',
              'transportlag',
              'feltobservasjon'
            ],
            observable_traces: [
              {
                title: 'Signal og venting fra trygt fortau',
                observation: 'Stå på et ordinært fortau og registrer hvilke signalretninger som åpnes, hvor folk venter og hvordan strømmer starter og stopper.',
                interpretation_boundary: 'Et kort tidsvindu viser situasjonen da, men dokumenterer ikke stabil trafikkmengde, årsak til kø eller ulykkesrisiko.',
                source_urls: [sources[1][1], sources[2][1]]
              },
              {
                title: 'Ganglinjer mellom kollektivmål',
                observation: 'Tegn en lovlig ganglinje mellom to holdeplasser, stasjonsinnganger eller andre mål ved bare å følge fortau og ordinære gangfelt.',
                interpretation_boundary: 'Ruten viser fysisk organisering og mulig omvei, men ikke hvor raskt eller trygt alle brukere opplever forbindelsen.',
                source_urls: [sources[3][1], sources[4][1]]
              },
              {
                title: 'Majorstuhuset som overgangskant',
                observation: 'Registrer innganger og fasadekanter der Majorstuhuset møter fortau og kollektivstrømmer rundt krysset.',
                interpretation_boundary: 'Dagens innganger kan observeres, men tidligere billettsalg, venteareal og funksjonsblanding må dokumenteres historisk.',
                source_urls: [sources[0][1], sources[3][1]]
              },
              {
                title: 'Synlige og skjulte transportlag',
                observation: 'Finn trikkespor, holdeplasser og stasjonsinnganger og noter hvilke transportsystemer som er synlige fra gateplanet.',
                interpretation_boundary: 'Feltet kan ikke alene bevise åpningsår, undergrunnsarbeider eller Valkyrie-raset; slike forhold krever historiske kilder.',
                source_urls: [sources[3][1], sources[4][1]]
              }
            ],
            source_urls: sources.map((row) => row[1]),
            verified_at: '2026-09-01'
          };

          fs.writeFileSync(placePath, JSON.stringify(place, null, 2) + '\n');

          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          registry.placeLinks ||= {};
          registry.placeLinks.majorstuen_krysset = {
            sourceFile: 'places/by/oslo/places/majorstuen_krysset.json',
            field: 'fagverk',
            schema: 'history_go_place_fagverk_v2',
            level: 'full',
            status: 'curated'
          };
          fs.writeFileSync(registryPath, JSON.stringify(registry, null, 2) + '\n');

          if (staleImage) {
            const backlog = JSON.parse(fs.readFileSync(backlogPath, 'utf8'));
            backlog.generatedAt = '2026-09-01';
            backlog.generatedFromCommit = 'majorstuen_krysset_fagverk_v2_20260901';
            backlog.summary.validRemote += 1;
            backlog.summary.invalidLocalPath -= 1;
            backlog.summary.remaining -= 1;
            backlog.byCategory.by.valid += 1;
            backlog.byCategory.by.invalid -= 1;
            fs.writeFileSync(backlogPath, JSON.stringify(backlog, null, 2) + '\n');
          }
          NODE
      - name: Regenerate canonical and Fagverk state
        run: |
          npm run places:index:build
          node scripts/build-place-open-payloads.mjs
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate generated canonical state
        run: |
          npm run places:index:check
          node scripts/build-place-open-payloads.mjs --check
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Validate Fagverk contracts
        run: |
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/fagverk-place-rendering.test.mjs
          node --test tests/fagverk-place-substance-audit.test.mjs
          node --test tests/fagverk-link-audit.test.mjs
      - name: Validate Majorstukrysset remote image
        env:
          PLACE_IMAGE_REMOTE_FETCH_TIMEOUT_MS: '45000'
        run: node scripts/audit-place-images.mjs --mode=changed --require-any-place-image --require-remote-image
      - name: Build and verify full place image backlog
        run: node scripts/audit-place-images.mjs --mode=all --report=/tmp/place-image-audit.json --verify-summary=data/places/place_image_backlog_summary.json
      - name: Validate generated web runtime
        run: npm run build:web:check
      - name: Validate diff whitespace
        run: git diff --check
      - name: Commit clean production result
        run: |
          git add \
            data/places/by/oslo/places/majorstuen_krysset.json \
            data/places/places_index.json \
            data/places/place_image_backlog_summary.json \
            data/runtime/place-open/majorstuen_krysset.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/fagverk-place-page-coverage-v2.json
          git rm .github/workflows/finalize-majorstuen-krysset-fagverk-v2.yml
          git diff --cached --quiet && { echo "No production changes to commit"; exit 1; }
          git commit -m "Curate Majorstukrysset Fagverk v2"
          git push origin HEAD:${GITHUB_REF_NAME}
