name: Regenerate shared indices (one-time)

on:
  push:
    branches:
      - production/sync-shared-epoch-people-indices-20261018
    paths:
      - .github/workflows/sync-shared-indices-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate epoch and Civication people indices
        run: |
          npm run epoker:places:build
          npm run civication:history-people:build
      - name: Commit only the two generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/epoker/epoke-place-index.json data/Civication/historyPeople_index.json
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate shared epoch and Civication people indices'
            git push origin HEAD:production/sync-shared-epoch-people-indices-20261018
          fi
