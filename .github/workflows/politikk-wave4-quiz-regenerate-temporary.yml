name: Politikk Wave4 Quiz Context Regenerate Temporary
on:
  push:
    branches:
      - fagverk/political-science-canonical-enrichment-wave4-20261021
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fagverk/political-science-canonical-enrichment-wave4-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build canonical quiz production contexts
        run: |
          for file in data/quiz/production_context/politikk/*.json; do
            target="$(basename "$file" .json)"
            node scripts/build-quiz-production-context.mjs --category politikk --target "$target" --output "$file"
          done
      - name: Rebuild release manifest
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Commit derived Politikk contexts on wave4 branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz/production_context/politikk data/fagverk/fagverk_release.json
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh Politikk quiz production contexts for method changes"
            git push origin HEAD:fagverk/political-science-canonical-enrichment-wave4-20261021
          fi
