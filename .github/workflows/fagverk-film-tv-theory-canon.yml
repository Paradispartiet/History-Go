name: Fagverk Film og TV theory canon

on:
  pull_request:
    paths:
      - 'data/fag/TV_og_Film/**'
      - 'data/fagverk/film_tv/**'
      - 'scripts/audit-fagverk-film-tv-theory-canon.mjs'
      - 'scripts/audit-film-tv-source-authority-quality-v1.mjs'
      - 'tests/fagverk-film-tv-theory-canon.test.mjs'
      - 'tests/film-tv-source-authority-quality-v1.test.mjs'
      - '.github/workflows/fagverk-film-tv-theory-canon.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  theory-canon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Film TV theory canon and source authority
        run: |
          node --check scripts/audit-fagverk-film-tv-theory-canon.mjs
          node scripts/audit-fagverk-film-tv-theory-canon.mjs
          node --test tests/fagverk-film-tv-theory-canon.test.mjs
          node scripts/audit-film-tv-source-authority-quality-v1.mjs
          node --test tests/film-tv-source-authority-quality-v1.test.mjs
