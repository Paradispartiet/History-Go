name: Temporary Civication Markdown hygiene validation
on:
  push:
    branches:
      - fix/civication-lost-in-translation-whitespace-20261110
    paths:
      - .github/workflows/civication-doc-hygiene-20261110-temp.yml
permissions:
  contents: read
jobs:
  verify-exact-document-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject whitespace and confirm six markdown-only separator changes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor '830eee234f0bcc6e30823b814bf0b8178fb9cd19' HEAD
          git diff --check '830eee234f0bcc6e30823b814bf0b8178fb9cd19' HEAD
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import cp from 'node:child_process';
          const path='docs/CIVICATION_LOST_IN_TRANSLATION_KILDEPRODUKSJON_V1.md';
          const before=cp.execFileSync('git',['show','830eee234f0bcc6e30823b814bf0b8178fb9cd19:'+path],{encoding:'utf8'});
          const after=fs.readFileSync(path,'utf8');
          const oldLines=before.split('\n'),newLines=after.split('\n');
          assert.equal(oldLines.filter(x=>x.endsWith('  ')).length,6);
          assert.equal(newLines.filter(x=>x.endsWith('  ')).length,0);
          assert.deepEqual(oldLines.map(x=>x.trimEnd()).filter(Boolean),newLines.filter(Boolean),'Every non-empty source line must be exact');
          assert.equal(newLines.length,oldLines.length+6,'Each hard-break must become a single blank separator');
          const changed=cp.execFileSync('git',['diff','--name-only','830eee234f0bcc6e30823b814bf0b8178fb9cd19','HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          assert.deepEqual(changed.sort(),['.github/workflows/civication-doc-hygiene-20261110-temp.yml',path].sort());
          console.log('PASS six whitespace-only separators; original source text intact; git diff --check clean');
          NODE
