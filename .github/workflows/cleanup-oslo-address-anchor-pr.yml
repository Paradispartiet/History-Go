name: Cleanup Oslo address anchor repair artifacts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-oslo-address-anchors-torggata-storgata-v2
          fetch-depth: 0

      - name: Remove temporary and redundant artifacts
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup-oslo-address-anchor-pr.yml
          rm -f .github/workflows/oslo-address-anchor-visual-qa.yml
          rm -f reports/oslo-address-anchor-repair-20260719/coordinate-command-status.json
          rm -f reports/oslo-address-anchor-repair-20260719/coordinates/storgata.json
          rm -f reports/oslo-address-anchor-repair-20260719/coordinates/torggata.json
          rm -f reports/oslo-address-anchor-repair-20260719/coordinates/torggata_blad.json
          rm -f reports/oslo-address-anchor-repair-20260719/coordinates/hausmanns_gate_19_raw.json
          rm -f reports/oslo-address-anchor-repair-20260719/torggata-blad-early-pdfs/torggatablad_nr01_07_web.txt
          rm -f reports/oslo-address-anchor-repair-20260719/torggata-blad-early-pdfs/torggatablad_nr01_08_web.txt
          rm -f reports/oslo-address-anchor-repair-20260719/torggata-blad-early-pdfs/torggatablad_nr02_07_web.txt
          rm -f reports/oslo-address-anchor-repair-20260719/torggata-blad-early-pdfs/torggatablad_nr02_08_web.txt
          rm -f reports/oslo-address-anchor-repair-20260719/torggata-blad-early-pdfs/torggatablad_nr03_08_web.txt

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean Oslo address anchor repair artifacts"
          git push origin HEAD
