name: TMP merge main into Nature completion

on:
  push:
    branches:
      - feature/fagverk-natur-editorial-complete
    paths:
      - '.github/workflows/tmp-merge-main-natur.yml'

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fagverk-natur-editorial-complete
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Merge current main and materialize deterministic reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            allowed=$'data/fagverk/fagverk_registry.json\ndata/fagverk/subject_status.json\nreports/fagverk/README.md\nreports/fagverk/general-engine-audit.json\nreports/fagverk/subject-baseline.json'
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              if ! grep -Fxq "$file" <<< "$allowed"; then
                echo "Unexpected merge conflict: $file" >&2
                exit 1
              fi
              git checkout --ours -- "$file"
              git add "$file"
            done <<< "$conflicts"
          fi
          node scripts/audit-fagverk-subject-inventory.mjs --write-report
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/audit-fagverk-natur-pilot.mjs --write-report --no-check-report
          rm .github/workflows/tmp-merge-main-natur.yml
          git add -A
          git commit -m 'Merge current main into Nature completion branch'
          git push origin HEAD:feature/fagverk-natur-editorial-complete
