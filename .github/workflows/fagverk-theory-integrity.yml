name: Fagverk theory integrity audit

on:
  pull_request:
    paths:
      - 'data/fag/*/**'
      - 'data/fagverk/*/**'
      - 'docs/FAGVERK.md'
      - 'docs/SUBJECT_FILE_CONTRACT.md'
      - 'reports/fagverk/fagverk-theory-integrity-audit.json'
      - 'reports/fagverk/by-theory-integrity-audit.json'
      - 'reports/fagverk/kunst-complete-audit.json'
      - 'reports/fagverk/kunst-theory-integrity-audit.json'
      - 'reports/fagverk/kunst-legacy-theory-audit.json'
      - 'reports/fagverk/media-complete-audit.json'
      - 'reports/fagverk/media-theory-integrity-audit.json'
      - 'reports/fagverk/media-legacy-theory-audit.json'
      - 'reports/fagverk/musikk-subject-audit.json'
      - 'reports/fagverk/musikk-theory-integrity-audit.json'
      - 'reports/fagverk/musikk-legacy-theory-audit.json'
      - 'reports/fagverk/litteratur-theory-integrity-audit.json'
      - 'reports/fagverk/litteratur-legacy-theory-audit.json'
      - 'reports/fagverk/natur-theory-integrity-audit.json'
      - 'reports/fagverk/helse-theory-integrity-audit.json'
      - 'reports/fagverk/helse-strict-completion-v1-audit.json'
      - 'reports/fagverk/naeringsliv-theory-integrity-audit.json'
      - 'reports/fagverk/psykologi-theory-integrity-audit.json'
      - 'reports/fagverk/sport-theory-integrity-audit.json'
      - 'reports/fagverk/vitenskap-theory-integrity-audit.json'
      - 'reports/fagverk/politikk-theory-integrity-audit.json'
      - 'reports/fagverk/filosofi-theory-integrity-audit.json'
      - 'reports/fagverk/teknologi-theory-integrity-audit.json'
      - 'reports/historie-theory-evidence/**'
      - 'scripts/audit-fagverk-theory-integrity.mjs'
      - 'scripts/audit-fagverk-theory-quality.mjs'
      - 'scripts/audit-fagverk-film-tv-theory-canon.mjs'
      - 'scripts/audit-fagverk-religion-theory-canon.mjs'
      - 'scripts/audit-fagverk-scenekunst-theory-canon.mjs'
      - 'scripts/audit-fagverk-kunst-complete.mjs'
      - 'scripts/audit-fagverk-kunst-legacy-theory.mjs'
      - 'scripts/audit-fagverk-kunst-legacy-adjudication.mjs'
      - 'scripts/materialize-kunst-gatekunst-legacy-gap-v1.mjs'
      - 'scripts/audit-fagverk-media-complete.mjs'
      - 'scripts/audit-fagverk-media-legacy-theory.mjs'
      - 'scripts/audit-fagverk-media-legacy-adjudication.mjs'
      - 'scripts/audit-fagverk-musikk.mjs'
      - 'scripts/audit-fagverk-musikk-legacy-theory.mjs'
      - 'scripts/audit-fagverk-litteratur-legacy-theory.mjs'
      - 'scripts/audit-fagverk-litteratur-legacy-adjudication.mjs'
      - 'scripts/audit-subkultur-theory-attribution-v1.mjs'
      - 'tools/audit-historie-theory-integrity.mjs'
      - 'tools/audit-by-theory-integrity.mjs'
      - 'tools/audit-kunst-theory-integrity.mjs'
      - 'tools/audit-media-theory-integrity.mjs'
      - 'tools/audit-musikk-theory-integrity.mjs'
      - 'tools/audit-litteratur-theory-integrity.mjs'
      - 'tools/audit-natur-theory-integrity.mjs'
      - 'tools/audit-helse-theory-integrity.mjs'
      - 'tools/audit-naeringsliv-theory-integrity.mjs'
      - 'tools/audit-psykologi-theory-integrity.mjs'
      - 'tools/audit-sport-theory-integrity.mjs'
      - 'tools/audit-vitenskap-theory-integrity.mjs'
      - 'tools/audit-politikk-theory-integrity.mjs'
      - 'tools/audit-filosofi-theory-integrity.mjs'
      - 'tools/audit-teknologi-theory-integrity.mjs'
      - 'tests/by-theory-integrity.test.mjs'
      - 'tests/kunst-theory-integrity.test.mjs'
      - 'tests/fagverk-kunst-legacy-theory-audit.test.mjs'
      - 'tests/fagverk-kunst-gatekunst-legacy-gap-v1.test.mjs'
      - 'tests/fagverk-kunst-legacy-theory-adjudication.test.mjs'
      - 'tests/media-theory-integrity.test.mjs'
      - 'tests/fagverk-media-legacy-theory-audit.test.mjs'
      - 'tests/fagverk-media-legacy-theory-adjudication.test.mjs'
      - 'tests/musikk-theory-integrity.test.mjs'
      - 'tests/fagverk-musikk-legacy-theory-audit.test.mjs'
      - 'tests/litteratur-theory-integrity.test.mjs'
      - 'tests/fagverk-litteratur-legacy-theory-audit.test.mjs'
      - 'tests/fagverk-litteratur-legacy-theory-adjudication.test.mjs'
      - 'tests/natur-theory-integrity.test.mjs'
      - 'tests/helse-theory-integrity.test.mjs'
      - 'tests/naeringsliv-theory-integrity.test.mjs'
      - 'tests/psykologi-theory-integrity.test.mjs'
      - 'tests/sport-theory-integrity.test.mjs'
      - 'tests/vitenskap-theory-integrity.test.mjs'
      - 'tests/politikk-theory-integrity.test.mjs'
      - 'tests/filosofi-theory-integrity.test.mjs'
      - 'tests/teknologi-theory-integrity.test.mjs'
      - 'tests/fagverk-documentation-contract.test.mjs'
      - 'tests/fagverk-theory-integrity.test.mjs'
      - '.github/workflows/fagverk-theory-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify strict cross-Fagverk theory integrity audit
        run: |
          node --check scripts/audit-fagverk-theory-integrity.mjs
          node --check scripts/audit-fagverk-kunst-legacy-theory.mjs
          node --check scripts/audit-fagverk-kunst-legacy-adjudication.mjs
          node --check scripts/materialize-kunst-gatekunst-legacy-gap-v1.mjs
          node --check scripts/audit-fagverk-litteratur-legacy-theory.mjs
          node --check scripts/audit-fagverk-litteratur-legacy-adjudication.mjs
          node --check scripts/audit-fagverk-media-legacy-theory.mjs
          node --check scripts/audit-fagverk-media-legacy-adjudication.mjs
          node --check scripts/audit-fagverk-musikk-legacy-theory.mjs
          node --check tools/audit-by-theory-integrity.mjs
          node --check tools/audit-kunst-theory-integrity.mjs
          node --check tools/audit-media-theory-integrity.mjs
          node --check tools/audit-musikk-theory-integrity.mjs
          node --check tools/audit-litteratur-theory-integrity.mjs
          node --check tools/audit-natur-theory-integrity.mjs
          node --check tools/audit-helse-theory-integrity.mjs
          node --check tools/audit-naeringsliv-theory-integrity.mjs
          node --check tools/audit-psykologi-theory-integrity.mjs
          node --check tools/audit-sport-theory-integrity.mjs
          node --check tools/audit-vitenskap-theory-integrity.mjs
          node --check tools/audit-politikk-theory-integrity.mjs
          node --check tools/audit-filosofi-theory-integrity.mjs
          node --check tools/audit-teknologi-theory-integrity.mjs
          node scripts/audit-fagverk-theory-integrity.mjs
          node scripts/audit-fagverk-media-legacy-theory.mjs --no-check-report
          node scripts/audit-fagverk-media-legacy-adjudication.mjs
          node scripts/audit-fagverk-musikk-legacy-theory.mjs --no-check-report
          node --test tests/by-theory-integrity.test.mjs
          node --test tests/kunst-theory-integrity.test.mjs
          node --test tests/fagverk-kunst-legacy-theory-audit.test.mjs
          node --test tests/fagverk-kunst-gatekunst-legacy-gap-v1.test.mjs
          node --test tests/fagverk-kunst-legacy-theory-adjudication.test.mjs
          node --test tests/media-theory-integrity.test.mjs
          node --test tests/fagverk-media-legacy-theory-audit.test.mjs
          node --test tests/fagverk-media-legacy-theory-adjudication.test.mjs
          node --test tests/musikk-theory-integrity.test.mjs
          node --test tests/fagverk-musikk-legacy-theory-audit.test.mjs
          node --test tests/litteratur-theory-integrity.test.mjs
          node --test tests/fagverk-litteratur-legacy-theory-audit.test.mjs
          node --test tests/fagverk-litteratur-legacy-theory-adjudication.test.mjs
          node --test tests/natur-theory-integrity.test.mjs
          node --test tests/helse-theory-integrity.test.mjs
          node --test tests/naeringsliv-theory-integrity.test.mjs
          node --test tests/psykologi-theory-integrity.test.mjs
          node --test tests/sport-theory-integrity.test.mjs
          node --test tests/vitenskap-theory-integrity.test.mjs
          node --test tests/politikk-theory-integrity.test.mjs
          node --test tests/filosofi-theory-integrity.test.mjs
          node --test tests/teknologi-theory-integrity.test.mjs
          node --test tests/fagverk-theory-integrity.test.mjs
          node --test tests/fagverk-documentation-contract.test.mjs
