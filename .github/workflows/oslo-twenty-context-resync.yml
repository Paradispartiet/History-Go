name: Oslo twenty — one-shot quiz context resync
on:
  push:
    branches: [content/oslo-twenty-photo-publication-20261019]
    paths:
      - .github/workflows/oslo-twenty-context-resync.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh four generated context artifacts only
        run: |
          node scripts/build-quiz-production-context.mjs --category by --target grev_wedels_plass --output data/quiz/production_context/by/grev_wedels_plass.json
          node scripts/build-quiz-production-context.mjs --category historie --target sagene_skole --output data/quiz/production_context/historie/sagene_skole.json
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target havnelageret --output data/quiz/production_context/naeringsliv/havnelageret.json
          node scripts/build-quiz-production-context.mjs --category subkultur --target hausmania --output data/quiz/production_context/subkultur/hausmania.json
      - name: Verify deterministic quiz-context audit
        run: npm run audit:quiz-production-context
      - name: Commit repaired generated context and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/quiz/production_context/by/grev_wedels_plass.json data/quiz/production_context/historie/sagene_skole.json
          git add data/quiz/production_context/naeringsliv/havnelageret.json data/quiz/production_context/subkultur/hausmania.json
          git rm .github/workflows/oslo-twenty-context-resync.yml
          git commit -m 'data: synchronize four generated quiz contexts to canonical Place media'
          git push origin HEAD:content/oslo-twenty-photo-publication-20261019
