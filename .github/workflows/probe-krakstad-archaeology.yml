name: Probe Kråkstad archaeological anchors

on:
  pull_request:
    paths:
      - '.github/workflows/probe-krakstad-archaeology.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: agent/akershus-krakstad-kirke-gravhaug-production
          fetch-depth: 0

      - name: Fetch and persist nearby OSM archaeology
        shell: bash
        run: |
          set -euo pipefail
          out=reports/akershus-coordinate-krakstad-source-probe
          mkdir -p "$out"

          bbox='10.868,59.670,10.894,59.683'
          echo "bbox=${bbox}" | tee "$out/osm-map-request.txt"
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 3 --retry-all-errors \
            "https://api.openstreetmap.org/api/0.6/map?bbox=${bbox}" \
            | tee "$out/osm-krakstad-map.xml" > /dev/null

          python - <<'PY' 2>&1 | tee "$out/osm-krakstad-archaeology-summary.txt"
          import json
          import math
          import xml.etree.ElementTree as ET
          from pathlib import Path

          church = (59.67658, 10.88091)
          path = Path('reports/akershus-coordinate-krakstad-source-probe/osm-krakstad-map.xml')
          root = ET.fromstring(path.read_text(encoding='utf-8'))

          def distance_m(a, b):
              r = 6371000
              p1 = math.radians(a[0]); p2 = math.radians(b[0])
              dp = math.radians(b[0] - a[0]); dl = math.radians(b[1] - a[1])
              x = math.sin(dp/2)**2 + math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*r*math.atan2(math.sqrt(x), math.sqrt(1-x))

          nodes = {}
          node_tags = {}
          for node in root.findall('node'):
              node_id = int(node.attrib['id'])
              nodes[node_id] = (float(node.attrib['lat']), float(node.attrib['lon']))
              node_tags[node_id] = {tag.attrib['k']: tag.attrib['v'] for tag in node.findall('tag')}

          def relevant(tags):
              return (
                  tags.get('historic') in {'archaeological_site', 'tomb'}
                  or 'archaeological_site' in tags
                  or 'tomb' in tags
                  or tags.get('site_type') in {'tumulus', 'burial_mound', 'barrow'}
              )

          rows = []
          for node_id, point in nodes.items():
              tags = node_tags[node_id]
              if relevant(tags):
                  rows.append({
                      'type': 'node',
                      'id': node_id,
                      'lat': point[0],
                      'lon': point[1],
                      'distance_from_church_m': round(distance_m(church, point), 1),
                      'tags': tags,
                  })

          for way in root.findall('way'):
              tags = {tag.attrib['k']: tag.attrib['v'] for tag in way.findall('tag')}
              if not relevant(tags):
                  continue
              points = [nodes.get(int(nd.attrib['ref'])) for nd in way.findall('nd')]
              points = [point for point in points if point is not None]
              if not points:
                  continue
              point = (
                  sum(item[0] for item in points) / len(points),
                  sum(item[1] for item in points) / len(points),
              )
              rows.append({
                  'type': 'way',
                  'id': int(way.attrib['id']),
                  'lat': point[0],
                  'lon': point[1],
                  'distance_from_church_m': round(distance_m(church, point), 1),
                  'tags': tags,
              })

          rows.sort(key=lambda row: row['distance_from_church_m'])
          print(f'total_elements={len(rows)}')
          for row in rows:
              print(json.dumps(row, ensure_ascii=False, sort_keys=True))
          if not rows:
              raise SystemExit('No nearby archaeological objects returned from OSM map data')
          PY

      - name: Remove probe workflow and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/probe-krakstad-archaeology.yml
          git add reports/akershus-coordinate-krakstad-source-probe
          git commit -m 'Materialize Kråkstad archaeological source probe'
          git push origin HEAD:agent/akershus-krakstad-kirke-gravhaug-production
