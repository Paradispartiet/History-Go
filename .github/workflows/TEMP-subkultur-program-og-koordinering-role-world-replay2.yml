name: TEMP Subkultur Program og koordinering Role World replay2

on:
  push:
    branches:
      - agent/civication-subkultur-program-og-koordinering-role-world-replay2-20260904

permissions:
  contents: write

jobs:
  replay:
    if: ${{ !contains(github.event.head_commit.message, '[replayed2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate career gameplay matrix on latest main
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Regenerate Role World readiness on latest main
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Focused Program og koordinering Role World gate
        run: node tests/civication-subkultur-program-og-koordinering-role-world-rollout.test.js
      - name: Prerequisite compatibility
        run: node tests/civication-subkultur-program-og-koordinering-prerequisites.test.js
      - name: Subkultur career compatibility
        run: node tests/civication-subkultur-career-architecture.test.js
      - name: Career gameplay parity
        run: node scripts/audit-civication-career-gameplay.mjs --check
      - name: Role World readiness parity
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --check
      - name: Compiled scene registry parity
        run: node scripts/build-civication-scene-registry.mjs --check
      - name: Full Civication
        run: npm run test:civication
      - name: Repository diff gate
        run: git diff --check
      - name: Publish latest-main generated state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/TEMP-subkultur-program-og-koordinering-role-world-replay2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/Civication/careerGameplayMatrix.json \
            data/Civication/roleWorldRolloutReadiness.json \
            reports/civication-career-gameplay-matrix.md \
            reports/civication-role-world-rollout-readiness.md \
            .github/workflows/TEMP-subkultur-program-og-koordinering-role-world-replay2.yml
          git diff --cached --check
          git commit -m "Regenerate Subkultur Program og koordinering Role World on latest main [replayed2]"
          git push origin HEAD:${GITHUB_REF_NAME}
