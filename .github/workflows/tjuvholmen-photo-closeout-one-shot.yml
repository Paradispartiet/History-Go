name: Tjuvholmen one-shot Civication people projection regeneration
on:
  pull_request:
    paths:
      - '.github/workflows/tjuvholmen-photo-closeout-one-shot.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tjuvholmen-history-people-one-shot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync-civication-history-people:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/tjuvholmen-editorial-closeout-20261112
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build and check canonical Civication People projection
        run: |
          npm run civication:history-people:build
          npm run civication:history-people:check
      - name: Commit only generated Civication index to Tjuvholmen PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/historyPeople_index.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "build(tjuvholmen): synchronize Civication People index after sourced People updates"
            git reset --hard HEAD
            git clean -fd
            git fetch origin content/tjuvholmen-editorial-closeout-20261112
            git rebase origin/content/tjuvholmen-editorial-closeout-20261112
            git push origin HEAD:content/tjuvholmen-editorial-closeout-20261112
          fi
