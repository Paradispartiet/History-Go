name: Tjuvholmen real PlaceCard photo and runtime closeout
on:
  pull_request:
    paths:
      - 'data/places/by/oslo/places/tjuvholmen.json'
      - 'data/people/by/oslo/people_by_oslo.json'
      - 'data/people/filantroper/oslo/people_filantroper_oslo.json'
      - 'tests/tjuvholmen-place-photo-native-browser.mjs'
      - '.github/workflows/tjuvholmen-photo-closeout-one-shot.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tjuvholmen-closeout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/tjuvholmen-editorial-closeout-20261112
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build real place-open payload and index
        run: |
          npm run place-open:build
          npm run places:index:build
          npm run place-open:check
          npm run places:index:check
          node scripts/check-distinct-place-photos.mjs --place data/places/by/oslo/places/tjuvholmen.json --require-both
      - name: Real Tjuvholmen mobile/desktop open, photo and QuizCard test
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then echo "::error::Chrome missing"; exit 1; fi
          CHROME_BIN="$CHROME_BIN" node tests/tjuvholmen-place-photo-native-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tjuvholmen-real-photo-browser
          path: .tmp/tjuvholmen-photo-browser
          if-no-files-found: ignore
      - name: Commit generated payload and index for Tjuvholmen
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u data/runtime/place-open data/places/places_index.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "build(tjuvholmen): synchronize canonical media, People and By badge projections"
            git fetch origin content/tjuvholmen-editorial-closeout-20261112
            git rebase origin/content/tjuvholmen-editorial-closeout-20261112
            git push origin HEAD:content/tjuvholmen-editorial-closeout-20261112
          fi
