name: Fagverk By Boligpolitikk phase 4
on:
  pull_request:
    paths:
      - 'data/fagverk/by/boligpolitikk-pris-leie-eie-tilgang.json'
      - 'data/fagverk/by/boligpolitikk-pris-leie-eie-tilgang/**'
      - 'data/fagverk/fagverk_registry.json'
      - 'data/fagverk/subject_status.json'
      - 'data/fagverk/fagverk_release.json'
      - 'scripts/audit-fagverk-by-*.mjs'
      - 'tests/fagverk-by-*.test.mjs'
      - 'reports/fagverk/by-*-audit.json'
      - '.github/workflows/fagverk-by-boligpolitikk-pris-leie-eie-tilgang-phase4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/audit-fagverk-by-boligpolitikk-pris-leie-eie-tilgang-phase4.mjs
      - run: node --test tests/fagverk-by-*.test.mjs tests/fagverk-general-engine.test.mjs
      - run: node scripts/build-fagverk-release-manifest.mjs --check
