name: Materialize Vinderen Fagverk indexes

on:
  push:
    branches:
      - place/vinderen-fagverk-v2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: place/vinderen-fagverk-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize canonical indexes
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const path = 'data/fagverk/fagverk_registry.json';
          const registry = JSON.parse(fs.readFileSync(path, 'utf8'));
          registry.placeLinks.vinderen = {
            sourceFile: 'places/by/oslo/places/vinderen.json',
            field: 'fagverk',
            schema: 'history_go_place_fagverk_v2',
            level: 'full',
            status: 'curated'
          };
          fs.writeFileSync(path, `${JSON.stringify(registry, null, 2)}\n`);
          EOF
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
      - name: Commit permanent artifacts and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk/fagverk_registry.json data/fagverk/fagverk_release.json reports/fagverk/fagverk-place-page-coverage-v2.json
          git rm .github/workflows/vinderen-fagverk-materialize.yml
          git commit -m "chore: materialize Vinderen Fagverk indexes"
          git push origin HEAD:place/vinderen-fagverk-v2
