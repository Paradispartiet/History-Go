name: Temporary Minneparken semantic main integration rehearsal
on:
  push:
    branches:
      - content/minneparken-kildebasert-leksikon-20261103
    paths:
      - .github/workflows/minneparken-main-integration-preview-temp.yml
permissions:
  contents: read
jobs:
  validate-only:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/minneparken-kildebasert-leksikon-20261103
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rehearse merge with exact conflict guard and semantic source union
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/minneparken-integration-preview
          git config user.name 'History-Go QA only'
          git config user.email 'qa-merge-readonly@users.noreply.github.com'
          git fetch --no-tags origin main
          git rev-parse HEAD > artifacts/minneparken-integration-preview/pr-head.txt
          git rev-parse origin/main > artifacts/minneparken-integration-preview/main-head.txt
          set +e
          git merge --no-ff --no-commit origin/main > artifacts/minneparken-integration-preview/merge-stdout.txt 2>&1
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exactly six human-audited conflicts; got merge exit $code" >&2
            cat artifacts/minneparken-integration-preview/merge-stdout.txt
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import cp from 'node:child_process';
          const command=(...args)=>cp.execFileSync('git',args,{encoding:'utf8',maxBuffer:20*1024*1024});
          const expected=[
            'data/epoker/epoke-place-index.json',
            'data/fagverk/fagverk_registry.json',
            'data/fagverk/fagverk_release.json',
            'data/leksikon/sprak/manifest.json',
            'data/places/places_index.json',
            'data/runtime/nature-all/flora-001.json'
          ];
          const conflicts=command('diff','--name-only','--diff-filter=U').trim().split('\n').filter(Boolean);
          assert.deepEqual([...conflicts].sort(),[...expected].sort(),'Main changed: new or missing conflicts require new review');
          const load=(stage,p)=>JSON.parse(command('show',':'+stage+':'+p));
          const assertUnion=(p,key,required)=>{
            const ours=load(2,p),theirs=load(3,p);
            assert.ok(ours[key]&&theirs[key]);
            for(const k of Object.keys(theirs)){
              if(k!==key)assert.deepEqual(ours[k],theirs[k],p+': divergent shared top-level '+k);
            }
            const merged={...theirs,[key]:{...theirs[key]}};
            for(const [id,row] of Object.entries(ours[key])){
              if(Object.hasOwn(merged[key],id))assert.deepEqual(merged[key][id],row,p+': differing shared entry '+id);
              else merged[key][id]=row;
            }
            for(const id of required)assert.ok(merged[key][id],p+': missing '+id);
            fs.writeFileSync(p,JSON.stringify(merged,null,2)+'\n');
            return {file:p,section:key,ours:Object.keys(ours[key]).length,main:Object.keys(theirs[key]).length,union:Object.keys(merged[key]).length,required};
          };
          const union=[
            assertUnion('data/fagverk/fagverk_registry.json','placeLinks',['oslo_prosjektrom','fotogalleriet','minneparken_gamlebyen']),
            assertUnion('data/leksikon/sprak/manifest.json','place_files',['toyenbadet','minneparken_gamlebyen'])
          ];
          const flora='data/runtime/nature-all/flora-001.json';
          assert.ok(!command('show',':2:'+flora).includes('minneparken_gamlebyen'),'Unexpected branch-specific Minneparken flora dependency');
          assert.ok(!command('show',':3:'+flora).includes('minneparken_gamlebyen'),'Unexpected main Minneparken flora dependency');
          const generatable=['data/epoker/epoke-place-index.json','data/fagverk/fagverk_release.json','data/places/places_index.json'];
          for(const file of [...generatable,flora])command('checkout','--theirs','--',file);
          const all=[...expected];
          command('add','--',...all);
          assert.equal(command('diff','--name-only','--diff-filter=U').trim(),'','No unresolved merge markers allowed');
          const report={schema:'minneparken_semantic_main_preview_v1',branch_head:command('rev-parse','HEAD').trim(),main_head:command('rev-parse','origin/main').trim(),status:'semantic_conflicts_resolved_locally_pending_official_rebuild',merge_conflict_count:conflicts.length,semantic_unions:union,rebuilt_from_sources:generatable,flora_resolution:'latest_main_without_minneparken_dependency',scope:'read_only_qa_no_commit_no_push'};
          fs.writeFileSync('artifacts/minneparken-integration-preview/report.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          NODE
      - run: npm ci --no-audit --no-fund
      - name: Rebuild canonical places index and verify strict sync
        run: |
          npm run places:index:build
          npm run places:index:check
      - name: Rebuild official epoch index and check generated parity
        run: |
          npm run epoker:places:build
          npm run epoker:places:check
          node --test tests/epoke-place-index.test.mjs
      - name: Rebuild official Fagverk release with all three place links
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Preserve strict Minneparken source, photo, quiz and Story gates
        run: |
          node --test tests/minneparken-historical-photo-provenance.test.mjs tests/minneparken-quiz-source-parity.test.mjs tests/minneparken-story-candidate.test.mjs
          npm run check:stories
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const h=read('data/places/historie-production/minneparken_gamlebyen.json');
          assert.equal(h.status,'blocked');
          for(const gate of ['F','G','H'])assert.equal(h.gates[gate].status,'N/A');
          const reg=read('data/fagverk/fagverk_registry.json');
          for(const id of ['oslo_prosjektrom','fotogalleriet','minneparken_gamlebyen'])assert.ok(reg.placeLinks[id]);
          const lang=read('data/leksikon/sprak/manifest.json');
          for(const id of ['toyenbadet','minneparken_gamlebyen'])assert.ok(lang.place_files[id]);
          const quiz=read('data/quiz/manifest.json');
          assert.equal(quiz.sets.some(x=>x.targetId==='minneparken_gamlebyen'),false);
          const card=read('data/quizcards/historie/manifest.json');
          assert.equal(card.collections.includes('minneparken_gamlebyen_quizcard_v1.json'),false);
          console.log('PASS main+Minneparken semantic source union and fail-closed gate F/G/H');
          NODE
      - name: Install Chromium for integrated UI regression tests
        run: npx playwright install --with-deps chromium
      - name: Real browser regression after merging latest main (still no push)
        shell: bash
        run: |
          set -euo pipefail
          node tests/minneparken-readonly-app-browser.test.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const id='minneparken_gamlebyen';
          const qPath='data/quiz/manifest.json',cPath='data/quizcards/historie/manifest.json';
          const file='data/quiz/historie/'+id+'_sets.json',card=id+'_quizcard_v1.json';
          const quiz=JSON.parse(fs.readFileSync(qPath,'utf8'));
          const cards=JSON.parse(fs.readFileSync(cPath,'utf8'));
          assert.ok(!(quiz.files||[]).includes(file));
          assert.ok(!(quiz.sets||[]).some(s=>s.targetId===id));
          assert.ok(!cards.collections.includes(card));
          quiz.sets.push({targetId:id,file});
          cards.collections.push(card);
          fs.writeFileSync(qPath,JSON.stringify(quiz,null,2)+'\n');
          fs.writeFileSync(cPath,JSON.stringify(cards,null,2)+'\n');
          console.log('Quizzes activated in throwaway merge rehearsal only');
          NODE
          node scripts/verify-minneparken-quizcard-real-browser.mjs
          node scripts/verify-place-quiz-browser.mjs minneparken_gamlebyen
          echo 'PASS merged real app: fullquiz 21/21, QuizCard 10/10, dated photo and Fagverk'
      - name: Record generated diff and merged preview; still no commit or push
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/minneparken-integration-preview
          git diff --name-only HEAD > artifacts/minneparken-integration-preview/changed-paths.txt
          git diff --stat HEAD > artifacts/minneparken-integration-preview/diff-stat.txt
          git status --short > artifacts/minneparken-integration-preview/status.txt
          echo 'Read-only merge preview; no commit or push.'
      - name: Upload detailed semantic merge preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minneparken-semantic-main-preview
          path: artifacts/minneparken-integration-preview/
          retention-days: 30
