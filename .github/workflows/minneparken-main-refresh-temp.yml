name: Temporary Minneparken pinned-main integration and real-browser QA
on:
  push:
    branches:
      - content/minneparken-kildebasert-leksikon-20261103
    paths:
      - .github/workflows/minneparken-main-refresh-temp.yml
permissions:
  contents: write
jobs:
  verify-merge-to-draft-only:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/minneparken-kildebasert-leksikon-20261103
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pin reviewed main snapshot and verify scope before staged merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'fe1fdbbc285fb526094ed5ee64be25369208b40b'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          git cat-file -e '6fd1c924c47be05bceade02fa7f0c7ffe84b98aa^{commit}'
          merge_base="$(git merge-base HEAD '6fd1c924c47be05bceade02fa7f0c7ffe84b98aa')"
          test "$merge_base" = '7216f94604372da130590e1406047bb33626d8fd'
          git diff --name-only "$merge_base" '6fd1c924c47be05bceade02fa7f0c7ffe84b98aa' > /tmp/minneparken-reviewed-main-paths.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const paths=fs.readFileSync('/tmp/minneparken-reviewed-main-paths.txt','utf8').trim().split('\n').filter(Boolean);
          const expected=new Set([".github/workflows/nature-illustrations.yml","bilder/merker/by/locales/en/funksjonalisme.webp","bilder/merker/by/locales/es/funksjonalisme.webp","bilder/merker/by/locales/fr/funksjonalisme.webp","bilder/merker/by/locales/pt/funksjonalisme.webp","bilder/merker/by/undermerker/funksjonalisme-brodert-v1.webp","bilder/natur/flora/illustrasjonskandidater/b09/43_timian_v1.webp","data/badges/badge_locale_images_candidates.json","data/badges/by.json","data/badges/underbadge_batch01_production.json","data/natur/flora/illustration-quality-timian-20261103.json","docs/badge-locale-previews/by-1.jpg","finn-flora.html","js/ui/nature-flora-approved.js","scripts/generate-badge-locales-v1.py","scripts/test-flora-approved-browser.mjs","scripts/test-flora-approved-release.mjs","scripts/test-flora-timian-b09.mjs","tests/badge-by-funksjonalisme-v1-locales.test.mjs","tests/badge-by-funksjonalisme-v1-production.test.mjs","tests/badge-by-klassisk-arkitektur-v2-production.test.mjs","tests/badge-by-modernisme-v1-production.test.mjs","tests/badge-underbadge-batch01.test.mjs"]);
          assert.equal(paths.length,expected.size,'Main change count changed after review');
          const unknown=paths.filter(p=>!expected.has(p));
          if(unknown.length)throw Error('Unreviewed main paths: '+unknown.join(', '));
          console.log('PASS pinned main source paths:',paths.length);
          NODE
          git merge --no-ff --no-commit '6fd1c924c47be05bceade02fa7f0c7ffe84b98aa' || {
            echo 'Main merge conflict; no push permitted' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          }
          test -f .git/MERGE_HEAD
          test -z "$(git diff --name-only --diff-filter=U)"
          echo 'PASS clean non-committed merge of pinned main snapshot'
      - name: Deterministic generator, Knowledge, Story and fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run places:index:check
          npm run epoker:places:check
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run place-open:build
          npm run place-open:check
          npm run knowledge:canonical:check
          npm run check:stories
          node --test tests/minneparken-quiz-source-parity.test.mjs tests/minneparken-knowledge-registry.test.mjs tests/minneparken-story-candidate.test.mjs tests/minneparken-historical-photo-provenance.test.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const id='minneparken_gamlebyen';
          const h=read('data/places/historie-production/'+id+'.json');
          assert.equal(h.status,'blocked');
          for(const g of ['F','G','H'])assert.equal(h.gates[g].status,'N/A');
          assert.ok(!read('data/quiz/manifest.json').sets.some(x=>x.targetId===id));
          assert.ok(!read('data/quizcards/historie/manifest.json').collections.includes(id+'_quizcard_v1.json'));
          assert.ok(!read('data/stories/stories_manifest.json').files.some(x=>x.path==='data/stories/stories_'+id+'.json'));
          console.log('PASS unpublished source candidates and open F/G/H gates');
          NODE
      - name: Real Minneparken mobile and desktop integration
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          node tests/minneparken-readonly-app-browser.test.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const qp='data/quiz/manifest.json', cp='data/quizcards/historie/manifest.json';
          const q=r(qp),c=r(cp);
          q.sets.push({targetId:'minneparken_gamlebyen',file:'data/quiz/historie/minneparken_gamlebyen_sets.json'});
          c.collections.push('minneparken_gamlebyen_quizcard_v1.json');
          fs.writeFileSync(qp,JSON.stringify(q,null,2)+'\n');
          fs.writeFileSync(cp,JSON.stringify(c,null,2)+'\n');
          console.log('Temporary quiz and QuizCard registration only in CI worktree');
          NODE
          node scripts/verify-minneparken-quizcard-real-browser.mjs
          node scripts/verify-place-quiz-browser.mjs minneparken_gamlebyen
          git restore --worktree -- data/quiz/manifest.json data/quizcards/historie/manifest.json
      - name: Final narrow output scope and draft-only merge commit
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import cp from 'node:child_process';
          const changed=cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed=new Set(['data/fagverk/fagverk_release.json','data/runtime/place-open/minneparken_gamlebyen.json']);
          console.log('Generator changes relative to staged merge:',JSON.stringify(changed));
          if(!changed.includes('data/fagverk/fagverk_release.json'))throw Error('Expected Fagverk release refresh missing');
          const unexpected=changed.filter(p=>!allowed.has(p));
          if(unexpected.length)throw Error('Unexpected generator changes: '+unexpected.join(', '));
          NODE
          git add -- data/fagverk/fagverk_release.json data/runtime/place-open/minneparken_gamlebyen.json
          git diff --quiet
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Merge reviewed main snapshot into Minneparken draft after full QA'
          git push origin HEAD:content/minneparken-kildebasert-leksikon-20261103
          echo 'PASS draft-only main snapshot merge, tests, browser and unchanged F/G/H gates'
