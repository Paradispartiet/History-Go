name: Oslo coordinate batch 27 queue audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-coordinate-batch-27-queue-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/oslo-coordinate-batch-27-queue-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build active Oslo secondary queue audit
        run: |
          mkdir -p reports/oslo-coordinate-batch-27-queue-audit
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = process.cwd();
          const protocol = fs.readFileSync('docs/coordinates/coordinate-control-protocol.md', 'utf8');
          const evidenceManifest = JSON.parse(fs.readFileSync('data/coordinate-evidence/manifest.json', 'utf8'));
          const placeIndex = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));

          const controlled = new Set();
          for (const match of protocol.matchAll(/`([^`]+)`/g)) {
            const token = match[1];
            if (/^[a-z0-9_æøå-]+$/i.test(token) && !token.includes(':') && !token.includes('/')) controlled.add(token);
          }
          for (const rel of evidenceManifest.files ?? []) {
            if (!rel.startsWith('oslo/')) continue;
            controlled.add(path.basename(rel, '.json'));
          }

          const activeIds = new Set();
          const indexRows = Array.isArray(placeIndex) ? placeIndex : (placeIndex.places ?? []);
          for (const row of indexRows) if (row?.id) activeIds.add(row.id);

          function walk(dir) {
            const out = [];
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, ent.name);
              if (ent.isDirectory()) out.push(...walk(full));
              else if (ent.isFile() && ent.name.endsWith('manifest.json')) out.push(full);
            }
            return out;
          }

          const manifests = [];
          for (const file of walk('data/places').sort()) {
            const rel = file.replaceAll('\\', '/');
            if (!rel.includes('/oslo/')) continue;
            let data;
            try { data = JSON.parse(fs.readFileSync(file, 'utf8')); } catch { continue; }
            if (!Array.isArray(data?.places)) continue;
            const rows = data.places
              .filter((row) => row?.id && activeIds.has(row.id))
              .sort((a, b) => (a.order ?? 1e9) - (b.order ?? 1e9));
            const uncontrolled = rows.filter((row) => !controlled.has(row.id));
            manifests.push({
              manifest: rel,
              totalActive: rows.length,
              controlled: rows.length - uncontrolled.length,
              uncontrolledCount: uncontrolled.length,
              uncontrolled: uncontrolled.map((row) => ({ id: row.id, name: row.name ?? '', order: row.order ?? null }))
            });
          }

          const nonEmpty = manifests.filter((m) => m.uncontrolledCount > 0);
          const allCandidates = nonEmpty.flatMap((m) => m.uncontrolled.map((row) => ({ manifest: m.manifest, ...row })));
          const duplicateCandidates = [];
          const seen = new Map();
          for (const item of allCandidates) {
            if (seen.has(item.id)) duplicateCandidates.push({ id: item.id, manifests: [seen.get(item.id), item.manifest] });
            else seen.set(item.id, item.manifest);
          }

          const report = {
            generatedAt: new Date().toISOString(),
            rule: 'Active Oslo split manifests are discovered recursively. Within each manifest original order is preserved. This report does not choose the next queue automatically; it exposes every active uncontrolled queue so the next source can be selected explicitly.',
            controlledIdCount: controlled.size,
            activePlaceCount: activeIds.size,
            manifestCount: manifests.length,
            manifestsWithUncontrolled: nonEmpty.length,
            manifests,
            duplicateCandidates
          };
          fs.writeFileSync('reports/oslo-coordinate-batch-27-queue-audit/queue-audit.json', JSON.stringify(report, null, 2) + '\n');

          const lines = ['# Oslo coordinate batch 27 – secondary queue audit', '', `Generated: ${report.generatedAt}`, '', 'No place data is changed by this audit.', '', '## Active Oslo manifests with uncontrolled places', ''];
          for (const m of nonEmpty) {
            lines.push(`### ${m.manifest}`);
            lines.push(`- active: ${m.totalActive}`);
            lines.push(`- already controlled: ${m.controlled}`);
            lines.push(`- uncontrolled: ${m.uncontrolledCount}`);
            lines.push('');
            for (const row of m.uncontrolled.slice(0, 30)) lines.push(`- ${row.order ?? '-'} — \`${row.id}\` — ${row.name}`);
            if (m.uncontrolled.length > 30) lines.push(`- … ${m.uncontrolled.length - 30} more`);
            lines.push('');
          }
          if (nonEmpty.length === 0) lines.push('No uncontrolled active Oslo split-manifest records found.');
          fs.writeFileSync('reports/oslo-coordinate-batch-27-queue-audit/queue-audit.md', lines.join('\n') + '\n');

          console.log(JSON.stringify({
            manifestsWithUncontrolled: nonEmpty.length,
            firstNonEmptyManifest: nonEmpty[0]?.manifest ?? null,
            firstCandidates: nonEmpty[0]?.uncontrolled.slice(0, 10) ?? []
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch-27-queue-audit
          path: reports/oslo-coordinate-batch-27-queue-audit
          if-no-files-found: error
