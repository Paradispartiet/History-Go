name: Fagverk Psykologi route regenerate probe

on:
  pull_request:
    paths:
      - 'data/fag/psykologi/**'
      - 'data/fagverk/fagverk_portal.json'
      - 'scripts/audit-fagverk-psykologi-*.mjs'
      - 'tests/fagverk-psykologi-*.test.mjs'
      - 'tests/psykologi-theory-integrity.test.mjs'
      - 'reports/fagverk/psykologi-phase3-audit.json'
      - 'reports/fagverk/general-engine-audit.json'
      - '_tmp-psykologi-test-failure.txt'
      - '.github/workflows/_tmp-fagverk-psykologi-test-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-and-clean:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Normalize shared portal projection
        run: |
          node tools/materialize-subkultur-runtime-v1.mjs --write
          node tools/materialize-subkultur-runtime-v1.mjs --check
      - name: Regenerate route-sensitive reports
        run: |
          node scripts/audit-fagverk-psykologi-phase3.mjs --write-report
          node scripts/audit-fagverk-psykologi-phase3.mjs
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/audit-fagverk-general-engine.mjs
      - name: Verify Psykologi stub equivalence
        run: node scripts/audit-fagverk-psykologi-legacy-stub.mjs
      - name: Verify badge equivalence
        run: node scripts/audit-fagverk-badge-equivalence.mjs
      - name: Verify release manifest
        run: node scripts/build-fagverk-release-manifest.mjs --check
      - name: Run existing Psykologi contract tests
        run: |
          tests=(
            tests/fagverk-subject-inventory.test.mjs
            tests/fagverk-general-engine.test.mjs
            tests/fagverk-psykologi-phase3.test.mjs
            tests/fagverk-psykologi-psykisk-helse-phase4.test.mjs
            tests/fagverk-psykologi-fagtradisjoner-teori-phase4.test.mjs
            tests/fagverk-psykologi-utvikling-oppvekst-laring-phase4.test.mjs
            tests/fagverk-psykologi-kognisjon-folelser-atferd-phase4.test.mjs
            tests/fagverk-psykologi-sosialpsykologi-normalitet-stigma-phase4.test.mjs
            tests/fagverk-psykologi-traume-krise-resiliens-omsorg-phase4.test.mjs
            tests/fagverk-psykologi-complete.test.mjs
            tests/psykologi-theory-integrity.test.mjs
            tests/fagverk-psykologi-biological-university.test.mjs
            tests/fagverk-psykologi-cognitive-university.test.mjs
            tests/fagverk-psykologi-developmental-university.test.mjs
            tests/fagverk-psykologi-social-university.test.mjs
            tests/fagverk-psykologi-personality-university.test.mjs
            tests/fagverk-psykologi-history-science-theory-university.test.mjs
            tests/fagverk-psykologi-topic-articles-mental-health-v1.test.mjs
            tests/fagverk-psykologi-university-completion-v1.test.mjs
            tests/fagverk-psykologi-editorial-quality-v2.test.mjs
            tests/fagverk-psykologi-metadata-monotonic.test.mjs
            tests/fagverk-psykologi-university-readiness.test.mjs
            tests/fagverk-release-manifest.test.mjs
            tests/fagverk-psykologi-legacy-stub-retirement.test.mjs
            tests/fagverk-badge-equivalence.test.mjs
          )
          for test_file in "${tests[@]}"; do
            echo "=== $test_file ==="
            node --test "$test_file"
          done
      - name: Commit generated projections and remove probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f _tmp-psykologi-test-failure.txt
          rm .github/workflows/_tmp-fagverk-psykologi-test-diagnostic.yml
          git add data/fagverk/fagverk_portal.json reports/fagverk/psykologi-phase3-audit.json reports/fagverk/general-engine-audit.json .github/workflows/_tmp-fagverk-psykologi-test-diagnostic.yml
          git add -u -- _tmp-psykologi-test-failure.txt || true
          git diff --cached --quiet && exit 0
          git commit -m 'Regenerate Psykologi route audits'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
