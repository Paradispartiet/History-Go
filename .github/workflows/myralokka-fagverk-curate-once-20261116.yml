name: Myralokka Fagverk canonical curate (one-time PR)
on:
  pull_request:
    paths:
      - ".github/workflows/myralokka-fagverk-curate-once-20261116.yml"
permissions:
  contents: write
jobs:
  canonical-curate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 7342
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synchronize exact Myralokka registry status
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const place = JSON.parse(fs.readFileSync('data/places/natur/oslo/places_oslo_natur_akerselvarute/myralokka.json'));
          assert.equal(place.fagverk.status, 'curated');
          assert.equal(place.fagverk.level, 'standard');
          const file = 'data/fagverk/fagverk_registry.json';
          const raw = fs.readFileSync(file, 'utf8');
          const at = raw.indexOf('"myralokka": {', raw.indexOf('"placeLinks"'));
          assert.ok(at > 0, 'Cannot locate canonical myralokka registry entry');
          const before = raw.slice(0, at), tail = raw.slice(at);
          const updated = tail.replace(/("status"\s*:\s*")in_production(")/, '$1curated$2');
          assert.notEqual(tail, updated, 'Registry draft status not found');
          fs.writeFileSync(file, before + updated);
          NODE
      - name: Regenerate and validate canonical outputs
        run: |
          npm run place-open:build
          node scripts/build-fagverk-release-manifest.mjs
          npm run place-open:check
          node scripts/build-fagverk-release-manifest.mjs --check
          node scripts/audit-fagverk-place-pages.mjs
          node --test tests/myralokka-placecard-collections-v2.test.mjs
      - name: Limit scope, commit and self-clean
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          changes="$(git diff --name-only)"
          printf 'Generated files:\n%s\n' "$changes"
          unexpected="$(printf '%s\n' "$changes" | grep -vE '^(data/fagverk/fagverk_registry\.json|data/fagverk/fagverk_release\.json|data/runtime/place-open/myralokka\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes: $unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk/fagverk_registry.json data/fagverk/fagverk_release.json data/runtime/place-open/myralokka.json
          git rm .github/workflows/myralokka-fagverk-curate-once-20261116.yml
          git commit -m "chore(myralokka): sync curated Fagverk registry runtime and release"
          git push origin "HEAD:refs/heads/$HEAD_REF"
