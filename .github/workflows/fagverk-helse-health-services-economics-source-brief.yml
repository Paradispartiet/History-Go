name: Fagverk Helse health services economics source brief
on:
  pull_request:
    paths:
      - 'data/fag/helse/health_services_economics_source_claim_brief_v1.json'
      - 'data/fag/fag_manifest.json'
      - 'data/fagverk/helse/**'
      - 'data/fagverk/fagverk_registry.json'
      - 'data/fagverk/fagverk_release.json'
      - 'data/fagverk/subject_inventory.json'
      - 'data/fagverk/subject_status.json'
      - 'reports/fagverk/helse-health-services-economics-source-brief-v1-audit.json'
      - 'reports/fagverk/general-engine-audit.json'
      - 'reports/fagverk/fagverk-theory-quality-audit.json'
      - 'reports/fagverk/fagverk-theory-integrity-audit.json'
      - 'scripts/*helse-health-services-economics*'
      - 'scripts/audit-helse-cumulative-progress-v1.mjs'
      - 'tests/helse-health-services-economics-source-brief-v1.test.mjs'
      - 'tests/helse-cumulative-progress-v1.test.mjs'
      - '.github/workflows/fagverk-helse-health-services-economics-source-brief.yml'
  push:
    branches: [main]
    paths:
      - 'data/fag/helse/health_services_economics_source_claim_brief_v1.json'
      - 'scripts/*helse-health-services-economics*'
      - 'tests/helse-health-services-economics-source-brief-v1.test.mjs'
      - '.github/workflows/fagverk-helse-health-services-economics-source-brief.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - id: source_gate
        shell: bash
        run: |
          count="$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('data/fagverk/fagverk_registry.json','utf8'));process.stdout.write(String(r.subjects.helse.editorialPlan.registeredChapterCount));")"
          if [[ "$count" == "11" && -f scripts/brief-helse-health-services-economics-sources-v1.mjs && -f tests/helse-health-services-economics-source-brief-v1.test.mjs ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Bootstrap/monotone skip: health-services/economics source brief gate is active only at Helse 11/12 with source files present; current count is ${count}/12."
          fi
      - if: steps.source_gate.outputs.ready == 'true'
        run: node scripts/brief-helse-health-services-economics-sources-v1.mjs
      - run: node scripts/audit-helse-cumulative-progress-v1.mjs
      - run: node scripts/audit-fagverk-subject-inventory.mjs
      - run: node scripts/audit-fagverk-general-engine.mjs
      - run: node scripts/audit-fagverk-theory-quality.mjs
      - run: node scripts/audit-fagverk-theory-integrity.mjs
      - run: node scripts/build-fagverk-release-manifest.mjs --check
      - if: steps.source_gate.outputs.ready == 'true'
        run: node --test tests/helse-health-services-economics-source-brief-v1.test.mjs tests/helse-cumulative-progress-v1.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-general-engine.test.mjs tests/fagverk-release-manifest.test.mjs
      - if: steps.source_gate.outputs.ready != 'true'
        run: node --test tests/helse-cumulative-progress-v1.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-general-engine.test.mjs tests/fagverk-release-manifest.test.mjs
