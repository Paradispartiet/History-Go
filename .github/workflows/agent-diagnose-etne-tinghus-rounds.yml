name: Finalize Etne Tinghus rounds

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/fill-etne-tinghus-rounds-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Reuse embedded Tinghus generator
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, re, zlib
          from pathlib import Path
          workflow = Path('.github/workflows/agent-fill-etne-tinghus-rounds.yml').read_text(encoding='utf-8')
          match = re.search(r"b64decode\('''([^']+)'''\)", workflow, re.S)
          if not match:
              raise SystemExit('Embedded Tinghus generator not found')
          exec(zlib.decompress(base64.b64decode(match.group(1))).decode('utf-8'))
          PY
      - name: Canonicalize Geir Arne Havreberg references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('data/relations.json'),
              Path('data/stories/stories_etnesjoen_sport_rounds_batch1.json'),
              Path('data/leksikon/places/vestland/etne/sport/leksikon_etnesjoen_sport_rounds_batch1.json'),
              Path('tests/etnesjoen-dojo-batch1-round-content.test.js'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              text = text.replace('geir_havreberg', 'geir_arne_havreberg')
              text = text.replace(
                  'people/sport/vestland/etne/geir_arne_havreberg.json',
                  'people/sport/vestland/etne/people_sport_etne_batch2.json'
              )
              path.write_text(text, encoding='utf-8')
          PY
      - name: Etne Tinghus dedicated test
        run: node tests/etne-tinghus-batch1-round-content.test.js
      - name: Inherited Etne round tests
        shell: bash
        run: |
          find tests -maxdepth 1 -type f -name '*batch1-round-content.test.js' \
            | grep -E '/(etne|etnesjoen|skanevik|steinsvollen|engebanen|skakkeringen|osnes|sjokanten|fikse)[^/]*batch1-round-content\.test\.js$' \
            | grep -v 'etne-tinghus-batch1-round-content.test.js' \
            | sort \
            | xargs -r -n1 node
      - run: npm run leksikon:ids:check
      - name: People audit
        run: bash scripts/check-people.sh
      - run: npm run typecheck:tools
      - run: npm run typecheck:web
      - name: Story integrity without new Tinghus errors
        shell: bash
        run: |
          set +e
          npx tsx tools/check_stories_integrity.mts > /tmp/story-integrity.log 2>&1
          status=$?
          set -e
          cat /tmp/story-integrity.log
          if grep -E 'etne_tinghus|st_etne_tinghus|stories_etnesjoen_politikk_rounds_batch1' /tmp/story-integrity.log; then
            echo "New Etne Tinghus story-integrity error detected"
            exit 1
          fi
          echo "Story integrity exit status: $status; no Etne Tinghus-specific errors"
      - run: git diff --check
      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/agent-fill-etne-tinghus-rounds.yml
          rm -f .github/workflows/agent-diagnose-etne-tinghus-rounds.yml
          rm -f .github/workflows/agent-trace-etne-tinghus-inherited.yml
          rm -f .github/workflows/agent-record-etne-tinghus-inherited.yml
          rm -f reports/etne-tinghus-inherited-test-diagnostic.txt
      - name: Commit
        shell: bash
        run: |
          git config user.name "History Go data agent"
          git config user.email "history-go-agent@users.noreply.github.com"
          git add -A
          git commit -m "Fill Etne Tinghus place rounds batch 1"
          git push origin HEAD:${{ github.head_ref }}
