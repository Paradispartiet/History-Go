name: Replay Scenekunst national venues batch 3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out replacement branch
        uses: actions/checkout@v4
        with:
          ref: agent/scenekunst-national-venues-03-rebased
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Copy validated production files from original branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/scenekunst-national-venues-03
          files=(
            data/places/scenekunst/buskerud/brageteatret_union_scene.json
            data/places/scenekunst/innlandet/teater_innlandet_hamar_kulturhus.json
            data/places/scenekunst/ostfold/ostfold_teater.json
            data/places/scenekunst/rogaland/haugesund_teater_haut_scene.json
            data/places/scenekunst/trondelag/turneteatret_i_trondelag.json
            reports/scenekunst-national-new-venues-batch-3-2026-07-22.json
            reports/scenekunst-national-new-venues-batch-3-2026-07-22.md
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "origin/agent/scenekunst-national-venues-03:$file" > "$file"
          done

      - name: Register sources in current main manifest
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifestPath = 'data/places/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (!Array.isArray(manifest.files)) throw new Error('Unexpected place manifest shape');
          const additions = [
            'places/scenekunst/buskerud/brageteatret_union_scene.json',
            'places/scenekunst/rogaland/haugesund_teater_haut_scene.json',
            'places/scenekunst/ostfold/ostfold_teater.json',
            'places/scenekunst/trondelag/turneteatret_i_trondelag.json',
            'places/scenekunst/innlandet/teater_innlandet_hamar_kulturhus.json'
          ];
          const seen = new Set(manifest.files);
          for (const file of additions) {
            if (!seen.has(file)) {
              manifest.files.push(file);
              seen.add(file);
            }
          }
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

          const reportPath = 'reports/scenekunst-national-new-venues-batch-3-2026-07-22.json';
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          report.baseCommit = 'current_main_replay';
          report.resyncedFromPullRequest = 3252;
          report.resyncedAt = new Date().toISOString();
          fs.writeFileSync(reportPath, JSON.stringify(report, null, 2) + '\n');
          NODE

      - name: Regenerate place index and validate
        run: |
          npm run build:tools
          npm run places:index:build
          bash scripts/check-places.sh
          npm run audit:categories

      - name: Commit replacement production result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/manifest.json
          git add data/places/places_index.json
          git add data/places/scenekunst/buskerud/brageteatret_union_scene.json
          git add data/places/scenekunst/innlandet/teater_innlandet_hamar_kulturhus.json
          git add data/places/scenekunst/ostfold/ostfold_teater.json
          git add data/places/scenekunst/rogaland/haugesund_teater_haut_scene.json
          git add data/places/scenekunst/trondelag/turneteatret_i_trondelag.json
          git add reports/scenekunst-national-new-venues-batch-3-2026-07-22.json
          git add reports/scenekunst-national-new-venues-batch-3-2026-07-22.md
          git diff --cached --stat
          git diff --cached --quiet && { echo "No production changes produced"; exit 1; }
          git commit -m "Replay third national regional theatre batch on current main"
          git push origin HEAD:agent/scenekunst-national-venues-03-rebased
