name: Temporary finalize and merge PR 2142

on:
  push:
    branches:
      - data/people-bislett-vif-historic-batch1-20260714
    paths:
      - .github/workflows/finalize-and-merge-pr2142.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/people-bislett-vif-historic-batch1-20260714
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync, validate and merge
        shell: bash
        run: |
          set -euo pipefail
          branch='data/people-bislett-vif-historic-batch1-20260714'
          manifest='data/people/manifest.json'
          workflow='.github/workflows/finalize-and-merge-pr2142.yml'

          resolve_manifest() {
            if git ls-files -u -- "$manifest" | grep -q .; then
              git checkout --theirs -- "$manifest"
              python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/people/manifest.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          files = payload['files']
          additions = [
              'people/sport/oslo/bislett_stadion/leif_eriksen.json',
              'people/sport/oslo/bislett_stadion/pal_jacobsen.json',
              'people/sport/oslo/bislett_stadion/vidar_davidsen.json',
              'people/sport/oslo/bislett_stadion/egil_flemming_johansen.json',
              'people/sport/oslo/bislett_stadion/per_edmund_mordt.json',
          ]
          files[:] = [item for item in files if item not in additions]
          anchor = 'people/sport/oslo/people_sport_oslo_bislett_stadion_batch8.json'
          if anchor not in files:
              raise SystemExit('Bislett batch 8 manifest anchor not found')
          files[files.index(anchor) + 1:files.index(anchor) + 1] = additions
          path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
              git add "$manifest"
            fi
          }

          sync_main() {
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              return 0
            fi

            set +e
            git merge --no-commit --no-ff origin/main
            set -e
            resolve_manifest

            if git ls-files -u | grep -q .; then
              echo 'Unresolved conflicts remain:'
              git ls-files -u
              exit 1
            fi
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "Finalize attempt $attempt"
            sync_main

            if [ -f "$workflow" ]; then
              git rm "$workflow"
            fi

            bash scripts/check-people.sh
            if [ -f scripts/check-places.sh ]; then
              bash scripts/check-places.sh
            fi

            git add "$manifest"
            if ! git diff --cached --quiet || [ -f .git/MERGE_HEAD ]; then
              git commit -m 'Finalize Bislett batch against current main'
              git push origin HEAD:"$branch"
            fi

            gh pr ready 2142 --repo Paradispartiet/History-Go || true
            if gh pr merge 2142 --repo Paradispartiet/History-Go --merge; then
              exit 0
            fi

            echo 'Main moved or merge was temporarily blocked; retrying.'
            sleep 2
          done

          echo 'Could not merge PR 2142 after three synchronized attempts.'
          exit 1
