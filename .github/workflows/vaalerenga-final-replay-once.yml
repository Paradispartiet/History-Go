name: TEMP Vålerenga final canonical replay

on:
  push:
    branches:
      - agent/vaalerenga-place-production-replay-20260907

permissions:
  contents: write

jobs:
  replay:
    if: github.event.head_commit.message == 'Retry final Vålerenga canonical replay'
    runs-on: ubuntu-latest
    env:
      LOCKED_MAIN: 814bda617d7a3646d3a2df4f63088d92256090c3
      BRANCH: agent/vaalerenga-place-production-replay-20260907
    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Lock and integrate fresh main
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$LOCKED_MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$LOCKED_MAIN"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore canonical Vålerenga wording under fixed validator
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const placePath = 'data/places/by/oslo/places/vaalerenga.json';
          const packetPath = 'data/places/production/vaalerenga.json';
          const place = JSON.parse(fs.readFileSync(placePath, 'utf8'));
          const packet = JSON.parse(fs.readFileSync(packetPath, 'utf8'));

          const plain = 'mens området lå utenfor Christianias bygrense.';
          const canonical = 'mens området ennå lå utenfor Christianias bygrense.';
          if (place.popupDesc?.includes(canonical)) {
            // Already canonical; keep it byte-for-byte at the semantic value level.
          } else if (place.popupDesc?.includes(plain)) {
            place.popupDesc = place.popupDesc.replace(plain, canonical);
          } else {
            throw new Error('Neither canonical nor temporary Vålerenga popup wording found');
          }

          const claim = packet.claims?.find((entry) => entry.id === 'claim_vaalerenga_text_04');
          if (!claim) throw new Error('claim_vaalerenga_text_04 missing');
          claim.claim = 'Vålerenga vokste fram som forstad langs Strømsveien fra 1830-årene, mens området ennå lå utenfor Christianias bygrense.';

          const popupHash = crypto.createHash('sha256').update(place.popupDesc, 'utf8').digest('hex');
          const expectedPopupHash = '7a3aeb6556b86ef7b8016dfdd157aee9b8cd8f62e2b0d3f71e6371cb3d1a0524';
          if (popupHash !== expectedPopupHash) {
            throw new Error(`Unexpected canonical popupDesc hash: ${popupHash}`);
          }
          packet.textHashes ??= {};
          packet.textHashes.popupDesc = popupHash;

          fs.writeFileSync(placePath, `${JSON.stringify(place, null, 2)}\n`);
          fs.writeFileSync(packetPath, `${JSON.stringify(packet, null, 2)}\n`);
          NODE

      - name: Regenerate derived Place state
        run: |
          npm run places:index:build
          npm run place-open:build

      - name: Re-record current READ-FIRST evidence
        run: |
          node scripts/place-production-rule-preflight.mjs record --workcard reports/place-production/vaalerenga-workcard-current.json --place-id vaalerenga --category by
          node scripts/place-production-rule-preflight.mjs check --base "$LOCKED_MAIN"

      - name: Run exact description and Vålerenga gates
        run: |
          node --check scripts/validate-place-description-production-v4_2.mjs
          node --check scripts/validate-place-description-production-v4_2_policy.mjs
          node --test tests/place-description-production-v4_2.test.mjs
          node --test tests/place-description-length-policy.test.mjs
          node --test tests/place-description-ingress-policy.test.mjs
          node scripts/validate-place-description-production-v4_2_policy.mjs --all
          node --test tests/vaalerenga-completion.test.mjs
          npm run places:index:check
          npm run place-open:check
          npm run test:place-open
          node scripts/place-production-rule-preflight.mjs check --base "$LOCKED_MAIN"

      - name: Commit permanent clean tree
        run: |
          git rm .github/workflows/vaalerenga-final-replay-once.yml
          test ! -e .github/workflows/vaalerenga-governance-repair-once.yml
          test ! -e scripts/vaalerenga-governance-repair-once.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Finalize Vålerenga governance replay'

      - name: Prove place-only PR isolation
        run: |
          node scripts/validate-place-description-production-v4_2_policy.mjs --changed --base "$LOCKED_MAIN" --head "$(git rev-parse HEAD)"
          REPO_HYGIENE_BASE_SHA="$LOCKED_MAIN" REPO_HYGIENE_HEAD_SHA="$(git rev-parse HEAD)" node scripts/audit-repository-hygiene-v1.mjs

      - name: Publish exact clean head
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$LOCKED_MAIN"
          git push origin "HEAD:refs/heads/$BRANCH"
