name: Split Oslo salamander ponds

on:
  push:
    branches:
      - data/split-nature-oslo-salamander-ponds-20260708

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/split-nature-oslo-salamander-ponds-20260708
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/split-nature-oslo-salamander-ponds.mjs
      - run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add data/places/natur/oslo/places_oslo_natur_salamanderdammer data/places/natur/oslo/places_oslo_natur_salamanderdammer_manifest.json data/places/natur/oslo/places_oslo_natur_salamanderdammer_index.json data/places/natur/oslo/places_oslo_natur_salamanderdammer_split_report.txt
          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Generate split Oslo salamander pond place files"
            git push
          fi
