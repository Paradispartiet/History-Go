name: Build Bruteigsteinen quiz PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: bruteigsteinen-quiz-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-quiz:
    if: github.head_ref == 'agent/etne-bruteigsteinen-quiz'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: agent/etne-bruteigsteinen-quiz
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Assemble and register quiz
        run: node .tmp/bootstrap-bruteigsteinen.mjs assemble

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build canonical Knowledge links
        run: npm run knowledge:canonical:write

      - name: Validate Bruteigsteinen quiz contract
        run: node .tmp/bootstrap-bruteigsteinen.mjs validate

      - name: Audit quiz content
        run: npm run audit:quiz-content

      - name: Audit quiz templates
        run: npm run audit:quiz-templates

      - name: Test quiz content audit
        run: npm run test:quiz-content-audit

      - name: Check canonical Knowledge data
        run: npm run knowledge:canonical:check

      - name: Commit final quiz package
        run: |
          rm -rf .tmp
          rm -f .github/workflows/bruteigsteinen-pr-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Bruteigsteinen quiz'
          git push origin HEAD:agent/etne-bruteigsteinen-quiz
