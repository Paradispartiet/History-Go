name: Gråbein Oslo Museum wordmark source (temporary)
on:
  push:
    branches:
      - place/museumsleiligheten-grabein-production-20261009
permissions:
  contents: read
concurrency:
  group: tmp-grabein-brand-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  retrieve-original:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact public-domain original from Wikimedia Commons
        run: |
          curl --fail --silent --show-error --location --retry 2 \
            --user-agent "HistoryGo-ReuseEvidence/1.0 (public media provenance)" \
            "https://upload.wikimedia.org/wikipedia/commons/3/3a/Oslo_Museum_logo.svg" \
            --output /tmp/oslo_museum_logo.svg
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const buffer=fs.readFileSync('/tmp/oslo_museum_logo.svg');
          const txt=buffer.toString('utf8');
          if(buffer.length<3000||buffer.length>100000||!/<svg[ >]/i.test(txt)||!txt.includes('</svg>'))
            throw new Error('Downloaded file not an authentic SVG source');
          const hash=crypto.createHash('sha256').update(buffer).digest('hex');
          const b64=buffer.toString('base64');
          const n=Math.ceil(b64.length/1200);
          console.log('HG_LOGO_SOURCE https://commons.wikimedia.org/wiki/File:Oslo_Museum_logo.svg');
          console.log('HG_LOGO_SHA256 '+hash);
          console.log('HG_LOGO_START '+n);
          for(let i=0;i<n;i++)console.log('HG_LOGO_CHUNK '+i+' '+b64.slice(i*1200,(i+1)*1200));
          console.log('HG_LOGO_END '+n);
          NODE
