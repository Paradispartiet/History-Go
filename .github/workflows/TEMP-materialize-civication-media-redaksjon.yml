name: TEMP materialize Civication media newsroom pilot

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/civication-media-redaksjon-realism-pilot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/build-civication-scene-registry.mjs --write
      - run: node scripts/audit-civication-career-gameplay.mjs --write
      - run: node scripts/build-civication-scene-registry.mjs --check
      - run: node scripts/audit-civication-career-gameplay.mjs --check
      - run: npm run test:civication
      - name: Commit generated artifacts and remove TEMP workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/TEMP-materialize-civication-media-redaksjon.yml
          git add data/Civication/compiledSceneRegistryV1.json data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md
          git commit -m "Materialize journalism Role World pilot artifacts"
          git push
