name: TypeScript Nearby drawer finalize

on:
  pull_request:
    paths:
      - "js/ui/nearbyDrawer.ts"
      - "js/ui/nearby-drawer.js"
      - "js/ui/left-panel.js"
      - "js/app.js"
      - "schemas/app-globals.d.ts"
      - "build/build-web.mjs"
      - ".github/workflows/typescript-nearby-drawer-finalize.yml"

permissions:
  contents: write

jobs:
  finalize-nearby-drawer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wire TypeScript drawer runtime into legacy shell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              source = path.read_text()
              if old not in source:
                  raise SystemExit(f"Expected migration anchor not found in {path_str}: {old[:100]!r}")
              path.write_text(source.replace(old, new, 1))

          replace_once(
              "build/build-web.mjs",
              '  { in: "js/ui/search.ts", out: "search" }\n',
              '  { in: "js/ui/search.ts", out: "search" },\n  { in: "js/ui/nearbyDrawer.ts", out: "nearbyDrawer" }\n'
          )
          replace_once(
              "build/build-web.mjs",
              '  { out: "search", target: "js/ui/search.js" }\n',
              '  { out: "search", target: "js/ui/search.js" },\n  { out: "nearbyDrawer", target: "js/ui/nearby-drawer.js" }\n'
          )

          replace_once(
              "js/app.js",
              '    await safeRun("loadFavorites", () => loadScriptOnce("js/state/favorites.js"));\n\n    await safeRun("loadLeftPanel", () => loadScriptOnce("js/ui/left-panel.js"));',
              '    await safeRun("loadFavorites", () => loadScriptOnce("js/state/favorites.js"));\n\n    await safeRun("loadNearbyDrawer", () => loadScriptOnce("js/ui/nearby-drawer.js"));\n    await safeRun("loadLeftPanel", () => loadScriptOnce("js/ui/left-panel.js"));'
          )

          old_drawer = '''function isNearbyDrawerOpen() {
            const panel = hg$("nearbyListContainer");
            return !!panel && panel.classList.contains("is-drawer-open");
          }

          function setNearbyDrawerOpen(open) {
            const panel = hg$("nearbyListContainer");
            if (!panel) return;

            panel.classList.toggle("is-drawer-open", !!open);
            panel.classList.toggle("is-drawer-closed", !open);

            const toggle = hg$("nearbyExploreToggle");
            if (toggle) toggle.setAttribute("aria-expanded", open ? "true" : "false");

            // Listene kan ha endret seg (posisjon, unlocks) mens draweren var lukket.
            if (open) rerenderActiveLeftPanelMode();
          }

          function openNearbyDrawer() {
            setNearbyDrawerOpen(true);
          }

          function closeNearbyDrawer() {
            setNearbyDrawerOpen(false);
          }

          function toggleNearbyDrawer() {
            setNearbyDrawerOpen(!isNearbyDrawerOpen());
          }'''.replace("          ", "")

          new_drawer = '''function isNearbyDrawerOpen() {
            return !!window.HGNearbyDrawer?.isOpen?.();
          }

          function setNearbyDrawerOpen(open) {
            window.HGNearbyDrawer?.setOpen?.(!!open);
          }

          function openNearbyDrawer() {
            window.HGNearbyDrawer?.open?.();
          }

          function closeNearbyDrawer() {
            window.HGNearbyDrawer?.close?.();
          }

          function toggleNearbyDrawer() {
            window.HGNearbyDrawer?.toggle?.();
          }'''.replace("          ", "")

          replace_once("js/ui/left-panel.js", old_drawer, new_drawer)

          replace_once(
              "schemas/app-globals.d.ts",
              '    HGHeaderMenu?: { open: () => void; close: () => void; toggle: () => void; isOpen: () => boolean };\n',
              '    HGHeaderMenu?: { open: () => void; close: () => void; toggle: () => void; isOpen: () => boolean };\n    HGNearbyDrawer?: {\n      isOpen?: () => boolean;\n      setOpen?: (open: boolean) => void;\n      open?: () => void;\n      close?: () => void;\n      toggle?: () => void;\n    };\n'
          )
          PY
      - name: Verify modern and legacy TypeScript surfaces
        run: |
          npm run typecheck:web
          npm run build:web
          npm run typecheck
      - name: Commit source integration and generated runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            build/build-web.mjs \
            js/app.js \
            js/ui/left-panel.js \
            js/ui/nearbyDrawer.ts \
            js/ui/nearby-drawer.js \
            dist/web/nearbyDrawer.js \
            schemas/app-globals.d.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Wire TypeScript Nearby drawer runtime"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
