name: Validate final Etne category batch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/etne-final-category-batch.yml

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/etne-religion-subculture-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-religion-subculture-final
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify sources and prepare canonical data
        shell: bash
        run: |
          mkdir -p reports/etne-religion-subculture-final/geonorge \
                   reports/etne-religion-subculture-final/osm \
                   reports/etne-religion-subculture-final/validation

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const verifiedAt = '2026-07-23';
          const reportRoot = 'reports/etne-religion-subculture-final';
          const unique = (xs) => [...new Set(xs)];
          const writeJson = (file, value) => {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n');
          };
          const asRecords = (doc) => Array.isArray(doc) ? doc : Array.isArray(doc?.places) ? doc.places : [doc];

          async function verifyAddress(key, file, street, number, postcode) {
            const url = new URL('https://ws.geonorge.no/adresser/v1/sok');
            url.searchParams.set('adressenavn', street);
            url.searchParams.set('nummer', String(number));
            url.searchParams.set('kommunenummer', '4611');
            url.searchParams.set('treffPerSide', '100');
            const response = await fetch(url, { headers: { 'user-agent': 'History-Go-Etne-final/1.0' }, signal: AbortSignal.timeout(15000) });
            if (!response.ok) throw new Error(`${key}: Geonorge HTTP ${response.status}`);
            const payload = await response.json();
            writeJson(`${reportRoot}/geonorge/${key}.json`, { url: url.toString(), response: payload });
            const hits = (payload.adresser || []).filter((hit) =>
              String(hit.adressenavn || '').toLowerCase() === street.toLowerCase() &&
              String(hit.nummer) === String(number) &&
              String(hit.kommunenummer) === '4611' &&
              String(hit.postnummer) === postcode
            );
            if (hits.length !== 1) throw new Error(`${key}: expected one exact Geonorge hit, got ${hits.length}`);
            const hit = hits[0];
            const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
            const place = asRecords(doc)[0];
            const lat = Number(hit.representasjonspunkt?.lat);
            const lon = Number(hit.representasjonspunkt?.lon);
            if (Math.abs(place.lat - lat) > 1e-8 || Math.abs(place.lon - lon) > 1e-8) {
              throw new Error(`${key}: committed coordinates do not match exact Geonorge point`);
            }
          }

          function polygonCentroid(points) {
            const pts = [...points];
            if (pts[0].lat !== pts.at(-1).lat || pts[0].lon !== pts.at(-1).lon) pts.push(pts[0]);
            let area2 = 0, cx = 0, cy = 0;
            for (let i = 0; i < pts.length - 1; i++) {
              const x0 = pts[i].lon, y0 = pts[i].lat, x1 = pts[i + 1].lon, y1 = pts[i + 1].lat;
              const cross = x0 * y1 - x1 * y0;
              area2 += cross;
              cx += (x0 + x1) * cross;
              cy += (y0 + y1) * cross;
            }
            if (Math.abs(area2) < 1e-12) return {
              lat: points.reduce((s, p) => s + p.lat, 0) / points.length,
              lon: points.reduce((s, p) => s + p.lon, 0) / points.length
            };
            return { lat: cy / (3 * area2), lon: cx / (3 * area2) };
          }

          async function verifyFrette() {
            const url = 'https://api.openstreetmap.org/api/0.6/way/557505490/full.json';
            const response = await fetch(url, { headers: { 'user-agent': 'History-Go-Etne-final/1.0' }, signal: AbortSignal.timeout(15000) });
            if (!response.ok) throw new Error(`Frette: OSM HTTP ${response.status}`);
            const payload = await response.json();
            writeJson(`${reportRoot}/osm/frette_kapell.json`, { url, response: payload });
            const elements = payload.elements || [];
            const way = elements.find((e) => e.type === 'way' && e.id === 557505490);
            if (!way) throw new Error('Frette: way missing');
            if (way.tags?.amenity !== 'place_of_worship' || way.tags?.building !== 'chapel' || !String(way.tags?.name || '').toLowerCase().includes('frette')) {
              throw new Error(`Frette: unexpected tags ${JSON.stringify(way.tags || {})}`);
            }
            const nodes = new Map(elements.filter((e) => e.type === 'node').map((e) => [e.id, { lat: Number(e.lat), lon: Number(e.lon) }]));
            const points = (way.nodes || []).map((id) => nodes.get(id)).filter(Boolean);
            if (points.length < 3) throw new Error('Frette: insufficient building geometry');
            const center = polygonCentroid(points);
            const file = 'data/places/religion/vestland/etne/frette_kapell.json';
            const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
            const place = asRecords(doc)[0];
            place.lat = center.lat;
            place.lon = center.lon;
            place.coordSource = 'OpenStreetMap building geometry + Norges Kirker';
            place.coordSourceId = 'osm-way:557505490';
            place.coordSourceUrl = 'https://www.openstreetmap.org/way/557505490';
            place.coordVerifiedAt = verifiedAt;
            place.coordNote = 'Object-first: OSM way 557505490 er henta direkte frå OSM API og verifisert fresh som namngitt place_of_worship med building=chapel. Polygoncentroid frå sjølve bygningsgeometrien brukes som canonical marker og er krysskontrollert mot Norges Kirker.';
            writeJson(file, doc);
          }

          const religionEmners = [
            'em_religion_hellige_rom',
            'em_religion_ritualer_praksis',
            'em_religion_religionshistorie_lokalt',
            'em_religion_kristendom'
          ];

          function addReligionEmners(file) {
            const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const place of asRecords(doc)) place.emne_ids = unique([...(place.emne_ids || []), ...religionEmners]);
            writeJson(file, doc);
          }

          function addSubcultureLayer(file, paragraph) {
            const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
            const place = asRecords(doc)[0];
            place.secondaryBadgeIds = unique([...(place.secondaryBadgeIds || []), 'subkultur']);
            place.tags = unique([...(place.tags || []), 'subkultur', 'skatekultur', 'scene_og_fellesskap']);
            place.emne_ids = unique([...(place.emne_ids || []), 'em_sub_ungdomskultur_identitet', 'em_sub_tilhorighet_miljo', 'em_sub_scene_fellesskap']);
            if (!String(place.popupDesc || '').includes('sekundært Subkultur-lag')) place.popupDesc = `${place.popupDesc} ${paragraph}`;
            place.quiz_profile = place.quiz_profile || {};
            place.quiz_profile.primary_angles = unique([...(place.quiz_profile.primary_angles || []), 'skatekultur', 'scene_og_fellesskap']);
            place.quiz_profile.must_include = unique([...(place.quiz_profile.must_include || []), 'at Sport er hovudkategori og Subkultur eit dokumentert sekundært lag']);
            place.quiz_profile.avoid_angles = unique([...(place.quiz_profile.avoid_angles || []), 'a_kalle_all_bruk_eller_alle_brukarar_subkultur']);
            place.quiz_profile.notes = `${place.quiz_profile.notes ? place.quiz_profile.notes + ' ' : ''}Subkultur-laget gjeld den dokumenterte skate/BMX-praksisen, scena og fellesskapet rundt eigenorganisert bruk; det er ikkje ein påstand om at alle brukarar er marginaliserte.`;
            writeJson(file, doc);
          }

          async function main() {
            const files = [
              'data/places/religion/vestland/etne/etne_kyrkje.json',
              'data/places/religion/vestland/etne/skanevik_kyrkje.json',
              'data/places/religion/vestland/etne/frette_kapell.json'
            ];
            await verifyAddress('etne_kyrkje', files[0], 'Enge', 5, '5590');
            await verifyAddress('skanevik_kyrkje', files[1], 'Prestavegen', 11, '5593');
            await verifyFrette();
            for (const file of files) addReligionEmners(file);

            addSubcultureLayer(
              'data/places/sport/vestland/etne/etne_bmx_og_skatepark.json',
              'I History Go er Sport framleis hovudkategorien fordi dette fysisk er eit BMX- og skateanlegg. Samstundes får staden eit sekundært Subkultur-lag: ei eiga BMX-/skateforeining, eigenorganisert bruk og ungdomskultur dokumenterer eit sjølvstendig miljø rundt arenaen.'
            );
            addSubcultureLayer(
              'data/places/sport/vestland/etne/skanevik_skatepark.json',
              'I History Go er Sport framleis hovudkategorien fordi dette fysisk er eit skateanlegg. Samstundes får parken eit sekundært Subkultur-lag fordi den permanente streetprega parken er bygd spesifikt rundt skating og eigenorganisert skatepraksis.'
            );

            const manifest = JSON.parse(fs.readFileSync('data/places/manifest.json', 'utf8'));
            for (const file of files.map((f) => f.replace(/^data\//, ''))) if (!manifest.files.includes(file)) manifest.files.push(file);
            writeJson('data/places/manifest.json', manifest);

            fs.writeFileSync(`${reportRoot}/README.md`, `# Etne religion og skatekultur\n\nDato: ${verifiedAt}\n\n## Nye Religion-steder\n- Etne kyrkje\n- Skånevik kyrkje\n- Frette kapell\n\n## Subkultur-vurdering\n- Etne BMX- og skatepark: Sport primært, Subkultur sekundært.\n- Skånevik skatepark: Sport primært, Subkultur sekundært.\n- Etne pumptrack: berre Sport.\n\n## Utsett\nSkånevik bedehus er ikkje aktivert fordi den fysiske bedehusbygningen ikkje er sikkert skild frå organisasjons-/kontaktadressa. Ingen markør er gjetta.\n`);
          }
          main().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Rebuild and validate
        shell: bash
        run: |
          set -o pipefail
          npm run places:index:build
          npm run audit:places-split-manifest-sync 2>&1 | tee reports/etne-religion-subculture-final/validation/split-manifest-sync.txt
          npm run places:index:check 2>&1 | tee reports/etne-religion-subculture-final/validation/places-index-check.txt
          npm run places:emner:check 2>&1 | tee reports/etne-religion-subculture-final/validation/emne-check.txt
          npm run places:coords:intake 2>&1 | tee reports/etne-religion-subculture-final/validation/coordinate-intake.txt
          set +e
          npm run health:places 2>&1 | tee reports/etne-religion-subculture-final/validation/health-places.txt
          set -e
          git checkout origin/main -- reports/place-coordinate-intake-gate.md 2>/dev/null || true

      - name: Commit final clean result
        shell: bash
        run: |
          rm .github/workflows/etne-final-category-batch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Etne religion places and skate culture layers"
          git push origin HEAD:agent/etne-religion-subculture-final
