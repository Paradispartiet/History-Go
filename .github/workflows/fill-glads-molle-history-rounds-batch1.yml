name: Fill Glads mølle history rounds batch 1

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  produce:
    if: github.head_ref == 'agent/fill-glads-molle-history-rounds-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Produce Glads mølle content
        run: |
          base64 -d tools/tmp/produce_glads_molle.py.gz.b64 | gzip -d > /tmp/produce_glads_molle.py
          python3 -m py_compile /tmp/produce_glads_molle.py
          python3 /tmp/produce_glads_molle.py

      - name: Validate targeted content
        run: |
          node tests/glads-molle-history-rounds-batch1.test.js
          node tests/place-card-rounds-runtime-audit.test.js
          node tests/place-card-leksikon-content-audit.test.js
          node tests/bjoelsenfossen-history-rounds-batch1.test.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = [
              'data/places/natur/oslo/places_oslo_natur_akerselvarute/glads_molle.json',
              'data/quiz/historie/glads_molle_sets.json',
              'data/people/natur/oslo/people_natur_oslo.json',
              'data/people/naeringsliv/oslo/people_naeringsliv_oslo.json',
              'data/stories/stories_glads_molle.json',
              'data/stories/stories_manifest_natur_batch_01.json',
              'data/leksikon/places/oslo/historie/leksikon_oslo_historie_batch2.json',
              'data/places/natur/oslo/places_oslo_natur_akerselvarute_index.json',
              'data/places/natur/oslo/places_oslo_natur_akerselvarute_manifest.json',
          ]
          for file in files:
              json.loads(Path(file).read_text(encoding='utf-8'))
          print('Glads mølle JSON OK')
          PY
          git diff --check

      - name: Commit production files and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/tmp/produce_glads_molle.py.gz.b64
          rm -f .github/workflows/fill-glads-molle-history-rounds-batch1.yml
          git add -A
          git commit -m "Fill Glads mølle history rounds batch 1"
          git push origin HEAD:${{ github.head_ref }}
