name: TEMP Materialize Psykologi Psykolog Role World

on:
  push:
    branches:
      - agent/civication-psykologi-psykolog-role-world-rollout
    paths:
      - scripts/TEMP_materialize_psykologi_psykolog_role_world.mjs
      - tests/civication-psykologi-psykolog-role-world-rollout.test.js
      - reports/CIVICATION_PSYKOLOGI_PSYKOLOG_ROLE_WORLD_ROLLOUT_SOURCE_FIRST.md
      - .github/workflows/TEMP-civication-psykologi-psykolog-role-world-materialize.yml

concurrency:
  group: civication-psykologi-psykolog-role-world-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-psykologi-psykolog-role-world-rollout
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize Psykologi Psykolog Role World
        run: node scripts/TEMP_materialize_psykologi_psykolog_role_world.mjs
      - name: Regenerate scene registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Regenerate career gameplay audit
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Regenerate rollout readiness
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify focused Psykolog and canonical gates
        run: |
          node tests/civication-psychology-clinical-career-ladder.test.js
          node tests/civication-psykolog-rollout-playability.test.js
          node tests/civication-psykologi-psykolog-role-world-rollout.test.js
          node tests/civication-psykologi-professor-psykologi-role-world-rollout.test.js
          node tests/civication-psykologi-forsker-psykologi-role-world-rollout.test.js
          node tests/civication-role-world-contract.test.js
          node tests/civication-role-world-broad-rollout-policy.test.js
          node scripts/build-civication-scene-registry.mjs --check
          node scripts/audit-civication-career-gameplay.mjs --check
          node scripts/audit-civication-role-world-rollout-readiness.mjs --check
      - name: Run full Civication suite
        run: npm run test:civication
      - name: Remove temporary materialization surface
        run: |
          rm scripts/TEMP_materialize_psykologi_psykolog_role_world.mjs
          rm .github/workflows/TEMP-civication-psykologi-psykolog-role-world-materialize.yml
      - name: Commit exact verified result
        run: |
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Psykologi Psykolog Role World rollout"
          git push origin HEAD:agent/civication-psykologi-psykolog-role-world-rollout
