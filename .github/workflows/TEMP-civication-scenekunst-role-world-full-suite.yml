name: TEMP Civication Scenekunst Role World full suite
# canonical rerun after 12/97 contract alignment

on:
  push:
    branches:
      - 'agent/civication-scenekunst-scenehenger-role-world-20260913'
    paths:
      - '.github/workflows/TEMP-civication-scenekunst-role-world-full-suite.yml'

permissions:
  contents: read

concurrency:
  group: temp-civication-scenekunst-role-world-full-suite
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify compiled scene registry
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Run complete Civication suite
        run: npm run test:civication

      - name: Typecheck
        run: npm run typecheck
