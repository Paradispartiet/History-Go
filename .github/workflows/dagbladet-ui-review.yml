name: Dagbladet responsive UI review
on:
  push:
    branches: ['production/dagbladet-akersgata-20261010']
    paths: ['.github/workflows/dagbladet-ui-review.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Capture and validate the actual app
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME_BIN"
          node scripts/audit-dagbladet-akersgata-visual.mjs
      - name: Save screenshots and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dagbladet-ui-review-20261011
          path: artifacts/dagbladet-akersgata-visual-20261011/
          if-no-files-found: error
      - name: Commit only the bounded visual evidence
        run: |
          test "$(git ls-remote origin refs/heads/production/dagbladet-akersgata-20261010 | cut -f1)" = "$GITHUB_SHA"
          mkdir -p reports/visual-qa/dagbladet-akersgata/20261011
          cp artifacts/dagbladet-akersgata-visual-20261011/* reports/visual-qa/dagbladet-akersgata/20261011/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/visual-qa/dagbladet-akersgata/20261011
          git diff --cached --check
          git commit -m "Record actual Dagbladet UI review at four viewport widths"
          git push origin HEAD:production/dagbladet-akersgata-20261010
