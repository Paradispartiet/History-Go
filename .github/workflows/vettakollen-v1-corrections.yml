name: Vettakollen v1 deterministic source correction and rebuild
on:
  push:
    branches: [history-go/vettakollen-v1-20261021]
    paths:
      - '.github/workflows/vettakollen-v1-corrections.yml'
permissions:
  contents: write
jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fix place narrative, source coverage, Fagverk schema and translation hashes
        shell: bash
        run: |
          node --input-type=module <<'VETTA_PATCH'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const file='data/places/natur/oslo/places_natur/vettakollen.json';
          const place=JSON.parse(fs.readFileSync(file,'utf8'));
          const oldText='Men dette boligstrøket og stasjonen er egne steder; History Go-punktet Vettakollen viser selve høyden.';
          const newText='Men dette boligstrøket og stasjonen er egne steder; Vettakollen betegner her selve høyden.';
          if(!place.popupDesc.includes(oldText))throw Error('Expected place text not found');
          place.popupDesc=place.popupDesc.replace(oldText,newText);
          place.fagverk.chapter_ids=place.fagverk.chapter_ids.map(x=>x==='geologi_berggrunn_landskap'?'geologi_landskap_tid':x);
          place.fagverk.guiding_questions=place.fagverk.guiding_questions.map(x=>x==='Hvordan forandret Holmenkollbanen tilgangen til åsen?'?'Hvordan forandret Holmenkollbanens åpning i 1898 tilgangen til åsen?':x);
          fs.writeFileSync(file,JSON.stringify(place,null,2)+'\n');
          const pf='data/places/production/vettakollen.json';
          const prod=JSON.parse(fs.readFileSync(pf,'utf8'));
          prod.textHashes.popupDesc=crypto.createHash('sha256').update(place.popupDesc).digest('hex');
          const claimId='claim_vettakollen_peak';
          const last=prod.sentenceCoverage.popupDesc.find(x=>x.sentence===24);
          if(!last)throw Error('Expected sentence 24 not found');
          if(!last.claimIds.includes(claimId))last.claimIds.push(claimId);
          prod.quizReadiness.questions[12].type='hvilket_verk_eller_objekt';
          prod.reviewsNotes='Kilde- og tekstrevisjon: varde- og stasjonsidentitet uten app-metatekst; alle tidsangivelser og fire quizkategorier kontrollert. Full v1 gjenstår app/CI.';
          fs.writeFileSync(pf,JSON.stringify(prod,null,2)+'\n');
          const norm=s=>String(s||'').replace(/\r\n/g,'\n').replace(/[ \t]+/g,' ').trim();
          const hash=crypto.createHash('sha256').update(JSON.stringify({name:norm(place.name),desc:norm(place.desc),popupDesc:norm(place.popupDesc)})).digest('hex').slice(0,16);
          for(const lang of ['en','es','pt']){
           const path='data/i18n/content/places/'+lang+'.json';
           const all=JSON.parse(fs.readFileSync(path,'utf8'));
           const entry=all.vettakollen;
           if(!entry)throw Error('Missing translation '+lang);
           entry.popupDesc=entry.popupDesc.replace(/this History Go location/g,'this location').replace(/esta cima de History Go/g,'esta cima').replace(/este ponto do History Go/g,'este lugar');
           entry._sourceHash=hash;
           fs.writeFileSync(path,JSON.stringify(all,null,2)+'\n');
          }
          console.log('Vettakollen canonical story updated, v4.2 hash',prod.textHashes.popupDesc,'i18n hash',hash,'quiz types',new Set(prod.quizReadiness.questions.map(x=>x.type)));
          VETTA_PATCH
      - name: Regenerate Fagverk release and affected runtime/catalog data
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-fagverk-release-manifest.mjs
          npm run place-open:build
          npm run places:index:build
          npm run epoker:places:build
      - name: Check repaired source and Fagverk
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-place-i18n-freshness.mjs vettakollen
          node scripts/validate-place-description-production-v4_2_policy.mjs --all
          node scripts/audit-fagverk-place-pages.mjs
          npm run knowledge:canonical:check
          npm run place-open:check
          npm run epoker:places:check
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit same-branch canonical fixes and generated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/natur/oslo/places_natur/vettakollen.json data/places/production/vettakollen.json data/i18n/content/places/en.json data/i18n/content/places/es.json data/i18n/content/places/pt.json
          git add data/fagverk/fagverk_release.json data/runtime data/places/places_index.json data/epoker/epoke-place-index.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(history-go): Vettakollen source policy and Fagverk geometry chapter"
            git pull --rebase origin history-go/vettakollen-v1-20261021
            git push origin HEAD:history-go/vettakollen-v1-20261021
          fi
