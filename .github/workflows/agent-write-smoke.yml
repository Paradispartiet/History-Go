name: Agent direct tabs publish

on:
  push:
    branches: [agent/sprakleksikon-2-0]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sprakleksikon-2-0
          fetch-depth: 0
      - name: Apply validated direct-tab migration
        run: python scripts/agent_direct_tabs_patch_keep_helpers.py
      - name: Exclude workflow mutation from bot commit
        run: git checkout HEAD -- .github/workflows/language-layer-checks.yml
      - name: Verify publishable diff
        run: |
          git diff --check
          git status --short
          test -n "$(git status --short)"
      - name: Commit and push canonical product changes
        run: |
          git config user.name "History Go migration bot"
          git config user.email "actions@users.noreply.github.com"
          git add css/place-popup-tabs.css data/leksikon/README_LEKSIKON.md docs/PLACE_POPUP_SYSTEM.md docs/PLACE_PRODUCTION_CHECKLIST.md docs/SPRAKLEKSIKON.md js/config.js tests/place-language-layer.test.mjs tests/regjeringskvartalet-more-phase.test.mjs tests/regjeringskvartalet-ui-production-audit.test.mjs tests/torggata-phase7h-more.test.js
          git commit -m "Gjør popupens tilleggsinnhold til direktefaner"
          git pull --rebase origin agent/sprakleksikon-2-0
          git push origin HEAD:agent/sprakleksikon-2-0
