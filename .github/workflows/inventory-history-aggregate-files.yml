name: Inventory active history aggregate files

on:
  push:
    branches: [main]
    paths:
      - .github/history-aggregate-inventory-trigger.txt

permissions:
  contents: write

concurrency:
  group: inventory-history-aggregate-files
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build active history aggregate inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('data/places/manifest.json').read_text(encoding='utf-8'))
          rows = []
          for rel in manifest['files']:
              if not rel.startswith('places/historie/'):
                  continue
              base = Path(rel).name
              if not (base.startswith('places_historie') or base == 'places_lisbon_historie.json'):
                  continue
              path = Path('data/places') / rel.removeprefix('places/')
              payload = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(payload, list):
                  continue
              rows.append({
                  'path': rel,
                  'count': len(payload),
                  'ids': [p.get('id') for p in payload if isinstance(p, dict)],
                  'names': [p.get('name') for p in payload if isinstance(p, dict)],
              })

          out = Path('reports/category-audit/history-aggregate-inventory.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({
              'active_history_aggregate_files': len(rows),
              'active_history_aggregate_places': sum(r['count'] for r in rows),
              'files': rows,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          old = Path('reports/category-audit/history-standalone-inventory.json')
          if old.exists():
              old.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports/category-audit
          git rm .github/workflows/inventory-history-aggregate-files.yml
          git rm .github/history-aggregate-inventory-trigger.txt
          git commit -m "Inventory active history aggregate files"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            sleep 2
          done
          exit 1
