name: Oslo next six regenerate derived content once
on:
  push:
    branches:
      - research/oslo-sentrum-v1-six-next-20261027
    paths:
      - '.github/workflows/oslo-next-six-regenerate-derived-once.yml'
permissions:
  contents: write
concurrency:
  group: oslo-next-six-regenerate-once-20261027
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-v1-six-next-20261027
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate existing canonical derived assets
        shell: bash
        run: |
          node scripts/materialize-natur-final-registry.mjs
          node scripts/build-fagverk-release-manifest.mjs
          npm run epoker:places:build
          npm run place-open:build
      - name: Validate derived assets and six Fagverk
        shell: bash
        run: |
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run epoker:places:check
          npm run place-open:check
          node --test tests/by-bolk02-quiz-contract.test.mjs
          node --test tests/fagverk-place-substance-audit.test.mjs
      - name: Commit generated changes and remove one-off job
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/oslo-next-six-regenerate-derived-once.yml
          git add data/fagverk/fagverk_registry.json data/fagverk/fagverk_release.json data/fagverk/subject_status.json data/epoker/epoke-place-index.json data/runtime/place-open .github/workflows/oslo-next-six-regenerate-derived-once.yml
          git diff --cached --check
          git commit -m 'build(oslo-v1): sync Fagverk release, epoch and place-open indices'
          git push origin HEAD:research/oslo-sentrum-v1-six-next-20261027
