name: TEMP Civication work-object Scene Pipeline writeback

on:
  push:
    branches:
      - agent/civication-work-object-scene-pipeline

permissions:
  contents: write

jobs:
  patch-test-writeback:
    if: github.event.head_commit.message != 'Wire persistent work objects into scene pipeline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-work-object-scene-pipeline
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Patch canonical Scene Pipeline owners
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected patch anchor missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1) Scene contract: optional read context + strictly shaped mutation operations.
          replace_once(
              'data/Civication/sceneContractV1.schema.json',
              '    "place_id": { "$ref": "#/$defs/nonEmptyId" },\n    "content": {',
              '    "place_id": { "$ref": "#/$defs/nonEmptyId" },\n    "work_context": { "$ref": "#/$defs/workContext" },\n    "content": {'
          )
          replace_once(
              'data/Civication/sceneContractV1.schema.json',
              '        "trigger_scene_ids": {\n          "type": "array",\n          "items": { "$ref": "#/$defs/nonEmptyId" },\n          "uniqueItems": true,\n          "default": []\n        }',
              '        "trigger_scene_ids": {\n          "type": "array",\n          "items": { "$ref": "#/$defs/nonEmptyId" },\n          "uniqueItems": true,\n          "default": []\n        },\n        "work_object_ops": {\n          "type": "array",\n          "items": { "$ref": "#/$defs/workObjectOp" },\n          "maxItems": 12,\n          "default": []\n        }'
          )
          work_defs = '''    "workContext": {
              "type": "object",
              "additionalProperties": false,
              "required": ["object_ids"],
              "properties": {
                "object_ids": {
                  "type": "array",
                  "items": { "$ref": "#/$defs/nonEmptyId" },
                  "minItems": 1,
                  "maxItems": 8,
                  "uniqueItems": true
                },
                "institution_id": { "$ref": "#/$defs/nonEmptyId" },
                "deadline_ref": { "type": "string", "minLength": 1 }
              }
            },
            "workObjectCreateSeed": {
              "type": "object",
              "additionalProperties": false,
              "required": ["work_object_id", "kind", "role_scope", "title", "status", "phase"],
              "properties": {
                "work_object_id": { "$ref": "#/$defs/nonEmptyId" },
                "kind": { "$ref": "#/$defs/nonEmptyId" },
                "role_scope": { "$ref": "#/$defs/nonEmptyId" },
                "institution_id": { "$ref": "#/$defs/nonEmptyId" },
                "title": { "type": "string", "minLength": 1 },
                "status": { "$ref": "#/$defs/nonEmptyId" },
                "phase": { "$ref": "#/$defs/nonEmptyId" },
                "people_refs": { "type": "array", "items": { "type": "string", "minLength": 1 }, "uniqueItems": true, "default": [] },
                "place_refs": { "type": "array", "items": { "type": "string", "minLength": 1 }, "uniqueItems": true, "default": [] },
                "knowledge_refs": { "type": "array", "items": { "type": "string", "minLength": 1 }, "uniqueItems": true, "default": [] },
                "open_questions": { "type": "array", "items": { "type": "string", "minLength": 1 }, "uniqueItems": true, "default": [] },
                "deadline": { "type": "string", "minLength": 1 },
                "confidentiality": { "type": "string", "minLength": 1 },
                "flags": { "type": "array", "items": { "$ref": "#/$defs/nonEmptyId" }, "uniqueItems": true, "default": [] },
                "shared": { "type": "boolean", "default": false }
              }
            },
            "workObjectPatch": {
              "type": "object",
              "additionalProperties": false,
              "required": ["work_object_id"],
              "properties": {
                "work_object_id": { "$ref": "#/$defs/nonEmptyId" },
                "kind": { "$ref": "#/$defs/nonEmptyId" },
                "role_scope": { "$ref": "#/$defs/nonEmptyId" },
                "institution_id": { "$ref": "#/$defs/nonEmptyId" },
                "title": { "type": "string", "minLength": 1 },
                "people_refs": { "type": "array", "items": { "type": "string", "minLength": 1 }, "uniqueItems": true },
                "place_refs": { "type": "array", "items": { "type": "string", "minLength": 1 }, "uniqueItems": true },
                "knowledge_refs": { "type": "array", "items": { "type": "string", "minLength": 1 }, "uniqueItems": true },
                "open_questions": { "type": "array", "items": { "type": "string", "minLength": 1 }, "uniqueItems": true },
                "deadline": { "type": ["string", "null"], "minLength": 1 },
                "confidentiality": { "type": ["string", "null"], "minLength": 1 },
                "flags": { "type": "array", "items": { "$ref": "#/$defs/nonEmptyId" }, "uniqueItems": true },
                "shared": { "type": "boolean" }
              }
            },
            "workObjectOp": {
              "oneOf": [
                { "$ref": "#/$defs/workObjectCreateOp" },
                { "$ref": "#/$defs/workObjectUpsertOp" },
                { "$ref": "#/$defs/workObjectTransitionOp" },
                { "$ref": "#/$defs/workObjectFlagOp" },
                { "$ref": "#/$defs/workObjectCloseOp" },
                { "$ref": "#/$defs/workObjectNoteOp" },
                { "$ref": "#/$defs/workObjectRemoveFlagOp" }
              ]
            },
            "workObjectCreateOp": {
              "type": "object", "additionalProperties": false,
              "required": ["op", "event_id", "work_object"],
              "properties": { "op": { "const": "create" }, "event_id": { "$ref": "#/$defs/nonEmptyId" }, "work_object": { "$ref": "#/$defs/workObjectCreateSeed" } }
            },
            "workObjectUpsertOp": {
              "type": "object", "additionalProperties": false,
              "required": ["op", "event_id", "work_object"],
              "properties": { "op": { "const": "upsert" }, "event_id": { "$ref": "#/$defs/nonEmptyId" }, "work_object": { "$ref": "#/$defs/workObjectPatch" } }
            },
            "workObjectTransitionOp": {
              "type": "object", "additionalProperties": false,
              "required": ["op", "event_id", "work_object_id"],
              "properties": {
                "op": { "const": "transition" }, "event_id": { "$ref": "#/$defs/nonEmptyId" }, "work_object_id": { "$ref": "#/$defs/nonEmptyId" },
                "to_status": { "$ref": "#/$defs/nonEmptyId" }, "to_phase": { "$ref": "#/$defs/nonEmptyId" }, "note": { "type": "string", "minLength": 1 }
              },
              "anyOf": [{ "required": ["to_status"] }, { "required": ["to_phase"] }, { "required": ["note"] }]
            },
            "workObjectFlagOp": {
              "type": "object", "additionalProperties": false,
              "required": ["op", "event_id", "work_object_id", "flag"],
              "properties": { "op": { "const": "add_flag" }, "event_id": { "$ref": "#/$defs/nonEmptyId" }, "work_object_id": { "$ref": "#/$defs/nonEmptyId" }, "flag": { "$ref": "#/$defs/nonEmptyId" } }
            },
            "workObjectRemoveFlagOp": {
              "type": "object", "additionalProperties": false,
              "required": ["op", "event_id", "work_object_id", "flag"],
              "properties": { "op": { "const": "remove_flag" }, "event_id": { "$ref": "#/$defs/nonEmptyId" }, "work_object_id": { "$ref": "#/$defs/nonEmptyId" }, "flag": { "$ref": "#/$defs/nonEmptyId" } }
            },
            "workObjectCloseOp": {
              "type": "object", "additionalProperties": false,
              "required": ["op", "event_id", "work_object_id"],
              "properties": { "op": { "const": "close" }, "event_id": { "$ref": "#/$defs/nonEmptyId" }, "work_object_id": { "$ref": "#/$defs/nonEmptyId" }, "outcome": { "type": "string", "minLength": 1 } }
            },
            "workObjectNoteOp": {
              "type": "object", "additionalProperties": false,
              "required": ["op", "event_id", "work_object_id", "note"],
              "properties": { "op": { "const": "note" }, "event_id": { "$ref": "#/$defs/nonEmptyId" }, "work_object_id": { "$ref": "#/$defs/nonEmptyId" }, "note": { "type": "string", "minLength": 1 } }
            },
          '''
          replace_once(
              'data/Civication/sceneContractV1.schema.json',
              '    "knowledgeContract": {',
              work_defs + '    "knowledgeContract": {'
          )

          # 2) Compiler: strict authoring normalization and preservation into canonical + compatibility projections.
          compiler_helpers = r'''

          function hasOwn(object, key) {
            return Object.prototype.hasOwnProperty.call(object, key);
          }

          function assertPlainObject(value, label) {
            if (!value || typeof value !== "object" || Array.isArray(value)) {
              throw new Error(`${label} må være objekt`);
            }
            return value;
          }

          function assertAllowedKeys(value, allowed, label) {
            const input = assertPlainObject(value, label);
            const unknown = Object.keys(input).filter((key) => !allowed.has(key));
            if (unknown.length) throw new Error(`${label} har ukjent felt: ${unknown.sort().join(", ")}`);
            return input;
          }

          function strictUniqueStrings(value, label, options = {}) {
            if (!Array.isArray(value)) throw new Error(`${label} må være array`);
            const max = Number(options.max || 32);
            if (value.length > max) throw new Error(`${label} kan ha maks ${max} elementer`);
            const seen = new Set();
            const out = [];
            for (let index = 0; index < value.length; index += 1) {
              const item = norm(value[index]);
              if (!item) throw new Error(`${label}[${index}] kan ikke være tom`);
              if (options.ids === true && !ID_RE.test(item)) throw new Error(`${label}[${index}] har ugyldig id: ${JSON.stringify(value[index])}`);
              if (seen.has(item)) throw new Error(`${label} har duplikat: ${item}`);
              seen.add(item);
              out.push(item);
            }
            return out;
          }

          function optionalStrictText(value, label, allowNull = false) {
            if (value === null && allowNull) return null;
            const out = norm(value);
            if (!out) throw new Error(`${label} kan ikke være tom`);
            return out;
          }

          function normalizeWorkContext(value, label) {
            if (value == null) return null;
            const input = assertAllowedKeys(value, new Set(["object_ids", "institution_id", "deadline_ref"]), label);
            if (!hasOwn(input, "object_ids")) throw new Error(`${label}.object_ids mangler`);
            const objectIds = strictUniqueStrings(input.object_ids, `${label}.object_ids`, { ids: true, max: 8 });
            if (!objectIds.length) throw new Error(`${label}.object_ids må inneholde minst ett id`);
            const out = { object_ids: objectIds };
            if (hasOwn(input, "institution_id")) out.institution_id = assertId(input.institution_id, `${label}.institution_id`);
            if (hasOwn(input, "deadline_ref")) out.deadline_ref = optionalStrictText(input.deadline_ref, `${label}.deadline_ref`);
            return out;
          }

          const CREATE_SEED_KEYS = new Set([
            "work_object_id", "kind", "role_scope", "institution_id", "title", "status", "phase",
            "people_refs", "place_refs", "knowledge_refs", "open_questions", "deadline", "confidentiality", "flags", "shared"
          ]);
          const PATCH_SEED_KEYS = new Set([
            "work_object_id", "kind", "role_scope", "institution_id", "title", "people_refs", "place_refs",
            "knowledge_refs", "open_questions", "deadline", "confidentiality", "flags", "shared"
          ]);

          function normalizeWorkObjectSeed(value, label, mode) {
            const create = mode === "create";
            const input = assertAllowedKeys(value, create ? CREATE_SEED_KEYS : PATCH_SEED_KEYS, label);
            const out = { work_object_id: assertId(input.work_object_id, `${label}.work_object_id`) };
            if (create) {
              out.kind = assertId(input.kind, `${label}.kind`);
              out.role_scope = assertId(input.role_scope, `${label}.role_scope`);
              out.title = optionalStrictText(input.title, `${label}.title`);
              out.status = assertId(input.status, `${label}.status`);
              out.phase = assertId(input.phase, `${label}.phase`);
            } else {
              if (hasOwn(input, "kind")) out.kind = assertId(input.kind, `${label}.kind`);
              if (hasOwn(input, "role_scope")) out.role_scope = assertId(input.role_scope, `${label}.role_scope`);
              if (hasOwn(input, "title")) out.title = optionalStrictText(input.title, `${label}.title`);
            }
            if (hasOwn(input, "institution_id")) out.institution_id = assertId(input.institution_id, `${label}.institution_id`);
            for (const key of ["people_refs", "place_refs", "knowledge_refs", "open_questions"]) {
              if (hasOwn(input, key)) out[key] = strictUniqueStrings(input[key], `${label}.${key}`);
              else if (create) out[key] = [];
            }
            if (hasOwn(input, "deadline")) out.deadline = optionalStrictText(input.deadline, `${label}.deadline`, !create);
            if (hasOwn(input, "confidentiality")) out.confidentiality = optionalStrictText(input.confidentiality, `${label}.confidentiality`, !create);
            if (hasOwn(input, "flags")) out.flags = strictUniqueStrings(input.flags, `${label}.flags`, { ids: true });
            else if (create) out.flags = [];
            if (hasOwn(input, "shared")) {
              if (typeof input.shared !== "boolean") throw new Error(`${label}.shared må være boolean`);
              out.shared = input.shared;
            } else if (create) out.shared = false;
            return out;
          }

          function normalizeWorkObjectOps(value, label) {
            if (!Array.isArray(value)) throw new Error(`${label} må være array`);
            if (value.length > 12) throw new Error(`${label} kan ha maks 12 operasjoner`);
            const seenEvents = new Set();
            const out = [];
            for (let index = 0; index < value.length; index += 1) {
              const opLabel = `${label}[${index}]`;
              const raw = assertPlainObject(value[index], opLabel);
              const op = norm(raw.op);
              const allowedByOp = {
                create: new Set(["op", "event_id", "work_object"]),
                upsert: new Set(["op", "event_id", "work_object"]),
                transition: new Set(["op", "event_id", "work_object_id", "to_status", "to_phase", "note"]),
                add_flag: new Set(["op", "event_id", "work_object_id", "flag"]),
                remove_flag: new Set(["op", "event_id", "work_object_id", "flag"]),
                close: new Set(["op", "event_id", "work_object_id", "outcome"]),
                note: new Set(["op", "event_id", "work_object_id", "note"])
              };
              const allowed = allowedByOp[op];
              if (!allowed) throw new Error(`${opLabel}.op er ukjent: ${op || "<tom>"}`);
              const input = assertAllowedKeys(raw, allowed, opLabel);
              const eventId = assertId(input.event_id, `${opLabel}.event_id`);
              if (seenEvents.has(eventId)) throw new Error(`${label} har duplikat event_id: ${eventId}`);
              seenEvents.add(eventId);
              if (op === "create" || op === "upsert") {
                out.push({ op, event_id: eventId, work_object: normalizeWorkObjectSeed(input.work_object, `${opLabel}.work_object`, op) });
                continue;
              }
              const workObjectId = assertId(input.work_object_id, `${opLabel}.work_object_id`);
              if (op === "transition") {
                const transition = { op, event_id: eventId, work_object_id: workObjectId };
                if (hasOwn(input, "to_status")) transition.to_status = assertId(input.to_status, `${opLabel}.to_status`);
                if (hasOwn(input, "to_phase")) transition.to_phase = assertId(input.to_phase, `${opLabel}.to_phase`);
                if (hasOwn(input, "note")) transition.note = optionalStrictText(input.note, `${opLabel}.note`);
                if (!transition.to_status && !transition.to_phase && !transition.note) throw new Error(`${opLabel} må endre status/fase eller ha note`);
                out.push(transition);
                continue;
              }
              if (op === "add_flag" || op === "remove_flag") {
                out.push({ op, event_id: eventId, work_object_id: workObjectId, flag: assertId(input.flag, `${opLabel}.flag`) });
                continue;
              }
              if (op === "close") {
                const close = { op, event_id: eventId, work_object_id: workObjectId };
                if (hasOwn(input, "outcome")) close.outcome = optionalStrictText(input.outcome, `${opLabel}.outcome`);
                out.push(close);
                continue;
              }
              out.push({ op, event_id: eventId, work_object_id: workObjectId, note: optionalStrictText(input.note, `${opLabel}.note`) });
            }
            return out;
          }
          '''
          replace_once(
              'scripts/build-civication-scene-registry.mjs',
              'function uniqueIds(values) {\n  return uniqueStrings(values).filter((value) => ID_RE.test(value));\n}\n',
              'function uniqueIds(values) {\n  return uniqueStrings(values).filter((value) => ID_RE.test(value));\n}\n' + compiler_helpers
          )
          replace_once(
              'scripts/build-civication-scene-registry.mjs',
              'function normalizeEffects(value, legacyScoreDelta) {',
              'function normalizeEffects(value, legacyScoreDelta, label = "effects") {'
          )
          replace_once(
              'scripts/build-civication-scene-registry.mjs',
              '  const triggerSceneIds = uniqueIds(input.trigger_scene_ids);\n  if (triggerSceneIds.length) out.trigger_scene_ids = triggerSceneIds;\n  return out;',
              '  const triggerSceneIds = uniqueIds(input.trigger_scene_ids);\n  if (triggerSceneIds.length) out.trigger_scene_ids = triggerSceneIds;\n  if (hasOwn(input, "work_object_ops")) {\n    const workObjectOps = normalizeWorkObjectOps(input.work_object_ops, `${label}.work_object_ops`);\n    if (workObjectOps.length) out.work_object_ops = workObjectOps;\n  }\n  return out;'
          )
          replace_once(
              'scripts/build-civication-scene-registry.mjs',
              '      effects: normalizeEffects(choice.effects, numberOr(choice.effect, 0))',
              '      effects: normalizeEffects(choice.effects, numberOr(choice.effect, 0), `${sourcePath} :: ${sceneId} choice[${index}].effects`)'
          )
          replace_once(
              'scripts/build-civication-scene-registry.mjs',
              '  const canonicalChoiceInputs = normalizeCanonicalChoiceInputs(mail?.choices);\n  const compatibilityChoices = compatibilityChoiceInputs(mail?.choices);\n  const choices = canonicalChoices(canonicalChoiceInputs, sourcePath, sceneId);\n  const taskContract = normalizeTaskContract(mail);',
              '''  const canonicalChoiceInputs = normalizeCanonicalChoiceInputs(mail?.choices);
              const choices = canonicalChoices(canonicalChoiceInputs, sourcePath, sceneId);
              const compatibilityChoices = compatibilityChoiceInputs(mail?.choices).map((choice, index) => {
                const normalizedOps = choices[index]?.effects?.work_object_ops;
                if (!Array.isArray(normalizedOps) || !normalizedOps.length) return choice;
                const rawEffects = choice?.effects && typeof choice.effects === "object" && !Array.isArray(choice.effects) ? choice.effects : {};
                return { ...choice, effects: { ...rawEffects, work_object_ops: normalizedOps } };
              });
              const taskContract = normalizeTaskContract(mail);
              const workContext = normalizeWorkContext(mail?.work_context, `${sourcePath} :: ${sceneId} work_context`);
              const sceneEffects = normalizeEffects(mail?.effects, undefined, `${sourcePath} :: ${sceneId} effects`);'''
          )
          replace_once(
              'scripts/build-civication-scene-registry.mjs',
              '    situation: situation.length ? situation : [norm(mail?.summary)].filter(Boolean),\n    scene_catalog_source_path: sourcePath,',
              '    situation: situation.length ? situation : [norm(mail?.summary)].filter(Boolean),\n    ...(workContext ? { work_context: workContext } : {}),\n    scene_catalog_source_path: sourcePath,'
          )
          replace_once(
              'scripts/build-civication-scene-registry.mjs',
              '  };\n\n  const scene = {\n    schema: SCENE_SCHEMA,',
              '''  };
              if (Array.isArray(sceneEffects.work_object_ops) && sceneEffects.work_object_ops.length) {
                const rawEffects = mail?.effects && typeof mail.effects === "object" && !Array.isArray(mail.effects) ? mail.effects : {};
                compatibilityProjection.effects = { ...rawEffects, work_object_ops: sceneEffects.work_object_ops };
              }

              const scene = {
                schema: SCENE_SCHEMA,'''
          )
          replace_once(
              'scripts/build-civication-scene-registry.mjs',
              '    thread_id: canonicalThreadId(mail, roleScope, sceneId),\n    content: canonicalContent(mail, sceneId),',
              '    thread_id: canonicalThreadId(mail, roleScope, sceneId),\n    ...(workContext ? { work_context: workContext } : {}),\n    content: canonicalContent(mail, sceneId),'
          )
          replace_once(
              'scripts/build-civication-scene-registry.mjs',
              '    effects: normalizeEffects(mail?.effects),',
              '    effects: sceneEffects,'
          )

          # 3) Existing single ChoiceDirector consequence owner gets a transactional work-world path.
          day_helpers = r'''

          const WORK_WORLD_SCRIPT = "js/Civication/core/civicationWorkWorld.js";
          let workWorldLoadPromise = null;

          function runtimeWindow() {
            return /** @type {any} */ (window);
          }

          function attachWorkWorldFromFactory() {
            const rt = runtimeWindow();
            if (rt.CivicationWorkWorld?.applyOperations) return rt.CivicationWorkWorld;
            if (rt.CivicationWorkWorldFactory?.createAdapter && rt.CivicationState?.getState && rt.CivicationState?.setState) {
              rt.CivicationWorkWorld = rt.CivicationWorkWorldFactory.createAdapter(rt.CivicationState);
              return rt.CivicationWorkWorld;
            }
            return null;
          }

          function ensureWorkWorld() {
            const attached = attachWorkWorldFromFactory();
            if (attached) return Promise.resolve(attached);
            if (workWorldLoadPromise) return workWorldLoadPromise;
            workWorldLoadPromise = new Promise((resolve, reject) => {
              const script = document.createElement("script");
              script.src = WORK_WORLD_SCRIPT;
              script.async = false;
              script.onload = () => {
                const adapter = attachWorkWorldFromFactory();
                if (!adapter) reject(new Error("CivicationWorkWorld lastet uten state-adapter"));
                else resolve(adapter);
              };
              script.onerror = () => reject(new Error(`Kunne ikke laste ${WORK_WORLD_SCRIPT}`));
              (document.head || document.documentElement).appendChild(script);
            }).catch((error) => {
              workWorldLoadPromise = null;
              throw error;
            });
            return workWorldLoadPromise;
          }

          function collectWorkObjectOps(eventObj, choice) {
            const sceneOps = Array.isArray(eventObj?.effects?.work_object_ops) ? eventObj.effects.work_object_ops : [];
            const choiceOps = Array.isArray(choice?.effects?.work_object_ops) ? choice.effects.work_object_ops : [];
            return [...sceneOps, ...choiceOps];
          }

          function makeShadowWorkWorld(adapter, factory) {
            let shadowState = { work_world: adapter.getWorldState() };
            const shadowApi = {
              getState() { return JSON.parse(JSON.stringify(shadowState)); },
              setState(patch) {
                shadowState = { ...shadowState, ...JSON.parse(JSON.stringify(patch || {})) };
                return JSON.parse(JSON.stringify(shadowState));
              }
            };
            return factory.createAdapter(shadowApi);
          }

          async function applyWorkWorldConsequences(eventObj, choice) {
            const operations = collectWorkObjectOps(eventObj, choice);
            if (!operations.length) return null;
            const sceneId = normStr(eventObj?.id);
            const choiceId = normStr(choice?.id);
            if (!sceneId || !choiceId) throw new Error("work_object_ops krever scene-id og choice-id");

            const eventIds = operations.map((operation) => normStr(operation?.event_id));
            if (eventIds.some((eventId) => !eventId)) throw new Error("work_object_ops krever stabile event_id");
            if (new Set(eventIds).size !== eventIds.length) throw new Error("work_object_ops kan ikke gjenbruke event_id i samme svarbatch");

            const adapter = await ensureWorkWorld();
            const factory = runtimeWindow().CivicationWorkWorldFactory;
            if (!factory?.createAdapter) throw new Error("CivicationWorkWorldFactory mangler for transaksjonell preflight");

            const context = { scene_id: sceneId, choice_id: choiceId, at: new Date().toISOString() };
            const before = eventObj?.work_context ? adapter.resolveWorkContext(eventObj.work_context) : null;
            const shadow = makeShadowWorkWorld(adapter, factory);
            shadow.applyOperations(operations, context);
            const applied = adapter.applyOperations(operations, context);
            const after = eventObj?.work_context ? adapter.resolveWorkContext(eventObj.work_context) : null;
            try { window.dispatchEvent(new Event("updateProfile")); } catch {}
            return {
              applied_count: applied.length,
              operation_event_ids: eventIds,
              object_ids: applied.map((entry) => entry.work_object_id),
              work_context_before: before,
              work_context_after: after
            };
          }
          '''
          replace_once(
              'js/Civication/systems/day/dayConsequences.js',
              '  function uniq(arr) {\n    return Array.from(new Set((Array.isArray(arr) ? arr : []).map(normStr).filter(Boolean)));\n  }\n',
              '  function uniq(arr) {\n    return Array.from(new Set((Array.isArray(arr) ? arr : []).map(normStr).filter(Boolean)));\n  }\n' + day_helpers
          )
          old_apply = '''  function applyChoiceConsequences(ctx) {
              const { eventObj, choice, result } = ctx;
              if (!eventObj || !choice) return null;

              const roleScope = activeRoleScope();
              const hasExplicitNextBias = !!(choice?.next_bias && typeof choice.next_bias === "object");

              if (roleScope !== "mellomleder" && !hasExplicitNextBias) return null;

              const branch = mergeBranchState(inferBranchBias(eventObj, choice, result));
              const psyche = roleScope === "mellomleder"
                ? applyPsycheDelta(inferPsycheDelta(eventObj, choice, result))
                : null;
              const capital = roleScope === "mellomleder"
                ? applyCapitalDelta(
