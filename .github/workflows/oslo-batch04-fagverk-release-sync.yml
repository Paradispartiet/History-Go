name: Sync Oslo batch04 Fagverk release
on:
  push:
    branches:
      - content/oslo-batch04-remaining-12-fagverk-20261021
    paths:
      - .github/workflows/oslo-batch04-fagverk-release-sync.yml
permissions:
  contents: write
concurrency:
  group: oslo-batch04-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate and test release against latest merged branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=content/oslo-batch04-remaining-12-fagverk-20261021
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard FETCH_HEAD
            node scripts/build-fagverk-release-manifest.mjs
            node scripts/build-fagverk-release-manifest.mjs --check
            node --test tests/oslo-three-places-fagverk-batch-20261021.test.mjs tests/oslo-batch04-fagverk-20261021.test.mjs
            git add data/fagverk/fagverk_release.json
            if git diff --cached --quiet; then echo 'Release already synchronized'; exit 0; fi
            git commit -m "build(history): sync Fagverk release after merging main into Oslo batch04"
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
          done
          echo 'Concurrent branch moved during all five attempts' >&2
          exit 1
