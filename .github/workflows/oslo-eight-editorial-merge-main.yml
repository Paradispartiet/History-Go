name: Oslo eight editorial sync with current main
on:
  push:
    branches: [content/oslo-eight-source-backed-place-texts-20261019]
    paths:
      - .github/workflows/oslo-eight-editorial-merge-main.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Merge already-published Tollbukaia files without losing eight editorial revisions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git merge --no-commit --no-ff origin/main; then
            echo 'No merge conflicts'
          else
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "Conflicts: $conflicts"
            unexpected=$(printf '%s\n' "$conflicts" | grep -Ev '^(data/places/places_index\.json|data/places/production-tiers/v1-oslo-place-media-text-review-20261019-batch04\.json)$' || true)
            if [ -n "$unexpected" ]; then
              echo "Unapproved merge conflict: $unexpected"; exit 1
            fi
            for path in data/places/places_index.json data/places/production-tiers/v1-oslo-place-media-text-review-20261019-batch04.json; do
              if git diff --name-only --diff-filter=U | grep -Fxq "$path"; then
                git checkout --theirs -- "$path"
                git add "$path"
              fi
            done
          fi
      - name: Rerender source-backed text, records and runtime on latest main
        run: |
          node scripts/produce-oslo-source-backed-place-texts-20261019.mjs
          npm run places:index:build
          npm run place-open:build
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target havnelageret --output data/quiz/production_context/naeringsliv/havnelageret.json
          npm run place-open:check
      - name: Save synchronized content in one merge commit and self-cleanup
        run: |
          git add data/places reports/oslo-twenty-place-text-revision-20261019/result.json
          git add data/runtime/place-open data/quiz/production_context/naeringsliv/havnelageret.json
          git rm .github/workflows/oslo-eight-editorial-merge-main.yml
          git commit -m 'content(oslo): reconcile eight source-backed stories with published Tollbukaia photo'
          git push origin HEAD:content/oslo-eight-source-backed-place-texts-20261019
