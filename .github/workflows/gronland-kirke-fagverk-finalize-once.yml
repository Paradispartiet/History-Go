name: Grønland kirke Fagverk finalizer once

on:
  push:
    branches:
      - work/gronland-kirke-fagverk-v2-20260902

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gronland-kirke-fagverk-v2-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Register Place-owned Fagverk
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'data/fagverk/fagverk_registry.json';
          const registry = JSON.parse(fs.readFileSync(file, 'utf8'));
          registry.placeLinks ||= {};
          registry.placeLinks.gronland_kirke = {
            sourceFile: 'places/by/oslo/places/gronland_kirke.json',
            field: 'fagverk',
            schema: 'history_go_place_fagverk_v2',
            level: 'full',
            status: 'curated'
          };
          registry.updatedAt = '2026-09-02';
          fs.writeFileSync(file, JSON.stringify(registry, null, 2) + '\n');
          NODE
      - name: Regenerate canonical derived artifacts
        run: |
          npm run places:index:build
          npm run place-open:build
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/gronland-kirke-image-audit.json
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/gronland-kirke-image-audit.json', 'utf8'));
          const file = 'data/places/place_image_backlog_summary.json';
          const summary = JSON.parse(fs.readFileSync(file, 'utf8'));
          summary.generatedAt = '2026-09-02';
          summary.generatedFromCommit = 'gronland_kirke_fagverk_v2_20260902';
          summary.totalPlaces = audit.totalPlaces;
          summary.summary = {
            validLocal: audit.summary.local,
            validRemote: audit.summary.remote,
            optionalMissing: audit.summary.optional,
            missing: audit.summary.missing,
            invalidLocalPath: audit.summary.invalid,
            remaining: audit.summary.missing + audit.summary.invalid
          };
          summary.byCategory ||= {};
          for (const [category, row] of Object.entries(audit.byCategory || {})) {
            const existing = summary.byCategory[category] || {};
            summary.byCategory[category] = {
              total: row.total,
              valid: row.local + row.remote,
              optional: row.optional,
              missing: row.missing,
              invalid: row.invalid,
              ...(existing.designAlias ? {designAlias: existing.designAlias} : {})
            };
          }
          fs.writeFileSync(file, JSON.stringify(summary, null, 2) + '\n');
          NODE
      - name: Verify production gates
        run: |
          npm run places:index:check
          npm run place-open:check
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node scripts/audit-place-images.mjs --mode=changed
          node scripts/audit-place-images.mjs --mode=all --report=reports/place-image-audit.json --verify-summary=data/places/place_image_backlog_summary.json
          node --test \
            tests/fagverk-place-pages.test.mjs \
            tests/fagverk-place-rendering.test.mjs \
            tests/fagverk-place-substance-audit.test.mjs \
            tests/fagverk-link-audit.test.mjs \
            tests/fagverk-place-foundation-support.test.mjs \
            tests/fagverk-release-manifest.test.mjs
          npm run build:web:check
          git diff --check
      - name: Commit generated state and self-clean
        run: |
          rm .github/workflows/gronland-kirke-fagverk-finalize-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'chore(fagverk): finalize Grønland kirke artifacts'
          git push origin HEAD:work/gronland-kirke-fagverk-v2-20260902
