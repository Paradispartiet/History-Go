name: Temporary Minneparken generated-data rebuild
on:
  push:
    branches:
      - content/minneparken-kildebasert-leksikon-20261103
    paths:
      - .github/workflows/minneparken-regenerate-temp.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    if: github.repository == 'Paradispartiet/History-Go'
    timeout-minutes: 20
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: content/minneparken-kildebasert-leksikon-20261103
          persist-credentials: true
          fetch-depth: 1
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebuild canonical generated artifacts
        run: |
          npm run places:index:build
          npm run place-open:build
          npm run epoker:places:build
          node scripts/build-fagverk-release-manifest.mjs
      - name: Verify generated artifacts
        run: |
          npm run places:index:check
          npm run place-open:check
          npm run epoker:places:check
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit only supported generated outputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/places/places_index.json data/runtime/ data/epoker/epoke-place-index.json data/fagverk/fagverk_release.json
          if git diff --cached --quiet; then
            echo 'No generated changes required.'
          else
            git diff --cached --stat
            git commit -m 'Regenerate Minneparken place index, open payloads, epoker and Fagverk release'
            git push origin HEAD:refs/heads/content/minneparken-kildebasert-leksikon-20261103
          fi
