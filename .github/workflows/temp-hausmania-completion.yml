name: TEMP Hausmania completion

on:
  push:
    branches:
      - agent/hausmania-completion-20260910
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-hausmania-completion
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hausmania-completion-20260910
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false sharp

      - name: Fetch verified documentary sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /workspace/scratch
          UA='Mozilla/5.0 History-Go production audit'
          curl -fL --retry 4 --retry-delay 2 -A "$UA" 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hausmanns_gate_34%2C_Oslo_%282024%29.jpg?width=1800' -o /workspace/scratch/haus-current.jpg
          curl -fL --retry 4 --retry-delay 2 -A "$UA" 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hausmania_fasade.jpg?width=1800' -o /workspace/scratch/haus-2017.jpg
          curl -fL --retry 4 --retry-delay 2 -A "$UA" 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Oh_Lord_When_is_my_15_minutes%3F.jpg?width=1600' -o /workspace/scratch/haus-stencil.jpg
          curl -fL --retry 4 --retry-delay 2 -A "$UA" 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hausmanns_gate_at_Ankertorget_-_2007.04.03.jpg?width=1600' -o /workspace/scratch/haus-2007.jpg
          file /workspace/scratch/haus-*.jpg

      - name: Resolve authentic Podium identity asset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, re, urllib.parse, urllib.request
          page = 'https://www.podium.enterprises/'
          req = urllib.request.Request(page, headers={'User-Agent':'Mozilla/5.0 History-Go production audit'})
          text = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')
          tags = re.findall(r'<img\b[^>]*>', text, flags=re.I|re.S)
          candidates = []
          for tag in tags:
              low = tag.lower()
              if 'podium' not in low and 'logo' not in low:
                  continue
              for attr in ('src','data-src'):
                  m = re.search(r'\b%s=["\']([^"\']+)' % attr, tag, flags=re.I)
                  if m:
                      url = urllib.parse.urljoin(page, html.unescape(m.group(1)))
                      candidates.append(url)
                      break
          if not candidates:
              raise SystemExit('No Podium image/logo candidate found on official site')
          url = candidates[0]
          print('Resolved official Podium asset:', url)
          with open('/workspace/scratch/podium-url.txt','w') as f: f.write(url+'\n')
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 History-Go production audit','Referer':page})
          data = urllib.request.urlopen(req, timeout=30).read()
          if len(data) < 500:
              raise SystemExit('Podium asset response unexpectedly small')
          with open('/workspace/scratch/podium-logo','wb') as f: f.write(data)
          PY
          file /workspace/scratch/podium-logo

      - name: Materialize Hausmania package
        run: node tools/finalize-hausmania-completion.mjs

      - name: Focused Hausmania regression
        run: node --test tests/hausmania-completion.test.mjs

      - name: Canonical place and content gates
        run: |
          npm run places:index:check
          npm run places:emner:check
          npm run check:stories
          npm run place-open:check
          npm run epoker:places:check

      - name: Quiz and Knowledge gates
        run: |
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding

      - name: Fagverk and governance gates
        run: |
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/fagverk-place-pages.test.mjs tests/fagverk-place-rendering.test.mjs tests/fagverk-place-substance-audit.test.mjs
          npm run audit:categories
          git diff --check

      - name: Persist completed package on branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-hausmania-completion.yml
          git add -A
          git status --short
          git commit -m 'Complete Hausmania production'
          git push origin HEAD:agent/hausmania-completion-20260910
