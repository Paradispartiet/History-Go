name: Run Etnesjoen BMX skate filler

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - agent/fill-etnesjoen-tennis-rounds-batch1

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/fill-etnesjoen-bmx-skate-rounds-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute embedded generator
        shell: bash
        run: |
          python - <<'EXTRACT'
          from pathlib import Path

          workflow_path = Path('.github/workflows/fill-etnesjoen-bmx-skate-rounds.yml')
          text = workflow_path.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(script, str(workflow_path), 'exec'), {'__name__': '__main__'})
          EXTRACT

      - name: Validate generated data
        shell: bash
        run: |
          node tests/etnesjoen-bmx-skate-batch1-round-content.test.js
          node tests/etnesjoen-tennis-batch1-round-content.test.js
          if [ -f tests/etnesjoen-idrettsanlegg-batch1-round-content.test.js ]; then
            node tests/etnesjoen-idrettsanlegg-batch1-round-content.test.js
          fi
          node tests/place-card-rounds-runtime-audit.test.js
          node tests/place-card-leksikon-content-audit.test.js
          node tests/etne-people-manifest-integration.test.js
          npx tsc -p tsconfig.tools.json
          npx tsc -p tsconfig.web.json
          git diff --check

      - name: Commit generated data and clean temporary files
        shell: bash
        run: |
          rm -f .github/workflows/fill-etnesjoen-bmx-skate-rounds.yml
          rm -f .github/workflows/run-fill-etnesjoen-bmx-skate-pr.yml
          rm -f .github/trigger-bmx-skate-rounds.txt
          git config user.name "History GO data bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fill Etnesjoen BMX skate place rounds"
          git push origin HEAD:agent/fill-etnesjoen-bmx-skate-rounds-batch1
