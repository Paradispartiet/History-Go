name: TEMP Kunstnerforbundet R6 final repair

on:
  push:
    branches:
      - agent/kunstnerforbundet-place-production-r2-20260913

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Repair only documented closure drift
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const testPath = 'tests/epoke-place-index.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          const replacements = [
            ['assert.equal(index.stats.verified_place_production_milestone_count, 549);', 'assert.equal(index.stats.verified_place_production_milestone_count, 555);'],
            ['assert.equal(coverage.dated_evidence_place_count, 244);', 'assert.equal(coverage.dated_evidence_place_count, 245);'],
            ['assert.equal(coverage.awaiting_source_backed_history_count, 340);', 'assert.equal(coverage.awaiting_source_backed_history_count, 339);'],
          ];
          for (const [from, to] of replacements) {
            const count = test.split(from).length - 1;
            if (count !== 1) throw new Error(`Expected exactly one occurrence of ${from}, found ${count}`);
            test = test.replace(from, to);
          }
          fs.writeFileSync(testPath, test);

          const summaryPath = 'data/places/place_image_backlog_summary.json';
          const doc = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
          const expectedSummary = {
            validLocal: 112,
            validRemote: 52,
            optionalMissing: 79,
            missing: 1280,
            invalidLocalPath: 10,
            remaining: 1290,
          };
          const expectedKunst = {
            total: 65,
            valid: 5,
            optional: 2,
            missing: 58,
            invalid: 0,
          };
          for (const [key, value] of Object.entries(expectedSummary)) {
            if (doc.summary?.[key] !== value) throw new Error(`Backlog summary ${key} drifted: expected ${value}, got ${doc.summary?.[key]}`);
          }
          for (const [key, value] of Object.entries(expectedKunst)) {
            if (doc.byCategory?.kunst?.[key] !== value) throw new Error(`Kunst backlog ${key} drifted: expected ${value}, got ${doc.byCategory?.kunst?.[key]}`);
          }
          doc.summary.validLocal = 113;
          doc.summary.missing = 1279;
          doc.summary.remaining = 1289;
          doc.byCategory.kunst.valid = 6;
          doc.byCategory.kunst.missing = 57;
          fs.writeFileSync(summaryPath, `${JSON.stringify(doc, null, 2)}\n`);
          NODE

      - name: Verify repaired gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-epoke-place-index.mjs --check
          node scripts/audit-epoke-place-index.mjs
          node scripts/audit-epoke-historical-coverage.mjs
          node --test tests/epoke-place-index.test.mjs
          node scripts/generate-place-image-backlog.mjs --verify-summary

      - name: Commit only two repairs and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-kunstnerforbundet-r6-final-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/epoke-place-index.test.mjs data/places/place_image_backlog_summary.json .github/workflows/tmp-kunstnerforbundet-r6-final-repair.yml
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(.github/workflows/tmp-kunstnerforbundet-r6-final-repair.yml data/places/place_image_backlog_summary.json tests/epoke-place-index.test.mjs)
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected staged paths:\n%s\n' "${changed[*]}"
            exit 1
          fi
          git commit -m 'Close Kunstnerforbundet epoch and image backlog drift'
          git push origin HEAD:agent/kunstnerforbundet-place-production-r2-20260913
