name: Oslo kultureiendommer batch 10 coordinate lookup

on:
  push:
    branches:
      - agent/oslo-kultureiendommer-batch-10-seven

permissions:
  contents: write

jobs:
  address-first:
    if: ${{ !startsWith(github.event.head_commit.message, 'Save Oslo kultureiendommer batch 10 coordinates') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-kultureiendommer-batch-10-seven
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Query and persist seven Geonorge address candidates
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/oslo-kultureiendommer-batch-10/coordinates
          npm run places:coords:find:address -- --address "Gardeveien 15 Oslo" | tee reports/oslo-kultureiendommer-batch-10/coordinates/sporveismuseet.json
          npm run places:coords:find:address -- --address "Trondheimsveien 640 Oslo" | tee reports/oslo-kultureiendommer-batch-10/coordinates/bankall-gard.json
          npm run places:coords:find:address -- --address "Saxegaardsgata 17 Oslo" | tee reports/oslo-kultureiendommer-batch-10/coordinates/saxegarden.json
          npm run places:coords:find:address -- --address "Olaus Fjørtofts vei 130 Oslo" | tee reports/oslo-kultureiendommer-batch-10/coordinates/ovre-fossum-gard.json
          npm run places:coords:find:address -- --address "Langbølgen 2B Oslo" | tee reports/oslo-kultureiendommer-batch-10/coordinates/lambertseter-gard.json
          npm run places:coords:find:address -- --address "Peter Aas' vei 17 Oslo" | tee reports/oslo-kultureiendommer-batch-10/coordinates/nordre-skoyen-hovedgard.json
          npm run places:coords:find:address -- --address "Bispegata 16 Oslo" | tee reports/oslo-kultureiendommer-batch-10/coordinates/lokomotivverkstedet.json
      - name: Commit saved coordinate evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/oslo-kultureiendommer-batch-10/coordinates
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Save Oslo kultureiendommer batch 10 coordinates"
          git push origin HEAD:agent/oslo-kultureiendommer-batch-10-seven
