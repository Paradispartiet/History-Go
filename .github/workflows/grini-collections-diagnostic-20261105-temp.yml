name: Temporary Grini collections baseline diagnosis
on:
  push:
    branches:
      - qa/grini-collections-diagnostic-20261105
    paths:
      - .github/workflows/grini-collections-diagnostic-20261105-temp.yml
permissions:
  contents: read
jobs:
  grini-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify pinned source and QA-only edits
        shell: bash
        run: |
          set -euo pipefail
          git diff --check '19939a564c27959d8b924ecb87b475ad16ed51aa' HEAD
      - run: npm ci --no-audit --no-fund
      - name: Browser under runner system Chrome
        shell: bash
        run: |
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Grini diagnostic on unmodified production data
        run: node scripts/verify-grini-collections-browser.mjs grini_fangeleir
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grini-collections-diagnostic-20261105
          path: artifacts/grini-closeout/grini_fangeleir/**
          retention-days: 7
          if-no-files-found: ignore
