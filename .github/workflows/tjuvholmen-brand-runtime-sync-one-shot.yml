name: Tjuvholmen THE THIEF brand runtime sync one-shot
on:
  pull_request:
    paths:
      - '.github/workflows/tjuvholmen-brand-runtime-sync-one-shot.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tjuvholmen-thief-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/tjuvholmen-the-thief-brand-logo-20261112
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate canonical Place-open runtime with THE THIEF logo
        run: |
          npm run place-open:build
          npm run place-open:check
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const brand=JSON.parse(fs.readFileSync('data/brands/brands_master.json','utf8')).find(x=>x.id==='the_thief');
          const p=JSON.parse(fs.readFileSync('data/runtime/place-open/tjuvholmen.json','utf8'));
          const b=p.brands?.find(x=>x.id==='the_thief');
          if(!brand?.logo||!b?.logo||brand.logo!==b.logo)throw Error('THE THIEF canonical brand and Place-open logo mismatch');
          if(brand.imageMeta?.reviewStatus!=='manually_approved'||!fs.existsSync(b.logo))throw Error('THE THIEF verified logo asset missing');
          console.log('THE_THIEF_BRAND_RUNTIME_PASS',b.logo);
          NODE
      - name: Commit only the updated Tjuvholmen runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/place-open/tjuvholmen.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "build(tjuvholmen): bind verified THE THIEF brand logo in Place-open runtime"
            git reset --hard HEAD
            git clean -fd
            git fetch origin content/tjuvholmen-the-thief-brand-logo-20261112
            git rebase origin/content/tjuvholmen-the-thief-brand-logo-20261112
            git push origin HEAD:content/tjuvholmen-the-thief-brand-logo-20261112
          fi
