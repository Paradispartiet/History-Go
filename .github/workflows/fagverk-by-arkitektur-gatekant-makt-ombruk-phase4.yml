name: Fagverk By Arkitektur gatekant makt ombruk phase 4

on:
  pull_request:
    paths:
      - "data/fagverk/by/arkitektur-gatekant-makt-ombruk.json"
      - "data/fagverk/by/arkitektur-gatekant-makt-ombruk/**"
      - "data/fagverk/fagverk_registry.json"
      - "data/fagverk/subject_status.json"
      - "scripts/audit-fagverk-by-arkitektur-gatekant-makt-ombruk-phase4.mjs"
      - "tests/fagverk-by-arkitektur-gatekant-makt-ombruk-phase4.test.mjs"
      - ".github/workflows/fagverk-by-arkitektur-gatekant-makt-ombruk-phase4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Audit Arkitektur 12/12
        run: node scripts/audit-fagverk-by-arkitektur-gatekant-makt-ombruk-phase4.mjs
      - name: Test Arkitektur 12/12
        run: node --test tests/fagverk-by-arkitektur-gatekant-makt-ombruk-phase4.test.mjs
      - name: Preserve previous Arkitektur chapter
        run: node --test tests/fagverk-by-arkitektur-type-skala-phase4.test.mjs
      - name: Preserve By pilot
        run: node --test tests/fagverk-by-pilot.test.mjs
