name: Vitenskap final holistic diagnose

on:
  push:
    branches: [agent/vitenskap-final-holistic-university-breadth-completion-audit]
    paths:
      - '.github/workflows/vitenskap-final-holistic-diagnose.yml'
      - 'scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs'
      - 'tests/fagverk-vitenskap-holistic-university-breadth-completion.test.mjs'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitenskap-final-holistic-university-breadth-completion-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect canonical Vitenskap editorial field shapes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const emners = JSON.parse(fs.readFileSync('data/fag/vitenskap/emner_vitenskap_canonical_v4_6.json','utf8'));
          const registry = JSON.parse(fs.readFileSync('data/fagverk/fagverk_registry.json','utf8'));
          const methods = JSON.parse(fs.readFileSync('data/fag/vitenskap/methods_vitenskap_canonical_v4_6.json','utf8')).methods;
          const mappings = JSON.parse(fs.readFileSync('data/fag/vitenskap/emnemapping_vitenskap_canonical_v4_6.json','utf8'));
          const chapters = registry.subjects.vitenskap.chapters;
          const owned = new Set(chapters.flatMap(c => c.emne_ids || []));
          const methodIds = new Set(methods.map(m => m.method_id));
          const methodRefs = (e) => Array.isArray(e.methods) ? e.methods : Array.isArray(e.method_ids) ? e.method_ids : [];
          const questionRefs = (e) => Array.isArray(e.key_questions) ? e.key_questions : Array.isArray(e.questions) ? e.questions : Array.isArray(e.keyQuestions) ? e.keyQuestions : [];
          const lens = (field) => emners.map(e => (e[field] || '').trim().length).sort((a,b)=>a-b);
          const stats = (arr) => ({min:arr[0], median:arr[Math.floor(arr.length/2)], max:arr.at(-1)});
          const strictInvalid = emners.filter(e =>
            e.canonical_status !== 'canonical' || !e.title || !e.definition || !e.why_it_matters ||
            !Array.isArray(e.key_questions) || e.key_questions.length < 3 ||
            !Array.isArray(e.methods) || e.methods.length < 3 || !e.methods.every(id => methodIds.has(id))
          );
          const schemaAwareInvalid = emners.filter(e =>
            e.canonical_status !== 'canonical' || !e.title || !e.definition || !e.why_it_matters ||
            questionRefs(e).length < 3 || methodRefs(e).length < 3 || !methodRefs(e).every(id => methodIds.has(id))
          );
          const defs = emners.map(e => e.definition.trim());
          const mappingIds = new Set(mappings.map(m=>m.emne_id));
          const unowned = emners.filter(e=>!owned.has(e.emne_id));
          const byDomain = Object.fromEntries([...new Set(emners.map(e=>e.domain))].sort().map(d=>[d,emners.filter(e=>e.domain===d).length]));
          const fieldCounts = {
            methods: emners.filter(e=>Array.isArray(e.methods)).length,
            method_ids: emners.filter(e=>Array.isArray(e.method_ids)).length,
            bothMethodFields: emners.filter(e=>Array.isArray(e.methods)&&Array.isArray(e.method_ids)).length,
            neitherMethodField: emners.filter(e=>!Array.isArray(e.methods)&&!Array.isArray(e.method_ids)).length,
            key_questions: emners.filter(e=>Array.isArray(e.key_questions)).length,
            questions: emners.filter(e=>Array.isArray(e.questions)).length,
            keyQuestions: emners.filter(e=>Array.isArray(e.keyQuestions)).length
          };
          const distribution = (values) => Object.fromEntries([...new Set(values)].sort((a,b)=>a-b).map(v=>[v,values.filter(x=>x===v).length]));
          const statusDistribution = Object.fromEntries([...new Set(emners.map(e=>String(e.canonical_status)))].sort().map(v=>[v,emners.filter(e=>String(e.canonical_status)===v).length]));
          const sampleIds = [
            'em_vit_abstraksjon_forenkling',
            'em_vit_universitet_kunnskapsproduksjon',
            'em_vit_empiri_evidens',
            'em_vit_matematisk_bevis_og_deduksjon',
            'em_vit_biomedisinsk_mekanisme_og_modell'
          ];
          const sample = sampleIds.map(id => emners.find(e=>e.emne_id===id)).filter(Boolean).map(e=>({
            emne_id:e.emne_id,title:e.title,domain:e.domain,area_id:e.area_id,canonical_status:e.canonical_status,registry_version:e.registry_version,
            keys:Object.keys(e).sort(),definitionLength:(e.definition||'').length,whyItMattersLength:(e.why_it_matters||'').length,
            key_questions:e.key_questions,questions:e.questions,keyQuestions:e.keyQuestions,methods:e.methods,method_ids:e.method_ids,
            resolvedQuestionCount:questionRefs(e).length,resolvedMethodCount:methodRefs(e).length
          }));
          console.log(JSON.stringify({
            emneCount:emners.length,chapterCount:chapters.length,chapterOwnedEmneCount:owned.size,unownedEmneCount:unowned.length,
            strictInvalidEditorialEmneCount:strictInvalid.length,schemaAwareInvalidEditorialEmneCount:schemaAwareInvalid.length,
            duplicateDefinitionCount:defs.length-new Set(defs).size,duplicateTitleCount:emners.length-new Set(emners.map(e=>e.title.trim())).size,
            unmappedCount:emners.filter(e=>!mappingIds.has(e.emne_id)).length,
            definitionLength:stats(lens('definition')),whyItMattersLength:stats(lens('why_it_matters')),
            fieldCounts,statusDistribution,
            resolvedQuestionCountDistribution:distribution(emners.map(e=>questionRefs(e).length)),
            resolvedMethodCountDistribution:distribution(emners.map(e=>methodRefs(e).length)),
            byDomain,sample,
            schemaAwareInvalidIds:schemaAwareInvalid.map(e=>e.emne_id)
          }, null, 2));
          NODE
      - name: Verify current permanent Vitenskap gates
        run: |
          node scripts/audit-fagverk-vitenskap-breadth-reconciliation.mjs
          node scripts/audit-fagverk-vitenskap-pilot.mjs
          node scripts/audit-fagverk-vitenskap-university-readiness.mjs
          node scripts/audit-fagverk-vitenskap-unit1.mjs
          node scripts/audit-fagverk-vitenskap-mathematics-fulltext.mjs
          node scripts/audit-fagverk-vitenskap-physics-astronomy-fulltext.mjs
          node scripts/audit-fagverk-vitenskap-chemistry-material-science-fulltext.mjs
          node scripts/audit-fagverk-vitenskap-medicine-biomedicine-public-health-fulltext.mjs
      - name: Run holistic completion audit without mutating canonical state
        run: |
          node --check scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs
          node scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs --write-report --no-check-report
          node --test tests/fagverk-vitenskap-holistic-university-breadth-completion.test.mjs
          git diff --check
          git diff -- reports/fagverk/vitenskap-holistic-university-breadth-completion-audit.json
