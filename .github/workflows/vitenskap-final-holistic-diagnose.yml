name: Vitenskap final holistic diagnose

on:
  push:
    branches: [agent/vitenskap-final-holistic-university-breadth-completion-audit]
    paths:
      - '.github/workflows/vitenskap-final-holistic-diagnose.yml'
      - 'scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs'
      - 'tests/fagverk-vitenskap-holistic-university-breadth-completion.test.mjs'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitenskap-final-holistic-university-breadth-completion-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect canonical editorial thresholds and real gaps
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const emners = JSON.parse(fs.readFileSync('data/fag/vitenskap/emner_vitenskap_canonical_v4_6.json','utf8'));
          const registry = JSON.parse(fs.readFileSync('data/fagverk/fagverk_registry.json','utf8'));
          const owned = new Set(registry.subjects.vitenskap.chapters.flatMap(c => c.emne_ids || []));
          const methodCounts = Object.fromEntries([...new Set(emners.map(e=>e.methods.length))].sort((a,b)=>a-b).map(n=>[n,emners.filter(e=>e.methods.length===n).length]));
          const byVersion = Object.fromEntries([...new Set(emners.map(e=>e.registry_version))].sort().map(v=>[v,{
            count:emners.filter(e=>e.registry_version===v).length,
            methodCounts:Object.fromEntries([...new Set(emners.filter(e=>e.registry_version===v).map(e=>e.methods.length))].sort((a,b)=>a-b).map(n=>[n,emners.filter(e=>e.registry_version===v&&e.methods.length===n).length])),
            missingKeyQuestionCount:emners.filter(e=>e.registry_version===v&&(!Array.isArray(e.key_questions)||e.key_questions.length<3)).length
          }]));
          const missingQuestions = emners.filter(e=>!Array.isArray(e.key_questions)||e.key_questions.length<3).map(e=>({
            id:e.emne_id,title:e.title,domain:e.domain,registry_version:e.registry_version,chapterOwned:owned.has(e.emne_id),
            definition:e.definition,why_it_matters:e.why_it_matters,methods:e.methods,
            analysis_axes:e.analysis_axes,quiz_angles:e.quiz_angles,scope_guard:e.scope_guard,anti_patterns:e.anti_patterns,
            recommended_methods:e.recommended_methods
          }));
          const twoMethodExamples = emners.filter(e=>e.methods.length===2).slice(0,12).map(e=>({id:e.emne_id,title:e.title,registry_version:e.registry_version,methods:e.methods,method_gate_required:e.method_gate_required,recommended_methods:e.recommended_methods}));
          console.log(JSON.stringify({methodCounts,byVersion,missingQuestions,twoMethodExamples},null,2));
          NODE
          echo '--- Existing repository thresholds mentioning Vitenskap method/question counts ---'
          grep -R -n -E "key_questions.{0,60}(length|>=|<)|methods.{0,60}(length|>=|<)|method_ids.{0,60}(length|>=|<)" scripts tests data/fag/vitenskap/SET_MAL_README_vitenskap_v4_3.md 2>/dev/null \
            | grep -E "vitenskap|Vitenskap|emne|canonical" \
            | head -200 || true
      - name: Verify current permanent Vitenskap gates
        run: |
          node scripts/audit-fagverk-vitenskap-breadth-reconciliation.mjs
          node scripts/audit-fagverk-vitenskap-pilot.mjs
          node scripts/audit-fagverk-vitenskap-university-readiness.mjs
          node scripts/audit-fagverk-vitenskap-unit1.mjs
          node scripts/audit-fagverk-vitenskap-mathematics-fulltext.mjs
          node scripts/audit-fagverk-vitenskap-physics-astronomy-fulltext.mjs
          node scripts/audit-fagverk-vitenskap-chemistry-material-science-fulltext.mjs
          node scripts/audit-fagverk-vitenskap-medicine-biomedicine-public-health-fulltext.mjs
      - name: Run holistic completion audit without mutating canonical state
        run: |
          node --check scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs
          node scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs --write-report --no-check-report
          node --test tests/fagverk-vitenskap-holistic-university-breadth-completion.test.mjs
          git diff --check
          git diff -- reports/fagverk/vitenskap-holistic-university-breadth-completion-audit.json
