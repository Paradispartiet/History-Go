name: Vitenskap final holistic diagnose

on:
  push:
    branches: [agent/vitenskap-final-holistic-university-breadth-completion-audit]
    paths:
      - '.github/workflows/vitenskap-final-holistic-diagnose.yml'
      - 'scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs'
      - 'tests/fagverk-vitenskap-holistic-university-breadth-completion.test.mjs'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitenskap-final-holistic-university-breadth-completion-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Measure question originality and method-limit coverage
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const emners = JSON.parse(fs.readFileSync('data/fag/vitenskap/emner_vitenskap_canonical_v4_6.json','utf8'));
          const methods = JSON.parse(fs.readFileSync('data/fag/vitenskap/methods_vitenskap_canonical_v4_6.json','utf8')).methods;
          const norm = (s) => String(s||'').trim().replace(/\s+/g,' ');
          const setKey = (e) => JSON.stringify((e.key_questions||[]).map(norm));
          const group = new Map();
          for (const e of emners) {
            const key=setKey(e);
            if (!group.has(key)) group.set(key,[]);
            group.get(key).push(e.emne_id);
          }
          const reusedSets=[...group.entries()].map(([questions,ids])=>({count:ids.length,ids,questions:JSON.parse(questions)})).filter(x=>x.count>1).sort((a,b)=>b.count-a.count);
          const qFreq=new Map();
          for(const e of emners) for(const q of e.key_questions||[]) qFreq.set(norm(q),(qFreq.get(norm(q))||0)+1);
          const reusedQuestions=[...qFreq.entries()].map(([question,count])=>({count,question})).filter(x=>x.count>1).sort((a,b)=>b.count-a.count).slice(0,20);
          const missingQuestions=emners.filter(e=>(e.key_questions||[]).length<3).map(e=>({id:e.emne_id,title:e.title,domain:e.domain,definition:e.definition,why_it_matters:e.why_it_matters,analysis_axes:e.analysis_axes,methods:e.methods}));
          const methodKeyCounts=Object.fromEntries([...new Set(methods.flatMap(m=>Object.keys(m)))].sort().map(k=>[k,methods.filter(m=>Object.prototype.hasOwnProperty.call(m,k)).length]));
          const likelyLimitFields=['limitations','limits','limitations_and_uncertainty','uncertainty','failure_modes','caveats','blindspots','scope_guard','limitations_note'];
          const methodLimitCoverage=Object.fromEntries(likelyLimitFields.map(k=>[k,methods.filter(m=>m[k] && (Array.isArray(m[k])?m[k].length:String(m[k]).trim().length)).length]));
          const methodSamples=methods.slice(0,4).map(m=>Object.fromEntries(Object.entries(m).filter(([k])=>['method_id','title','label','definition','limitations','limits','limitations_and_uncertainty','uncertainty','failure_modes','caveats','blindspots','scope_guard','when_to_use','what_it_can_not_show'].includes(k))));
          console.log(JSON.stringify({
            emneCount:emners.length,
            uniqueQuestionSetCount:group.size,
            reusedQuestionSetCount:reusedSets.length,
            emnersInReusedQuestionSets:reusedSets.reduce((s,x)=>s+x.count,0),
            largestReusedQuestionSets:reusedSets.slice(0,10),
            reusedIndividualQuestions:reusedQuestions,
            missingQuestions,
            methodCatalogCount:methods.length,
            methodKeyCounts,
            methodLimitCoverage,
            methodSamples
          },null,2));
          NODE
      - name: Verify current permanent Vitenskap gates
        run: |
          node scripts/audit-fagverk-vitenskap-breadth-reconciliation.mjs
          node scripts/audit-fagverk-vitenskap-pilot.mjs
          node scripts/audit-fagverk-vitenskap-university-readiness.mjs
          node scripts/audit-fagverk-vitenskap-unit1.mjs
          node scripts/audit-fagverk-vitenskap-mathematics-fulltext.mjs
          node scripts/audit-fagverk-vitenskap-physics-astronomy-fulltext.mjs
          node scripts/audit-fagverk-vitenskap-chemistry-material-science-fulltext.mjs
          node scripts/audit-fagverk-vitenskap-medicine-biomedicine-public-health-fulltext.mjs
      - name: Run holistic completion audit without mutating canonical state
        run: |
          node --check scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs
          node scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs --write-report --no-check-report
          node --test tests/fagverk-vitenskap-holistic-university-breadth-completion.test.mjs
          git diff --check
