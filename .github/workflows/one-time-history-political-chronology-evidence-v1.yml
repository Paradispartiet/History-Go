name: One-time History political chronology evidence V1

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/history-political-chronology-evidence-v1-trigger.txt'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/history-political-chronology-evidence-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize political chronology evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/historie-theory-evidence/political-chronology-v1-validation
          node --check tools/materialize-history-political-chronology-evidence-v1.mjs 2>&1 \
            | tee reports/historie-theory-evidence/political-chronology-v1-validation/materializer-syntax.log
          node tools/materialize-history-political-chronology-evidence-v1.mjs 2>&1 \
            | tee reports/historie-theory-evidence/political-chronology-v1-validation/materializer.log

      - name: Validate profile, theory evidence and universal integration
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/validate-historie-profile-evidence.mjs 2>&1 \
            | tee reports/historie-theory-evidence/political-chronology-v1-validation/profile-validator-syntax.log
          node tools/validate-historie-profile-evidence.mjs 2>&1 \
            | tee reports/historie-theory-evidence/political-chronology-v1-validation/profile-validator.log
          node --check tools/validate-historie-theory-evidence.mjs 2>&1 \
            | tee reports/historie-theory-evidence/political-chronology-v1-validation/theory-validator-syntax.log
          node tools/validate-historie-theory-evidence.mjs 2>&1 \
            | tee reports/historie-theory-evidence/political-chronology-v1-validation/theory-validator.log
          node tools/validate-historie-theory-evidence.mjs --check 2>&1 \
            | tee reports/historie-theory-evidence/political-chronology-v1-validation/theory-validator-check.log
          node tools/audit-historie-universal-coverage.mjs 2>&1 \
            | tee reports/historie-theory-evidence/political-chronology-v1-validation/universal-coverage.log
          node tools/audit-historie-universal-coverage.mjs --check 2>&1 \
            | tee reports/historie-theory-evidence/political-chronology-v1-validation/universal-coverage-check.log

      - name: Verify frozen V5.8 base
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-historie-v5-5-quality-depth.mjs 2>&1 \
            | tee reports/historie-theory-evidence/political-chronology-v1-validation/quality-freeze.log
          git restore -- reports/historie-v5/historie-v5-8-quality-depth.json reports/historie-v5/historie-v5-8-quality-depth.md 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-political-chronology-evidence-v1-diagnostics
          path: |
            reports/historie-theory-evidence/political-chronology-v1-validation
            reports/historie-theory-evidence/history-theory-evidence-foundation-v1.json
            reports/historie-theory-evidence/history-theory-evidence-foundation-v1.md
            reports/historie-theory-evidence/history-theory-evidence-gap-inventory-v2.json
            reports/historie-theory-evidence/history-theory-evidence-gap-inventory-v2.md
            reports/historie-universal-coverage/historie-universal-coverage.json
            reports/historie-universal-coverage/historie-universal-coverage.md
          if-no-files-found: error

      - name: Remove one-time transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/materialize-history-political-chronology-evidence-v1.mjs
          rm -f .github/workflows/one-time-history-political-chronology-evidence-v1.yml
          rm -f .github/history-political-chronology-evidence-v1-trigger.txt

      - name: Commit clean production diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check 2>&1 \
            | tee reports/historie-theory-evidence/political-chronology-v1-validation/git-diff-check.log
          git status --short \
            | tee reports/historie-theory-evidence/political-chronology-v1-validation/git-status.log
          git add -A
          git add -f reports/historie-theory-evidence/political-chronology-v1-validation
          git add -f reports/historie-theory-evidence/history-theory-evidence-gap-inventory-v2.json
          git add -f reports/historie-theory-evidence/history-theory-evidence-gap-inventory-v2.md
          git commit -m "Build History political chronology evidence V1"
          git push origin HEAD:agent/history-political-chronology-evidence-v1
