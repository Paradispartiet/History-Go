name: Finish Philosophy major-field expansion

on:
  push:
    branches:
      - agent/expand-philosophy-core-fields
    paths:
      - .github/workflows/finish-philosophy-major-fields.yml

permissions:
  contents: write

# Temporary deterministic closer: materialize, rebuild every derived report, run the
# permanent quality gates separately, then commit the generated expansion. Temporary
# workflows are removed afterward with the authenticated GitHub connector.
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/expand-philosophy-core-fields
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate materializer syntax
        run: node --check scripts/materialize-filosofi-major-field-coverage.mjs

      - name: Materialize seven missing major fields
        run: node scripts/materialize-filosofi-major-field-coverage.mjs

      - name: Validate Philosophy theory quality
        run: node tools/validate-filosofi-theory-quality.mjs

      - name: Write Philosophy phase3 report
        run: node scripts/audit-fagverk-filosofi-phase3.mjs --write-report --no-check-report

      - name: Rebuild subject inventory
        run: node scripts/audit-fagverk-subject-inventory.mjs

      - name: Rebuild and verify general engine
        run: |
          node scripts/audit-fagverk-general-engine.mjs --write-report --no-check-report
          node scripts/audit-fagverk-general-engine.mjs

      - name: Rebuild release manifest
        run: node scripts/build-fagverk-release-manifest.mjs

      - name: Check Philosophy phase3 audit
        run: node scripts/audit-fagverk-filosofi-phase3.mjs

      - name: Check general engine audit
        run: node scripts/audit-fagverk-general-engine.mjs

      - name: Check release manifest
        run: node scripts/build-fagverk-release-manifest.mjs --check

      - name: Refresh Philosophy general-engine snapshot
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const coverage = JSON.parse(fs.readFileSync('data/fagverk/filosofi/filosofi_field_coverage_v1.json', 'utf8'));
          const E = coverage.expected_counts;
          const file = 'tests/fagverk-general-engine.test.mjs';
          let text = fs.readFileSync(file, 'utf8');
          const replacements = [
            ['assert.equal(filosofi.domainCount, 13);', `assert.equal(filosofi.domainCount, ${E.domains});`],
            ['assert.equal(filosofi.emneCount, 54);', `assert.equal(filosofi.emneCount, ${E.articles});`],
            ['assert.equal(filosofi.methodCount, 27);', `assert.equal(filosofi.methodCount, ${E.methods});`],
            ['assert.equal(filosofi.mappingCount, 54);', `assert.equal(filosofi.mappingCount, ${E.articles});`],
            ['assert.equal(filosofi.hookCount, 37);', `assert.equal(filosofi.hookCount, ${E.hooks});`],
            ['assert.equal(filosofi.chapterCount, 13);', `assert.equal(filosofi.chapterCount, ${E.chapters});`]
          ];
          for (const [from, to] of replacements) {
            if (!text.includes(from) && !text.includes(to)) throw new Error(`Missing general-engine snapshot anchor: ${from}`);
            text = text.replace(from, to);
          }
          fs.writeFileSync(file, text);
          NODE

      - name: Test subject inventory
        run: node --test tests/fagverk-subject-inventory.test.mjs

      - name: Test general engine
        if: always()
        run: node --test tests/fagverk-general-engine.test.mjs

      - name: Test release manifest
        if: always()
        run: node --test tests/fagverk-release-manifest.test.mjs

      - name: Test Philosophy phase3
        if: always()
        run: node --test tests/fagverk-filosofi-phase3.test.mjs

      - name: Test Philosophy complete
        if: always()
        run: node --test tests/fagverk-filosofi-complete.test.mjs

      - name: Test Philosophy editorial style
        if: always()
        run: node --test tests/fagverk-filosofi-editorial-style.test.mjs

      - name: Test Philosophy university depth
        if: always()
        run: node --test tests/fagverk-filosofi-university-depth.test.mjs

      - name: Test Philosophy field coverage
        if: always()
        run: node --test tests/fagverk-filosofi-field-coverage.test.mjs

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Remove temporary materializer
        run: git rm --ignore-unmatch scripts/materialize-filosofi-major-field-coverage.mjs

      - name: Stage permanent Philosophy expansion
        run: |
          git add -A
          git status --short

      - name: Check staged Philosophy diff
        run: git diff --cached --check

      - name: Commit permanent Philosophy expansion
        run: git commit -m "Expand Philosophy to full major-field coverage"

      - name: Push permanent Philosophy expansion
        run: git push origin HEAD:agent/expand-philosophy-core-fields
