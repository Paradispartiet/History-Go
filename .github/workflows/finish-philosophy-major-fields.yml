name: Finish Philosophy major-field expansion

on:
  push:
    branches:
      - agent/expand-philosophy-core-fields
    paths:
      - .github/workflows/finish-philosophy-major-fields.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/expand-philosophy-core-fields
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate materializer syntax
        run: node --check scripts/materialize-filosofi-major-field-coverage.mjs

      - name: Materialize seven missing major fields
        run: node scripts/materialize-filosofi-major-field-coverage.mjs

      - name: Validate Philosophy theory quality
        run: node tools/validate-filosofi-theory-quality.mjs

      - name: Write Philosophy phase3 report
        run: node scripts/audit-fagverk-filosofi-phase3.mjs --write-report --no-check-report

      - name: Rebuild subject inventory
        run: node scripts/audit-fagverk-subject-inventory.mjs

      - name: Rebuild general engine
        run: node scripts/audit-fagverk-general-engine.mjs

      - name: Rebuild release manifest
        run: node scripts/build-fagverk-release-manifest.mjs

      - name: Validate permanent Philosophy quality gates
        run: |
          node scripts/audit-fagverk-filosofi-phase3.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
          node --test \
            tests/fagverk-filosofi-phase3.test.mjs \
            tests/fagverk-filosofi-complete.test.mjs \
            tests/fagverk-filosofi-editorial-style.test.mjs \
            tests/fagverk-filosofi-university-depth.test.mjs \
            tests/fagverk-filosofi-field-coverage.test.mjs

      - name: Commit only permanent Philosophy expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/materialize-filosofi-major-field-coverage.mjs
          git rm .github/workflows/materialize-filosofi-major-field-coverage.yml
          git rm .github/workflows/finish-philosophy-major-fields.yml
          git add -A
          git status --short
          git diff --cached --check
          git commit -m "Expand Philosophy to full major-field coverage"
          git push origin HEAD:agent/expand-philosophy-core-fields
