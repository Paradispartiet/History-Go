name: Generate Tollbukaia production

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/oslo-quiz-tollbukaia-5x7' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-quiz-tollbukaia-5x7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate canonical package
        run: |
          perl -0pi -e 's/Flatquizen hadde riktig kjerne: Tollbukaia\/Tollboden-området var knyttet til havnevarer, tollbehandling og kontroll\./Tollbukaia og Tollboden-området var knyttet til havnevarer, tollbehandling og kontroll./g' scripts/repair-tollbukaia-production.mjs
          node scripts/repair-tollbukaia-production.mjs
      - name: Commit generated files
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fag/fag_manifest.json \
            data/quiz/naeringsliv/tollbukaia_sets_merged.json \
            data/quiz/production_briefs/naeringsliv/tollbukaia.json \
            data/quiz/production_context/naeringsliv/tollbukaia.json \
            tests/quiz-production-pipeline.test.mjs
          git commit -m "Rydd Tollbukaia-forklaringer"
          git push origin HEAD:agent/oslo-quiz-tollbukaia-5x7
