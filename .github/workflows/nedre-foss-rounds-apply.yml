              'story':'Før Grünerløkka var en bydel, var fossen allerede en arbeidsplass. Oslo kommune daterer etableringen av en mølle her til perioden mellom 1148 og 1200, mens den sikre skriftlige omtalen kommer i 1220, da kverna nevnes under Hovedøya kloster. Korn kom til et sted der vannets fall kunne gjøre det tunge arbeidet, og Nedre Foss ble en del av middelalderens økonomiske landskap.\n\nEtter reformasjonen overtok kronen. Mølla ble kjent som Kongens mølle og hadde et privilegium på kornmaling i området rundt Christiania. I 1672 kjøpte Friederich Grüner Nedre Foss. Familien kom til å eie stedet i to perioder, og den store jordveien rundt gården ble siden stykket opp under byveksten. Navnet Grünerløkka bærer derfor fortsatt et minne om eierne ved fossen.\n\nProduksjonen forsvant ikke da byen vokste. Hovedbygningen fra 1801/1802 ble stående, mølleanleggene ble modernisert, og en ny kornsilo reiste seg i 1953. Da siloen i 2001 ble bygd om til studentboliger, fikk et bygg laget for korn en helt ny funksjon, men beholdt den karakteristiske formen som fortsatt markerer stedet.\n\nDagens Nedre Foss park gjør historien til en del av hverdagen. Et møllehjul inngår i lekelandskapet, turveier fører folk nærmere vannet, en laksetrapp hjelper fisk forbi fossen, og regnbed tar imot overvann. Det gamle kraftpunktet har dermed ikke mistet forbindelsen til vannet; forholdet har bare skiftet fra å hente mest mulig energi ut av elva til også å gi plass til natur, klimatilpasning, lek og offentlig byliv.',
              'sources':[{'title':s['label'],'url':s['url']} for s in sources],
