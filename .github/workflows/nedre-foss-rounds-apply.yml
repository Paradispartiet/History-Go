                  'places':['nedre_foss'],'image':'','cardImage':'','emne_ids':['em_by_historiske_lag_i_hverdagsrom','em_by_industri_havn_logistikk'],'source_urls':[sources[1]['url'],sources[2]['url'],sources[6]['url']]
              },
