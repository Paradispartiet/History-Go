                  'id':'hans_gruner_nedre_foss','name':'Hans Grüner','initials':'HG','desc':'Eier i Grüner-familien som satte fart i utparselleringen av Nedre Foss-eiendommens jordvei under framveksten av Grünerløkka.','tags':['historie','byutvikling','grunerlokka','eierskap'],'placeId':'nedre_foss','category':'historie','year':1858,
