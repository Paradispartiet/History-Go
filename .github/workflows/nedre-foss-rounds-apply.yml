                  'primary_angles': ['middelalder_og_klosterokonomi','vannkraft_og_mollebruk','kongemakt_og_privilegier','eierskap_og_byvekst','industriell_kontinuitet','miljopark_og_byomforming'],
                  'question_families': ['historisk_endring','stedsspesifikk_funksjon','person_og_eierskap','verk_og_bygning','for_nå','kildekritikk'],
                  'avoid_angles': ['generisk_akerselva','udokumenterte_geologipastander','hardkoding_av_skiftende_virksomheter','late_som_1148_1200_er_forste_skriftlige_belegg'],
