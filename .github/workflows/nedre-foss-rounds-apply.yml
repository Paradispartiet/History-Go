name: Apply Nedre Foss history rounds batch

on:
  push:
    branches: [agent/fill-nedre-foss-history-rounds-batch1]
    paths:
      - '.github/workflows/nedre-foss-rounds-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fill-nedre-foss-history-rounds-batch1
          fetch-depth: 0

      - name: Materialize canonical Nedre Foss batch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p reports/nedre-foss-rounds-batch1/validation

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def read(path):
              return json.loads(Path(path).read_text())

          def write(path, value):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n')

          def upsert(rows, value, key='id'):
              for i, row in enumerate(rows):
                  if row.get(key) == value.get(key):
                      rows[i] = value
                      return
              rows.append(value)

          place_path = Path('data/places/natur/oslo/places_oslo_natur_akerselvarute/nedre_foss.json')
          place = read(place_path)
          original_anchor = (place['lat'], place['lon'], place['r'])
          assert original_anchor == (59.9256, 10.7435, 140)

          sources = [
              {'type':'reference','label':'Oslo kommune – Nedre Foss park','url':'https://www.oslo.kommune.no/natur-kultur-og-fritid/tur-og-friluftsliv/parker-og-lekeplasser/nedre-foss-park','lang':'nb','verifiedAt':'2026-07-19'},
              {'type':'reference','label':'Store norske leksikon – Foss (Oslo)','url':'https://snl.no/Foss_-_Oslo','lang':'nb','verifiedAt':'2026-07-19'},
              {'type':'reference','label':'Oslo byleksikon – Foss gård','url':'https://oslobyleksikon.no/side/Foss_g%C3%A5rd','lang':'nb','verifiedAt':'2026-07-19'},
              {'type':'reference','label':'Industrimuseum – Akerselva Digitalt','url':'https://www.industrimuseum.no/akerselvadigitalt','lang':'nb','verifiedAt':'2026-07-19'},
              {'type':'reference','label':'Oslo kommune / Byarkivet – Energien i elva','url':'https://www.oslo.kommune.no/OBA/tobias/tobiasartikler/Tob2007-2-3_3.htm','lang':'nb','verifiedAt':'2026-07-19'},
              {'type':'reference','label':'Oslo byleksikon – Akerselva Miljøpark','url':'https://oslobyleksikon.no/side/Akerselva_Milj%C3%B8park','lang':'nb','verifiedAt':'2026-07-19'},
              {'type':'reference','label':'Store norske leksikon – Grüner','url':'https://snl.no/Gr%C3%BCner','lang':'nb','verifiedAt':'2026-07-19'},
              {'type':'reference','label':'Oslo byleksikon – Grünerløkka','url':'https://oslobyleksikon.no/index.php/Gr%C3%BCnerl%C3%B8kka_%28str%C3%B8k%29','lang':'nb','verifiedAt':'2026-07-19'}
          ]

          place.update({
              'name': 'Nedre Foss',
              'year': 1220,
              'desc': 'Møllested dokumentert i 1220 ved Akerselvas nederste foss, senere Kongens mølle og et av byens lengstlevende vannkraft- og produksjonssteder.',
              'popupDesc': 'Nedre Foss er den nederste fossen i Akerselva og et av de eldste dokumenterte produksjonsstedene langs elva. Oslo kommune knytter den første mølla til cisterciensermunkene på Hovedøya i perioden mellom klostergrunnleggelsen i 1148 og 1200, mens skriftlige kilder omtaler kverna under Hovedøya kloster i 1220. Etter reformasjonen ble anlegget krongods og kjent som «Kongens mølle».\n\nFamilien Grüner eide Nedre Foss i to perioder, og eiendommen ga navn til Grünerløkka da jordveien senere ble utparsellert. Mølledriften fortsatte i ulike former gjennom århundrene. Hovedbygningen fra 1801/1802 står fortsatt, og kornsiloen fra 1953 ble ombygd til studentboliger i 2001. Dagens Nedre Foss park bruker møllehistorien aktivt i lekelandskapet, samtidig som laksetrapp, regnbed og nye ganglinjer viser hvordan et gammelt produksjonslandskap også er blitt grøntdrag og bynatur.',
              'tags': ['akerselva','foss','middelalder','kornmolle','kongens_molle','vannkraft','gruner','industrihistorie','kornsilo','byomforming','miljopark','bynatur'],
              'emne_ids': ['em_by_industri_havn_logistikk','em_by_historiske_lag_i_hverdagsrom'],
              'quiz_profile': {
                  'place_type': 'middelaldersk møllested, foss og transformert produksjonslandskap',
                  'subtype': 'akerselva_kornmolle_kongens_molle_og_miljopark',
                  'signature_features': [
