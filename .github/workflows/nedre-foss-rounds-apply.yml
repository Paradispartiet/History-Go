                  {'id':'nedre_foss_hovedbygning_1801','title':'Nedre Foss hovedbygning','type':'historisk_bygning','kind':'estate_main_building','year':1801,'desc':'Hovedbygningen ble oppført i 1801/1802 og står fortsatt som et fysisk anker for gårds- og møllehistorien.','why_here':'Bygningen gjør det eldre Nedre Foss-miljøet lesbart ved siden av senere industri- og parklandskap.'},
                  {'id':'nedre_foss_kornsilo_1953','title':'Kornsiloen på Nedre Foss','type':'industribygning','kind':'grain_silo','year':1953,'desc':'Kornsiloen ble reist i 1953 som del av den fortsatte kornvirksomheten ved Nedre Foss.','why_here':'Siloen viderefører stedets lange kornhistorie i en moderne industriell form.'},
                  {'id':'nedre_foss_studenthus_2001','title':'Grünerløkka studenthus','type':'ombruk','kind':'adaptive_reuse','year':2001,'desc':'Den tidligere kornsiloen ble ombygd til studentboliger i 2001.','why_here':'Ombyggingen er et tydelig eksempel på hvordan industriarv kan få en helt ny funksjon uten at bygningsformen forsvinner.'},
                  {'id':'nedre_foss_mollelekeplass','title':'Det mølleinspirerte lekelandskapet','type':'parkinstallasjon','kind':'historical_play_landscape','year':None,'desc':'Lekelandskapet i Nedre Foss park bruker blant annet et møllehjul som fysisk fortelling om stedets historie.','why_here':'Historien er bygget inn i dagens bruk av parken og kan oppdages gjennom aktivitet, ikke bare skilt.'},
                  {'id':'nedre_foss_laksetrapp','title':'Laksetrappen ved Nedre Foss','type':'miljotiltak','kind':'fish_passage','year':None,'desc':'Laksetrappen på østsiden av fossen gjør det mulig for fisk å passere fossen på vei mot gyteområder.','why_here':'Tiltaket viser hvordan et historisk kraftpunkt i dag også forvaltes som levende elveøkologi.'},
                  {'id':'nedre_foss_regnbed','title':'Regnbedene i Nedre Foss park','type':'klimatiltak','kind':'stormwater_management','year':None,'desc':'Regnbed er anlagt for å redusere overvann i et område som har vært utsatt for flom ved kraftig nedbør.','why_here':'De knytter dagens klimatilpasning til et sted som alltid har vært formet av vann.'}
              ],
              'civication_store': [
                  {'id':'nedre_foss_mollehjul_modell','title':'Møllehjulet ved Nedre Foss','type':'mollehjulmodell','kind':'physical_object','desc':'En fysisk miniatyr inspirert av møllehjulet i parkens lekelandskap.','placeSpecificReason':'Møllehjulet brukes i dagens park for å fortelle akkurat Nedre Foss sin lange møllehistorie.','historicalFunction':'Viser hvordan fossens vannkraft ble omsatt til mekanisk arbeid.','physicalObject':True,'placeSpecific':True,'storePrice':35,'currency':'PC','collection':'nedre_foss_vann_og_molle','collectable':True,'source_urls':[sources[0]['url'],sources[4]['url']]},
                  {'id':'nedre_foss_kongens_molle_skilt','title':'Kongens mølle','type':'historisk_skilt','kind':'physical_object','desc':'Et samlerobjekt utformet som et historisk mølleskilt med Nedre Foss som sted.','placeSpecificReason':'Betegnelsen Kongens mølle er direkte knyttet til Nedre Foss etter reformasjonen.','historicalFunction':'Markerer overgangen fra klostereiendom til krongods.','physicalObject':True,'placeSpecific':True,'storePrice':28,'currency':'PC','collection':'nedre_foss_vann_og_molle','collectable':True,'source_urls':[sources[1]['url'],sources[2]['url']]},
                  {'id':'nedre_foss_silo_minimodell','title':'Kornsiloen fra 1953','type':'bygningsminiatyr','kind':'physical_object','desc':'En liten modell av den runde kornsiloen som senere ble Grünerløkka studenthus.','placeSpecificReason':'Siloformen er et av de tydeligste fysiske sporene etter den moderne kornvirksomheten på Nedre Foss.','historicalFunction':'Viser kontinuiteten fra middelalderens kornmølle til moderne lagring og senere boligombruk.','physicalObject':True,'placeSpecific':True,'storePrice':42,'currency':'PC','collection':'nedre_foss_vann_og_molle','collectable':True,'source_urls':[sources[1]['url'],sources[3]['url']]},
                  {'id':'nedre_foss_laksetrapp_kort','title':'Laksetrappen','type':'landskapsmodell','kind':'physical_object','desc':'Et fysisk detaljkort som viser prinsippet bak fiskepassasjen ved fossen.','placeSpecificReason':'Laksetrappen ligger ved Nedre Foss og er en del av dagens økologiske elveforvaltning.','historicalFunction':'Setter dagens naturtiltak opp mot århundrer med menneskelig utnyttelse av fossen.','physicalObject':True,'placeSpecific':True,'storePrice':20,'currency':'PC','collection':'nedre_foss_vann_og_molle','collectable':True,'source_urls':[sources[0]['url']]}
              ],
              'brands': [
                  {'id':'hovedoya_kloster_nedre_foss','name':'Hovedøya kloster','brand_kind':'historical_institution','brand_type':'medieval_mill_owner'},
                  {'id':'kronen_kongens_molle','name':'Kronen / Kongens mølle','brand_kind':'historical_state_owner','brand_type':'royal_mill_context'},
                  {'id':'familien_gruner_nedre_foss','name':'Familien Grüner','brand_kind':'historical_owner_family','brand_type':'estate_and_mill_ownership'},
                  {'id':'bjolsen_valsemolle_nedre_foss','name':'Bjølsen Valsemølle','brand_kind':'historical_industry','brand_type':'later_mill_operation'},
                  {'id':'studentsamskipnaden_nedre_foss','name':'Studentsamskipnaden / Grünerløkka studenthus','brand_kind':'adaptive_reuse','brand_type':'silo_to_student_housing'},
                  {'id':'oslo_kommune_nedre_foss_park','name':'Oslo kommune','brand_kind':'municipality','brand_type':'park_and_environmental_management'},
                  {'id':'akerselva_miljopark_nedre_foss','name':'Akerselva Miljøpark','brand_kind':'environmental_program','brand_type':'river_corridor_conservation'}
              ],
              'for_na': {
                  'title':'Fra klostermølle til miljøpark',
                  'before':'I middelalderen lå en kornmølle under Hovedøya kloster ved fossen. Etter reformasjonen ble den Kongens mølle. I århundrene som fulgte fortsatte vannkraft, kornmaling, eierskap og industri å organisere området, før moderne møllevirksomhet gradvis opphørte på 1900-tallet.',
                  'now':'I dag er Nedre Foss både historisk landskap og offentlig park. Hovedbygningen og den ombygde siloen gjør eldre lag synlige, mens lekelandskap, turvei, laksetrapp og regnbed gir stedet nye sosiale og økologiske funksjoner.',
                  'change':'Det grunnleggende skiftet går fra vann som produksjonskraft til vann som både kulturarv, naturkorridor, klimatilpasning og offentlig byrom. Samtidig er møllehistorien fortsatt selve fortolkningsnøkkelen til stedet.',
                  'look_for':['selve fallet og vannets fart','hovedbygningen fra 1801/1802','den runde kornsiloen som er blitt studenthus','møllehjulet i lekelandskapet','laksetrappen på østsiden av fossen','regnbed og overvannsløsninger','ganglinjene som åpner elverommet for publikum','kontrasten mellom gamle produksjonsspor og ny parkbruk']
              },
              'nature_profile': {
                  'type':'urban foss / Akerselva / fiskepassasje / klimatilpasning',
                  'title':'Fossen som både kraftmaskin og levende elverom',
                  'summary':'Nature-rundingen ved Nedre Foss tar utgangspunkt i selve vannfallet og i hvordan samme vannsystem har fått skiftende roller. Fossen ga energi til møller i århundrer, men dagens elverom forvaltes også som naturkorridor og offentlig park. På østsiden ligger en laksetrapp som hjelper fisk forbi fossen, og i parken er det anlagt regnbed som håndterer overvann i et område med flomutfordringer. Besøkende kan derfor lese vann på minst tre måter samtidig: som historisk kraftressurs, som levende økologisk forbindelse og som moderne klimarisiko. Rundingen skal holde seg til dokumenterte fysiske tiltak og observerbare forhold ved elva, og skal ikke dikte opp artsinventar eller presis geologi.',
                  'themes':['foss og vannhastighet','Akerselva som blågrønn korridor','laksetrapp og fiskepassasje','regnbed og overvann','historisk vannkraft','elvekant i tett by','miljøpark og tilgjengelighet','møtet mellom kulturminne og bynatur'],
                  'nearby_place_ids':['kuba_parken','beierbrua','vulkan_industriomrade','elvestrekning_bla_brenneriveien']
              },
              'research_notes': [
                  {'id':'nedre_foss_current_businesses','claim':'Nåværende virksomheter i området kan endres og skal ikke hardkodes uten ny kildekontroll.','status':'time_sensitive','use_in_app':False,'next_source_needed':'Offisielle virksomhets- eller arrangementsider ved behov.'},
                  {'id':'nedre_foss_precise_geology_claims','claim':'Presise geologipåstander om synlig berg ved fossen krever egen geologisk kilde.','status':'needs_primary_source_check','use_in_app':False,'next_source_needed':'Naturhistorisk museum eller annen geologisk fagkilde.'}
              ],
              'source_summary': {
