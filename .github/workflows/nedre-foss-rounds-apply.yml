              'id':'st_nedre_foss_mollen_som_varte_i_arhundrer','type':'medieval_mill_waterpower_urban_transformation','title':'Mølla som varte i århundrer','year':1220,'place_id':'nedre_foss','person_id':'friederich_gruner',
