                  {'id':'nedre_foss_middelaldermollen','title':'Mølla ved Nedre Foss','type':'produksjonsanlegg','kind':'water_powered_grain_mill','year':1220,'desc':'Kverna er dokumentert under Hovedøya kloster i 1220; Oslo kommune daterer etableringen av en mølle på stedet til perioden 1148–1200.','why_here':'Fossen ga den energien som gjorde langvarig kornmaling mulig på akkurat dette stedet.'},
                  {'id':'nedre_foss_kongens_molle','title':'Kongens mølle','type':'historisk_driftsform','kind':'royal_grain_mill','year':1537,'desc':'Etter reformasjonen ble Nedre Foss krongods og mølla kjent som Kongens mølle.','why_here':'Den kongelige overtakelsen viser hvordan et klosterøkonomisk anlegg ble del av statens eiendom og forsyningssystem.'},
