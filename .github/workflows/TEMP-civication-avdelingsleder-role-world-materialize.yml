name: TEMP Materialize Avdelingsleder Role World

on:
  push:
    branches:
      - agent/civication-naeringsliv-avdelingsleder-role-world-rollout
    paths:
      - scripts/TEMP_materialize_avdelingsleder_role_world.mjs
      - tests/civication-naeringsliv-avdelingsleder-role-world-rollout.test.js
      - .github/workflows/TEMP-civication-avdelingsleder-role-world-materialize.yml

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-naeringsliv-avdelingsleder-role-world-rollout
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize permanent authored data
        run: node scripts/TEMP_materialize_avdelingsleder_role_world.mjs
      - name: Normalize approval-required authority attempt
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalogPath = 'data/Civication/mailFamilies/naeringsliv/consequence/avdelingsleder_consequence.json';
          const catalog = JSON.parse(fs.readFileSync(catalogPath, 'utf8'));
          const mail = catalog.families.flatMap(family => family.mails || []).find(item => item.id === 'naeringsliv_avdelingsleder_realism_capacity_case_close_001');
          if (!mail) throw new Error('Missing Avdelingsleder close scene after materialization');
          const candidate = mail.choices?.find(choice => choice.id === 'B');
          if (candidate?.authority_action?.action_id !== 'approve_budget_exception' || candidate.authority_action.intent !== 'approve') {
            throw new Error('Unexpected authority-action source shape; refusing blind rewrite');
          }
          candidate.authority_action.intent = 'execute';
          fs.writeFileSync(catalogPath, JSON.stringify(catalog, null, 2) + '\n');

          const testPath = 'tests/civication-naeringsliv-avdelingsleder-role-world-rollout.test.js';
          const source = fs.readFileSync(testPath, 'utf8');
          const before = "assert.equal(close.choices[1].authority_action.intent, 'approve');";
          const after = "assert.equal(close.choices[1].authority_action.intent, 'execute');";
          if (!source.includes(before)) throw new Error('Expected strict-test authority assertion not found');
          fs.writeFileSync(testPath, source.replace(before, after));
          NODE
      - name: Regenerate scene registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Regenerate career gameplay audit
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Regenerate rollout readiness
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify focused rollout and canonical gates
        run: |
          node tests/civication-naeringsliv-avdelingsleder-role-world-rollout.test.js
          node tests/civication-avdelingsleder-playability.test.js
          node tests/civication-role-world-contract.test.js
          node tests/civication-role-world-broad-rollout-policy.test.js
          node scripts/build-civication-scene-registry.mjs --check
          node scripts/audit-civication-career-gameplay.mjs --check
          node scripts/audit-civication-role-world-rollout-readiness.mjs --check
      - name: Run full Civication suite
        run: npm run test:civication
      - name: Remove temporary materialization surface
        run: |
          rm scripts/TEMP_materialize_avdelingsleder_role_world.mjs
          rm .github/workflows/TEMP-civication-avdelingsleder-role-world-materialize.yml
      - name: Commit exact verified result
        run: |
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Næringsliv Avdelingsleder Role World rollout"
          git push origin HEAD:agent/civication-naeringsliv-avdelingsleder-role-world-rollout
