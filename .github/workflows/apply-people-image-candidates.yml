name: Apply approved people image candidates (manual, safe)

on:
  # Controlled, reviewed source-selection request; generates a draft PR only.
  push:
    branches: [main]
    paths:
      - data/people/portrait_image_apply_request.json
  workflow_dispatch:
    inputs:
      approved_ids:
        description: "Comma-separated people IDs to apply (legacy only when one candidate per person)"
        required: false
        default: ""
      review_payload:
        description: "Review payload copied from people image review page"
        required: false
        type: string
        default: ""
      write_output:
        description: "Download images and update people data"
        required: true
        type: choice
        options: ["false", "true"]
        default: "false"
      open_draft_pr:
        description: "Commit output to an automation branch and open a draft PR"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-approved-people-images:
    name: Apply reviewed people image candidates
    runs-on: ubuntu-latest
    env:
      APPROVED_IDS: ${{ inputs.approved_ids }}
      REVIEW_PAYLOAD: ${{ inputs.review_payload }}
      REPORT_DIR: reports/people-image-apply
      CANDIDATE_FILE: data/people/people_image_candidates.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies and build tools
        run: |
          npm ci
          npm run build:tools
          mkdir -p "$REPORT_DIR"

      - name: Load reviewed selections from production request
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const request = JSON.parse(fs.readFileSync('data/people/portrait_image_apply_request.json', 'utf8'));
          if (request.schema !== 'history_go_people_portrait_apply_request_v1') throw new Error('Unexpected apply request schema');
          if (request.place_id !== 'det_norske_teatret') throw new Error('Unexpected place request');
          if (!Array.isArray(request.selections) || !request.selections.length || request.selections.length > 20) throw new Error('Must select 1-20 reviewed candidates');
          for (const entry of request.selections) {
            if (!entry.personId || !entry.candidateId || entry.approvalMode !== 'normal' || entry.identity_review !== 'verified' || entry.license_review !== 'verified' || !entry.review_evidence?.commons_page) {
              throw new Error('Selection missing documented identity and license review: ' + entry.personId);
            }
          }
          const ids = request.selections.map(s => s.personId);
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate selection IDs');
          const payload = JSON.stringify({ version: 2, selections: request.selections.map(({ personId, candidateId, approvalMode }) => ({ personId, candidateId, approvalMode })) });
          fs.appendFileSync(process.env.GITHUB_ENV, 'REVIEW_PAYLOAD=' + payload + '\nAPPROVED_IDS=' + ids.join(',') + '\n');
          console.log('Reviewed persons in source request: ' + ids.join(', '));
          NODE

      - name: Preflight approved IDs
        run: |
          node <<'NODE' | tee "$REPORT_DIR/preflight.txt"
          const fs = require("node:fs");
          const payload = (process.env.REVIEW_PAYLOAD || "").trim();
          const ids = (process.env.APPROVED_IDS || "").split(",").map((id) => id.trim()).filter(Boolean);
          if (!payload && !ids.length) throw new Error("review_payload or approved_ids must contain at least one selection.");
          if (payload) { const parsed = JSON.parse(payload); if (parsed.version !== 2 || !Array.isArray(parsed.selections) || !parsed.selections.length) throw new Error("review_payload must be version 2 with selections."); console.log(`review_payload selections=${parsed.selections.length}`); process.exit(0); }
          if (new Set(ids).size !== ids.length) throw new Error("approved_ids contains duplicate IDs.");
          if (ids.length > 20) throw new Error("approved_ids can contain at most twenty people IDs.");
          const candidates = JSON.parse(fs.readFileSync(process.env.CANDIDATE_FILE, "utf8"));
          if (!Array.isArray(candidates)) throw new Error(`${process.env.CANDIDATE_FILE} must be a top-level array.`);
          for (const id of ids) {
            const matches = candidates.filter((candidate) => candidate && candidate.personId === id);
            if (matches.length !== 1) throw new Error(`${id} must exist exactly once in ${process.env.CANDIDATE_FILE}; found ${matches.length}.`);
          }
          console.log(`approved_ids=${ids.join(",")}`);
          console.log(`candidate_count=${candidates.length}`);
          NODE

      - name: Run dry-run apply
        if: ${{ github.event_name != 'push' && inputs.write_output == 'false' }}
        run: |
          set -euo pipefail
          before="$(sha256sum "$CANDIDATE_FILE")"
          if [ -n "$REVIEW_PAYLOAD" ]; then npm run people:images:apply -- --review-payload="$REVIEW_PAYLOAD" | tee "$REPORT_DIR/dry-run.txt"; else npm run people:images:apply -- --approved-ids="$APPROVED_IDS" | tee "$REPORT_DIR/dry-run.txt"; fi
          after="$(sha256sum "$CANDIDATE_FILE")"
          test "$before" = "$after"
          if [ -n "$(git status --porcelain data/people bilder/kort/people)" ]; then
            echo "Dry-run changed files unexpectedly." >&2
            git status --porcelain data/people bilder/kort/people >&2
            exit 1
          fi

      - name: Run write apply
        if: ${{ github.event_name == 'push' || inputs.write_output == 'true' }}
        run: |
          set -euo pipefail
          before="$(sha256sum "$CANDIDATE_FILE")"
          if [ -n "$REVIEW_PAYLOAD" ]; then npm run people:images:apply:write -- --review-payload="$REVIEW_PAYLOAD" | tee "$REPORT_DIR/write.txt"; else npm run people:images:apply:write -- --approved-ids="$APPROVED_IDS" | tee "$REPORT_DIR/write.txt"; fi
          after="$(sha256sum "$CANDIDATE_FILE")"
          test "$before" = "$after"
          # Validate only the selected people. The older global People-image
          # backlog is tracked separately and must not block a valid local batch.
          node --input-type=module <<'NODE' | tee "$REPORT_DIR/scope-audit.txt"
          import fs from 'node:fs';
          import sharp from 'sharp';
          const request = JSON.parse(fs.readFileSync('data/people/portrait_image_apply_request.json', 'utf8'));
          const candidates = JSON.parse(fs.readFileSync('data/people/people_image_candidates.json', 'utf8'));
          const attributions = JSON.parse(fs.readFileSync('data/people/people_image_attributions.json', 'utf8'));
          const selections = request.selections || [];
          if (selections.length < 1 || selections.length > 20) throw new Error('Invalid apply batch scope');
          for (const selected of selections) {
            const candidate = candidates.find(c => c.personId === selected.personId && c.candidateId === selected.candidateId);
            if (!candidate) throw new Error('Unknown candidate for ' + selected.personId);
            const json = JSON.parse(fs.readFileSync(candidate.sourceFile, 'utf8'));
            const people = Array.isArray(json) ? json : Array.isArray(json.people) ? json.people : [json];
            const persons = people.filter(p => p?.id === selected.personId);
            if (persons.length !== 1) throw new Error('Ambiguous People identity for ' + selected.personId);
            const person = persons[0];
            const meta = person.imageMeta;
            if (!person.image?.startsWith('bilder/kort/people/') || person.cardImage !== person.image || !fs.existsSync(person.image)) throw new Error('Missing or inconsistent local portrait for ' + selected.personId);
            if (meta?.source !== 'wikimedia_commons' || meta?.candidateId !== candidate.candidateId || meta?.sourcePage !== candidate.commonsPage || meta?.license !== candidate.license || !meta?.creator || !meta?.credit || !meta?.licenseUrl) throw new Error('Invalid portrait attribution metadata for ' + selected.personId);
            if (attributions.filter(a => a.personId === person.id && a.file === person.image && a.sourcePage === candidate.commonsPage).length !== 1) throw new Error('Missing unique attribution ledger record for ' + selected.personId);
            const image = await sharp(person.image).metadata();
            if (!(image.width > 0 && image.height > 0)) throw new Error('Unusable portrait asset for ' + selected.personId);
            console.log(selected.personId + ': local portrait, attribution, Commons source and image dimensions OK');
          }
          console.log('Scoped portrait verification passed for ' + selections.length + ' people');
          NODE
          npm run test:people-images | tee "$REPORT_DIR/people-images-tests.txt"
          # Derived data must ship with the canonical portraits, not in a
          # separate runtime production/CI cycle.
          npm run place-open:build
          node <<'NODE' | tee "$REPORT_DIR/runtime-audit.txt"
          const fs = require('node:fs');
          const req = JSON.parse(fs.readFileSync('data/people/portrait_image_apply_request.json', 'utf8'));
          const ids = req.selections.map(s => s.personId);
          const manifest = JSON.parse(fs.readFileSync('data/runtime/people-all.json', 'utf8'));
          const people = manifest.files.flatMap(file => JSON.parse(fs.readFileSync(file, 'utf8')));
          if (people.length !== 1434 || new Set(people.map(p => p.id)).size !== 1434) throw new Error('People identity count was changed');
          const dnt = JSON.parse(fs.readFileSync('data/runtime/place-open/det_norske_teatret.json', 'utf8'));
          if (dnt.people.length !== 87 || new Set(dnt.people.map(p => p.id)).size !== 87) throw new Error('Det Norske Teatret must retain its 87 person links');
          for (const id of ids) {
            const p = people.find(x => x.id === id);
            const inPlace = dnt.people.find(x => x.id === id);
            if (!p || !inPlace || !p.image || p.image !== p.cardImage || !fs.existsSync(p.image) || p.image !== inPlace.image || p.imageMeta?.candidateId !== inPlace.imageMeta?.candidateId) throw new Error('Missing or mismatched runtime portrait: ' + id);
          }
          console.log('People 1434, DNT 87, synchronized images ' + ids.length + ': PASS');
          NODE

      - name: Upload people image apply report
        uses: actions/upload-artifact@v4
        with:
          name: people-image-apply-${{ github.run_id }}
          path: |
            reports/people-image-apply/**
            data/people/people_image_attributions.json
            bilder/kort/people/**
          if-no-files-found: warn

      - name: Open PR for applied people images
        if: ${{ github.event_name == 'push' || (inputs.write_output == 'true' && inputs.open_draft_pr == true) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/people-images-apply-${{ github.run_id }}"
          case "$branch" in main|master|refs/heads/main|refs/heads/master) echo "Refusing to push directly to $branch."; exit 1;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/people/people_image_attributions.json bilder/kort/people
          git add data/runtime/people-all.json data/runtime/people-all data/runtime/place-open
          git add -f reports/people-image-apply
          node <<'NODE'
          const fs = require('node:fs');
          const ids = process.env.APPROVED_IDS.split(',').map((id) => id.trim()).filter(Boolean);
          const candidates = JSON.parse(fs.readFileSync(process.env.CANDIDATE_FILE, 'utf8'));
          for (const id of ids) {
            const candidate = candidates.find((entry) => entry.personId === id);
            if (candidate?.sourceFile) fs.appendFileSync(process.env.GITHUB_ENV, `HG_ADD_FILE_${id.replace(/[^A-Za-z0-9_]/g, '_')}=${candidate.sourceFile}\n`);
          }
          NODE
          for file in $(node -e "const fs=require('fs'); const ids=process.env.APPROVED_IDS.split(',').map(s=>s.trim()).filter(Boolean); const c=JSON.parse(fs.readFileSync(process.env.CANDIDATE_FILE,'utf8')); console.log([...new Set(ids.map(id=>c.find(e=>e.personId===id)?.sourceFile).filter(Boolean))].join(' '))"); do git add "$file"; done
          if git diff --cached --quiet; then echo "No applied people image output changes to commit."; exit 0; fi
          git commit -m "chore(data): apply reviewed people images"
          git push --set-upstream origin HEAD
          gh pr create --draft --base main --head "$branch" --title "DNT: reviewed portrait batch and runtime" --body "Reviewed Commons portraits for: $APPROVED_IDS. One production PR includes the local images, People JSON, media attribution and derived People/Place-open runtime. 1434 People IDs and 87 theater links verified. No quiz or Civication changes."
