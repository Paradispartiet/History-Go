name: Oslo coordinate batch 33 diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query Geonorge and exact OSM candidates
        continue-on-error: true
        run: |
          set +e
          set -u
          out=reports/oslo-coordinate-batch-33-diagnostic
          mkdir -p "$out/geonorge" "$out/osm" "$out/reverse"
          npm run build:tools > "$out/build-tools.txt" 2>&1
          printf 'build_tools=%s\n' "$?" > "$out/status.txt"

          run_address() {
            slug="$1"; address="$2"
            npm run places:coords:find:address -- --address "$address" > "$out/geonorge/$slug.json" 2>&1
            code=$?
            printf '%s=%s\n' "$slug" "$code" >> "$out/geonorge/status.txt"
          }
          run_address glads-molle 'Sandakerveien 10A Oslo'
          run_address voienvolden 'Maridalsveien 120 Oslo'

          python3 - <<'PY'
          import json, urllib.parse, urllib.request, time
          from pathlib import Path
          out=Path('reports/oslo-coordinate-batch-33-diagnostic')
          headers={'User-Agent':'History-Go-coordinate-audit/1.0 contact=repository-audit'}
          def fetch(url):
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=40) as r:
                      return {'ok':True,'data':json.load(r)}
              except Exception as e:
                  return {'ok':False,'error':repr(e),'url':url}
          queries={
            'voienfallene':'Vøyenfallene, Oslo, Norway',
            'myralokka':'Myraløkka, Oslo, Norway',
            'kuba_parken':'Kuba park, Oslo, Norway',
            'beierbrua':'Beierbrua, Oslo, Norway',
            'nedre_foss':'Nedre Foss, Oslo, Norway',
          }
          for slug,q in queries.items():
              url='https://nominatim.openstreetmap.org/search?'+urllib.parse.urlencode({'q':q,'format':'jsonv2','limit':10,'addressdetails':1,'extratags':1,'namedetails':1})
              result=fetch(url)
              (out/'osm'/f'{slug}.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
              time.sleep(1.2)
          points={
            'voienfallene_current':(59.93065,10.75703),
            'myralokka_current':(59.935817,10.757414),
            'kuba_parken_current':(59.92472,10.75244),
            'beierbrua_current':(59.9283,10.7464),
            'nedre_foss_current':(59.9256,10.7435),
          }
          for slug,(lat,lon) in points.items():
              url='https://nominatim.openstreetmap.org/reverse?'+urllib.parse.urlencode({'lat':lat,'lon':lon,'format':'jsonv2','zoom':18,'addressdetails':1,'extratags':1,'namedetails':1})
              result=fetch(url)
              (out/'reverse'/f'{slug}.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
              time.sleep(1.2)
          PY
          printf 'network_queries=%s\n' "$?" >> "$out/status.txt"

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('reports/oslo-coordinate-batch-33-diagnostic')
          summary={'geonorge':{},'osm':{},'reverse':{}}
          for p in sorted((root/'geonorge').glob('*.json')):
              try: d=json.loads(p.read_text())
              except Exception: d={'raw':p.read_text()[:4000]}
              summary['geonorge'][p.stem]=d
          for p in sorted((root/'osm').glob('*.json')):
              result=json.loads(p.read_text())
              if not result.get('ok'):
                  summary['osm'][p.stem]=result
                  continue
              rows=result.get('data') or []
              summary['osm'][p.stem]=[{
                  'osm_type':r.get('osm_type'),'osm_id':r.get('osm_id'),'type':r.get('type'),'category':r.get('category'),'display_name':r.get('display_name'),'lat':r.get('lat'),'lon':r.get('lon'),'importance':r.get('importance'),'extratags':r.get('extratags',{})
              } for r in rows]
          for p in sorted((root/'reverse').glob('*.json')):
              result=json.loads(p.read_text())
              if not result.get('ok'):
                  summary['reverse'][p.stem]=result
                  continue
              r=result.get('data') or {}
              summary['reverse'][p.stem]={'osm_type':r.get('osm_type'),'osm_id':r.get('osm_id'),'type':r.get('type'),'category':r.get('category'),'display_name':r.get('display_name'),'lat':r.get('lat'),'lon':r.get('lon'),'extratags':r.get('extratags',{})}
          (root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          PY
          printf 'summary=%s\n' "$?" >> "$out/status.txt"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oslo-coordinate-batch-33-diagnostic
          path: reports/oslo-coordinate-batch-33-diagnostic
          if-no-files-found: warn
