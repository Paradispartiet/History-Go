name: Repair Tullin theory reference rationale

on:
  push:
    branches:
      - work/tullin-completion-20260830
    paths:
      - .github/workflows/tullin-theory-ref-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tullin-completion-20260830
          fetch-depth: 0
      - name: Add required why_it_helps to Tullin theory refs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/finalize-tullin-completion.mjs')
          text = path.read_text()
          old = 'theory_ref: { topic_hook_id: binding.topic_hook_id, thinker_id: binding.thinker_id, work: binding.work }'
          new = 'theory_ref: { topic_hook_id: binding.topic_hook_id, thinker_id: binding.thinker_id, work: binding.work, why_it_helps: "Knytter det dokumenterte stedssporet til et eksplisitt byfaglig tolkningsgrep uten å erstatte kildegrunnlaget." }'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one theory_ref expression, found {count}')
          path.write_text(text.replace(old, new))
          PY
          rm -f reports/place-production/tullin-producer-error.log
          rm -f .github/workflows/tullin-theory-ref-repair.yml
          git diff --check
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Tullin theory reference rationale"
          git push origin HEAD:work/tullin-completion-20260830
