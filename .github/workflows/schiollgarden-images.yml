name: Schiollgarden image browser QA
on:
  pull_request:
    paths:
      - '.github/workflows/schiollgarden-images.yml'
      - 'tests/schiollgarden-images-browser.mjs'
      - 'tests/schiollgarden-brands-browser.mjs'
      - 'tests/schiollgarden-reading-browser.mjs'
      - 'data/lesespor/manifest.json'
      - 'data/leksikon/manifest.json'
      - 'data/leksikon/places/oslo/by/leksikon_schiollgarden_nyhet_byggeprosjekt_2019.json'
      - 'data/lesespor/schiollgarden/**'
      - 'tests/brands-place-context.test.mjs'
      - 'js/brands/brands_loader.js'
      - 'data/brands/actors_by_place.json'
      - 'tests/schiollgarden-fagverk-browser.mjs'
      - 'tests/schiollgarden-language-browser.mjs'
      - 'data/leksikon/sprak/places/europe/norway/oslo/schiollgarden_prinsens_gate_26.json'
      - 'bilder/places/schiollgarden/**'
      - 'data/places/by/oslo/places_by_oslo_oppdag_kvadraturen_hovedstaden_batch_02/schiollgarden_prinsens_gate_26.json'
      - 'data/runtime/place-open/schiollgarden_prinsens_gate_26.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schiollgarden-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/brands-place-context.test.mjs
      - run: node tests/schiollgarden-brands-browser.mjs
      - run: node --test tests/place-sheet-news-renderer.test.mjs
      - run: node tests/schiollgarden-reading-browser.mjs
      - run: node tests/schiollgarden-images-browser.mjs
      - run: node tests/schiollgarden-fagverk-browser.mjs
      - run: node --test tests/place-sheet-language-renderer.test.mjs
      - run: node tests/schiollgarden-language-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schiollgarden-image-browser-qa
          path: |
            artifacts/schiollgarden-reading-browser
            artifacts/schiollgarden-brands-browser
            artifacts/schiollgarden-images
            artifacts/schiollgarden-fagverk-browser
            artifacts/schiollgarden-language-browser
          if-no-files-found: warn
