name: Prepare localized By and Scenekunst badge candidates
on:
  push:
    branches:
      - feat/by-scene-badge-languages-20261103
  workflow_dispatch:
permissions:
  contents: write
jobs:
  localize:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependencies
        run: python -m pip install 'Pillow>=11,<13' 'numpy>=2,<3'
      - name: Produce immutable-source language candidates
        run: python scripts/generate-badge-locales-v1.py
      - name: Render contact sheets for visual QA
        run: python scripts/render-badge-locale-reviews.py
      - name: Commit candidates to this branch for review
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/merker/by/locales/ bilder/merker/scenekunst/locales/ data/badges/badge_locale_images_candidates.json docs/badge-locale-previews/
          if git diff --cached --quiet; then
            echo "No new image candidates"
          else
            git commit -m "Generate localized badge candidates [skip ci]"
            git push origin HEAD:feat/by-scene-badge-languages-20261103
          fi
