name: TEMP Civication institution authority writeback

on:
  push:
    branches:
      - agent/civication-institution-authority-foundation
    paths:
      - scripts/TEMP_patch_civication_institution_authority.py
      - .github/workflows/TEMP-civication-institution-authority-writeback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-institution-authority-foundation
          fetch-depth: 0
      - name: Apply bounded authority patch
        run: python scripts/TEMP_patch_civication_institution_authority.py
      - name: Syntax and registry checks
        run: |
          node --check js/Civication/core/civicationInstitutionAuthority.js
          node --check js/Civication/systems/day/dayConsequences.js
          node --check scripts/build-civication-scene-registry.mjs
          python -m json.tool data/Civication/sceneContractV1.schema.json >/dev/null
          node scripts/build-civication-scene-registry.mjs --check
          node tests/civication-work-object-scene-pipeline.test.js
      - name: Commit writeback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/sceneContractV1.schema.json scripts/build-civication-scene-registry.mjs js/Civication/systems/day/dayConsequences.js
          git diff --cached --check
          git commit -m "Add institutional structure and authority foundation"
          git push origin HEAD:agent/civication-institution-authority-foundation
