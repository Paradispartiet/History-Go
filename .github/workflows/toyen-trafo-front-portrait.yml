name: Tøyen trafo – distinct documentary portrait
on:
  push:
    branches: [content/toyen-trafo-front-portrait-audit-20261105]
    paths:
      - 'scripts/build-toyen-trafo-front-portrait.mjs'
      - 'tests/toyen-trafo-front-portrait.test.mjs'
      - '.github/workflows/toyen-trafo-front-portrait.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: toyen-trafo-front-portrait-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate:
    name: Build separate frontImage and verify targeted contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fetch independent CC BY-SA 3.0 NO documentary source
        run: |
          mkdir -p bilder/places/source
          curl --fail --location --show-error --silent --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 120 \
            -A 'HistoryGoEditorialSourceVerifier/1.0 (https://github.com/Paradispartiet/History-Go)' \
            -o bilder/places/source/toyen_trafo_bjoertvedt_2014.jpg \
            'https://upload.wikimedia.org/wikipedia/commons/d/d6/Oslo_T%C3%B6yen_Trafostasjon_hovinveien_1_rk_166157_IMG_5512.JPG'
      - name: Build verified independent portrait and update source metadata
        run: node scripts/build-toyen-trafo-front-portrait.mjs
      - name: Refresh canonical indexes
        run: |
          npm run places:index:build
          npm run place-open:build
      - name: Check changed front image and canonical runtime
        run: |
          node --test tests/toyen-trafo-front-portrait.test.mjs
          npm run places:index:check
          npm run place-open:check
      - name: Smoke-check actual Tøyen trafo UI
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then echo "::error::Chrome not found"; exit 1; fi
          CHROME_BIN="$CHROME_BIN" node tests/toyen-trafo-brand-real-browser.mjs
      - name: Commit portrait, attribution, and regenerated canonical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/places/source/toyen_trafo_bjoertvedt_2014.jpg
          git add bilder/places/toyen_trafo_front_portrait.webp
          git add data/places/naeringsliv/oslo/places_naeringsliv_oslo_kultureiendommer_batch_04/toyen_trafo.json
          git add data/places/places_index.json data/runtime/place-open/toyen_trafo.json
          git add reports/place-production/toyen-trafo-front-image-20261105.json reports/place-production/toyen-trafo-workcard-current.json
          if ! git diff --cached --quiet; then
            git commit -m "Tøyen trafo: integrate 2014 source-authenticated portrait and source-bound production audit"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
