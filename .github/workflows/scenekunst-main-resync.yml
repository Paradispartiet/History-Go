name: Scenekunst main resync

on:
  push:
    branches:
      - agent/scenekunst-main-resync

permissions:
  contents: write

jobs:
  resync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current-main branch
        uses: actions/checkout@v4
        with:
          ref: agent/scenekunst-main-resync
          fetch-depth: 0

      - name: Merge validated Scenekunst branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/scenekunst-source-migration-01
          set +e
          git merge --no-commit --no-ff origin/agent/scenekunst-source-migration-01
          merge_status=$?
          set -e

          unresolved="$(git diff --name-only --diff-filter=U)"
          unexpected="$(printf '%s\n' "$unresolved" | grep -v '^data/places/places_index.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected merge conflicts:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          if printf '%s\n' "$unresolved" | grep -qx 'data/places/places_index.json'; then
            git checkout --ours data/places/places_index.json
            git add data/places/places_index.json
          fi

          if [ "$merge_status" -ne 0 ] && [ -z "$unresolved" ]; then
            echo "Merge failed without a resolvable index conflict"
            exit 1
          fi

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo "Unresolved conflicts remain:"
            printf '%s\n' "$remaining"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate merged place index
        run: |
          npm run build:tools
          npm run places:index:build

      - name: Validate merged data
        run: |
          bash scripts/check-places.sh
          npm run audit:categories

      - name: Remove one-shot workflow and commit merge
        run: |
          git rm .github/workflows/scenekunst-main-resync.yml
          git add -A
          git diff --cached --stat
          git commit -m "Sync Scenekunst migration with current main"
          git push origin HEAD:agent/scenekunst-main-resync

