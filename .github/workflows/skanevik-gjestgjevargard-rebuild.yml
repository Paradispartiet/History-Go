name: Rebuild Skanevik Gjestgjevargard quiz
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: skanevik-rebuild-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  rebuild:
    if: github.head_ref == 'agent/etne-skanevik-gjestgjevargard-quiz'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-skanevik-gjestgjevargard-quiz
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Restore quiz and register manifest
        run: |
          mkdir -p data/quiz/historie
          curl -fL 'https://raw.githubusercontent.com/Paradispartiet/History-Go/fc0134cab755d5a53ddf3770a07dc473be5ea563/data/quiz/historie/skanevik_gjestgjevargarden_sets.json' -o data/quiz/historie/skanevik_gjestgjevargarden_sets.json
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const file = 'data/quiz/manifest.json';
          const manifest = JSON.parse(await readFile(file, 'utf8'));
          manifest.sets = Array.isArray(manifest.sets) ? manifest.sets : [];
          const wanted = { targetId: 'skanevik_gjestgjevargarden', file: 'data/quiz/historie/skanevik_gjestgjevargarden_sets.json' };
          const existing = manifest.sets.find((entry) => entry?.targetId === wanted.targetId);
          if (existing) Object.assign(existing, wanted); else manifest.sets.push(wanted);
          await writeFile(file, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Knowledge links
        run: npm run knowledge:canonical:write
      - name: Validate quiz package
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const target = 'skanevik_gjestgjevargarden';
          const quiz = JSON.parse(await readFile('data/quiz/historie/skanevik_gjestgjevargarden_sets.json', 'utf8'));
          const questions = quiz.sets.flatMap((set) => set.questions);
          if (quiz.targetId !== target || quiz.sets.length !== 3 || questions.length !== 15) throw new Error('root/set/question mismatch');
          const balance = { fact: 0, context: 0, theory: 0 };
          for (const q of questions) {
            if (q.targetId !== target || q.placeId !== target || q.question_scope !== 'place') throw new Error(`target mismatch: ${q.id}`);
            if (!Array.isArray(q.options) || q.options.length !== 3 || q.options[q.answerIndex] !== q.answer) throw new Error(`answer mismatch: ${q.id}`);
            if (!q.knowledge_unit_ids?.length || q.knowledge_link_status !== 'linked') throw new Error(`knowledge mismatch: ${q.id}`);
            if (q.question_type === 'concept') balance.theory += 1;
            else if (q.question_type === 'analysis') balance.context += 1;
            else balance.fact += 1;
          }
          if (JSON.stringify(balance) !== JSON.stringify({ fact: 8, context: 4, theory: 3 })) throw new Error(`balance mismatch: ${JSON.stringify(balance)}`);
          const manifest = JSON.parse(await readFile('data/quiz/manifest.json', 'utf8'));
          const hits = manifest.sets.filter((entry) => entry?.targetId === target && entry?.file === 'data/quiz/historie/skanevik_gjestgjevargarden_sets.json');
          if (hits.length !== 1) throw new Error(`manifest mismatch: ${hits.length}`);
          console.log({ target, questions: questions.length, balance });
          NODE
      - name: Audit quiz content
        run: npm run audit:quiz-content
      - name: Audit quiz templates
        run: npm run audit:quiz-templates
      - name: Test quiz audit
        run: npm run test:quiz-content-audit
      - name: Check Knowledge data
        run: npm run knowledge:canonical:check
      - name: Commit rebased quiz package
        run: |
          rm -f .github/workflows/skanevik-gjestgjevargard-rebuild.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Skanevik Gjestgjevargard quiz'
          git push origin HEAD:agent/etne-skanevik-gjestgjevargard-quiz
