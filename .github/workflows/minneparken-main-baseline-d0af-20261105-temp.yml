name: Temporary Minneparken CI diagnosis on pinned main d0af95a
on:
  push:
    branches:
      - qa/minneparken-baseline-d0af-20261105
    paths:
      - .github/workflows/minneparken-main-baseline-d0af-20261105-temp.yml
permissions:
  contents: read
jobs:
  quiz-context-baseline:
    if: false # main baseline already succeeded in run 41986484565
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Enforce immutable main ancestor and diagnostics only
        shell: bash
        run: |
          set -euo pipefail
          BASE=d0af95a05923347bcd2ef879575d50aab533bd95
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | grep -v -x '.github/workflows/minneparken-main-baseline-d0af-20261105-temp.yml' > /tmp/unexpected.txt || true
          test ! -s /tmp/unexpected.txt
      - run: npm ci --no-audit --no-fund
      - name: Baseline quiz production context audit on unmodified main
        run: npm run audit:quiz-production-context
  grini-collections-baseline:
    if: false # Already tested in first diagnostic run; do not repeat
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Configure system Chrome
        run: echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Grini Collections real browser on unmodified main
        run: node scripts/verify-grini-collections-browser.mjs grini_fangeleir
  oslo-politikk-mobile-baseline:
    if: false # Already tested in first diagnostic run; do not repeat
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/place-card-photo-caption.test.mjs tests/place-quizcard-hydration-stability.test.mjs
      - name: Configure system Chrome
        run: echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Oslo Politikk real mobile and desktop on unmodified main
        run: node tests/oslo-politikk-six-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minneparken-baseline-oslo-politikk-d0af95a
          path: artifacts/oslo-politikk-six-browser/**
          if-no-files-found: ignore
          retention-days: 7

  pr-quiz-context-field-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 660065d397af97c512e3844f100b3234ecd90083
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Explain source of PR-only context drift, without changing files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '660065d397af97c512e3844f100b3234ecd90083'
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildQuizProductionContext } from './scripts/quiz-production-lib.mjs';
          const targets=[
            ['by','birkelunden'],
            ['historie','grini_fangeleir'],
            ['historie','minneparken_gamlebyen'],
            ['religion','gronland_kirke']
          ];
          function diff(a,b,p='root',out=[]){
            if(JSON.stringify(a)===JSON.stringify(b))return out;
            if(Array.isArray(a)||Array.isArray(b)){
              out.push({key:p,oldType:Array.isArray(a)?'array':typeof a,newType:Array.isArray(b)?'array':typeof b,oldLength:Array.isArray(a)?a.length:null,newLength:Array.isArray(b)?b.length:null});
              return out;
            }
            if(a&&b&&typeof a==='object'&&typeof b==='object'){
              for(const k of new Set([...Object.keys(a),...Object.keys(b)]))diff(a[k],b[k],p+'.'+k,out);
            }else{
              const short=x=>JSON.stringify(x)?.slice(0,140);
              out.push({key:p,old:short(a),rebuilt:short(b)});
            }
            return out;
          }
          for(const [categoryId,targetId] of targets){
            const path='data/quiz/production_context/'+categoryId+'/'+targetId+'.json';
            const saved=JSON.parse(fs.readFileSync(path,'utf8'));
            const rebuilt=await buildQuizProductionContext({categoryId,targetId});
            const differences=diff(saved,rebuilt);
            console.log('CONTEXT_DIFF',JSON.stringify({targetId,categoryId,total:differences.length,fields:differences.slice(0,24)}));
          }
          NODE
          git diff --exit-code
