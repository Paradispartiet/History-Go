name: Apply Naeringsliv3 badge colors

on:
  push:
    branches:
      - fix/naeringsliv3-badge-map-colors
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/naeringsliv3-badge-map-colors
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read Naeringsliv3 pixels and update badge colors
        shell: bash
        run: |
          mkdir -p reports/tmp-naeringsliv3
          node --input-type=module <<'NODE' | tee reports/tmp-naeringsliv3/apply.log
          import fs from "node:fs";
          import path from "node:path";
          import sharp from "sharp";

          const dir = "bilder/merker";
          const files = fs.readdirSync(dir);
          const normalizeStem = (name) => path.parse(name).name
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .replaceAll("æ", "ae")
            .replaceAll("ø", "o")
            .replaceAll("å", "a")
            .replace(/[^a-z0-9]/g, "");
          const candidates = files.filter((name) => normalizeStem(name).includes("naeringsliv"));
          const filename = candidates.find((name) => normalizeStem(name).includes("naeringsliv3"))
            || candidates.find((name) => normalizeStem(name).includes("3"));
          if (!filename) throw new Error(`Fant ikke naeringsliv3 i ${dir}. Næringsliv-kandidater: ${candidates.join(", ") || "ingen"}`);
          const imagePath = `${dir}/${filename}`;

          const { data, info } = await sharp(imagePath).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
          const { width, height, channels } = info;
          const cx = (width - 1) / 2;
          const cy = (height - 1) / 2;
          const radius = Math.min(width, height) / 2;

          const quant = (v) => Math.max(0, Math.min(255, Math.round(v / 16) * 16));
          const keyOf = (r, g, b) => `${quant(r)},${quant(g)},${quant(b)}`;
          const blueClusters = new Map();
          const steelClusters = new Map();

          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              const i = (y * width + x) * channels;
              const r = data[i];
              const g = data[i + 1];
              const b = data[i + 2];
              const a = data[i + 3];
              if (a < 100) continue;

              const rr = Math.hypot(x - cx, y - cy) / radius;
              const max = Math.max(r, g, b);
              const min = Math.min(r, g, b);
              const chroma = max - min;
              const saturation = max ? chroma / max : 0;
              const brightness = (r + g + b) / 3;

              if (rr < 0.76 && b > r * 1.2 && b > g * 1.08 && chroma > 45) {
                const key = keyOf(r, g, b);
                const entry = blueClusters.get(key) || { count: 0, r: 0, g: 0, b: 0 };
                entry.count += 1; entry.r += r; entry.g += g; entry.b += b;
                blueClusters.set(key, entry);
              }

              if (rr >= 0.68 && rr <= 0.87 && saturation < 0.32 && brightness >= 105 && brightness <= 235) {
                const key = keyOf(r, g, b);
                const entry = steelClusters.get(key) || { count: 0, r: 0, g: 0, b: 0 };
                entry.count += 1; entry.r += r; entry.g += g; entry.b += b;
                steelClusters.set(key, entry);
              }
            }
          }

          function dominant(map, label) {
            const entries = [...map.values()].sort((a, b) => b.count - a.count);
            if (!entries.length) throw new Error(`Fant ingen ${label}-piksler`);
            const top = entries[0];
            return [top.r, top.g, top.b].map((sum) => Math.round(sum / top.count));
          }

          const toHex = ([r, g, b]) => `#${[r, g, b].map((v) => v.toString(16).padStart(2, "0")).join("").toUpperCase()}`;
          const primary = toHex(dominant(blueClusters, "blå"));
          const secondary = toHex(dominant(steelClusters, "stålgrå"));

          console.log(`[Naeringsliv3] file=${imagePath}`);
          console.log(`[Naeringsliv3] primary=${primary}`);
          console.log(`[Naeringsliv3] secondary=${secondary}`);

          const badgePath = "data/badges/naeringsliv.json";
          const badge = JSON.parse(fs.readFileSync(badgePath, "utf8"));
          badge.color = primary;
          badge.secondaryColor = secondary;
          badge.image = imagePath;
          fs.writeFileSync(badgePath, `${JSON.stringify(badge, null, 2)}\n`);

          const categoriesPath = "js/core/categories.ts";
          let categories = fs.readFileSync(categoriesPath, "utf8");
          const pattern = /\{ id: "naeringsliv", name: "Næringsliv", icon: "🏭", color: "#[0-9A-Fa-f]{6}", secondaryColor: "#[0-9A-Fa-f]{6}", scope: "runtime_domain" \}/;
          const replacement = `{ id: "naeringsliv", name: "Næringsliv", icon: "🏭", color: "${primary}", secondaryColor: "${secondary}", scope: "runtime_domain" }`;
          if (!pattern.test(categories)) throw new Error("Fant ikke canonical naeringsliv-kategorilinje");
          categories = categories.replace(pattern, replacement);
          fs.writeFileSync(categoriesPath, categories);

          fs.writeFileSync("reports/tmp-naeringsliv3/result.json", JSON.stringify({ imagePath, primary, secondary }, null, 2));
          NODE

      - name: Typecheck browser TypeScript
        run: npm run typecheck:web

      - name: Rebuild browser runtime
        run: npm run build:web

      - name: Validate result
        shell: bash
        run: |
          mkdir -p reports/tmp-naeringsliv3
          python - <<'PY' | tee reports/tmp-naeringsliv3/validate.log
          from pathlib import Path
          import json

          result = json.loads(Path("reports/tmp-naeringsliv3/result.json").read_text())
          badge = json.loads(Path("data/badges/naeringsliv.json").read_text())
          categories = Path("js/core/categories.ts").read_text()
          generated = Path("js/core/categories.js").read_text()
          dist = Path("dist/web/categories.js").read_text()

          assert badge["image"] == result["imagePath"]
          assert badge["color"] == result["primary"]
          assert badge["secondaryColor"] == result["secondary"]
          for text in (categories, generated, dist):
              assert result["primary"] in text
              assert result["secondary"] in text
          print(json.dumps(result, ensure_ascii=False))
          PY
          git diff --check | tee reports/tmp-naeringsliv3/git-diff-check.log

      - name: Commit and push final implementation
        shell: bash
        run: |
          rm -f .github/workflows/temp-apply-naeringsliv3-badge-colors.yml
          rm -rf reports/tmp-naeringsliv3
          git config user.name "Paradispartiet"
          git config user.email "225725199+Paradispartiet@users.noreply.github.com"
          git add \
            data/badges/naeringsliv.json \
            js/core/categories.ts \
            js/core/categories.js \
            dist/web/categories.js \
            .github/workflows/temp-apply-naeringsliv3-badge-colors.yml
          git commit -m "Use Naeringsliv3 badge and matching map colors"
          git push origin HEAD:fix/naeringsliv3-badge-map-colors
