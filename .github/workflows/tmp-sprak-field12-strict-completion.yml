name: TEMP Språk field 12 strict completion

on:
  push:
    branches:
      - agent/fagverk-sprak-lingvistikk-field-12-fulltext-strict-completion-20260831

permissions:
  contents: write

concurrency:
  group: tmp-sprak-field12-strict-completion
  cancel-in-progress: false

jobs:
  materialize:
    if: startsWith(github.event.head_commit.message, 'Run fail-closed Språk field 12 strict completion')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/fagverk-sprak-lingvistikk-field-12-fulltext-strict-completion-20260831
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify 11/12 baseline and field 12 source-first
        run: |
          node scripts/audit-sprak-lingvistikk-reconciliation-v1.mjs
          node --test tests/sprak-lingvistikk-reconciliation-v1.test.mjs
          node scripts/brief-sprak-lingvistikk-corpus-field-documentation-language-resources-reproducibility-sources-v1.mjs
          node --test tests/sprak-lingvistikk-corpus-field-documentation-language-resources-reproducibility-source-brief-v1.test.mjs

      - name: Generate field 12 strict completion candidate
        run: node scripts/tmp-materialize-sprak-field12-strict-completion.mjs

      - name: Syntax-check strict completion scripts
        run: |
          node --check scripts/audit-sprak-lingvistikk-corpus-field-documentation-language-resources-reproducibility-fulltext-v1.mjs
          node --check scripts/materialize-sprak-lingvistikk-corpus-field-documentation-language-resources-reproducibility-fulltext-v1.mjs

      - name: Run all 12 registered fulltext audits and tests
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const ci = JSON.parse(fs.readFileSync('.github/ci/fagverk-sprak-lingvistikk-domain-registry-v1.json', 'utf8'));
          if (ci.domains.length !== 12) throw new Error('CI registry must contain 12 domains');
          for (const domain of ci.domains) {
            for (const file of [domain.fulltextAudit, domain.fulltextTest]) {
              if (!file || !fs.existsSync(file)) throw new Error(`Missing registered strict file for ${domain.domainId}: ${file}`);
              const args = file.startsWith('tests/') ? ['--test', file] : [file];
              const result = spawnSync(process.execPath, args, { stdio: 'inherit' });
              if (result.status !== 0) throw new Error(`Strict gate failed for ${domain.domainId}: ${file}`);
            }
          }
          NODE

      - name: Verify cumulative strict completion
        run: |
          node scripts/audit-sprak-lingvistikk-reconciliation-v1.mjs
          node --test tests/sprak-lingvistikk-reconciliation-v1.test.mjs
          node scripts/audit-sprak-lingvistikk-corpus-field-documentation-language-resources-reproducibility-fulltext-v1.mjs
          node --test tests/sprak-lingvistikk-corpus-field-documentation-language-resources-reproducibility-fulltext-v1.test.mjs
          node scripts/materialize-sprak-lingvistikk-corpus-field-documentation-language-resources-reproducibility-fulltext-v1.mjs

      - name: Remove TEMP surfaces and verify clean permanent diff
        run: |
          rm scripts/tmp-materialize-sprak-field12-strict-completion.mjs
          rm .github/workflows/tmp-sprak-field12-strict-completion.yml
          test ! -e scripts/tmp-materialize-sprak-field12-strict-completion.mjs
          test ! -e .github/workflows/tmp-sprak-field12-strict-completion.yml
          git status --short

      - name: Commit permanent strict completion only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No permanent changes generated' >&2
            exit 1
          fi
          git commit -m 'Materialize Språk og lingvistikk field 12 strict completion'
          git push origin HEAD:agent/fagverk-sprak-lingvistikk-field-12-fulltext-strict-completion-20260831
