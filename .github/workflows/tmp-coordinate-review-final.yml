name: Final coordinate documentation review completion

on:
  pull_request:

permissions:
  contents: write

jobs:
  finish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Validate targeted coordinate gates
        run: |
          npm ci --ignore-scripts
          npm run test:coordinate-source-contract
          npm run places:coords:evidence:audit

      - name: Apply final deterministic patch
        run: |
          git reset --hard HEAD

          python - <<'PY'
          from pathlib import Path
          import json

          path = Path("package.json")
          text = path.read_text(encoding="utf-8")
          package = json.loads(text)
          tools_check = package["scripts"]["tools:check"]
          evidence = "npm run places:coords:evidence:audit"
          if evidence not in tools_check:
              old = "node tests/coordinate-source-contract-anchor-trust.test.mjs && npm run audit:places-split-manifest-sync"
              new = "node tests/coordinate-source-contract-anchor-trust.test.mjs && npm run places:coords:evidence:audit && npm run audit:places-split-manifest-sync"
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one tools:check anchor, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif tools_check.count(evidence) != 1:
              raise SystemExit("Evidence audit occurs more than once in tools:check")
          PY

          git rm .github/workflows/temporary-coordinate-documentation-repair-runner.yml
          git rm .github/workflows/tmp-coordinate-review-final.yml

          actual="$(git diff --name-only HEAD | sort | tr '\n' ' ')"
          expected=".github/workflows/temporary-coordinate-documentation-repair-runner.yml .github/workflows/tmp-coordinate-review-final.yml package.json "
          printf 'Final changed files: %s\n' "$actual"
          test "$actual" = "$expected"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Add coordinate evidence audit and remove temporary runner"
          git push origin HEAD:${{ github.head_ref }}
