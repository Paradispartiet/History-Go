name: House of Nerds and SALT People merge sync (temporary)
on:
  push:
    branches: [place/house-of-nerds-integration-20261102]
    paths: [.github/workflows/hon-final-people-sync-20261102.yml]
permissions:
  contents: write
concurrency:
  group: hon-final-people-sync-20261102
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build canonical People and Place-open
        run: |
          npm run civication:history-people:build
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
          npm run place-open:build
      - name: Verify unique People and generated artifacts
        run: |
          node --test tests/regjeringskvartalet-people-expansion.test.mjs
          npm run civication:history-people:check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          npm run place-open:check
      - name: Commit bounded generated People projections
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --stat
          changed=$(git diff --name-only | wc -l)
          test "$changed" -le 35
          unexpected=$(git diff --name-only | grep -Ev '^(data/Civication/historyPeople_index.json|data/Civication/scenarioPeople/|data/Civication/scenarioPeople_index.json|data/runtime/)' || true)
          if [[ -n "$unexpected" ]]; then echo "Unexpected generated changes: $unexpected"; exit 1; fi
          git add -A -- data/Civication/historyPeople_index.json data/Civication/scenarioPeople/ data/Civication/scenarioPeople_index.json data/runtime/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync canonical People and Place-open after SALT identity deduplication"
            git fetch origin place/house-of-nerds-integration-20261102
            git rebase origin/place/house-of-nerds-integration-20261102
            git push origin HEAD:place/house-of-nerds-integration-20261102
          fi
