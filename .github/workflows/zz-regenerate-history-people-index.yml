name: One-time Civication People index sync
on:
  push:
    branches:
      - fix/civication-history-people-index-20261030
    paths:
      - .github/workflows/zz-regenerate-history-people-index.yml
permissions:
  contents: write
concurrency:
  group: one-time-civication-people-index-sync
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/civication-history-people-index-20261030
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Rebuild and check only the generated Civication People index
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run civication:history-people:build
          npm run civication:history-people:check
          git status --short
          git diff --numstat
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = "data/Civication/historyPeople_index.json"
          test -s data/Civication/historyPeople_index.json
      - name: Commit generated index and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/historyPeople_index.json
          git rm -- .github/workflows/zz-regenerate-history-people-index.yml
          git diff --cached --stat
          test -z "$(git diff --name-only)"
          git commit -m "fix(civication): resync generated historyPeople index with People sources"
          git push origin HEAD:fix/civication-history-people-index-20261030
