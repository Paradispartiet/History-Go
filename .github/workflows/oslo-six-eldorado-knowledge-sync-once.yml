name: Oslo six Eldorado Knowledge sync once
on:
  push:
    branches:
      - research/oslo-six-culture-institutions-v1-20261023
    paths:
      - .github/workflows/oslo-six-eldorado-knowledge-sync-once.yml

permissions:
  contents: write

jobs:
  synchronize-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-six-culture-institutions-v1-20261023
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate all derived Knowledge registries from canonical quiz data
        run: npm run knowledge:canonical:write
      - name: Synchronize Eldorado QuizCard Knowledge links and facts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const quizPath = 'data/quiz/litteratur/eldorado_bokhandel_sets_merged.json';
          const cardPath = 'data/quizcards/litteratur/topp10_lit_kort_batch3.json';
          const quiz = JSON.parse(fs.readFileSync(quizPath, 'utf8'));
          const cards = JSON.parse(fs.readFileSync(cardPath, 'utf8'));
          const byId = new Map(quiz.sets.flatMap(s => s.questions.map(q => [q.id, q])));
          const targetCards = cards.cards.filter(c => c.targetId === 'eldorado_bokhandel');
          if (targetCards.length !== 1 || targetCards[0].questions.length !== 10) throw new Error('Unexpected Eldorado QuizCard count');
          for (const card of targetCards) {
            for (const question of card.questions) {
              const q = byId.get(question.sourceQuestionId);
              if (!q || q.knowledge_link_status !== 'linked' || !q.primary_knowledge_unit_id) throw new Error('Missing generated Knowledge link: ' + question.sourceQuestionId);
              for (const key of ['question','options','answer','answerIndex','knowledge','primary_knowledge_unit_id','knowledge_unit_ids','concept_ids','term_ids','emne_id','knowledge_contract_version','knowledge_link_status']) question[key] = q[key];
              question.sourceQuizId = q.quiz_id;
              question.source_urls = q.source;
              question.source_refs = [];
            }
            card.answerKey = card.questions.map(q => ({number:q.number,answer:q.answer,answerIndex:q.answerIndex}));
          }
          fs.writeFileSync(cardPath, JSON.stringify(cards, null, 2) + '\\n');
          NODE
      - name: Verify Knowledge artifacts deterministically
        run: npm run knowledge:canonical:check
      - name: Guard against accidental broad repository changes
        shell: bash
        run: |
          git status --short
          CHANGED="$(git diff --name-only | grep -c . || true)"
          if [ "$CHANGED" -gt 30 ]; then
            echo "Refusing to commit: $CHANGED tracked files changed; manually review generator output"
            exit 1
          fi
      - name: Commit generated outputs and remove the one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git rm .github/workflows/oslo-six-eldorado-knowledge-sync-once.yml
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "Regenerate canonical Eldorado Knowledge links and remove one-time workflow"
          git push origin HEAD:research/oslo-six-culture-institutions-v1-20261023
