name: Oslo six Eldorado Knowledge sync once
on:
  push:
    branches:
      - research/oslo-six-culture-institutions-v1-20261023
    paths:
      - .github/workflows/oslo-six-eldorado-knowledge-sync-once.yml

permissions:
  contents: write

jobs:
  synchronize-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-six-culture-institutions-v1-20261023
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate all derived Knowledge registries from canonical quiz data
        run: npm run knowledge:canonical:write
      - name: Verify Knowledge artifacts deterministically
        run: npm run knowledge:canonical:check
      - name: Guard against accidental broad repository changes
        shell: bash
        run: |
          git status --short
          CHANGED="$(git diff --name-only | grep -c . || true)"
          if [ "$CHANGED" -gt 20 ]; then
            echo "Refusing to commit: $CHANGED tracked files changed; manually review generator output"
            exit 1
          fi
      - name: Commit generated outputs and remove the one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git rm .github/workflows/oslo-six-eldorado-knowledge-sync-once.yml
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "Regenerate canonical Eldorado Knowledge links and remove one-time workflow"
          git push origin HEAD:research/oslo-six-culture-institutions-v1-20261023
