name: One-time People of Places governance registration

on:
  pull_request_target:
    branches:
      - main
    paths:
      - .github/people-of-places-governance-trigger.txt

permissions:
  contents: write

jobs:
  register:
    if: github.event.pull_request.head.ref == 'agent/documentation-governance-phase-22-people-of-places' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-governance-phase-22-people-of-places
          fetch-depth: 0

      - name: Synchronize latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Patch documentation governance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          registry_path = Path("docs/documentation_registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          method_path = "docs/people-of-places-method.md"
          if not any(entry.get("path") == method_path for entry in registry["documents"]):
              entry = {
                  "path": method_path,
                  "status": "canonical",
                  "role": "Bindende redaksjonell metode for relevante, kildebelagte og ikke-dupliserte person–sted-koblinger",
                  "owns": ["people_of_places_method"],
                  "last_verified": "2026-07-26",
              }
              insert_at = next(
                  index + 1
                  for index, existing in enumerate(registry["documents"])
                  if existing.get("path") == "docs/DATA_PRODUCTION_CONTRACT.md"
              )
              registry["documents"].insert(insert_at, entry)
          registry["last_verified"] = "2026-07-26"
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          readme_path = Path("docs/README.md")
          readme = readme_path.read_text(encoding="utf-8")
          old = '''### People-bilder og rettigheter

          1. [`PEOPLE_IMAGES.md`](./PEOPLE_IMAGES.md) — canonical kilde-, lisens-, godkjennings- og attribusjonskontrakt
          2. [`../tools/people-image-pipeline.mts`](../tools/people-image-pipeline.mts) — implementert kandidat-, review-, apply- og audit-pipeline
          3. [`../tests/people-images.test.mjs`](../tests/people-images.test.mjs) — lisens-, identitets-, quality-, apply- og attribusjonsregresjoner
          4. [`../data/people/manifest.json`](../data/people/manifest.json) — aktive canonical people-source-filer

          People-bilder skal komme fra Wikidata/Wikimedia Commons gjennom lisensporten. Runtime leser lokale bildepaths og `imageMeta` fra canonical manifest-loadede people-filer; kandidat- og attribusjonsfilene er arbeids- og sporbarhetsdata, ikke en parallell people-sannhet.
          '''
          new = '''### People-produksjon, stedskobling og bilder

          1. [`people-of-places-method.md`](./people-of-places-method.md) — canonical relevans-, kilde-, gjenbruks- og batchmetode for person–sted-koblinger
          2. [`../data/people/manifest.json`](../data/people/manifest.json) — aktive canonical people-source-filer
          3. [`../tools/audit-people-of-places-status.mts`](../tools/audit-people-of-places-status.mts) — status-, schema-, referanse- og struktur-audit
          4. [`../tools/check-people-of-places-gate.mts`](../tools/check-people-of-places-gate.mts) — blokkerer duplikater, ugyldige refs, manglende primæranker og tomme `places`
          5. [`PEOPLE_IMAGES.md`](./PEOPLE_IMAGES.md) — canonical kilde-, lisens-, godkjennings- og attribusjonskontrakt for people-bilder
          6. [`../tools/people-image-pipeline.mts`](../tools/people-image-pipeline.mts) — implementert kandidat-, review-, apply- og audit-pipeline
          7. [`../tests/people-images.test.mjs`](../tests/people-images.test.mjs) — lisens-, identitets-, quality-, apply- og attribusjonsregresjoner

          People of Places-metoden eier den redaksjonelle relevans- og kildegaten. Dagens CI håndhever people-dataintegritet, men beregner ikke full place-for-place-dekning; dekningsmål må derfor dokumenteres i batchen. Runtime leser bare manifest-loadede canonical people-filer. Kandidat-, attribusjons- og statusrapporter er arbeids- og sporbarhetsdata, ikke parallelle people-sannheter.
          '''
          if old in readme:
              readme = readme.replace(old, new, 1)
          elif "### People-produksjon, stedskobling og bilder" not in readme:
              raise SystemExit("Fant ikke forventet People-seksjon i docs/README.md")

          completed = "- `people-of-places-method.md` synkronisert med manifest/audit/gate og registrert som canonical redaksjonell metode"
          if completed not in readme:
              anchor = "- `PEOPLE_IMAGES.md` synkronisert med pipeline og registrert som canonical bilde- og rettighetskontrakt"
              if anchor not in readme:
                  raise SystemExit("Fant ikke People Images-ankeret under Gjennomført")
              readme = readme.replace(anchor, anchor + "\n" + completed, 1)
          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Remove one-time files from target branch
        shell: bash
        run: |
          rm -f .github/people-of-places-governance-trigger.txt
          rm -f .github/workflows/one-time-register-people-of-places-governance.yml

      - name: Validate documentation governance
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build:scripts
          node dist/scripts/check-documentation-governance.mjs

      - name: Reset generated build output
        shell: bash
        run: |
          git restore --source=HEAD --worktree --staged -- dist 2>/dev/null || true
          git clean -fd -- dist

      - name: Verify registration and target scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          registry = json.loads(Path("docs/documentation_registry.json").read_text(encoding="utf-8"))
          entries = {entry["path"]: entry for entry in registry["documents"]}
          method = entries["docs/people-of-places-method.md"]
          assert method["status"] == "canonical"
          assert method["owns"] == ["people_of_places_method"]

          inventory = json.loads(Path("reports/documentation-governance/inventory.json").read_text(encoding="utf-8"))
          assert "docs/people-of-places-method.md" not in inventory["unregistered_governance_candidates"]

          tracked = set(subprocess.check_output(["git", "diff", "--name-only", "HEAD"]).decode().splitlines())
          untracked = set(subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"]).decode().splitlines())
          changed = tracked | untracked
          expected = {
              ".github/people-of-places-governance-trigger.txt",
              ".github/workflows/one-time-register-people-of-places-governance.yml",
              "docs/README.md",
              "docs/documentation_registry.json",
              "reports/documentation-governance/inventory.json",
          }
          assert changed == expected, (changed, expected)
          PY

      - name: Commit final target branch
        shell: bash
        run: |
          git add -A
          git commit -m "Registrer canonical People of Places-governance"
          git push origin HEAD:agent/documentation-governance-phase-22-people-of-places
