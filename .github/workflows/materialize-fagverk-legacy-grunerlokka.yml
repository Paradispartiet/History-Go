name: Materialize Fagverk legacy Grunerlokka

on:
  push:
    branches:
      - agent/fagverk-legacy-grunerlokka-20260831
    paths:
      - tools/materialize-fagverk-legacy-grunerlokka-v1.mjs
      - .github/workflows/materialize-fagverk-legacy-grunerlokka.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Materialize four legacy place pages
        run: node tools/materialize-fagverk-legacy-grunerlokka-v1.mjs
      - name: Rebuild derived place and Fagverk artifacts
        run: |
          node scripts/build-place-open-payloads.mjs
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate the materialized result
        run: |
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-place-open-payloads.mjs --check
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/fagverk-place-substance-audit.test.mjs
          node --test tests/fagverk-link-audit.test.mjs
          node scripts/audit-place-images.mjs --mode=changed
          git diff --check
      - name: Commit materialized production data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/places/by/oslo/places/birkelunden.json \
            data/places/by/oslo/places/olaf_ryes_plass.json \
            data/places/by/oslo/sofienbergparken.json \
            data/places/by/oslo/places/markveien.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/fagverk-place-page-coverage-v2.json \
            data/runtime
          git diff --cached --quiet && { echo "No materialized changes"; exit 1; }
          git commit -m "Materialize Grunerlokka Fagverk legacy batch"
          git push origin HEAD:${GITHUB_REF_NAME}
