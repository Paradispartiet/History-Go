name: One-time compare Civication outcomes

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/civication-outcome-compare-trigger.txt

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: main
            ref: main
          - name: people-popup-branch
            ref: agent/people-popup-system-and-readiness-audit
    steps:
      - name: Check out target
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture Civication outcome tests
        id: test
        shell: bash
        run: |
          mkdir -p reports/civication-outcome-compare
          set +e
          npm run test:civication > reports/civication-outcome-compare/${{ matrix.target.name }}.log 2>&1
          status=$?
          set -e
          cat reports/civication-outcome-compare/${{ matrix.target.name }}.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload complete test log
        uses: actions/upload-artifact@v4
        with:
          name: civication-outcome-${{ matrix.target.name }}-${{ github.run_id }}
          path: reports/civication-outcome-compare/${{ matrix.target.name }}.log
          if-no-files-found: error

      - name: Enforce result
        if: steps.test.outputs.status != '0'
        run: exit 1
