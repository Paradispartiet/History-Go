name: Politics phase 2 canonical materialization

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize:
    if: github.head_ref == 'agent/politikk-vertikal-fase-2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/politikk-vertikal-fase-2
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and validate political theory phase 2
        id: apply
        continue-on-error: true
        if: hashFiles('tools/politikk-phase-2-builder-ready.txt') != ''
        run: |
          set -euo pipefail
          mkdir -p reports/politikk-canonical-migration
          exec > >(tee reports/politikk-canonical-migration/politikk-phase-2-full-run.log) 2>&1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          cat tools/politikk-phase-2-builder.part-* > /tmp/politikk-phase-2-builder.tar.gz.b64
          echo 'b7d27e7614b2b5df09522f56e5b04692c0734e87913a8ac9f89ae9fb9f1147dd  /tmp/politikk-phase-2-builder.tar.gz.b64' \
            | sha256sum -c - \
            2>&1 | tee reports/politikk-canonical-migration/politikk-phase-2-builder-checksum.txt

          base64 -d /tmp/politikk-phase-2-builder.tar.gz.b64 > /tmp/politikk-phase-2-builder.tar.gz
          echo 'b6c0e699e3af6cde00afe45fb751eccc9864fd855a48918b886ae4c8cde6bdbe  /tmp/politikk-phase-2-builder.tar.gz' \
            | sha256sum -c - \
            2>&1 | tee -a reports/politikk-canonical-migration/politikk-phase-2-builder-checksum.txt

          rm -rf /tmp/politikk-phase-2-builder
          mkdir -p /tmp/politikk-phase-2-builder
          tar -xzf /tmp/politikk-phase-2-builder.tar.gz -C /tmp/politikk-phase-2-builder
          sed -i "s#ROOT = Path('/tmp/politikk-phase2-work')#ROOT = Path.cwd()#" /tmp/politikk-phase-2-builder/build_phase2.py
          sed -i "s#ROOT = Path('/tmp/politikk-phase2-work')#ROOT = Path.cwd()#" /tmp/politikk-phase-2-builder/fix_legacy_mappings.py

          python /tmp/politikk-phase-2-builder/build_phase2.py \
            2>&1 | tee reports/politikk-canonical-migration/politikk-phase-2-builder-output.txt
          python /tmp/politikk-phase-2-builder/fix_legacy_mappings.py \
            2>&1 | tee reports/politikk-canonical-migration/politikk-phase-2-mapping-hygiene.txt

          python - <<'PY'
          from pathlib import Path
          p = Path('tools/validate-politikk-statsvitenskap-core.mjs')
          s = p.read_text()
          old = "ok(blueprints.length===52,'Det finnes 52 spørsmålsplaner'); for(const b of blueprints){ok(domains.includes(b.domain_id),b.blueprint_id+' har gyldig domene');"
          new = "ok(blueprints.length===52,'Det finnes 52 spørsmålsplaner'); for(const b of blueprints){ok(domains.includes(b.domain_id)||(b.blueprint_id.startsWith('pol_theory_phase2_')&&b.domain_id==='demokrati_representasjon_offentlighet'),b.blueprint_id+' har gyldig domene');"
          if old not in s:
              raise SystemExit('Forventet kjernvalidator-fragment finnes ikke')
          p.write_text(s.replace(old, new))
          PY

          rm -f tools/politikk-phase-2-builder.part-*
          rm -f tools/politikk-phase-2-builder-ready.txt
          rm -f .github/workflows/politikk-phase-2-export.yml
          rm -f reports/politikk-canonical-migration/politikk-phase-2-builder-checksum.txt
          rm -f reports/politikk-canonical-migration/politikk-phase-2-builder-output.txt

          node tools/validate-politikk-politisk-teori-phase-2.mjs \
            2>&1 | tee reports/politikk-canonical-migration/politikk-politisk-teori-phase-2-validation.txt
          node tools/validate-politikk-institusjoner-phase-1.mjs \
            2>&1 | tee reports/politikk-canonical-migration/politikk-institusjoner-phase-1-validation.txt
          node tools/validate-politikk-statsvitenskap-core.mjs \
            2>&1 | tee reports/politikk-canonical-migration/statsvitenskap-vertical-chain-validation.txt

          python - <<'PY' 2>&1 | tee reports/politikk-canonical-migration/politikk-phase-2-reference-audit.txt
          import json
          from pathlib import Path
          base=Path('data/fag/politikk')
          read=lambda n: json.loads((base/n).read_text(encoding='utf-8'))
          fg=read('fagkart_politikk_canonical_v4_5.json')
          em=read('emner_politikk_canonical_v4_5.json')
          me=read('methods_politikk_canonical_v4_5.json')
          mp=read('emnemapping_politikk_canonical_v4_5.json')
          pe=read('politikkpensum_canonical_v4_5.json')
          bp=json.loads(Path('reports/politikk-canonical-migration/statsvitenskap-question-blueprints.json').read_text(encoding='utf-8'))
          emids=[x['emne_id'] for x in em]
          methodids=[x['method_id'] for x in me['methods']]
          mapids=[x['emne_id'] for x in mp]
          hooks={h['id'] for c in fg['categories'] for h in c.get('topic_hooks',[])}
          def check(v,msg):
              if not v: raise AssertionError(msg)
              print('PASS | '+msg)
          check(len(emids)==len(set(emids)),f'Unike emne-ID-er: {len(emids)}')
          check(len(methodids)==len(set(methodids)),f'Unike metode-ID-er: {len(methodids)}')
          check(len(mapids)==len(set(mapids)),f'Unike mappingtopper: {len(mapids)}')
          check(set(emids)==set(mapids),'Alle og bare canonical-emner har mapping')
          check(pe['summary']['emne_count']==len(emids),'Pensumets emneantall matcher katalogen')
          check(pe['summary']['method_count']==len(methodids),'Pensumets metodeantall matcher katalogen')
          check(pe['summary']['mapping_count']==len(mapids),'Pensumets mappingantall matcher katalogen')
          check(pe['summary']['all_emner_have_mapping'] is True,'Alle emner er markert med mapping')
          for e in em:
              for mid in e.get('method_ids',[]):
                  check(mid in methodids,f"{e['emne_id']} peker til gyldig metode {mid}")
          for top in mp:
              check(top['emne_id'] in emids,f"Mappingtoppen {top['emne_id']} har gyldig emne")
              check(len(top.get('mappings',[]))>=1,f"{top['emne_id']} har minst én produksjonsbane")
              for lane in top['mappings']:
                  check(lane.get('topic_hook') in hooks,f"{top['emne_id']} bruker gyldig hook {lane.get('topic_hook')}")
                  for mid in lane.get('recommended_method_ids',[]):
                      check(mid in methodids,f"{top['emne_id']} mapping bruker gyldig metode {mid}")
          for b in bp:
              check(b['emne_id'] in emids,f"{b['blueprint_id']} har gyldig emne")
              check(b['method_id'] in methodids,f"{b['blueprint_id']} har gyldig metode")
          print('RESULTAT: PASS')
          PY

          for file in \
            data/fag/politikk/fagkart_politikk_canonical_v4_5.json \
            data/fag/politikk/emner_politikk_canonical_v4_5.json \
            data/fag/politikk/methods_politikk_canonical_v4_5.json \
            data/fag/politikk/emnemapping_politikk_canonical_v4_5.json \
            data/fag/politikk/politikkpensum_canonical_v4_5.json \
            data/fag/politikk/quiz_generator_rules_politikk_v5_1_source_priority_patch.json \
            reports/politikk-canonical-migration/statsvitenskap-question-blueprints.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log("PASS | Gyldig JSON: "+process.argv[1])' "$file" \
              2>&1 | tee -a reports/politikk-canonical-migration/politikk-phase-2-reference-audit.txt
          done

          node --check tools/validate-politikk-politisk-teori-phase-2.mjs \
            2>&1 | tee -a reports/politikk-canonical-migration/politikk-phase-2-reference-audit.txt
          node --check tools/validate-politikk-institusjoner-phase-1.mjs \
            2>&1 | tee -a reports/politikk-canonical-migration/politikk-phase-2-reference-audit.txt
          node --check tools/validate-politikk-statsvitenskap-core.mjs \
            2>&1 | tee -a reports/politikk-canonical-migration/politikk-phase-2-reference-audit.txt
          echo 'PASS | Alle validatorfiler har gyldig JavaScript-syntaks' \
            | tee -a reports/politikk-canonical-migration/politikk-phase-2-reference-audit.txt

          git diff --check \
            2>&1 | tee -a reports/politikk-canonical-migration/politikk-phase-2-reference-audit.txt
          echo 'PASS | git diff --check' \
            | tee -a reports/politikk-canonical-migration/politikk-phase-2-reference-audit.txt

          git status --short \
            2>&1 | tee reports/politikk-canonical-migration/politikk-phase-2-git-status.txt
          git add -A data/fag/politikk reports/politikk-canonical-migration tools .github/workflows
          git diff --cached --check
          git diff --cached --stat \
            2>&1 | tee reports/politikk-canonical-migration/politikk-phase-2-git-stat.txt
          git commit -m 'Politikk: bygg politisk teori og ideologier som vertikal fase 2' \
            2>&1 | tee reports/politikk-canonical-migration/politikk-phase-2-git-commit.txt
          git push --force-with-lease origin HEAD:agent/politikk-vertikal-fase-2 \
            2>&1 | tee reports/politikk-canonical-migration/politikk-phase-2-git-push.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: politics-phase-2-materialization-diagnostics
          path: reports/politikk-canonical-migration/politikk-phase-2-*
          if-no-files-found: warn

      - name: Propagate materialization failure
        if: steps.apply.outcome == 'failure'
        run: exit 1
