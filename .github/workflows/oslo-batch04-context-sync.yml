name: Sync Oslo batch04 quiz production contexts
on:
  push:
    branches:
      - content/oslo-batch04-remaining-12-fagverk-20261021
    paths:
      - .github/workflows/oslo-batch04-context-sync.yml
permissions:
  contents: write
concurrency:
  group: oslo-batch04-context-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate Stortorget and Sagene skole quiz contexts on latest branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=content/oslo-batch04-remaining-12-fagverk-20261021
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard FETCH_HEAD
            for spec in 'by stortorget' 'historie sagene_skole'; do
              read -r category target <<< "$spec"
              output="data/quiz/production_context/$category/$target.json"
              node scripts/build-quiz-production-context.mjs --category "$category" --target "$target" --output "$output"
              node scripts/build-quiz-production-context.mjs --category "$category" --target "$target" --output "$output" --check
              git add "$output"
            done
            if git diff --cached --quiet; then echo 'Contexts synchronized'; exit 0; fi
            git commit -m "build(history): sync Sagene skole and Stortorget quiz contexts for Oslo batch04"
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
          done
          echo 'Failed to sync with concurrent branch commits after 5 attempts' >&2
          exit 1
