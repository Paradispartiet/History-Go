name: Torggata phase 12 People preflight

on:
  push:
    branches:
      - agent/torggata-phase12-people-links
    paths:
      - .github/workflows/torggata-phase12-people-preflight.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Torggata People preflight snapshot
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const readJson = rel => JSON.parse(fs.readFileSync(rel, 'utf8'));
          const rows = data => Array.isArray(data) ? data : (Array.isArray(data?.people) ? data.people : (data?.id ? [data] : []));
          const manifest = readJson('data/people/manifest.json');
          const expected = [
            'thorvald_meyer', 'henrik_bull', 'christian_morgenstierne', 'arne_eide',
            'thoger_binneballe', 'harald_olsen', 'alma_fahlstrom', 'johan_fahlstrom',
            'ludvig_christian_jensen', 'adelsten_jensen', 'peter_marinius_jensen', 'karl_a_jensen', 'thorvald_jensen',
            'nanna_broch', 'wulff_becker', 'martin_heinz_zilsel', 'alexander_claes',
            'therese_hurwitz', 'jenny_hurwitz', 'fredrik_hurwitz', 'moritz_glott'
          ];

          const records = [];
          for (const rel of manifest.files) {
            const file = path.join('data', rel);
            for (const person of rows(readJson(file))) records.push({ person, file });
          }
          const byId = new Map(records.map(row => [String(row.person?.id || '').trim(), row]));

          const people = expected.map(id => {
            const row = byId.get(id);
            if (!row) return { id, missing_record: true };
            const p = row.person;
            const places = Array.isArray(p.places) ? p.places.map(String) : [];
            const sources = Array.isArray(p.source_urls) ? p.source_urls.filter(Boolean) : [];
            const externalSourceUrls = Array.isArray(p.externalLinks)
              ? p.externalLinks.filter(link => link?.type === 'source' && link?.url).map(link => link.url)
              : [];
            const image = String(p.image || '').trim();
            const cardImage = String(p.cardImage || '').trim();
            const imageMeta = p.imageMeta && typeof p.imageMeta === 'object' ? p.imageMeta : null;
            return {
              id,
              name: p.name || '',
              file: row.file,
              placeId: p.placeId || null,
              places,
              torggata_link: p.placeId === 'torggata' || places.includes('torggata'),
              desc: p.desc || '',
              popupDesc: p.popupDesc || '',
              source_count: new Set([...sources, ...externalSourceUrls]).size,
              source_urls: [...new Set([...sources, ...externalSourceUrls])],
              verifiedAt: p.verifiedAt || null,
              profileStatus: p.profileStatus || null,
              claimsFile: p.claimsFile || null,
              image,
              cardImage,
              image_ready: Boolean(image && cardImage),
              image_meta_present: Boolean(imageMeta),
              image_media_type: imageMeta?.mediaType || null,
              image_source: imageMeta?.source || null,
              round_holdback_torggata: Array.isArray(p.roundHoldbacks) && p.roundHoldbacks.map(String).includes('torggata')
            };
          });

          const duplicateDescriptions = values => {
            const groups = new Map();
            for (const item of people) {
              const value = String(item?.[values] || '').trim().replace(/\s+/g, ' ');
              if (!value) continue;
              const ids = groups.get(value) || [];
              ids.push(item.id);
              groups.set(value, ids);
            }
            return [...groups.entries()].filter(([, ids]) => ids.length > 1).map(([text, ids]) => ({ ids, text }));
          };

          const report = {
            schema: 'history_go_torggata_phase12_people_preflight_v1',
            generated_at: '2026-08-12',
            place_id: 'torggata',
            phase: '12',
            prior_work_gate: {
              search_status: 'UTFØRT',
              prior_people_batches: ['8A1', '8A2', '8A3', '8A closeout'],
              expected_runtime_people: expected.length,
              decision: 'RE-AUDIT_EXISTING_8A_AGAINST_CURRENT_PHASE12_CONTRACT'
            },
            totals: {
              expected: expected.length,
              records_found: people.filter(p => !p.missing_record).length,
              torggata_linked: people.filter(p => p.torggata_link).length,
              with_sources: people.filter(p => p.source_count > 0).length,
              image_ready: people.filter(p => p.image_ready).length,
              image_missing: people.filter(p => !p.image_ready).length,
              held_back: people.filter(p => p.round_holdback_torggata).length
            },
            duplicate_exact_desc: duplicateDescriptions('desc'),
            duplicate_exact_popupDesc: duplicateDescriptions('popupDesc'),
            people,
            phase12_gate: {
              people_linkage_ready: people.every(p => !p.missing_record && p.torggata_link && p.source_count > 0 && !p.round_holdback_torggata),
              image_round_ready: people.every(p => p.image_ready),
              status: people.every(p => !p.missing_record && p.torggata_link && p.source_count > 0 && !p.round_holdback_torggata && p.image_ready)
                ? 'PASS_CANDIDATE'
                : 'REQUIRES_REPAIR'
            }
          };

          fs.writeFileSync('reports/place-production/torggata-phase12-people-preflight-v1.json', JSON.stringify(report, null, 2) + '\n');
          NODE
      - name: Run existing People gates
        run: |
          npm run audit:people-of-places
          npm run people:images:audit
          npm run civication:history-people:check
          node --test tests/torggata-phase8a-closeout.test.mjs
      - name: Persist preflight and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/torggata-phase12-people-preflight.yml
          git add -A
          git diff --cached --check
          echo "Phase 12 preflight diff:"
          git diff --cached --name-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Kartlegg Torggata fase 12 People-status"
          git push origin HEAD:agent/torggata-phase12-people-links
