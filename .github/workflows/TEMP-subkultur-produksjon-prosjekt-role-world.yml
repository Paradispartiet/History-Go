name: TEMP Subkultur Produksjon og prosjekt Role World

on:
  push:
    branches:
      - agent/civication-subkultur-produksjon-prosjekt-role-world-rollout

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntax check Role World materializer
        run: |
          node --check .github/TEMP-subkultur-produksjon-prosjekt-role-world-materializer.mjs
          node --check .github/TEMP-subkultur-produksjon-prosjekt-role-world-standing-normalizer.mjs
      - name: Materialize authored Role World
        run: node .github/TEMP-subkultur-produksjon-prosjekt-role-world-materializer.mjs
      - name: Make standing consequences beat-specific
        run: node .github/TEMP-subkultur-produksjon-prosjekt-role-world-standing-normalizer.mjs
      - name: Regenerate Role World readiness
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Focused Role World gate
        run: node tests/civication-subkultur-produksjon-og-prosjekt-role-world-rollout.test.js
      - name: Prerequisite compatibility
        run: node tests/civication-subkultur-produksjon-og-prosjekt-prerequisites.test.js
      - name: Career gameplay parity
        run: node scripts/audit-civication-career-gameplay.mjs --check
      - name: Role World readiness parity
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --check
      - name: Compiled scene registry parity
        run: node scripts/build-civication-scene-registry.mjs --check
      - name: Full Civication
        run: npm run test:civication
      - name: Repository diff gate
        run: git diff --check
      - name: Publish permanent Role World state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/TEMP-subkultur-produksjon-prosjekt-role-world-materializer.mjs
          rm -f .github/TEMP-subkultur-produksjon-prosjekt-role-world-standing-normalizer.mjs
          rm -f .github/workflows/TEMP-subkultur-produksjon-prosjekt-role-world.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/Civication/roleWorlds/subkultur/subkultur_produksjon_og_prosjekt.json \
            data/Civication/roleWorlds/index.json \
            data/Civication/roleWorldAuthoringChecklist.json \
            data/Civication/roleWorldThemeBank.json \
            data/Civication/roleWorldRolloutReadiness.json \
            reports/CIVICATION_SUBKULTUR_PRODUKSJON_OG_PROSJEKT_ROLE_WORLD_ROLLOUT_SOURCE_FIRST.md \
            tests/civication-subkultur-produksjon-og-prosjekt-role-world-rollout.test.js \
            .github/TEMP-subkultur-produksjon-prosjekt-role-world-materializer.mjs \
            .github/TEMP-subkultur-produksjon-prosjekt-role-world-standing-normalizer.mjs \
            .github/workflows/TEMP-subkultur-produksjon-prosjekt-role-world.yml
          git diff --cached --check
          git commit -m "Complete Subkultur Produksjon og prosjekt Role World [materialized]"
          git push origin HEAD:${GITHUB_REF_NAME}
