name: Sync BY knowledge v4.6

on:
  push:
    branches:
      - fix/by-editorial-v4-6-20260805
    paths:
      - ".github/workflows/sync-by-knowledge-v46.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/by-editorial-v4-6-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:scripts
      - name: Materialize canonical Knowledge
        run: node dist/scripts/knowledge-canonical-data.mjs --write
      - name: Verify canonical Knowledge
        run: node dist/scripts/knowledge-canonical-data.mjs --check
      - name: Verify BY editorial integrity
        run: node scripts/validate-by-editorial-integrity.mjs
      - name: Remove bootstrap workflow
        run: rm .github/workflows/sync-by-knowledge-v46.yml
      - name: Commit canonical sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync BY Knowledge after editorial v4.6"
          git push origin HEAD:fix/by-editorial-v4-6-20260805
