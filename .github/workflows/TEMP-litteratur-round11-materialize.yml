name: TEMP Litteratur round 11 materialize

on:
  push:
    branches:
      - agent/litteratur-maintenance-round11-medier-20260907
    paths:
      - '.github/workflows/TEMP-litteratur-round11-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/litteratur-maintenance-round11-medier-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply controlled round 11 substitution
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          area = 'medier_intermedialitet_adapsjon'
          sid = 'mi11'
          old = 'https://www.penguinrandomhouse.com/books/160890/the-complete-persepolis-by-marjane-satrapi/'
          new = 'https://www.penguinrandomhouse.com/books/160892/the-complete-persepolis-by-marjane-satrapi/'
          claims = Path('data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/medier_intermedialitet_adapsjon/claims.json')
          materializer = Path('scripts/materialize-litteratur-media-sociology-full-fields-v1.mjs')
          pathway = Path('data/quiz/litteratur/litteratur_subject_pathways_v1.json')

          for target in (claims, materializer):
            text = target.read_text()
            count = text.count(old)
            if count == 0:
              raise SystemExit(f'Fail closed: {sid} old URL missing from owner target {target}: {old}')
            target.write_text(text.replace(old, new))
            if old in target.read_text():
              raise SystemExit(f'Fail closed: {sid} stale URL remains in {target}')
            print(f'{sid}: replaced {count} occurrence(s) in {target}')

          data = json.loads(pathway.read_text())
          source_id = f'src_lit_{area}_{sid}'
          by_id = {row.get('source_id'): row for row in data.get('sources', [])}
          row = by_id.get(source_id)
          if row is None:
            raise SystemExit(f'Fail closed: pathway source_id missing: {source_id}')
          current = row.get('url')
          if current not in (old, new):
            raise SystemExit(f'Fail closed: {source_id} has unexpected pathway URL: {current!r}')

          count = 0
          def replace_exact(value):
            global count
            if isinstance(value, dict):
              return {k: replace_exact(v) for k, v in value.items()}
            if isinstance(value, list):
              return [replace_exact(v) for v in value]
            if isinstance(value, str) and value == old:
              count += 1
              return new
            return value

          data = replace_exact(data)
          by_id = {row.get('source_id'): row for row in data.get('sources', [])}
          if by_id[source_id].get('url') != new:
            raise SystemExit(f'Fail closed: pathway root URL not current after replacement: {source_id}')
          print(f'{sid}: replaced {count} exact pathway URL value(s)')
          pathway.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate derived Litteratur outputs
        run: |
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --write
          node scripts/audit-fagverk-litteratur-legacy-theory.mjs --write-report > /tmp/litteratur-legacy-theory-round11.json
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate round 11 focused gates
        run: |
          node --check scripts/audit-litteratur-maintenance-source-refresh-round11.mjs
          node scripts/audit-litteratur-maintenance-source-refresh-round11.mjs
          node --test tests/litteratur-maintenance-source-refresh-round11.test.mjs
          node scripts/audit-litteratur-assessment-v1.mjs
          node tools/audit-litteratur-theory-integrity.mjs
          node --test tests/litteratur-assessment-v1.test.mjs tests/litteratur-theory-integrity.test.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node scripts/audit-fagverk-litteratur-legacy-theory.mjs > /tmp/litteratur-legacy-theory-round11-check.json
      - name: Reject unrelated generator drift
        run: |
          python3 - <<'PY'
          import subprocess
          allowed = {
            'data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/medier_intermedialitet_adapsjon/claims.json',
            'data/fagverk/fagverk_release.json',
            'data/knowledge/subjects/litteratur/knowledge_units.generated.json',
            'data/quiz/litteratur/litteratur_subject_pathways_v1.json',
            'reports/fagverk/litteratur-legacy-theory-audit.json',
            'scripts/materialize-litteratur-media-sociology-full-fields-v1.mjs',
          }
          out = subprocess.check_output(['git','status','--porcelain'], text=True)
          changed = set()
          for line in out.splitlines():
            path = line[3:]
            if ' -> ' in path:
              path = path.split(' -> ',1)[1]
            changed.add(path)
          unexpected = sorted(changed - allowed)
          print('changed files:', *sorted(changed), sep='\n  ')
          if unexpected:
            raise SystemExit('Fail closed: unrelated generator drift: ' + ', '.join(unexpected))
          PY
      - name: Commit permanent data materialization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/medier_intermedialitet_adapsjon/claims.json \
            data/fagverk/fagverk_release.json \
            data/knowledge/subjects/litteratur/knowledge_units.generated.json \
            data/quiz/litteratur/litteratur_subject_pathways_v1.json \
            reports/fagverk/litteratur-legacy-theory-audit.json \
            scripts/materialize-litteratur-media-sociology-full-fields-v1.mjs
          git diff --cached --check
          git commit -m 'Materialize Litteratur source refresh round 11'
          git push origin HEAD:agent/litteratur-maintenance-round11-medier-20260907
