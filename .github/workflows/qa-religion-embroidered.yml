name: Religion embroidered badge artwork QA
on:
  pull_request:
    paths:
      - 'bilder/merker/religion/**'
      - bilder/merker/religion.webp
      - data/badges/religion.json
      - data/badges/religion_underbadge_artwork.json
      - tests/badge-artwork-coverage.test.mjs
      - .github/workflows/qa-religion-embroidered.yml
permissions:
  contents: read
jobs:
  validate-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate badge registry and JS rendering
        run: |
          node --check js/fagverk-ia-v3-badge-progress.js
          node --test tests/badge-artwork-coverage.test.mjs
      - name: Verify nine actual sewn WebP images and render preview
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          badge=json.loads(Path('data/badges/religion.json').read_text())
          art=json.loads(Path('data/badges/religion_underbadge_artwork.json').read_text())
          assert badge['color']=='#E7B517' and len(art['assets'])==8
          imgs=[('Religion',badge['image'])]+[(x['label'],x['image']) for x in art['assets']]
          assert all(x['image']==badge['subBadgeImages'][x['id']] for x in art['assets'])
          sheet=Image.new('RGB',(1050,1130),'#141c25')
          draw=ImageDraw.Draw(sheet)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',19)
          for i,(name,path) in enumerate(imgs):
              src=Path(path)
              assert src.exists() and src.suffix=='.webp'
              im=Image.open(src).convert('RGBA')
              assert im.size==(640,640)
              assert im.getpixel((0,0))[3]==0 and im.getpixel((320,320))[3]==255
              thumb=im.resize((300,300),Image.Resampling.LANCZOS)
              x=16+(i%3)*350
              y=12+(i//3)*370
              sheet.paste(thumb,(x+14,y+12),thumb)
              draw.text((x+20,y+321),name,font=font,fill='#f5e8cf')
          Path('out').mkdir(exist_ok=True)
          sheet.save('out/religion-badges-render-preview.png')
          print('Verified nine sewn textile images and rendered contact sheet')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: religion-embroidered-preview
          path: out/religion-badges-render-preview.png
          retention-days: 3
