name: Det Norske Teatret C51 deployed Objects QA
on:
  workflow_run:
    workflows: ['pages build and deployment']
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dnt-public-c51-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true
jobs:
  public-objects:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify test syntax
        run: node --check tests/det-norske-teatret-public-objects-c51.mjs
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify PUBLIC GitHub Pages Objects, photo, illustration and cards at mobile and desktop widths
        run: node tests/det-norske-teatret-public-objects-c51.mjs
      - name: Preserve public evidence and screenshots regardless of test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnt-c51-public-objects-evidence
          path: artifacts/dnt-c51-public/*
          if-no-files-found: warn
          retention-days: 10
