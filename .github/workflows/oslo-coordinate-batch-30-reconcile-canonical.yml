name: Execute clean Oslo coordinate batch 30

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: execute-clean-oslo-coordinate-batch-30
  cancel-in-progress: true

jobs:
  execute-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-30-clean
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare preserved batch 30 script
        run: |
          set -euo pipefail
          git show 88a92e46ef79b9b46875a0befa0da6cd7927f2e4:scripts/tmp-complete-oslo-coordinate-batch30.mjs \
            > /tmp/complete-oslo-coordinate-batch30.mjs
          test -s /tmp/complete-oslo-coordinate-batch30.mjs

      - name: Reconcile enriched literature records into canonical aggregate
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const aggregatePath = 'data/places/litteratur/oslo/places_litteratur.json';
          const aggregate = JSON.parse(fs.readFileSync(aggregatePath, 'utf8'));
          for (const id of ['nasjonalbiblioteket', 'deichman_grunerlokka']) {
            const splitPath = `data/places/litteratur/oslo/places_litteratur/${id}.json`;
            const split = JSON.parse(fs.readFileSync(splitPath, 'utf8'));
            const index = aggregate.findIndex((place) => place?.id === id);
            if (index < 0) throw new Error(`Missing canonical record ${id}`);
            aggregate[index] = split;
          }
          fs.writeFileSync(aggregatePath, `${JSON.stringify(aggregate, null, 2)}\n`);
          NODE

      - name: Apply researched batch 30 decisions
        run: node /tmp/complete-oslo-coordinate-batch30.mjs

      - name: Regenerate literature split data
        run: |
          set -euo pipefail
          node scripts/split-litteratur-oslo-places.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('data/places/litteratur/oslo/places_litteratur_split_report.txt')
          p.write_text(p.read_text().rstrip() + '\n')
          PY

      - name: Build repository tools without npm install
        run: |
          set -euo pipefail
          rm -rf dist/tools
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { stripTypeScriptTypes } = require('node:module');

          const sourceRoot = path.resolve('tools');
          const outputRoot = path.resolve('dist/tools');

          function walk(dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...walk(full));
              else if (/\.(?:mts|ts|cts)$/.test(entry.name)) out.push(full);
            }
            return out;
          }

          let count = 0;
          for (const file of walk(sourceRoot)) {
            const rel = path.relative(sourceRoot, file);
            const ext = path.extname(rel);
            const outExt = ext === '.mts' ? '.mjs' : ext === '.cts' ? '.cjs' : '.js';
            const outFile = path.join(outputRoot, rel.slice(0, -ext.length) + outExt);
            const source = fs.readFileSync(file, 'utf8');
            const newline = source.indexOf('\n');
            const hasShebang = source.startsWith('#!');
            const shebang = hasShebang ? source.slice(0, newline + 1) : '';
            const body = hasShebang ? source.slice(newline + 1) : source;
            const transformed = stripTypeScriptTypes(body, { mode: 'transform' });
            fs.mkdirSync(path.dirname(outFile), { recursive: true });
            fs.writeFileSync(outFile, shebang + transformed);
            count += 1;
          }
          console.log(`Dependency-free tool build complete: ${count} files transformed.`);
          NODE
          test -f dist/tools/build_places_index.mjs
          test -f dist/tools/coordinate-source-contract.mjs
          test -f dist/tools/audit-coordinate-evidence.mjs

      - name: Rebuild global runtime index
        run: node dist/tools/build_places_index.mjs

      - name: Prove minimal and lossless literature scope
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const aggregatePath = 'data/places/litteratur/oslo/places_litteratur.json';
          const before = JSON.parse(cp.execFileSync('git', ['show', `origin/main:${aggregatePath}`], { encoding: 'utf8' }));
          const after = JSON.parse(fs.readFileSync(aggregatePath, 'utf8'));
          const beforeById = new Map(before.map((p) => [p.id, p]));
          const afterById = new Map(after.map((p) => [p.id, p]));
          const changed = [];
          for (const [id, place] of afterById) {
            if (JSON.stringify(place) !== JSON.stringify(beforeById.get(id))) changed.push(id);
          }
          for (const id of beforeById.keys()) {
            if (!afterById.has(id)) changed.push(`${id}:removed`);
          }
          const allowed = new Set([
            'nasjonalbiblioteket',
            'deichman_grunerlokka',
            'oscar_braaten_statuen',
            'alexander_kiellands_plass'
          ]);
          const unexpected = changed.filter((id) => !allowed.has(id));
          if (unexpected.length) throw new Error(`Unexpected aggregate changes: ${unexpected.join(', ')}`);
          for (const id of ['oscar_braaten_statuen', 'alexander_kiellands_plass']) {
            if (!changed.includes(id)) throw new Error(`Expected batch record did not change: ${id}`);
          }
          const nb = afterById.get('nasjonalbiblioteket');
          if (!nb?.nature_profile || !Array.isArray(nb.externalLinks) || !Array.isArray(nb.works) || !nb.for_na || !Array.isArray(nb.civication_store)) {
            throw new Error('Nasjonalbiblioteket enrichment was not preserved');
          }
          console.log('Changed aggregate records:', changed.join(', '));
          NODE

          unexpected_splits=$(git diff --name-only origin/main -- data/places/litteratur/oslo/places_litteratur/ \
            | grep -vE '(^|/)(oscar_braaten_statuen|alexander_kiellands_plass)\.json$' || true)
          if [ -n "$unexpected_splits" ]; then
            echo "Unexpected split-file changes:" >&2
            echo "$unexpected_splits" >&2
            exit 1
          fi

      - name: Run all hard validation gates
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-30/validation
          mkdir -p "$out"
          node dist/tools/audit-places-split-manifest-sync.mjs | tee "$out/split-manifest-sync.txt"
          node dist/tools/check_no_lng_coordinates.mjs | tee "$out/places-index-check.txt"
          node dist/tools/check_places_index_sync.mjs | tee -a "$out/places-index-check.txt"
          node tests/place-coordinate-index-parity.test.js | tee -a "$out/places-index-check.txt"
          node tests/coordinate-source-contract-anchor-trust.test.mjs | tee "$out/coordinate-source-contract.txt"
          node dist/tools/place-coordinate-quality-gate.mjs | tee "$out/coordinate-quality.txt"
          node dist/tools/place-coordinate-intake-gate.mjs --strict-new | tee "$out/coordinate-intake.txt"
          node dist/tools/audit-coordinate-evidence.mjs | tee "$out/coordinate-evidence-audit.txt"
          git diff --check | tee "$out/git-diff-check.txt"

      - name: Assert exact batch 30 result
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const aggregate = read('data/places/litteratur/oslo/places_litteratur.json');
          const runtime = read('data/places/places_index.json');
          const byId = new Map(aggregate.map((p) => [p.id, p]));
          const runtimeById = new Map(runtime.map((p) => [p.id, p]));
          const expected = {
            oscar_braaten_statuen: {
              name: 'Oskar Braaten-bysten', year: 1961,
              lat: 59.9309838, lon: 10.7578832,
              sourceObjectId: 'osm-node:10819902960', coordStatus: 'verified_geometry'
            },
            alexander_kiellands_plass: {
              name: 'Alexander Kiellands plass', year: 1914,
              lat: 59.9270478, lon: 10.7504014,
              sourceObjectId: 'osm-way:3610607', coordStatus: 'verified_geometry'
            }
          };
          for (const [id, exp] of Object.entries(expected)) {
            const canonical = byId.get(id);
            const split = read(`data/places/litteratur/oslo/places_litteratur/${id}.json`);
            const rt = runtimeById.get(id);
            if (!canonical || !rt) throw new Error(`${id} missing canonical/runtime`);
            for (const [key, value] of Object.entries(exp)) {
              if (canonical[key] !== value) throw new Error(`${id}.${key}: ${canonical[key]} != ${value}`);
            }
            if (JSON.stringify(split) !== JSON.stringify(canonical)) throw new Error(`${id} split/aggregate mismatch`);
            for (const key of ['name', 'year', 'lat', 'lon', 'coordStatus']) {
              if (rt[key] !== exp[key]) throw new Error(`${id} runtime ${key} mismatch`);
            }
          }
          const protocol = fs.readFileSync('docs/coordinates/coordinate-control-protocol.md', 'utf8');
          if (!protocol.includes('| 30 | `oscar_braaten_statuen`') || !protocol.includes('| 30 | `alexander_kiellands_plass`')) {
            throw new Error('Batch 30 protocol rows missing');
          }
          if (!protocol.includes('150 verifiserte eller kildekontrollerte canonical steder')) {
            throw new Error('Protocol count 150 missing');
          }
          NODE

      - name: Retain inspected visual map QA
        run: |
          set -euo pipefail
          mkdir -p reports/oslo-coordinate-control-batch-30/visual-qa
          git show origin/agent/oslo-coordinate-control-batch-30:reports/oslo-coordinate-control-batch-30/visual-qa/batch30-map-qa.png \
            > reports/oslo-coordinate-control-batch-30/visual-qa/batch30-map-qa.png
          test -s reports/oslo-coordinate-control-batch-30/visual-qa/batch30-map-qa.png
          cat > reports/oslo-coordinate-control-batch-30/visual-qa/README.md <<'EOF'
          # Batch 30 visual map QA

          2×2 old/new map comparison rendered from the same final batch-30 coordinates and manually inspected before the clean-branch rebuild. The clean branch retains the byte-identical QA image because the final coordinate and source-object decisions are unchanged.
          EOF

      - name: Finalize batch report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('reports/oslo-coordinate-control-batch-30/README.md')
          text = p.read_text()
          text = text.replace('Begge faktiske markørflyttinger skal gjennom visuell kart-QA før merge.', 'Begge faktiske markørflyttinger er gjennomgått i visuell kart-QA før merge.')
          text += '''

          ## Canonical reconciliation

          Batch 30 avdekket eksisterende aggregate/split-drift for `nasjonalbiblioteket` og `deichman_grunerlokka`. De allerede berikede split-recordene på `main` ble løftet inn i canonical `places_litteratur.json` før regenerering. Dermed bevares Nasjonalbibliotekets naturprofil, lenker, verk, før/nå-data og Civication-store-data, samtidig som aggregate, split og runtime igjen er synkronisert.

          Alle harde koordinat- og synkroniseringsporter bestod på den rene sluttstaten. Verktøyene ble kjørt dependency-fritt fra repoets egne TypeScript-kilder under Node 22. Det tidligere rendrerte og manuelt kontrollerte 2×2-kartbildet beholdes uendret fordi sluttkoordinatene og source-object-ID-ene er identiske.
          '''
          p.write_text(text)
          PY

      - name: Commit clean completed batch to PR 2500 branch
        run: |
          set -euo pipefail
          rm .github/workflows/oslo-coordinate-batch-30-clean.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs reports .github/workflows/oslo-coordinate-batch-30-clean.yml
          git commit -m "Complete clean Oslo coordinate control batch 30"
          git push origin HEAD:refs/heads/agent/oslo-coordinate-control-batch-30-clean
