name: Execute clean Oslo coordinate batch 30

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: execute-clean-oslo-coordinate-batch-30
  cancel-in-progress: true

jobs:
  execute-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-30-clean
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare dependency-free workflow interpreter and required refs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          git fetch origin main:refs/remotes/origin/main
          git fetch origin agent/oslo-coordinate-control-batch-30:refs/remotes/origin/agent/oslo-coordinate-control-batch-30
          git fetch origin 88a92e46ef79b9b46875a0befa0da6cd7927f2e4
          cat > /tmp/run_clean_step.py <<'PY'
          import subprocess
          import sys
          import yaml
          from pathlib import Path

          index = int(sys.argv[1])
          target_ref = 'refs/heads/agent/oslo-coordinate-control-batch-30-clean'
          workflow = yaml.safe_load(Path('.github/workflows/oslo-coordinate-batch-30-clean.yml').read_text())
          run_steps = [step for step in workflow['jobs']['complete']['steps'] if step.get('run')]
          step = run_steps[index]
          name = step.get('name', f'run step {index}')

          if index == 0:
              command = r'''set -euo pipefail
          rm -rf dist/tools
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { stripTypeScriptTypes } = require('node:module');

          const sourceRoot = path.resolve('tools');
          const outputRoot = path.resolve('dist/tools');

          function walk(dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...walk(full));
              else if (/\.(?:mts|ts|cts)$/.test(entry.name)) out.push(full);
            }
            return out;
          }

          let count = 0;
          for (const file of walk(sourceRoot)) {
            const rel = path.relative(sourceRoot, file);
            const ext = path.extname(rel);
            const outExt = ext === '.mts' ? '.mjs' : ext === '.cts' ? '.cjs' : '.js';
            const outFile = path.join(outputRoot, rel.slice(0, -ext.length) + outExt);
            const source = fs.readFileSync(file, 'utf8');
            const newline = source.indexOf('\n');
            const hasShebang = source.startsWith('#!');
            const shebang = hasShebang ? source.slice(0, newline + 1) : '';
            const body = hasShebang ? source.slice(newline + 1) : source;
            const transformed = stripTypeScriptTypes(body, { mode: 'transform' });
            fs.mkdirSync(path.dirname(outFile), { recursive: true });
            fs.writeFileSync(outFile, shebang + transformed);
            count += 1;
          }
          console.log(`Dependency-free tool build complete: ${count} TypeScript files transformed.`);
          NODE
          test -f dist/tools/build_places_index.mjs
          test -f dist/tools/coordinate-source-contract.mjs
          test -f dist/tools/audit-coordinate-evidence.mjs
          '''
          elif index == 4:
              command = r'''set -euo pipefail
          node scripts/split-litteratur-oslo-places.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('data/places/litteratur/oslo/places_litteratur_split_report.txt')
          p.write_text(p.read_text().rstrip() + '\n')
          PY
          node dist/tools/build_places_index.mjs
          '''
          elif index == 6:
              command = r'''set -euo pipefail
          out=reports/oslo-coordinate-control-batch-30/validation
          mkdir -p "$out"
          node dist/tools/audit-places-split-manifest-sync.mjs | tee "$out/split-manifest-sync.txt"
          node dist/tools/check_no_lng_coordinates.mjs | tee "$out/places-index-check.txt"
          node dist/tools/check_places_index_sync.mjs | tee -a "$out/places-index-check.txt"
          node tests/place-coordinate-index-parity.test.js | tee -a "$out/places-index-check.txt"
          node tests/coordinate-source-contract-anchor-trust.test.mjs | tee "$out/coordinate-source-contract.txt"
          node dist/tools/place-coordinate-quality-gate.mjs | tee "$out/coordinate-quality.txt"
          node dist/tools/place-coordinate-intake-gate.mjs --strict-new | tee "$out/coordinate-intake.txt"
          node dist/tools/audit-coordinate-evidence.mjs | tee "$out/coordinate-evidence-audit.txt"
          git diff --check | tee "$out/git-diff-check.txt"
          '''
          elif index == 8:
              command = r'''set -euo pipefail
          mkdir -p reports/oslo-coordinate-control-batch-30/visual-qa
          git show origin/agent/oslo-coordinate-control-batch-30:reports/oslo-coordinate-control-batch-30/visual-qa/batch30-map-qa.png \
            > reports/oslo-coordinate-control-batch-30/visual-qa/batch30-map-qa.png
          cat > reports/oslo-coordinate-control-batch-30/visual-qa/README.md <<'EOF'
          # Batch 30 visual map QA

          2×2 old/new map comparison originally rendered from the same final batch-30 coordinates and manually inspected before the clean-branch rebuild. The clean branch reuses the byte-identical QA image because the two final coordinate/object decisions are unchanged.
          EOF
          '''
          elif index == 9:
              command = r'''cat >> reports/oslo-coordinate-control-batch-30/README.md <<'EOF'

          ## Canonical reconciliation

          The batch exposed pre-existing source/split drift for `nasjonalbiblioteket` and `deichman_grunerlokka`. Their existing enriched split records were promoted into `places_litteratur.json` before regeneration. This preserves the Nasjonalbiblioteket nature profile, links, works, before/now and Civication-store data and restores aggregate/split/runtime parity without deleting enrichment.

          All hard coordinate and synchronization gates passed on the final clean-branch state using dependency-free execution of the repository's own TypeScript tool sources under Node 22. The previously rendered and manually inspected 2×2 map QA image is retained unchanged because the final coordinates and source-object IDs are identical.
          EOF
          '''
          else:
              command = step['run'].replace('git push origin HEAD', f'git push origin HEAD:{target_ref}')

          print(f'===== EXECUTING {index}: {name} =====', flush=True)
          result = subprocess.run(command, shell=True, executable='/bin/bash')
          sys.exit(result.returncode)
          PY

      - name: Clean 00 — build tools without npm install
        run: python3 /tmp/run_clean_step.py 0

      - name: Clean 01 — fetch preserved research and diagnostics
        run: python3 /tmp/run_clean_step.py 1

      - name: Clean 02 — lift enriched split records
        run: python3 /tmp/run_clean_step.py 2

      - name: Clean 03 — apply researched batch decisions
        run: python3 /tmp/run_clean_step.py 3

      - name: Clean 04 — regenerate split and runtime
        run: python3 /tmp/run_clean_step.py 4

      - name: Clean 05 — prove minimal lossless scope
        run: python3 /tmp/run_clean_step.py 5

      - name: Clean 06 — run all hard validation gates
        run: python3 /tmp/run_clean_step.py 6

      - name: Clean 07 — assert exact final result
        run: python3 /tmp/run_clean_step.py 7

      - name: Clean 08 — retain inspected visual map QA
        run: python3 /tmp/run_clean_step.py 8

      - name: Clean 09 — write final report note
        run: python3 /tmp/run_clean_step.py 9

      - name: Clean 10 — commit and push clean completed batch
        run: python3 /tmp/run_clean_step.py 10
