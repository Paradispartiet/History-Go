name: Execute clean Oslo coordinate batch 30

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: execute-clean-oslo-coordinate-batch-30
  cancel-in-progress: true

jobs:
  execute-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-30-clean
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch current main and preserved batch-30 branch
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git fetch origin agent/oslo-coordinate-control-batch-30:refs/remotes/origin/agent/oslo-coordinate-control-batch-30
          git show origin/agent/oslo-coordinate-control-batch-30:scripts/tmp-complete-oslo-coordinate-batch30.mjs \
            > /tmp/complete-oslo-coordinate-batch30.mjs
          test -s /tmp/complete-oslo-coordinate-batch30.mjs

      - name: Reconcile enriched literature records into canonical aggregate
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'data/places/litteratur/oslo/places_litteratur.json';
          const aggregate = JSON.parse(fs.readFileSync(p, 'utf8'));
          for (const id of ['nasjonalbiblioteket', 'deichman_grunerlokka']) {
            const split = JSON.parse(fs.readFileSync(`data/places/litteratur/oslo/places_litteratur/${id}.json`, 'utf8'));
            const i = aggregate.findIndex(x => x?.id === id);
            if (i < 0) throw new Error(`Missing canonical record ${id}`);
            aggregate[i] = split;
          }
          fs.writeFileSync(p, JSON.stringify(aggregate, null, 2) + '\n');
          NODE

      - name: Restore raw batch-30 diagnostics
        run: |
          set -euo pipefail
          old=origin/agent/oslo-coordinate-control-batch-30
          mkdir -p reports/oslo-coordinate-control-batch-30/coordinates
          for file in \
            alexander_kiellands_plass_address.json \
            alexander_kiellands_plass_address_status.json \
            alexander_kiellands_plass_osm.json \
            alexander_kiellands_plass_osm_identity.json \
            alexander_kiellands_plass_osm_identity_compact.json \
            alexander_kiellands_plass_ssr.json \
            oskar_braaten_byste_osm.json \
            oskar_braaten_byste_osm_identity.json \
            oskar_braaten_byste_osm_identity_compact.json \
            oskar_braaten_ssr.json
          do
            git show "$old":reports/oslo-coordinate-control-batch-30/coordinates/$file \
              > reports/oslo-coordinate-control-batch-30/coordinates/$file
          done
          git show "$old":reports/oslo-coordinate-control-batch-30/diagnostic-summary.json \
            > reports/oslo-coordinate-control-batch-30/diagnostic-summary.json

      - name: Apply researched batch 30 decisions
        run: node /tmp/complete-oslo-coordinate-batch30.mjs

      - name: Regenerate literature split data
        run: |
          set -euo pipefail
          node scripts/split-litteratur-oslo-places.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('data/places/litteratur/oslo/places_litteratur_split_report.txt')
          p.write_text(p.read_text().rstrip() + '\n')
          PY

      - name: Build repository tools without npm install
        run: |
          set -euo pipefail
          rm -rf dist/tools
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { stripTypeScriptTypes } = require('node:module');
          const src = path.resolve('tools');
          const out = path.resolve('dist/tools');
          function walk(dir) {
            return fs.readdirSync(dir, {withFileTypes:true}).flatMap(e => {
              const f=path.join(dir,e.name);
              return e.isDirectory() ? walk(f) : (/\.(?:mts|ts|cts)$/.test(e.name) ? [f] : []);
            });
          }
          for (const file of walk(src)) {
            const rel=path.relative(src,file), ext=path.extname(rel);
            const outExt=ext==='.mts'?'.mjs':ext==='.cts'?'.cjs':'.js';
            const dest=path.join(out,rel.slice(0,-ext.length)+outExt);
            const source=fs.readFileSync(file,'utf8');
            const nl=source.indexOf('\n'), has=source.startsWith('#!');
            const shebang=has?source.slice(0,nl+1):'', body=has?source.slice(nl+1):source;
            fs.mkdirSync(path.dirname(dest),{recursive:true});
            fs.writeFileSync(dest,shebang+stripTypeScriptTypes(body,{mode:'transform'}));
          }
          NODE
          test -f dist/tools/build_places_index.mjs
          test -f dist/tools/audit-places-split-manifest-sync.mjs
          test -f dist/tools/audit-coordinate-evidence.mjs

      - name: Rebuild global runtime index
        run: node dist/tools/build_places_index.mjs

      - name: Prove minimal and lossless literature scope
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'), cp=require('node:child_process');
          const p='data/places/litteratur/oslo/places_litteratur.json';
          const before=JSON.parse(cp.execFileSync('git',['show',`origin/main:${p}`],{encoding:'utf8'}));
          const after=JSON.parse(fs.readFileSync(p,'utf8'));
          const b=new Map(before.map(x=>[x.id,x])), a=new Map(after.map(x=>[x.id,x]));
          const changed=[];
          for(const [id,v] of a) if(JSON.stringify(v)!==JSON.stringify(b.get(id))) changed.push(id);
          const allowed=new Set(['nasjonalbiblioteket','deichman_grunerlokka','oscar_braaten_statuen','alexander_kiellands_plass']);
          const bad=changed.filter(id=>!allowed.has(id));
          if(bad.length) throw new Error(`Unexpected aggregate changes: ${bad.join(', ')}`);
          for(const id of ['oscar_braaten_statuen','alexander_kiellands_plass']) if(!changed.includes(id)) throw new Error(`Expected batch record did not change: ${id}`);
          const nb=a.get('nasjonalbiblioteket');
          if(!nb?.nature_profile||!Array.isArray(nb.externalLinks)||!Array.isArray(nb.works)||!nb.for_na||!Array.isArray(nb.civication_store)) throw new Error('Nasjonalbiblioteket enrichment was not preserved');
          console.log('Changed aggregate records:',changed.join(', '));
          NODE
          unexpected_splits=$(git diff --name-only origin/main -- data/places/litteratur/oslo/places_litteratur/ | grep -vE '(^|/)(oscar_braaten_statuen|alexander_kiellands_plass)\.json$' || true)
          if [ -n "$unexpected_splits" ]; then echo "$unexpected_splits" >&2; exit 1; fi

      - name: Run all hard validation gates
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-30/validation
          mkdir -p "$out"
          node dist/tools/audit-places-split-manifest-sync.mjs | tee "$out/split-manifest-sync.txt"
          node dist/tools/check_no_lng_coordinates.mjs | tee "$out/places-index-check.txt"
          node dist/tools/check_places_index_sync.mjs | tee -a "$out/places-index-check.txt"
          node tests/place-coordinate-index-parity.test.js | tee -a "$out/places-index-check.txt"
          node tests/coordinate-source-contract-anchor-trust.test.mjs | tee "$out/coordinate-source-contract.txt"
          node dist/tools/place-coordinate-quality-gate.mjs | tee "$out/coordinate-quality.txt"
          node dist/tools/place-coordinate-intake-gate.mjs --strict-new | tee "$out/coordinate-intake.txt"
          node dist/tools/audit-coordinate-evidence.mjs | tee "$out/coordinate-evidence-audit.txt"
          git diff --check | tee "$out/git-diff-check.txt"

      - name: Assert exact batch 30 result
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const read=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const a=new Map(read('data/places/litteratur/oslo/places_litteratur.json').map(x=>[x.id,x]));
          const r=new Map(read('data/places/places_index.json').map(x=>[x.id,x]));
          const expected={
            oscar_braaten_statuen:{name:'Oskar Braaten-bysten',year:1961,lat:59.9309838,lon:10.7578832,sourceObjectId:'osm-node:10819902960',coordStatus:'verified_geometry'},
            alexander_kiellands_plass:{name:'Alexander Kiellands plass',year:1914,lat:59.9270478,lon:10.7504014,sourceObjectId:'osm-way:3610607',coordStatus:'verified_geometry'}
          };
          for(const [id,e] of Object.entries(expected)){
            const c=a.get(id),s=read(`data/places/litteratur/oslo/places_litteratur/${id}.json`),rt=r.get(id);
            if(!c||!rt) throw new Error(`${id} missing`);
            for(const [k,v] of Object.entries(e)) if(c[k]!==v) throw new Error(`${id}.${k} mismatch`);
            if(JSON.stringify(s)!==JSON.stringify(c)) throw new Error(`${id} split mismatch`);
            for(const k of ['name','year','lat','lon','coordStatus']) if(rt[k]!==e[k]) throw new Error(`${id} runtime ${k} mismatch`);
          }
          const protocol=fs.readFileSync('docs/coordinates/coordinate-control-protocol.md','utf8');
          if(!protocol.includes('| 30 | `oscar_braaten_statuen`')||!protocol.includes('| 30 | `alexander_kiellands_plass`')||!protocol.includes('150 verifiserte eller kildekontrollerte canonical steder')) throw new Error('Protocol batch 30 state missing');
          NODE

      - name: Retain inspected visual map QA
        run: |
          set -euo pipefail
          mkdir -p reports/oslo-coordinate-control-batch-30/visual-qa
          old=origin/agent/oslo-coordinate-control-batch-30
          git show "$old":reports/oslo-coordinate-control-batch-30/visual-qa/batch30-map-qa.png > reports/oslo-coordinate-control-batch-30/visual-qa/batch30-map-qa.png
          test -s reports/oslo-coordinate-control-batch-30/visual-qa/batch30-map-qa.png
          cat > reports/oslo-coordinate-control-batch-30/visual-qa/README.md <<'EOF'
          # Batch 30 visual map QA

          2×2 old/new map comparison rendered from the same final batch-30 coordinates and manually inspected before the clean-branch rebuild. The clean branch retains the byte-identical QA image because the final coordinate and source-object decisions are unchanged.
          EOF

      - name: Finalize and push clean batch to PR 2500
        run: |
          set -euo pipefail
          cat >> reports/oslo-coordinate-control-batch-30/README.md <<'EOF'

          ## Canonical reconciliation

          Batch 30 avdekket eksisterende aggregate/split-drift for `nasjonalbiblioteket` og `deichman_grunerlokka`. De allerede berikede split-recordene på `main` ble løftet inn i canonical `places_litteratur.json` før regenerering, slik at dataene bevares samtidig som aggregate, split og runtime igjen er synkronisert.

          Alle harde koordinat- og synkroniseringsporter bestod på den rene sluttstaten. Det tidligere rendrerte og manuelt kontrollerte 2×2-kartbildet beholdes uendret fordi sluttkoordinatene og source-object-ID-ene er identiske.
          EOF
          rm -f .github/workflows/oslo-coordinate-batch-30-clean.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs reports .github/workflows/oslo-coordinate-batch-30-clean.yml
          git commit -m "Complete clean Oslo coordinate control batch 30"
          git push origin HEAD:refs/heads/agent/oslo-coordinate-control-batch-30-clean
