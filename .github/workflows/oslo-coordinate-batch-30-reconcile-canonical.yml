name: Reconcile literature canonical source for Oslo batch 30

on:
  push:
    branches:
      - agent/oslo-coordinate-control-batch-30
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: oslo-coordinate-batch-30-reconcile-canonical
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-30
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lift existing enriched main splits into canonical aggregate
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:data/places/litteratur/oslo/places_litteratur/nasjonalbiblioteket.json > /tmp/nasjonalbiblioteket-main.json
          git show origin/main:data/places/litteratur/oslo/places_litteratur/deichman_grunerlokka.json > /tmp/deichman-grunerlokka-main.json

          node <<'NODE'
          const fs = require('fs');
          const aggregateFile = 'data/places/litteratur/oslo/places_litteratur.json';
          const aggregate = JSON.parse(fs.readFileSync(aggregateFile, 'utf8'));
          const replacements = {
            nasjonalbiblioteket: JSON.parse(fs.readFileSync('/tmp/nasjonalbiblioteket-main.json', 'utf8')),
            deichman_grunerlokka: JSON.parse(fs.readFileSync('/tmp/deichman-grunerlokka-main.json', 'utf8')),
          };
          for (const [id, replacement] of Object.entries(replacements)) {
            const index = aggregate.findIndex((place) => place?.id === id);
            if (index < 0) throw new Error(`Missing ${id} in canonical aggregate`);
            aggregate[index] = replacement;
          }
          fs.writeFileSync(aggregateFile, JSON.stringify(aggregate, null, 2) + '\n');
          NODE

      - name: Regenerate split, manifest, index and global runtime
        run: |
          set -euo pipefail
          node scripts/split-litteratur-oslo-places.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('data/places/litteratur/oslo/places_litteratur_split_report.txt')
          p.write_text(p.read_text().rstrip() + '\n')
          PY
          npm run places:index:build

      - name: Prove enriched split records are preserved exactly
        run: |
          set -euo pipefail
          cmp -s /tmp/nasjonalbiblioteket-main.json data/places/litteratur/oslo/places_litteratur/nasjonalbiblioteket.json
          cmp -s /tmp/deichman-grunerlokka-main.json data/places/litteratur/oslo/places_litteratur/deichman_grunerlokka.json
          echo "Enriched Nasjonalbiblioteket and Deichman Grünerløkka split records preserved byte-for-byte."

      - name: Run all hard validation gates
        shell: bash
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-30/validation
          mkdir -p "$out"

          npm run audit:places-split-manifest-sync | tee "$out/split-manifest-sync.txt"
          npm run places:index:check | tee "$out/places-index-check.txt"
          npm run test:coordinate-source-contract | tee "$out/coordinate-source-contract.txt"
          npm run places:coords:quality | tee "$out/coordinate-quality.txt"
          npm run places:coords:intake | tee "$out/coordinate-intake.txt"
          npm run places:coords:evidence:audit | tee "$out/coordinate-evidence-audit.txt"
          git diff --check | tee "$out/git-diff-check.txt"

      - name: Assert canonical reconciliation and exact batch 30 result
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const aggregate = read('data/places/litteratur/oslo/places_litteratur.json');
          const runtime = read('data/places/places_index.json');
          const byId = new Map(aggregate.map((p) => [p.id, p]));
          const runtimeById = new Map(runtime.map((p) => [p.id, p]));

          const nb = byId.get('nasjonalbiblioteket');
          if (!nb?.nature_profile || !Array.isArray(nb.externalLinks) || !Array.isArray(nb.works) || !nb.for_na || !Array.isArray(nb.civication_store)) {
            throw new Error('Nasjonalbiblioteket enrichment was not lifted into canonical aggregate');
          }
          const dg = byId.get('deichman_grunerlokka');
          if (dg?.coordVerifiedAt !== '2026-07-17') {
            throw new Error(`Deichman Grünerløkka coordVerifiedAt not reconciled: ${dg?.coordVerifiedAt}`);
          }

          const expected = {
            oscar_braaten_statuen: {
              name: 'Oskar Braaten-bysten', year: 1961,
              lat: 59.9309838, lon: 10.7578832,
              sourceObjectId: 'osm-node:10819902960', coordStatus: 'verified_geometry'
            },
            alexander_kiellands_plass: {
              name: 'Alexander Kiellands plass', year: 1914,
              lat: 59.9270478, lon: 10.7504014,
              sourceObjectId: 'osm-way:3610607', coordStatus: 'verified_geometry'
            }
          };
          for (const [id, exp] of Object.entries(expected)) {
            const place = byId.get(id);
            const rt = runtimeById.get(id);
            const split = read(`data/places/litteratur/oslo/places_litteratur/${id}.json`);
            if (!place || !rt) throw new Error(`${id} missing from aggregate/runtime`);
            for (const [key, value] of Object.entries(exp)) {
              if (place[key] !== value) throw new Error(`${id}.${key} mismatch`);
            }
            if (JSON.stringify(split) !== JSON.stringify(place)) throw new Error(`${id} split/aggregate mismatch`);
            for (const key of ['name','year','lat','lon','coordStatus']) {
              if (rt[key] !== exp[key]) throw new Error(`${id} runtime ${key} mismatch`);
            }
          }
          NODE

      - name: Record reconciliation note
        run: |
          cat >> reports/oslo-coordinate-control-batch-30/README.md <<'EOF'

## Canonical split reconciliation

The batch exposed pre-existing source/split drift for `nasjonalbiblioteket` and `deichman_grunerlokka`. Existing enriched `main` split records were lifted back into `places_litteratur.json` before regeneration. This preserves the enriched Nasjonalbiblioteket profiles/links/works/civication data and the newer Deichman Grünerløkka coordinate verification date while restoring aggregate/split/runtime parity.
EOF

      - name: Commit reconciled final data and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/oslo-coordinate-batch-30-reconcile-canonical.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs reports .github/workflows/oslo-coordinate-batch-30-reconcile-canonical.yml
          git commit -m "Reconcile literature canonical source and preserve batch 30"
          git push origin HEAD
