name: Execute clean Oslo coordinate batch 30

on:
  push:
    branches:
      - agent/oslo-coordinate-control-batch-30
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: execute-clean-oslo-coordinate-batch-30
  cancel-in-progress: true

jobs:
  execute-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-30-clean
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workflow interpreter
        run: python3 -m pip install --quiet pyyaml

      - name: Execute run steps from the clean completion workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import subprocess
          import yaml
          from pathlib import Path

          workflow_path = Path('.github/workflows/oslo-coordinate-batch-30-clean.yml')
          workflow = yaml.safe_load(workflow_path.read_text())
          steps = workflow['jobs']['complete']['steps']

          for step in steps:
              command = step.get('run')
              if not command:
                  continue
              name = step.get('name', 'unnamed run step')
              print(f'\n===== EXECUTING: {name} =====', flush=True)
              subprocess.run(command, shell=True, executable='/bin/bash', check=True)
          PY
