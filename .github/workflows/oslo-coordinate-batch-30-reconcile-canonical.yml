name: Execute clean Oslo coordinate batch 30

on:
  push:
    branches:
      - agent/oslo-coordinate-control-batch-30
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: execute-clean-oslo-coordinate-batch-30
  cancel-in-progress: true

jobs:
  execute-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-30-clean
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workflow interpreter
        run: python3 -m pip install --quiet pyyaml

      - name: Execute run steps from the clean completion workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import subprocess
          import sys
          import yaml
          from pathlib import Path

          target_branch = 'agent/oslo-coordinate-control-batch-30-clean'
          workflow_path = Path('.github/workflows/oslo-coordinate-batch-30-clean.yml')
          workflow = yaml.safe_load(workflow_path.read_text())
          steps = workflow['jobs']['complete']['steps']

          for step in steps:
              command = step.get('run')
              if not command:
                  continue
              command = command.replace('git push origin HEAD', f'git push origin HEAD:{target_branch}')
              name = step.get('name', 'unnamed run step')
              print(f'===== EXECUTING: {name} =====', flush=True)
              result = subprocess.run(
                  command,
                  shell=True,
                  executable='/bin/bash',
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              output = result.stdout or ''
              tail = '\n'.join(output.splitlines()[-120:])
              if result.returncode != 0:
                  report = Path('reports/oslo-coordinate-control-batch-30/clean-runner-error.txt')
                  report.parent.mkdir(parents=True, exist_ok=True)
                  report.write_text(
                      f'FAILED STEP: {name}\nEXIT CODE: {result.returncode}\n\nLAST OUTPUT LINES:\n{tail}\n'
                  )
                  print(report.read_text(), flush=True)
                  subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
                  subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
                  subprocess.run(['git','add',str(report)], check=True)
                  subprocess.run(['git','commit','-m',f'Capture clean batch 30 failure: {name}'], check=True)
                  subprocess.run(['git','push','origin',f'HEAD:{target_branch}'], check=True)
                  sys.exit(result.returncode)
              print(tail, flush=True)
          PY
