name: TEMP Civication Kunst Publikum og formidling Role World

on:
  push:
    branches:
      - agent/civication-kunst-publikum-og-formidling-role-world
  workflow_dispatch:

concurrency:
  group: temp-civication-kunst-publikum-og-formidling-role-world
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-and-verify:
    if: >-
      !contains(github.event.head_commit.message, '[role-world-diag-skip]') &&
      !contains(github.event.head_commit.message, 'Complete Kunst Publikum og formidling Role World')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/civication-kunst-publikum-og-formidling-role-world
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Syntax-check materializer
        run: node --check scripts/TEMP_materialize_kunst_publikum_og_formidling_role_world.mjs

      - name: Verify prerequisite baseline before Role World materialization
        run: node tests/civication-kunst-publikum-og-formidling-prerequisites.test.js

      - name: Materialize Role World candidate
        id: materialize
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/TEMP_materialize_kunst_publikum_og_formidling_role_world.mjs 2>&1 | tee /tmp/kunst-publikum-og-formidling-role-world-materializer.log

      - name: Persist materializer diagnostic fail-closed
        if: steps.materialize.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/kunst-publikum-og-formidling-role-world-materializer.log /tmp/materializer.log
          git reset --hard HEAD
          git clean -fd
          mkdir -p reports/TEMP
          cp /tmp/materializer.log reports/TEMP/kunst-publikum-og-formidling-role-world-materializer.log
          git add reports/TEMP/kunst-publikum-og-formidling-role-world-materializer.log
          git diff --cached --check
          git commit -m "Record Kunst Publikum og formidling Role World materializer diagnostic [role-world-diag-skip]"
          git push origin HEAD:agent/civication-kunst-publikum-og-formidling-role-world
          exit 1

      - name: Verify complete Role World candidate
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            echo '=== Career gameplay audit ==='
            node scripts/audit-civication-career-gameplay.mjs --write
            echo '=== Role World rollout readiness audit ==='
            node scripts/audit-civication-role-world-rollout-readiness.mjs --write
            echo '=== Focused Kunst Publikum og formidling Role World test ==='
            node tests/civication-kunst-publikum-og-formidling-role-world-rollout.test.js
            echo '=== Global Role World contract ==='
            node tests/civication-role-world-contract.test.js
            echo '=== Career gameplay matrix test ==='
            node tests/civication-career-gameplay-matrix.test.js
            echo '=== Role World rollout readiness test ==='
            node tests/civication-role-world-rollout-readiness.test.js
            echo '=== Role Pack depth ==='
            node tests/civication-role-pack-depth.test.js
            echo '=== Scene Registry check ==='
            node scripts/build-civication-scene-registry.mjs --check
            echo '=== Scenario People build ==='
            node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
            echo '=== Scenario People check ==='
            node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
            echo '=== Scenario People test ==='
            node --test tests/civication-scenario-people.test.mjs
            echo '=== Full Civication suite ==='
            node tests/run-civication-tests.mjs
            echo '=== Job learning profiles ==='
            npm run audit:job-learning-profiles
            echo '=== Job knowledge requirements ==='
            npm run audit:job-knowledge-requirements
          } 2>&1 | tee /tmp/kunst-publikum-og-formidling-role-world-verification.log

      - name: Persist verification diagnostic fail-closed
        if: steps.verify.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          tail -n 360 /tmp/kunst-publikum-og-formidling-role-world-verification.log > /tmp/verification-tail.log
          git reset --hard HEAD
          git clean -fd
          mkdir -p reports/TEMP
          cp /tmp/verification-tail.log reports/TEMP/kunst-publikum-og-formidling-role-world-verification.log
          git add reports/TEMP/kunst-publikum-og-formidling-role-world-verification.log
          git diff --cached --check
          git commit -m "Record Kunst Publikum og formidling Role World verification diagnostic [role-world-diag-skip]"
          git push origin HEAD:agent/civication-kunst-publikum-og-formidling-role-world
          exit 1

      - name: Commit verified permanent Role World
        if: steps.materialize.outcome == 'success' && steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/TEMP_materialize_kunst_publikum_og_formidling_role_world.mjs
          rm -f .github/workflows/TEMP-civication-kunst-publikum-og-formidling-role-world.yml
          rm -f reports/TEMP/kunst-publikum-og-formidling-role-world-materializer.log
          rm -f reports/TEMP/kunst-publikum-og-formidling-role-world-verification.log
          rmdir reports/TEMP 2>/dev/null || true
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.' >&2
            exit 1
          fi
          git diff --cached --check
          git status --short
          git commit -m "Complete Kunst Publikum og formidling Role World"
          git push origin HEAD:agent/civication-kunst-publikum-og-formidling-role-world
