name: Temporary Clemenskirken coordinate intake

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  intake:
    if: github.head_ref == 'data/oslo-clemenskirken-coordinate-intake'
    runs-on: ubuntu-latest
    steps:
      - name: Check out intake branch
        uses: actions/checkout@v4
        with:
          ref: data/oslo-clemenskirken-coordinate-intake
          fetch-depth: 0

      - name: Fetch exact Riksantikvaren locality
        shell: bash
        run: |
          set -euo pipefail
          REPORTDIR="reports/visitoslo-oslo-east-audit-20260720/clemenskirken-ruin"
          mkdir -p "$REPORTDIR"
          URL="https://api.ra.no/LokaliteterEnkeltminnerOgSikringssoner/collections/lokaliteter/items/51949?f=json"
          curl --fail --silent --show-error --location "$URL" \
            | tee "$REPORTDIR/riksantikvaren-51949-raw.json"

      - name: Parse identity geometry and duplicate gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          from pathlib import Path

          reportdir = Path('reports/visitoslo-oslo-east-audit-20260720/clemenskirken-ruin')
          feature = json.loads((reportdir / 'riksantikvaren-51949-raw.json').read_text())
          props = feature.get('properties') or {}
          geom = feature.get('geometry') or {}

          def flatten_positions(coords):
              if not isinstance(coords, list):
                  return
              if len(coords) >= 2 and all(isinstance(v, (int, float)) for v in coords[:2]):
                  yield coords
                  return
              for item in coords:
                  yield from flatten_positions(item)

          positions = list(flatten_positions(geom.get('coordinates', [])))
          if not positions:
              raise SystemExit('No geometry positions in official feature 51949')

          minx = min(p[0] for p in positions)
          maxx = max(p[0] for p in positions)
          miny = min(p[1] for p in positions)
          maxy = max(p[1] for p in positions)
          bbox_center = {'lat': (miny + maxy) / 2, 'lon': (minx + maxx) / 2}

          def ring_centroid(ring):
              if len(ring) < 4:
                  return None
              area2 = 0.0
              cx = 0.0
              cy = 0.0
              for i in range(len(ring) - 1):
                  x0, y0 = ring[i][:2]
                  x1, y1 = ring[i + 1][:2]
                  cross = x0 * y1 - x1 * y0
                  area2 += cross
                  cx += (x0 + x1) * cross
                  cy += (y0 + y1) * cross
              if abs(area2) < 1e-15:
                  return None
              return (cx / (3 * area2), cy / (3 * area2), area2 / 2)

          polygons = []
          coords = geom.get('coordinates', [])
          if geom.get('type') == 'Polygon':
              polygons = [coords]
          elif geom.get('type') == 'MultiPolygon':
              polygons = coords

          weighted = []
          for poly in polygons:
              if not poly:
                  continue
              c = ring_centroid(poly[0])
              if c:
                  weighted.append(c)
          if weighted:
              total = sum(abs(a) for _, _, a in weighted)
              centroid = {
                  'lat': sum(y * abs(a) for x, y, a in weighted) / total,
                  'lon': sum(x * abs(a) for x, y, a in weighted) / total,
              }
          else:
              centroid = bbox_center

          index = json.loads(Path('data/places/places_index.json').read_text())
          needles = ('clemens', 'klemens')
          keyword_matches = []
          for p in index:
              hay = ' '.join(str(p.get(k, '')) for k in ('id', 'name', 'desc')).lower()
              if any(n in hay for n in needles):
                  keyword_matches.append({k: p.get(k) for k in ('id', 'name', 'category', 'lat', 'lon')})

          def haversine(lat1, lon1, lat2, lon2):
              R = 6371000
              p1, p2 = math.radians(lat1), math.radians(lat2)
              dp = math.radians(lat2-lat1)
              dl = math.radians(lon2-lon1)
              a = math.sin(dp/2)**2 + math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*R*math.asin(math.sqrt(a))

          nearby = []
          for p in index:
              if isinstance(p.get('lat'), (int,float)) and isinstance(p.get('lon'), (int,float)):
                  d = haversine(centroid['lat'], centroid['lon'], p['lat'], p['lon'])
                  if d <= 350:
                      nearby.append({
                          'id': p.get('id'), 'name': p.get('name'), 'category': p.get('category'),
                          'distanceMeters': round(d, 1)
                      })
          nearby.sort(key=lambda x: x['distanceMeters'])

          summary = {
              'version': '2026-07-20-direct-object-intake',
              'candidateId': 'clemenskirken_ruin_oslo',
              'candidateName': 'Clemenskirkeruinen',
              'queriedFeatureId': '51949',
              'featureId': feature.get('id'),
              'geometryType': geom.get('type'),
              'propertyKeys': sorted(props.keys()),
              'properties': props,
              'derivedGeometryCenter': centroid,
              'bboxCenter': bbox_center,
              'duplicateGate': {
                  'keywordMatches': keyword_matches,
                  'nearbyWithin350m': nearby,
              },
              'source': {
                  'sourceProvider': 'official_heritage_registry',
                  'sourceName': 'Riksantikvaren – Lokaliteter, Enkeltminner og Sikringssoner OGC API',
                  'sourceUrl': 'https://api.ra.no/LokaliteterEnkeltminnerOgSikringssoner/collections/lokaliteter/items/51949?f=json',
                  'sourceObjectId': 'kulturminnesok:51949'
              }
          }
          (reportdir / 'direct-object-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Commit durable intake and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-clemenskirken-coordinate-intake.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record Clemenskirken direct-object coordinate intake"
          git push origin HEAD:data/oslo-clemenskirken-coordinate-intake
