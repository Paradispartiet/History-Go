name: Fill Engebanen rounds

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  generate-and-validate:
    if: github.head_ref == 'agent/fill-engebanen-rounds-batch1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Engebanen content
        run: node scripts/agent-fill-engebanen-rounds.js

      - name: Run Engebanen and inherited sport tests
        run: |
          node tests/engebanen-batch1-round-content.test.js
          node tests/steinsvollen-batch1-round-content.test.js
          node tests/etne-pumptrack-batch1-round-content.test.js
          node tests/etnesjoen-bmx-skate-batch1-round-content.test.js
          node tests/etnesjoen-tennis-batch1-round-content.test.js
          node tests/etnesjoen-idrettsanlegg-batch1-round-content.test.js

      - name: Run PlaceCard audits
        run: |
          node tests/place-card-rounds-runtime-audit.test.js
          node tests/place-card-leksikon-content-audit.test.js

      - name: Audit people of places
        run: npm run audit:people-of-places

      - name: Typecheck tools and web
        run: |
          npm run typecheck:tools
          npm run typecheck:web

      - name: Check generated diff
        run: git diff --check

      - name: Remove temporary generator and workflow
        run: |
          rm scripts/agent-fill-engebanen-rounds.js
          rm .github/workflows/agent-fill-engebanen-rounds.yml
          git diff --check

      - name: Commit clean Engebanen batch
        run: |
          git config user.name "History GO data bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/places/sport/vestland/etne/engebanen_etne.json \
            data/people/sport/vestland/etne/pal_askvig.json \
            data/relations.json \
            data/stories/stories_etnesjoen_sport_rounds_batch1.json \
            data/leksikon/places/vestland/etne/sport/leksikon_etnesjoen_sport_rounds_batch1.json \
            reports/engebanen-rounds-batch1.md \
            tests/engebanen-batch1-round-content.test.js \
            scripts/agent-fill-engebanen-rounds.js \
            .github/workflows/agent-fill-engebanen-rounds.yml
          git commit -m "Fill Engebanen football place rounds batch 1"
          git push origin HEAD:${{ github.head_ref }}
