name: Fix Oslo coordinate batch 33 QA newline

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-33-final
          fetch-depth: 0
          show-progress: false
      - name: Fix QA size-file newline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/oslo-coordinate-batch-33-final.yml')
          text=p.read_text()
          old="(qa/f'{slug}.size').write_text(f'1600,{height}')"
          new="(qa/f'{slug}.size').write_text(f'1600,{height}\\n')"
          if old not in text:
              raise SystemExit('QA size writer not found')
          p.write_text(text.replace(old,new,1))
          PY
          grep -F "write_text(f'1600,{height}\\n')" .github/workflows/oslo-coordinate-batch-33-final.yml
          git diff --check
      - name: Commit QA fix
        run: |
          rm .github/workflows/fix-oslo-coordinate-batch-33-qa-newline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Batch 33 visual QA size parsing'
          git push origin HEAD:refs/heads/agent/oslo-coordinate-control-batch-33-final
