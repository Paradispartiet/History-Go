# One-shot canonical Knowledge synchronization for Myraløkka, PR #7342.
# Remove after the generated artifacts have been committed and verified.
name: Oslo Myralokka Knowledge sync one-shot

on:
  push:
    branches:
      - work/oslo-akerselva-v1-bolk-20261116
    paths:
      - '.github/workflows/oslo-myralokka-knowledge-sync-once.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/work/oslo-akerselva-v1-bolk-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed PR sources
        uses: actions/checkout@v4
        with:
          ref: work/oslo-akerselva-v1-bolk-20261116
          fetch-depth: 1
          persist-credentials: true
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate Knowledge V2 canonical registries
        run: |
          npm run knowledge:canonical:write
          npm run knowledge:canonical:check
      - name: Reject unrelated generated changes
        shell: bash
        run: |
          unexpected=$(git diff --name-only | grep -Ev '^(data/knowledge/|data/quiz/natur/myralokka_sets\.json$|reports/knowledge[-_])' || true)
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changes from Knowledge generator:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git diff --stat
      - name: Commit only canonical Knowledge outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/knowledge/ data/quiz/natur/myralokka_sets.json
          git add -- reports/knowledge-id-backfill.json reports/knowledge-contract-audit.json reports/knowledge-universe-readers.json || true
          if git diff --cached --quiet; then
            echo "Knowledge canonical files already synchronized."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "build(knowledge): regenerate Myralokka source-reviewed Knowledge units and review queue"
          git push origin HEAD:refs/heads/work/oslo-akerselva-v1-bolk-20261116
