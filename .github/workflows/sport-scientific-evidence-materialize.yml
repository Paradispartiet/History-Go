name: Sport scientific evidence v1

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: sport-scientific-evidence-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: startsWith(github.head_ref, 'agent/sport-scientific-evidence-v1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone branch quietly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch '${{ github.head_ref }}' "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo

      - name: Verify Sport evidence package
        working-directory: repo/.github/sport-science-payload
        run: |
          set -euo pipefail
          sha256sum -c <<'EOF'
          b87b8ad8edd13c82e96dd64922df423243d6719c0ca12f066cd74b2d75d558ac  part_00
          185aef7c4a308aea9e97899656caac14a38cf2290d00e2f8728577448f3a218a  part_01
          6128ef42236235fa6c7f6964194d5614b3f452d2a24241ec7e1709c99e8fb337  part_02
          4cfd96c412eab802af3a1b3536487c5213a5db3f815bc546658e9a392cc26413  part_03
          b56a4db2777ff672c75df5b3e56a7f4c3156c22305fceaf6a0bd4e766cf9612c  part_04
          e514235112d19699a337e59060cbb34d32a97c7b261de580c2a08a11bd162d8b  part_05
          f59c66854c3372fe091720111e5090d8740e34c5456805cc53a25fac83d78994  part_06
          f3c94d91f647ca472281d3141da51673e6da55f0cead9dc7a4cf890842ad0a78  part_07
          072a89c92ecdc2ca111f9465523474b4d29fe3b48248f9e091bfa4ce21498cfe  part_08_0
          9f0821a1450d751e3040032245e228f1434c6ec29db844a27164b6a8e67aa312  part_08_1
          aa198e6c8754e722d15f14909b3205adc364ff12ec350a239278c9c286e05625  part_09
          5d54b028d953e724c3557dbccaccbec42788f35ba6f59d13820aa740dd9f4dfe  part_10
          d95e741c3154b450b06805d12e3e73e63f9cad7152790971ffd57e51d93e0afb  part_11
          EOF
          cat part_00 part_01 part_02 part_03 part_04 part_05 part_06 part_07 part_08_0 part_08_1 part_09 part_10 part_11 > /tmp/sport_science.b64
          base64 -d /tmp/sport_science.b64 > /tmp/sport_science_v1.tgz
          echo '321a2a61227a31250f9f0dd77a5b9aa7a7ad75e4f4c7d13f55e90dd2ae9c4d29  /tmp/sport_science_v1.tgz' | sha256sum -c -
          tar -tzf /tmp/sport_science_v1.tgz >/dev/null

      - name: Materialize and validate Sport evidence layer
        working-directory: repo
        run: |
          set -euo pipefail
          tar -xzf /tmp/sport_science_v1.tgz -C .
          node tools/validate-sport-evidence.mjs --write
          node tools/validate-sport-theory-quality.mjs
          node scripts/audit-category-governance.mjs
          node scripts/audit-quiz-template-governance.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const files = [
            'data/fag/sport/evidence_registry_sport_v1.json',
            'data/fag/sport/claims_sport_canonical_v1.json',
            'data/fag/sport/models_sport_canonical_v1.json',
            'data/fag/sport/source_quality_rubric_sport_v1.json',
            'data/fag/sport/measurement_registry_sport_v1.json',
            'data/fag/sport/sport_scientific_method_policy_v1.json',
            'data/fag/sport/sport_scientific_evidence_manifest_v1.json',
            'data/fag/sport/sport_quality_manifest_v5.json',
            'data/fag/sport/supersetQUIZMAL_sport.json',
            'reports/sport-scientific-evidence-validation.json'
          ];
          for (const file of files) JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log('JSON parse: PASS');
          NODE
          git diff --check

      - name: Commit final Sport evidence files
        working-directory: repo
        run: |
          set -euo pipefail
          rm -rf .github/sport-science-payload
          rm .github/workflows/sport-scientific-evidence-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fag/sport
          git add tools/validate-sport-evidence.mjs
          git add reports/sport-scientific-evidence-layer.md
          git add reports/sport-scientific-evidence-validation.json
          git add -u .github/sport-science-payload .github/workflows/sport-scientific-evidence-materialize.yml
          git diff --cached --check
          git commit -m 'Sport: legg til vitenskapelig evidenslag'
          git push origin HEAD:${{ github.head_ref }}
