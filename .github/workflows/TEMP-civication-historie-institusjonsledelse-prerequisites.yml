name: TEMP Materialize Historie Institusjonsledelse prerequisites

on:
  push:
    branches:
      - agent/civication-historie-institusjonsledelse-prerequisites
  workflow_dispatch:

concurrency:
  group: civication-historie-institusjonsledelse-prerequisites-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-and-verify:
    if: ${{ !contains(github.event.head_commit.message, 'Complete Historie Institusjonsledelse prerequisites') && !contains(github.event.head_commit.message, '[prereq-diag-skip]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-historie-institusjonsledelse-prerequisites
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Decode and syntax-check prerequisite materializer
        run: |
          base64 -d scripts/TEMP_historie_institusjonsledelse_prerequisites.mjs.gz.b64 | gzip -d > /tmp/historie-institusjonsledelse-prerequisites.mjs
          node --check /tmp/historie-institusjonsledelse-prerequisites.mjs
      - name: Materialize Historie Institusjonsledelse foundation
        id: materialize
        continue-on-error: true
        run: node /tmp/historie-institusjonsledelse-prerequisites.mjs > /tmp/historie-institusjonsledelse-materialize.log 2>&1
      - name: Persist exact materializer diagnostic only
        if: ${{ steps.materialize.outcome == 'failure' }}
        run: |
          log="$(cat /tmp/historie-institusjonsledelse-materialize.log)"
          git reset --hard HEAD
          git clean -fd
          mkdir -p reports/TEMP
          printf '%s\n' "$log" > reports/TEMP/historie-institusjonsledelse-prerequisites-materializer.log
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/TEMP/historie-institusjonsledelse-prerequisites-materializer.log
          git diff --cached --check
          git commit -m "Capture Historie Institusjonsledelse prerequisite materializer diagnostic [prereq-diag-skip]"
          git push origin HEAD:agent/civication-historie-institusjonsledelse-prerequisites
      - name: Stop after materializer failure
        if: ${{ steps.materialize.outcome == 'failure' }}
        run: exit 1
      - name: Align prerequisite-only readiness expectation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'tests/civication-historie-institusjonsledelse-prerequisites.test.js';
          const before = fs.readFileSync(p, 'utf8');
          const from = "assert.deepEqual(ready.authored_work_required, []);";
          const to = "assert.deepEqual(ready.authored_work_required, ['situated_reputation']);";
          if (!before.includes(from)) throw new Error('Expected prerequisite assertion not found; refusing broad rewrite');
          const after = before.replace(from, to);
          if (after === before || after.split(to).length !== 2) throw new Error('Prerequisite assertion replacement was not singular');
          fs.writeFileSync(p, after);
          NODE
      - name: Regenerate and verify complete prerequisite gate
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          {
            node scripts/audit-civication-role-packs.mjs
            node scripts/build-civication-scene-registry.mjs --write
            node scripts/audit-civication-career-gameplay.mjs --write
            node scripts/audit-civication-role-world-rollout-readiness.mjs --write
            node tests/civication-historie-institusjonsledelse-prerequisites.test.js
            node tests/civication-career-gameplay-matrix.test.js
            node tests/civication-role-world-rollout-readiness.test.js
            node tests/civication-role-pack-depth.test.js
            node scripts/build-civication-scene-registry.mjs --check
            node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
            node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
            node --test tests/civication-scenario-people.test.mjs
            node tests/run-civication-tests.mjs
            npm run audit:job-learning-profiles
            npm run audit:job-knowledge-requirements
          } > /tmp/historie-institusjonsledelse-verify.log 2>&1
      - name: Persist exact verification diagnostic only
        if: ${{ steps.verify.outcome == 'failure' }}
        run: |
          log="$(tail -n 220 /tmp/historie-institusjonsledelse-verify.log)"
          git reset --hard HEAD
          git clean -fd
          mkdir -p reports/TEMP
          printf '%s\n' "$log" > reports/TEMP/historie-institusjonsledelse-prerequisites-verification.log
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/TEMP/historie-institusjonsledelse-prerequisites-verification.log
          git diff --cached --check
          git commit -m "Capture Historie Institusjonsledelse prerequisite verification diagnostic [prereq-diag-skip]"
          git push origin HEAD:agent/civication-historie-institusjonsledelse-prerequisites
      - name: Stop after verification failure
        if: ${{ steps.verify.outcome == 'failure' }}
        run: exit 1
      - name: Remove temporary prerequisite surfaces
        run: |
          rm scripts/TEMP_historie_institusjonsledelse_prerequisites.mjs.gz.b64
          rm .github/workflows/TEMP-civication-historie-institusjonsledelse-prerequisites.yml
          rm -f reports/TEMP/historie-institusjonsledelse-prerequisites-materializer.log reports/TEMP/historie-institusjonsledelse-prerequisites-verification.log
      - name: Commit exact verified foundation
        run: |
          git diff --check
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No permanent changes produced"; exit 1; }
          git diff --cached --check
          git commit -m "Complete Historie Institusjonsledelse prerequisites"
          git push origin HEAD:agent/civication-historie-institusjonsledelse-prerequisites
