name: Diagnose PR 5805 Litteratur legacy report freshness
on:
  push:
    branches:
      - agent/diag-pr5805-theory-first-failure-20260911
    paths:
      - .github/workflows/diag-pr5805-theory-first-failure.yml
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm test fails before regeneration
        id: before
        continue-on-error: true
        run: node --test tests/fagverk-litteratur-legacy-theory-audit.test.mjs
      - name: Require pre-regeneration failure
        run: test "${{ steps.before.outcome }}" = failure
      - name: Regenerate only Litteratur legacy theory report
        run: node scripts/audit-fagverk-litteratur-legacy-theory.mjs --write-report >/dev/null
      - name: Require report-only generated diff
        run: |
          git diff --exit-code -- . ':!reports/fagverk/litteratur-legacy-theory-audit.json'
          test -n "$(git diff -- reports/fagverk/litteratur-legacy-theory-audit.json)"
      - name: Re-run exact failing test
        run: node --test tests/fagverk-litteratur-legacy-theory-audit.test.mjs
      - name: Re-run Litteratur adjudication test
        run: node --test tests/fagverk-litteratur-legacy-theory-adjudication.test.mjs
      - name: Re-run global strict theory audit
        run: node scripts/audit-fagverk-theory-integrity.mjs
      - name: Commit exact regenerated report on diagnostic branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/fagverk/litteratur-legacy-theory-audit.json
          git commit -m "diag: regenerate Litteratur legacy theory report [skip ci]"
          git push
