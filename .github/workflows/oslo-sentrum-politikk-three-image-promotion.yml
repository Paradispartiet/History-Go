name: Oslo sentrum Politikk promote three reviewed photos (PR 6579)

on:
  push:
    branches:
      - research/oslo-sentrum-politikk-six-v1-20261023
    paths:
      - .github/workflows/oslo-sentrum-politikk-three-image-promotion.yml

permissions:
  actions: read
  contents: write

jobs:
  promote-pinned-three:
    if: github.repository == 'Paradispartiet/History-Go' && github.ref == 'refs/heads/research/oslo-sentrum-politikk-six-v1-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out only our private work branch
        uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-politikk-six-v1-20261023
          fetch-depth: 1
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate promotion code
        run: python -m py_compile scripts/place-production/promote_oslo_politikk_three_images.py
      - name: Download byte-pinned reviewed sources (same repository)
        uses: actions/download-artifact@v4
        with:
          name: oslo-politikk-pr6579-three-photo-review
          run-id: 39936541548
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/place-production/media-staging/oslo-sentrum-politikk
      - name: Verify exact originals and WebP byte hashes before modification
        run: python scripts/place-production/promote_oslo_politikk_three_images.py
      - name: Add only three reviewed place image pairs and provenance
        run: python scripts/place-production/promote_oslo_politikk_three_images.py --apply
      - name: Decode files and validate image dimensions
        run: |
          python -m pip install 'Pillow>=10,<13'
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for place in ('hoyesteretts_hus', 'folkets_hus_oslo', 'hoyblokka'):
              for suff, size in (('.webp', (1400,900)),('_front_portrait.webp',(900,1350))):
                  with Image.open(Path('bilder/places')/(place+suff)) as im:
                      assert im.format == 'WEBP' and im.size == size, (place,suff,im.size)
          print('Decoded and verified all six WebP files.')
          PY
      - name: Stage and commit only nine whitelisted paths
        run: |
          git add -- \
            bilder/places/hoyesteretts_hus.webp \
            bilder/places/hoyesteretts_hus_front_portrait.webp \
            bilder/places/folkets_hus_oslo.webp \
            bilder/places/folkets_hus_oslo_front_portrait.webp \
            bilder/places/hoyblokka.webp \
            bilder/places/hoyblokka_front_portrait.webp \
            data/places/politikk/oslo/places_politikk/hoyesteretts_hus.json \
            data/places/politikk/oslo/places_politikk/folkets_hus_oslo.json \
            data/places/politikk/oslo/places_politikk/hoyblokka.json
          git diff --cached --check
          python - <<'PY'
          import subprocess
          expected={
            'bilder/places/hoyesteretts_hus.webp',
            'bilder/places/hoyesteretts_hus_front_portrait.webp',
            'bilder/places/folkets_hus_oslo.webp',
            'bilder/places/folkets_hus_oslo_front_portrait.webp',
            'bilder/places/hoyblokka.webp',
            'bilder/places/hoyblokka_front_portrait.webp',
            'data/places/politikk/oslo/places_politikk/hoyesteretts_hus.json',
            'data/places/politikk/oslo/places_politikk/folkets_hus_oslo.json',
            'data/places/politikk/oslo/places_politikk/hoyblokka.json',
          }
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if staged != expected:
              raise SystemExit(f'Wrong staged paths. Missing: {expected-staged}; unexpected: {staged-expected}')
          print('Scoped nine-path allowlist passed.')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integrate three verified Oslo Politikk image pairs; v1 QA pending"
          git push origin HEAD:refs/heads/research/oslo-sentrum-politikk-six-v1-20261023
      - name: Make no publication claim
        if: always()
        run: |
          {
            echo "### Scoped photo import"
            echo "Image bytes have been SHA-256 pinned and an exactly scoped nine-path git stage was required."
            echo "This does NOT mark v1 complete. Y-blokka remains blocked by Picasso/Nesjar rights."
            echo "Full quiz, real browser/mobile QA, licensing in the app and new CI checks remain mandatory."
          } >> "$GITHUB_STEP_SUMMARY"
