name: Clean final Oslo politics People diff

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  clean:
    if: github.head_ref == 'agent/oslo-politikk-people-final-completion'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-politikk-people-final-completion
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore unrelated People files
        env:
          AUDIT_BASE: 0d208b5b57455a48fe66dafb55cfc8422aa11175
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            case "$file" in
              data/people/by/oslo/gamle_aker_kirke/heinrich_ernst_schirmer.json|\
              data/people/by/oslo/people_by_oslo.json|\
              data/people/historie/oslo/people_historie_oslo.json|\
              data/people/politikk/oslo/people_politikk_oslo.json|\
              data/people/manifest.json|\
              data/people/by/oslo/people_by_oslo_politics_places_batch_04.json|\
              data/people/historie/oslo/people_historie_oslo_politics_places_batch_04.json|\
              data/people/kunst/oslo/people_kunst_oslo_politics_places_batch_04.json|\
              data/people/naeringsliv/oslo/people_naeringsliv_oslo_politics_places_batch_04.json)
                echo "keep: $file"
                ;;
              *)
                if git cat-file -e "$AUDIT_BASE:$file" 2>/dev/null; then
                  git checkout "$AUDIT_BASE" -- "$file"
                  echo "restore: $file"
                else
                  git rm -f -- "$file"
                  echo "remove unexpected added file: $file"
                fi
                ;;
            esac
          done < <(git diff --name-only "$AUDIT_BASE"..HEAD -- data/people)

          echo "Remaining People diff:"
          git diff --name-status "$AUDIT_BASE" -- data/people

      - name: Rebuild generated People surfaces
        run: |
          npm run civication:history-people:build
          npm run build:web

      - name: Run locked People tests
        run: |
          set -o pipefail
          mkdir -p reports/oslo-politikk-people-full-coverage
          {
            node tests/oslo-politikk-people-full-coverage.test.js
            node tests/oslo-politikk-remaining-people-expansion.test.js
            node tests/oslo-politikk-final-people-expansion.test.js
          } 2>&1 | tee reports/oslo-politikk-people-full-coverage/coverage-test.log

      - name: Run full gates
        run: |
          set -o pipefail
          bash scripts/check-people.sh 2>&1 | tee reports/oslo-politikk-people-full-coverage/check-people.log
          bash scripts/check-places.sh 2>&1 | tee reports/oslo-politikk-people-full-coverage/check-places.log
          {
            npm run typecheck:web
            npm run typecheck:scripts
            npm run typecheck:tools
          } 2>&1 | tee reports/oslo-politikk-people-full-coverage/typecheck.log

      - name: Publish clean final branch
        run: |
          rm .github/workflows/oslo-politikk-people-final-cleanup.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rydd og fullfør People ved Oslo-politikksteder"
          git push origin HEAD:agent/oslo-politikk-people-final-completion
