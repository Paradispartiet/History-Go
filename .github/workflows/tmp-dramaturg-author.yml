name: Temporary Dramaturg Role World authoring

on:
  push:
    branches:
      - civication/scenekunst-dramaturg-role-world
    paths:
      - .github/workflows/tmp-dramaturg-author.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Author Dramaturg source and Role World
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>{fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n')};
          const streamPath='data/Civication/narratives/leisure/scenekunst_dramaturg.json';
          const worldPath='data/Civication/roleWorlds/scenekunst/scenekunst_dramaturg.json';
          const lifeKey='scenekunst/dramaturg';
          const lifeScope='scenekunst_dramaturg';
          const storyData=[
            ['forste_lesning_uten_fasit','Dramatikeren','Første lesning uten fasit',['Du får et nytt tekstutkast der flere scener fungerer enkeltvis, men verkets bevegelse fortsatt er uklar.','Dramaturgisk praksis begynner med å skille observasjon fra smak og løsningsforslag.','Et strukturkart er et arbeidsredskap: det skal gjøre alternativer synlige uten å late som dramaturgen eier verkets mening.'],'Kartlegg vendepunkter, gjentakelser og åpne spørsmål før du foreslår endringer.','Skriv én samlet dom om hva teksten egentlig handler om og bruk den som fasit.',['structural_reading','interpretive_humility'],'Arbeidet åpner flere presise hypoteser som kan prøves mot teksten.','En foreløpig lesning blir gjort til autoritet før andre perspektiver er undersøkt.'],
            ['forfatterintensjon_og_verkeffekt','Dramatikeren','Intensjon og virkning peker ikke samme vei',['Forfatteren forklarer hva en scene skal gjøre, mens lesningen din viser at teksten kan produsere en annen effekt.','Dramaturgen må kunne holde opphavspersonens intensjon og verkets faktiske organisering i samme samtale uten å underordne den ene den andre.','Rådet må være etterprøvbart og formulert slik at forfatteren fortsatt eier beslutningen om teksten.'],'Beskriv forskjellen mellom uttalt intensjon og lesbar effekt, og be om en konkret tekstlig prøve.','Fortell forfatteren hvilken betydning scenen må ha fordi dramaturgisk analyse står over intensjon.',['authorial_consent','effect_vs_intention'],'Uenigheten blir et arbeidsproblem som kan undersøkes i teksten.','Analysen glir over i skjult forfattermandat.'],
            ['proven_som_evidens','Utøveren','Prøven endrer hva teksten gjør',['I prøverommet oppstår en pause og en fysisk avstand som flytter scenens tyngdepunkt.','En prøve gir situert evidens om rytme, handling og mottak, men den er ikke automatisk en universell fasit.','Dramaturgens notat må skille hva som faktisk skjedde fra hypotesen om hvorfor det virket.'],'Noter hendelsen, formuler to mulige forklaringer og foreslå en ny avgrenset prøve.','Gjør den første sterke prøveopplevelsen til endelig konklusjon om scenens funksjon.',['rehearsal_evidence','hypothesis_discipline'],'Prøven blir kunnskap som kan korrigeres av neste prøve.','Et levende øyeblikk fryses til regel uten kontroll.'],
            ['strukturkartet_som_blir_bestilling','Meddramaturgen','Når kartet begynner å styre verket',['Et strukturkart du laget for å synliggjøre mønstre blir sitert av teamet som om det var en vedtatt plan.','Usynlig analysearbeid kan få makt når dokumentet sirkulerer uten spor av hva som var observasjon, hypotese og beslutning.','Dramaturgen må beskytte forskjellen mellom analyse og bestilling.'],'Versjoner kartet og merk tydelig hva som er funn, spørsmål og faktisk besluttet arbeid.','La teamet bruke kartet som plan fordi det sparer tid og viser at analysen blir tatt på alvor.',['version_discipline','mandate_separation'],'Dokumentet blir nyttig uten å få skjult myndighet.','Analyseformatet blir en uformell kommandolinje.'],
            ['kilden_som_bar_for_mye','Kildepartneren','En historisk kilde bærer for stor påstand',['Produksjonen bruker et historisk sitat som nøkkel til verkets offentlige fortelling, men proveniens og kontekst er ufullstendig.','Dramaturgisk research må skille dokumentasjon, tolkning og kunstnerisk bruk.','Usikkerhet er ikke et nederlag; den må følge påstanden slik at scenisk kraft ikke låner falsk faktamyndighet.'],'Merk hva kilden dokumenterer, hva som er tolkning og hva som fortsatt må avklares.','Behold formuleringen uendret fordi kunstnerisk tydelighet er viktigere enn kildegrensen.',['source_uncertainty','evidence_weight'],'Kilden kan brukes som spørsmål uten å bære mer autoritet enn den tåler.','Foreløpig research blir presentert som historisk fasit.'],
            ['rettigheten_som_ikke_folger_ideen','Produksjonslederen','God idé, uavklart rettighet',['En scenisk idé avhenger av et tekstutdrag og et arkivmateriale som teamet ennå ikke har dokumentert bruksrett til.','Dramaturgen kan oppdage og beskrive rettighetsrisiko, men kan ikke gi samtykke på vegne av opphavsperson eller institusjon.','Rettighetsstatus må derfor inn i arbeidsgrunnlaget før kunstnerisk entusiasme blir irreversibelt produksjonsarbeid.'],'Skill kunstnerisk hypotese fra rettighetsstatus og send avklaringen til riktig eier før permanent bygging.','Be teamet fortsette som om tillatelsen kommer fordi ideen allerede er viktig for forestillingen.',['rights_boundary','reversible_work'],'Arbeidet kan fortsette reversibelt uten at dramaturgen later som rettigheten er avklart.','Fremdrift skjuler en juridisk og sosial avhengighet.'],
            ['ensemblets_motfunn','Utøveren','Ensemblet motsier arbeidsboken',['To utøvere beskriver scenens problem på en måte som ikke passer den dramaturgiske hypotesen du har brukt i flere dager.','Kroppslig og scenisk erfaring er ikke underordnet arbeidsboken; motfunn må kunne endre analysegrunnlaget.','Dramaturgisk autoritet styrkes av korrigerbarhet, ikke av å vinne diskusjonen.'],'Be utøverne beskrive konkrete øyeblikk og revider hypotesen der observasjonene faktisk utfordrer den.','Forsvar arbeidsboken fordi dramaturgen har større oversikt over hele verket enn ensemblet.',['embodied_counterevidence','revision_discipline'],'Motfunnet blir innarbeidet uten at erfaring gjøres til ny ene-fasit.','Oversikt brukes som statusargument mot situert kunnskap.'],
            ['beslutningen_som_skyves_til_dramaturgen','Regiteamet','Kan du bare bestemme dette?',['Teamet er uenig om et sentralt scenisk valg og ber dramaturgen avgjøre saken for å få prøven videre.','Dramaturgisk rådgivning kan tydeliggjøre alternativer, konsekvenser og verklogikk, men gir ikke automatisk regimandat.','Når ansvar flyttes i tidsnød, kan et råd bli til myndighet uten at noen har vedtatt det.'],'Formuler alternativene og konsekvensene, og returner den sceniske beslutningen til den som faktisk har mandatet.','Ta avgjørelsen selv fordi noen må få prøven videre og du kjenner argumentene best.',['advisory_boundary','decision_ownership'],'Rådet blir handlingsrelevant uten å overta beslutningsmandatet.','Tidsnød skaper en uformell rolleutvidelse.'],
            ['fristen_som_gjor_usikkerhet_dyr','Produksjonslederen','Fristen presser fram en falsk avklaring',['Teknisk avdeling trenger et svar før dramaturgiske spørsmål er ferdig undersøkt.','Produksjonsbegrensninger er reell kunnskap, men de gjør ikke automatisk en foreløpig tolkning sann.','Godt handoff skiller det som må låses nå fra det som fortsatt kan være reversibelt.'],'Navngi hva som faktisk må besluttes, hva som kan bygges reversibelt og hvem som eier restspørsmålene.','Kall hele pakken avklart slik at ingen mister tid på flere spørsmål.',['production_constraint','rework_visibility'],'Teamet får en brukbar beslutningsgrense og synlig restarbeid.','Usikkerheten forsvinner fra dokumentet og kommer tilbake som dyr rework.'],
            ['programteksten_som_blir_for_sikker','Kommunikasjonsredaktøren','Programteksten gjør hypotesen til sannhet',['En tidlig dramaturgisk hypotese er blitt skrevet om til en sikker påstand i programteksten.','Når arbeidsnotater vandrer ut i offentligheten, kan institusjonens prestisje gjøre foreløpig kunnskap vanskelig å korrigere.','Dramaturgen må kunne reparere påstanden uten å late som han eller hun eier all offentlig kommunikasjon.'],'Versjoner en presis korreksjon, vis kildegrensen og avklar hvem som godkjenner den offentlige teksten.','La påstanden stå fordi publikum trenger en tydelig historie og nyanser vil svekke kommunikasjonen.',['public_claim_control','correction_discipline'],'Korreksjonen bevarer både ansvar og muligheten for en kompleks fortelling.','Kommunikativ klarhet kjøpes med lånt kunnskapsautoritet.'],
            ['forhandsvisningen_som_overfortolkes','Meddramaturgen','Én publikumsreaksjon blir alle publikums stemme',['En liten forhåndsvisning reagerer sterkt på ett parti, og teamet vil straks omskrive store deler av verket.','Publikumsrespons er situert informasjon: hvem som var i rommet, rammen og spørsmålet påvirker hva responsen kan si.','Dramaturgen må bruke mottak som materiale uten å gjøre den til plebisitt over verket.'],'Sorter reaksjonene etter hva de faktisk viser og velg ett spørsmål som kan prøves videre.','Behandle den tydeligste reaksjonen som representativ for framtidig publikum og omskriv deretter.',['audience_evidence','sampling_humility'],'Responsen åpner et nytt kontrollert spørsmål i stedet for en panikkrevisjon.','Et lite rom får ubegrunnet representativitet.'],
            ['versjonen_som_forsvant','Produksjonslederen','Ingen vet hvilken tekst som er gjeldende',['Etter flere små endringer arbeider utøvere og tekniske fag plutselig fra ulike tekstversjoner.','Versjonsdisiplin er usynlig arbeid helt til den svikter og skaper sosial friksjon, omarbeid og feil attribusjon.','Dramaturgen kan holde sporbarhet, men må også gjøre eier og beslutning synlig.'],'Stans videre spredning, identifiser gjeldende versjon og dokumenter hvem som godkjente hvilke endringer.','Send den nyeste filen på nytt uten å rydde historikken fordi alle bør forstå at siste fil gjelder.',['version_control','attribution_trace'],'Teamet får et felles arbeidsgrunnlag og en etterprøvbar endringshistorikk.','Filrekkefølge erstatter beslutningshistorikk.'],
            ['arbeidsboken_som_folger_hjem','Nærpersonen','Analysen fortsetter etter at dagen er slutt',['Du merker at du fortsatt sorterer andres formuleringer og konflikter lenge etter at arbeidsdagen er over.','Dramaturgisk arbeid er ofte kognitivt og emosjonelt usynlig; grenseløs tilgjengelighet kan gjøre omsorg og presisjon dårligere neste dag.','Privatlivet skal kunne romme belastningen uten at fortrolig materiale eller ubetalt reservearbeid blir normalen.'],'Beskriv presset uten å dele fortrolig innhold, avslutt arbeidsboken for kvelden og avtal når du faktisk tar den opp igjen.','Fortsett å finredigere hjemme fordi grundighet er en del av identiteten og ingen andre ser hvor mye tid det tar.',['private_containment','invisible_work'],'En tydelig grense beskytter både relasjonen og neste dags faglige presisjon.','Usynlig arbeid blir gjort til personlig plikt uten sluttpunkt.'],
            ['sesongslutt_hva_er_en_dramaturg','Meddramaturgen','Hva slags myndighet har en dramaturg egentlig?',['Etter to uker har du lest, kartlagt, prøvd hypoteser, fulgt kilder, versjoner og reaksjoner gjennom flere arbeidsflater.','Dramaturg er her en employment-independent dramaturgical_practice_or_livelihood: Badge-identiteten kan eksistere uten ansettelse, lønn eller institusjonelt mandat.','Formell Dramaturg-jobb krever fortsatt appointment_required; livsposisjonen gjør deg ikke automatisk til Regissør, Dramatiker, Scenekunstkurator, Produsent eller Kildeansvarlig.'],'Oppsummer praksisen som sporbar analyse, korrigerbar rådgivning og tydelig mandatgrense, og la formell myndighet følge faktisk avtale.','Bruk Badge-identiteten som bevis på at du kan ta kunstneriske, rettslige og produksjonsmessige beslutninger for andre.',['role_boundary','employment_independence'],'Rollen blir tydelig som praksis uten å late som den gir en stilling eller andres mandat.','Identitet glir over i ubegrunnet institusjonell fullmakt.']
          ];
          const storylets=storyData.map((x,i)=>({
            id:x[0],message_type:'decision',time_slot:['people','personal'],from:x[1],subject:x[2],situation:x[3],
            choices:[
              {id:'A',label:x[4],effect:1,tags:x[6],feedback:x[8]},
              {id:'B',label:x[5],effect:-1,tags:x[6].map(t=>t+'_failure'),feedback:x[9]}
            ],
            opens_streams:[],adds_flags:['dramaturg_'+x[0]],risk_links:['reputation_risk','relationship_risk'],links:[]
          }));
          const stream={
            schema:'civication_narrative_stream_v1',id:'scenekunst_dramaturg_stream',type:'leisure',
            title:'Dramaturg — verklesning, prøveevidens, kildegrense og delt mandat',
            sociological_theme:'scenekunst_dramaturg_sporbar_analyse_korrigerbar_radgivning_proveevidens_kildegrense_versjonsdisiplin_rettigheter_produksjonsbegrensning_offentlig_pastand_usynlig_arbeid_og_mandatseparasjon',
            applies_when:{any_tags:['scenekunst:dramaturg']},time_slots:['personal','home','people','leisure'],storylets
          };
          write(streamPath,stream);

          const manifest=read('data/Civication/narratives/manifest.json');
          manifest.streams=manifest.streams.filter(x=>x.id!==stream.id&&x.path!==streamPath);
          manifest.streams.push({id:stream.id,path:streamPath});
          write('data/Civication/narratives/manifest.json',manifest);

          const themeIds=['professional_culture','invisible_work','loyalty_up_down','public_attention','shame_reputation','public_private_leakage','local_knowledge_vs_system'];
          const people=[
            ['liv_dramatiker','Dramatiker og opphavsperson som prøver om analysen åpner alternativer eller skjuler en bestilling.','opphavsperson med eierskap til egen tekst','høy kunstnerisk legitimitet rundt tekst og språk','kan godta eller avvise råd om egen tekst, men kan ikke gi dramaturgen generell regi- eller institusjonsmyndighet','at teksten utfordres presist uten at stemmen hennes blir råstoff for andres framdrift','hvor sårbar hun blir når teamet omtaler teksten som et problem som skal løses','billedlig og tekstnær, men presis om samtykke og attribusjon','at god dramaturgi lar forfatterrespons endre analysen'],
            ['samir_scenisk_partner','Scenisk beslutningstaker som bruker prøven som undersøkelse og trenger motspill uten å outsource mandatet.','kunstnerisk samarbeidspartner med avtalt scenisk mandat','synlig lederposisjon i prøverommet','kan velge hva som prøves når han faktisk er oppnevnt, men kan ikke gjøre dramaturgens notat til skjult regiavgjørelse','et motspill som gjør neste prøve skarpere og mer etterprøvbar','at tydeligheten hans noen ganger bygger på en hypotese han ennå ikke vil nedgradere','handlingsorientert og konkret om hva som skal prøves','at prøveevidens må skilles fra beslutningsmandat'],
            ['amina_utover','Utøver som tilfører kroppslig og situert kunnskap når arbeidsboken blir for abstrakt.','kunstnerisk utøver i prosjektfellesskapet','høy situert troverdighet om hva som faktisk skjer i spill','kan gi motfunn fra praksis og nekte utrygge arbeidsmåter, men eier ikke hele verkets tolkning','at erfaring fra prøven behandles som kunnskap og ikke bare utførelse','at hun av og til toner ned uenighet for ikke å framstå som vanskelig','konkret om handling, rytme og kropp, mindre interessert i abstrakte dommer','at dramaturgisk oversikt må tåle motfunn fra utøverens erfaring'],
            ['maja_produksjonsleder','Produksjonsleder som gjør tids-, ressurs- og avhengighetskostnader synlige før uklare notater blir dyrt arbeid.','produksjonsleder med delegert prosessansvar','sterk posisjon i frister, koordinering og reversibilitet','kan stoppe uforsvarlig eller uavklart produksjonsarbeid, men kan ikke tildele kunstnerisk eller rettslig mandat','et arbeidsgrunnlag med versjon, eier, restspørsmål og tydelig beslutningsgrense','hvor mye uavklart arbeid hun absorberer for å beskytte teamet','kort og presis om versjon, avhengighet, ansvar og frist','at produksjonsbegrensning er kunnskap, men ikke kunstnerisk fasit'],
            ['ingrid_kildepartner','Kilde- og researchpartner som holder dokumentasjon, motfunn, usikkerhet og bruk fra hverandre.','faglig samarbeidspartner med ansvar for kildepresisjon','autoritet på dokumentasjon innen sitt avgrensede felt','kan kreve at udokumenterte faktapåstander merkes eller korrigeres, men kan ikke alene bestemme verkets mening','at motfunn får endre arbeidsgrunnlaget uten at hun blir totalgarantist for forestillingen','hvor usikker enkelte proveniensledd fortsatt er når resten av teamet ønsker framdrift','rolig, kildeorientert og nøye med forskjellen mellom dokumentasjon og tolkning','at usikkerhet må følge påstanden videre i systemet'],
            ['noah_meddramaturg','Fagfelle som kan se blinde flekker i analyse, arbeidsmåte og publikumslesning.','frilanser eller kollega i dramaturgisk praksis','kollegial status uten personal- eller beslutningsmyndighet','kan utfordre metode og lesning, men kan ikke gi spilleren ansettelse, rettighet eller formelt mandat','at uenighet kan brukes som kvalitetskontroll framfor statushierarki','at han selv ønsker å framstå som den som ser strukturen raskest','spørrende, analytisk og villig til å vise egne forbehold','at dramaturgisk autoritet må være korrigerbar også mellom fagfeller']
          ].map(x=>({id:x[0],social_function:x[1],class_position:x[2],status:x[3],power_over_player:x[4],wants:x[5],conceals:x[6],speech_style:x[7],teaches_player:x[8]}));
          const slowAxes=[
            ['interpretive_humility','Hvor godt spilleren holder observasjon, hypotese og tolkning fra hverandre.','editorial_only_until_governed'],
            ['authorial_consent','Hvor tydelig forfatterens eierskap og samtykke forblir gjennom omskriving.','editorial_only_until_governed'],
            ['rehearsal_evidence','Hvor korrigerbar analysen er mot det som faktisk skjer i prøven.','editorial_only_until_governed'],
            ['source_uncertainty','Hvor synlig dokumentasjon, motfunn og kunnskapsgrenser følger offentlige påstander.','editorial_only_until_governed'],
            ['mandate_separation','Hvor godt rådgivning holdes atskilt fra regi-, rettighets-, produksjons- og institusjonsmyndighet.','editorial_only_until_governed'],
            ['private_containment','Hvor godt belastning kan deles privat uten at fortrolig materiale og grenseløst arbeid følger med.','editorial_only_until_governed']
          ].map(x=>({id:x[0],meaning:x[1],runtime_binding:x[2]}));
          const phases=['morning','lunch','afternoon','evening'];
          const phaseTypes={morning:'info',lunch:'conversation',afternoon:'decision',evening:'private_consequence'};
          const phaseText={morning:'arbeidsgrunnlaget åpnes og premissene skilles',lunch:'en annen person utfordrer lesningen',afternoon:'spilleren må avgrense handling og mandat',evening:'arbeidet får en privat etterklang uten å lekke fortrolig innhold'};
          const coverage=[];
          for(let day=1;day<=14;day++){
            const s=storylets[day-1];
            for(const phase of phases){
              coverage.push({day,phase,beat_type:phaseTypes[phase],summary:`Dag ${day} ${phase}: ${s.subject}. ${phaseText[phase]}; arbeidsboken beholder sporbarhet mellom observasjon, hypotese, beslutning og restspørsmål.`,thread_ids:[`dramaturg_thread_${String(day).padStart(2,'0')}`],materialization_refs:[`${streamPath}#${s.id}`]});
            }
          }
          const beat=(day,phase)=>`${day}/${phase}`;
          const primaryThreads=[];
          for(let day=1;day<=14;day++){
            const d2=(day%14)+1,d3=((day+1)%14)+1,d4=((day+2)%14)+1;
            primaryThreads.push({id:`dramaturg_thread_${String(day).padStart(2,'0')}`,relationship:`${storylets[day-1].from}: ${storylets[day-1].subject} utvikles fra analyse til sosial reaksjon og senere korrigering uten at dramaturgen overtar andres mandat.`,beat_refs:[beat(day,'morning'),beat(day,'lunch'),beat(d2,'afternoon'),beat(d3,'lunch'),beat(d4,'morning')]});
          }
          const privateAftermath=[0,3,6,9,12].map((idx,n)=>({id:`private_aftermath_${n+1}`,description:`Etter ${storylets[idx].subject.toLowerCase()} må spilleren skille faglig ansvar fra privat grubling, beskytte fortrolighet og la hvile være en del av presisjonen.`,materialization_refs:[`${streamPath}#${storylets[idx].id}`]}));
          const delayedPairs=[[1,4,['narrative','relationship']],[2,6,['relationship','reputation']],[3,8,['narrative','reputation']],[5,10,['reputation','narrative']],[7,12,['relationship','psyche']],[9,14,['job','reputation']]];
          const delayedConsequences=delayedPairs.map((x,i)=>({id:`dramaturg_delayed_${i+1}`,setup_ref:beat(x[0],'afternoon'),return_ref:beat(x[1],'afternoon'),domains:x[2]}));
          const world={
            schema:'civication_role_world_v1',version:1,category:'scenekunst',role_scope:lifeScope,title:'Dramaturg — sporbar analyse, korrigerbar rådgivning og tydelig mandat',status:'role_world_complete',subject_type:'life_position',life_position_ref:{badge_id:'scenekunst',id:'dramaturg',label:'Dramaturg'},
            sociological_core:{main_problem:'tolkningsmakt uten automatisk beslutningsmyndighet',description:'Dramaturg som employment-independent dramaturgical_practice_or_livelihood handler om å gjøre verklesning, prøveevidens, kilder, versjoner og konsekvenser sporbare mens andres kunstneriske og institusjonelle mandat forblir hos dem. Badge-identiteten gir ingen automatisk ansettelse, lønn eller formell myndighet: formell Dramaturg-jobb krever fortsatt appointment_required. Rollen må skille seg fra Regissør, Dramatiker, Scenekunstkurator, Produsent og Kildeansvarlig, og ingen ny runtime opprettes.'},
            theme_ids:themeIds,social_environments:['tekstbord_og_verklesning','proverom_og_observasjon','kilde_og_researchverksted','produksjonsmote_og_versjonsbord','offentlig_formidling_og_publikumsrespons','privat_etterklang_uten_materiallekkasje'],recurring_people_archetypes:people,slow_axes:slowAxes,
            season:{days:14,day_phases:phases,coverage},primary_threads:primaryThreads,private_aftermath:privateAftermath,delayed_consequences:delayedConsequences,
            materialization:{no_new_runtime:true,source_refs:storylets.map(s=>`${streamPath}#${s.id}`)}
          };
          write(worldPath,world);

          const index=read('data/Civication/roleWorlds/index.json');
          index.roles=index.roles.filter(x=>x.life_position_key!==lifeKey&&x.path!==worldPath);
          index.roles.push({category:'scenekunst',role_scope:lifeScope,subject_type:'life_position',life_position_key:lifeKey,life_position_ref:{badge_id:'scenekunst',id:'dramaturg',label:'Dramaturg'},status:'role_world_complete',path:worldPath});
          index.status='240_role_worlds_materialized';
          if(index.canonical_counts){index.canonical_counts.role_worlds_total=240;index.canonical_counts.career_role_worlds=85;index.canonical_counts.life_position_role_worlds=155;}
          index.career_role_world_count=85;index.life_position_role_world_count=155;
          write('data/Civication/roleWorlds/index.json',index);

          const checklist=read('data/Civication/roleWorldAuthoringChecklist.json');
          if(!checklist.reference_worlds.includes(worldPath))checklist.reference_worlds.push(worldPath);
          write('data/Civication/roleWorldAuthoringChecklist.json',checklist);

