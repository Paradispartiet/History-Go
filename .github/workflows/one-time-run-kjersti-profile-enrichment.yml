name: One-time run Kjersti profile enrichment

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/kjersti-profile-trigger.txt

permissions:
  contents: write

jobs:
  enrich-profile-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check out profile branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/kjersti-people-profile
          git checkout -B agent/kjersti-people-profile origin/agent/kjersti-people-profile

      - name: Apply verified Kjersti enrichment
        run: python scripts/one-time-enrich-kjersti-people-profile.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild people-derived Civication index
        run: npm run civication:history-people:build

      - name: Validate people popup runtime and rendering
        run: |
          node --check js/ui/person-popup-v2.js
          node --test tests/person-popup-v2.test.js

      - name: Validate canonical Kjersti fields
        run: node -e "const fs=require('fs'); const people=JSON.parse(fs.readFileSync('data/people/kunst/oslo/people_kunst_oslo.json','utf8')); const p=people.find(x=>x.id==='kjersti_wexelsen_goksoyr'); if(!p||p.works?.length!==6||p.birth_date!=='1945-12-15'||p.active_place!=='Nittedal') process.exit(1);"

      - name: Validate Civication history people index sync
        run: npm run civication:history-people:check

      - name: Commit enriched profile to working branch
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree reports 2>/dev/null || true
          git clean -fd reports 2>/dev/null || true
          git rm \
            .github/workflows/one-time-enrich-kjersti-people-profile.yml \
            scripts/one-time-enrich-kjersti-people-profile.py
          git add -A
          git status --short
          git commit -m "Enrich Kjersti Wexelsen Goksøyr profile"
          git push origin HEAD:agent/kjersti-people-profile
