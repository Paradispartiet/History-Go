name: One-time run Kjersti profile enrichment

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/kjersti-profile-trigger.txt

permissions:
  contents: write

jobs:
  enrich-profile-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out profile branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin agent/kjersti-people-profile
          git checkout -B agent/kjersti-people-profile FETCH_HEAD

      - name: Apply verified Kjersti enrichment
        run: python scripts/one-time-enrich-kjersti-people-profile.py

      - name: Validate people popup syntax
        run: node --check js/ui/person-popup-v2.js

      - name: Capture people popup rendering test
        id: popup-test
        shell: bash
        run: |
          mkdir -p reports/kjersti-profile-runner
          set +e
          node --test tests/person-popup-v2.test.js > reports/kjersti-profile-runner/person-popup-v2.test.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat reports/kjersti-profile-runner/person-popup-v2.test.log

      - name: Upload popup test diagnostic
        if: steps.popup-test.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: kjersti-person-popup-test-${{ github.run_id }}
          path: reports/kjersti-profile-runner/person-popup-v2.test.log
          if-no-files-found: error

      - name: Enforce people popup rendering test
        if: steps.popup-test.outputs.status != '0'
        run: exit 1

      - name: Validate canonical Kjersti fields
        run: node -e "const fs=require('fs'); const people=JSON.parse(fs.readFileSync('data/people/kunst/oslo/people_kunst_oslo.json','utf8')); const p=people.find(x=>x.id==='kjersti_wexelsen_goksoyr'); if(!p||p.works?.length!==6||p.birth_date!=='1945-12-15'||p.active_place!=='Nittedal') process.exit(1);"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild people-derived Civication index
        run: npm run civication:history-people:build

      - name: Validate Civication history people index sync
        run: npm run civication:history-people:check

      - name: Commit enriched profile to working branch
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree reports 2>/dev/null || true
          git clean -fd reports 2>/dev/null || true
          git rm \
            .github/workflows/one-time-enrich-kjersti-people-profile.yml \
            scripts/one-time-enrich-kjersti-people-profile.py
          git add -A
          git status --short
          git commit -m "Enrich Kjersti Wexelsen Goksøyr profile"
          git push origin HEAD:agent/kjersti-people-profile
