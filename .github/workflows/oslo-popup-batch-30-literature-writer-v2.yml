name: One-time Oslo popup batch 30 literature writer v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/oslo-popup-batch-30-trigger-v2.txt

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-popup-v4-batch-30-literature-ten
          fetch-depth: 0
      - name: Apply corrected Batch 30 texts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const items=['.github/oslo-popup-batch-30-literature-patch-a.json','.github/oslo-popup-batch-30-literature-patch-b.json'].flatMap(f=>JSON.parse(fs.readFileSync(f,'utf8')).places);
          const words=t=>(String(t).match(/[\p{L}\p{N}]+(?:[’'\-][\p{L}\p{N}]+)*/gu)||[]).length;
          const paras=t=>String(t).trim().split(/\n\s*\n/).filter(Boolean).length;
          const withoutText=v=>{const c=JSON.parse(JSON.stringify(v));delete c.desc;delete c.popupDesc;return c;};
          const popupSupp={
            bla_skilt_stein_mehren_ullevalsveien_60:'Skiltets korte format gjør kildegrensen tydelig: det bekrefter person, adresse og minneform, men gir ikke en full biografi eller en katalog over hva som ble skrevet i boligen.',
            honse_lovisas_hus:'Denne lagdelingen gjør huset særlig egnet til å øve på forskjellen mellom bygningshistorie, litterær karakter, filmatisering og senere publikumsbruk.',
            alexander_kiellands_plass:'Parkens litterære verdi ligger dermed ikke i autentiske spor etter Kiellands liv, men i navnets varige plass i byens orientering og kollektive hukommelse.',
            biblo_toyen:'Tilbudets utforming viser hvordan en offentlig litteraturinstitusjon kan skape tilhørighet ved å gi en tydelig definert brukergruppe reell plass og ansvar.',
            camilla_collett_statue:'Monumentet bør derfor brukes som inngang til tekstene og den historiske likestillingsdebatten, ikke som en forenklet erstatning for dem.',
            deichman_grunerlokka:'Filialens historie viser hvordan et bydelsbibliotek både kan bevare institusjonell kontinuitet og endre arbeidsformer når nabolag, medier og publikumsbehov forandres.',
            eldorado_bokhandel:'Bygningens skiftende funksjoner gjør det nødvendig å datere hvert lag presist og å skille mellom kinohistorie, bokhandelshistorie og senere virksomhet.',
            gamle_deichman:'Transformasjonen gjør bygningen til et godt eksempel på at kulturinstitusjoner kan flytte, mens arkitektur, minner og politiske forventninger blir værende på den gamle adressen.',
            grotta:'Den symbolske verdien må derfor balanseres mot privatliv, adgangsgrenser og kunnskap om at ordningen hedrer én utvalgt kunstner om gangen.',
            henrik_wergeland_statue:'Monumentets plassering gjør ettertidens fortolkning synlig, men den historiske Wergeland må fortsatt undersøkes gjennom egne tekster, samtidige kilder og konfliktene han deltok i.'
          };
          const finalSupp=' Denne avgrensningen gjør det mulig å bruke stedet som kilde uten å blande dokumenterte hendelser, senere minnekultur, institusjonell bruk og tolkninger som krever egne belegg.';
          const rows=[];
          for(const item of items){
            const before=JSON.parse(fs.readFileSync(item.path,'utf8'));
            let desc=item.desc,popupDesc=item.popupDesc;
            if(words(popupDesc)<300)popupDesc+=' '+popupSupp[item.id];
            if(words(popupDesc)<300)popupDesc+=finalSupp;
            const after={...before,desc,popupDesc};
            if(JSON.stringify(withoutText(before))!==JSON.stringify(withoutText(after)))throw new Error(`Non-text parity: ${item.id}`);
            const dw=words(after.desc),pw=words(after.popupDesc),pc=paras(after.popupDesc);
            console.log(`${item.id}: desc=${dw}, popup=${pw}, paragraphs=${pc}`);
            if(dw<40||dw>80)throw new Error(`${item.id} desc ${dw}`);
            if(pw<300||pw>600)throw new Error(`${item.id} popup ${pw}`);
            if(pc!==6)throw new Error(`${item.id} paragraphs ${pc}`);
            fs.writeFileSync(item.path,JSON.stringify(after,null,2)+'\n');
            rows.push({name:after.name,id:after.id,dw,pw,pc});
          }
          const pr=process.env.PR_NUMBER;if(!/^\d+$/.test(pr||''))throw new Error('Invalid PR');
          const pp='reports/place-description-revision-protocol.md';let p=fs.readFileSync(pp,'utf8');
          p=p.replace('Ferdige etter alle mergede revisjonsbatcher: **239 steder**','Ferdige etter alle mergede revisjonsbatcher: **249 steder**')
             .replace('Gjenstår: **273 steder**','Gjenstår: **263 steder**')
             .replace('Det gjenstår **273 aktive Oslo-steder**','Det gjenstår **263 aktive Oslo-steder**')
             .replace('- litteratur: **21**','- litteratur: **11**');
          const rowText=rows.map((r,i)=>`| ${240+i} | ${r.name} | \`${r.id}\` | ${r.dw} | ${r.pw} | ${r.pc} | #${pr} |`).join('\n');
          if(!p.includes('| 240 | Blått skilt: Stein Mehren |'))p=p.replace('\n## Gjenstående Oslo-kø',`\n\n${rowText}\n\n## Gjenstående Oslo-kø`);
          const batch=`| Oslo V4 batch 30 | 10 | #${pr} – første produksjonsbatch fra litteraturkøen |`;
          if(!p.includes(batch))p=p.replace(/(\| Oslo V4 batch 29 \| 1 \| #[0-9]+ – fullførte hele Oslo-køen for fagområdet vitenskap \|)/,`$1\n${batch}`);
          fs.writeFileSync(pp,p);
          NODE
          node tools/audit-oslo-place-description-scope.mjs --write
          node <<'NODE'
          const fs=require('fs'),p=fs.readFileSync('reports/place-description-revision-protocol.md','utf8'),a=fs.readFileSync('reports/oslo-place-description-scope-audit-2026-07-26.md','utf8');
          if(!p.includes('Ferdige etter alle mergede revisjonsbatcher: **249 steder**'))throw new Error('total');
          if(!p.includes('Gjenstår: **263 steder**'))throw new Error('remaining');
          if(!p.includes('- litteratur: **11**'))throw new Error('literature protocol');
          if(!a.includes('IDs in the current revision protocol: **249**'))throw new Error('audit total');
          if(!a.includes('Additional active Oslo IDs outside the protocol: **263**'))throw new Error('audit remaining');
          if(!a.includes('| litteratur | 11 |'))throw new Error('audit literature');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/litteratur/oslo/places_litteratur_oslo_bla_skilt_2026_batch_01/bla_skilt_stein_mehren_ullevalsveien_60.json data/places/litteratur/oslo/places_litteratur_oslo_kultureiendommer_batch_05/honse_lovisas_hus.json data/places/litteratur/oslo/places_litteratur/alexander_kiellands_plass.json data/places/litteratur/oslo/places_litteratur/biblo_toyen.json data/places/litteratur/oslo/places_litteratur/camilla_collett_statue.json data/places/litteratur/oslo/places_litteratur/deichman_grunerlokka.json data/places/litteratur/oslo/places_litteratur/eldorado_bokhandel.json data/places/litteratur/oslo/places_litteratur/gamle_deichman.json data/places/litteratur/oslo/places_litteratur/grotta.json data/places/litteratur/oslo/places_litteratur/henrik_wergeland_statue.json reports/oslo-place-description-scope-audit-2026-07-26.json reports/oslo-place-description-scope-audit-2026-07-26.md reports/place-description-revision-protocol.md
          git commit -m "Revise first Oslo literature descriptions"
          git push origin HEAD:agent/oslo-popup-v4-batch-30-literature-ten
