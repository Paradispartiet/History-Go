name: Oslo four generated assets refresh (one-shot)
on:
  push:
    branches:
      - feat/oslo-four-activate-index-20261024
    paths:
      - .github/workflows/oslo-four-refresh-once.yml
permissions:
  contents: write
concurrency:
  group: oslo-four-generated-refresh
  cancel-in-progress: true
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oslo-four-activate-index-20261024
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Regenerate Fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Regenerate epoch index
        run: npm run epoker:places:build
      - name: Confirm place index
        run: npm run places:index:build
      - name: Regenerate indexed runtime
        run: npm run place-open:build
      - name: Commit four runtime payloads and generated registries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk/fagverk_release.json data/epoker/epoke-place-index.json data/places/places_index.json
          git add data/runtime/place-open/linderud_gard.json data/runtime/place-open/sarabraten.json data/runtime/place-open/saeterhytten_bygdoy.json data/runtime/place-open/kristiania_teglverk_bryn.json
          if ! git diff --cached --quiet; then
            git commit -m "data(oslo): sync epoch, Fagverk and runtime after four Place source reviews"
            git push origin HEAD:feat/oslo-four-activate-index-20261024
          fi
