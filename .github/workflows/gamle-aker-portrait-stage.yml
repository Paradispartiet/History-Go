name: Stage independent Gamle Aker portrait photograph

on:
  push:
    branches:
      - history-go/gamle-aker-quizcard-v1-20261021
    paths:
      - .github/workflows/gamle-aker-portrait-stage.yml

permissions:
  contents: write

concurrency:
  group: gamle-aker-stage-photo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build portrait WebP from separate Wikimedia Commons photograph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, json, pathlib, urllib.request
          from PIL import Image, ImageOps
          source_url = "https://upload.wikimedia.org/wikipedia/commons/8/88/2019-08-23_Oslo_49_-_Gamle_Aker_kirke.jpg"
          source_page = "https://commons.wikimedia.org/wiki/File:2019-08-23_Oslo_49_-_Gamle_Aker_kirke.jpg"
          req = urllib.request.Request(source_url, headers={"User-Agent":"HistoryGoEditorialPhotoQA/1.0 (educational media attribution)"})
          with urllib.request.urlopen(req, timeout=60) as response:
            original = response.read()
          if not 150_000 < len(original) < 20_000_000:
            raise RuntimeError("Original Wikimedia image size outside expected bounds")
          with Image.open(io.BytesIO(original)) as raw:
            portrait = ImageOps.exif_transpose(raw).convert("RGB")
          if portrait.height <= portrait.width:
            raise RuntimeError(f"Separate source is not portrait: {portrait.size}")
          output = ImageOps.fit(portrait, (900,1200), method=Image.Resampling.LANCZOS, centering=(0.5,0.5))
          target = pathlib.Path("bilder/places/gamle_aker_kirke_front_nemo_bis_2019.webp")
          target.parent.mkdir(parents=True, exist_ok=True)
          output.save(target, format="WEBP", quality=84, method=6)
          with Image.open(target) as check:
            if check.size != (900,1200) or check.format != "WEBP":
              raise RuntimeError("Failed to produce 900x1200 portrait WebP")
          report_path = pathlib.Path("reports/place-production/gamle-aker-portrait-2019-image-v1.json")
          report_path.parent.mkdir(parents=True, exist_ok=True)
          report = {
            "status": "candidate_media_staged_not_published",
            "place_id": "gamle_aker_kirke",
            "asset_path": str(target),
            "width": 900,
            "height": 1200,
            "source_page": source_page,
            "original_url": source_url,
            "original_author": "Nemo bis",
            "photographed_at": "2019-08-23",
            "license": "CC BY-SA 3.0",
            "license_url": "https://creativecommons.org/licenses/by-sa/3.0/",
            "credit": "Nemo bis / Wikimedia Commons (CC BY-SA 3.0)",
            "modifications": "EXIF-normalized, resized and minimally center-cropped from an independent portrait photograph; not a crop of the existing Place.image",
            "original_sha256": hashlib.sha256(original).hexdigest(),
            "asset_sha256": hashlib.sha256(target.read_bytes()).hexdigest(),
            "note": "Photograph from 2019; do not claim it illustrates the 2023-2024 rehabilitation. Requires visual PR review before place frontImage reference."
          }
          report_path.write_text(json.dumps(report, indent=2, ensure_ascii=False)+"\n", encoding="utf-8")
          print("Staged",target,target.stat().st_size,"bytes")
          PY
      - name: Commit staged asset and attribution only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/places/gamle_aker_kirke_front_nemo_bis_2019.webp
          git add reports/place-production/gamle-aker-portrait-2019-image-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(history): stage independently licensed Gamle Aker portrait"
          git push origin "HEAD:history-go/gamle-aker-quizcard-v1-20261021"
