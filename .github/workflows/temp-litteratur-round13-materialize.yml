name: TEMP Litteratur round 13 materialize

on:
  push:
    branches:
      - agent/litteratur-maintenance-round13-kjonn-feminisme-20260907
    paths:
      - '.github/workflows/temp-litteratur-round13-materialize.yml'

permissions:
  contents: write

concurrency:
  group: temp-litteratur-round13-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate permanent round 13 sources
        run: |
          node --check scripts/audit-litteratur-maintenance-source-refresh-round13.mjs
          node --check tests/litteratur-maintenance-source-refresh-round13.test.mjs
      - name: Materialize approved round 13 URL replacements
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = [
            'data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/kjonn_feminisme_queer/claims.json',
            'scripts/materialize-litteratur-power-ecology-full-fields-v1.mjs'
          ];
          const replacements = [
            ['https://feministpress.org/about/', 'https://feministpress.org/pages/about'],
            ['https://www.penguinrandomhouse.com/books/6125/the-handmaids-tale-by-margaret-atwood/', 'https://www.penguinrandomhouse.com/books/557793/the-handmaids-tale-movie-tie-in-by-margaret-atwood/']
          ];
          for (const file of files) {
            let text = fs.readFileSync(file, 'utf8');
            for (const [oldUrl, newUrl] of replacements) {
              const count = text.split(oldUrl).length - 1;
              if (count !== 1) throw new Error(`${file}: expected exactly one occurrence of ${oldUrl}, found ${count}`);
              if (text.includes(newUrl)) throw new Error(`${file}: replacement already present before materialization: ${newUrl}`);
              text = text.replace(oldUrl, newUrl);
            }
            fs.writeFileSync(file, text);
          }
          const claims = fs.readFileSync(files[0], 'utf8');
          const materializer = fs.readFileSync(files[1], 'utf8');
          const gf12 = 'https://www.penguinrandomhouse.com/books/7753/giovannis-room-by-james-baldwin/';
          if (!claims.includes(gf12) || !materializer.includes(gf12)) throw new Error('gf12 retention was altered');
          NODE
      - name: Rebuild Litteratur assessment and provenance
        run: |
          npm run build:litteratur-assessment
          node tools/audit-litteratur-theory-integrity.mjs
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate round 13 fail-closed gates
        run: |
          node scripts/audit-litteratur-maintenance-source-refresh-round13.mjs
          node --test tests/litteratur-maintenance-source-refresh-round13.test.mjs
          node scripts/audit-litteratur-assessment-v1.mjs
          node tools/audit-litteratur-theory-integrity.mjs
          node --test tests/litteratur-assessment-v1.test.mjs tests/litteratur-theory-integrity.test.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          git diff --check
      - name: Enforce round 13 mutation allowlist
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/kjonn_feminisme_queer/claims.json|scripts/materialize-litteratur-power-ecology-full-fields-v1.mjs|data/quiz/litteratur/litteratur_subject_pathways_v1.json|data/knowledge/subjects/litteratur/knowledge_units.generated.json|reports/fagverk/litteratur-legacy-theory-audit.json|data/fagverk/fagverk_release.json)$'
          changed="$(git status --porcelain=v1 | cut -c4-)"
          test -n "$changed" || { echo 'No materialized changes found'; exit 1; }
          while IFS= read -r file; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected materialized path: $file"; exit 1; }
          done <<< "$changed"
          git diff --quiet -- data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/kjonn_feminisme_queer/claims.json && { echo 'Claims URL replacements missing'; exit 1; } || true
          git diff --quiet -- scripts/materialize-litteratur-power-ecology-full-fields-v1.mjs && { echo 'Canonical materializer URL replacements missing'; exit 1; } || true
          git diff --quiet -- data/quiz/litteratur/litteratur_subject_pathways_v1.json && { echo 'Pathway URL replacements missing'; exit 1; } || true
      - name: Commit materialized round 13 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/fag/litteratur/litteraturvitenskap_canonical_v1/foundation_texts/kjonn_feminisme_queer/claims.json \
            scripts/materialize-litteratur-power-ecology-full-fields-v1.mjs \
            data/quiz/litteratur/litteratur_subject_pathways_v1.json \
            data/knowledge/subjects/litteratur/knowledge_units.generated.json \
            reports/fagverk/litteratur-legacy-theory-audit.json \
            data/fagverk/fagverk_release.json
          git commit -m 'Materialize Litteratur source refresh round 13'
          git push origin HEAD:agent/litteratur-maintenance-round13-kjonn-feminisme-20260907
