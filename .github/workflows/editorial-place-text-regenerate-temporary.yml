name: Temporary editorial place-text regeneration
on:
  push:
    branches:
      - editorial/avisgaten-vg-dagbladet-20261011
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run places:index:build
      - run: npm run place-open:build
      - run: npm run epoker:places:build
      - name: Commit regenerated files
        shell: bash
        run: |
          git add data/places/places_index.json data/runtime/place-open/vg_huset.json data/runtime/place-open/dagbladet_akersgata.json data/epoker/epoke-place-index.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate canonical place outputs for newspaper history edits'
            git push origin HEAD:editorial/avisgaten-vg-dagbladet-20261011
          fi
