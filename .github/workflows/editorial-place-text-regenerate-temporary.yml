name: Temporary newspaper epoch regeneration
on:
  push:
    branches:
      - editorial/avisgaten-vg-dagbladet-20261011
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - run: node scripts/build-epoke-place-index.mjs
      - name: Commit regenerated epoch data
        shell: bash
        run: |
          git add data/epoker/epoke-place-index.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate historical epoch index with building-specific milestone scope'
            git push origin HEAD:editorial/avisgaten-vg-dagbladet-20261011
          fi
