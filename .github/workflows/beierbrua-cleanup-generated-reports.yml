name: Beierbrua cleanup generated reports

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/beierbrua-cleanup-generated-reports.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Restore unrelated global People-of-Places reports
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            reports/people-of-places-status.json \
            reports/people-of-places-status.md
          rm -f .github/workflows/beierbrua-cleanup-generated-reports.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit --no-verify -m 'Remove unrelated Beierbrua audit report churn'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
