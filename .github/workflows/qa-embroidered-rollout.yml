name: Embroidered badges - focused validation
on:
  pull_request:
    paths:
      - 'bilder/merker/*-brodert-v*.webp'
      - 'data/badges/*.json'
      - 'bilder/merker/vitenskap/brodert/teknologi_og_ingeniorfag.webp'
      - 'bilder/merker/vitenskap/locales/*/teknologi_og_ingeniorfag.webp'
      - 'scripts/import-vitenskap-ingeniorfag-assets-v1.py'
      - 'tests/vitenskap-teknologi-ingeniorfag-badge-candidate.test.mjs'
      - 'bilder/merker/by/undermerker/infrastruktur-brodert-v1.webp'
      - 'bilder/merker/by/locales/*/infrastruktur.webp'
      - 'scripts/import-infrastruktur-assets-v1.py'
      - 'tests/infrastruktur-candidate.test.mjs'
      - 'tests/monumenter-badge.test.mjs'
      - 'tests/bolig-badge.test.mjs'
      - 'tests/forhistorie-candidate.test.mjs'
      - 'tests/middelalder-candidate.test.mjs'
      - 'tests/tidlig-modernetid-candidate.test.mjs'
      - 'tests/historie-1800-badge-contract.test.mjs'
      - 'tests/historie-etterkrigstid-badge-contract.test.mjs'
      - 'tests/historie-byhistorie-badge-contract.test.mjs'
      - 'tests/historie-industrihistorie-badge-contract.test.mjs'
      - 'tests/historie-krigshistorie-badge-contract.test.mjs'
      - 'tests/historie-sosialhistorie-badge-contract.test.mjs'
      - 'tests/historie-kulturminner-bevaring-badge-contract.test.mjs'
      - 'tests/historie-krim-ulykker-branner-badge-contract.test.mjs'
      - 'tests/historie-migrasjon-minoritetshistorie-badge-contract.test.mjs'
      - 'bilder/merker/historie/undermerker/migrasjon_og_minoritetshistorie-brodert-v1.webp'
      - 'bilder/merker/historie/locales/*/migrasjon_og_minoritetshistorie.webp'
      - 'bilder/merker/historie/undermerker/krim_ulykker_og_branner-brodert-v1.webp'
      - 'bilder/merker/historie/locales/*/krim_ulykker_og_branner.webp'
      - 'bilder/merker/historie/undermerker/kulturminner_og_bevaring-brodert-v1.webp'
      - 'bilder/merker/historie/locales/*/kulturminner_og_bevaring.webp'
      - 'bilder/merker/historie/undermerker/sosialhistorie-brodert-v1.webp'
      - 'bilder/merker/historie/locales/*/sosialhistorie.webp'
      - 'bilder/merker/historie/undermerker/krigshistorie-brodert-v1.webp'
      - 'bilder/merker/historie/locales/*/krigshistorie.webp'
      - 'bilder/merker/historie/undermerker/industrihistorie-brodert-v1.webp'
      - 'bilder/merker/historie/locales/*/industrihistorie.webp'
      - 'bilder/merker/historie/undermerker/byhistorie-brodert-v1.webp'
      - 'bilder/merker/historie/locales/*/byhistorie.webp'
      - 'tests/historie-samtidshistorie-badge-contract.test.mjs'
      - 'bilder/merker/historie/undermerker/samtidshistorie-brodert-v1.webp'
      - 'bilder/merker/historie/locales/*/samtidshistorie.webp'
      - 'bilder/merker/historie/undermerker/etterkrigstid-brodert-v1.webp'
      - 'bilder/merker/historie/locales/*/etterkrigstid.webp'
      - 'tests/historie-1900-1945-badge.test.mjs'
      - 'bilder/merker/historie/undermerker/nittenhundre_1900_1945-brodert-v1.webp'
      - 'bilder/merker/historie/locales/*/nittenhundre_1900_1945.webp'
      - 'bilder/merker/historie/undermerker/attenhundretallet-brodert-v1.webp'
      - 'bilder/merker/historie/locales/*/attenhundretallet.webp'
      - 'bilder/merker/historie/undermerker/tidlig_modernetid-brodert-v1.webp'
      - 'bilder/merker/historie/locales/*/tidlig_modernetid.webp'
      - 'bilder/merker/historie/undermerker/middelalder-brodert-v1.webp'
      - 'bilder/merker/historie/locales/*/middelalder.webp'
      - 'bilder/merker/historie/undermerker/forhistorie-brodert-v1.webp'
      - 'bilder/merker/historie/locales/*/forhistorie.webp'
      - 'bilder/merker/by/undermerker/bolig_og_bomiljo-brodert-v1.webp'
      - 'bilder/merker/by/locales/*/bolig_og_bomiljo.webp'
      - 'bilder/merker/by/undermerker/monumenter_og_landemerker-brodert-v1.webp'
      - 'bilder/merker/by/locales/*/monumenter_og_landemerker.webp'
      - 'tests/badge-embroidered-rollout-v1.test.mjs'
      - '.github/workflows/qa-embroidered-rollout.yml'
permissions:
  contents: read

concurrency:
  group: embroidered-badges-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  badge-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify artwork, approved originals and underbadges
        run: |
          node --test tests/badge-embroidered-rollout-v1.test.mjs
          node --test tests/badge-embroidered-rollout-v2.test.mjs
          node --test tests/infrastruktur-candidate.test.mjs
          node --test tests/monumenter-badge.test.mjs
          node --test tests/bolig-badge.test.mjs
          node --test tests/forhistorie-candidate.test.mjs
          node --test tests/middelalder-candidate.test.mjs
          node --test tests/tidlig-modernetid-candidate.test.mjs
          node --test tests/historie-1800-badge-contract.test.mjs
          node --test tests/historie-etterkrigstid-badge-contract.test.mjs
          node --test tests/historie-byhistorie-badge-contract.test.mjs
          node --test tests/historie-industrihistorie-badge-contract.test.mjs
          node --test tests/historie-krigshistorie-badge-contract.test.mjs
          node --test tests/historie-sosialhistorie-badge-contract.test.mjs
          node --test tests/historie-kulturminner-bevaring-badge-contract.test.mjs
          node --test tests/historie-krim-ulykker-branner-badge-contract.test.mjs
          node --test tests/historie-migrasjon-minoritetshistorie-badge-contract.test.mjs
          node --test tests/vitenskap-teknologi-ingeniorfag-badge-candidate.test.mjs
          node --test tests/historie-samtidshistorie-badge-contract.test.mjs
          node --test tests/historie-1900-1945-badge.test.mjs
      - name: Generate four-badge preview
        run: |
          python -m pip install -q pillow
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw
          manifest=json.loads(Path('data/badges/embroidered_rollout_v1.json').read_text())
          dst=Path('out'); dst.mkdir(exist_ok=True)
          sheet=Image.new('RGB',(1040,290),'#16202c')
          d=ImageDraw.Draw(sheet)
          for i,art in enumerate(manifest['assets']):
              with Image.open(art['image']) as img:
                  assert img.size==(1024,1024)
                  assert img.mode=='RGBA'
                  icon=img.copy()
              icon.thumbnail((240,240),Image.Resampling.LANCZOS)
              sheet.paste(icon,(i*260+10,6),icon)
              d.text((i*260+20,255),art['id'],fill='white')
          sheet.save(dst/'embroidered-review.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: embroidered-four-review
          path: out/embroidered-review.png
          retention-days: 7
