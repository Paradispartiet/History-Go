name: TEMP Oslo timeline Akerselva v9

on:
  push:
    branches:
      - agent/oslo-timeline-anchors-v9-akerselva-20260827

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize chronology
        run: node tools/TEMP-materialize-oslo-timeline-akerselva-v9.mjs materialize
      - name: Build generated History data
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-epoke-place-index.mjs
          npm run place-open:build
          node tools/TEMP-materialize-oslo-timeline-akerselva-v9.mjs finalize
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-audit --no-fund; else npm install --ignore-scripts --no-audit --no-fund; fi
      - name: Validate complete tranche
        shell: bash
        run: |
          set -euo pipefail
          npm run epoker:places:check
          node --test tests/epoke-viewer.test.mjs tests/epoker-runtime-place-index.test.mjs tests/epoke-place-index.test.mjs
          npm run place-open:check
          npm run test:place-open
          npm run leksikon:ids:check
          npm run typecheck:web
          npm run build:web:check
          git diff --check
      - name: Ensure canonical Place files are untouched
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only origin/main | grep -q '^data/places/'; then
            echo 'Canonical Place file changed unexpectedly' >&2
            git diff --name-only origin/main | grep '^data/places/' >&2
            exit 1
          fi
      - name: Commit verified outputs and remove TEMP files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/TEMP-oslo-timeline-akerselva-v9.yml
          rm tools/TEMP-materialize-oslo-timeline-akerselva-v9.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Add source-backed Akerselva industry timeline anchors'
          git push origin HEAD:agent/oslo-timeline-anchors-v9-akerselva-20260827
