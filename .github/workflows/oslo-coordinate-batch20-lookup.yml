name: Oslo coordinate batch 20 address lookup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lookup:
    if: github.event.pull_request.head.ref == 'agent/oslo-coordinate-control-batch20'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run and save address-first lookups
        run: |
          set -o pipefail
          mkdir -p reports/oslo-coordinate-control-batch-20/lookups
          npm run places:coords:find:address -- --address "Ekebergveien 1 Oslo" \
            | tee reports/oslo-coordinate-control-batch-20/lookups/oslo_hospital-geonorge.json
          npm run places:coords:find:address -- --address "Åkebergveien 11 Oslo" \
            | tee reports/oslo-coordinate-control-batch-20/lookups/botsfengselet-geonorge.json
          npm run places:coords:find:address -- --address "Storgata 36 Oslo" \
            | tee reports/oslo-coordinate-control-batch-20/lookups/prinds_christian_augusts_minde-geonorge.json
          npm run places:coords:find:address -- --address "Nedre Slottsgate 1 Oslo" \
            | tee reports/oslo-coordinate-control-batch-20/lookups/gamle_radhus-geonorge.json
      - name: Upload lookup evidence
        uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch20-lookups
          path: reports/oslo-coordinate-control-batch-20/lookups
          if-no-files-found: error
