# fresh-main trigger 2026-09-08
name: TEMP Civication Vitenskap Undervisning og forskning Role World

on:
  push:
    branches:
      - agent/civication-vitenskap-undervisning-og-forskning-role-world-20260908
    paths:
      - scripts/TEMP_materialize_vitenskap_undervisning_og_forskning_role_world.mjs
      - .github/workflows/TEMP-civication-vitenskap-undervisning-og-forskning-role-world.yml

permissions:
  contents: write

concurrency:
  group: temp-civication-vitenskap-undervisning-og-forskning-role-world
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-vitenskap-undervisning-og-forskning-role-world-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Require fresh main ancestry before materialization
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'Branch is stale versus main before materialization.' >&2; exit 1; }
      - name: Syntax check materializer
        run: node --check scripts/TEMP_materialize_vitenskap_undervisning_og_forskning_role_world.mjs
      - name: Materialize Role World
        run: node scripts/TEMP_materialize_vitenskap_undervisning_og_forskning_role_world.mjs
      - name: Generate canonical derived surfaces
        run: |
          set -euo pipefail
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify Undervisning og forskning Role World
        run: node tests/civication-vitenskap-undervisning-og-forskning-role-world-rollout.test.js
      - name: Verify global Role World contract
        run: node tests/civication-role-world-contract.test.js
      - name: Verify Career Gameplay Matrix
        run: node tests/civication-career-gameplay-matrix.test.js
      - name: Verify Role World readiness
        run: node tests/civication-role-world-rollout-readiness.test.js
      - name: Verify full Civication suite
        run: node tests/run-civication-tests.mjs
      - name: Verify job learning profiles
        run: npm run audit:job-learning-profiles
      - name: Verify job knowledge requirements
        run: npm run audit:job-knowledge-requirements
      - name: Require exact 83-role completion state
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('data/Civication/roleWorldRolloutReadiness.json','utf8'));
          if(r.summary.role_world_complete_or_pilot!==83) throw new Error('Expected 83 complete/pilot, got '+r.summary.role_world_complete_or_pilot);
          if(r.summary.first_wave_candidate_count!==0) throw new Error('Expected no remaining first-wave candidates, got '+r.summary.first_wave_candidate_count);
          const row=r.roles.find(x=>x.key==='vitenskap/vitenskap_undervisning_og_forskning');
          if(!row) throw new Error('Target role missing from readiness');
          if(row.role_world_status!=='role_world_complete') throw new Error('Target Role World not complete');
          if(row.classification!=='rollout_ready') throw new Error('Target not rollout_ready');
          if(JSON.stringify(row.authored_work_required)!=='[]') throw new Error('Target authored work remains: '+JSON.stringify(row.authored_work_required));
          if((r.rollout_queue||[]).some(x=>x.key==='vitenskap/vitenskap_undervisning_og_forskning')) throw new Error('Target still in rollout queue');
          console.log(JSON.stringify(r.summary,null,2));
          NODE
      - name: Require fresh main ancestry before scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'Branch became stale before scope verification.' >&2; exit 1; }
      - name: Verify exact permanent Role World scope
        shell: bash
        run: |
          set -euo pipefail
          ROLE=vitenskap_undervisning_og_forskning
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          if [ "${#changed[@]}" -ne 9 ]; then echo "Expected exactly 9 permanent Role World paths, found ${#changed[@]}" >&2; exit 1; fi
          expected=(
            data/Civication/careerGameplayMatrix.json
            data/Civication/roleWorldAuthoringChecklist.json
            data/Civication/roleWorldRolloutReadiness.json
            data/Civication/roleWorldThemeBank.json
            data/Civication/roleWorlds/index.json
            data/Civication/roleWorlds/vitenskap/${ROLE}.json
            reports/CIVICATION_VITENSKAP_UNDERVISNING_OG_FORSKNING_ROLE_WORLD_ROLLOUT_SOURCE_FIRST.md
            reports/civication-role-world-rollout-readiness.md
            tests/civication-vitenskap-undervisning-og-forskning-role-world-rollout.test.js
          )
          for f in "${expected[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fx "$f" >/dev/null || { echo "Missing expected path: $f" >&2; exit 1; }; done
          for f in "${changed[@]}"; do printf '%s\n' "${expected[@]}" | grep -Fx "$f" >/dev/null || { echo "Unexpected path: $f" >&2; exit 1; }; done
          git diff --check
      - name: Require fresh main ancestry before permanent commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'Branch became stale before permanent commit.' >&2; exit 1; }
      - name: Commit permanent verified Role World
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/TEMP_materialize_vitenskap_undervisning_og_forskning_role_world.mjs
          rm -f .github/workflows/TEMP-civication-vitenskap-undervisning-og-forskning-role-world.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then echo 'No permanent changes to commit.' >&2; exit 1; fi
          git diff --cached --check
          git status --short
          git commit -m "Complete Vitenskap Undervisning og forskning Role World"
          git push origin HEAD:agent/civication-vitenskap-undervisning-og-forskning-role-world-20260908
