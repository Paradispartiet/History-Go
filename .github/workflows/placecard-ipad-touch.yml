name: PlaceCard iPad touch contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tests/placecard-hero-meta-position-browser.test.mjs'
      - 'tests/placecard-people-hero-browser.test.mjs'
      - '.github/workflows/placecard-ipad-touch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: placecard-ipad-touch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ipad-touch:
    name: Two PlaceCard iPad touch browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify iPad tap targets and PlaceCard geometry
        run: |
          node tests/placecard-hero-meta-position-browser.test.mjs
          node tests/placecard-people-hero-browser.test.mjs
