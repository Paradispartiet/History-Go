name: Tøyenbadet historical photos and epoch sync (one-shot)
on:
  push:
    branches: [content/toyenbadet-vferdig-20261103]
    paths:
      - '.github/workflows/toyenbadet-vferdig-asset-integration.yml'
      - 'scripts/build-toyenbadet-media-20261103.mjs'
permissions:
  contents: write
concurrency:
  group: toyenbadet-asset-one-shot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/toyenbadet-vferdig-20261103
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Produce two distinct CC-licensed historic WebP photographs
        run: node scripts/build-toyenbadet-media-20261103.mjs
      - name: Sync source-backed epoch index from existing verified claims
        run: npm run epoker:places:build
      - name: Relevant Tøyenbadet quiz and source parity
        run: node --test tests/oslo-ts-toyenbadet-parity.test.mjs
      - name: Commit bounded source and generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add billeder/places 2>/dev/null || true
          git add bilder/places/candidates/oslo-vferdig-20261103/toyenbadet_historic_2013_hero.webp
          git add bilder/places/candidates/oslo-vferdig-20261103/toyenbadet_historic_1980_portrait.webp
          git add data/places/sport/europa/norway/oslo_sport/toyenbadet.json
          git add data/runtime/place-open/toyenbadet.json
          git add data/epoker/epoke-place-index.json
          git add reports/place-production/toyenbadet-workcard-current.json
          if ! git diff --cached --quiet; then
            git commit -m 'Tøyenbadet: two license-audited historical WebP assets and epoch index'
            git push origin HEAD:content/toyenbadet-vferdig-20261103
          fi
