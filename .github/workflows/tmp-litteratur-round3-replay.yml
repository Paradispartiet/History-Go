name: TEMP Litteratur round3 replay

on:
  push:
    branches:
      - agent/litteratur-maintenance-source-refresh-round3-20260905

permissions:
  contents: write

jobs:
  replay:
    if: github.ref_name == 'agent/litteratur-maintenance-source-refresh-round3-20260905'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/litteratur-maintenance-source-refresh-round3-20260905
          fetch-depth: 0
      - name: Replay onto fresh main and regenerate release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "data/fagverk/fagverk_release.json" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --theirs data/fagverk/fagverk_release.json
            git add data/fagverk/fagverk_release.json
            git commit --no-edit
          fi
          node scripts/build-fagverk-release-manifest.mjs
          git add data/fagverk/fagverk_release.json
          git rm .github/workflows/tmp-litteratur-round3-replay.yml
          if ! git diff --cached --quiet; then
            git commit -m "Replay Litteratur round 3 on fresh main"
          fi
          git push origin HEAD:agent/litteratur-maintenance-source-refresh-round3-20260905
