name: Oslo six PR 6586 materialize once
on:
  push:
    branches:
      - research/oslo-six-culture-institutions-v1-20261023
    paths:
      - .github/workflows/oslo-six-materialize-pr6586.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-six-culture-institutions-v1-20261023
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify six place-owned Fagverk articles
        run: node scripts/audit-fagverk-place-pages.mjs --write
      - name: Regenerate indexed and runtime assets
        run: |
          npm run places:index:build
          node scripts/build-fagverk-release-manifest.mjs
          npm run place-open:build
          npm run epoker:places:build
      - name: Verify generated assets
        run: |
          npm run place-open:check
          npm run epoker:places:check
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit only deterministic generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/places/places_index.json data/fagverk/fagverk_release.json data/runtime data/epoker/epoke-place-index.json reports/fagverk/fagverk-place-page-coverage-v2.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git diff --cached --stat
            git commit -m "chore(oslo): sync generated place and Fagverk assets for PR 6586"
            git push origin HEAD:research/oslo-six-culture-institutions-v1-20261023
          fi
