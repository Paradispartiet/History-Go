name: Elvepartiet nedenfor Nydalsdammen v2 finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/elvepartiet-nydalsdammen-v2-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Restore and publish validated Elvepartiet files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          auth_url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git clone --quiet --depth=1 --branch "$BRANCH" "$auth_url" work
          cd work
          git fetch --quiet --depth=1 origin \
            refs/heads/agent/tmp-elvepartiet-source-2496:refs/remotes/origin/elvepartiet-source-2496
          source_ref='refs/remotes/origin/elvepartiet-source-2496'

          for file in \
            data/places/natur/oslo/places_oslo_natur_akerselvarute/stilla_nydalen.json \
            data/quiz/natur/stilla_nydalen_sets.json \
            data/stories/stories_stilla_nydalen.json \
            reports/elvepartiet-nydalsdammen-nature-rounds-batch1.md \
            tests/elvepartiet-nydalsdammen-nature-rounds-batch1.test.js
          do
            git show "$source_ref:$file" > "$file"
          done

          git show "$source_ref:data/leksikon/places/oslo/natur/leksikon_oslo_natur_batch1.json" > /tmp/source-leksikon.json
          git show "$source_ref:data/places/natur/oslo/places_oslo_natur_akerselvarute_index.json" > /tmp/source-index.json
          git show "$source_ref:data/places/natur/oslo/places_oslo_natur_akerselvarute_manifest.json" > /tmp/source-manifest.json

          node <<'NODE'
          const fs = require('fs');
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, value) => fs.writeFileSync(p, JSON.stringify(value, null, 2) + '\n');
          const leksikonPath = 'data/leksikon/places/oslo/natur/leksikon_oslo_natur_batch1.json';
          const currentLeksikon = read(leksikonPath);
          const sourceLeksikon = read('/tmp/source-leksikon.json');
          const sourceArticle = sourceLeksikon.find((row) => row.place_id === 'stilla_nydalen');
          const articleIndex = currentLeksikon.findIndex((row) => row.place_id === 'stilla_nydalen');
          if (!sourceArticle || articleIndex < 0) throw new Error('Missing stilla_nydalen leksikon row');
          currentLeksikon[articleIndex] = sourceArticle;
          write(leksikonPath, currentLeksikon);
          for (const [target, source] of [
            ['data/places/natur/oslo/places_oslo_natur_akerselvarute_index.json', '/tmp/source-index.json'],
            ['data/places/natur/oslo/places_oslo_natur_akerselvarute_manifest.json', '/tmp/source-manifest.json']
          ]) {
            const current = read(target);
            const sourceRows = read(source);
            const currentRow = current.find((row) => row.id === 'stilla_nydalen');
            const sourceRow = sourceRows.find((row) => row.id === 'stilla_nydalen');
            if (!currentRow || !sourceRow) throw new Error(`Missing stilla_nydalen in ${target}`);
            currentRow.name = sourceRow.name;
            write(target, current);
          }
          NODE

          git diff HEAD --name-only | tee /tmp/changed-files.txt

          python <<'PY'
          import base64, json, os, pathlib, urllib.error, urllib.parse, urllib.request
          token, repo, branch = os.environ['GH_TOKEN'], os.environ['REPO'], os.environ['BRANCH']
          paths = [p.strip() for p in pathlib.Path('/tmp/changed-files.txt').read_text().splitlines() if p.strip()]
          print('FILES', json.dumps(paths, ensure_ascii=False))
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'history-go-elvepartiet-v2-finalizer',
          }
          def call(url, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read().decode()
                      return response.status, json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode()
                  print(f'HTTP_ERROR method={method} status={exc.code} url={url} body={body}')
                  if exc.code == 404:
                      return 404, None
                  raise
          for path in paths:
              local_bytes = pathlib.Path(path).read_bytes()
              url = f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(path, safe="/")}'
              status, current = call(f'{url}?ref={urllib.parse.quote(branch, safe="")}')
              payload = {
                  'message': f'Rebuild Elvepartiet below Nydalsdammen: {path}',
                  'content': base64.b64encode(local_bytes).decode(),
                  'branch': branch,
              }
              if current and current.get('sha'):
                  payload['sha'] = current['sha']
              put_status, result = call(url, 'PUT', payload)
              print(f'PUBLISHED path={path} status={put_status} commit={result.get("commit", {}).get("sha", "")}')
          PY
