name: Elvepartiet nedenfor Nydalsdammen v2 finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/elvepartiet-nydalsdammen-v2-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Publish validated Elvepartiet data atomically
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --branch "$BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" work
          cd work
          python tools/elvepartiet_v2_publish.py
