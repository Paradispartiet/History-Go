name: Elvepartiet nedenfor Nydalsdammen v2 finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/elvepartiet-nydalsdammen-v2-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Apply already-validated PR 2496 patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/elvepartiet-nydalsdammen-nature-rounds-batch1-v2/validation
          curl -L --fail --silent --show-error \
            'https://github.com/Paradispartiet/History-Go/pull/2496.patch' \
            -o /tmp/pr-2496.patch
          git apply --3way --whitespace=nowarn /tmp/pr-2496.patch
          rm -f /tmp/pr-2496.patch

      - name: Diagnose and publish validated data
        shell: bash
        run: |
          set -u
          branch='agent/fill-elvepartiet-nydalsdammen-nature-rounds-batch1-v2'
          outdir='reports/elvepartiet-nydalsdammen-nature-rounds-batch1-v2/validation'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          echo '--- STATUS BEFORE COMMIT ---'
          git status --short
          echo '--- COMMIT ---'
          git -c commit.gpgsign=false commit --no-verify -m 'Rebuild Elvepartiet below Nydalsdammen rounds on current main'
          commit_status=$?
          echo "commit_status=$commit_status"
          if [ "$commit_status" -ne 0 ]; then exit "$commit_status"; fi
          echo '--- PUSH ---'
          git push --verbose origin "HEAD:refs/heads/$branch"
          push_status=$?
          echo "push_status=$push_status"
          exit "$push_status"
