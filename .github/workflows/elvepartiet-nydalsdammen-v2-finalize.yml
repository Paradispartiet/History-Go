name: Elvepartiet nedenfor Nydalsdammen v2 finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/elvepartiet-nydalsdammen-v2-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply validated PR 2496 patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/elvepartiet-v2
          curl -L --fail --silent --show-error \
            'https://github.com/Paradispartiet/History-Go/pull/2496.patch' \
            -o /tmp/elvepartiet-v2/pr-2496.patch
          git apply --3way --whitespace=nowarn /tmp/elvepartiet-v2/pr-2496.patch \
            2>&1 | tee /tmp/elvepartiet-v2/git-apply.txt

      - name: Build and validate
        shell: bash
        run: |
          set -euo pipefail
          npm run places:index:build | tee /tmp/elvepartiet-v2/places-index-build.txt
          npm run places:index:check | tee /tmp/elvepartiet-v2/places-index-check.txt
          npm run audit:places-split-manifest-sync | tee /tmp/elvepartiet-v2/split-manifest-sync.txt
          node tests/elvepartiet-nydalsdammen-nature-rounds-batch1.test.js \
            | tee /tmp/elvepartiet-v2/targeted-test.txt
          node tests/place-card-rounds-runtime-audit.test.js \
            | tee /tmp/elvepartiet-v2/place-card-rounds-runtime.txt
          git diff --cached --check | tee /tmp/elvepartiet-v2/git-diff-cached-check.txt

      - name: Publish validated files through GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git diff HEAD --name-only \
            | grep -v '^\.github/workflows/elvepartiet-nydalsdammen-v2-finalize\.yml$' \
            | tee /tmp/elvepartiet-v2/changed-files.txt
          python <<'PY' | tee /tmp/elvepartiet-v2/publish.txt
          import base64
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          branch = os.environ['BRANCH']
          paths = [
              line.strip()
              for line in pathlib.Path('/tmp/elvepartiet-v2/changed-files.txt').read_text().splitlines()
              if line.strip()
          ]
          if not paths:
              raise SystemExit('No validated files to publish')

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'history-go-elvepartiet-v2-finalizer',
          }

          def request_json(url, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as response:
                      return response.status, json.loads(response.read().decode())
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode()
                  if exc.code == 404:
                      return 404, None
                  raise RuntimeError(f'{method} {url} failed: {exc.code} {body}') from exc

          for path in paths:
              file_path = pathlib.Path(path)
              if not file_path.is_file():
                  raise RuntimeError(f'Expected changed file is missing: {path}')
              encoded_path = urllib.parse.quote(path, safe='/')
              ref = urllib.parse.quote(branch, safe='')
              url = f'https://api.github.com/repos/{repo}/contents/{encoded_path}'
              status, current = request_json(f'{url}?ref={ref}')
              local_bytes = file_path.read_bytes()
              if status == 200 and current and current.get('content'):
                  remote_bytes = base64.b64decode(current['content'].replace('\n', ''))
                  if remote_bytes == local_bytes:
                      print(f'skip unchanged {path}')
                      continue
              payload = {
                  'message': f'Rebuild Elvepartiet below Nydalsdammen: {path}',
                  'content': base64.b64encode(local_bytes).decode(),
                  'branch': branch,
              }
              if current and current.get('sha'):
                  payload['sha'] = current['sha']
              put_status, result = request_json(url, method='PUT', payload=payload)
              print(f'published {path}: HTTP {put_status} commit={result.get("commit", {}).get("sha", "")[:12]}')
          PY
