name: History profile and evidence

on:
  pull_request:
    paths:
      - 'data/fag/profiles/**'
      - 'data/fag/historie/case_requirements_historie_canonical_v1.json'
      - 'data/fag/historie/claims_historie_canonical_v1.json'
      - 'data/fag/historie/sources_historie_canonical_v1.json'
      - 'data/fag/historie/place_evidence_historie_v1.json'
      - 'data/fag/historie/emner_historie_canonical_v4_5.json'
      - 'data/fag/historie/historie_universal_coverage_contract_v1.json'
      - 'data/fag/historie/historie_v5_contract.json'
      - 'tools/validate-historie-profile-evidence.mjs'
      - 'tools/audit-historie-geographic-profile.mjs'
      - 'tools/audit-historie-universal-coverage.mjs'
      - 'reports/historie-profile-evidence/**'
      - 'reports/historie-geographic-profiles/**'
      - 'reports/historie-universal-coverage/**'
      - 'docs/HISTORY_UNIVERSAL_COVERAGE.md'
      - 'docs/SUBJECT_FILE_CONTRACT.md'
      - 'docs/DATA_PRODUCTION_CONTRACT.md'
      - '.github/workflows/history-profile-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile-evidence:
    name: History profile, claims, sources and evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate profile and evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/validate-historie-profile-evidence.mjs
          node --check tools/audit-historie-geographic-profile.mjs
          node tools/validate-historie-profile-evidence.mjs

      - name: Verify geographic profile report
        run: node tools/audit-historie-geographic-profile.mjs --check

      - name: Verify universal coverage report
        run: node tools/audit-historie-universal-coverage.mjs --check

      - name: Verify permanent V5.8 freeze
        run: node tools/audit-historie-v5-5-quality-depth.mjs

      - name: Upload profile and evidence audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-profile-evidence
          path: |
            reports/historie-profile-evidence/history-profile-evidence-foundation.json
            reports/historie-profile-evidence/history-profile-evidence-foundation.md
            reports/historie-geographic-profiles/oslo-akershus-profile.json
            reports/historie-geographic-profiles/oslo-akershus-profile.md
            reports/historie-geographic-profiles/sapmi-nordlige-kontaktsoner-profile.json
            reports/historie-geographic-profiles/sapmi-nordlige-kontaktsoner-profile.md
            reports/historie-universal-coverage/historie-universal-coverage.json
            reports/historie-universal-coverage/historie-universal-coverage.md
            reports/historie-v5/historie-v5-8-quality-depth.json
            reports/historie-v5/historie-v5-8-quality-depth.md
          if-no-files-found: error
