name: TEMP Civication Role World broad-rollout policy materializer

on:
  push:
    branches:
      - agent/civication-role-world-broad-rollout-policy

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-role-world-broad-rollout-policy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Repair TEMP test discovery regex
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/TEMP-materialize-civication-role-world-broad-rollout-policy.mjs')
          source = path.read_text()
          before = r'/^civication-.*\\.test\\.js$/'
          after = r'/^civication-.*\.test\.js$/'
          if source.count(before) != 1:
              raise SystemExit(f'expected exactly one stale TEMP regex, found {source.count(before)}')
          path.write_text(source.replace(before, after))
          PY
      - name: Materialize policy transition
        run: node scripts/TEMP-materialize-civication-role-world-broad-rollout-policy.mjs
      - name: Regenerate readiness audit for open policy lifecycle
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify readiness lifecycle
        run: node tests/civication-role-world-rollout-readiness.test.js
      - name: Verify broad-rollout policy contract
        run: node tests/civication-role-world-broad-rollout-policy.test.js
      - name: Verify locked Realism Matrix
        run: node tests/civication-role-world-realism-matrix.test.js
      - name: Verify cross-role authority boundary
        run: node tests/civication-cross-role-shared-world.test.js
      - name: Verify runtime governance unchanged
        run: node tests/civication-role-world-runtime-governance.test.js
      - name: Run complete Civication suite
        run: npm run test:civication
      - name: Publish permanent policy transition
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/TEMP-civication-role-world-broad-rollout-policy.yml
          rm -f scripts/TEMP-materialize-civication-role-world-broad-rollout-policy.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Open controlled Civication Role World broad rollout"
          git pull --rebase origin agent/civication-role-world-broad-rollout-policy
          git push origin HEAD:agent/civication-role-world-broad-rollout-policy
