name: TEMP Materialize Programleder Role World

on:
  push:
    branches:
      - agent/civication-film-tv-programleder-role-world-rollout
    paths:
      - scripts/TEMP_materialize_programleder_role_world.mjs
      - tests/civication-film-tv-programleder-role-world-rollout.test.js
      - .github/workflows/TEMP-civication-programleder-role-world-materialize.yml

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-film-tv-programleder-role-world-rollout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Canonicalize temporary source and registry assertion
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sourcePath = 'scripts/TEMP_materialize_programleder_role_world.mjs';
          let source = fs.readFileSync(sourcePath, 'utf8');
          const canonicalizeExact = (before, after, expected = 1, label = before) => {
            const beforeCount = source.split(before).length - 1;
            const afterCount = source.split(after).length - 1;
            if (beforeCount === expected && afterCount === 0) {
              source = source.split(before).join(after);
              return;
            }
            if (beforeCount === 0 && afterCount === expected) return;
            throw new Error(`Unexpected ${label} state: before=${beforeCount}, canonical=${afterCount}, expected=${expected}`);
          };

          canonicalizeExact("intent:'approve'", "intent:'execute'", 2, 'legacy approve intents');
          canonicalizeExact("person('venn',", "person('programleder_privathjem_venn',", 1, 'venn archetype');
          canonicalizeExact("person('familie',", "person('programleder_privathjem_familie',", 1, 'familie archetype');
          canonicalizeExact(
            'Amina og Ingrid reagerer på om programlederens skarphet bevarer kildestatus og godkjenningslinje.',
            'Amina og Ingrid reagerer på om programlederens skarphet bevarer kildestatus og godkjenningslinje gjennom hele løpet.'
          );
          canonicalizeExact(
            'Thea og gjesten husker om venting ble respektert, og om differensiert samtykke overlever etterbruk.',
            'Thea og gjesten husker om venting ble respektert, og om differensiert samtykke overlever etterbruk når konteksten endres.'
          );
          for (const [before, after] of [
            ['Ingrid ber deg samle verifiserte fakta, åpne hypoteser, gjestens avtalte ramme, reservespor og beslutningseiere i ett arbeidsobjekt før studiomøtet.','Ingrid ber deg samle verifiserte fakta, åpne hypoteser, gjestens avtalte ramme, reservespor og beslutningseiere i ett arbeidsobjekt før studiomøtet, slik at restspørsmål og mandat er synlige.'],
            ['Gjesten vil delta, men trenger en ny avklaring om familiedetaljen og klippebruk. Thea kan behandle et presist handoff; redaksjonen må vente på svar.','Gjesten vil delta, men trenger en ny avklaring om familiedetaljen og klippebruk. Thea kan behandle et presist handoff; redaksjonen må vente på svar før premiss og etterbruk kan regnes som avklart.'],
            ['I ventetiden forteller gjesten om en belastning som kan gi sterk TV, men sier samtidig at hen ikke vet om det skal bli del av programmet.','I ventetiden forteller gjesten om en belastning som kan gi sterk TV, men sier samtidig at hen ikke vet om det skal bli del av programmet; den nye sårbarheten må derfor forbli utenfor sendeflyten til avklaringen er reell.'],
            ['Ingrid vil beholde konfliktkraften etter gjesteavklaringen og ber deg anbefale en åpning som er skarp uten å gjøre hypotesen til konklusjon.','Ingrid vil beholde konfliktkraften etter gjesteavklaringen og ber deg anbefale en åpning som er skarp uten å gjøre hypotesen til konklusjon, samtidig som hennes eksplisitte godkjenningspunkt består.'],
            ['Samtalen holdt seg innen avtalt premiss, men en sterk generell formulering kan lett klippes sammen med kontekst gjesten ba om å holde utenfor.','Samtalen holdt seg innen avtalt premiss, men en sterk generell formulering kan lett klippes sammen med kontekst gjesten ba om å holde utenfor; etterbruk må derfor håndteres som nytt, sporbart handoff.'],
            ['En uavklart betroelse gjøres til taktisk reserve, selv om gjesten ba om tid.','En uavklart betroelse gjøres til taktisk reserve, selv om gjesten ba om tid, og den faktiske ventingen undergraves.'],
            ['Synlighet og situert tillit brukes som erstatning for redaksjonell godkjenning.','Synlighet og situert tillit brukes som erstatning for redaksjonell godkjenning, slik at mandatgrensen blir uleselig.'],
            ['Bruksgrensen blir operativ for hele redaksjonen og kan etterprøves senere.','Bruksgrensen blir operativ for hele redaksjonen, følger materialet videre og kan etterprøves senere.']
          ]) canonicalizeExact(before, after);

          const fieldsStartMarker = "  fields: {\n    authority_context: {";
          const scenesMarker = "\n});\n\nconst scenes =";
          const fieldsStart = source.lastIndexOf(fieldsStartMarker);
          const scenesAt = source.indexOf(scenesMarker, fieldsStart);
          if (fieldsStart < 0 || scenesAt < 0) throw new Error('Could not locate canonical Programleder authority_context block');
          const fieldsEnd = source.lastIndexOf("\n  }", scenesAt);
          if (fieldsEnd < fieldsStart) throw new Error('Could not locate end of canonical Programleder authority_context block');
          const authorityFields = source.slice(fieldsStart, fieldsEnd + "\n  }".length);
          const conflictAnchor = "    ],{action_id:'approve_editorial_premise',intent:'execute'})\n  ]\n});\n\nconst event =";
          const canonicalConflictAnchor = "    ],{action_id:'approve_editorial_premise',intent:'execute'})\n  ],\n  fields: {\n    authority_context: {";
          const conflictCount = source.split(conflictAnchor).length - 1;
          const canonicalConflictCount = source.split(canonicalConflictAnchor).length - 1;
          if (conflictCount === 1 && canonicalConflictCount === 0) {
            source = source.replace(conflictAnchor, "    ],{action_id:'approve_editorial_premise',intent:'execute'})\n  ],\n" + authorityFields + "\n});\n\nconst event =");
          } else if (!(conflictCount === 0 && canonicalConflictCount === 1)) {
            throw new Error(`Unexpected conflict authority state: legacy=${conflictCount}, canonical=${canonicalConflictCount}`);
          }
          fs.writeFileSync(sourcePath, source);

          const testPath = 'tests/civication-film-tv-programleder-role-world-rollout.test.js';
          let test = fs.readFileSync(testPath, 'utf8');
          const wrong = '  assert.equal(entry.scene.role_scope, ROLE);';
          const correct = '  assert.equal(entry.role_scope, ROLE);';
          const wrongCount = test.split(wrong).length - 1;
          const correctCount = test.split(correct).length - 1;
          if (wrongCount === 1 && correctCount === 0) {
            test = test.replace(wrong, correct);
          } else if (!(wrongCount === 0 && correctCount === 1)) {
            throw new Error(`Unexpected registry assertion state: legacy=${wrongCount}, canonical=${correctCount}`);
          }
          fs.writeFileSync(testPath, test);
          NODE
      - name: Materialize permanent authored data
        run: node scripts/TEMP_materialize_programleder_role_world.mjs
      - name: Regenerate canonical derived artifacts
        run: |
          node scripts/build-civication-scene-registry.mjs --write
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify Programleder rollout
        id: rollout
        continue-on-error: true
        shell: bash
        run: node tests/civication-film-tv-programleder-role-world-rollout.test.js > /tmp/programleder-rollout.log 2>&1
      - name: Upload Programleder rollout failure
        if: steps.rollout.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: programleder-rollout-failure
          path: /tmp/programleder-rollout.log
          retention-days: 1
      - name: Enforce Programleder rollout
        if: steps.rollout.outcome == 'failure'
        run: |
          cat /tmp/programleder-rollout.log
          exit 1
      - name: Verify Programleder playability
        run: node tests/civication-film-tv-programleder-playability.test.js
      - name: Verify Role World contract
        run: node tests/civication-role-world-contract.test.js
      - name: Verify broad rollout policy
        run: node tests/civication-role-world-broad-rollout-policy.test.js
      - name: Verify derived artifacts
        run: |
          node scripts/build-civication-scene-registry.mjs --check
          node scripts/audit-civication-career-gameplay.mjs --check
          node scripts/audit-civication-role-world-rollout-readiness.mjs --check
      - name: Run full Civication suite
        run: npm run test:civication
      - name: Remove temporary materialization surface
        run: |
          rm scripts/TEMP_materialize_programleder_role_world.mjs
          rm .github/workflows/TEMP-civication-programleder-role-world-materialize.yml
      - name: Commit exact verified result
        run: |
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Film TV Programleder Role World rollout"
          git push origin HEAD:agent/civication-film-tv-programleder-role-world-rollout

# rerun after reconciliation with current main
