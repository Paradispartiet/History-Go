name: TEMP Materialize Programleder Role World

on:
  push:
    branches:
      - agent/civication-film-tv-programleder-role-world-rollout
    paths:
      - scripts/TEMP_materialize_programleder_role_world.mjs
      - tests/civication-film-tv-programleder-role-world-rollout.test.js
      - .github/workflows/TEMP-civication-programleder-role-world-materialize.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/TEMP_materialize_programleder_role_world.mjs
      - tests/civication-film-tv-programleder-role-world-rollout.test.js
      - .github/workflows/TEMP-civication-programleder-role-world-materialize.yml

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-film-tv-programleder-role-world-rollout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize permanent authored data
        run: node scripts/TEMP_materialize_programleder_role_world.mjs
      - name: Regenerate canonical artifacts
        run: |
          node scripts/build-civication-scene-registry.mjs --write
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify focused rollout and canonical gates
        run: |
          node tests/civication-film-tv-programleder-role-world-rollout.test.js
          node tests/civication-film-tv-programleder-playability.test.js
          node tests/civication-role-world-contract.test.js
          node tests/civication-role-world-broad-rollout-policy.test.js
          node scripts/build-civication-scene-registry.mjs --check
          node scripts/audit-civication-career-gameplay.mjs --check
          node scripts/audit-civication-role-world-rollout-readiness.mjs --check
      - name: Run full Civication suite
        run: npm run test:civication
      - name: Remove temporary materialization surface
        run: |
          rm scripts/TEMP_materialize_programleder_role_world.mjs
          rm .github/workflows/TEMP-civication-programleder-role-world-materialize.yml
      - name: Commit exact verified result
        run: |
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Film TV Programleder Role World rollout"
          git push origin HEAD:agent/civication-film-tv-programleder-role-world-rollout

