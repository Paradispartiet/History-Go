name: TEMP Materialize Programleder Role World

on:
  push:
    branches:
      - agent/civication-film-tv-programleder-role-world-rollout
    paths:
      - scripts/TEMP_materialize_programleder_role_world.mjs
      - tests/civication-film-tv-programleder-role-world-rollout.test.js
      - .github/workflows/TEMP-civication-programleder-role-world-materialize.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/TEMP_materialize_programleder_role_world.mjs
      - tests/civication-film-tv-programleder-role-world-rollout.test.js
      - .github/workflows/TEMP-civication-programleder-role-world-materialize.yml

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-film-tv-programleder-role-world-rollout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Canonicalize temporary authority source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/TEMP_materialize_programleder_role_world.mjs';
          let source = fs.readFileSync(file, 'utf8');

          const legacyIntents = source.match(/intent:'approve'/g) || [];
          if (legacyIntents.length !== 2) {
            throw new Error(`Expected exactly two legacy approve intents, found ${legacyIntents.length}`);
          }
          source = source.replaceAll("intent:'approve'", "intent:'execute'");

          for (const [legacyId, canonicalId] of [
            ['venn', 'programleder_privathjem_venn'],
            ['familie', 'programleder_privathjem_familie']
          ]) {
            const anchor = `person('${legacyId}',`;
            const matches = source.split(anchor).length - 1;
            if (matches !== 1) {
              throw new Error(`Expected exactly one recurring-person archetype ${legacyId}, found ${matches}`);
            }
            source = source.replace(anchor, `person('${canonicalId}',`);
          }

          for (const [before, after] of [
            [
              "Amina og Ingrid reagerer på om programlederens skarphet bevarer kildestatus og godkjenningslinje.",
              "Amina og Ingrid reagerer på om programlederens skarphet bevarer kildestatus og godkjenningslinje gjennom hele løpet."
            ],
            [
              "Thea og gjesten husker om venting ble respektert, og om differensiert samtykke overlever etterbruk.",
              "Thea og gjesten husker om venting ble respektert, og om differensiert samtykke overlever etterbruk når konteksten endres."
            ]
          ]) {
            const matches = source.split(before).length - 1;
            if (matches !== 1) {
              throw new Error(`Expected exactly one shallow Programleder thread relationship, found ${matches}`);
            }
            source = source.replace(before, after);
          }

          const fieldsStartMarker = "  fields: {\n    authority_context: {";
          const scenesMarker = "\n});\n\nconst scenes =";
          const fieldsStart = source.lastIndexOf(fieldsStartMarker);
          const scenesAt = source.indexOf(scenesMarker, fieldsStart);
          if (fieldsStart < 0 || scenesAt < 0) {
            throw new Error('Could not locate canonical Programleder authority_context block');
          }
          const fieldsEnd = source.lastIndexOf("\n  }", scenesAt);
          if (fieldsEnd < fieldsStart) {
            throw new Error('Could not locate end of canonical Programleder authority_context block');
          }
          const authorityFields = source.slice(fieldsStart, fieldsEnd + "\n  }".length);

          const conflictAnchor = "    ],{action_id:'approve_editorial_premise',intent:'execute'})\n  ]\n});\n\nconst event =";
          const conflictMatches = source.split(conflictAnchor).length - 1;
          if (conflictMatches !== 1) {
            throw new Error(`Expected exactly one Programleder conflict authority anchor, found ${conflictMatches}`);
          }
          source = source.replace(
            conflictAnchor,
            "    ],{action_id:'approve_editorial_premise',intent:'execute'})\n  ],\n" + authorityFields + "\n});\n\nconst event ="
          );

          fs.writeFileSync(file, source);
          NODE
      - name: Materialize permanent authored data
        run: node scripts/TEMP_materialize_programleder_role_world.mjs
      - name: Regenerate scene registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Regenerate career gameplay audit
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Regenerate role-world rollout readiness audit
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Prepare Programleder prefix diagnostics
        shell: bash
        run: |
          cat > /tmp/run-programleder-prefix.cjs <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const sourcePath = 'tests/civication-film-tv-programleder-role-world-rollout.test.js';
          const marker = process.argv[2];
          const source = fs.readFileSync(sourcePath, 'utf8');
          const index = source.indexOf(marker);
          if (index < 0) throw new Error(`Missing diagnostic marker: ${marker}`);
          const tmp = 'tests/.TEMP-programleder-prefix.test.js';
          fs.writeFileSync(tmp, source.slice(0, index) + "\nconsole.log('PASS prefix before: " + marker.replaceAll("'", "\\'") + "');\n");
          const result = spawnSync(process.execPath, [tmp], { stdio: 'inherit' });
          fs.rmSync(tmp, { force: true });
          process.exit(result.status ?? 1);
          NODE
      - name: Diagnose Programleder world model
        run: node /tmp/run-programleder-prefix.cjs "const catalogPaths ="
      - name: Diagnose Programleder scene mechanics
        run: node /tmp/run-programleder-prefix.cjs "const audiences ="
      - name: Diagnose Programleder situated audiences
        run: node /tmp/run-programleder-prefix.cjs "const rules ="
      - name: Diagnose Programleder authority contract
        run: node /tmp/run-programleder-prefix.cjs "const provenanceUses ="
      - name: Diagnose Programleder provenance
        run: node /tmp/run-programleder-prefix.cjs "const plan ="
      - name: Diagnose Programleder registry and readiness integration
        run: node /tmp/run-programleder-prefix.cjs "const sourceText ="
      - name: Verify Programleder role-world rollout
        run: node tests/civication-film-tv-programleder-role-world-rollout.test.js
      - name: Verify Programleder playability
        run: node tests/civication-film-tv-programleder-playability.test.js
      - name: Verify role-world contract
        run: node tests/civication-role-world-contract.test.js
      - name: Verify broad rollout policy
        run: node tests/civication-role-world-broad-rollout-policy.test.js
      - name: Check scene registry
        run: node scripts/build-civication-scene-registry.mjs --check
      - name: Check career gameplay audit
        run: node scripts/audit-civication-career-gameplay.mjs --check
      - name: Check role-world rollout readiness audit
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --check
      - name: Run full Civication suite
        run: npm run test:civication
      - name: Remove temporary materialization surface
        run: |
          rm scripts/TEMP_materialize_programleder_role_world.mjs
          rm .github/workflows/TEMP-civication-programleder-role-world-materialize.yml
      - name: Commit exact verified result
        run: |
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Film TV Programleder Role World rollout"
          git push origin HEAD:agent/civication-film-tv-programleder-role-world-rollout
