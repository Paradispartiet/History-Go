name: Oslo twenty Place photo research
on:
  push:
    branches: [content/oslo-twenty-place-photos-20261019]
    paths:
      - scripts/collect-oslo-photo-sources-20261019.py
      - .github/workflows/oslo-twenty-photo-sources.yml
permissions:
  contents: read
jobs:
  sources:
    name: Collect licensed documentary photo sources for twenty Places
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/collect-oslo-photo-sources-20261019.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oslo-twenty-documentary-photo-sources
          path: .tmp/oslo-twenty-photo-sources/
          include-hidden-files: true
          if-no-files-found: error
