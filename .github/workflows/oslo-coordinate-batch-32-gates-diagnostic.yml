name: Diagnose Oslo coordinate batch 32 gates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-32-final
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce batch state
        run: |
          node scripts/tmp-complete-oslo-coordinate-batch32.mjs
          node scripts/split-nature-oslo-akerselva-route.mjs
          rm -rf dist/tools
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),{stripTypeScriptTypes}=require('node:module');
          const src=path.resolve('tools'),out=path.resolve('dist/tools');
          function walk(d){return fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const f=path.join(d,e.name);return e.isDirectory()?walk(f):(/\.(mts|ts|cts)$/.test(e.name)?[f]:[])});}
          for(const f of walk(src)){const rel=path.relative(src,f),ext=path.extname(rel),oe=ext==='.mts'?'.mjs':ext==='.cts'?'.cjs':'.js',dest=path.join(out,rel.slice(0,-ext.length)+oe),s=fs.readFileSync(f,'utf8'),nl=s.indexOf('\n'),sh=s.startsWith('#!')?s.slice(0,nl+1):'',body=s.startsWith('#!')?s.slice(nl+1):s;fs.mkdirSync(path.dirname(dest),{recursive:true});fs.writeFileSync(dest,sh+stripTypeScriptTypes(body,{mode:'transform'}));}
          NODE
          node dist/tools/build_places_index.mjs
      - name: Run every gate and capture status
        run: |
          set +e
          out=reports/oslo-coordinate-control-batch-32/gate-diagnostic
          mkdir -p "$out"
          failed=0
          run_gate() {
            name="$1"; shift
            "$@" > "$out/$name.txt" 2>&1
            code=$?
            printf '%s=%s\n' "$name" "$code" | tee -a "$out/status.txt"
            if [ "$code" -ne 0 ]; then failed=1; fi
          }
          run_gate split-manifest-sync node dist/tools/audit-places-split-manifest-sync.mjs
          run_gate check-no-lng node dist/tools/check_no_lng_coordinates.mjs
          run_gate places-index-sync node dist/tools/check_places_index_sync.mjs
          run_gate coordinate-index-parity node tests/place-coordinate-index-parity.test.js
          run_gate coordinate-source-contract node tests/coordinate-source-contract-anchor-trust.test.mjs
          run_gate coordinate-quality node dist/tools/place-coordinate-quality-gate.mjs
          run_gate coordinate-intake node dist/tools/place-coordinate-intake-gate.mjs --strict-new
          run_gate coordinate-evidence node dist/tools/audit-coordinate-evidence.mjs
          git diff --check > "$out/git-diff-check.txt" 2>&1
          code=$?
          printf 'git-diff-check=%s\n' "$code" | tee -a "$out/status.txt"
          if [ "$code" -ne 0 ]; then failed=1; fi
          echo "$failed" > "$out/failed.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch-32-gate-diagnostic
          path: reports/oslo-coordinate-control-batch-32/gate-diagnostic
          if-no-files-found: error
