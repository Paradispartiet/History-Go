name: One-time run documentation phase 21 quiz physical visits

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-run-documentation-phase-21-quiz-physical-visits.yml

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-governance-phase-21-quiz-physical-visits
          fetch-depth: 0

      - name: Synchronize latest main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply documentation consolidation
        run: python scripts/one-time-documentation-phase-21.py

      - name: Remove temporary phase files
        shell: bash
        run: |
          rm -f .github/documentation-phase21-trigger
          rm -f .github/workflows/one-time-run-documentation-phase-21-quiz-physical-visits.yml
          rm -f scripts/one-time-documentation-phase-21.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and validate documentation governance
        shell: bash
        run: |
          npm run build:scripts
          node dist/scripts/check-documentation-governance.mjs

      - name: Validate quiz and physical visit separation
        shell: bash
        run: |
          node --test tests/quiz-physical-visit-separation.test.js
          npm run typecheck:web

      - name: Reset generated build output
        shell: bash
        run: |
          git restore --source=HEAD --worktree --staged -- dist 2>/dev/null || true
          git clean -fd -- dist

      - name: Verify archive, registry and final scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          archive = Path("reports/archive/2026-07/quiz-physical-visits/QUIZ_AND_PHYSICAL_VISIT_MODEL_PRE_CONSOLIDATION_2026-07-26.md")
          expected_hash = Path("/tmp/phase21-original.sha256").read_text(encoding="utf-8").strip()
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected_hash

          registry = json.loads(Path("docs/documentation_registry.json").read_text(encoding="utf-8"))
          entries = {entry["path"]: entry for entry in registry["documents"]}
          active = entries["docs/QUIZ_AND_PHYSICAL_VISIT_MODEL.md"]
          assert active["status"] == "operational"
          assert active["owns"] == ["quiz_physical_visit_runtime_guide"]
          historical = entries[str(archive)]
          assert historical["status"] == "historical"
          assert historical["superseded_by"] == [
              "docs/QUIZ_AND_PHYSICAL_VISIT_MODEL.md",
              "docs/COMPLETION_DEFINITIONS.md",
          ]

          tracked = set(subprocess.check_output(["git", "diff", "--name-only", "HEAD"]).decode().splitlines())
          untracked = set(subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"]).decode().splitlines())
          changed = tracked | untracked
          expected = {
              ".github/documentation-phase21-trigger",
              ".github/workflows/one-time-run-documentation-phase-21-quiz-physical-visits.yml",
              "scripts/one-time-documentation-phase-21.py",
              "docs/COMPLETION_DEFINITIONS.md",
              "docs/QUIZ_AND_PHYSICAL_VISIT_MODEL.md",
              "docs/README.md",
              "docs/documentation_registry.json",
              "reports/archive/2026-07/README.md",
              "reports/archive/2026-07/quiz-physical-visits/README.md",
              "reports/archive/2026-07/quiz-physical-visits/QUIZ_AND_PHYSICAL_VISIT_MODEL_PRE_CONSOLIDATION_2026-07-26.md",
              "reports/documentation-governance/inventory.json",
          }
          assert changed == expected, (changed, expected)
          PY

      - name: Commit final target branch
        shell: bash
        run: |
          git add -A
          git commit -m "Konsolider quiz og fysisk besøksdokumentasjon"
          git push origin HEAD:agent/documentation-governance-phase-21-quiz-physical-visits

      - name: Remove one-time files from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git switch -C main origin/main
          changed=0
          for path in \
            .github/workflows/one-time-run-documentation-phase-21-quiz-physical-visits.yml \
            scripts/one-time-documentation-phase-21.py; do
            if [ -f "$path" ]; then
              git rm "$path"
              changed=1
            fi
          done
          if [ "$changed" = "1" ]; then
            git commit -m "Fjern engangsrunner for dokumentasjonsfase 21"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              git pull --rebase origin main
            done
            exit 1
          fi

# Trigger phase 21 materialization.
