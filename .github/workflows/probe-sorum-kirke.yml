name: Probe Sørum Church source objects

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  probe:
    if: github.head_ref == 'agent/akershus-sorum-kirke-production'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch church geometry, address and site objects
        shell: bash
        run: |
          set -euo pipefail
          out='reports/akershus-coordinate-sorum-kirke-source-probe'
          mkdir -p "$out"

          curl --fail --location --retry 4 --retry-delay 3 \
            -A 'History-Go coordinate verification/1.0' \
            'https://api.openstreetmap.org/api/0.6/way/531229103/full' \
            | tee "$out/osm-way-531229103-full.xml" >/dev/null

          curl --fail --location --retry 4 --retry-delay 3 \
            -A 'History-Go coordinate verification/1.0' \
            'https://nominatim.openstreetmap.org/lookup?osm_ids=W531229103&format=jsonv2&addressdetails=1&extratags=1&namedetails=1&polygon_geojson=1' \
            | tee "$out/nominatim-sorum-kirke.json" >/dev/null

          curl --fail --location --retry 4 --retry-delay 3 \
            --get 'https://ws.geonorge.no/adresser/v1/sok' \
            --data-urlencode 'sok=Bingenvegen 23 Sørum' \
            --data-urlencode 'treffPerSide=20' \
            | tee "$out/geonorge-bingenvegen-23.json" >/dev/null

          curl --fail --location --retry 4 --retry-delay 3 \
            -A 'History-Go coordinate verification/1.0' \
            'https://api.openstreetmap.org/api/0.6/map?bbox=11.2315,60.0048,11.2375,60.0090' \
            | tee "$out/osm-sorum-church-site-bbox.xml" >/dev/null

          python - <<'PY' | tee "$out/source-summary.txt"
          import json
          import math
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path('reports/akershus-coordinate-sorum-kirke-source-probe')
          legacy = (59.9866, 11.2391)

          def hav(a, b):
              R = 6371000.0
              p1, p2 = map(math.radians, (a[0], b[0]))
              dp = math.radians(b[0] - a[0])
              dl = math.radians(b[1] - a[1])
              h = math.sin(dp/2)**2 + math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2 * R * math.asin(math.sqrt(h))

          root = ET.parse(out / 'osm-way-531229103-full.xml').getroot()
          nodes = {n.attrib['id']: (float(n.attrib['lat']), float(n.attrib['lon'])) for n in root.findall('node')}
          way = next(w for w in root.findall('way') if w.attrib['id'] == '531229103')
          pts = [nodes[nd.attrib['ref']] for nd in way.findall('nd') if nd.attrib['ref'] in nodes]
          tags = {t.attrib['k']: t.attrib['v'] for t in way.findall('tag')}
          ring = [(lon, lat) for lat, lon in pts]
          if ring[0] != ring[-1]: ring.append(ring[0])
          area2 = cx = cy = 0.0
          for (x1,y1),(x2,y2) in zip(ring,ring[1:]):
              cross=x1*y2-x2*y1; area2+=cross; cx+=(x1+x2)*cross; cy+=(y1+y2)*cross
          if abs(area2)<1e-15:
              lat=sum(p[0] for p in pts)/len(pts); lon=sum(p[1] for p in pts)/len(pts)
          else:
              lon=cx/(3*area2); lat=cy/(3*area2)
          print(f'church_centroid_lat={lat:.12f}')
          print(f'church_centroid_lon={lon:.12f}')
          print(f'node_count={len(pts)}')
          print(f'distance_from_legacy_m={hav(legacy,(lat,lon)):.1f}')
          print('tags='+json.dumps(tags,ensure_ascii=False,sort_keys=True))

          nom=json.loads((out/'nominatim-sorum-kirke.json').read_text())
          print('nominatim='+json.dumps(nom,ensure_ascii=False,sort_keys=True))

          geo=json.loads((out/'geonorge-bingenvegen-23.json').read_text())
          addresses=geo.get('adresser',[]) if isinstance(geo,dict) else []
          exact=[a for a in addresses if str(a.get('adressetekst','')).lower()=='bingenvegen 23']
          print(f'address_total={len(addresses)} exact={len(exact)}')
          for a in exact:
              p=a.get('representasjonspunkt') or {}; point=(float(p['lat']),float(p['lon']))
              print('ADDRESS '+json.dumps(a,ensure_ascii=False,sort_keys=True))
              print(f'address_distance_to_church_m={hav(point,(lat,lon)):.1f} address_distance_from_legacy_m={hav(legacy,point):.1f}')

          site=ET.parse(out/'osm-sorum-church-site-bbox.xml').getroot()
          tagged=[]
          for elem in list(site):
              etags={t.attrib['k']:t.attrib['v'] for t in elem.findall('tag')}
              hay=' '.join(str(v) for v in etags.values()).lower()
              if any(k in hay for k in ('sørum','sorum','valgkirke','kirke','church','minne','memorial','cemetery','grave')) or etags.get('landuse')=='cemetery':
                  tagged.append({'type':elem.tag,'id':elem.attrib.get('id'),'lat':elem.attrib.get('lat'),'lon':elem.attrib.get('lon'),'tags':etags})
          print('bbox_tagged='+json.dumps(tagged,ensure_ascii=False,sort_keys=True))
          PY

      - name: Remove probe workflow and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/probe-sorum-kirke.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/akershus-coordinate-sorum-kirke-source-probe .github/workflows/probe-sorum-kirke.yml
          git commit -m 'Persist Sørum Church coordinate source evidence'
          git push origin HEAD:${{ github.head_ref }}
