name: Temporary Maridalsvannet images and Knowledge sync
on:
  push:
    branches:
      - content/oslo-maridalsvannet-v1-20261021
    paths:
      - .github/workflows/temporary-maridalsvannet-image-knowledge-sync.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/oslo-maridalsvannet-v1-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fetch source-documented CC images
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 2 --fail --location --silent --show-error --user-agent 'HistoryGo educational photo curator (GitHub Actions)' \
            'https://upload.wikimedia.org/wikipedia/commons/6/69/Maridalsvannet%2C_Oslo.jpg' -o /tmp/maridals-portrait.jpg
          curl --retry 3 --retry-delay 2 --fail --location --silent --show-error --user-agent 'HistoryGo educational photo curator (GitHub Actions)' \
            'https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Maridalsvannet_i_Maridalen%2C_Oslo%2C_Norway_%282022.11.12%29.jpg/1280px-Maridalsvannet_i_Maridalen%2C_Oslo%2C_Norway_%282022.11.12%29.jpg' -o /tmp/maridals-landscape.jpg
          file /tmp/maridals-portrait.jpg /tmp/maridals-landscape.jpg
          test "$(wc -c </tmp/maridals-portrait.jpg)" -gt 30000
          test "$(wc -c </tmp/maridals-landscape.jpg)" -gt 30000
      - name: Encode independently reviewed 3:4 and wide WebP crops
        run: |
          set -euo pipefail
          python3 -c 'import PIL' || python3 -m pip install --user --break-system-packages Pillow
          mkdir -p bilder/places
          python3 - <<'PY'
          from PIL import Image,ImageOps
          for src,dst,size in [
              ('/tmp/maridals-portrait.jpg','bilder/places/maridalsvannet_front_portrait.webp',(600,800)),
              ('/tmp/maridals-landscape.jpg','bilder/places/maridalsvannet_landscape.webp',(1400,900))
          ]:
              with Image.open(src) as image:
                  image=ImageOps.exif_transpose(image).convert('RGB')
                  result=ImageOps.fit(image,size,method=Image.Resampling.LANCZOS,centering=(0.5,0.5))
                  result.save(dst,'WEBP',quality=86,method=6)
                  print(dst,result.size)
          PY
      - name: Rebuild v1 references and Knowledge
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node scripts/oneoff-maridalsvannet-image-knowledge-sync.mjs
          npm run places:index:build
          npm run place-open:build
          npm run knowledge:canonical:write
          node scripts/audit-place-images.mjs --mode=all --report=reports/place-image-audit.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='data/places/place_image_backlog_summary.json';
          const saved=JSON.parse(fs.readFileSync(file,'utf8'));
          const generated=JSON.parse(fs.readFileSync('reports/place-image-audit.json','utf8'));
          saved.summary={
            validLocal:generated.summary.local,
            validRemote:generated.summary.remote,
            optionalMissing:generated.summary.optional,
            missing:generated.summary.missing,
            invalidLocalPath:generated.summary.invalid,
            remaining:generated.summary.missing+generated.summary.invalid
          };
          const natur=generated.byCategory.natur;
          saved.byCategory.natur={...saved.byCategory.natur,valid:natur.local+natur.remote,optional:natur.optional,missing:natur.missing,invalid:natur.invalid};
          fs.writeFileSync(file,JSON.stringify(saved,null,2)+'\n');
          NODE
          npm run place-open:check
          npm run knowledge:canonical:check
          node scripts/audit-place-images.mjs --mode=all --verify-summary=data/places/place_image_backlog_summary.json
      - name: Save v1 outputs and remove temporary tooling
        run: |
          set -euo pipefail
          git rm -- scripts/oneoff-maridalsvannet-image-knowledge-sync.mjs .github/workflows/temporary-maridalsvannet-image-knowledge-sync.yml
          git add -u -- data/places data/runtime data/quiz data/knowledge reports
          git add -- bilder/places/maridalsvannet_front_portrait.webp bilder/places/maridalsvannet_landscape.webp reports/place-production/maridalsvannet-v1-image-qa-20261021.json
          git status --short | head -60
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(maridalsvannet): local CC WebP assets, Knowledge links and runtime parity'
          git pull --rebase origin content/oslo-maridalsvannet-v1-20261021
          git push origin HEAD:refs/heads/content/oslo-maridalsvannet-v1-20261021
