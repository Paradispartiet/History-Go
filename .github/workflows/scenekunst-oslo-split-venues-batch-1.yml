name: Oslo Scenekunst split venues batch 1

on:
  pull_request:
    branches:
      - agent/scenekunst-national-venues-03-rebased

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/scenekunst-oslo-split-venues-01-replay
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build five Oslo split venue packages
        id: venue_build
        shell: bash
        run: |
          set +e
          node tools/add-scenekunst-oslo-split-venues-batch-1.mjs > /tmp/scenekunst-oslo-split-batch-1.log 2>&1
          status=$?
          cat /tmp/scenekunst-oslo-split-batch-1.log
          if [ "$status" -ne 0 ]; then
            mkdir -p reports
            cp /tmp/scenekunst-oslo-split-batch-1.log reports/scenekunst-oslo-split-venues-batch-1-runner-error.log
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit diagnostic on builder failure
        if: steps.venue_build.outputs.failed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/scenekunst-oslo-split-venues-batch-1-runner-error.log
          git diff --cached --quiet || git commit -m "Record Oslo Scenekunst split batch failure"
          git push origin HEAD:agent/scenekunst-oslo-split-venues-01-replay
          exit 1

      - name: Build tools and regenerate global place index
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          npm run build:tools
          npm run places:index:build

      - name: Validate places and categories
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          bash scripts/check-places.sh
          npm run audit:categories

      - name: Mark report validated
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'reports/scenekunst-oslo-split-venues-batch-1-2026-07-23.json';
          const report = JSON.parse(fs.readFileSync(p, 'utf8'));
          report.status = 'validated';
          report.validatedAt = new Date().toISOString();
          report.validation.placesIndexBuild = 'pass';
          report.validation.placesChecks = 'pass';
          report.validation.categoryAudit = 'pass';
          fs.writeFileSync(p, JSON.stringify(report, null, 2) + '\n');
          NODE

      - name: Commit production result
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/places_index.json
          git add data/places/scenekunst/oslo/places_scenekunst.json
          git add data/places/scenekunst/oslo/places_scenekunst_index.json
          git add data/places/scenekunst/oslo/places_scenekunst_manifest.json
          git add data/places/scenekunst/oslo/places_scenekunst/teater_manu.json
          git add data/places/scenekunst/oslo/places_scenekunst/vega_scene.json
          git add data/places/scenekunst/oslo/places_scenekunst/rommen_scene.json
          git add data/places/scenekunst/oslo/places_scenekunst/salt_oslo.json
          git add data/places/scenekunst/oslo/places_scenekunst/det_andre_teatret_intimscenen.json
          git add reports/scenekunst-oslo-split-venues-batch-1-2026-07-23.json
          git add reports/scenekunst-oslo-split-venues-batch-1-2026-07-23.md
          git diff --cached --stat
          git diff --cached --quiet && { echo "No production changes produced"; exit 1; }
          git commit -m "Add first Oslo Scenekunst split venue batch"
          git push origin HEAD:agent/scenekunst-oslo-split-venues-01-replay
