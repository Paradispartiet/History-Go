name: Materialize Regjeringskvartalet phase 13

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/materialize-regjeringskvartalet-phase13.yml"
      - "scripts/run_regjeringskvartalet_phase13_content.py"
      - "scripts/materialize_regjeringskvartalet_phase13.py"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.number == 4674
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/regjeringskvartalet-phase-13-ui-audit
          fetch-depth: 0

      - name: Materialize report and phase tests
        run: python3 scripts/run_regjeringskvartalet_phase13_content.py

      - name: Commit content-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/place-production/regjeringskvartalet-politikk-v1.md tests/regjeringskvartalet-*-phase.test.mjs
          git commit -m "Materialiser Regjeringskvartalets fase 13-innhold"
          git push origin HEAD:agent/regjeringskvartalet-phase-13-ui-audit
