name: Clean Regjeringskvartalet phase 13 artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/materialize-regjeringskvartalet-phase13.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.number == 4674
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/regjeringskvartalet-phase-13-ui-audit
          fetch-depth: 0

      - name: Remove non-production bootstrap artifacts
        run: |
          rm -f .github/phase13-*.txt
          rm -f scripts/materialize_regjeringskvartalet_phase13.py
          rm -f scripts/run_regjeringskvartalet_phase13_content.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fjern midlertidige fase 13-artefakter"
          git push origin HEAD:agent/regjeringskvartalet-phase-13-ui-audit
