name: Etne People of Places batch 17 integration

on:
  pull_request:
    paths:
      - 'data/people/kunst/vestland/etne/people_skanevik_kultur_og_idrettshall_batch1.json'
      - 'tests/etne-people-of-places-batch17.test.js'
      - 'reports/etne-people-of-places-batch17/README.md'
      - '.github/workflows/etne-people-batch17-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 2344
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/etne-people-of-places-batch17
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          mkdir -p reports/etne-people-of-places-batch17
          npm install --no-audit --no-fund 2>&1 | tee reports/etne-people-of-places-batch17/npm-install.log

      - name: Register batch and regression gate exactly once
        run: |
          node <<'NODE' | tee reports/etne-people-of-places-batch17/integration-patch.log
          const fs = require('fs');

          const manifestPath = 'data/people/manifest.json';
          const sourceFile = 'people/kunst/vestland/etne/people_skanevik_kultur_og_idrettshall_batch1.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.files = manifest.files.filter((candidate) => candidate !== sourceFile);
          manifest.files.push(sourceFile);
          if (manifest.files.filter((candidate) => candidate === sourceFile).length !== 1) {
            throw new Error('Batch 17 source is not registered exactly once');
          }
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);

          const scriptPath = 'scripts/check-people.sh';
          let script = fs.readFileSync(scriptPath, 'utf8');
          script = script.replace(/\necho "== Etne People of Places batch 17 =="\nnode tests\/etne-people-of-places-batch17\.test\.js\n/g, '\n');
          const marker = 'echo "== People check complete =="';
          const block = 'echo "== Etne People of Places batch 17 =="\nnode tests/etne-people-of-places-batch17.test.js\n\n';
          if (!script.includes(marker)) throw new Error('People check completion marker not found');
          script = script.replace(marker, `${block}${marker}`);
          if ((script.match(/etne-people-of-places-batch17\.test\.js/g) || []).length !== 1) {
            throw new Error('Batch 17 regression gate is not wired exactly once');
          }
          fs.writeFileSync(scriptPath, script);

          console.log(`PASS manifest registration: ${sourceFile}`);
          console.log('PASS batch 17 regression gate wired exactly once');
          NODE

      - name: Run batch 17 regression test
        run: node tests/etne-people-of-places-batch17.test.js 2>&1 | tee reports/etne-people-of-places-batch17/batch17-test.log

      - name: Run full people checks
        run: bash scripts/check-people.sh 2>&1 | tee reports/etne-people-of-places-batch17/check-people.log

      - name: Audit Etne coverage after batch 17
        run: |
          node <<'NODE' | tee reports/etne-people-of-places-batch17/coverage.json
          const fs = require('fs');
          const path = require('path');
          const places = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const etnePlaces = places.filter((place) => String(place.kommune || '').toLowerCase() === 'etne');
          const etneIds = new Set(etnePlaces.map((place) => place.id));
          const manifest = JSON.parse(fs.readFileSync('data/people/manifest.json', 'utf8'));
          const covered = new Set();
          const targetLinks = [];
          for (const rel of manifest.files) {
            const doc = JSON.parse(fs.readFileSync(path.join('data', rel), 'utf8'));
            const people = Array.isArray(doc) ? doc : [doc];
            for (const person of people) {
              const links = new Set([person.placeId, ...(person.places || [])].filter(Boolean));
              for (const id of links) if (etneIds.has(id)) covered.add(id);
              if (links.has('skanevik_kultur_og_idrettshall')) {
                targetLinks.push({ id: person.id, name: person.name, file: rel });
              }
            }
          }
          const uncovered = etnePlaces.map((place) => place.id).filter((id) => !covered.has(id)).sort();
          const report = {
            status: 'PASS',
            activeEtnePlaces: etnePlaces.length,
            coveredEtnePlaces: covered.size,
            uncoveredEtnePlaces: uncovered.length,
            target: 'skanevik_kultur_og_idrettshall',
            targetLinks,
            uncovered
          };
          if (targetLinks.length !== 2) throw new Error(`Expected 2 hall links, got ${targetLinks.length}`);
          const targetIds = targetLinks.map((entry) => entry.id).sort();
          const expectedIds = ['jan_henning_jespersen', 'leif_jonny_johansen'].sort();
          if (JSON.stringify(targetIds) !== JSON.stringify(expectedIds)) {
            throw new Error(`Unexpected hall links: ${JSON.stringify(targetLinks)}`);
          }
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Run typecheck
        run: npm run typecheck 2>&1 | tee reports/etne-people-of-places-batch17/typecheck.log

      - name: Run tools check against known main story baseline
        run: |
          set +e
          npm run tools:check 2>&1 | tee reports/etne-people-of-places-batch17/tools-check.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "tools:check passed fully" | tee reports/etne-people-of-places-batch17/tools-check-baseline.log
            exit 0
          fi

          node <<'NODE' | tee reports/etne-people-of-places-batch17/tools-check-baseline.log
          const fs = require('fs');
          const log = fs.readFileSync('reports/etne-people-of-places-batch17/tools-check.log', 'utf8');
          const actual = log.split(/\r?\n/).filter((line) => line.startsWith('- Ugyldig place_id:'));
          const expected = [
            '- Ugyldig place_id: story=st_regjeringskvartalet_terror_2011 field=related_places[0] place_id=utoya file=data/stories/stories_regjeringskvartalet.json',
            '- Ugyldig place_id: story=st_mollergata_19_petter_moens_dagbok field=related_places[1] place_id=norges_hjemmefrontmuseum file=data/stories/stories_mollergata_19.json',
            '- Ugyldig place_id: story=st_mollergata_19_petter_moens_dagbok field=next_scenes[0].place_id place_id=norges_hjemmefrontmuseum file=data/stories/stories_mollergata_19.json',
            '- Ugyldig place_id: story=st_folketeateret_kino_teater_opera_musikal field=related_places[1] place_id=operaen file=data/stories/stories_folketeateret.json',
            '- Ugyldig place_id: story=st_folketeateret_kino_teater_opera_musikal field=next_scenes[0].place_id place_id=operaen file=data/stories/stories_folketeateret.json'
          ];
          if (!log.includes('Stories integrity FAILED')) {
            throw new Error('tools:check failed before or outside the known stories baseline');
          }
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`tools:check story baseline changed: ${JSON.stringify(actual, null, 2)}`);
          }
          console.log('PASS: tools:check reached check:stories and stopped only on the five known main-branch invalid place references.');
          NODE

      - name: Run diff whitespace check
        run: git diff --check | tee reports/etne-people-of-places-batch17/git-diff-check.log

      - name: Remove temporary workflow and commit integration
        run: |
          node -e "const fs=require('fs'); const p='reports/etne-people-of-places-batch17/typecheck.log'; fs.writeFileSync(p, fs.readFileSync(p, 'utf8').replace(/\\n+$/, '\\n'));"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/etne-people-batch17-integration.yml
          git add data/people/manifest.json scripts/check-people.sh reports/etne-people-of-places-batch17
          git diff --cached --check
          git commit -m "Integrate Etne People of Places batch 17"
          git push origin HEAD:agent/etne-people-of-places-batch17
