name: Civication Wave F focused diagnostic (temporary)

on:
  push:
    branches:
      - civication/wave-f-eight-stories-20261019

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Emit compact canonical readiness delta
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const files = ['data/Civication/lifePositionRoleWorldReadiness.json', 'reports/civication-life-position-role-world-readiness.md'];
          const before = JSON.parse(fs.readFileSync(files[0], 'utf8'));
          cp.execFileSync(process.execPath, ['scripts/audit-civication-life-position-role-world-readiness.mjs', '--write'], {stdio:'pipe', timeout:120000});
          const after = JSON.parse(fs.readFileSync(files[0], 'utf8'));
          const afterReport = fs.readFileSync(files[1], 'utf8');
          const eq = (a,b) => JSON.stringify(a) === JSON.stringify(b);
          function changed(a,b) {
            if (eq(a,b)) return undefined;
            if (!a || !b || Array.isArray(a) || Array.isArray(b) || typeof a !== 'object' || typeof b !== 'object') return b;
            const out = {};
            for (const k of Object.keys(b)) { const v = changed(a[k], b[k]); if (v !== undefined) out[k] = v; }
            return out;
          }
          const patch = changed({...before,positions:[]}, {...after,positions:[]}) || {};
          patch.positions = after.positions.flatMap((row, i) => {
            const delta = changed(before.positions[i], row);
            return delta === undefined ? [] : [{key:row.key,delta}];
          });
          const txt = JSON.stringify({patch,report:afterReport,position_count:after.positions.length});
          const n = Math.ceil(txt.length / 6000);
          for (let i = 0; i < n; i++) console.log('WAVEF_DELTA_'+String(i+1).padStart(2,'0')+'_'+String(n).padStart(2,'0')+'='+txt.slice(i*6000,(i+1)*6000));
          console.log('WAVEF_DELTA_SUMMARY='+JSON.stringify({changes:patch.positions.length,chars:txt.length,parts:n}));
          NODE
      - name: Diagnose person history without hiding failure
        run: |
          set +e
          node tests/civication-lifestory-person-types.test.js > /tmp/wavef-person-test.log 2>&1
          status=$?
          echo "WAVEF_PERSON_TEST_EXIT=$status"
          tail -60 /tmp/wavef-person-test.log
          exit 0
