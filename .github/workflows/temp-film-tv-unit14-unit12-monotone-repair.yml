name: TEMP repair Film TV unit 12 monotone gate

on:
  push:
    branches:
      - agent/film-tv-unit14-archive-preservation-access-authenticity-source-brief
    paths:
      - ".trigger/unit14-unit12-monotone-repair"

permissions:
  contents: write

concurrency:
  group: temp-film-tv-unit14-unit12-monotone-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-tv-unit14-archive-preservation-access-authenticity-source-brief
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Extend complete unit 12 monotone contract through unit 14
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const archiveSource = "const ARCHIVE_PRESERVATION_SOURCE_GATE = 'archive_preservation_access_authenticity_source_brief_complete_full_chapter_production';";
          const archiveFulltext = "const ARCHIVE_PRESERVATION_FULLTEXT_GATE = 'archive_preservation_access_authenticity_full_chapter_complete_next_unit_source_brief';";

          {
            const file = 'scripts/brief-film-tv-screen-places-identity-circulation-sources-v1.mjs';
            let source = fs.readFileSync(file, 'utf8');
            const anchor = "const UNIT13_FULLTEXT_GATE = 'location_production_place_ethics_full_chapter_complete_next_unit_source_brief';\nconst UNIT_TWELVE_OR_LATER_GATES = new Set([OUTPUT_GATE, FULLTEXT_GATE, UNIT13_SOURCE_BRIEF_GATE, UNIT13_FULLTEXT_GATE]);\nconst UNIT_TWELVE_POST_BRIEF_GATES = new Set([FULLTEXT_GATE, UNIT13_SOURCE_BRIEF_GATE, UNIT13_FULLTEXT_GATE]);";
            if (!source.includes(anchor)) throw new Error('unit12 source: gate anchor missing');
            source = source.replace(anchor, `const UNIT13_FULLTEXT_GATE = 'location_production_place_ethics_full_chapter_complete_next_unit_source_brief';\n${archiveSource}\n${archiveFulltext}\nconst UNIT_TWELVE_OR_LATER_GATES = new Set([OUTPUT_GATE, FULLTEXT_GATE, UNIT13_SOURCE_BRIEF_GATE, UNIT13_FULLTEXT_GATE, ARCHIVE_PRESERVATION_SOURCE_GATE, ARCHIVE_PRESERVATION_FULLTEXT_GATE]);\nconst UNIT_TWELVE_POST_BRIEF_GATES = new Set([FULLTEXT_GATE, UNIT13_SOURCE_BRIEF_GATE, UNIT13_FULLTEXT_GATE, ARCHIVE_PRESERVATION_SOURCE_GATE, ARCHIVE_PRESERVATION_FULLTEXT_GATE]);`);
            fs.writeFileSync(file, source);
          }

          {
            const file = 'scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs';
            let source = fs.readFileSync(file, 'utf8');
            const gateAnchor = "const UNIT13_FULLTEXT_GATE = 'location_production_place_ethics_full_chapter_complete_next_unit_source_brief';";
            if (!source.includes(gateAnchor)) throw new Error('unit12 materializer: gate anchor missing');
            source = source.replace(gateAnchor, `${gateAnchor}\n${archiveSource}\n${archiveFulltext}`);
            const noteAnchor = 'if (![UNIT13_SOURCE_BRIEF_GATE, UNIT13_FULLTEXT_GATE].includes(registryFilmStatus?.nextGate)) {';
            if (!source.includes(noteAnchor)) throw new Error('unit12 materializer: registry note guard missing');
            source = source.replace(noteAnchor, 'if (![UNIT13_SOURCE_BRIEF_GATE, UNIT13_FULLTEXT_GATE, ARCHIVE_PRESERVATION_SOURCE_GATE, ARCHIVE_PRESERVATION_FULLTEXT_GATE].includes(registryFilmStatus?.nextGate)) {');
            fs.writeFileSync(file, source);
          }

          {
            const file = 'scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs';
            let source = fs.readFileSync(file, 'utf8');
            const anchor = "const UNIT13_FULLTEXT_GATE = 'location_production_place_ethics_full_chapter_complete_next_unit_source_brief';\nconst UNIT_TWELVE_FULLTEXT_OR_LATER_GATES = new Set([OUTPUT_GATE, UNIT13_SOURCE_BRIEF_GATE, UNIT13_FULLTEXT_GATE]);";
            if (!source.includes(anchor)) throw new Error('unit12 audit: gate anchor missing');
            source = source.replace(anchor, `const UNIT13_FULLTEXT_GATE = 'location_production_place_ethics_full_chapter_complete_next_unit_source_brief';\n${archiveSource}\n${archiveFulltext}\nconst UNIT_TWELVE_FULLTEXT_OR_LATER_GATES = new Set([OUTPUT_GATE, UNIT13_SOURCE_BRIEF_GATE, UNIT13_FULLTEXT_GATE, ARCHIVE_PRESERVATION_SOURCE_GATE, ARCHIVE_PRESERVATION_FULLTEXT_GATE]);`);
            fs.writeFileSync(file, source);
          }

          {
            const file = 'tests/film-tv-screen-places-identity-circulation-fulltext-v1.test.mjs';
            let source = fs.readFileSync(file, 'utf8');
            const anchor = "    'location_production_place_ethics_full_chapter_complete_next_unit_source_brief'\n  ].includes(film.nextGate), true);";
            if (!source.includes(anchor)) throw new Error('unit12 fulltext test: later gate assertion anchor missing');
            source = source.replace(anchor, "    'location_production_place_ethics_full_chapter_complete_next_unit_source_brief',\n    'archive_preservation_access_authenticity_source_brief_complete_full_chapter_production',\n    'archive_preservation_access_authenticity_full_chapter_complete_next_unit_source_brief'\n  ].includes(film.nextGate), true);");
            fs.writeFileSync(file, source);
          }
          EOF
          node --check scripts/brief-film-tv-screen-places-identity-circulation-sources-v1.mjs
          node --check scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
          node --check scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
          node --check tests/film-tv-screen-places-identity-circulation-fulltext-v1.test.mjs

      - name: Set synthetic unit 14 state
        run: |
          cp data/fagverk/subject_status.json /tmp/subject_status.json
          cp data/fagverk/fagverk_registry.json /tmp/fagverk_registry.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const statusFile = 'data/fagverk/subject_status.json';
          const registryFile = 'data/fagverk/fagverk_registry.json';
          const status = JSON.parse(fs.readFileSync(statusFile, 'utf8'));
          const registry = JSON.parse(fs.readFileSync(registryFile, 'utf8'));
          const film = status.subjects.find((row) => row.id === 'film_tv');
          if (!film) throw new Error('Film & TV status missing');
          film.nextGate = 'archive_preservation_access_authenticity_source_brief_complete_full_chapter_production';
          film.note = 'synthetic unit 14 state for unit12 monotone regression';
          registry.subjects.film_tv.canonicalModel.fourteenthSourceClaimBrief = 'data/fag/TV_og_Film/film_tv_archive_preservation_access_authenticity_source_claim_brief_v1.json';
          registry.subjects.film_tv.canonicalModel.note = 'synthetic unit 14 registry note for unit12 monotone regression';
          fs.writeFileSync(statusFile, `${JSON.stringify(status, null, 2)}\n`);
          fs.writeFileSync(registryFile, `${JSON.stringify(registry, null, 2)}\n`);
          EOF

      - name: Validate unit 12 source brief under unit 14 gate
        run: node scripts/brief-film-tv-screen-places-identity-circulation-sources-v1.mjs

      - name: Validate unit 12 fulltext audit under unit 14 gate
        run: node scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs

      - name: Validate unit 12 source tests under unit 14 gate
        run: node --test tests/film-tv-screen-places-identity-circulation-source-brief-v1.test.mjs

      - name: Validate unit 12 fulltext tests under unit 14 gate
        run: node --test tests/film-tv-screen-places-identity-circulation-fulltext-v1.test.mjs

      - name: Restore persisted state
        if: always()
        run: |
          if [ -f /tmp/subject_status.json ]; then mv /tmp/subject_status.json data/fagverk/subject_status.json; fi
          if [ -f /tmp/fagverk_registry.json ]; then mv /tmp/fagverk_registry.json data/fagverk/fagverk_registry.json; fi

      - name: Commit focused unit 12 repair
        run: |
          rm -f .trigger/unit14-unit12-monotone-repair
          rm -f .github/workflows/temp-film-tv-unit14-unit12-monotone-repair.yml
          git add scripts/brief-film-tv-screen-places-identity-circulation-sources-v1.mjs \
                  scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs \
                  scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs \
                  tests/film-tv-screen-places-identity-circulation-fulltext-v1.test.mjs \
                  .trigger/unit14-unit12-monotone-repair \
                  .github/workflows/temp-film-tv-unit14-unit12-monotone-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Allow Film TV unit 12 regression through unit 14"
          git push origin HEAD:agent/film-tv-unit14-archive-preservation-access-authenticity-source-brief
