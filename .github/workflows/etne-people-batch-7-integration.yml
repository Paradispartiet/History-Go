name: Etne People of Places batch 7 integration

on:
  pull_request:
    paths:
      - 'data/people/kunst/vestland/etne/fugl_fonix/**'
      - 'reports/etne-people-of-places-batch-7-research.md'
      - '.github/workflows/etne-people-batch-7-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.number == 2278
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-people-batch-7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          mkdir -p reports/etne-people-of-places-batch-7-integration
          npm install --no-audit --no-fund 2>&1 | tee reports/etne-people-of-places-batch-7-integration/npm-install.txt
      - name: Register batch and patch existing Stig Morten Sørheim
        run: |
          node --input-type=module <<'NODE' | tee reports/etne-people-of-places-batch-7-integration/integration-patch.txt
          import fs from 'node:fs';
          const manifestPath='data/people/manifest.json';
          const addition='people/kunst/vestland/etne/fugl_fonix/people_fugl_fonix_batch1.json';
          const stigPath='data/people/musikk/vestland/etne/abc_studio/stig_morten_sorheim.json';
          const manifest=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          manifest.files=manifest.files.filter((v)=>v!==addition);manifest.files.push(addition);
          if(manifest.files.filter((v)=>v===addition).length!==1)throw new Error('Fugl Fønix batch manifest registration failed');
          fs.writeFileSync(manifestPath,JSON.stringify(manifest,null,2)+'\n');
          const doc=JSON.parse(fs.readFileSync(stigPath,'utf8'));
          const rows=doc.filter((p)=>p?.id==='stig_morten_sorheim');
          if(rows.length!==1)throw new Error(`Expected one Stig record, got ${rows.length}`);
          const stig=rows[0];
          if(stig.placeId!=='abc_studio_etne')throw new Error(`Unexpected Stig primary place ${stig.placeId}`);
          stig.places=Array.isArray(stig.places)?stig.places.filter((id)=>id!=='fugl_fonix_etne'):[];
          stig.places.push('fugl_fonix_etne');
          const urls=new Set(Array.isArray(stig.source_urls)?stig.source_urls:[]);
          urls.add('https://www.aftenbladet.no/lokalt/i/ymB4a/friends-i-etne');
          urls.add('https://www.bt.no/kultur/i/oKn1W/norges-hippeste-hotell');
          stig.source_urls=[...urls];
          stig.popupDesc='Stig Morten Sørheim er direkte knyttet til ABC Studio som en av personene bak oppbyggingen av lydmiljøet i Etne. Han var også del av den dokumenterte seks-personerskjernen som utviklet Fugl Fønix i de tidlige årene, der han bidro som lydmann og økonomiansvarlig i kultur- og arrangementsmiljøet. ABC Studio forblir hans primære placeId, mens Fugl Fønix er et tillegg som dokumenterer den separate fysiske arbeidskoblingen.';
          stig.verifiedAt='2026-07-18';
          fs.writeFileSync(stigPath,JSON.stringify(doc,null,2)+'\n');
          console.log('PASS Fugl Fønix batch registered exactly once');
          console.log('PASS existing Stig record patched in place');
          console.log('PASS Stig primary place preserved: abc_studio_etne');
          NODE
      - name: Run people checks
        run: bash scripts/check-people.sh 2>&1 | tee reports/etne-people-of-places-batch-7-integration/check-people.txt
      - name: Run People of Places audit
        run: npm run audit:people-of-places 2>&1 | tee reports/etne-people-of-places-batch-7-integration/people-of-places-audit.txt
      - name: Validate targets and canonical uniqueness
        run: |
          node --input-type=module <<'NODE' | tee reports/etne-people-of-places-batch-7-integration/targeted-validation.json
          import fs from 'node:fs';import path from 'node:path';
          const newIds=['audun_stene','jan_terje_rafdal','vidar_lund','asbjorn_moe','carina_vevang'];
          const manifest=JSON.parse(fs.readFileSync('data/people/manifest.json','utf8'));const all=[];
          for(const rel of manifest.files){const doc=JSON.parse(fs.readFileSync(path.join('data',rel),'utf8'));const rows=Array.isArray(doc)?doc:Array.isArray(doc?.people)?doc.people:[];for(const person of rows)all.push({person,file:rel});}
          const counts=new Map();for(const {person} of all)if(person?.id)counts.set(person.id,(counts.get(person.id)||0)+1);const dup=[...counts.entries()].filter(([,c])=>c>1);if(dup.length)throw new Error(`duplicates ${JSON.stringify(dup)}`);
          const places=new Set(JSON.parse(fs.readFileSync('data/places/places_index.json','utf8')).map((p)=>p.id));for(const id of ['fugl_fonix_etne','abc_studio_etne'])if(!places.has(id))throw new Error(`target inactive ${id}`);
          const results=[];for(const id of newIds){const rows=all.filter(({person})=>person?.id===id);if(rows.length!==1)throw new Error(`${id}: rows ${rows.length}`);const p=rows[0].person;if(p.placeId!=='fugl_fonix_etne'||(p.places||[]).filter((x)=>x==='fugl_fonix_etne').length!==1)throw new Error(`${id}: Fugl Fønix mismatch`);results.push({id,canonicalRows:1,placeId:p.placeId});}
          const stigs=all.filter(({person})=>person?.id==='stig_morten_sorheim');if(stigs.length!==1)throw new Error(`Stig rows ${stigs.length}`);const stig=stigs[0].person;if(stig.placeId!=='abc_studio_etne')throw new Error('Stig primary place changed');if((stig.places||[]).filter((x)=>x==='fugl_fonix_etne').length!==1)throw new Error('Stig Fugl Fønix link mismatch');
          console.log(JSON.stringify({status:'PASS',totalPeople:all.length,uniquePeopleIds:counts.size,duplicatePeopleIds:0,newPeople:results,existingPersonUpdate:{id:'stig_morten_sorheim',canonicalRows:1,primaryPlaceIdPreserved:stig.placeId,fuglFonixLinkCount:1}},null,2));
          NODE
      - name: Diff check
        run: git diff --check | tee reports/etne-people-of-places-batch-7-integration/git-diff-check.txt
      - name: Remove workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/etne-people-batch-7-integration.yml
          git add data/people/manifest.json data/people/musikk/vestland/etne/abc_studio/stig_morten_sorheim.json reports/etne-people-of-places-batch-7-integration
          git diff --cached --check
          git commit -m "Integrate Etne People of Places batch 7"
          git push origin HEAD:agent/etne-people-batch-7
