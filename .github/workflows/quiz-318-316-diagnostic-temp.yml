name: Materialize Fagverk release manifest sync

on:
  push:
    branches:
      - agent/quiz-318-316-diagnostic-20260912
    paths:
      - ".github/workflows/quiz-318-316-diagnostic-temp.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fagverk-release-manifest-sync-20260912
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize canonical release state
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/materialize-natur-final-registry.mjs
          node scripts/materialize-natur-final-registry.mjs
          node --check scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              data/fagverk/fagverk_registry.json|data/fagverk/subject_status.json|data/fagverk/fagverk_release.json) ;;
              *) echo "Unexpected generated path: $path" >&2; exit 1 ;;
            esac
          done
          echo "Generated paths:"
          printf '%s\n' "${changed[@]}"
          git diff --numstat
          git diff --check

      - name: Verify official release contract
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/fagverk-release-manifest.test.mjs
          node scripts/build-fagverk-release-manifest.mjs --check

      - name: Commit and push generated repair only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk/fagverk_registry.json data/fagverk/subject_status.json data/fagverk/fagverk_release.json
          test -n "$(git diff --cached --name-only)"
          git commit -m "Sync Fagverk release manifest"
          git push origin HEAD:agent/fagverk-release-manifest-sync-20260912
          echo "REPAIR_HEAD=$(git rev-parse HEAD)"
