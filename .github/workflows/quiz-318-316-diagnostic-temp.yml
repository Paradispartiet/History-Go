name: Materialize Tollpakkhuset quiz context repair

on:
  push:
    branches:
      - agent/quiz-318-316-diagnostic-20260912
    paths:
      - ".github/workflows/quiz-318-316-diagnostic-temp.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/tollpakkhuset-quiz-context-sync-20260912
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply exact deterministic Tollpakkhuset context repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('data/quiz/production_context/naeringsliv/tollpakkhuset.json')
          s = p.read_text()
          old_bytes = '"selection_bytes": 1097'
          new_bytes = '"selection_bytes": 1521'
          old_hash = '"selection_sha256": "1917ac8319d23a71e71b0b0255b7a669d431a79171291bb6ff8d066923ad5d0f"'
          new_hash = '"selection_sha256": "b67c6827822642a6df534f5c93c6a48e05b99ce6380d72da39a266d8f6962e95"'
          assert s.count(old_bytes) == 1, f'expected one old selection_bytes, got {s.count(old_bytes)}'
          assert s.count(old_hash) == 1, f'expected one old selection hash, got {s.count(old_hash)}'
          s = s.replace(old_bytes, new_bytes).replace(old_hash, new_hash)
          p.write_text(s)
          PY
          test "$(git diff --name-only)" = "data/quiz/production_context/naeringsliv/tollpakkhuset.json"
          git diff --check
          git diff --stat
          git diff -- data/quiz/production_context/naeringsliv/tollpakkhuset.json
          additions=$(git diff --numstat | awk '{s+=$1} END{print s+0}')
          deletions=$(git diff --numstat | awk '{s+=$2} END{print s+0}')
          test "$additions" -eq 2
          test "$deletions" -eq 2

      - name: Verify complete quiz governance chain
        run: |
          set -euo pipefail
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-templates
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run test:quiz-content-audit
          npm run test:quiz-production

      - name: Commit and push one-file repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz/production_context/naeringsliv/tollpakkhuset.json
          test "$(git diff --cached --name-only)" = "data/quiz/production_context/naeringsliv/tollpakkhuset.json"
          git commit -m "Sync Tollpakkhuset quiz context with places index"
          git push origin HEAD:agent/tollpakkhuset-quiz-context-sync-20260912
          echo "REPAIR_HEAD=$(git rev-parse HEAD)"
