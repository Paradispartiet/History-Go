name: Diagnose Fagverk release manifest sync

on:
  push:
    branches:
      - agent/quiz-318-316-diagnostic-20260912
    paths:
      - ".github/workflows/quiz-318-316-diagnostic-temp.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fagverk-release-manifest-sync-20260912
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Reproduce canonical release materialization
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/materialize-natur-final-registry.mjs
          node scripts/materialize-natur-final-registry.mjs
          node --check scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs
          echo "=== GENERATED PATHS ==="
          git status --short
          echo "=== NAME ONLY ==="
          git diff --name-only
          echo "=== NUMSTAT ==="
          git diff --numstat
          echo "=== RELEASE DIFF ==="
          git diff -- data/fagverk/fagverk_release.json
          echo "=== REGISTRY DIFF ==="
          git diff -- data/fagverk/fagverk_registry.json
          echo "=== SUBJECT STATUS DIFF ==="
          git diff -- data/fagverk/subject_status.json

      - name: Verify generated state against release contract
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/fagverk-release-manifest.test.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
