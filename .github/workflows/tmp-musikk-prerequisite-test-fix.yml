name: Temporary music prerequisite test correction

on:
  push:
    branches:
      - agent/civication-fwg-blaa-place-20260930

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/civication-fwg-blaa-place-20260930
          fetch-depth: 0

      - name: Align prerequisite test with workplace and History Go semantics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'tests/civication-musikk-utoving-og-ensemble-prerequisites.test.js';
          const source = fs.readFileSync(file, 'utf8');
          const from = "assert.equal(k.place_id,'blaa');assert.equal(k.task_payload.person_id,'bugge_wesseltoft');";
          const to = "assert.equal(k.place_id,'partitur_arrangement_og_versjonsflate');assert.ok(k.task_contract.evidence_refs.some(r=>r.endsWith('/blaa.json')));assert.equal(k.task_payload.person_id,'bugge_wesseltoft');";
          const matches = source.split(from).length - 1;
          if (matches !== 1) throw new Error(`Expected exactly one stale workplace assertion, found ${matches}`);
          fs.writeFileSync(file, source.replace(from, to));
          NODE
          node tests/civication-musikk-utoving-og-ensemble-prerequisites.test.js
          git diff --check

      - name: Commit corrected contract test
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/civication-musikk-utoving-og-ensemble-prerequisites.test.js
          git commit -m 'test: separate music workplace from History Go evidence'
          git push origin HEAD:agent/civication-fwg-blaa-place-20260930
