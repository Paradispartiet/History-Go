name: Wave F generated audit snapshot
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/civication-wave-f-audit-snapshot.yml
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate all three affected canonical Civication audits
        run: |
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-life-position-role-world-readiness.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Print exact generated artifacts
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          for (const path of [
            'data/Civication/careerGameplayMatrix.json',
            'reports/civication-career-gameplay-matrix.md',
            'data/Civication/lifePositionRoleWorldReadiness.json',
            'reports/civication-life-position-role-world-readiness.md',
            'data/Civication/roleWorldRolloutReadiness.json',
            'reports/civication-role-world-rollout-readiness.md'
          ]) {
            const str=fs.readFileSync(path,'utf8');
            for(let index=0;index<str.length;index+=2500)
              console.log('HGOUT '+JSON.stringify({path,index,chunk:str.slice(index,index+2500)}));
            console.log('HGEND '+JSON.stringify({path,chars:str.length}));
          }
          NODE
