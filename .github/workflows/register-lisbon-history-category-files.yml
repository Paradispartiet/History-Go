name: Split Lisbon history categories

on:
  push:
    branches:
      - main
    paths:
      - .github/lisbon-history-category-split-trigger.txt

permissions:
  contents: write

concurrency:
  group: split-lisbon-history-categories
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Split category mismatches and reconcile split manifest
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          source_path = Path('data/places/historie/europe/portugal/lisbon/places_lisbon_historie.json')
          split_manifest_path = Path('data/places/historie/europe/portugal/lisbon/places_lisbon_historie_manifest.json')
          split_dir = Path('data/places/historie/europe/portugal/lisbon/places_lisbon_historie')
          manifest_path = Path('data/places/manifest.json')
          anchor = 'places/historie/europe/portugal/lisbon/places_lisbon_historie.json'

          original_ids = [
              'lisbon_torre_de_belem',
              'lisbon_mosteiro_dos_jeronimos',
              'lisbon_castelo_de_sao_jorge',
              'lisbon_aqueduto_das_aguas_livres',
              'lisbon_se_de_lisboa',
              'lisbon_convento_do_carmo',
              'lisbon_padrao_dos_descobrimentos',
              'lisbon_estacao_do_rossio',
              'lisbon_teatro_romano',
              'lisbon_panteao_nacional',
              'lisbon_sao_vicente_de_fora',
              'lisbon_palacio_ajuda',
              'lisbon_palacio_fronteira',
              'lisbon_museu_de_lisboa',
              'lisbon_igreja_de_santo_antonio',
              'lisbon_igreja_de_sao_roque',
              'lisbon_museu_do_aljube',
              'lisbon_igreja_de_sao_domingos',
              'lisbon_museu_de_marinha',
              'lisbon_museu_nacional_dos_coches',
          ]

          moves = [
              (
                  'lisbon_aqueduto_das_aguas_livres',
                  'by',
                  Path('data/places/by/europe/portugal/lisbon/lisbon_aqueduto_das_aguas_livres.json'),
                  'places/by/europe/portugal/lisbon/lisbon_aqueduto_das_aguas_livres.json',
              ),
              (
                  'lisbon_estacao_do_rossio',
                  'by',
                  Path('data/places/by/europe/portugal/lisbon/lisbon_estacao_do_rossio.json'),
                  'places/by/europe/portugal/lisbon/lisbon_estacao_do_rossio.json',
              ),
              (
                  'lisbon_palacio_ajuda',
                  'politikk',
                  Path('data/places/politikk/europe/portugal/lisbon/lisbon_palacio_ajuda.json'),
                  'places/politikk/europe/portugal/lisbon/lisbon_palacio_ajuda.json',
              ),
          ]
          move_ids = {item[0] for item in moves}
          retained_ids = [place_id for place_id in original_ids if place_id not in move_ids]

          payload = json.loads(source_path.read_text(encoding='utf-8'))
          if not isinstance(payload, list):
              raise SystemExit('Lisbon history source must be a JSON array')
          actual_ids = [place.get('id') for place in payload]
          if actual_ids != original_ids:
              raise SystemExit(f'Unexpected Lisbon history IDs/order: {actual_ids}')
          if any(place.get('category') != 'historie' for place in payload):
              raise SystemExit('Every Lisbon source entry must start in historie')

          by_id = {place['id']: place for place in payload}
          for place_id, category, destination, _ in moves:
              if destination.exists():
                  raise SystemExit(f'Destination already exists: {destination}')
              original = by_id[place_id]
              moved = dict(original)
              moved['category'] = category
              if {k: v for k, v in moved.items() if k != 'category'} != {
                  k: v for k, v in original.items() if k != 'category'
              }:
                  raise SystemExit(f'Non-category content changed for {place_id}')
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(
                  json.dumps([moved], ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )

          retained = [place for place in payload if place['id'] not in move_ids]
          if [place['id'] for place in retained] != retained_ids:
              raise SystemExit('Retained Lisbon IDs/order changed')
          if any(place.get('category') != 'historie' for place in retained):
              raise SystemExit('Retained Lisbon entries must remain historie')

          source_text = json.dumps(retained, ensure_ascii=False, indent=2) + '\n'
          source_path.write_text(source_text, encoding='utf-8')
          source_sha256 = hashlib.sha256(source_text.encode('utf-8')).hexdigest()

          old_split_manifest = json.loads(split_manifest_path.read_text(encoding='utf-8'))
          generated_at = old_split_manifest.get('generated_at')
          version = old_split_manifest.get('version', 'places_lisbon_historie_split_v1')

          split_entries = []
          for order, place in enumerate(retained):
              split_path = split_dir / f"{place['id']}.json"
              split_text = json.dumps(place, ensure_ascii=False, indent=2) + '\n'
              split_path.write_text(split_text, encoding='utf-8')
              split_entries.append({
                  'id': place['id'],
                  'name': place.get('name'),
                  'category': 'historie',
                  'file': f"places_lisbon_historie/{place['id']}.json",
                  'order': order,
                  'sha256': hashlib.sha256(split_text.encode('utf-8')).hexdigest(),
              })

          new_split_manifest = {
              'version': version,
              'source_file': 'places_lisbon_historie.json',
              'source_path': 'data/places/historie/europe/portugal/lisbon/places_lisbon_historie.json',
              'source_sha256': source_sha256,
              'generated_at': generated_at,
              'place_count': len(retained),
              'layout': {
                  'place_files_dir': 'places_lisbon_historie/',
                  'one_file_per_place': True,
                  'filename_rule': '<place.id>.json',
                  'manifest_preserves_original_order': True,
                  'original_aggregate_left_unchanged': True,
              },
              'places': split_entries,
          }
          split_manifest_path.write_text(
              json.dumps(new_split_manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          for place_id in move_ids:
              split_copy = split_dir / f'{place_id}.json'
              if not split_copy.exists():
                  raise SystemExit(f'Expected moved split copy to exist: {split_copy}')
              split_copy.unlink()

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = manifest.get('files')
          if not isinstance(files, list):
              raise SystemExit('Manifest files must be a list')
          if files.count(anchor) != 1:
              raise SystemExit(f'Expected exactly one Lisbon source anchor, got {files.count(anchor)}')

          additions = [item[3] for item in moves]
          collisions = [path for path in additions if path in files]
          if collisions:
              raise SystemExit(f'Manifest destinations already registered: {collisions}')
          anchor_index = files.index(anchor)
          files[anchor_index + 1:anchor_index + 1] = additions
          if files[anchor_index:anchor_index + 1 + len(additions)] != [anchor, *additions]:
              raise SystemExit('Lisbon manifest insertion order is incorrect')
          if len(files) != len(set(files)):
              raise SystemExit('Duplicate manifest paths after Lisbon insertion')

          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8',
          )

          id_counts = Counter()
          for relative_path in files:
              path = Path('data/places') / relative_path.removeprefix('places/')
              document = json.loads(path.read_text(encoding='utf-8'))
              if isinstance(document, list):
                  for place in document:
                      if isinstance(place, dict) and isinstance(place.get('id'), str):
                          id_counts[place['id']] += 1

          duplicates = sorted(place_id for place_id, count in id_counts.items() if count > 1)
          if duplicates:
              raise SystemExit(f'Duplicate manifest-loaded place IDs: {duplicates[:20]}')
          for place_id in original_ids:
              if id_counts[place_id] != 1:
                  raise SystemExit(f'Expected one manifest-loaded occurrence of {place_id}, got {id_counts[place_id]}')

          check_split = json.loads(split_manifest_path.read_text(encoding='utf-8'))
          if check_split.get('place_count') != len(retained_ids):
              raise SystemExit('Lisbon split manifest place_count mismatch')
          if [entry['id'] for entry in check_split['places']] != retained_ids:
              raise SystemExit('Lisbon split manifest order mismatch')
          if any(entry.get('category') != 'historie' for entry in check_split['places']):
              raise SystemExit('Lisbon split manifest contains non-historie entry')

          for place_id, category, destination, _ in moves:
              written = json.loads(destination.read_text(encoding='utf-8'))
              if written[0].get('id') != place_id or written[0].get('category') != category:
                  raise SystemExit(f'Post-write validation failed for {destination}')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/places/historie/europe/portugal/lisbon/places_lisbon_historie.json
          git add data/places/historie/europe/portugal/lisbon/places_lisbon_historie_manifest.json
          git add data/places/historie/europe/portugal/lisbon/places_lisbon_historie
          git add data/places/by/europe/portugal/lisbon/lisbon_aqueduto_das_aguas_livres.json
          git add data/places/by/europe/portugal/lisbon/lisbon_estacao_do_rossio.json
          git add data/places/politikk/europe/portugal/lisbon/lisbon_palacio_ajuda.json
          git add data/places/manifest.json
          git rm .github/workflows/register-lisbon-history-category-files.yml
          git rm .github/lisbon-history-category-split-trigger.txt
          git commit -m "Split and register Lisbon history category files"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            sleep 2
          done
          exit 1
