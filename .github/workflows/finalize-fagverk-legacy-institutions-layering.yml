name: Finalize institutions-layering Fagverk legacy batch

on:
  push:
    branches:
      - agent/fagverk-legacy-institutions-layering-20260831
    paths:
      - .github/workflows/finalize-fagverk-legacy-institutions-layering.yml
      - tools/finalize-fagverk-legacy-institutions-layering.mjs

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync branch to current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Curate four completed Place Fagverk packages
        run: node tools/finalize-fagverk-legacy-institutions-layering.mjs
      - name: Rebuild deterministic quiz contexts
        run: |
          node scripts/build-quiz-production-context.mjs --category by --target universitetsplassen --output data/quiz/production_context/by/universitetsplassen.json
          node scripts/build-quiz-production-context.mjs --category by --target tullin --output data/quiz/production_context/by/tullin.json
          node scripts/build-quiz-production-context.mjs --category historie --target akershus_festning --output data/quiz/production_context/historie/akershus_festning.json
          node scripts/build-quiz-production-context.mjs --category historie --target oslo_hospital --output data/quiz/production_context/historie/oslo_hospital.json
      - name: Regenerate Fagverk and runtime artifacts
        run: |
          node scripts/build-place-open-payloads.mjs
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate Fagverk page contract
        run: node scripts/audit-fagverk-place-pages.mjs
      - name: Validate Place-open and release artifacts
        run: |
          node scripts/build-place-open-payloads.mjs --check
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Test Fagverk page and substance contracts
        run: |
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/fagverk-place-substance-audit.test.mjs
      - name: Test Fagverk links
        run: node --test tests/fagverk-link-audit.test.mjs
      - name: Validate changed Place images
        run: node scripts/audit-place-images.mjs --mode=changed
      - name: Validate quiz production context
        run: npm run audit:quiz-production-context
      - name: Validate quiz progression
        run: npm run audit:quiz-progression
      - name: Validate quiz theory binding
        run: npm run audit:quiz-theory-binding
      - name: Validate diff whitespace
        run: git diff --check
      - name: Commit final production result and remove temporary tooling
        run: |
          git add \
            data/places/by/oslo/places/universitetsplassen.json \
            data/places/by/oslo/places/tullin.json \
            data/places/historie/oslo/places_historie/akershus_festning.json \
            data/places/historie/oslo/places_historie_added_batch_01/oslo_hospital.json \
            data/quiz/production_context/by/universitetsplassen.json \
            data/quiz/production_context/by/tullin.json \
            data/quiz/production_context/historie/akershus_festning.json \
            data/quiz/production_context/historie/oslo_hospital.json \
            data/runtime \
            data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/fagverk-place-page-coverage-v2.json
          git rm tools/finalize-fagverk-legacy-institutions-layering.mjs .github/workflows/finalize-fagverk-legacy-institutions-layering.yml
          git diff --cached --quiet && { echo "No production changes to commit"; exit 1; }
          git commit -m "Curate institutions-layering Fagverk legacy batch"
          git push origin HEAD:${GITHUB_REF_NAME}
