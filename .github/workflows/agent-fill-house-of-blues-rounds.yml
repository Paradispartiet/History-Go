name: Fill House of Blues rounds

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-validate-commit:
    if: github.head_ref == 'agent/fill-house-of-blues-rounds-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate House of Blues content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path, value):
              Path(path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          payload = load('.github/agent-payloads/house-of-blues-batch1.json')

          place_path = 'data/places/kunst/vestland/etne/house_of_blues_skanevik.json'
          place_rows = load(place_path)
          if len(place_rows) != 1 or place_rows[0].get('id') != 'house_of_blues_skanevik':
              raise SystemExit('Unexpected House of Blues place file')
          place_rows[0].update(payload['place_update'])
          save(place_path, place_rows)

          relations_path = 'data/relations.json'
          relations = load(relations_path)
          relation_ids = {row['id'] for row in payload['relations']}
          relations = [row for row in relations if row.get('id') not in relation_ids]
          relations.extend(payload['relations'])
          save(relations_path, relations)

          story_path = 'data/stories/stories_etnesjoen_kunst_rounds_batch1.json'
          stories = [row for row in load(story_path) if row.get('id') != payload['story']['id']]
          stories.append(payload['story'])
          save(story_path, stories)

          article_path = 'data/leksikon/places/vestland/etne/kunst/leksikon_etnesjoen_kunst_rounds_batch1.json'
          articles = [row for row in load(article_path) if row.get('place_id') != payload['article']['place_id']]
          articles.append(payload['article'])
          save(article_path, articles)
          PY
      - name: House of Blues dedicated test
        run: node tests/house-of-blues-batch1-round-content.test.js
      - name: Inherited Etne round tests
        shell: bash
        run: |
          find tests -maxdepth 1 -type f -name '*round-content.test.js' \
            | grep -E '/(etne|etnesjoen|skanevik|steinsvollen|engebanen|skakkeringen|osnes|sjokanten|fikse|house-of-blues)[^/]*round-content\.test\.js$' \
            | grep -v 'house-of-blues-batch1-round-content.test.js' \
            | sort \
            | xargs -r -n1 node
      - run: npm run leksikon:ids:check
      - name: People audit
        run: bash scripts/check-people.sh
      - name: Restore generated people audit reports
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- \
            reports/people-invalid-place-refs.json \
            reports/people-invalid-place-refs.md \
            reports/people-of-places-status.json \
            reports/people-of-places-status.md \
            reports/people-place-coverage.json \
            reports/people-place-coverage.md
      - run: npm run typecheck:tools
      - run: npm run typecheck:web
      - name: Story integrity without new House of Blues errors
        shell: bash
        run: |
          set +e
          npx tsx tools/check_stories_integrity.mts > /tmp/story-integrity.log 2>&1
          status=$?
          set -e
          cat /tmp/story-integrity.log
          if grep -E 'house_of_blues_skanevik|st_house_of_blues' /tmp/story-integrity.log; then
            echo "New House of Blues story-integrity error detected"
            exit 1
          fi
          echo "Story integrity exit status: $status; no House of Blues-specific errors"
      - run: git diff --check
      - name: Remove temporary payload and workflow
        run: |
          rm -rf .github/agent-payloads
          rm .github/workflows/agent-fill-house-of-blues-rounds.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name "History Go data agent"
          git config user.email "history-go-agent@users.noreply.github.com"
          git add -A
          git commit -m "Fill House of Blues place rounds batch 1"
          git push origin HEAD:${{ github.head_ref }}
