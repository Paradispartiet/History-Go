name: Temporary sync Næringsliv PR 3931 with main

on:
  push:
    branches:
      - agent/naeringsliv-fagprofil-normal-opening-v2
    paths:
      - '.github/workflows/temp-sync-naeringsliv-pr3931.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/naeringsliv-fagprofil-normal-opening-v2
          fetch-depth: 0

      - name: Merge current main with locked Næringsliv resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'Branch already contains current main.'
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts:\n%s\n' "${conflicts[*]}"

            allowed=(
              'data/fag/naeringsliv/supersetQUIZMAL_naeringsliv.json'
              'data/quiz/production_context/naeringsliv/telegrafbygningen.json'
              'data/quiz/production_context/naeringsliv/oslo_posthus.json'
              'data/quiz/production_context/naeringsliv/havnelageret.json'
            )

            for conflict in "${conflicts[@]}"; do
              permitted=false
              for path in "${allowed[@]}"; do
                if [ "$conflict" = "$path" ]; then
                  permitted=true
                  break
                fi
              done
              if [ "$permitted" != true ]; then
                echo "Unexpected conflict: $conflict"
                git merge --abort
                exit 1
              fi
            done

            git checkout --ours -- "${allowed[@]}"
            git add "${allowed[@]}"
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved conflicts remain.'
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git commit -m 'Synkroniser Næringsliv-fagprofil med main'
          git push origin HEAD:agent/naeringsliv-fagprofil-normal-opening-v2
