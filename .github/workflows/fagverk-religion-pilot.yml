name: Fagverk Religion pilot

on:
  pull_request:
    paths:
      - 'fagverk.html'
      - 'fagverk-forside.html'
      - 'data/fag/religion/**'
      - 'data/badges/religion.json'
      - 'data/fagverk/religion/**'
      - 'js/fagverk-subject-core.js'
      - 'js/fagverk-subject-model.js'
      - 'js/fagverk.js'
      - 'scripts/audit-fagverk-religion-pilot.mjs'
      - 'scripts/audit-fagverk-religion-university-readiness.mjs'
      - 'scripts/audit-fagverk-religion-theory-method-articles-v1.mjs'
      - 'scripts/audit-fagverk-religion-history-comparison-articles-v1.mjs'
      - 'scripts/audit-fagverk-religion-abrahamic-traditions-articles-v1.mjs'
      - 'scripts/audit-fagverk-religion-south-asian-articles-v1.mjs'
      - 'scripts/audit-fagverk-religion-east-asian-articles-v1.mjs'
      - 'scripts/audit-fagverk-religion-indigenous-sami-articles-v1.mjs'
      - 'scripts/audit-fagverk-religion-ritual-materiality-space-articles-v1.mjs'
      - 'scripts/audit-fagverk-religion-texts-myths-authority-articles-v1.mjs'
      - 'scripts/audit-fagverk-religion-society-politics-law-articles-v1.mjs'
      - 'scripts/audit-fagverk-religion-lived-identity-migration-articles-v1.mjs'
      - 'scripts/audit-fagverk-religion-secular-new-media-articles-v1.mjs'
      - 'scripts/audit-fagverk-religion-nature-science-ethics-articles-v1.mjs'
      - 'tests/fagverk-religion-pilot.test.mjs'
      - 'tests/fagverk-religion-university-readiness.test.mjs'
      - 'tests/fagverk-religion-theory-method-articles-v1.test.mjs'
      - 'tests/fagverk-religion-history-comparison-articles-v1.test.mjs'
      - 'tests/fagverk-religion-abrahamic-traditions-articles-v1.test.mjs'
      - 'tests/fagverk-religion-south-asian-articles-v1.test.mjs'
      - 'tests/fagverk-religion-east-asian-articles-v1.test.mjs'
      - 'tests/fagverk-religion-indigenous-sami-articles-v1.test.mjs'
      - 'tests/fagverk-religion-ritual-materiality-space-articles-v1.test.mjs'
      - 'tests/fagverk-religion-texts-myths-authority-articles-v1.test.mjs'
      - 'tests/fagverk-religion-society-politics-law-articles-v1.test.mjs'
      - 'tests/fagverk-religion-lived-identity-migration-articles-v1.test.mjs'
      - 'tests/fagverk-religion-secular-new-media-articles-v1.test.mjs'
      - 'tests/fagverk-religion-nature-science-ethics-articles-v1.test.mjs'
      - 'tests/fagverk-religion-completion-state.test.mjs'
      - 'tests/fagverk-release-manifest.test.mjs'
      - '.github/workflows/fagverk-religion-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Religion foundation and university readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate syntax and deterministic reports
        run: |
          node --check scripts/audit-fagverk-religion-pilot.mjs
          node --check scripts/audit-fagverk-religion-university-readiness.mjs
          node --check scripts/audit-fagverk-religion-theory-method-articles-v1.mjs
          node --check scripts/audit-fagverk-religion-history-comparison-articles-v1.mjs
          node --check scripts/audit-fagverk-religion-abrahamic-traditions-articles-v1.mjs
          node --check scripts/audit-fagverk-religion-south-asian-articles-v1.mjs
          node --check scripts/audit-fagverk-religion-east-asian-articles-v1.mjs
          node --check scripts/audit-fagverk-religion-indigenous-sami-articles-v1.mjs
          node --check scripts/audit-fagverk-religion-ritual-materiality-space-articles-v1.mjs
          node --check scripts/audit-fagverk-religion-texts-myths-authority-articles-v1.mjs
          node --check scripts/audit-fagverk-religion-society-politics-law-articles-v1.mjs
          node --check scripts/audit-fagverk-religion-lived-identity-migration-articles-v1.mjs
          node --check scripts/audit-fagverk-religion-secular-new-media-articles-v1.mjs
          node --check scripts/audit-fagverk-religion-nature-science-ethics-articles-v1.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-religion-pilot.mjs
          node scripts/audit-fagverk-religion-university-readiness.mjs
          node scripts/audit-fagverk-religion-theory-method-articles-v1.mjs
          node scripts/audit-fagverk-religion-history-comparison-articles-v1.mjs
          node scripts/audit-fagverk-religion-abrahamic-traditions-articles-v1.mjs
          node scripts/audit-fagverk-religion-south-asian-articles-v1.mjs
          node scripts/audit-fagverk-religion-east-asian-articles-v1.mjs
          node scripts/audit-fagverk-religion-indigenous-sami-articles-v1.mjs
          node scripts/audit-fagverk-religion-ritual-materiality-space-articles-v1.mjs
          node scripts/audit-fagverk-religion-texts-myths-authority-articles-v1.mjs
          node scripts/audit-fagverk-religion-society-politics-law-articles-v1.mjs
          node scripts/audit-fagverk-religion-lived-identity-migration-articles-v1.mjs
          node scripts/audit-fagverk-religion-secular-new-media-articles-v1.mjs
          node scripts/audit-fagverk-religion-nature-science-ethics-articles-v1.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Validate Fagverk and Religion contracts
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-religion-pilot.test.mjs
          node --test tests/fagverk-religion-university-readiness.test.mjs
          node --test tests/fagverk-religion-theory-method-articles-v1.test.mjs
          node --test tests/fagverk-religion-history-comparison-articles-v1.test.mjs
          node --test tests/fagverk-religion-abrahamic-traditions-articles-v1.test.mjs
          node --test tests/fagverk-religion-south-asian-articles-v1.test.mjs
          node --test tests/fagverk-religion-east-asian-articles-v1.test.mjs
          node --test tests/fagverk-religion-indigenous-sami-articles-v1.test.mjs
          node --test tests/fagverk-religion-ritual-materiality-space-articles-v1.test.mjs
          node --test tests/fagverk-religion-texts-myths-authority-articles-v1.test.mjs
          node --test tests/fagverk-religion-society-politics-law-articles-v1.test.mjs
          node --test tests/fagverk-religion-lived-identity-migration-articles-v1.test.mjs
          node --test tests/fagverk-religion-secular-new-media-articles-v1.test.mjs
          node --test tests/fagverk-religion-nature-science-ethics-articles-v1.test.mjs
          node --test tests/fagverk-religion-completion-state.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
