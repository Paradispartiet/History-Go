name: Fix Oslo coordinate protocol batch 32 count

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oslo-coordinate-protocol-b32-count
          fetch-depth: 0
          show-progress: false
      - name: Fix stale controlled-count reference
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/coordinates/coordinate-control-protocol.md')
          text = p.read_text()
          old = 'teller ikke blant de 151 verifiserte eller kildekontrollerte canonical Oslo-stedene'
          new = 'teller ikke blant de 154 verifiserte eller kildekontrollerte canonical Oslo-stedene'
          if old not in text:
              raise SystemExit('Stale 151 sentence not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Assert protocol consistency
        run: |
          set -euo pipefail
          grep -F 'Oslo-tabellen inneholder nå 154 verifiserte eller kildekontrollerte canonical steder.' docs/coordinates/coordinate-control-protocol.md
          grep -F 'teller ikke blant de 154 verifiserte eller kildekontrollerte canonical Oslo-stedene' docs/coordinates/coordinate-control-protocol.md
          grep -F 'Antallet fullførte kontroller uten godkjent Oslo-koordinat er nå 44.' docs/coordinates/coordinate-control-protocol.md
          ! grep -F 'teller ikke blant de 151 verifiserte eller kildekontrollerte canonical Oslo-stedene' docs/coordinates/coordinate-control-protocol.md
          git diff --check
      - name: Commit clean fix
        run: |
          rm .github/workflows/fix-oslo-coordinate-protocol-b32-count.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/coordinates/coordinate-control-protocol.md .github/workflows/fix-oslo-coordinate-protocol-b32-count.yml
          git commit -m 'Fix Oslo coordinate protocol batch 32 count'
          git push origin HEAD:refs/heads/fix/oslo-coordinate-protocol-b32-count
