name: TEMP diagnose Film TV unit 14 audit stack

on:
  push:
    branches:
      - "agent/film-tv-unit14-archive-preservation-access-authenticity-fulltext"
    paths:
      - ".trigger/unit14-audit-stack"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Rebuild source brief
        run: node scripts/brief-film-tv-archive-preservation-access-authenticity-sources-v1.mjs --write
      - name: Materialize fulltext
        run: node --input-type=module -e "import('./scripts/materialize-film-tv-archive-preservation-access-authenticity-fulltext-v1.mjs').then(m => m.materializeFilmTvArchivePreservationAccessAuthenticityFulltextV1())"
      - name: Print chapter mismatch fields
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { isDeepStrictEqual } from 'node:util';
          const m = await import('./scripts/materialize-film-tv-archive-preservation-access-authenticity-fulltext-v1.mjs');
          const expected = m.buildFilmTvArchivePreservationAccessAuthenticityFulltextV1().chapter;
          const actual = JSON.parse(fs.readFileSync('data/fagverk/film_tv/arkiv-bevaring-tilgang-og-autentisitet.json', 'utf8'));
          for (const key of new Set([...Object.keys(actual), ...Object.keys(expected)])) {
            if (!isDeepStrictEqual(actual[key], expected[key])) {
              console.log(`MISMATCH ${key}`);
              console.log('ACTUAL', JSON.stringify(actual[key]));
              console.log('EXPECTED', JSON.stringify(expected[key]));
            }
          }
          if (!isDeepStrictEqual(actual, expected)) process.exitCode = 2;
          NODE
