name: Remove legacy Vinderen cardImage

on:
  push:
    branches:
      - place/vinderen-fagverk-v2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: place/vinderen-fagverk-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove cardImage without synthesizing frontImage
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const file = 'data/places/by/oslo/places/vinderen.json';
          const place = JSON.parse(fs.readFileSync(file, 'utf8'));
          delete place.cardImage;
          if (Object.prototype.hasOwnProperty.call(place, 'frontImage')) {
            throw new Error('Vinderen frontImage must not be synthesized by this correction');
          }
          if (!String(place.image || '').startsWith('https://upload.wikimedia.org/')) {
            throw new Error('Expected verified generic image to remain');
          }
          fs.writeFileSync(file, `${JSON.stringify(place, null, 2)}\n`);
          EOF
      - name: Verify image contract and canonical snapshot
        run: |
          node scripts/audit-place-images.mjs --mode=changed
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/place-image-audit.json --verify-summary=data/places/place_image_backlog_summary.json
      - name: Rebuild place-open payload
        run: |
          npm run place-open:build
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'data/places/by/oslo/places/vinderen.json' 'data/runtime/place-open/vinderen.json' | sort)"
          test "$actual" = "$expected" || {
            echo "Unexpected generated changes:"
            printf '%s\n' "$actual"
            exit 1
          }
      - name: Commit permanent correction and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/by/oslo/places/vinderen.json data/runtime/place-open/vinderen.json
          git rm .github/workflows/vinderen-remove-card-image.yml
          git commit -m "fix(place): remove legacy Vinderen cardImage"
          git push origin HEAD:place/vinderen-fagverk-v2
