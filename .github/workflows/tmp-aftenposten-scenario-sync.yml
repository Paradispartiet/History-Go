name: Temporary Aftenposten scenario synchronization
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/tmp-aftenposten-scenario-sync.yml'
permissions:
  contents: read
concurrency:
  group: tmp-aftenposten-scenario-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  synchronize:
    if: github.event.pull_request.number == 6144 && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate scenario People
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - name: Guard exact derived change
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const file='data/Civication/scenarioPeople/generated/media.json';
          const changed=execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          assert.deepEqual(changed,[file]);
          const expected=JSON.parse(execFileSync('git',['show','HEAD:'+file],{encoding:'utf8'}));
          const person=JSON.parse(fs.readFileSync('data/Civication/historyPeople_index.json','utf8')).categories.media.find(p=>p.id==='trine_eilertsen');
          const entry=expected.people_pool.existing_place_people.find(p=>p.person_id===person.id);
          entry.place_id=person.placeId;entry.year=person.year;
          assert.deepEqual(JSON.parse(fs.readFileSync(file,'utf8')),expected);
          console.log('PASS: only Trine place_id/year changed in scenario People; all other catalog content unchanged.');
          
          JS
      - name: Verify scenario People
        run: |
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node --test tests/civication-scenario-people.test.mjs
          node tools/audit-people-profile-canonical.mjs
      - name: Commit restricted projection
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: agent/aftenposten-prior-work-20261008
        run: |
          set -euo pipefail
          actual_head=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$actual_head" = "$EXPECTED_HEAD"
          git add -- data/Civication/scenarioPeople/generated/media.json
          git config user.name "History Go data synchronization"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: synchronize Eilertsen in Civication scenario People"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
