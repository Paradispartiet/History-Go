name: Data checks

on:
  pull_request:
    paths:
      - 'data/people/**'
      - 'data/places/**'
      - 'scripts/check-people.sh'
      - 'scripts/check-places.sh'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.tools*.json'
      - '.github/workflows/data-checks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate_etne_sport_batch_4:
    name: Integrate Etne sport batch 4
    if: github.event.pull_request.number == 2254
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/etne-sport-batch-4-clean-main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          mkdir -p reports/etne-sport-batch-4-integration
          npm install --no-audit --no-fund 2>&1 | tee reports/etne-sport-batch-4-integration/npm-install.txt

      - name: Register source exactly once
        run: |
          node --input-type=module <<'NODE' | tee reports/etne-sport-batch-4-integration/manifest-update.txt
          import fs from 'node:fs';
          const manifestPath = 'data/places/manifest.json';
          const file = 'places/sport/vestland/etne/skanevik_skytebane.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.files = manifest.files.filter((value) => value !== file);
          manifest.files.push(file);
          const count = manifest.files.filter((value) => value === file).length;
          if (count !== 1) throw new Error(`Manifest registration failed: ${count}`);
          fs.writeFileSync(manifestPath, JSON.stringify(manifest));
          console.log(`PASS ${file}: exactly once`);
          NODE

      - name: Rebuild runtime index
        run: npm run places:index:build 2>&1 | tee reports/etne-sport-batch-4-integration/index-build.txt

      - name: Run coordinate intake
        env:
          COORD_INTAKE_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run places:coords:intake 2>&1 | tee reports/etne-sport-batch-4-integration/coordinate-intake.txt

      - name: Run places validation
        run: bash scripts/check-places.sh 2>&1 | tee reports/etne-sport-batch-4-integration/check-places.txt

      - name: Run split manifest sync
        run: npm run audit:places-split-manifest-sync 2>&1 | tee reports/etne-sport-batch-4-integration/split-manifest-sync.txt

      - name: Run coordinate quality gate
        run: npm run places:coords:quality 2>&1 | tee reports/etne-sport-batch-4-integration/coordinate-quality.txt

      - name: Validate source and runtime parity
        run: |
          node --input-type=module <<'NODE' | tee reports/etne-sport-batch-4-integration/source-index-coordinate-parity.txt
          import fs from 'node:fs';
          const id = 'skanevik_skytebane';
          const fields = ['lat','lon','r','coordType','coordStatus','coordSource','coordVerifiedAt','coordNote','locatorType','sourceProvider','sourceObjectId','geocodeAccuracy','coordRole'];
          const sourceDoc = JSON.parse(fs.readFileSync('data/places/sport/vestland/etne/skanevik_skytebane.json', 'utf8'));
          const source = Array.isArray(sourceDoc) ? sourceDoc.find((place) => place.id === id) : sourceDoc;
          const runtime = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const rows = runtime.filter((place) => place.id === id);
          if (rows.length !== 1) throw new Error(`Expected one runtime row, got ${rows.length}`);
          for (const field of fields) {
            if (JSON.stringify(source[field]) !== JSON.stringify(rows[0][field])) throw new Error(`Mismatch for ${field}`);
            console.log(`PASS ${field}: ${JSON.stringify(source[field])}`);
          }
          const counts = new Map();
          for (const place of runtime) counts.set(place.id, (counts.get(place.id) || 0) + 1);
          const duplicates = [...counts.entries()].filter(([, count]) => count > 1);
          if (duplicates.length) throw new Error(`Global duplicate active place IDs: ${JSON.stringify(duplicates)}`);
          console.log('PASS runtime rows: 1');
          console.log('PASS global duplicate active place IDs: 0');
          NODE

      - name: Run overlap audit
        run: |
          node --input-type=module <<'NODE' | tee reports/etne-sport-batch-4-integration/anchor-audit.txt
          import fs from 'node:fs';
          const runtime = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const ids = ['skanevik_skytebane','skanevik_skatepark','skanevik_discgolf','skanevik_idrettsanlegg'];
          const places = Object.fromEntries(ids.map((id) => [id, runtime.find((place) => place.id === id)]));
          const toRad = (x) => x * Math.PI / 180;
          const distance = (a,b) => {
            const R = 6371;
            const dLat = toRad(b.lat-a.lat), dLon = toRad(b.lon-a.lon);
            const h = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;
            return 2*R*Math.asin(Math.sqrt(h));
          };
          for (const other of ids.slice(1)) {
            if (!places[other]) throw new Error(`Missing ${other}`);
            console.log(`PASS skanevik_skytebane ↔ ${other}: ${distance(places.skanevik_skytebane, places[other]).toFixed(3)} km`);
          }
          NODE

      - name: Run diff whitespace check
        run: git diff --check | tee reports/etne-sport-batch-4-integration/git-diff-check.txt

      - name: Restore standard workflow and commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/data-checks.yml > .github/workflows/data-checks.yml
          git add .github/workflows/data-checks.yml data/places/manifest.json data/places/places_index.json reports/etne-sport-batch-4-integration
          git diff --cached --check
          git commit -m "Integrate Etne sport batch 4"
          git push origin HEAD:agent/etne-sport-batch-4-clean-main

  people:
    name: People data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run people check
        run: bash scripts/check-people.sh

  places:
    name: Places data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run places check
        run: |
          if [ -f scripts/check-places.sh ]; then
            bash scripts/check-places.sh
          else
            echo "scripts/check-places.sh not found; using inline places checks"
            node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function readJson(file) {
            try { return JSON.parse(fs.readFileSync(file, 'utf8')); }
            catch (error) {
              console.error(`JSON parse failed: ${file}`);
              console.error(error.message);
              process.exit(1);
            }
          }
          const manifestPath = 'data/places/manifest.json';
          const placesIndexPath = 'data/places/places_index.json';
          const manifest = readJson(manifestPath);
          if (!manifest || !Array.isArray(manifest.files)) {
            console.error(`${manifestPath} must contain a files array`);
            process.exit(1);
          }
          const files = [manifestPath, placesIndexPath, ...manifest.files.map((file) => path.join('data', file))];
          for (const file of files) {
            if (!fs.existsSync(file)) {
              console.error(`Missing expected file: ${file}`);
              process.exit(1);
            }
            readJson(file);
          }
          console.log(`json ok (${files.length} files)`);
          NODE
            npm run places:index:build
            npm run build:tools
            npm run places:index:check
            npm run places:emner:check
            npm run places:coords:check
          fi
