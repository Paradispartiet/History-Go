name: Data checks

on:
  pull_request:
    paths:
      - 'data/people/**'
      - 'data/places/**'
      - 'scripts/check-people.sh'
      - 'scripts/check-places.sh'
      - 'scripts/resolve-etne-sport-batch1.mjs'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.tools*.json'
      - '.github/workflows/data-checks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  people:
    name: People data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run people check
        run: bash scripts/check-people.sh

  places:
    name: Places data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run places check
        run: |
          if [ -f scripts/check-places.sh ]; then
            bash scripts/check-places.sh
          else
            echo "scripts/check-places.sh not found; using inline places checks"
            node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function readJson(file) {
            try { return JSON.parse(fs.readFileSync(file, 'utf8')); }
            catch (error) {
              console.error(`JSON parse failed: ${file}`);
              console.error(error.message);
              process.exit(1);
            }
          }
          const manifestPath = 'data/places/manifest.json';
          const placesIndexPath = 'data/places/places_index.json';
          const manifest = readJson(manifestPath);
          if (!manifest || !Array.isArray(manifest.files)) {
            console.error(`${manifestPath} must contain a files array`);
            process.exit(1);
          }
          const files = [manifestPath, placesIndexPath, ...manifest.files.map((file) => path.join('data', file))];
          for (const file of files) {
            if (!fs.existsSync(file)) {
              console.error(`Missing expected file: ${file}`);
              process.exit(1);
            }
            readJson(file);
          }
          console.log(`json ok (${files.length} files)`);
          NODE
            npm run places:index:build
            npm run build:tools
            npm run places:index:check
            npm run places:emner:check
            npm run places:coords:check
          fi

  etne-sport-integration:
    name: Etne sport batch 1 integration
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/etne-sport-batch-1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Etne sport branch
        uses: actions/checkout@v4
        with:
          ref: agent/etne-sport-batch-1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: bash
        run: |
          mkdir -p reports/etne-sport-batch-1-integration
          npm install --no-audit --no-fund 2>&1 | tee reports/etne-sport-batch-1-integration/npm-install.txt

      - name: Resolve coordinates and register manifest
        shell: bash
        run: |
          node scripts/resolve-etne-sport-batch1.mjs 2>&1 | tee reports/etne-sport-batch-1-integration/address-anchor-lookup.txt
          node <<'NODE' 2>&1 | tee reports/etne-sport-batch-1-integration/manifest-update.txt
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('data/places/manifest.json', 'utf8'));
          const additions = [
            'places/sport/vestland/etne/etne_idrettsanlegg.json',
            'places/sport/vestland/etne/steinsvollen_fotballanlegg.json',
            'places/sport/vestland/etne/engebanen_etne.json',
            'places/sport/vestland/etne/skanevik_idrettsanlegg.json',
            'places/sport/vestland/etne/etne_bmx_og_skatepark.json'
          ];
          for (const item of additions) {
            const count = manifest.files.filter((row) => row === item).length;
            if (count !== 1) throw new Error(`${item}: manifest count ${count}`);
            console.log(`PASS ${item}: exactly once in manifest`);
          }
          NODE

      - name: Run place validation
        shell: bash
        run: |
          bash scripts/check-places.sh 2>&1 | tee reports/etne-sport-batch-1-integration/check-places.txt

      - name: Run split manifest audit
        shell: bash
        run: |
          npm run audit:places-split-manifest-sync 2>&1 | tee reports/etne-sport-batch-1-integration/split-manifest-sync.txt

      - name: Run coordinate quality gate
        shell: bash
        run: |
          npm run places:coords:quality 2>&1 | tee reports/etne-sport-batch-1-integration/coordinate-quality.txt

      - name: Run targeted runtime validation
        shell: bash
        run: |
          node <<'NODE' 2>&1 | tee reports/etne-sport-batch-1-integration/targeted-validation.txt
          const fs = require('fs');
          const ids = ['etne_idrettsanlegg', 'steinsvollen_fotballanlegg', 'engebanen_etne', 'skanevik_idrettsanlegg', 'etne_bmx_og_skatepark'];
          const rows = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const list = Array.isArray(rows) ? rows : (rows.places || []);
          for (const id of ids) {
            const count = list.filter((row) => row.id === id).length;
            if (count !== 1) throw new Error(`${id}: active runtime count ${count}`);
            console.log(`PASS ${id}: exactly one active runtime row`);
          }
          const counts = new Map();
          for (const row of list) counts.set(row.id, (counts.get(row.id) || 0) + 1);
          const duplicates = [...counts.entries()].filter(([, count]) => count > 1);
          if (duplicates.length) throw new Error(`global duplicate active place IDs: ${duplicates.length}`);
          console.log('PASS global duplicate active place IDs: 0');
          NODE

      - name: Audit anchor distinctions
        shell: bash
        run: |
          node <<'NODE' 2>&1 | tee reports/etne-sport-batch-1-integration/anchor-audit.txt
          const fs = require('fs');
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'))[0];
          const etne = read('data/places/sport/vestland/etne/etne_idrettsanlegg.json');
          const steinsvollen = read('data/places/sport/vestland/etne/steinsvollen_fotballanlegg.json');
          const enge = read('data/places/sport/vestland/etne/engebanen_etne.json');
          const skanevik = read('data/places/sport/vestland/etne/skanevik_idrettsanlegg.json');
          const bmx = read('data/places/sport/vestland/etne/etne_bmx_og_skatepark.json');
          const rows = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const list = Array.isArray(rows) ? rows : (rows.places || []);
          const hall = list.find((row) => row.id === 'skanevik_kultur_og_idrettshall');
          if (!hall) throw new Error('Existing skanevik_kultur_og_idrettshall runtime row missing');
          const hav = (a,b) => {
            const R=6371, rad=(x)=>x*Math.PI/180;
            const dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
            const q=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
            return 2*R*Math.asin(Math.sqrt(q));
          };
          const distances = {
            etne_bmx: hav(etne, bmx),
            etne_enge: hav(etne, enge),
            etne_steinsvollen: hav(etne, steinsvollen),
            skanevik_hall: hav(skanevik, hall)
          };
          for (const [name, distance] of Object.entries(distances)) {
            if (distance < 0.01) throw new Error(`${name}: anchors are effectively identical (${distance.toFixed(3)} km)`);
          }
          if ([etne, steinsvollen, enge, skanevik, bmx].some((row) => row.category !== 'sport')) throw new Error('Not all batch records are category sport');
          if (!steinsvollen.quiz_profile.notes.includes('Stedsnavn')) throw new Error('Steinsvollen official-name anchor disclosure missing');
          if (!skanevik.quiz_profile.notes.includes('Stedsnavn')) throw new Error('Skånevik outdoor anchor disclosure missing');
          console.log(`PASS Etne idrettsanlegg ↔ BMX/skatepark: ${distances.etne_bmx.toFixed(3)} km; distinct facilities`);
          console.log(`PASS Etne idrettsanlegg ↔ Engebanen: ${distances.etne_enge.toFixed(3)} km; distinct facilities`);
          console.log(`PASS Etne idrettsanlegg ↔ Steinsvollen: ${distances.etne_steinsvollen.toFixed(3)} km; distinct facilities`);
          console.log(`PASS Skånevik outdoor idrettsanlegg ↔ culture/idrettshall: ${distances.skanevik_hall.toFixed(3)} km; distinct objects/functions`);
          console.log('PASS all five records categorized as sport');
          NODE

      - name: Check diff whitespace
        shell: bash
        run: |
          git diff --check 2>&1 | tee reports/etne-sport-batch-1-integration/git-diff-check.txt

      - name: Restore CI and commit integrated batch
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/data-checks.yml
          rm -f .github/workflows/integrate-etne-sport-batch1.yml
          rm -f .github/workflows/integrate-etne-sport-batch1-pr.yml
          rm -f reports/.etne-sport-batch-1-trigger
          rm -f scripts/resolve-etne-sport-batch1.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/data-checks.yml .github/workflows/integrate-etne-sport-batch1.yml .github/workflows/integrate-etne-sport-batch1-pr.yml scripts/resolve-etne-sport-batch1.mjs reports/.etne-sport-batch-1-trigger data/places/sport/vestland/etne data/places/manifest.json data/places/places_index.json reports/etne-sport-batch-1-integration
          git commit -m 'Integrate Etne sport batch 1 [skip etne sport integration]'
          git push origin HEAD:agent/etne-sport-batch-1
