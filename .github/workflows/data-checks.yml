name: Data checks

on:
  pull_request:
    paths:
      - 'data/people/**'
      - 'data/places/**'
      - 'data/quiz/**'
      - 'data/knowledge/**'
      - 'data/fag/**'
      - 'data/badges/**'
      - 'data/categories/**'
      - 'bilder/merker/**'
      - 'js/DomainRegistry.js'
      - 'js/core/categories.ts'
      - 'js/core/categories.js'
      - 'dist/web/categories.js'
      - 'tests/etne-people-manifest-integration.test.js'
      - 'tests/etne-people-of-places-*.test.js'
      - 'tests/quiz-content-quality-audit.test.mjs'
      - 'scripts/check-people.sh'
      - 'scripts/check-places.sh'
      - 'scripts/build-civication-history-people-index.mts'
      - 'scripts/knowledge-canonical-data.mts'
      - 'scripts/audit-category-governance.mjs'
      - 'scripts/audit-quiz-content-quality.mjs'
      - 'scripts/audit-quiz-template-governance.mjs'
      - 'data/Civication/historyPeople_index.json'
      - 'data/Civication/people_access_map.json'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.tools*.json'
      - 'tsconfig.scripts*.json'
      - 'js/knowledgeV2.ts'
      - 'js/knowledgeClaimCore.ts'
      - 'dist/web/knowledgeV2.js'
      - 'js/knowledgePage.js'
      - 'tests/knowledge-v2-model.test.js'
      - 'tests/knowledge-canonical-storage-contract.test.js'
      - '.github/workflows/data-checks.yml'
      - '.github/scenekunst-batch-5-integration-trigger-v4.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  people:
    name: People data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run people check
        run: bash scripts/check-people.sh

  places:
    name: Places data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run places check
        shell: bash
        run: |
          set -o pipefail
          if [ -f scripts/check-places.sh ]; then
            bash scripts/check-places.sh 2>&1 | tee /tmp/places-check.log
          else
            echo "scripts/check-places.sh not found; using inline places checks" | tee /tmp/places-check.log
            {
              node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function readJson(file) {
            try { return JSON.parse(fs.readFileSync(file, 'utf8')); }
            catch (error) {
              console.error(`JSON parse failed: ${file}`);
              console.error(error.message);
              process.exit(1);
            }
          }
          const manifestPath = 'data/places/manifest.json';
          const placesIndexPath = 'data/places/places_index.json';
          const manifest = readJson(manifestPath);
          if (!manifest || !Array.isArray(manifest.files)) {
            console.error(`${manifestPath} must contain a files array`);
            process.exit(1);
          }
          const files = [manifestPath, placesIndexPath, ...manifest.files.map((file) => path.join('data', file))];
          for (const file of files) {
            if (!fs.existsSync(file)) {
              console.error(`Missing expected file: ${file}`);
              process.exit(1);
            }
            readJson(file);
          }
          console.log(`json ok (${files.length} files)`);
          NODE
              npm run places:index:build
              npm run build:tools
              npm run places:index:check
              npm run places:emner:check
              npm run places:coords:check
            } 2>&1 | tee -a /tmp/places-check.log
          fi

      - name: Upload Places check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: places-check-log
          path: /tmp/places-check.log
          if-no-files-found: warn

      - name: Upload Religion candidate audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: religion-place-candidate-audit
          path: /tmp/religion-place-candidate-audit.log
          if-no-files-found: ignore

  quiz-governance:
    name: Category and quiz governance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit canonical categories
        run: npm run audit:categories

      - name: Audit canonical quiz templates
        run: npm run audit:quiz-templates

      - name: Test quiz content audit and repaired quizzes
        run: npm run test:quiz-content-audit

  knowledge:
    name: Knowledge V2
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck Knowledge core
        run: npm run typecheck:web

      - name: Build and syntax check canonical Knowledge tooling
        run: |
          npm run build:scripts
          node --check dist/web/knowledgeV2.js
          node --check js/knowledgePage.js
          node --check dist/scripts/knowledge-canonical-data.mjs

      - name: Guard canonical Knowledge data and contract
        run: |
          npm run knowledge:canonical:check
          npm run knowledge:legacy:check
          npm run audit:knowledge

      - name: Run Knowledge V2 and storage contract tests
        run: |
          npm run test:knowledge-v2
          node --test tests/knowledge-canonical-storage-contract.test.js

      - name: Upload Knowledge contract audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-contract-audit
          path: |
            reports/knowledge-contract-audit.json
            reports/knowledge-id-backfill.json
            reports/knowledge-universe-readers.json
          if-no-files-found: warn

  integrate-scenekunst-batch-5:
    name: Integrate Scenekunst batch 5
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/integrate-scenekunst-batch-5-trigger-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare batch on latest main
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/scenekunst-batch5-integration.log) 2>&1
          SOURCE_BRANCH='agent/scenekunst-venues-05-replayed'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main "${SOURCE_BRANCH}"
          BASE_SHA="$(git rev-parse origin/main)"
          echo "${BASE_SHA}" > /tmp/scenekunst-batch5-base-sha
          git checkout -B integrate-scenekunst-batch-5 "${BASE_SHA}"
          git checkout "origin/${SOURCE_BRANCH}" -- \
            data/places/scenekunst/akershus/baerum_kulturhus.json \
            data/places/scenekunst/buskerud/drammens_teater.json \
            data/places/scenekunst/oslo/dramatikkens_hus.json \
            data/places/scenekunst/oslo/teater_manu.json \
            data/places/scenekunst/oslo/vega_scene.json \
            reports/scenekunst-new-venues-batch-5-2026-07-23.json \
            reports/scenekunst-new-venues-batch-5-2026-07-23.md
          node <<'NODE'
          const fs = require('fs');
          const file = 'data/places/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const additions = [
            'places/scenekunst/akershus/baerum_kulturhus.json',
            'places/scenekunst/buskerud/drammens_teater.json',
            'places/scenekunst/oslo/dramatikkens_hus.json',
            'places/scenekunst/oslo/teater_manu.json',
            'places/scenekunst/oslo/vega_scene.json'
          ];
          for (const entry of additions) {
            if (!manifest.files.includes(entry)) manifest.files.push(entry);
          }
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          npm run places:index:build

      - name: Validate Places and People
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/scenekunst-batch5-integration.log) 2>&1
          bash scripts/check-places.sh
          bash scripts/check-people.sh

      - name: Validate category and quiz governance
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/scenekunst-batch5-integration.log) 2>&1
          npm run audit:categories
          npm run audit:quiz-templates
          npm run test:quiz-content-audit

      - name: Validate Nature and Lesespor
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/scenekunst-batch5-integration.log) 2>&1
          npm run build:tools
          node dist/tools/validate_nature_maps.mjs
          node dist/tools/validate_lesespor.mjs

      - name: Validate Knowledge
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/scenekunst-batch5-integration.log) 2>&1
          npm run typecheck:web
          npm run build:scripts
          npm run knowledge:canonical:check
          npm run knowledge:legacy:check
          npm run audit:knowledge
          npm run test:knowledge-v2
          node --test tests/knowledge-canonical-storage-contract.test.js

      - name: Commit and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/scenekunst-batch5-integration.log) 2>&1
          git diff --check
          git fetch origin main
          EXPECTED_BASE="$(cat /tmp/scenekunst-batch5-base-sha)"
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "${CURRENT_MAIN}" != "${EXPECTED_BASE}" ]; then
            echo "main moved from ${EXPECTED_BASE} to ${CURRENT_MAIN}; refusing unvalidated push"
            exit 2
          fi
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/data-checks.yml')
          text = path.read_text()
          trigger = "      - '.github/scenekunst-batch-5-integration-trigger-v4.txt'\n"
          marker = "\n  integrate-scenekunst-batch-5:\n"
          if trigger not in text:
              raise SystemExit('temporary trigger path not found')
          if marker not in text:
              raise SystemExit('temporary integration job not found')
          text = text.replace(trigger, '', 1)
          text = text.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: read\n', 1)
          text = text.split(marker, 1)[0].rstrip() + '\n'
          path.write_text(text)
          PY
          git add \
            .github/workflows/data-checks.yml \
            data/places/manifest.json \
            data/places/places_index.json \
            data/places/scenekunst/akershus/baerum_kulturhus.json \
            data/places/scenekunst/buskerud/drammens_teater.json \
            data/places/scenekunst/oslo/dramatikkens_hus.json \
            data/places/scenekunst/oslo/teater_manu.json \
            data/places/scenekunst/oslo/vega_scene.json \
            reports/scenekunst-new-venues-batch-5-2026-07-23.json \
            reports/scenekunst-new-venues-batch-5-2026-07-23.md
          git commit -m 'Integrate fifth Scenekunst venue batch'
          git push origin HEAD:main

      - name: Upload integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenekunst-batch5-integration-log
          path: /tmp/scenekunst-batch5-integration.log
          if-no-files-found: warn
