name: Data checks

on:
  pull_request:
    paths:
      - 'data/people/**'
      - 'data/places/**'
      - 'scripts/check-people.sh'
      - 'scripts/check-places.sh'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.tools*.json'
      - '.github/workflows/data-checks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  etne_media_coordinate_intake:
    name: Find Etne media coordinates
    if: github.head_ref == 'agent/etne-media-batch-1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/etne-media-batch-1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Find and save Grannar address coordinate
        run: |
          mkdir -p reports/etne-media-batch-1-coordinate-intake
          npm run places:coords:find:address -- --address "Haukelivegen 997, 5590 Etne" \
            | tee reports/etne-media-batch-1-coordinate-intake/grannar-haukelivegen-997.json

      - name: Restore standard workflow and commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/data-checks.yml > .github/workflows/data-checks.yml
          git add .github/workflows/data-checks.yml reports/etne-media-batch-1-coordinate-intake/grannar-haukelivegen-997.json
          git diff --cached --check
          git commit -m "Save Etne media coordinate intake"
          git push origin HEAD:agent/etne-media-batch-1

  people:
    name: People data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run people check
        run: bash scripts/check-people.sh

  places:
    name: Places data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run places check
        run: |
          if [ -f scripts/check-places.sh ]; then
            bash scripts/check-places.sh
          else
            echo "scripts/check-places.sh not found; using inline places checks"
            node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function readJson(file) {
            try { return JSON.parse(fs.readFileSync(file, 'utf8')); }
            catch (error) {
              console.error(`JSON parse failed: ${file}`);
              console.error(error.message);
              process.exit(1);
            }
          }
          const manifestPath = 'data/places/manifest.json';
          const placesIndexPath = 'data/places/places_index.json';
          const manifest = readJson(manifestPath);
          if (!manifest || !Array.isArray(manifest.files)) {
            console.error(`${manifestPath} must contain a files array`);
            process.exit(1);
          }
          const files = [manifestPath, placesIndexPath, ...manifest.files.map((file) => path.join('data', file))];
          for (const file of files) {
            if (!fs.existsSync(file)) {
              console.error(`Missing expected file: ${file}`);
              process.exit(1);
            }
            readJson(file);
          }
          console.log(`json ok (${files.length} files)`);
          NODE
            npm run places:index:build
            npm run build:tools
            npm run places:index:check
            npm run places:emner:check
            npm run places:coords:check
          fi
