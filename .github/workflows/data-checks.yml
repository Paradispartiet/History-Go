name: Data checks

on:
  pull_request:
    paths:
      - '.github/workflows/data-checks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize_aulestad_diff:
    name: Normalize Aulestad aggregate diff
    if: github.head_ref == 'agent/people-aulestad-bjornson-batch1-v4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/people-aulestad-bjornson-batch1-v4
          fetch-depth: 0
      - name: Restore main formatting and replace only Bjørnson object
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          target = 'data/people/litteratur/oslo/people_litteratur_oslo.json'
          target_id = 'bjornstjerne_bjornson'
          path = Path(target)

          current_data = json.loads(path.read_text())
          current_obj = next((row for row in current_data if row.get('id') == target_id), None)
          if current_obj is None:
              raise SystemExit(f'Missing {target_id} in current branch')

          original = subprocess.check_output(
              ['git', 'show', f'origin/main:{target}'],
              text=True,
          )
          decoder = json.JSONDecoder()
          pos = original.index('[') + 1
          start = end = None
          while True:
              while pos < len(original) and (original[pos].isspace() or original[pos] == ','):
                  pos += 1
              if pos >= len(original) or original[pos] == ']':
                  break
              obj, obj_end = decoder.raw_decode(original, pos)
              if isinstance(obj, dict) and obj.get('id') == target_id:
                  start, end = pos, obj_end
                  break
              pos = obj_end

          if start is None:
              raise SystemExit(f'Missing {target_id} in origin/main')

          lines = json.dumps(current_obj, ensure_ascii=False, indent=2).splitlines()
          replacement = lines[0]
          if len(lines) > 1:
              replacement += '\n' + '\n'.join('  ' + line for line in lines[1:])
          updated = original[:start] + replacement + original[end:]
          json.loads(updated)
          path.write_text(updated)
          PY
          git diff --check
      - name: Publish normalized data commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/data-checks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No normalization change required'; exit 0; }
          git commit -m "Normalize Aulestad Bjørnson aggregate diff"
          git push --force-with-lease origin HEAD:agent/people-aulestad-bjornson-batch1-v4
