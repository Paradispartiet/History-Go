name: Data checks

on:
  pull_request:
    paths:
      - 'data/people/**'
      - 'data/places/**'
      - 'scripts/check-people.sh'
      - 'scripts/check-places.sh'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.tools*.json'
      - '.github/workflows/data-checks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  people:
    name: People data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run people check
        run: bash scripts/check-people.sh

  places:
    name: Places data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run places check
        run: |
          if [ -f scripts/check-places.sh ]; then
            bash scripts/check-places.sh
          else
            echo "scripts/check-places.sh not found; using inline places checks"
            node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function readJson(file) {
            try { return JSON.parse(fs.readFileSync(file, 'utf8')); }
            catch (error) {
              console.error(`JSON parse failed: ${file}`);
              console.error(error.message);
              process.exit(1);
            }
          }
          const manifestPath = 'data/places/manifest.json';
          const placesIndexPath = 'data/places/places_index.json';
          const manifest = readJson(manifestPath);
          if (!manifest || !Array.isArray(manifest.files)) {
            console.error(`${manifestPath} must contain a files array`);
            process.exit(1);
          }
          const files = [manifestPath, placesIndexPath, ...manifest.files.map((file) => path.join('data', file))];
          for (const file of files) {
            if (!fs.existsSync(file)) {
              console.error(`Missing expected file: ${file}`);
              process.exit(1);
            }
            readJson(file);
          }
          console.log(`json ok (${files.length} files)`);
          NODE
            npm run places:index:build
            npm run build:tools
            npm run places:index:check
            npm run places:emner:check
            npm run places:coords:check
          fi

  etne-sport-batch4-integration:
    name: Etne sport batch 4 integration
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/etne-sport-batch-4' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Etne sport batch 4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/etne-sport-batch-4
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: bash
        run: |
          mkdir -p reports/etne-sport-batch-4-integration
          npm install --no-audit --no-fund 2>&1 | tee reports/etne-sport-batch-4-integration/npm-install.txt

      - name: Register source in places manifest
        shell: bash
        run: |
          node <<'NODE' 2>&1 | tee reports/etne-sport-batch-4-integration/manifest-update.txt
          const fs = require('fs');
          const manifestPath = 'data/places/manifest.json';
          const sourcePath = 'places/sport/vestland/etne/skanevik_skytebane.json';
          const sourceFile = `data/${sourcePath}`;
          JSON.parse(fs.readFileSync(sourceFile, 'utf8'));
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (!manifest || !Array.isArray(manifest.files)) throw new Error('manifest files array missing');
          const before = manifest.files.filter((row) => row === sourcePath).length;
          if (before === 0) manifest.files.push(sourcePath);
          const after = manifest.files.filter((row) => row === sourcePath).length;
          if (after !== 1) throw new Error(`${sourcePath}: manifest count ${after}`);
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest)}\n`);
          console.log(`PASS ${sourcePath}: exactly once in manifest`);
          NODE

      - name: Run place validation and rebuild runtime index
        shell: bash
        run: |
          bash scripts/check-places.sh 2>&1 | tee reports/etne-sport-batch-4-integration/check-places.txt

      - name: Run split manifest audit
        shell: bash
        run: |
          npm run audit:places-split-manifest-sync 2>&1 | tee reports/etne-sport-batch-4-integration/split-manifest-sync.txt

      - name: Run coordinate quality gate
        shell: bash
        run: |
          npm run places:coords:quality 2>&1 | tee reports/etne-sport-batch-4-integration/coordinate-quality.txt

      - name: Run targeted runtime validation
        shell: bash
        run: |
          node <<'NODE' 2>&1 | tee reports/etne-sport-batch-4-integration/targeted-validation.txt
          const fs = require('fs');
          const id = 'skanevik_skytebane';
          const rows = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const list = Array.isArray(rows) ? rows : (rows.places || []);
          const matches = list.filter((row) => row.id === id);
          if (matches.length !== 1) throw new Error(`${id}: active runtime count ${matches.length}`);
          const row = matches[0];
          if (row.category !== 'sport') throw new Error(`${id}: category ${row.category}`);
          if (Math.abs(Number(row.lat) - 59.72357) > 1e-7 || Math.abs(Number(row.lon) - 5.90141) > 1e-7) {
            throw new Error(`${id}: source/index coordinate mismatch ${row.lat}, ${row.lon}`);
          }
          const counts = new Map();
          for (const item of list) counts.set(item.id, (counts.get(item.id) || 0) + 1);
          const duplicates = [...counts.entries()].filter(([, count]) => count > 1);
          if (duplicates.length) throw new Error(`global duplicate active place IDs: ${duplicates.length}`);
          console.log(`PASS ${id}: exactly one active runtime row`);
          console.log(`PASS ${id}: source/index coordinate parity`);
          console.log('PASS global duplicate active place IDs: 0');
          NODE

      - name: Audit physical anchor distinctions
        shell: bash
        run: |
          node <<'NODE' 2>&1 | tee reports/etne-sport-batch-4-integration/anchor-audit.txt
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const list = Array.isArray(rows) ? rows : (rows.places || []);
          const need = (id) => {
            const row = list.find((item) => item.id === id);
            if (!row) throw new Error(`Missing runtime row: ${id}`);
            return row;
          };
          const hav = (a, b) => {
            const R = 6371;
            const rad = (x) => x * Math.PI / 180;
            const dLat = rad(b.lat - a.lat);
            const dLon = rad(b.lon - a.lon);
            const q = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(q));
          };
          const range = need('skanevik_skytebane');
          const idrett = need('skanevik_idrettsanlegg');
          const disc = need('skanevik_discgolf');
          const skate = need('skanevik_skatepark');
          const distances = {
            idrett: hav(range, idrett),
            disc: hav(range, disc),
            skate: hav(range, skate),
          };
          for (const [key, value] of Object.entries(distances)) {
            if (value < 0.1) throw new Error(`Skånevik skytebane anchor too close to ${key}: ${value.toFixed(3)} km`);
          }
          console.log(`PASS Skånevik skytebane ↔ idrettsanlegg: ${distances.idrett.toFixed(3)} km`);
          console.log(`PASS Skånevik skytebane ↔ discgolf: ${distances.disc.toFixed(3)} km`);
          console.log(`PASS Skånevik skytebane ↔ skatepark: ${distances.skate.toFixed(3)} km`);
          NODE

      - name: Check diff whitespace
        shell: bash
        run: |
          git diff --check 2>&1 | tee reports/etne-sport-batch-4-integration/git-diff-check.txt

      - name: Restore CI and commit integrated batch
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/data-checks.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/data-checks.yml data/places/sport/vestland/etne/skanevik_skytebane.json data/places/manifest.json data/places/places_index.json reports/etne-sport-batch-4-research.md reports/etne-sport-batch-4-integration
          git commit -m 'Integrate Etne sport batch 4'
          git push origin HEAD:agent/etne-sport-batch-4
