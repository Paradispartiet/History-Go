name: Data checks

on:
  pull_request:
    paths:
      - 'scripts/st-hallvard-kirke-kloster-people-finalizer.mjs'
      - '.github/workflows/data-checks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize_st_hallvard:
    name: Materialize St. Hallvard people
    if: github.head_ref == 'agent/people-st-hallvard-kirke-kloster-batch1'
    runs-on: ubuntu-latest
    steps:
      - name: Clone St. Hallvard branch quietly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth=1 --branch agent/people-st-hallvard-kirke-kloster-batch1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" . \
            >/dev/null 2>&1

      - name: Run canonical materializer gate
        run: node scripts/st-hallvard-kirke-kloster-people-finalizer.mjs > /tmp/st-hallvard-materializer.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies quietly
        run: npm install --no-audit --no-fund >/dev/null 2>&1

      - name: Regenerate Civication history people index
        run: npm run civication:history-people:build >/dev/null

      - name: Validate People of Places
        shell: bash
        run: |
          set +e
          bash scripts/check-people.sh > /tmp/st-hallvard-people-check.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- people check failure tail ---"
            tail -80 /tmp/st-hallvard-people-check.log
            exit "$status"
          fi
          tail -30 /tmp/st-hallvard-people-check.log

      - name: Publish clean data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main:refs/remotes/origin/main >/dev/null 2>&1
          git checkout origin/main -- \
            .github/workflows/data-checks.yml \
            reports/people-invalid-place-refs.json \
            reports/people-invalid-place-refs.md \
            reports/people-of-places-status.json \
            reports/people-of-places-status.md \
            reports/people-place-coverage.json \
            reports/people-place-coverage.md
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add St. Hallvard kirke og kloster people batch 1"
          git push origin HEAD:agent/people-st-hallvard-kirke-kloster-batch1
