name: Temporary Oslo desc batch 11

on:
  push:
    branches:
      - agent/oslo-desc-popup-v3-batch11

permissions:
  contents: write

jobs:
  revise-place-descriptions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-desc-popup-v3-batch11
          fetch-depth: 0

      - name: Update four remaining Oslo place descriptions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          updates = {
              "data/places/by/oslo/places/torggata.json": {
                  "desc": "Torggata fikk navneformen Torvegaden i 1852 og går fra Stortorvet til Ankertorget. Langs løpet ligger Eldorado i Torggata 9 og det tidligere Torggata bad i nummer 16. Teater, kino, badeanstalt, konsertscener, butikker og nyere gateombygging har satt ulike tidslag i samme sentrumsgate.",
                  "popupDesc": "Torggata har båret dagens navn siden navneformen Torvegaden ble innført i 1852. Gaten går fra Stortorvet til Ankertorget og rommer flere konkrete institusjonshistorier. Eldorado i Torggata 9 åpnet som varietéteater i 1891, huset Fahlstrøms Theater fra 1903 til 1911 og var kino fra 1911 til 2012. I 1929 ble den Norges første lydfilmkino, før lokalet ble bokhandel i 2013. Torggata bad i nummer 16 hadde badeanstalt fra 1861 til 1980. Den nåværende nyklassisistiske bygningen ble oppført i etapper fra 1925 til 1932 og fikk senere Rockefeller, John Dee og andre publikumsfunksjoner. Også selve gaten er ombygd, med gågate, gang- og sykkelprioritering, serveringssoner og mindre biltrafikk. Torggata samler dermed handel, teater, film, folkehelse, livemusikk og gateplanlegging i ett sammenhengende løp.",
              },
              "data/places/by/oslo/places/bispelokket.json": {
                  "desc": "Bispelokket åpnet i 1966 som et treplans veiknutepunkt mellom E18, Bispegata og Nylandsveien. Ramper og broer førte biltrafikken over Bjørvika fram til Bjørvikatunnelen flyttet E18 under bakken. Trafikkmaskinen ble revet i 2011, og arealet inngikk i den nye gate- og byromsstrukturen mot fjorden.",
                  "popupDesc": "Bispelokket ble bygd som del av den vestlige Bispegata i 1960-årene og åpnet i 1966. Anlegget koblet E18, Bispegata og Nylandsveien gjennom ramper, broer og flere trafikknivåer. Bilene kunne passere krysset uten vanlige gatekryss, men konstruksjonen la en stor betongstruktur mellom sentrum, jernbaneområdet og fjorden. Da E18 ble lagt i Bjørvikatunnelen i 2010, mistet Bispelokket hovedfunksjonen sin. Trafikkmaskinen ble revet i 2011, og den vestlige delen av Bispegata vek plass for Dronning Eufemias gate og den videre utbyggingen av Bjørvika. I 2020 åpnet trikkelinjen gjennom Dronning Eufemias gate og Bispegata. På samme sted fulgte dermed tre tydelige infrastrukturfaser etter hverandre: den åpne bygaten, etterkrigstidens planskilte bilsystem og en ny byakse med trikk, ganglinjer og fjordvendt bebyggelse.",
              },
              "data/places/by/oslo/places/ring_3.json": {
                  "desc": "Ring 3 ble planlagt i generalplanen for Oslo–Aker–Bærum i 1934 og stukket ut i 1945. Den ytre ringveien går fra Ryen via Bryn, Økern, Sinsen, Storo, Tåsen, Ullevål, Smestad og Ullern til E18 ved Fornebukrysset. Traseen er både fordelingsåre, tunnelkjede og fysisk barriere.",
                  "popupDesc": "Ring 3, også kalt Store Ringvei, ble planlagt i 1934 og stukket ut i 1945. Veien går fra Ryen gjennom Bryn, Økern, Sinsen, Storo, Tåsen, Ullevål, Smestad og Ullern før den møter E18 ved Fornebukrysset. Mellom Ryen og Ulven inngår traseen i E6, mens strekningen videre mot Bærums grense er riksvei 150. De opprinnelige kryssene lå i samme plan som lokaltrafikken. Etter hvert ble flere bygd om med tunneler og planskilte løsninger: Bryn i 1969, Smestad i 1983, Ullern og Granfosstunnelen i 1992, Storo i 1994, Tåsen i 1999 og Løren i 2013. Nydalsbroen over Akerselva er fra 1986. Ring 3 binder de store innfartsveiene sammen og fordeler trafikk mellom bydeler, men brede kjørebaner, støyskjermer, ramper og tunneler viser også hvor mye areal en slik forbindelse krever.",
              },
              "data/places/by/oslo/places/storgata.json": {
                  "desc": "Storgata er en av Oslos eldste gater og var hovedinnfartsåre gjennom forstedene utenfor byvollen. Da Nybrua stod ferdig i 1827, ble gaten opparbeidet helt fram til Akerselva. Siden trikkens barndom har spor, holdeplasser, handel og håndverk gjort løpet mellom Kirkeristen og Nybrua til en arbeidende sentrumsgate.",
                  "popupDesc": "Storgata går fra Dronningens gate ved Kirkeristen til Nybrua. På 1700-tallet lå gaten utenfor byvollen og førte trafikken fra Vaterlands bru gjennom forstedene mot Store Voldport. Den nordlige delen fantes som vei til løkkeeiendommene, men først da Nybrua stod ferdig i 1827, ble Storgata opparbeidet helt fram til Akerselva. Selskabet for Christiania Byes Vel bidro til arbeidet og bekostet beplantning langs den nye delen. Handel og håndverk etablerte seg tidlig langs innfartsåren. Senere ble Storgata en hovedgate for sporveien, med linjer til blant annet Gamlebyen, Vålerenga, Kampen, Sinsen, Sagene og Grefsen. Trikken følger fortsatt gaten mellom butikkfronter, sidegater og holdeplasser. Storgata er derfor ikke bare en transportkorridor: veiforlengelsen fra 1827, forstadshandelen og mer enn hundre års sporveishistorie ligger samlet i det samme gateløpet.",
              },
          }

          for filename, fields in updates.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for key, value in fields.items():
                  pattern = re.compile(rf'(?m)^(\s*"{re.escape(key)}":\s*)("(?:[^"\\]|\\.)*")(,?)$')
                  replacement = json.dumps(value, ensure_ascii=False)
                  text, count = pattern.subn(lambda match: match.group(1) + replacement + match.group(3), text, count=1)
                  if count != 1:
                      raise RuntimeError(f"Expected exactly one top-level {key} line in {filename}, found {count}")
              path.write_text(text, encoding="utf-8")

          Path(".github/workflows/tmp-oslo-desc-batch11.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Revider fire siste Oslo desc og popupDesc"
          git push origin HEAD:agent/oslo-desc-popup-v3-batch11
