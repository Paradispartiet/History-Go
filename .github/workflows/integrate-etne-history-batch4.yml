name: Integrate Etne history batch 4

on:
  push:
    branches:
      - agent/etne-historie-batch-4

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip etne integration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-historie-batch-4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          set -o pipefail
          mkdir -p reports/etne-historie-batch-4-integration
          npm install --no-audit --no-fund 2>&1 | tee reports/etne-historie-batch-4-integration/npm-install.txt
      - name: Register source files
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee reports/etne-historie-batch-4-integration/manifest-update.txt
          const fs = require('fs');
          const file = 'data/places/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const wanted = [
            'places/historie/vestland/etne/sorheimsmoen_gravfelt.json',
            'places/historie/vestland/etne/grindheimsveien_nord_gravfelt.json',
            'places/historie/vestland/etne/steine_heio_bygdeborg.json',
            'places/historie/vestland/etne/tesdal_gravfelt.json',
            'places/historie/vestland/etne/etnesjoen_forromersk_landsby.json'
          ];
          for (const entry of wanted) if (!manifest.files.includes(entry)) manifest.files.push(entry);
          for (const entry of wanted) {
            const count = manifest.files.filter((x) => x === entry).length;
            if (count !== 1) throw new Error(`${entry}: expected exactly once, got ${count}`);
            console.log(`PASS manifest ${entry}`);
          }
          fs.writeFileSync(file, JSON.stringify(manifest) + '\n');
          NODE
      - name: Spatial anchor checks
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee reports/etne-historie-batch-4-integration/spatial-anchor-check.txt
          const fs = require('fs');
          const load = (name) => JSON.parse(fs.readFileSync(`data/places/historie/vestland/etne/${name}.json`, 'utf8'));
          const R = 6371;
          const rad = (x) => x * Math.PI / 180;
          const dist = (a, b) => {
            const p1 = rad(a.lat), p2 = rad(b.lat);
            const dp = rad(b.lat - a.lat), dl = rad(b.lon - a.lon);
            const h = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
            return 2 * R * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
          };
          const steine = load('steine_heio_bygdeborg');
          const controls = [
            [load('sorheimsmoen_gravfelt'), 1.5, 1.9, 'Sørheimsmoen'],
            [load('grindheimsveien_nord_gravfelt'), 1.4, 1.9, 'Grindheimsvegen'],
            [load('tesdal_gravfelt'), 2.2, 2.7, 'Tesdal']
          ];
          for (const [point, min, max, label] of controls) {
            const km = dist(steine, point);
            if (km < min || km > max) throw new Error(`Steine-Heio distance to ${label} ${km.toFixed(3)} km outside ${min}-${max}`);
            console.log(`PASS Steine-Heio ↔ ${label}: ${km.toFixed(3)} km`);
          }
          const village = load('etnesjoen_forromersk_landsby');
          const gjerde = JSON.parse(fs.readFileSync('data/places/historie/vestland/etne/gjerde_kyrkje_etne.json', 'utf8'));
          const villageToGjerde = dist(village, gjerde);
          if (villageToGjerde > 1.0) throw new Error(`Etnesjøen anchor too far from Gjerde/Skjensvoll landscape: ${villageToGjerde.toFixed(3)} km`);
          console.log(`PASS Etnesjøen representative anchor ↔ Gjerde kyrkje: ${villageToGjerde.toFixed(3)} km`);
          NODE
      - name: Build and validate
        run: |
          set -o pipefail
          bash scripts/check-places.sh 2>&1 | tee reports/etne-historie-batch-4-integration/check-places.txt
          npm run audit:places-split-manifest-sync 2>&1 | tee reports/etne-historie-batch-4-integration/split-manifest-sync.txt
          npm run places:coords:quality 2>&1 | tee reports/etne-historie-batch-4-integration/coordinate-quality.txt
          node <<'NODE' 2>&1 | tee reports/etne-historie-batch-4-integration/targeted-validation.txt
          const fs = require('fs');
          const index = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const ids = ['sorheimsmoen_gravfelt','grindheimsveien_nord_gravfelt','steine_heio_bygdeborg','tesdal_gravfelt','etnesjoen_forromersk_landsby'];
          for (const id of ids) {
            const count = index.filter((x) => x.id === id).length;
            if (count !== 1) throw new Error(`${id}: expected one runtime row, got ${count}`);
            console.log(`PASS ${id}: exactly one active runtime row`);
          }
          const seen = new Set(), dup = new Set();
          for (const row of index) { if (seen.has(row.id)) dup.add(row.id); seen.add(row.id); }
          if (dup.size) throw new Error(`duplicate active IDs: ${[...dup].join(', ')}`);
          console.log('PASS global duplicate active place IDs: 0');
          NODE
          git diff --check 2>&1 | tee reports/etne-historie-batch-4-integration/git-diff-check.txt
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/integrate-etne-history-batch4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/manifest.json data/places/places_index.json reports/etne-historie-batch-4-integration .github/workflows/integrate-etne-history-batch4.yml
          git commit -m 'Integrate Etne history batch 4 [skip etne integration]'
          git push origin HEAD:agent/etne-historie-batch-4
