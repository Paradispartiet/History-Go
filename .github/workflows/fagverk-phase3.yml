name: Fagverk Phase 3 registry gate

on:
  pull_request:
    paths:
      - 'fagverk.html'
      - 'fagverk-forside.html'
      - 'data/categories/category_contract.json'
      - 'data/fag/fag_manifest.json'
      - 'data/fag/kunst/**'
      - 'data/fag/media/**'
      - 'data/fag/sport/**'
      - 'data/fag/filosofi/**'
      - 'data/fag/scenekunst/**'
      - 'data/fagverk/kunst/**'
      - 'data/fagverk/media/**'
      - 'data/fagverk/sport/**'
      - 'data/fagverk/filosofi/**'
      - 'data/fagverk/scenekunst/**'
      - 'data/badges/kunst.json'
      - 'data/badges/media.json'
      - 'data/badges/sport.json'
      - 'data/badges/filosofi.json'
      - 'data/badges/scenekunst.json'
      - 'js/fagverk-subject-core.js'
      - 'js/fagverk-subject-model.js'
      - 'js/fagverk.js'
      - 'scripts/audit-fagverk-subject-inventory.mjs'
      - 'scripts/audit-fagverk-general-engine.mjs'
      - 'scripts/audit-fagverk-*-phase3.mjs'
      - 'scripts/audit-fagverk-kunst-complete.mjs'
      - 'scripts/materialize-sport-complete.mjs'
      - 'scripts/build-fagverk-release-manifest.mjs'
      - 'scripts/run-fagverk-phase3-ci-v1.mjs'
      - 'tools/audit-kunst-theory-integrity.mjs'
      - 'tools/audit-sport-theory-integrity.mjs'
      - 'tools/audit-filosofi-theory-integrity.mjs'
      - 'tests/fagverk-subject-inventory.test.mjs'
      - 'tests/fagverk-general-engine.test.mjs'
      - 'tests/fagverk-kunst-*.test.mjs'
      - 'tests/kunst-theory-integrity.test.mjs'
      - 'tests/fagverk-media-*.test.mjs'
      - 'tests/fagverk-sport-*.test.mjs'
      - 'tests/sport-theory-integrity.test.mjs'
      - 'tests/fagverk-filosofi-*.test.mjs'
      - 'tests/filosofi-theory-integrity.test.mjs'
      - 'tests/fagverk-scenekunst-*.test.mjs'
      - 'tests/fagverk-release-manifest.test.mjs'
      - 'reports/filosofi-final-quality-qa.md'
      - '.github/ci/fagverk-phase3-registry-v1.json'
      - '.github/workflows/fagverk-phase3.yml'
  push:
    branches: [main]
    paths:
      - 'data/fag/kunst/**'
      - 'data/fag/media/**'
      - 'data/fag/sport/**'
      - 'data/fag/filosofi/**'
      - 'data/fag/scenekunst/**'
      - 'data/fagverk/kunst/**'
      - 'data/fagverk/media/**'
      - 'data/fagverk/sport/**'
      - 'data/fagverk/filosofi/**'
      - 'data/fagverk/scenekunst/**'
      - 'data/badges/kunst.json'
      - 'data/badges/media.json'
      - 'data/badges/sport.json'
      - 'data/badges/filosofi.json'
      - 'data/badges/scenekunst.json'
      - 'scripts/audit-fagverk-subject-inventory.mjs'
      - 'scripts/audit-fagverk-general-engine.mjs'
      - 'scripts/audit-fagverk-*-phase3.mjs'
      - 'scripts/audit-fagverk-kunst-complete.mjs'
      - 'scripts/materialize-sport-complete.mjs'
      - 'scripts/build-fagverk-release-manifest.mjs'
      - 'scripts/run-fagverk-phase3-ci-v1.mjs'
      - 'tools/audit-kunst-theory-integrity.mjs'
      - 'tools/audit-sport-theory-integrity.mjs'
      - 'tools/audit-filosofi-theory-integrity.mjs'
      - 'tests/fagverk-kunst-*.test.mjs'
      - 'tests/kunst-theory-integrity.test.mjs'
      - 'tests/fagverk-media-*.test.mjs'
      - 'tests/fagverk-sport-*.test.mjs'
      - 'tests/sport-theory-integrity.test.mjs'
      - 'tests/fagverk-filosofi-*.test.mjs'
      - 'tests/filosofi-theory-integrity.test.mjs'
      - 'tests/fagverk-scenekunst-*.test.mjs'
      - 'tests/fagverk-release-manifest.test.mjs'
      - 'reports/filosofi-final-quality-qa.md'
      - '.github/ci/fagverk-phase3-registry-v1.json'
      - '.github/workflows/fagverk-phase3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fagverk-phase3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate affected Phase 3 subjects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run shared gates once and affected subject gates
        env:
          FAGVERK_PHASE3_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FAGVERK_PHASE3_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/run-fagverk-phase3-ci-v1.mjs
