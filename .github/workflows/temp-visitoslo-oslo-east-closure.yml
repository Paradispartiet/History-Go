name: Temporary VisitOSLO Oslo East closure audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  close-audit:
    if: github.head_ref == 'audit/visitoslo-oslo-east-closure-20260720'
    runs-on: ubuntu-latest
    steps:
      - name: Check out closure branch
        uses: actions/checkout@v4
        with:
          ref: audit/visitoslo-oslo-east-closure-20260720
          fetch-depth: 0

      - name: Verify all 30 source entries against current runtime index
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const rows = [
            { sourceName: 'Tøyenbadet', resolution: 'canonical_place', placeId: 'toyenbadet' },
            { sourceName: 'EKT Rideskole og Husdyrpark', resolution: 'canonical_place', placeId: 'ekt_rideskole_husdyrpark' },
            { sourceName: 'Naturhistorisk museum', resolution: 'canonical_place', placeId: 'naturhistorisk_museum' },
            { sourceName: 'Ekebergparken skulpturpark', resolution: 'canonical_place', placeId: 'ekebergparken' },
            { sourceName: 'Ekebergparken museum', resolution: 'canonical_place', placeId: 'ekebergparken_museum' },
            { sourceName: 'Middelalder-Oslo', resolution: 'canonical_place', placeId: 'middelalder_oslo' },
            { sourceName: 'Ekebergsletta parkrun', resolution: 'activity_covered_by_existing_place', placeId: 'ekebergsletta', note: 'Recurring parkrun activity is covered by the stable physical place Ekebergsletta; no separate event-place marker is created.' },
            { sourceName: 'Oslo ladegård', resolution: 'canonical_place', placeId: 'oslo_ladegard' },
            { sourceName: 'Kunsthall Oslo', resolution: 'canonical_place', placeId: 'kunsthall_oslo' },
            { sourceName: 'Gamlebyen kirke', resolution: 'canonical_place', placeId: 'gamlebyen_kirke', note: 'Corrected stale audit scope: the active church is a distinct physical place from the broader oslo_hospital complex.' },
            { sourceName: 'St. Hallvard kirke', resolution: 'canonical_place', placeId: 'st_hallvard_kirke_kloster' },
            { sourceName: 'Jordal skøytebane', resolution: 'activity_use_of_canonical_place', placeId: 'jordal_ungdomshall', note: 'Corrected stale audit scope: VisitOSLO public skating is a use of Jordal ungdomshall, not Jordal Amfi and not a separate third ice venue.' },
            { sourceName: 'Arbeiderbolig i Tøyengata 38', resolution: 'canonical_place', placeId: 'museumsleiligheten_grabein' },
            { sourceName: 'Sykkelrute: Utsiktspunkt Ekeberg', resolution: 'activity_itinerary_not_canonical_place', placeId: null, note: 'This source entry is a cycling itinerary to a viewpoint, not a stable physical attraction named “Sykkelrute”. No pseudo-place is created in this bounded pass.' },
            { sourceName: 'Mariakirkeruinen', resolution: 'canonical_place', placeId: 'mariakirken_ruin_oslo' },
            { sourceName: 'Kampen Økologiske Barnebondegård', resolution: 'canonical_place', placeId: 'kampen_okologiske_barnebondegard' },
            { sourceName: 'Helleristningene på Ekeberg', resolution: 'canonical_place', placeId: 'ekeberg_helleristninger' },
            { sourceName: 'Tøyen hovedgård', resolution: 'canonical_place', placeId: 'toyen_hovedgard' },
            { sourceName: 'Grønland kirke', resolution: 'canonical_place', placeId: 'gronland_kirke' },
            { sourceName: 'Vålerenga kirke', resolution: 'canonical_place', placeId: 'valerenga_kirke' },
            { sourceName: 'Klimahuset', resolution: 'canonical_place', placeId: 'klimahuset' },
            { sourceName: 'KÖSK', resolution: 'canonical_place', placeId: 'kosk_oslo' },
            { sourceName: 'Clemenskirkeruinen', resolution: 'canonical_place', placeId: 'clemenskirken_ruin_oslo' },
            { sourceName: 'FRIGO - Friluftssenter', resolution: 'canonical_place', placeId: 'frigo_friluftssenteret' },
            { sourceName: 'Galleri Mini', resolution: 'canonical_place', placeId: 'galleri_mini_oslo' },
            { sourceName: 'Brannmuseet i Oslo', resolution: 'canonical_place', placeId: 'brannmuseet_oslo' },
            { sourceName: 'Central Jam-e-Mosque', resolution: 'canonical_place', placeId: 'central_jam_e_mosque' },
            { sourceName: 'Biblo Tøyen', resolution: 'canonical_place', placeId: 'biblo_toyen' },
            { sourceName: 'Sørenga', resolution: 'canonical_place', placeId: 'sorenga' },
            { sourceName: 'Van Etten', resolution: 'canonical_place', placeId: 'van_etten' }
          ];

          if (rows.length !== 30) throw new Error(`Expected 30 source rows, got ${rows.length}`);

          const index = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const byId = new Map(index.map(place => [place.id, place]));
          const unresolved = [];

          const resolvedRows = rows.map(row => {
            if (!row.placeId) {
              return { ...row, existsInRuntimeIndex: null, canonicalName: null, runtimeCategory: null };
            }
            const place = byId.get(row.placeId);
            if (!place) {
              unresolved.push({ sourceName: row.sourceName, expectedPlaceId: row.placeId });
              return { ...row, existsInRuntimeIndex: false, canonicalName: null, runtimeCategory: null };
            }
            return {
              ...row,
              existsInRuntimeIndex: true,
              canonicalName: place.name,
              runtimeCategory: place.category
            };
          });

          // Guard the two scope corrections that motivated the final completeness pass.
          const gamlebyen = byId.get('gamlebyen_kirke');
          const hospital = byId.get('oslo_hospital');
          const jordalYouth = byId.get('jordal_ungdomshall');
          const jordalAmfi = byId.get('jordal_amfi');
          if (!gamlebyen || !hospital || gamlebyen.id === hospital.id) throw new Error('Gamlebyen kirke / Oslo Hospital scope correction is not present as two distinct runtime places');
          if (gamlebyen.category !== 'religion') throw new Error(`Expected gamlebyen_kirke runtime category religion, got ${gamlebyen.category}`);
          if (!jordalYouth || !jordalAmfi || jordalYouth.id === jordalAmfi.id) throw new Error('Jordal ungdomshall / Jordal Amfi scope correction is not present as two distinct runtime places');
          if (jordalYouth.category !== 'sport') throw new Error(`Expected jordal_ungdomshall runtime category sport, got ${jordalYouth.category}`);

          const metrics = {
            sourceEntries: rows.length,
            resolvedToCanonicalPlaceOrArea: resolvedRows.filter(r => r.placeId && r.existsInRuntimeIndex).length,
            classifiedNonPlaceItineraries: resolvedRows.filter(r => r.resolution === 'activity_itinerary_not_canonical_place').length,
            unresolvedCanonicalGaps: unresolved.length,
            staleScopeCorrectionsClosed: 2
          };

          const closure = {
            version: '2026-07-20-current-main-closure',
            source: 'https://www.visitoslo.com/no/aktiviteter-og-attraksjoner/omraader/oslo-ost/attraksjoner/',
            status: unresolved.length === 0 ? 'closed' : 'blocked',
            metrics,
            corrections: [
              {
                sourceName: 'Gamlebyen kirke',
                oldStaleMatch: 'oslo_hospital',
                finalResolution: 'gamlebyen_kirke',
                reason: 'The church is a distinct active building and primary religious place within the broader historic hospital complex.'
              },
              {
                sourceName: 'Jordal skøytebane',
                oldStaleMatch: 'jordal_amfi',
                finalResolution: 'jordal_ungdomshall',
                reason: 'The VisitOSLO public-skating activity belongs to the separate youth ice hall, while Jordal Amfi remains a different arena.'
              }
            ],
            rows: resolvedRows,
            unresolved
          };

          const reportDir = 'reports/visitoslo-oslo-east-audit-20260720';
          fs.mkdirSync(reportDir, { recursive: true });
          fs.writeFileSync(path.join(reportDir, 'closure.json'), JSON.stringify(closure, null, 2) + '\n');

          const lines = [];
          lines.push('# VisitOSLO Oslo East — closure audit');
          lines.push('');
          lines.push('Date: 2026-07-20');
          lines.push('');
          lines.push('This is the current-main closure pass for the bounded 30-entry VisitOSLO Oslo East source audit. The old preliminary audit is superseded by this resolution table.');
          lines.push('');
          lines.push(`- Source entries: **${metrics.sourceEntries}**`);
          lines.push(`- Resolved to an existing canonical physical place/area: **${metrics.resolvedToCanonicalPlaceOrArea}**`);
          lines.push(`- Deliberately classified as non-place itinerary: **${metrics.classifiedNonPlaceItineraries}**`);
          lines.push(`- Unresolved canonical gaps: **${metrics.unresolvedCanonicalGaps}**`);
          lines.push('');
          lines.push('## Important stale-audit corrections');
          lines.push('');
          lines.push('- **Gamlebyen kirke** is now its own canonical active church place (`gamlebyen_kirke`), distinct from the broader historic `oslo_hospital` complex.');
          lines.push('- **Jordal skøytebane** is resolved to the public-skating use of `jordal_ungdomshall`, not `jordal_amfi` and not a third standalone venue.');
          lines.push('- **Ekebergsletta parkrun** remains an activity on the stable physical place `ekebergsletta`; no event pseudo-place is created.');
          lines.push('- **Sykkelrute: Utsiktspunkt Ekeberg** is a route/itinerary entry and is intentionally not materialized as a place named “Sykkelrute”.');
          lines.push('');
          lines.push('## Final resolution table');
          lines.push('');
          lines.push('| VisitOSLO source entry | Final classification | Canonical place | Runtime category | Status |');
          lines.push('| --- | --- | --- | --- | --- |');
          for (const row of resolvedRows) {
            const place = row.placeId ? `\`${row.placeId}\`` : '—';
            const category = row.runtimeCategory || '—';
            const status = row.placeId ? (row.existsInRuntimeIndex ? 'resolved' : 'MISSING') : 'intentionally_no_place';
            lines.push(`| ${row.sourceName} | ${row.resolution} | ${place} | ${category} | ${status} |`);
          }
          lines.push('');
          lines.push('## Closure rule');
          lines.push('');
          lines.push('The bounded source pass is closed only when every non-null expected canonical place ID exists in the current runtime index and every remaining source row has an explicit non-place classification. This audit satisfies that rule.');
          lines.push('');
          fs.writeFileSync(path.join(reportDir, 'CLOSURE.md'), lines.join('\n'));

          if (unresolved.length) {
            console.error(JSON.stringify({ metrics, unresolved }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({ status: closure.status, metrics }, null, 2));
          NODE

      - name: Commit closure report and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-visitoslo-oslo-east-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close VisitOSLO Oslo East 30-entry coverage audit"
          git push origin HEAD:audit/visitoslo-oslo-east-closure-20260720
