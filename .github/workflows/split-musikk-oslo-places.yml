name: Split Musikk Oslo places

on:
  push:
    branches:
      - data/split-musikk-oslo-places-20260708

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/split-musikk-oslo-places-20260708
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/split-musikk-oslo-places.mjs
      - run: git status --short
