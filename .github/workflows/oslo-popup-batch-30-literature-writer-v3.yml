name: One-time Oslo popup batch 30 literature writer v3

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/oslo-popup-batch-30-trigger-v3.txt

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-popup-v4-batch-30-literature-ten
          fetch-depth: 0
      - name: Materialize or diagnose Batch 30
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -u
          PLACE_FILES="data/places/litteratur/oslo/places_litteratur_oslo_bla_skilt_2026_batch_01/bla_skilt_stein_mehren_ullevalsveien_60.json data/places/litteratur/oslo/places_litteratur_oslo_kultureiendommer_batch_05/honse_lovisas_hus.json data/places/litteratur/oslo/places_litteratur/alexander_kiellands_plass.json data/places/litteratur/oslo/places_litteratur/biblo_toyen.json data/places/litteratur/oslo/places_litteratur/camilla_collett_statue.json data/places/litteratur/oslo/places_litteratur/deichman_grunerlokka.json data/places/litteratur/oslo/places_litteratur/eldorado_bokhandel.json data/places/litteratur/oslo/places_litteratur/gamle_deichman.json data/places/litteratur/oslo/places_litteratur/grotta.json data/places/litteratur/oslo/places_litteratur/henrik_wergeland_statue.json"
          REPORT_FILES="reports/oslo-place-description-scope-audit-2026-07-26.json reports/oslo-place-description-scope-audit-2026-07-26.md reports/place-description-revision-protocol.md"
          diagnose() {
            stage="$1"
            log_file="$2"
            STAGE="$stage" LOG_FILE="$log_file" node <<'NODE'
          const fs=require('fs');
          const stage=process.env.STAGE;
          const log=fs.existsSync(process.env.LOG_FILE)?fs.readFileSync(process.env.LOG_FILE,'utf8'):'missing log';
          fs.writeFileSync('.github/oslo-popup-batch-30-v3-diagnostic.json',JSON.stringify({stage,log:log.slice(-12000)},null,2)+'\n');
          NODE
            git restore $PLACE_FILES $REPORT_FILES 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/oslo-popup-batch-30-v3-diagnostic.json
            git commit -m "Diagnose isolated Batch 30 failure" || true
            git push origin HEAD:agent/oslo-popup-v4-batch-30-literature-ten
            exit 0
          }
          node .github/oslo-popup-batch-30-materialize.mjs > /tmp/materialize.log 2>&1 || diagnose materialize /tmp/materialize.log
          node tools/audit-oslo-place-description-scope.mjs --write > /tmp/audit.log 2>&1 || diagnose audit /tmp/audit.log
          node <<'NODE' > /tmp/validate.log 2>&1 || diagnose validate /tmp/validate.log
          const fs=require('fs');
          const p=fs.readFileSync('reports/place-description-revision-protocol.md','utf8');
          const a=fs.readFileSync('reports/oslo-place-description-scope-audit-2026-07-26.md','utf8');
          const checks={
            protocolTotal:p.includes('Ferdige etter alle mergede revisjonsbatcher: **249 steder**'),
            protocolRemaining:p.includes('Gjenstår: **263 steder**'),
            protocolLiterature:p.includes('- litteratur: **11**'),
            auditTotal:a.includes('IDs in the current revision protocol: **249**'),
            auditRemaining:a.includes('Additional active Oslo IDs outside the protocol: **263**'),
            auditLiterature:a.includes('| litteratur | 11 |')
          };
          console.log(JSON.stringify(checks,null,2));
          if(Object.values(checks).some(v=>!v))throw new Error('One or more closure checks failed');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $PLACE_FILES $REPORT_FILES
          git commit -m "Revise first Oslo literature descriptions"
          git push origin HEAD:agent/oslo-popup-v4-batch-30-literature-ten
