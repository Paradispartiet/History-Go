name: TEMP Civication Sport trainer materialize

on:
  push:
    branches:
      - agent/civication-sport-trener-rollout
    paths:
      - '.github/workflows/temp-civication-sport-trener-materialize.yml'
      - 'data/Civication/roleModels/sport/trener.json'
      - 'data/Civication/mailFamilies/sport/people/sport_trener_people.json'
      - 'tests/civication-sport-trener-rollout-playability.test.js'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-civication-sport-trener-materialize.yml'
      - 'data/Civication/roleModels/sport/trener.json'
      - 'data/Civication/mailFamilies/sport/people/sport_trener_people.json'
      - 'tests/civication-sport-trener-rollout-playability.test.js'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'push' || github.head_ref == 'agent/civication-sport-trener-rollout'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout locked source head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Materialize canonical projections
        run: |
          set -euo pipefail
          node -e "const x=require('./data/Civication/mailFamilies/sport/people/sport_trener_people.json'); console.log('trainer_people_before='+JSON.stringify({keys:Object.keys(x),families:Array.isArray(x.families)?x.families.length:null,family_mails:Array.isArray(x.families)?x.families.map(f=>Array.isArray(f.mails)?f.mails.length:null):null}))"
          node scripts/build-civication-scene-registry.mjs --write
          node -e "const x=require('./data/Civication/mailFamilies/sport/people/sport_trener_people.json'); console.log('trainer_people_after_builder='+JSON.stringify({keys:Object.keys(x),families:Array.isArray(x.families)?x.families.length:null,family_mails:Array.isArray(x.families)?x.families.map(f=>Array.isArray(f.mails)?f.mails.length:null):null}))"
          node scripts/audit-civication-career-gameplay.mjs --write
          node -e "const x=require('./data/Civication/mailFamilies/sport/people/sport_trener_people.json'); console.log('trainer_people_after_audit='+JSON.stringify({keys:Object.keys(x),families:Array.isArray(x.families)?x.families.length:null,family_mails:Array.isArray(x.families)?x.families.map(f=>Array.isArray(f.mails)?f.mails.length:null):null}))"
          node tests/civication-sport-trener-rollout-playability.test.js
          git diff --check

      - name: Commit generated projections only
        env:
          START_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | cut -f1)"
          if [ "$remote_sha" != "$START_SHA" ]; then
            echo "Branch moved from ${START_SHA} to ${remote_sha}; refusing stale materialization."
            exit 1
          fi
          git add data/Civication/compiledSceneRegistryV1.json data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md
          if git diff --cached --quiet; then
            echo "No projection changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize Sport trainer rollout projections"
          git push origin "HEAD:${BRANCH_NAME}"
