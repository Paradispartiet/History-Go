name: Science v5 - isolated candidate archive
on:
  push:
    branches:
      - science-v5-thread-relief-mobile-qa-20261112
    paths:
      - '.github/workflows/archive-vitenskap-v5-candidates.yml'
      - 'scripts/revise-vitenskap-v5-preview.py'
      - 'scripts/archive-vitenskap-v5-candidates.py'
permissions:
  contents: write
concurrency:
  group: science-v5-archive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  archive-candidates:
    if: ${{ github.ref == 'refs/heads/science-v5-thread-relief-mobile-qa-20261112' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: science-v5-thread-relief-mobile-qa-20261112
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image-processing requirements
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Generate v5 badge candidates without touching active files
        run: python scripts/revise-vitenskap-v5-preview.py
      - name: Archive immutable v5 files and mobile gallery on this branch only
        run: |
          python scripts/archive-vitenskap-v5-candidates.py
          git diff --exit-code -- data/badges/vitenskap.json bilder/merker/vitenskap/brodert/
          git add bilder/merker/vitenskap/kandidater/revisjoner/
          git add bilder/merker/vitenskap/kandidater/contact-sheet-v5-mobile.jpg
          git add data/badges/vitenskap_v5_candidates_20261112.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Science: archive 20 v5 visual candidates without activation"
            git push origin HEAD:science-v5-thread-relief-mobile-qa-20261112
          else
            echo "v5 archive already present, no changes"
          fi
