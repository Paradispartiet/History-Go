name: TEMP Civication Finance analyst materialize

on:
  push:
    branches:
      - agent/civication-finansanalytiker-rollout
    paths:
      - '.github/workflows/temp-civication-finansanalytiker-materialize.yml'
      - 'data/Civication/workGrammars/naeringsliv/finansanalytiker.json'
      - 'data/Civication/mailPlans/naeringsliv/finansanalytiker_plan.json'
      - 'data/Civication/mailFamilies/naeringsliv/**/finansanalytiker_*.json'
      - 'tests/civication-naeringsliv-finansanalytiker-rollout-playability.test.js'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout locked source head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Build and verify canonical projections
        run: |
          set -euo pipefail
          node scripts/build-civication-scene-registry.mjs --write
          node scripts/audit-civication-career-gameplay.mjs --write
          node tests/civication-naeringsliv-finansanalytiker-rollout-playability.test.js
          git diff --check

      - name: Commit projections on the locked branch
        env:
          START_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | cut -f1)"
          if [ "$remote_sha" != "$START_SHA" ]; then
            echo "Branch moved from ${START_SHA} to ${remote_sha}; refusing stale materialization."
            exit 1
          fi
          git add data/Civication/compiledSceneRegistryV1.json data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md
          if git diff --cached --quiet; then
            echo "No projection changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize Finance analyst career projections"
          git push origin "HEAD:${BRANCH_NAME}"
