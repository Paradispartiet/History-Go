name: Sentrum Scene scenario People one-time sync
on:
  push:
    branches:
      - content/sentrum-scene-v1-20261102
    paths:
      - .github/workflows/sentrum-scene-scenario-sync-onetime.yml
permissions:
  contents: write
concurrency:
  group: sentrum-scene-scenario-people-sync
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild scenario People from canonical Civication index
        run: |
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
      - name: Commit generated scenario People only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/scenarioPeople/generated data/Civication/scenarioPeople_index.json
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Sentrum Scene: sync Civication scenario People after profile deduplication"
            git restore .
            for attempt in 1 2 3; do
              git fetch origin content/sentrum-scene-v1-20261102
              git rebase origin/content/sentrum-scene-v1-20261102
              if git push origin HEAD:content/sentrum-scene-v1-20261102; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
