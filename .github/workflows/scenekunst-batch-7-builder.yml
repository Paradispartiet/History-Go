name: Scenekunst batch 7 builder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build clean Scenekunst batch 7 branch
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build final batch from exact addresses
        shell: bash
        run: |
          set -euo pipefail
          FINAL_BRANCH='agent/scenekunst-venues-07-final'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          BASE_SHA="$(git rev-parse origin/main)"
          git checkout -B "${FINAL_BRANCH}" "${BASE_SHA}"

          npm run build:tools

          cat > .tmp-build-scenekunst-batch7.mjs <<'NODE'
