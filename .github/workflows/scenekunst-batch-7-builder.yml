                    "Oppgraderingen viser hvordan eldre kulturhus må fornye teknikk, arbeidsforhold og tilgjengelighet uten å miste identiteten."
                  ],
                  "what_to_notice": [
                    "Sammenhengen mellom scene, sal og kino-/konsertfunksjoner.",
                    "Teaterparkens plass foran bygget, men som eget byrom.",
                    "Hvordan foajé, backstage og garderober er del av den sceniske infrastrukturen."
                  ],
                  "terms": [
                    "flerbruksscene",
                    "gjestespill",
                    "kommunal_kulturarena",
                    "sceneteknikk"
                  ],
                  "sources": [
                    "https://www.kongsvinger.kommune.no/kultur-idrett-fritid/kultur-og-aktivitetstilbud/radhus-teatret/",
                    "https://www.kongsvinger.kommune.no/nyhetsarkiv/radhus-teatret-far-et-etterlengtet-innvendig-loft"
                  ]
                }
              }
            }
          ];

          const norm = (value) => String(value ?? '')
            .normalize('NFC')
            .toUpperCase()
            .replace(/\s+/g, ' ')
            .trim();

          const displayCity = (value) => {
            const s = String(value ?? '').toLocaleLowerCase('nb-NO');
            return s.replace(/(^|[\s-])\p{L}/gu, (m) => m.toLocaleUpperCase('nb-NO'));
          };

          const existingIndex = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const existingIds = new Set(existingIndex.map((place) => place?.id).filter(Boolean));
          for (const candidate of candidates) {
            if (existingIds.has(candidate.id)) {
              throw new Error(`${candidate.id}: id already exists in canonical places index`);
            }
          }
          const coordinateResults = [];

          for (const candidate of candidates) {
            const result = await findNorwegianAddressCoordinate(candidate.query);
            if (!result.ok || result.status !== 'verified_candidate' || !result.coordinate) {
              throw new Error(`${candidate.id}: Geonorge lookup failed: ${JSON.stringify(result)}`);
            }

            const got = result.coordinate.address;
            const expected = candidate.expected;
            for (const key of ['street', 'number', 'postcode', 'city']) {
              if (norm(got[key]) !== norm(expected[key])) {
                throw new Error(`${candidate.id}: expected ${key}=${expected[key]}, got ${got[key]}`);
              }
            }

            const overlaps = existingIndex
              .filter((place) =>
                typeof place?.lat === 'number' &&
                typeof place?.lon === 'number' &&
                Math.abs(place.lat - result.coordinate.lat) < 1e-12 &&
                Math.abs(place.lon - result.coordinate.lon) < 1e-12
              )
              .map((place) => place.id);

            if (overlaps.length) {
              throw new Error(`${candidate.id}: exact coordinate overlaps existing canonical ids: ${overlaps.join(', ')}`);
            }

            const address = {
              ...result.coordinate.address,
              city: displayCity(result.coordinate.address.city),
            };

            const place = {
              ...candidate.base,
              lat: result.coordinate.lat,
              lon: result.coordinate.lon,
              coordType: 'address_point',
              coordStatus: 'verified',
              coordSource: 'geonorge_adresser_v1',
              coordSourceUrl: result.sourceUrl,
              coordVerifiedAt: '2026-07-23',
              coordNote: `Offisiell adressekoordinat fra Geonorge Adresser API for ${address.street} ${address.number}, ${address.city}. Punktet representerer den fysisk avgrensede scenekunstfunksjonen og brukes som display-marker.`,
              locatorType: 'building',
              sourceProvider: 'official_address',
              sourceObjectId: result.sourceObjectId,
              address,
              geocodeAccuracy: 'rooftop',
              coordRole: 'display_marker',
              coLocationAudit: {
                status: 'reviewed',
                nearbyCanonicalIds: overlaps,
                intentionalSharedAnchor: false,
                note: 'Ingen eksisterende canonical place-record deler det eksakte adressepunktet.',
              },
            };

            fs.mkdirSync(path.dirname(candidate.path), { recursive: true });
            fs.writeFileSync(candidate.path, JSON.stringify([place], null, 2) + '\n');

            coordinateResults.push({
              id: candidate.id,
              query: candidate.query,
              sourceUrl: result.sourceUrl,
              sourceObjectId: result.sourceObjectId,
              coordinate: { lat: result.coordinate.lat, lon: result.coordinate.lon },
              address,
              exactOverlapIds: overlaps,
              overlapDecision: 'no_overlap',
            });
          }

          const manifestPath = 'data/places/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          for (const candidate of candidates) {
            if (!manifest.files.includes(candidate.manifestPath)) manifest.files.push(candidate.manifestPath);
          }
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

          const generatedAt = new Date().toISOString();
          const report = {
            generatedAt,
            status: 'validated',
            category: 'scenekunst',
            batch: 'new_venues_7',
            baseCommit: 'current_main_manual_builder',
            addedPlaceIds: candidates.map((candidate) => candidate.id),
            sourceFiles: candidates.map((candidate) => candidate.manifestPath),
            officialInstitutionSources: Object.fromEntries(
              candidates.map((candidate) => [candidate.id, candidate.base.knowledge.sources])
            ),
            coordinateResults,
            physicalScopeDecisions: Object.fromEntries(
              candidates.map((candidate) => [candidate.id, candidate.base.physicalScope])
            ),
            validation: {
              geonorgeExactAddressLookup: 'pass',
              overlapAudit: 'pass',
              placesIndexBuild: 'pending',
              placesChecks: 'pending',
              categoryAudit: 'pending',
              fullRepositoryGates: 'pending',
            },
            validatedAt: generatedAt,
          };

          const reportJson = 'reports/scenekunst-new-venues-batch-7-2026-07-23.json';
          const reportMd = 'reports/scenekunst-new-venues-batch-7-2026-07-23.md';
          fs.writeFileSync(reportJson, JSON.stringify(report, null, 2) + '\n');

          const md = [
            '# Scenekunst – nye nasjonale steder, batch 7',
            '',
            `Generert: ${generatedAt}`,
            '',
            '## Nye steder',
            '',
            ...candidates.map((candidate) => `- \`${candidate.id}\` – ${candidate.base.name}`),
            '',
            '## Koordinater',
            '',
            ...coordinateResults.map((item) =>
              `- ${item.id}: ${item.address.street} ${item.address.number}, ${item.address.city} → \`${item.coordinate.lat}, ${item.coordinate.lon}\` (${item.sourceObjectId})`
            ),
            '',
            '## Fysisk avgrensning',
            '',
            ...candidates.map((candidate) => `- **${candidate.base.name}:** ${candidate.base.physicalScope}`),
            '',
            '## Valideringskrav',
            '',
            '- Eksakt Geonorge-adresse for alle fem steder',
            '- Ingen eksakte overlapper mot eksisterende canonical steder',
            '- Regenerert global place-indeks',
            '- Places- og People-kontroll',
            '- Kategori- og quiz-governance',
            '- Knowledge V2, Nature og Lesespor',
            '- `git diff --check`',
            '',
          ].join('\n');
          fs.writeFileSync(reportMd, md);
          NODE

          node .tmp-build-scenekunst-batch7.mjs
          rm .tmp-build-scenekunst-batch7.mjs
          npm run places:index:build

          bash scripts/check-places.sh
          bash scripts/check-people.sh
          npm run audit:categories
          npm run audit:quiz-templates
          npm run test:quiz-content-audit
          npm run build:tools
          node dist/tools/validate_nature_maps.mjs
          node dist/tools/validate_lesespor.mjs
          npm run typecheck:web
          npm run build:scripts
          npm run knowledge:canonical:check
          npm run knowledge:legacy:check
          npm run audit:knowledge
          npm run test:knowledge-v2
          node --test tests/knowledge-canonical-storage-contract.test.js
          git diff --check

          node <<'NODE'
          const fs = require('fs');
          const file = 'reports/scenekunst-new-venues-batch-7-2026-07-23.json';
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          report.validation.placesIndexBuild = 'pass';
          report.validation.placesChecks = 'pass';
          report.validation.categoryAudit = 'pass';
          report.validation.fullRepositoryGates = 'pass';
          report.validatedAt = new Date().toISOString();
          fs.writeFileSync(file, JSON.stringify(report, null, 2) + '\n');
          NODE

          git add \
            data/places/scenekunst/telemark/grenland_friteater.json \
            data/places/scenekunst/finnmark/samovarteateret_sor_varanger_kultursal.json \
            data/places/scenekunst/troms/radstua_teaterhus.json \
            data/places/scenekunst/innlandet/hamar_teater.json \
            data/places/scenekunst/innlandet/radhus_teatret_kongsvinger.json \
            reports/scenekunst-new-venues-batch-7-2026-07-23.json \
            reports/scenekunst-new-venues-batch-7-2026-07-23.md \
            data/places/manifest.json \
            data/places/places_index.json

          CHANGED_COUNT="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          if [ "${CHANGED_COUNT}" != "9" ]; then
            echo "Expected exactly 9 changed files, got ${CHANGED_COUNT}"
            git diff --cached --name-only
            exit 3
          fi

          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "${CURRENT_MAIN}" != "${BASE_SHA}" ]; then
            echo "main moved from ${BASE_SHA} to ${CURRENT_MAIN}; rerun the workflow"
            exit 2
          fi

          git commit -m 'Add seventh Scenekunst venue batch on current main'
          git push --force origin HEAD:"${FINAL_BRANCH}"
