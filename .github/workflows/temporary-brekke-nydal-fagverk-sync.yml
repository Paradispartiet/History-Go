name: Temporary Brekke Nydal Fagverk sync
on:
  push:
    branches:
      - content/akerselva-brekkedammen-nydalsdammen-fagverk-20261021
    paths:
      - .github/workflows/temporary-brekke-nydal-fagverk-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/akerselva-brekkedammen-nydalsdammen-fagverk-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Audit curated Fagverk and regenerate its published data
        run: |
          npm ci --no-audit --no-fund
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
          npm run place-open:build
          node --test tests/fagverk-place-pages.test.mjs tests/fagverk-place-rendering.test.mjs tests/fagverk-place-substance-audit.test.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run place-open:check
      - name: Save generated outputs
        shell: bash
        run: |
          git add -u -- \
            reports/fagverk/fagverk-place-page-coverage-v2.json \
            data/fagverk/fagverk_release.json \
            data/runtime/place-open
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(fagverk): build Brekkedammen and Nydalsdammen place learning'
          git pull --rebase origin content/akerselva-brekkedammen-nydalsdammen-fagverk-20261021
          git push origin HEAD:refs/heads/content/akerselva-brekkedammen-nydalsdammen-fagverk-20261021
