name: TEMP Scenekunst institusjonsledelse Role World materialization

on:
  push:
    branches:
      - agent/civication-scenekunst-institusjonsledelse-role-world-rollout
    paths:
      - scripts/TEMP-materialize-scenekunst-institusjonsledelse-role-world.mjs
      - .github/workflows/TEMP-scenekunst-institusjonsledelse-role-world-materialize.yml

permissions:
  contents: write

concurrency:
  group: temp-scenekunst-institusjonsledelse-role-world
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Author Role World and registrations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/TEMP-materialize-scenekunst-institusjonsledelse-role-world.mjs')
          s = p.read_text()
          old = 'const testSource = String.raw`'
          if old not in s:
              raise SystemExit('Expected TEMP quoting marker missing')
          p.write_text(s.replace(old, 'const testSource = `', 1))
          PY
          node scripts/TEMP-materialize-scenekunst-institusjonsledelse-role-world.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/civication-scenekunst-institusjonsledelse-role-world-rollout.test.js')
          s = p.read_text()
          old = 'assert.match(source, /29/30/);'
          new = 'assert.match(source, /29\\/30/);'
          if old not in s:
              raise SystemExit('Expected generated 29/30 regex marker missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Regenerate canonical derived state
        run: |
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
          node scripts/build-civication-scene-registry.mjs --write --json
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - name: Verify focused Role World gate
        run: |
          set +e
          node tests/civication-scenekunst-institusjonsledelse-role-world-rollout.test.js > /tmp/institusjonsledelse-focused.log 2>&1
          status=$?
          cat /tmp/institusjonsledelse-focused.log
          if [ "$status" -ne 0 ]; then
            mkdir -p reports
            cp /tmp/institusjonsledelse-focused.log reports/TEMP_SCENEKUNST_INSTITUSJONSLEDELSE_ROLE_WORLD_FAILURE.log
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add reports/TEMP_SCENEKUNST_INSTITUSJONSLEDELSE_ROLE_WORLD_FAILURE.log
            git commit -m 'TEMP capture Institusjonsledelse Role World failure' || true
            git push origin HEAD:$GITHUB_REF_NAME
            exit "$status"
          fi
      - name: Verify prerequisite compatibility
        run: node tests/civication-scenekunst-institusjonsledelse-prerequisites.test.js
      - name: Verify generated state
        run: |
          node scripts/build-civication-scene-registry.mjs --check --json
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node scripts/audit-civication-career-gameplay.mjs --check
          node scripts/audit-civication-role-world-rollout-readiness.mjs --check
      - name: Verify full Civication suite
        run: npm run test:civication
      - name: Verify diff
        run: git diff --check
      - name: Publish verified permanent state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/TEMP-scenekunst-institusjonsledelse-role-world-materialize.yml
          git rm -f scripts/TEMP-materialize-scenekunst-institusjonsledelse-role-world.mjs
          if [ -f reports/TEMP_SCENEKUNST_INSTITUSJONSLEDELSE_ROLE_WORLD_FAILURE.log ]; then git rm reports/TEMP_SCENEKUNST_INSTITUSJONSLEDELSE_ROLE_WORLD_FAILURE.log; fi
          git add -u
          git add data/Civication/roleWorlds/scenekunst/scenekunst_institusjonsledelse.json
          git add reports/CIVICATION_SCENEKUNST_INSTITUSJONSLEDELSE_ROLE_WORLD_ROLLOUT_SOURCE_FIRST.md
          git add tests/civication-scenekunst-institusjonsledelse-role-world-rollout.test.js
          git diff --cached --check
          git commit -m 'Complete Scenekunst institusjonsledelse Role World'
          git push origin HEAD:$GITHUB_REF_NAME
