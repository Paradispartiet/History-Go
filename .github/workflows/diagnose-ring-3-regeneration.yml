name: Diagnose Ring 3 regeneration

on:
  push:
    branches:
      - work/ring-3-fagverk-v2-20260901
    paths:
      - .github/workflows/diagnose-ring-3-regeneration.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Sync diagnostic tree to current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Reproduce Ring 3 materialization
        run: |
          sed -n "/node <<'NODE'/,/^          NODE$/p" .github/workflows/finalize-ring-3-fagverk-v2.yml \
            | sed '1d;$d;s/^          //' > /tmp/materialize-ring3.cjs
          test -s /tmp/materialize-ring3.cjs
          node /tmp/materialize-ring3.cjs
      - name: Regenerate places index
        run: npm run places:index:build
      - name: Regenerate Place-open
        run: node scripts/build-place-open-payloads.mjs
      - name: Capture Fagverk coverage audit failure
        run: |
          set +e
          node scripts/audit-fagverk-place-pages.mjs --write > /tmp/ring3-fagverk-audit.log 2>&1
          code=$?
          set -e
          cat /tmp/ring3-fagverk-audit.log
          if [ "$code" -ne 0 ]; then
            cp /tmp/ring3-fagverk-audit.log reports/ring3-fagverk-audit-diagnostic.txt
            git add reports/ring3-fagverk-audit-diagnostic.txt
            git commit -m "Capture Ring 3 Fagverk audit diagnostic"
            git push origin HEAD:${GITHUB_REF_NAME}
            exit "$code"
          fi
      - name: Regenerate Fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs
