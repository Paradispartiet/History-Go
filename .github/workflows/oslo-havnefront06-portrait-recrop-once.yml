name: Oslo havnefront 06 — editorial portrait recrop
on:
  push:
    branches:
      - research/oslo-havnefront-bolk06-tekst-20261109
    paths:
      - .github/workflows/oslo-havnefront06-portrait-recrop-once.yml
permissions:
  contents: write
concurrency:
  group: oslo-havnefront06-portrait-recrop
  cancel-in-progress: false
jobs:
  recrop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: research/oslo-havnefront-bolk06-tekst-20261109
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Re-fetch original photos and improve three portrait compositions
        run: node scripts/recrop-oslo-havnefront06-portraits.mjs
      - name: Verify all ten real image files and metadata
        run: node scripts/build-oslo-havnefront06-images.mjs --check
      - name: Regenerate indexes with amended source provenance
        run: |
          npm run places:index:build
          npm run place-open:build
          npm run places:index:check
          npm run place-open:check
      - name: Create new editorial contact sheet
        run: node scripts/review-oslo-havnefront06-images.mjs
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: oslo-havnefront06-portrait-recrop-review
          path: artifacts/oslo-havnefront06-media-review/contact-sheet.jpg
          retention-days: 14
      - name: Commit only three portrait assets, source metadata and regenerated indexes
        shell: bash
        run: |
          set -euo pipefail
          git add bilder/places/oslo-havnefront06-20261109/amerikalinjen_portrait.webp
          git add bilder/places/oslo-havnefront06-20261109/aker_brygge_portrait.webp
          git add bilder/places/oslo-havnefront06-20261109/akerselva_utlop_bjorvika_portrait.webp
          git add data/places/naeringsliv/oslo/places_naeringsliv_oslo_oppdag_kvadraturen_batch_03/amerikalinjen.json
          git add data/places/by/oslo/places/aker_brygge.json
          git add data/places/natur/oslo/places_oslo_natur_akerselvarute/akerselva_utlop_bjorvika.json
          git add data/places/places_index.json
          git add data/runtime/place-open/amerikalinjen.json
          git add data/runtime/place-open/aker_brygge.json
          git add data/runtime/place-open/akerselva_utlop_bjorvika.json
          git add reports/place-production/oslo-havnefront06-media-provenance.json
          git rm -- .github/workflows/oslo-havnefront06-portrait-recrop-once.yml
          git diff --cached --name-only | while IFS= read -r f; do
            case "$f" in
              bilder/places/oslo-havnefront06-20261109/amerikalinjen_portrait.webp|bilder/places/oslo-havnefront06-20261109/aker_brygge_portrait.webp|bilder/places/oslo-havnefront06-20261109/akerselva_utlop_bjorvika_portrait.webp|data/places/naeringsliv/oslo/places_naeringsliv_oslo_oppdag_kvadraturen_batch_03/amerikalinjen.json|data/places/by/oslo/places/aker_brygge.json|data/places/natur/oslo/places_oslo_natur_akerselvarute/akerselva_utlop_bjorvika.json|data/places/places_index.json|data/runtime/place-open/amerikalinjen.json|data/runtime/place-open/aker_brygge.json|data/runtime/place-open/akerselva_utlop_bjorvika.json|reports/place-production/oslo-havnefront06-media-provenance.json|.github/workflows/oslo-havnefront06-portrait-recrop-once.yml) ;;
              *) echo "UNEXPECTED_STAGED_FILE: $f" >&2;exit 1;;
            esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Improve three Oslo havnefront portrait crops after visual review"
          git push origin HEAD:research/oslo-havnefront-bolk06-tekst-20261109
