name: TEMP Gamle Deichman read-first diagnostic

on:
  push:
    branches:
      - agent/gamle-deichman-reconciliation-20260908
    paths:
      - .github/workflows/TEMP-gamle-deichman-readfirst-diagnostic.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture full READ-FIRST bundle
        shell: bash
        run: |
          set -euo pipefail
          OUT=gamle-deichman-read-first.txt
          : > "$OUT"
          for f in \
            docs/PLACE_PRODUCTION_CHECKLIST.md \
            docs/PLACE_PRODUCTION_CHECKLIST_REFERENCE_V1.md \
            docs/PLACE_PRODUCTION_PROFILES.md \
            data/quiz/regler/QUIZ_PRODUCTION_CANONICAL.md \
            data/places/README_place_rounds.md \
            data/badges/index.json \
            data/badges/place_production_routing_v1.json \
            docs/PLACE_OBJECTS_CANONICAL.md \
            data/brands/brand_rules_v1_1.json \
            data/badges/litteratur.json
          do
            printf '\n===== %s =====\n' "$f" >> "$OUT"
            cat "$f" >> "$OUT"
            printf '\n' >> "$OUT"
          done
      - name: Capture Data-check quiz test
        shell: bash
        run: |
          set +e
          {
            echo '===== npm run test:quiz-content-audit ====='
            npm run test:quiz-content-audit
            A=$?
            echo "exit=$A"
            echo '===== npm run test:quiz-production ====='
            npm run test:quiz-production
            B=$?
            echo "exit=$B"
            echo "combined_exit=$(( A || B ))"
          } 2>&1 | tee gamle-deichman-quiz-diagnostic.txt
          exit 0
      - name: Snapshot repair-relevant repository files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repair-snapshot
          files=(
            data/fag/fag_manifest.json
            data/fag/litteratur/emner_litteratur_canonical_v4_5.json
            data/fag/litteratur/fagkart_litteratur_canonical_v4_5.json
            data/fagverk/fagverk_registry.json
            data/fagverk/subject_inventory.json
            data/places/litteratur/oslo/places_litteratur/gamle_deichman.json
            data/places/production/gamle_deichman.json
            data/quiz/litteratur/gamle_deichman.json
            data/lesespor/oslo/lesespor_oslo_litteratur.json
            reports/place-production/gamle-deichman-workcard-current.json
            scripts/audit-fagverk-place-pages.mjs
            scripts/validate-place-description-production-v4_2.mjs
            data/places/regler/place_description_production_v4_2.schema.json
            data/places/regler/PLACE_DESCRIPTION_CANONICAL.md
            reports/place-description-revision-protocol-v4_2.md
            data/places/production/bogstadveien.json
            package.json
          )
          for f in "${files[@]}"; do
            if [[ -f "$f" ]]; then
              mkdir -p "repair-snapshot/$(dirname "$f")"
              cp "$f" "repair-snapshot/$f"
            fi
          done
          npm run audit:fagverk:places > repair-snapshot/fagverk-audit.txt 2>&1 || true
          node scripts/validate-place-description-production-v4_2.mjs > repair-snapshot/description-audit.txt 2>&1 || true
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: gamle-deichman-repair-diagnostic
          path: |
            gamle-deichman-read-first.txt
            gamle-deichman-quiz-diagnostic.txt
            repair-snapshot
          if-no-files-found: error
