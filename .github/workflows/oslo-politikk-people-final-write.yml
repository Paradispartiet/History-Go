name: Write final Oslo politics People

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  write:
    if: github.head_ref == 'agent/oslo-politikk-people-final-completion'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-politikk-people-final-completion
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write final people and links
        run: |
          python3 <<'PY'
          import json
          import pathlib
          import re
          import unicodedata

          root = pathlib.Path('.')
          manifest_path = root / 'data/people/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          verified = '2026-07-24'

          def norm(value):
              text = unicodedata.normalize('NFKD', str(value or ''))
              text = ''.join(ch for ch in text if not unicodedata.combining(ch))
              return re.sub(r'[^a-z0-9]+', '', text.casefold())

          def initials(name):
              return ''.join(word[0].upper() for word in re.split(r'\s+', name.replace('-', ' ')) if word)[:5]

          def read_doc(path):
              doc = json.loads(path.read_text(encoding='utf-8'))
              if isinstance(doc, list):
                  return doc, True
              if isinstance(doc, dict) and isinstance(doc.get('id'), str):
                  return [doc], False
              raise RuntimeError(f'Unsupported People shape: {path}')

          def write_doc(path, people, is_array):
              value = people if is_array else people[0]
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          docs = {}
          by_id = {}
          by_name = {}
          for rel in manifest['files']:
              path = root / 'data' / rel
              people, is_array = read_doc(path)
              docs[path] = [people, is_array]
              for idx, person in enumerate(people):
                  pid = person.get('id')
                  if pid in by_id:
                      raise RuntimeError(f'Duplicate existing ID: {pid}')
                  by_id[pid] = (path, idx)
                  by_name.setdefault(norm(person.get('name')), []).append((path, idx))

          reused = [
              ('knut_knutsen_arkitekt', 'folkets_hus_oslo', ['https://oslobyleksikon.no/side/Folkets_hus']),
              ('henrik_bull', 'regjeringskvartalet', ['https://www.regjeringen.no/no/tema/plan-bygg-og-eiendom/regjeringskvartalet/bygninger/id712727/','https://www.regjeringen.no/no/dep/fin/dep/om-den-gamle-regjeringsbygningen-g-blokka/id450008/']),
              ('kong_karl_johan', 'slottet', ['https://www.kongehuset.no/kongelige-eiendommer/det-kongelige-slott/slottets-historie-og-arkitektur']),
              ('oscar_i', 'slottet', ['https://www.kongehuset.no/kongelige-eiendommer/det-kongelige-slott/slottets-historie-og-arkitektur']),
              ('heinrich_ernst_schirmer', 'slottet', ['https://www.kongehuset.no/kongelige-eiendommer/det-kongelige-slott/slottets-historie-og-arkitektur']),
              ('wilhelm_von_hanno', 'victoria_terrasse', ['https://oslobyleksikon.no/side/Victoria_terrasse']),
              ('henrik_ibsen', 'victoria_terrasse', ['https://www.regjeringen.no/no/aktuelt/utenriksministerens-tale-ved-markeringen-av-fredningsvedtaket-for-victoria-terrasse/id3093157/']),
              ('johan_nygaardsvold', 'victoria_terrasse', ['https://www.regjeringen.no/no/dep/smk/ansvarsomrader/forloperne/1905-1945/1940-norges-forste-nei/id2405916/']),
          ]

          reused_result = []
          for pid, place, sources in reused:
              if pid not in by_id:
                  raise RuntimeError(f'Missing canonical identity: {pid}')
              path, idx = by_id[pid]
              person = docs[path][0][idx]
              places = list(person.get('places') or [])
              if person.get('placeId') and person['placeId'] not in places:
                  places.append(person['placeId'])
              was_linked = place in places
              if not was_linked:
                  places.append(place)
              person['places'] = places
              urls = list(person.get('source_urls') or [])
              for url in sources:
                  if url not in urls:
                      urls.append(url)
              person['source_urls'] = urls
              person.setdefault('verifiedAt', verified)
              reused_result.append({'id': pid, 'name': person['name'], 'place': place, 'already_linked': was_linked, 'file': str(path)})

          new_people = [
              dict(id='bengt_espen_knudsen', name='Bengt Espen Knudsen', category='by', place='folkets_hus_oslo', year=1985, period='arkitekt_for_tredje_byggetrinn', desc='Arkitekten bak Folkets Hus’ tredje byggetrinn fra 1985.', popup='Bengt Espen Knudsen tegnet det tredje byggetrinnet av Folkets Hus mot Hammersborggata og Møllergata, oppført i 1985. Kortet gjelder denne konkrete utvidelsen av anlegget.', tags=['by','arkitektur','arbeiderbevegelsen','folkets_hus'], sources=['https://oslobyleksikon.no/side/Folkets_hus']),
              dict(id='torstein_ramberg', name='Torstein Ramberg', category='by', place='regjeringskvartalet', year=1996, period='arkitekt_for_r5', desc='Arkitekten bak regjeringsbygget R5, tatt i bruk i 1996.', popup='Torstein Ramberg AS er dokumentert som arkitekt for R5 i Regjeringskvartalet, tatt i bruk i 1996. Kortet gjelder Torstein Rambergs direkte tilknytning til dette byggetrinnet.', tags=['by','arkitektur','regjeringskvartalet','r5'], sources=['https://www.regjeringen.no/no/tema/plan-bygg-og-eiendom/regjeringskvartalet/bygninger/id712727/']),
              dict(id='johan_henrik_nebelong', name='Johan Henrik Nebelong', category='by', place='slottet', year=1838, period='arkitektassistent_ved_slottsinnredningen', desc='Arkitektassistent for Linstow under innredningen av Slottet.', popup='Johan Henrik Nebelong arbeidet som assistent for Linstow i innredningsfasen ved Det kongelige slott. Kortet gjelder hans konkrete arkitektrolle i anleggets ferdigstilling.', tags=['by','arkitektur','slottet','slottsinterior'], sources=['https://www.kongehuset.no/kongelige-eiendommer/det-kongelige-slott/slottets-historie-og-arkitektur']),
              dict(id='peter_fredrik_wergmann', name='Peter Fredrik Wergmann', category='kunst', place='slottet', year=1841, period='dekorasjonsmaler_pa_slottet', desc='Dekorasjonsmaleren bak pompeianske interiører på Slottet.', popup='Peter Fredrik Wergmann utførte blant annet de pompeianske dekorasjonene i Den daglige spisesal og Den store spisesal. Kortet gjelder hans dokumenterte utsmykningsarbeid ved Slottet.', tags=['kunst','dekorasjonsmaleri','slottet','slottsinterior'], sources=['https://www.kongehuset.no/kongelige-eiendommer/det-kongelige-slott/slottets-historie-og-arkitektur','https://www.kongehuset.no/kongelige-eiendommer/det-kongelige-slott/byggingen-av-slottet']),
              dict(id='johannes_flintoe', name='Johannes Flintoe', category='kunst', place='slottet', year=1841, period='utsmykket_fuglevaerelset', desc='Kunstneren som utsmykket Fugleværelset på Slottet.', popup='Johannes Flintoe utførte dekorasjonene med norske prospekter i Slottets Fugleværelse. Kortet gjelder hans direkte kunstneriske arbeid i kongeboligen.', tags=['kunst','maleri','slottet','fuglevaerelset'], sources=['https://www.kongehuset.no/kongelige-eiendommer/det-kongelige-slott/slottets-historie-og-arkitektur','https://www.kongehuset.no/kongelige-eiendommer/det-kongelige-slott/byggingen-av-slottet']),
              dict(id='peter_petersen_victoria_terrasse', name='Peter Petersen', category='naeringsliv', place='victoria_terrasse', year=1884, period='byggherre_for_victoria_terrasse', desc='Generalkonsulen som ledet interessentskapet bak Victoria terrasse.', popup='Peter Petersen ledet interessentskapet som oppførte Victoria terrasse som fasjonable leiegårder 1884–1890. Anlegget ble en tid kalt Petersborg etter ham. Kortet gjelder hans direkte byggherrerolle.', tags=['naeringsliv','eiendomsutvikling','victoria_terrasse','byggherre'], sources=['https://oslobyleksikon.no/side/Victoria_terrasse']),
              dict(id='henrik_thrap_meyer', name='Henrik Thrap-Meyer', category='by', place='victoria_terrasse', year=1884, period='hovedarkitekt_for_victoria_terrasse', desc='Hovedarkitekten for Victoria terrasse.', popup='Henrik Thrap-Meyer var hovedarkitekt for bygningskomplekset Victoria terrasse, oppført 1884–1890. Kortet gjelder hans direkte hovedansvar for anleggets arkitektur.', tags=['by','arkitektur','historisme','victoria_terrasse'], sources=['https://oslobyleksikon.no/side/Victoria_terrasse']),
              dict(id='paul_due', name='Paul Due', category='by', place='victoria_terrasse', year=1884, period='arkitekt_for_victoria_terrasse', desc='En av arkitektene som assisterte ved Victoria terrasse.', popup='Paul Due er dokumentert som en av arkitektene som assisterte hovedarkitekt Henrik Thrap-Meyer ved oppføringen av Victoria terrasse. Kortet gjelder denne direkte arkitektkoblingen.', tags=['by','arkitektur','historisme','victoria_terrasse'], sources=['https://oslobyleksikon.no/side/Victoria_terrasse']),
              dict(id='bernhard_steckmest', name='Bernhard Steckmest', category='by', place='victoria_terrasse', year=1884, period='arkitekt_for_victoria_terrasse', desc='En av arkitektene som assisterte ved Victoria terrasse.', popup='Bernhard Steckmest er dokumentert som en av arkitektene som assisterte hovedarkitekt Henrik Thrap-Meyer ved Victoria terrasse. Kortet gjelder denne konkrete arkitektrollen.', tags=['by','arkitektur','historisme','victoria_terrasse'], sources=['https://oslobyleksikon.no/side/Victoria_terrasse']),
              dict(id='curt_brauer', name='Curt Bräuer', category='historie', place='victoria_terrasse', year=1940, period='overbrakte_det_tyske_ultimatumet', desc='Den tyske sendemannen som mottok Norges avslag 9. april 1940.', popup='Curt Bräuer kom til Victoria terrasse tidlig 9. april 1940 for å overbringe Nazi-Tysklands ultimatum og mottok avslaget fra utenriksminister Halvdan Koht. Kortet gjelder dette dokumenterte møtet.', tags=['historie','andre_verdenskrig','diplomati','victoria_terrasse'], sources=['https://www.regjeringen.no/no/dep/smk/ansvarsomrader/forloperne/1905-1945/1940-norges-forste-nei/id2405916/']),
              dict(id='christian_mohr', name='Christian Mohr', category='historie', place='victoria_terrasse', year=1940, period='tok_imot_curt_brauer', desc='Sekretæren som tok imot Curt Bräuer ved Victoria terrasse.', popup='Christian Mohr, utenriksministerens sekretær, møtte Curt Bräuer ved hovedporten og førte ham opp trappene i Victoria terrasse tidlig 9. april 1940. Kortet gjelder denne direkte hendelsesrollen.', tags=['historie','andre_verdenskrig','utenrikstjenesten','victoria_terrasse'], sources=['https://www.regjeringen.no/no/dep/smk/ansvarsomrader/forloperne/1905-1945/1940-norges-forste-nei/id2405916/']),
              dict(id='christian_p_reusch', name='Christian P. Reusch', category='historie', place='victoria_terrasse', year=1940, period='forte_brauer_til_biblioteket', desc='Byråsjefen som førte Curt Bräuer inn i biblioteket 9. april 1940.', popup='Christian P. Reusch var byråsjef i Utenriksdepartementets politiske avdeling og førte Curt Bräuer til biblioteket i Victoria terrasse før møtet med Halvdan Koht. Kortet gjelder denne dokumenterte hendelsesrollen.', tags=['historie','andre_verdenskrig','utenrikstjenesten','victoria_terrasse'], sources=['https://www.regjeringen.no/no/dep/smk/ansvarsomrader/forloperne/1905-1945/1940-norges-forste-nei/id2405916/']),
          ]

          created = {}
          for spec in new_people:
              if spec['id'] in by_id:
                  raise RuntimeError(f'New ID already exists: {spec["id"]}')
              name_matches = by_name.get(norm(spec['name']), [])
              if name_matches:
                  raise RuntimeError(f'New name already exists unexpectedly: {spec["name"]} => {name_matches}')
              person = {
                  'id': spec['id'], 'name': spec['name'], 'initials': initials(spec['name']),
                  'desc': spec['desc'], 'tags': spec['tags'], 'placeId': spec['place'],
                  'places': [spec['place']], 'category': spec['category'], 'year': spec['year'],
                  'period': spec['period'], 'popupDesc': spec['popup'], 'image': '', 'cardImage': '',
                  'source_urls': spec['sources'], 'verifiedAt': verified,
              }
              created.setdefault(spec['category'], []).append(person)

          for path, (people, is_array) in docs.items():
              write_doc(path, people, is_array)

          for category, people in created.items():
              rel = f'people/{category}/oslo/people_{category}_oslo_politics_places_batch_04.json'
              path = root / 'data' / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(people, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              if rel not in manifest['files']:
                  manifest['files'].append(rel)

          if len(manifest['files']) != len(set(manifest['files'])):
              raise RuntimeError('Duplicate manifest entries')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          expected_ids = [pid for pid, _, _ in reused] + [p['id'] for p in new_people]
          expected_places = {pid: place for pid, place, _ in reused}
          expected_places.update({p['id']: p['place'] for p in new_people})
          test = f'''const fs = require("fs");\nconst path = require("path");\nconst root = path.resolve(__dirname, "..");\nconst manifest = JSON.parse(fs.readFileSync(path.join(root, "data/people/manifest.json"), "utf8"));\nconst people = [];\nfor (const rel of manifest.files) {{\n  const doc = JSON.parse(fs.readFileSync(path.join(root, "data", rel), "utf8"));\n  people.push(...(Array.isArray(doc) ? doc : [doc]));\n}}\nconst expected = {json.dumps(expected_places, ensure_ascii=False, indent=2)};\nfor (const [id, placeId] of Object.entries(expected)) {{\n  const matches = people.filter((person) => person.id === id);\n  if (matches.length !== 1) throw new Error(`${{id}}: expected one identity, got ${{matches.length}}`);\n  const person = matches[0];\n  const places = new Set([...(person.places || []), person.placeId].filter(Boolean));\n  if (!places.has(placeId)) throw new Error(`${{id}}: missing ${{placeId}}`);\n  if (!Array.isArray(person.source_urls) || person.source_urls.length === 0) throw new Error(`${{id}}: missing source_urls`);\n}}\nconst minimums = {{ folkets_hus_oslo: 4, regjeringskvartalet: 11, slottet: 11, victoria_terrasse: 13 }};\nfor (const [placeId, minimum] of Object.entries(minimums)) {{\n  const count = people.filter((person) => new Set([...(person.places || []), person.placeId].filter(Boolean)).has(placeId)).length;\n  if (count < minimum) throw new Error(`${{placeId}}: ${{count}} < ${{minimum}}`);\n  console.log(`${{placeId}}: ${{count}}`);\n}}\nconsole.log(`Final politics People batch OK: ${{Object.keys(expected).length}} identities`);\n'''
          (root / 'tests/oslo-politikk-final-people-expansion.test.js').write_text(test, encoding='utf-8')

          check_path = root / 'scripts/check-people.sh'
          check = check_path.read_text(encoding='utf-8')
          command = 'node tests/oslo-politikk-final-people-expansion.test.js'
          if command not in check:
              marker = 'echo "== People check complete =="'
              if marker not in check:
                  raise RuntimeError('People completion marker missing')
              check = check.replace(marker, 'echo "== Oslo politics final People expansion =="\n' + command + '\n\n' + marker)
              check_path.write_text(check, encoding='utf-8')

          report = {
              'processed': len(reused) + len(new_people),
              'new_people': len(new_people),
              'reused_people': len(reused),
              'new_place_links_on_reused': sum(1 for x in reused_result if not x['already_linked']),
              'already_satisfied_reused': sum(1 for x in reused_result if x['already_linked']),
              'reused': reused_result,
              'created': new_people,
              'minimums': {'folkets_hus_oslo': 4, 'regjeringskvartalet': 11, 'slottet': 11, 'victoria_terrasse': 13},
          }
          report_path = root / 'reports/oslo-politikk-people-full-coverage/final-expansion-batch-04.json'
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({k: report[k] for k in ['processed','new_people','reused_people','new_place_links_on_reused','already_satisfied_reused']}, ensure_ascii=False))
          PY

      - name: Rebuild generated People surfaces
        run: |
          npm run civication:history-people:build
          npm run build:web

      - name: Run locked People tests
        run: |
          set -o pipefail
          mkdir -p reports/oslo-politikk-people-full-coverage
          {
            node tests/oslo-politikk-people-full-coverage.test.js
            node tests/oslo-politikk-remaining-people-expansion.test.js
            node tests/oslo-politikk-final-people-expansion.test.js
          } 2>&1 | tee reports/oslo-politikk-people-full-coverage/coverage-test.log

      - name: Run full gates
        run: |
          set -o pipefail
          bash scripts/check-people.sh 2>&1 | tee reports/oslo-politikk-people-full-coverage/check-people.log
          bash scripts/check-places.sh 2>&1 | tee reports/oslo-politikk-people-full-coverage/check-places.log
          {
            npm run typecheck:web
            npm run typecheck:scripts
            npm run typecheck:tools
          } 2>&1 | tee reports/oslo-politikk-people-full-coverage/typecheck.log

      - name: Publish final branch
        run: |
          rm .github/workflows/oslo-politikk-people-final-write.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fullfør People ved Oslo-politikksteder"
          git push origin HEAD:agent/oslo-politikk-people-final-completion
