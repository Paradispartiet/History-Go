name: Bootstrap verified Media phase 3 tree

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: bootstrap-media-phase3
  cancel-in-progress: false

jobs:
  materialize:
    name: Materialize SHA-locked Media data tree
    if: github.head_ref == 'agent/materialiser-media-phase3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/materialiser-media-phase3
          fetch-depth: 0
      - name: Apply verified patch without workflow transport
        env:
          EXPECTED_DATA_TREE: b48dd0dab607770a443f367dd5f81c818d6560a2
        run: |
          base64 --decode .media-phase3.patch.gz.b64 | gzip --decompress > /tmp/media-phase3.patch
          git apply --index /tmp/media-phase3.patch
          git rm .media-phase3.patch.gz.b64 .github/workflows/bootstrap-media-phase3.yml
          git reset HEAD -- .github/workflows/fagverk-media-phase3.yml
          rm .github/workflows/fagverk-media-phase3.yml
          ACTUAL_DATA_TREE=$(git write-tree)
          test "$ACTUAL_DATA_TREE" = "$EXPECTED_DATA_TREE"
          git restore --staged .github/workflows/bootstrap-media-phase3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialiser Media som andre Fase 3-fag"
          git push origin HEAD:agent/materialiser-media-phase3
