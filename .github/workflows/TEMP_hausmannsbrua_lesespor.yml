name: TEMP Hausmannsbrua Lesespor rematerialize

on:
  push:
    branches:
      - agent/hausmannsbrua-place-production-20260911
    paths:
      - ".github/workflows/TEMP_hausmannsbrua_lesespor.yml"

permissions:
  contents: write

jobs:
  rematerialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/hausmannsbrua-place-production-20260911

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rematerialize Hausmannsbrua
        run: node tools/finalize-hausmannsbrua-completion.mjs

      - name: Validate Hausmannsbrua closure
        run: node --test tests/hausmannsbrua-completion.test.mjs

      - name: Validate Lesespor
        shell: bash
        run: |
          npm run build:tools
          node dist/tools/validate_lesespor.mjs

      - name: Remove one-shot workflow
        run: rm .github/workflows/TEMP_hausmannsbrua_lesespor.yml

      - name: Commit Lesespor reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "Reconcile Hausmannsbrua Lesespor"
          git push origin HEAD:agent/hausmannsbrua-place-production-20260911
