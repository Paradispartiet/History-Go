name: John Dee one-time canonical knowledge regeneration
on:
  push:
    branches:
      - john-dee-v1-fagverk-people-20261101
    paths:
      - .github/workflows/john-dee-canonical-one-time.yml
permissions:
  contents: write
concurrency:
  group: john-dee-one-time-canonical-sync
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Regenerate canonical Knowledge data
        run: npm run knowledge:canonical:write
      - name: Commit deterministic generated data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/knowledge/knowledge_units.generated.json data/knowledge/concepts.generated.json
          if ! git diff --cached --quiet; then
            git commit -m "John Dee: synchronize canonical Knowledge to revised quiz"
            git fetch origin john-dee-v1-fagverk-people-20261101
            git rebase origin/john-dee-v1-fagverk-people-20261101
            git push origin HEAD:john-dee-v1-fagverk-people-20261101
          fi
