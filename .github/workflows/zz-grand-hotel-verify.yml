name: Grand Hotel scoped production verification
on:
  push:
    branches:
      - fix/grand-hotel-naeringsliv-category-20261030
    paths:
      - .github/workflows/zz-grand-hotel-verify.yml
permissions:
  contents: read
concurrency:
  group: grand-hotel-scoped-production-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Grand Hotel Næringsliv category, quiz and Knowledge IDs
        run: node --test tests/grand-hotel-naeringsliv.test.mjs
      - name: Audit changed Næringsliv production report A–H
        run: |
          set -euo pipefail
          git fetch origin main
          BASE="$(git merge-base HEAD origin/main)"
          node scripts/audit-naeringsliv-place-production.mjs --changed --base "$BASE" --head HEAD
      - name: Verify synchronized Knowledge canonical artifacts
        run: npm run knowledge:canonical:check
