name: Temporary Fagverk Natur PR migration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Execute embedded Natur migration
        shell: bash
        run: |
          python3 <<'PY'
          import pathlib
          source = pathlib.Path('.github/workflows/tmp-fagverk-natur-pilot.yml').read_text(encoding='utf-8')
          marker = "          node <<'NODE'\n"
          start = source.index(marker) + len(marker)
          end = source.index('\n          NODE', start)
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end].splitlines())
          outer = "const auditScript = `"
          tail = "`;\nfs.writeFileSync('scripts/audit-fagverk-natur-pilot.mjs'"
          audit_start = body.index(outer) + len(outer)
          audit_end = body.index(tail, audit_start)
          escaped = body[audit_start:audit_end].replace('`', '\\`')
          body = body[:audit_start] + escaped + body[audit_end:]
          sync = r'''
          const naturePensumPath = 'data/fag/natur/naturpensum_canonical_v4_5.json';
          const natureEmnersPath = 'data/fag/natur/emner_natur_canonical_v4_5.json';
          const natureMappingPath = 'data/fag/natur/emnemapping_natur_canonical_v4_5.json';
          const naturePensum = JSON.parse(fs.readFileSync(naturePensumPath, 'utf8'));
          const natureEmners = JSON.parse(fs.readFileSync(natureEmnersPath, 'utf8')).filter((emne) => emne.status === 'active');
          const natureMappings = JSON.parse(fs.readFileSync(natureMappingPath, 'utf8'));
          const listedEmners = new Set(naturePensum.domains.flatMap((domain) => domain.emne_ids || []));
          const mappingIds = new Set(natureMappings.map((row) => row.emne_id));
          for (const emne of natureEmners) {
            const target = naturePensum.domains.find((domain) => domain.domain_id === emne.area_id)
              || naturePensum.domains.find((domain) => domain.domain_id === emne.domain);
            if (!target) throw new Error(`Kan ikke plassere ${emne.emne_id} i canonical Natur-domene`);
            if (!listedEmners.has(emne.emne_id)) {
              target.emne_ids.push(emne.emne_id);
              listedEmners.add(emne.emne_id);
            }
            if (!mappingIds.has(emne.emne_id)) {
              const hookIds = Array.isArray(emne.primary_theory_hooks) && emne.primary_theory_hooks.length
                ? emne.primary_theory_hooks
                : [];
              if (!hookIds.length) throw new Error(`${emne.emne_id} mangler primary_theory_hooks for canonical mapping`);
              natureMappings.push({
                emne_id: emne.emne_id,
                title: emne.title,
                mappings: hookIds.map((hookId, index) => ({
                  fagkart_kategori: target.domain_id,
                  fagkart_kategori_tittel: target.label,
                  topic_hook: hookId,
                  topic_hook_tittel: hookId.replaceAll('_', ' '),
                  mapping_tier: index === 0 ? 'primary' : 'secondary',
                  priority_score: Math.max(6, 9 - index),
                  set_phase_fit: emne.recommended_set_phases || ['facts', 'bridge_facts_theory', 'late_theory'],
                  question_surface_mode: emne.question_surface_mode || 'nature-place-process-first',
                  nature_anchor_required: true,
                  fact_anchor_required: true,
                  source_anchor_required: true,
                  external_claim_basis_required: true,
                  ecosystem_water_climate_or_place_anchor_required: true,
                  documented_ecological_context_required: true,
                  use_note: 'Canonical kobling materialisert fra emnets fagområde, primary_theory_hooks og metodekoblinger.',
                  recommended_method_ids: emne.method_ids || emne.recommended_methods || []
                }))
              });
              mappingIds.add(emne.emne_id);
            }
          }
          for (const domain of naturePensum.domains) domain.emne_count = domain.emne_ids.length;
          naturePensum.summary.emne_count = natureEmners.length;
          naturePensum.summary.mapping_count = natureMappings.length;
          naturePensum.summary.all_emner_have_mapping = natureMappings.length === natureEmners.length;
          naturePensum.updated_at = '2026-07-29';
          writeJson(naturePensumPath, naturePensum);
          writeJson(natureMappingPath, natureMappings);
          '''
          body = body.replace("writeJson(statusPath, status);\n", "writeJson(statusPath, status);\n" + sync + "\n")
          body = body.replace('const actualDomainOrder = model.domains.map((domain) => domain.id);', 'const actualDomainOrder = [...model.domains].map((domain) => domain.id);')
          body = body.replace('model.summary.emneCount === 33', 'model.summary.emneCount === 35')
          body = body.replace('Forventet 33 emner', 'Forventet 35 emner')
          body = body.replace('model.summary.mappingCount === 33', 'model.summary.mappingCount === 35')
          body = body.replace('Forventet 33 mappings', 'Forventet 35 mappings')
          body = body.replace('emneCount: 33', 'emneCount: 35')
          body = body.replace('mappingCount: 33', 'mappingCount: 35')
          body = body.replace('33 emner, 30 metoder, 33 mappings', '35 emner, 30 metoder, 35 mappings')
          pathlib.Path('/tmp/fagverk-natur-pilot.cjs').write_text(body, encoding='utf-8')
          PY
          node /tmp/fagverk-natur-pilot.cjs
          python3 <<'PY'
          import pathlib
          file = pathlib.Path('scripts/audit-fagverk-natur-pilot.mjs')
          source = file.read_text(encoding='utf-8')
          source = source.replace("badge: 'data/badges/natur.json',", "badge: 'data/badges/natur.json',\n    mapping: 'data/fag/natur/emnemapping_natur_canonical_v4_5.json',")
          source = source.replace("const badge = readJson(PATHS.badge);", "const badge = readJson(PATHS.badge);\n  const canonicalMappings = readJson(PATHS.mapping);")
          source = source.replace("assert(model.chapters.length === 0, 'Natur skal ikke få oppdiktede lærekapitler ved materialisering');", "assert(model.chapters.length === 0, 'Natur skal ikke få oppdiktede lærekapitler ved materialisering');\n  const canonicalMappingIds = new Set(canonicalMappings.map((row) => row.emne_id));\n  assert(canonicalMappings.length === model.emners.length, `Canonical mappingfil har ${canonicalMappings.length} rader for ${model.emners.length} emner`);\n  for (const emne of model.emners) assert(canonicalMappingIds.has(emne.id), `Canonical mappingfil mangler ${emne.id}`);")
          source = source.replace("mappingsResolved: true,", "mappingsResolved: true,\n      canonicalMappingFileComplete: true,")
          file.write_text(source, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Generate deterministic reports
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs --write-report --no-check-report
          node scripts/audit-fagverk-general-engine.mjs --write-report --no-check-report
          node scripts/audit-fagverk-natur-pilot.mjs --write-report --no-check-report
      - name: Validate Natur pilot
        run: |
          node --check scripts/audit-fagverk-natur-pilot.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-natur-pilot.mjs
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-natur-pilot.test.mjs
          node --test tests/fagverk-portal.test.mjs
          node --test tests/fagverk-documentation-contract.test.mjs
          npm run typecheck:web
      - name: Commit materialized pilot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk/fagverk_portal.json data/fagverk/subject_status.json 'data/fag/natur/merke_natur (1).html' data/fag/natur/naturpensum_canonical_v4_5.json data/fag/natur/emnemapping_natur_canonical_v4_5.json scripts/audit-fagverk-natur-pilot.mjs tests/fagverk-natur-pilot.test.mjs reports/fagverk/README.md reports/fagverk/subject-baseline.json reports/fagverk/general-engine-audit.json reports/fagverk/natur-pilot-audit.json
          git commit -m "Materialiser Natur som første fase-2-pilot"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
