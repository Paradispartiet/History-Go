name: Restore rejected Blå photo (one-shot)
on:
  push:
    branches:
      - fix/oslo-v1-image-composition-20261018
    paths:
      - '.github/workflows/oslo-v1-reject-blaa-photo-20261018.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore the venue photo and retain new per-surface focal metadata
        run: |
          git checkout origin/main -- bilder/places/blaa.webp bilder/places/blaa_front_portrait.webp bilder/kort/places/blaa.webp
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          def read(p): return json.loads(Path(p).read_text())
          p="data/places/musikk/oslo/places_musikk/blaa.json"
          old=json.loads(subprocess.check_output(["git","show","origin/main:"+p],text=True))
          current=read(p)
          media_keys={"image","frontImage","cardImage","imageCard","imageCaption","imageCredit","imageLicense","imageSourceUrl","imageMeta","frontImageMeta"}
          for k in media_keys:
              if k in old: current[k]=old[k]
              else: current.pop(k,None)
          Path(p).write_text(json.dumps(current,ensure_ascii=False,indent=2)+"\n")
          manifest="data/places/production-tiers/v1-oslo-nature-music-20261017-batch02.json"
          data=read(manifest)
          item=next(x for x in data["places"] if x["place_id"]=="blaa")
          item.update(photo_source=old["imageSourceUrl"],photo_license=old["imageLicense"],
                      photo_author=old["imageCredit"].replace(" / Wikimedia Commons",""),
                      photo_status="local_photo_and_rights_record_produced",
                      frontImage_status="separate_local_portrait_file_produced",
                      media_design_review="composition_reviewed_in_contact_sheet_not_device_verified",
                      runtime_binding_status="not_verified_in_app",content_level="v1_candidate")
          Path(manifest).write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          report="data/places/production-tiers/v1-oslo-image-design-review-20261018.json"
          r=read(report)
          r["rejectedAlternative"]={"place_id":"blaa","source":"Blå 17.jpg",
                 "reason":"Photo depicts a drink, not a recognizable venue. Source rejected after inspecting the actual crop; earlier place image restored."}
          r["held"]=[x for x in r["held"] if x.get("place_id")!="blaa"]
          r["held"].append({"place_id":"blaa","reason":"Alternative Blå .jpg blocked by Commons HTTP 429; original licensed venue image retained"})
          r["heldCount"]=len(r["held"])
          r["chosenOriginalForBlaa"]=old["imageSourceUrl"]
          Path(report).write_text(json.dumps(r,ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Rebuild contact sheet and canonical runtime
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          import json,runpy
          batch=json.load(open("data/places/production-tiers/v1-oslo-nature-music-20261017-batch02.json"))
          runpy.run_path("scripts/review-oslo-v1-image-composition-20261018.py")["build_contact_sheet"](batch)
          PY
          npm ci --ignore-scripts --no-audit --no-fund
          npm run places:index:build
          npm run place-open:build
          node --test tests/oslo-v1-image-composition.test.mjs
      - name: Commit reviewed correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/places/ bilder/kort/places/ data/places/ data/runtime/ reports/oslo-v1-image-composition-preview-20261018.jpg
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 1; fi
          git commit -m "fix(oslo): reject cocktail photo and restore verified Blå venue"
          git push origin HEAD:fix/oslo-v1-image-composition-20261018
