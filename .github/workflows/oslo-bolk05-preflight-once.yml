name: Oslo bolk 05 — scoped v1 preflight once
on:
  push:
    branches:
      - research/oslo-sentrum-bolk05-tekst-20261101
    paths:
      - .github/workflows/oslo-bolk05-preflight-once.yml
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore source-backed Kulturkirken Jakob popup to canonical v4.2 length
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const placeFile='data/places/musikk/oslo/places_musikk/kulturkirken_jakob_litteratur.json';
          const packetFile='data/places/production/kulturkirken_jakob_litteratur.json';
          const place=JSON.parse(fs.readFileSync(placeFile,'utf8'));
          const packet=JSON.parse(fs.readFileSync(packetFile,'utf8'));
          const marker='\n\nKulturkirkens historikkside oppgir';
          const inserted=[
            'Da kontorer erstattet mange boliger i området, ble menighetsgrunnlaget mindre, noe som bidro til at Jakob kirke ble nedlagt som soknekirke.',
            'Etter stengningen vurderte biskop Andreas Aarflot å rive bygningen, mens bygningsvernmyndighetene gikk inn for fredning.',
            'Store setningsskader og sprekker i murverket gjorde restaureringen kostbar og nødvendig før rommet kunne tas i bruk til konserter og forestillinger.',
            'Handlingsprogram Oslo Indre Øst bidro med midler til rehabiliteringen, og ytterligere støtte gjorde det mulig å kjøpe inn interiør, lyd- og lysutstyr og instrumenter.'
          ];
          if(!place.popupDesc.includes(marker)||place.popupDesc.includes(inserted[0]))throw new Error('Kulturkirken text anchor changed; abort');
          place.popupDesc=place.popupDesc.replace(marker,'\n\n'+inserted.join(' ') + marker);
          const claims=[
            ['demographic_decline','Kontorisering og nedgang i antall bosatte bidro til at Jakob kirke mistet sitt soknekirkegrunnlag.','Historie – avsnittet om nedleggelsen i 1985'],
            ['preservation','Biskop Andreas Aarflot ønsket å rive den tomme kirken, men Byantikvaren og Riksantikvaren gikk inn for fredning.','Historie – bevaring framfor riving'],
            ['structural_damage','Setninger i østenden og sprekker i murverket gjorde kirken forfallen og rehabiliteringen nødvendig for ny bruk.','Historie – bygningsskader og istandsetting'],
            ['rehabilitation_funding','Handlingsprogram Oslo Indre Øst bevilget rehabiliteringsmidler, supplert av støtte til interiør, lyd, lys og instrumenter.','Historie – finansieringen frem mot 2000']
          ];
          for(const [suffix,claim,sourceLocation] of claims){
            const id='claim_kulturkirken_jakob_'+suffix;
            if(packet.claims.some(c=>c.id===id))throw new Error('Duplicate claim '+id);
            packet.claims.push({id,claim,sourceUrl:'https://www.jakob.no/om-jakob/historie',sourceLocation,sourceType:'official',verifiedAt:'2026-11-01',status:'verified',claimKind:'ordinary',evidenceMode:'direct',temporalStatus:'historical'});
          }
          const old=packet.sentenceCoverage.popupDesc;
          if(old.length!==17)throw new Error('Expected 17 previously sourced sentences');
          const appended=claims.map(([suffix])=>['claim_kulturkirken_jakob_'+suffix]);
          const indexed=[...old.slice(0,7).map(r=>r.claimIds),...appended,...old.slice(7).map(r=>r.claimIds)];
          packet.sentenceCoverage.popupDesc=indexed.map((claimIds,i)=>({sentence:i+1,claimIds}));
          packet.textHashes.popupDesc=createHash('sha256').update(place.popupDesc,'utf8').digest('hex');
          packet.completion.claimsVerified={verified:packet.claims.filter(x=>x.status==='verified').length,total:packet.claims.length};
          packet.reviews.factual.notes='Utvidet med konkrete kildeførte opplysninger om kontorisering, fredning, setningsskader og finansiering, kontrollert mot offisiell historikk 1.11.2026.';
          packet.reviews.editorial.notes='Den eksisterende teksten og musikkategorien er bevart. Fire direkte kildeførte faktasetninger om ombruken er lagt til uten ny kategori eller ny fortellingsvinkel.';
          fs.writeFileSync(placeFile,JSON.stringify(place,null,2)+'\n');
          fs.writeFileSync(packetFile,JSON.stringify(packet,null,2)+'\n');
          console.log('KULTURKIRKEN_JAKOB_POPUP_SYNCHRONIZED',packet.sentenceCoverage.popupDesc.length,packet.claims.length);
          NODE
      - name: Validate exactly the six Oslo bolk 05 v4.2 packets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validatePacket } from './scripts/validate-place-description-production-v4_2.mjs';
          const ids=['folketeateret','kunstnernes_hus','historisk_museum','ibsen_museum_teater','blitzhuset','kulturkirken_jakob_litteratur'];
          const issues=[];
          for(const id of ids){
            const packetFile='data/places/production/'+id+'.json';
            const packet=JSON.parse(fs.readFileSync(packetFile,'utf8'));
            const source=JSON.parse(fs.readFileSync(packet.placeFile,'utf8'));
            const records=Array.isArray(source)?source:Array.isArray(source.places)?source.places:[source];
            const place=records.find(row=>row?.id===id);
            const result=validatePacket({packet,place,packetFile});
            console.log(id,'v4.2',packet.status,result.issues.length,'issues');
            issues.push(...result.issues.map(x=>({placeId:id,...x})));
          }
          if(issues.length){
            console.error(JSON.stringify(issues,null,2));
            process.exitCode=1;
          }else console.log('OSLO_BOLK05_V42_PACKETS_OK',ids.length);
          NODE
      - name: Check history-specific production case for Historisk museum
        run: node scripts/audit-historie-place-production.mjs --changed --base origin/main
      - name: Rebuild only changed derivative place-open payload and verify indexes
        run: |
          node scripts/build-place-open-payloads.mjs
          node scripts/build-epoke-place-index.mjs --check
          node scripts/build-place-open-payloads.mjs --check
      - name: Verify local image paths and backlog audit summary
        run: |
          node scripts/audit-place-images.mjs --mode=changed
          node scripts/audit-place-images.mjs --mode=all --verify-summary=data/places/place_image_backlog_summary.json
      - name: Validate all 17 WebP hashes and Folketeateret quiz/card parity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const manifest=JSON.parse(fs.readFileSync('reports/place-production/oslo-sentrum-bolk05-media-provenance-20261101.json','utf8'));
          if(manifest.items.length!==6)throw new Error('Expected 6 places');
          let n=0;
          for(const item of manifest.items){
            for(const [kind,data] of Object.entries(item.outputs)){
              if(!fs.existsSync(data.path))throw new Error('Missing '+data.path);
              const hash=createHash('sha256').update(fs.readFileSync(data.path)).digest('hex');
              if(hash!==data.sha256)throw new Error('Wrong SHA-256 '+data.path);
              n++;
            }
          }
          if(n!==17)throw new Error('Expected 17 images; got '+n);
          const quiz=JSON.parse(fs.readFileSync('data/quiz/scenekunst/folketeateret_sets.json','utf8'));
          const card=JSON.parse(fs.readFileSync('data/quizcards/scenekunst/folketeateret_quizkort_v1.json','utf8'));
          const questions=quiz.sets.flatMap(s=>s.questions);
          if(quiz.sets.length!==3||questions.length!==21||new Set(questions.map(x=>x.id)).size!==21)throw new Error('Quiz 3x7 integrity failed');
          if(card.cards.length!==1||card.cards[0].questions.length!==10)throw new Error('QuizCard count failed');
          const byId=new Map(questions.map(q=>[q.id,q]));
          for(const q of card.cards[0].questions){
            const src=byId.get(q.sourceQuestionId);
            if(!src||src.quiz_id!==q.sourceQuizId||src.answer!==q.answer||
              src.answerIndex!==q.answerIndex||src.question!==q.question||
              JSON.stringify(src.options)!==JSON.stringify(q.options)||
              !Array.isArray(q.knowledge_unit_ids)||q.knowledge_unit_ids.length===0)
              throw new Error('Card/quiz mismatch at '+q.sourceQuestionId);
          }
          console.log('OSLO_BOLK05_SCOPE_OK',n,'WebP',questions.length,'fullquiz',card.cards[0].questions.length,'QuizCard');
          NODE
      - name: Remove one-off workflow after successful preflight
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/places/musikk/oslo/places_musikk/kulturkirken_jakob_litteratur.json
          git add -- data/places/production/kulturkirken_jakob_litteratur.json
          git add -- data/runtime/place-open/kulturkirken_jakob_litteratur.json
          git rm -- .github/workflows/oslo-bolk05-preflight-once.yml
          git diff --cached --check
          git commit -m "Expand source-backed Kulturkirken Jakob popup and finish scoped preflight"
          git fetch origin "${BRANCH_NAME}"
          git rebase FETCH_HEAD
          git push origin "HEAD:${BRANCH_NAME}"
