name: Temporary Politikk quality migration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply deterministic Politikk quality lift
        run: |
          node scripts/tmp-migrate-politikk-quality.mjs
          node <<'NODE'
          const fs = require('fs');
          const pensumPath = 'data/fag/politikk/politikkpensum_canonical_v4_5.json';
          const emnePath = 'data/fag/politikk/emner_politikk_canonical_v4_5.json';
          const pensum = JSON.parse(fs.readFileSync(pensumPath, 'utf8'));
          const emner = JSON.parse(fs.readFileSync(emnePath, 'utf8'));
          const labels = new Map((pensum.domains || []).map((domain) => [domain.domain_id, domain.label]));
          const seenDistinctions = new Set();
          for (const emne of emner) {
            emne.area_id = emne.domain;
            emne.logic_family = emne.domain;
            emne.area_label = labels.get(emne.domain) || emne.area_label;
            let key = JSON.stringify((emne.critical_distinctions || []).map((value) => String(value).trim().toLowerCase()));
            if (seenDistinctions.has(key)) {
              const label = String(emne.title || emne.short_label || emne.emne_id).trim().toLowerCase();
              emne.critical_distinctions = [...(emne.critical_distinctions || []), `${label} som formell ordning vs ${label} som observert praksis`];
              emne.analysis_axes = [...emne.critical_distinctions];
              key = JSON.stringify(emne.critical_distinctions.map((value) => String(value).trim().toLowerCase()));
            }
            seenDistinctions.add(key);
          }
          fs.writeFileSync(emnePath, JSON.stringify(emner, null, 2) + '\n');
          NODE
          sed -i 's/emners/emner/g' scripts/audit-politikk-subject-quality.mjs
          node scripts/audit-politikk-subject-quality.mjs --write-report --no-check-report
      - name: Validate Politikk quality lift
        run: |
          node --check scripts/audit-politikk-subject-quality.mjs
          node scripts/audit-politikk-subject-quality.mjs
          node --test tests/politikk-subject-quality.test.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node --test tests/fagverk-general-engine.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-documentation-contract.test.mjs
          npm run typecheck:web
      - name: Commit quality lift
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/fag/politikk/politikkpensum_canonical_v4_5.json \
            data/fag/politikk/emner_politikk_canonical_v4_5.json \
            data/fag/politikk/methods_politikk_canonical_v4_5.json \
            data/fag/politikk/fagkart_politikk_canonical_v4_5.json \
            data/fag/politikk/emnemapping_politikk_canonical_v4_5.json \
            data/fag/politikk/supersetQUIZMAL_politikk.json \
            data/fag/politikk/merke_politikk.html \
            data/fag/politikk/politikk_runtime_manifest.json \
            data/badges/politikk.json \
            data/fagverk/fagverk_registry.json \
            scripts/audit-politikk-subject-quality.mjs \
            reports/fagverk/politikk-quality-audit.json \
            reports/fagverk/README.md
          git commit -m "Gi Politikk-faget et samlet kvalitetsløft"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
