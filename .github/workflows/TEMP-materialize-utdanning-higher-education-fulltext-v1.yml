name: TEMP materialize Utdanning Higher Education 6 of 14

on:
  push:
    branches:
      - 'agent/utdanning-higher-education-fulltext-v1'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/materialize-utdanning-higher-education-fulltext-v1.mjs'
      - 'data/fag/utdanning/higher_education_source_claim_brief_v1.json'
      - 'data/fag/utdanning/assessment_educational_measurement_source_claim_brief_v1.json'

permissions:
  contents: write

concurrency:
  group: temp-materialize-utdanning-higher-education-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Materialize Higher Education and next source-first port
        run: |
          node scripts/brief-utdanning-assessment-educational-measurement-sources-v1.mjs --write-report
          node scripts/materialize-utdanning-higher-education-fulltext-v1.mjs
          node scripts/audit-utdanning-higher-education-fulltext-v1.mjs --write-report
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/build-fagverk-release-manifest.mjs
      - name: Commit deterministic outputs locally
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/fag data/fagverk reports/fagverk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Materialize Utdanning Høyere utdanning 6/14"
      - name: Verify canonical Utdanning CI
        run: node scripts/run-utdanning-domain-ci-v1.mjs
      - name: Push verified materialization
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1 && git diff --quiet origin/${{ github.event.pull_request.head.ref || github.ref_name }}..HEAD; then exit 0; fi
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
