name: By-bolk 02 synchronize Place projections once
on:
  push:
    branches:
      - feature/by-bolk02-20-v1-20261025
    paths:
      - '.github/workflows/by-bolk02-sync-place-projections-once.yml'
permissions:
  contents: write
concurrency:
  group: by-bolk02-place-projections-once
  cancel-in-progress: false
jobs:
  update-places:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/by-bolk02-20-v1-20261025
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project tools
        run: npm ci --no-audit --no-fund
      - name: Rebuild and check canonical place projections
        run: |
          npm run places:index:build
          npm run place-open:build
          npm run epoker:places:build
          npm run place-open:check
          npm run epoker:places:check
      - name: Commit generated projections; remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/by-bolk02-sync-place-projections-once.yml
          git add -A data reports
          git add -u .github/workflows/by-bolk02-sync-place-projections-once.yml
          if git diff --cached --quiet; then
            echo "No generated differences"
            exit 0
          fi
          git commit -m "chore(by): regenerate place indices and Place-open projections"
          git pull --rebase origin feature/by-bolk02-20-v1-20261025
          git push origin HEAD:feature/by-bolk02-20-v1-20261025
