name: Tjuvholmen People v2 one-time runtime sync
on:
  push:
    branches:
      - content/tjuvholmen-people-illustrations-v2-20261114
    paths:
      - .github/workflows/tjuvholmen-people-runtime-sync-once.yml
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'Paradispartiet/History-Go' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/tjuvholmen-people-illustrations-v2-20261114
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Regenerate exact canonical Place-open runtime
        run: npm run place-open:build
      - name: Regenerate Civication People index
        run: npm run civication:history-people:build
      - name: Check generated output matches source
        run: |
          npm run place-open:check
          npm run civication:history-people:check
      - name: Commit synchronized generated data to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git add -- data/runtime/place-open/tjuvholmen.json data/runtime/place-open/astrup_fearnley.json data/runtime/people-all/part-003.json data/runtime/people-all/part-004.json data/Civication/historyPeople_index.json
          if git diff --cached --quiet; then
            echo 'Already synchronized'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(tjuvholmen): synchronize generated People runtime and Civication'
          git push origin HEAD:content/tjuvholmen-people-illustrations-v2-20261114
