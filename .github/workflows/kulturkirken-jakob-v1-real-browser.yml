name: Kulturkirken Jakob real-app acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/kulturkirken-jakob-v1-real-browser.yml'
      - 'tests/kulturkirken-jakob-v1-real-browser.test.mjs'
      - 'scripts/verify-place-quiz-browser.mjs'
      - 'data/quiz/manifest.json'
      - 'data/places/musikk/oslo/places_musikk/kulturkirken_jakob_litteratur.json'
      - 'data/quiz/musikk/kulturkirken_jakob_litteratur_sets.json'
      - 'data/quizcards/musikk/kulturkirken_jakob_litteratur_quizkort_v1.json'
      - 'data/runtime/place-open/kulturkirken_jakob_litteratur.json'
permissions:
  contents: read
concurrency:
  group: kulturkirken-jakob-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real-app:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check real place images and QuizCard on mobile, iPad, desktop
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node tests/kulturkirken-jakob-v1-real-browser.test.mjs
      - name: Full canonical Musikk quiz — 21 questions, rewards, no physical visit
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node scripts/verify-place-quiz-browser.mjs kulturkirken_jakob_litteratur --ipad
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kulturkirken-jakob-v1-real-app
          path: |
            artifacts/kulturkirken-jakob-real-browser/**
            artifacts/place-quiz/kulturkirken_jakob_litteratur/**
          if-no-files-found: ignore
          retention-days: 14
