name: Vitenskap society power ethics coverage materialize

on:
  push:
    branches:
      - agent/vitenskap-editorial-coverage-repair-3
    paths:
      - '.github/workflows/vitenskap-society-power-ethics-coverage-materialize.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/vitenskap-society-power-ethics-coverage-materialize.yml'

permissions:
  contents: write

jobs:
  materialize-and-validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/vitenskap-editorial-coverage-repair-3'
    runs-on: ubuntu-latest
    env:
      REPAIR_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate static batch 3 artifacts and materializer syntax
        run: |
          node --check scripts/materialize-vitenskap-society-power-ethics-coverage-batch.mjs
          node --check scripts/audit-fagverk-vitenskap-society-power-ethics-coverage.mjs
          node -e "JSON.parse(require('fs').readFileSync('data/fagverk/vitenskap/vitenskap-fra-observasjon-til-etterprovbar-kunnskap/06-samfunn-makt-etikk.json','utf8')); JSON.parse(require('fs').readFileSync('data/fagverk/vitenskap/vitenskap-fra-observasjon-til-etterprovbar-kunnskap/06-samfunn-makt-etikk-brief.json','utf8'))"
      - name: Materialize canonical society power ethics coverage
        run: node scripts/materialize-vitenskap-society-power-ethics-coverage-batch.mjs
      - name: Regenerate permanent reports and release projection
        run: |
          node scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs --write-report --no-check-report
          node scripts/audit-fagverk-vitenskap-society-power-ethics-coverage.mjs --write-report --no-check-report
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate permanent Vitenskap coverage gates
        run: |
          node --test tests/fagverk-vitenskap-society-power-ethics-coverage.test.mjs
          node --test tests/fagverk-vitenskap-institutions-knowledge-places-coverage.test.mjs
          node --test tests/fagverk-vitenskap-methods-models-coverage.test.mjs
          node --test tests/fagverk-vitenskap-unit1.test.mjs
          node --test tests/fagverk-vitenskap-holistic-university-breadth-completion.test.mjs
      - name: Validate shared Vitenskap, release and nested Teknologi gates
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
          node --test tests/vitenskap-teknologi-category-contract.test.mjs
      - name: Verify deterministic rerun
        run: |
          git diff > /tmp/vitenskap-batch3-before.diff
          node scripts/materialize-vitenskap-society-power-ethics-coverage-batch.mjs
          node scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs --write-report --no-check-report
          node scripts/audit-fagverk-vitenskap-society-power-ethics-coverage.mjs --write-report --no-check-report
          node scripts/build-fagverk-release-manifest.mjs
          git diff > /tmp/vitenskap-batch3-after.diff
          cmp /tmp/vitenskap-batch3-before.diff /tmp/vitenskap-batch3-after.diff
          git diff --check
      - name: Remove temporary batch 3 artifacts
        run: |
          rm -f .github/workflows/vitenskap-coverage-batch3-diagnose.yml
          rm -f .tmp/vitenskap-coverage-batch3.json
          rmdir .tmp 2>/dev/null || true
          rm -f scripts/materialize-vitenskap-society-power-ethics-coverage-batch.mjs
          rm -f .github/workflows/vitenskap-society-power-ethics-coverage-materialize.yml
      - name: Commit canonical society power ethics coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Materialize Vitenskap society power ethics coverage'
          git push origin HEAD:${REPAIR_BRANCH}
