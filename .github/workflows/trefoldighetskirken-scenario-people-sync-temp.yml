name: Temporary Trefoldighetskirken scenario People sync

on:
  push:
    branches:
      - work/trefoldighetskirken-completion-20260901
    paths:
      - .github/workflows/trefoldighetskirken-scenario-people-sync-temp.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild scenario People and make finalizer permanent
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node <<'NODE'
          const fs = require('fs');
          const p = 'tools/finalize-trefoldighetskirken-completion.mjs';
          let t = fs.readFileSync(p, 'utf8');
          const anchor = 'execFileSync("npm", ["run", "civication:history-people:build"], { cwd: root, stdio: "inherit" });';
          const addition = anchor + '\nexecFileSync(process.execPath, ["--experimental-strip-types", "scripts/build-civication-scenario-people-index.mts"], { cwd: root, stdio: "inherit" });';
          if (!t.includes(anchor)) throw new Error('Civication People finalizer anchor missing');
          if (!t.includes('build-civication-scenario-people-index.mts')) t = t.replace(anchor, addition);
          fs.writeFileSync(p, t);
          NODE
          rm -f .github/workflows/trefoldighetskirken-scenario-people-sync-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix(civication): sync Trefoldighetskirken scenario People"
          git push origin HEAD:work/trefoldighetskirken-completion-20260901
