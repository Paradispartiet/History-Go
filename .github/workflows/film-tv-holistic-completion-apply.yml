name: Apply Film TV holistic completion

on:
  push:
    branches:
      - agent/film-tv-holistic-192-completion-audit
    paths:
      - .github/workflows/film-tv-holistic-completion-apply.yml
      - scripts/audit-film-tv-holistic-completion-v1.mjs
      - tests/film-tv-holistic-completion-v1.test.mjs
      - tests/fagverk-subject-inventory.test.mjs

permissions:
  contents: write

concurrency:
  group: film-tv-holistic-completion-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate completion scripts
        run: |
          node --check scripts/audit-film-tv-holistic-completion-v1.mjs
          node --check tests/film-tv-holistic-completion-v1.test.mjs

      - name: Namespace collided screen-place claim ids
        shell: bash
        run: |
          set -o pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const chapterPath = 'data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon.json';
          const claimsPath = 'data/fagverk/film_tv/skjermsteder-identitet-og-sirkulasjon/claims.json';
          const chapter = JSON.parse(fs.readFileSync(chapterPath, 'utf8'));
          const ledger = JSON.parse(fs.readFileSync(claimsPath, 'utf8'));
          const remap = new Map();
          for (const claim of ledger.claims || []) {
            if (typeof claim.id === 'string' && claim.id.startsWith('sp-')) {
              remap.set(claim.id, `spsi-${claim.id.slice(3)}`);
            }
          }
          if (!remap.size) throw new Error('Expected sp-* claim ids to namespace in skjermsteder unit');

          const remapTrace = (value) => {
            if (Array.isArray(value)) return value.map(remapTrace);
            if (typeof value === 'string') return remap.get(value) || value;
            return value;
          };

          for (const claim of ledger.claims || []) claim.id = remap.get(claim.id) || claim.id;
          fs.writeFileSync(claimsPath, `${JSON.stringify(ledger, null, 2)}\n`);

          for (const moduleFile of chapter.moduleFiles || []) {
            const module = JSON.parse(fs.readFileSync(moduleFile, 'utf8'));
            for (const section of module.sections || []) {
              section.paragraphClaimIds = remapTrace(section.paragraphClaimIds || []);
            }
            fs.writeFileSync(moduleFile, `${JSON.stringify(module, null, 2)}\n`);
          }

          const ledgerIds = new Set((ledger.claims || []).map((claim) => claim.id));
          const missing = [];
          for (const moduleFile of chapter.moduleFiles || []) {
            const module = JSON.parse(fs.readFileSync(moduleFile, 'utf8'));
            for (const section of module.sections || []) {
              for (const id of (section.paragraphClaimIds || []).flat(Infinity)) {
                if (typeof id === 'string' && !ledgerIds.has(id)) missing.push(`${moduleFile}:${section.id}:${id}`);
              }
            }
          }
          if (missing.length) throw new Error(`Paragraph claim ids missing from namespaced ledger: ${missing.join(', ')}`);
          console.log(`Namespaced ${remap.size} skjermsteder claim ids and paragraph traces`);
          NODE

      - name: Normalize planned-unit paragraph claim traces
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const plan = JSON.parse(fs.readFileSync('data/fag/TV_og_Film/film_tv_learning_order_plan_v1.json', 'utf8'));
          const registry = JSON.parse(fs.readFileSync('data/fagverk/fagverk_registry.json', 'utf8'));
          const chapters = registry.subjects.film_tv.chapters;
          let normalized = 0;

          for (const unit of plan.planned_units || []) {
            const row = chapters.find((chapter) => chapter.id === unit.id);
            if (!row) throw new Error(`Planned unit missing from registry: ${unit.id}`);
            const chapter = JSON.parse(fs.readFileSync(row.file, 'utf8'));
            for (const moduleFile of chapter.moduleFiles || row.moduleFiles || []) {
              const module = JSON.parse(fs.readFileSync(moduleFile, 'utf8'));
              let changed = false;
              for (const section of module.sections || []) {
                const paragraphs = section.paragraphs || [];
                const traces = section.paragraphClaimIds;
                if (!Array.isArray(traces) || traces.length !== paragraphs.length) {
                  throw new Error(`${unit.id}/${section.id}: paragraphClaimIds shape does not match paragraphs`);
                }
                section.paragraphClaimIds = traces.map((trace, index) => {
                  if (typeof trace === 'string' && trace.length > 0) {
                    normalized += 1;
                    changed = true;
                    return [trace];
                  }
                  if (Array.isArray(trace) && trace.length > 0 && trace.every((id) => typeof id === 'string' && id.length > 0)) {
                    return trace;
                  }
                  throw new Error(`${unit.id}/${section.id}: paragraph ${index + 1} has invalid claim trace`);
                });
              }
              if (changed) fs.writeFileSync(moduleFile, `${JSON.stringify(module, null, 2)}\n`);
            }
          }
          console.log(`Normalized ${normalized} planned-unit paragraph claim traces to explicit arrays`);
          NODE

      - name: Reconcile canonical method bindings into chapters
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const canonical = JSON.parse(fs.readFileSync('data/fag/TV_og_Film/emner_film_tv_canonical_v4_5.json', 'utf8'));
          const registry = JSON.parse(fs.readFileSync('data/fagverk/fagverk_registry.json', 'utf8'));
          const canonicalById = new Map(canonical.map((row) => [row.emne_id, row]));
          let added = 0;
          const touched = [];

          for (const row of registry.subjects.film_tv.chapters || []) {
            const chapter = JSON.parse(fs.readFileSync(row.file, 'utf8'));
            const required = new Set();
            for (const emneId of chapter.emne_ids || []) {
              const emne = canonicalById.get(emneId);
              if (!emne) throw new Error(`${row.id}: unknown canonical emne ${emneId}`);
              for (const methodId of [...(emne.method_ids || []), ...(emne.methods || [])]) {
                if (methodId) required.add(methodId);
              }
            }
            const methods = new Set(chapter.method_ids || []);
            const before = methods.size;
            for (const methodId of required) methods.add(methodId);
            if (methods.size !== before) {
              added += methods.size - before;
              chapter.method_ids = [...methods].sort((a, b) => a.localeCompare(b, 'nb'));
              fs.writeFileSync(row.file, `${JSON.stringify(chapter, null, 2)}\n`);
              touched.push(`${row.id}:+${methods.size - before}`);
            }
          }
          console.log(`Added ${added} canonical method bindings across ${touched.length} chapters${touched.length ? ` (${touched.join(', ')})` : ''}`);
          NODE

      - name: Materialize holistic completion state
        run: node scripts/audit-film-tv-holistic-completion-v1.mjs --write

      - name: Rebuild shared deterministic audits
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs --write-report
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/audit-fagverk-film-tv-phase3.mjs --write-report
          node scripts/build-fagverk-release-manifest.mjs

      - name: Validate holistic completion audit
        run: node scripts/audit-film-tv-holistic-completion-v1.mjs

      - name: Validate holistic completion test
        run: node --test tests/film-tv-holistic-completion-v1.test.mjs

      - name: Validate shared subject inventory audit
        run: node scripts/audit-fagverk-subject-inventory.mjs

      - name: Validate shared general engine audit
        run: node scripts/audit-fagverk-general-engine.mjs

      - name: Validate shared Film TV phase3 audit
        run: node scripts/audit-fagverk-film-tv-phase3.mjs

      - name: Validate release manifest check
        run: node scripts/build-fagverk-release-manifest.mjs --check

      - name: Validate shared subject inventory test
        run: node --test tests/fagverk-subject-inventory.test.mjs

      - name: Validate shared general engine test
        run: node --test tests/fagverk-general-engine.test.mjs

      - name: Validate shared Film TV phase3 test
        run: node --test tests/fagverk-film-tv-phase3.test.mjs

      - name: Validate shared release manifest test
        run: node --test tests/fagverk-release-manifest.test.mjs

      - name: Validate Unit15 audit
        run: node scripts/audit-film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.mjs

      - name: Validate Unit15 fulltext test
        run: node --test tests/film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.test.mjs

      - name: Validate Unit15 predecessor monotonicity
        run: node --test tests/film-tv-unit15-fulltext-predecessor-monotonicity-v1.test.mjs

      - name: Validate final-gate monotonicity
        run: node --test tests/film-tv-final-gate-monotonicity-v1.test.mjs

      - name: Remove one-shot workflow
        run: rm .github/workflows/film-tv-holistic-completion-apply.yml

      - name: Commit verified completion outputs
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
            if [ "$remote_head" != "$GITHUB_SHA" ]; then
              echo "Branch moved during holistic completion run: expected $GITHUB_SHA, found $remote_head"
              exit 1
            fi
            git commit -m "Materialize Film TV holistic 192-emne completion"
            git push origin HEAD:agent/film-tv-holistic-192-completion-audit
          fi
