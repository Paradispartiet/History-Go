name: Apply Film TV holistic completion

on:
  push:
    branches:
      - agent/film-tv-holistic-192-completion-audit
    paths:
      - .github/workflows/film-tv-holistic-completion-apply.yml
      - scripts/audit-film-tv-holistic-completion-v1.mjs
      - tests/film-tv-holistic-completion-v1.test.mjs

permissions:
  contents: write

concurrency:
  group: film-tv-holistic-completion-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate completion scripts
        run: |
          node --check scripts/audit-film-tv-holistic-completion-v1.mjs
          node --check tests/film-tv-holistic-completion-v1.test.mjs

      - name: Materialize holistic completion state
        id: materialize
        shell: bash
        run: |
          set -o pipefail
          node scripts/audit-film-tv-holistic-completion-v1.mjs --write 2>&1 | tee film-tv-holistic-materialize.log

      - name: Upload materialize diagnostic
        if: failure() && steps.materialize.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: film-tv-holistic-materialize-diagnostic-${{ github.sha }}
          path: film-tv-holistic-materialize.log
          if-no-files-found: error
          retention-days: 1

      - name: Rebuild shared deterministic audits
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs --write
          node scripts/audit-fagverk-general-engine.mjs --write
          node scripts/audit-fagverk-film-tv-phase3.mjs --write
          node scripts/build-fagverk-release-manifest.mjs

      - name: Validate holistic and shared contracts
        run: |
          node scripts/audit-film-tv-holistic-completion-v1.mjs
          node --test tests/film-tv-holistic-completion-v1.test.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-film-tv-phase3.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-film-tv-phase3.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs

      - name: Validate Unit15 and monotone predecessors
        run: |
          node scripts/audit-film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.mjs
          node --test tests/film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.test.mjs
          node --test tests/film-tv-unit15-fulltext-predecessor-monotonicity-v1.test.mjs
          node --test tests/film-tv-final-gate-monotonicity-v1.test.mjs

      - name: Remove one-shot workflow
        run: rm .github/workflows/film-tv-holistic-completion-apply.yml

      - name: Commit verified completion outputs
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
            if [ "$remote_head" != "$GITHUB_SHA" ]; then
              echo "Branch moved during holistic completion run: expected $GITHUB_SHA, found $remote_head"
              exit 1
            fi
            git commit -m "Materialize Film TV holistic 192-emne completion"
            git push origin HEAD:agent/film-tv-holistic-192-completion-audit
          fi
