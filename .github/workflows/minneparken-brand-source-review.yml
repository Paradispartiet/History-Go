name: Minneparken brand source review
on:
  push:
    branches: [qa/minneparken-final-1a3c2a4-20261111]
    paths: [.github/workflows/minneparken-brand-source-review.yml]
permissions:
  contents: read
jobs:
  official-source:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir source
          curl --fail -L 'https://www.niku.no/om-oss/' -o source/niku.html
      - uses: actions/upload-artifact@v4
        with:
          name: minneparken-brand-source
          path: source/
