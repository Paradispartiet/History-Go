name: Vitenskap Unit 5 predecessor repair and finalize

on:
  push:
    branches: [agent/vitenskap-medicine-biomedicine-public-health-fulltext]
    paths:
      - '.github/workflows/vitenskap-unit5-predecessor-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitenskap-medicine-biomedicine-public-health-fulltext
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Make predecessor source-brief gates monotone
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          repairs = [
              (
                  'scripts/audit-fagverk-vitenskap-mathematics-source-brief.mjs',
                  "  assert(readiness.complete_ready === false, 'Matematikk-arbeid kan ikke gjøre Vitenskap complete');\n",
                  "  assert(readiness.next_gate === 'remaining_chapter_production_across_reconciled_university_breadth', 'Readiness har uventet next gate');\n",
                  "  if (mathStillBlocked) {\n    assert(readiness.current_inventory?.vitenskap?.registered_chapter_count === 1, 'Før fulltekstregistrering skal Vitenskap ha ett kapittel');",
                  "  if (mathStillBlocked) {\n    assert(readiness.complete_ready === false, 'Vitenskap kan ikke være complete mens matematikk fortsatt er editorial blocker');\n    assert(readiness.next_gate === 'remaining_chapter_production_across_reconciled_university_breadth', 'Readiness har uventet next gate før Unit 2-fulltekst');\n    assert(readiness.current_inventory?.vitenskap?.registered_chapter_count === 1, 'Før fulltekstregistrering skal Vitenskap ha ett kapittel');"
              ),
              (
                  'scripts/audit-fagverk-vitenskap-physics-astronomy-source-brief.mjs',
                  "  assert(readiness.complete_ready === false, 'Fysikk-arbeid kan ikke gjøre Vitenskap complete');\n",
                  "  assert(readiness.next_gate === 'remaining_chapter_production_across_reconciled_university_breadth', 'Readiness har uventet next gate');\n",
                  "  if (physicsStillBlocked) {\n    assert(readiness.current_inventory?.vitenskap?.registered_chapter_count === 2, 'Før fysikk-fulltekstregistrering skal Vitenskap ha to kapitler');",
                  "  if (physicsStillBlocked) {\n    assert(readiness.complete_ready === false, 'Vitenskap kan ikke være complete mens fysikk fortsatt er editorial blocker');\n    assert(readiness.next_gate === 'remaining_chapter_production_across_reconciled_university_breadth', 'Readiness har uventet next gate før Unit 3-fulltekst');\n    assert(readiness.current_inventory?.vitenskap?.registered_chapter_count === 2, 'Før fysikk-fulltekstregistrering skal Vitenskap ha to kapitler');"
              ),
              (
                  'scripts/audit-fagverk-vitenskap-chemistry-material-science-source-brief.mjs',
                  "  assert(readiness.complete_ready === false, 'Kjemi-arbeid kan ikke gjøre Vitenskap complete');\n",
                  "  assert(readiness.next_gate === 'remaining_chapter_production_across_reconciled_university_breadth', 'Readiness har uventet next gate');\n",
                  "  if (chemistryStillBlocked) {\n    assert(readiness.current_inventory?.vitenskap?.registered_chapter_count === 3, 'Før kjemi-fulltekstregistrering skal Vitenskap ha tre kapitler');",
                  "  if (chemistryStillBlocked) {\n    assert(readiness.complete_ready === false, 'Vitenskap kan ikke være complete mens kjemi fortsatt er editorial blocker');\n    assert(readiness.next_gate === 'remaining_chapter_production_across_reconciled_university_breadth', 'Readiness har uventet next gate før Unit 4-fulltekst');\n    assert(readiness.current_inventory?.vitenskap?.registered_chapter_count === 3, 'Før kjemi-fulltekstregistrering skal Vitenskap ha tre kapitler');"
              ),
          ]

          for path, complete_assert, gate_assert, blocked_old, blocked_new in repairs:
              replace_exact(path, complete_assert, '')
              replace_exact(path, gate_assert, '')
              replace_exact(path, blocked_old, blocked_new)
          PY
          node --check scripts/audit-fagverk-vitenskap-mathematics-source-brief.mjs
          node --check scripts/audit-fagverk-vitenskap-physics-astronomy-source-brief.mjs
          node --check scripts/audit-fagverk-vitenskap-chemistry-material-science-source-brief.mjs

      - name: Commit predecessor repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-fagverk-vitenskap-mathematics-source-brief.mjs \
            scripts/audit-fagverk-vitenskap-physics-astronomy-source-brief.mjs \
            scripts/audit-fagverk-vitenskap-chemistry-material-science-source-brief.mjs
          git diff --cached --quiet && { echo 'Expected predecessor repairs missing'; exit 1; }
          git commit -m 'Make Vitenskap source-brief gates monotone'
          git push origin HEAD:agent/vitenskap-medicine-biomedicine-public-health-fulltext

      - name: Apply fail-fast Unit 5 transition
        run: node scripts/finalize-vitenskap-medicine-unit5.mjs

      - name: Regenerate deterministic release and reports
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-fagverk-vitenskap-breadth-reconciliation.mjs --write-report --no-check-report
          node scripts/audit-fagverk-vitenskap-pilot.mjs --write-report --no-check-report
          node scripts/audit-fagverk-vitenskap-university-readiness.mjs --write-report --no-check-report
          node scripts/audit-fagverk-subject-inventory.mjs --write-report --no-check-report
          node scripts/audit-fagverk-general-engine.mjs --write-report --no-check-report

      - name: Validate Vitenskap progression through Unit 5
        run: |
          node scripts/audit-fagverk-vitenskap-breadth-reconciliation.mjs
          node scripts/audit-fagverk-vitenskap-pilot.mjs
          node scripts/audit-fagverk-vitenskap-university-readiness.mjs
          node scripts/audit-fagverk-vitenskap-unit1.mjs
          node scripts/audit-fagverk-vitenskap-mathematics-source-brief.mjs
          node scripts/audit-fagverk-vitenskap-mathematics-fulltext.mjs
          node scripts/audit-fagverk-vitenskap-physics-astronomy-source-brief.mjs
          node scripts/audit-fagverk-vitenskap-physics-astronomy-fulltext.mjs
          node scripts/audit-fagverk-vitenskap-chemistry-material-science-source-brief.mjs
          node scripts/audit-fagverk-vitenskap-chemistry-material-science-fulltext.mjs
          node scripts/audit-fagverk-vitenskap-medicine-biomedicine-public-health-source-brief.mjs
          node scripts/audit-fagverk-vitenskap-medicine-biomedicine-public-health-fulltext.mjs
          node scripts/build-fagverk-release-manifest.mjs --check

      - name: Validate permanent Vitenskap tests
        run: |
          node --test tests/fagverk-vitenskap-breadth-reconciliation.test.mjs
          node --test tests/fagverk-vitenskap-pilot.test.mjs
          node --test tests/fagverk-vitenskap-university-readiness.test.mjs
          node --test tests/fagverk-vitenskap-unit1.test.mjs
          node --test tests/fagverk-vitenskap-mathematics-source-brief.test.mjs
          node --test tests/fagverk-vitenskap-mathematics-fulltext.test.mjs
          node --test tests/fagverk-vitenskap-physics-astronomy-source-brief.test.mjs
          node --test tests/fagverk-vitenskap-physics-astronomy-fulltext.test.mjs
          node --test tests/fagverk-vitenskap-chemistry-material-science-source-brief.test.mjs
          node --test tests/fagverk-vitenskap-chemistry-material-science-fulltext.test.mjs
          node --test tests/fagverk-vitenskap-medicine-biomedicine-public-health-source-brief.test.mjs
          node --test tests/fagverk-vitenskap-medicine-biomedicine-public-health-fulltext.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs

      - name: Validate shared Fagverk and nested Teknologi
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/vitenskap-teknologi-category-contract.test.mjs
          node tools/build-teknologi-editorial-v3.mjs --check
          node tools/validate-teknologi-foundation.mjs
          node tools/validate-teknologi-quality-v2_1.mjs
          node tools/validate-teknologi-ontology-v2_2.mjs
          node tools/validate-teknologi-evidence-v2_3.mjs
          node scripts/validate-teknologi-editorial-v3.mjs

      - name: Validate diff
        run: git diff --check

      - name: Commit deterministic Unit 5 state and clean temporary helpers
        run: |
          git rm .github/workflows/vitenskap-unit5-predecessor-repair.yml \
            .github/workflows/vitenskap-unit5-finalize.yml \
            scripts/finalize-vitenskap-medicine-unit5.mjs
          git add data/fag/vitenskap/vitenskap_university_readiness_v1.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            data/fagverk/subject_status.json \
            reports/fagverk/vitenskap-breadth-reconciliation-audit.json \
            reports/fagverk/vitenskap-pilot-audit.json \
            reports/fagverk/vitenskap-university-readiness-audit.json \
            reports/fagverk/subject-baseline.json \
            reports/fagverk/general-engine-audit.json \
            scripts/audit-fagverk-vitenskap-breadth-reconciliation.mjs \
            scripts/audit-fagverk-vitenskap-university-readiness.mjs \
            scripts/audit-fagverk-vitenskap-pilot.mjs \
            scripts/audit-fagverk-vitenskap-chemistry-material-science-fulltext.mjs \
            tests/fagverk-vitenskap-breadth-reconciliation.test.mjs \
            tests/fagverk-vitenskap-pilot.test.mjs \
            tests/fagverk-vitenskap-university-readiness.test.mjs \
            tests/fagverk-vitenskap-chemistry-material-science-fulltext.test.mjs
          git diff --cached --quiet && { echo 'Expected Unit 5 state changes missing'; exit 1; }
          git commit -m 'Register Vitenskap medicine fulltext and open final audit'
          git push origin HEAD:agent/vitenskap-medicine-biomedicine-public-health-fulltext
