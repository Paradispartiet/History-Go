name: Etne People of Places batch 6 integration

on:
  pull_request:
    paths:
      - 'data/people/musikk/vestland/etne/old_river_saloon/**'
      - 'reports/etne-people-of-places-batch-6-research.md'
      - '.github/workflows/etne-people-batch-6-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.number == 2277
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-people-batch-6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          mkdir -p reports/etne-people-of-places-batch-6-integration
          npm install --no-audit --no-fund 2>&1 | tee reports/etne-people-of-places-batch-6-integration/npm-install.txt
      - name: Register batch exactly once
        run: |
          node --input-type=module <<'NODE' | tee reports/etne-people-of-places-batch-6-integration/manifest-update.txt
          import fs from 'node:fs';
          const p='data/people/manifest.json';
          const addition='people/musikk/vestland/etne/old_river_saloon/people_old_river_saloon_batch1.json';
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          m.files=m.files.filter((v)=>v!==addition);m.files.push(addition);
          if(m.files.filter((v)=>v===addition).length!==1)throw new Error('manifest registration failed');
          fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');
          console.log(`PASS ${addition}`);
          NODE
      - name: Run people checks
        run: bash scripts/check-people.sh 2>&1 | tee reports/etne-people-of-places-batch-6-integration/check-people.txt
      - name: Run People of Places audit
        run: npm run audit:people-of-places 2>&1 | tee reports/etne-people-of-places-batch-6-integration/people-of-places-audit.txt
      - name: Validate targets
        run: |
          node --input-type=module <<'NODE' | tee reports/etne-people-of-places-batch-6-integration/targeted-validation.json
          import fs from 'node:fs';import path from 'node:path';
          const ids=['aslaug_olden_mala','rune_kringlebotten','amalie_kringlebotten'];
          const manifest=JSON.parse(fs.readFileSync('data/people/manifest.json','utf8'));const all=[];
          for(const rel of manifest.files){const doc=JSON.parse(fs.readFileSync(path.join('data',rel),'utf8'));const rows=Array.isArray(doc)?doc:Array.isArray(doc?.people)?doc.people:[];for(const person of rows)all.push(person);}
          const counts=new Map();for(const p of all)if(p?.id)counts.set(p.id,(counts.get(p.id)||0)+1);const dup=[...counts.entries()].filter(([,c])=>c>1);if(dup.length)throw new Error(`duplicates ${JSON.stringify(dup)}`);
          const places=new Set(JSON.parse(fs.readFileSync('data/places/places_index.json','utf8')).map((p)=>p.id));if(!places.has('old_river_saloon_etne'))throw new Error('target place inactive');
          const results=[];for(const id of ids){const rows=all.filter((p)=>p?.id===id);if(rows.length!==1)throw new Error(`${id}: rows ${rows.length}`);const p=rows[0];if(p.placeId!=='old_river_saloon_etne'||(p.places||[]).filter((x)=>x==='old_river_saloon_etne').length!==1)throw new Error(`${id}: place mismatch`);results.push({id,canonicalRows:1,placeId:p.placeId});}
          console.log(JSON.stringify({status:'PASS',totalPeople:all.length,uniquePeopleIds:counts.size,duplicatePeopleIds:0,results},null,2));
          NODE
      - name: Diff check
        run: git diff --check | tee reports/etne-people-of-places-batch-6-integration/git-diff-check.txt
      - name: Remove workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/etne-people-batch-6-integration.yml
          git add data/people/manifest.json reports/etne-people-of-places-batch-6-integration
          git diff --cached --check
          git commit -m "Integrate Etne People of Places batch 6"
          git push origin HEAD:agent/etne-people-batch-6
