name: TEMP Civication Lager drift rollout materialize

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/Civication/roleModels/naeringsliv/lager_og_driftsmedarbeider.json'
      - 'data/Civication/mailFamilies/naeringsliv/conflict/lager_og_driftsmedarbeider_conflict.json'
      - 'data/Civication/mailFamilies/naeringsliv/story/lager_og_driftsmedarbeider_story.json'
      - 'data/Civication/mailFamilies/naeringsliv/event/lager_og_driftsmedarbeider_event.json'
      - 'tests/civication-lager-og-driftsmedarbeider-rollout-playability.test.js'
      - '.github/workflows/civication-lager-drift-rollout-materialize.yml'

permissions:
  contents: write

concurrency:
  group: temp-civication-lager-drift-rollout
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-rollout-lager-drift-playable
          fetch-depth: 0

      - name: Lock rollout baseline lineage
        run: git merge-base --is-ancestor 8189753e4d72fa8442b61e8470966790f855a4a0 HEAD

      - name: Regenerate Career Gameplay Matrix
        run: node scripts/audit-civication-career-gameplay.mjs --write

      - name: Regenerate compiled scene registry
        run: node scripts/build-civication-scene-registry.mjs --write

      - name: Verify generated matrix
        run: node scripts/audit-civication-career-gameplay.mjs --check

      - name: Verify compiled scene registry
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Verify Lager drift rollout target
        run: node tests/civication-lager-og-driftsmedarbeider-rollout-playability.test.js

      - name: Verify roleModel ownership remains distinct
        run: node tests/civication-career-rolemodel-ownership.test.js

      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify complete Civication suite
        run: npm run test:civication

      - name: Diff hygiene
        run: git diff --check

      - name: Commit generated rollout artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/Civication/careerGameplayMatrix.json data/Civication/compiledSceneRegistryV1.json reports/civication-career-gameplay-matrix.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Regenerate Civication artifacts for Lager drift rollout'
          git push origin HEAD:agent/civication-rollout-lager-drift-playable
