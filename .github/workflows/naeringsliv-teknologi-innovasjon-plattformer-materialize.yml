name: Materialize Næringsliv teknologi chapter

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".bootstrap/naeringsliv-teknologi/**"
      - ".github/workflows/naeringsliv-teknologi-innovasjon-plattformer-materialize.yml"

permissions:
  contents: write

concurrency:
  group: naeringsliv-teknologi-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct materializer
        run: |
          mkdir -p scripts
          cat .bootstrap/naeringsliv-teknologi/part-* \
            | base64 -d \
            | gzip -d \
            > scripts/materialize-naeringsliv-chapter-teknologi-innovasjon-plattformer-v1.mjs
          node --check scripts/materialize-naeringsliv-chapter-teknologi-innovasjon-plattformer-v1.mjs

      - name: Restrict claim collection to claim fields
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/materialize-naeringsliv-chapter-teknologi-innovasjon-plattformer-v1.mjs';
          const source = fs.readFileSync(file, 'utf8');
          const pattern = /function collectClaimIds\(value, target = new Set\(\)\) \{[\s\S]*?\n\}\nconst PLACE_FILES/;
          const replacement = `function collectClaimIds(value, target = new Set(), insideClaimField = false) {
            if (Array.isArray(value)) {
              for (const item of value) collectClaimIds(item, target, insideClaimField);
            } else if (value && typeof value === "object") {
              for (const [key, item] of Object.entries(value)) {
                const isClaimField = key === "claimIds" || key === "paragraphClaimIds" || key === "keyPointClaimIds";
                collectClaimIds(item, target, insideClaimField || isClaimField);
              }
            } else if (insideClaimField && typeof value === "string") {
              target.add(value);
            }
            return target;
          }
          const PLACE_FILES`;
          const matches = source.match(pattern);
          if (!matches || matches.length !== 1) {
            throw new Error('Expected exactly one broad collectClaimIds implementation in materializer');
          }
          const patched = source.replace(pattern, replacement);
          fs.writeFileSync(file, patched);
          NODE
          node --check scripts/materialize-naeringsliv-chapter-teknologi-innovasjon-plattformer-v1.mjs

      - name: Materialize and validate chapter
        id: materialize
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/materialize-naeringsliv-chapter-teknologi-innovasjon-plattformer-v1.mjs \
            2>&1 | tee .bootstrap/naeringsliv-teknologi/materialize-error.log

      - name: Preserve available audit inputs on failure
        if: steps.materialize.outcome == 'failure'
        shell: bash
        run: |
          mkdir -p .bootstrap/naeringsliv-teknologi/debug
          : > .bootstrap/naeringsliv-teknologi/debug/files.txt
          while IFS='|' read -r src dst; do
            if [ -f "$src" ]; then
              cp "$src" ".bootstrap/naeringsliv-teknologi/debug/$dst"
              echo "$src -> debug/$dst" >> .bootstrap/naeringsliv-teknologi/debug/files.txt
            else
              echo "MISSING $src" >> .bootstrap/naeringsliv-teknologi/debug/files.txt
            fi
          done <<'FILES'
          data/fagverk/naeringsliv/teknologi-innovasjon-plattformer.json|chapter.json
          data/fagverk/naeringsliv/teknologi-innovasjon-plattformer/brief.json|brief.json
          data/fagverk/naeringsliv/teknologi-innovasjon-plattformer/claims.json|claims.json
          data/fagverk/naeringsliv/teknologi-innovasjon-plattformer/01-grunnlag.json|01-grunnlag.json
          data/fagverk/naeringsliv/teknologi-innovasjon-plattformer/02-fordypning.json|02-fordypning.json
          data/fagverk/naeringsliv/teknologi-innovasjon-plattformer/03-anvendelse.json|03-anvendelse.json
          scripts/audit-naeringsliv-chapter-teknologi-innovasjon-plattformer.mjs|audit.mjs
          scripts/materialize-naeringsliv-chapter-teknologi-innovasjon-plattformer-v1.mjs|materializer.mjs
          FILES

      - name: Write compact failure diagnostic
        if: steps.materialize.outcome == 'failure'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const logPath = '.bootstrap/naeringsliv-teknologi/materialize-error.log';
          const raw = fs.existsSync(logPath) ? fs.readFileSync(logPath, 'utf8') : '';
          const lines = raw.split(/\r?\n/).filter(Boolean);
          const errorIndex = lines.findIndex(line => /(^|\s)(Error:|AssertionError|SyntaxError|TypeError|ReferenceError)/.test(line));
          const start = errorIndex >= 0 ? Math.max(0, errorIndex - 4) : Math.max(0, lines.length - 40);
          const selected = lines.slice(start, Math.min(lines.length, start + 80));
          const out = [
            '# Materializer failure',
            '',
            '```text',
            ...selected,
            '```',
            ''
          ];
          fs.writeFileSync('.bootstrap/naeringsliv-teknologi/materialize-failure.md', out.join('\n'));
          NODE

      - name: Commit diagnostic on failure
        if: steps.materialize.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .bootstrap/naeringsliv-teknologi/materialize-error.log \
                  .bootstrap/naeringsliv-teknologi/materialize-failure.md \
                  .bootstrap/naeringsliv-teknologi/debug
          if ! git diff --cached --quiet; then
            git commit -m "Bevar auditgrunnlag for Næringsliv teknologi"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
          exit 1

      - name: Remove transport chunks
        if: steps.materialize.outcome == 'success'
        run: |
          rm -rf .bootstrap/naeringsliv-teknologi
          rm -f .github/workflows/naeringsliv-teknologi-innovasjon-plattformer-materialize.yml
          rm -f scripts/materialize-naeringsliv-chapter-teknologi-innovasjon-plattformer-v1.mjs

      - name: Commit materialized production files
        if: steps.materialize.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialization changes to commit."
            exit 0
          fi
          git commit -m "Materialiser Næringsliv teknologi, innovasjon og plattformer"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
