name: Oslo coordinate batch 22 integration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-coordinate-batch-22-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect persistent coordinate evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT='reports/oslo-coordinate-control-batch-22'
          mkdir -p "$OUT"

          npm run places:coords:find:address -- --address 'Hausmanns gate 14 Oslo' \
            | tee "$OUT/kulturkirken_jakob-geonorge.json"
          npm run places:coords:find:address -- --address 'Universitetsgata 22 Oslo' \
            | tee "$OUT/norli_universitetsgata_22-geonorge.json"
          npm run places:coords:find:address -- --address 'Universitetsgata 24 Oslo' \
            | tee "$OUT/norli_universitetsgata_24-geonorge.json"
          npm run places:coords:find:address -- --address 'Dalsbergstien 3 Oslo' \
            | tee "$OUT/ruth_maier_dalsbergstien_3-geonorge.json"

          curl -fsSL -A 'History-Go-coordinate-audit/1.0' \
            'https://www.wikidata.org/wiki/Special:EntityData/Q44179381.json' \
            | tee "$OUT/ruth_maier_wikidata_Q44179381.json" >/dev/null
          curl -fsSL -A 'History-Go-coordinate-audit/1.0' \
            'https://api.openstreetmap.org/api/0.6/node/10819902960.json' \
            | tee "$OUT/oskar_braaten_osm_node_10819902960.json" >/dev/null
          curl -fsSL -A 'History-Go-coordinate-audit/1.0' \
            'https://api.openstreetmap.org/api/0.6/relation/7723252.json' \
            | tee "$OUT/alexander_kiellands_plass_osm_relation_7723252.json" >/dev/null
          curl -fsSL -A 'History-Go-coordinate-audit/1.0' \
            'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&q=Alexander%20Kiellands%20plass%20Oslo' \
            | tee "$OUT/alexander_kiellands_plass-nominatim.json" >/dev/null

          cat > "$OUT/source-notes.md" <<'EOF'
          # Supplerende kildeankre

          - Inger Hagerups plass: Lokalhistoriewiki `https://lokalhistoriewiki.no/Inger_Hagerups_plass` oppgir 59.9221744, 10.853756 og beskriver plassen som snuplassen i enden av Hagapynten. Oslo byleksikon bekrefter samme fysiske identitet.
          - Alexander Kiellands plass: Oslo kommune `https://www.oslo.kommune.no/natur-kultur-og-fritid/tur-og-friluftsliv/parker-og-lekeplasser/alexander-kiellands-plass/` avgrenser plassen mellom Uelands gate, Maridalsveien og Waldemar Thranes gate.
          - Sigrid Undset-statuen: Oslo byleksikon og Oslo kommunes 17. mai-program bekrefter skulpturen i Stensparken, men batchen fant ikke et entydig stabilt objektpunkt. Kontroll 135 avsluttes derfor som `needs_review`.
          - Norli Universitetsgata: Norli oppgir Universitetsgata 22–24. Geonorge-finneren gir separate punkter for 22 og 24; ingen av dem velges uten dokumentert hovedanker.
          EOF

      - name: Apply batch 22
        run: node scripts/apply-oslo-coordinate-batch-22.mjs

      - name: Build global place index
        run: |
          set -o pipefail
          npm run places:index:build | tee reports/oslo-coordinate-control-batch-22/places-index-build.txt

      - name: Validate split manifest sync
        run: |
          set -o pipefail
          npm run audit:places-split-manifest-sync | tee reports/oslo-coordinate-control-batch-22/split-manifest-audit.txt

      - name: Validate source and runtime parity
        run: |
          set -o pipefail
          npm run places:index:check | tee reports/oslo-coordinate-control-batch-22/places-index-check.txt

      - name: Validate coordinate quality
        run: |
          set -o pipefail
          npm run places:coords:quality | tee reports/oslo-coordinate-control-batch-22/coordinate-quality.txt

      - name: Validate strict coordinate intake against merge-base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE="$(git merge-base HEAD origin/main)"
          echo "COORD_INTAKE_BASE=$BASE" | tee reports/oslo-coordinate-control-batch-22/strict-intake-base.txt
          COORD_INTAKE_BASE="$BASE" npm run places:coords:intake \
            | tee reports/oslo-coordinate-control-batch-22/strict-intake.txt

      - name: Validate coordinate evidence
        run: |
          set -o pipefail
          npm run places:coords:evidence:audit | tee reports/oslo-coordinate-control-batch-22/evidence-audit.txt

      - name: Validate diff whitespace
        run: git diff --check

      - name: Remove temporary integration files and commit result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/oslo-coordinate-batch-22-evidence.yml
          rm -f .github/workflows/oslo-coordinate-batch-22-integrate.yml
          rm -f scripts/apply-oslo-coordinate-batch-22.mjs
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete Oslo coordinate control batch 22'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
