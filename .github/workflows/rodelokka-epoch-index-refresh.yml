name: Rodeløkka epoch index refresh

on:
  push:
    branches:
      - agent/rodelokka-production-replay-20260905

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rodelokka-production-replay-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate epoch place index
        run: |
          npm run epoker:places:build
          npm run epoker:places:check
      - name: Commit refreshed generated index only
        run: |
          rm .github/workflows/rodelokka-epoch-index-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/epoker/epoke-place-index.json .github/workflows/rodelokka-epoch-index-refresh.yml
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Rodeløkka epoch place index"
          git push origin HEAD:agent/rodelokka-production-replay-20260905
