name: TEMP Radhusplassen production build v2

on:
  push:
    branches:
      - agent/radhusplassen-production-20260907-temp
    paths:
      - '.github/workflows/TEMP_radhusplassen_production_build_v2.yml'
      - 'tools/patch-radhusplassen-finalizer-v2.mjs'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Prepare clean source on fresh main
        env:
          BASE_SHA: 4df9b1476d870fbe299e9f6a13d04ccae99ab2d2
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euxo pipefail
          git show "$SOURCE_SHA:tools/finalize-radhusplassen-completion.mjs" > /tmp/finalize-radhusplassen-completion.mjs
          git show "$SOURCE_SHA:tools/patch-radhusplassen-finalizer-v2.mjs" > /tmp/patch-radhusplassen-finalizer-v2.mjs
          git checkout --detach "$BASE_SHA"
          cp /tmp/finalize-radhusplassen-completion.mjs tools/finalize-radhusplassen-completion.mjs
          node /tmp/patch-radhusplassen-finalizer-v2.mjs
      - name: Install dependencies
        run: npm ci
      - name: Materialize Radhusplassen
        run: node tools/finalize-radhusplassen-completion.mjs
      - name: Regenerate deterministic global outputs
        run: |
          set -euxo pipefail
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --write
          npm run place-open:build
          npm run epoker:places:build
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-quiz-manifest-v2.mjs
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/place-image-audit.json
          node - <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('/tmp/place-image-audit.json','utf8'));
          const p='data/places/place_image_backlog_summary.json';
          const s=JSON.parse(fs.readFileSync(p,'utf8'));
          s.generatedAt='2026-09-07';
          s.generatedFromCommit='radhusplassen_production_20260907';
          s.totalPlaces=report.totalPlaces;
          s.summary={validLocal:report.summary.local,validRemote:report.summary.remote,optionalMissing:report.summary.optional,missing:report.summary.missing,invalidLocalPath:report.summary.invalid,remaining:report.summary.missing+report.summary.invalid};
          s.byCategory ||= {};
          for(const [k,v] of Object.entries(report.byCategory||{})) s.byCategory[k]={total:v.total,valid:v.local+v.remote,optional:v.optional,missing:v.missing,invalid:v.invalid};
          fs.writeFileSync(p,JSON.stringify(s,null,2)+'\n');
          NODE
      - name: Validate target and global contracts
        run: |
          set -euxo pipefail
          node --test tests/radhusplassen-completion.test.mjs
          npm run place-open:check
          npm run epoker:places:check
          node scripts/build-fagverk-release-manifest.mjs --check
          node scripts/audit-place-images.mjs --mode=all --verify-summary=data/places/place_image_backlog_summary.json
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run leksikon:ids:check
          npm run check:stories
          npm run audit:knowledge
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Commit clean production output
        env:
          BASE_SHA: 4df9b1476d870fbe299e9f6a13d04ccae99ab2d2
        run: |
          set -euxo pipefail
          git add -A
          git status --short
          git reset -- .github/workflows/TEMP_radhusplassen_production_build_v2.yml .github/workflows/TEMP_radhusplassen_production_build.yml tools/patch-radhusplassen-finalizer-v2.mjs || true
          rm -f .github/workflows/TEMP_radhusplassen_production_build_v2.yml .github/workflows/TEMP_radhusplassen_production_build.yml tools/patch-radhusplassen-finalizer-v2.mjs
          git add -A
          if git diff --cached --name-only | grep -E '(^|/)(TEMP|temp)[^/]*|^\.github/workflows/TEMP'; then
            echo 'TEMP path leaked into clean production output' >&2
            exit 1
          fi
          git config user.name 'history-go-production'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Complete Radhusplassen full place production'
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git push --force origin HEAD:refs/heads/agent/radhusplassen-production-20260907
