name: TEMP Subkultur Program og koordinering prerequisites

on:
  push:
    branches:
      - agent/civication-subkultur-program-og-koordinering-prerequisites-20260904

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') && !contains(github.event.head_commit.message, '[diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntax check prerequisite materializer
        run: node --check .github/TEMP-subkultur-program-og-koordinering-prerequisites-materializer.mjs
      - name: Materialize authored prerequisites
        run: node .github/TEMP-subkultur-program-og-koordinering-prerequisites-materializer.mjs
      - name: Regenerate role-pack index
        run: node scripts/audit-civication-role-packs.mjs
      - name: Normalize generated role-pack EOF
        run: node -e "const fs=require('fs');const p='docs/CIVICATION_ROLE_PACK_INDEX.md';const s=fs.readFileSync(p,'utf8');fs.writeFileSync(p,s.replace(/\n+$/,'\n'));"
      - name: Regenerate scenario People
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - name: Verify scenario People parity
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
      - name: Test scenario People invariants
        run: node --test tests/civication-scenario-people.test.mjs
      - name: Regenerate career gameplay matrix
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Regenerate Role World readiness outputs
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Focused prerequisite gate
        run: node tests/civication-subkultur-program-og-koordinering-prerequisites.test.js
      - name: Subkultur career compatibility
        run: node tests/civication-subkultur-career-architecture.test.js
      - name: Career gameplay parity
        run: node scripts/audit-civication-career-gameplay.mjs --check
      - name: Role World readiness parity
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --check
      - name: Regenerate compiled scene registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Compiled scene registry parity
        run: node scripts/build-civication-scene-registry.mjs --check
      - name: Full Civication
        run: npm run test:civication
      - name: Repository diff gate
        run: git diff --check
      - name: Publish permanent prerequisite state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/TEMP-subkultur-program-og-koordinering-prerequisites-materializer.mjs
          rm -f .github/workflows/TEMP-subkultur-program-og-koordinering-prerequisites.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No permanent changes"
            exit 1
          fi
          git diff --cached --check
          git commit -m "Materialize Subkultur Program og koordinering prerequisites [materialized]"
          git push origin HEAD:${GITHUB_REF_NAME}
