name: Torggata phase 8C materialize

on:
  push:
    branches:
      - agent/torggata-phase8c-brands

permissions:
  contents: write

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize Torggata 8C
        run: python tools/_tmp_materialize_torggata_phase8c.py

      - name: Validate JSON and JS syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/brands/brands_master.json','utf8')); JSON.parse(require('fs').readFileSync('data/brands/brands_by_place.json','utf8')); JSON.parse(require('fs').readFileSync('reports/place-production/torggata-phase8c-brands-audit-v1.json','utf8'));"
          node --check js/brands/brands_loader.js
          node --check js/ui/place-card.js

      - name: Focused 8C Brands regression
        run: node --test tests/torggata-phase8c-brands.test.mjs

      - name: Preserve prior Torggata round regressions
        run: |
          node --test tests/torggata-phase8a-closeout.test.mjs
          node --test tests/torggata-phase8b-objects.test.mjs

      - name: Canonical brand definition guard
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const rules = JSON.parse(fs.readFileSync('data/brands/brand_rules_v1_1.json','utf8'));
          const audit = JSON.parse(fs.readFileSync('reports/place-production/torggata-phase8c-brands-audit-v1.json','utf8'));
          if (rules.status !== 'canonical_brand_definition') throw new Error('Brand definition is not canonical');
          if (audit.result !== 'PASS') throw new Error('8C audit is not PASS');
          if (!/Ingen antallskvote/.test(audit.quota_policy || '')) throw new Error('Quota policy missing');
          NODE

      - name: Persist validated 8C batch
        shell: bash
        run: |
          rm -f .github/workflows/torggata-phase8c-materialize.yml tools/_tmp_materialize_torggata_phase8c.py
          git add -A
          git diff --cached --name-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Godkjenn Torggata fase 8C Brands"
          git push origin HEAD:agent/torggata-phase8c-brands
