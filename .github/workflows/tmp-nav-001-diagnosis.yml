name: TEMP nav_001 repair validation

on:
  push:
    branches:
      - 'civication/nav-001-diagnosis'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply candidate audit repair
        run: python3 .tmp-nav-001-repair.py

      - name: Run focused reachability regression
        run: node tests/civication-scene-pipeline-ignored-source-duplicates.test.js

      - name: Verify strict audit delta
        run: node .tmp-nav-001-verify.mjs

      - name: Verify compiled registry remains synchronized
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Run complete Civication suite
        run: npm run test:civication

      - name: Commit validated repair
        run: |
          if git diff --quiet -- scripts/audit-civication-scene-pipeline.mjs tests/civication-scene-pipeline-ignored-source-duplicates.test.js; then
            echo 'No repair diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-civication-scene-pipeline.mjs tests/civication-scene-pipeline-ignored-source-duplicates.test.js
          git commit -m 'Exclude legacy jobbmail inventory from duplicate blockers'
          git push
