name: Tveten targeted epoch synchronization (temporary)
on:
  push:
    branches:
      - content/tveten-gard-vferdig-media-20261110
    paths:
      - .github/workflows/tveten-epoch-regenerate-temp.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/tveten-gard-vferdig-media-20261110
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local Tveten contract
        run: node --test tests/tveten-gard-vferdig-modules.test.mjs tests/tveten-gard-vferdig-content.test.mjs
      - name: Regenerate derived epoch history
        run: node scripts/build-epoke-place-index.mjs
      - name: Commit only epoch index
        run: |
          git add data/epoker/epoke-place-index.json
          if git diff --cached --quiet; then
            echo "Epoch index already current"
            exit 0
          fi
          git -c user.name="HistoryGo CI" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Sync Tveten epoch index with sourced chronology"
          git push origin HEAD:content/tveten-gard-vferdig-media-20261110
