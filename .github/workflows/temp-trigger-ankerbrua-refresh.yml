name: Temporary Ankerbrua clean finalizer

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.pull_request.number == 2582 &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean Ankerbrua branch
        uses: actions/checkout@v4
        with:
          ref: agent/fill-ankerbrua-rounds-clean
          fetch-depth: 0

      - name: Detect pending finalizer
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/ankerbrua-finalizer-job.mjs ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.pending.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.pending.outputs.run == 'true'
        run: npm ci

      - name: Materialize and validate Ankerbrua
        if: steps.pending.outputs.run == 'true'
        run: node scripts/ankerbrua-finalizer-job.mjs

      - name: Validate generated indexes
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:places-split-manifest-sync
          npm run places:index:check

      - name: Validate unchanged coordinate contract
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run test:coordinate-source-contract
          npm run places:coords:quality
          npm run places:coords:evidence:audit

      - name: Capture place health
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm run health:places
          echo "health:places exit code: $?"
          exit 0

      - name: Publish generated branch state
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            reports/coordinate-evidence-audit.md \
            reports/people-of-places-status.json \
            reports/people-of-places-status.md \
            reports/place-coordinate-intake-gate.md \
            reports/place-coordinate-quality-gate.md
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize clean Ankerbrua rounds"
          git pull --rebase origin agent/fill-ankerbrua-rounds-clean
          git push origin HEAD:agent/fill-ankerbrua-rounds-clean
