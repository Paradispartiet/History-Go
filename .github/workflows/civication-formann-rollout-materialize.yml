name: TEMP Civication Formann rollout materialize

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/Civication/roleModels/naeringsliv/formann_arbeidsleder.json'
      - 'tests/civication-formann-rollout-playability.test.js'
      - '.github/workflows/civication-formann-rollout-materialize.yml'

permissions:
  contents: write

concurrency:
  group: temp-civication-formann-rollout
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-rollout-formann-playable
          fetch-depth: 0

      - name: Lock rollout baseline lineage
        run: git merge-base --is-ancestor 448eb090267f23ed093b11b0af4c77eeb84d7220 HEAD

      - name: Regenerate Career Gameplay Matrix
        run: node scripts/audit-civication-career-gameplay.mjs --write

      - name: Verify generated matrix
        run: node scripts/audit-civication-career-gameplay.mjs --check

      - name: Verify Formann rollout target
        run: node tests/civication-formann-rollout-playability.test.js

      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify complete Civication suite
        run: npm run test:civication

      - name: Diff hygiene
        run: git diff --check

      - name: Commit generated rollout artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Regenerate Career Gameplay Matrix for Formann rollout'
          git push origin HEAD:agent/civication-rollout-formann-playable
