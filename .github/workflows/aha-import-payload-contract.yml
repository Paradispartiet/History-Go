name: AHA import payload contract

on:
  pull_request:
    paths:
      - "js/aha.js"
      - "AHA/contracts/**"
      - "AHA/docs/**"
      - "AHA/README.md"
      - "tests/aha-import-payload-v1-contract.test.js"
      - "tests/aha-ownership-boundary.test.js"
      - ".github/workflows/aha-import-payload-contract.yml"
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check bridge syntax
        run: node --check js/aha.js
      - name: Validate produced payload
        run: node tests/aha-import-payload-v1-contract.test.js
      - name: Enforce AHA ownership boundary
        run: node tests/aha-ownership-boundary.test.js
