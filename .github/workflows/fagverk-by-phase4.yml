name: Fagverk By Phase 4 registry gate

on:
  pull_request:
    paths:
      - 'data/fagverk/by/**'
      - 'data/fagverk/fagverk_registry.json'
      - 'data/fagverk/subject_status.json'
      - 'data/fagverk/fagverk_release.json'
      - 'data/fag/fag_manifest.json'
      - 'scripts/audit-fagverk-by-*-phase4.mjs'
      - 'scripts/audit-fagverk-subject-inventory.mjs'
      - 'scripts/audit-fagverk-general-engine.mjs'
      - 'scripts/build-fagverk-release-manifest.mjs'
      - 'scripts/run-fagverk-by-phase4-ci-v1.mjs'
      - 'tests/fagverk-by-*-phase4.test.mjs'
      - 'tests/fagverk-subject-inventory.test.mjs'
      - 'tests/fagverk-general-engine.test.mjs'
      - 'tests/fagverk-release-manifest.test.mjs'
      - 'reports/fagverk/by-*-phase4-audit.json'
      - '.github/workflows/fagverk-by-phase4.yml'
  push:
    branches: [main]
    paths:
      - 'data/fagverk/by/**'
      - 'data/fagverk/fagverk_registry.json'
      - 'data/fagverk/subject_status.json'
      - 'data/fagverk/fagverk_release.json'
      - 'data/fag/fag_manifest.json'
      - 'scripts/audit-fagverk-by-*-phase4.mjs'
      - 'scripts/audit-fagverk-subject-inventory.mjs'
      - 'scripts/audit-fagverk-general-engine.mjs'
      - 'scripts/build-fagverk-release-manifest.mjs'
      - 'scripts/run-fagverk-by-phase4-ci-v1.mjs'
      - 'tests/fagverk-by-*-phase4.test.mjs'
      - 'tests/fagverk-subject-inventory.test.mjs'
      - 'tests/fagverk-general-engine.test.mjs'
      - 'tests/fagverk-release-manifest.test.mjs'
      - 'reports/fagverk/by-*-phase4-audit.json'
      - '.github/workflows/fagverk-by-phase4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fagverk-by-phase4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate affected By Phase 4 chapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run shared gates once and affected chapter gates
        env:
          FAGVERK_BY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FAGVERK_BY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/run-fagverk-by-phase4-ci-v1.mjs
