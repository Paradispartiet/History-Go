name: Batch 7 base contract repair

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-people-zero-gap-batch7-v3
          fetch-depth: 0
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Repair Pippifestival secondary badge
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'data/places/kunst/vestland/etne/skanevik_fjordhotel_pippifestivalen.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const place = data.find(item => item.id === 'skanevik_fjordhotel_pippifestivalen');
          if (!place) throw new Error('Missing Pippifestival place');
          place.secondaryBadgeIds = ['scenekunst'];
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          NODE

      - name: Diagnose Knowledge contract commands
        id: knowledge
        shell: bash
        run: |
          set +e
          : > /tmp/knowledge-debug.log
          npm run build:scripts >> /tmp/knowledge-debug.log 2>&1
          build_status=$?
          npm run knowledge:canonical:check >> /tmp/knowledge-debug.log 2>&1
          canonical_status=$?
          npm run knowledge:legacy:check >> /tmp/knowledge-debug.log 2>&1
          legacy_status=$?
          npm run audit:knowledge >> /tmp/knowledge-debug.log 2>&1
          audit_status=$?
          cat /tmp/knowledge-debug.log
          echo "build_status=$build_status" >> "$GITHUB_OUTPUT"
          echo "canonical_status=$canonical_status" >> "$GITHUB_OUTPUT"
          echo "legacy_status=$legacy_status" >> "$GITHUB_OUTPUT"
          echo "audit_status=$audit_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Knowledge diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch7-knowledge-debug
          path: /tmp/knowledge-debug.log

      - name: Publish clean place repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/batch7-base-contract-repair.yml
          git add data/places/kunst/vestland/etne/skanevik_fjordhotel_pippifestivalen.json .github/workflows/batch7-base-contract-repair.yml
          git diff --cached --check
          git commit -m "Repair popkultur migration contracts"
          git push origin HEAD:agent/oslo-people-zero-gap-batch7-v3

      - name: Fail if Knowledge contract remains broken
        if: steps.knowledge.outputs.build_status != '0' || steps.knowledge.outputs.canonical_status != '0' || steps.knowledge.outputs.legacy_status != '0' || steps.knowledge.outputs.audit_status != '0'
        run: exit 1
