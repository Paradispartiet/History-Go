name: TEMP Kunstnerforbundet R6 exact-head closure

on:
  push:
    branches:
      - agent/kunstnerforbundet-place-production-r2-20260913
    paths:
      - .github/workflows/tmp-kunstnerforbundet-r6-closure.yml

permissions:
  contents: write

env:
  BASE_SHA: 233a73419fea49b2d9c6f0d235918ad14daf821f

jobs:
  read-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git fetch origin main:refs/remotes/origin/main
      - name: Mandatory rule preflight
        run: |
          node --check scripts/place-production-rule-preflight.mjs
          node --test tests/place-production-rule-preflight.test.mjs
          node scripts/place-production-rule-preflight.mjs check --base origin/main

  description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Canonical 4.2 gate
        run: |
          node --check scripts/validate-place-description-production-v4_2.mjs
          node --check scripts/validate-place-description-production-v4_2_policy.mjs
          node --check scripts/upgrade-place-description-protocol-v4_2.mjs
          node --test tests/place-description-production-v4_2.test.mjs
          node --test tests/place-description-length-policy.test.mjs
          node --test tests/place-description-ingress-policy.test.mjs
          node scripts/validate-place-description-production-v4_2_policy.mjs --all --report reports/place-description-validation-v4_2.json
          node scripts/validate-place-description-production-v4_2_policy.mjs --changed --base "$BASE_SHA" --head HEAD

  people:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-npm
      - name: People data
        run: bash scripts/check-people.sh

  places:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-npm
      - name: Generic places and affected regressions
        env:
          PLACE_REGRESSION_BASE_SHA: 233a73419fea49b2d9c6f0d235918ad14daf821f
          PLACE_REGRESSION_HEAD_SHA: ${{ github.sha }}
        run: |
          bash scripts/check-places.sh
          node scripts/run-place-regressions-v1.mjs
          node --test tests/politikk-place-production.test.mjs tests/historie-place-production.test.mjs tests/naeringsliv-place-production.test.mjs tests/subkultur-place-production.test.mjs

  place-open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Payload sync and runtime
        run: npm run place-open:check && npm run test:place-open
      - name: Unified Place surface build and parity
        run: |
          npm run typecheck:web
          npm run build:web:check
          node --check dist/web/place-unified-surface.js
          node --test tests/place-unified-surface.test.mjs tests/place-popup-v2-unified-target.test.mjs tests/place-popup-root-scoped-decorators.test.mjs tests/place-sheet-phase1.test.mjs tests/place-sheet-about-renderer.test.mjs tests/place-sheet-history-renderer.test.mjs tests/place-sheet-stories-renderer.test.mjs tests/place-sheet-before-after-renderer.test.mjs tests/place-sheet-news-renderer.test.mjs tests/place-sheet-reading-renderer.test.mjs tests/place-sheet-language-renderer.test.mjs tests/place-sheet-learning-renderer.test.mjs tests/place-sheet-sources-renderer.test.mjs tests/place-sheet-render-queue.test.mjs tests/place-sheet-direct-routing.test.mjs tests/place-sheet-special-profiles.test.mjs tests/place-sheet-phase7-legacy-cleanup.test.mjs

  epoch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Source-backed timeline contract
        run: |
          npm run epoker:places:check
          npm run typecheck:web
          node --test tests/epoke-place-index.test.mjs tests/epoker-runtime-place-index.test.mjs tests/epoke-viewer.test.mjs tests/fagverk-history-period-deeplink.test.mjs tests/place-card-meta-surfaces.test.mjs

  map-lod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Area-place LOD and synchronized build
        run: |
          node --test tests/map-place-area-lod.test.mjs
          npm run typecheck:web
          npm run build:web
          git diff --exit-code -- js/map.js dist/web/map.js dist/web/map.js.map

  fagverk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Canonical Fagverk documentation
        run: node --test tests/fagverk-documentation-contract.test.mjs
      - name: Place Fagverk and image gates
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-politikk-runtime-equivalence.mjs
          node scripts/audit-fagverk-place-pages.mjs
          node --test tests/fagverk-subject-inventory.test.mjs tests/fagverk-general-engine.test.mjs tests/politikk-fag-integration.test.mjs tests/fagverk-politikk-runtime-equivalence.test.mjs tests/fagverk-content.test.mjs tests/fagverk-portal.test.mjs tests/fagverk-place-pages.test.mjs tests/fagverk-place-rendering.test.mjs tests/fagverk-place-substance-audit.test.mjs tests/fagverk-place-category-design.test.mjs tests/fagverk-link-audit.test.mjs tests/place-learning-surface.test.js tests/place-image-audit-changed.test.mjs
          node tests/header-search-menu.test.js
          node scripts/audit-place-images.mjs --mode=changed
          node scripts/audit-place-images.mjs --mode=all --report=reports/place-image-audit.json --verify-summary=data/places/place_image_backlog_summary.json
      - name: Deterministic Fagverk release
        run: |
          node --check scripts/materialize-natur-final-registry.mjs
          node scripts/materialize-natur-final-registry.mjs
          node --check scripts/build-fagverk-release-manifest.mjs
          node --test tests/fagverk-release-manifest.test.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          git diff --exit-code -- data/fagverk/fagverk_registry.json data/fagverk/subject_status.json data/fagverk/fagverk_release.json

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repository hygiene
        env:
          REPO_HYGIENE_BASE_SHA: 233a73419fea49b2d9c6f0d235918ad14daf821f
          REPO_HYGIENE_HEAD_SHA: ${{ github.sha }}
        run: node scripts/audit-repository-hygiene-v1.mjs

  cleanup:
    needs: [read-first, description, people, places, place-open, epoch, map-lod, fagverk, hygiene]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kunstnerforbundet-place-production-r2-20260913
          fetch-depth: 1
      - name: Remove closure workflow after full PASS
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-kunstnerforbundet-r6-closure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-kunstnerforbundet-r6-closure.yml
          git commit -m 'Remove temporary Kunstnerforbundet R6 closure workflow'
          git push origin HEAD:agent/kunstnerforbundet-place-production-r2-20260913
