name: Oslo sentrum Politikk six-place derivative sync (PR 6579)

on:
  push:
    branches:
      - research/oslo-sentrum-politikk-six-v1-20261023
    paths:
      - .github/workflows/oslo-sentrum-politikk-six-derived-sync.yml

permissions:
  contents: write

jobs:
  synchronize-owned-derived-data:
    if: github.repository == 'Paradispartiet/History-Go' && github.ref == 'refs/heads/research/oslo-sentrum-politikk-six-v1-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout only PR branch
        uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-politikk-six-v1-20261023
          persist-credentials: true
      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install runtime dependencies
        run: npm ci
      - name: Regenerate canonical place-open projections
        run: npm run place-open:build
      - name: Refresh image-backlog counts from verified six-photo delta
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          path=Path('data/places/place_image_backlog_summary.json')
          obj=json.loads(path.read_text(encoding='utf-8'))
          before=obj['summary']
          assert obj['totalPlaces']==1534 and before=={
            'validLocal':162,'validRemote':59,'optionalMissing':79,
            'missing':1225,'invalidLocalPath':9,'remaining':1234
          }, 'Unexpected concurrent backlog change; abort safely'
          assert obj['byCategory']['politikk']=={'total':45,'valid':9,'optional':7,'missing':29,'invalid':0}
          before.update(validLocal=168,missing=1219,remaining=1228)
          obj['byCategory']['politikk'].update(valid=15,missing=23)
          obj['generatedAt']='2026-10-23'
          obj['generatedFromCommit']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          path.write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: Verify place-open and exact current image audit
        run: |
          npm run place-open:check
          node scripts/audit-place-images.mjs --mode=all --verify-summary=data/places/place_image_backlog_summary.json
      - name: Commit only six owned runtime payloads and derived counts
        run: |
          git add -- \
            data/runtime/place-open/hoyesteretts_hus.json \
            data/runtime/place-open/folkets_hus_oslo.json \
            data/runtime/place-open/hoyres_hus.json \
            data/runtime/place-open/hoyblokka.json \
            data/runtime/place-open/victoria_terrasse.json \
            data/runtime/place-open/y_blokka.json \
            data/places/place_image_backlog_summary.json
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          allowed={
            'data/runtime/place-open/hoyesteretts_hus.json',
            'data/runtime/place-open/folkets_hus_oslo.json',
            'data/runtime/place-open/hoyres_hus.json',
            'data/runtime/place-open/hoyblokka.json',
            'data/runtime/place-open/victoria_terrasse.json',
            'data/runtime/place-open/y_blokka.json',
            'data/places/place_image_backlog_summary.json',
          }
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if not staged or not staged.issubset(allowed) or 'data/places/place_image_backlog_summary.json' not in staged:
              raise SystemExit('Unauthorized staged path or empty derived update: '+repr(staged))
          dirty=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if dirty:
              raise SystemExit('Build changed additional tracked paths outside six-Place scope: '+repr(dirty))
          print('Derived files staged:',sorted(staged))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate six scoped Place-open projections and image backlog counts"
          git push origin HEAD:refs/heads/research/oslo-sentrum-politikk-six-v1-20261023
      - name: Document remaining v1 QA
        if: always()
        run: |
          {
            echo "### Regenerated six-Place runtime"
            echo "Only scoped Place-open payloads and deterministic catalog image counts may be committed."
            echo "All new photos remain in a draft PR. Quiz, browser and mobile acceptance pending."
          } >> "$GITHUB_STEP_SUMMARY"
