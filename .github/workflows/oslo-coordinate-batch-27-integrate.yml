name: Oslo coordinate batch 27 integration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-coordinate-batch-27-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'agent/oslo-coordinate-control-batch-27'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect persistent object and duplicate evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT='reports/oslo-coordinate-control-batch-27'
          mkdir -p "$OUT/sources"

          run_curl() {
            local url="$1"
            local file="$2"
            set +e
            curl --retry 3 --retry-delay 2 -fsSL -A 'History-Go-coordinate-audit/1.0' "$url" \
              | tee "$OUT/sources/$file" >/dev/null
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$code" > "$OUT/sources/$file.exit-status.txt"
          }

          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Ullev%C3%A5l%20Hageby%20Oslo' 'ullevall-hageby-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Roms%C3%A5s%20Oslo' 'romsas-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Rodel%C3%B8kka%20Oslo' 'rodelokka-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=V%C3%A5lerenga%20Oslo' 'valerenga-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Vinderen%20Oslo' 'vinderen-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Ullern%20Oslo' 'ullern-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Spikersuppa%20Oslo' 'spikersuppa-nominatim.json'

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const targets = [
            ['ullevål_hageby', 'Ullevål Hageby'],
            ['romsaås', 'Romsås'],
            ['rodelokka', 'Rodeløkka'],
            ['vaalerenga', 'Vålerenga'],
            ['vinderen', 'Vinderen'],
            ['ullern', 'Ullern'],
            ['spikersuppa', 'Spikersuppa']
          ];
          const normalize = (s) => String(s ?? '').normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase().replace(/[^a-z0-9]+/g, '');
          const rows = [];
          function walk(dir) {
            const out = [];
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, ent.name);
              if (ent.isDirectory()) out.push(...walk(full));
              else if (ent.isFile() && ent.name.endsWith('.json')) out.push(full);
            }
            return out;
          }
          for (const file of walk('data/places')) {
            let data;
            try { data = JSON.parse(fs.readFileSync(file, 'utf8')); } catch { continue; }
            const values = Array.isArray(data) ? data : [data];
            for (const rec of values) {
              if (!rec || typeof rec !== 'object' || !rec.id || !rec.name) continue;
              rows.push({ id: rec.id, name: rec.name, file: file.replaceAll('\\', '/') });
            }
          }
          const result = targets.map(([id, name]) => ({
            id,
            name,
            matches: rows.filter((row) => row.id !== id && (normalize(row.id) === normalize(id) || normalize(row.name) === normalize(name)))
          }));
          fs.writeFileSync('reports/oslo-coordinate-control-batch-27/duplicate-audit.json', JSON.stringify(result, null, 2) + '\n');
          if (result.some((row) => row.matches.length > 0)) {
            console.error('Duplicate audit found canonical candidates:', JSON.stringify(result.filter((row) => row.matches.length), null, 2));
            process.exit(1);
          }
          NODE

          cat > "$OUT/source-notes.md" <<'EOF'
          # Batch 27 – kilde- og objektvalg

          - Ullevål hageby: OSM node 1125978057 (`place=neighbourhood`) brukes som semantic area anchor.
          - Romsås: OSM node 963813366 (`place=suburb`) brukes; T-banestasjonen avvises som hovedanker for hele området.
          - Rodeløkka: OSM node 1290871351 (`place=suburb`) brukes; navnelik Rodeløkken på Bygdøy avvises.
          - Vålerenga: OSM node 366154118 (`place=suburb`) brukes som områdeanker.
          - Vinderen: OSM node 1125573258 (`place=suburb`) brukes; stasjonen avvises som hovedanker for hele området.
          - Ullern: OSM node 1370932493 (`place=suburb`) brukes; administrativ bydel-relasjon 1279940 er for bred for recordens place-scope.
          - Spikersuppa: OSM relation 11158886 er den eksakte navngitte relasjonen for Spikersuppa-bassenget og brukes som site-center for recordens bredere byromsradius.
          - Repo-wide normalisert ID-/navneaudit fant ingen alternative canonical place-records for de sju stedene.
          EOF

      - name: Apply batch 27
        run: node scripts/tmp-complete-oslo-coordinate-batch27.mjs

      - name: Build global place index
        run: |
          set -o pipefail
          npm run places:index:build | tee reports/oslo-coordinate-control-batch-27/places-index-build.txt

      - name: Validate split manifest sync
        run: |
          set -o pipefail
          npm run audit:places-split-manifest-sync | tee reports/oslo-coordinate-control-batch-27/split-manifest-audit.txt

      - name: Validate source and runtime parity
        run: |
          set -o pipefail
          npm run places:index:check | tee reports/oslo-coordinate-control-batch-27/places-index-check.txt

      - name: Validate coordinate quality
        run: |
          set -o pipefail
          npm run places:coords:quality | tee reports/oslo-coordinate-control-batch-27/coordinate-quality.txt

      - name: Validate strict coordinate intake against merge-base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE="$(git merge-base HEAD origin/main)"
          echo "COORD_INTAKE_BASE=$BASE" | tee reports/oslo-coordinate-control-batch-27/strict-intake-base.txt
          COORD_INTAKE_BASE="$BASE" npm run places:coords:intake \
            | tee reports/oslo-coordinate-control-batch-27/strict-intake.txt

      - name: Validate coordinate evidence
        id: evidence
        continue-on-error: true
        run: |
          set -o pipefail
          npm run places:coords:evidence:audit | tee reports/oslo-coordinate-control-batch-27/evidence-audit.txt

      - name: Upload evidence audit failure report
        if: steps.evidence.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch-27-evidence-audit-failure
          path: |
            reports/coordinate-evidence-audit.md
            reports/oslo-coordinate-control-batch-27/evidence-audit.txt
          if-no-files-found: error

      - name: Stop on evidence audit failure
        if: steps.evidence.outcome == 'failure'
        run: exit 1

      - name: Validate diff whitespace
        run: git diff --check

      - name: Remove temporary integration files and commit result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/oslo-coordinate-batch-27-evidence.yml
          rm -f .github/workflows/oslo-coordinate-batch-27-integrate.yml
          rm -f scripts/tmp-complete-oslo-coordinate-batch27.mjs
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete Oslo coordinate control batch 27'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
