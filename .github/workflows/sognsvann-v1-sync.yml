name: Sognsvann v1 deterministic content synchronization
on:
  push:
    branches: [history-go/sognsvann-v1-20261021]
    paths:
      - '.github/workflows/sognsvann-v1-sync.yml'
permissions:
  contents: write
jobs:
  materialize:
    name: Canonical generator sync on exact Sognsvann PR branch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Sync translations, Fagverk, Knowledge, place-open, epoke and place index
        shell: bash
        run: |
          set -euo pipefail
          npm run build:scripts
          node dist/scripts/i18n-stamp-places.js en es pt
          node scripts/materialize-natur-final-registry.mjs
          node scripts/build-fagverk-release-manifest.mjs
          npm run knowledge:canonical:write
          npm run place-open:build
          npm run epoker:places:build
          npm run places:index:build
          node scripts/check-place-i18n-freshness.mjs sognsvann
          npm run knowledge:canonical:check
          npm run place-open:check
          npm run epoker:places:check
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit synchronized derived data to the same PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- data/i18n/content/places/ data/fagverk/ data/knowledge/ data/quiz/ data/runtime/ data/epoker/ data/places/ 
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "build(history-go): materialize Sognsvann canonical Knowledge, translations and runtime"
            git push origin HEAD:history-go/sognsvann-v1-20261021
          fi
