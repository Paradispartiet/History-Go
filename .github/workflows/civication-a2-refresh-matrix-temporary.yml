name: Civication A2 generated matrix refresh (temporary)

on:
  push:
    branches:
      - civication-a2-day-sync-2026-10-13
    paths:
      - .github/workflows/civication-a2-refresh-matrix-temporary.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and regenerate canonical career matrix
        run: |
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-career-gameplay.mjs --check
          git diff --check
          git diff --stat -- data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md
      - name: Commit generated files only if changed
        run: |
          git add -- data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(civication): refresh A2 generated career matrix'
            git push origin HEAD:civication-a2-day-sync-2026-10-13
          fi
