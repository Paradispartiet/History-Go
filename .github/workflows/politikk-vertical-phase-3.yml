name: Politics vertical depth phase 3

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-validate:
    if: github.head_ref == 'agent/politikk-norsk-eos-fase-3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/politikk-norsk-eos-fase-3
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and validate phase 3
        id: build
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p reports/politikk-canonical-migration
          exec > >(tee reports/politikk-canonical-migration/politikk-norsk-phase-3-full-run.log) 2>&1

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          cat > reports/politikk-canonical-migration/politikk-norsk-phase-3-part-checksums.expected <<'SUMS'
          c5e11ff036140edb232c7ae88381c1e1de74b4fb9eb8452795ad4b1a8f2aeee1  tools/build-politikk-vertical-phase-3.mjs.gz.b64.part00
          e6a36dff335aff73eb6781964866ed0fa40ee776bba0d5683a29930b3aaf299f  tools/build-politikk-vertical-phase-3.mjs.gz.b64.part01
          9c2a1a5c83dc3396a6dbbf2e83e9ce823b38dfe20dc06fcecaa3db7c898fd106  tools/build-politikk-vertical-phase-3.mjs.gz.b64.part02
          76a1c88486d764ecded63c15fb4d75fc709f61542fe47d5221922cfe9e3d995f  tools/build-politikk-vertical-phase-3.mjs.gz.b64.part03
          dadc168a528ad1c813ec0a8ef6986c6d1b1fb4921b5f4a3fa1ab5b48a59e32b9  tools/build-politikk-vertical-phase-3.mjs.gz.b64.part04
          SUMS
          sha256sum tools/build-politikk-vertical-phase-3.mjs.gz.b64.part* \
            | tee reports/politikk-canonical-migration/politikk-norsk-phase-3-part-checksums.actual
          sha256sum -c reports/politikk-canonical-migration/politikk-norsk-phase-3-part-checksums.expected \
            2>&1 | tee reports/politikk-canonical-migration/politikk-norsk-phase-3-part-checksums.txt

          cat tools/build-politikk-vertical-phase-3.mjs.gz.b64.part* \
            > tools/build-politikk-vertical-phase-3.mjs.gz.b64
          echo '7809c7bbe132de458a0e0d553cdbfc932c69494948506d197079b81efcbc05de  tools/build-politikk-vertical-phase-3.mjs.gz.b64' \
            | sha256sum -c - \
            2>&1 | tee reports/politikk-canonical-migration/politikk-norsk-phase-3-builder-checksum.txt

          base64 -d tools/build-politikk-vertical-phase-3.mjs.gz.b64 \
            | gzip -d > tools/build-politikk-vertical-phase-3.mjs
          node --check tools/build-politikk-vertical-phase-3.mjs \
            2>&1 | tee reports/politikk-canonical-migration/politikk-norsk-phase-3-builder-syntax.txt
          node tools/build-politikk-vertical-phase-3.mjs \
            2>&1 | tee reports/politikk-canonical-migration/politikk-norsk-phase-3-builder-output.txt

          python - <<'PY'
          from pathlib import Path
          p = Path('tools/validate-politikk-statsvitenskap-core.mjs')
          s = p.read_text()
          s = s.replace(
              "ok(pensum.summary.domain_count===12,'Pensum har 12 domener');",
              "ok(pensum.summary.domain_count===fagkart.categories.length,'Pensumets domeneantall matcher fagkartet: '+fagkart.categories.length);"
          )
          s = s.replace(
              "ok(pensum.summary.political_science_core_domain_count===8,'Åtte domener er statsvitenskapelig kjerne');",
              "ok(pensum.summary.political_science_core_domain_count===pensum.domains.filter(d=>d.disciplinary_role==='political_science_core').length,'Antall statsvitenskapelige kjernedomener matcher registeret');"
          )
          s = s.replace(
              "const coreBlueprints=blueprints.filter(b=>!b.blueprint_id.startsWith('pol_theory_phase2_'));",
              "const coreBlueprints=blueprints.filter(b=>!b.blueprint_id.startsWith('pol_theory_phase2_')&&!b.blueprint_id.startsWith('pol_norsk_phase3_'));"
          )
          p.write_text(s)
          PY

          rm -f tools/build-politikk-vertical-phase-3.mjs
          rm -f tools/build-politikk-vertical-phase-3.mjs.gz.b64
          rm -f tools/build-politikk-vertical-phase-3.mjs.gz.b64.part*
          rm -f .github/workflows/politikk-vertical-phase-3.yml
          rm -f reports/politikk-canonical-migration/politikk-norsk-phase-3-builder-checksum.txt
          rm -f reports/politikk-canonical-migration/politikk-norsk-phase-3-builder-syntax.txt
          rm -f reports/politikk-canonical-migration/politikk-norsk-phase-3-builder-output.txt
          rm -f reports/politikk-canonical-migration/politikk-norsk-phase-3-full-run.log
          rm -f reports/politikk-canonical-migration/politikk-norsk-phase-3-part-checksums.expected
          rm -f reports/politikk-canonical-migration/politikk-norsk-phase-3-part-checksums.actual
          rm -f reports/politikk-canonical-migration/politikk-norsk-phase-3-part-checksums.txt

          node tools/validate-politikk-norsk-politikk-phase-3.mjs \
            2>&1 | tee reports/politikk-canonical-migration/politikk-norsk-phase-3-validation.txt
          node tools/validate-politikk-teori-phase-2.mjs \
            2>&1 | tee reports/politikk-canonical-migration/politikk-teori-phase-2-validation.txt
          node tools/validate-politikk-institusjoner-phase-1.mjs \
            2>&1 | tee reports/politikk-canonical-migration/politikk-institusjoner-phase-1-validation.txt
          node tools/validate-politikk-statsvitenskap-core.mjs \
            2>&1 | tee reports/politikk-canonical-migration/statsvitenskap-vertical-chain-validation.txt

          for file in \
            data/fag/politikk/fagkart_politikk_canonical_v4_5.json \
            data/fag/politikk/emner_politikk_canonical_v4_5.json \
            data/fag/politikk/methods_politikk_canonical_v4_5.json \
            data/fag/politikk/emnemapping_politikk_canonical_v4_5.json \
            data/fag/politikk/politikkpensum_canonical_v4_5.json \
            data/fag/politikk/quiz_generator_rules_politikk_v5_1_source_priority_patch.json \
            reports/politikk-canonical-migration/statsvitenskap-question-blueprints.json \
            reports/politikk-canonical-migration/norsk-politikk-institusjonskart.json; do
              node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log("PASS | Gyldig JSON: "+process.argv[1])' "$file" \
                2>&1 | tee -a reports/politikk-canonical-migration/politikk-norsk-phase-3-validation.txt
          done

          git diff --check \
            2>&1 | tee -a reports/politikk-canonical-migration/politikk-norsk-phase-3-validation.txt
          echo 'PASS | git diff --check' \
            | tee -a reports/politikk-canonical-migration/politikk-norsk-phase-3-validation.txt

          git add -A data/fag/politikk reports/politikk-canonical-migration tools .github/workflows
          git diff --cached --check
          git commit -m 'Politikk: bygg norsk politikk, EØS og flernivåstyring'
          git push --force-with-lease origin HEAD:agent/politikk-norsk-eos-fase-3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: politics-norway-phase-3-diagnostics
          path: |
            reports/politikk-canonical-migration/politikk-norsk-phase-3-*
            reports/politikk-canonical-migration/statsvitenskap-vertical-chain-validation.txt
            reports/politikk-canonical-migration/politikk-teori-phase-2-validation.txt
            reports/politikk-canonical-migration/politikk-institusjoner-phase-1-validation.txt
          if-no-files-found: warn

      - name: Propagate build failure
        if: steps.build.outcome == 'failure'
        run: exit 1
