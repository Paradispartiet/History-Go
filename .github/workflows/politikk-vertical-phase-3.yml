name: Politics vertical depth phase 3

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-validate:
    if: github.head_ref == 'agent/politikk-norge-eu-fase-3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/politikk-norge-eu-fase-3
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and validate phase 3
        id: build
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p reports/politikk-canonical-migration
          exec > >(tee reports/politikk-canonical-migration/politikk-norge-eu-phase-3-full-run.log) 2>&1

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          cat tools/build-politikk-vertical-phase-3.mjs.gz.b64.part{00..07} \
            > tools/build-politikk-vertical-phase-3.mjs.gz.b64

          echo '176a1b50418d7796e0ebf541fbdab801b207da586fe6cbe407f4bec9e601b01e  tools/build-politikk-vertical-phase-3.mjs.gz.b64' \
            | sha256sum -c - \
            2>&1 | tee reports/politikk-canonical-migration/politikk-norge-eu-phase-3-builder-checksum.txt

          base64 -d tools/build-politikk-vertical-phase-3.mjs.gz.b64 \
            | gzip -d > tools/build-politikk-vertical-phase-3.mjs

          node --check tools/build-politikk-vertical-phase-3.mjs \
            2>&1 | tee reports/politikk-canonical-migration/politikk-norge-eu-phase-3-builder-syntax.txt

          node tools/build-politikk-vertical-phase-3.mjs \
            2>&1 | tee reports/politikk-canonical-migration/politikk-norge-eu-phase-3-builder-output.txt

          rm -f tools/build-politikk-vertical-phase-3.mjs
          rm -f tools/build-politikk-vertical-phase-3.mjs.gz.b64
          rm -f tools/build-politikk-vertical-phase-3.mjs.gz.b64.part{00..07}
          rm -f .github/workflows/politikk-vertical-phase-3.yml
          rm -f reports/politikk-canonical-migration/politikk-norge-eu-phase-3-builder-checksum.txt
          rm -f reports/politikk-canonical-migration/politikk-norge-eu-phase-3-builder-syntax.txt
          rm -f reports/politikk-canonical-migration/politikk-norge-eu-phase-3-builder-output.txt
          rm -f reports/politikk-canonical-migration/politikk-norge-eu-phase-3-full-run.log

          node tools/validate-politikk-norge-eu-phase-3.mjs \
            2>&1 | tee reports/politikk-canonical-migration/politikk-norge-eu-phase-3-validation.txt
          node tools/validate-politikk-institusjoner-phase-1.mjs \
            2>&1 | tee reports/politikk-canonical-migration/politikk-institusjoner-phase-1-validation.txt
          node tools/validate-politikk-teori-phase-2.mjs \
            2>&1 | tee reports/politikk-canonical-migration/politikk-teori-phase-2-validation.txt
          node tools/validate-politikk-statsvitenskap-core.mjs \
            2>&1 | tee reports/politikk-canonical-migration/statsvitenskap-vertical-chain-validation.txt
          node tools/validate-politikk-demokrati-vertical.mjs \
            2>&1 | tee reports/politikk-canonical-migration/demokrati-vertical-validation.txt

          for file in \
            data/fag/politikk/fagkart_politikk_canonical_v4_5.json \
            data/fag/politikk/emner_politikk_canonical_v4_5.json \
            data/fag/politikk/methods_politikk_canonical_v4_5.json \
            data/fag/politikk/emnemapping_politikk_canonical_v4_5.json \
            data/fag/politikk/politikkpensum_canonical_v4_5.json \
            data/fag/politikk/quiz_generator_rules_politikk_v5_1_source_priority_patch.json \
            data/places/politikk/oslo/places_politikk.json \
            reports/politikk-canonical-migration/statsvitenskap-question-blueprints.json; do
              node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log("PASS | Gyldig JSON: "+process.argv[1])' "$file" \
                2>&1 | tee -a reports/politikk-canonical-migration/politikk-norge-eu-phase-3-validation.txt
          done

          git diff --check \
            2>&1 | tee -a reports/politikk-canonical-migration/politikk-norge-eu-phase-3-validation.txt
          echo 'PASS | git diff --check' \
            | tee -a reports/politikk-canonical-migration/politikk-norge-eu-phase-3-validation.txt

          git add -A data/fag/politikk data/places/politikk/oslo reports/politikk-canonical-migration tools .github/workflows
          git diff --cached --check
          git commit -m 'Politikk: bygg norsk politikk-, EØS- og flernivåakse'
          git push --force-with-lease origin HEAD:agent/politikk-norge-eu-fase-3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: politics-norway-eu-phase-3-diagnostics
          path: |
            reports/politikk-canonical-migration/politikk-norge-eu-phase-3-*
            reports/politikk-canonical-migration/politikk-institusjoner-phase-1-validation.txt
            reports/politikk-canonical-migration/politikk-teori-phase-2-validation.txt
            reports/politikk-canonical-migration/statsvitenskap-vertical-chain-validation.txt
            reports/politikk-canonical-migration/demokrati-vertical-validation.txt
          if-no-files-found: warn

      - name: Propagate build failure
        if: steps.build.outcome == 'failure'
        run: exit 1
