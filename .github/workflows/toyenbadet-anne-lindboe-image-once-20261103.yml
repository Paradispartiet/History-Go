name: Tøyenbadet Anne Lindboe CC BY-SA photograph — one-time import
on:
  push:
    branches: [feat/toyenbadet-people-anne-lindboe-20261103]
    paths: ['.github/workflows/toyenbadet-anne-lindboe-image-once-20261103.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/toyenbadet-people-anne-lindboe-20261103
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow
      - name: Download independently licensed identity-verified photo from Commons
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, io, json, time, urllib.request, urllib.parse, hashlib
          from PIL import Image
          title='File:Anne Lindboe (1).jpg'
          query=urllib.parse.urlencode({'action':'query','format':'json','prop':'imageinfo','iiprop':'url|extmetadata','titles':title})
          api='https://commons.wikimedia.org/w/api.php?'+query
          def download(url):
           req=urllib.request.Request(url,headers={'User-Agent':'HistoryGoEducationalProject/1.0 (public source research; github.com/Paradispartiet/History-Go)','Accept':'application/json,image/*'})
           with urllib.request.urlopen(req,timeout=45) as res:return res.read()
          canonical='https://upload.wikimedia.org/wikipedia/commons/8/85/Anne_Lindboe_%281%29.jpg'
          mirror='https://images.weserv.nl/?url='+urllib.parse.quote(canonical,safe='')+'&w=1280&output=jpg'
          attempts=[canonical,mirror,api]
          errors=[]
          for url in attempts:
           try:
            data=download(url)
            if url==api:
             page=json.loads(data.decode('utf8'))
             info=next(iter(page['query']['pages'].values()))['imageinfo'][0]
             data=download(info['url'])
            im=Image.open(io.BytesIO(data)).convert('RGB')
            if im.width<750 or im.height<1100:raise RuntimeError('Unexpected dimensions: '+str(im.size))
            raw=data
            break
           except Exception as e:
            errors.append(str(e))
            print('Download attempt failed:',url.split('?')[0],str(e))
            time.sleep(2)
          else:
           raise RuntimeError('All Commons-provenance photo fetches failed: '+str(errors))
          original=list(im.size)
          url=canonical
          print('Source-origin preserved; fetched source dimensions:',original)
          os.makedirs('bilder/kort/people',exist_ok=True)
          paths=[
           ('bilder/kort/people/anne_lindboe_2023_cc_by_sa.webp',(720,1080)),
           ('bilder/kort/people/anne_lindboe_2023_cc_by_sa_card.webp',(480,720))]
          files=[]
          for path,size in paths:
           cur=im.resize(size,Image.Resampling.LANCZOS)
           cur.save(path,'WEBP',quality=87,method=6)
           b=open(path,'rb').read()
           files.append({'path':path,'width':size[0],'height':size[1],'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest={'schema':'history_go_people_commons_photo_provenance_v1',
           'personId':'anne_lindboe','imageSource':'https://commons.wikimedia.org/wiki/File:Anne_Lindboe_(1).jpg',
           'sourceURL':url,'creator':'Helfla','sourceDate':'2023-05-31',
           'license':'CC BY-SA 4.0','licenseUrl':'https://creativecommons.org/licenses/by-sa/4.0/',
           'credit':'Helfla / Wikimedia Commons (CC BY-SA 4.0)',
           'imageKind':'photo','identity':'Anne Lindboe, Oslo mayor (identity checked from Commons file and category)',
           'capturePlaceNotClaimed':'Photographed May 2023, NOT at Tøyenbadet; historic link is opening event 2025',
           'sourceOriginalSize':original,'sourceOriginalSha256':hashlib.sha256(raw).hexdigest(),
           'transform':'resize only, no synthetic edits; preserving aspect 2:3',
           'derivatives':files,'reviewStatus':'commons_license_verified__visual_review_pending','reviewDate':'2026-11-03'}
          path='data/people/media/toyenbadet_anne_lindboe_asset.json'
          os.makedirs(os.path.dirname(path),exist_ok=True)
          with open(path,'w',encoding='utf8') as fh:json.dump(manifest,fh,ensure_ascii=False,indent=2)
          print('ANNE_ASSET_IMPORTED',json.dumps(files))
          PY
      - name: Push licensed files for manual review in same feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bilder/kort/people/anne_lindboe_2023_cc_by_sa.webp
          git add bilder/kort/people/anne_lindboe_2023_cc_by_sa_card.webp
          git add data/people/media/toyenbadet_anne_lindboe_asset.json
          git commit -m 'assets(people): import original CC BY-SA portrait of Anne Lindboe with provenance'
          git push origin HEAD:refs/heads/feat/toyenbadet-people-anne-lindboe-20261103
