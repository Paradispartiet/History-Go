# One-shot projection sync after Klassekampen final UI review.
name: TEMP Klassekampen projection sync

on:
  push:
    branches:
      - agent/klassekampen-final-ui-closeout-20261007
    paths:
      - .github/workflows/tmp-klassekampen-projection-sync.yml
      - data/places/workflow/klassekampen_redaksjon.json
      - reports/place-production/klassekampen-final-ui-review-v1.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4

      - name: Regenerate Klassekampen V3 projections
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-place-production-v3-projections.mjs klassekampen_redaksjon

          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "Klassekampen projections already in sync"
            exit 0
          fi

          for file in "${changed[@]}"; do
            case "$file" in
              reports/place-production/klassekampen-redaksjon-workcard-current.json|reports/place-production/klassekampen-redaksjon-quality-gate-current.json)
                ;;
              *)
                echo "::error::Unexpected projection drift: $file"
                exit 1
                ;;
            esac
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/place-production/klassekampen-redaksjon-workcard-current.json reports/place-production/klassekampen-redaksjon-quality-gate-current.json
          git commit -m "Regenerate Klassekampen V3 projections"
          git push origin "HEAD:${GITHUB_REF_NAME}"
