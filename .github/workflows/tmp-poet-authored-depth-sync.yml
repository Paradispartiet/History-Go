name: Temporary Poet authored-depth sync
on:
  push:
    branches:
      - civication/litteratur-poet-authored-depth
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: civication/litteratur-poet-authored-depth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate canonical readiness outputs
        run: node scripts/audit-civication-life-position-role-world-readiness.mjs --write
      - name: Synchronize readiness regression expectations
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'tests/civication-life-position-role-world-readiness.test.js';
          let text = fs.readFileSync(file, 'utf8');
          const replace = (from, to) => {
            if (!text.includes(from)) throw new Error(`Missing expected readiness assertion: ${from}`);
            text = text.replace(from, to);
          };
          replace("  ready: 101,\n  needs_authored_depth: 58,", "  ready: 102,\n  needs_authored_depth: 57,");
          replace("assert.equal(audit.summary.pending_ready_positions, 0);", "assert.equal(audit.summary.pending_ready_positions, 1);");
          replace("assert.equal(audit.summary.positions_with_exact_governed_sources, 101);", "assert.equal(audit.summary.positions_with_exact_governed_sources, 102);");
          replace("assert.equal(audit.summary.positions_with_multi_scene_narrative_foundation, 101);", "assert.equal(audit.summary.positions_with_multi_scene_narrative_foundation, 102);");
          replace("assert.equal(audit.first_ready, null);", "assert.equal(audit.first_ready?.key, 'litteratur/poet');");
          replace("console.log('civication life-position Role World readiness v2 ok: 101 ready / 58 authored-depth / 40 not-standalone; 101 complete / no pending-ready');", "console.log('civication life-position Role World readiness v2 ok: 102 ready / 57 authored-depth / 40 not-standalone; 101 complete / 1 pending-ready');");
          fs.writeFileSync(file, text);
          NODE
      - name: Verify Poet authored depth
        run: |
          node tests/civication-poet-life-position-readiness.test.js
          node tests/civication-life-position-role-world-readiness.test.js
      - name: Commit generated canonical state
        run: |
          git add \
            data/Civication/lifePositionRoleWorldReadiness.json \
            reports/civication-life-position-role-world-readiness.md \
            tests/civication-life-position-role-world-readiness.test.js
          if git diff --cached --quiet; then
            echo "Poet authored-depth readiness is already synchronized."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Synchronize Poet authored-depth readiness"
          git push origin HEAD:civication/litteratur-poet-authored-depth
