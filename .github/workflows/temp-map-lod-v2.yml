name: TEMP Map LOD v2

on:
  push:
    branches:
      - agent/map-lod-v2

permissions:
  contents: write

jobs:
  migrate-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/map-lod-v2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply permanent LOD migration
        run: node scripts/temp-map-lod-v2.mjs

      - name: Rebuild runtime place index
        run: npm run places:index:build

      - name: Rebuild web runtime
        run: npm run build:web

      - name: Verify focused LOD regression
        run: node --test tests/map-place-area-lod.test.mjs

      - name: Verify index parity
        run: npm run places:index:check

      - name: Verify web typecheck
        run: npm run typecheck:web

      - name: Verify clean patch
        run: git diff --check

      - name: Remove temporary migration machinery
        run: git rm -f scripts/temp-map-lod-v2.mjs .github/workflows/temp-map-lod-v2.yml

      - name: Commit permanent implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/build_places_index.mts \
            tools/check_places_index_sync.mts \
            data/places/places_index.json \
            js/map.ts \
            js/map.js \
            dist/web/map.js \
            tests/map-place-area-lod.test.mjs \
            docs/PLACE_PRODUCTION_CHECKLIST.md
          git status --short
          git diff --cached --check
          git commit -m "Bygg semantisk kart-LOD v2"
          git push origin HEAD:agent/map-lod-v2
