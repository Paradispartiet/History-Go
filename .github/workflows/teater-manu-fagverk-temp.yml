name: Teater Manu Fagverk projection sync (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: teater-manu-fagverk-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Materialize canonical Place, Fagverk and runtime projections
        run: |
          npm run places:index:build
          npm run place-open:build
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-fagverk-place-pages.mjs --write
          npm run epoker:places:build
          node --test tests/fagverk-place-pages.test.mjs tests/fagverk-place-rendering.test.mjs tests/fagverk-place-substance-audit.test.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit reviewed generated files only
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          dirty="$(git status --porcelain | sed 's/^...//' | grep -v -E '^(data/places/places_index.json|data/runtime/place-open/teater_manu.json|data/fagverk/fagverk_release.json|reports/fagverk/fagverk-place-page-coverage-v2.json|data/epoker/epoke-place-index.json)$' || true)"
          if [ -n "$dirty" ]; then
            echo "::error::Unrelated generator changes"
            printf '%s\n' "$dirty"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- data/places/places_index.json data/runtime/place-open/teater_manu.json data/fagverk/fagverk_release.json reports/fagverk/fagverk-place-page-coverage-v2.json data/epoker/epoke-place-index.json
            git commit -m "Sync Teater Manu Fagverk source projections"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
