name: Tøyen trafo Object images and runtime sync (temporary)
on:
  push:
    branches:
      - feat/toyen-trafo-objects-20261104
    paths:
      - .github/workflows/toyen-trafo-objects-sync-temp.yml
      - tests/toyen-trafo-objects-collection.test.mjs
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate canonical Place-open and test true Object round
        run: |
          npm ci --no-audit --no-fund
          npm run place-open:build
          npm run place-open:check
          node --test tests/toyen-trafo-objects-collection.test.mjs
          git status --short
      - name: Commit synchronized Place-open
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/runtime/place-open/toyen_trafo.json
          git diff --cached --name-only
          if ! git diff --cached --quiet; then
            git commit -m "build(toyen trafo): generate two source-backed illustrated Objects"
            git push origin HEAD:feat/toyen-trafo-objects-20261104
          fi
