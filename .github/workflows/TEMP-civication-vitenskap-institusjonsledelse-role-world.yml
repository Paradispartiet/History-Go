name: TEMP Civication Vitenskap Institusjonsledelse Role World

on:
  push:
    branches:
      - agent/civication-vitenskap-institusjonsledelse-role-world-20260908
    paths:
      - scripts/TEMP_materialize_vitenskap_institusjonsledelse_role_world.mjs
      - .github/workflows/TEMP-civication-vitenskap-institusjonsledelse-role-world.yml

permissions:
  contents: write

concurrency:
  group: temp-civication-vitenskap-institusjonsledelse-role-world
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-vitenskap-institusjonsledelse-role-world-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Require fresh main ancestry before materialization
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'Branch is stale versus main before materialization.' >&2; exit 1; }
      - name: Syntax
        run: node --check scripts/TEMP_materialize_vitenskap_institusjonsledelse_role_world.mjs
      - name: Materialize Role World with exact binding repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('scripts/TEMP_materialize_vitenskap_institusjonsledelse_role_world.mjs').read_text()
          old = 'standing_audience:audience,standing_consequence});'
          new = 'standing_audience:audience,standing_consequence:standingConsequence});'
          count = src.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one standing_consequence shorthand defect, found {count}')
          Path('/tmp/TEMP_materialize_vitenskap_institusjonsledelse_role_world.mjs').write_text(src.replace(old, new))
          PY
          node --check /tmp/TEMP_materialize_vitenskap_institusjonsledelse_role_world.mjs
          node /tmp/TEMP_materialize_vitenskap_institusjonsledelse_role_world.mjs
      - name: Regenerate career and rollout surfaces
        run: |
          set -euo pipefail
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify Institusjonsledelse Role World rollout
        run: node tests/civication-vitenskap-institusjonsledelse-role-world-rollout.test.js
      - name: Verify global Role World contract
        run: node tests/civication-role-world-contract.test.js
      - name: Verify Career Gameplay Matrix
        run: node tests/civication-career-gameplay-matrix.test.js
      - name: Verify Role World readiness
        run: node tests/civication-role-world-rollout-readiness.test.js
      - name: Verify full Civication suite
        run: node tests/run-civication-tests.mjs
      - name: Verify job learning profiles
        run: npm run audit:job-learning-profiles
      - name: Verify job knowledge requirements
        run: npm run audit:job-knowledge-requirements
      - name: Require Institusjonsledelse closed and removed from rollout queue
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('data/Civication/roleWorldRolloutReadiness.json','utf8'));
          const row=r.roles.find(x=>x.key==='vitenskap/vitenskap_institusjonsledelse');
          if(!row) throw new Error('Institusjonsledelse missing from readiness');
          console.log(JSON.stringify({summary:r.summary,row},null,2));
          if(row.classification!=='rollout_ready') throw new Error('Expected rollout_ready');
          if(row.role_world_status!=='role_world_complete') throw new Error('Expected role_world_complete');
          if((row.authored_work_required||[]).length) throw new Error('Authored work remains: '+row.authored_work_required.join(','));
          if((r.rollout_queue||[]).some(x=>x.key===row.key)) throw new Error('Role still in rollout queue');
          if(r.summary.role_world_complete_or_pilot!==82) throw new Error('Expected 82 complete/pilot, got '+r.summary.role_world_complete_or_pilot);
          NODE
      - name: Require fresh main ancestry before scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'Branch became stale before scope verification.' >&2; exit 1; }
      - name: Verify exact permanent Role World scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          if [ "${#changed[@]}" -ne 9 ]; then
            echo "Expected exactly 9 permanent Role World paths, found ${#changed[@]}" >&2
            exit 1
          fi
          expected=(
            data/Civication/careerGameplayMatrix.json
            data/Civication/roleWorldAuthoringChecklist.json
            data/Civication/roleWorldRolloutReadiness.json
            data/Civication/roleWorldThemeBank.json
            data/Civication/roleWorlds/index.json
            data/Civication/roleWorlds/vitenskap/vitenskap_institusjonsledelse.json
            reports/CIVICATION_VITENSKAP_INSTITUSJONSLEDELSE_ROLE_WORLD_ROLLOUT_SOURCE_FIRST.md
            reports/civication-role-world-rollout-readiness.md
            tests/civication-vitenskap-institusjonsledelse-role-world-rollout.test.js
          )
          for f in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx "$f" >/dev/null || { echo "Missing expected Role World path: $f" >&2; exit 1; }
          done
          for f in "${changed[@]}"; do
            printf '%s\n' "${expected[@]}" | grep -Fx "$f" >/dev/null || { echo "Unexpected Role World path: $f" >&2; exit 1; }
          done
          git diff --check
      - name: Require fresh main ancestry before permanent commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'Branch became stale before permanent commit.' >&2; exit 1; }
      - name: Commit permanent verified Role World
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/TEMP_materialize_vitenskap_institusjonsledelse_role_world.mjs
          rm -f .github/workflows/TEMP-civication-vitenskap-institusjonsledelse-role-world.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then echo 'No permanent changes to commit.' >&2; exit 1; fi
          git diff --cached --check
          git status --short
          git commit -m "Complete Vitenskap Institusjonsledelse Role World"
          git push origin HEAD:agent/civication-vitenskap-institusjonsledelse-role-world-20260908
