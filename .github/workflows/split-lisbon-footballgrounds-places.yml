name: Split Lisbon football grounds places

on:
  push:
    branches:
      - data/split-lisbon-footballgrounds-places-20260709

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/split-lisbon-footballgrounds-places-20260709
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/split-lisbon-footballgrounds-places.mjs
      - run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add data/places/sport/europa/portugal/footballgrounds_lisbon data/places/sport/europa/portugal/footballgrounds_lisbon_manifest.json data/places/sport/europa/portugal/footballgrounds_lisbon_index.json data/places/sport/europa/portugal/footballgrounds_lisbon_split_report.txt
          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Generate split Lisbon football grounds place files"
            git push
          fi
