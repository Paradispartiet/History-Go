name: Temporary quiz downstream sync
on:
  push:
    branches: [audit/quiz-wiring-20261008]
    paths:
      - .github/workflows/tmp-quiz-downstream-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:scripts
      - name: Regenerate canonical knowledge
        run: node dist/scripts/knowledge-canonical-data.mjs --write
      - name: Regenerate Fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Verify quiz and literature contracts
        run: |
          npm run audit:quiz-manifest:v2
          npm run test:quiz-wiring
          node scripts/audit-litteratur-assessment-v1.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit synchronized canonical generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz data/knowledge data/fagverk/fagverk_release.json reports/knowledge-id-backfill.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Knowledge and Fagverk after quiz registrations"
            git push origin HEAD:refs/heads/audit/quiz-wiring-20261008
          fi
