name: Aftenposten source assets (temporary)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/aftenposten-source-assets-temporary.yml']
permissions:
  contents: read
jobs:
  original:
    if: github.head_ref == 'agent/aftenposten-production-20261009'
    runs-on: ubuntu-latest
    steps:
      - name: Download documented public-domain original
        run: |
          mkdir -p source-assets
          curl --fail --location --retry 2 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Akersgata_51_OB.F14680bj.jpg' -o source-assets/akersgata_51_1890_1900.jpg
          echo '3588c196d2ecd4ee6cf2d5d02a4509e8d49a37c0  source-assets/akersgata_51_1890_1900.jpg' | sha1sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: aftenposten-original-source
          path: source-assets/akersgata_51_1890_1900.jpg
          retention-days: 7
