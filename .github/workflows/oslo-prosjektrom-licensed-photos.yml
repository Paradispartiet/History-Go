name: Oslo Prosjektrom licensed photo integration
on:
  push:
    branches: [place/oslo-prosjektrom-v1-20261103]
    paths:
      - '.github/workflows/oslo-prosjektrom-licensed-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: place/oslo-prosjektrom-v1-20261103
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow image encoder
        run: python -m pip install 'Pillow>=11,<13'
      - name: Fetch licensed originals and make two WebP crops
        run: python scripts/integrate-oslo-prosjektrom-photos.py
      - name: Confirm source, resolution, metadata and Knowledge
        run: |
          node --test tests/oslo-prosjektrom-v1-content.test.mjs
      - name: Commit venue-scoped assets and photo references
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/places/oslo_prosjektrom/
          git add data/places/kunst/oslo/places_kunst/oslo_prosjektrom.json
          git add data/runtime/place-open/oslo_prosjektrom.json
          if git diff --cached --quiet; then
            echo "Photo assets already up to date"
            exit 0
          fi
          git commit -m "Integrate two licensed atelier-quarter photos for Oslo Prosjektrom"
          git push origin HEAD:place/oslo-prosjektrom-v1-20261103
