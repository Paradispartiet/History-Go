name: TEMP Sosiologi phase 3 materialize

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-sosiologi-phase3-materialize.yml'
      - 'data/fag/politikk/sosiologi_antropologi/advanced_theory_*.json'
      - 'scripts/materialize-sosiologi-antropologi-advanced-theory-fulltext-refresh-v1.mjs'
      - 'scripts/materialize-sosiologi-antropologi-maintenance-v1.mjs'
      - 'tests/sosiologi-antropologi-advanced-theory-*.test.mjs'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize phase 3 packages
        run: node scripts/materialize-sosiologi-antropologi-advanced-theory-fulltext-refresh-v1.mjs
      - name: Verify registered advanced theory test
        run: node --test tests/sosiologi-antropologi-advanced-theory-reading-canon-v1.test.mjs
      - name: Commit deterministic phase 3 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk/politikk/sosiologi_antropologi/advanced_theory
          git add reports/fagverk/sosiologi-antropologi-advanced-theory-fulltext-refresh-v1-audit.json
          if git diff --cached --quiet; then
            echo "Phase 3 outputs are current."
          else
            git commit -m "build: materialize sociology advanced theory phase 3"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
