name: TEMP Kunst theory integrity probe

on:
  push:
    branches:
      - agent/fagverk-kunst-theory-integrity-proof-20260820
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate diagnostic and permanent Kunst gates
        run: |
          node --check tools/probe-kunst-theory-integrity.mjs
          node --check tools/audit-kunst-theory-integrity.mjs
          node --test tests/kunst-theory-integrity-probe-smoke.test.mjs
          node tools/probe-kunst-theory-integrity.mjs > /tmp/kunst-theory-integrity-probe.json
          node tools/audit-kunst-theory-integrity.mjs --write-report --no-check-report
          node --test tests/kunst-theory-integrity.test.mjs
      - name: Upload reconciliation results
        uses: actions/upload-artifact@v4
        with:
          name: kunst-theory-integrity-reconciliation
          path: |
            /tmp/kunst-theory-integrity-probe.json
            reports/fagverk/kunst-theory-integrity-audit.json
