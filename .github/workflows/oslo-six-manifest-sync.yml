name: Oslo six manifest synchronization (PR 6563)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/oslo-six-manifest-sync.yml'
      - 'data/quiz/by/ekebergrestauranten_sets.json'
      - 'data/quiz/historie/frognerseteren_sets.json'

permissions:
  contents: read

concurrency:
  group: oslo-six-manifest-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synchronize:
    if: ${{ github.event.pull_request.number == 6563 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Checkout the existing PR branch, not the synthetic merge ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile canonical Knowledge generator
        run: npm run build:scripts
      - name: Rebuild generated Knowledge and Fagverk from canonical inputs
        run: |
          node dist/scripts/knowledge-canonical-data.mjs
          node scripts/build-fagverk-release-manifest.mjs
      - name: Commit only regenerated manifests to the existing PR branch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add -- data/knowledge/subjects/by/knowledge_units.generated.json data/knowledge/subjects/historie/knowledge_units.generated.json data/fagverk/fagverk_release.json
          if git diff --cached --quiet; then
            echo "Canonical outputs already match the branch"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(history-go): synchronize Knowledge and Fagverk after Oslo quiz edits"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
