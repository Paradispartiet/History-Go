name: Fagverk By Bolig og nabolag phase 4

on:
  pull_request:
    paths:
      - "data/fagverk/by/bolig-nabolag-tilgang-endring.json"
      - "data/fagverk/by/bolig-nabolag-tilgang-endring/**"
      - "data/fagverk/fagverk_registry.json"
      - "data/fagverk/subject_status.json"
      - "scripts/audit-fagverk-by-bolig-nabolag-tilgang-endring-phase4.mjs"
      - "tests/fagverk-by-bolig-nabolag-tilgang-endring-phase4.test.mjs"
      - ".github/workflows/fagverk-by-bolig-nabolag-tilgang-endring-phase4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Audit Bolig og nabolag 5/5
        run: node scripts/audit-fagverk-by-bolig-nabolag-tilgang-endring-phase4.mjs
      - name: Test Bolig og nabolag 5/5
        run: node --test tests/fagverk-by-bolig-nabolag-tilgang-endring-phase4.test.mjs
      - name: Preserve Arkitektur 12/12
        run: node --test tests/fagverk-by-arkitektur-gatekant-makt-ombruk-phase4.test.mjs
      - name: Preserve By pilot
        run: node --test tests/fagverk-by-pilot.test.mjs
