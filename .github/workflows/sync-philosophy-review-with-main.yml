name: Sync Philosophy review with current main

on:
  push:
    branches:
      - agent/review-all-philosophy-university-depth
    paths:
      - '.github/workflows/sync-philosophy-review-with-main.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/review-all-philosophy-university-depth
  EXPECTED_SHA: ${{ github.sha }}

jobs:
  sync:
    name: Merge current main and preserve verified Philosophy completion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert immutable branch input
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin main
      - name: Save verified Philosophy shared entries
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const completion=JSON.parse(fs.readFileSync('data/fagverk/filosofi/filosofi_completion_v1.json','utf8'));
          if(completion.reviewed_article_count!==54 || completion.remaining_university_review_count!==0 || completion.complete_ready!==true || completion.status!=='complete') {
            throw new Error('Refusing sync: Philosophy branch is not verified 54/54 complete');
          }
          const status=JSON.parse(fs.readFileSync('data/fagverk/subject_status.json','utf8'));
          const registry=JSON.parse(fs.readFileSync('data/fagverk/fagverk_registry.json','utf8'));
          const philosophyStatus=status.subjects.find(row=>row.id==='filosofi');
          if(!philosophyStatus || philosophyStatus.editorialStatus!=='complete' || philosophyStatus.nextGate!=='maintenance_source_refresh_and_place_case_expansion') {
            throw new Error('Refusing sync: Philosophy shared status is not final');
          }
          if(!registry.subjects?.filosofi) throw new Error('Refusing sync: Philosophy registry entry missing');
          fs.writeFileSync('/tmp/philosophy-status.json',JSON.stringify(philosophyStatus,null,2));
          fs.writeFileSync('/tmp/philosophy-registry.json',JSON.stringify(registry.subjects.filosofi,null,2));
          NODE
      - name: Merge current main and resolve only known shared Fagverk conflicts
        run: |
          set +e
          git merge --no-edit --no-commit origin/main
          MERGE_STATUS=$?
          set -e
          if [ "$MERGE_STATUS" -ne 0 ]; then
            mapfile -t UNMERGED < <(git diff --name-only --diff-filter=U | sort)
            printf 'Unmerged files:\n%s\n' "${UNMERGED[*]}"
            EXPECTED=(
              data/fagverk/fagverk_registry.json
              data/fagverk/fagverk_release.json
              data/fagverk/subject_status.json
            )
            mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED[@]}" | sort)
            if [ "$(printf '%s\n' "${UNMERGED[@]}")" != "$(printf '%s\n' "${EXPECTED_SORTED[@]}")" ]; then
              echo '::error::Unexpected merge conflict set; refusing automatic resolution.'
              exit 1
            fi
            git checkout --theirs -- "${EXPECTED[@]}"
            git add "${EXPECTED[@]}"
          fi
      - name: Restore verified Philosophy entries on top of current main
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const philosophyStatus=JSON.parse(fs.readFileSync('/tmp/philosophy-status.json','utf8'));
          const philosophyRegistry=JSON.parse(fs.readFileSync('/tmp/philosophy-registry.json','utf8'));
          const statusPath='data/fagverk/subject_status.json';
          const registryPath='data/fagverk/fagverk_registry.json';
          const status=JSON.parse(fs.readFileSync(statusPath,'utf8'));
          const index=status.subjects.findIndex(row=>row.id==='filosofi');
          if(index<0) throw new Error('Current main lost Philosophy status entry');
          status.subjects[index]=philosophyStatus;
          const registry=JSON.parse(fs.readFileSync(registryPath,'utf8'));
          registry.subjects=registry.subjects||{};
          registry.subjects.filosofi=philosophyRegistry;
          fs.writeFileSync(statusPath,`${JSON.stringify(status,null,2)}\n`);
          fs.writeFileSync(registryPath,`${JSON.stringify(registry,null,2)}\n`);
          NODE
      - name: Regenerate deterministic combined Fagverk state
        run: |
          node scripts/audit-fagverk-filosofi-phase3.mjs --write-report --no-check-report
          node scripts/audit-fagverk-subject-inventory.mjs --write-report --no-check-report
          node scripts/audit-fagverk-general-engine.mjs --write-report --no-check-report
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate Philosophy and shared Fagverk after main sync
        run: |
          node --test tests/fagverk-filosofi-university-depth.test.mjs
          node --test tests/fagverk-filosofi-complete.test.mjs
          node --test tests/fagverk-filosofi-editorial-style.test.mjs
          node --test tests/fagverk-filosofi-phase3.test.mjs
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
      - name: Assert conflict-free final tree and push merge commit
        run: |
          test -z "$(git diff --name-only --diff-filter=U)"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          if [ "$REMOTE_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Branch moved during main sync: expected $EXPECTED_SHA, found $REMOTE_SHA"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fagverk/fagverk_registry.json data/fagverk/fagverk_release.json data/fagverk/subject_status.json reports/fagverk/filosofi-phase3-audit.json reports/fagverk/subject-baseline.json reports/fagverk/general-engine-audit.json
          git commit -m 'Sync Philosophy university review with current main'
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_SHA" origin "HEAD:refs/heads/$TARGET_BRANCH"
