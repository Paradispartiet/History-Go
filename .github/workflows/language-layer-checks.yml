name: Language layer checks

on:
  pull_request:
    paths:
      - 'data/leksikon/sprak/**'
      - 'js/ui/place-language-layer.js'
      - 'js/ui/sprakatlas-map-experience-v3.js'
      - 'js/ui/sprakatlas-collection-v4.js'
      - 'js/ui/place-popup-direct-tabs.js'
      - 'js/ui/place-collection-knowledge-routing.js'
      - 'css/place-language-layer.css'
      - 'css/place-popup-tabs.css'
      - 'js/config.js'
      - 'js/knowledgePage.js'
      - 'AHA/docs/AHA_HISTORYGO_IMPORT.md'
      - 'docs/SPRAKLEKSIKON.md'
      - 'docs/SPRAKATLAS_MAP_EXPERIENCE_V3.md'
      - 'docs/SPRAKATLAS_COLLECTION_V4.md'
      - 'docs/PLACE_POPUP_SYSTEM.md'
      - 'docs/PLACE_PRODUCTION_CHECKLIST.md'
      - 'data/places/README_place_rounds.md'
      - 'data/leksikon/README_LEKSIKON.md'
      - 'tests/place-language-layer.test.mjs'
      - 'tests/place-language-dialect-scope.test.mjs'
      - 'tests/birkelunden-phase7h-language.test.mjs'
      - 'tests/sprakatlas-map-v3.test.mjs'
      - 'tests/sprakatlas-collection-v4.test.mjs'
      - 'tests/place-popup-direct-tabs.test.mjs'
      - 'tests/place-popup-all-direct-tabs-visible.test.mjs'
      - 'tests/knowledge-browser-e2e.test.mjs'
      - '.github/workflows/language-layer-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language-layer:
    name: Språkleksikon v2
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check language, atlas and owner-routing runtime syntax
        run: |
          node --check js/ui/place-language-layer.js
          node --check js/ui/sprakatlas-map-experience-v3.js
          node --check js/ui/sprakatlas-collection-v4.js
          node --check js/ui/place-popup-direct-tabs.js
          node --check js/ui/place-collection-knowledge-routing.js

      - name: Check Knowledge collection syntax
        run: node --check js/knowledgePage.js

      - name: Test language data, dialect checklist, atlas and owner-routing contract
        run: node --test tests/place-language-layer.test.mjs tests/place-language-dialect-scope.test.mjs tests/birkelunden-phase7h-language.test.mjs tests/sprakatlas-map-v3.test.mjs tests/sprakatlas-collection-v4.test.mjs tests/place-popup-direct-tabs.test.mjs tests/place-popup-all-direct-tabs-visible.test.mjs
