name: Language layer checks

on:
  pull_request:
    paths:
      - 'data/leksikon/sprak/**'
      - 'js/ui/place-language-layer.js'
      - 'js/ui/place-language-local-varieties.js'
      - 'js/ui/place-popup-direct-tabs.js'
      - 'css/place-language-layer.css'
      - 'css/place-language-local-varieties.css'
      - 'css/place-popup-tabs.css'
      - 'index.html'
      - 'js/config.js'
      - 'js/knowledgePage.js'
      - 'AHA/docs/AHA_HISTORYGO_IMPORT.md'
      - 'docs/SPRAKLEKSIKON.md'
      - 'docs/PLACE_POPUP_SYSTEM.md'
      - 'docs/PLACE_PRODUCTION_CHECKLIST.md'
      - 'data/leksikon/README_LEKSIKON.md'
      - 'tests/place-language-layer.test.mjs'
      - 'tests/place-language-dialect-scope.test.mjs'
      - 'tests/place-language-local-varieties.test.mjs'
      - 'tests/place-popup-direct-tabs.test.mjs'
      - 'tests/knowledge-browser-e2e.test.mjs'
      - '.github/workflows/language-layer-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language-layer:
    name: Språkleksikon v2
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check language and direct-tab runtime syntax
        run: |
          node --check js/ui/place-language-layer.js
          node --check js/ui/place-language-local-varieties.js
          node --check js/ui/place-popup-direct-tabs.js

      - name: Check Knowledge collection syntax
        run: node --check js/knowledgePage.js

      - name: Test language data, dialect checklist and direct-tab contract
        run: node --test tests/place-language-layer.test.mjs tests/place-language-dialect-scope.test.mjs tests/place-language-local-varieties.test.mjs tests/place-popup-direct-tabs.test.mjs
