name: Politikk wave 10 Fagverk release sync

on:
  push:
    branches:
      - 'feature/politikk-comparative-evidence-lab-wave10-20261021'
    paths:
      - '.github/workflows/politikk-wave10-release-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/politikk-comparative-evidence-lab-wave10-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check workshop and regenerate Fagverk release deterministically
        run: |
          node --check js/politikk-evidence-workshop.js
          node --check js/fagverk.js
          node --test tests/politikk-comparative-evidence-lab-wave10.test.mjs
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          git diff --check
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != "data/fagverk/fagverk_release.json" ]; then
            echo "Unexpected Fagverk output: $changed"
            exit 1
          fi
      - name: Commit release manifest on review branch
        run: |
          if git diff --quiet; then echo "Release manifest already current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk/fagverk_release.json
          git diff --cached --check
          git commit -m "build(fagverk): refresh release manifest for Politikk wave 10"
          git push origin HEAD:feature/politikk-comparative-evidence-lab-wave10-20261021
