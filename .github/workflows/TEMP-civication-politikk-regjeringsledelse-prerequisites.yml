name: TEMP Civication Politikk Regjeringsledelse prerequisites

on:
  push:
    branches:
      - agent/civication-politikk-regjeringsledelse-prerequisites-20260907
    paths:
      - scripts/TEMP_materialize_politikk_regjeringsledelse_prerequisites.mjs
      - .github/workflows/TEMP-civication-politikk-regjeringsledelse-prerequisites.yml

permissions:
  contents: write

concurrency:
  group: temp-civication-politikk-regjeringsledelse-prerequisites
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-politikk-regjeringsledelse-prerequisites-20260907
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Repair TEMP syntax and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/TEMP_materialize_politikk_regjeringsledelse_prerequisites.mjs')
          s = p.read_text()
          old1 = "skrevet om.`,effects:{stats:{quality:2,trust:2,risk:-2,energy:-1}}}"
          new1 = "skrevet om.',effects:{stats:{quality:2,trust:2,risk:-2,energy:-1}}}"
          old2 = "korrigeres.`,effects:{stats:{status:1,quality:-2,trust:-2,risk:3}}}"
          new2 = "korrigeres.',effects:{stats:{status:1,quality:-2,trust:-2,risk:3}}}"
          assert s.count(old1) == 1, f'positive replacement count={s.count(old1)}'
          assert s.count(old2) == 1, f'negative replacement count={s.count(old2)}'
          p.write_text(s.replace(old1,new1).replace(old2,new2))
          PY
          node --check scripts/TEMP_materialize_politikk_regjeringsledelse_prerequisites.mjs

      - name: Materialize Regjeringsledelse prerequisites
        run: node scripts/TEMP_materialize_politikk_regjeringsledelse_prerequisites.mjs

      - name: Restore tracked TEMP source after materialization
        run: git checkout -- scripts/TEMP_materialize_politikk_regjeringsledelse_prerequisites.mjs

      - name: Generate canonical derived surfaces
        run: |
          set -euo pipefail
          node scripts/audit-civication-role-packs.mjs
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
          node scripts/build-civication-scene-registry.mjs --write
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts

      - name: Verify Regjeringsledelse prerequisites
        run: node tests/civication-politikk-regjeringsledelse-prerequisites.test.js

      - name: Verify Politics life/career split
        run: node tests/civication-politics-life-career-split.test.js

      - name: Verify Career Gameplay Matrix
        run: node tests/civication-career-gameplay-matrix.test.js

      - name: Verify Role World readiness
        run: node tests/civication-role-world-rollout-readiness.test.js

      - name: Verify Scene Registry
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Verify Scenario People index
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check

      - name: Verify Scenario People audit
        run: node --test tests/civication-scenario-people.test.mjs

      - name: Verify full Civication suite
        run: node tests/run-civication-tests.mjs

      - name: Verify job learning profiles
        run: npm run audit:job-learning-profiles

      - name: Verify job knowledge requirements
        run: npm run audit:job-knowledge-requirements

      - name: Verify generated permanent scope
        shell: bash
        run: |
          set -euo pipefail
          ROLE=politikk_regjeringsledelse
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          if [ "${#changed[@]}" -lt 20 ]; then
            echo "Expected a materialized prerequisite package, found only ${#changed[@]} changed files" >&2
            exit 1
          fi
          for f in "${changed[@]}"; do
            case "$f" in
              data/Civication/careerGameplayMatrix.json|data/Civication/compiledSceneRegistryV1.json|data/Civication/roleModels/manifest.json|data/Civication/rolePackIndex.json|data/Civication/roleWorldRolloutReadiness.json|data/Civication/scenarioPeople/generated/politikk.json|data/Civication/scenarioPeople_index.json|docs/CIVICATION_ROLE_PACK_INDEX.md|reports/civication-role-packs.md|reports/civication-career-gameplay-matrix.md|reports/civication-role-world-rollout-readiness.md|reports/CIVICATION_POLITIKK_REGJERINGSLEDELSE_PREREQUISITES_SOURCE_FIRST.md|tests/civication-politikk-regjeringsledelse-prerequisites.test.js|data/Civication/roleModels/politikk/politikk_regjeringsledelse.json|data/Civication/workGrammars/politikk/politikk_regjeringsledelse.json|data/Civication/mailPlans/politikk/politikk_regjeringsledelse_plan.json|data/Civication/mailFamilies/politikk/*/politikk_regjeringsledelse_*.json)
                ;;
              *)
                echo "Unexpected generated path: $f" >&2
                exit 1
                ;;
            esac
          done
          for required in \
            data/Civication/roleModels/politikk/$ROLE.json \
            data/Civication/workGrammars/politikk/$ROLE.json \
            data/Civication/mailPlans/politikk/${ROLE}_plan.json \
            reports/CIVICATION_POLITIKK_REGJERINGSLEDELSE_PREREQUISITES_SOURCE_FIRST.md \
            tests/civication-politikk-regjeringsledelse-prerequisites.test.js; do
            printf '%s\n' "${changed[@]}" | grep -Fx "$required" >/dev/null || { echo "Missing required generated path: $required" >&2; exit 1; }
          done
          for type in job people conflict story event micro followup knowledge consequence; do
            required="data/Civication/mailFamilies/politikk/$type/${ROLE}_${type}.json"
            printf '%s\n' "${changed[@]}" | grep -Fx "$required" >/dev/null || { echo "Missing mail family: $required" >&2; exit 1; }
          done
          git diff --check

      - name: Commit permanent verified package
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/TEMP_materialize_politikk_regjeringsledelse_prerequisites.mjs
          rm -f .github/workflows/TEMP-civication-politikk-regjeringsledelse-prerequisites.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.' >&2
            exit 1
          fi
          git diff --cached --check
          git status --short
          git commit -m "Complete Politikk Regjeringsledelse prerequisites"
          git push origin HEAD:agent/civication-politikk-regjeringsledelse-prerequisites-20260907
