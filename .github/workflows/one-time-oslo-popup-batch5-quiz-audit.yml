name: One-time Oslo popup batch 5 quiz context rebuild

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/oslo-popup-batch5-quiz-audit-trigger.txt

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Batch 5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-popup-v4-batch-05-ten-protocol
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild and validate Deichman Bjørvika quiz context
        run: |
          npm run quiz:context -- \
            --category by \
            --target deichman_bjorvika \
            --output data/quiz/production_context/by/deichman_bjorvika.json
          npm run audit:quiz-production-context

      - name: Commit rebuilt context only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz/production_context/by/deichman_bjorvika.json
          git diff --cached --quiet && exit 0
          git commit -m "Regenerer Deichman Bjørvika quiz-kontekst"
          git push origin HEAD:agent/oslo-popup-v4-batch-05-ten-protocol
