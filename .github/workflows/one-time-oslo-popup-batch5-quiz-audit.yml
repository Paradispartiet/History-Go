name: One-time Oslo popup batch 5 quiz context rebuild

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/oslo-popup-batch5-quiz-audit-trigger.txt

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild Deichman Bjørvika quiz context
        run: |
          npm run quiz:context -- \
            --category by \
            --target deichman_bjorvika \
            --output data/quiz/production_context/by/deichman_bjorvika.json
          npm run audit:quiz-production-context

      - name: Upload rebuilt context
        uses: actions/upload-artifact@v4
        with:
          name: deichman-bjorvika-quiz-context-${{ github.run_id }}
          path: data/quiz/production_context/by/deichman_bjorvika.json
          if-no-files-found: error
