name: One-time audit Oslo rådhus remaining people

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/oslo-radhus-remaining-people-audit-trigger.txt

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rank remaining canonical Rådhus people
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          manifest = json.loads(Path('data/people/manifest.json').read_text(encoding='utf-8'))
          relations = json.loads(Path('data/relations.json').read_text(encoding='utf-8'))
          rel_by_person = {}
          for rel in relations:
              if rel.get('place') != 'oslo_radhus':
                  continue
              person_id = rel.get('person') or rel.get('personId')
              if person_id:
                  rel_by_person.setdefault(person_id, []).append(rel)

          rows = []
          for relative in manifest['files']:
              path = Path('data') / relative
              data = json.loads(path.read_text(encoding='utf-8'))
              entries = data if isinstance(data, list) else [data]
              for person in entries:
                  if not isinstance(person, dict):
                      continue
                  refs = []
                  if person.get('placeId') == 'oslo_radhus': refs.append('placeId')
                  if 'oslo_radhus' in (person.get('places') or []): refs.append('places')
                  person_rels = rel_by_person.get(person.get('id'), [])
                  if person_rels: refs.append('relations')
                  if not refs:
                      continue
                  paragraphs = [p for p in str(person.get('popupDesc') or '').split('\n\n') if p.strip()]
                  missing = []
                  checks = {
                      'birth_date': bool(person.get('birth_date')),
                      'death_date': bool(person.get('death_date')),
                      'education': len(person.get('education') or []) >= 2,
                      'themes': len(person.get('themes') or []) >= 4,
                      'works': len(person.get('works') or []) >= 4,
                      'sources': len(person.get('externalLinks') or person.get('source_urls') or []) >= 2,
                      'popup_3_paragraphs': len(paragraphs) >= 3,
                  }
                  missing = [key for key, ok in checks.items() if not ok]
                  rows.append({
                      'id': person.get('id'),
                      'name': person.get('name'),
                      'category': person.get('category'),
                      'file': str(path),
                      'refs': refs,
                      'relations': person_rels,
                      'missing': missing,
                      'missing_count': len(missing),
                      'image': person.get('image') or '',
                  })

          rows.sort(key=lambda row: (-row['missing_count'], row.get('name') or ''))
          out = Path('reports/oslo-radhus-remaining-people-audit')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'audit.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(rows, ensure_ascii=False, indent=2))
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: oslo-radhus-remaining-people-audit-${{ github.run_id }}
          path: reports/oslo-radhus-remaining-people-audit/audit.json
          if-no-files-found: error
