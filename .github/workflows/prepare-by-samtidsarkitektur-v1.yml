name: Prepare Samtidsarkitektur locale candidates
on:
  push:
    branches:
      - feat/by-samtidsarkitektur-v1-20261103
permissions:
  contents: write
jobs:
  localize:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13' 'numpy>=2,<3'
      - run: python scripts/generate-badge-locales-v1.py
      - run: python scripts/render-badge-locale-reviews.py
      - name: Commit localized artwork to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/merker/by/locales/ data/badges/badge_locale_images_candidates.json docs/badge-locale-previews/
          if ! git diff --cached --quiet; then
            git commit -m "Generate sixth By locale candidates [skip ci]"
            git push origin HEAD:feat/by-samtidsarkitektur-v1-20261103
          fi
