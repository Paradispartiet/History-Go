name: House of Nerds temporary audit diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/house-of-nerds-debug-audits.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Inspect Subkultur Knowledge warnings
        run: |
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --audit-only
          node - <<'NODE'
          const r=require('./reports/knowledge-contract-audit.json');
          console.log('Subkultur warnings:', JSON.stringify((r.warnings || []).filter(x=>x.subject_id==='subkultur')).slice(0,9000));
          console.log('Subkultur failures:', JSON.stringify((r.failures || []).filter(x=>x.subject_id==='subkultur')).slice(0,9000));
          NODE
      - name: Inspect epoch deterministic drift on actual PR merge
        run: |
          node scripts/build-epoke-place-index.mjs
          git diff --stat -- data/epoker/epoke-place-index.json
          git diff -- data/epoker/epoke-place-index.json | head -c 3000 || true
          node scripts/build-epoke-place-index.mjs --check
