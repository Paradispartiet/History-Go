name: National Scenekunst new venues batch 2

on:
  pull_request:
    branches:
      - agent/scenekunst-national-venues-01

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/scenekunst-national-venues-02
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build five national venue packages
        id: venue_build
        shell: bash
        run: |
          set +e
          node tools/add-scenekunst-national-venues-batch-2.mjs > /tmp/scenekunst-national-batch-2.log 2>&1
          status=$?
          cat /tmp/scenekunst-national-batch-2.log
          if [ "$status" -ne 0 ]; then
            mkdir -p reports
            cp /tmp/scenekunst-national-batch-2.log reports/scenekunst-national-new-venues-batch-2-runner-error.log
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit diagnostic on builder failure
        if: steps.venue_build.outputs.failed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/scenekunst-national-new-venues-batch-2-runner-error.log
          git diff --cached --quiet || git commit -m "Record national Scenekunst batch 2 failure"
          git push origin HEAD:agent/scenekunst-national-venues-02
          exit 1

      - name: Build tools and regenerate place index
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          npm run build:tools
          npm run places:index:build

      - name: Validate places and categories
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          bash scripts/check-places.sh
          npm run audit:categories

      - name: Mark report validated
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'reports/scenekunst-national-new-venues-batch-2-2026-07-22.json';
          const report = JSON.parse(fs.readFileSync(p, 'utf8'));
          report.status = 'validated';
          report.validatedAt = new Date().toISOString();
          report.validation = {
            geonorgeExactAddressLookup: 'pass',
            overlapAudit: 'pass',
            placesIndexBuild: 'pass',
            placesChecks: 'pass',
            categoryAudit: 'pass'
          };
          fs.writeFileSync(p, JSON.stringify(report, null, 2) + '\n');
          NODE

      - name: Commit production result
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/manifest.json
          git add data/places/places_index.json
          git add data/places/scenekunst/nordland/nordland_teater.json
          git add data/places/scenekunst/more_og_romsdal/teatret_vart_plassen.json
          git add data/places/scenekunst/vestland/teater_vestland_nynorskhuset.json
          git add data/places/scenekunst/vestland/det_vestnorske_teateret.json
          git add data/places/scenekunst/finnmark/beaivvas_coarvematta.json
          git add reports/scenekunst-national-new-venues-batch-2-2026-07-22.json
          git add reports/scenekunst-national-new-venues-batch-2-2026-07-22.md
          git diff --cached --stat
          git diff --cached --quiet && { echo "No production changes produced"; exit 1; }
          git commit -m "Add second national Scenekunst venue batch"
          git push origin HEAD:agent/scenekunst-national-venues-02
