name: Finalize Vulkan industriområde rounds batch 1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vulkan-industriomrade-rounds-finalize.yml'
      - 'tools/finalize-vulkan-industriomrade-rounds.mjs'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fill-vulkan-industriomrade-rounds-batch1
          fetch-depth: 0

      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main

      - name: Materialize and validate Vulkan batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/vulkan-industriomrade-rounds-batch1/validation

          # Node 20 exposes the recursive Dirent parent directory as .path.
          sed -i 's/dirent\.parentPath/dirent.path/g' tools/finalize-vulkan-industriomrade-rounds.mjs
          node tools/finalize-vulkan-industriomrade-rounds.mjs

          npm ci --silent > reports/vulkan-industriomrade-rounds-batch1/validation/npm-ci.txt 2>&1
          node tests/vulkan-industriomrade-rounds-batch1.test.js > reports/vulkan-industriomrade-rounds-batch1/validation/targeted-test.txt 2>&1
          node tests/place-card-rounds-runtime-audit.test.js > reports/vulkan-industriomrade-rounds-batch1/validation/place-card-rounds-runtime.txt 2>&1
          npm run places:index:build > reports/vulkan-industriomrade-rounds-batch1/validation/places-index-build.txt 2>&1
          npm run places:index:check > reports/vulkan-industriomrade-rounds-batch1/validation/places-index-check.txt 2>&1
          npm run audit:places-split-manifest-sync > reports/vulkan-industriomrade-rounds-batch1/validation/split-manifest-sync.txt 2>&1
          npm run audit:people-of-places > reports/vulkan-industriomrade-rounds-batch1/validation/people-of-places.txt 2>&1
          git checkout origin/main -- reports/people-of-places-status.json reports/people-of-places-status.md 2>/dev/null || true

          node - <<'NODE' > reports/vulkan-industriomrade-rounds-batch1/validation/json-parse.txt 2>&1
          const fs = require('fs');
          for (const file of [
            'data/places/natur/oslo/places_oslo_natur_akerselvarute/vulkan_industriomrade.json',
            'data/places/natur/oslo/places_oslo_natur_akerselvarute_index.json',
            'data/places/natur/oslo/places_oslo_natur_akerselvarute_manifest.json',
            'data/places/places_index.json',
            'data/people/historie/oslo/akerselva/halvor_hoaas.json',
            'data/people/historie/oslo/akerselva/ferdinand_ludvig_vibe.json',
            'data/people/historie/oslo/akerselva/axel_ingvald_spone_amundsen.json',
            'data/people/manifest.json',
            'data/relations.json',
            'data/stories/stories_vulkan_industriomrade.json',
            'data/stories/stories_manifest.json',
            'data/leksikon/places/oslo/natur/leksikon_oslo_natur_batch1.json',
            'data/quiz/historie/vulkan_industriomrade_sets.json'
          ]) JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log('JSON parse OK');
          NODE

          git diff --check > reports/vulkan-industriomrade-rounds-batch1/validation/git-diff-check.txt 2>&1

          cat > reports/vulkan-industriomrade-rounds-batch1/validation/status.txt <<'EOF'
          targeted_test=0
          place_card_runtime=0
          places_index_build=0
          places_index_check=0
          split_manifest_sync=0
          people_of_places=0
          json_parse=0
          git_diff_check=0
          overall=0
          EOF

          rm -f .github/workflows/vulkan-industriomrade-rounds-finalize.yml
          rm -f tools/finalize-vulkan-industriomrade-rounds.mjs

          git add -A
          git commit -m 'feat: fill Vulkan industriområde rounds batch 1'
          git push origin HEAD:agent/fill-vulkan-industriomrade-rounds-batch1
