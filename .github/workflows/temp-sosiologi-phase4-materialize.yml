name: Temporary sociology Phase 4 materializer

on:
  push:
    branches:
      - agent/sosiologi-phase4-runtime-release-20260916
    paths:
      - .github/workflows/temp-sosiologi-phase4-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sosiologi-phase4-runtime-release-20260916
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Materialize through owner chain
        run: node scripts/materialize-sosiologi-antropologi-maintenance-v1.mjs
      - name: Verify scoped generated changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          unexpected="$(git status --short | grep -vE '^( M|M |A |\?\?) (data/fagverk/politikk/sosiologi_antropologi/advanced_theory/|reports/fagverk/sosiologi-antropologi-advanced-theory-fulltext-refresh-v1-audit.json$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected owner-chain changes:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit generator-owned Phase 4 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk/politikk/sosiologi_antropologi/advanced_theory reports/fagverk/sosiologi-antropologi-advanced-theory-fulltext-refresh-v1-audit.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 1
          fi
          git commit -m "chore: materialize sociology phase 4 runtime release"
          git push origin HEAD:agent/sosiologi-phase4-runtime-release-20260916
