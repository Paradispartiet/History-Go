name: TEMP Vinderen CI diagnostics

on:
  push:
    branches:
      - agent/vinderen-place-production-20260907

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run isolated diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/vinderen-diagnostics
          npm run test:quiz-content-audit > /tmp/vinderen-diagnostics/quiz-content-audit.log 2>&1
          echo "quiz_content_audit_exit=$?" >> /tmp/vinderen-diagnostics/status.txt
          npm run test:quiz-production > /tmp/vinderen-diagnostics/quiz-production.log 2>&1
          echo "quiz_production_exit=$?" >> /tmp/vinderen-diagnostics/status.txt
          node --test tests/quiz-answer-shuffle-runtime.test.mjs tests/quiz-answer-position-governance.test.mjs > /tmp/vinderen-diagnostics/quiz-answer-tests.log 2>&1
          echo "quiz_answer_tests_exit=$?" >> /tmp/vinderen-diagnostics/status.txt
          BASE_SHA="$(git merge-base origin/main HEAD)"
          node scripts/audit-quiz-answer-position-bias.mjs --base "$BASE_SHA" --head HEAD > /tmp/vinderen-diagnostics/quiz-answer-bias.log 2>&1
          echo "quiz_answer_bias_exit=$?" >> /tmp/vinderen-diagnostics/status.txt
          node --test tests/epoke-place-index.test.mjs tests/epoker-runtime-place-index.test.mjs tests/epoke-viewer.test.mjs tests/fagverk-history-period-deeplink.test.mjs tests/place-card-meta-surfaces.test.mjs > /tmp/vinderen-diagnostics/epoch-tests.log 2>&1
          echo "epoch_tests_exit=$?" >> /tmp/vinderen-diagnostics/status.txt
          grep -RIn "224\|226" tests/epoke-*.test.mjs tests/epoker-*.test.mjs > /tmp/vinderen-diagnostics/epoch-count-literals.log 2>&1 || true
          node scripts/validate-place-description-production-v4_2_policy.mjs --all --report /tmp/vinderen-diagnostics/place-description-report.json > /tmp/vinderen-diagnostics/place-description.log 2>&1
          echo "place_description_exit=$?" >> /tmp/vinderen-diagnostics/status.txt
          REPO_HYGIENE_BASE_SHA="$BASE_SHA" REPO_HYGIENE_HEAD_SHA="HEAD" node scripts/audit-repository-hygiene-v1.mjs > /tmp/vinderen-diagnostics/repository-hygiene.log 2>&1
          echo "repository_hygiene_exit=$?" >> /tmp/vinderen-diagnostics/status.txt
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/vinderen-diagnostics/place-image-audit.json > /tmp/vinderen-diagnostics/place-images.log 2>&1
          echo "place_images_exit=$?" >> /tmp/vinderen-diagnostics/status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: vinderen-ci-diagnostics
          path: /tmp/vinderen-diagnostics
          if-no-files-found: error
