name: Temporary Nationaltheatret People apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-nationaltheatret-people:
    if: github.event.pull_request.head.ref == 'agent/nationaltheatret-people-curation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Add explicit People curation and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          popup = Path('js/ui/popup-utils.js')
          text = popup.read_text()
          old = '''  const peopleEntries = peopleArr\n    .map(p => /** @type {readonly [any, any]} */ ([_s(p?.id), p]))\n    .filter(([id]) => id);\n  const peopleById = new Map(peopleEntries);\n  const seen = new Set();\n  const out = [];\n'''
          new = '''  const peopleEntries = peopleArr\n    .map(p => /** @type {readonly [any, any]} */ ([_s(p?.id), p]))\n    .filter(([id]) => id);\n  const peopleById = new Map(peopleEntries);\n\n  const placesArr = Array.isArray(window.PLACES)\n    ? window.PLACES\n    : (typeof PLACES !== "undefined" && Array.isArray(PLACES) ? PLACES : []);\n  const place = placesArr.find(item => _s(item?.id) === pid);\n\n  // Canonical explicit curation wins when the field exists, including [].\n  if (place && Array.isArray(place.people_ids)) {\n    const curatedSeen = new Set();\n    return place.people_ids\n      .map(_s)\n      .filter(id => id && !curatedSeen.has(id) && curatedSeen.add(id))\n      .map(id => peopleById.get(id))\n      .filter(Boolean);\n  }\n\n  const seen = new Set();\n  const out = [];\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('popup-utils curation insertion point not found')
              popup.write_text(text.replace(old, new))

          place_path = Path('data/places/scenekunst/oslo/places_scenekunst/nationaltheatret.json')
          place = json.loads(place_path.read_text())
          place['people_ids'] = ['henrik_bull', 'bjorn_bjornson', 'johanne_dybwad']
          place_path.write_text(json.dumps(place, ensure_ascii=False, indent=2) + '\n')

          people_path = Path('data/people/by/oslo/people_by_oslo.json')
          people = json.loads(people_path.read_text())
          hits = [p for p in people if p.get('id') == 'henrik_bull']
          if len(hits) != 1:
              raise SystemExit(f'expected exactly one henrik_bull, found {len(hits)}')
          henrik = hits[0]
          legacy = 'bilder/kort/people/henrik_bull.PNG'
          if henrik.get('image') not in ('', legacy, None) or henrik.get('cardImage') not in ('', legacy, None):
              raise SystemExit('Henrik Bull has an unexpected existing image path; refusing to overwrite')
          henrik['image'] = ''
          henrik['cardImage'] = ''
          henrik.pop('imageMeta', None)
          people_path.write_text(json.dumps(people, ensure_ascii=False, indent=2) + '\n')
          PY

          cat > tests/place-people-ids-runtime.test.js <<'EOF'
          const assert = require('assert');
          const fs = require('fs');
          const path = require('path');
          const vm = require('vm');

          const repo = path.resolve(__dirname, '..');
          const source = fs.readFileSync(path.join(repo, 'js/ui/popup-utils.js'), 'utf8');
          const context = {
            console,
            window: {
              PEOPLE: [
                { id: 'p1', places: ['curated', 'fallback', 'empty_curated'] },
                { id: 'p2', placeId: 'curated' },
                { id: 'p3' }
              ],
              PLACES: [
                { id: 'curated', people_ids: ['p2', 'p1', 'p2', 'missing'] },
                { id: 'fallback' },
                { id: 'empty_curated', people_ids: [] }
              ],
              RELATIONS: [
                { placeId: 'curated', personId: 'p3' },
                { placeId: 'fallback', personId: 'p3' },
                { placeId: 'empty_curated', personId: 'p3' }
              ]
            },
            document: {
              addEventListener() {},
              createElement() { return {}; },
              body: { appendChild() {} },
              getElementById() { return null; }
            },
            requestAnimationFrame() {},
            setTimeout,
            clearTimeout
          };
          context.globalThis = context;
          vm.createContext(context);
          vm.runInContext(source, context, { filename: 'popup-utils.js' });
          const ids = placeId => Array.from(context.getPeopleForPlace(placeId), person => person.id);

          assert.deepStrictEqual(ids('curated'), ['p2', 'p1'], 'explicit people_ids must win, preserve order, dedupe, and ignore missing IDs');
          assert.deepStrictEqual(ids('fallback'), ['p3', 'p1'], 'places without people_ids must preserve relation-first legacy fallback');
          assert.deepStrictEqual(ids('empty_curated'), [], 'explicit empty people_ids must suppress legacy fallback');
          console.log('place people_ids runtime precedence OK');
          EOF

          cat > tests/nationaltheatret-people-curation.test.js <<'EOF'
          const assert = require('assert');
          const fs = require('fs');
          const path = require('path');
          const repo = path.resolve(__dirname, '..');
          const readJson = rel => JSON.parse(fs.readFileSync(path.join(repo, rel), 'utf8'));
          const place = readJson('data/places/scenekunst/oslo/places_scenekunst/nationaltheatret.json');
          const expectedIds = ['henrik_bull', 'bjorn_bjornson', 'johanne_dybwad'];
          assert.deepStrictEqual(place.people_ids, expectedIds, 'Nationaltheatret must expose exactly the curated People set');

          const manifest = readJson('data/people/manifest.json');
          const allPeople = [];
          for (const rel of manifest.files || []) {
            const json = readJson(path.posix.join('data/people', rel.replace(/^people\//, '')));
            if (Array.isArray(json)) allPeople.push(...json);
            else if (json && Array.isArray(json.people)) allPeople.push(...json.people);
            else if (json && typeof json === 'object') allPeople.push(json);
          }

          for (const id of expectedIds) {
            const matches = allPeople.filter(person => String(person?.id || '') === id);
            assert.strictEqual(matches.length, 1, `${id} must exist exactly once in manifest-loaded people data`);
            const person = matches[0];
            const placeIds = [person.placeId, ...(Array.isArray(person.places) ? person.places : [])].filter(Boolean);
            assert(placeIds.includes('nationaltheatret'), `${id} must retain a direct Nationaltheatret anchor`);
            assert(/^bilder\/kort\/people\//.test(String(person.image || '')), `${id} must use a local People image`);
            assert.strictEqual(person.cardImage, person.image, `${id} image/cardImage must match`);
            assert(fs.existsSync(path.join(repo, person.image)), `${id} local image file must exist`);
            assert(person.imageMeta && person.imageMeta.source === 'wikimedia_commons', `${id} must have canonical Commons image metadata`);
            assert(/^https:\/\/commons\.wikimedia\.org\/wiki\/File:/.test(person.imageMeta.sourcePage || ''), `${id} must retain the Commons source page`);
            assert.strictEqual(person.imageMeta.reviewStatus, 'manually_approved', `${id} image must be manually approved`);
          }
          console.log('Nationaltheatret curated People set OK');
          EOF
      - name: Build the three canonical image candidates
        shell: bash
        run: |
          set -euo pipefail
          npm run people:images:candidates -- --ids=henrik_bull,bjorn_bjornson,johanne_dybwad --limit=3 --max-candidates-per-person=1 --include-existing
          node <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync('data/people/people_image_candidates.json', 'utf8'));
          const expected = {
            henrik_bull: 'henrik_bull__henrik_bull_1864_1953_jpg',
            bjorn_bjornson: 'bjorn_bjornson__bj_rn_bj_rnson_1922_jpg',
            johanne_dybwad: 'johanne_dybwad__johanne_dybwad_c_1900_jpg'
          };
          const selections = [];
          for (const [personId, candidateId] of Object.entries(expected)) {
            const hits = rows.filter(row => row.personId === personId && row.candidateId === candidateId);
            if (hits.length !== 1) throw new Error(`${personId}: expected candidate ${candidateId}, found ${hits.length}`);
            const row = hits[0];
            if (row.identity?.status !== 'strong' || row.identity?.source !== 'wikidata_p18') throw new Error(`${personId}: candidate is not strong Wikidata P18 identity`);
            selections.push({ personId, candidateId, approvalMode: 'normal' });
          }
          fs.writeFileSync('/tmp/nationaltheatret-review.json', JSON.stringify({ version: 2, selections }));
          NODE
      - name: Apply manually reviewed Commons images
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          payload="$(cat /tmp/nationaltheatret-review.json)"
          npm run people:images:apply:write -- "--review-payload=$payload"
          git checkout -- data/people/people_image_candidates.json
      - name: Run baseline People pipeline test as diagnostic
        continue-on-error: true
        run: npm run test:people-images
      - name: Run focused Nationaltheatret People and popup gates
        shell: bash
        run: |
          set -euo pipefail
          node tests/place-people-ids-runtime.test.js
          node tests/nationaltheatret-people-curation.test.js
          node tests/place-popup-v2.test.js
          node tests/place-popup-type-sections.test.js
      - name: Commit production-only result to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            js/ui/popup-utils.js \
            data/places/scenekunst/oslo/places_scenekunst/nationaltheatret.json \
            data/people/by/oslo/people_by_oslo.json \
            data/people/litteratur/oslo/nationaltheatret/bjorn_bjornson.json \
            data/people/litteratur/oslo/nationaltheatret/johanne_dybwad.json \
            data/people/people_image_attributions.json \
            bilder/kort/people/henrik_bull.jpg \
            bilder/kort/people/bjorn_bjornson.jpg \
            bilder/kort/people/johanne_dybwad.jpg \
            tests/place-people-ids-runtime.test.js \
            tests/nationaltheatret-people-curation.test.js
          git diff --cached --name-only | tee /tmp/staged.txt
          test "$(wc -l < /tmp/staged.txt)" -eq 11
          git commit -m 'Curate Nationaltheatret People round'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
