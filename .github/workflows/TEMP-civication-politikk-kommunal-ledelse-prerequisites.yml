name: TEMP Civication Politikk Kommunal ledelse prerequisites

on:
  push:
    branches:
      - agent/civication-politikk-kommunal-ledelse-prerequisites-20260907
    paths:
      - scripts/TEMP_materialize_politikk_kommunal_ledelse_prerequisites.mjs
      - .github/workflows/TEMP-civication-politikk-kommunal-ledelse-prerequisites.yml

permissions:
  contents: write

concurrency:
  group: temp-civication-politikk-kommunal-ledelse-prerequisites
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-politikk-kommunal-ledelse-prerequisites-20260907
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Syntax
        run: node --check scripts/TEMP_materialize_politikk_kommunal_ledelse_prerequisites.mjs

      - name: Materialize
        run: node scripts/TEMP_materialize_politikk_kommunal_ledelse_prerequisites.mjs

      - name: Generate canonical derived surfaces
        run: |
          set -euo pipefail
          node scripts/audit-civication-role-packs.mjs
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
          node scripts/build-civication-scene-registry.mjs --write
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts

      - name: Verify fail-closed candidate
        id: verify
        continue-on-error: true
        run: |
          set -euo pipefail
          node tests/civication-politikk-kommunal-ledelse-prerequisites.test.js
          node tests/civication-career-gameplay-matrix.test.js
          node tests/civication-role-world-rollout-readiness.test.js
          node scripts/build-civication-scene-registry.mjs --check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node --test tests/civication-scenario-people.test.mjs
          node tests/run-civication-tests.mjs
          npm run audit:job-learning-profiles
          npm run audit:job-knowledge-requirements
          git diff --check

      - name: Fail without permanent candidate on verification error
        if: steps.verify.outcome != 'success'
        run: |
          echo "Verification failed; no generated candidate will be committed."
          git status --short
          exit 1

      - name: Commit permanent verified package
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/TEMP_materialize_politikk_kommunal_ledelse_prerequisites.mjs
          rm -f .github/workflows/TEMP-civication-politikk-kommunal-ledelse-prerequisites.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.' >&2
            exit 1
          fi
          git diff --cached --check
          git status --short
          git commit -m "Complete Politikk Kommunal ledelse prerequisites"
          git push origin HEAD:agent/civication-politikk-kommunal-ledelse-prerequisites-20260907
