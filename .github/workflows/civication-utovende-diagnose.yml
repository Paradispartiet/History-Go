name: Civication Utovende Diagnose

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate canonical outputs
        run: |
          node scripts/audit-civication-life-position-role-world-readiness.mjs --write
          node scripts/audit-civication-career-gameplay.mjs --write
      - name: Print canonical diff
        run: |
          git --no-pager diff -- data/Civication/lifePositionRoleWorldReadiness.json reports/civication-life-position-role-world-readiness.md data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md
          test -n "$(git status --porcelain -- data/Civication/lifePositionRoleWorldReadiness.json reports/civication-life-position-role-world-readiness.md data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md)"
