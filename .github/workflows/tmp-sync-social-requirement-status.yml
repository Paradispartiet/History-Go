name: Temporary Social requirement status sync

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Synchronize requirement status blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_exact(
              "docs/HG_SOCIAL_MEET_IDENTITY_CONTRACT.md",
              "Date: 2026-06-30  \nStatus: Contract only. No backend implementation, runtime behavior, Civication behavior, GPS/live-location discovery, followers/feed, free chat, or passive tracking is introduced by this document.",
              "Original contract date: 2026-06-30  \nStatus: **canonical requirements contract.** The identity and opt-in public-profile backend slice is implemented server-side. Participant-facing production rollout remains fail-closed behind explicit configuration and safety gates.  \nImplementation status: [`../backend/README.md`](../backend/README.md) owns current implementation and rollout status. This document owns the stable identity, consent, visibility, export, deletion, retention and forbidden-field requirements.  \nLast verified: **2026-07-26**",
          )
          replace_exact(
              "docs/HG_SOCIAL_MEET_IDENTITY_CONTRACT.md",
              "Production Spotmeeting discovery cannot exist until Social Meet has a minimal, stable identity layer and an explicit opt-in public profile contract. Current Spotmeeting behavior is local/demo-only: invite discovery is disabled in production until a privacy-reviewed backend exists, and demo candidates must remain separate from production people/profile storage.",
              "Production Spotmeeting discovery requires a minimal, stable identity layer and an explicit opt-in public profile contract. The server-side identity/public-profile slice now exists, while participant-facing production discovery remains disabled unless the documented rollout, privacy and safety gates are explicitly enabled. Local/demo candidates remain separate from production identity and profile storage.",
          )
          replace_exact(
              "docs/HG_SOCIAL_MEET_IDENTITY_CONTRACT.md",
              "This is a contract sketch only. It does not require current implementation.",
              "This section defines the required API boundary. Concrete implemented routes and rollout status are documented in `backend/README.md`; this contract does not duplicate implementation details.",
          )

          replace_exact(
              "docs/HG_SOCIAL_MEET_INVITE_BACKEND_CONTRACT.md",
              "Date: 2026-06-30  \nStatus: Backend persistence and safety contract only. No backend implementation, runtime behavior, Civication behavior, GPS/live-location discovery, nearby discovery, followers/feed, free chat, or passive tracking is introduced by this document.",
              "Original contract date: 2026-06-30  \nStatus: **canonical requirements contract.** Durable server-owned invite persistence, lifecycle, inbox and sync are implemented behind the FastAPI/PostgreSQL boundary. Participant-facing production rollout remains fail-closed behind explicit configuration and safety gates.  \nImplementation status: [`../backend/README.md`](../backend/README.md) and [`HG_SPOTMEETING_INVITE_BACKEND.md`](./HG_SPOTMEETING_INVITE_BACKEND.md) own current implementation and rollout status. This document owns the invite persistence, authorization, lifecycle, privacy and failure requirements.  \nLast verified: **2026-07-26**",
          )
          replace_exact(
              "docs/HG_SOCIAL_MEET_INVITE_BACKEND_CONTRACT.md",
              "Production Spotmeeting requires server-side invite persistence before real people can safely send or receive invites. The current client layer is local/demo-only, so it cannot provide durable delivery, cross-device state, server-side block/report enforcement, retention, export, moderation, or abuse prevention.",
              "Production Spotmeeting requires server-side invite persistence before real people can safely send or receive invites. Durable server-owned invite persistence, lifecycle, inbox and cross-device sync are now implemented. Participant-facing production use remains fail-closed behind explicit rollout and safety gates; the local/demo layer remains isolated for TEST_MODE and QA.",
          )
          replace_exact(
              "docs/HG_SOCIAL_MEET_INVITE_BACKEND_CONTRACT.md",
              "This sketch names endpoints and payload shapes only. It does not require current implementation.",
              "This section defines the required endpoint and payload shape. Concrete implementation and rollout status are documented in `backend/README.md` and `HG_SPOTMEETING_INVITE_BACKEND.md`. Current FastAPI routes use the `/api/v1` prefix.",
          )

          replace_exact(
              "docs/HG_SOCIAL_MEET_BLOCK_REPORT_MODERATION_CONTRACT.md",
              "Date: 2026-06-30  \nStatus: Documentation/API contract only. No backend implementation, runtime behavior, Civication behavior, GPS/live-location discovery, nearby discovery, followers/feed, free chat, public visit history, or passive tracking is introduced by this document.",
              "Original contract date: 2026-06-30  \nStatus: **canonical requirements contract.** Server-side participant safety, moderation/appeals and retention/observability slices are implemented. Participant-facing production rollout remains fail-closed behind explicit rollout, moderation-capacity and operations gates.  \nImplementation status: [`../backend/README.md`](../backend/README.md), [`HG_SOCIAL_MEET_MODERATION_BACKEND.md`](./HG_SOCIAL_MEET_MODERATION_BACKEND.md) and [`HG_SOCIAL_MEET_RETENTION_OBSERVABILITY.md`](./HG_SOCIAL_MEET_RETENTION_OBSERVABILITY.md) own current implementation status. This document owns the block, report, moderation, deletion, export, retention and safety-audit requirements.  \nLast verified: **2026-07-26**",
          )
          replace_exact(
              "docs/HG_SOCIAL_MEET_BLOCK_REPORT_MODERATION_CONTRACT.md",
              "Production Spotmeeting discovery must not be enabled until Social Meet has server-side block, report, moderation, retention, deletion, export, abuse-prevention, and audit contracts. Client-only blocking is useful for demos, but it cannot protect a real recipient across devices, cached candidate suggestions, inbox fan-out, notifications, or backend lifecycle transitions.\n\nThis contract extends the Social Meet identity and invite backend contracts with the minimum safety layer required before real people can appear in production discovery.",
              "Production Spotmeeting discovery requires server-side block, report, moderation, retention, deletion, export, abuse-prevention and audit enforcement. Client-only blocking remains useful for demos, but it is not a production safety boundary.\n\nThe server-side participant-safety, moderation/appeals and retention/observability slices are implemented. Production discovery remains fail-closed until rollout gates, moderation capacity and operational procedures are explicitly enabled.\n\nThis contract extends the Social Meet identity and invite backend contracts with the minimum safety layer required before real people can appear in production discovery.",
          )

          registry_path = Path("docs/documentation_registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          registry["last_verified"] = "2026-07-26"
          roles = {
              "docs/HG_SOCIAL_MEET_IDENTITY_CONTRACT.md": "Canonical requirements contract for authenticated Social Meet identity and opt-in public profile",
              "docs/HG_SOCIAL_MEET_INVITE_BACKEND_CONTRACT.md": "Canonical requirements contract for context-bound invite persistence, authorization and lifecycle",
              "docs/HG_SOCIAL_MEET_BLOCK_REPORT_MODERATION_CONTRACT.md": "Canonical requirements contract for block, report, moderation, retention, deletion and safety audit",
          }
          seen = set()
          for entry in registry["documents"]:
              path = entry.get("path")
              if path not in roles:
                  continue
              entry["status"] = "canonical"
              entry["role"] = roles[path]
              entry["last_verified"] = "2026-07-26"
              entry.pop("debt", None)
              seen.add(path)
          missing = set(roles) - seen
          if missing:
              raise SystemExit(f"Missing registry entries: {sorted(missing)}")
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          replace_exact(
              "docs/README.md",
              "Kravinnholdet er fortsatt aktivt. Filenes opprinnelige statusavsnitt er tidsbundne og delvis eldre enn implementasjonen, derfor er dokumentene transitional til statusdelene er synkronisert eller skilt fra kravteksten. Gjeldende implementasjonsstatus ligger i backendinngangen og slice-dokumentene.",
              "De tre dokumentene er canonical kravkontrakter. De eier identity-, invite- og safety-kravene, mens gjeldende implementasjons- og rolloutstatus ligger i `backend/README.md` og slice-dokumentene. Implementert kode betyr fortsatt ikke automatisk bred produksjonsaktivering; participant-facing rollout er fail-closed.",
          )
          replace_exact(
              "docs/README.md",
              "- koordinatdokumentasjonen samlet under én source-kontrakt, én evidenskontrakt, én arbeidsflyt og én kontrollprotokoll",
              "- koordinatdokumentasjonen samlet under én source-kontrakt, én evidenskontrakt, én arbeidsflyt og én kontrollprotokoll\n- Social Meet-kravkontraktenes statusavsnitt synkronisert med FastAPI-implementasjonen og løftet fra transitional til canonical",
          )
          replace_exact(
              "docs/README.md",
              "- synkroniser de tidsbundne statusavsnittene i de tre Social Meet-kravkontraktene uten å endre kravinnholdet\n",
              "",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HG_SOCIAL_MEET_IDENTITY_CONTRACT.md \
                  docs/HG_SOCIAL_MEET_INVITE_BACKEND_CONTRACT.md \
                  docs/HG_SOCIAL_MEET_BLOCK_REPORT_MODERATION_CONTRACT.md \
                  docs/README.md \
                  docs/documentation_registry.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Synchronize Social Meet requirement contract status"
            git push origin HEAD:${{ github.head_ref }}
          fi
