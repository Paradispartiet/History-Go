name: Oset merged-main canonical data regeneration (one-time)
on:
  pull_request:
    paths:
      - ".github/workflows/oset-rebase-canonical-sync-once-20261117.yml"
permissions:
  contents: write
concurrency:
  group: oset-merged-main-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 7342
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate and check canonical Fagverk release against merged current main
        run: |
          node scripts/build-fagverk-release-manifest.mjs --output data/fagverk/fagverk_release.json
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Regenerate source-resolved Oset history quiz context
        run: |
          node scripts/build-quiz-production-context.mjs --category historie --target frysjadammen --output data/quiz/production_context/historie/frysjadammen.json
          node scripts/build-quiz-production-context.mjs --category historie --target frysjadammen --output data/quiz/production_context/historie/frysjadammen.json --check
      - name: Regenerate canonical Knowledge and assert earned IDs survive
        run: |
          npm run knowledge:canonical:write
          npm run knowledge:canonical:check
          node scripts/sync-oset-slusebru-quizcard.mjs --check
          node --test tests/oset-quiz-migration-draft-guard.test.mjs
      - name: Verify canonical quiz production and Place-open source parity
        run: |
          node scripts/audit-quiz-production-context.mjs
          node scripts/audit-quiz-progression.mjs
          node scripts/audit-quiz-theory-binding.mjs
          npm run place-open:check
      - name: Scope guard and publish generated data only; remove one-time job
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oset-rebase-canonical-sync-once-20261117.yml
          git status --short
          unexpected="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | grep -vE '^(\.github/workflows/oset-rebase-canonical-sync-once-20261117\.yml|data/fagverk/fagverk_release\.json|data/quiz/production_context/historie/frysjadammen\.json|data/knowledge/(knowledge_units\.generated\.json|knowledge_emne_review_queue\.generated\.json)|reports/knowledge-id-backfill\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed files outside canonical sync: $unexpected"
            exit 1
          fi
          git add data/fagverk/fagverk_release.json data/quiz/production_context/historie/frysjadammen.json
          git add data/knowledge/knowledge_units.generated.json data/knowledge/knowledge_emne_review_queue.generated.json reports/knowledge-id-backfill.json
          git commit -m "chore(oset): align canonical Fagverk release, quiz context and Knowledge with current main"
          git push origin "HEAD:refs/heads/$HEAD_REF"
