name: Oslo coordinate batch 21 address lookups

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lookup:
    if: github.event.pull_request.head.ref == 'agent/oslo-coordinate-control-batch21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run and save all address-first lookups
        run: |
          set -u
          mkdir -p reports/oslo-coordinate-control-batch-21/lookups
          : > reports/oslo-coordinate-control-batch-21/lookups/exit-status.tsv

          run_lookup() {
            key="$1"
            address="$2"
            set +e
            set -o pipefail
            npm run places:coords:find:address -- --address "$address" \
              | tee "reports/oslo-coordinate-control-batch-21/lookups/${key}-geonorge.json"
            code=${PIPESTATUS[0]}
            set +o pipefail
            set -e
            printf '%s\t%s\n' "$key" "$code" >> reports/oslo-coordinate-control-batch-21/lookups/exit-status.tsv
          }

          set -e
          run_lookup villa_stenersen "Tuengen allé 10C Oslo"
          run_lookup st_hallvard_kirke_kloster "Enerhauggata 4 Oslo"
          run_lookup emanuel_vigeland_mausoleum "Grimelundsveien 8 Oslo"
      - name: Upload lookup evidence
        uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch21-address-lookups
          path: reports/oslo-coordinate-control-batch-21/lookups/
          if-no-files-found: error
