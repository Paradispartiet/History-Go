name: Temporary Minneparken imageMeta quiz hash scope test
on:
  push:
    branches:
      - qa/minneparken-image-meta-quiz-hash-20261105
    paths:
      - .github/workflows/minneparken-quiz-hash-isolation-20261105-temp.yml
permissions:
  contents: read
jobs:
  check-quiz-source-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify QA is based on exact draft head
        run: |
          set -euo pipefail
          git merge-base --is-ancestor '660065d397af97c512e3844f100b3234ecd90083' HEAD
          git diff --name-only '660065d397af97c512e3844f100b3234ecd90083' HEAD | sort > /tmp/scope.txt
          printf '%s\n' '.github/workflows/minneparken-quiz-hash-isolation-20261105-temp.yml' 'scripts/quiz-production-lib.mjs' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/scope.txt
      - run: npm ci --no-audit --no-fund
      - name: Rebuild only Minneparken context and require only two metadata changes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { buildQuizProductionContext } from './scripts/quiz-production-lib.mjs';
          const p='data/quiz/production_context/historie/minneparken_gamlebyen.json';
          const saved=JSON.parse(fs.readFileSync(p,'utf8'));
          const rebuilt=await buildQuizProductionContext({categoryId:'historie',targetId:'minneparken_gamlebyen'});
          const clone=structuredClone(saved);
          clone.source_files.target_index=rebuilt.source_files.target_index;
          assert.deepEqual(clone,rebuilt,'Unexpected non-index change');
          assert.equal(saved.source_files.target_index.path,rebuilt.source_files.target_index.path);
          assert.equal(saved.source_files.target_index.matches,rebuilt.source_files.target_index.matches);
          console.log('MINNEPARKEN_TARGET_INDEX',JSON.stringify(rebuilt.source_files.target_index));
          fs.writeFileSync(p,JSON.stringify(rebuilt,null,2)+'\n');
          NODE
      - name: Strict full quiz production context audit
        run: npm run audit:quiz-production-context
      - name: Quiz pipeline and Minneparken source-parity regression
        run: node --test tests/quiz-production-pipeline.test.mjs tests/minneparken-quiz-source-parity.test.mjs
      - name: Prove no repository source or non-Minneparken artifact rewritten
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only > /tmp/modified-quiz.txt
          cat /tmp/modified-quiz.txt
          test "$(cat /tmp/modified-quiz.txt)" = 'data/quiz/production_context/historie/minneparken_gamlebyen.json'
          echo 'PASS all 123 other context fingerprints preserved; only one candidate context changed in disposable QA'
