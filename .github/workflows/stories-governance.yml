name: Stories governance

on:
  pull_request:
    paths:
      - 'data/stories/**'
      - 'data/places/manifest.json'
      - 'tools/check_stories_integrity.mts'
      - 'tools/report_stories_governance.mts'
      - 'tests/stories-governance-metrics.test.mjs'
      - '.github/workflows/stories-governance.yml'
  push:
    branches:
      - main
    paths:
      - 'data/stories/**'
      - 'data/places/manifest.json'
      - 'tools/check_stories_integrity.mts'
      - 'tools/report_stories_governance.mts'
      - 'tests/stories-governance-metrics.test.mjs'
      - '.github/workflows/stories-governance.yml'

permissions:
  contents: read

jobs:
  stories-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Build tools
        run: npm run build:tools --silent

      - name: Validate Stories integrity
        shell: bash
        run: |
          if ! node dist/tools/check_stories_integrity.mjs > stories-integrity.log 2>&1; then
            echo 'Stories integrity failed. Compact diagnostic follows:'
            tail -n 50 stories-integrity.log
            exit 1
          fi
          tail -n 20 stories-integrity.log

      - name: Upload integrity diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stories-integrity-diagnostic
          path: stories-integrity.log
          if-no-files-found: error
          retention-days: 7

      - name: Validate governance metrics contract
        run: node --test tests/stories-governance-metrics.test.mjs

      - name: Print governance snapshot
        run: node dist/tools/report_stories_governance.mjs
