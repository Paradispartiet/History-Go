name: History sync main temporary
# Temporary branch synchronization helper. Remove before History merge.
# Uses macOS runner pool; auto-resolves only fagverk_release.json and hard-stops on any other conflict.
# Retriggered after terminal History PASS to absorb main 01668fd6 before cleanup.

on:
  push:
    branches:
      - agent/history-completion-audit
    paths:
      - '.github/workflows/history-sync-main-temp.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: macos-latest
    steps:
      - name: Check out History branch
        uses: actions/checkout@v4
        with:
          ref: agent/history-completion-audit
          fetch-depth: 0

      - name: Merge latest main without hiding conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main agent/history-completion-audit
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'History branch already contains current main.'
            exit 0
          fi

          if git merge --no-edit origin/main; then
            echo 'Merged main cleanly.'
          else
            conflicts="$(git diff --name-only --diff-filter=U)"
            printf 'Conflicts:\n%s\n' "$conflicts"
            if [ "$conflicts" != 'data/fagverk/fagverk_release.json' ]; then
              echo 'Unexpected conflict set; refusing automatic resolution.' >&2
              exit 1
            fi
            git checkout --theirs -- data/fagverk/fagverk_release.json
            git add data/fagverk/fagverk_release.json
            git commit --no-edit
          fi

          remote_head="$(git rev-parse origin/agent/history-completion-audit)"
          event_head="${GITHUB_SHA}"
          if [ "$remote_head" != "$event_head" ]; then
            echo "History head moved during sync: expected $event_head, found $remote_head" >&2
            exit 1
          fi
          git push origin HEAD:agent/history-completion-audit
