name: Scenekunst batch 7 resilient builder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build batch 7 on a stable current main
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Extract canonical batch 7 production script
        shell: python
        run: |
          from pathlib import Path

          source = Path('.github/workflows/scenekunst-batch-7-builder.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == 'run: |')
          block = lines[start + 1:]
          nonempty = [line for line in block if line.strip()]
          indent = min(len(line) - len(line.lstrip()) for line in nonempty)
          script = '\n'.join(line[indent:] if line.strip() else '' for line in block) + '\n'
          target = Path('/tmp/scenekunst-batch-7-production.sh')
          target.write_text(script, encoding='utf-8')
          target.chmod(0o755)

      - name: Build, validate and publish with stale-main retries
        shell: bash
        run: |
          set -uo pipefail

          for attempt in 1 2 3 4 5 6; do
            echo "Batch 7 attempt ${attempt}/6"

            git reset --hard
            git clean -fd
            git fetch origin main
            git checkout --detach origin/main

            set +e
            bash /tmp/scenekunst-batch-7-production.sh
            status=$?
            set -e

            if [ "${status}" -eq 0 ]; then
              echo "Batch 7 published successfully."
              exit 0
            fi

            if [ "${status}" -ne 2 ]; then
              echo "Batch 7 failed with non-retryable status ${status}."
              exit "${status}"
            fi

            echo "main moved during validation; waiting before a clean retry."
            sleep 20
          done

          echo "main did not remain stable across six attempts."
          exit 2
