name: Phase 13 workflow diagnostic

on:
  push:
    branches:
      - agent/regjeringskvartalet-phase-13-ui-audit

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/regjeringskvartalet-phase-13-ui-audit
          fetch-depth: 0
      - run: |
          echo "workflow-ran" > .github/phase13-workflow-ran.txt
          rm -f .github/workflows/bootstrap-phase13-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Confirm phase 13 workflow execution"
          git push origin HEAD:agent/regjeringskvartalet-phase-13-ui-audit
