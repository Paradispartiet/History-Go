name: Tronsmo Bokhandel materialize

on:
  push:
    branches:
      - agent/tronsmo-bokhandel-completion-20260910

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[tronsmo-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch reviewed source assets
        run: |
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/4/4d/Tronsmo_Bokhandel_comic_book_store_in_Universitetsgata%2C_Oslo%2C_Norway._Window_decorations_by_Lars_Fiske_and_Bendik_Kaltenborn%2C_2017-12-14.jpg' -o /tmp/tronsmo-source.jpg
          curl -L --fail --retry 3 'https://www.tronsmo.no/wp-content/uploads/2024/03/image-1491.png' -o /tmp/tronsmo-product.png
      - name: Materialize Tronsmo completion
        env:
          TRONSMO_SOURCE_PHOTO: /tmp/tronsmo-source.jpg
          TRONSMO_PRODUCT_PHOTO: /tmp/tronsmo-product.png
        run: node tools/finalize-tronsmo-bokhandel-completion.mjs
      - name: Regenerate deterministic outputs
        run: |
          npm run places:index:build
          npm run epoker:places:build
          npm run place-open:build
      - name: Verify Tronsmo completion
        run: |
          node --test tests/tronsmo-bokhandel-completion.test.mjs
          npm run place-open:check
          node --test tests/place-image-audit-changed.test.mjs
          node scripts/audit-place-images.mjs --mode=changed
      - name: Commit materialized result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete Tronsmo Bokhandel production [tronsmo-materialized]'
          git push
