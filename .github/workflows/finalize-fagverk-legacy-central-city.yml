name: Finalize central-city Fagverk legacy batch

on:
  push:
    branches:
      - agent/fagverk-legacy-central-city-20260901
    paths:
      - .github/workflows/finalize-fagverk-legacy-central-city.yml
      - tools/finalize-fagverk-legacy-central-city.mjs
      - tools/patch-fagverk-legacy-central-city-full.mjs

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync branch to current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Curate four completed Place Fagverk packages
        run: node tools/finalize-fagverk-legacy-central-city.mjs
      - name: Strengthen full Fagverk packages
        run: node tools/patch-fagverk-legacy-central-city-full.mjs
      - name: Rebuild deterministic quiz contexts
        run: |
          node scripts/build-quiz-production-context.mjs --category by --target bankplassen --output data/quiz/production_context/by/bankplassen.json
          node scripts/build-quiz-production-context.mjs --category by --target grev_wedels_plass --output data/quiz/production_context/by/grev_wedels_plass.json
          node scripts/build-quiz-production-context.mjs --category by --target gamle_trikkestallen --output data/quiz/production_context/by/gamle_trikkestallen.json
          node scripts/build-quiz-production-context.mjs --category historie --target gamle_radhus --output data/quiz/production_context/historie/gamle_radhus.json
      - name: Regenerate Place-open runtime
        run: node scripts/build-place-open-payloads.mjs
      - name: Regenerate Fagverk place coverage
        run: node scripts/audit-fagverk-place-pages.mjs --write
      - name: Regenerate Fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Validate Fagverk page contract
        run: node scripts/audit-fagverk-place-pages.mjs
      - name: Validate Place-open and release artifacts
        run: |
          node scripts/build-place-open-payloads.mjs --check
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Test Fagverk page and substance contracts
        run: |
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/fagverk-place-substance-audit.test.mjs
      - name: Test Fagverk links
        run: node --test tests/fagverk-link-audit.test.mjs
      - name: Validate changed Place images
        run: node scripts/audit-place-images.mjs --mode=changed
      - name: Validate quiz production context
        run: npm run audit:quiz-production-context
      - name: Validate quiz progression
        run: npm run audit:quiz-progression
      - name: Validate quiz theory binding
        run: npm run audit:quiz-theory-binding
      - name: Validate diff whitespace
        run: git diff --check
      - name: Commit final production result and remove temporary tooling
        run: |
          git add \
            data/places/by/oslo/places/bankplassen.json \
            data/places/by/oslo/places_by_oslo_oppdag_kvadraturen_batch_03/grev_wedels_plass.json \
            data/places/by/oslo/gamle_trikkestallen/gamle_trikkestallen.json \
            data/places/by/oslo/gamle_radhus/gamle_radhus.json \
            data/quiz/production_context/by/bankplassen.json \
            data/quiz/production_context/by/grev_wedels_plass.json \
            data/quiz/production_context/by/gamle_trikkestallen.json \
            data/quiz/production_context/historie/gamle_radhus.json \
            data/runtime \
            data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/fagverk-place-page-coverage-v2.json
          git rm \
            tools/finalize-fagverk-legacy-central-city.mjs \
            tools/patch-fagverk-legacy-central-city-full.mjs \
            .github/workflows/finalize-fagverk-legacy-central-city.yml
          git diff --cached --quiet && { echo "No production changes to commit"; exit 1; }
          git commit -m "Curate central-city Fagverk legacy batch"
          git push origin HEAD:${GITHUB_REF_NAME}
