name: TEMP Klassekampen Phase 1 contract repair

on:
  push:
    branches:
      - agent/klassekampen-phase-1-20260915
    paths:
      - .github/workflows/tmp-klassekampen-phase1-contract-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: agent/klassekampen-phase-1-20260915
          fetch-depth: 0

      - name: Update locked epoke milestone contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/epoke-place-index.test.mjs')
          text = path.read_text()
          old = '  assert.equal(index.stats.verified_place_production_milestone_count, 558);'
          new = '  assert.equal(index.stats.verified_place_production_milestone_count, 566);'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one locked 558 production-milestone assertion, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- tests/epoke-place-index.test.mjs
          test "$(git diff --name-only)" = "tests/epoke-place-index.test.mjs"

      - name: Commit test contract only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/epoke-place-index.test.mjs
          test "$(git diff --cached --name-only)" = "tests/epoke-place-index.test.mjs"
          git commit -m 'Update verified epoke milestone contract for Klassekampen'
          git push origin HEAD:agent/klassekampen-phase-1-20260915
