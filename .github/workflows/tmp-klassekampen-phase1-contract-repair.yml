name: TEMP Klassekampen Phase 1 contract repair

on:
  push:
    branches:
      - agent/klassekampen-phase-1-20260915
    paths:
      - .github/workflows/tmp-klassekampen-phase1-contract-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: agent/klassekampen-phase-1-20260915
          fetch-depth: 0

      - name: Patch locked epoke milestone contract into materializer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tmp-klassekampen-phase1-materialize.yml')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '          node --test tests/epoke-place-index.test.mjs\n',
              "          python3 - <<'PY'\n          from pathlib import Path\n          path = Path('tests/epoke-place-index.test.mjs')\n          text = path.read_text()\n          old = '  assert.equal(index.stats.verified_place_production_milestone_count, 558);'\n          new = '  assert.equal(index.stats.verified_place_production_milestone_count, 566);'\n          if text.count(old) != 1:\n              raise SystemExit(f'expected one locked 558 production-milestone assertion, found {text.count(old)}')\n          path.write_text(text.replace(old, new, 1))\n          PY\n          node --test tests/epoke-place-index.test.mjs\n",
              'validation patch'
          )
          replace_once(
              "            'data/epoker/epoke-place-index.json'\n",
              "            'data/epoker/epoke-place-index.json',\n            'tests/epoke-place-index.test.mjs'\n",
              'workcard scope'
          )
          replace_once(
              'data/epoker/epoke-place-index.json|reports/place-production/klassekampen-source-review-v1.md',
              'data/epoker/epoke-place-index.json|tests/epoke-place-index.test.mjs|reports/place-production/klassekampen-source-review-v1.md',
              'allowlist'
          )
          replace_once(
              'data/places/places_index.json data/epoker/epoke-place-index.json reports/place-production/klassekampen-source-review-v1.md',
              'data/places/places_index.json data/epoker/epoke-place-index.json tests/epoke-place-index.test.mjs reports/place-production/klassekampen-source-review-v1.md',
              'git add'
          )
          path.write_text(text)
          PY

          rm .github/workflows/tmp-klassekampen-phase1-contract-repair.yml
          git diff --check
          git diff -- .github/workflows/tmp-klassekampen-phase1-materialize.yml

      - name: Commit repair and retrigger materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-klassekampen-phase1-materialize.yml .github/workflows/tmp-klassekampen-phase1-contract-repair.yml
          git commit -m 'Repair Klassekampen Phase 1 epoke milestone contract'
          git push origin HEAD:agent/klassekampen-phase-1-20260915
