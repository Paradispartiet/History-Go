name: One-time build people popup system

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/people-popup-system-trigger.txt

permissions:
  contents: write

jobs:
  build-audit-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check out and synchronize production branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main agent/people-popup-system-and-readiness-audit
          git checkout -B agent/people-popup-system-and-readiness-audit origin/agent/people-popup-system-and-readiness-audit
          git merge --no-edit origin/main

      - name: Register canonical documentation and package scripts
        run: python scripts/one-time-register-people-popup-system.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build tools
        run: |
          npm run typecheck:tools
          npm run build:tools

      - name: Capture people-popup readiness audit
        id: readiness-audit
        shell: bash
        run: |
          mkdir -p reports/people-popup-runner
          set +e
          node dist/tools/audit-people-popup-readiness.mjs > reports/people-popup-runner/audit.log 2>&1
          status=$?
          set -e
          cat reports/people-popup-runner/audit.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload readiness audit diagnostic
        if: steps.readiness-audit.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: people-popup-readiness-audit-${{ github.run_id }}
          path: reports/people-popup-runner/audit.log
          if-no-files-found: error

      - name: Enforce readiness audit
        if: steps.readiness-audit.outputs.status != '0'
        run: exit 1

      - name: Check readiness report synchronization
        run: node dist/tools/audit-people-popup-readiness.mjs --check

      - name: Run people-popup contract and rendering tests
        run: node --test tests/person-popup-v2.test.js tests/people-popup-system-contract.test.mjs

      - name: Validate complete people data
        run: bash scripts/check-people.sh

      - name: Validate documentation governance
        shell: bash
        run: |
          set -euo pipefail
          npm run build:scripts
          mkdir -p reports/documentation-governance
          node dist/scripts/check-documentation-governance.mjs

      - name: Remove one-time production script and transient reports
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/one-time-register-people-popup-system.py
          git restore --staged --worktree reports/documentation-governance reports/people-popup-runner 2>/dev/null || true
          git clean -fd reports/documentation-governance reports/people-popup-runner 2>/dev/null || true

      - name: Commit clean documentation and audit system
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git status --short
          git commit -m "Document and audit the people popup system"
          git push origin HEAD:agent/people-popup-system-and-readiness-audit
