name: Civication Wave D align main
on:
  push:
    branches:
      - civication/wave-d-fourth-installment-20261018
permissions:
  contents: write
jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge published Wave C and preserve authored Wave D changes
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            git diff --name-only --diff-filter=U > /tmp/wave-d-conflicts
            while IFS= read -r conflict; do
              case "$conflict" in
                data/Civication/lifestory/*|docs/CIVICATION_SOURCE_GROUNDED_WAVE_A_V1.md|tests/civication-lifestory-arvid-continuation.test.js|tests/civication-lifestory-renholder.test.js|tests/civication-source-grounded-wave-c.test.js|data/Civication/careerGameplayMatrix.json|data/Civication/roleWorldRolloutReadiness.json|reports/civication-career-gameplay-matrix.md|reports/civication-role-world-rollout-readiness.md)
                  git checkout --ours -- "$conflict"
                  git add "$conflict"
                  ;;
                *)
                  echo "Unexpected main integration conflict: $conflict"
                  exit 1
                  ;;
              esac
            done < /tmp/wave-d-conflicts
          fi
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
          rm .github/workflows/civication-wave-d-align-main.yml
          git add -A
          git diff --cached --check
          git commit -m 'chore(civication): align Wave D with published Wave C on main'
          git push
