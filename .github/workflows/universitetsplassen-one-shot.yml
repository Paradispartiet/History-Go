name: Universitetsplassen one-shot production

on:
  push:
    branches:
      - work/universitetsplassen-completion-20260829
    paths:
      - tools/finalize-universitetsplassen-completion.mjs
      - tools/harden-universitetsplassen-finalizer.py
      - tools/verify-universitetsplassen-one-shot.sh
      - .github/workflows/universitetsplassen-one-shot.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universitetsplassen-one-shot
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/universitetsplassen-completion-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Harden finalizer source and evidence coverage
        run: |
          python tools/harden-universitetsplassen-finalizer.py
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("tools/finalize-universitetsplassen-completion.mjs")
          text = path.read_text()

          old = '      question_type: questionType,\n'
          new = '      question_type: n <= 28 ? "fact" : n <= 42 ? "context" : "concept",\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("question_type normalization anchor not found")

          hook_line = 'item.topic_hook_id = qIndex % 2 === 0 ? "byliv_aapne_rom" : "byliv_opphold_vs_gjennomgang";'
          if hook_line not in text:
              pattern = r'(?m)^(\s*)item\.method_id = qIndex % 2 === 0 \? "met_feltobservasjon" : "met_gaanalyse";\s*$'
              replacement = (
                  r'\1item.method_id = qIndex % 2 === 0 ? "met_feltobservasjon" : "met_gaanalyse";\n'
                  r'\1item.topic_hook_id = qIndex % 2 === 0 ? "byliv_aapne_rom" : "byliv_opphold_vs_gjennomgang";'
              )
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit("final-set theory binding anchor not found")

          path.write_text(text)
          PY
          node --check tools/finalize-universitetsplassen-completion.mjs
      - name: Materialize Universitetsplassen canonical package
        id: finalize
        shell: bash
        run: |
          set +e
          mkdir -p reports/place-production
          node tools/finalize-universitetsplassen-completion.mjs > reports/place-production/universitetsplassen-finalizer-debug.log 2>&1
          code=$?
          cat reports/place-production/universitetsplassen-finalizer-debug.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit finalizer diagnostics
        if: steps.finalize.outputs.exit_code != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/place-production/universitetsplassen-finalizer-debug.log
          if git diff --cached --quiet; then
            echo "Diagnostic log unchanged"
          else
            git commit -m "Capture Universitetsplassen finalizer failure"
            git push origin HEAD:work/universitetsplassen-completion-20260829
          fi
      - name: Stop on finalizer failure
        if: steps.finalize.outputs.exit_code != '0'
        run: exit 1
      - name: Normalize Universitetsplassen Stories contract
        if: steps.finalize.outputs.exit_code == '0'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/stories/stories_universitetsplassen.json")
          stories = json.loads(path.read_text())
          by_id = {story["id"]: story for story in stories}

          square = {"title": "Oslo byleksikon – Universitetsplassen", "url": "https://oslobyleksikon.no/side/Universitetsplassen"}

          first = by_id["st_universitetsplassen_grunnsteinen_1841"]
          if not any(source.get("url") == square["url"] for source in first.get("sources", [])):
              first.setdefault("sources", []).append(square)
          first["score"] = {"narrative": 3, "historical": 2, "source": 3, "play_value": 3, "originality": 3, "total": 14}

          second = by_id["st_universitetsplassen_schweigaard_1883"]
          if not any(source.get("url") == square["url"] for source in second.get("sources", [])):
              second.setdefault("sources", []).append(square)
          second["score"] = {"narrative": 3, "historical": 2, "source": 3, "play_value": 3, "originality": 3, "total": 14}

          third = by_id["st_universitetsplassen_aula_munch_1916"]
          third["score"] = {"narrative": 3, "historical": 2, "source": 4, "play_value": 3, "originality": 3, "total": 15}

          fourth = by_id["st_universitetsplassen_omlegging_1931"]
          fourth["score"] = {"narrative": 3, "historical": 2, "source": 4, "play_value": 3, "originality": 3, "total": 15}

          path.write_text(json.dumps(stories, ensure_ascii=False, indent=2) + "\n")
          PY
      - name: Rebuild deterministic derived data
        if: steps.finalize.outputs.exit_code == '0'
        run: |
          npm run places:index:build
          npm run place-open:build
          npm run epoker:places:build
          npm run civication:history-people:build
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-quiz-production-context.mjs --category by --target universitetsplassen --output data/quiz/production_context/by/universitetsplassen.json
      - name: Verify Universitetsplassen package
        if: steps.finalize.outputs.exit_code == '0'
        id: verify
        shell: bash
        run: |
          set +e
          bash tools/verify-universitetsplassen-one-shot.sh
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit verification diagnostics
        if: steps.finalize.outputs.exit_code == '0' && steps.verify.outputs.exit_code != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/place-production/universitetsplassen-verify-debug.log
          if git diff --cached --quiet; then
            echo "Verification diagnostic unchanged"
          else
            git commit -m "Capture Universitetsplassen verification failure"
            git push origin HEAD:work/universitetsplassen-completion-20260829
          fi
      - name: Stop on verification failure
        if: steps.finalize.outputs.exit_code == '0' && steps.verify.outputs.exit_code != '0'
        run: exit 1
      - name: Remove one-shot tooling
        if: steps.finalize.outputs.exit_code == '0' && steps.verify.outputs.exit_code == '0'
        run: |
          rm .github/workflows/universitetsplassen-one-shot.yml
          rm tools/harden-universitetsplassen-finalizer.py
          rm tools/verify-universitetsplassen-one-shot.sh
          rm -f reports/place-production/universitetsplassen-finalizer-debug.log
          rm -f reports/place-production/universitetsplassen-verify-debug.log
      - name: Commit generated production
        if: steps.finalize.outputs.exit_code == '0' && steps.verify.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Complete Universitetsplassen place production"
          git push origin HEAD:work/universitetsplassen-completion-20260829
