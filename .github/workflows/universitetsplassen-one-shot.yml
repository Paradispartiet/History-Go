name: Universitetsplassen one-shot production

on:
  push:
    branches:
      - work/universitetsplassen-completion-20260829
    paths:
      - tools/finalize-universitetsplassen-completion.mjs
      - .github/workflows/universitetsplassen-one-shot.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universitetsplassen-one-shot
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/universitetsplassen-completion-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Harden Commons image retrieval
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/finalize-universitetsplassen-completion.mjs")
          text = path.read_text()

          old_api = '''  api.searchParams.set("origin", "*");
          const response = await fetch(api, { headers: { "user-agent": "History-Go-place-production/1.0" } });'''
          new_api = '''  api.searchParams.set("origin", "*");
          api.searchParams.set("iiurlwidth", "1600");
          const response = await fetch(api, { headers: { "user-agent": "History-Go-place-production/1.0 (github.com/Paradispartiet/History-Go)" } });'''
          if old_api not in text:
              raise SystemExit("Commons API patch target not found")
          text = text.replace(old_api, new_api, 1)

          old_url = '''    originalUrl: info.url,'''
          new_url = '''    originalUrl: info.thumburl || info.url,'''
          if old_url not in text:
              raise SystemExit("Commons thumb URL patch target not found")
          text = text.replace(old_url, new_url, 1)

          old_fetch = '''async function fetchBuffer(url) {
            const response = await fetch(url, { headers: { "user-agent": "History-Go-place-production/1.0" } });
            if (!response.ok) throw new Error(`Kunne ikke hente bilde (${response.status}): ${url}`);
            return Buffer.from(await response.arrayBuffer());
          }'''
          new_fetch = '''const imageBufferCache = new Map();
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function fetchBuffer(url) {
            const parsed = new URL(url);
            parsed.searchParams.delete("utm_source");
            parsed.searchParams.delete("utm_campaign");
            parsed.searchParams.delete("utm_content");
            const cleanUrl = parsed.toString();
            if (imageBufferCache.has(cleanUrl)) return imageBufferCache.get(cleanUrl);

            let lastStatus = 0;
            for (let attempt = 0; attempt < 6; attempt += 1) {
              const response = await fetch(cleanUrl, {
                headers: {
                  "user-agent": "History-Go-place-production/1.0 (github.com/Paradispartiet/History-Go)",
                  "accept": "image/avif,image/webp,image/*,*/*;q=0.8"
                }
              });
              lastStatus = response.status;
              if (response.ok) {
                const buffer = Buffer.from(await response.arrayBuffer());
                imageBufferCache.set(cleanUrl, buffer);
                await sleep(750);
                return buffer;
              }
              if (![429, 500, 502, 503, 504].includes(response.status)) {
                throw new Error(`Kunne ikke hente bilde (${response.status}): ${cleanUrl}`);
              }
              const retryAfter = Number(response.headers.get("retry-after"));
              const delay = Number.isFinite(retryAfter) && retryAfter > 0
                ? Math.min(retryAfter * 1000, 30000)
                : Math.min(1500 * (2 ** attempt), 30000);
              await sleep(delay);
            }
            throw new Error(`Kunne ikke hente bilde etter retries (${lastStatus}): ${cleanUrl}`);
          }'''
          if old_fetch not in text:
              raise SystemExit("fetchBuffer patch target not found")
          text = text.replace(old_fetch, new_fetch, 1)

          path.write_text(text)
          PY
          node --check tools/finalize-universitetsplassen-completion.mjs
      - name: Materialize Universitetsplassen canonical package
        id: finalize
        shell: bash
        run: |
          set +e
          mkdir -p reports/place-production
          node tools/finalize-universitetsplassen-completion.mjs > reports/place-production/universitetsplassen-finalizer-debug.log 2>&1
          code=$?
          cat reports/place-production/universitetsplassen-finalizer-debug.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit finalizer diagnostics
        if: steps.finalize.outputs.exit_code != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/place-production/universitetsplassen-finalizer-debug.log
          if git diff --cached --quiet; then
            echo "Diagnostic log unchanged"
          else
            git commit -m "Capture Universitetsplassen finalizer failure"
            git push origin HEAD:work/universitetsplassen-completion-20260829
          fi
      - name: Stop on finalizer failure
        if: steps.finalize.outputs.exit_code != '0'
        run: exit 1
      - name: Rebuild deterministic derived data
        if: steps.finalize.outputs.exit_code == '0'
        run: |
          npm run places:index:build
          npm run place-open:build
          npm run epoker:places:build
          npm run civication:history-people:build
          node scripts/build-fagverk-release-manifest.mjs
      - name: Verify Universitetsplassen package
        if: steps.finalize.outputs.exit_code == '0'
        run: |
          node --test tests/universitetsplassen-completion.test.mjs
          npm run places:check
          npm run place-open:check
          npm run quiz:production:check
          npm run quiz:progression:check
          npm run stories:check
          npm run leksikon:check
          npm run people:check
          npm run place-rounds:check
          npm run fagverk:release:check
      - name: Remove one-shot workflow
        if: steps.finalize.outputs.exit_code == '0'
        run: |
          rm .github/workflows/universitetsplassen-one-shot.yml
          rm -f reports/place-production/universitetsplassen-finalizer-debug.log
      - name: Commit generated production
        if: steps.finalize.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Complete Universitetsplassen place production"
          git push origin HEAD:work/universitetsplassen-completion-20260829
