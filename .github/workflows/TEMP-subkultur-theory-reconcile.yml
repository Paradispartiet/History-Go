name: TEMP Subkultur theory reconciliation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.number == 5132 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Subkultur strict theory proof
        run: |
          node --check scripts/audit-subkultur-theory-attribution-v1.mjs
          node scripts/audit-subkultur-theory-attribution-v1.mjs
          node --test tests/subkultur-theory-attribution-v1.test.mjs
      - name: Write global theory integrity report
        run: node scripts/audit-fagverk-theory-integrity.mjs --write-report --no-check-report
      - name: Verify global theory integrity audit
        run: node scripts/audit-fagverk-theory-integrity.mjs
      - name: Test global theory integrity
        run: node --test tests/fagverk-theory-integrity.test.mjs
      - name: Commit generated reconciliation
        run: |
          git add reports/fagverk/fagverk-theory-integrity-audit.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git diff --cached --quiet && exit 0
          git commit -m "reconcile(fagverk): rematerialize Subkultur proof after Vitenskap merge"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
