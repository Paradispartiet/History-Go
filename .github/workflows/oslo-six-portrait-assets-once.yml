name: Oslo six verified portrait crop assets once
on:
  push:
    branches:
      - research/oslo-six-culture-institutions-v1-20261023
    paths:
      - .github/workflows/oslo-six-portrait-assets-once.yml

permissions:
  contents: write

jobs:
  materialize-portrait-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-six-culture-institutions-v1-20261023
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned image library
        run: python -m pip install Pillow==11.3.0
      - name: Crop licensed source photographs to actual 3:4 WebP portraits
        shell: bash
        run: |
          python - <<'PY'
          import io,json,os,urllib.request
          from urllib.parse import urlsplit,urlunsplit
          from pathlib import Path
          from PIL import Image,ImageOps
          entries=[["arbeidersamfunnets_plass","data/places/politikk/oslo/places_politikk/arbeidersamfunnets_plass.json"],["politihuset_gronland","data/places/politikk/oslo/places_politikk/politihuset_gronland.json"],["statsministerboligen","data/places/politikk/oslo/places_politikk/statsministerboligen.json"],["nobels_fredssenter","data/places/historie/oslo/places_historie/nobels_fredssenter.json"],["vikaterrassen","data/places/by/oslo/places/vikaterrassen.json"]]
          outdir=Path('bilder/places/oslo-six-portraits-20261024')
          outdir.mkdir(parents=True,exist_ok=True)
          center={'arbeidersamfunnets_plass':(0.53,0.5),'politihuset_gronland':(0.62,0.5),'statsministerboligen':(0.52,0.5),'nobels_fredssenter':(0.5,0.5),'vikaterrassen':(0.50,0.5)}
          for id,path in entries:
              p=json.loads(Path(path).read_text(encoding='utf-8'))
              url=p['image']
              direct=url
              if '/thumb/' in url:
                  parts=urlsplit(url)
                  direct=urlunsplit((parts.scheme,'upload.wikimedia.org',parts.path.replace('/thumb/','/').rsplit('/',1)[0],'',''))
              trials=list(dict.fromkeys([direct,url]))
              img=None
              for link in trials:
                  try:
                      req=urllib.request.Request(link,headers={'User-Agent':'Mozilla/5.0 (HistoryGo educational project; https://github.com/Paradispartiet/History-Go)'})
                      with urllib.request.urlopen(req,timeout=40) as response:
                          data=response.read()
                      probe=Image.open(io.BytesIO(data))
                      probe.load()
                      if probe.width < 850 or probe.height < 650: raise ValueError('Source resolution too small')
                      img=ImageOps.exif_transpose(probe)
                      print('Downloaded',id,link,img.size)
                      break
                  except Exception as e:
                      print('Source download attempt failed',id,str(e)[:300])
              if img is None:
                  raise RuntimeError('No downloadable photographic original for '+id)
              if img.mode!='RGB': img=img.convert('RGB')
              cropped=ImageOps.fit(img,(900,1200),method=Image.Resampling.LANCZOS,centering=center[id])
              outfile=outdir/(id+'_front_portrait.webp')
              cropped.save(outfile,'WEBP',quality=86,method=6)
              assert outfile.stat().st_size > 25000
              with Image.open(outfile) as verify: assert verify.size==(900,1200) and verify.format=='WEBP'
              p['frontImage']=str(outfile)
              meta=p['imageMeta']
              p['frontImageMeta']={'source':meta['source'],'sourcePage':meta['sourcePage'],'creator':meta['creator'],'credit':meta['credit'],'license':meta['license'],'licenseUrl':meta['licenseUrl'],'sourceDimensions':str(img.width)+'x'+str(img.height),'outputDimensions':'900x1200','orientation':'portrait','aspectRatio':'3:4','transformation':'Beskåret og skalert fra originalfoto til stående 3:4 WebP; ingen innholdsgenerering.','verified':True,'verifiedAt':'2026-10-24'}
              Path(path).write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned app dependencies
        run: npm ci
      - name: Rebuild Place-open payloads and validate new portraits
        shell: bash
        run: |
          npm run place-open:build
          npm run place-open:check
          node scripts/audit-place-images.mjs --mode=changed
      - name: Guard unrelated generated modifications
        shell: bash
        run: |
          git status --short
          COUNT="$(git diff --name-only | grep -c . || true)"
          if [ "$COUNT" -gt 15 ]; then
            echo "Refusing to push $COUNT changed tracked files"
            exit 1
          fi
      - name: Commit portrait assets, regenerated runtime and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add bilder/places/oslo-six-portraits-20261024/*.webp
          git rm .github/workflows/oslo-six-portrait-assets-once.yml
          git diff --cached --stat
          git diff --cached --quiet || git commit -m 'Add five real licensed WebP portrait photographs and synchronized Place-open payloads'
          git push origin HEAD:research/oslo-six-culture-institutions-v1-20261023
