name: One-time Oslo popup batch 11 protocol fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/oslo-popup-batch-11-protocol-fix-trigger.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Batch 11 branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-popup-v4-batch-11-by-ten
          fetch-depth: 0

      - name: Fix permanent audit protocol updates
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const toolPath = 'tools/audit-oslo-place-description-scope.mjs';
          let source = fs.readFileSync(toolPath, 'utf8');
          source = source.replace(
            /protocol = protocol\.replace\(\/## Oslo-status etter denne PR-en\[\\s\\S\]\*\?\(\?=## Ferdige steder\)\/u, `\$\{statusBlock\}\\n`\);/u,
            "protocol = protocol.replace(/## Oslo-status etter (?:denne PR-en|full scope-audit)[\\s\\S]*?(?=## Ferdige steder)/u, `${statusBlock}\\n`);"
          );
          source = source.replace(
            'Det gjenstår **${additional.length} aktive Oslo-steder** utenfor den tidligere 90-steders delkøen.',
            'Det gjenstår **${additional.length} aktive Oslo-steder** uten ferdig desc/popupDesc-revisjon.'
          );
          if (!source.includes('etter (?:denne PR-en|full scope-audit)')) throw new Error('Status regex was not updated');
          if (!source.includes('uten ferdig desc/popupDesc-revisjon')) throw new Error('Remaining wording was not updated');
          fs.writeFileSync(toolPath, source);
          NODE

          node tools/audit-oslo-place-description-scope.mjs --write

          node <<'NODE'
          const fs = require('fs');
          const protocol = fs.readFileSync('reports/place-description-revision-protocol.md', 'utf8');
          if (!protocol.includes('- Totalt aktive Oslo-steder: **512 steder**')) throw new Error('Missing total');
          if (!protocol.includes('- Ferdige etter alle mergede revisjonsbatcher: **100 steder**')) throw new Error('Missing completed total');
          if (!protocol.includes('- Gjenstår: **412 steder**')) throw new Error('Missing remaining total');
          if (!protocol.includes('Det gjenstår **412 aktive Oslo-steder** uten ferdig desc/popupDesc-revisjon.')) throw new Error('Remaining queue wording not fixed');
          const audit = JSON.parse(fs.readFileSync('reports/oslo-place-description-scope-audit-2026-07-26.json', 'utf8'));
          if (audit.protocol.ids !== 100 || audit.comparison.additionalActiveOsloIds !== 412) throw new Error('Audit totals changed unexpectedly');
          NODE

          git diff --check
          git add \
            tools/audit-oslo-place-description-scope.mjs \
            reports/oslo-place-description-scope-audit-2026-07-26.json \
            reports/oslo-place-description-scope-audit-2026-07-26.md \
            reports/place-description-revision-protocol.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Oslo scope protocol regeneration"
          git push origin HEAD:agent/oslo-popup-v4-batch-11-by-ten
