name: Oslo bolk 05 - integrate main and rebuild derived indexes once
on:
  push:
    branches:
      - research/oslo-sentrum-bolk05-tekst-20261101
    paths:
      - .github/workflows/oslo-bolk05-integrate-main-once.yml
permissions:
  contents: write
concurrency:
  group: oslo-bolk05-integrate-main
  cancel-in-progress: false
jobs:
  merge-main:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Integrate main; permit conflicts only in three generated indexes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge --no-ff --no-commit origin/main; then
            echo "Main merged without conflicts"
          else
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -gt 0
            for conflict in "${conflicts[@]}"; do
              case "$conflict" in
                data/epoker/epoke-place-index.json|data/knowledge/knowledge_units.generated.json|data/places/place_image_backlog_summary.json)
                  git checkout --ours -- "$conflict"
                  git add -- "$conflict"
                  ;;
                *)
                  echo "::error::Unsafe merge conflict outside generated indexes: $conflict"
                  exit 1
                  ;;
              esac
            done
            test -z "$(git diff --name-only --diff-filter=U)"
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebuild canonical merged epoke index
        run: npm run epoker:places:build
      - name: Rebuild merged Knowledge IDs and subject registries
        run: npm run knowledge:canonical:write
      - name: Rebuild image summary from canonical merged places, not old branch counts
        run: |
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/oslo-bolk05-merged-image-audit.json 2>/tmp/oslo-bolk05-image-missing.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='data/places/place_image_backlog_summary.json';
          const saved=JSON.parse(fs.readFileSync(file,'utf8'));
          const audit=JSON.parse(fs.readFileSync('/tmp/oslo-bolk05-merged-image-audit.json','utf8'));
          saved.generatedAt='2026-11-01';
          saved.generatedFromCommit='merged_main_and_oslo_bolk05_20261101';
          saved.totalPlaces=audit.totalPlaces;
          saved.summary={
            validLocal:audit.summary.local,
            validRemote:audit.summary.remote,
            optionalMissing:audit.summary.optional,
            missing:audit.summary.missing,
            invalidLocalPath:audit.summary.invalid,
            remaining:audit.summary.missing+audit.summary.invalid
          };
          saved.byCategory=Object.fromEntries(Object.entries(audit.byCategory).map(([key,v])=>[
            key,{total:v.total,valid:v.local+v.remote,optional:v.optional,missing:v.missing,invalid:v.invalid}
          ]));
          saved.note='Regenerert fra samlet main og Oslo-bolk 05. Alle øvrige bilderegler og steder er bevart.';
          fs.writeFileSync(file,JSON.stringify(saved,null,2)+'\n');
          NODE
      - name: Validate derived indexes and scoped six-place delivery
        run: |
          npm run epoker:places:check
          npm run knowledge:canonical:check
          node scripts/audit-place-images.mjs --mode=all --verify-summary=data/places/place_image_backlog_summary.json 2>/tmp/oslo-bolk05-image-audit-verify.txt
          node scripts/build-oslo-bolk05-quizzes.mjs --check
          node scripts/audit-oslo-bolk05-quiz-candidates.mjs --json
      - name: Commit derived files and merge, but never main itself
        env:
          BRANCH_NAME: research/oslo-sentrum-bolk05-tekst-20261101
        run: |
          set -euo pipefail
          git add -- data/epoker/epoke-place-index.json data/places/place_image_backlog_summary.json
          git add -- data/knowledge reports/knowledge-contract-audit.json reports/knowledge-id-backfill.json
          git add -- data/quiz
          git rm -- .github/workflows/oslo-bolk05-integrate-main-once.yml
          git diff --cached --check
          echo "Changed unstaged files after regeneration:"
          git status --short
          git commit -m "Integrate current main with Oslo bolk 05 and regenerate shared indexes"
          git fetch origin "$BRANCH_NAME"
          if [ "$(git rev-parse "origin/$BRANCH_NAME")" != "$(git rev-parse HEAD^1)" ]; then
            echo "::error::PR branch advanced since checkout; refusing non-fast-forward push"
            exit 1
          fi
          git push origin "HEAD:$BRANCH_NAME"
