name: TEMP Diagnose Helse public health no checkout

on:
  pull_request:
    paths:
      - '.github/workflows/TEMP-diagnose-helse-public-health-no-checkout.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/helse-public-health-fulltext-content'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch source workflow without checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/TEMP-fagverk-helse-public-health-fulltext-writeback.yml?ref=${GITHUB_HEAD_REF}" \
            -o /tmp/source-workflow.yml
          test -s /tmp/source-workflow.yml

      - name: Diagnose all embedded payloads
        id: diagnose
        shell: bash
        continue-on-error: true
        run: |
          set -u
          python3 - <<'PY'
          import base64
          import gzip
          import pathlib
          import re
          import subprocess

          workflow = pathlib.Path('/tmp/source-workflow.yml').read_text(encoding='utf-8')
          targets = [
              ('MATERIALIZER_GZ_B64', '/tmp/materializer.mjs', True),
              ('AUDIT_GZ_B64', '/tmp/fulltext-audit.mjs', True),
              ('TEST_GZ_B64', '/tmp/fulltext-test.mjs', True),
              ('CUM_AUDIT_GZ_B64', '/tmp/cumulative-audit.mjs', True),
              ('CUM_TEST_GZ_B64', '/tmp/cumulative-test.mjs', True),
              ('SOURCE_WF_GZ_B64', '/tmp/source-workflow-decoded.yml', False),
              ('CLINICAL_WF_GZ_B64', '/tmp/clinical-workflow.yml', False),
          ]
          report=[]
          failed=False
          for key, output, check_node in targets:
              report.append(f'=== {key} ===')
              m=re.search(rf'^\s+{re.escape(key)}:\s+(\S+)\s*$', workflow, re.MULTILINE)
              if not m:
                  report.append('EXTRACT_FAIL'); failed=True; continue
              enc=m.group(1)
              pad=(-len(enc))%4
              report.append(f'base64_chars={len(enc)} padding_added={pad}')
              try:
                  raw=base64.b64decode(enc + '='*pad, validate=True)
                  report.append(f'BASE64_OK bytes={len(raw)}')
              except Exception as exc:
                  report.append(f'BASE64_FAIL {type(exc).__name__}: {exc}'); failed=True; continue
              try:
                  payload=gzip.decompress(raw)
                  pathlib.Path(output).write_bytes(payload)
                  report.append(f'GZIP_OK bytes={len(payload)}')
              except Exception as exc:
                  report.append(f'GZIP_FAIL {type(exc).__name__}: {exc}'); failed=True; continue
              if check_node:
                  p=subprocess.run(['node','--check',output],text=True,capture_output=True)
                  if p.returncode==0:
                      report.append('NODE_CHECK_OK')
                  else:
                      failed=True
                      report.append(f'NODE_CHECK_FAIL exit={p.returncode}')
                      detail=(p.stderr or p.stdout or '').strip()
                      report.append(detail or '(no node --check output)')
                      lines=pathlib.Path(output).read_text(encoding='utf-8',errors='replace').splitlines()
                      lm=re.search(r':(\d+)', detail)
                      if lm:
                          n=int(lm.group(1)); lo=max(1,n-4); hi=min(len(lines),n+4)
                          report.append(f'CONTEXT_LINES_{lo}_{hi}:')
                          report.extend(f'{i}: {lines[i-1]}' for i in range(lo,hi+1))
              else:
                  text=pathlib.Path(output).read_text(encoding='utf-8',errors='replace')
                  report.append(f'YAML_NONEMPTY={bool(text.strip())}')
                  if not text.strip(): failed=True
          pathlib.Path('/tmp/diagnostics-v3.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')
          print('\n'.join(report))
          raise SystemExit(1 if failed else 0)
          PY

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helse-public-health-payload-diagnostics-v3
          path: /tmp/diagnostics-v3.txt
          if-no-files-found: error

      - name: Fail when diagnostics failed
        if: steps.diagnose.outcome == 'failure'
        run: exit 1
