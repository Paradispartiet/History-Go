name: Scenekunst completion materialization one-shot

on:
  push:
    branches:
      - agent/scenekunst-completion
    paths:
      - 'scripts/materialize-fagverk-scenekunst-completion.mjs'
      - '.github/workflows/scenekunst-completion-materialize-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scenekunst-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize and validate Scenekunst completion
        run: node scripts/materialize-fagverk-scenekunst-completion.mjs
      - name: Commit deterministic completion outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fag/scenekunst data/fagverk/scenekunst data/fagverk/fagverk_registry.json data/fagverk/fagverk_release.json data/fagverk/subject_status.json reports/fagverk scripts/audit-fagverk-scenekunst-phase3.mjs scripts/audit-fagverk-scenekunst-university-readiness.mjs tests/fagverk-scenekunst-phase3.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Materialize Scenekunst holistic completion'
          git push origin HEAD:agent/scenekunst-completion
