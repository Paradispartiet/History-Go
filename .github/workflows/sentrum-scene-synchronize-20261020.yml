name: Sentrum Scene canonical derived synchronization

on:
  pull_request:
    paths:
      - '.github/workflows/sentrum-scene-synchronize-20261020.yml'

permissions:
  contents: read

concurrency:
  group: sentrum-scene-synchronize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synchronize:
    name: Sync corrected venue Place payload, epoch index and Fagverk manifest
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'content/sentrum-scene-history-fix-20261020'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate derived outputs
        run: |
          set -euo pipefail
          npm run place-open:build
          npm run epoker:places:build
          node scripts/build-fagverk-release-manifest.mjs
      - name: Commit derived outputs and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/runtime/place-open/sentrum_scene.json \
            data/epoker/epoke-place-index.json \
            data/fagverk/fagverk_release.json
          git rm -- .github/workflows/sentrum-scene-synchronize-20261020.yml
          if ! git diff --cached --quiet; then
            git commit -m "build(music): synchronize Sentrum Scene derived data against current main"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
