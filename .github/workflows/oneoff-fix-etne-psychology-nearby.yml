name: One-off fix Etne psychology nearby IDs

on:
  push:
    branches:
      - agent/fill-etne-psychology-service-rounds-batch1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fill-etne-psychology-service-rounds-batch1
          fetch-depth: 0
          persist-credentials: true
      - name: Replace stale nearby alias
        run: |
          sed -i 's/etne_senter/etnesjoen_tettstad/g' .github/agent-payloads/psych-places.json
          sed -i 's/etne_senter/etnesjoen_tettstad/g' tests/etne-psychology-service-batch1-round-content.test.js
          rm -f reports/etne-psychology-service-rounds-batch1-test-failure.log
          rm -f .github/workflows/oneoff-fix-etne-psychology-nearby.yml
          git config user.name "History Go data agent"
          git config user.email "history-go-agent@users.noreply.github.com"
          git add -A
          git commit -m "Fix canonical nearby ID in Etne psychology batch"
          git push origin HEAD:agent/fill-etne-psychology-service-rounds-batch1
