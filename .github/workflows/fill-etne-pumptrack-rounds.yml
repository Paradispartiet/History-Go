name: Fill Etne pumptrack rounds

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - agent/fill-etne-pumptrack-rounds-runner

permissions:
  contents: write

jobs:
  fill-and-validate:
    if: github.head_ref == 'agent/fill-etne-pumptrack-rounds-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check whether generation is needed
        id: generator
        shell: bash
        run: |
          if [ -f tools/one_off/fill_etne_pumptrack_rounds.py ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate pumptrack round data
        if: steps.generator.outputs.run == 'true'
        run: python tools/one_off/fill_etne_pumptrack_rounds.py

      - name: Reuse canonical Dzintrs Vitols person
        if: steps.generator.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          duplicate = Path('data/people/sport/vestland/etne/dzintrs_vitols.json')
          duplicate.unlink(missing_ok=True)

          manifest_path = Path('data/people/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          duplicate_entry = 'people/sport/vestland/etne/dzintrs_vitols.json'
          manifest['files'] = [entry for entry in manifest['files'] if entry != duplicate_entry]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Test Etne pumptrack rounds
        if: steps.generator.outputs.run == 'true'
        run: node tests/etne-pumptrack-batch1-round-content.test.js

      - name: Test inherited Etne sport rounds
        if: steps.generator.outputs.run == 'true'
        run: |
          node tests/etnesjoen-bmx-skate-batch1-round-content.test.js
          node tests/etnesjoen-tennis-batch1-round-content.test.js
          node tests/etnesjoen-idrettsanlegg-batch1-round-content.test.js

      - name: Audit PlaceCard round runtime
        if: steps.generator.outputs.run == 'true'
        run: node tests/place-card-rounds-runtime-audit.test.js

      - name: Audit PlaceCard leksikon content
        if: steps.generator.outputs.run == 'true'
        run: node tests/place-card-leksikon-content-audit.test.js

      - name: Audit Etne people manifest
        if: steps.generator.outputs.run == 'true'
        run: node tests/etne-people-manifest-integration.test.js

      - name: Install dependencies
        if: steps.generator.outputs.run == 'true'
        run: npm ci

      - name: Run TypeScript guards
        if: steps.generator.outputs.run == 'true'
        run: |
          npx tsc -p tsconfig.tools.json
          npx tsc -p tsconfig.web.json

      - name: Check diff
        if: steps.generator.outputs.run == 'true'
        run: git diff --check

      - name: Commit generated data
        if: steps.generator.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm tools/one_off/fill_etne_pumptrack_rounds.py
          rm -f .github/pumptrack-validation-trigger.txt
          git config user.name "History GO data bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fill Etne pumptrack place rounds"
          git push origin HEAD:agent/fill-etne-pumptrack-rounds-batch1
