name: TEMP Materialize Fagarbeider Readiness Prerequisites

on:
  push:
    branches:
      - agent/civication-naeringsliv-fagarbeider-prerequisites
    paths:
      - scripts/TEMP_materialize_fagarbeider_readiness_prerequisites.mjs
      - tests/civication-fagarbeider-readiness-prerequisites.test.js
      - reports/CIVICATION_NAERINGSLIV_FAGARBEIDER_PREREQUISITES_SOURCE_FIRST.md
      - .github/workflows/TEMP-civication-naeringsliv-fagarbeider-readiness-prerequisites.yml
  workflow_dispatch:

concurrency:
  group: civication-naeringsliv-fagarbeider-prerequisites-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-naeringsliv-fagarbeider-prerequisites
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize Fagarbeider People prerequisites
        run: node scripts/TEMP_materialize_fagarbeider_readiness_prerequisites.mjs
      - name: Rebuild compiled scene registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Regenerate Scenario People outputs
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - name: Regenerate career gameplay audit
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Regenerate rollout readiness
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Focused — Fagarbeider prerequisite contract
        run: |
          node tests/civication-fagarbeider-readiness-prerequisites.test.js > /tmp/fagarbeider-focus.log 2>&1 || { cat /tmp/fagarbeider-focus.log; exit 1; }
      - name: Focused — first-week praksisfortellinger
        run: |
          node tests/civication-fagarbeider-first-week-praksisfortellinger.test.js > /tmp/fagarbeider-focus.log 2>&1 || { cat /tmp/fagarbeider-focus.log; exit 1; }
      - name: Focused — second-week praksisfortellinger
        run: |
          node tests/civication-fagarbeider-second-week-praksisfortellinger.test.js > /tmp/fagarbeider-focus.log 2>&1 || { cat /tmp/fagarbeider-focus.log; exit 1; }
      - name: Focused — two-week flow
        run: |
          node tests/civication-fagarbeider-two-week-flow.test.js > /tmp/fagarbeider-focus.log 2>&1 || { cat /tmp/fagarbeider-focus.log; exit 1; }
      - name: Focused — praksisfortellinger registry audit
        run: |
          node tests/civication-praksisfortellinger-registry-audit.test.js > /tmp/fagarbeider-focus.log 2>&1 || { cat /tmp/fagarbeider-focus.log; exit 1; }
      - name: Focused — career gameplay matrix
        run: |
          node tests/civication-career-gameplay-matrix.test.js > /tmp/fagarbeider-focus.log 2>&1 || { cat /tmp/fagarbeider-focus.log; exit 1; }
      - name: Focused — Role World rollout readiness
        run: |
          node tests/civication-role-world-rollout-readiness.test.js > /tmp/fagarbeider-focus.log 2>&1 || { cat /tmp/fagarbeider-focus.log; exit 1; }
      - name: Focused — compiled scene registry parity
        run: |
          node tests/civication-compiled-scene-registry-parity.test.js > /tmp/fagarbeider-focus.log 2>&1 || { cat /tmp/fagarbeider-focus.log; exit 1; }
      - name: Focused — Scenario People generated output check
        run: |
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check > /tmp/fagarbeider-focus.log 2>&1 || { cat /tmp/fagarbeider-focus.log; exit 1; }
      - name: Focused — Scenario People invariants
        run: |
          node --test tests/civication-scenario-people.test.mjs > /tmp/fagarbeider-focus.log 2>&1 || { cat /tmp/fagarbeider-focus.log; exit 1; }
      - name: Upload focused failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fagarbeider-focused-failure
          path: /tmp/fagarbeider-focus.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Run full Civication suite
        run: |
          set +e
          npm run test:civication > /tmp/civication.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "=== relevant Civication failure output ==="
            grep -E -B 8 -A 24 'AssertionError|ERR_ASSERTION|not ok|FAIL|Error:|error:' /tmp/civication.log | tail -n 140 || tail -n 140 /tmp/civication.log
            exit "$status"
          fi
          echo "Full Civication suite passed."
          tail -n 30 /tmp/civication.log
      - name: Remove temporary prerequisite surface
        run: rm scripts/TEMP_materialize_fagarbeider_readiness_prerequisites.mjs .github/workflows/TEMP-civication-naeringsliv-fagarbeider-readiness-prerequisites.yml
      - name: Commit exact verified prerequisite result
        run: |
          git diff --check
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No permanent changes produced"; exit 1; }
          git commit -m "Complete Fagarbeider readiness prerequisites"
          git push origin HEAD:agent/civication-naeringsliv-fagarbeider-prerequisites
