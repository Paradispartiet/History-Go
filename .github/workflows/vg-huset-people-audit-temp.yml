name: VG-huset People QA (temporary)

on:
  push:
    branches:
      - agent/vg-huset-source-preflight-20261009
    paths:
      - '.github/workflows/vg-huset-people-audit-temp.yml'
permissions:
  contents: write
jobs:
  people:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Canonical People profile and regression suite
        run: |
          npm run audit:people-profile-canonical
          npm run test:people-profile-canonical
      - name: People reference validity
        run: npm run audit:people-of-places
      - name: Global image backlog (diagnostic, does not approve VG portraits)
        continue-on-error: true
        run: npm run people:images:audit
      - name: Rebuild and sync only VG-related People runtime projections
        shell: bash
        run: |
          set -euo pipefail
          npm run place-open:build
          npm run place-open:check
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const changed = execFileSync('git',['status','--porcelain','--untracked-files=all'],{encoding:'utf8'})
            .trimEnd().split(/\r?\n/u).filter(Boolean).map(line=>line.slice(3));
          const allowed = x => x === 'data/runtime/people-all.json'
            || x === 'reports/people-of-places-status.json'
            || x === 'reports/people-of-places-status.md'
            || x === 'data/runtime/place-open/vg_huset.json'
            || /^data\/runtime\/people-all\/part-\d{3}\.json$/u.test(x);
          console.log('Actual generated changes:',changed);
          if(changed.some(x=>!allowed(x))) throw new Error('Non VG-related generated file changed');
          if(!changed.length) throw new Error('Expected stale People shard but found none');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/people-all data/runtime/people-all.json data/runtime/place-open/vg_huset.json reports/people-of-places-status.json reports/people-of-places-status.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(vg-huset): sync People runtime shards after verified profile correction"
            git push origin HEAD:agent/vg-huset-source-preflight-20261009
          fi
      - name: Find licensed Gard and Hanne portrait candidates, without approving them
        run: |
          npm run people:images:candidates -- --ids=gard_steiro,hanne_skartveit --limit=2 --max-candidates-per-person=3
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const a = JSON.parse(fs.readFileSync('data/people/people_image_candidates.json', 'utf8'));
          const allowed = new Set(['gard_steiro','hanne_skartveit']);
          if (!Array.isArray(a) || a.some(x => !allowed.has(x.personId) || x.approved !== false)) {
            throw new Error('Unexpected candidate IDs or auto-approval');
          }
          console.log('Unapproved source candidates:', a.length);
          console.log(JSON.stringify(a.map(x=>({
            personId:x.personId,candidateId:x.candidateId,commonsFileName:x.commonsFileName,
            sourcePage:x.sourcePage,creator:x.creator,license:x.license,licenseUrl:x.licenseUrl,
            identity:x.identity,quality:x.quality?.analysisStatus
          })),null,2));
          NODE
      - name: Keep candidate evidence as workflow artifact only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vg-people-portrait-candidates
          path: data/people/people_image_candidates.json
          retention-days: 14
