name: Medier embroidered badge QA
on:
  push:
    branches: [design/media-light-blue-embroidered-20261030]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run targeted badge tests
        run: node --test tests/badge-artwork-coverage.test.mjs
      - name: Decode actual Media WebP and export review image
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          path=Path('bilder/merker/media-brodert-lysbla.webp')
          source=path.read_bytes()
          print('GitHub image SHA256', hashlib.sha256(source).hexdigest())
          assert hashlib.sha256(source).hexdigest()=='0c441da73cff11e85411807c6c8f8c2a33f302d78c2aae9544a0ad75f4cb47bf'
          im=Image.open(path).convert('RGBA')
          assert im.size == (224,224), im.size
          assert im.getpixel((0,0))[3] == 0, 'image corners must remain transparent'
          assert im.getpixel((112,112))[3] == 255
          out=Path('out');out.mkdir(exist_ok=True)
          im.resize((672,672),Image.Resampling.NEAREST).save(out/'medier-lysbla-repo-preview.png')
          print('WebP decoding verified:', im.size, im.mode)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: medier-embroidered-preview
          path: out/medier-lysbla-repo-preview.png
          retention-days: 2
