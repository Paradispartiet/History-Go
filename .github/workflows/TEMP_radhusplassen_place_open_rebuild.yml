name: TEMP Rådhusplassen derived-context repair

on:
  push:
    branches:
      - agent/radhusplassen-materialize-20260908
    paths:
      - '.github/workflows/TEMP_radhusplassen_place_open_rebuild.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Rebuild stale Rådhusplassen derivatives
        run: |
          set -euxo pipefail
          npm run place-open:build -- --id radhusplassen
          npm run quiz:context -- --category by --target radhusplassen --output data/quiz/production_context/by/radhusplassen.json
          node scripts/build-fagverk-release-manifest.mjs
          changed="$(git diff --name-only | grep -v '^\.github/workflows/TEMP_radhusplassen_place_open_rebuild.yml$' | sort)"
          expected="$(printf '%s\n' 'data/fagverk/fagverk_release.json' 'data/quiz/production_context/by/radhusplassen.json' 'data/runtime/lesespor-all.json' 'data/runtime/place-open/radhusplassen.json' | sort)"
          printf 'Generated changes:\n%s\n' "$changed"
          test "$changed" = "$expected"
      - name: Validate focused contracts
        run: |
          set -euxo pipefail
          node --test tests/radhusplassen-completion.test.mjs
          npm run place-open:check -- --id radhusplassen
          npm run audit:quiz-production-context
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run lesespor:test
          git diff --check
      - name: Commit clean permanent repair
        run: |
          set -euxo pipefail
          git config user.name 'history-go-materializer'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/TEMP_radhusplassen_place_open_rebuild.yml
          git add -A
          test ! -e .github/workflows/TEMP_radhusplassen_place_open_rebuild.yml
          git diff --cached --name-only | grep -qx 'data/fagverk/fagverk_release.json'
          git diff --cached --name-only | grep -qx 'data/quiz/production_context/by/radhusplassen.json'
          git diff --cached --name-only | grep -qx 'data/runtime/lesespor-all.json'
          git diff --cached --name-only | grep -qx 'data/runtime/place-open/radhusplassen.json'
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m 'Refresh Rådhusplassen derived production context'
          git push origin HEAD:refs/heads/agent/radhusplassen-materialize-20260908
