name: Integrate Oslo kultureiendommer batch 4

on:
  push:
    branches:
      - agent/oslo-kultureiendommer-batch-4

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'Generate Oslo kultureiendommer batch 4 data' && github.event.head_commit.message != 'Save Oslo kultureiendommer batch 4 coordinates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-kultureiendommer-batch-4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Register active sources
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifestPath = 'data/places/manifest.json';
          const sources = [
            'places/historie/oslo/places_historie_oslo_kultureiendommer_batch_04.json',
            'places/naeringsliv/oslo/places_naeringsliv_oslo_kultureiendommer_batch_04.json'
          ];
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.files ||= [];
          for (const source of sources) {
            if (!manifest.files.includes(source)) manifest.files.push(source);
          }
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - name: Build and validate place data
        run: |
          mkdir -p reports/oslo-kultureiendommer-batch-4/validation
          npm run places:index:build | tee reports/oslo-kultureiendommer-batch-4/validation/places-index-build.txt
          npm run places:index:check | tee reports/oslo-kultureiendommer-batch-4/validation/places-index-check.txt
          npm run places:coords:intake | tee reports/oslo-kultureiendommer-batch-4/validation/coordinate-intake.txt
          npm run places:emner:check | tee reports/oslo-kultureiendommer-batch-4/validation/emne-check.txt
          npm run health:places | tee reports/oslo-kultureiendommer-batch-4/validation/health-places.txt
      - name: Commit generated data
        if: always()
        run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add data/places/manifest.json data/places/places_index.json reports/oslo-kultureiendommer-batch-4/validation
          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Generate Oslo kultureiendommer batch 4 data"
            git push
          fi
