name: Technology clean branch publisher

on:
  pull_request:
    paths:
      - '.github/workflows/teknologi-clean-merge-analysis.yml'

permissions:
  contents: write

jobs:
  publish-clean-branch:
    if: github.event.pull_request.head.ref == 'agent/teknologi-eget-fag-og-badge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/teknologi-eget-fag-og-badge
          fetch-depth: 0
          show-progress: false

      - name: Build clean Technology branch on current main
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          MAIN=$(git rev-parse origin/main)
          git switch -C agent/teknologi-v2_2-clean "$MAIN"
          git merge --no-commit --no-ff "$SOURCE"
          git checkout origin/main -- .github/workflows
          git add -A
          git commit -m 'Merge Technology content for clean squash'
          git reset --soft "$MAIN"
          git commit -m 'Etabler Teknologi som vitenskapelig fag og ontologi V2.2'
          node tools/validate-teknologi-quality-v2_1.mjs
          node tools/validate-teknologi-ontology-v2_2.mjs
          git add reports/teknologi-scientific-quality-validation.json reports/teknologi-ontology-depth-validation.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push --force origin HEAD:agent/teknologi-v2_2-clean
          {
            echo "source=$SOURCE"
            echo "main=$MAIN"
            echo "clean_head=$(git rev-parse HEAD)"
            echo "commit_count=$(git rev-list --count "$MAIN"..HEAD)"
            git diff --stat "$MAIN"..HEAD
          } | tee /tmp/teknologi-clean-branch.log

      - name: Upload clean branch result
        uses: actions/upload-artifact@v4
        with:
          name: teknologi-clean-branch-result
          path: /tmp/teknologi-clean-branch.log
          if-no-files-found: error
