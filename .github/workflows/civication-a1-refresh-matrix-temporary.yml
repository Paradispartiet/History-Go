name: Civication A1 generated matrix refresh (temporary)

on:
  push:
    branches:
      - civication-playability-audit-2026-10-12
    paths:
      - .github/workflows/civication-a1-refresh-matrix-temporary.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate career matrix and report from canonical sources
        run: |
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-career-gameplay.mjs --check
          git diff --check
          git diff --stat -- data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md
      - name: Commit only generated artifacts on this PR branch
        run: |
          git add -- data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(civication): refresh generated career matrix'
            git push origin HEAD:civication-playability-audit-2026-10-12
          fi
