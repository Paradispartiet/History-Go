name: Tøyenbadet People regression (temporary)
on:
  push:
    branches:
      - fix/toyenbadet-people-staging-portrait-audit-20261103
    paths:
      - .github/workflows/toyenbadet-people-regression-temp.yml
permissions:
  contents: read
jobs:
  people:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify approved Anne and four blocked People profiles
        run: node --test tests/toyenbadet-people-staging-source-gate.test.mjs tests/toyenbadet-anne-lindboe-people.test.mjs
