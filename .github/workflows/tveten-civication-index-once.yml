name: One-off Tveten Civication People-index synchronization
on:
  push:
    branches:
      - content/tveten-gard-vferdig-media-20261110
    paths:
      - .github/workflows/tveten-civication-index-once.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/tveten-gard-vferdig-media-20261110
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate derived Civication index from canonical People
        run: npm run civication:history-people:build
      - name: Verify generated index parity
        run: npm run civication:history-people:check
      - name: Commit generated index and remove this temporary workflow
        run: |
          git add data/Civication/historyPeople_index.json
          git rm -f .github/workflows/tveten-civication-index-once.yml
          git diff --cached --stat
          git -c user.name="HistoryGo CI" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Sync Civication history People index; remove one-off workflow"
          git push origin HEAD:content/tveten-gard-vferdig-media-20261110
