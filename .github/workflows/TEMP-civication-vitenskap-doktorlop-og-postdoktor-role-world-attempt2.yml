name: TEMP Civication Vitenskap Doktorlop og postdoktor Role World attempt 2

on:
  push:
    branches:
      - agent/civication-vitenskap-doktorlop-og-postdoktor-role-world-20260908
    paths:
      - scripts/TEMP_patch_vitenskap_doktorlop_og_postdoktor_role_world_grad.mjs
      - .github/workflows/TEMP-civication-vitenskap-doktorlop-og-postdoktor-role-world-attempt2.yml

permissions:
  contents: write

concurrency:
  group: temp-civication-vitenskap-doktorlop-og-postdoktor-role-world-attempt2
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-vitenskap-doktorlop-og-postdoktor-role-world-20260908
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Require fresh main ancestry before materialization
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "Branch is not based on current main" >&2; exit 1; }

      - name: Syntax
        run: |
          node --check scripts/TEMP_materialize_vitenskap_doktorlop_og_postdoktor_role_world.mjs
          node --check scripts/TEMP_patch_vitenskap_doktorlop_og_postdoktor_role_world_grad.mjs

      - name: Materialize Vitenskap Doktorlop og postdoktor Role World
        run: node scripts/TEMP_materialize_vitenskap_doktorlop_og_postdoktor_role_world.mjs

      - name: Add explicit degree boundary
        run: node scripts/TEMP_patch_vitenskap_doktorlop_og_postdoktor_role_world_grad.mjs

      - name: Bind qualification proof to canonical Badge source
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const p='tests/civication-vitenskap-doktorlop-og-postdoktor-role-world-rollout.test.js';
          let test=fs.readFileSync(p,'utf8');
          const old="const policies=Object.fromEntries(career.audit.salary.rows.map(r=>[r.title,r]));for(const title of TITLES){assert.equal(policies[title].offer_policy,'qualification_required');assert.deepEqual(policies[title].qualification_ids,[QUAL]);}";
          const replacement="const policies=Object.fromEntries(career.audit.salary.rows.map(r=>[r.title,r]));const badge=read('data/badges/vitenskap.json');const badgeByLabel=Object.fromEntries(badge.tiers.map(t=>[t.label,t]));for(const title of TITLES){assert.equal(policies[title].offer_policy,'qualification_required');assert.equal(badgeByLabel[title].career_offer.policy,'qualification_required');assert.deepEqual(badgeByLabel[title].career_offer.qualification_ids,[QUAL]);assert.equal(badgeByLabel[title].career_offer.role_scope,ROLE);}";
          if(!test.includes(old)) throw new Error('Expected qualification assertion block not found');
          test=test.replace(old,replacement);
          fs.writeFileSync(p,test);
          NODE

      - name: Generate canonical rollout surfaces
        run: |
          set -euo pipefail
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write

      - name: Verify Vitenskap Doktorlop og postdoktor Role World
        run: node tests/civication-vitenskap-doktorlop-og-postdoktor-role-world-rollout.test.js

      - name: Verify global Role World contract
        run: node tests/civication-role-world-contract.test.js

      - name: Verify Career Gameplay Matrix
        run: node tests/civication-career-gameplay-matrix.test.js

      - name: Verify Role World readiness
        run: node tests/civication-role-world-rollout-readiness.test.js

      - name: Verify Scene Registry
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Verify Scenario People index
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check

      - name: Verify Scenario People audit
        run: node --test tests/civication-scenario-people.test.mjs

      - name: Verify full Civication suite
        run: node tests/run-civication-tests.mjs

      - name: Verify job learning profiles
        run: npm run audit:job-learning-profiles

      - name: Verify job knowledge requirements
        run: npm run audit:job-knowledge-requirements

      - name: Require fresh main ancestry before scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "main moved during verification" >&2; exit 1; }

      - name: Verify exact permanent Role World scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          if [ "${#changed[@]}" -ne 9 ]; then
            echo "Expected exactly 9 permanent Role World paths, found ${#changed[@]}" >&2
            exit 1
          fi
          for f in "${changed[@]}"; do
            case "$f" in
              data/Civication/careerGameplayMatrix.json|data/Civication/roleWorldAuthoringChecklist.json|data/Civication/roleWorldRolloutReadiness.json|data/Civication/roleWorldThemeBank.json|data/Civication/roleWorlds/index.json|data/Civication/roleWorlds/vitenskap/vitenskap_doktorlop_og_postdoktor.json|reports/CIVICATION_VITENSKAP_DOKTORLOP_OG_POSTDOKTOR_ROLE_WORLD_ROLLOUT_SOURCE_FIRST.md|reports/civication-role-world-rollout-readiness.md|tests/civication-vitenskap-doktorlop-og-postdoktor-role-world-rollout.test.js)
                ;;
              *) echo "Unexpected generated path: $f" >&2; exit 1;;
            esac
          done
          for required in \
            data/Civication/careerGameplayMatrix.json \
            data/Civication/roleWorldAuthoringChecklist.json \
            data/Civication/roleWorldRolloutReadiness.json \
            data/Civication/roleWorldThemeBank.json \
            data/Civication/roleWorlds/index.json \
            data/Civication/roleWorlds/vitenskap/vitenskap_doktorlop_og_postdoktor.json \
            reports/CIVICATION_VITENSKAP_DOKTORLOP_OG_POSTDOKTOR_ROLE_WORLD_ROLLOUT_SOURCE_FIRST.md \
            reports/civication-role-world-rollout-readiness.md \
            tests/civication-vitenskap-doktorlop-og-postdoktor-role-world-rollout.test.js; do
            printf '%s\n' "${changed[@]}" | grep -Fx "$required" >/dev/null || { echo "Missing required permanent path: $required" >&2; exit 1; }
          done
          git diff --check

      - name: Require fresh main ancestry before permanent commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "main moved before permanent commit" >&2; exit 1; }

      - name: Commit permanent verified Role World
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/TEMP_materialize_vitenskap_doktorlop_og_postdoktor_role_world.mjs
          rm -f .github/workflows/TEMP-civication-vitenskap-doktorlop-og-postdoktor-role-world.yml
          rm -f scripts/TEMP_patch_vitenskap_doktorlop_og_postdoktor_role_world_grad.mjs
          rm -f .github/workflows/TEMP-civication-vitenskap-doktorlop-og-postdoktor-role-world-attempt2.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.' >&2
            exit 1
          fi
          git diff --cached --check
          git status --short
          git commit -m "Complete Vitenskap Doktorlop og postdoktor Role World"
          git push origin HEAD:agent/civication-vitenskap-doktorlop-og-postdoktor-role-world-20260908
