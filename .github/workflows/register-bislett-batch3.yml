name: Register Bislett batch 3

on:
  push:
    branches:
      - data/people-bislett-vif-historic-batch3-20260714
    paths:
      - .github/workflows/register-bislett-batch3.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/people-bislett-vif-historic-batch3-20260714
      - name: Register files and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          # Register after the final batch 2 anchor.
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/people/manifest.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          files = payload['files']
          additions = [
              'people/sport/oslo/bislett_stadion/erik_foss.json',
              'people/sport/oslo/bislett_stadion/yngve_andersen.json',
              'people/sport/oslo/bislett_stadion/stein_gran.json',
              'people/sport/oslo/bislett_stadion/anton_ploderer.json',
              'people/sport/oslo/bislett_stadion/helmuth_steffens.json',
          ]
          files[:] = [item for item in files if item not in additions]
          anchor = 'people/sport/oslo/bislett_stadion/eivind_arnevag.json'
          if anchor not in files:
              raise SystemExit('Bislett batch 2 anchor not found')
          insert_at = files.index(anchor) + 1
          files[insert_at:insert_at] = additions
          path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          git rm .github/workflows/register-bislett-batch3.yml
          git add data/people/manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Register Bislett historic batch 3'
          git push origin HEAD:data/people-bislett-vif-historic-batch3-20260714
