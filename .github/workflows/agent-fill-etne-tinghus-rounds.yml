name: Fill Etne Tinghus rounds

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-validate-commit:
    if: github.head_ref == 'agent/fill-etne-tinghus-rounds-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Etne Tinghus content
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, zlib
          exec(zlib.decompress(base64.b64decode('''''')).decode('utf-8'))
          PY
      - name: Dedicated and inherited Etne tests
        shell: bash
        run: |
          node tests/etne-tinghus-batch1-round-content.test.js
          find tests -maxdepth 1 -type f -name '*batch1-round-content.test.js' \
            | grep -E '/(etne|etnesjoen|skanevik|steinsvollen|engebanen|skakkeringen|osnes|sjokanten|fikse)[^/]*batch1-round-content\.test\.js$' \
            | grep -v 'etne-tinghus-batch1-round-content.test.js' \
            | sort \
            | xargs -r -n1 node
      - run: npm run leksikon:ids:check
      - name: People audit
        run: bash scripts/check-people.sh
      - run: npm run typecheck:tools
      - run: npm run typecheck:web
      - name: Story integrity without new Tinghus errors
        shell: bash
        run: |
          set +e
          npx tsx tools/check_stories_integrity.mts > /tmp/story-integrity.log 2>&1
          status=$?
          set -e
          cat /tmp/story-integrity.log
          if grep -E 'etne_tinghus|st_etne_tinghus|stories_etnesjoen_politikk_rounds_batch1' /tmp/story-integrity.log; then
            echo "New Etne Tinghus story-integrity error detected"
            exit 1
          fi
          echo "Story integrity exit status: $status; no Etne Tinghus-specific errors"
      - run: git diff --check
      - name: Remove temporary workflow
        run: rm .github/workflows/agent-fill-etne-tinghus-rounds.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name "History Go data agent"
          git config user.email "history-go-agent@users.noreply.github.com"
          git add -A
          git commit -m "Fill Etne Tinghus place rounds batch 1"
          git push origin HEAD:${{ github.head_ref }}
