name: History V5.7 quality freeze

on:
  pull_request:
    paths:
      - 'data/fag/historie/**'
      - 'reports/historie-v5/**'
      - 'tools/audit-historie-v5-5-quality-depth.mjs'
      - '.github/workflows/history-v5-5-quality-freeze.yml'
  push:
    branches:
      - main
    paths:
      - 'data/fag/historie/**'
      - 'tools/audit-historie-v5-5-quality-depth.mjs'
      - '.github/workflows/history-v5-5-quality-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-freeze:
    name: History V5.7 depth and freeze
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate permanent V5.7 quality and freeze
        run: node tools/audit-historie-v5-5-quality-depth.mjs

      - name: Upload quality audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historie-v5-7-quality-depth
          path: |
            reports/historie-v5/historie-v5-7-quality-depth.json
            reports/historie-v5/historie-v5-7-quality-depth.md
          if-no-files-found: warn
