name: Build final Scenekunst batch 5

on:
  pull_request:
    paths:
      - '.github/scenekunst-batch-5-final-trigger.txt'

permissions:
  contents: write

concurrency:
  group: build-final-scenekunst-batch-5
  cancel-in-progress: false

jobs:
  build-final-branch:
    if: github.event.pull_request.head.ref == 'agent/scenekunst-batch-5-final-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare final batch branch
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BRANCH='agent/scenekunst-venues-05-replayed'
          FINAL_BRANCH='agent/scenekunst-venues-05-final'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main "${SOURCE_BRANCH}"
          BASE_SHA="$(git rev-parse origin/main)"
          echo "${BASE_SHA}" > /tmp/scenekunst-batch5-base-sha
          echo "${FINAL_BRANCH}" > /tmp/scenekunst-batch5-final-branch

          git checkout -B "${FINAL_BRANCH}" "${BASE_SHA}"
          git checkout "origin/${SOURCE_BRANCH}" -- \
            data/places/scenekunst/akershus/baerum_kulturhus.json \
            data/places/scenekunst/buskerud/drammens_teater.json \
            data/places/scenekunst/oslo/dramatikkens_hus.json \
            data/places/scenekunst/oslo/teater_manu.json \
            data/places/scenekunst/oslo/vega_scene.json \
            reports/scenekunst-new-venues-batch-5-2026-07-23.json \
            reports/scenekunst-new-venues-batch-5-2026-07-23.md

          node <<'NODE'
          const fs = require('fs');
          const file = 'data/places/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const additions = [
            'places/scenekunst/akershus/baerum_kulturhus.json',
            'places/scenekunst/buskerud/drammens_teater.json',
            'places/scenekunst/oslo/dramatikkens_hus.json',
            'places/scenekunst/oslo/teater_manu.json',
            'places/scenekunst/oslo/vega_scene.json'
          ];
          for (const entry of additions) {
            if (!manifest.files.includes(entry)) manifest.files.push(entry);
          }
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          NODE

          npm run places:index:build

      - name: Validate Places and People
        run: |
          bash scripts/check-places.sh
          bash scripts/check-people.sh

      - name: Validate category and quiz governance
        run: |
          npm run audit:categories
          npm run audit:quiz-templates
          npm run test:quiz-content-audit

      - name: Validate Nature and Lesespor
        run: |
          npm run build:tools
          node dist/tools/validate_nature_maps.mjs
          node dist/tools/validate_lesespor.mjs

      - name: Validate Knowledge
        run: |
          npm run typecheck:web
          npm run build:scripts
          npm run knowledge:canonical:check
          npm run knowledge:legacy:check
          npm run audit:knowledge
          npm run test:knowledge-v2
          node --test tests/knowledge-canonical-storage-contract.test.js

      - name: Commit and push final branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git fetch origin main
          EXPECTED_BASE="$(cat /tmp/scenekunst-batch5-base-sha)"
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "${CURRENT_MAIN}" != "${EXPECTED_BASE}" ]; then
            echo "main moved from ${EXPECTED_BASE} to ${CURRENT_MAIN}; refusing to publish a stale final branch"
            exit 2
          fi

          git add \
            data/places/manifest.json \
            data/places/places_index.json \
            data/places/scenekunst/akershus/baerum_kulturhus.json \
            data/places/scenekunst/buskerud/drammens_teater.json \
            data/places/scenekunst/oslo/dramatikkens_hus.json \
            data/places/scenekunst/oslo/teater_manu.json \
            data/places/scenekunst/oslo/vega_scene.json \
            reports/scenekunst-new-venues-batch-5-2026-07-23.json \
            reports/scenekunst-new-venues-batch-5-2026-07-23.md

          git commit -m 'Add fifth Scenekunst venue batch on current main'
          FINAL_BRANCH="$(cat /tmp/scenekunst-batch5-final-branch)"
          git push --force-with-lease origin HEAD:"${FINAL_BRANCH}"
