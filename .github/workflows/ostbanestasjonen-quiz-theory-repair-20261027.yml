name: Østbanestasjonen progression and theory canonical repair
on:
  push:
    branches:
      - fix/ostbanestasjonen-quiz-progression-20261027
    paths:
      - .github/workflows/ostbanestasjonen-quiz-theory-repair-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ostbanestasjonen-quiz-progression-20261027
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate canonical production context and Knowledge
        run: |
          npm run quiz:context -- --category by --target ostbanestasjonen --output data/quiz/production_context/by/ostbanestasjonen.json
          npm run knowledge:canonical:write
      - name: Sync QuizCard answer and Knowledge links to canonical questions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const quizPath='data/quiz/by/ostbanestasjonen_sets.json';
          const cardPath='data/quizcards/by/ostbanestasjonen_quizcard_v1.json';
          const quiz=JSON.parse(fs.readFileSync(quizPath,'utf8'));
          const card=JSON.parse(fs.readFileSync(cardPath,'utf8'));
          const all=quiz.sets.flatMap(set=>set.questions);
          assert.equal(quiz.sets.length,3);
          assert.deepEqual(quiz.sets.map(s=>s.questions.length),[7,7,7]);
          assert.equal(new Set(all.map(q=>q.id)).size,21);
          const counts={fact:0,context:0,concept_theory:0};
          all.forEach((q,i)=>{
            const family=q.topic_hook_id||q.method_id||q.question_type==='concept'?'concept_theory':q.question_type==='context'||q.question_type==='analysis'?'context':'fact';
            counts[family]++;
            assert.equal(q.options[q.answerIndex],q.answer);
            assert(q.primary_knowledge_unit_id&&q.knowledge_unit_ids?.length);
            if(i<14)assert(!q.method_id&&!q.topic_hook_id&&!q.thinker_id&&!q.theory_ref);
          });
          assert.deepEqual(counts,{fact:11,context:6,concept_theory:4});
          assert.equal(card.cards[0].questions.length,10);
          card.cards[0].questions=card.cards[0].questions.map((q,i)=>{
            const canonical=all.find(a=>a.id===q.id);
            assert(canonical,'Missing QuizCard link '+q.id);
            return {...canonical,number:i+1,sourceQuestionId:canonical.id,sourceQuizId:canonical.quiz_id,sourceQuizFile:quizPath};
          });
          card.cards[0].answerKey=card.cards[0].questions.map((q,i)=>({number:i+1,answer:q.answer,answerIndex:q.answerIndex}));
          fs.writeFileSync(cardPath,JSON.stringify(card,null,2)+'\n');
          console.log('PASS: 21 canonical IDs, 11/6/4 content families, 10 QuizCard identities, 21 Knowledge links');
          NODE
      - name: Save deterministic generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz/by/ostbanestasjonen_sets.json data/quiz/production_briefs/by/ostbanestasjonen.json data/quiz/production_context/by/ostbanestasjonen.json data/quizcards/by/ostbanestasjonen_quizcard_v1.json data/knowledge/knowledge_units.generated.json reports/knowledge-id-backfill.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Østbanestasjonen source-bound Knowledge and QuizCard"
            git push
          fi
      - name: Validate global full quiz progression and theory without exceptions
        run: |
          npm run quiz:context -- --category by --target ostbanestasjonen --output data/quiz/production_context/by/ostbanestasjonen.json --check
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run knowledge:canonical:check
      - name: Play through all actual quiz questions on desktop and touch mobile
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node scripts/verify-place-quiz-browser.mjs ostbanestasjonen
      - uses: actions/upload-artifact@v4
        with:
          name: ostbanestasjonen-progression-repair-quiz
          path: artifacts/place-quiz/ostbanestasjonen/
          retention-days: 14
      - name: Remove temporary workflow after real validation
        run: |
          git rm .github/workflows/ostbanestasjonen-quiz-theory-repair-20261027.yml
          git commit -m "Remove one-use Ostbanestasjonen repair workflow"
          git push
