name: Kvadraturen Krigsskolen one-time canonical production
on:
  push:
    branches:
      - research/oslo-sentrum-kvadraturen-v1-six-20261023
    paths:
      - '.github/workflows/kvadraturen-krigsskolen-canonical-production-temp.yml'
permissions:
  contents: write
concurrency:
  group: kvadraturen-krigsskolen-canonical-oneoff
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-kvadraturen-v1-six-20261023
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install repo tooling
        run: |
          npm ci --no-audit --no-fund
          npm run build:scripts
      - name: Generate exact QuizProduction context, then canonical Knowledge units
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import { buildQuizProductionContext } from './scripts/quiz-production-lib.mjs';
          const id='den_gamle_krigsskolen', root='data/fag/fag_manifest.json';
          const manifest=JSON.parse(await fs.readFile(root,'utf8'));
          assert.equal(manifest.historie.quizProduction.targets[id],undefined,'must not replace an existing producer');
          manifest.historie.quizProduction.targets[id]={
            source_brief:'../quiz/production_briefs/historie/'+id+'.json',
            context_artifact:'../quiz/production_context/historie/'+id+'.json',
            quiz_file:'../quiz/historie/'+id+'_sets.json'
          };
          await fs.writeFile(root,JSON.stringify(manifest,null,2)+'\n');
          const context=await buildQuizProductionContext({categoryId:'historie',targetId:id});
          assert.equal(context.profile,'narrow_3x7');
          assert.equal(context.claim_bank.length,21);
          assert.deepEqual(context.set_plan.map(s=>s.planned_questions),[7,7,7]);
          assert.deepEqual(context.question_balance.counts,{fact:12,context:5,concept_theory:4});
          assert.equal(context.source_review_status,'reviewed');
          await fs.mkdir('data/quiz/production_context/historie',{recursive:true});
          await fs.writeFile('data/quiz/production_context/historie/'+id+'.json',JSON.stringify(context,null,2)+'\n');
          const qm='data/quiz/manifest.json', data=JSON.parse(await fs.readFile(qm,'utf8'));
          assert.equal(data.sets.some(s=>s.targetId===id),false);
          data.sets.push({targetId:id,file:'data/quiz/historie/'+id+'_sets.json'});
          data.sets.sort((a,b)=>a.targetId.localeCompare(b.targetId,'en'));
          await fs.writeFile(qm,JSON.stringify(data,null,2)+'\n');
          console.log('Krigsskolen QuizProduction source context: 21 claims, 12 fact, 5 context, 4 concept');
          NODE
          node dist/scripts/knowledge-canonical-data.mjs --write
          node dist/scripts/knowledge-canonical-data.mjs --check
      - name: Link QuizCard to official Knowledge and register same fullquiz source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          const id='den_gamle_krigsskolen', qp='data/quiz/historie/'+id+'_sets.json',cp='data/quizcards/historie/'+id+'_quizkort_v1.json';
          const full=JSON.parse(await fs.readFile(qp,'utf8'));
          const card=JSON.parse(await fs.readFile(cp,'utf8'));
          const qs=full.sets.flatMap(set=>set.questions);
          assert.equal(qs.length,21);
          assert.ok(qs.every(q=>q.knowledge_link_status==='linked'&&q.primary_knowledge_unit_id?.startsWith('ku_historie_')&&q.knowledge_unit_ids?.includes(q.primary_knowledge_unit_id)));
          assert.ok(qs.every(q=>q.answer===q.options[q.answerIndex]));
          assert.equal(qs.filter(q=>/^(når|hvilket år|i hvilket år)/i.test(q.question)||/^\d{4}$/.test(q.answer)).length,0,'No date trivia');
          const byId=new Map(qs.map(q=>[q.id,q]));
          assert.equal(card.cards.length,1);assert.equal(card.cards[0].questions.length,10);
          for(const [i,item] of card.cards[0].questions.entries()){
            const q=byId.get(item.sourceQuestionId);
            assert.ok(q);assert.equal(q.question,item.question);assert.equal(q.answer,item.answer);
            assert.deepEqual(q.options,item.options);
            assert.deepEqual(q.source,item.source_refs);
            assert.equal(q.claim_id,item.claim_id);
            for(const f of ['primary_knowledge_unit_id','knowledge_unit_ids','concept_ids','term_ids','knowledge_contract_version','knowledge_link_status']){
              item[f]=q[f];
            }
            assert.equal(card.cards[0].answerKey[i].answer,q.answer);
          }
          full.production_status='manifested_knowledge_linked_pending_browser_qa';
          card.production_status='knowledge_linked_fullquiz_browser_pending';
          card.sourceBasis='Ten sourced fullquiz questions with canonical Knowledge unit parity; browser playthrough and visual QA pending.';
          await fs.writeFile(qp,JSON.stringify(full,null,2)+'\n');
          await fs.writeFile(cp,JSON.stringify(card,null,2)+'\n');
          const cm='data/quizcards/historie/manifest.json',m=JSON.parse(await fs.readFile(cm,'utf8'));
          assert.ok(!m.collections.includes(id+'_quizkort_v1.json'));
          m.collections.push(id+'_quizkort_v1.json');
          await fs.writeFile(cm,JSON.stringify(m,null,2)+'\n');
          console.log('Krigsskolen canonical Knowledge linked: 21/21 fullquiz, 10/10 QuizCard');
          NODE
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Check that only own canonical and generated files changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/diff-names
          echo 'Changed paths:'
          cat /tmp/diff-names
          grep -Ev '^(data/fag/fag_manifest.json|data/fagverk/fagverk_release.json|data/quiz/manifest.json|data/quiz/historie/den_gamle_krigsskolen_sets.json|data/quizcards/historie/den_gamle_krigsskolen_quizkort_v1.json|data/quizcards/historie/manifest.json|data/knowledge/knowledge_units.generated.json|reports/knowledge-id-backfill.json)$' /tmp/diff-names > /tmp/other-paths || true
          test ! -s /tmp/other-paths || { echo 'Unrelated change refused'; cat /tmp/other-paths; exit 1; }
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          const id='den_gamle_krigsskolen';
          const q=JSON.parse(await fs.readFile('data/quiz/historie/'+id+'_sets.json','utf8'));
          const c=JSON.parse(await fs.readFile('data/quizcards/historie/'+id+'_quizkort_v1.json','utf8'));
          const m=JSON.parse(await fs.readFile('data/quiz/manifest.json','utf8'));
          assert.equal(m.sets.filter(x=>x.targetId===id).length,1);
          assert.equal(q.sets.flatMap(x=>x.questions).length,21);
          assert.equal(c.cards[0].questions.filter(x=>x.knowledge_link_status==='linked').length,10);
          const protectedNames=['stattholdergarden','hotel_du_nord','cafe_engebret','treschowgarden'];
          assert.ok(protectedNames.every(other=>!m.sets.some(x=>x.targetId===other)));
          console.log('Protected other four places from premature publish');
          NODE
          git add data/fag/fag_manifest.json data/fagverk/fagverk_release.json data/quiz/manifest.json data/quiz/production_context/historie/den_gamle_krigsskolen.json data/quiz/historie/den_gamle_krigsskolen_sets.json data/quizcards/historie/den_gamle_krigsskolen_quizkort_v1.json data/quizcards/historie/manifest.json data/knowledge/knowledge_units.generated.json reports/knowledge-id-backfill.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Produce Krigsskolen canonical 21-question fullquiz, 10 QuizCard and linked Knowledge with release'
          git push origin HEAD:research/oslo-sentrum-kvadraturen-v1-six-20261023
