name: Fill Skånevik hermetikkfabrikk rounds

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: fill-skanevik-hermetikk-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-validate-commit:
    if: github.head_ref == 'agent/fill-skanevik-hermetikkfabrikk-rounds-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Skånevik hermetikkfabrikk round content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path, value):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def upsert_by_id(rows, row):
              output = []
              replaced = False
              for current in rows:
                  if current.get('id') == row['id']:
                      output.append(row)
                      replaced = True
                  else:
                      output.append(current)
              if not replaced:
                  output.append(row)
              return output

          payload_dir = Path('.github/agent-payloads')

          place_path = 'data/places/naeringsliv/vestland/etne/skanevik_hermetikkfabrikk.json'
          places = load(place_path)
          if len(places) != 1 or places[0].get('id') != 'skanevik_hermetikkfabrikk':
              raise SystemExit('Unexpected Skånevik hermetikkfabrikk place file')
          place_payload = load(payload_dir / 'hermetikk-place.json')
          place_payload['nature_profile'].update(load(payload_dir / 'hermetikk-nature-correction.json'))
          places[0].update(place_payload)
          save(place_path, places)

          relations_path = 'data/relations.json'
          relation = load(payload_dir / 'hermetikk-relation.json')
          save(relations_path, upsert_by_id(load(relations_path), relation))

          story_path = 'data/stories/stories_etnesjoen_naeringsliv_rounds_batch1.json'
          story = load(payload_dir / 'hermetikk-story.json')
          stories = [row for row in load(story_path) if row.get('id') != story['id']]
          stories.append(story)
          save(story_path, stories)

          article_path = 'data/leksikon/places/vestland/etne/naeringsliv/leksikon_etnesjoen_naeringsliv_rounds_batch1.json'
          article = load(payload_dir / 'hermetikk-article.json')
          articles = [row for row in load(article_path) if row.get('place_id') != article['place_id']]
          articles.append(article)
          save(article_path, articles)

          test_path = Path('tests/skanevik-hermetikkfabrikk-batch1-round-content.test.js')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace(
              "assert(!/arten finnes i dag ved markøren|full artsinventering/i.test(combined), 'Brisling skal ikke gjøres til en udokumentert nåtidsobservasjon');",
              "assert(!/arten finnes i dag ved markøren|artsinventeringen omfatter alle arter/i.test(combined), 'Brisling skal ikke gjøres til en udokumentert nåtidsobservasjon');"
          )
          test_path.write_text(test_text, encoding='utf-8')
          PY
      - name: Hermetikkfabrikk dedicated test
        run: node tests/skanevik-hermetikkfabrikk-batch1-round-content.test.js
      - name: Preserve locked Christian Bjelland people batch
        run: node tests/etne-people-of-places-batch10.test.js
      - name: Inherited Etne round tests
        shell: bash
        run: |
          find tests -maxdepth 1 -type f -name '*batch1-round-content.test.js' \
            | grep -E '/(etne|etnesjoen|skanevik|steinsvollen|engebanen|skakkeringen|osnes|sjokanten|fikse|house-of-blues|musikkpaviljongen|pippifestivalen|kulturhall|hardeland|litledalen|motormuseum|smv|hermetikk)[^/]*batch1-round-content\.test\.js$' \
            | grep -v 'skanevik-hermetikkfabrikk-batch1-round-content.test.js' \
            | sort \
            | xargs -r -n1 node
      - run: npm run places:index:check
      - run: npm run places:emner:check
      - run: npm run leksikon:ids:check
      - name: People audit
        run: bash scripts/check-people.sh
      - name: Restore generated people audit reports
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- \
            reports/people-invalid-place-refs.json \
            reports/people-invalid-place-refs.md \
            reports/people-of-places-status.json \
            reports/people-of-places-status.md \
            reports/people-place-coverage.json \
            reports/people-place-coverage.md
      - run: npm run typecheck:tools
      - run: npm run typecheck:web
      - name: Story integrity without new hermetikk errors
        shell: bash
        run: |
          set +e
          npx tsx tools/check_stories_integrity.mts > /tmp/story-integrity.log 2>&1
          status=$?
          set -e
          cat /tmp/story-integrity.log
          if grep -E 'skanevik_hermetikkfabrikk|st_skanevik_hermetikk_fra_bjelland_til_siste_boks' /tmp/story-integrity.log; then
            echo "New Skånevik hermetikkfabrikk story-integrity error detected"
            exit 1
          fi
          echo "Story integrity exit status: $status; no hermetikk-specific errors"
      - run: git diff --check
      - name: Remove temporary payloads and workflow
        run: |
          rm -rf .github/agent-payloads
          rm .github/workflows/agent-fill-skanevik-hermetikkfabrikk-rounds.yml
      - name: Commit generated content
        shell: bash
        run: |
          git config user.name "History Go data agent"
          git config user.email "history-go-agent@users.noreply.github.com"
          git add -A
          git commit -m "Fill Skånevik hermetikkfabrikk place rounds batch 1"
          git push origin HEAD:${{ github.head_ref }}
