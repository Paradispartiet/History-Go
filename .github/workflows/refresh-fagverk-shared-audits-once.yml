name: Refresh shared Fagverk audits once

on:
  push:
    branches:
      - agent/complete-philosophy-fagverk-materialize
    paths:
      - .github/workflows/refresh-fagverk-shared-audits-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-philosophy-fagverk-materialize
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate shared deterministic Fagverk audits
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs --write-report
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/build-fagverk-release-manifest.mjs
      - name: Verify shared audit and release contracts
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
          node --test tests/fagverk-filosofi-complete.test.mjs
          node --test tests/fagverk-filosofi-editorial-style.test.mjs
      - name: Commit deterministic shared reports and remove one-shot workflow
        run: |
          rm .github/workflows/refresh-fagverk-shared-audits-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/fagverk/subject-baseline.json reports/fagverk/general-engine-audit.json data/fagverk/fagverk_release.json .github/workflows/refresh-fagverk-shared-audits-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh shared Fagverk audits for Philosophy completion'
          git push origin HEAD:agent/complete-philosophy-fagverk-materialize
