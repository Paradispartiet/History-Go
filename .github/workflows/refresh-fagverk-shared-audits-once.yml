name: Refresh shared Fagverk audits once

on:
  push:
    branches:
      - agent/complete-philosophy-fagverk-materialize
    paths:
      - .github/workflows/refresh-fagverk-shared-audits-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-philosophy-fagverk-materialize
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Advance shared Philosophy completion contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('tests/fagverk-subject-inventory.test.mjs')
          s=p.read_text()
          old="""  for (const id of ['scenekunst', 'vitenskap', 'filosofi']) {
    const subject = s.subjects.find((x) => x.id === id);
    assert.equal(subject.editorialStatus, 'structure_ready');
    assert.equal(subject.nextGate, 'chapter_production');
  }
"""
          new="""  for (const id of ['scenekunst', 'vitenskap']) {
    const subject = s.subjects.find((x) => x.id === id);
    assert.equal(subject.editorialStatus, 'structure_ready');
    assert.equal(subject.nextGate, 'chapter_production');
  }

  const filosofi = s.subjects.find((x) => x.id === 'filosofi');
  assert.equal(filosofi.editorialStatus, 'complete');
  assert.equal(filosofi.nextGate, 'maintenance_source_refresh_and_place_case_expansion');
"""
          if old not in s:
              raise SystemExit('Expected stale Philosophy inventory contract not found')
          p.write_text(s.replace(old,new))

          p=Path('tests/fagverk-general-engine.test.mjs')
          s=p.read_text()
          old="  assert.equal(filosofi.chapterCount, 0);"
          new="  assert.equal(filosofi.chapterCount, 13);"
          if old not in s:
              raise SystemExit('Expected stale Philosophy general-engine chapter contract not found')
          p.write_text(s.replace(old,new))

          p=Path('tests/fagverk-filosofi-phase3.test.mjs')
          s=p.read_text()
          replacements={
            "  assert.equal(report.subject.editorialStatus, 'structure_ready');":"  assert.equal(report.subject.editorialStatus, 'complete');",
            "  assert.equal(report.subject.nextGate, 'chapter_production');":"  assert.equal(report.subject.nextGate, 'maintenance_source_refresh_and_place_case_expansion');",
            "    registeredChapterCount: 0":"    registeredChapterCount: 13"
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected stale Philosophy phase3 contract not found: {old}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Regenerate shared deterministic Fagverk audits
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs --write-report
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/audit-fagverk-filosofi-phase3.mjs --write-report
          node scripts/build-fagverk-release-manifest.mjs
      - name: Verify shared audit and release contracts
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-filosofi-phase3.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
          node --test tests/fagverk-filosofi-phase3.test.mjs
          node --test tests/fagverk-filosofi-complete.test.mjs
          node --test tests/fagverk-filosofi-editorial-style.test.mjs
          git diff --check
      - name: Commit deterministic shared reports and remove one-shot workflow
        run: |
          rm .github/workflows/refresh-fagverk-shared-audits-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/fagverk/subject-baseline.json reports/fagverk/general-engine-audit.json reports/fagverk/filosofi-phase3-audit.json data/fagverk/fagverk_release.json tests/fagverk-subject-inventory.test.mjs tests/fagverk-general-engine.test.mjs tests/fagverk-filosofi-phase3.test.mjs .github/workflows/refresh-fagverk-shared-audits-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh shared Fagverk contracts for Philosophy completion'
          git push origin HEAD:agent/complete-philosophy-fagverk-materialize
