name: TEMP materialize Civication life-position readiness

on:
  push:
    branches:
      - agent/civication-life-position-readiness-20260911
    paths:
      - scripts/audit-civication-life-position-role-world-readiness.mjs
      - data/Civication/nonCareerRoleTaxonomy.json
      - data/Civication/lifePositionCatalog.json
      - data/Civication/badgeCareerContracts/**
      - data/badges/**
      - data/Civication/livelihoodOpportunityTemplates.json
      - data/Civication/narratives/**
      - data/Civication/lifestory/life/**
      - data/Civication/privatePhaseMailFamilies/**
      - data/Civication/social/**
      - .github/workflows/temp-civication-life-position-readiness.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-life-position-readiness-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize readiness outputs
        run: node scripts/audit-civication-life-position-role-world-readiness.mjs --write
      - name: Commit generated outputs
        shell: bash
        run: |
          git add data/Civication/lifePositionRoleWorldReadiness.json reports/civication-life-position-role-world-readiness.md
          if git diff --cached --quiet; then
            echo "No generated drift."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[skip ci] Materialize life-position readiness"
          git push origin HEAD:agent/civication-life-position-readiness-20260911
