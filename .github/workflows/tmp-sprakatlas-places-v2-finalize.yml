name: tmp Språkatlas Places v2 final validation

on:
  push:
    branches:
      - agent/sprakatlas-places-v2-documented-coverage

permissions:
  contents: write

jobs:
  validate-and-finalize:
    if: ${{ !contains(github.event.head_commit.message, '[sprakatlas-v2-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sprakatlas-places-v2-documented-coverage
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/sprakatlas-places-v2-final
          npm ci 2>&1 | tee reports/sprakatlas-places-v2-final/npm-ci.log

      - name: Regenerate runtime index
        shell: bash
        run: |
          set -o pipefail
          npm run places:index:build 2>&1 | tee reports/sprakatlas-places-v2-final/places-index-build.log

      - name: Run final focused gates
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DIR=reports/sprakatlas-places-v2-final

          node --test tests/place-language-dialect-scope.test.mjs 2>&1 | tee "$REPORT_DIR/language-scope.log"
          node scripts/validate-place-description-production-v4_2.mjs 2>&1 | tee "$REPORT_DIR/production-v42.log"
          npm run audit:places-split-manifest-sync 2>&1 | tee "$REPORT_DIR/manifest-sync.log"
          npm run places:index:check 2>&1 | tee "$REPORT_DIR/places-index-check.log"
          npm run places:coords:quality 2>&1 | tee "$REPORT_DIR/coordinate-quality.log"
          npm run places:coords:intake 2>&1 | tee "$REPORT_DIR/coordinate-intake.log"
          npm run places:coords:evidence:audit 2>&1 | tee "$REPORT_DIR/coordinate-evidence.log"
          npm run places:emner:check 2>&1 | tee "$REPORT_DIR/place-emner.log"

          node <<'NODE' 2>&1 | tee "$REPORT_DIR/anchor-contract.log"
          const fs = require('fs');
          const targets = {
            stavanger: 'osm-node:30421326',
            bodo: 'osm-node:1773877380',
            tromso: 'osm-node:3554636995'
          };
          const paths = {
            stavanger: 'data/places/by/rogaland/stavanger/stavanger.json',
            bodo: 'data/places/by/nordland/bodo/bodo.json',
            tromso: 'data/places/by/troms/tromso/tromso.json'
          };
          for (const [id, expected] of Object.entries(targets)) {
            const place = JSON.parse(fs.readFileSync(paths[id], 'utf8'));
            if (place.placeScope !== 'area') throw new Error(`${id}: expected placeScope area`);
            if (place.coordSourceId !== expected || place.sourceObjectId !== expected) {
              throw new Error(`${id}: expected city-node anchor ${expected}, got ${place.coordSourceId}/${place.sourceObjectId}`);
            }
          }
          console.log('PASS: Stavanger, Bodø and Tromsø use explicit OSM city nodes as area anchors.');
          NODE

      - name: Remove temporary evidence and persist regenerated index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -r -f reports/sprakatlas-places-v2
          rm -rf reports/sprakatlas-places-v2-final
          git rm -f .github/workflows/tmp-sprakatlas-places-v2-finalize.yml
          git add data/places/places_index.json

          git status --short
          git commit -m "Finalize Språkatlas documented coverage [sprakatlas-v2-finalized]"
          git push origin HEAD:agent/sprakatlas-places-v2-documented-coverage
