name: Lesespor checks

on:
  pull_request:
    paths:
      - 'data/lesespor/**'
      - 'data/badges/**'
      - 'data/places/places_index.json'
      - 'tools/validate_lesespor.mts'
      - 'tsconfig.tools*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lesespor-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-lesespor:
    name: Validate Lesespor data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build tools
        run: npm run build:tools

      - name: Validate active Lesespor manifest
        shell: bash
        run: |
          set -o pipefail
          node dist/tools/validate_lesespor.mjs 2>&1 | tee /tmp/lesespor-validation.log

      - name: Upload Lesespor validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesespor-validation-log
          path: /tmp/lesespor-validation.log
          if-no-files-found: warn
