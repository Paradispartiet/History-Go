name: Sync Gamle Aker quiz production context
on:
  push:
    branches:
      - history-go/gamle-aker-quizcard-v1-20261021
    paths:
      - .github/workflows/gamle-aker-quiz-context-sync.yml
permissions:
  contents: write
concurrency:
  group: gamle-aker-context-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rebuild only Gamle Aker context and check determinism
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH=history-go/gamle-aker-quizcard-v1-20261021
          for attempt in 1 2 3 4 5; do
            echo "Context sync attempt $attempt against latest remote branch"
            git fetch origin "$BRANCH"
            git reset --hard FETCH_HEAD
            node scripts/build-quiz-production-context.mjs --category historie --target gamle_aker_kirke --output data/quiz/production_context/historie/gamle_aker_kirke.json
            node scripts/build-quiz-production-context.mjs --category historie --target gamle_aker_kirke --output data/quiz/production_context/historie/gamle_aker_kirke.json --check
            git add data/quiz/production_context/historie/gamle_aker_kirke.json
            if git diff --cached --quiet; then echo 'Context already synchronized'; exit 0; fi
            git commit -m "build(history): sync Gamle Aker quiz context after portrait materialization"
            if git push origin "HEAD:$BRANCH"; then echo 'Context pushed'; exit 0; fi
          done
          echo 'Concurrent commits prevented safe sync after 5 attempts' >&2
          exit 1
