name: Register BY editorial v4.6

on:
  push:
    branches:
      - fix/by-editorial-v4-6-20260805
    paths:
      - "scripts/register-by-editorial-v4-6.mjs"
      - ".github/workflows/register-by-v46.yml"

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/by-editorial-v4-6-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Register manifest references
        run: node scripts/register-by-editorial-v4-6.mjs
      - name: Validate BY package
        run: node scripts/validate-by-editorial-integrity.mjs
      - name: Remove bootstrap files
        run: |
          rm scripts/register-by-editorial-v4-6.mjs
          rm .github/workflows/register-by-v46.yml
      - name: Commit registered manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Register BY editorial v4.6 contracts"
          git push origin HEAD:fix/by-editorial-v4-6-20260805
