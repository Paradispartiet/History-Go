name: PR6975 temporary reproducible build snapshot

on:
  push:
    branches:
      - feat/placecard-full-round-images-by-section-20261103
    paths:
      - ".github/workflows/pr6975-build-snapshot.yml"

permissions:
  contents: read

concurrency:
  group: pr6975-build-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:web
      - name: Export reproducible compiler outputs in numbered log lines
        shell: bash
        run: |
          for file in dist/web/map.js dist/web/place-unified-surface.js dist/web/place-unified-surface.js.map; do
            echo "HG_PR6975_ASSET_BEGIN $file"
            base64 -w 0 "$file" | fold -w 512
            echo "HG_PR6975_ASSET_END $file"
          done
