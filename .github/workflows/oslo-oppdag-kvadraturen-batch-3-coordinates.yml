name: Oslo Oppdag Kvadraturen batch 3 coordinates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-oppdag-kvadraturen-batch-3-coordinates.yml'

permissions:
  contents: write

jobs:
  coordinates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve building addresses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/oslo-oppdag-kvadraturen-batch-3/coordinates
          npm run places:coords:find:address -- --address "Jernbanetorget 2 Oslo" \
            | tee reports/oslo-oppdag-kvadraturen-batch-3/coordinates/amerikalinjen.json
          npm run places:coords:find:address -- --address "Karl Johans gate 1 Oslo" \
            | tee reports/oslo-oppdag-kvadraturen-batch-3/coordinates/dfds_bygget.json

      - name: Resolve named squares with Kartverket Stedsnavn
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-batch-3/coordinates'

          fetch_square() {
            local slug="$1"
            local name="$2"
            curl --max-time 30 --retry 1 --fail --silent --show-error --get \
              'https://api.kartverket.no/stedsnavn/v1/sted' \
              --data-urlencode 'knr=0301' \
              --data-urlencode "sok=${name}" \
              --data-urlencode 'treffPerSide=100' \
              --data-urlencode 'side=1' \
              -o "$outdir/${slug}_kartverket_stedsnavn.json"
          }

          fetch_square wessels_plass "Wessels plass"
          fetch_square egertorget "Egertorget"
          fetch_square stortorget "Stortorget"
          fetch_square grev_wedels_plass "Grev Wedels plass"

      - name: Persist coordinate evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/oslo-oppdag-kvadraturen-batch-3/coordinates
          git commit -m "Save Oppdag Kvadraturen batch 3 coordinate evidence"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
