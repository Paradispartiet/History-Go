name: Oslo Oppdag Kvadraturen batch 3 coordinates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-oppdag-kvadraturen-batch-3-coordinates.yml'

permissions:
  contents: write

jobs:
  coordinates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve building addresses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/oslo-oppdag-kvadraturen-batch-3/coordinates
          npm run places:coords:find:address -- --address "Jernbanetorget 2 Oslo" \
            | tee reports/oslo-oppdag-kvadraturen-batch-3/coordinates/amerikalinjen.json
          npm run places:coords:find:address -- --address "Karl Johans gate 1 Oslo" \
            | tee reports/oslo-oppdag-kvadraturen-batch-3/coordinates/dfds_bygget.json

      - name: Resolve exact named square geometries
        shell: bash
        run: |
          set -euo pipefail

          fetch_square() {
            local slug="$1"
            local name="$2"
            local outfile="reports/oslo-oppdag-kvadraturen-batch-3/coordinates/${slug}_osm.json"
            local query="[out:json][timeout:20];nwr[\"name\"=\"${name}\"](59.85,10.60,60.05,10.95);out center tags;"

            if ! curl --max-time 30 --retry 1 --fail --silent --show-error --get \
              'https://overpass-api.de/api/interpreter' \
              --data-urlencode "data=${query}" -o "$outfile"; then
              curl --max-time 40 --retry 1 --fail --silent --show-error --get \
                'https://overpass.kumi.systems/api/interpreter' \
                --data-urlencode "data=${query}" -o "$outfile"
            fi

            jq -e --arg name "$name" '.elements | map(select(.tags.name == $name)) | length > 0' "$outfile" >/dev/null
          }

          fetch_square wessels_plass "Wessels plass"
          fetch_square egertorget "Egertorget"
          fetch_square stortorget "Stortorget"
          fetch_square grev_wedels_plass "Grev Wedels plass"

      - name: Persist coordinate evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/oslo-oppdag-kvadraturen-batch-3/coordinates
          git commit -m "Save Oppdag Kvadraturen batch 3 coordinate evidence"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
