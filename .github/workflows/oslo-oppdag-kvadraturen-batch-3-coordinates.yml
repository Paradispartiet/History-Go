name: Oslo Oppdag Kvadraturen batch 3 coordinates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-oppdag-kvadraturen-batch-3-coordinates.yml'

permissions:
  contents: write

jobs:
  coordinates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve building addresses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/oslo-oppdag-kvadraturen-batch-3/coordinates
          npm run places:coords:find:address -- --address "Jernbanetorget 2 Oslo" \
            | tee reports/oslo-oppdag-kvadraturen-batch-3/coordinates/amerikalinjen.json
          npm run places:coords:find:address -- --address "Karl Johans gate 1 Oslo" \
            | tee reports/oslo-oppdag-kvadraturen-batch-3/coordinates/dfds_bygget.json

      - name: Resolve exact named OSM square objects
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-batch-3/coordinates'

          fetch_square() {
            local slug="$1"
            local name="$2"
            local outfile="$outdir/${slug}_osm.json"
            curl --max-time 30 --retry 1 --fail --silent --show-error \
              --user-agent 'History-Go-coordinate-audit/1.0' \
              --get 'https://nominatim.openstreetmap.org/search' \
              --data-urlencode "q=${name}, Oslo, Norway" \
              --data-urlencode 'format=jsonv2' \
              --data-urlencode 'addressdetails=1' \
              --data-urlencode 'namedetails=1' \
              --data-urlencode 'polygon_geojson=1' \
              --data-urlencode 'limit=10' \
              --data-urlencode 'countrycodes=no' \
              -o "$outfile"
            jq -e --arg name "$name" 'map(select((.namedetails.name // .display_name) | contains($name))) | length > 0' "$outfile" >/dev/null
          }

          fetch_square wessels_plass "Wessels plass"
          sleep 1
          fetch_square egertorget "Egertorget"
          sleep 1
          fetch_square stortorget "Stortorget"
          sleep 1
          fetch_square grev_wedels_plass "Grev Wedels plass"

      - name: Persist coordinate evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/oslo-oppdag-kvadraturen-batch-3/coordinates
          git commit -m "Save Oppdag Kvadraturen batch 3 coordinate evidence"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
