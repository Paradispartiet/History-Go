name: Oslo Oppdag Kvadraturen batch 3 coordinates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-oppdag-kvadraturen-batch-3-coordinates.yml'

permissions:
  contents: write

jobs:
  coordinates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Resolve Grev Wedels plass with OSM Nominatim
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-batch-3/coordinates'
          mkdir -p "$outdir"
          curl --max-time 30 --retry 2 --fail --silent --show-error \
            -H 'User-Agent: History-Go coordinate audit (github.com/Paradispartiet/History-Go)' \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'format=jsonv2' \
            --data-urlencode 'q=Grev Wedels plass, Oslo, Norge' \
            --data-urlencode 'countrycodes=no' \
            --data-urlencode 'limit=10' \
            --data-urlencode 'addressdetails=1' \
            --data-urlencode 'namedetails=1' \
            --data-urlencode 'polygon_geojson=1' \
            --data-urlencode 'viewbox=10.60,60.05,10.95,59.85' \
            --data-urlencode 'bounded=1' \
            -o "$outdir/grev_wedels_plass_nominatim.json"
          jq -e 'length > 0' "$outdir/grev_wedels_plass_nominatim.json" >/dev/null

      - name: Persist coordinate evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/oslo-oppdag-kvadraturen-batch-3/coordinates/grev_wedels_plass_nominatim.json
          git commit -m "Save Grev Wedels plass OSM coordinate evidence"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
