name: TEMP Fagverk shared gate monotonicity

on:
  push:
    branches:
      - agent/fagverk-shared-gate-monotonicity-20260819

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fagverk-shared-gate-monotonicity-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repair shared Fagverk regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/fagverk-general-engine.test.mjs')
          test_text = test_path.read_text()
          old_counts = """  assert.equal(scenekunst.emneCount, 8);\n  assert.equal(scenekunst.methodCount, 9);\n  assert.equal(scenekunst.mappingCount, 8);"""
          new_counts = """  assert.equal(scenekunst.emneCount, 20);\n  assert.equal(scenekunst.methodCount, 14);\n  assert.equal(scenekunst.mappingCount, 20);"""
          if old_counts not in test_text:
              raise SystemExit('Expected stale Scenekunst assertion block not found')
          test_path.write_text(test_text.replace(old_counts, new_counts, 1))

          audit_path = Path('scripts/audit-film-tv-holistic-completion-v1.mjs')
          audit_text = audit_path.read_text()
          replacements = {
              "  registry.updatedAt = '2026-08-17';": "  if (!registry.updatedAt || registry.updatedAt < '2026-08-17') registry.updatedAt = '2026-08-17';",
              "  status.updatedAt = '2026-08-17';": "  if (!status.updatedAt || status.updatedAt < '2026-08-17') status.updatedAt = '2026-08-17';",
          }
          for old, new in replacements.items():
              if old not in audit_text:
                  raise SystemExit(f'Expected stale monotonicity assignment not found: {old}')
              audit_text = audit_text.replace(old, new, 1)
          audit_path.write_text(audit_text)
          PY
      - name: Verify repaired shared gates
        run: |
          node scripts/audit-film-tv-holistic-completion-v1.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node --test tests/film-tv-holistic-completion-v1.test.mjs tests/fagverk-general-engine.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-documentation-contract.test.mjs
      - name: Commit repair and self-remove
        run: |
          rm .github/workflows/TEMP-fagverk-shared-gate-monotonicity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-film-tv-holistic-completion-v1.mjs tests/fagverk-general-engine.test.mjs .github/workflows/TEMP-fagverk-shared-gate-monotonicity.yml
          git diff --cached --check
          git commit -m "test(fagverk): preserve shared gate monotonicity"
          git push origin HEAD:agent/fagverk-shared-gate-monotonicity-20260819
