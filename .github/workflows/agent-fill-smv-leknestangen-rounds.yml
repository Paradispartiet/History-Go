name: Fill SMV Leknestangen rounds

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-validate-commit:
    if: github.head_ref == 'agent/fill-smv-leknestangen-rounds-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate SMV round content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path, value):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def upsert_by_id(rows, new_rows):
              replacements = {row['id']: row for row in new_rows}
              output = []
              seen = set()
              for row in rows:
                  row_id = row.get('id')
                  if row_id in replacements:
                      output.append(replacements[row_id])
                      seen.add(row_id)
                  else:
                      output.append(row)
              for row_id, row in replacements.items():
                  if row_id not in seen:
                      output.append(row)
              return output

          payload_dir = Path('.github/agent-payloads')

          place_path = 'data/places/naeringsliv/vestland/etne/sunnhordland_mek_verkstad_leknestangen.json'
          places = load(place_path)
          if len(places) != 1 or places[0].get('id') != 'sunnhordland_mek_verkstad_leknestangen':
              raise SystemExit('Unexpected SMV place file')
          places[0].update(load(payload_dir / 'smv-place.json'))
          save(place_path, places)

          museum_people_path = 'data/people/naeringsliv/vestland/etne/people_naeringsliv_etne_batch2.json'
          museum_people = upsert_by_id(load(museum_people_path), load(payload_dir / 'smv-people.json'))
          save(museum_people_path, museum_people)

          anders_people_path = 'data/people/naeringsliv/vestland/etne/people_smv_leknestangen_batch1.json'
          save(anders_people_path, [load(payload_dir / 'smv-anders-person.json')])
          people_manifest_path = 'data/people/manifest.json'
          people_manifest = load(people_manifest_path)
          manifest_entry = anders_people_path.removeprefix('data/')
          if manifest_entry not in people_manifest['files']:
              people_manifest['files'].append(manifest_entry)
          save(people_manifest_path, people_manifest)

          relations_path = 'data/relations.json'
          relations = upsert_by_id(load(relations_path), load(payload_dir / 'smv-relations.json'))
          save(relations_path, relations)

          story = load(payload_dir / 'smv-story.json')
          story_path = 'data/stories/stories_etnesjoen_naeringsliv_rounds_batch1.json'
          stories = [row for row in load(story_path) if row.get('id') != story['id']]
          stories.append(story)
          save(story_path, stories)

          article = load(payload_dir / 'smv-article.json')
          article_path = 'data/leksikon/places/vestland/etne/naeringsliv/leksikon_etnesjoen_naeringsliv_rounds_batch1.json'
          articles = [row for row in load(article_path) if row.get('place_id') != article['place_id']]
          articles.append(article)
          save(article_path, articles)
          PY
      - name: SMV dedicated test
        run: node tests/smv-leknestangen-batch1-round-content.test.js
      - name: Inherited Etne round tests
        shell: bash
        run: |
          find tests -maxdepth 1 -type f -name '*batch1-round-content.test.js' \
            | grep -E '/(etne|etnesjoen|skanevik|steinsvollen|engebanen|skakkeringen|osnes|sjokanten|fikse|house-of-blues|musikkpaviljongen|pippifestivalen|kulturhall|hardeland|litledalen|motormuseum|smv)[^/]*batch1-round-content\.test\.js$' \
            | grep -v 'smv-leknestangen-batch1-round-content.test.js' \
            | sort \
            | xargs -r -n1 node
      - run: npm run places:index:check
      - run: npm run places:emner:check
      - run: npm run leksikon:ids:check
      - name: People audit
        run: bash scripts/check-people.sh
      - name: Restore generated people audit reports
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- \
            reports/people-invalid-place-refs.json \
            reports/people-invalid-place-refs.md \
            reports/people-of-places-status.json \
            reports/people-of-places-status.md \
            reports/people-place-coverage.json \
            reports/people-place-coverage.md
      - run: npm run typecheck:tools
      - run: npm run typecheck:web
      - name: Story integrity without new SMV errors
        shell: bash
        run: |
          set +e
          npx tsx tools/check_stories_integrity.mts > /tmp/story-integrity.log 2>&1
          status=$?
          set -e
          cat /tmp/story-integrity.log
          if grep -E 'sunnhordland_mek_verkstad_leknestangen|st_smv_fra_seimsfoss_til_leknestangen' /tmp/story-integrity.log; then
            echo "New SMV story-integrity error detected"
            exit 1
          fi
          echo "Story integrity exit status: $status; no SMV-specific errors"
      - run: git diff --check
      - name: Remove temporary payloads and workflow
        run: |
          rm -rf .github/agent-payloads
          rm .github/workflows/agent-fill-smv-leknestangen-rounds.yml
      - name: Commit generated content
        shell: bash
        run: |
          git config user.name "History Go data agent"
          git config user.email "history-go-agent@users.noreply.github.com"
          git add -A
          git commit -m "Fill SMV Leknestangen place rounds batch 1"
          git push origin HEAD:${{ github.head_ref }}
