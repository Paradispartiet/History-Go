name: Fagverk Philosophy source integrity

on:
  pull_request:
    paths:
      - 'data/fag/filosofi/**'
      - 'data/fagverk/filosofi/**'
      - 'tests/fagverk-filosofi-source-integrity.test.mjs'
      - 'tests/filosofi-theory-integrity.test.mjs'
      - 'tools/audit-filosofi-theory-integrity.mjs'
      - 'reports/fagverk/filosofi-theory-integrity-audit.json'
      - '.github/workflows/fagverk-filosofi-source-integrity.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Philosophy source integrity
        run: |
          node --check tools/audit-filosofi-theory-integrity.mjs
          node tools/audit-filosofi-theory-integrity.mjs
          node --test tests/fagverk-filosofi-source-integrity.test.mjs
          node --test tests/filosofi-theory-integrity.test.mjs
