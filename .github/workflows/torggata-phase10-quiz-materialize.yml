name: Torggata phase 10 quiz materialize

on:
  push:
    branches:
      - agent/torggata-phase10-quiz

permissions:
  contents: write

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Repair materializer baseline and workcard deterministically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/materialize-torggata-phase10-quiz.mjs")
          source = path.read_text()

          old_baseline = 'if (!Array.isArray(legacyBefore) || legacyBefore.length !== 35) throw new Error("Unexpected legacy merged quiz baseline");'
          new_baseline = '''if (!Array.isArray(legacyBefore) || legacyBefore.length === 0) throw new Error("Unexpected empty/non-array legacy merged quiz baseline");
          const legacyIds = legacyBefore.map(item => item?.quiz_id || item?.id).filter(Boolean);
          if (legacyIds.length !== legacyBefore.length || new Set(legacyIds).size !== legacyIds.length) {
            throw new Error(`Legacy merged quiz baseline has missing/duplicate ids: ${legacyIds.length}/${legacyBefore.length} usable unique candidates`);
          }'''
          if old_baseline not in source:
              raise SystemExit("Expected legacy baseline assertion not found")
          source = source.replace(old_baseline, new_baseline, 1)

          old_audit = 'legacy_reviewed: { file: legacyQuizPath, questions: 35, canonical: false },'
          new_audit = 'legacy_reviewed: { file: legacyQuizPath, questions: legacyBefore.length, canonical: false },'
          if old_audit not in source:
              raise SystemExit("Expected legacy audit count not found")
          source = source.replace(old_audit, new_audit, 1)

          start_marker = 'if (!workcard.includes("## Fase 10 – Quiz")) {'
          end_marker = 'write(workcardPath, workcard);'
          start = source.index(start_marker)
          end = source.index(end_marker, start) + len(end_marker)
          replacement = '''if (!workcard.includes("## Fase 10 – Quiz")) {
            const phase10Closeout = [
              "",
              "",
              "## Fase 10 – Quiz",
              "",
              "```text",
              "TIDLIGERE-ARBEID-SØK: UTFØRT",
              "AKTIV BASELINE: 6 sett / 42 spørsmål i data/quiz/by/torggata_sets.json",
              "LEGACY AUDITERT: " + legacyBefore.length + " spørsmål i data/quiz/by/torggata_sets_merged.json; ikke manifest-loadet canonical output",
              "KONKRET REGRESJONSEVIDENS: repos quiztriage flagget Torggata for faglig-lesning-/teorimaler; aktive sett 3–6 brukte også interne emnefiler som synlig kilde",
              "BESLUTNING: FULL CANONICAL REVISION – claim-bank først, deretter spørsmål",
              "```",
              "",
              "### Godkjent resultat",
              "",
              "- `fag_manifest.json` registrerer Torggata som aktiv `by.quizProduction`-target med source brief, production context og canonical quizfil.",
              "- Eksisterende 6 × 7 er auditerte før profilvalg; legacy `_merged` er også gjennomgått og beholdes kun som ikke-canonical revisjonsspor.",
              "- Ny profil er **rich 5 × 7**, valgt fordi fem selvstendige kildebårne læringsjobber finnes; det er ikke en tallkvote.",
              "- Spørsmålsbalanse: **19 fakta / 9 sammenheng / 7 begrep-teori**.",
              "- Første **14/14** spørsmål er normale, direkte og kildebelagte uten metode-, teori- eller læreplansprompt.",
              "- Alle 35 spørsmål har unik `claim_id` og peker bare til reviewede eksterne source-ID-er; interne By-filer er kun guidance/metadata.",
              "- Sluttsettet bruker `met_for_etter` og den canonicale hooken `byliv_opphold_vs_gjennomgang` med Michel de Certeau og Gordon Cullen som eksplisitte, stedlig forankrede teoribindinger.",
              "- Påstander om automatisk fortrengning, generiske rent-gap-prompter og den tidligere superlativen om 25-metersbasseng er eksplisitt holdt tilbake.",
              "- Canonical Knowledge regenereres fra den nye manifest-loadede quizen før batchen kan persisteres.",
              "",
              "**Fase 10 Quiz = GODKJENT når materialiseringsworkflow, canonical quiz-audits, Knowledge-sync, TypeScript og build er grønne.**",
              "",
              "Neste aktive fase: **11. Knowledge**.",
              ""
            ].join("\\n");
            workcard = workcard.trimEnd() + phase10Closeout;
          }
          write(workcardPath, workcard);'''
          path.write_text(source[:start] + replacement + source[end:])

          pipeline_path = Path("tests/quiz-production-pipeline.test.mjs")
          pipeline_source = pipeline_path.read_text()
          old_count = 'assert.equal(report.quizFilesChecked, 10);'
          loop_marker = '  for (const report of reports) {'
          if pipeline_source.count(old_count) != 1:
              raise SystemExit(f"Expected exactly one hard-coded quiz pipeline count, found {pipeline_source.count(old_count)}")
          if pipeline_source.count(loop_marker) != 1:
              raise SystemExit(f"Expected exactly one audit report loop, found {pipeline_source.count(loop_marker)}")
          manifest_count = '''  const manifest = JSON.parse(await readFile("data/fag/fag_manifest.json", "utf8"));
          const expectedQuizFilesChecked = Object.values(manifest).reduce((count, entry) => {
            const targets = entry?.quizProduction?.targets;
            return count + (targets && typeof targets === "object" && !Array.isArray(targets)
              ? Object.keys(targets).length
              : 0);
          }, 0);'''
          pipeline_source = pipeline_source.replace(loop_marker, manifest_count + "\n\n" + loop_marker, 1)
          pipeline_source = pipeline_source.replace(
              old_count,
              'assert.equal(report.quizFilesChecked, expectedQuizFilesChecked);',
              1
          )
          pipeline_path.write_text(pipeline_source)
          PY
          node --check scripts/materialize-torggata-phase10-quiz.mjs
          node --check tests/quiz-production-pipeline.test.mjs

      - name: Materialize Torggata phase 10
        shell: bash
        run: |
          set +e
          node scripts/materialize-torggata-phase10-quiz.mjs > phase10-materialize.log 2>&1
          status=$?
          cat phase10-materialize.log
          exit $status

      - name: Upload materializer failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: torggata-phase10-materializer-failure
          path: phase10-materialize.log
          if-no-files-found: error

      - name: Regenerate canonical Knowledge
        run: node --experimental-strip-types scripts/knowledge-canonical-data.mts --write

      - name: Check phase 10 materializer syntax
        run: node --check scripts/materialize-torggata-phase10-quiz.mjs

      - name: Validate Torggata phase 10 contract
        run: node --test tests/torggata-phase10-quiz.test.mjs

      - name: Audit quiz production context
        run: node scripts/audit-quiz-production-context.mjs

      - name: Audit quiz progression
        run: node scripts/audit-quiz-progression.mjs

      - name: Audit quiz theory binding
        run: node scripts/audit-quiz-theory-binding.mjs

      - name: Audit quiz content quality
        run: node scripts/audit-quiz-content-quality.mjs

      - name: Audit quiz manifest v2
        run: node scripts/audit-quiz-manifest-v2.mjs

      - name: Validate quiz production pipeline
        run: node --test tests/quiz-production-pipeline.test.mjs

      - name: Validate Knowledge contract
        run: node --experimental-strip-types scripts/knowledge-canonical-data.mts --audit-only

      - name: Preserve phase 9 regression
        run: node --test tests/torggata-phase9-onsite.test.mjs

      - name: TypeScript hard gates
        run: |
          npm run typecheck:web
          npm run typecheck:scripts
          npm run typecheck:tools

      - name: Build guard
        run: npm run build --if-present

      - name: Inspect permanent scope
        shell: bash
        run: |
          echo "Changed files before persist:"
          git status --short
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u | awk 'NF')"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(data/fag/fag_manifest\.json|data/quiz/by/torggata_sets\.json|data/quiz/production_briefs/by/torggata\.json|data/quiz/production_context/by/torggata\.json|data/knowledge/[^/]+\.generated\.json|reports/knowledge-[^/]+\.json|reports/quiz_manifest_v2_audit_report\.json|reports/place-production/torggata-phase10-quiz-audit-v1\.json|reports/place-production/torggata-workcard-current\.md|tests/torggata-phase10-quiz\.test\.mjs|tests/quiz-production-pipeline\.test\.mjs|scripts/materialize-torggata-phase10-quiz\.mjs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected permanent diff:"
            echo "$unexpected"
            exit 1
          fi

      - name: Persist validated phase 10 batch
        shell: bash
        run: |
          rm -f .github/workflows/torggata-phase10-quiz-materialize.yml scripts/materialize-torggata-phase10-quiz.mjs
          rm -f phase10-materialize.log
          git add -A
          git diff --cached --check
          echo "Validated permanent diff:"
          git diff --cached --name-status
          if git diff --cached --quiet; then
            echo "No validated changes to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Godkjenn Torggata fase 10 Quiz"
          git push origin HEAD:agent/torggata-phase10-quiz
