name: One-time enrich Kjersti people profile

on:
  push:
    branches:
      - agent/kjersti-people-profile
    paths:
      - .github/workflows/one-time-enrich-kjersti-people-profile.yml

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile branch
        uses: actions/checkout@v4
        with:
          ref: agent/kjersti-people-profile
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply verified profile enrichment
        run: python scripts/one-time-enrich-kjersti-people-profile.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild people-derived Civication index
        run: npm run civication:history-people:build

      - name: Validate people data and popup rendering
        run: |
          node --check js/ui/person-popup-v2.js
          node --test tests/person-popup-v2.test.js
          bash scripts/check-people.sh
          npm run build:web:check

      - name: Commit enrichment and remove one-time files
        run: |
          git restore --staged --worktree reports 2>/dev/null || true
          git clean -fd reports 2>/dev/null || true
          git rm \
            .github/workflows/one-time-enrich-kjersti-people-profile.yml \
            scripts/one-time-enrich-kjersti-people-profile.py
          git add -A
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Enrich Kjersti Wexelsen Goksøyr profile"
          git push origin HEAD:agent/kjersti-people-profile

