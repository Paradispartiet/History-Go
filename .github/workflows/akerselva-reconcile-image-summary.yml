name: Reconcile Akerselva image summary with main
on:
  push:
    branches:
      - work/oslo-akerselva-v1-bolk-20261116
    paths:
      - '.github/workflows/akerselva-reconcile-image-summary.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: b65c8ba48cdf194c684a37efce204d9061c1ba04
      BRANCH: work/oslo-akerselva-v1-bolk-20261116
      SUMMARY: data/places/place_image_backlog_summary.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge the verified main revision and rebuild the image summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge-base --is-ancestor "$BASE_SHA" origin/main
          if git merge --no-commit --no-ff "$BASE_SHA"; then
            echo 'Merge no longer has the expected conflict'
            exit 1
          fi
          test "$(git diff --name-only --diff-filter=U)" = "$SUMMARY"
          git checkout --theirs -- "$SUMMARY"
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/akerselva-image-audit.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('/tmp/akerselva-image-audit.json', 'utf8'));
          const file = process.env.SUMMARY;
          const summary = JSON.parse(fs.readFileSync(file, 'utf8'));
          const { local, remote, optional, missing, invalid } = audit.summary;
          if (audit.totalPlaces !== summary.totalPlaces || invalid !== 0) {
            throw new Error('Unexpected place count or missing local image assets');
          }
          summary.generatedAt = '2026-11-25';
          summary.generatedFromCommit = 'Bildeaudit for samordnet Akerselva-gren og main';
          summary.summary = {
            validLocal: local, validRemote: remote, optionalMissing: optional,
            missing, invalidLocalPath: invalid, remaining: missing + invalid
          };
          summary.byCategory = Object.fromEntries(Object.entries(audit.byCategory).map(([id, row]) => [id, {
            total: row.total, valid: row.local + row.remote, optional: row.optional,
            missing: row.missing, invalid: row.invalid
          }]));
          summary.note = 'Bildeoversikten er regenerert etter samordning av Akerselva-grenen og main.';
          fs.writeFileSync(file, JSON.stringify(summary, null, 2) + '\n');
          JS
          node scripts/audit-place-images.mjs --mode=all --verify-summary="$SUMMARY"
          node scripts/build-places-index.mjs --check
          git add "$SUMMARY"
          git rm '.github/workflows/akerselva-reconcile-image-summary.yml'
          git diff --cached --check
          git commit -m 'Merge main and regenerate the Akerselva image backlog summary'
          git push origin "HEAD:refs/heads/$BRANCH"
