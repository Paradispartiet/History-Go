name: TEMP Litteratur round4 fresh-main replay

on:
  push:
    branches:
      - agent/litteratur-maintenance-source-refresh-round4-20260905
    paths:
      - '.github/workflows/tmp-litteratur-round4-replay.yml'

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/litteratur-maintenance-source-refresh-round4-20260905
          fetch-depth: 0
      - name: Merge fresh main into exact branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          echo "fresh_main=$(git rev-parse origin/main)"
          git merge --no-edit origin/main
          git push origin HEAD:agent/litteratur-maintenance-source-refresh-round4-20260905
