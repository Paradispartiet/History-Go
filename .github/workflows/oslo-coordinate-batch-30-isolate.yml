name: Isolate Oslo coordinate batch 30 from stale split drift

on:
  push:
    branches:
      - agent/oslo-coordinate-control-batch-30
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: oslo-coordinate-batch-30-isolate
  cancel-in-progress: true

jobs:
  isolate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-30
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Promote enriched main split records into the aggregate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');

          const aggregatePath = 'data/places/litteratur/oslo/places_litteratur.json';
          const aggregate = JSON.parse(fs.readFileSync(aggregatePath, 'utf8'));
          const ids = ['nasjonalbiblioteket', 'deichman_grunerlokka'];

          for (const id of ids) {
            const splitPath = `data/places/litteratur/oslo/places_litteratur/${id}.json`;
            const enriched = JSON.parse(cp.execFileSync('git', ['show', `origin/main:${splitPath}`], {encoding:'utf8'}));
            const index = aggregate.findIndex((place) => place?.id === id);
            if (index < 0) throw new Error(`Missing aggregate record ${id}`);
            aggregate[index] = enriched;
          }

          fs.writeFileSync(aggregatePath, JSON.stringify(aggregate, null, 2) + '\n');
          NODE

      - name: Regenerate split metadata and runtime from the lossless aggregate
        run: |
          set -euo pipefail
          node scripts/split-litteratur-oslo-places.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('data/places/litteratur/oslo/places_litteratur_split_report.txt')
          p.write_text(p.read_text().rstrip() + '\n')
          PY
          npm run places:index:build

      - name: Prove enriched split files are preserved byte-for-byte
        run: |
          set -euo pipefail
          git diff --exit-code origin/main -- \
            data/places/litteratur/oslo/places_litteratur/nasjonalbiblioteket.json \
            data/places/litteratur/oslo/places_litteratur/deichman_grunerlokka.json

      - name: Re-run all hard validation gates
        shell: bash
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-30/validation
          mkdir -p "$out"

          npm run audit:places-split-manifest-sync | tee "$out/split-manifest-sync.txt"
          npm run places:index:check | tee "$out/places-index-check.txt"
          npm run test:coordinate-source-contract | tee "$out/coordinate-source-contract.txt"
          npm run places:coords:quality | tee "$out/coordinate-quality.txt"
          npm run places:coords:intake | tee "$out/coordinate-intake.txt"
          npm run places:coords:evidence:audit | tee "$out/coordinate-evidence-audit.txt"
          git diff --check | tee "$out/git-diff-check.txt"

      - name: Assert lossless sync repair and exact batch 30 result
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const aggregate = read('data/places/litteratur/oslo/places_litteratur.json');
          const runtime = read('data/places/places_index.json');
          const byId = new Map(aggregate.map((p) => [p.id, p]));
          const runtimeById = new Map(runtime.map((p) => [p.id, p]));

          const expected = {
            oscar_braaten_statuen: ['Oskar Braaten-bysten', 1961, 59.9309838, 10.7578832, 'osm-node:10819902960'],
            alexander_kiellands_plass: ['Alexander Kiellands plass', 1914, 59.9270478, 10.7504014, 'osm-way:3610607']
          };
          for (const [id, [name, year, lat, lon, sourceObjectId]] of Object.entries(expected)) {
            const place = byId.get(id);
            const rt = runtimeById.get(id);
            const split = read(`data/places/litteratur/oslo/places_litteratur/${id}.json`);
            if (!place || !rt) throw new Error(`${id} missing from aggregate/runtime`);
            if (place.name !== name || place.year !== year || place.lat !== lat || place.lon !== lon || place.sourceObjectId !== sourceObjectId || place.coordStatus !== 'verified_geometry') {
              throw new Error(`${id} canonical mismatch`);
            }
            if (JSON.stringify(split) !== JSON.stringify(place)) throw new Error(`${id} split/aggregate mismatch`);
            if (rt.name !== name || rt.year !== year || rt.lat !== lat || rt.lon !== lon || rt.coordStatus !== 'verified_geometry') {
              throw new Error(`${id} runtime mismatch`);
            }
          }

          const nb = byId.get('nasjonalbiblioteket');
          if (!nb?.nature_profile || !Array.isArray(nb.externalLinks) || !Array.isArray(nb.works) || !nb.for_na || !Array.isArray(nb.civication_store)) {
            throw new Error('Nasjonalbiblioteket enriched split data was not preserved in aggregate');
          }
          const nbSplit = read('data/places/litteratur/oslo/places_litteratur/nasjonalbiblioteket.json');
          if (JSON.stringify(nbSplit) !== JSON.stringify(nb)) throw new Error('Nasjonalbiblioteket remains split/aggregate divergent');
          NODE

      - name: Record the pre-existing sync repair in the batch report
        run: |
          cat >> reports/oslo-coordinate-control-batch-30/README.md <<'EOF'

## Pre-existing literature split drift repaired

The batch generator exposed a pre-existing divergence where the enriched `nasjonalbiblioteket` split record contained canonical nature, links, works, before/now and Civication-store data that were absent from the aggregate. The repair is lossless: the enriched split record was promoted into the aggregate before regeneration, so no enrichment was deleted. `deichman_grunerlokka` was normalized through the same source-of-truth pass. Both resulting split files are byte-identical to their `main` versions.
EOF

      - name: Commit isolated batch and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/oslo-coordinate-batch-30-isolate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs reports .github/workflows/oslo-coordinate-batch-30-isolate.yml
          git commit -m "Preserve enriched literature data in Oslo coordinate batch 30"
          git push origin HEAD
