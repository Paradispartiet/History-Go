name: TEMP Fagverk theory integrity reconcile

on:
  push:
    branches:
      - agent/fagverk-theory-integrity-audit

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fagverk-theory-integrity-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reconcile Scenekunst general-engine expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/fagverk-general-engine.test.mjs')
          s = p.read_text()
          old = """  assert.equal(scenekunst.emneCount, 8);\n  assert.equal(scenekunst.methodCount, 9);\n  assert.equal(scenekunst.mappingCount, 8);"""
          new = """  assert.equal(scenekunst.emneCount, 20);\n  assert.equal(scenekunst.methodCount, 14);\n  assert.equal(scenekunst.mappingCount, 20);"""
          if old not in s:
              raise SystemExit('Expected stale Scenekunst assertion block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Regenerate canonical Fagverk registry
        run: |
          node scripts/audit-fagverk-registry.mjs \
            --report reports/fagverk/fagverk-registry-mapping.json \
            --registry-out data/fagverk/fagverk_registry.json
      - name: Verify shared owners
        run: |
          node scripts/audit-fagverk-registry.mjs \
            --report reports/fagverk/fagverk-registry-mapping.json \
            --registry-out data/fagverk/fagverk_registry.json \
            --check
          node scripts/audit-fagverk-general-engine.mjs
          node --test tests/fagverk-general-engine.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-documentation-contract.test.mjs
      - name: Commit permanent reconciliation and self-remove
        run: |
          rm .github/workflows/TEMP-fagverk-theory-integrity-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fagverk-general-engine.test.mjs data/fagverk/fagverk_registry.json reports/fagverk/fagverk-registry-mapping.json .github/workflows/TEMP-fagverk-theory-integrity-reconcile.yml
          if git diff --cached --quiet; then
            echo "No reconciliation changes produced"
            exit 1
          fi
          git commit -m "test(fagverk): reconcile Scenekunst engine and registry"
          git push origin HEAD:agent/fagverk-theory-integrity-audit
