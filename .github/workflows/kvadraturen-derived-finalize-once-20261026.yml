name: Kvadraturen finalize derived Epoch and People indices (one time)
on:
  push:
    branches:
      - research/oslo-sentrum-kvadraturen-v1-six-20261023
    paths:
      - '.github/workflows/kvadraturen-derived-finalize-once-20261026.yml'
permissions:
  contents: write
concurrency:
  group: kvadraturen-derived-20261026
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-kvadraturen-v1-six-20261023
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate canonical epoch and people indices
        run: |
          npm run epoker:places:build
          npm run civication:history-people:build
      - name: Verify derived indices and three required source reports
        run: |
          npm run epoker:places:check
          npm run civication:history-people:check
          node scripts/audit-historie-place-production.mjs --all
          for id in den_gamle_krigsskolen garmanngarden stattholdergarden; do
            test -s "data/places/historie-production/$id.json"
          done
      - name: Commit and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/kvadraturen-derived-finalize-once-20261026.yml
          git add data/epoker/epoke-place-index.json data/Civication/historyPeople_index.json .github/workflows/kvadraturen-derived-finalize-once-20261026.yml
          if git diff --cached --quiet; then
            echo "No derived changes"
          else
            git commit -m "build(kvadraturen): sync epoch and people indices after v1 reports"
            git push origin HEAD:research/oslo-sentrum-kvadraturen-v1-six-20261023
          fi
