name: Fill Hardeland rounds

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-validate-commit:
    if: github.head_ref == 'agent/fill-hardeland-rounds-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Hardeland content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path, value):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          payload_dir = Path('.github/agent-payloads')

          place_path = 'data/places/naeringsliv/vestland/etne/hardeland_kraftverk.json'
          rows = load(place_path)
          if len(rows) != 1 or rows[0].get('id') != 'hardeland_kraftverk':
              raise SystemExit('Unexpected Hardeland place file')
          rows[0].update(load(payload_dir / 'hardeland-place.json'))
          save(place_path, rows)

          people_path = 'people/naeringsliv/vestland/etne/people_hardeland_kraftverk_batch1.json'
          people_manifest_path = 'data/people/manifest.json'
          people_manifest = load(people_manifest_path)
          people_manifest['files'] = [item for item in people_manifest['files'] if item != people_path]
          people_manifest['files'].append(people_path)
          save(people_manifest_path, people_manifest)

          relation = load(payload_dir / 'hardeland-relation.json')
          relations_path = 'data/relations.json'
          relations = [row for row in load(relations_path) if row.get('id') != relation['id']]
          relations.append(relation)
          save(relations_path, relations)

          story = load(payload_dir / 'hardeland-story.json')
          story_path = 'data/stories/stories_etnesjoen_naeringsliv_rounds_batch1.json'
          save(story_path, [story])
          story_manifest_path = 'data/stories/stories_manifest.json'
          story_manifest = load(story_manifest_path)
          story_manifest['files'] = [entry for entry in story_manifest['files'] if entry.get('path') != story_path]
          story_manifest['files'].append({
              'category': 'naeringsliv',
              'entity_id': 'hardeland_kraftverk',
              'path': story_path
          })
          save(story_manifest_path, story_manifest)

          article = load(payload_dir / 'hardeland-article.json')
          article_path = 'data/leksikon/places/vestland/etne/naeringsliv/leksikon_etnesjoen_naeringsliv_rounds_batch1.json'
          save(article_path, [article])
          leksikon_manifest_path = 'data/leksikon/manifest.json'
          leksikon_manifest = load(leksikon_manifest_path)
          leksikon_manifest['files'] = [item for item in leksikon_manifest['files'] if item != article_path]
          leksikon_manifest['files'].append(article_path)
          save(leksikon_manifest_path, leksikon_manifest)
          PY
      - name: Hardeland dedicated test
        run: node tests/hardeland-batch1-round-content.test.js
      - name: Inherited Etne batch 1 round tests
        shell: bash
        run: |
          find tests -maxdepth 1 -type f -name '*batch1-round-content.test.js' \
            | grep -E '/(etne|etnesjoen|skanevik|steinsvollen|engebanen|skakkeringen|osnes|sjokanten|fikse|house-of-blues|musikkpaviljongen|pippifestivalen|kulturhall|hardeland)[^/]*batch1-round-content\.test\.js$' \
            | grep -v 'hardeland-batch1-round-content.test.js' \
            | sort \
            | xargs -r -n1 node
      - run: npm run leksikon:ids:check
      - name: People audit
        run: bash scripts/check-people.sh
      - name: Restore generated people audit reports
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- \
            reports/people-invalid-place-refs.json \
            reports/people-invalid-place-refs.md \
            reports/people-of-places-status.json \
            reports/people-of-places-status.md \
            reports/people-place-coverage.json \
            reports/people-place-coverage.md
      - run: npm run typecheck:tools
      - run: npm run typecheck:web
      - name: Story integrity without new Hardeland errors
        shell: bash
        run: |
          set +e
          npx tsx tools/check_stories_integrity.mts > /tmp/story-integrity.log 2>&1
          status=$?
          set -e
          cat /tmp/story-integrity.log
          if grep -E 'hardeland_kraftverk|st_hardeland' /tmp/story-integrity.log; then
            echo "New Hardeland story-integrity error detected"
            exit 1
          fi
          echo "Story integrity exit status: $status; no Hardeland-specific errors"
      - run: git diff --check
      - name: Remove temporary payloads and workflow
        run: |
          rm -rf .github/agent-payloads
          rm .github/workflows/agent-fill-hardeland-rounds.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name "History Go data agent"
          git config user.email "history-go-agent@users.noreply.github.com"
          git add -A
          git commit -m "Fill Hardeland place rounds batch 1"
          git push origin HEAD:${{ github.head_ref }}
