name: Kvadraturen integrate latest main safely (one time)
on:
  push:
    branches:
      - research/oslo-sentrum-kvadraturen-v1-six-20261023
    paths:
      - '.github/workflows/kvadraturen-main-integration-once-20261026.yml'
permissions:
  contents: write
concurrency:
  group: kvadraturen-main-integration-once-20261026
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-kvadraturen-v1-six-20261023
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Merge latest main, restricting conflict resolution to image backlog summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'Already integrated latest main'
          else
            set +e
            git merge --no-commit --no-ff origin/main
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ "$conflicts" != 'data/places/place_image_backlog_summary.json' ]; then
                echo "Unexpected conflicts: $conflicts"
                exit 1
              fi
              node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const p='data/places/place_image_backlog_summary.json';
          const show=n=>JSON.parse(execFileSync('git',['show',`:${n}:${p}`],{encoding:'utf8'}));
          const [base,ours,theirs]=[1,2,3].map(show);
          const check=(condition,message)=>{if(!condition)throw Error(message)};
          check(base.schema===ours.schema&&ours.schema===theirs.schema,'Summary schema mismatch');
          check(base.totalPlaces===ours.totalPlaces&&ours.totalPlaces===theirs.totalPlaces,'Place inventory changed');
          const mergeCounts=(a,b,c,scope)=>{
            const out={...b};
            for(const key of Object.keys(a)){
              check(typeof a[key]==='number'&&typeof b[key]==='number'&&typeof c[key]==='number',scope+'.'+key+' not numeric');
              out[key]=b[key]+c[key]-a[key];
              check(Number.isInteger(out[key])&&out[key]>=0,scope+'.'+key+' invalid');
            }
            return out;
          };
          const merged={...ours};
          merged.summary=mergeCounts(base.summary,ours.summary,theirs.summary,'summary');
          const keys=Object.keys(base.byCategory);
          check(keys.length===Object.keys(ours.byCategory).length&&keys.length===Object.keys(theirs.byCategory).length,'Category count mismatch');
          merged.byCategory={};
          for(const cat of keys){
            check(ours.byCategory[cat]&&theirs.byCategory[cat],'Missing category '+cat);
            merged.byCategory[cat]=mergeCounts(base.byCategory[cat],ours.byCategory[cat],theirs.byCategory[cat],cat);
            const q=merged.byCategory[cat];
            check(q.total===q.valid+q.optional+q.missing+q.invalid,cat+' totals mismatch');
          }
          check(merged.summary.validLocal+merged.summary.validRemote+merged.summary.optionalMissing+merged.summary.missing+merged.summary.invalidLocalPath===merged.totalPlaces,'Global image totals mismatch');
          check(merged.summary.remaining===merged.summary.missing,'Remaining count mismatch');
          merged.generatedFromCommit=execFileSync('git',['rev-parse','origin/main'],{encoding:'utf8'}).trim();
          merged.note='Samordnet fra de uavhengige, kanoniske bildeauditene for seks Kvadraturen-steder og ny Å–V-bolk. Overlappende stedspakker ble ikke erstattet.';
          fs.writeFileSync(p,JSON.stringify(merged,null,2)+'\n');
          console.log('IMAGE_BACKLOG_MERGE_PASS',merged.summary.validLocal,merged.summary.missing);
          NODE
              git add data/places/place_image_backlog_summary.json
            fi
            test -f .git/MERGE_HEAD
            git rm .github/workflows/kvadraturen-main-integration-once-20261026.yml
            git commit -m 'merge(kvadraturen): integrate main and preserve both image production sets'
          fi
      - name: Install dependencies and validate derived data
        run: |
          npm ci --no-audit --no-fund
          npm run epoker:places:check
          npm run civication:history-people:check
          node scripts/audit-historie-place-production.mjs --all
      - name: Push integrated branch
        shell: bash
        run: |
          git push origin HEAD:research/oslo-sentrum-kvadraturen-v1-six-20261023
