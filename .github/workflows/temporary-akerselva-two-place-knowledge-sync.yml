name: Temporary Akerselva two-place Knowledge sync
on:
  push:
    branches:
      - content/glads-vaterland-fullquiz-qc-20261021
    paths:
      - .github/workflows/temporary-akerselva-two-place-knowledge-sync.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/glads-vaterland-fullquiz-qc-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate and verify Knowledge; run focused quiz test
        run: |
          npm ci --no-audit --no-fund
          npm run knowledge:canonical:write
          npm run knowledge:canonical:check
          node --test tests/akerselva-glads-vaterland-narrow-quiz.test.mjs
      - name: Commit canonical generated data
        shell: bash
        run: |
          git add -u -- \
            data/quiz/historie/glads_molle_sets.json \
            data/quiz/by/vaterland_historisk_elvelop_sets.json \
            data/knowledge \
            reports/knowledge-id-backfill.json
          if git diff --cached --quiet; then
            echo 'Canonical Knowledge data already in sync'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(knowledge): synchronize Glads/Vaterland 3x7 questions'
          git pull --rebase origin content/glads-vaterland-fullquiz-qc-20261021
          git push origin HEAD:refs/heads/content/glads-vaterland-fullquiz-qc-20261021
