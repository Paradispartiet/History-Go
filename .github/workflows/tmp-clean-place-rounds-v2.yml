name: Temporary canonical rounds cleanup v2

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: temp-rounds-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/clean-place-rounds-canonical-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Detect completed cleanup
        id: guard
        shell: bash
        run: |
          if grep -q 'badges · map · flora · fauna' data/places/README_place_rounds.md \
             && grep -q 'badges · people · objects · brands' data/places/README_place_rounds.md \
             && ! grep -q 'const PLACE_ROUND_REGISTRY = \[' js/ui/place-card.js; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.skip != 'true'
      - name: Apply cleanup
        if: steps.guard.outputs.skip != 'true'
        run: |
          sed -i '$d' .github/scripts/tmp_clean_rounds_v2.py
          python .github/scripts/tmp_clean_rounds_v2.py
      - name: Run canonical round tests
        if: steps.guard.outputs.skip != 'true'
        run: |
          node --test tests/place-rounds-visual-collections.test.mjs tests/place-rounds-grid-exclusivity.test.mjs tests/place-rounds-fill-layout.test.mjs
          node tests/place-card-rounds-runtime-audit.test.js
      - name: Commit cleanup once
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/README_place_rounds.md docs/PLACE_PRODUCTION_CHECKLIST.md docs/PLACE_STANDARD.md docs/PLACE_POPUP_SYSTEM.md docs/DATA_PRODUCTION_CONTRACT.md docs/HISTORY_GO_PRODUCT_MAP.md schemas/place.ts js/ui/place-rounds-visual-collections.js js/ui/place-card.js js/ui/place-rounds-fill-layout.js css/place-rounds-fill-layout.css .github/workflows/place-rounds-governance.yml tests/place-rounds-visual-collections.test.mjs tests/place-rounds-grid-exclusivity.test.mjs tests/place-rounds-fill-layout.test.mjs tests/place-card-rounds-runtime-audit.test.js tests/beierbrua-rounds-batch1.test.js tests/nedre-foss-rounds-batch1.test.js tests/kuba-parken-nature-rounds-batch1.test.js tests/oslo-blue-plaques-2026-round-content.test.js
          git commit -m 'Rydd rundingssystemet til to faste fireprofiler'
          git pull --rebase origin ${{ github.event.pull_request.head.ref }}
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
