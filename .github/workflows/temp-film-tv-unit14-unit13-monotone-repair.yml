name: TEMP repair Film TV unit 13 monotone gate

on:
  push:
    branches:
      - agent/film-tv-unit14-archive-preservation-access-authenticity-source-brief
    paths:
      - ".trigger/unit14-unit13-monotone-repair"

permissions:
  contents: write

concurrency:
  group: temp-film-tv-unit14-unit13-monotone-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-tv-unit14-archive-preservation-access-authenticity-source-brief
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Extend complete unit 13 monotone contract through unit 14
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const archiveSource = "const ARCHIVE_PRESERVATION_SOURCE_GATE = 'archive_preservation_access_authenticity_source_brief_complete_full_chapter_production';";
          const archiveFulltext = "const ARCHIVE_PRESERVATION_FULLTEXT_GATE = 'archive_preservation_access_authenticity_full_chapter_complete_next_unit_source_brief';";

          {
            const file = 'scripts/brief-film-tv-location-production-place-ethics-sources-v1.mjs';
            let source = fs.readFileSync(file, 'utf8');
            const gateAnchor = "const FULLTEXT_GATE = 'location_production_place_ethics_full_chapter_complete_next_unit_source_brief';\nconst UNIT_THIRTEEN_OR_LATER_GATES = new Set([OUTPUT_GATE, FULLTEXT_GATE]);";
            if (!source.includes(gateAnchor)) throw new Error('unit13 source: gate anchor missing');
            source = source.replace(gateAnchor, `const FULLTEXT_GATE = 'location_production_place_ethics_full_chapter_complete_next_unit_source_brief';\n${archiveSource}\n${archiveFulltext}\nconst UNIT_THIRTEEN_OR_LATER_GATES = new Set([OUTPUT_GATE, FULLTEXT_GATE, ARCHIVE_PRESERVATION_SOURCE_GATE, ARCHIVE_PRESERVATION_FULLTEXT_GATE]);`);
            const laterAnchor = 'const laterGateAlreadyActive = currentGate === FULLTEXT_GATE;';
            if (!source.includes(laterAnchor)) throw new Error('unit13 source: later gate anchor missing');
            source = source.replace(laterAnchor, 'const laterGateAlreadyActive = UNIT_THIRTEEN_OR_LATER_GATES.has(currentGate);');
            const statusAnchor = 'current_status_is_input_output_or_known_later_gate: [INPUT_GATE, OUTPUT_GATE, FULLTEXT_GATE].includes(currentGate),';
            if (!source.includes(statusAnchor)) throw new Error('unit13 source: current status anchor missing');
            source = source.replace(statusAnchor, 'current_status_is_input_output_or_known_later_gate: currentGate === INPUT_GATE || isFilmTvUnitThirteenOrLaterGate(currentGate),');
            fs.writeFileSync(file, source);
          }

          {
            const file = 'scripts/materialize-film-tv-location-production-place-ethics-fulltext-v1.mjs';
            let source = fs.readFileSync(file, 'utf8');
            const gateAnchor = "const OUTPUT_GATE = 'location_production_place_ethics_full_chapter_complete_next_unit_source_brief';";
            if (!source.includes(gateAnchor)) throw new Error('unit13 materializer: gate anchor missing');
            source = source.replace(gateAnchor, `${gateAnchor}\n${archiveSource}\n${archiveFulltext}`);
            const statusAnchor = "  const status = structuredClone(read(P.status));\n  const sourceById = new Map(sources.map((row) => [row.id, row]));";
            if (!source.includes(statusAnchor)) throw new Error('unit13 materializer: status anchor missing');
            source = source.replace(statusAnchor, "  const status = structuredClone(read(P.status));\n  const filmStatus = status.subjects.find((row) => row.id === 'film_tv');\n  if (!filmStatus) throw new Error('Mangler Film & TV-status');\n  const unitFourteenOrLaterGateActive = [ARCHIVE_PRESERVATION_SOURCE_GATE, ARCHIVE_PRESERVATION_FULLTEXT_GATE].includes(filmStatus.nextGate);\n  const sourceById = new Map(sources.map((row) => [row.id, row]));");
            const noteAnchor = "  registry.subjects.film_tv.canonicalModel.note = 'Film & TVs variable canon har 192 emner. Location, produksjon og stedsetikk er fulltekstregistrert med 8 canonicale emner, 4 variable moduler, 8 emneeide seksjoner, 39 claimsporede fagavsnitt, 39/39 verifiserte claims, 26 brukte inspectable kilder og 24 dokumenterte case. Locationtillatelse, samtykke, kulturell protokoll, karbon, stedlig økologi, virtuell stedserstatning og filmturisme har separate evidensgrenser. Neste port er kilde- og claimbrief for Arkiv, bevaring, tilgang og autentisitet.';";
            if (!source.includes(noteAnchor)) throw new Error('unit13 materializer: registry note anchor missing');
            source = source.replace(noteAnchor, `  if (!unitFourteenOrLaterGateActive) ${noteAnchor.trim()}`);
            const duplicateStatus = "  const filmStatus = status.subjects.find((row) => row.id === 'film_tv');\n  if (!filmStatus) throw new Error('Mangler Film & TV-status');\n  if ([SOURCE_BRIEF_GATE, OUTPUT_GATE].includes(filmStatus.nextGate)) {";
            if (!source.includes(duplicateStatus)) throw new Error('unit13 materializer: duplicate status anchor missing');
            source = source.replace(duplicateStatus, '  if ([SOURCE_BRIEF_GATE, OUTPUT_GATE].includes(filmStatus.nextGate)) {');
            fs.writeFileSync(file, source);
          }

          {
            const file = 'scripts/audit-film-tv-location-production-place-ethics-fulltext-v1.mjs';
            let source = fs.readFileSync(file, 'utf8');
            const importAnchor = "import { buildFilmTvLocationProductionPlaceEthicsFulltextV1 } from './materialize-film-tv-location-production-place-ethics-fulltext-v1.mjs';";
            if (!source.includes(importAnchor)) throw new Error('unit13 audit: import anchor missing');
            source = source.replace(importAnchor, `${importAnchor}\nimport { isFilmTvUnitThirteenOrLaterGate } from './brief-film-tv-location-production-place-ethics-sources-v1.mjs';`);
            const statusAnchor = '      && filmStatus?.nextGate === OUTPUT_GATE';
            if (!source.includes(statusAnchor)) throw new Error('unit13 audit: status gate anchor missing');
            source = source.replace(statusAnchor, '      && isFilmTvUnitThirteenOrLaterGate(filmStatus?.nextGate)');
            fs.writeFileSync(file, source);
          }

          {
            const file = 'tests/film-tv-location-production-place-ethics-fulltext-v1.test.mjs';
            let source = fs.readFileSync(file, 'utf8');
            const importAnchor = "import { auditFilmTvLocationProductionPlaceEthicsFulltextV1 } from '../scripts/audit-film-tv-location-production-place-ethics-fulltext-v1.mjs';";
            if (!source.includes(importAnchor)) throw new Error('unit13 fulltext test: import anchor missing');
            source = source.replace(importAnchor, `${importAnchor}\nimport { isFilmTvUnitThirteenOrLaterGate } from '../scripts/brief-film-tv-location-production-place-ethics-sources-v1.mjs';`);
            const assertAnchor = "  assert.equal(film.nextGate, 'location_production_place_ethics_full_chapter_complete_next_unit_source_brief');";
            if (!source.includes(assertAnchor)) throw new Error('unit13 fulltext test: next gate assertion anchor missing');
            source = source.replace(assertAnchor, '  assert.equal(isFilmTvUnitThirteenOrLaterGate(film.nextGate), true);');
            fs.writeFileSync(file, source);
          }
          EOF
          node --check scripts/brief-film-tv-location-production-place-ethics-sources-v1.mjs
          node --check scripts/materialize-film-tv-location-production-place-ethics-fulltext-v1.mjs
          node --check scripts/audit-film-tv-location-production-place-ethics-fulltext-v1.mjs
          node --check tests/film-tv-location-production-place-ethics-fulltext-v1.test.mjs

      - name: Set synthetic unit 14 state
        run: |
          cp data/fagverk/subject_status.json /tmp/subject_status.json
          cp data/fagverk/fagverk_registry.json /tmp/fagverk_registry.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const statusFile = 'data/fagverk/subject_status.json';
          const registryFile = 'data/fagverk/fagverk_registry.json';
          const status = JSON.parse(fs.readFileSync(statusFile, 'utf8'));
          const registry = JSON.parse(fs.readFileSync(registryFile, 'utf8'));
          const film = status.subjects.find((row) => row.id === 'film_tv');
          if (!film) throw new Error('Film & TV status missing');
          film.nextGate = 'archive_preservation_access_authenticity_source_brief_complete_full_chapter_production';
          film.note = 'synthetic unit 14 state for monotone regression';
          registry.subjects.film_tv.canonicalModel.fourteenthSourceClaimBrief = 'data/fag/TV_og_Film/film_tv_archive_preservation_access_authenticity_source_claim_brief_v1.json';
          registry.subjects.film_tv.canonicalModel.note = 'synthetic unit 14 registry note for monotone regression';
          fs.writeFileSync(statusFile, `${JSON.stringify(status, null, 2)}\n`);
          fs.writeFileSync(registryFile, `${JSON.stringify(registry, null, 2)}\n`);
          EOF

      - name: Validate unit 13 source brief under unit 14 gate
        run: node scripts/brief-film-tv-location-production-place-ethics-sources-v1.mjs

      - name: Validate unit 13 fulltext audit under unit 14 gate
        run: node scripts/audit-film-tv-location-production-place-ethics-fulltext-v1.mjs

      - name: Validate unit 13 source tests under unit 14 gate
        run: node --test tests/film-tv-location-production-place-ethics-source-brief-v1.test.mjs

      - name: Validate unit 13 fulltext tests under unit 14 gate
        run: node --test tests/film-tv-location-production-place-ethics-fulltext-v1.test.mjs

      - name: Restore persisted state
        if: always()
        run: |
          if [ -f /tmp/subject_status.json ]; then mv /tmp/subject_status.json data/fagverk/subject_status.json; fi
          if [ -f /tmp/fagverk_registry.json ]; then mv /tmp/fagverk_registry.json data/fagverk/fagverk_registry.json; fi

      - name: Commit focused unit 13 repair
        run: |
          rm -f .trigger/unit14-unit13-monotone-repair
          rm -f .github/workflows/temp-film-tv-unit14-unit13-monotone-repair.yml
          git add scripts/brief-film-tv-location-production-place-ethics-sources-v1.mjs \
                  scripts/materialize-film-tv-location-production-place-ethics-fulltext-v1.mjs \
                  scripts/audit-film-tv-location-production-place-ethics-fulltext-v1.mjs \
                  tests/film-tv-location-production-place-ethics-fulltext-v1.test.mjs \
                  .trigger/unit14-unit13-monotone-repair \
                  .github/workflows/temp-film-tv-unit14-unit13-monotone-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Allow Film TV unit 13 regression through unit 14"
          git push origin HEAD:agent/film-tv-unit14-archive-preservation-access-authenticity-source-brief
