name: Rebuild BY production context v4.6

on:
  push:
    branches:
      - fix/by-editorial-v4-6-20260805
    paths:
      - ".github/workflows/rebuild-by-context-v46.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/by-editorial-v4-6-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild Deichman production context
        run: npm run quiz:context -- --category by --target deichman_bjorvika
      - name: Audit production context
        run: npm run audit:quiz-production-context
      - name: Verify BY editorial integrity
        run: node scripts/validate-by-editorial-integrity.mjs
      - name: Remove bootstrap workflow
        run: rm .github/workflows/rebuild-by-context-v46.yml
      - name: Commit rebuilt context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild BY production context for editorial v4.6"
          git push origin HEAD:fix/by-editorial-v4-6-20260805
