name: TEMP build Place Sheet UI

on:
  push:
    branches:
      - fix/explore-events-meet-below-rounds-20260912

permissions:
  contents: write

jobs:
  build-web:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/explore-events-meet-below-rounds-20260912
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci
      - run: npm run build:web

      - name: Commit generated browser bundle only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/web
          if git diff --cached --quiet; then
            echo "dist/web already in sync"
            exit 0
          fi
          git commit -m "Build Place Sheet browser bundle"
          git push origin HEAD:fix/explore-events-meet-below-rounds-20260912
