name: One-time diagnose place popup quiz audit

on:
  push:
    branches:
      - agent/stensparken-place-popup-system
    paths:
      - .github/workflows/one-time-diagnose-place-popup-quiz-audit.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out popup branch
        uses: actions/checkout@v4
        with:
          ref: agent/stensparken-place-popup-system
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture quiz audit results
        shell: bash
        run: |
          set +e
          npm run audit:quiz-production-context > /tmp/context.log 2>&1
          context_status=$?
          npm run audit:quiz-progression > /tmp/progression.log 2>&1
          progression_status=$?
          npm run audit:quiz-theory-binding > /tmp/theory.log 2>&1
          theory_status=$?

          {
            printf 'audit:quiz-production-context exit=%s\n' "$context_status"
            cat /tmp/context.log
            printf '\n\naudit:quiz-progression exit=%s\n' "$progression_status"
            cat /tmp/progression.log
            printf '\n\naudit:quiz-theory-binding exit=%s\n' "$theory_status"
            cat /tmp/theory.log
          } > reports/place-popup-quiz-ci-diagnostic.log

      - name: Commit diagnostic and remove runner
        run: |
          git rm .github/workflows/one-time-diagnose-place-popup-quiz-audit.yml
          git add reports/place-popup-quiz-ci-diagnostic.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Capture place popup quiz audit diagnostic"
          git push origin HEAD:agent/stensparken-place-popup-system
