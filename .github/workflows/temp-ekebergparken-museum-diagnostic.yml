name: Temporary Ekebergparken Museum diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/oslo-coordinate-ekebergparken-museum-production'
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-ekebergparken-museum-production
          fetch-depth: 0

      - name: Extract and run materializer diagnostically
        shell: bash
        run: |
          set -u
          LOGDIR="reports/coordinate-branch-runner/agent_oslo-coordinate-ekebergparken-museum-production"
          mkdir -p "$LOGDIR"
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/temp-ekebergparken-museum-production.yml').read_text()
          start_marker = "          node <<'NODE'\n"
          end_marker = "          NODE\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          Path('/tmp/ekebergparken-museum-materialize.js').write_text(textwrap.dedent(source[start:end]))
          PY
          set +e
          node /tmp/ekebergparken-museum-materialize.js > >(tee "$LOGDIR/materialize-diagnostic.log") 2>&1
          CODE=$?
          set -e
          printf '%s\n' "$CODE" > "$LOGDIR/materialize-diagnostic.exit-code.txt"

      - name: Persist diagnosis
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-ekebergparken-museum-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Diagnose Ekebergparken Museum materializer"
          git push origin HEAD:agent/oslo-coordinate-ekebergparken-museum-production
