name: TEMP Civication Vitenskap Undervisning og forskning prerequisites

on:
  push:
    branches:
      - agent/civication-vitenskap-undervisning-og-forskning-prerequisites-20260908
    paths:
      - scripts/TEMP_materialize_vitenskap_undervisning_og_forskning_prerequisites.mjs
      - .github/workflows/TEMP-civication-vitenskap-undervisning-og-forskning-prerequisites.yml

permissions:
  contents: write

concurrency:
  group: temp-civication-vitenskap-undervisning-og-forskning-prerequisites
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-vitenskap-undervisning-og-forskning-prerequisites-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Require fresh main ancestry before materialization
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'Branch is stale versus main before materialization.' >&2; exit 1; }
      - name: Repair exact TEMP transform hazard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/TEMP_materialize_vitenskap_undervisning_og_forskning_prerequisites.mjs')
          s=p.read_text()
          bad="\n    .replaceAll('forskning','undervisning og forskning')"
          if bad not in s:
              raise SystemExit('Expected exact transform hazard not found; refusing broad repair')
          p.write_text(s.replace(bad,'',1))
          PY
      - name: Syntax
        run: node --check scripts/TEMP_materialize_vitenskap_undervisning_og_forskning_prerequisites.mjs
      - name: Materialize
        run: node scripts/TEMP_materialize_vitenskap_undervisning_og_forskning_prerequisites.mjs
      - name: Align dedicated test with canonical playable policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/civication-vitenskap-undervisning-og-forskning-prerequisites.test.js')
          s=p.read_text()
          old="for(const component of ['entry','day_one','workday_loop','people','places','mail','knowledge','quality_axes','authority','consequences','performance','economy','progression','exit'])assert.equal(career.audit.components[component].level,'complete',component+' must be complete');assert.deepEqual(career.audit.missing_components,[]);"
          new="for(const component of ['entry','day_one','workday_loop','mail','consequences','economy'])assert.equal(career.audit.components[component].level,'complete',component+' runtime component must be complete');for(const component of ['people','places','knowledge','quality_axes','authority'])assert.equal(career.audit.components[component].level,'complete',component+' prerequisite-owned component must be complete');assert.deepEqual(career.audit.missing_components,[]);"
          if old not in s:
              raise SystemExit('Expected exact over-constrained assertion not found; refusing broad test rewrite')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Generate canonical derived surfaces
        run: |
          set -euo pipefail
          node scripts/audit-civication-role-packs.mjs
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
          node scripts/build-civication-scene-registry.mjs --write
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - name: Require zero broken role-pack mappings
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const index=JSON.parse(fs.readFileSync('data/Civication/rolePackIndex.json','utf8'));
          const broken=index.roles.filter((row)=>row.status==='broken_mapping');
          console.log('BROKEN_MAPPING_COUNT='+broken.length);
          if(broken.length){console.log(JSON.stringify(broken,null,2));process.exit(1);}
          NODE
      - name: Require Undervisning og forskning prerequisite debt closed
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('data/Civication/roleWorldRolloutReadiness.json','utf8'));
          const row=r.roles.find(x=>x.key==='vitenskap/vitenskap_undervisning_og_forskning');
          if(!row) throw new Error('vitenskap_undervisning_og_forskning missing from readiness roles');
          console.log(JSON.stringify(row,null,2));
          if(row.classification!=='rollout_ready') throw new Error('Expected rollout_ready, got '+row.classification);
          const authored=row.authored_work_required||[];
          const forbidden=['career:day_one','career:workday_loop','career:people','career:places','career:mail','career:knowledge','persistent_work_object','rhythm_waiting_handoff_rework','history_go_affordance','people_places_integrity','provenance'];
          for(const item of forbidden) if(authored.includes(item)) throw new Error('Prerequisite debt remains: '+item);
          const allowed=new Set(['situated_reputation']);
          for(const item of authored) if(!allowed.has(item)) throw new Error('Unexpected authored work remains: '+item);
          NODE
      - name: Verify Undervisning og forskning prerequisites
        run: node tests/civication-vitenskap-undervisning-og-forskning-prerequisites.test.js
      - name: Verify Vitenskap career architecture
        run: node tests/civication-vitenskap-career-architecture.test.js
      - name: Verify Career Gameplay Matrix
        run: node tests/civication-career-gameplay-matrix.test.js
      - name: Verify Role World readiness
        run: node tests/civication-role-world-rollout-readiness.test.js
      - name: Verify Scene Registry
        run: node scripts/build-civication-scene-registry.mjs --check
      - name: Verify Scenario People index
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
      - name: Verify Scenario People audit
        run: node --test tests/civication-scenario-people.test.mjs
      - name: Verify full Civication suite
        run: node tests/run-civication-tests.mjs
      - name: Verify job learning profiles
        run: npm run audit:job-learning-profiles
      - name: Verify job knowledge requirements
        run: npm run audit:job-knowledge-requirements
      - name: Require fresh main ancestry before scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'Branch became stale before scope verification.' >&2; exit 1; }
      - name: Verify exact permanent prerequisite scope
        shell: bash
        run: |
          set -euo pipefail
          ROLE=vitenskap_undervisning_og_forskning
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          if [ "${#changed[@]}" -ne 24 ]; then
            echo "Expected exactly 24 permanent prerequisite paths, found ${#changed[@]}" >&2
            exit 1
          fi
          expected=(
            data/Civication/careerGameplayMatrix.json
            data/Civication/compiledSceneRegistryV1.json
            data/Civication/mailFamilies/vitenskap/conflict/${ROLE}_conflict.json
            data/Civication/mailFamilies/vitenskap/consequence/${ROLE}_consequence.json
            data/Civication/mailFamilies/vitenskap/event/${ROLE}_event.json
            data/Civication/mailFamilies/vitenskap/followup/${ROLE}_followup.json
            data/Civication/mailFamilies/vitenskap/job/${ROLE}_job.json
            data/Civication/mailFamilies/vitenskap/knowledge/${ROLE}_knowledge.json
            data/Civication/mailFamilies/vitenskap/micro/${ROLE}_micro.json
            data/Civication/mailFamilies/vitenskap/people/${ROLE}_people.json
            data/Civication/mailFamilies/vitenskap/story/${ROLE}_story.json
            data/Civication/mailPlans/vitenskap/${ROLE}_plan.json
            data/Civication/roleModels/manifest.json
            data/Civication/roleModels/vitenskap/${ROLE}.json
            data/Civication/rolePackIndex.json
            data/Civication/roleWorldRolloutReadiness.json
            data/Civication/scenarioPeople/generated/vitenskap.json
            data/Civication/scenarioPeople_index.json
            data/Civication/workGrammars/vitenskap/${ROLE}.json
            docs/CIVICATION_ROLE_PACK_INDEX.md
            reports/CIVICATION_VITENSKAP_UNDERVISNING_OG_FORSKNING_PREREQUISITES_SOURCE_FIRST.md
            reports/civication-career-gameplay-matrix.md
            reports/civication-role-world-rollout-readiness.md
            tests/civication-vitenskap-undervisning-og-forskning-prerequisites.test.js
          )
          for f in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx "$f" >/dev/null || { echo "Missing expected generated path: $f" >&2; exit 1; }
          done
          for f in "${changed[@]}"; do
            printf '%s\n' "${expected[@]}" | grep -Fx "$f" >/dev/null || { echo "Unexpected generated path: $f" >&2; exit 1; }
          done
          git diff --check
      - name: Require fresh main ancestry before permanent commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'Branch became stale before permanent commit.' >&2; exit 1; }
      - name: Commit permanent verified package
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/TEMP_materialize_vitenskap_undervisning_og_forskning_prerequisites.mjs
          rm -f .github/workflows/TEMP-civication-vitenskap-undervisning-og-forskning-prerequisites.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then echo 'No permanent changes to commit.' >&2; exit 1; fi
          git diff --cached --check
          git status --short
          git commit -m "Complete Vitenskap Undervisning og forskning prerequisites"
          git push origin HEAD:agent/civication-vitenskap-undervisning-og-forskning-prerequisites-20260908
