name: Oslo T–S 09 — original photo distinctness fix
on:
  pull_request:
    paths:
      - 'scripts/production/torshov-photo-20261111.mjs'
      - 'tests/torshov-portrait-contract.test.mjs'
      - '.github/workflows/oslo-ts09-torshov-distinct-photo-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: torshov-ts09-original-photo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rewrite:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/oslo-ts-09-torshov-portrait-20261111
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Produce distinct source-verified 2010 documentary portrait
        run: node scripts/production/torshov-photo-20261111.mjs
      - name: Regenerate exact derived Place and index records
        run: |
          npm run place-open:build
          npm run places:index:build
      - name: Require distinct photo originals and coherent data
        run: |
          node scripts/check-distinct-place-photos.mjs --place data/places/by/oslo/places/torshov.json --require-both
          node --test tests/torshov-portrait-contract.test.mjs
          npm run place-open:check
      - name: Commit only the reviewed, narrowly scoped resulting files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/places/by/torshov_front_portrait.webp data/places/by/oslo/places/torshov.json data/places/places_index.json data/runtime/place-open/torshov.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(torshov): use distinct Wilhelm Joys Andersen 2010 portrait and keep 2018 hero"
            git fetch origin content/oslo-ts-09-torshov-portrait-20261111
            git rebase origin/content/oslo-ts-09-torshov-portrait-20261111
            git push origin HEAD:content/oslo-ts-09-torshov-portrait-20261111
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: torshov-distinct-portrait-review
          path: bilder/places/by/torshov_front_portrait.webp
          if-no-files-found: error
