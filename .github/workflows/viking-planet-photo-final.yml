name: Viking Planet licensed entrance photo final integration
on:
  push:
    branches: [content/oslo-vu-viking-planet-licensed-photo-20261028]
    paths:
      - '.github/workflows/viking-planet-photo-final.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/oslo-vu-viking-planet-licensed-photo-20261028
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Produce cropped high-resolution CC BY-SA 4.0 image
        run: |
          python3 -m pip install --user --quiet pillow
          python3 scripts/build-viking-planet-licensed-photo.py
      - name: Build place runtime and run targeted test
        run: |
          npm ci --no-audit --no-fund
          npm run place-open:build
          node --test tests/oslo-vu-viking-planet-photo.test.mjs
      - name: Commit licensed image and place runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/places/viking_planet_oslo_entrance_2020.jpg data/runtime/place-open/viking_planet_oslo.json
          if ! git diff --cached --quiet; then git commit -m "Viking Planet: publish licensed cropped entrance photograph"; fi
          git push origin HEAD:content/oslo-vu-viking-planet-licensed-photo-20261028
