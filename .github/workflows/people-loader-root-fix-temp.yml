name: People loader root fix temp

on:
  push:
    branches:
      - agent/people-loader-root-fix

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/people-loader-root-fix
          fetch-depth: 0

      - name: Repair People runtime and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          boot_path = Path('js/boot-fast.js')
          boot = boot_path.read_text()

          boot = boot.replace('  let revalidateOpenPlacePeopleFiles = null;\n', '')

          schedule_pattern = re.compile(
              r'  function scheduleCurrentPlacePeopleRefresh\(\) \{.*?\n  \}\n\n  function updatePeopleSurfaceState\(\) \{',
              re.S,
          )
          schedule_replacement = '''  function scheduleCurrentPlacePeopleRefresh() {
            if (!peopleDataUsable() || currentPlacePeopleRefreshScheduled) return;
            currentPlacePeopleRefreshScheduled = true;

            setTimeout(() => {
              currentPlacePeopleRefreshScheduled = false;
              const place = getCurrentPlaceCardPlace();
              if (!place || typeof window.openPlaceCard !== "function") return;
              Promise.resolve(window.openPlaceCard(place)).catch(error => {
                console.warn("[boot-fast] refresh People-runding failed", error);
              });
            }, 0);
          }

          function updatePeopleSurfaceState() {'''
          boot, count = schedule_pattern.subn(schedule_replacement, boot, count=1)
          assert count == 1, f'scheduleCurrentPlacePeopleRefresh replacement count={count}'

          old_ready = '''    const placeId = getCurrentPlaceId();
            const placeNeedsRevalidation = typeof window.HG_SHOULD_DEFER_PEOPLE_FOR_PLACE === "function"
              && window.HG_SHOULD_DEFER_PEOPLE_FOR_PLACE(placeId);
            const ready = peopleAndRelationsReady() && !placeNeedsRevalidation;'''
          new_ready = '''    const placeId = getCurrentPlaceId();
            // Et åpent sted er visningsklart straks én brukbar profil finnes.
            // Hele globale People-katalogen og alle relasjoner trenger ikke være ferdige.
            const ready = hasVisiblePeopleForPlace(placeId) || peopleAndRelationsReady();'''
          assert old_ready in boot, 'ready/revalidation block not found'
          boot = boot.replace(old_ready, new_ready, 1)

          old_handle = '''  function handlePeopleDataChange() {
            schedulePeopleSurfaceUpdate();
            scheduleCurrentPlacePeopleRefresh();
            void revalidateOpenPlacePeopleFiles?.();
          }'''
          new_handle = '''  function handlePeopleDataChange() {
            schedulePeopleSurfaceUpdate();
            scheduleCurrentPlacePeopleRefresh();
          }

          function handlePeopleProgress() {
            // Fremdriftsmeldinger for irrelevante filer skal ikke åpne PlaceCard på nytt.
            schedulePeopleSurfaceUpdate();
          }'''
          assert old_handle in boot, 'handlePeopleDataChange block not found'
          boot = boot.replace(old_handle, new_handle, 1)

          boot = boot.replace('''        const observer = new MutationObserver(() => {
                  schedulePeopleSurfaceUpdate();
                  void revalidateOpenPlacePeopleFiles?.();
                });''', '''        const observer = new MutationObserver(() => {
                  schedulePeopleSurfaceUpdate();
                });''', 1)

          old_events = '''    [
              "hg:people-loading",
              "hg:people-progress",
              "hg:people-priority-ready",
              "hg:people-place-revalidation-needed",
              "hg:people-ready",
              "hg:people-error",
              "hg:relations-loading",
              "hg:relations-ready",
              "hg:relations-error",
              "hg:city-packages-people-ready",
              "hg:city-packages-relations-ready"
            ].forEach(eventName => window.addEventListener(eventName, handlePeopleDataChange));'''
          new_events = '''    [
              "hg:people-loading",
              "hg:people-partial-ready",
              "hg:people-ready",
              "hg:people-error",
              "hg:relations-loading",
              "hg:relations-ready",
              "hg:relations-error",
              "hg:city-packages-people-ready",
              "hg:city-packages-relations-ready"
            ].forEach(eventName => window.addEventListener(eventName, handlePeopleDataChange));
            window.addEventListener("hg:people-progress", handlePeopleProgress);'''
          assert old_events in boot, 'People event bridge block not found'
          boot = boot.replace(old_events, new_events, 1)

          people_function_pattern = re.compile(
              r'  function loadPeopleBackground\(\) \{.*?\n  \}\n\n  function startPriorityPeopleDataLoad\(\) \{',
              re.S,
          )
          people_function = r'''  function loadPeopleBackground() {
            if (peopleLoadPromise) return peopleLoadPromise;
            if (window.HG_PEOPLE_READY && Array.isArray(window.PEOPLE)) return Promise.resolve(window.PEOPLE);

            peopleLoadPromise = (async () => {
              setPeopleDataState("loading", { phase: "manifest" });
              const manifest = await fetchJSON("data/people/manifest.json", { cache: "no-store" });
              if (!manifest || !Array.isArray(manifest.files)) {
                throw new Error("People-manifestet kunne ikke lastes");
              }

              const peopleFiles = [...new Set(manifest.files.map(normalizePeoplePath).filter(Boolean))];
              if (!peopleFiles.length) throw new Error("People-manifestet inneholder ingen filer");

              const progressStep = Math.max(1, Math.ceil(peopleFiles.length / 20));
              const loadedRowsByFile = new Map();
              const knownManifestIds = new Set();

              const normalizePlaceToken = value => String(value || "")
                .trim()
                .toLowerCase()
                .replace(/\.json$/i, "")
                .replace(/[^a-z0-9]+/g, "_")
                .replace(/^_+|_+$/g, "");

              const priorityFilesByPlace = new Map(
                Object.entries(manifest.priorityFilesByPlace || {}).map(([placeId, entries]) => [
                  String(placeId || "").trim(),
                  new Set((Array.isArray(entries) ? entries : [])
                    .map(normalizePeoplePath)
                    .filter(file => peopleFiles.includes(file)))
                ])
              );

              const hasPlaceSegment = (file, placeId) => {
                const placeToken = normalizePlaceToken(placeId);
                if (!placeToken) return false;
                return String(file).split("/").some(segment => normalizePlaceToken(segment) === placeToken);
              };

              const isPriorityFileForPlace = (file, placeId) => Boolean(
                hasPlaceSegment(file, placeId)
                || priorityFilesByPlace.get(String(placeId || "").trim())?.has(file)
              );
              const prioritizeOpenPlace = file => isPriorityFileForPlace(file, getCurrentPlaceId());

              const personPlaceIds = person => [
                person?.placeId,
                person?.place_id,
                person?.place,
                person?.places,
                person?.placeIds,
                person?.place_ids,
                person?.source_place_id
              ].flatMap(value => Array.isArray(value) ? value : [value])
                .map(value => String(value || "").trim())
                .filter(Boolean);

              const rowVisibleForPlace = (person, placeId) => {
                const pid = String(placeId || "").trim();
                if (!pid || !person) return false;
                const holdbacks = (Array.isArray(person?.roundHoldbacks) ? person.roundHoldbacks : [])
                  .map(value => String(value || "").trim());
                if (holdbacks.includes(pid)) return false;
                return personPlaceIds(person).includes(pid);
              };

              const relationPersonIdsForPlace = placeId => {
                const pid = String(placeId || "").trim();
                const ids = new Set();
                for (const relation of (Array.isArray(window.RELATIONS) ? window.RELATIONS : [])) {
                  const directPlace = String(
                    relation?.placeId || relation?.place_id || relation?.place || ""
                  ).trim();
                  const fromType = String(relation?.fromType || relation?.from_type || "").trim();
                  const toType = String(relation?.toType || relation?.to_type || "").trim();
                  const fromId = String(relation?.fromId || relation?.from_id || "").trim();
                  const toId = String(relation?.toId || relation?.to_id || "").trim();
                  const relationPlace = directPlace
                    || (fromType === "place" ? fromId : "")
                    || (toType === "place" ? toId : "");
                  if (relationPlace !== pid) continue;
                  [
                    relation?.personId,
                    relation?.person_id,
                    relation?.person,
                    fromType === "person" ? fromId : "",
                    toType === "person" ? toId : ""
                  ].map(value => String(value || "").trim())
                    .filter(Boolean)
                    .forEach(id => ids.add(id));
                }
                return ids;
              };

              const rowsAffectOpenPlace = rows => {
                const placeId = getCurrentPlaceId();
                if (!placeId) return false;
                const relationIds = relationPersonIdsForPlace(placeId);
                return (Array.isArray(rows) ? rows : []).some(person => {
                  const id = String(person?.id || "").trim();
                  const holdbacks = (Array.isArray(person?.roundHoldbacks) ? person.roundHoldbacks : [])
                    .map(value => String(value || "").trim());
                  if (holdbacks.includes(placeId)) return false;
                  return rowVisibleForPlace(person, placeId) || (id && relationIds.has(id));
                });
              };

              const publishLoadedRows = ({ url = "", rows = [], forceRefresh = false } = {}) => {
                const manifestRows = peopleFiles.flatMap(file => loadedRowsByFile.get(file) || []);
                const existingExternalPeople = (Array.isArray(window.PEOPLE) ? window.PEOPLE : [])
                  .filter(person => !knownManifestIds.has(String(person?.id || "").trim()));
                window.PEOPLE = mergeRowsById(manifestRows, existingExternalPeople);

                const affectsOpenPlace = forceRefresh || rowsAffectOpenPlace(rows);
                if (affectsOpenPlace) {
                  emit("hg:people-partial-ready", {
                    placeId: getCurrentPlaceId(),
                    count: window.PEOPLE.length,
                    file: url
                  });
                  handlePeopleDataChange();
                }
                return window.PEOPLE;
              };

              const rememberRows = ({ url, rows, ok }) => {
                if (!ok) return;
                const normalizedRows = Array.isArray(rows) ? rows : [];
                for (const row of normalizedRows) {
                  const id = String(row?.id || "").trim();
                  if (id) knownManifestIds.add(id);
                }
                loadedRowsByFile.set(url, normalizedRows);
                // Viktigste kontrakt: People blir tilgjengelig fil for fil. UI skal
                // aldri vente på at hele manifestet er ferdig før brukbare profiler finnes.
                publishLoadedRows({ url, rows: normalizedRows });
              };

              const firstPass = await loadRowsWithConcurrency(
                peopleFiles,
                "people",
                PEOPLE_FETCH_CONCURRENCY,
                detail => {
                  rememberRows(detail);
                  if (
                    detail.completed === 1
                    || detail.completed === detail.total
                    || detail.completed % progressStep === 0
                  ) {
                    emit("hg:people-progress", {
                      completed: detail.completed,
                      total: detail.total,
                      failed: detail.failed
                    });
                  }
                },
                prioritizeOpenPlace
              );

              // En filfeil kan gi et hull, men får aldri vetorett over profiler
              // som allerede er lastet. Mislykkede filer får ett roligere retry.
              const retry = firstPass.failed.length
                ? await loadRowsWithConcurrency(
                  firstPass.failed,
                  "people",
                  2,
                  rememberRows,
                  prioritizeOpenPlace
                )
                : { rows: [], failed: [] };

              const failedFiles = retry.failed;
              const loadedRows = peopleFiles.flatMap(file => loadedRowsByFile.get(file) || []);
              if (!loadedRows.length && failedFiles.length === peopleFiles.length) {
                throw new Error("Ingen People-filer kunne lastes");
              }

              const peopleAll = publishLoadedRows({ forceRefresh: true });
              setPeopleDataState("ready", {
                count: peopleAll.length,
                files: peopleFiles.length,
                failedFiles: failedFiles.length,
                concurrency: PEOPLE_FETCH_CONCURRENCY,
                priorityFiles: peopleFiles.filter(file => isPriorityFileForPlace(file, getCurrentPlaceId())).length,
                partial: failedFiles.length > 0
              });
              return peopleAll;
            })().catch(error => {
              peopleLoadPromise = null;
              setPeopleDataState("error", { message: String(error?.message || error) });
              throw error;
            });

            return peopleLoadPromise;
          }

          function startPriorityPeopleDataLoad() {'''
          boot, count = people_function_pattern.subn(people_function, boot, count=1)
          assert count == 1, f'loadPeopleBackground replacement count={count}'

          for forbidden in [
              'HG_SHOULD_DEFER_PEOPLE_FOR_PLACE',
              'hg:people-place-revalidation-needed',
              'revalidateOpenPlacePeopleFiles',
              'failedRevalidationKeys',
              'revalidatedFiles',
          ]:
              assert forbidden not in boot, f'forbidden revalidation gate remains: {forbidden}'

          boot_path.write_text(boot)

          popup_path = Path('js/ui/popup-utils.js')
          popup = popup_path.read_text()
          popup_pattern = re.compile(
              r'\n  const shouldDefer = typeof window\.HG_SHOULD_DEFER_PEOPLE_FOR_PLACE === "function".*?\n    return \[\];\n  \}\n',
              re.S,
          )
          popup, count = popup_pattern.subn('\n', popup, count=1)
          assert count == 1, f'popup People veto replacement count={count}'
          assert 'HG_SHOULD_DEFER_PEOPLE_FOR_PLACE' not in popup
          assert 'hg:people-place-revalidation-needed' not in popup
          popup_path.write_text(popup)

          epoke_path = Path('js/ui/place-card-epoke.js')
          epoke = epoke_path.read_text()
          marker = '// ============================================================\n// People-rundingen – stale-while-revalidate'
          assert marker in epoke, 'SWR compatibility block not found'
          epoke = epoke.split(marker, 1)[0].rstrip() + '\n'
          epoke_path.write_text(epoke)

          background_test = r'''#!/usr/bin/env node
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const vm = require("node:vm");

          const boot = fs.readFileSync(path.join(__dirname, "..", "js", "boot-fast.js"), "utf8");
          const popup = fs.readFileSync(path.join(__dirname, "..", "js", "ui", "popup-utils.js"), "utf8");
          const epoke = fs.readFileSync(path.join(__dirname, "..", "js", "ui", "place-card-epoke.js"), "utf8");

          assert.match(boot, /function startPriorityPeopleDataLoad\(\)/);
          assert.match(boot, /function loadRowsWithConcurrency\(/);
          assert.match(boot, /PEOPLE_FETCH_CONCURRENCY/);
          assert.match(boot, /hg:people-partial-ready/);
          assert.match(boot, /publishLoadedRows/);
          assert.match(boot, /window\.PEOPLE = mergeRowsById\(manifestRows, existingExternalPeople\)/);
          assert.doesNotMatch(boot, /HG_SHOULD_DEFER_PEOPLE_FOR_PLACE/);
          assert.doesNotMatch(boot, /people-place-revalidation-needed/);
          assert.doesNotMatch(popup, /HG_SHOULD_DEFER_PEOPLE_FOR_PLACE/);
          assert.doesNotMatch(epoke, /stale-while-revalidate/);

          function makeEventTarget(target = {}) {
            const listeners = new Map();
            target.addEventListener = (name, handler) => {
              const rows = listeners.get(name) || [];
              rows.push(handler);
              listeners.set(name, rows);
            };
            target.dispatchEvent = (event) => {
              for (const handler of listeners.get(event.type) || []) handler.call(target, event);
              return true;
            };
            return target;
          }

          class FakeCustomEvent {
            constructor(type, options = {}) { this.type = type; this.detail = options.detail; }
          }

          class FakeElement {
            constructor(id, { emptyText = "" } = {}) {
              this.id = id;
              this.dataset = {};
              this.innerHTML = "";
              this.hidden = false;
              this.attributes = new Map();
              this.emptyNode = emptyText ? { textContent: emptyText } : null;
              this.hasRenderedPeople = false;
              this.classList = { toggle() {}, add() {}, remove() {}, contains() { return false; } };
            }
            querySelector(selector) {
              if (selector === "img") return this.innerHTML.includes("<img") ? {} : null;
              if (selector === ".pc-round-count") {
                const match = this.innerHTML.match(/pc-round-count[^>]*>([^<]*)</);
                return match ? { textContent: match[1] } : null;
              }
              if (selector === ".pc-empty") return this.emptyNode;
              if (selector === "[data-person]" || selector === "[data-person], .pc-relations-section") {
                return this.hasRenderedPeople ? {} : null;
              }
              if (selector === ".places-loading-text") return null;
              return null;
            }
            setAttribute(name, value) { this.attributes.set(name, String(value)); }
            removeAttribute(name) { this.attributes.delete(name); }
            addEventListener() {}
          }

          const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function waitUntil(predicate, message, timeoutMs = 500) {
            const start = Date.now();
            while (!predicate()) {
              if (Date.now() - start > timeoutMs) throw new Error(message);
              await delay(2);
            }
          }

          (async () => {
            const lifecycle = [];
            const attempts = new Map();
            let activePeopleFetches = 0;
            let maxPeopleFetches = 0;
            let refreshCalls = 0;
            const refreshRelationStates = [];
            let mutationCallback = null;

            const placeCard = new FakeElement("placeCard");
            const peopleIcon = new FakeElement("pcPeopleIcon");
            const peopleList = new FakeElement("pcPeopleList", { emptyText: "Ingen personer ennå" });
            const elements = new Map([["placeCard", placeCard], ["pcPeopleIcon", peopleIcon], ["pcPeopleList", peopleList]]);
            const document = makeEventTarget({
              readyState: "complete",
              getElementById(id) { return elements.get(id) || null; }
            });

            const window = makeEventTarget({
              requestAnimationFrame(callback) { return setTimeout(callback, 0); },
              requestIdleCallback(callback) { return setTimeout(() => callback({ didTimeout: false, timeRemaining: () => 50 }), 0); },
              DataHub: {
                async loadPlacesBase() { return [{ id: "place-1", name: "Teststed" }]; },
                async loadNature() {},
                async loadLesespor() {}
              },
              HGMap: { getMap() { return null; }, initMap() { return {}; }, setPlaces() {}, setOnPlaceClick() {}, refreshMarkers() {} },
              HGStories: { async init() {} },
              HGEvents: { async init() {} },
              HGBrands: { async init() {} },
              async openPlaceCard() {
                refreshCalls += 1;
                refreshRelationStates.push(window.HG_RELATIONS_READY);
                const count = (window.PEOPLE || []).filter(person => (person.place_ids || []).includes("place-1")).length;
                peopleIcon.innerHTML = `<span class="pc-round-emoji">👥</span><span class="pc-round-count">${count}</span>`;
                peopleIcon.dataset.roundReady = count > 0 ? "true" : "false";
                peopleList.hasRenderedPeople = count > 0;
                return true;
              }
            });

            const peopleFiles = [
              ...Array.from({ length: 6 }, (_, index) => `people/test/unrelated-${index + 1}.json`),
              "people/by/oslo/priority.json",
              "people/by/oslo/outage.json"
            ];

            function response(data, ok = true) { return { ok, async json() { return data; } }; }
            async function fetchMock(input, init = {}) {
              const url = String(input).replace(/^\//, "");
              if (url === "data/people/manifest.json") {
                return response({
                  files: peopleFiles,
                  priorityFilesByPlace: {
                    "place-1": ["people/by/oslo/priority.json", "people/by/oslo/outage.json"]
                  }
                });
              }
              if (url.startsWith("data/people/")) {
                const n = (attempts.get(url) || 0) + 1;
                attempts.set(url, n);
                activePeopleFetches += 1;
                maxPeopleFetches = Math.max(maxPeopleFetches, activePeopleFetches);
                await delay(url.endsWith("priority.json") ? 5 : 18);
                activePeopleFetches -= 1;
                if (url.endsWith("outage.json")) return response(null, false);
                if (url.endsWith("priority.json")) {
                  assert.equal(init.cache, "reload", "åpent steds prioritetsfil skal lastes med reload");
                  return response({ id: "person-visible", name: "Synlig", place_ids: ["place-1"] });
                }
                return response({ people: [{ id: url.split("/").pop().replace(".json", ""), place_ids: ["other"] }] });
              }
              if (url === "data/relations.json") { await delay(80); return response({ relations: [] }); }
              if (url === "data/relations_philanthropy.json") return response({ relations: [] });
              if (url === "data/wonderkammer/index.json") return response({ files: ["data/wonderkammer/base.json"] });
              if (url === "data/wonderkammer/base.json") return response({ places: [], people: [] });
              if (url === "data/tags.json") return response([]);
              throw new Error(`Unexpected fetch: ${url}`);
            }

            const context = {
              window,
              document,
              location: { hostname: "localhost", hash: "" },
              localStorage: { getItem() { return null; }, setItem() {} },
              navigator: { hardwareConcurrency: 8 },
              fetch: fetchMock,
              CustomEvent: FakeCustomEvent,
              MutationObserver: class { constructor(cb) { mutationCallback = cb; } observe() {} },
              performance: { now: () => Date.now() },
              console: { ...console, warn() {} },
              setTimeout,
              clearTimeout,
              Promise
            };
            context.globalThis = context;
            vm.runInNewContext(boot, context, { filename: "boot-fast.js" });

            window.addEventListener("hg:people-partial-ready", () => lifecycle.push("partial"));
            window.addEventListener("hg:people-ready", () => lifecycle.push("ready"));

            peopleIcon.innerHTML = '<span class="pc-round-emoji">👥</span><span class="pc-round-count">0</span>';
            peopleIcon.dataset.roundReady = "false";
            await window.bootCritical();
            placeCard.dataset.currentPlaceId = "place-1";
            mutationCallback?.([]);

            await waitUntil(
              () => (window.PEOPLE || []).some(person => person.id === "person-visible"),
              "prioritert People-profil ble ikke publisert progressivt"
            );
            await waitUntil(() => refreshCalls > 0, "PlaceCard ble ikke oppdatert av progressiv People-profil");

            assert.equal(window.HG_PEOPLE_READY, false, "global People-last skal fortsatt kunne pågå");
            assert.equal(refreshRelationStates[0], false, "direkte People skal vises før hele relasjonsregisteret er klart");
            assert.ok(lifecycle.includes("partial"), "progressiv People-event mangler");
            assert.match(peopleIcon.innerHTML, />1</, "People-rundingen skal vise profilen, ikke 0");

            await window.bootBackground();
            await delay(20);

            assert.equal(window.HG_PEOPLE_READY, true);
            assert.ok((window.PEOPLE || []).some(person => person.id === "person-visible"), "vedvarende feil i en annen prioritetsfil skjulte gyldig profil");
            assert.equal(attempts.get("data/people/by/oslo/outage.json"), 2, "feilet People-fil skal få nøyaktig ett retry");
            assert.ok(maxPeopleFetches > 1 && maxPeopleFetches <= 6, `ugyldig People-parallellitet: ${maxPeopleFetches}`);
            assert.ok(lifecycle.indexOf("partial") < lifecycle.indexOf("ready"), "partial må komme før full ready");

            console.log("People publishes progressively and one failed file cannot force a false zero");
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          '''
          # Dedent because the workflow heredoc itself is indented.
          import textwrap
          Path('tests/background-boot-pacing.test.js').write_text(textwrap.dedent(background_test))

          torg_path = Path('tests/torggata-phase12-people-links.test.mjs')
          torg = torg_path.read_text()
          swr_pattern = re.compile(r'\ntest\("pending People revalidation keeps usable profiles visible".*?\n\}\);\n?$', re.S)
          swr_replacement = r'''
          test("People resolver never hides loaded Torggata profiles behind freshness state",()=>{
            const popupSource=fs.readFileSync(path.join(ROOT,"js/ui/popup-utils.js"),"utf8");
            const epokeSource=fs.readFileSync(path.join(ROOT,"js/ui/place-card-epoke.js"),"utf8");
            assert.doesNotMatch(popupSource,/HG_SHOULD_DEFER_PEOPLE_FOR_PLACE/);
            assert.doesNotMatch(popupSource,/people-place-revalidation-needed/);
            assert.doesNotMatch(epokeSource,/stale-while-revalidate/);
            assert.deepEqual(runtimePeopleForTorggata().map(p=>p.id).sort(),requiredVisible.slice().sort());
          });
          '''
          torg, count = swr_pattern.subn('\n' + textwrap.dedent(swr_replacement).strip() + '\n', torg, count=1)
          assert count == 1, f'Torggata SWR test replacement count={count}'
          torg_path.write_text(torg)
          PY

      - name: Validate repair
        shell: bash
        run: |
          node --check js/boot-fast.js
          node --check js/ui/popup-utils.js
          node --check js/ui/place-card-epoke.js
          node tests/background-boot-pacing.test.js
          node --test tests/torggata-phase12-people-links.test.mjs
          git diff --check

      - name: Commit repair and remove temp workflow
        shell: bash
        run: |
          git config user.name "History Go repair bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/people-loader-root-fix-temp.yml
          git add js/boot-fast.js js/ui/popup-utils.js js/ui/place-card-epoke.js tests/background-boot-pacing.test.js tests/torggata-phase12-people-links.test.mjs
          git commit -m "Fiks People-loader ved roten [people-root-fix-applied]"
          git push origin HEAD:agent/people-loader-root-fix
