name: TEMP Bogstadveien semantic replay

on:
  push:
    branches:
      - control/bogstadveien-semantic-replay-20260904

permissions:
  contents: write

concurrency:
  group: tmp-bogstadveien-semantic-replay
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare clean current-main replay
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main work/bogstadveien-production-final-20260904 work/bogstadveien-completion-20260903
          remote_sha="$(git rev-parse origin/work/bogstadveien-production-final-20260904)"
          echo "REMOTE_SHA=$remote_sha" >> "$GITHUB_ENV"
          git show origin/work/bogstadveien-completion-20260903:tools/finalize-bogstadveien-completion.mjs > /tmp/finalize-bogstadveien-completion.mjs
          git checkout -B work/bogstadveien-production-final-20260904 origin/main
          cp /tmp/finalize-bogstadveien-completion.mjs tools/finalize-bogstadveien-completion.mjs

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prefetch canonical Commons assets
        run: |
          set -euo pipefail
          mkdir -p .cache/bogstadveien-completion
          UA='History-Go-place-production/1.0 (https://github.com/Paradispartiet/History-Go)'
          fetch_asset() {
            url="$1"
            output="$2"
            curl -fL --retry 8 --retry-delay 5 --retry-max-time 180 --retry-all-errors -A "$UA" -o "$output" "$url"
            test "$(stat -c%s "$output")" -gt 1000
          }
          fetch_asset 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Bogstadveien.jpg' '.cache/bogstadveien-completion/bogstadveien.jpg'
          sleep 3
          fetch_asset 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Bogstadveien%2037%20IV.jpg' '.cache/bogstadveien-completion/bogstadveien-37-iv.jpg'
          sleep 3
          fetch_asset 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Bogstadveien%2039.jpg' '.cache/bogstadveien-completion/bogstadveien-39.jpg'

      - name: Align finalizer with current canonical contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/finalize-bogstadveien-completion.mjs')
          s = p.read_text()
          patches = [
            (
              '''const quizManifest=read("data/quiz/manifest.json"); const rows=(quizManifest.targets||[]).filter(row=>row.targetId===placeId); if(rows.length!==1)throw new Error(`Expected exactly one Bogstadveien quiz manifest row, got ${rows.length}`); rows[0].file=quizFile; write("data/quiz/manifest.json",quizManifest);''',
              '''const quizManifest=read("data/quiz/manifest.json"); const rows=(quizManifest.sets||[]).filter(row=>row.targetId===placeId); if(rows.length!==1)throw new Error(`Expected exactly one Bogstadveien quiz manifest row, got ${rows.length}`); rows[0].file=quizFile; write("data/quiz/manifest.json",quizManifest);''',
              'quiz manifest'
            ),
            (
              '''let contextBuilt=false; try{await runBuildQuizProductionContext(["--category","by","--target",placeId,"--output","data/quiz/production_context/by/bogstadveien.json"]);contextBuilt=true;}catch(error){console.error("Quiz context builder failed; leaving source brief for explicit repair:",error?.message||error);} if(!contextBuilt)write("data/quiz/production_context/by/bogstadveien.json",{schema_version:"1.0",categoryId:"by",targetId:placeId,generated_at:verifiedAt,source_brief:briefFile,profile_decision:brief.profile_decision,selected_curriculum:brief.selected_curriculum,existing_quiz_audit:brief.existing_quiz_audit,source_inventory:Object.entries(sourceMap).map(([id,value])=>({id,...value})),status:"materialized_from_reviewed_source_brief"});''',
              '''let contextBuilt=false; try{await runBuildQuizProductionContext({root,categoryId:"by",targetId:placeId,outputPath:"data/quiz/production_context/by/bogstadveien.json"});contextBuilt=true;}catch(error){console.error("Quiz context builder failed; leaving source brief for explicit repair:",error?.message||error);} if(!contextBuilt)write("data/quiz/production_context/by/bogstadveien.json",{schema_version:"1.0",categoryId:"by",targetId:placeId,generated_at:verifiedAt,source_brief:briefFile,profile_decision:brief.profile_decision,selected_curriculum:brief.selected_curriculum,existing_quiz_audit:brief.existing_quiz_audit,source_inventory:Object.entries(sourceMap).map(([id,value])=>({id,...value})),status:"materialized_from_reviewed_source_brief"});''',
              'quiz context builder'
            ),
            (
              '''assert.doesNotMatch(JSON.stringify(quiz.profile_snapshot),/høy kjøpekraft|prisnivå/i);''',
              '''const economicProfileText=JSON.stringify({signature_features:quiz.profile_snapshot.signature_features,must_include:quiz.profile_snapshot.must_include,primary_angles:quiz.profile_snapshot.primary_angles,question_families:quiz.profile_snapshot.question_families});assert.doesNotMatch(economicProfileText,/kjøpekraft|prisnivå/i);assert.match(quiz.profile_snapshot.notes,/uten å utlede/i);''',
              'quiz regression'
            ),
            (
              '''score: { narrative: 4, historical: 3, source: 5, play_value: 3, originality: 3, total: 18 }''',
              '''score: { narrative: 3, historical: 2, source: 4, play_value: 3, originality: 3, total: 15 }''',
              'story score'
            ),
            (
              '''assert.equal(stories[0].score.total,18);''',
              '''assert.equal(stories[0].score.total,15);''',
              'story score regression'
            ),
          ]
          for old, new, label in patches:
              if s.count(old) != 1:
                  raise SystemExit(f'{label} patch anchor count: {s.count(old)}')
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Materialize Bogstadveien on current main
        run: node tools/finalize-bogstadveien-completion.mjs

      - name: Repair governance claims and record current READ-FIRST evidence
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const placePath = 'data/places/by/oslo/places/bogstadveien.json';
          const packetPath = 'data/places/production/bogstadveien.json';
          const workcardPath = 'reports/place-production/bogstadveien-workcard-current.json';
          const place = JSON.parse(fs.readFileSync(placePath, 'utf8'));
          const packet = JSON.parse(fs.readFileSync(packetPath, 'utf8'));
          const workcard = JSON.parse(fs.readFileSync(workcardPath, 'utf8'));
          const replacements = [
            ['Bogstadveien fikk navn i 1879 etter Bogstad gård og ble en av vestbyens viktigste handelsgater da den elektriske trikken kom i 1894.', 'Bogstadveien fikk navn i 1879 etter Bogstad gård og ble en sentral handelsgate i vestbyen da den elektriske trikken kom i 1894.'],
            ['Leiegårdene fra 1890-årene rommer fortsatt butikker i første etasje.', 'Leiegårdene fra 1890-årene rommer fortsatt butikker i gateplanet.'],
            ['Da den elektriske sporveien nådde Majorstuen gjennom Bogstadveien i 1894, ble gaten en av vestbyens viktigste forbindelser.', 'Da den elektriske sporveien nådde Majorstuen gjennom Bogstadveien i 1894, ble gaten en sentral forbindelse i vestbyen.'],
            ['Gaten er derfor et sammenhengende stykke transport- og handelshistorie: gammel landevei, trikkelinje fra 1894, leiegårder fra 1890-årene, en nedlagt undergrunnsstasjon og butikker som spenner fra mer enn hundre års drift til stadig nye virksomheter.', 'Gaten viser et sammenhengende stykke transport- og handelshistorie: gammel landevei, trikkelinje fra 1894, leiegårder fra 1890-årene, en nedlagt undergrunnsstasjon og butikker som spenner fra mer enn hundre års drift til stadig nye virksomheter.']
          ];
          function replaceExact(text, before, after, label) {
            const count = text.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: expected one exact replacement, found ${count}`);
            return text.replace(before, after);
          }
          place.desc = replaceExact(place.desc, ...replacements[0], 'place.desc sentence 1');
          place.desc = replaceExact(place.desc, ...replacements[1], 'place.desc sentence 2');
          place.popupDesc = replaceExact(place.popupDesc, ...replacements[2], 'place.popupDesc sentence 3');
          place.popupDesc = replaceExact(place.popupDesc, ...replacements[3], 'place.popupDesc sentence 19');
          const claimReplacements = new Map([
            ['claim_bogstadveien_desc_01', replacements[0]],
            ['claim_bogstadveien_desc_02', replacements[1]],
            ['claim_bogstadveien_popup_03', replacements[2]],
            ['claim_bogstadveien_popup_19', replacements[3]]
          ]);
          for (const claim of packet.claims ?? []) {
            const pair = claimReplacements.get(claim.id);
            if (!pair) continue;
            if (claim.claim !== pair[0]) throw new Error(`${claim.id}: unexpected pre-repair claim text`);
            claim.claim = pair[1];
            claimReplacements.delete(claim.id);
          }
          if (claimReplacements.size) throw new Error(`Missing claims: ${[...claimReplacements.keys()].join(', ')}`);
          const sha256 = (text) => crypto.createHash('sha256').update(String(text), 'utf8').digest('hex');
          packet.textHashes.desc = sha256(place.desc);
          packet.textHashes.popupDesc = sha256(place.popupDesc);
          workcard.schema = 'history_go_place_workcard_v2';
          workcard.category = 'by';
          delete workcard.rule_preflight;
          workcard.branch_status = 'PR';
          workcard.live_status = 'not_live_until_merge';
          fs.writeFileSync(placePath, `${JSON.stringify(place, null, 2)}\n`);
          fs.writeFileSync(packetPath, `${JSON.stringify(packet, null, 2)}\n`);
          fs.writeFileSync(workcardPath, `${JSON.stringify(workcard, null, 2)}\n`);
          NODE
          node scripts/place-production-rule-preflight.mjs record --workcard reports/place-production/bogstadveien-workcard-current.json --place-id bogstadveien --category by
          node scripts/place-production-rule-preflight.mjs validate --workcard reports/place-production/bogstadveien-workcard-current.json

      - name: Rebuild shared derived state from current main plus Bogstadveien
        run: |
          set -euo pipefail
          npm run places:index:build
          npm run place-open:build
          npm run epoker:places:build
          node scripts/build-fagverk-release-manifest.mjs

      - name: Ratchet epoch regression to composed current state
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { buildEpokePlaceIndex } from './scripts/build-epoke-place-index.mjs';
          const index = buildEpokePlaceIndex();
          assert.equal(index.stats.canonical_story_milestone_count, 221);
          assert.equal(index.stats.verified_place_production_milestone_count, 415);
          assert.equal(index.domains.historie.oslo_coverage.canonical_place_count, 587);
          assert.equal(index.domains.historie.oslo_coverage.dated_evidence_place_count, 232);
          assert.equal(index.domains.historie.oslo_coverage.documented_case_place_count, 2);
          assert.equal(index.domains.historie.oslo_coverage.awaiting_source_backed_history_count, 353);
          assert.equal(index.domains.historie.oslo_coverage.places.find((row) => row.place_id === 'bogstadveien')?.status, 'dated_evidence');
          NODE
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/epoke-place-index.test.mjs')
          s = p.read_text()
          replacements = {
              'index.stats.canonical_story_milestone_count, 220': 'index.stats.canonical_story_milestone_count, 221',
              'index.stats.verified_place_production_milestone_count, 407': 'index.stats.verified_place_production_milestone_count, 415',
              'coverage.dated_evidence_place_count, 231': 'coverage.dated_evidence_place_count, 232',
              'coverage.awaiting_source_backed_history_count, 354': 'coverage.awaiting_source_backed_history_count, 353',
              '["akershus_slott", "gamle_radhus"': '["akershus_slott", "bogstadveien", "gamle_radhus"',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'epoch fixture anchor count for {old!r}: {s.count(old)}')
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Validate Bogstadveien and repository contracts
        run: |
          set -euo pipefail
          node scripts/validate-place-description-production-v4_2_policy.mjs --all --report reports/place-description-validation-v4_2.json
          node --test tests/bogstadveien-completion.test.mjs
          node scripts/place-production-rule-preflight.mjs validate --workcard reports/place-production/bogstadveien-workcard-current.json
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run check:stories
          npm run places:index:check
          npm run place-open:check
          npm run epoker:places:check
          node --test tests/epoke-place-index.test.mjs tests/epoker-runtime-place-index.test.mjs tests/epoke-viewer.test.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          git diff --check

      - name: Commit clean exact PR head
        run: |
          set -euo pipefail
          rm -f tools/finalize-bogstadveien-completion.mjs
          rm -rf .cache/bogstadveien-completion
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -E '(^|/)(tmp-bogstadveien|finalize-bogstadveien-completion\.mjs|\.cache/)'; then
            echo 'Temporary artifact leaked into final diff' >&2
            exit 1
          fi
          git commit -m "Replay Bogstadveien on current main and satisfy governance"
          git push --force-with-lease=refs/heads/work/bogstadveien-production-final-20260904:${REMOTE_SHA} origin HEAD:refs/heads/work/bogstadveien-production-final-20260904
