name: Oslo politikk six – regenerate shared artifacts once
on:
  push:
    branches:
      - research/oslo-sentrum-politikk-six-v1-20261023
    paths:
      - '.github/workflows/oslo-politikk-six-finalize-once.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate canonical Knowledge and Fagverk
        run: |
          set -euo pipefail
          npm run knowledge:canonical:write
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit regenerated data on the existing branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/knowledge/knowledge_units.generated.json data/knowledge/concepts.generated.json data/knowledge/terms.generated.json data/knowledge/stories.generated.json data/knowledge/knowledge_emne_review_queue.generated.json data/fagverk/fagverk_release.json reports/knowledge-id-backfill.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Knowledge and Fagverk after safe Oslo politikk merge"
            git push origin HEAD:research/oslo-sentrum-politikk-six-v1-20261023
          fi
