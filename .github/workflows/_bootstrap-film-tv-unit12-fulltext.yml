name: Diagnose and validate Film TV unit 12 fulltext

on:
  push:
    branches:
      - agent/film-tv-unit12-screen-places-fulltext
    paths:
      - ".delivery/film-tv-unit12/READY"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-film-tv-unit12-fulltext
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/film-tv-unit12-screen-places-fulltext
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Make all full sentences claim-specific
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs')
          text = path.read_text()
          start = text.index('function renderParagraph(')
          end = text.index('\n\nfunction buildModule(', start)
          replacement = r'''function renderParagraph({ topic, claim, claimIndex, editorial, selectedSources, selectedCases }) {
            const [primary, secondary, tertiary] = selectedSources;
            const [caseRow, controlCase] = selectedCases;
            const ordinal = claimIndex + 1;
            const inlineProse = (value) => stripTerminalPunctuation(value)
              .replace(/(?<=[.!?])\s+/gu, '; ')
              .replace(/\s+/gu, ' ')
              .trim();
            const lowerInitial = (value) => String(value || '').replace(/^./u, (character) => character.toLocaleLowerCase('nb-NO'));
            const paragraphLabel = `${editorial.title.toLocaleLowerCase('nb-NO')}, fagavsnitt ${ordinal}`;
            const sourceOne = primary
              ? `I ${paragraphLabel} er hovedsporet «${primary.title}» fra ${primary.publisher}: ${inlineProse(primary.source_location)}; kilden avgrenses til ${primary.territory}, med evidensrollen ${primary.evidence_role}.`
              : '';
            const sourceTwo = secondary
              ? `Kontrollsporet i ${paragraphLabel} er «${secondary.title}» fra ${secondary.publisher}: ${inlineProse(secondary.source_location)}; det brukes innenfor ${secondary.territory}.`
              : '';
            const sourceThree = tertiary
              ? `Det tredje kildesporet i ${paragraphLabel}, «${tertiary.title}» fra ${tertiary.publisher}, prøver bare påstandens rekkevidde: ${inlineProse(tertiary.source_location)}.`
              : '';
            const caseSentence = caseRow
              ? `Hovedcaset i ${paragraphLabel} er ${caseRow.work} (${caseRow.medium}; ${caseRow.territory}); det brukes fordi ${lowerInitial(inlineProse(caseRow.purpose))}.`
              : '';
            const controlSentence = controlCase
              ? `Motcaset i ${paragraphLabel} er ${controlCase.work} i ${controlCase.territory}; det avgrenser sammenligningen ved å ${lowerInitial(inlineProse(controlCase.purpose))}.`
              : '';
            return [
              `${editorial.title}, fagavsnitt ${ordinal}: ${inlineProse(claim.claim_focus)}; som analytisk linse brukes ${lowerInitial(inlineProse(editorial.lens))}.`,
              sourceOne,
              sourceTwo,
              sourceThree,
              caseSentence,
              controlSentence,
              `Metodisk behandles sluttpåstanden i ${paragraphLabel} som «${claim.claim_type}»; derfor må verk, versjon, periode, territorium, kildetype og representasjonsgrep navngis, mens motstridende evidens holdes synlig.`,
              `${inlineProse(editorial.disagreement)}; i ${paragraphLabel} brukes denne uenigheten til å kontrollere påstandens omfang, ikke til å introdusere nye sideclaims.`,
              `${inlineProse(editorial.limits[0])}; ${lowerInitial(inlineProse(editorial.limits[1]))}; konklusjonen i ${paragraphLabel} gjelder derfor bare den dokumenterte representasjonen, sirkulasjonen eller minnepraksisen i claimet, mens vist sted, faktisk opptakssted, fiktivt eller sammensatt rom og dokumentert lokal virkning forblir separate nivåer, og samtykke, bilderett, fysisk inngrep, filmturisme samt miljømessig eller økonomisk lokal effekt ligger i enhet 13.`
            ].filter(Boolean).join(' ');
          }'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          rm -f reports/fagverk/film-tv-unit12-bootstrap-failure.log
          rm -rf .delivery/film-tv-unit12

      - name: Run deterministic pipeline with exact log
        id: pipeline
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '== syntax =='
            node --check scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
            node --check scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
            node --check tests/film-tv-screen-places-identity-circulation-fulltext-v1.test.mjs
            echo '== materialize unit 12 =='
            node scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs --write
            echo '== refresh source brief =='
            node scripts/brief-film-tv-screen-places-identity-circulation-sources-v1.mjs --write
            echo '== build release =='
            node scripts/build-fagverk-release-manifest.mjs
            echo '== shared audits =='
            node scripts/audit-fagverk-general-engine.mjs --write-report
            node scripts/audit-fagverk-film-tv-phase3.mjs --write-report
            node scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs --write-report
            node scripts/audit-film-tv-reception-participation-audience-methods-fulltext-v1.mjs --write-report
            node scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs --write-report
          } 2>&1 | tee /tmp/unit12-repair.log

      - name: Publish exact failed state and log
        if: steps.pipeline.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/unit12-repair.log reports/fagverk/film-tv-unit12-bootstrap-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows
          git diff --cached --check
          git commit -m "Publiser reparert enhet 12-diagnostikk"
          git push origin HEAD:agent/film-tv-unit12-screen-places-fulltext
          exit 1

      - name: Validate unit 12 and monotone predecessors
        run: |
          node scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
          node --test tests/film-tv-screen-places-identity-circulation-source-brief-v1.test.mjs
          node --test tests/film-tv-screen-places-identity-circulation-fulltext-v1.test.mjs
          node scripts/audit-film-tv-reception-participation-audience-methods-fulltext-v1.mjs
          node --test tests/film-tv-reception-participation-audience-methods-source-brief-v1.test.mjs
          node --test tests/film-tv-reception-participation-audience-methods-fulltext-v1.test.mjs
          node scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs
          node --test tests/film-tv-industry-regulation-distribution-source-brief-v1.test.mjs
          node --test tests/film-tv-industry-regulation-distribution-fulltext-v1.test.mjs
          node scripts/audit-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs
          node --test tests/film-tv-creative-work-technology-responsibility-fulltext-v1.test.mjs

      - name: Validate shared Film TV baseline
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-film-tv-phase3.test.mjs
          node --test tests/film-tv-learning-order-plan-v1.test.mjs
          node --test tests/film-tv-learning-order-monotone-regression-v1.test.mjs
          node --test tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs

      - name: Verify deterministic regeneration
        run: |
          node scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs --write
          node scripts/brief-film-tv-screen-places-identity-circulation-sources-v1.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/audit-fagverk-film-tv-phase3.mjs --write-report
          node scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs --write-report
          node scripts/audit-film-tv-reception-participation-audience-methods-fulltext-v1.mjs --write-report
          node scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs --write-report
          git diff --check

      - name: Commit validated delivery to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows
          git diff --cached --check
          git commit -m "Fullfør Film og TV-enhet 12 fulltekst"
          git push origin HEAD:agent/film-tv-unit12-screen-places-fulltext
