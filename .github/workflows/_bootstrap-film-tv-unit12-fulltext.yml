name: Bootstrap Film TV unit 12 fulltext delivery

on:
  push:
    branches:
      - agent/film-tv-unit12-screen-places-fulltext
    paths:
      - ".delivery/film-tv-unit12/READY"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-film-tv-unit12-fulltext
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/film-tv-unit12-screen-places-fulltext
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore reviewed delivery payload
        shell: bash
        run: |
          set -euo pipefail
          cat .delivery/film-tv-unit12/payload.part.* > /tmp/unit12payload.b64
          printf '%s  %s\n' \
            '8d1c2c0399991ff978bbc24bc3dfe8c78d49f3f8ea7fd7a87bd6644c791af3c3' \
            '/tmp/unit12payload.b64' | sha256sum -c -
          base64 --decode /tmp/unit12payload.b64 > /tmp/unit12payload.tgz
          tar -tzf /tmp/unit12payload.tgz
          tar -xzf /tmp/unit12payload.tgz
          rm -rf .delivery/film-tv-unit12
          chmod +x \
            scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs \
            scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs

      - name: Syntax — unit 12 materializer
        run: node --check scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
      - name: Syntax — unit 12 audit
        run: node --check scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
      - name: Syntax — unit 12 tests
        run: node --check tests/film-tv-screen-places-identity-circulation-fulltext-v1.test.mjs
      - name: Materialize — unit 12 fulltext
        run: node scripts/materialize-film-tv-screen-places-identity-circulation-fulltext-v1.mjs --write
      - name: Refresh — unit 12 source brief
        run: node scripts/brief-film-tv-screen-places-identity-circulation-sources-v1.mjs --write
      - name: Build — fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Audit — shared general engine
        run: node scripts/audit-fagverk-general-engine.mjs --write-report
      - name: Audit — Film TV phase 3
        run: node scripts/audit-fagverk-film-tv-phase3.mjs --write-report
      - name: Audit — unit 10 monotone
        run: node scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs --write-report
      - name: Audit — unit 11 monotone
        run: node scripts/audit-film-tv-reception-participation-audience-methods-fulltext-v1.mjs --write-report

      - name: Audit — unit 12 write report
        id: unit12_audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs --write-report 2>&1 | tee /tmp/unit12-audit.log

      - name: Publish exact failed state and audit log
        if: steps.unit12_audit.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/unit12-audit.log reports/fagverk/film-tv-unit12-bootstrap-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows
          git diff --cached --check
          git commit -m "Publiser enhet 12-auditdiagnostikk"
          git push origin HEAD:agent/film-tv-unit12-screen-places-fulltext
          exit 1

      - name: Audit — unit 12 validate
        run: node scripts/audit-film-tv-screen-places-identity-circulation-fulltext-v1.mjs
      - name: Test — unit 12 source brief
        run: node --test tests/film-tv-screen-places-identity-circulation-source-brief-v1.test.mjs
      - name: Test — unit 12 fulltext
        run: node --test tests/film-tv-screen-places-identity-circulation-fulltext-v1.test.mjs
      - name: Test — subject inventory
        run: node --test tests/fagverk-subject-inventory.test.mjs
      - name: Test — general engine
        run: node --test tests/fagverk-general-engine.test.mjs
      - name: Test — Film TV phase 3
        run: node --test tests/fagverk-film-tv-phase3.test.mjs
      - name: Test — Film TV learning order
        run: node --test tests/film-tv-learning-order-plan-v1.test.mjs
      - name: Test — learning-order monotone regression
        run: node --test tests/film-tv-learning-order-monotone-regression-v1.test.mjs
      - name: Test — representation monotone regression
        run: node --test tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs
      - name: Test — release manifest
        run: node --test tests/fagverk-release-manifest.test.mjs

      - name: Commit complete delivery to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows
          git diff --cached --check
          git commit -m "Fullfør Film og TV-enhet 12 fulltekst"
          git push origin HEAD:agent/film-tv-unit12-screen-places-fulltext
