name: Temporary extract Nøstvet locality 41534

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/akershus-nostvet-boplass-production
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract exact persisted records and geometry metrics
        shell: bash
        run: |
          set -euo pipefail
          OUT='reports/akershus-coordinate-nostvet-source-probe'
          mkdir -p "$OUT"

          python - <<'PY' | tee "$OUT/exact-41534-summary.txt" >/dev/null
          import json
          import math
          from pathlib import Path

          out = Path('reports/akershus-coordinate-nostvet-source-probe')
          legacy = (59.75109, 10.7996)

          def distance_m(a, b):
              lat1, lon1 = map(math.radians, a)
              lat2, lon2 = map(math.radians, b)
              dlat = lat2 - lat1
              dlon = lon2 - lon1
              h = math.sin(dlat / 2) ** 2 + math.cos(lat1) * math.cos(lat2) * math.sin(dlon / 2) ** 2
              return 6371000 * 2 * math.asin(math.sqrt(h))

          def pairs(coords):
              if not isinstance(coords, list):
                  return []
              if len(coords) >= 2 and all(isinstance(v, (int, float)) for v in coords[:2]):
                  return [(float(coords[0]), float(coords[1]))]
              result = []
              for item in coords:
                  result.extend(pairs(item))
              return result

          localities = json.loads((out / 'riksantikvaren-ogc-lokaliteter-kommune-3218.json').read_text()).get('features', [])
          individuals = json.loads((out / 'riksantikvaren-ogc-enkeltminner-kommune-3218.json').read_text()).get('features', [])

          locality_matches = [
              feature for feature in localities
              if str(feature.get('id')) == '41534' or str((feature.get('properties') or {}).get('kulturminneId')) == '41534'
          ]
          if len(locality_matches) != 1:
              raise SystemExit(f'Expected one locality 41534, found {len(locality_matches)}')
          locality = locality_matches[0]

          individual_matches = {}
          for expected in ('41534-1', '41534-2'):
              matches = [
                  feature for feature in individuals
                  if str(feature.get('id')) == expected or str((feature.get('properties') or {}).get('kulturminneId')) == expected
              ]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one individual {expected}, found {len(matches)}')
              individual_matches[expected] = matches[0]

          (out / 'riksantikvaren-lokalitet-41534.json').write_text(json.dumps(locality, ensure_ascii=False, indent=2) + '\n')
          for expected, feature in individual_matches.items():
              safe = expected.replace('-', '_')
              (out / f'riksantikvaren-enkeltminne-{safe}.json').write_text(json.dumps(feature, ensure_ascii=False, indent=2) + '\n')

          props = locality.get('properties') or {}
          center_data = props.get('senterpunkt') or {}
          center_coords = center_data.get('coordinates') or []
          if len(center_coords) < 2:
              raise SystemExit('Locality 41534 has no official senterpunkt')
          center = (float(center_coords[1]), float(center_coords[0]))
          geom_pairs = pairs((locality.get('geometry') or {}).get('coordinates'))
          vertex_distances = [distance_m(center, (lat, lon)) for lon, lat in geom_pairs]
          print('LOCALITY ' + json.dumps({
              'feature_id': locality.get('id'),
              'properties': props,
              'geometry_type': (locality.get('geometry') or {}).get('type'),
              'official_center_lat': center[0],
              'official_center_lon': center[1],
              'distance_from_legacy_m': round(distance_m(legacy, center), 1),
              'geometry_vertex_count': len(geom_pairs),
              'max_vertex_distance_from_center_m': round(max(vertex_distances), 1) if vertex_distances else None,
              'min_vertex_distance_from_center_m': round(min(vertex_distances), 1) if vertex_distances else None,
          }, ensure_ascii=False, sort_keys=True))

          for expected, feature in individual_matches.items():
              feature_pairs = pairs((feature.get('geometry') or {}).get('coordinates'))
              if feature_pairs:
                  lat = sum(p[1] for p in feature_pairs) / len(feature_pairs)
                  lon = sum(p[0] for p in feature_pairs) / len(feature_pairs)
                  point = (lat, lon)
              else:
                  point = None
              print('INDIVIDUAL ' + json.dumps({
                  'feature_id': expected,
                  'properties': feature.get('properties') or {},
                  'geometry_type': (feature.get('geometry') or {}).get('type'),
                  'vertex_mean_lat': point[0] if point else None,
                  'vertex_mean_lon': point[1] if point else None,
                  'distance_to_locality_center_m': round(distance_m(center, point), 1) if point else None,
              }, ensure_ascii=False, sort_keys=True))
          PY

          rm -f .github/workflows/temporary-coordinate-source-probe-nostvet-41534.yml
          rm -f .github/workflows/temporary-coordinate-source-extract-nostvet-41534.yml

          # Remove broad intermediate files after exact records have been extracted.
          rm -f "$OUT/riksantikvaren-ogc-lokaliteter-kommune-3218.json"
          rm -f "$OUT/riksantikvaren-ogc-enkeltminner-kommune-3218.json"
          rm -f "$OUT/riksantikvaren-ogc-lokaliteter-navn-nostvedt.json"
          rm -f "$OUT/riksantikvaren-ogc-lokaliteter-navn-nostvet.json"
          rm -f "$OUT/riksantikvaren-ogc-enkeltminner-navn-nostvedt.json"
          rm -f "$OUT/riksantikvaren-ogc-enkeltminner-navn-nostvet.json"
          rm -f "$OUT/targeted-summary.txt"
          rm -f "$OUT/riksantikvaren-nearby-candidates.json"
          rm -f "$OUT/nearby-summary.txt"
          rm -f "$OUT/riksantikvaren-site-area-candidates.json"
          rm -f "$OUT/site-area-summary.txt"
          rm -f "$OUT/visitor-site-summary.txt"
          rm -f "$OUT/source-summary.txt"
          rm -f "$OUT/riksantikvaren-wfs-capabilities.xml"
          rm -f "$OUT/riksantikvaren-wfs-typenames.txt"
          rm -f "$OUT"/wfs-*.json
          rm -f "$OUT/nominatim-nostvedtfunnet.json"
          rm -f "$OUT/nominatim-tussebohuken.json"
          rm -f "$OUT/osm-nostvet-sjoskogen-bbox.xml"
          rm -f "$OUT/osm-nostvet-expanded-bbox.xml"
          rm -f "$OUT/overpass-query.txt"
          rm -f "$OUT/overpass-nostvet-visitor-objects.json"
          rm -f "$OUT/geonorge-sjoskogenveien-25.json"
          rm -f "$OUT/geonorge-boplassveien-vinterbro.json"
          rm -f "$OUT/geonorge-eikelia-vinterbro.json"
          rm -f "$OUT/geonorge-elgjartunveien-vinterbro.json"
          rm -f "$OUT/geonorge-steinalderveien-vinterbro.json"
          rm -f "$OUT/osm-nostvet-site-bbox.xml"
          rm -f "$OUT/overpass-site-query.txt"
          rm -f "$OUT/overpass-nostvet-site-objects.json"
          rm -f "$OUT/riksantikvaren-sikringssoner-41534.json"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT" .github/workflows
          if git diff --cached --quiet; then
            echo 'No exact-source changes.'
          else
            git commit -m 'Persist exact Nøstvet locality 41534 sources'
            git push origin HEAD:agent/akershus-nostvet-boplass-production
          fi
