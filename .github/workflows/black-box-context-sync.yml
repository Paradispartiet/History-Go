name: TEMP Black Box place quiz context synchronization
on:
  push:
    branches:
      - black-box-media-20261013
    paths:
      - .github/workflows/black-box-context-sync.yml
permissions:
  contents: write
jobs:
  sync-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: black-box-media-20261013
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate deterministic Black Box quiz context
        run: |
          node scripts/build-quiz-production-context.mjs --category scenekunst --target black_box_teater --output data/quiz/production_context/scenekunst/black_box_teater.json
          node scripts/build-quiz-production-context.mjs --category scenekunst --target black_box_teater --output data/quiz/production_context/scenekunst/black_box_teater.json --check
      - name: Regenerate deterministic Fagverk release manifest
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit regenerated context and release
        run: |
          git add data/quiz/production_context/scenekunst/black_box_teater.json
          git add data/fagverk/fagverk_release.json
          git diff --cached --stat
          if git diff --cached --quiet; then echo 'Already synchronized'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Black Box: synchronize quiz context after adding productions'
          git push origin HEAD:black-box-media-20261013
