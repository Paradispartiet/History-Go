name: Global quiz normal opening alignment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: global-quiz-normal-opening-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  align:
    if: startsWith(github.head_ref, 'agent/global-quiz-normal-opening-alignment')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply global normal-opening alignment
        if: hashFiles('tools/apply-global-quiz-normal-opening-alignment.mjs') != ''
        run: |
          set -euo pipefail
          node tools/apply-global-quiz-normal-opening-alignment.mjs
          node tools/validate-global-quiz-normal-opening-alignment.mjs | tee reports/quiz-global-normal-opening-alignment-validation.txt
          node -e 'const fs=require("fs"); for (const p of ["data/quiz/regler/QUIZ_NORMAL_OPENING_POLICY_V1.json","data/quiz/regler/QUIZ_TEMPLATE_REGISTRY_V2.json","data/quiz/by/deichman_bjorvika_sets.json"]) JSON.parse(fs.readFileSync(p,"utf8")); console.log("JSON parse: PASS")'
          git diff --check
      - name: Commit global alignment
        if: hashFiles('tools/apply-global-quiz-normal-opening-alignment.mjs') != ''
        run: |
          set -euo pipefail
          rm tools/apply-global-quiz-normal-opening-alignment.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/quiz/regler/QUIZ_PRODUCTION_CANONICAL.md
          git add data/quiz/regler/QUIZ_NORMAL_OPENING_POLICY_V1.json
          git add data/quiz/regler/QUIZ_TEMPLATE_REGISTRY_V2.json
          git add scripts/audit-quiz-progression.mjs
          git add scripts/audit-quiz-template-governance.mjs
          git add data/quiz/by/deichman_bjorvika_sets.json
          git add reports/quiz-global-normal-opening-alignment.md
          git add reports/quiz-global-normal-opening-alignment-validation.txt
          git add tools/validate-global-quiz-normal-opening-alignment.mjs
          git add -u tools/apply-global-quiz-normal-opening-alignment.mjs
          git diff --cached --check
          git commit -m 'Quiz: samkjør global 2x7-normalåpning'
          git push origin HEAD:${{ github.head_ref }}
