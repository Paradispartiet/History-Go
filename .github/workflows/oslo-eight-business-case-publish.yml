name: Oslo eight economic case and epoch publication
on:
  push:
    branches: [content/oslo-eight-source-backed-place-texts-20261019]
    paths:
      - scripts/produce-oslo-eight-naeringsliv-reports-20261019.mjs
      - .github/workflows/oslo-eight-business-case-publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build eight location-specific economic production reports and validate source cases
        run: node scripts/produce-oslo-eight-naeringsliv-reports-20261019.mjs
      - name: Regenerate epoch coverage from both historic and business production records
        run: |
          npm run epoker:places:build
          npm run epoker:places:check
          node scripts/audit-naeringsliv-place-production.mjs --all
          node scripts/audit-historie-place-production.mjs --all
      - name: Commit eight accepted reports, epoch index and remove one-shot job
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/naeringsliv-production data/epoker/epoke-place-index.json
          git rm .github/workflows/oslo-eight-business-case-publish.yml
          git commit -m 'content(oslo): publish eight economic place cases with verified source provenance'
          git push origin HEAD:content/oslo-eight-source-backed-place-texts-20261019
