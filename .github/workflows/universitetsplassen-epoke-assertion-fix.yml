name: Universitetsplassen epoke assertion fix

on:
  push:
    branches:
      - work/universitetsplassen-completion-20260829
    paths:
      - .github/workflows/universitetsplassen-epoke-assertion-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/universitetsplassen-completion-20260829
          fetch-depth: 0

      - name: Align deterministic epoke assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/epoke-place-index.test.mjs")
          text = path.read_text()
          old = "assert.equal(index.stats.verified_place_production_milestone_count, 249);"
          new = "assert.equal(index.stats.verified_place_production_milestone_count, 259);"
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one stale verified production milestone assertion, got {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          grep -F 'assert.equal(index.stats.verified_place_production_milestone_count, 259);' tests/epoke-place-index.test.mjs

      - name: Commit assertion and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/universitetsplassen-epoke-assertion-fix.yml
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Align epoke production milestone assertion"
          git push origin HEAD:work/universitetsplassen-completion-20260829
