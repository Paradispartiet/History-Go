name: TEMP Kunstnerforbundet R6 People diagnostic report

on:
  push:
    branches:
      - agent/kunstnerforbundet-people-r6-20260913

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R6 with history
        uses: actions/checkout@v4
        with:
          ref: agent/kunstnerforbundet-people-r6-20260913
          fetch-depth: 0

      - name: Persist exact People validator diagnosis
        shell: bash
        run: |
          set -euo pipefail
          report='reports/tmp-kunstnerforbundet-r6-people-diagnostic.txt'
          if [[ -f "$report" ]]; then
            echo "Diagnostic report already exists; no second write."
            cat "$report"
            exit 0
          fi
          git worktree add --detach /tmp/r5 1dcb688e8a9122972ff6d0ed52462ecb44d41e49
          python - <<'PY' > /tmp/scan.txt
          import json
          from pathlib import Path

          def scan(root):
              root = Path(root).resolve()
              claims_root = root / 'data/people/claims'
              offenders = []
              files = sorted(claims_root.rglob('*.json')) if claims_root.exists() else []
              for path in files:
                  if path.name == 'README.json':
                      continue
                  rel = path.relative_to(root).as_posix()
                  try:
                      doc = json.loads(path.read_text())
                  except Exception as exc:
                      offenders.append((rel, 'invalid_json', repr(exc), ''))
                      continue
                  raw = doc.get('profile_file') if isinstance(doc, dict) else None
                  text = '' if raw is None else str(raw).strip()
                  resolved = root / text
                  if not text:
                      offenders.append((rel, 'empty_profile_file', text, '.'))
                  elif not resolved.exists():
                      offenders.append((rel, 'missing_profile_file', text, text))
                  elif resolved.is_dir():
                      offenders.append((rel, 'profile_file_is_directory', text, text))
              return files, offenders

          for label, root in [('R5_BASE', '/tmp/r5'), ('R6_CURRENT', '.')]:
              files, offenders = scan(root)
              print(f'[{label}] claims_json_count={len(files)} offenders={len(offenders)}')
              for row in offenders:
                  print(f'[{label}] OFFENDER file={row[0]} reason={row[1]} raw={row[2]!r} resolved={row[3]}')

          current = Path('data/people/claims/kunst/oslo/kunstnerforbundet/henrik_sorensen.claims.json')
          doc = json.loads(current.read_text())
          profile = Path(str(doc.get('profile_file', '')).strip())
          print(f'[R6_NEW] claims={current.as_posix()} profile_file={profile.as_posix()} exists={profile.exists()} is_file={profile.is_file()}')
          PY

          set +e
          (cd /tmp/r5 && node tools/audit-people-profile-canonical.mjs) > /tmp/r5-audit.log 2>&1
          r5_code=$?
          node tools/audit-people-profile-canonical.mjs > /tmp/r6-audit.log 2>&1
          r6_code=$?
          set -e

          {
            echo 'KUNSTNERFORBUNDET R6 PEOPLE VALIDATOR DIAGNOSTIC'
            echo 'R5_BASE=1dcb688e8a9122972ff6d0ed52462ecb44d41e49'
            echo
            cat /tmp/scan.txt
            echo
            echo "R5_BASE_AUDIT_EXIT=$r5_code"
            cat /tmp/r5-audit.log
            echo
            echo "R6_CURRENT_AUDIT_EXIT=$r6_code"
            cat /tmp/r6-audit.log
          } > "$report"

          cat "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report"
          git commit -m 'Persist Kunstnerforbundet R6 People validator diagnosis'
          git push origin HEAD:agent/kunstnerforbundet-people-r6-20260913
