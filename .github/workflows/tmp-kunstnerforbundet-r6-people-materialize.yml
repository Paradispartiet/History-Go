name: TEMP Kunstnerforbundet R6 People diagnostic

on:
  push:
    branches:
      - agent/kunstnerforbundet-people-r6-20260913

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R6 with history
        uses: actions/checkout@v4
        with:
          ref: agent/kunstnerforbundet-people-r6-20260913
          fetch-depth: 0

      - name: Compare People claims profile_file paths with green R5 baseline
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/r5 1dcb688e8a9122972ff6d0ed52462ecb44d41e49
          python - <<'PY'
          import json
          from pathlib import Path

          def scan(root):
              root = Path(root).resolve()
              claims_root = root / 'data/people/claims'
              offenders = []
              files = sorted(claims_root.rglob('*.json')) if claims_root.exists() else []
              for path in files:
                  if path.name == 'README.json':
                      continue
                  rel = path.relative_to(root).as_posix()
                  try:
                      doc = json.loads(path.read_text())
                  except Exception as exc:
                      offenders.append((rel, 'invalid_json', repr(exc), ''))
                      continue
                  raw = doc.get('profile_file') if isinstance(doc, dict) else None
                  text = '' if raw is None else str(raw).strip()
                  resolved = root / text
                  if not text:
                      offenders.append((rel, 'empty_profile_file', text, resolved.relative_to(root).as_posix() if resolved != root else '.'))
                  elif not resolved.exists():
                      offenders.append((rel, 'missing_profile_file', text, text))
                  elif resolved.is_dir():
                      offenders.append((rel, 'profile_file_is_directory', text, text))
              return files, offenders

          for label, root in [('R5_BASE', '/tmp/r5'), ('R6_CURRENT', '.')]:
              files, offenders = scan(root)
              print(f'[{label}] claims_json_count={len(files)} offenders={len(offenders)}')
              for row in offenders:
                  print(f'[{label}] OFFENDER file={row[0]} reason={row[1]} raw={row[2]!r} resolved={row[3]}')

          current = Path('data/people/claims/kunst/oslo/kunstnerforbundet/henrik_sorensen.claims.json')
          doc = json.loads(current.read_text())
          profile = Path(str(doc.get('profile_file', '')).strip())
          print(f'[R6_NEW] claims={current} profile_file={profile} exists={profile.exists()} is_file={profile.is_file()}')
          assert profile.is_file(), 'Henrik Sørensen profile_file must resolve to a file'
          PY

      - name: Prove baseline audit behavior
        shell: bash
        run: |
          set +e
          cd /tmp/r5
          node tools/audit-people-profile-canonical.mjs > /tmp/r5-audit.log 2>&1
          code=$?
          cat /tmp/r5-audit.log
          echo "R5_BASE_AUDIT_EXIT=$code"
          exit 0
