name: Temporary Regissør isolated authoring rerun

on:
  push:
    branches:
      - civication/scenekunst-regissor-role-world
    paths:
      - .github/workflows/tmp-regissor-restart.yml

permissions:
  contents: write

jobs:
  author-verify-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Run corrected author and snapshot steps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/tmp-regissor-author.yml').read_text()
          old = 'før større omskriving'
          new = 'før større endring'
          if source.count(old) != 1:
              raise SystemExit(f'expected one thematic-overlap phrase, found {source.count(old)}')
          source = source.replace(old, new)
          lines = source.splitlines()

          def run_block(step_name):
              marker = f'- name: {step_name}'
              start = next(i for i, line in enumerate(lines) if line.strip() == marker)
              run_line = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
              body = []
              for line in lines[run_line + 1:]:
                  if line.startswith('      - name:'):
                      break
                  if line.startswith('          '):
                      body.append(line[10:])
                  elif not line.strip():
                      body.append('')
                  else:
                      break
              script = '\n'.join(body) + '\n'
              subprocess.run(['bash', '-e', '-o', 'pipefail'], input=script, text=True, check=True)

          run_block('Author and materialize Regissør')
          run_block('Synchronize governed snapshots')
          run_block('Verify complete Regissør state')
          PY

      - name: Commit permanent Regissør state
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-regissor-author.yml
          git rm .github/workflows/tmp-regissor-patch.yml
          git rm .github/workflows/tmp-regissor-restart.yml
          git add data/Civication reports/civication-life-position-role-world-readiness.md tests/civication-*.test.js
          git diff --cached --check
          git commit -m "Civication: author Scenekunst Regissør Role World"
          git push origin HEAD:civication/scenekunst-regissor-role-world
