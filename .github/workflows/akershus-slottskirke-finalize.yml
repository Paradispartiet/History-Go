name: Finalize Akershus slottskirke v8

on:
  push:
    branches:
      - work/akershus-slottskirke-completion-20260830
    paths:
      - '.github/workflows/akershus-slottskirke-finalize.yml'

permissions:
  contents: write

concurrency:
  group: akershus-slottskirke-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/akershus-slottskirke-completion-20260830
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Materialize canonical Akershus slottskirke package
        run: node tools/finalize-akershus-slottskirke-completion.mjs

      - name: Apply source-backed target repairs
        run: node tools/repair-akershus-slottskirke-finalizer.mjs

      - name: Normalize coordinate source contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const placeFile='data/places/religion/oslo/akershus_slottskirke/akershus_slottskirke.json';
          const evidenceFile='data/coordinate-evidence/oslo/religion/akershus_slottskirke.json';
          const place=JSON.parse(fs.readFileSync(placeFile,'utf8'));
          place.geocodeAccuracy='building';
          place.coordRole='building_center';
          fs.writeFileSync(placeFile, `${JSON.stringify(place,null,2)}\n`);
          const evidence=JSON.parse(fs.readFileSync(evidenceFile,'utf8'));
          for (const candidate of evidence.coordinateCandidates || []) {
            if (candidate.coordRole === 'place_of_worship_anchor') candidate.coordRole='building_center';
          }
          fs.writeFileSync(evidenceFile, `${JSON.stringify(evidence,null,2)}\n`);
          console.log('Normalized Akershus slottskirke coordinate v1 contract');
          NODE

      - name: Rebuild place and epoch projections
        run: |
          npm run places:index:build
          npm run place-open:build
          npm run epoker:places:build

      - name: Update explicit epoch baselines for new canonical place
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const testFile='tests/epoke-place-index.test.mjs';
          const mainText=execFileSync('git',['show','origin/main:tests/epoke-place-index.test.mjs'],{encoding:'utf8'});
          let text=fs.readFileSync(testFile,'utf8');
          const index=JSON.parse(fs.readFileSync('data/epoker/epoke-place-index.json','utf8'));

          const patterns={
            story:/assert\.equal\(index\.stats\.canonical_story_milestone_count,\s*(\d+)\);/,
            production:/assert\.equal\(index\.stats\.verified_place_production_milestone_count,\s*(\d+)\);/,
            places:/assert\.equal\(coverage\.canonical_place_count,\s*(\d+)\);/,
            dated:/assert\.equal\(coverage\.dated_evidence_place_count,\s*(\d+)\);/
          };
          const baseline={};
          for (const [key,pattern] of Object.entries(patterns)) {
            const match=mainText.match(pattern);
            if (!match) throw new Error(`Current main epoch baseline missing for ${key}`);
            baseline[key]=Number(match[1]);
          }

          const generated={
            story:index.stats.canonical_story_milestone_count,
            production:index.stats.verified_place_production_milestone_count,
            places:index.domains.historie.oslo_coverage.canonical_place_count,
            dated:index.domains.historie.oslo_coverage.dated_evidence_place_count
          };
          const slottskirkeProductionMilestones=Object.values(index.domains.historie.epochs)
            .flatMap(group => group.places || [])
            .filter(place => place.place_id === 'akershus_slottskirke')
            .flatMap(place => place.milestones || [])
            .filter(milestone => milestone.evidence_type === 'verified_place_production_claim');
          if (slottskirkeProductionMilestones.length !== 7) {
            throw new Error(`Expected 7 qualifying Akershus slottskirke production milestones, got ${slottskirkeProductionMilestones.length}`);
          }
          const expected={
            story:baseline.story + 1,
            production:baseline.production + slottskirkeProductionMilestones.length,
            places:baseline.places + 1,
            dated:baseline.dated + 1
          };
          for (const key of Object.keys(expected)) {
            if (generated[key] !== expected[key]) {
              throw new Error(`Akershus slottskirke epoch delta mismatch for ${key}: generated ${generated[key]}, expected ${expected[key]} from main ${baseline[key]}`);
            }
          }

          const replacements={
            story:`assert.equal(index.stats.canonical_story_milestone_count, ${generated.story});`,
            production:`assert.equal(index.stats.verified_place_production_milestone_count, ${generated.production});`,
            places:`assert.equal(coverage.canonical_place_count, ${generated.places});`,
            dated:`assert.equal(coverage.dated_evidence_place_count, ${generated.dated});`
          };
          for (const [key,pattern] of Object.entries(patterns)) {
            if (!pattern.test(text)) throw new Error(`Working-tree epoch baseline missing for ${key}`);
            text=text.replace(pattern,replacements[key]);
          }
          fs.writeFileSync(testFile,text);
          console.log(JSON.stringify({baseline,expected,generated,slottskirkeProductionMilestones:slottskirkeProductionMilestones.map(({id,year,title})=>({id,year,title}))},null,2));
          NODE

      - name: Rebuild People projections
        run: |
          npm run civication:history-people:build
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts

      - name: Rebuild canonical Knowledge
        run: npm run knowledge:canonical:write

      - name: Rebuild Fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs

      - name: Refresh place image backlog summary
        run: |
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/akershus-slottskirke-place-image-audit.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('/tmp/akershus-slottskirke-place-image-audit.json','utf8'));
          const file = 'data/places/place_image_backlog_summary.json';
          const previous = JSON.parse(fs.readFileSync(file,'utf8'));
          const byCategory = {};
          for (const [category,bucket] of Object.entries(report.byCategory || {})) {
            byCategory[category] = {
              total: bucket.total,
              valid: bucket.local + bucket.remote,
              optional: bucket.optional,
              missing: bucket.missing,
              invalid: bucket.invalid
            };
            if (previous.byCategory?.[category]?.designAlias) byCategory[category].designAlias = previous.byCategory[category].designAlias;
          }
          const next = {
            ...previous,
            generatedAt: '2026-08-30',
            generatedFromCommit: 'akershus_slottskirke_complete_2026',
            totalPlaces: report.totalPlaces,
            summary: {
              validLocal: report.summary.local,
              validRemote: report.summary.remote,
              optionalMissing: report.summary.optional,
              missing: report.summary.missing,
              invalidLocalPath: report.summary.invalid,
              remaining: report.summary.missing + report.summary.invalid
            },
            byCategory
          };
          fs.writeFileSync(file, `${JSON.stringify(next,null,2)}\n`);
          NODE

      - name: Validate Akershus slottskirke target
        run: node --test tests/akershus-slottskirke-completion.test.mjs

      - name: Validate Stories
        run: npm run check:stories

      - name: Validate v4.2 description production
        run: node scripts/validate-place-description-production-v4_2_policy.mjs --all --report /tmp/place-description-validation-v4_2.json

      - name: Validate place, coordinate and epoch projections
        run: |
          npm run places:index:check
          npm run place-open:check
          npm run epoker:places:check
          npm run places:coords:evidence:audit
          npm run places:coords:quality
          npm run places:coords:intake
          node --test tests/epoke-place-index.test.mjs

      - name: Validate People projections
        run: |
          npm run audit:people-of-places
          npm run civication:history-people:check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check

      - name: Validate image backlog materialization
        run: node scripts/audit-place-images.mjs --mode=all --report=/tmp/place-image-audit-verify.json --verify-summary=data/places/place_image_backlog_summary.json

      - name: Validate quiz, Knowledge and Fagverk contracts
        run: |
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run knowledge:canonical:check
          node scripts/build-fagverk-release-manifest.mjs --check

      - name: Validate content integration
        run: npm run leksikon:ids:check

      - name: Validate Akershus slottskirke runtime projections
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const placeOpen = 'data/runtime/place-open/akershus_slottskirke.json';
          if (!fs.existsSync(placeOpen)) throw new Error('Akershus slottskirke place-open payload mangler');
          const reading = fs.readFileSync('data/runtime/lesespor-all.json','utf8');
          if (!/lesespor_akershus_slottskirke_/i.test(reading)) throw new Error('Akershus slottskirke Lesespor runtime mangler');
          const scan = dir => fs.readdirSync(dir).filter(name=>name.endsWith('.json')).map(name=>fs.readFileSync(path.join(dir,name),'utf8')).join('\n');
          if (!/st_akershus_slottskirke_/i.test(scan('data/runtime/stories-all'))) throw new Error('Akershus slottskirke Story runtime mangler');
          console.log('Akershus slottskirke runtime projections present');
          NODE

      - name: Validate READ-FIRST against merged main
        run: |
          BASE=$(git merge-base HEAD origin/main)
          node scripts/place-production-rule-preflight.mjs check --base "$BASE"

      - name: Normalize generated People report
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='reports/people-of-places-status.md';
          if (fs.existsSync(file)) {
            const text=fs.readFileSync(file,'utf8');
            fs.writeFileSync(file, `${text.trimEnd()}\n`);
          }
          NODE

      - name: Validate repository diff
        run: git diff --check

      - name: Commit permanent Akershus slottskirke package and remove temporary helpers
        run: |
          rm -f tools/finalize-akershus-slottskirke-completion.mjs
          rm -f tools/repair-akershus-slottskirke-finalizer.mjs
          rm -f .github/workflows/akershus-slottskirke-finalize.yml
          rm -f reports/place-production/akershus-slottskirke-intake.json
          git add -A
          if git diff --cached --quiet; then
            echo "No final Akershus slottskirke changes were produced"
            exit 1
          fi
          git commit -m "Complete Akershus slottskirke place production"
          git push origin HEAD:work/akershus-slottskirke-completion-20260830
