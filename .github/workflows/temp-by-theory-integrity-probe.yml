name: TEMP By theory integrity probe

on:
  push:
    branches:
      - agent/fagverk-by-theory-integrity-proof-20260820
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate diagnostic and permanent audit
        run: |
          node --check tools/probe-by-theory-integrity.mjs
          node --check tools/audit-by-theory-integrity.mjs
          node --test tests/by-theory-integrity-probe-smoke.test.mjs
          node tools/probe-by-theory-integrity.mjs > /tmp/by-theory-integrity-probe.json
          node tools/audit-by-theory-integrity.mjs --write-report --no-check-report
      - name: Upload reconciliation results
        uses: actions/upload-artifact@v4
        with:
          name: by-theory-integrity-reconciliation
          path: |
            /tmp/by-theory-integrity-probe.json
            reports/fagverk/by-theory-integrity-audit.json
