name: Repair Philosophy shared-intention anchor

on:
  push:
    branches:
      - agent/expand-philosophy-core-fields
    paths:
      - .github/workflows/repair-philosophy-shared-intention-anchor.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/expand-philosophy-core-fields
          fetch-depth: 0

      - name: Patch substantive Bratman argument only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/materialize-filosofi-major-field-coverage.mjs')
          s = p.read_text()
          old = "P1: Bratman hevder at delt aktivitet kan bygges av individuelle intensjoner av typen «jeg har til hensikt at vi gjør J», gjensidig responsivitet og sammenpassende delplaner under felles kunnskap. Modellen forklarer koordinering uten å postulere et eget kollektivt sinn."
          new = "P1: Bratman hevder at delt intensjon i en delt aktivitet kan analyseres gjennom individuelle intensjoner av typen «jeg har til hensikt at vi gjør J», gjensidig responsivitet og sammenpassende delplaner under felles kunnskap. Modellen forklarer koordinering uten å postulere et eget kollektivt sinn."
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Bratman paragraph, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check scripts/materialize-filosofi-major-field-coverage.mjs

      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-philosophy-shared-intention-anchor.yml
          git add scripts/materialize-filosofi-major-field-coverage.mjs
          git diff --cached --check
          git commit -m "Strengthen shared-intention argument anchor"
          git push origin HEAD:agent/expand-philosophy-core-fields
