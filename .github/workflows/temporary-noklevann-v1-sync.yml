name: Temporary Noklevann v1 source sync and real browser QA
on:
  push:
    branches:
      - content/oslo-noklevann-v1-20261021
    paths:
      - .github/workflows/temporary-noklevann-v1-sync.yml
permissions:
  contents: write
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/oslo-noklevann-v1-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Download both independently licensed Commons originals
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 2 -fLsS -A 'HistoryGo/1.0 educational Commons use' -o /tmp/noklevann-front.jpg 'https://upload.wikimedia.org/wikipedia/commons/4/4c/N%C3%B8klevann_%2826._november_2020%29.jpg'
          curl --retry 3 --retry-delay 2 -fLsS -A 'HistoryGo/1.0 educational Commons use' -o /tmp/noklevann-landscape.jpg 'https://upload.wikimedia.org/wikipedia/commons/1/17/N%C3%B8klevann_-_2012-08-12_at_13-28-36.jpg'
          file /tmp/noklevann-{front,landscape}.jpg
          test "$(wc -c < /tmp/noklevann-front.jpg)" -gt 100000
          test "$(wc -c < /tmp/noklevann-landscape.jpg)" -gt 100000
      - name: Encode real source photographs as local WebP
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import PIL' || python3 -m pip install --user --break-system-packages Pillow
          mkdir -p bilder/places
          python3 - <<'PY'
          from PIL import Image,ImageOps
          pairs=[('/tmp/noklevann-front.jpg','bilder/places/noklevann_front_portrait.webp',(600,800)),('/tmp/noklevann-landscape.jpg','bilder/places/noklevann_landscape.webp',(1400,900))]
          for original,target,size in pairs:
            with Image.open(original) as im:
              photo=ImageOps.exif_transpose(im).convert('RGB')
              crop=ImageOps.fit(photo,size,method=Image.Resampling.LANCZOS,centering=(0.5,0.5))
              crop.save(target,'WEBP',quality=86,method=6)
              print(target, crop.size)
          PY
      - name: Prepare source image metadata and current translations
        run: |
          npm ci --no-audit --no-fund
          node scripts/oneoff-noklevann-v1-sync.mjs
      - name: Build release, place index, runtime, quiz Knowledge and photo report
        shell: bash
        run: |
          set -euo pipefail
          npm run places:index:build
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
          npm run epoker:places:build
          npm run place-open:build
          npm run knowledge:canonical:write
          node scripts/audit-place-images.mjs --mode=all --report=reports/place-image-audit.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const filename='data/places/place_image_backlog_summary.json';
          const old=JSON.parse(fs.readFileSync(filename,'utf8'));
          const report=JSON.parse(fs.readFileSync('reports/place-image-audit.json','utf8'));
          old.generatedAt='2026-10-21';
          old.totalPlaces=report.totalPlaces;
          old.summary={validLocal:report.summary.local,validRemote:report.summary.remote,optionalMissing:report.summary.optional,missing:report.summary.missing,invalidLocalPath:report.summary.invalid,remaining:report.summary.missing+report.summary.invalid};
          for(const [category,counts] of Object.entries(report.byCategory)){
            old.byCategory[category]={total:counts.total,valid:counts.local+counts.remote,optional:counts.optional,missing:counts.missing,invalid:counts.invalid};
          }
          fs.writeFileSync(filename,JSON.stringify(old,null,2)+'\n');
          NODE
          node scripts/check-place-i18n-freshness.mjs noklevann
          npm run place-open:check
          npm run knowledge:canonical:check
          node scripts/build-fagverk-release-manifest.mjs --check
          node scripts/audit-place-images.mjs --mode=all --verify-summary=data/places/place_image_backlog_summary.json
      - name: Verify actual app frontend at 390 and 1440 and finish all 21 quiz questions
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node tests/noklevann-v1-real-browser.mjs
          node scripts/verify-noklevann-fullquiz-browser.mjs noklevann
      - name: Mark successful image and app acceptance
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='data/places/natur/oslo/places_oslo_natur_hovedsteder/noklevann.json';
          const o=JSON.parse(fs.readFileSync(file,'utf8'));
          o.frontImageMeta.visualReview='approved_2026-10-21_actual_390px_1440px_browser';
          o.imageMeta.visualReview='approved_2026-10-21_actual_390px_1440px_browser';
          fs.writeFileSync(file,JSON.stringify(o,null,2)+'\n');
          const reportFile='reports/place-production/noklevann-v1-images-20261021.json';
          const report=JSON.parse(fs.readFileSync(reportFile,'utf8'));
          report.status='approved_actual_browser_390px_1440px';
          report.assets.forEach(a=>a.appReview=true);
          fs.writeFileSync(reportFile,JSON.stringify(report,null,2)+'\n');
          NODE
          npm run places:index:build
          npm run place-open:build
          npm run place-open:check
      - name: Save browser screenshots and fullquiz evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noklevann-v1-browser-evidence
          path: |
            artifacts/noklevann-browser/
            artifacts/place-quiz/noklevann/
            reports/place-production/noklevann-v1-images-20261021.json
          if-no-files-found: ignore
      - name: Commit verified data and remove all temporary automation
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/temporary-noklevann-v1-sync.yml scripts/oneoff-noklevann-v1-sync.mjs
          git add -u -- data/places data/fagverk data/runtime data/knowledge data/quiz data/epoker data/i18n reports
          git add -- bilder/places/noklevann_front_portrait.webp bilder/places/noklevann_landscape.webp reports/place-production/noklevann-v1-images-20261021.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && exit 0
          git commit -m 'build(noklevann): local photos, translated story, Knowledge, Fagverk and verified runtime'
          git pull --rebase origin content/oslo-noklevann-v1-20261021
          git push origin HEAD:refs/heads/content/oslo-noklevann-v1-20261021
