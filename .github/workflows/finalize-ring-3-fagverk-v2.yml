name: Finalize Ring 3 Fagverk v2

on:
  push:
    branches:
      - work/ring-3-fagverk-v2-20260901
    paths:
      - .github/workflows/finalize-ring-3-fagverk-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Sync branch to current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Materialize Ring 3 Fagverk source and image repair
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const placePath = 'data/places/by/oslo/places/ring_3.json';
          const registryPath = 'data/fagverk/fagverk_registry.json';
          const backlogPath = 'data/places/place_image_backlog_summary.json';
          const place = JSON.parse(fs.readFileSync(placePath, 'utf8'));

          const imageUrl = 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/Ring_3%2C_Nydalen.jpg/1280px-Ring_3%2C_Nydalen.jpg';
          const staleImage = place.image === 'bilder/places/ring_3.JPG' && place.cardImage === 'bilder/kort/places/ring_3.PNG';
          if (staleImage) {
            place.image = imageUrl;
            place.cardImage = imageUrl;
          }

          place.fagverk = {
            schema: 'history_go_place_fagverk_v2',
            level: 'full',
            status: 'curated',
            intro: 'Ring 3 kan undersøkes som både et sammenhengende transportsystem og et langstrakt landskapsinngrep. Veien fordeler trafikk mellom Oslos radialårer, men skaper samtidig støy, nivåforskjeller og barrierer som må håndteres med tunneler, broer, underganger og nye forbindelser på tvers.',
            article: [
              'Ring 3 ble foreslått i generalplanen for Oslo, Aker og Bærum i 1934 og stukket ut i terrenget i 1945. Hovedideen var en ytre fordelingsåre som kunne koble de store radialveiene uten at all biltrafikk måtte gjennom sentrum. Dagens trasé går fra Ryen via blant annet Bryn, Økern, Sinsen, Storo, Tåsen, Ullevål, Smestad og Ullern til Fornebukrysset. De mange gatenavnene langs traseen viser at Ring 3 er et system satt sammen av flere eldre og nyere veistrekninger, ikke én vanlig gate.',
              'Utbyggingen viser etterkrigstidens overgang fra plankryss til planskilte trafikkanlegg. Bryn fikk tunnel i 1969, Smestad i 1983, Ullern og Granfosstunnelen i 1992, Storo i 1994, Tåsen i 1999 og Løren i 2013. Hvert prosjekt flyttet konflikter mellom gjennomgangstrafikk og lokaltrafikk ved hjelp av ramper, broer eller tunneler. Teknisk kapasitet ble dermed omsatt direkte i byform, arealbruk og nye nivåforskjeller.',
              'Sinsenkrysset er et tydelig eksempel på denne lagvise ombyggingen. Den første rundkjøringen kom i 1957. Da firefelts Ring 3 fra Økern åpnet i 1962, var kapasiteten raskt presset. Trondheimsveien ble lagt på bro i 1970, trikken ble flyttet i 1992, og i 1994 ble Ring 3 lagt under rundkjøringen. Krysset kan derfor leses som flere generasjoner transportplanlegging stablet over og under hverandre.',
              'Tunneler fjerner ikke Ring 3 som infrastruktursystem; de flytter deler av trafikken og påvirkningen bort fra overflaten. Granfosstunnelen består av to løp og åpnet i 1992, mens andre tunnel- og lokkprosjekter langs traseen har frigjort areal eller redusert direkte konflikt enkelte steder. Ved portalene er det fortsatt mulig å observere brede kjørebaner, støyskjermer, ramper og store overgangssoner mellom tunnel og åpen vei.',
              'Ring 3 er samtidig en dokumentert fysisk barriere. På Teisen skjærer veien gjennom boligområdet og skiller Agmund Bolts vei fra resten av Teisen-byen. Andre steder må gående og syklende bruke broer, underganger og bestemte krysningspunkter. Dagens vegprosjekter ved Sinsen–Storo og Holmenveien–Dalsveien viser at forbindelser på tvers fortsatt er et aktivt planleggingsproblem: nye gang- og sykkelanlegg bygges nettopp for å gjøre kryssing og ferdsel langs korridoren tryggere og mer sammenhengende.',
              'Feltarbeid langs Ring 3 kan dokumentere bredde, nivåer, tunnelportaler, støyskjermer, ramper, gangbroer, underganger og hvor langt en fotgjenger må gå for å krysse. Slike observasjoner kan vise den fysiske dobbeltrollen som forbindelse og barriere. De kan derimot ikke alene fastslå trafikkmengde, utslipp, helsevirkninger, reisemiddelfordeling eller sosial fordeling av belastninger; slike påstander krever tellinger, målinger og andre datasett.'
            ],
            subject_ids: ['by'],
            emne_ids: [
              'em_by_infrastruktur_mobilitet',
              'em_by_barrierer_forbindelser'
            ],
            chapter_ids: [
              'urbanisme-idealer-forbindelser-fortetting'
            ],
            lenses: [
              {
                id: 'ring3-fordelingsare',
                title: 'Ringveien som fordelingsåre',
                prompt: 'Hvordan skiller Ring 3s rolle som ytre fordelingsåre seg fra en radialvei som leder trafikk inn mot sentrum?',
                subject_id: 'by',
                emne_id: 'em_by_infrastruktur_mobilitet',
                evidence: 'Følg traseens koblinger til radialveier og store kryss, og bruk den dokumenterte 1934-planen til å skille ringveilogikk fra vanlig gatefunksjon.'
              },
              {
                id: 'ring3-planskilt-system',
                title: 'Planskilt system i flere nivåer',
                prompt: 'Hva skjer med byrommet når kryss flyttes over og under hverandre i stedet for å møtes i samme plan?',
                subject_id: 'by',
                emne_id: 'em_by_infrastruktur_mobilitet',
                evidence: 'Les Sinsenkrysset som en tidsserie fra rundkjøring til bro og tunnel, og registrer dagens nivåer, ramper og transportformer.'
              },
              {
                id: 'ring3-barriere-teisen',
                title: 'Veien som nabolagsbarriere',
                prompt: 'Hvordan kan en vei som binder byen sammen samtidig splitte et lokalt boligområde?',
                subject_id: 'by',
                emne_id: 'em_by_barrierer_forbindelser',
                evidence: 'Bruk Teisen som dokumentert case og registrer hvilke lokale forbindelser som krysser Ring 3, hvilke som brytes og hvilke omveier traseen skaper.'
              },
              {
                id: 'ring3-kryssinger-myke-trafikanter',
                title: 'Forbindelser på tvers',
                prompt: 'Hva forteller gangbroer, underganger og nye sykkelprosjekter om behovet for å reparere forbindelser gjennom veikorridoren?',
                subject_id: 'by',
                emne_id: 'em_by_barrierer_forbindelser',
                evidence: 'Sammenhold eksisterende krysningspunkter med Statens vegvesens prosjekter ved Sinsen–Storo og Holmenveien–Dalsveien.'
              },
              {
                id: 'ring3-tunnel-som-romstrategi',
                title: 'Tunnel som romstrategi',
                prompt: 'Hvilke virkninger flyttes bort fra overflaten når Ring 3 legges i tunnel, og hvilke virkninger består ved portalene og langs den åpne traseen?',
                subject_id: 'by',
                emne_id: 'em_by_infrastruktur_mobilitet',
                evidence: 'Observer tunnelportaler, støyskjermer, kjørebanebredde og overflatebruk, og skill mellom fysisk observerbar endring og virkninger som krever måledata.'
              }
            ],
            guiding_questions: [
              'Hvorfor ble en ringvei planlagt som supplement til Oslos radialveier?',
              'Hvordan endret planskilte kryss og tunneler forholdet mellom gjennomgangstrafikk og lokaltrafikk?',
              'På Teisen: hvilke bevegelser er enkle langs Ring 3, og hvilke er vanskelige på tvers av den?',
              'Hva forteller dagens gang- og sykkelprosjekter om barrierer som fortsatt ikke er løst?',
              'Hvilke påstander om trafikk, utslipp, helse og sosial belastning kan ikke avgjøres ved feltobservasjon alene?'
            ],
            concepts: [
              'ringvei',
              'fordelingsåre',
              'radialvei',
              'planskilt kryss',
              'infrastrukturkorridor',
              'tunnel',
              'barriere',
              'forbindelse',
              'gangbro',
              'feltobservasjon'
            ],
            observable_traces: [
              {
                title: 'Sinsenkryssets lag av transport',
                observation: 'Registrer rundkjøring, broer, tunnel, trikk og lokale ganglinjer som separate nivåer i samme knutepunkt.',
                interpretation_boundary: 'Dagens nivåer dokumenterer den fysiske organiseringen, men historisk kapasitet og trafikkmengde må hentes fra kilder og tellinger.',
                source_urls: [
                  'https://oslobyleksikon.no/side/Sinsenkrysset',
                  'https://oslobyleksikon.no/side/Ring_3'
                ]
              },
              {
                title: 'Teisen delt av veikorridoren',
                observation: 'Følg en lokal rute fra boligområdet på én side av Ring 3 til den andre og noter krysningspunkt, omvei, nivåskifte og skjerming.',
                interpretation_boundary: 'Den fysiske barrieren kan dokumenteres i felt, men graden av sosial isolasjon eller helsebelastning krever andre data.',
                source_urls: [
                  'https://oslobyleksikon.no/side/Teisen_%28str%C3%B8k%29'
                ]
              },
              {
                title: 'Nye gang- og sykkelforbindelser',
                observation: 'Undersøk hvor gang- og sykkeltraseer følger Ring 3 eller må krysse den, og registrer broer, underganger og avbrudd.',
                interpretation_boundary: 'Anleggenes utforming viser planlagt tilgjengelighet, men faktisk bruk og opplevd trygghet krever tellinger og brukerdata.',
                source_urls: [
                  'https://www.vegvesen.no/nn/vegprosjekt/riksveg/rv150sinsenstoro/',
                  'https://www.vegvesen.no/vegprosjekter/riksveg/rv150smestad/'
                ]
              },
              {
                title: 'Granfosstunnelens portal som overgang',
                observation: 'Registrer hvor den åpne veikorridoren går over i tunnel og hvordan kjørebaner, ramper, skjerming og terreng organiseres rundt portalen.',
                interpretation_boundary: 'Portalen viser hvor trafikken flyttes under bakken, men virkninger på støy, luft og trafikkflyt må dokumenteres med måledata.',
                source_urls: [
                  'https://www.vegvesen.no/om-oss/presse/aktuelt/2025/032/fullskalaovelse-i-rv.-150-granfosstunnelen',
                  'https://oslobyleksikon.no/side/Ring_3'
                ]
              }
            ],
            source_urls: [
              'https://oslobyleksikon.no/side/Ring_3',
              'https://oslobyleksikon.no/side/Sinsenkrysset',
              'https://oslobyleksikon.no/side/Teisen_%28str%C3%B8k%29',
              'https://www.vegvesen.no/nn/vegprosjekt/riksveg/rv150sinsenstoro/',
              'https://www.vegvesen.no/vegprosjekter/riksveg/rv150smestad/',
              'https://www.vegvesen.no/om-oss/presse/aktuelt/2025/032/fullskalaovelse-i-rv.-150-granfosstunnelen'
            ],
            verified_at: '2026-09-01'
          };

          fs.writeFileSync(placePath, JSON.stringify(place, null, 2) + '\n');

          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          registry.placeLinks ||= {};
          registry.placeLinks.ring_3 = {
            sourceFile: 'places/by/oslo/places/ring_3.json',
            field: 'fagverk',
            schema: 'history_go_place_fagverk_v2',
            level: 'full',
            status: 'curated'
          };
          fs.writeFileSync(registryPath, JSON.stringify(registry, null, 2) + '\n');

          if (staleImage) {
            const backlog = JSON.parse(fs.readFileSync(backlogPath, 'utf8'));
            backlog.generatedAt = '2026-09-01';
            backlog.generatedFromCommit = 'ring_3_fagverk_v2_20260901';
            backlog.summary.validRemote += 1;
            backlog.summary.invalidLocalPath -= 1;
            backlog.summary.remaining -= 1;
            backlog.byCategory.by.valid += 1;
            backlog.byCategory.by.invalid -= 1;
            fs.writeFileSync(backlogPath, JSON.stringify(backlog, null, 2) + '\n');
          }
          NODE
      - name: Regenerate canonical and Fagverk state
        run: |
          npm run places:index:build
          node scripts/build-place-open-payloads.mjs
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate generated canonical state
        run: |
          npm run places:index:check
          node scripts/build-place-open-payloads.mjs --check
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Validate Fagverk contracts
        run: |
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/fagverk-place-rendering.test.mjs
          node --test tests/fagverk-place-substance-audit.test.mjs
          node --test tests/fagverk-link-audit.test.mjs
      - name: Validate Ring 3 remote image
        env:
          PLACE_IMAGE_REMOTE_FETCH_TIMEOUT_MS: '45000'
        run: node scripts/audit-place-images.mjs --mode=changed --require-any-place-image --require-remote-image
      - name: Build and verify full place image backlog
        run: node scripts/audit-place-images.mjs --mode=all --report=/tmp/place-image-audit.json --verify-summary=data/places/place_image_backlog_summary.json
      - name: Validate generated web runtime
        run: npm run build:web:check
      - name: Validate diff whitespace
        run: git diff --check
      - name: Commit clean production result
        run: |
          git add \
            data/places/by/oslo/places/ring_3.json \
            data/places/places_index.json \
            data/places/place_image_backlog_summary.json \
            data/runtime/place-open/ring_3.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/fagverk-place-page-coverage-v2.json
          git rm .github/workflows/finalize-ring-3-fagverk-v2.yml
          git diff --cached --quiet && { echo "No production changes to commit"; exit 1; }
          git commit -m "Curate Ring 3 Fagverk v2"
          git push origin HEAD:${GITHUB_REF_NAME}
