name: Temporary Vålerenga kirke diagnostic runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/oslo-coordinate-valerenga-kirke-production'
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-valerenga-kirke-production
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize and diagnose all gates
        shell: bash
        run: |
          set -u
          LOGDIR="reports/coordinate-branch-runner/agent_oslo-coordinate-valerenga-kirke-production"
          mkdir -p "$LOGDIR"

          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/temp-valerenga-kirke-production.yml').read_text()
          start_marker = "          node <<'NODE'\n"
          end_marker = "          NODE\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          Path('/tmp/valerenga-materialize.js').write_text(textwrap.dedent(source[start:end]))
          PY

          run_gate() {
            name="$1"
            shift
            set +e
            "$@" > >(tee "$LOGDIR/$name.log") 2>&1
            code=$?
            set -e
            printf '%s\n' "$code" > "$LOGDIR/$name.exit-code.txt"
            echo "$name=$code" >> "$LOGDIR/gate-status.txt"
            return 0
          }

          : > "$LOGDIR/gate-status.txt"
          set -e
          node /tmp/valerenga-materialize.js 2>&1 | tee "$LOGDIR/materialize.log"
          set +e

          run_gate places-index-build npm run places:index:build
          run_gate split-manifest-sync npm run audit:places-split-manifest-sync
          run_gate places-index-check npm run places:index:check
          run_gate coordinate-source-contract npm run test:coordinate-source-contract
          run_gate coordinate-quality npm run places:coords:quality
          run_gate coordinate-intake npm run places:coords:intake -- --strict-new
          run_gate coordinate-evidence npm run places:coords:evidence:audit
          run_gate git-diff-check git diff --check
          run_gate health-places npm run health:places

          rm -f .github/workflows/temp-valerenga-kirke-production.yml
          rm -f .github/workflows/temp-valerenga-kirke-diagnostic.yml
          rm -f reports/coordinate-branch-runner/agent_oslo-coordinate-valerenga-kirke-production/trigger.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Diagnose Vålerenga kirke production gates"
          git push origin HEAD:agent/oslo-coordinate-valerenga-kirke-production
