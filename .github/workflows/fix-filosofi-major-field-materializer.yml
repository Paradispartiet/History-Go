name: Diagnose Philosophy parser context

on:
  push:
    branches:
      - agent/expand-philosophy-core-fields
    paths:
      - .github/workflows/fix-filosofi-major-field-materializer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/expand-philosophy-core-fields
          fetch-depth: 0
      - name: Capture parser context
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,re
          p='scripts/materialize-filosofi-major-field-coverage.mjs'
          r=subprocess.run(['node','--check',p],text=True,capture_output=True)
          err=r.stderr or r.stdout
          lines=err.splitlines()
          out=[err,'\n--- context ---']
          for i,line in enumerate(lines):
              m=re.search(r'materialize-filosofi-major-field-coverage\.mjs:(\d+)',line)
              if not m: continue
              lineno=int(m.group(1)); src=Path(p).read_text().splitlines()[lineno-1]
              caret=lines[i+2] if i+2<len(lines) else ''
              pos=caret.find('^')
              out.append(f'line={lineno} caret={pos}')
              out.append(src[max(0,pos-260):pos+260] if pos>=0 else src[:520])
              break
          Path('reports/tmp/filosofi-materializer-context.txt').write_text('\n'.join(out))
          PY
      - name: Commit context diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/tmp/filosofi-materializer-context.txt
          git commit -m "Capture Philosophy parser context"
          git push origin HEAD:agent/expand-philosophy-core-fields
