name: Fix Philosophy major-field materializer source

on:
  push:
    branches:
      - agent/expand-philosophy-core-fields
    paths:
      - .github/workflows/fix-filosofi-major-field-materializer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/expand-philosophy-core-fields
          fetch-depth: 0

      - name: Verify original source syntax
        run: node --check scripts/materialize-filosofi-major-field-coverage.mjs

      - name: Remove false six-area guard only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('scripts/materialize-filosofi-major-field-coverage.mjs')
          s=p.read_text()
          pattern=r"// Add missing seventh field:[\s\S]*?(?=const NEW_DOMAIN_ORDER=)"
          s2,n=re.subn(pattern,'',s,count=1)
          print(f'guard_replacements={n}')
          if n != 1:
              raise SystemExit('Expected exactly one false guard block')
          p.write_text(s2)
          PY
          node --check scripts/materialize-filosofi-major-field-coverage.mjs

      - name: Commit guard repair only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-filosofi-major-field-materializer.yml
          git add scripts/materialize-filosofi-major-field-coverage.mjs
          git diff --cached --check
          git commit -m "Remove false Philosophy major-field guard"
          git push origin HEAD:agent/expand-philosophy-core-fields
