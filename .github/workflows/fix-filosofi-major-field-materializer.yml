name: Repair Philosophy materializer object keys

on:
  push:
    branches:
      - agent/expand-philosophy-core-fields
    paths:
      - .github/workflows/fix-filosofi-major-field-materializer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expand-philosophy-core-fields
          fetch-depth: 0
      - name: Repair malformed keys and require valid syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('scripts/materialize-filosofi-major-field-coverage.mjs')
          s=p.read_text()
          s,n=re.subn(r",'([A-Za-z][A-Za-z0-9_]*):",r",\1:",s)
          print('malformed_keys_repaired=',n)
          p.write_text(s)
          PY
          node --check scripts/materialize-filosofi-major-field-coverage.mjs
      - name: Commit valid materializer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-filosofi-major-field-materializer.yml
          git rm -f reports/tmp/filosofi-materializer-syntax.txt reports/tmp/filosofi-materializer-context.txt
          git add scripts/materialize-filosofi-major-field-coverage.mjs
          git diff --cached --check
          git commit -m "Repair Philosophy materializer object keys"
          git push origin HEAD:agent/expand-philosophy-core-fields
