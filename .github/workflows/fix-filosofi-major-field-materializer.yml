name: Repair Philosophy major-field materializer source

on:
  push:
    branches:
      - agent/expand-philosophy-core-fields
    paths:
      - .github/workflows/fix-filosofi-major-field-materializer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/expand-philosophy-core-fields
          fetch-depth: 0

      - name: Apply safe parser repairs and capture next error
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('scripts/materialize-filosofi-major-field-coverage.mjs')
          s=p.read_text()
          s=s.replace(",'reply:'Svar:",",reply:'Svar:")
          s=re.sub(r"// Add missing seventh field:[\s\S]*?(?=const NEW_DOMAIN_ORDER=)",'',s,count=1)
          p.write_text(s)
          PY
          mkdir -p reports/tmp
          node --check scripts/materialize-filosofi-major-field-coverage.mjs > reports/tmp/filosofi-materializer-syntax.txt 2>&1 || true
          cat reports/tmp/filosofi-materializer-syntax.txt

      - name: Commit temporary repaired source and diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/materialize-filosofi-major-field-coverage.mjs reports/tmp/filosofi-materializer-syntax.txt
          git diff --cached --check
          git commit -m "Persist Philosophy materializer parser repair" || exit 0
          git push origin HEAD:agent/expand-philosophy-core-fields
