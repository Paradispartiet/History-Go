name: Diagnose Philosophy major-field materializer source

on:
  push:
    branches:
      - agent/expand-philosophy-core-fields
    paths:
      - .github/workflows/fix-filosofi-major-field-materializer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/expand-philosophy-core-fields
          fetch-depth: 0

      - name: Capture exact Node parser error
        run: |
          mkdir -p reports/tmp
          node --check scripts/materialize-filosofi-major-field-coverage.mjs > reports/tmp/filosofi-materializer-syntax.txt 2>&1 || true
          cat reports/tmp/filosofi-materializer-syntax.txt

      - name: Commit parser diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/tmp/filosofi-materializer-syntax.txt
          git commit -m "Capture Philosophy materializer syntax error"
          git push origin HEAD:agent/expand-philosophy-core-fields
