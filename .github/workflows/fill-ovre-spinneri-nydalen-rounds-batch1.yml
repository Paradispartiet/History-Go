          report = '''# Øvre spinneri i Nydalen – rundinger batch 1

Dato: 2026-07-19

## Identitetsretting

Den etablerte ID-en `seilduksfabrikken_nydalen` beholdes for kompatibilitet. Visningsnavnet og innholdet er rettet til **Øvre spinneri (Nydalens Compagnie)**.

Christiania Seildugsfabrik var et annet anlegg og lå ved Øvre Foss i Fossveien. Nydalen-stedet er utvidelsen av Nydalens Bomuldsspinderi som ble oppført i 1856.

## Fylte historierundinger

- People: Adam Severin Hiorth og Oluf Nicolai Roll
- Verk: spinneriet, spindlene, Rolls industribygg, kulverten, arbeidsmiljøet, selskapsutviklingen og ombruk
- Badges: fire kanoniske historie-underbadges
- Før / nå: produksjonsbygg til bevart industrimiljø
- Civication Store: spindelmodell og kulvertsnitt
- Brands: dokumenterte industri-, vassdrags- og transformasjonsaktører
- Natur: Akerselva i kulvert under spinneriet, uten gjettede arter
- Fortellinger: `Elva under fabrikken`
- Leksikon: korrigert og kildebelagt artikkel

Ingen manuell `rounds`- eller `rundinger`-override er lagt inn.

## Bevarte kartdata

- ID: `seilduksfabrikken_nydalen`
- koordinat: `59.9469, 10.7671`
- radius: `150`
- canonical år: `1856`

## Kilder

Store norske leksikon, Norsk biografisk leksikon, Oslo byleksikon, Oslobilder og eksisterende History Go-data for Nydalen.
'''
          Path('reports/ovre-spinneri-nydalen-rounds-batch1.md').write_text(report, encoding='utf-8')

          test = r'''const assert = require('assert');
