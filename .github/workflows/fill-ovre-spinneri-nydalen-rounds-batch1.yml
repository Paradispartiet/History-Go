          quiz = read_json(QUIZ_PATH)
          replacements = {
              'Seilduksfabrikken (Nydalen)': 'Øvre spinneri (Nydalens Compagnie)',
              'Seilduksfabrikken i Nydalen': 'Øvre spinneri i Nydalen',
              'Seilduksfabrikken': 'Øvre spinneri'
          }
          def replace_strings(value):
              if isinstance(value, str):
                  for old, new in replacements.items():
                      value = value.replace(old, new)
                  return value
              if isinstance(value, list):
                  return [replace_strings(item) for item in value]
              if isinstance(value, dict):
                  return {key: replace_strings(item) for key, item in value.items()}
              return value
          quiz = replace_strings(quiz)
          quiz['manual_production_notes']['identity_correction'] = 'Canonical targetId beholdes, men korrekt navn er Øvre spinneri i Nydalen. Christiania Seildugsfabrik lå ved Øvre Foss.'
