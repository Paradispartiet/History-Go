name: TEMP Civication Kunst Kuratering og program prerequisites

on:
  push:
    branches:
      - agent/civication-kunst-kuratering-og-program-prerequisites
  workflow_dispatch:

concurrency:
  group: temp-civication-kunst-kuratering-og-program-prerequisites
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-and-verify:
    if: >-
      !contains(github.event.head_commit.message, '[prereq-diag-skip]') &&
      !contains(github.event.head_commit.message, 'Complete Kunst Kuratering og program prerequisites')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/civication-kunst-kuratering-og-program-prerequisites
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Repair known TEMP materializer parser typo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/TEMP_materialize_kunst_kuratering_og_program_prerequisites.mjs')
          s = p.read_text()
          old = "places.map(({id,name,function})=>({id,name,function}))"
          new = "places.map(({id,name,function: fn})=>({id,name,function: fn}))"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one parser-typo occurrence, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY

      - name: Syntax-check materializer
        run: node --check scripts/TEMP_materialize_kunst_kuratering_og_program_prerequisites.mjs

      - name: Materialize prerequisite candidate
        id: materialize
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/TEMP_materialize_kunst_kuratering_og_program_prerequisites.mjs 2>&1 | tee /tmp/kunst-kuratering-og-program-prerequisites-materializer.log

      - name: Persist materializer diagnostic fail-closed
        if: steps.materialize.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/kunst-kuratering-og-program-prerequisites-materializer.log /tmp/materializer.log
          git reset --hard HEAD
          git clean -fd
          mkdir -p reports/TEMP
          cp /tmp/materializer.log reports/TEMP/kunst-kuratering-og-program-prerequisites-materializer.log
          git add reports/TEMP/kunst-kuratering-og-program-prerequisites-materializer.log
          git diff --cached --check
          git commit -m "Record Kunst Kuratering prerequisite materializer diagnostic [prereq-diag-skip]"
          git push origin HEAD:agent/civication-kunst-kuratering-og-program-prerequisites
          exit 1

      - name: Verify complete prerequisite candidate
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            echo '=== Role Pack audit ==='
            node scripts/audit-civication-role-packs.mjs
            echo '=== Scene Registry build ==='
            node scripts/build-civication-scene-registry.mjs --write
            echo '=== Career gameplay audit ==='
            node scripts/audit-civication-career-gameplay.mjs --write
            echo '=== Role World rollout readiness audit ==='
            node scripts/audit-civication-role-world-rollout-readiness.mjs --write
            echo '=== Focused Kunst Kuratering og program prerequisite test ==='
            node tests/civication-kunst-kuratering-og-program-prerequisites.test.js
            echo '=== Career gameplay matrix test ==='
            node tests/civication-career-gameplay-matrix.test.js
            echo '=== Role World rollout readiness test ==='
            node tests/civication-role-world-rollout-readiness.test.js
            echo '=== Role Pack depth ==='
            node tests/civication-role-pack-depth.test.js
            echo '=== Scene Registry check ==='
            node scripts/build-civication-scene-registry.mjs --check
            echo '=== Scenario People build ==='
            node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
            echo '=== Scenario People check ==='
            node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
            echo '=== Scenario People test ==='
            node --test tests/civication-scenario-people.test.mjs
            echo '=== Full Civication suite ==='
            node tests/run-civication-tests.mjs
            echo '=== Job learning profiles ==='
            npm run audit:job-learning-profiles
            echo '=== Job knowledge requirements ==='
            npm run audit:job-knowledge-requirements
          } 2>&1 | tee /tmp/kunst-kuratering-og-program-prerequisites-verification.log

      - name: Persist verification diagnostic fail-closed
        if: steps.verify.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          tail -n 260 /tmp/kunst-kuratering-og-program-prerequisites-verification.log > /tmp/verification-tail.log
          git reset --hard HEAD
          git clean -fd
          mkdir -p reports/TEMP
          cp /tmp/verification-tail.log reports/TEMP/kunst-kuratering-og-program-prerequisites-verification.log
          git add reports/TEMP/kunst-kuratering-og-program-prerequisites-verification.log
          git diff --cached --check
          git commit -m "Record Kunst Kuratering prerequisite verification diagnostic [prereq-diag-skip]"
          git push origin HEAD:agent/civication-kunst-kuratering-og-program-prerequisites
          exit 1

      - name: Commit verified permanent prerequisites
        if: steps.materialize.outcome == 'success' && steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/TEMP_materialize_kunst_kuratering_og_program_prerequisites.mjs
          rm -f .github/workflows/TEMP-civication-kunst-kuratering-og-program-prerequisites.yml
          rm -f reports/TEMP/kunst-kuratering-og-program-prerequisites-materializer.log
          rm -f reports/TEMP/kunst-kuratering-og-program-prerequisites-verification.log
          rmdir reports/TEMP 2>/dev/null || true
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.' >&2
            exit 1
          fi
          git diff --cached --check
          git status --short
          git commit -m "Complete Kunst Kuratering og program prerequisites"
          git push origin HEAD:agent/civication-kunst-kuratering-og-program-prerequisites
