name: TEMP scene duplicate audit

on:
  push:
    branches:
      - 'civication/scene-pipeline-next-duplicate'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inspect anbefalingen references
        run: |
          grep -R -n \
            --exclude='compiledSceneRegistryV1.json' \
            --exclude='careerGameplayMatrix.json' \
            --exclude='roleWorldRolloutReadiness.json' \
            --exclude='lifePositionRoleWorldReadiness.json' \
            --exclude='tmp-scene-duplicate-audit.yml' \
            'anbefalingen' data/Civication js tests scripts || true
