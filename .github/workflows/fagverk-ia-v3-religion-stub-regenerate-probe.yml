name: Fagverk IA v3 Religion stub regenerate probe

on:
  pull_request:
    paths:
      - 'data/fag/religion/merke_religion.html'
      - 'data/fag/religion/archive/merke_religion_legacy_20260828.html'
      - 'data/fagverk/fagverk_portal.json'
      - 'merker/merker.html'
      - 'scripts/audit-fagverk-religion-legacy-stub.mjs'
      - 'tests/fagverk-religion-legacy-stub-retirement.test.mjs'
      - 'tests/fagverk-badge-equivalence.test.mjs'
      - '.github/workflows/fagverk-ia-v3-religion-stub-regenerate-probe.yml'

permissions:
  contents: write

jobs:
  regenerate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Religion stub retirement
        run: |
          test "$(git hash-object 'data/fag/religion/archive/merke_religion_legacy_20260828.html')" = 'fa4cdd97372ce1d2fd90f2a0712bf2458b1f42a4'
          node --check scripts/audit-fagverk-religion-legacy-stub.mjs
          node scripts/audit-fagverk-religion-legacy-stub.mjs
          node --test tests/fagverk-religion-legacy-stub-retirement.test.mjs
          node scripts/audit-fagverk-badge-equivalence.mjs
          node --test tests/fagverk-badge-equivalence.test.mjs
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/audit-fagverk-general-engine.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/fagverk-release-manifest.test.mjs
      - name: Commit generated artifacts and remove probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fagverk-ia-v3-religion-stub-regenerate-probe.yml
          git add reports/fagverk/general-engine-audit.json data/fagverk/fagverk_release.json
          if git diff --cached --quiet; then
            git commit --allow-empty -m 'Regenerate Religion stub retirement artifacts'
          else
            git commit -m 'Regenerate Religion stub retirement artifacts'
          fi
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
