name: Temporary Minneparken canonical runtime index photo sync
on:
  push:
    branches:
      - content/minneparken-kildebasert-leksikon-20261103
    paths:
      - .github/workflows/minneparken-places-index-sync-temp.yml
permissions:
  contents: write
jobs:
  build-and-verify:
    if: github.repository == 'Paradispartiet/History-Go'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/minneparken-kildebasert-leksikon-20261103
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Official places index build with imageMeta support
        run: npm run places:index:build
      - name: Strict canonical index and source sync
        run: npm run places:index:check
      - name: Assert real indexed photo, caption, quiz and Historie gate status
        run: |
          node --test tests/minneparken-historical-photo-provenance.test.mjs
          node --test tests/minneparken-quiz-source-parity.test.mjs
      - name: Commit official generated index only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/places_index.json
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Canonical generated index already synchronized; nothing to commit"
            exit 0
          fi
          git diff --cached --name-only | grep -qx 'data/places/places_index.json'
          git commit -m "build: regenerate canonical places index with licensed historic Minneparken photo"
          git push origin HEAD:content/minneparken-kildebasert-leksikon-20261103
          echo "Runtime index synchronized; Historie F/G/H remain blocked"
