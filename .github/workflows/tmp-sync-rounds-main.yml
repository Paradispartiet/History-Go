name: Temporary rounds main sync

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: temp-rounds-main-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'agent/clean-place-rounds-canonical-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Merge current main when needed
        shell: bash
        run: |
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'Already based on current main'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
