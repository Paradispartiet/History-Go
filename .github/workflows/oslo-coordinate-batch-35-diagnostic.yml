name: Diagnose Oslo coordinate control batch 35

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-batch-35-diagnostic
          fetch-depth: 0
          show-progress: false
      - name: Query lower Akerselva geometry and current markers
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-35-diagnostic
          mkdir -p "$out"
          python3 - <<'PY'
          import json, math, time, urllib.parse, urllib.request
          from pathlib import Path

          out = Path('reports/oslo-coordinate-control-batch-35-diagnostic')
          headers = {'User-Agent': 'History-Go-coordinate-control/1.0 contact=repository-audit'}

          def get_json(url, data=None):
              req = urllib.request.Request(url, data=data, headers=headers)
              with urllib.request.urlopen(req, timeout=90) as r:
                  return json.load(r)

          def nominatim_search(q):
              url = 'https://nominatim.openstreetmap.org/search?' + urllib.parse.urlencode({
                  'q': q, 'format': 'jsonv2', 'limit': 10,
                  'addressdetails': 1, 'extratags': 1, 'namedetails': 1,
              })
              result = get_json(url)
              time.sleep(1.1)
              return result

          def nominatim_reverse(lat, lon):
              url = 'https://nominatim.openstreetmap.org/reverse?' + urllib.parse.urlencode({
                  'lat': lat, 'lon': lon, 'format': 'jsonv2', 'zoom': 18,
                  'addressdetails': 1, 'extratags': 1, 'namedetails': 1,
              })
              result = get_json(url)
              time.sleep(1.1)
              return result

          def overpass(query):
              data = urllib.parse.urlencode({'data': query}).encode()
              return get_json('https://overpass-api.de/api/interpreter', data=data)

          root = Path('data/places/natur/oslo/places_oslo_natur_akerselvarute')
          ids = ['vaterland_historisk_elvelop', 'akerselva_utlop_bjorvika']
          places = {i: json.loads((root / f'{i}.json').read_text()) for i in ids}

          reverse = {
              i: nominatim_reverse(p['lat'], p['lon'])
              for i, p in places.items()
          }
          searches = {
              'akerselva': nominatim_search('Akerselva, Oslo, Norway'),
              'akerselva_outlet': nominatim_search('Akerselvas utløp, Bjørvika, Oslo, Norway'),
              'vaterland': nominatim_search('Vaterland, Oslo, Norway'),
              'vaterlands_bru': nominatim_search('Vaterlands bru, Oslo, Norway'),
              'bjorvika': nominatim_search('Bjørvika, Oslo, Norway'),
          }

          q_named = '''[out:json][timeout:90];
          (
            way["waterway"]["name"~"Akerselva",i](around:3500,59.9100,10.7580);
            relation["waterway"]["name"~"Akerselva",i](around:3500,59.9100,10.7580);
          );
          out tags center geom;'''
          q_lower = '''[out:json][timeout:90];
          (
            way["waterway"](59.9000,10.7450,59.9185,10.7720);
            relation["waterway"](59.9000,10.7450,59.9185,10.7720);
            way["natural"="water"](59.9000,10.7450,59.9185,10.7720);
            relation["natural"="water"](59.9000,10.7450,59.9185,10.7720);
          );
          out tags center geom;'''
          named = overpass(q_named)
          lower = overpass(q_lower)

          def summarize_element(e):
              geom = e.get('geometry') or []
              coords = [(float(g['lat']), float(g['lon'])) for g in geom if 'lat' in g and 'lon' in g]
              return {
                  'type': e.get('type'),
                  'id': e.get('id'),
                  'tags': e.get('tags', {}),
                  'center': e.get('center'),
                  'geometry_count': len(coords),
                  'start': coords[0] if coords else None,
                  'end': coords[-1] if coords else None,
                  'min_lat': min((x[0] for x in coords), default=None),
                  'max_lat': max((x[0] for x in coords), default=None),
                  'min_lon': min((x[1] for x in coords), default=None),
                  'max_lon': max((x[1] for x in coords), default=None),
              }

          named_summary = [summarize_element(e) for e in named.get('elements', [])]
          lower_summary = [summarize_element(e) for e in lower.get('elements', [])]

          interesting_lower = []
          for e in lower_summary:
              tags = e['tags']
              text = ' '.join(str(tags.get(k, '')) for k in ['name','waterway','tunnel','covered','layer','water','natural']).lower()
              if 'akerselva' in text or tags.get('tunnel') or tags.get('covered') or tags.get('waterway') in {'river','stream','canal'}:
                  interesting_lower.append(e)

          result = {
              'places': places,
              'reverse_current_coordinates': reverse,
              'nominatim_searches': searches,
              'named_akerselva_objects': named_summary,
              'lower_akerselva_water_objects': interesting_lower,
              'source_notes': {
                  'vaterland': [
                      'https://oslobyleksikon.no/side/Vaterland',
                      'https://oslobyleksikon.no/side/Akerselva',
                      'https://oslobyleksikon.no/side/Vaterlands_bru'
                  ],
                  'outlet': [
                      'https://oslobyleksikon.no/side/Akerselva',
                      'https://snl.no/Akerselva',
                      'https://oslobyleksikon.no/side/Bj%C3%B8rvika'
                  ]
              }
          }
          (out / 'results.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n')

          lines = ['# Oslo coordinate control batch 35 – diagnostic', '', 'Read-only audit of the final two Akerselva route records.', '']
          for id, p in places.items():
              rev = reverse[id]
              lines += [f'## {id}', f'- current: `{p["lat"]}, {p["lon"]}`', f'- reverse: `{rev.get("display_name", "")}`', '']
          lines += ['## Named Akerselva OSM objects']
          for e in named_summary:
              lines.append(f'- `{e["type"]}:{e["id"]}` name=`{e["tags"].get("name", "")}` waterway=`{e["tags"].get("waterway", "")}` tunnel=`{e["tags"].get("tunnel", "")}` start=`{e["start"]}` end=`{e["end"]}`')
          lines += ['', '## Lower-water objects of interest']
          for e in interesting_lower:
              lines.append(f'- `{e["type"]}:{e["id"]}` tags=`{json.dumps(e["tags"], ensure_ascii=False, sort_keys=True)}` start=`{e["start"]}` end=`{e["end"]}`')
          (out / 'README.md').write_text('\n'.join(lines) + '\n')
          PY
          git diff --check
      - name: Commit diagnostic report only
        run: |
          rm .github/workflows/oslo-coordinate-batch-35-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/oslo-coordinate-control-batch-35-diagnostic .github/workflows/oslo-coordinate-batch-35-diagnostic.yml
          git commit -m "Diagnose Oslo coordinate control batch 35"
          git push origin HEAD:refs/heads/agent/oslo-coordinate-batch-35-diagnostic
