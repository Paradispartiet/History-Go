name: TEMP Place Sheet Phase 2 Stories materialization

on:
  push:
    branches:
      - agent/place-sheet-phase2-stories-20260909
    paths:
      - '.github/workflows/TEMP-place-sheet-phase2-stories.yml'

permissions:
  contents: write

concurrency:
  group: temp-place-sheet-phase2-stories
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/place-sheet-phase2-stories-20260909
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Wire shared Stories renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              source = p.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:180]!r}")
              p.write_text(source.replace(old, new, 1))

          shell = "js/ui/place-sheet/place-sheet-shell.ts"
          replace_once(
              shell,
              'import { mountCanonicalHistory } from "./sections/history";',
              'import { mountCanonicalHistory } from "./sections/history";\nimport { mountCanonicalStories } from "./sections/stories";'
          )
          replace_once(
              shell,
              '      <section class="pc-sheet-history" data-hg-place-sheet-history hidden></section>',
              '      <section class="pc-sheet-history" data-hg-place-sheet-history hidden></section>\n      <section class="pc-sheet-stories" data-hg-place-sheet-stories hidden></section>'
          )
          replace_once(
              shell,
              '''  historySlot.setAttribute(SHELL_SECTION_ATTR, "history");\n  return historySlot;\n}\n\nexport function mountPlaceSheetPhase1''',
              '''  historySlot.setAttribute(SHELL_SECTION_ATTR, "history");\n  return historySlot;\n}\n\nfunction ensureStoriesSlot(shell: HTMLElement): HTMLElement | null {\n  let storiesSlot = shell.querySelector<HTMLElement>("[data-hg-place-sheet-stories]");\n  if (!(storiesSlot instanceof HTMLElement)) {\n    storiesSlot = document.createElement("section");\n    storiesSlot.className = "pc-sheet-stories";\n    storiesSlot.setAttribute("data-hg-place-sheet-stories", "1");\n    shell.appendChild(storiesSlot);\n  }\n  storiesSlot.setAttribute(SHELL_SECTION_ATTR, "stories");\n  return storiesSlot;\n}\n\nexport function mountPlaceSheetPhase1'''
          )
          replace_once(
              shell,
              '''  if (historySlot) {\n    const history = mountCanonicalHistory(historySlot, place);\n    history?.classList.add("pc-sheet-canonical-history");\n  }\n  return shell;''',
              '''  if (historySlot) {\n    const history = mountCanonicalHistory(historySlot, place);\n    history?.classList.add("pc-sheet-canonical-history");\n  }\n  const storiesSlot = ensureStoriesSlot(shell);\n  if (storiesSlot) {\n    const stories = mountCanonicalStories(storiesSlot, place);\n    stories?.classList.add("pc-sheet-canonical-stories");\n  }\n  return shell;'''
          )

          popup = "js/ui/place-popup-v2.js"
          replace_once(
              popup,
              '''  function renderStandardHistorySection(place, options) {\n    if (options && typeof options === "object" && options.suppressPlaceHistory === true) return "";\n    return renderHistoryTimeline(place);\n  }''',
              '''  function renderStandardHistorySection(place, options) {\n    if (options && typeof options === "object" && options.suppressPlaceHistory === true) return "";\n    return renderHistoryTimeline(place);\n  }\n\n  function renderStandardStoriesSection(stories, options) {\n    if (options && typeof options === "object" && options.suppressPlaceStories === true) return "";\n    const shared = global.HGPlaceSheetSections?.stories?.renderHtml;\n    if (typeof shared === "function") {\n      try {\n        const html = String(shared(stories) || "");\n        if (html) return html;\n      } catch {}\n    }\n    const legacy = helper("renderStoriesSection");\n    return legacy ? legacy(stories) : "";\n  }'''
          )
          replace_once(popup, '    const renderStories = helper("renderStoriesSection");\n', '')
          replace_once(popup, '${renderStories ? renderStories(stories) : ""}', '${renderStandardStoriesSection(stories, options)}')

          unified = "js/ui/place-unified-surface.ts"
          replace_once(
              unified,
              '''      const ownsHistory = placeSheetSectionTarget("history") instanceof HTMLElement;\n      const result = legacyShowPlacePopup(place, { unifiedHost: host instanceof HTMLElement ? host : null, suppressPlaceAbout: true, suppressPlaceHistory: ownsHistory });''',
              '''      const ownsHistory = placeSheetSectionTarget("history") instanceof HTMLElement;\n      const ownsStories = placeSheetSectionTarget("stories") instanceof HTMLElement;\n      const result = legacyShowPlacePopup(place, {\n        unifiedHost: host instanceof HTMLElement ? host : null,\n        suppressPlaceAbout: true,\n        suppressPlaceHistory: ownsHistory,\n        suppressPlaceStories: ownsStories\n      });'''
          )
          replace_once(
              unified,
              '''      if (placeSheetSectionTarget("about")) popup.querySelector(".hg-place-about-section")?.remove();\n      if (placeSheetSectionTarget("history")) popup.querySelector(".hg-place-history-section")?.remove();''',
              '''      if (placeSheetSectionTarget("about")) popup.querySelector(".hg-place-about-section")?.remove();\n      if (placeSheetSectionTarget("history")) popup.querySelector(".hg-place-history-section")?.remove();\n      if (placeSheetSectionTarget("stories")) popup.querySelector(".hg-section-stories")?.remove();'''
          )
          replace_once(
              unified,
              '    let section: Element | null = (id === "about" || id === "history") ? placeSheetSectionTarget(id) : null;',
              '    let section: Element | null = (["about", "history", "stories"].includes(id)) ? placeSheetSectionTarget(id) : null;'
          )

          css = Path("css/place-sheet.css")
          source = css.read_text()
          marker = "PLACE SHEET — PHASE 2 CANONICAL STORIES"
          if marker not in source:
              css.write_text(source + '''\n\n/* ============================================================\n   PLACE SHEET — PHASE 2 CANONICAL STORIES\n   ============================================================ */\n\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-stories:not([hidden]){\n  margin-top: 28px;\n  padding-top: 22px;\n  border-top: 1px solid rgba(255,255,255,.10);\n}\n\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories{\n  margin: 0;\n  padding: 0;\n  border: 0;\n  background: transparent;\n}\n\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories > h3{\n  margin: 0 0 16px;\n  color: #f6c800;\n  font-size: 11px;\n  line-height: 1;\n  font-weight: 900;\n  letter-spacing: .11em;\n  text-transform: uppercase;\n}\n\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories .pc-stories-list{\n  display: grid;\n  gap: 12px;\n}\n\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories .pc-story{\n  position: relative;\n  overflow: hidden;\n  padding: 16px 16px 15px;\n  border-radius: 20px;\n  border: 1px solid rgba(255,255,255,.12);\n  background: linear-gradient(135deg, rgba(246,200,0,.115), rgba(255,255,255,.045) 42%, rgba(25,118,210,.08));\n  box-shadow: 0 14px 30px rgba(0,0,0,.24);\n}\n\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories .pc-story::before{\n  content: "";\n  position: absolute;\n  inset: 0 auto 0 0;\n  width: 3px;\n  background: linear-gradient(180deg,#f6c800,rgba(246,200,0,.16));\n}\n\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories .pc-story-header{\n  display: flex;\n  align-items: baseline;\n  gap: 10px;\n  margin: 0 0 8px;\n}\n\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories .pc-story-title{\n  margin: 0;\n  color: #fff;\n  font-size: 17px;\n  line-height: 1.22;\n  font-weight: 850;\n  letter-spacing: -.01em;\n}\n\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories .pc-story-year-badge{\n  flex: 0 0 auto;\n  padding: 4px 8px;\n  border-radius: 999px;\n  background: rgba(246,200,0,.16);\n  border: 1px solid rgba(246,200,0,.28);\n  color: #ffe16a;\n  font-size: 12px;\n  font-weight: 800;\n  line-height: 1;\n}\n\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories .pc-story-lede{\n  margin: 0 0 8px;\n  color: rgba(255,255,255,.78);\n  font-size: 14px;\n  line-height: 1.45;\n}\n\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories .pc-story-body{\n  color: rgba(255,255,255,.88);\n  font-size: 14px;\n  line-height: 1.62;\n}\n\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories .pc-story-related,\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories .pc-story-tags{\n  display: flex;\n  flex-wrap: wrap;\n  gap: 7px;\n  margin-top: 10px;\n}\n\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories .pc-story-chip,\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories .pc-story-tag{\n  border: 1px solid rgba(255,255,255,.12);\n  border-radius: 999px;\n  background: rgba(0,0,0,.22);\n  color: rgba(255,255,255,.82);\n  padding: 5px 9px;\n  font-size: 12px;\n  line-height: 1;\n}\n\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories .pc-story-chip{cursor:pointer;}\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories .pc-story-chip:hover{\n  border-color: rgba(246,200,0,.35);\n  color: #fff;\n}\n\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories .pc-story-sources{\n  margin-top: 12px;\n  padding-top: 10px;\n  border-top: 1px solid rgba(255,255,255,.08);\n  color: rgba(255,255,255,.58);\n  font-size: 12px;\n}\n\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories .pc-story-source{\n  color: rgba(246,200,0,.86);\n  text-decoration: none;\n}\n\nbody.hg-app #placeCard.is-unified-place.is-place-sheet-phase1 .pc-sheet-canonical-stories .pc-story-source:hover{text-decoration:underline;}\n''')
          PY

      - name: Validate source and generated browser runtime
        run: |
          node --check js/ui/place-popup-v2.js
          npm run typecheck:web
          npm run build:web
          node --check dist/web/place-unified-surface.js

      - name: Verify Stories ownership and regressions
        run: |
          node --test tests/place-sheet-stories-renderer.test.mjs tests/place-sheet-history-renderer.test.mjs tests/place-sheet-about-renderer.test.mjs tests/place-sheet-phase1.test.mjs tests/place-unified-surface.test.mjs tests/place-popup-root-scoped-decorators.test.mjs tests/place-popup-unified-host-bridge.test.mjs tests/place-popup-v2-unified-target.test.mjs
          node tests/birkelunden-phase7b-history.test.mjs
          node tests/youngstorget-phase7b-history.test.mjs

      - name: Commit permanent Stories extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            js/ui/place-sheet/place-sheet-shell.ts \
            js/ui/place-popup-v2.js \
            js/ui/place-unified-surface.ts \
            css/place-sheet.css \
            dist/web/place-unified-surface.js \
            dist/web/place-unified-surface.js.map
          git diff --cached --check
          git commit -m "Extract shared canonical Place Sheet Stories renderer"
          git push origin HEAD:agent/place-sheet-phase2-stories-20260909
