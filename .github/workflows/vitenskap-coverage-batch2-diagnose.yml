name: Vitenskap coverage batch 2 diagnose

# Temporary inventory probe for the second substantive coverage batch.
on:
  push:
    branches:
      - agent/vitenskap-editorial-coverage-repair-2-institutions-knowledge-places
    paths:
      - '.github/workflows/vitenskap-coverage-batch2-diagnose.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize compact institutions and knowledge places inventory
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const emners = read('data/fag/vitenskap/emner_vitenskap_canonical_v4_6.json');
          const mappings = read('data/fag/vitenskap/emnemapping_vitenskap_canonical_v4_6.json');
          const registry = read('data/fagverk/fagverk_registry.json');
          const chapters = registry.subjects.vitenskap.chapters || [];
          const owned = new Set(chapters.flatMap((c) => c.emne_ids || []));
          const mappingById = new Map(mappings.map((m) => [m.emne_id, m]));
          const rows = emners.filter((e) => !owned.has(e.emne_id)).map((e) => {
            const mapping = mappingById.get(e.emne_id) || {};
            const primary = (mapping.mappings || []).find((m) => m.mapping_tier === 'primary') || (mapping.mappings || [])[0] || {};
            return {
              emne_id: e.emne_id,
              title: e.title,
              domain: primary.fagkart_kategori || null,
              primary_hook: primary.topic_hook || null,
              methods: e.methods || [],
              recommended_method_ids: primary.recommended_method_ids || [],
              canonical_thinker_ids: mapping.canonical_thinker_ids || primary.thinker_ids || [],
              recommended_cases: primary.recommended_oslo_cases || []
            };
          }).filter((row) => row.domain === 'institusjoner_laboratorier_kunnskapssteder');
          if (rows.length !== 14) throw new Error(`Expected 14 institution/knowledge-place blockers, got ${rows.length}`);
          const report = { generated_from: process.env.GITHUB_SHA, owned_before: owned.size, blocker_count_before: emners.length - owned.size, batch_size: rows.length, rows };
          fs.mkdirSync('.tmp', { recursive: true });
          fs.writeFileSync('.tmp/vitenskap-coverage-batch2.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify({ owned_before: owned.size, blockers_before: emners.length - owned.size, batch_size: rows.length }));
          NODE
      - name: Persist compact diagnosis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp/vitenskap-coverage-batch2.json
          git commit -m 'Refresh compact Vitenskap batch 2 diagnosis'
          git push origin HEAD:${GITHUB_REF_NAME}
