name: Temp Vippetangen Fiskehallen address research

on:
  push:
    branches:
      - 'agent/oslo-vippetangen-fiskehallen-research'
    paths:
      - '.github/workflows/temp-vippetangen-fiskehallen-address-research.yml'

permissions:
  contents: write

jobs:
  geonorge-address:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-vippetangen-fiskehallen-research
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run and save Geonorge address lookup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/oslo-coordinate-control-vippetangen-fiskehallen/address
          npm run places:coords:find:address -- --address "Akershusstranda 23 Oslo" \
            | tee reports/oslo-coordinate-control-vippetangen-fiskehallen/address/akershusstranda-23-oslo.json

      - name: Commit research result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/oslo-coordinate-control-vippetangen-fiskehallen/address/akershusstranda-23-oslo.json
          git diff --cached --check
          git commit -m "Save Fiskehallen Geonorge address research"
          git push origin HEAD:agent/oslo-vippetangen-fiskehallen-research
