name: TEMP Materialize Historie Forvaltning og rådgivning Role World

on:
  push:
    branches:
      - agent/civication-historie-forvaltning-radgivning-role-world
  workflow_dispatch:

concurrency:
  group: civication-historie-forvaltning-radgivning-role-world-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-and-verify:
    if: ${{ !contains(github.event.head_commit.message, 'Complete Historie Forvaltning og rådgivning Role World') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-historie-forvaltning-radgivning-role-world
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Materialize Historie Forvaltning og rådgivning Role World
        run: node scripts/TEMP_materialize_historie_forvaltning_radgivning_role_world.mjs
      - name: Regenerate career gameplay matrix
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Regenerate Role World readiness
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify focused advisory Role World
        run: node tests/civication-historie-forvaltning-radgivning-role-world-rollout.test.js
      - name: Verify prerequisite compatibility
        run: node tests/civication-historie-forvaltning-radgivning-prerequisites.test.js
      - name: Verify Role World contract
        run: node tests/civication-role-world-contract.test.js
      - name: Verify Career Gameplay and readiness parity
        run: |
          node scripts/audit-civication-career-gameplay.mjs --check
          node scripts/audit-civication-role-world-rollout-readiness.mjs --check
      - name: Verify compiled Scene Registry parity
        run: node scripts/build-civication-scene-registry.mjs --check
      - name: Verify Scenario People invariants
        run: |
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node --test tests/civication-scenario-people.test.mjs
      - name: Run full Civication suite
        run: |
          set +e
          node tests/run-civication-tests.mjs > /tmp/civication-core.log 2>&1
          core_status=$?
          set -e
          if [ "$core_status" -ne 0 ]; then
            echo '=== Civication core failure summary ==='
            tail -n 160 /tmp/civication-core.log
            exit "$core_status"
          fi
          npm run audit:job-learning-profiles
          npm run audit:job-knowledge-requirements
          tail -n 30 /tmp/civication-core.log
      - name: Remove temporary Role World surfaces
        run: rm scripts/TEMP_materialize_historie_forvaltning_radgivning_role_world.mjs .github/workflows/TEMP-civication-historie-forvaltning-radgivning-role-world.yml
      - name: Commit exact verified Role World
        run: |
          git diff --check
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No permanent changes produced"; exit 1; }
          git diff --cached --check
          git commit -m "Complete Historie Forvaltning og rådgivning Role World"
          git push origin HEAD:agent/civication-historie-forvaltning-radgivning-role-world