name: Civication By-rådgiver Role World materialize

on:
  pull_request:
    branches:
      - main
    paths:
      - data/Civication/roleWorlds/.materialize-by-radgiver

permissions:
  contents: write

concurrency:
  group: civication-by-radgiver-role-world-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/civication-by-radgiver-role-world'
    runs-on: ubuntu-latest
    steps:
      - name: Check out By-rådgiver branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize authored By-rådgiver sources
        run: node scripts/materialize-civication-by-radgiver-role-world.mjs

      - name: Keep practice packages plan-only
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const catalogs = [
            ['data/Civication/mailFamilies/by/job/by_radgiver_plan_job.json', [
              'first_week_praksisfortellinger_by_radgiver_job',
              'second_week_praksisfortellinger_by_radgiver_job'
            ]],
            ['data/Civication/mailFamilies/by/people/by_radgiver_plan_people.json', [
              'first_week_praksisfortellinger_by_radgiver_private',
              'second_week_praksisfortellinger_by_radgiver_private'
            ]]
          ];

          for (const [catalogPath, familyIds] of catalogs) {
            const catalog = JSON.parse(fs.readFileSync(catalogPath, 'utf8'));
            for (const familyId of familyIds) {
              const family = (catalog.families || []).find((entry) => entry.id === familyId);
              if (!family || !Array.isArray(family.mails) || family.mails.length !== 5) {
                throw new Error(`Expected five authored practice mails in ${catalogPath}#${familyId}`);
              }
              for (const mail of family.mails) mail.planned_only = true;
            }
            fs.writeFileSync(catalogPath, JSON.stringify(catalog, null, 2) + '\n');
          }

          const builderPath = 'js/Civication/systems/civicationDailyMailBuilder.js';
          let builder = fs.readFileSync(builderPath, 'utf8');
          const oldGuard = `    if (!id) return false;\n    if (context?.used_ids?.has?.(id)) return false;\n    if (id === norm(context?.planned_primary_id)) return false;\n\n    const text = progressionText(mail);`;
          const newGuard = `    if (!id) return false;\n    if (context?.used_ids?.has?.(id)) return false;\n    if (id === norm(context?.planned_primary_id)) return false;\n    // Some authored packages are intentionally reachable only through the role plan.\n    // They may live in normal mail-family catalogs for SceneCatalog/MailRuntime, but\n    // must never be sampled as daily_extra before or beside their planned step.\n    if (mail?.planned_only === true) return false;\n\n    const text = progressionText(mail);`;
          if (!builder.includes(oldGuard)) throw new Error('Could not locate DailyMailBuilder progression guard');
          builder = builder.replace(oldGuard, newGuard);
          fs.writeFileSync(builderPath, builder);

          const testPath = 'tests/civication-by-radgiver-role-world.test.js';
          let test = fs.readFileSync(testPath, 'utf8');
          const oldAssertion = `for (const mail of practiceMails) {\n  assert.equal(mail.role_scope, 'by_radgiver_plan');`;
          const newAssertion = `for (const mail of practiceMails) {\n  assert.equal(mail.planned_only, true, \`${'${mail.id}'}: practice mail must stay plan-only\`);\n  assert.equal(mail.role_scope, 'by_radgiver_plan');`;
          if (!test.includes(oldAssertion)) throw new Error('Could not locate By-rådgiver practice-mail assertions');
          test = test.replace(oldAssertion, newAssertion);
          fs.writeFileSync(testPath, test);
          NODE

      - name: Regenerate canonical outputs
        run: |
          node scripts/build-civication-scene-registry.mjs --write
          node scripts/audit-civication-career-gameplay.mjs --write

      - name: Verify By-rådgiver materialization
        id: verify
        shell: bash
        run: |
          set -o pipefail
          {
            node tests/civication-praksisfortellinger-registry-audit.test.js
            node tests/civication-arealplanlegger-mail-plan.test.js
            node tests/civication-career-gameplay-matrix.test.js
            node tests/civication-by-radgiver-role-world.test.js
            node tests/civication-role-world-contract.test.js
            node scripts/build-civication-scene-registry.mjs --check
            node scripts/audit-civication-career-gameplay.mjs --check
          } 2>&1 | tee /tmp/by-radgiver-materialize.log

      - name: Upload By-rådgiver diagnostic
        if: failure() && steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: by-radgiver-materialize-diagnostic
          path: /tmp/by-radgiver-materialize.log
          if-no-files-found: error
          retention-days: 1

      - name: Commit verified materialization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            data/Civication/mailFamilies/by/job/by_radgiver_plan_job.json \
            data/Civication/mailFamilies/by/people/by_radgiver_plan_people.json \
            data/Civication/mailPlans/by/by_radgiver_plan_plan.json \
            data/Civication/praksisfortellinger_registry.json \
            data/Civication/roleWorlds/by/by_radgiver_plan.json \
            data/Civication/roleWorlds/index.json \
            data/Civication/roleWorldPolicy.json \
            data/Civication/roleWorldAuthoringChecklist.json \
            data/Civication/compiledSceneRegistryV1.json \
            data/Civication/careerGameplayMatrix.json \
            reports/civication-career-gameplay-matrix.md \
            docs/CIVICATION_ROLE_WORLD_STANDARD.md \
            docs/CIVICATION_ROLE_WORLD_AUTHORING_GUIDE.md \
            js/Civication/systems/civicationDailyMailBuilder.js \
            tests/civication-role-world-contract.test.js \
            tests/civication-by-radgiver-role-world.test.js
          if git diff --cached --quiet; then
            echo "Expected By-rådgiver materialization produced no diff" >&2
            exit 1
          fi
          git commit -m "Materialize By-rådgiver Role World"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
