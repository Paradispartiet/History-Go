name: Tøyenbadet news runtime synchronization (temporary)
on:
  push:
    branches:
      - feat/toyenbadet-dated-maintenance-news-20261104
    paths:
      - .github/workflows/toyenbadet-news-sync-temp.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical Place-open payloads from Leksikon manifest
        run: npm run place-open:build
      - name: Verify exact Tøyenbadet news parity and generated outputs
        run: |
          node --test tests/toyenbadet-dated-news-2026.test.mjs
          npm run place-open:check
          git status --short
      - name: Commit only expected generated Tøyenbadet payload
        run: |
          set -euo pipefail
          git add data/runtime/place-open/toyenbadet.json
          git diff --cached --name-only
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "build(toyenbadet): sync dated 2026 news into canonical Place-open"
            git push origin HEAD:feat/toyenbadet-dated-maintenance-news-20261104
          fi
