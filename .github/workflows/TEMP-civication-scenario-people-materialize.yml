name: TEMP Civication scenario People materialize

on:
  push:
    branches:
      - agent/civication-scenario-people-catalog
    paths:
      - 'scripts/build-civication-scenario-people-index.mts'
      - 'data/Civication/scenarioPeople/overrides.json'
      - '.github/workflows/TEMP-civication-scenario-people-materialize.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/build-civication-scenario-people-index.mts'
      - 'data/Civication/scenarioPeople/overrides.json'
      - '.github/workflows/TEMP-civication-scenario-people-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'agent/civication-scenario-people-catalog' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build scenario People catalog
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - name: Verify generated catalog
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
      - name: Commit generated catalog
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/Civication/scenarioPeople/generated data/Civication/scenarioPeople_index.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Materialize Civication scenario People catalog'
          git push origin HEAD:${{ github.event.pull_request.head.ref || 'agent/civication-scenario-people-catalog' }}
