name: Temporary test mode documentation registration

on:
  pull_request:

permissions:
  contents: write

jobs:
  register:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Register canonical test mode contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          registry_path = Path("docs/documentation_registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          path = "docs/HG_TEST_MODE.md"
          if any(entry.get("path") == path for entry in registry["documents"]):
              raise SystemExit(f"Registry entry already exists: {path}")

          entry = {
              "path": path,
              "status": "canonical",
              "role": "Canonical hidden developer/test-mode policy for index runtime and compatibility aliases",
              "owns": ["test_mode_policy"],
              "last_verified": "2026-07-26",
          }
          insert_at = None
          for index, existing in enumerate(registry["documents"]):
              if existing.get("path") == "docs/APP_STRUCTURE_INDEX.md":
                  insert_at = index + 1
                  break
          if insert_at is None:
              raise SystemExit("APP_STRUCTURE_INDEX registry anchor missing")
          registry["documents"].insert(insert_at, entry)
          registry["last_verified"] = "2026-07-26"
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          replace_exact(
              "docs/README.md",
              "3. [`../README/SYSTEM_MAP.md`](../README/SYSTEM_MAP.md) — runtime-flyt og modulkjeder\n4. [`APP_STRUCTURE_INDEX.md`](./APP_STRUCTURE_INDEX.md) — canonical entry-, boot-, router-, MapView- og sidegrensekontrakt for `index.html`\n5. [`../README/README_DEV.md`](../README/README_DEV.md) — kjøring, debugging og validering\n6. [`../README/TEAM_WORKFLOW.md`](../README/TEAM_WORKFLOW.md) — arbeidsflyt og dokumentprioritet ved endringer",
              "3. [`../README/SYSTEM_MAP.md`](../README/SYSTEM_MAP.md) — runtime-flyt og modulkjeder\n4. [`APP_STRUCTURE_INDEX.md`](./APP_STRUCTURE_INDEX.md) — canonical entry-, boot-, router-, MapView- og sidegrensekontrakt for `index.html`\n5. [`HG_TEST_MODE.md`](./HG_TEST_MODE.md) — canonical skjult utviklermodus, storage-/aliasgrense og produktsikkerhet\n6. [`../README/README_DEV.md`](../README/README_DEV.md) — kjøring, debugging og validering\n7. [`../README/TEAM_WORKFLOW.md`](../README/TEAM_WORKFLOW.md) — arbeidsflyt og dokumentprioritet ved endringer",
          )
          replace_exact(
              "docs/README.md",
              "`SYSTEM_REGISTRY.md` og `SYSTEM_REGISTRY_SUBSYSTEM_CONTRACTS.md` utgjør sammen den aktive runtime-kontrakten. `APP_STRUCTURE_INDEX.md` eier bare index-appens interne struktur. Den tidligere pre-split-filen er bevart i [`../README/archive/SYSTEM_REGISTRY_PRE_SPLIT_2026-07-25.md`](../README/archive/SYSTEM_REGISTRY_PRE_SPLIT_2026-07-25.md) som historisk sporbarhet, ikke som bindende regelverk.",
              "`SYSTEM_REGISTRY.md` og `SYSTEM_REGISTRY_SUBSYSTEM_CONTRACTS.md` utgjør sammen den aktive runtime-kontrakten. `APP_STRUCTURE_INDEX.md` eier bare index-appens interne struktur. `HG_TEST_MODE.md` eier bare utviklermodusens query-, storage-, alias- og sikkerhetsgrense; runtimefilen eier tilstanden, og testmodus kan ikke overstyre server-, database- eller production-gates. Den tidligere pre-split-filen er bevart i [`../README/archive/SYSTEM_REGISTRY_PRE_SPLIT_2026-07-25.md`](../README/archive/SYSTEM_REGISTRY_PRE_SPLIT_2026-07-25.md) som historisk sporbarhet, ikke som bindende regelverk.",
          )
          replace_exact(
              "docs/README.md",
              "- Social Meet-kravkontraktenes statusavsnitt synkronisert med FastAPI-implementasjonen og løftet fra transitional til canonical",
              "- Social Meet-kravkontraktenes statusavsnitt synkronisert med FastAPI-implementasjonen og løftet fra transitional til canonical\n- `HG_TEST_MODE.md` synkronisert med runtime og registrert som canonical skjult utviklermoduskontrakt",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/README.md docs/documentation_registry.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Register canonical hidden test mode contract"
            git push origin HEAD:${{ github.head_ref }}
          fi
