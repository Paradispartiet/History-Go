name: Oslo bolk 05 — regenerate epoch index once
on:
  push:
    branches:
      - research/oslo-sentrum-bolk05-tekst-20261101
    paths:
      - .github/workflows/oslo-bolk05-epoke-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify derived epoch index
        run: |
          node scripts/build-epoke-place-index.mjs
          node scripts/build-epoke-place-index.mjs --check
      - name: Commit only the regenerated index and remove this one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/epoker/epoke-place-index.json
          git rm -- .github/workflows/oslo-bolk05-epoke-once.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Regenerate epoch place index for Oslo bolk 05"
          git push origin HEAD:research/oslo-sentrum-bolk05-tekst-20261101
