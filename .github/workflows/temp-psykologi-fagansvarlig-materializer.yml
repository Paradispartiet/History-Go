name: TEMP Psykologi fagansvarlig materializer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-psykologi-fagansvarlig-rollout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate canonical projections
        run: |
          node scripts/build-civication-scene-registry.mjs --write --json
          node scripts/audit-civication-career-gameplay.mjs --write
      - name: Verify rollout and full Civication suite
        run: |
          node tests/civication-psykologi-fagansvarlig-rollout-playability.test.js
          node tests/civication-psychology-career-contract.test.js
          node tests/civication-compiled-scene-registry.test.js
          npm run test:civication
      - name: Commit generated projections
        run: |
          git add data/Civication/careerGameplayMatrix.json data/Civication/compiledSceneRegistryV1.json reports/civication-career-gameplay-matrix.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate Psychology Fagansvarlig projections"
          git push origin HEAD:agent/civication-psykologi-fagansvarlig-rollout
