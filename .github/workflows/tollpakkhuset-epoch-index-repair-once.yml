name: Tollpakkhuset epoch index repair one-shot

on:
  push:
    branches: [agent/tollpakkhuset-completion-20260911-v2]
    paths:
      - ".github/workflows/tollpakkhuset-epoch-index-repair-once.yml"

permissions:
  contents: write

jobs:
  regenerate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate epoch place index and publish clean repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run epoker:places:build
          npm run epoker:places:check
          git rm .github/workflows/tollpakkhuset-epoch-index-repair-once.yml
          git add data/epoker/epoke-place-index.json
          if git diff --cached --quiet; then
            echo "Expected regenerated epoch index or workflow cleanup diff"
            exit 1
          fi
          git commit -m "Regenerate epoch place index for Tollpakkhuset"
          git push origin HEAD:agent/tollpakkhuset-completion-20260911-v2
