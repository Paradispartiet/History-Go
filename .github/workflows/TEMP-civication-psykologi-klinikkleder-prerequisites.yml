name: TEMP Materialize Klinikkleder prerequisites
on:
  push:
    branches: [agent/civication-psykologi-klinikkleder-prerequisites]
    paths: [scripts/TEMP_materialize_psykologi_klinikkleder_prerequisites.mjs,tests/civication-psykologi-klinikkleder-prerequisites.test.js,reports/CIVICATION_PSYKOLOGI_KLINIKKLEDER_PREREQUISITES_SOURCE_FIRST.md,.github/workflows/TEMP-civication-psykologi-klinikkleder-prerequisites.yml]
  workflow_dispatch:
concurrency: {group: "civication-psykologi-klinikkleder-prerequisites-${{ github.ref }}",cancel-in-progress: true}
permissions: {contents: write}
jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/civication-psykologi-klinikkleder-prerequisites,fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22,cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: node scripts/TEMP_materialize_psykologi_klinikkleder_prerequisites.mjs
      - run: |
          node scripts/audit-civication-role-packs.mjs
          sed -i '${/^$/d;}' docs/CIVICATION_ROLE_PACK_INDEX.md
          node scripts/build-civication-scene-registry.mjs --write
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - run: |
          node tests/civication-psykologi-klinikkleder-prerequisites.test.js
          node tests/civication-career-gameplay-matrix.test.js
          node tests/civication-role-world-rollout-readiness.test.js
          node tests/civication-role-pack-depth.test.js
          node scripts/build-civication-scene-registry.mjs --check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node --test tests/civication-scenario-people.test.mjs
      - run: npm run test:civication
      - run: rm scripts/TEMP_materialize_psykologi_klinikkleder_prerequisites.mjs .github/workflows/TEMP-civication-psykologi-klinikkleder-prerequisites.yml
      - run: |
          git diff --check
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Complete Klinikkleder prerequisites"
          git push origin HEAD:agent/civication-psykologi-klinikkleder-prerequisites
