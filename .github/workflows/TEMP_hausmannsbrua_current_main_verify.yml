name: TEMP Hausmannsbrua current-main verify

on:
  push:
    branches:
      - agent/hausmannsbrua-place-production-20260911
    paths:
      - ".github/workflows/TEMP_hausmannsbrua_current_main_verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/hausmannsbrua-place-production-20260911

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify current main is ancestor
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor 3913c7bc7b51864f0f21ec963bc9fea9c2b7dc6f HEAD

      - name: Re-run deterministic Hausmannsbrua finalizer
        run: node tools/finalize-hausmannsbrua-completion.mjs

      - name: Validate Hausmannsbrua closure
        run: node --test tests/hausmannsbrua-completion.test.mjs

      - name: Validate Lesespor
        shell: bash
        run: |
          npm run build:tools
          node dist/tools/validate_lesespor.mjs

      - name: Verify image backlog summary
        run: node scripts/audit-place-images.mjs --mode=all --report=/tmp/hausmannsbrua-place-image-audit.json --verify-summary=data/places/place_image_backlog_summary.json

      - name: Verify deterministic replay is clean
        shell: bash
        run: |
          git status --short
          git diff --exit-code
