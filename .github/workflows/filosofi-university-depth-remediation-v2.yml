name: One-shot Philosophy university-depth remediation v2

on:
  push:
    branches:
      - agent/repair-philosophy-university-depth

permissions:
  contents: write

concurrency:
  group: filosofi-university-depth-remediation-v2
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/repair-philosophy-university-depth
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Materialize honest Philosophy lifecycle and four reference rewrites
        run: |
          node --check scripts/repair-filosofi-university-depth-v2.mjs
          node scripts/repair-filosofi-university-depth-v2.mjs
          node scripts/audit-fagverk-filosofi-phase3.mjs --write-report --no-check-report
      - name: Validate Philosophy substantive university gate
        run: |
          node --check scripts/audit-fagverk-filosofi-phase3.mjs
          node --test \
            tests/fagverk-filosofi-complete.test.mjs \
            tests/fagverk-filosofi-editorial-style.test.mjs \
            tests/fagverk-filosofi-university-depth.test.mjs \
            tests/fagverk-filosofi-phase3.test.mjs
      - name: Validate shared Fagverk regressions
        run: |
          node --test tests/fagverk-general-engine.test.mjs tests/fagverk-subject-inventory.test.mjs
      - name: Retire obsolete generators and one-shot machinery
        run: |
          rm -f scripts/materialize-filosofi-complete.mjs
          rm -f scripts/polish-filosofi-complete.mjs
          rm -f scripts/repair-filosofi-university-depth-v2.mjs
          rm -f .github/workflows/filosofi-university-depth-remediation-v2.yml
      - name: Commit materialized remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized remediation changes to commit.'
            exit 0
          fi
          git commit -m 'Materialize substantive Philosophy university-depth gate'
          git push origin HEAD:agent/repair-philosophy-university-depth
