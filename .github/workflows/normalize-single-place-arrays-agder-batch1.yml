name: Normalize Agder single-place arrays batch 1

# Trigger normalization output again.
on:
  workflow_dispatch:
  push:
    branches:
      - data/normalize-single-place-arrays-agder-batch1

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/normalize-single-place-arrays-agder-batch1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/normalize-single-place-arrays-agder-batch1.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/by/agder reports/normalize-single-place-arrays-agder-batch1-report.json
          git commit -m "Normalize Agder single-place array files batch 1" || exit 0
          git push
