name: Civication A2 organic player acceptance (temporary)

on:
  push:
    branches:
      - civication-a2-full-browser-acceptance-2026-10-13
    paths:
      - .github/workflows/civication-a2-organic-acceptance-temporary.yml
      - scripts/verify-civication-organic-player-browser.ts

permissions:
  contents: read

jobs:
  organic-player:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run organic History Go to Civication player acceptance
        env:
          CIVICATION_BROWSER_DEPTH: organic
        run: npm run civication:boot-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: civication-a2-organic-browser-diagnostics
          path: reports/civication-browser/
          if-no-files-found: ignore
