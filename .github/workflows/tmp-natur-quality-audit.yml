name: Temporary Natur quality audit

on:
  push:
    branches: [feature/natur-fagverk-quality-lift]

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/natur-fagverk-quality-lift
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Inspect Natur canonical package
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const root = 'data/fag/natur';
          const pensum = read(path.join(root, 'naturpensum_canonical_v4_5.json'));
          const emner = read(path.join(root, 'emner_natur_canonical_v4_5.json'));
          const fagkart = read(path.join(root, 'fagkart_natur_canonical_v4_5.json'));
          const methodsRaw = read(path.join(root, 'methods_natur_canonical_v4_5.json'));
          const mappings = read(path.join(root, 'emnemapping_natur_canonical_v4_5.json'));
          const methods = Array.isArray(methodsRaw) ? methodsRaw : methodsRaw.methods || [];
          const text = (v) => String(v ?? '').trim();
          const norm = (v) => text(v).replace(/\s+/g, ' ').toLowerCase();
          const group = (field) => {
            const map = new Map();
            for (const e of emner) {
              const value = Array.isArray(e[field]) ? JSON.stringify(e[field]) : norm(e[field]);
              if (!value) continue;
              const rows = map.get(value) || [];
              rows.push(e.emne_id);
              map.set(value, rows);
            }
            return [...map.entries()].filter(([, ids]) => ids.length > 1).sort((a,b)=>b[1].length-a[1].length).map(([value, ids]) => ({count: ids.length, ids, sample: value.slice(0,220)}));
          };
          const domains = new Map(pensum.domains.map(d => [d.domain_id, d]));
          const methodIds = new Set(methods.map(m => m.method_id || m.id));
          const mappingIds = new Set(mappings.map(m => m.emne_id));
          const quality = emner.map(e => ({
            id: e.emne_id,
            title: e.title,
            domain: e.domain,
            level: e.level,
            status: e.status,
            definitionChars: text(e.definition).length,
            whyChars: text(e.why_it_matters).length,
            keyQuestions: Array.isArray(e.key_questions) ? e.key_questions.length : 0,
            conflicts: Array.isArray(e.conflicts) ? e.conflicts.length : 0,
            concepts: new Set([...(e.core_concepts||[]), ...(e.key_concepts||[]), ...(e.sub_concepts||[])]).size,
            methods: new Set([...(e.method_ids||[]), ...(e.methods||[]), ...(e.recommended_methods||[])]).size,
            cases: Array.isArray(e.recommended_oslo_cases) ? e.recommended_oslo_cases.length : 0,
            mapped: mappingIds.has(e.emne_id),
            domainKnown: domains.has(e.domain),
            unknownMethods: [...new Set([...(e.method_ids||[]), ...(e.methods||[]), ...(e.recommended_methods||[])])].filter(id => !methodIds.has(id))
          }));
          const report = {
            counts: {domains: pensum.domains.length, emner: emner.length, methods: methods.length, mappings: mappings.length, categories: (fagkart.categories||[]).length},
            duplicateDefinitions: group('definition'),
            duplicateWhy: group('why_it_matters'),
            duplicateQuestions: group('key_questions'),
            duplicateConflicts: group('conflicts'),
            genericPhraseCounts: {
              studiesAsEntry: emner.filter(e => norm(e.definition).includes('emnet studerer') && norm(e.definition).includes('som natur- og miljøfaglig inngang')).length,
              genericWhy: emner.filter(e => norm(e.why_it_matters).startsWith('emnet ')).length,
              sameQuestionOpening: emner.filter(e => (e.key_questions||[])[0]?.startsWith('Hvilken konkret art, habitat, vassdrag')).length,
              sameConflicts: emner.filter(e => JSON.stringify(e.conflicts||[]).includes('naturopplevelse vs økologisk analyse')).length
            },
            quality,
            pensumDomains: pensum.domains.map(d => ({id:d.domain_id,label:d.label,emneCount:d.emne_ids?.length,definition:d.definition,tagline:d.tagline,questionRole:d.question_role})),
            methods: methods.map(m => ({id:m.method_id||m.id,title:m.title||m.label,description:m.description||m.definition||m.purpose,dataForms:m.data_forms||m.evidence_forms||m.materials||[],steps:m.steps||m.procedure||[],limits:m.limitations||m.blindspots||[]}))
          };
          console.log('NATUR_QUALITY_REPORT_START');
          console.log(JSON.stringify(report, null, 2));
          console.log('NATUR_QUALITY_REPORT_END');
          NODE
