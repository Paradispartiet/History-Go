name: TEMP Civication Natur Forvaltning og rådgivning Role World

on:
  push:
    branches:
      - agent/civication-natur-forvaltning-og-radgivning-role-world
  workflow_dispatch:

concurrency:
  group: temp-civication-natur-forvaltning-og-radgivning-role-world
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-and-verify:
    if: >-
      !contains(github.event.head_commit.message, '[role-world-diag-skip]') &&
      !contains(github.event.head_commit.message, 'Complete Natur Forvaltning og rådgivning Role World')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/civication-natur-forvaltning-og-radgivning-role-world
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Syntax-check TEMP materializer, depth helper and focused test
        run: |
          node --check scripts/TEMP_materialize_natur_forvaltning_og_radgivning_role_world.mjs
          node --check scripts/TEMP_enrich_natur_forvaltning_og_radgivning_role_world_depth.mjs
          node --check tests/civication-natur-forvaltning-og-radgivning-role-world-rollout.test.js

      - name: Materialize and depth-enrich Role World candidate
        id: materialize
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            node scripts/TEMP_materialize_natur_forvaltning_og_radgivning_role_world.mjs
            node scripts/TEMP_enrich_natur_forvaltning_og_radgivning_role_world_depth.mjs
          } 2>&1 | tee /tmp/natur-forvaltning-og-radgivning-role-world-materializer.log

      - name: Persist materializer diagnostic fail-closed
        if: steps.materialize.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/natur-forvaltning-og-radgivning-role-world-materializer.log /tmp/materializer.log
          git reset --hard HEAD
          git clean -fd
          mkdir -p reports/TEMP
          cp /tmp/materializer.log reports/TEMP/natur-forvaltning-og-radgivning-role-world-materializer.log
          git add reports/TEMP/natur-forvaltning-og-radgivning-role-world-materializer.log
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Record Natur Forvaltning og rådgivning Role World materializer diagnostic [role-world-diag-skip]"
            git push origin HEAD:agent/civication-natur-forvaltning-og-radgivning-role-world
          fi
          exit 1

      - name: Build generated Role World surfaces
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== Career gameplay audit ==='
            node scripts/audit-civication-career-gameplay.mjs --write
            echo '=== Role World readiness audit ==='
            node scripts/audit-civication-role-world-rollout-readiness.mjs --write
          } 2>&1 | tee /tmp/natur-forvaltning-og-radgivning-role-world-build.log

      - name: Persist generated-surface diagnostic fail-closed
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/natur-forvaltning-og-radgivning-role-world-build.log /tmp/build.log
          git reset --hard HEAD
          git clean -fd
          mkdir -p reports/TEMP
          cp /tmp/build.log reports/TEMP/natur-forvaltning-og-radgivning-role-world-build.log
          git add reports/TEMP/natur-forvaltning-og-radgivning-role-world-build.log
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Record Natur Forvaltning og rådgivning Role World build diagnostic [role-world-diag-skip]"
            git push origin HEAD:agent/civication-natur-forvaltning-og-radgivning-role-world
          fi
          exit 1

      - name: Verify complete Role World candidate
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== Focused Natur Forvaltning og rådgivning Role World test ==='
            node tests/civication-natur-forvaltning-og-radgivning-role-world-rollout.test.js
            echo '=== Generic Role World contract ==='
            node tests/civication-role-world-contract.test.js
            echo '=== Role World readiness test ==='
            node tests/civication-role-world-rollout-readiness.test.js
            echo '=== Career gameplay matrix test ==='
            node tests/civication-career-gameplay-matrix.test.js
            echo '=== Scene Registry parity ==='
            node scripts/build-civication-scene-registry.mjs --check
            echo '=== Scenario People parity ==='
            node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
            echo '=== Scenario People test ==='
            node --test tests/civication-scenario-people.test.mjs
            echo '=== Full Civication suite ==='
            node tests/run-civication-tests.mjs
            echo '=== Job learning profiles ==='
            npm run audit:job-learning-profiles
            echo '=== Job knowledge requirements ==='
            npm run audit:job-knowledge-requirements
          } 2>&1 | tee /tmp/natur-forvaltning-og-radgivning-role-world-verification.log

      - name: Persist verification diagnostic fail-closed
        if: steps.verify.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          tail -n 500 /tmp/natur-forvaltning-og-radgivning-role-world-verification.log > /tmp/verification-tail.log
          git reset --hard HEAD
          git clean -fd
          mkdir -p reports/TEMP
          cp /tmp/verification-tail.log reports/TEMP/natur-forvaltning-og-radgivning-role-world-verification.log
          git add reports/TEMP/natur-forvaltning-og-radgivning-role-world-verification.log
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Record Natur Forvaltning og rådgivning Role World verification diagnostic [role-world-diag-skip]"
            git push origin HEAD:agent/civication-natur-forvaltning-og-radgivning-role-world
          fi
          exit 1

      - name: Repository diff hygiene
        if: steps.materialize.outcome == 'success' && steps.build.outcome == 'success' && steps.verify.outcome == 'success'
        run: git diff --check

      - name: Commit verified permanent Role World
        if: steps.materialize.outcome == 'success' && steps.build.outcome == 'success' && steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/TEMP_materialize_natur_forvaltning_og_radgivning_role_world.mjs
          rm -f scripts/TEMP_enrich_natur_forvaltning_og_radgivning_role_world_depth.mjs
          rm -f .github/workflows/TEMP-civication-natur-forvaltning-og-radgivning-role-world.yml
          rm -f reports/TEMP/natur-forvaltning-og-radgivning-role-world-materializer.log
          rm -f reports/TEMP/natur-forvaltning-og-radgivning-role-world-build.log
          rm -f reports/TEMP/natur-forvaltning-og-radgivning-role-world-verification.log
          rmdir reports/TEMP 2>/dev/null || true
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.' >&2
            exit 1
          fi
          git diff --cached --check
          git status --short
          git commit -m "Complete Natur Forvaltning og rådgivning Role World"
          git push origin HEAD:agent/civication-natur-forvaltning-og-radgivning-role-world