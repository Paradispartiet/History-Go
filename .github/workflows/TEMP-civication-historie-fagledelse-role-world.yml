name: TEMP Materialize Historie Fagledelse Role World

on:
  push:
    branches:
      - agent/civication-historie-fagledelse-role-world
  workflow_dispatch:

concurrency:
  group: civication-historie-fagledelse-role-world-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-and-verify:
    if: ${{ !contains(github.event.head_commit.message, 'Complete Historie Fagledelse Role World') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-historie-fagledelse-role-world
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Materialize Historie Fagledelse Role World
        run: node scripts/TEMP_materialize_historie_fagledelse_role_world.mjs
      - name: Regenerate career gameplay matrix
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Regenerate Role World readiness
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify focused Role World
        run: node tests/civication-historie-fagledelse-role-world-rollout.test.js
      - name: Verify prerequisite compatibility
        run: node tests/civication-historie-fagledelse-prerequisites.test.js
      - name: Verify Role World contract
        run: node tests/civication-role-world-contract.test.js
      - name: Verify Career Gameplay and readiness parity
        run: |
          node scripts/audit-civication-career-gameplay.mjs --check
          node scripts/audit-civication-role-world-rollout-readiness.mjs --check
      - name: Verify compiled Scene Registry parity
        run: node scripts/build-civication-scene-registry.mjs --check
      - name: Verify Scenario People invariants
        run: |
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node --test tests/civication-scenario-people.test.mjs
      - name: Run full Civication suite
        run: |
          set +e
          npm run test:civication > /tmp/civication.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            grep -E -B 8 -A 24 'AssertionError|ERR_ASSERTION|not ok|FAIL|Error:|error:' /tmp/civication.log | tail -n 220 || tail -n 220 /tmp/civication.log
            exit "$status"
          fi
          tail -n 50 /tmp/civication.log
      - name: Remove temporary Role World surfaces
        run: rm scripts/TEMP_materialize_historie_fagledelse_role_world.mjs .github/workflows/TEMP-civication-historie-fagledelse-role-world.yml
      - name: Commit exact verified Role World
        run: |
          git diff --check
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No permanent changes produced"; exit 1; }
          git diff --cached --check
          git commit -m "Complete Historie Fagledelse Role World"
          git push origin HEAD:agent/civication-historie-fagledelse-role-world
