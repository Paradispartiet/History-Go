name: TEMP Oslo timeline v4 materialize

on:
  push:
    branches:
      - agent/oslo-timeline-anchors-v4-20260826

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize manifest, index and regression expectations
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const manifestPath = 'data/leksikon/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const additions = [
            'data/leksikon/places/oslo/historie/leksikon_clemenskirken_ruin_oslo.json',
            'data/leksikon/places/oslo/historie/leksikon_minneparken_gamlebyen.json',
            'data/leksikon/places/oslo/historie/leksikon_saxegarden.json'
          ];
          for (const file of additions) if (!manifest.files.includes(file)) manifest.files.push(file);
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);

          const testPath = 'tests/epoke-place-index.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace(
            '// Three individually reviewed Oslo places now carry dated, source-backed History evidence.',
            '// Six individually reviewed Oslo places now carry dated, source-backed History evidence.'
          );
          test = test.replace('assert.equal(coverage.dated_evidence_place_count, 183);', 'assert.equal(coverage.dated_evidence_place_count, 186);');
          test = test.replace('assert.equal(coverage.awaiting_source_backed_history_count, 382);', 'assert.equal(coverage.awaiting_source_backed_history_count, 379);');
          test = test.replace(
            'for (const placeId of ["markveien", "paulus_kirke", "arbeidermuseet"]) {',
            'for (const placeId of ["markveien", "paulus_kirke", "arbeidermuseet", "clemenskirken_ruin_oslo", "minneparken_gamlebyen", "saxegarden"]) {'
          );
          fs.writeFileSync(testPath, test);
          NODE

          node scripts/build-epoke-place-index.mjs

      - name: Verify exact source-backed anchors
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const index = JSON.parse(fs.readFileSync('data/epoker/epoke-place-index.json', 'utf8'));
          const milestonesFor = (placeId) => Object.values(index.domains.historie.epochs)
            .flatMap((group) => group.places)
            .filter((place) => place.place_id === placeId)
            .flatMap((place) => place.milestones)
            .filter((milestone) => milestone.evidence_type === 'leksikon_chronology');
          const yearsFor = (placeId) => [...new Set(milestonesFor(placeId).map((milestone) => milestone.year))].sort((a, b) => a - b);
          assert.deepEqual(yearsFor('clemenskirken_ruin_oslo'), [1920, 1970, 2000]);
          assert.deepEqual(yearsFor('minneparken_gamlebyen'), [1932, 2024]);
          assert.deepEqual(yearsFor('saxegarden'), [1334, 1624]);
          assert.equal(milestonesFor('clemenskirken_ruin_oslo').some((milestone) => milestone.year === 1135), false);
          assert.equal(index.domains.historie.oslo_coverage.dated_evidence_place_count, 186);
          assert.equal(index.domains.historie.oslo_coverage.awaiting_source_backed_history_count, 379);
          console.log('OSLO_MEDIEVAL_V4', JSON.stringify({
            indexed: index.stats.indexed_place_count,
            milestones: index.stats.milestone_count,
            coverage: index.domains.historie.oslo_coverage,
            clemenskirken: yearsFor('clemenskirken_ruin_oslo'),
            minneparken: yearsFor('minneparken_gamlebyen'),
            saxegarden: yearsFor('saxegarden')
          }));
          NODE

          node scripts/build-epoke-place-index.mjs --check
          node --test tests/epoke-place-index.test.mjs
          git diff --check

      - name: Commit deterministic materialization and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/TEMP-oslo-timeline-v4-intake.yml
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add data/leksikon/manifest.json data/epoker/epoke-place-index.json tests/epoke-place-index.test.mjs .github/workflows/TEMP-oslo-timeline-v4-intake.yml
          git add data/leksikon/places/oslo/historie/leksikon_clemenskirken_ruin_oslo.json data/leksikon/places/oslo/historie/leksikon_minneparken_gamlebyen.json data/leksikon/places/oslo/historie/leksikon_saxegarden.json
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "Materialize source-backed Gamlebyen timeline anchors"
          git push origin HEAD:agent/oslo-timeline-anchors-v4-20260826
