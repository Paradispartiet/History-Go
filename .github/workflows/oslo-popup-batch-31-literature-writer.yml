name: One-time Oslo popup batch 31 literature writer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/oslo-popup-batch-31-trigger.txt

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-popup-v4-batch-31-literature-ten
          fetch-depth: 0
      - name: Apply isolated Batch 31 texts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const files=['.github/oslo-popup-batch-31-literature-patch-a.json','.github/oslo-popup-batch-31-literature-patch-b.json'];
          const items=files.flatMap(f=>JSON.parse(fs.readFileSync(f,'utf8')).places);
          const words=t=>(String(t).match(/[\p{L}\p{N}]+(?:[’'\-][\p{L}\p{N}]+)*/gu)||[]).length;
          const paras=t=>String(t).trim().split(/\n\s*\n/).filter(Boolean).length;
          const withoutText=v=>{const c=JSON.parse(JSON.stringify(v));delete c.desc;delete c.popupDesc;return c;};
          const rows=[];
          for(const item of items){
            const before=JSON.parse(fs.readFileSync(item.path,'utf8'));
            const after={...before,desc:item.desc,popupDesc:item.popupDesc};
            if(JSON.stringify(withoutText(before))!==JSON.stringify(withoutText(after)))throw new Error(`Non-text parity: ${item.id}`);
            const dw=words(after.desc),pw=words(after.popupDesc),pc=paras(after.popupDesc);
            console.log(`${item.id}: desc=${dw}, popup=${pw}, paragraphs=${pc}`);
            if(dw<40||dw>80)throw new Error(`${item.id} desc ${dw}`);
            if(pw<300||pw>600)throw new Error(`${item.id} popup ${pw}`);
            if(pc!==6)throw new Error(`${item.id} paragraphs ${pc}`);
            fs.writeFileSync(item.path,JSON.stringify(after,null,2)+'\n');
            rows.push({name:after.name,id:after.id,dw,pw,pc});
          }
          const pr=process.env.PR_NUMBER;if(!/^\d+$/.test(pr||''))throw new Error('Invalid PR');
          const pp='reports/place-description-revision-protocol.md';let p=fs.readFileSync(pp,'utf8');
          p=p.replace('Ferdige etter alle mergede revisjonsbatcher: **249 steder**','Ferdige etter alle mergede revisjonsbatcher: **259 steder**')
             .replace('Gjenstår: **263 steder**','Gjenstår: **253 steder**')
             .replace('Det gjenstår **263 aktive Oslo-steder**','Det gjenstår **253 aktive Oslo-steder**')
             .replace('- litteratur: **11**','- litteratur: **1**');
          const rowText=rows.map((r,i)=>`| ${250+i} | ${r.name} | \`${r.id}\` | ${r.dw} | ${r.pw} | ${r.pc} | #${pr} |`).join('\n');
          if(!p.includes('| 250 | IBSEN Museum & Teater |'))p=p.replace('\n## Gjenstående Oslo-kø',`\n\n${rowText}\n\n## Gjenstående Oslo-kø`);
          const batch=`| Oslo V4 batch 31 | 10 | #${pr} – andre produksjonsbatch fra litteraturkøen |`;
          if(!p.includes(batch))p=p.replace(/(\| Oslo V4 batch 30 \| 10 \| #[0-9]+ – første produksjonsbatch fra litteraturkøen \|)/,`$1\n${batch}`);
          fs.writeFileSync(pp,p);
          NODE
          node tools/audit-oslo-place-description-scope.mjs --write
          node <<'NODE'
          const fs=require('fs');
          const p=fs.readFileSync('reports/place-description-revision-protocol.md','utf8');
          const a=fs.readFileSync('reports/oslo-place-description-scope-audit-2026-07-26.md','utf8');
          if(!p.includes('Ferdige etter alle mergede revisjonsbatcher: **259 steder**'))throw new Error('protocol total');
          if(!p.includes('Gjenstår: **253 steder**'))throw new Error('protocol remaining');
          if(!p.includes('- litteratur: **1**'))throw new Error('protocol literature');
          if(!a.includes('IDs in the current revision protocol: **259**'))throw new Error('audit total');
          if(!a.includes('Additional active Oslo IDs outside the protocol: **253**'))throw new Error('audit remaining');
          if(!a.includes('| litteratur | 1 |'))throw new Error('audit literature');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/litteratur/oslo/places_litteratur/ibsen_museum_teater.json data/places/litteratur/oslo/places_litteratur/ibsen_quotes.json data/places/litteratur/oslo/places_litteratur/inger_hagerups_plass.json data/places/litteratur/oslo/places_litteratur/kulturkirken_jakob_litteratur.json data/places/litteratur/oslo/places_litteratur/litteraturhuset.json data/places/litteratur/oslo/places_litteratur/nasjonalbiblioteket.json data/places/litteratur/oslo/places_litteratur/norli_universitetsgata.json data/places/litteratur/oslo/places_litteratur/oscar_braaten_statuen.json data/places/litteratur/oslo/places_litteratur/ruth_maier_minne.json data/places/litteratur/oslo/places_litteratur/sigrid_undset_statue.json reports/oslo-place-description-scope-audit-2026-07-26.json reports/oslo-place-description-scope-audit-2026-07-26.md reports/place-description-revision-protocol.md
          git commit -m "Revise second Oslo literature descriptions"
          git push origin HEAD:agent/oslo-popup-v4-batch-31-literature-ten
