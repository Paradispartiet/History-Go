name: Split Ostlandet motorsport places

on:
  push:
    branches:
      - data/split-sport-motorsport-ostlandet-20260708

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/split-sport-motorsport-ostlandet-20260708
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/split-sport-motorsport-ostlandet.mjs
      - run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add data/places/sport/europa/norway/places_motorsport_ostlandet data/places/sport/europa/norway/places_motorsport_ostlandet_manifest.json data/places/sport/europa/norway/places_motorsport_ostlandet_index.json data/places/sport/europa/norway/places_motorsport_ostlandet_split_report.txt
          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Generate split Ostlandet motorsport place files"
            git push
          fi
