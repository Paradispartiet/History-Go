name: TEMP finalize fagverk documentation governance

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/one-time-finalize-fagverk-governance.mjs'
      - '.github/workflows/one-time-finalize-fagverk-governance.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/fagverk-documentation-governance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check finalizer
        run: node --check scripts/one-time-finalize-fagverk-governance.mjs
      - name: Finalize documentation governance
        run: |
          node scripts/one-time-finalize-fagverk-governance.mjs
          rm .github/workflows/one-time-finalize-fagverk-governance.yml
      - name: Install and build documentation tooling
        run: |
          npm ci --no-audit --no-fund
          npm run build:scripts
      - name: Regenerate documentation inventory
        run: node dist/scripts/check-documentation-governance.mjs
      - name: Verify canonical fagverk documentation
        run: |
          node --test tests/fagverk-documentation-contract.test.mjs
          node --test tests/fagverk-portal.test.mjs
          node --test tests/fagverk-content.test.mjs
          node --test tests/fagverk-link-audit.test.mjs
          node -e "JSON.parse(require('fs').readFileSync('docs/documentation_registry.json','utf8'))"
          git diff --check
      - name: Commit durable result
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --worktree --staged dist 2>/dev/null || true
          git rm scripts/one-time-finalize-fagverk-governance.mjs
          git add \
            docs/FAGVERK.md \
            docs/README.md \
            docs/DATA_PRODUCTION_CONTRACT.md \
            docs/documentation_registry.json \
            README/README.pensum.md \
            reports/documentation-governance/inventory.json
          git diff --cached --check
          git commit -m "Registrer og krysslenk canonical fagverkskontrakt"
          git push origin "HEAD:${BRANCH}"
