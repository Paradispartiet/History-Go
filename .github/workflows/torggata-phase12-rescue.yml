name: Torggata phase 12 rescue

on:
  push:
    branches:
      - agent/torggata-phase12-closeout-current
    paths:
      - .github/workflows/torggata-phase12-rescue.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: torggata-phase12-rescue
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current main-based branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Execute reviewed phase 12 closeout without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BRANCH='agent/torggata-phase12-people-closeout'
          SOURCE_REF="refs/remotes/origin/${SOURCE_BRANCH}"
          git fetch --no-tags origin "refs/heads/${SOURCE_BRANCH}:${SOURCE_REF}"

          mkdir -p reports/place-production
          git show "${SOURCE_REF}:reports/place-production/torggata-phase12-image-candidates-v1.json" > reports/place-production/torggata-phase12-image-candidates-v1.json
          git show "${SOURCE_REF}:reports/place-production/torggata-phase12-image-review-summary-v1.json" > reports/place-production/torggata-phase12-image-review-summary-v1.json
          git show "${SOURCE_REF}:.github/workflows/torggata-phase12-closeout.yml" > /tmp/torggata-phase12-source.yml

          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          lines = Path('/tmp/torggata-phase12-source.yml').read_text(encoding='utf-8').splitlines()
          steps = []
          i = 0
          while i < len(lines):
              match = re.match(r'^      - name: (.+?)\s*$', lines[i])
              if not match:
                  i += 1
                  continue
              name = match.group(1)
              j = i + 1
              run_start = None
              while j < len(lines) and not re.match(r'^      - name: ', lines[j]):
                  if lines[j] == '        run: |':
                      run_start = j + 1
                      break
                  j += 1
              if run_start is None:
                  i = j
                  continue
              block = []
              k = run_start
              while k < len(lines) and not re.match(r'^      - name: ', lines[k]):
                  raw = lines[k]
                  if raw.startswith('          '):
                      block.append(raw[10:])
                  elif raw == '':
                      block.append('')
                  else:
                      break
                  k += 1
              steps.append((name, '\n'.join(block) + '\n'))
              i = k

          required = {
              'Install dependencies',
              'Build five reviewed Commons candidates',
              'Apply Torggata image holdbacks',
              'Mark audit PASS and validate permanent scope',
              'Persist phase 12',
          }
          discovered = {name for name, _ in steps}
          missing = sorted(required - discovered)
          if missing:
              raise SystemExit(f'Missing source workflow steps: {missing}')

          for name, script in steps:
              if name == 'Persist phase 12':
                  continue
              if name == 'Mark audit PASS and validate permanent scope':
                  script = '\n'.join(
                      line for line in script.splitlines()
                      if 'rm -f .github/workflows/torggata-phase12-closeout.yml' not in line
                  ) + '\n'
              print(f'::group::{name}', flush=True)
              completed = subprocess.run(
                  ['bash', '-c', 'set -euo pipefail\n' + script],
                  check=False,
              )
              print('::endgroup::', flush=True)
              if completed.returncode != 0:
                  raise SystemExit(f'Source workflow step failed: {name} ({completed.returncode})')
          PY

      - name: Persist phase 12 without changing the rescue workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git status --short
          if git diff --cached --quiet; then
            echo 'Phase 12 produced no permanent changes.' >&2
            exit 1
          fi
          if ! git diff --cached --name-only | grep -q '^reports/place-production/torggata-phase12-people-links-audit-v1.json$'; then
            echo 'Permanent phase 12 audit was not staged.' >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'A workflow mutation leaked into the permanent commit.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Godkjenn Torggata fase 12 People'
          git push origin HEAD:agent/torggata-phase12-closeout-current
