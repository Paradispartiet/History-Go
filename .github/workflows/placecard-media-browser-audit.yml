name: PlaceCard media browser audit

on:
  pull_request:
    paths:
      - 'css/placeCard.css'
      - 'css/place-sheet.css'
      - 'css/place-card-reader.css'
      - 'css/place-card-sticky-header.css'
      - 'css/place-rounds-fill-layout.css'
      - 'css/person-popup-v2.css'
      - 'css/people.css'
      - 'css/popups.css'
      - 'css/popup-polish.css'
      - 'index.html'
      - 'js/ui/place-card.js'
      - 'js/ui/place-card-sticky-header.js'
      - 'js/ui/place-card-status-surface.js'
      - 'js/ui/place-rounds-visual-collections.js'
      - 'js/ui/place-rounds-fill-layout.js'
      - 'js/ui/person-popup-v2.js'
      - 'js/ui/popup-utils.js'
      - 'js/app.js'
      - 'tests/person-popup-v2.test.js'
      - 'tests/person-popup-placecard-layout-browser.test.mjs'
      - 'tests/placecard-people-hero-browser.test.mjs'
      - 'tests/placecard-hero-meta-position-browser.test.mjs'
      - 'tests/placecard-sticky-image-header-browser.test.mjs'
      - 'tests/place-card-meta-surfaces.test.mjs'
      - 'tests/christiania-torv-placecard-collections-v2.test.mjs'
      - 'tests/christiania-torv-placecard-collections-v2-browser-audit.test.mjs'
      - 'tests/placecard-media-hero-responsive-browser.test.mjs'
      - 'tests/black-box-productions-browser-audit.test.mjs'
      - 'tests/oslo-v1-actual-runtime-visual-browser-audit.mjs'
      - 'tests/oslo-v1-quizcard-manifest-binding.test.mjs'
      - '.github/workflows/placecard-media-browser-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: placecard-media-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  placecard-media-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify background reinitialization preserves an open PlaceCard
        run: node --test tests/bottom-sheet-controller-reinit.test.mjs
      - name: Verify first PlaceCard at phone and tablet widths
        env:
          HG_VISUAL_PLACES: groruddammen
          HG_VISUAL_OUT: .tmp/groruddammen-first-place-audit
          HG_VISUAL_CAPTURES: .tmp/groruddammen-first-place-captures
        run: node tests/oslo-v1-actual-runtime-visual-browser-audit.mjs
      - name: Audit compact PlaceCard at mobile and desktop widths
        run: node tests/placecard-media-hero-responsive-browser.test.mjs
      - name: Audit Black Box productions across mobile, tablet and desktop
        run: node tests/black-box-productions-browser-audit.test.mjs
      - name: Verify PlaceCard status, title and category positions
        run: node tests/placecard-hero-meta-position-browser.test.mjs
      - name: Verify compact sticky photo and automatic heading contrast
        run: node tests/placecard-sticky-image-header-browser.test.mjs
      - name: Verify PlaceCard metadata and progress click behavior
        run: node --test tests/place-card-meta-surfaces.test.mjs
      - name: Verify People circle beside Merker on landscape hero
        run: node tests/placecard-people-hero-browser.test.mjs
      - name: Verify Christiania Torv canonical collections
        run: node --test --test-name-pattern="runtime renders the v2 profile" tests/christiania-torv-placecard-collections-v2.test.mjs
      - name: Audit Christiania Torv media grid after moving People circle
        run: node tests/christiania-torv-placecard-collections-v2-browser-audit.test.mjs
      - name: Verify person popup layout contract
        run: node --test --test-name-pattern="person surface follows PlaceCard framing" tests/person-popup-v2.test.js
      - name: Audit People popup map and footer framing at all widths
        run: node tests/person-popup-placecard-layout-browser.test.mjs
      - name: Verify all sixteen Oslo v1 candidate QuizCards and real image compositions
        run: |
          node --test tests/oslo-v1-quizcard-manifest-binding.test.mjs
          node tests/oslo-v1-actual-runtime-visual-browser-audit.mjs
