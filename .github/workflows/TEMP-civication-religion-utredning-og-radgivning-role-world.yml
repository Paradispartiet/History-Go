name: TEMP Civication Religion Utredning og rådgivning Role World

on:
  push:
    branches:
      - agent/civication-religion-utredning-og-radgivning-role-world-20260908
    paths:
      - scripts/TEMP_materialize_religion_utredning_og_radgivning_role_world.mjs
      - .github/workflows/TEMP-civication-religion-utredning-og-radgivning-role-world.yml

permissions:
  contents: write

concurrency:
  group: temp-civication-religion-utredning-og-radgivning-role-world
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-religion-utredning-og-radgivning-role-world-20260908
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Require fresh main ancestry before materialization
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "Branch is not based on current main" >&2; exit 1; }

      - name: Apply role-owned quality repairs before materialization
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const p='scripts/TEMP_materialize_religion_utredning_og_radgivning_role_world.mjs';
          let s=fs.readFileSync(p,'utf8');
          const before='kan ikke skape delegasjon, juridisk kompetanse, tilgang eller representasjonsmandat';
          const after='kan ikke skape delegasjon, institusjonell myndighet, juridisk kompetanse, tilgang eller representasjonsmandat';
          if(!s.includes(before)) throw new Error('Expected authority-boundary wording not found');
          s=s.replace(before,after);
          const extras={
            kilder_og_pluralisme:' Når en ressurssterk organisasjon leverer ferdige formuleringer, mens mindre synlige berørte mangler tid eller institusjonell tilgang, må rådgiveren vise hvorfor kildevekt ikke kan følge sosial styrke. Relasjonen tåler uenighet bedre når provenance, utvalgskriterier og manglende stemmer står synlig i samme utredningslogg som anbefalingen.',
            juss_og_rettighetsgrense:' Relasjonen til juridisk og forvaltningsfaglig kontroll blir derfor et spørsmål om timing og rolleforståelse: tidlig eskalering kan forsinke leveransen, men beskytter både rettigheter og beslutningseier mot at et religionsfaglig premiss får falsk rettslig autoritet. Standing hos kontrollmiljøet kan gi bedre dialog, aldri gjøre rådgiveren til jurist eller vedtaksmyndighet.',
            senioritet_og_uformell_makt:' Den sosiale prøven kommer når yngre kolleger, bestillere eller ledere begynner å lese Seniorrådgiverens sikkerhet som en ordre. Da må spilleren aktivt gjøre beslutningseier, kildegrunnlag og delegasjon synlig, også når det svekker egen prestisje. God standing betyr at andre stoler på grensearbeidet; den kan ikke bli en uformell snarvei til myndighet.',
            beslutning_handoff_og_ansvar:' Forholdet til beslutningseieren blir sterkere når det fortsatt er mulig å se hva rådgiveren anbefalte, hvilke premisser som var usikre, og hva beslutningseieren selv valgte av politiske, økonomiske eller organisatoriske grunner. Senere kritikk skal derfor kunne rettes mot riktig ledd i kjeden uten at rådgivning og vedtak smeltes sammen.',
            offentlighet_omdomme_og_korrigering:' Relasjonen til offentlighet og mottakere blir særlig krevende når en synlig rettelse kan skade kortsiktig standing, mens taus omskriving ville beskytte ansikt. Spilleren må bevare tidligere versjon, forklare hvilket nytt faktum som endret vurderingen og holde fast ved at popularitet eller medietrykk ikke kan oppgradere svak evidens eller skape representasjonsmandat.',
            privat_liv_og_rollegrenser:' Den private relasjonen blir dermed en egen integritetsprøve: støtte kan hjelpe spilleren å tåle usikkerhet og sosial kostnad, men en venn, partner eller tidligere kollega kan ikke brukes som uregistrert kilde, uformell tilgang eller påvirkningskanal. Når arbeidet diskuteres hjemme må fortrolighet, aktørmandat og beslutningseierskap fortsatt respekteres.'
          };
          for(const [id,extra] of Object.entries(extras)){
            const marker=` ['${id}','`;
            const start=s.indexOf(marker);
            if(start<0) throw new Error(`Thread ${id} not found`);
            const bodyStart=start+marker.length;
            const end=s.indexOf("']",bodyStart);
            if(end<0) throw new Error(`Thread ${id} terminator not found`);
            s=s.slice(0,end)+extra+s.slice(end);
          }
          for(const id of Object.keys(extras)){
            const marker=` ['${id}','`;
            const start=s.indexOf(marker)+marker.length;
            const end=s.indexOf("']",start);
            const len=s.slice(start,end).length;
            if(len<350) throw new Error(`Thread ${id} still too short: ${len}`);
            console.log(`${id}: ${len}`);
          }
          fs.writeFileSync(p,s);
          NODE

      - name: Syntax
        run: node --check scripts/TEMP_materialize_religion_utredning_og_radgivning_role_world.mjs

      - name: Materialize Religion Utredning og rådgivning Role World
        run: node scripts/TEMP_materialize_religion_utredning_og_radgivning_role_world.mjs

      - name: Restore TEMP materializer source
        run: git checkout HEAD -- scripts/TEMP_materialize_religion_utredning_og_radgivning_role_world.mjs

      - name: Generate canonical rollout surfaces
        run: |
          set -euo pipefail
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write

      - name: Verify Religion Utredning og rådgivning Role World
        run: node tests/civication-religion-utredning-og-radgivning-role-world-rollout.test.js

      - name: Verify global Role World contract
        run: node tests/civication-role-world-contract.test.js

      - name: Verify Career Gameplay Matrix
        run: node tests/civication-career-gameplay-matrix.test.js

      - name: Verify Role World readiness
        run: node tests/civication-role-world-rollout-readiness.test.js

      - name: Verify Scene Registry
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Verify Scenario People index
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check

      - name: Verify Scenario People audit
        run: node --test tests/civication-scenario-people.test.mjs

      - name: Verify full Civication suite
        run: node tests/run-civication-tests.mjs

      - name: Verify job learning profiles
        run: npm run audit:job-learning-profiles

      - name: Verify job knowledge requirements
        run: npm run audit:job-knowledge-requirements

      - name: Require fresh main ancestry before scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "main moved during verification" >&2; exit 1; }

      - name: Verify exact permanent Role World scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          if [ "${#changed[@]}" -ne 9 ]; then
            echo "Expected exactly 9 permanent Role World paths, found ${#changed[@]}" >&2
            exit 1
          fi
          for f in "${changed[@]}"; do
            case "$f" in
              data/Civication/careerGameplayMatrix.json|data/Civication/roleWorldAuthoringChecklist.json|data/Civication/roleWorldRolloutReadiness.json|data/Civication/roleWorldThemeBank.json|data/Civication/roleWorlds/index.json|data/Civication/roleWorlds/religion/religion_utredning_og_radgivning.json|reports/CIVICATION_RELIGION_UTREDNING_OG_RADGIVNING_ROLE_WORLD_ROLLOUT_SOURCE_FIRST.md|reports/civication-role-world-rollout-readiness.md|tests/civication-religion-utredning-og-radgivning-role-world-rollout.test.js)
                ;;
              *)
                echo "Unexpected generated path: $f" >&2
                exit 1
                ;;
            esac
          done
          for required in \
            data/Civication/careerGameplayMatrix.json \
            data/Civication/roleWorldAuthoringChecklist.json \
            data/Civication/roleWorldRolloutReadiness.json \
            data/Civication/roleWorldThemeBank.json \
            data/Civication/roleWorlds/index.json \
            data/Civication/roleWorlds/religion/religion_utredning_og_radgivning.json \
            reports/CIVICATION_RELIGION_UTREDNING_OG_RADGIVNING_ROLE_WORLD_ROLLOUT_SOURCE_FIRST.md \
            reports/civication-role-world-rollout-readiness.md \
            tests/civication-religion-utredning-og-radgivning-role-world-rollout.test.js; do
            printf '%s\n' "${changed[@]}" | grep -Fx "$required" >/dev/null || { echo "Missing required permanent path: $required" >&2; exit 1; }
          done
          git diff --check

      - name: Require fresh main ancestry before permanent commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "main moved before permanent commit" >&2; exit 1; }

      - name: Commit permanent verified Role World
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/TEMP_materialize_religion_utredning_og_radgivning_role_world.mjs
          rm -f .github/workflows/TEMP-civication-religion-utredning-og-radgivning-role-world.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.' >&2
            exit 1
          fi
          git diff --cached --check
          git status --short
          git commit -m "Complete Religion Utredning og rådgivning Role World"
          git push origin HEAD:agent/civication-religion-utredning-og-radgivning-role-world-20260908
