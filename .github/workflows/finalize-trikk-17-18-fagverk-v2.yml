name: Finalize Trikk 17/18 Fagverk v2

on:
  push:
    branches:
      - work/trikk-17-18-fagverk-v2-20260901
    paths:
      - .github/workflows/finalize-trikk-17-18-fagverk-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Sync branch to current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Materialize Trikk 17/18 Fagverk source and image repair
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const placePath = 'data/places/by/oslo/places/trikk_17_18.json';
          const registryPath = 'data/fagverk/fagverk_registry.json';
          const backlogPath = 'data/places/place_image_backlog_summary.json';
          const place = JSON.parse(fs.readFileSync(placePath, 'utf8'));

          const imageUrl = 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Grefsen_SL18.jpg/1280px-Grefsen_SL18.jpg';
          const staleImage = place.image === 'bilder/places/trikk_17_18.JPG' && place.cardImage === 'bilder/kort/places/trikk_17_18.PNG';
          if (staleImage) {
            place.image = imageUrl;
            place.cardImage = imageUrl;
          }

          const sources = [
            ['Ruter – trikkelinjer og rutetabeller', 'https://ruter.no/planlegg-reise/rutetabeller-og-linjekart/trikk'],
            ['Entur NSR – Gaustadalléen', 'https://api.entur.io/geocoder/v1/autocomplete?text=Gaustadall%C3%A9en&layers=venue&multiModal=parent'],
            ['Entur NSR – Nybrua', 'https://api.entur.io/geocoder/v1/autocomplete?text=Nybrua&layers=venue&multiModal=parent'],
            ['Entur NSR – Sinsenkrysset', 'https://api.entur.io/geocoder/v1/autocomplete?text=Sinsenkrysset&layers=venue&multiModal=parent'],
            ['Entur NSR – Storo', 'https://api.entur.io/geocoder/v1/autocomplete?text=Storo&layers=venue&multiModal=parent'],
            ['Entur NSR – Grefsen stasjon', 'https://api.entur.io/geocoder/v1/autocomplete?text=Grefsen%20stasjon&layers=venue&multiModal=parent']
          ];
          const existingLinks = Array.isArray(place.externalLinks) ? place.externalLinks : [];
          const byUrl = new Map(existingLinks.filter((row) => row?.url).map((row) => [row.url, row]));
          for (const [label, url] of sources) byUrl.set(url, { type: 'source', label, url, verifiedAt: '2026-09-01' });
          place.externalLinks = [...byUrl.values()];

          place.fagverk = {
            schema: 'history_go_place_fagverk_v2',
            level: 'full',
            status: 'curated',
            intro: 'Trikkelinje 17/18 er et godt eksempel på at en kollektivlinje kan forstås som nettverk, ikke bare som en strek på kartet. Ruteparret deler vestende og sentrumsstrekning, forgrener seg etter Nybrua, følger hver sin nordlige korridor og møtes igjen ved Grefsen stasjon. Dermed kan stedet brukes til å undersøke rutegeometri, forgreninger, stoppankre og hvordan kollektivnettet organiserer bevegelse gjennom ulike deler av byen.',
            article: [
              'Ruters rutedefinisjon gyldig fra 20. april 2026 viser linje 17 og 18 som et forgrenet rutepar. Begge starter ved Gaustadalléen og følger samme trase gjennom den vestlige og sentrale delen av reisen. Etter Nybrua skiller de lag: linje 17 går via Sinsenkrysset, mens linje 18 går via Storo. Begge ender ved Grefsen stasjon. Det betyr at ett History Go-sted kan representere to linjer når fellesstrekning, grenpunkt og egne grenankre er eksplisitt modellert.',
              'Nybrua fungerer som det pedagogiske hovedankeret fordi holdeplassen ligger på den delte sentrumsstrekningen rett før rutene går inn i to forskjellige nordlige korridorer. Et slikt grenpunkt viser forskjellen mellom en holdeplass og en nettverksnode: stedet er ikke bare et punkt der passasjerer går av og på, men et punkt der den videre rutegeometrien skifter. For å lese kollektivnettet må man derfor se både på stoppet og på hvilke linjeforløp som kommer før og etter.',
              'De fem Entur-ankrene gjør denne strukturen kontrollerbar. Gaustadalléen representerer felles vestende, Nybrua representerer den delte sentrumsstrekningen, Sinsenkrysset dokumenterer linje 17-grenen, Storo dokumenterer linje 18-grenen, og Grefsen stasjon representerer felles ende. Til sammen viser ankerrekken hvordan et forgrenet rutenett kan beskrives med få, tydelige observasjonspunkter uten å late som hele ruten har ett geografisk sentrum.',
              'De to grenene kan sammenlignes som forskjellige måter å føre kollektivtrafikk gjennom byen på. Ved Sinsenkrysset møter trikken et stort, planskilt trafikksystem, mens Storo er et tett kollektivknutepunkt med flere transportformer og byfunksjoner samlet. Feltarbeid kan registrere sporplassering, kryssing av gater, holdeplassrom, overganger og hvilke forbindelser som er synlige. Slik kan samme rutepar brukes til å sammenligne hvordan skinnegående transport inngår i forskjellige bymiljøer.',
              'Felles endepunkt ved Grefsen stasjon viser at forgrening ikke nødvendigvis betyr to helt separate linjesystemer. Rutene kan skille lag og senere møtes igjen. Dette er nyttig når man analyserer redundans og rutemuligheter: flere veier gjennom nettet kan gi ulike reisevalg mellom deler av byen, men faktisk robusthet ved driftsavvik kan ikke avgjøres bare ved å se på kartet eller holdeplassene. Det krever driftsdata og informasjon om frekvens og avvik.',
              'Feltobservasjon langs 17/18 kan dokumentere hvor rutene deler spor, hvor de forgrener seg, hvordan holdeplassene ligger i gatenettet og hvilke ganglinjer som leder til stoppene. Slike observasjoner sier mye om fysisk tilgjengelighet og nettverksform. De sier derimot ikke alene noe sikkert om passasjertall, punktlighet, kapasitet, sosial fordeling av bruk eller hvilken gren som er mest effektiv. Slike spørsmål krever andre datasett enn selve rutegeometrien.'
            ],
            subject_ids: ['by'],
            emne_ids: ['em_by_infrastruktur_mobilitet', 'em_by_gangstrommer_snarveier'],
            chapter_ids: ['urbanisme-idealer-forbindelser-fortetting'],
            lenses: [
              {
                id: 'trikk1718-forgrenet-rutepar',
                title: 'Forgrenet rutepar',
                prompt: 'Hvordan kan to linjer være ett sammenhengende nettverk selv om de følger forskjellige grener?',
                subject_id: 'by',
                emne_id: 'em_by_infrastruktur_mobilitet',
                evidence: 'Bruk Ruters rutedefinisjon og de fem Entur-ankrene til å identifisere fellesstrekning, grenpunkt, grenankre og felles endepunkt.'
              },
              {
                id: 'trikk1718-nybrua-grenpunkt',
                title: 'Nybrua som grenpunkt',
                prompt: 'Hva gjør Nybrua til mer enn bare en vanlig holdeplass i ruteparrets geometri?',
                subject_id: 'by',
                emne_id: 'em_by_infrastruktur_mobilitet',
                evidence: 'Sammenhold Nybrua-ankeret med Ruters to ruteforløp og observer hvor de to linjene fortsetter etter den delte sentrumsstrekningen.'
              },
              {
                id: 'trikk1718-sinsen-storo-kontrast',
                title: 'Sinsen og Storo som kontrast',
                prompt: 'Hvordan inngår trikken forskjellig i byrommet ved Sinsenkrysset og ved Storo?',
                subject_id: 'by',
                emne_id: 'em_by_infrastruktur_mobilitet',
                evidence: 'Bruk de to grenankrene som faste feltpunkter og registrer sporplassering, kryss, holdeplassrom og synlige forbindelser til andre transportformer.'
              },
              {
                id: 'trikk1718-ganglinjer-til-stopp',
                title: 'Ganglinjer til holdeplassene',
                prompt: 'Hvilke fysiske ganglinjer leder inn mot holdeplassene, og hvor oppstår omveier eller kryssingsbehov?',
                subject_id: 'by',
                emne_id: 'em_by_gangstrommer_snarveier',
                evidence: 'Observer adkomstene til de dokumenterte stoppankrene og skill mellom direkte gangforbindelser, signalregulerte kryss og omveier.'
              },
              {
                id: 'trikk1718-felles-ender-ulike-veier',
                title: 'Felles ender, ulike veier',
                prompt: 'Hva lærer ruteparret oss om et nettverk der samme start og slutt kan bindes sammen gjennom ulike korridorer?',
                subject_id: 'by',
                emne_id: 'em_by_infrastruktur_mobilitet',
                evidence: 'Sammenhold Gaustadalléen og Grefsen stasjon som felles ankere med de separate Sinsen- og Storo-grenene mellom dem.'
              }
            ],
            guiding_questions: [
              'Hvorfor er et forgrenet rutepar en annen type sted enn én enkelt holdeplass?',
              'Hvilken nettverksrolle har Nybrua når linjene deler en sentrumsstrekning før de forgrener seg?',
              'Hva kan Sinsenkrysset og Storo vise om hvordan samme transportform møter forskjellige bymiljøer?',
              'Hvordan påvirker plasseringen av holdeplasser hvilke ganglinjer og kryssinger passasjerene må bruke?',
              'Hvilke påstander om kapasitet, punktlighet og passasjerbruk kan ikke avgjøres ut fra rutegeometri alene?'
            ],
            concepts: [
              'rutenett',
              'fellesstrekning',
              'grenpunkt',
              'grenanker',
              'endepunkt',
              'holdeplass',
              'kollektivknutepunkt',
              'rutegeometri',
              'ganglinje',
              'feltobservasjon'
            ],
            observable_traces: [
              {
                title: 'Gaustadalléen som felles vestende',
                observation: 'Registrer holdeplassrommet, sporene og hvilke gangforbindelser som leder til stoppet som begge linjene deler.',
                interpretation_boundary: 'Et felles endepunkt kan observeres og bekreftes i rutekilden, men passasjerstrømmer og kapasitetsbehov krever egne data.',
                source_urls: [sources[0][1], sources[1][1]]
              },
              {
                title: 'Nybrua før forgreningen',
                observation: 'Observer den felles sentrumsstrekningen ved Nybrua og hvilke retninger sporene fører videre mot etter holdeplassen.',
                interpretation_boundary: 'Fysisk sporretning og rutedefinisjon dokumenterer grenstrukturen, men driftsmessige årsaker til ruteføringen krever andre kilder.',
                source_urls: [sources[0][1], sources[2][1]]
              },
              {
                title: 'To nordlige grenankre',
                observation: 'Sammenlign Sinsenkrysset og Storo som to dokumenterte punkter på hver sin gren og registrer forskjeller i gate- og knutepunktstruktur.',
                interpretation_boundary: 'Byromsforskjeller kan beskrives i felt, men de kan ikke alene forklare passasjertall, frekvens eller driftskvalitet.',
                source_urls: [sources[3][1], sources[4][1]]
              },
              {
                title: 'Grefsen stasjon som felles ende',
                observation: 'Registrer hvordan begge rutene samles ved Grefsen stasjon og hvilke fysiske forbindelser holdeplassen har til området rundt.',
                interpretation_boundary: 'Det felles endepunktet er dokumenterbart, men nettverkets robusthet ved avvik må undersøkes med driftsdata.',
                source_urls: [sources[0][1], sources[5][1]]
              }
            ],
            source_urls: sources.map((row) => row[1]),
            verified_at: '2026-09-01'
          };

          fs.writeFileSync(placePath, JSON.stringify(place, null, 2) + '\n');

          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          registry.placeLinks ||= {};
          registry.placeLinks.trikk_17_18 = {
            sourceFile: 'places/by/oslo/places/trikk_17_18.json',
            field: 'fagverk',
            schema: 'history_go_place_fagverk_v2',
            level: 'full',
            status: 'curated'
          };
          fs.writeFileSync(registryPath, JSON.stringify(registry, null, 2) + '\n');

          if (staleImage) {
            const backlog = JSON.parse(fs.readFileSync(backlogPath, 'utf8'));
            backlog.generatedAt = '2026-09-01';
            backlog.generatedFromCommit = 'trikk_17_18_fagverk_v2_20260901';
            backlog.summary.validRemote += 1;
            backlog.summary.invalidLocalPath -= 1;
            backlog.summary.remaining -= 1;
            backlog.byCategory.by.valid += 1;
            backlog.byCategory.by.invalid -= 1;
            fs.writeFileSync(backlogPath, JSON.stringify(backlog, null, 2) + '\n');
          }
          NODE
      - name: Regenerate canonical and Fagverk state
        run: |
          npm run places:index:build
          node scripts/build-place-open-payloads.mjs
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate generated canonical state
        run: |
          npm run places:index:check
          node scripts/build-place-open-payloads.mjs --check
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Validate Fagverk contracts
        run: |
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/fagverk-place-rendering.test.mjs
          node --test tests/fagverk-place-substance-audit.test.mjs
          node --test tests/fagverk-link-audit.test.mjs
      - name: Validate Trikk 17/18 remote image
        env:
          PLACE_IMAGE_REMOTE_FETCH_TIMEOUT_MS: '45000'
        run: node scripts/audit-place-images.mjs --mode=changed --require-any-place-image --require-remote-image
      - name: Build and verify full place image backlog
        run: node scripts/audit-place-images.mjs --mode=all --report=/tmp/place-image-audit.json --verify-summary=data/places/place_image_backlog_summary.json
      - name: Validate generated web runtime
        run: npm run build:web:check
      - name: Validate diff whitespace
        run: git diff --check
      - name: Commit clean production result
        run: |
          git add \
            data/places/by/oslo/places/trikk_17_18.json \
            data/places/places_index.json \
            data/places/place_image_backlog_summary.json \
            data/runtime/place-open/trikk_17_18.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/fagverk-place-page-coverage-v2.json
          git rm .github/workflows/finalize-trikk-17-18-fagverk-v2.yml
          git diff --cached --quiet && { echo "No production changes to commit"; exit 1; }
          git commit -m "Curate Trikk 17/18 Fagverk v2"
          git push origin HEAD:${GITHUB_REF_NAME}
