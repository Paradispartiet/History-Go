name: TEMP Civication Psykologi miljoarbeid materialize

on:
  push:
    branches:
      - agent/civication-psykologi-miljoarbeid-pilot-playable
    paths:
      - '.materialize-psykologi-miljoarbeid'
  pull_request:
    branches:
      - main
    paths:
      - '.materialize-psykologi-miljoarbeid'
      - '.github/workflows/civication-psykologi-miljoarbeid-materialize.yml'
      - 'scripts/materialize-civication-psykologi-miljoarbeid-pilot.mjs'

permissions:
  contents: write

concurrency:
  group: temp-civication-psykologi-miljoarbeid
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-psykologi-miljoarbeid-pilot-playable
          fetch-depth: 0

      - name: Lock expected baseline lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 709f79794a93ebd4ba9705540fd39cf77b436634 HEAD

      - name: Materialize authored pilot sources
        run: node scripts/materialize-civication-psykologi-miljoarbeid-pilot.mjs

      - name: Regenerate Career Gameplay Matrix
        run: node scripts/audit-civication-career-gameplay.mjs --write

      - name: Regenerate compiled scene registry
        run: node scripts/build-civication-scene-registry.mjs --write

      - name: Check compiled scene registry
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Verify Psykologi pilot
        run: node tests/civication-psykologi-miljoarbeid-playability.test.js

      - name: Verify complete Civication suite
        id: civication
        shell: bash
        run: |
          set +e
          npm run test:civication > /tmp/civication.log 2>&1
          status=$?
          cat /tmp/civication.log
          if [ "$status" -ne 0 ]; then
            {
              echo "run=$GITHUB_RUN_ID"
              echo "head=$(git rev-parse HEAD)"
              echo '--- failure markers ---'
              grep -nE 'FAIL|Assertion|ERR_|Error:|not ok|test\.js' /tmp/civication.log | tail -n 160 || true
              echo '--- tail ---'
              tail -n 220 /tmp/civication.log
            } > .civication-psykologi-failure.txt
          fi
          exit "$status"

      - name: Publish failure diagnostic
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .civication-psykologi-failure.txt ]; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .civication-psykologi-failure.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record temporary Psykologi Civication failure diagnostic'
          git push origin HEAD:agent/civication-psykologi-miljoarbeid-pilot-playable

      - name: Diff hygiene
        if: success()
        run: git diff --check

      - name: Commit materialized permanent files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/Civication reports/civication-career-gameplay-matrix.md tests/civication-psykologi-miljoarbeid-playability.test.js
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Materialize Psykologi miljoarbeid as human-work pilot'
          git push origin HEAD:agent/civication-psykologi-miljoarbeid-pilot-playable
