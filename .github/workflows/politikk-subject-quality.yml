concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate Politikk quality contracts
        run: |
          node --check scripts/audit-politikk-subject-quality.mjs
          node --check tools/materialize-politikk-curriculum.mjs
          node --check tools/build-politikk-concept-editorial-reviews.mjs
          node --check tools/validate-politikk-curriculum-architecture.mjs
          node --check scripts/audit-politikk-thinker-integrity.mjs
          node --check tools/audit-politikk-theory-integrity.mjs
          node --check scripts/audit-politikk-chapter-regimer-institusjoner.mjs
          node --check scripts/audit-politikk-chapter-valg-partier-velgeratferd.mjs
          node --check scripts/audit-politikk-chapter-offentlig-politikk-beslutning-implementering.mjs
          node --check scripts/audit-politikk-chapter-internasjonal-politikk-sikkerhet-samarbeid.mjs
