name: VG-huset Fagverk release sync (one-shot)

on:
  pull_request:
    paths:
      - '.github/workflows/vg-release-sync-one-shot-20261010.yml'

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'content/vg-huset-checklist-closeout-20261010' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate and verify Fagverk release
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit only the derived release and clean up
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r changed; do
            if [ "$changed" != 'data/fagverk/fagverk_release.json' ]; then
              echo "::error::Unexpected changed file: $changed"
              exit 1
            fi
          done < <(git diff --name-only)
          git add data/fagverk/fagverk_release.json
          git rm .github/workflows/vg-release-sync-one-shot-20261010.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Build: resync VG-huset Fagverk release after main merge"
          git push origin HEAD:content/vg-huset-checklist-closeout-20261010
