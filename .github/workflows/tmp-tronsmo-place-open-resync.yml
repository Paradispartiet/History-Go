name: TEMP Tronsmo place-open resync

on:
  push:
    branches:
      - agent/tronsmo-bokhandel-completion-20260910

permissions:
  contents: write

jobs:
  resync:
    if: ${{ contains(github.event.head_commit.message, '[tronsmo-place-open-resync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lock base and regenerate place-open
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          expected_main='c2dfb1247bcf4f6af1b4013d9efa1b6e9b06dd5b'
          actual_main="$(git rev-parse origin/main)"
          if [ "$actual_main" != "$expected_main" ]; then
            echo "main moved; aborting derived-state resync" >&2
            exit 1
          fi
          npm run place-open:build
      - name: Verify regenerated payloads
        run: |
          npm run place-open:check
          npm run test:place-open
          node --test tests/tronsmo-bokhandel-completion.test.mjs tests/birkelunden-phase7e-news.test.mjs
          node scripts/audit-repository-hygiene-v1.mjs
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-tronsmo-place-open-resync.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No place-open resync changes to commit' >&2
            exit 1
          fi
          git commit -m 'Resync place-open after Tronsmo manifest repair'
          git push
