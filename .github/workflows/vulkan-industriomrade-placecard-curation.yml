name: Vulkan industriområde PlaceCard curation

on:
  pull_request:
    paths:
      - "data/places/natur/oslo/places_oslo_natur_akerselvarute/vulkan_industriomrade.json"
      - "data/runtime/place-open/vulkan_industriomrade.json"
      - "data/brands/brands_by_place.json"
      - "data/brands/brands_master.json"
      - "data/quiz/historie/vulkan_industriomrade_sets.json"
      - "data/quizcards/historie/vulkan_industriomrade_quizcard_v1.json"
      - "data/quizcards/natur/topp10_natur_akerselva_v1_batch02.json"
      - "tests/vulkan-industriomrade-placecard-collections-v2.test.mjs"
      - "reports/place-production/vulkan-industriomrade-placecard-curation-v1.md"
      - ".github/workflows/vulkan-industriomrade-placecard-curation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vulkan-collections:
    name: Verify Vulkan Brands, People, quiz statuses and photo parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Vulkan scoped PlaceCard curation regression
        run: node --test tests/vulkan-industriomrade-placecard-collections-v2.test.mjs
