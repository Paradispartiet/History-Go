name: Vøyenfossen PlaceCard curation

on:
  pull_request:
    paths:
      - "data/places/natur/oslo/places_oslo_natur_akerselvarute/voienfossen.json"
      - "data/runtime/place-open/voienfossen.json"
      - "data/brands/brands_by_place.json"
      - "data/brands/brands_master.json"
      - "data/quiz/historie/voienfossen_sets.json"
      - "data/quizcards/historie/voienfossen_quizcard_v1.json"
      - "data/quizcards/natur/topp10_natur_akerselva_v1_batch02.json"
      - "tests/voienfossen-placecard-collections-v2.test.mjs"
      - "reports/place-production/voienfossen-placecard-curation-v1.md"
      - ".github/workflows/voienfossen-placecard-curation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  voienfossen-collections:
    name: Verify Vøyenfossen Brands, People, quiz and photo parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run scoped PlaceCard curation regression
        run: node --test tests/voienfossen-placecard-collections-v2.test.mjs
