name: TEMP Helsfyr place-open sync

on:
  push:
    branches:
      - work/helsfyr-completion-20260904

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/helsfyr-completion-20260904
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate runtime payloads
        run: npm run place-open:build

      - name: Verify payload sync and runtime contract
        run: npm run place-open:check && npm run test:place-open

      - name: Commit deterministic runtime sync and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-helsfyr-place-open-sync.yml
          git add -A data/runtime
          git diff --cached --check
          git status --short
          git commit -m "Sync Helsfyr place-open runtime payloads"
          git push origin HEAD:work/helsfyr-completion-20260904
