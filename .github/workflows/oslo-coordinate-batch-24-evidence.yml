name: Oslo coordinate batch 24 evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-coordinate-batch-24-evidence.yml'

permissions:
  contents: read

jobs:
  evidence:
    if: github.event.pull_request.head.ref == 'agent/oslo-coordinate-control-batch-24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect address-first and object evidence
        shell: bash
        run: |
          set -u
          OUT='reports/oslo-coordinate-control-batch-24/evidence-pass'
          mkdir -p "$OUT"

          run_finder() {
            local address="$1"
            local file="$2"
            set +e
            set -o pipefail
            npm run places:coords:find:address -- --address "$address" | tee "$OUT/$file"
            local code=${PIPESTATUS[0]}
            set +o pipefail
            set -e
            printf '%s\n' "$code" > "$OUT/$file.exit-status.txt"
            return 0
          }

          run_curl() {
            local url="$1"
            local file="$2"
            set +e
            curl --retry 3 --retry-delay 2 -fsSL -A 'History-Go-coordinate-audit/1.0' "$url" \
              | tee "$OUT/$file" >/dev/null
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$code" > "$OUT/$file.exit-status.txt"
            return 0
          }

          set -e
          run_finder 'Sagveien 23 Oslo' 'ovre_foss-sagveien-23-geonorge.json'
          run_finder 'Trondheimsveien 2 Oslo' 'schous_bryggeri-trondheimsveien-2-geonorge.json'
          run_finder 'Thorvald Meyers gate 2 Oslo' 'ringnes_bryggeri-thorvald-meyers-gate-2-geonorge.json'
          run_finder 'Thorvald Meyers gate 2A Oslo' 'ringnes_bryggeri-thorvald-meyers-gate-2a-geonorge.json'

          # Exploratory only: this lookup must not be auto-applied because the active
          # St. Halvard record has a material identity/history conflict.
          run_finder 'Pilestredet 75C Oslo' 'st_halvard_bryggeri-pilestredet-75c-geonorge.json'

          run_curl \
            'https://www.wikidata.org/wiki/Special:EntityData/Q11975545.json' \
            'ovre_foss-hjula-wikidata-Q11975545.json'
          run_curl \
            'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Hjula%20V%C3%A6verier%20Oslo' \
            'ovre_foss-hjula-vaeverier-nominatim.json'
          run_curl \
            'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Ringnes%20Bryggeri%20Thorvald%20Meyers%20gate%202%20Oslo' \
            'ringnes_bryggeri-nominatim.json'
          run_curl \
            'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Bakeriet%20Akershus%20festning%20Oslo' \
            'akershus_slott_bakeriet-nominatim.json'
          run_curl \
            'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Kornmagasinet%20Akershus%20festning%20Oslo' \
            'oslo_kornmagasin-nominatim.json'
          run_curl \
            'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Sagene%20m%C3%B8lle%20og%20kvernhus%20Oslo' \
            'sagene_kvernhus-nominatim.json'

          cat > "$OUT/source-notes.md" <<'EOF'
          # Batch 24 – identitetsnotater før integrasjon

          - `ovre_foss`: Oslo byleksikon identifiserer Hjula Væverier ved Sagveien 23. Adressepunktet er tvetydig, så batchen bruker bare et eksplisitt Hjula-kildeobjekt dersom Wikidata/tilhørende dokumentasjon gir et entydig fysisk punkt.
          - `schous_bryggeri`: Oslo byleksikon identifiserer det historiske Schous-anlegget ved Trondheimsveien 2. Et entydig Geonorge-treff kan brukes som display-marker for det større bryggerikomplekset.
          - `ringnes_bryggeri`: Oslo byleksikon identifiserer det gamle brygghuset spesifikt som Thorvald Meyers gate 2A. Det presise 2A-oppslaget kan brukes dersom Geonorge gir ett entydig treff; det brede nr. 2-oppslaget forblir bare historikk.
          - `sagene_kvernhus`: Aktiv record beskriver et bredt og sammenblandet mølle-/kvernområde langs Akerselva. Ikke forankre den til Hjula uten egen identitetsavklaring, fordi `ovre_foss` allerede representerer Hjula-anlegget.
          - `st_halvard_bryggeri`: Aktiv record har materiell konflikt i år, geografi og historie. Pilestredet 75C-oppslaget er kun utforskende og skal ikke automatisk anvendes.
          - `oslo_kornmagasin`: Det dokumenterte Kornmagasinet på Akershus er et konkret 1788-bygg, mens aktiv record heter «Christiania kornmagasin» og oppgir 1785. Ikke retarget recorden uten eksplisitt identitetsavgjørelse.
          - `akershus_slott_bakeriet`: Forsvarsbygg/Lovdata identifiserer Bakeriet som et konkret fredet festningsbygg (objekt 0014, 1759). Godkjenn bare det navngitte Bakeriet-objektet på Akershus, ikke festningens generelle sentrum.
          EOF

      - name: Upload evidence pass
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch-24-evidence
          path: reports/oslo-coordinate-control-batch-24/evidence-pass
          if-no-files-found: error
