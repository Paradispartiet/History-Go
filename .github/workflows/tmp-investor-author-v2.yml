name: Temporary Investor deterministic authoring

on:
  push:
    branches:
      - civication/naeringsliv-investor-role-world
    paths:
      - .github/workflows/tmp-investor-author-v2.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Author Investor source, Role World and governance
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>{fs.mkdirSync(require('path').dirname(p),{recursive:true});fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n')};
          const streamPath='data/Civication/narratives/leisure/naeringsliv_investor.json';
          const worldPath='data/Civication/roleWorlds/naeringsliv/naeringsliv_investor.json';
          const lifeKey='naeringsliv/investor';
          const arcs=[
            ['investeringshypotesen_for_forste_kjop','Analytikeren','Hva må være sant for at investeringen skal virke?',['Du vurderer å plassere egen kapital i et selskap du har fulgt lenge.','Som Investor må du kunne formulere hva som skaper verdi, hva som kan falsifisere tesen og hvor lenge kapitalen kan være bundet.','En investeringshypotese er ikke et løfte om avkastning, men et etterprøvbart grunnlag for å ta risiko.'],'Skriv ned drivere, tidshorisont og konkrete forhold som vil få deg til å revurdere tesen.','Kjøp fordi historien virker overbevisende og bestem senere hvorfor du eier.',['investment_thesis','falsifiable_case'],'Tesen blir konkret nok til at senere informasjon kan prøves mot den.','Fortellingen blir en begrunnelse i etterkant i stedet for et beslutningsgrunnlag.','investment_thesis'],
            ['prisen_som_loper_fra_verdien','Analytikeren','Selskapet er attraktivt, men prisen har løpt',['Virksomheten leverer godt, samtidig som markedsprisen har steget langt raskere enn inntjeningen.','Investorrollen krever å skille kvaliteten på et selskap fra vilkårene du betaler for å eie en andel.','Verdsettelse handler om hvilke forventninger som allerede er innbakt og hvor mye feilmargin prisen tåler.'],'Sammenlign prisen med realistiske kontantstrømmer, forventninger og alternative avkastningskrav før kjøp.','Kjøp straks fordi et godt selskap alltid er en god investering uansett pris.',['valuation_discipline','expectation_load'],'Pris og kvalitet blir to separate spørsmål i kapitalallokeringen.','Kvalitet brukes som unnskyldning for å ignorere hva kapitalen faktisk kjøper.','valuation_discipline'],
            ['en_posisjon_som_blir_for_stor','Porteføljerådgiveren','Én investering dominerer porteføljen',['En tidligere investering har steget så mye at den nå utgjør en svært stor del av din investerbare kapital.','Konsentrasjon kan være bevisst, men den gjør én feilvurdering avgjørende for hele porteføljen.','Investor må velge posisjonsstørrelse ut fra samlet bæreevne, ikke bare troen på ett case.'],'Definer hvor stor samlet nedside du tåler og rebalanser hvis posisjonen overstiger den rammen.','Behold alt fordi gevinsthistorikken beviser at konsentrasjonen er trygg.',['position_sizing','concentration_risk'],'Posisjonsstørrelsen kobles til samlet risikobudsjett.','Fortidig gevinst blir brukt som bevis mot framtidig konsentrasjonsrisiko.','position_sizing'],
            ['kapitalen_du_kan_trenge_for_tidlig','Porteføljerådgiveren','Tidshorisonten kolliderer med privat likviditet',['En investeringsmulighet krever at kapital bindes samtidig som du kan få behov for penger til andre formål de neste årene.','Investorens tidshorisont må passe kapitalens faktiske tilgjengelighet; tvangssalg kan gjøre en langsiktig tese irrelevant.','Likviditet er derfor en del av risikostyringen før investeringen, ikke bare et problem når markedet faller.'],'Skill reservekapital fra langsiktig investerbar kapital før du binder nye penger.','Invester alt nå og regn med at du kan selge på gode vilkår dersom pengene trengs.',['liquidity_horizon','forced_sale_risk'],'Kapitalens horisont avklares før markedet bestemmer tidspunktet for deg.','Likviditetsbehovet skyves fram til det eventuelt tvinger fram et dårlig salg.','liquidity_horizon'],
            ['nedsiden_som_forsvinner_i_basiscaset','Revisoren','Basiscaset ser ryddig ut, men nedsiden er tynn',['Regnearket viser god forventet avkastning i hovedscenarioet, mens svakere utfall bare er kort omtalt.','Investor må forstå tapspotensial, kapitalbehov og permanent verdiforringelse før oppsiden får dominere beslutningen.','Nedsideanalyse handler ikke om pessimisme, men om hva som skjer når sentrale forutsetninger svikter samtidig.'],'Bygg et konkret negativt scenario med finansiering, resultat og mulig permanent tap før du bestemmer størrelsen.','Bruk hovedscenarioet fordi for mange negative varianter bare gjør beslutningen vanskeligere.',['downside_analysis','permanent_loss'],'Nedsiden blir en eksplisitt del av beslutningen og posisjonsstørrelsen.','Usikkerheten skjules ved å gjøre hovedscenarioet til eneste målestokk.','downside_analysis'],
            ['lanet_som_forsterker_alt','Bankkontakten','Belåning kan øke både avkastning og tvang',['Du kan låne mot porteføljen for å øke eksponeringen mot en investering du mener er feilpriset.','Belåning forsterker både gevinst og tap, men viktigst kan den flytte tidspunktet for beslutningen fra investor til långiver.','Marginvilkår, rente og sikkerhetskrav må forstås som deler av porteføljerisikoen.'],'Stress-test fall, rente og sikkerhetskrav før du avgjør om belåning overhodet passer kapitalen din.','Lån maksimalt fordi høyere forventet avkastning gjør finansieringsrisikoen sekundær.',['portfolio_leverage','financing_constraint'],'Belåningen vurderes ut fra tvangsrisiko, ikke bare forventet meravkastning.','Oppsiden får dekke over at finansieringen kan tvinge fram salg på feil tidspunkt.','portfolio_leverage'],
            ['informasjonen_som_ikke_er_like_god_overalt','Revisoren','Datagrunnlaget har ulik kvalitet',['To investeringer ser sammenlignbare ut i presentasjonene, men dokumentasjonen bak nøkkeltallene er svært ulik.','Investor må skille mellom rapportert tall, estimat, ledelsesfortelling og uavhengig verifiserbar informasjon.','Informasjonskvalitet påvirker hvor presist du kan verdsette og hvor stor sikkerhetsmargin du trenger.'],'Merk hvilke forutsetninger som er verifiserte, estimerte eller partsopplysninger og juster sikkerhetsmarginen deretter.','Behandle alle presenterte nøkkeltall som like pålitelige så lenge de står i samme format.',['information_quality','evidence_weight'],'Usikkerheten i datagrunnlaget blir synlig i selve investeringsbeslutningen.','Presentasjonsformen forveksles med kvaliteten på underlaget.','information_quality'],
            ['fallet_som_tester_tesen','Medinvestoren','Kursfallet tvinger fram et nytt spørsmål',['Markedsprisen faller kraftig kort tid etter kjøpet uten at årsaken er åpenbar.','Investor må skille mellom lavere pris og svakere investeringscase før følelsen av tap får styre.','En drawdown er informasjon om markedet, men ikke automatisk bevis for eller mot den opprinnelige tesen.'],'Gå tilbake til tesens drivere og falsifikasjonspunkter før du kjøper mer, holder eller selger.','Selg umiddelbart for å stoppe ubehaget uten å undersøke om premissene faktisk er endret.',['drawdown_discipline','thesis_review'],'Prisfallet blir behandlet som et signal som må tolkes mot tesen.','Ubehaget blir beslutningsregel og erstatter vurderingen av hva som faktisk har endret seg.','drawdown_discipline'],
            ['minoritetsposten_med_svake_rettigheter','Transaksjonsadvokaten','Eierandelen gir mindre vern enn prosenttallet antyder',['Du vurderer en minoritetspost i et unotert selskap der avtalen gir begrenset innsyn og få rettigheter ved nye emisjoner eller salg.','Investor eier ikke bare en prosentandel; rettigheter, prioritet, utvanning og tilgang til informasjon påvirker hva andelen faktisk betyr.','Private eierrettigheter må leses før prisen kan vurderes som om instrumentene var like.'],'Kartlegg innsyn, utvanningsvern, salgsrettigheter og prioritet før du priser posten.','Se bare på eierprosenten fordi juridiske detaljer uansett først betyr noe ved en tvist.',['minority_rights','ownership_terms'],'Eierandelen vurderes sammen med de faktiske rettighetene som følger den.','Prosenttallet får skjule at økonomiske og juridiske rettigheter kan være svake.','minority_rights'],
            ['emisjonen_som_krever_mer_kapital','Medinvestoren','Selskapet ber eierne følge opp med mer kapital',['Et porteføljeselskap trenger ny kapital tidligere enn antatt og eksisterende eiere må velge om de vil delta.','Oppfølgingskapital kan beskytte en god investering, men kan også gjøre en svak tese dyrere å forlate.','Investor må vurdere den nye investeringen på dagens informasjon, ikke bare forsvare pengene som allerede er satt inn.'],'Vurder emisjonen som en ny kapitalbeslutning med oppdatert tese, pris, utvanning og alternativ bruk av pengene.','Delta automatisk fordi du allerede har investert mye og ikke vil innrømme at første beslutning kan ha vært feil.',['follow_on_capital','sunk_cost_resistance'],'Ny kapital vurderes på dagens premisser i stedet for historisk stolthet.','Tidligere investering blir argument for å øke eksponeringen uten ny vurdering.','follow_on_capital'],
            ['eierinnflytelsen_som_blir_operativ','Transaksjonsadvokaten','Eierrollen begynner å ligne daglig ledelse',['Du har fått betydelig eierandel og blir invitert stadig dypere inn i konkrete driftsbeslutninger.','Investor kan bruke eierrettigheter og governance-kanaler, men eierandel skaper ikke automatisk operativ instruksjonsmyndighet.','Rollegrensen beskytter både ansvarslinjer og kvaliteten på kapitalbeslutningen.'],'Avklar hvilke beslutninger som hører til eier-/styrenivå og hvilke som tilhører formell ledelse før du påvirker videre.','Gi direkte instrukser til ansatte fordi kapitalinnsatsen gjør deg til den reelle sjefen.',['owner_influence_boundary','governance_boundary'],'Eierinnflytelse holdes innenfor den myndigheten som faktisk finnes.','Kapitalmakt blir forvekslet med operativt mandat og uklare ansvarslinjer oppstår.','owner_influence_boundary'],
            ['salget_som_er_vanskelig_nar_tesen_fortsatt_er_god','Porteføljerådgiveren','En god investering kan likevel være moden for salg',['En investering har utviklet seg godt, men prisen reflekterer nå mye av den framtidige oppsiden du opprinnelig så.','Investor må kunne selge selv uten katastrofe når forventet avkastning, alternativkostnad eller porteføljerisiko har endret seg.','Exit er en kapitalallokeringsbeslutning, ikke en dom over selskapet eller en lojalitetstest.'],'Sammenlign forventet framtidig avkastning med risiko og alternative plasseringer før du bestemmer om kapitalen skal frigjøres.','Hold for alltid fordi et salg av en vinner føles som å gi opp noe som har fungert.',['exit_discipline','opportunity_cost'],'Exit vurderes mot framtidig kapitalbruk, ikke følelsen rundt historisk gevinst.','Historisk suksess blir et argument mot å evaluere dagens forventede avkastning.','exit_discipline'],
            ['kontantreserven_som_ser_passiv_ut','Porteføljerådgiveren','Kontanter ser svake ut når alt annet stiger',['Markedet har steget lenge og kontantreserven trekker ned den målte avkastningen i gode perioder.','For Investor kan ubrukt kapital være bevisst opsjonalitet dersom den dekker privat likviditet eller gir rom for framtidige muligheter.','Kontanter har også alternativkostnad, så reserve må ha en eksplisitt funksjon og størrelse.'],'Definer hvilken del som er beredskap, framtidig investeringskapital og kortsiktig behov, og vurder kostnaden ved hver del.','Invester hele reserven fordi kapital som ikke er i markedet alltid er bortkastet.',['cash_optionality','reserve_policy'],'Kontantbeholdningen får en begrunnet funksjon og kan vurderes mot alternativkostnaden.','Presset om å være fullt investert fjerner handlingsrommet uten at behovet er analysert.','cash_optionality'],
            ['sesongslutt_hva_er_en_investor','Analytikeren','Hva er Investor når rollene skilles fra hverandre?',['Etter sesongen må du skille kapitalplassering fra selskapsdrift, industrielt eierskap og profesjonell finansforvaltning.','Investor er en employment-independent posisjon for allokering av egen kapital under usikkerhet; Bedriftseier, Industrieier og Gründer har andre eierskaps- eller virksomhetslag, mens Kapitalforvalter, Finansanalytiker og Daglig leder er separate formelle karrierer.','Investorstatus gir ingen automatisk arbeidstakerstatus, styreplass, rådgiverautorisasjon, operativ instruksjonsmyndighet, mandat over andres penger eller garanti for avkastning.'],'Behold rollegrensen eksplisitt og la investering, selskapseierskap, industrielt eierskap og profesjonell forvaltning ha hvert sitt mandat.','La Investor bli samlebetegnelse for alle som eier, leder, analyserer eller forvalter kapital.',['investor_definition','authority_boundary'],'Investorrollen blir presis: egen kapitalallokering uten automatisk profesjons- eller driftsmyndighet.','Rollegrensene kollapser og kapitalplassering blandes med jobb, drift og forvaltning av andres midler.','investor_definition']
          ];
          const storylets=arcs.map(([id,from,subject,situation,a,b,tags,fa,fb])=>({id,message_type:id.includes('fallet')||id.includes('svake')?'conflict':'decision',time_slot:['people','personal'],from,subject,situation,choices:[{id:'A',label:a,effect:1,tags,feedback:fa},{id:'B',label:b,effect:-1,tags:[tags[0]+'_failure',tags[1]+'_failure'],feedback:fb}],opens_streams:[],adds_flags:['investor_'+id],risk_links:['financial_risk','reputation_risk'],links:[]}));
          const stream={schema:'civication_narrative_stream_v1',id:'naeringsliv_investor_stream',type:'leisure',title:'Investor — kapitalallokering, eierrettigheter og porteføljerisiko',sociological_theme:'naeringsliv_investor_egen_kapitalallokering_investeringstese_verdsettelse_posisjonsstorrelse_likviditet_nedside_belaning_informasjonskvalitet_drawdown_minoritetsrettigheter_oppfolgingskapital_eierinnflytelse_exit_kontantreserve_og_rollegrense',applies_when:{any_tags:['naeringsliv:investor']},time_slots:['personal','home','people','leisure'],storylets};
          write(streamPath,stream);

          const axes=arcs.map((a,i)=>({id:a[9],meaning:a[2].replace(/\?$/,'').toLowerCase(),runtime_binding:'editorial_only_until_governed'}));
          const phases=['morning','lunch','afternoon','evening'];
          const phaseNames={morning:'morgen',lunch:'lunsj',afternoon:'ettermiddag',evening:'kveld'};
          const beatTypes={morning:'info',lunch:'conversation',afternoon:'decision',evening:'private_consequence'};
          const coverage=[];
          for(let i=0;i<arcs.length;i++) for(const phase of phases) coverage.push({day:i+1,phase,beat_type:beatTypes[phase],summary:`Dag ${i+1} ${phaseNames[phase]}: ${arcs[i][2].replace(/\?$/,'').toLowerCase()} — ${phase}.`,thread_ids:[arcs[i][9]],materialization_refs:[streamPath+'#'+arcs[i][0]]});
          const primary_threads=arcs.map((a,i)=>{const d=i+1,n=(i+1)%14+1,n2=(i+2)%14+1;return {id:a[9],relationship:a[2].replace(/\?$/,'').toLowerCase(),beat_refs:[`${d}/morning`,`${d}/afternoon`,`${n}/lunch`,`${n}/evening`,`${n2}/morning`]}});
          const people=[
            ['analytikeren','gjør investeringshypoteser, verdsettelse og informasjonsgrunnlag etterprøvbart','uavhengig analyseperson uten mandat over spillerens kapital','har kunnskapsmakt gjennom modeller og dokumentasjon','kan avdekke premisser som ikke henger sammen','at beslutninger kan spores til data, antakelser og falsifikasjonspunkter','at modeller kan gi falsk presisjon når input er svak','presis, premissdrevet og opptatt av hva som faktisk kan verifiseres','å skille investeringscase fra fortelling'],
            ['portefoljeradgiveren','gjør posisjonsstørrelse, likviditet, reserve og exit sammenlignbart på porteføljenivå','rådgiver uten eierskap eller automatisk fullmakt','har påvirkning gjennom rammer for samlet risiko','kan synliggjøre konsekvenser som ikke finnes i ett enkelt case','at kapitalbruk passer tidshorisont, likviditet og risikobæreevne','at diversifisering kan brukes mekanisk uten å forstå underliggende risiko','rammeorientert, sannsynlighetsbevisst og rolig','å se hver investering som del av en samlet kapitalstruktur'],
            ['bankkontakten','gjør belåning, sikkerhetskrav og finansieringsvilkår konkrete','långiverpart med kontraktsmakt, ikke eiermyndighet','kan endre handlefrihet gjennom rente, sikkerhet og tvangsvilkår','kan gjøre ønsket eksponering mulig eller uholdbar','betjeningsevne og sikkerhet som tåler stress','at bankens risikoreduksjon kan øke investorens tvangsrisiko','vilkårsnær, tallorientert og opptatt av sikkerhet','at finansiering endrer hvem som kontrollerer tidspunktet for beslutninger'],
            ['revisoren','skiller dokumenterte tall fra estimater og presentasjon','uavhengig kontrollfunksjon uten investeringsmandat','har troverdighetsmakt over kvaliteten på rapportert informasjon','kan avdekke svak dokumentasjon og regnskapsmessige forbehold','at beslutningsgrunnlaget beskriver hva tallene faktisk kan bevise','at formell dokumentasjon ikke eliminerer all økonomisk usikkerhet','dokumentorientert, nøktern og presis','å vekte evidens etter kvalitet'],
            ['transaksjonsadvokaten','gjør eierrettigheter, minoritetsvern og governance-grenser konkrete','juridisk rådgiver uten automatisk eier- eller styremyndighet','har ekspertmakt over tolkning av avtaler og rettigheter','kan vise at like eierprosenter gir ulike økonomiske og styringsmessige posisjoner','at kapitalen bindes med forståtte rettigheter og ansvar','at juridisk ryddighet kan forveksles med økonomisk attraktivitet','klausulnær, konsekvensorientert og tydelig på mandat','at eierskapets rettigheter må forstås før de prises'],
            ['medinvestoren','speiler markedspress, oppfølgingskapital og følelsene rundt gevinst og tap','annen kapitaleier med egne interesser og tidshorisont','har sosial påvirkning, men ingen myndighet over spillerens beslutning','kan forsterke flokkatferd eller utfordre beslutningsdisiplin','en beslutning som kan forsvares på egne premisser','at egen posisjon kan farge rådene som gis','erfaringsnær, direkte og opptatt av timing','å skille sosial bekreftelse fra selvstendig kapitalallokering']
          ].map(([id,social_function,class_position,status,power_over_player,wants,conceals,speech_style,teaches_player])=>({id,social_function,class_position,status,power_over_player,wants,conceals,speech_style,teaches_player}));
          const groups=[[0,1,4],[2,3,5],[6,7],[8,9,10],[11,12,13]];
          const aftermathIds=['tesen_og_prisen_blir_skilt','portefoljerisikoen_blir_synlig','beslutningsgrunnlaget_far_kvalitet','private_eierrettigheter_blir_konkrete','kapitalen_far_exit_og_pause'];
          const aftermathText=['Tese, verdsettelse og nedside blir separate kontrollpunkter før kapital bindes.','Posisjonsstørrelse, likviditet og belåning blir lest som samlet bæreevne.','Informasjonskvalitet og drawdown vurderes uten å gjøre prisbevegelse til eneste sannhet.','Minoritetsrettigheter, oppfølgingskapital og eierinnflytelse får eksplisitte grenser.','Exit, kontantreserve og rolledefinisjon gjør kapitalens neste bruk like viktig som historiske kjøp.'];
          const private_aftermath=groups.map((g,i)=>({id:aftermathIds[i],description:aftermathText[i],materialization_refs:g.map(x=>streamPath+'#'+arcs[x][0])}));
          const delayed_consequences=[
            {id:'tesen_moter_nedsiden',setup_ref:'1/afternoon',return_ref:'5/evening',domains:['economy','psyche']},
            {id:'verdsettelsen_moter_exit',setup_ref:'2/afternoon',return_ref:'12/evening',domains:['economy','narrative']},
            {id:'konsentrasjonen_moter_likviditeten',setup_ref:'3/afternoon',return_ref:'4/evening',domains:['economy','housing']},
            {id:'belaningen_moter_markedsfallet',setup_ref:'6/afternoon',return_ref:'8/evening',domains:['economy','psyche']},
            {id:'minoritetsrettighetene_moter_emisjonen',setup_ref:'9/afternoon',return_ref:'10/evening',domains:['economy','reputation']},
            {id:'eierinnflytelsen_moter_rollegrensen',setup_ref:'11/afternoon',return_ref:'14/evening',domains:['livelihood','narrative']}
          ];
          const world={schema:'civication_role_world_v1',version:1,category:'naeringsliv',role_scope:'naeringsliv_investor',subject_type:'life_position',life_position_ref:{badge_id:'naeringsliv',id:'investor',label:'Investor'},title:'Investor',status:'role_world_complete',sociological_core:{main_problem:'å allokere egen kapital under usikkerhet uten å forveksle investering med operativ ledelse, generelt selskapseierskap eller profesjonell forvaltning av andres penger',description:'Investor er en employment-independent capital_ownership_and_investment-posisjon for egen kapitalallokering: investeringstese, verdsettelse, posisjonsstørrelse, likviditet, nedside, belåning, informasjonskvalitet, drawdown, minoritetsrettigheter, oppfølgingskapital, eierinnflytelse, exit og kontantreserve. Rollen er forskjellig fra Bedriftseier, Industrieier og Gründer, og fra de formelle karrierene Kapitalforvalter, Finansanalytiker og Daglig leder. Investor gir ingen automatisk operativ instruksjonsmyndighet, arbeidstakerstatus, styreplass, rådgiverautorisasjon, mandat over andres penger eller garanti for avkastning. Ingen ny runtime introduseres.'},theme_ids:['class_power','professional_culture','invisible_work','status_anxiety','shame_reputation','precarity','care_vs_efficiency','public_private_leakage'],social_environments:['investeringsmøter der tese, pris og nedside prøves mot hverandre','porteføljedialoger om konsentrasjon, likviditet, reserve og belåning','dokumentgjennomgang der rapporterte tall og estimater får ulik evidensvekt','private transaksjoner der eierrettigheter og utvanning påvirker økonomisk verdi','markedsfall der følelse, pris og underliggende tese må skilles','exit- og oppfølgingsbeslutninger der alternativ bruk av egen kapital blir eksplisitt'],recurring_people_archetypes:people,slow_axes:axes,season:{days:14,day_phases:phases,coverage},primary_threads,private_aftermath,delayed_consequences,materialization:{no_new_runtime:true,source_refs:arcs.map(a=>streamPath+'#'+a[0])}};
          write(worldPath,world);

          const manifest=read('data/Civication/narratives/manifest.json');
          if(!manifest.streams.some(x=>x.id===stream.id)) manifest.streams.push({id:stream.id,path:streamPath});
          write('data/Civication/narratives/manifest.json',manifest);
          const index=read('data/Civication/roleWorlds/index.json');
          if(!index.roles.some(x=>x.life_position_key===lifeKey)) index.roles.push({category:'naeringsliv',role_scope:'naeringsliv_investor',subject_type:'life_position',life_position_key:lifeKey,life_position_ref:world.life_position_ref,status:'role_world_complete',path:worldPath});
          index.status='239_role_worlds_materialized';index.summary={role_worlds_total:239,career_role_worlds:85,life_position_role_worlds:154};index.career_role_world_count=85;index.life_position_role_world_count=154;write('data/Civication/roleWorlds/index.json',index);
