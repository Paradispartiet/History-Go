name: tmp Ullevål Hageby data-check repair
on:
  workflow_dispatch:
  push:
    branches:
      - work/ulleval-hageby-completion-20260902
permissions:
  contents: write
jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || (github.event.head_commit.message != 'Repair Ullevål Hageby Data checks on fresh main' && !startsWith(github.event.head_commit.message, 'Cleanup Ullevål Hageby'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ulleval-hageby-completion-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Merge fresh main
        run: |
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Repair Ullevål theory and v3.3 brief contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const quizPath = 'data/quiz/by/ullevål_hageby_sets.json';
          const briefPath = 'data/quiz/production_briefs/by/ullevål_hageby.json';
          const quiz = JSON.parse(fs.readFileSync(quizPath, 'utf8'));
          const brief = JSON.parse(fs.readFileSync(briefPath, 'utf8'));
          const context = quiz.production_context;
          if (!context || context.standard_version !== '3.3') throw new Error('Expected Ullevål Hageby quiz production_context standard 3.3');
          const questions = (quiz.sets || []).flatMap((set) => set.questions || []);
          const theoryQuestion = questions.find((question) => question.id === 'ullevål_hageby_quiz_27');
          if (!theoryQuestion) throw new Error('Missing Ullevål Hageby theory question 27');
          if (theoryQuestion.emne_id !== 'em_by_boligpolitikk_affordability') throw new Error(`Unexpected q27 emne_id: ${theoryQuestion.emne_id}`);
          theoryQuestion.topic_hook_id = 'boligpolitikk_affordability';
          theoryQuestion.thinker_id = 'susan_fainstein';
          theoryQuestion.work = 'The Just City';
          theoryQuestion.theory_ref = {
            topic_hook_id: 'boligpolitikk_affordability',
            thinker_id: 'susan_fainstein',
            work: 'The Just City',
            why_it_helps: 'Fainsteins perspektiv på den rettferdige byen gjør det mulig å analysere spenningen mellom sosial boligambisjon og faktisk tilgang uten å erstatte de stedsspesifikke kildene.'
          };
          theoryQuestion.guidance_basis = ['data/fag/by/fagkart_by.json'];
          const addUnique = (values, value) => [...new Set([...(Array.isArray(values) ? values : []), value])];
          context.topic_hook_ids = addUnique(context.topic_hook_ids, 'boligpolitikk_affordability');
          context.thinker_ids = addUnique(context.thinker_ids, 'susan_fainstein');
          context.works = addUnique(context.works, 'The Just City');
          for (const field of ['existing_quiz_audit', 'profile_decision', 'held_back_candidates']) {
            if (context[field] === undefined) throw new Error(`Quiz production_context.${field} missing`);
            brief[field] = context[field];
          }
          const curriculumPairs = {
            module_ids: 'pensum_module_ids',
            emne_ids: 'emne_ids',
            topic_hook_ids: 'topic_hook_ids',
            method_ids: 'method_ids',
            thinker_ids: 'thinker_ids',
            works: 'works'
          };
          brief.selected_curriculum = {};
          for (const [briefField, contextField] of Object.entries(curriculumPairs)) {
            if (!Array.isArray(context[contextField])) throw new Error(`Quiz production_context.${contextField} missing`);
            brief.selected_curriculum[briefField] = context[contextField];
          }
          fs.writeFileSync(quizPath, `${JSON.stringify(quiz, null, 2)}\n`);
          fs.writeFileSync(briefPath, `${JSON.stringify(brief, null, 2)}\n`);
          NODE
      - name: Install and regenerate derived state
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-quiz-production-context.mjs --category by --target ullevål_hageby --output data/quiz/production_context/by/ullevål_hageby.json
          npm run civication:history-people:build
          npm run places:index:build
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
          npm run epoker:places:build
          npm run place-open:build
          npm run knowledge:canonical:write
      - name: Normalize changed text whitespace
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const changed = execFileSync('git', ['diff', '--name-only', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          for (const file of changed) {
            if (!fs.existsSync(file) || !fs.statSync(file).isFile()) continue;
            const buffer = fs.readFileSync(file);
            if (buffer.includes(0)) continue;
            const text = buffer.toString('utf8');
            const normalized = text.split(/\r?\n/).map((line) => line.replace(/[ \t]+$/u, '')).join('\n').replace(/\n*$/u, '\n');
            if (normalized !== text) fs.writeFileSync(file, normalized);
          }
          NODE
      - name: Verify quiz production context
        run: npm run audit:quiz-production-context
      - name: Verify quiz progression
        run: npm run audit:quiz-progression
      - name: Verify quiz theory binding
        run: npm run audit:quiz-theory-binding
      - name: Verify Civication history people
        run: npm run civication:history-people:check
      - name: Verify people shell
        run: bash scripts/check-people.sh
      - name: Verify Ullevål completion
        run: node tests/ullevål-hageby-completion.test.mjs
      - name: Verify places index
        run: npm run places:index:check
      - name: Verify epoch index
        run: npm run epoker:places:check
      - name: Verify place-open
        run: npm run place-open:check
      - name: Verify Fagverk place pages
        run: node scripts/audit-fagverk-place-pages.mjs
      - name: Verify Fagverk release manifest
        run: node scripts/build-fagverk-release-manifest.mjs --check
      - name: Normalize final verification output
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const changed = execFileSync('git', ['diff', '--name-only', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          for (const file of changed) {
            if (!fs.existsSync(file) || !fs.statSync(file).isFile()) continue;
            const buffer = fs.readFileSync(file);
            if (buffer.includes(0)) continue;
            const text = buffer.toString('utf8');
            const normalized = text.split(/\r?\n/).map((line) => line.replace(/[ \t]+$/u, '')).join('\n').replace(/\n*$/u, '\n');
            if (normalized !== text) fs.writeFileSync(file, normalized);
          }
          NODE
      - name: Verify whitespace
        run: git diff --check
      - name: Publish repaired candidate
        run: |
          git add -A
          git commit -m "Repair Ullevål Hageby Data checks on fresh main"
          git push origin HEAD:work/ulleval-hageby-completion-20260902
