name: Oslo six final canonical derived sync once
on:
  push:
    branches:
      - research/oslo-six-culture-institutions-v1-20261023
    paths:
      - .github/workflows/oslo-six-final-derived-sync-once.yml

permissions:
  contents: write

jobs:
  rebuild-derived-outputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-six-culture-institutions-v1-20261023
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Validate new Nobel History source report
        run: node scripts/audit-historie-place-production.mjs --all
      - name: Regenerate contexts after final five portrait image updates
        shell: bash
        run: |
          npm run quiz:context -- --category by --target vikaterrassen --output data/quiz/production_context/by/vikaterrassen.json
          npm run quiz:context -- --category historie --target nobels_fredssenter --output data/quiz/production_context/historie/nobels_fredssenter.json
          npm run quiz:context -- --category politikk --target arbeidersamfunnets_plass --output data/quiz/production_context/politikk/arbeidersamfunnets_plass.json
          npm run quiz:context -- --category politikk --target politihuset_gronland --output data/quiz/production_context/politikk/politihuset_gronland.json
          npm run quiz:context -- --category politikk --target statsministerboligen --output data/quiz/production_context/politikk/statsministerboligen.json
      - name: Check all global quiz production contexts
        run: npm run audit:quiz-production-context
      - name: Regenerate Fagverk release digest
        shell: bash
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Validate canonical Knowledge, Place-open and epoch index
        shell: bash
        run: |
          npm run knowledge:canonical:check
          npm run place-open:check
          npm run epoker:places:check
      - name: Guard derivative-only edits
        shell: bash
        run: |
          git status --short
          COUNT="$(git diff --name-only | grep -c . || true)"
          if [ "$COUNT" -gt 10 ]; then
            echo "Unexpected number of generated changes: $COUNT"
            exit 1
          fi
          if git diff --name-only | grep -Ev '^data/quiz/production_context/(by/vikaterrassen|historie/nobels_fredssenter|politikk/(arbeidersamfunnets_plass|politihuset_gronland|statsministerboligen))\.json$|^data/fagverk/fagverk_release\.json$'; then
            echo "Generator changed an unapproved source file"
            exit 1
          fi
      - name: Commit deterministic outputs and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/quiz/production_context/by/vikaterrassen.json
          git add data/quiz/production_context/historie/nobels_fredssenter.json
          git add data/quiz/production_context/politikk/{arbeidersamfunnets_plass,politihuset_gronland,statsministerboligen}.json
          git add data/fagverk/fagverk_release.json
          git rm .github/workflows/oslo-six-final-derived-sync-once.yml
          git diff --cached --stat
          git diff --cached --quiet || git commit -m 'Refresh quiz context hashes and Fagverk digest after source-first Oslo release'
          git push origin HEAD:research/oslo-six-culture-institutions-v1-20261023
