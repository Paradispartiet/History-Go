name: Temporary publish Film and TV unit 12 source brief

on:
  push:
    branches:
      - codex/film-tv-unit12-screen-places-source-brief
    paths:
      - "scripts/.unit12-source-brief-bootstrap/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-film-tv-unit12-source-brief
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/film-tv-unit12-screen-places-source-brief
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Assemble bootstrap
        run: |
          cat scripts/.unit12-source-brief-bootstrap/part-* | base64 --decode | gzip --decompress > scripts/prepare-film-tv-screen-places-identity-circulation-source-brief-v1.mjs
          chmod +x scripts/prepare-film-tv-screen-places-identity-circulation-source-brief-v1.mjs

      - name: Apply monotone production patch
        run: node scripts/prepare-film-tv-screen-places-identity-circulation-source-brief-v1.mjs

      - name: Validate syntax
        run: |
          node --check scripts/brief-film-tv-screen-places-identity-circulation-sources-v1.mjs
          node --check scripts/brief-film-tv-reception-participation-audience-methods-sources-v1.mjs
          node --check scripts/materialize-film-tv-reception-participation-audience-methods-fulltext-v1.mjs
          node --check scripts/audit-film-tv-reception-participation-audience-methods-fulltext-v1.mjs
          node --check scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs
          node --check tests/film-tv-screen-places-identity-circulation-source-brief-v1.test.mjs
          node --check tests/film-tv-reception-participation-audience-methods-fulltext-v1.test.mjs

      - name: Materialize source brief and monotone predecessor state
        run: |
          node scripts/brief-film-tv-screen-places-identity-circulation-sources-v1.mjs --write
          node scripts/brief-film-tv-reception-participation-audience-methods-sources-v1.mjs --write
          node scripts/audit-film-tv-reception-participation-audience-methods-fulltext-v1.mjs --write-report
          node scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs --write-report
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/audit-fagverk-film-tv-phase3.mjs --write-report

      - name: Validate source brief and regressions
        run: |
          node scripts/brief-film-tv-screen-places-identity-circulation-sources-v1.mjs
          node --test tests/film-tv-screen-places-identity-circulation-source-brief-v1.test.mjs
          node scripts/brief-film-tv-reception-participation-audience-methods-sources-v1.mjs
          node scripts/audit-film-tv-reception-participation-audience-methods-fulltext-v1.mjs
          node --test tests/film-tv-reception-participation-audience-methods-source-brief-v1.test.mjs
          node --test tests/film-tv-reception-participation-audience-methods-fulltext-v1.test.mjs
          node scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs
          node --test tests/film-tv-industry-regulation-distribution-fulltext-v1.test.mjs
          node --test tests/film-tv-industry-regulation-distribution-source-brief-v1.test.mjs
          node scripts/audit-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs
          node --test tests/film-tv-creative-work-technology-responsibility-fulltext-v1.test.mjs
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-film-tv-phase3.test.mjs
          node --test tests/film-tv-learning-order-plan-v1.test.mjs
          node --test tests/film-tv-learning-order-monotone-regression-v1.test.mjs
          node --test tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs

      - name: Commit generated source brief state
        run: |
          rm scripts/prepare-film-tv-screen-places-identity-circulation-source-brief-v1.mjs
          rm -rf scripts/.unit12-source-brief-bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Forbered Skjermsteder, identitet og sirkulasjon"
          git push origin HEAD:codex/film-tv-unit12-screen-places-source-brief
