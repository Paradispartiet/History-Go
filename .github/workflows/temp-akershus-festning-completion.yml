      - name: Commit verified permanent state and remove TEMP workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-akershus-festning-completion.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No permanent Akershus changes produced.' >&2
            exit 1
          fi
          git commit -m 'Complete Akershus festning canonical production'
          git push origin HEAD:work/akershus-festning-completion-20260829
