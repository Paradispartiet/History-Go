name: Temporary Poet materialization
on:
  push:
    branches:
      - civication/litteratur-poet-authored-depth
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: civication/litteratur-poet-authored-depth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Materialize Poet and synchronize governance
        run: |
          node scripts/tmp-materialize-poet.mjs
          node scripts/audit-civication-life-position-role-world-readiness.mjs --write
      - name: Verify targeted Poet contracts
        run: |
          node tests/civication-poet-life-position-readiness.test.js
          node tests/civication-poet-role-world.test.js
          node tests/civication-life-position-role-world-readiness.test.js
          node tests/civication-noncareer-role-taxonomy.test.js
          node tests/civication-role-world-contract.test.js
      - name: Commit canonical Poet state
        run: |
          git add \
            data/Civication/lifePositionRoleWorldReadiness.json \
            data/Civication/nonCareerRoleTaxonomy.json \
            data/Civication/roleWorldAuthoringChecklist.json \
            data/Civication/roleWorldPolicy.json \
            data/Civication/roleWorldThemeBank.json \
            data/Civication/roleWorlds/index.json \
            data/Civication/roleWorlds/litteratur/litteratur_poet.json \
            reports/civication-life-position-role-world-readiness.md \
            tests/civication-life-position-role-world-readiness.test.js \
            tests/civication-noncareer-role-taxonomy.test.js \
            tests/civication-role-world-contract.test.js
          if git diff --cached --quiet; then
            echo 'Poet canonical state already synchronized.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Synchronize Poet canonical Role World state'
          git push origin HEAD:civication/litteratur-poet-authored-depth
