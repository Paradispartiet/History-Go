name: Temporary Poet materialization
on:
  push:
    branches:
      - civication/litteratur-poet-authored-depth
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: civication/litteratur-poet-authored-depth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Harden temporary policy binding
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/tmp-materialize-poet.mjs')
          text = p.read_text()
          old = "policy.noncareer_subject_boundary.life_position_readiness.completed_life_position_role_worlds = 102;"
          new = """const findCompletedPolicy = (node) => {
            if (!node || typeof node !== 'object') return null;
            if (Object.prototype.hasOwnProperty.call(node, 'completed_life_position_role_worlds')) return node;
            for (const value of Object.values(node)) {
              const found = findCompletedPolicy(value);
              if (found) return found;
            }
            return null;
          };
          const completedPolicy = findCompletedPolicy(policy);
          if (!completedPolicy) throw new Error('Could not locate completed_life_position_role_worlds in roleWorldPolicy');
          completedPolicy.completed_life_position_role_worlds = 102;"""
          if old not in text:
              raise SystemExit('Expected policy assignment not found')
          p.write_text(text.replace(old, new))
          PY
      - name: Materialize Poet and synchronize governance
        run: |
          node scripts/tmp-materialize-poet.mjs
          node scripts/audit-civication-life-position-role-world-readiness.mjs --write
      - name: Synchronize taxonomy summary expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/civication-noncareer-role-taxonomy.test.js')
          text = p.read_text()
          old = "assert.deepEqual(roleWorldIndex.summary, { role_worlds_total: 186, career_role_worlds: 85, life_position_role_worlds: 101 });"
          new = "assert.deepEqual(roleWorldIndex.summary, { role_worlds_total: 187, career_role_worlds: 85, life_position_role_worlds: 102 });"
          if old not in text:
              raise SystemExit('Expected stale roleWorldIndex.summary assertion not found')
          p.write_text(text.replace(old, new))
          PY
      - name: Verify targeted Poet contracts
        run: |
          node tests/civication-poet-life-position-readiness.test.js
          node tests/civication-poet-role-world.test.js
          node tests/civication-life-position-role-world-readiness.test.js
          node tests/civication-noncareer-role-taxonomy.test.js
          node tests/civication-role-world-contract.test.js
      - name: Commit canonical Poet state
        run: |
          git add \
            data/Civication/lifePositionRoleWorldReadiness.json \
            data/Civication/nonCareerRoleTaxonomy.json \
            data/Civication/roleWorldAuthoringChecklist.json \
            data/Civication/roleWorldPolicy.json \
            data/Civication/roleWorldThemeBank.json \
            data/Civication/roleWorlds/index.json \
            data/Civication/roleWorlds/litteratur/litteratur_poet.json \
            reports/civication-life-position-role-world-readiness.md \
            tests/civication-life-position-role-world-readiness.test.js \
            tests/civication-noncareer-role-taxonomy.test.js \
            tests/civication-role-world-contract.test.js
          if git diff --cached --quiet; then
            echo 'Poet canonical state already synchronized.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Synchronize Poet canonical Role World state'
          git push origin HEAD:civication/litteratur-poet-authored-depth
