name: One-time Hausmannsgate axis coordinate source probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Hauskvartalet street geometry
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/hausmannsgate"
          mkdir -p "$OUT"
          UA='History-Go coordinate research (Paradispartiet/History-Go)'

          curl --fail --silent --show-error --location --user-agent "$UA" \
            'https://api.openstreetmap.org/api/0.6/map?bbox=10.7480,59.9175,10.7545,59.9206' \
            | tee "$OUT/osm-hauskvartalet-bbox.xml" >/dev/null

          for n in 34 40 42; do
            curl --fail --silent --show-error --location --user-agent "$UA" \
              --get 'https://ws.geonorge.no/adresser/v1/sok' \
              --data-urlencode "sok=Hausmanns gate $n Oslo" --data 'treffPerSide=30' \
              | tee "$OUT/geonorge-hausmanns-gate-$n.json" >/dev/null
          done

          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://api.kartverket.no/stedsnavn/v1/sted' \
            --data-urlencode 'sok=Hausmanns gate' --data 'utkoordsys=4258' --data 'treffPerSide=50' --data 'side=1' \
            | tee "$OUT/kartverket-ssr-hausmanns-gate.json" >/dev/null

          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'q=Hausmania, Oslo, Norway' \
            --data 'format=jsonv2' --data 'polygon_geojson=1' --data 'extratags=1' --data 'namedetails=1' --data 'limit=20' \
            | tee "$OUT/nominatim-hausmania.json" >/dev/null

      - name: Upload raw source artifact
        uses: actions/upload-artifact@v4
        with:
          name: hausmannsgate-axis-coordinate-source-probe
          path: ${{ runner.temp }}/hausmannsgate
