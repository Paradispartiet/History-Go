name: Probe Hakadal Verk source objects

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  probe:
    if: github.head_ref == 'agent/akershus-hakadal-verk-production'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch and persist Hakadal Verk geometry
        shell: bash
        run: |
          set -euo pipefail
          out='reports/akershus-coordinate-hakadal-verk-source-probe'
          mkdir -p "$out"

          curl --fail --location --retry 4 --retry-delay 3 \
            -A 'History-Go coordinate verification/1.0' \
            'https://api.openstreetmap.org/api/0.6/way/249239760/full' \
            | tee "$out/osm-way-249239760-full.xml" >/dev/null

          curl --fail --location --retry 4 --retry-delay 3 \
            -A 'History-Go coordinate verification/1.0' \
            'https://nominatim.openstreetmap.org/lookup?osm_ids=W249239760&format=jsonv2' \
            | tee "$out/nominatim-way-249239760.json" >/dev/null

          python - <<'PY' | tee "$out/source-summary.txt"
          import json
          import math
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path('reports/akershus-coordinate-hakadal-verk-source-probe')
          root = ET.parse(out / 'osm-way-249239760-full.xml').getroot()
          nodes = {n.attrib['id']: (float(n.attrib['lat']), float(n.attrib['lon'])) for n in root.findall('node')}
          way = next(w for w in root.findall('way') if w.attrib['id'] == '249239760')
          refs = [nd.attrib['ref'] for nd in way.findall('nd')]
          pts = [nodes[r] for r in refs if r in nodes]
          tags = {t.attrib['k']: t.attrib['v'] for t in way.findall('tag')}

          if len(pts) < 3:
              raise SystemExit('Way 249239760 has insufficient geometry')

          # Polygon centroid in lon/lat plane; appropriate for this small building footprint.
          ring = [(lon, lat) for lat, lon in pts]
          if ring[0] != ring[-1]:
              ring.append(ring[0])
          area2 = cx = cy = 0.0
          for (x1, y1), (x2, y2) in zip(ring, ring[1:]):
              cross = x1 * y2 - x2 * y1
              area2 += cross
              cx += (x1 + x2) * cross
              cy += (y1 + y2) * cross
          if abs(area2) < 1e-15:
              lat = sum(p[0] for p in pts) / len(pts)
              lon = sum(p[1] for p in pts) / len(pts)
          else:
              lon = cx / (3 * area2)
              lat = cy / (3 * area2)

          legacy = (60.12083, 10.82278)
          def hav(a, b):
              R = 6371000.0
              p1, p2 = map(math.radians, (a[0], b[0]))
              dp = math.radians(b[0] - a[0])
              dl = math.radians(b[1] - a[1])
              h = math.sin(dp/2)**2 + math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2 * R * math.asin(math.sqrt(h))

          nom = json.loads((out / 'nominatim-way-249239760.json').read_text())
          print(f'osm_way=249239760')
          print(f'node_count={len(pts)}')
          print(f'centroid_lat={lat:.12f}')
          print(f'centroid_lon={lon:.12f}')
          print(f'distance_from_legacy_m={hav(legacy, (lat, lon)):.1f}')
          print('tags=' + json.dumps(tags, ensure_ascii=False, sort_keys=True))
          print('nominatim=' + json.dumps(nom, ensure_ascii=False, sort_keys=True))
          PY

      - name: Remove probe workflow and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/probe-hakadal-verk.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/akershus-coordinate-hakadal-verk-source-probe .github/workflows/probe-hakadal-verk.yml
          git commit -m 'Persist Hakadal Verk coordinate source evidence'
          git push origin HEAD:${{ github.head_ref }}
