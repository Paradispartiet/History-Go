name: Finalize Karl Johans gate Fagverk v2

on:
  push:
    branches:
      - work/karl-johan-fagverk-v2-20260901
    paths:
      - .github/workflows/finalize-karl-johan-fagverk-v2.yml
      - tools/finalize-karl-johan-fagverk-v2.mjs

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync branch to current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Finalize Karl Johan source and registry
        run: node tools/finalize-karl-johan-fagverk-v2.mjs
      - name: Regenerate Place-open runtime
        run: node scripts/build-place-open-payloads.mjs
      - name: Regenerate Fagverk place coverage
        run: node scripts/audit-fagverk-place-pages.mjs --write
      - name: Regenerate Fagverk release
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Validate Fagverk page contract
        run: node scripts/audit-fagverk-place-pages.mjs
      - name: Validate Place-open and release artifacts
        run: |
          node scripts/build-place-open-payloads.mjs --check
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Test Fagverk page and substance contracts
        run: |
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/fagverk-place-rendering.test.mjs
          node --test tests/fagverk-place-substance-audit.test.mjs
      - name: Test Fagverk links
        run: node --test tests/fagverk-link-audit.test.mjs
      - name: Validate changed Place images
        run: node scripts/audit-place-images.mjs --mode=changed
      - name: Validate diff whitespace
        run: git diff --check
      - name: Commit generated production result and remove temporary tooling
        run: |
          git add \
            data/places/by/oslo/places/karl_johan.json \
            data/runtime/place-open/karl_johan.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/fagverk-place-page-coverage-v2.json
          git rm \
            tools/finalize-karl-johan-fagverk-v2.mjs \
            .github/workflows/finalize-karl-johan-fagverk-v2.yml
          git diff --cached --quiet && { echo "No production changes to commit"; exit 1; }
          git commit -m "Finalize Karl Johans gate Fagverk v2"
          git push origin HEAD:${GITHUB_REF_NAME}
