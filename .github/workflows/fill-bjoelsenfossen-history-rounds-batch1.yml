              why_here: 'Sagbruket viser det tidlige skiftet fra foss som landskap til foss som mekanisk arbeidskraft.'
            },
            {
              id: 'bjoelsenfossen_bjoelsen_sag_1701', title: 'Bjølsen sag', type: 'sagbruk', kind: 'industrial_sawmill', year: 1701,
              desc: 'Gerhard Treschow bygde en ny sag ved fossen og ga den navnet Bjølsen sag.',
              why_here: 'Sagen inngikk i Treschows større trelast- og industrivirksomhet i Christiania.'
