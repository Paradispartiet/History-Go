              placeSpecificReason: 'Modellen gjenskaper Akerselvas høyeste foss og den tekniske reguleringen akkurat ved Bjølsenfossen.',
              historicalFunction: 'Viser hvordan høydeforskjell og styrt vannføring ble omgjort til mekanisk kraft.',
              physicalObject: true, placeSpecific: true, storePrice: 45, currency: 'PC', collection: 'bjoelsenfossen', collectable: true
            },
            {
