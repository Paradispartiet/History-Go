          const placePath = 'data/places/natur/oslo/places_oslo_natur_akerselvarute/bjoelsenfossen.json';
          const peoplePath = 'data/people/natur/oslo/people_natur_oslo.json';
          const storyPath = 'data/stories/stories_bjoelsenfossen.json';
          const storyManifestPath = 'data/stories/stories_manifest_natur_batch_01.json';
          const leksikonPath = 'data/leksikon/places/oslo/historie/leksikon_oslo_historie_batch2.json';
          const quizPath = 'data/quiz/historie/bjoelsenfossen_sets.json';

