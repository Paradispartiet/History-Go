            { type: 'local_history', label: 'Akerselvas Venner – Bjølsenfossen', url: sources.akerselvaFoss, lang: 'nb', verifiedAt: '2026-07-19' },
            { type: 'museum', label: 'Industrimuseum – Akerselva Digitalt', url: sources.industrimuseum, lang: 'nb', verifiedAt: '2026-07-19' },
            { type: 'official_business', label: 'Regal – møller i Norge', url: sources.regal, lang: 'nb', verifiedAt: '2026-07-19' }
          ];
          place.quiz_profile = {
            place_type: 'foss, dam og historisk møllekraftpunkt',
            subtype: 'akerselva_hoyeste_foss',
            signature_features: [
              'Akerselvas høyeste foss med to fall på til sammen over 16 meter',
              'Bjølsendammen og regulert vannføring',
              'sagbruk fra 1600-tallet og Bjølsen sag fra 1701',
              'byens vanninntak 1860–1867',
