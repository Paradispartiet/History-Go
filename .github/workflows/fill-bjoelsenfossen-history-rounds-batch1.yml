            nblMartinsen: 'https://nbl.snl.no/Gustav_Martinsen',
            akerselvaFoss: 'https://www.akerselvasvenner.no/2016/01/01/2396/',
            akerselvaBru: 'https://www.akerselvasvenner.no/2016/01/01/valsemollebrua/',
            industrimuseum: 'https://www.industrimuseum.no/akerselvadigitalt',
            regal: 'https://www.regal.no/om-oss/moller-i-norge/'
