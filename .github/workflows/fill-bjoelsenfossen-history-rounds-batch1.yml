name: Fill Bjølsenfossen history rounds batch 1

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  produce:
    if: github.head_ref == 'agent/fill-bjoelsenfossen-history-rounds-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fill-bjoelsenfossen-history-rounds-batch1
          fetch-depth: 0

      - name: Produce Bjølsenfossen round content
