            summary: 'Bjølsenfossen gikk fra sagkraft og vanninntak til å bli energikilden bak en av landets viktigste valsemøller.',
            story: 'Før kornsiloene og teglbygningene kom, arbeidet fossefallet allerede. På 1600-tallet drev vannet Sandaker sag. I 1701 bygde Gerhard Treschow Bjølsen sag og gjorde fossen til del av en større trelast- og industrivirksomhet.\n\nMellom 1860 og 1867 fikk Bjølsendammen en helt annen oppgave: den var vanninntak for byen. Det var et sårbart valg så langt nede i en elv med sagbruk og industri, og vanninntaket ble senere flyttet opp til Maridalsvannet.\n\nI 1884 etablerte Gustav Martinsen og Ole Amundsen Bjølsen Valsemølle. Valsestolen ga mer og finere mel enn tradisjonelle møllesteiner. Firmaet overtok Bjølsen Mølle i 1885, kjøpte Sandaker Mølle i 1889 og flyttet gradvis hovedproduksjonen til østsiden. I 1899 sikret kjøpet av Christiania mekaniske Væveri rettighetene til mer av fossens to fall. Vannet ble ført gjennom rørgater til turbiner med en samlet effekt på omtrent 1200 hestekrefter.\n\nMange fabrikker langs Akerselva er borte eller ombygd. Ved Bjølsenfossen produseres det fortsatt mel. Fossen forteller derfor ikke bare om en avsluttet industrihistorie, men om en produksjonslinje som har skiftet teknologi og eiere uten å forlate stedet.',
