          const place = read(placePath);
          place.desc = 'Akerselvas høyeste foss, brukt til sagbruk, vannforsyning og mølleindustri.';
          place.tags = ['foss', 'vannkraft', 'industrihistorie', 'mollehistorie', 'vannforsyning', 'akerselva'];
          place.popupDesc = 'Bjølsenfossen, også kalt Bjølsenfallet, er Akerselvas høyeste foss med to fall på til sammen over 16 meter. Fossen er naturlig, men vannføringen styres fra Bjølsendammen og sluseanlegget ovenfor. På 1600-tallet drev fossen Sandaker sag, og Gerhard Treschow anla Bjølsen sag i 1701.\n\nI Bjølsendammen lå byens vanninntak fra 1860 til 1867. Fra 1884 ble fossen tett knyttet til Bjølsen Valsemølle. Vannet ble ført gjennom rørgater til turbiner, og det bevarte kraftanlegget kunne utvikle rundt 1200 hestekrefter. Mølleproduksjonen fortsetter i området, mens selve fossen i stor grad ligger innenfor et aktivt industriområde med begrenset offentlig tilgang.';
