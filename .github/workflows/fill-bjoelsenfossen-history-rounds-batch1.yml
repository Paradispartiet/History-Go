            byleksikonMolle: 'https://oslobyleksikon.no/side/Bj%C3%B8lsen_Valsem%C3%B8lle',
            byleksikonStrok: 'https://oslobyleksikon.no/side/Bj%C3%B8lsen_(str%C3%B8k)',
            byleksikonBru: 'https://oslobyleksikon.no/side/Treschows_bru',
            snlMolle: 'https://snl.no/Bj%C3%B8lsen_Valsem%C3%B8lle',
