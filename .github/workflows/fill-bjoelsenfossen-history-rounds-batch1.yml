              desc: 'Et fysisk samlerbrett med hele korn, valsede mellomprodukter og ferdig mel som forklarer forskjellen mellom valsestol og møllestein.',
              placeSpecificReason: 'Objektet bygger på teknologien som ga Bjølsen Valsemølle navn og vekst fra 1884.',
              historicalFunction: 'Gjør kornforedlingens teknologiske skifte håndgripelig.',
              physicalObject: true, placeSpecific: true, storePrice: 35, currency: 'PC', collection: 'bjoelsenfossen', collectable: true
            },
            {
              id: 'bjoelsenfossen_vanninntak_1860_plate', title: 'Vanninntaksplaten 1860–1867', type: 'metallplate', kind: 'physical_object',
              desc: 'En fysisk kartplate som viser inntaket i Bjølsendammen og vannets videre vei inn i Christianias vannforsyning.',
              placeSpecificReason: 'Platen dokumenterer den korte perioden da dammen hadde en direkte kommunal forsyningsfunksjon.',
              historicalFunction: 'Knytter industriens elv til byens behov for drikke- og bruksvann.',
              physicalObject: true, placeSpecific: true, storePrice: 30, currency: 'PC', collection: 'bjoelsenfossen', collectable: true
            }
          ];
          place.brands = [
            { id: 'sandaker_sag', name: 'Sandaker sag', brand_kind: 'historic_sawmill', brand_type: 'early_water_power_actor' },
            { id: 'bjoelsen_sag', name: 'Bjølsen sag', brand_kind: 'historic_sawmill', brand_type: 'treschow_industrial_actor' },
            { id: 'bjoelsen_molle', name: 'Bjølsen Mølle', brand_kind: 'historic_grain_mill', brand_type: 'mill_actor' },
            { id: 'bjoelsen_valsemolle', name: 'Bjølsen Valsemølle', brand_kind: 'historic_and_continuing_flour_mill', brand_type: 'primary_industrial_actor' },
            { id: 'regal_molle', name: 'Regal', brand_kind: 'flour_brand', brand_type: 'production_brand' },
            { id: 'lantmannen_cerealia', name: 'Lantmännen Cerealia', brand_kind: 'food_industry_company', brand_type: 'current_operator' },
            { id: 'christiania_vannforsyning', name: 'Christianias vannforsyning', brand_kind: 'municipal_water_system', brand_type: 'historic_public_actor' },
            { id: 'akerselvas_venner', name: 'Akerselvas Venner', brand_kind: 'river_environment_organization', brand_type: 'documentation_and_access_actor' }
          ];
          place.nature_profile = {
            type: 'naturlig foss / regulert damutløp / vannkraftlandskap',
            title: 'Akerselvas største fall som naturkraft og industrimaskin',
            summary: 'Natur-rundingen viser Akerselvas høyeste foss som både geologisk terrengform og teknisk styrt vannsystem. Fossen består av to naturlige fall med samlet fallhøyde på over 16 meter, men vannmengden påvirkes av Bjølsendammen, sluser og tidligere industriløp. Vannets høydeforskjell skapte energien som drev sagblad, møller og turbiner, mens damflaten ovenfor også ble brukt som kommunalt vanninntak. Rundingen handler derfor om fall, strøm, erosjon, oppdemming og vannføring som fysisk grunnlag for byhistorie. Selve fosseområdet ligger delvis inne på aktivt industriområde, så observasjon skal skje fra lovlig tilgjengelige offentlige punkter og uten å passere porter eller sperringer.',
