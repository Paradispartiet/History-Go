name: Fagverk IA v3 Historie redirect generated probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fagverk-ia-v3-historie-redirect-generated-probe.yml'
      - 'data/fagverk/fagverk_portal.json'
      - 'data/fag/historie/**'
      - 'data/fagverk/historie/legacy_theory_adjudication_v1.json'
      - 'scripts/audit-fagverk-historie.mjs'
      - 'scripts/audit-fagverk-historie-legacy-theory.mjs'
      - 'scripts/audit-fagverk-historie-legacy-adjudication.mjs'
      - 'reports/fagverk/historie-subject-audit.json'
      - 'reports/fagverk/historie-legacy-theory-audit.json'

permissions:
  contents: write

jobs:
  generate-and-clean:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Move deterministic audits to archived legacy source and migrated route
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected patch anchor missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          archive = 'data/fag/historie/archive/merke_historie_full_teori_legacy_20260828.html'
          compat = 'data/fag/historie/merke_historie (1).html'
          progress = 'fagverk.html?subject=historie#fagverkIaProgresjon'

          patch(
              'scripts/audit-fagverk-historie-legacy-theory.mjs',
              "const LEGACY_BADGE = 'data/fag/historie/merke_historie (1).html';",
              f"const LEGACY_BADGE = '{archive}';"
          )

          patch(
              'data/fagverk/historie/legacy_theory_adjudication_v1.json',
              '    "data/fag/historie/merke_historie (1).html"',
              f'    "{archive}"'
          )

          patch(
              'scripts/audit-fagverk-historie.mjs',
              "  badgePage: 'data/fag/historie/merke_historie (1).html',",
              f"  legacyBadgePage: '{archive}',\n  compatibilityBadgePage: '{compat}',\n  badgeProgressRoute: '{progress}',"
          )
          patch(
              'scripts/audit-fagverk-historie.mjs',
              "  assert(portalEntry.badgePage === PATHS.badgePage && fs.existsSync(abs(PATHS.badgePage)), 'Historie har ugyldig merkesiderute');",
              "  assert(portalEntry.badgePage === PATHS.badgeProgressRoute, 'Historie har feil integrert merkesiderute');\n  assert(fs.existsSync(abs(PATHS.legacyBadgePage)), 'Historie mangler arkivert legacy-teori');\n  assert(fs.existsSync(abs(PATHS.compatibilityBadgePage)), 'Historie mangler compatibility-merkeside');\n  const compatibilityBadgeHtml = read(PATHS.compatibilityBadgePage);\n  assert(compatibilityBadgeHtml.includes('location.replace') && compatibilityBadgeHtml.includes('subject=historie#fagverkIaProgresjon'), 'Historie compatibility-merkeside redirecter ikke til Progresjon');"
          )

          patch(
              'scripts/audit-fagverk-historie-legacy-adjudication.mjs',
              "const LEGACY_BADGE = 'data/fag/historie/merke_historie (1).html';",
              f"const LEGACY_BADGE = '{archive}';\nconst COMPAT_BADGE_PAGE = '{compat}';"
          )
          patch(
              'scripts/audit-fagverk-historie-legacy-adjudication.mjs',
              'for (const required of [ADJUDICATION, PORTAL, LEGACY_BADGE]) {',
              'for (const required of [ADJUDICATION, PORTAL, LEGACY_BADGE, COMPAT_BADGE_PAGE]) {'
          )
          patch(
              'scripts/audit-fagverk-historie-legacy-adjudication.mjs',
              "const historiePortal = portal.categories?.find((item) => item.id === 'historie');\nif (!historiePortal) throw new Error('Historie mangler i fagverk_portal.json.');",
              "const historiePortal = portal.categories?.find((item) => item.id === 'historie');\nif (!historiePortal) throw new Error('Historie mangler i fagverk_portal.json.');\nconst portalRoute = text(historiePortal.badgePage);\nconst portalRedirected = portalRoute === EXPECTED_TARGET;\nconst legacyBadgeSourcePreserved = exists(LEGACY_BADGE);\nconst compatibilityRedirectHtml = fs.readFileSync(path.join(ROOT, COMPAT_BADGE_PAGE), 'utf8');\nconst compatibilityRedirectPresent = compatibilityRedirectHtml.includes('location.replace') && compatibilityRedirectHtml.includes('subject=historie#fagverkIaProgresjon');"
          )
          patch(
              'scripts/audit-fagverk-historie-legacy-adjudication.mjs',
              '    portalStillLegacy: historiePortal.badgePage === LEGACY_BADGE',
              '    portalRoute,\n    portalRedirected,\n    legacyBadgeSourcePreserved,\n    compatibilityRedirectPresent'
          )
          patch(
              'scripts/audit-fagverk-historie-legacy-adjudication.mjs',
              "if (!report.summary.portalStillLegacy) throw new Error('Adjudiseringsfasen skal ikke endre Historie badgePage; redirect skjer i egen tranche.');",
              "if (!report.summary.portalRedirected) throw new Error(`Historie badgePage må peke til ${EXPECTED_TARGET} etter grønn adjudisering.`);\nif (!report.summary.legacyBadgeSourcePreserved) throw new Error('Arkivert Historie-teori må bevares som auditkilde.');\nif (!report.summary.compatibilityRedirectPresent) throw new Error('Legacy Historie-URL må være en compatibility-redirect til Progresjon.');"
          )
          PY
      - name: Regenerate deterministic Historie reports
        run: |
          node scripts/audit-fagverk-historie-legacy-theory.mjs --write-report
          node scripts/audit-fagverk-historie.mjs --write-report
          node scripts/audit-fagverk-historie-legacy-adjudication.mjs
      - name: Commit generated outputs and remove probe
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fagverk-ia-v3-historie-redirect-generated-probe.yml
          git add data/fagverk/historie/legacy_theory_adjudication_v1.json scripts/audit-fagverk-historie.mjs scripts/audit-fagverk-historie-legacy-theory.mjs scripts/audit-fagverk-historie-legacy-adjudication.mjs reports/fagverk/historie-subject-audit.json reports/fagverk/historie-legacy-theory-audit.json
          git commit -m "Regenerate Historie migrated-route audits"
          git push origin HEAD:"$HEAD_BRANCH"
