name: Scenekunst nationwide audit

on:
  push:
    branches:
      - agent/scenekunst-source-migration-01

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/scenekunst-source-migration-01
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run nationwide Scenekunst audit
        run: node scripts/audit-scenekunst-nationwide.mjs

      - name: Commit report and remove one-shot runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/scenekunst-nationwide-candidates-2026-07-21.json
          git add reports/scenekunst-nationwide-candidates-2026-07-21.md
          git rm scripts/audit-scenekunst-nationwide.mjs
          git rm .github/workflows/scenekunst-nationwide-audit.yml
          git commit -m "Audit nationwide Scenekunst candidates"
          git push origin HEAD:agent/scenekunst-source-migration-01
