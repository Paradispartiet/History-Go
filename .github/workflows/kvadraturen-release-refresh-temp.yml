name: Kvadraturen scoped final Fagverk release refresh
on:
  push:
    branches:
      - research/oslo-sentrum-kvadraturen-v1-six-20261023
    paths:
      - '.github/workflows/kvadraturen-release-refresh-temp.yml'
permissions:
  contents: write
concurrency:
  group: kvadraturen-release-refresh-once
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-kvadraturen-v1-six-20261023
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate deterministic release with existing builder
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit only refreshed release
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | grep -v '^data/fagverk/fagverk_release.json$' > /tmp/unexpected || true
          test ! -s /tmp/unexpected || { cat /tmp/unexpected; exit 1; }
          git add data/fagverk/fagverk_release.json
          if git diff --cached --quiet; then
            echo 'Release unchanged'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh Fagverk release after Garmanngården Knowledge and browser QA'
          git push origin HEAD:research/oslo-sentrum-kvadraturen-v1-six-20261023
