name: TEMP Bankplassen v3 materialize

on:
  push:
    branches:
      - repair/bankplassen-4-v3-20260916

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'ci: materialize Bankplassen v3 repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Materialize Bankplassen 4 on fresh v3 base
        shell: bash
        run: |
          set -euo pipefail
          BASE='65481591d97aa9249514fb60c7b502a446bc10c0'
          PR_SHA='4651d30b5784f08b5e00e7afee7a968ea8ba464c'
          PLACE_ID='norges_bank_bankplassen_4'
          git merge-base --is-ancestor "$BASE" HEAD
          git fetch origin pull/5945/head:refs/remotes/origin/pr5945
          test "$(git rev-parse refs/remotes/origin/pr5945)" = "$PR_SHA"
          PR=refs/remotes/origin/pr5945

          # Byte-identical dedicated Bankplassen assets and canonical source files from #5945.
          git checkout "$PR" -- \
            'bilder/QuizCards/Norges Bank – Bankplassen 4.webp' \
            bilder/kort/brands/norges_bank.webp \
            bilder/kort/objects/norges_bank_bankplassen_4_arbeid_og_fred.webp \
            bilder/kort/people/karl_gether_bomhoff.webp \
            bilder/kort/productions/norges_bank_bankplassen_4_seddeltrykking.webp \
            bilder/places/norges_bank_bankplassen_4.webp \
            bilder/places/norges_bank_bankplassen_4_front_portrait.webp \
            data/leksikon/places/oslo/naeringsliv/leksikon_norges_bank_bankplassen_4.json \
            data/leksikon/sprak/places/europe/norway/oslo/norges_bank_bankplassen_4.json \
            data/people/claims/naeringsliv/oslo/norges_bank_bankplassen_4/karl_gether_bomhoff.claims.json \
            data/people/naeringsliv/oslo/norges_bank_bankplassen_4/karl_gether_bomhoff.json \
            data/places/naeringsliv-production/norges_bank_bankplassen_4.json \
            data/places/naeringsliv/oslo/places_naeringsliv_oslo_oppdag_kvadraturen_batch_04/norges_bank_bankplassen_4.json \
            data/places/production/norges_bank_bankplassen_4.json \
            data/quiz/naeringsliv/norges_bank_bankplassen_4_sets.json \
            data/quiz/production_briefs/naeringsliv/norges_bank_bankplassen_4.json \
            reports/place-production/norges_bank_bankplassen_4-source-review-v1.md

          # Transplant only the Bankplassen slices from shared hand-maintained JSON files.
          PR="$PR" PLACE_ID="$PLACE_ID" node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const pr = process.env.PR;
          const placeId = process.env.PLACE_ID;
          const load = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const fromPr = p => JSON.parse(cp.execFileSync('git', ['show', `${pr}:${p}`], { encoding: 'utf8' }));
          const save = (p, value) => fs.writeFileSync(p, JSON.stringify(value, null, 2) + '\n');
          const requireValue = (value, label) => {
            if (value === undefined || value === null) throw new Error(`missing ${label} in #5945`);
            return value;
          };
          const upsertArrayEntity = (p, id) => {
            const cur = load(p);
            const src = fromPr(p);
            if (!Array.isArray(cur) || !Array.isArray(src)) throw new Error(`${p} must be an array`);
            const item = requireValue(src.find(x => x?.id === id), `${id} in ${p}`);
            const next = cur.filter(x => x?.id !== id);
            next.push(item);
            save(p, next);
          };

          {
            const p = 'data/brands/brands_by_place.json';
            const cur = load(p), src = fromPr(p);
            cur[placeId] = requireValue(src[placeId], `${placeId} in ${p}`);
            save(p, cur);
          }
          for (const p of [
            'data/brands/brands_catalog.json',
            'data/brands/brands_catalog_v17.json',
            'data/brands/brands_master.json',
          ]) upsertArrayEntity(p, 'norges_bank');

          {
            const p = 'data/fag/fag_manifest.json';
            const cur = load(p), src = fromPr(p);
            cur.naeringsliv.quizProduction.targets[placeId] = requireValue(
              src.naeringsliv?.quizProduction?.targets?.[placeId],
              `${placeId} quiz target in ${p}`
            );
            save(p, cur);
          }

          for (const lang of ['en', 'es', 'pt']) {
            const p = `data/i18n/content/places/${lang}.json`;
            const cur = load(p), src = fromPr(p);
            cur[placeId] = requireValue(src[placeId], `${placeId} in ${p}`);
            save(p, cur);
          }

          {
            const p = 'data/leksikon/manifest.json';
            const cur = load(p), src = fromPr(p);
            const item = requireValue(
              src.files.find(value => value.includes('leksikon_norges_bank_bankplassen_4.json')),
              `Bankplassen leksikon file in ${p}`
            );
            cur.files = cur.files.filter(value => value !== item);
            cur.files.push(item);
            save(p, cur);
          }

          {
            const p = 'data/lesespor/oslo/lesespor_oslo_naeringsliv.json';
            const cur = load(p), src = fromPr(p);
            const items = src.items.filter(item => item?.place_ids?.includes(placeId));
            if (!items.length) throw new Error(`missing ${placeId} reading-track items in #5945`);
            cur.items = cur.items.filter(item => !item?.place_ids?.includes(placeId));
            cur.items.push(...items);
            save(p, cur);
          }

          {
            const p = 'data/people/manifest.json';
            const cur = load(p), src = fromPr(p);
            const files = src.files.filter(value => value.includes('norges_bank_bankplassen_4'));
            if (!files.length) throw new Error(`missing ${placeId} people manifest path in #5945`);
            cur.files = cur.files.filter(value => !value.includes('norges_bank_bankplassen_4'));
            cur.files.push(...files);
            save(p, cur);
          }

          {
            const p = 'data/fagverk/fagverk_registry.json';
            const cur = load(p), src = fromPr(p);
            cur.placeLinks ||= {};
            cur.placeLinks[placeId] = requireValue(src.placeLinks?.[placeId], `${placeId} in ${p}`);
            save(p, cur);
          }

          {
            const p = 'data/leksikon/sprak/manifest.json';
            const cur = load(p), src = fromPr(p);
            cur.place_files ||= {};
            cur.place_files[placeId] = requireValue(src.place_files?.[placeId], `${placeId} in ${p}`);
            save(p, cur);
          }

          {
            const p = 'data/quiz/manifest.json';
            const cur = load(p), src = fromPr(p);
            const item = requireValue(src.sets.find(x => x?.targetId === placeId), `${placeId} quiz set in ${p}`);
            cur.sets = cur.sets.filter(x => x?.targetId !== placeId);
            cur.sets.push(item);
            save(p, cur);
          }

          {
            const p = '.github/ci/place-production-routing-v2.json';
            const cur = load(p);
            cur.places = cur.places.filter(entry => entry.id !== placeId);
            cur.places.push({
              id: placeId,
              match: [placeId, 'norges-bank-bankplassen-4'],
              gates: ['places', 'place-production-v3'],
              tests: ['tests/norges-bank-bankplassen-4-place-production-v3.test.mjs'],
            });
            save(p, cur);
          }
          NODE

          # Canonical V3 workflow state. UI remains pending until screenshots are generated and inspected.
          node <<'NODE'
          const fs = require('fs');
          const placeId = 'norges_bank_bankplassen_4';
          const placeFile = 'data/places/naeringsliv/oslo/places_naeringsliv_oslo_oppdag_kvadraturen_batch_04/norges_bank_bankplassen_4.json';
          const sourceReview = 'reports/place-production/norges_bank_bankplassen_4-source-review-v1.md';
          const productionReport = 'data/places/naeringsliv-production/norges_bank_bankplassen_4.json';
          const contracts = {
            place_production: 'v3',
            place_card_collections: 'v2',
            quiz_production: 'canonical-v1',
          };
          const record = {
            schema: 'history_go_place_production_workflow_v3',
            place_id: placeId,
            category: 'naeringsliv',
            contracts,
            sources: {
              factuality_record: 'data/places/production/norges_bank_bankplassen_4.json',
              evidence_refs: [sourceReview, productionReport],
            },
            read_first: {
              schema: 'history_go_place_read_first_v3',
              status: 'PASS',
              recorded_at: '2026-09-16T13:09:00Z',
              rule_files: [
                'docs/PLACE_PRODUCTION_CHECKLIST.md',
                'docs/PLACE_PRODUCTION_CHECKLIST_REFERENCE_V1.md',
                'docs/PLACE_PRODUCTION_PROFILES.md',
                'data/quiz/regler/QUIZ_PRODUCTION_CANONICAL.md',
                'data/places/README_place_rounds.md',
                'data/badges/index.json',
                'data/badges/place_production_routing_v1.json',
                'docs/PLACE_OBJECTS_CANONICAL.md',
                'data/brands/brand_rules_v1_1.json',
                'data/badges/naeringsliv.json',
              ],
              contracts: { ...contracts },
              attestation: 'The current canonical Place Production, collection, quiz, object, brand and Næringsliv badge rules were read in full before this V3 attestation was recorded; the migration preserves the verified Bankplassen factuality and production decisions from PR #5945.',
            },
            profile: {
              id: 'standard',
              status: 'confirmed',
              reason: 'Bankplassen 4 has a source-backed institutional history, one canonical person, one physical signature object, one institutional brand and one documented place-specific production process without requiring a major-profile breadth expansion.',
            },
            source_review: {
              status: 'complete',
              evidence: sourceReview,
            },
            collections: {
              people: {
                status: 'PASS',
                refs: ['data/people/naeringsliv/oslo/norges_bank_bankplassen_4/karl_gether_bomhoff.json'],
              },
              objects: {
                status: 'PASS',
                refs: [placeFile],
              },
              brands: {
                status: 'PASS',
                refs: ['data/brands/brands_by_place.json', 'data/brands/brands_master.json'],
              },
              productions: {
                status: 'PASS',
                refs: [productionReport],
              },
            },
            modules: {
              fagverk: {
                status: 'PASS',
                refs: ['data/fagverk/fagverk_registry.json'],
              },
              quiz: {
                status: 'PASS',
                refs: ['data/quiz/naeringsliv/norges_bank_bankplassen_4_sets.json'],
              },
              chronology: {
                status: 'PASS',
                refs: ['data/places/production/norges_bank_bankplassen_4.json'],
              },
              reading_tracks: {
                status: 'PASS',
                refs: ['data/lesespor/oslo/lesespor_oslo_naeringsliv.json'],
              },
              language: {
                status: 'PASS',
                refs: ['data/leksikon/sprak/places/europe/norway/oslo/norges_bank_bankplassen_4.json'],
              },
              stories: {
                status: 'PASS',
                reason: 'The documented Christiania Theater historical layer is reused without creating a duplicate place or story.',
                refs: [placeFile, sourceReview],
              },
              runtime: {
                status: 'PASS',
                refs: ['data/runtime/place-open/norges_bank_bankplassen_4.json'],
              },
              news: {
                status: 'BEGRUNNET_NA',
                reason: 'The 2026 management source is used only to bound current status; it does not justify an artificial news module.',
              },
              before_after: {
                status: 'BEGRUNNET_NA',
                reason: 'No licensed historical/current image pair with sufficiently documented viewpoint and subject match was established for an honest before/after comparison.',
              },
            },
            blockers: [],
            manual_reviews: {
              images: {
                status: 'PASS',
                evidence: 'PR #5945 static image review plus exact Git blob identity gate in the V3 repair materializer.',
              },
              final_ui: {
                status: 'PENDING',
                evidence: 'Interactive PlaceCard and popup screenshot QA will be recorded on the repaired exact head.',
              },
            },
            state: 'in_progress',
          };
          fs.mkdirSync('data/places/workflow', { recursive: true });
          fs.writeFileSync(`data/places/workflow/${placeId}.json`, JSON.stringify(record, null, 2) + '\n');
          NODE

          # Regenerate builder-owned outputs from this fresh base.
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target "$PLACE_ID" --output data/quiz/production_context/naeringsliv/norges_bank_bankplassen_4.json
          node scripts/build-fagverk-release-manifest.mjs
          node --experimental-strip-types scripts/build-civication-history-people-index.mts
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --write
          node scripts/build-place-open-payloads.mjs
          node scripts/build-epoke-place-index.mjs

          # Keep the explicit epoch aggregate contract aligned with the regenerated source-backed index.
          node <<'NODE'
          const fs = require('fs');
          const index = JSON.parse(fs.readFileSync('data/epoker/epoke-place-index.json', 'utf8'));
          const actual = index.stats.verified_place_production_milestone_count;
          const p = 'tests/epoke-place-index.test.mjs';
          let source = fs.readFileSync(p, 'utf8');
          const re = /assert\.equal\(index\.stats\.verified_place_production_milestone_count, \d+\);/;
          if (!re.test(source)) throw new Error('verified production milestone assertion not found');
          source = source.replace(re, `assert.equal(index.stats.verified_place_production_milestone_count, ${actual});`);
          fs.writeFileSync(p, source);
          console.log(`verified_place_production_milestone_count=${actual}`);
          NODE

          node scripts/audit-place-images.mjs --mode=all --report=reports/place-image-audit.json
          node <<'NODE'
          const fs = require('fs');
          const p = 'data/places/place_image_backlog_summary.json';
          const summary = JSON.parse(fs.readFileSync(p, 'utf8'));
          const report = JSON.parse(fs.readFileSync('reports/place-image-audit.json', 'utf8'));
          summary.totalPlaces = report.totalPlaces;
          summary.summary.validLocal = report.summary.local;
          summary.summary.validRemote = report.summary.remote;
          summary.summary.optionalMissing = report.summary.optional;
          summary.summary.missing = report.summary.missing;
          summary.summary.invalidLocalPath = report.summary.invalid;
          summary.summary.remaining = report.summary.missing + report.summary.invalid;
          const category = report.byCategory.naeringsliv;
          summary.byCategory.naeringsliv = {
            total: category.total,
            valid: category.local + category.remote,
            optional: category.optional,
            missing: category.missing,
            invalid: category.invalid,
          };
          fs.writeFileSync(p, JSON.stringify(summary, null, 2) + '\n');
          NODE
          node scripts/audit-quiz-manifest-v2.mjs

          npm run place:build -- "$PLACE_ID"

          # Fresh checks that do not require the still-pending final UI attestation.
          node --test --test-name-pattern='registered in Place Production v3 routing' tests/norges-bank-bankplassen-4-place-production-v3.test.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node --experimental-strip-types scripts/build-civication-history-people-index.mts --check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node scripts/build-place-open-payloads.mjs --check
          node scripts/build-epoke-place-index.mjs --check
          node --test tests/epoke-place-index.test.mjs
          node --experimental-strip-types scripts/knowledge-canonical-data.mts --check
          node scripts/audit-quiz-manifest-v2.mjs
          tmp="$(mktemp)"
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target "$PLACE_ID" --output "$tmp" >/dev/null
          cmp -s "$tmp" data/quiz/production_context/naeringsliv/norges_bank_bankplassen_4.json
          rm -f "$tmp"
          node scripts/audit-quiz-production-context.mjs
          node scripts/audit-place-images.mjs --mode=all --report=reports/place-image-audit.json --verify-summary=data/places/place_image_backlog_summary.json
          node scripts/build-place-production-v3-projections.mjs "$PLACE_ID" --check
          bash scripts/check-places.sh
          npm run place:plan -- "$PLACE_ID"

          # Exact binary identity from the already-verified #5945 assets.
          test "$(git hash-object -- 'bilder/QuizCards/Norges Bank – Bankplassen 4.webp')" = b698e176eebbecb974b15f04339f29adf121bb23
          test "$(git hash-object -- bilder/kort/brands/norges_bank.webp)" = 6e4a99a6b277ad68a49f764ebad27c847cc63b8d
          test "$(git hash-object -- bilder/kort/objects/norges_bank_bankplassen_4_arbeid_og_fred.webp)" = 34de01ea31c4eb256c2b6d0bce467e325cf892ca
          test "$(git hash-object -- bilder/kort/people/karl_gether_bomhoff.webp)" = 4c3cdfb9f41ed6dc7b8517193fc08fc9bf2b92bf
          test "$(git hash-object -- bilder/kort/productions/norges_bank_bankplassen_4_seddeltrykking.webp)" = da16f419b4cc38aa752823bde2c57aba5562e096
          test "$(git hash-object -- bilder/places/norges_bank_bankplassen_4.webp)" = ac97f0f286514defa7bdc0b2e3889e6bb3b5c81f
          test "$(git hash-object -- bilder/places/norges_bank_bankplassen_4_front_portrait.webp)" = 30152b9e7e6b332dbe067177f2f611b03c124b71

          rm -f reports/knowledge-contract-audit.json
          rm -f .github/workflows/tmp-bankplassen-v3-red.yml
          rm -f .github/workflows/tmp-bankplassen-v3-materialize.yml

          git add -A
          git diff --cached --check
          git config user.name 'Bankplassen V3 Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'repair: migrate Bankplassen 4 to Place Production v3'
          git push origin HEAD:repair/bankplassen-4-v3-20260916
