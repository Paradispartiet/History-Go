name: TEMP Juss reconciliation field 1 source-first

on:
  push:
    branches:
      - agent/fagverk-juss-rettsvitenskap-reconciliation-field-1-source-first-20260831

permissions:
  contents: write

concurrency:
  group: tmp-juss-reconciliation-field1-source-first
  cancel-in-progress: false

jobs:
  materialize:
    if: startsWith(github.event.head_commit.message, 'Run fail-closed Juss reconciliation field 1 source-first')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/fagverk-juss-rettsvitenskap-reconciliation-field-1-source-first-20260831
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Patch generator mechanics only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/tmp-materialize-juss-reconciliation-field1-source-first.mjs')
          lines = p.read_text().splitlines()

          test_matches = [i for i, line in enumerate(lines) if line.startswith("writeText('tests/fagverk-domain-ci-registry.test.mjs'")]
          if len(test_matches) != 1:
              raise SystemExit(f'Expected exactly one generated registry-test line, got {test_matches}')
          lines[test_matches[0]] = '''writeText('tests/fagverk-domain-ci-registry.test.mjs', readText('tests/fagverk-domain-ci-registry.test.mjs') + '\\ntest("shared domain workflow triggers on every Juss & rettsvitenskap surface routed by the registry", () => {\\n  const workflow = readFileSync(".github/workflows/fagverk-domain-registry.yml", "utf8");\\n  for (const pathPattern of [\\n    "data/fag/politikk/juss_rettsvitenskap/**",\\n    "data/fagverk/politikk/juss_rettsvitenskap/**",\\n    "reports/fagverk/juss-rettsvitenskap-*.json",\\n    "scripts/*juss-rettsvitenskap*",\\n    "tests/juss-rettsvitenskap-*.test.mjs",\\n    ".github/ci/fagverk-juss-rettsvitenskap-domain-registry-v1.json",\\n  ]) {\\n    assert.equal(workflow.includes(pathPattern), true, "workflow mangler Juss-trigger " + pathPattern);\\n  }\\n});\\n');'''

          workflow_matches = [i for i, line in enumerate(lines) if line.startswith("replaceOnce('.github/workflows/fagverk-domain-registry.yml'")]
          if len(workflow_matches) != 6:
              raise SystemExit(f'Expected exactly six workflow replace lines, got {workflow_matches}')
          for i in workflow_matches:
              lines[i] = "void readText('.github/workflows/fagverk-domain-registry.yml');"

          p.write_text('\n'.join(lines) + '\n')
          PY
          node --check scripts/tmp-materialize-juss-reconciliation-field1-source-first.mjs

      - name: Generate Juss reconciliation and field 1 source-first candidate
        run: node scripts/tmp-materialize-juss-reconciliation-field1-source-first.mjs

      - name: Syntax-check new Juss gates and shared router
        run: |
          node --check scripts/brief-juss-rettsvitenskap-legal-method-sources-interpretation-argumentation-sources-v1.mjs
          node --check scripts/audit-juss-rettsvitenskap-reconciliation-v1.mjs
          node --check scripts/run-fagverk-domain-ci-v1.mjs
          node --check tests/fagverk-domain-ci-registry.test.mjs

      - name: Verify isolated Juss source-first and reconciliation gates
        run: |
          node scripts/brief-juss-rettsvitenskap-legal-method-sources-interpretation-argumentation-sources-v1.mjs
          node --test tests/juss-rettsvitenskap-legal-method-sources-interpretation-argumentation-source-brief-v1.test.mjs
          node scripts/audit-juss-rettsvitenskap-reconciliation-v1.mjs
          node --test tests/juss-rettsvitenskap-reconciliation-v1.test.mjs

      - name: Run registry-driven Juss and shared Fagverk gates
        run: node scripts/run-fagverk-domain-ci-v1.mjs --subject juss_rettsvitenskap

      - name: Verify source-first state stays non-materialized
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const registry=JSON.parse(fs.readFileSync('data/fag/politikk/juss_rettsvitenskap/production_registry_v1.json','utf8'));
          const category=JSON.parse(fs.readFileSync('data/categories/category_contract.json','utf8'));
          const sub=category.canonicalSubcategories.politikk.find(row=>row.id==='juss_rettsvitenskap');
          if(registry.progress.materializedDomains!==0||registry.progress.strictCompletionProven!==false||registry.materialized.length!==0) throw new Error('Juss source-first accidentally materialized a field');
          if(sub?.status!=='expansion_planned') throw new Error('Juss category status changed before fulltext');
          NODE
          git diff --check

      - name: Remove TEMP generator only
        run: |
          rm scripts/tmp-materialize-juss-reconciliation-field1-source-first.mjs
          test ! -e scripts/tmp-materialize-juss-reconciliation-field1-source-first.mjs
          test -e .github/workflows/tmp-juss-reconciliation-field1-source-first.yml

      - name: Commit permanent source-first state only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No permanent Juss changes generated' >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing workflow-file mutation from Actions token' >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          git commit -m 'Establish Juss reconciliation and field 1 source-first'
          git push origin HEAD:agent/fagverk-juss-rettsvitenskap-reconciliation-field-1-source-first-20260831
