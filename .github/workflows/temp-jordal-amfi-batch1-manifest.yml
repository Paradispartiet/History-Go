name: Temporary Jordal Amfi batch 1 manifest

on:
  push:
    branches:
      - data/people-jordal-amfi-batch1-20260714

permissions:
  contents: write

jobs:
  update-manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: data/people-jordal-amfi-batch1-20260714
          fetch-depth: 0

      - name: Insert people manifest entries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/people/manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          files = data['files']
          anchor = 'people/sport/oslo/intility_arena/odin_thiago_holm.json'
          additions = [
              'people/sport/oslo/jordal_amfi/valerenga_ishockey.json',
              'people/sport/oslo/jordal_amfi/steinar_bjolbakk.json',
              'people/sport/oslo/jordal_amfi/jim_marthinsen.json',
              'people/sport/oslo/jordal_amfi/geir_myhre.json',
              'people/sport/oslo/jordal_amfi/arne_billkvam.json',
          ]

          insert_at = files.index(anchor) + 1
          for item in additions:
              if item not in files:
                  files.insert(insert_at, item)
                  insert_at += 1

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit manifest update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/people/manifest.json
          if git diff --cached --quiet; then
            echo 'Manifest already up to date.'
            exit 0
          fi
          git commit -m 'Register Jordal Amfi batch 1 people'
          git push origin HEAD:data/people-jordal-amfi-batch1-20260714
