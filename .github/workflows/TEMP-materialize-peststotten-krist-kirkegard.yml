name: TEMP materialize Peststøtten Krist kirkegård

on:
  push:
    branches:
      - agent/peststotten-krist-kirkegard-production-20260910
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/peststotten-krist-kirkegard-production-20260910
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize complete Peststøtten place
        run: |
          node tools/finalize-peststotten-krist-kirkegard-completion.mjs
          node tools/finalize-peststotten-krist-kirkegard-post.mjs

      - name: Targeted completion regression
        run: node --test tests/peststotten-krist-kirkegard-completion.test.mjs

      - name: Place production validators
        run: |
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/audit-historie-place-production.mjs --all
          npm run place-open:check
          npm run epoker:places:check
          node scripts/run-place-regressions-v1.mjs

      - name: Repository checks
        run: |
          npm run tools:check
          npm run typecheck
          git diff --check

      - name: Commit generated production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Complete Peststøtten Krist kirkegård production"
          git push origin HEAD:agent/peststotten-krist-kirkegard-production-20260910
