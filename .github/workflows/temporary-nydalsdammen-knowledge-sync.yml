name: Temporary Nydalsdammen Knowledge sync
on:
  push:
    branches:
      - content/nydalsdammen-source-only-3x7-20261021
    paths:
      - .github/workflows/temporary-nydalsdammen-knowledge-sync.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/nydalsdammen-source-only-3x7-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Synchronize canonical Knowledge data
        run: |
          npm ci --no-audit --no-fund
          npm run knowledge:canonical:write
      - name: Commit only Knowledge outputs
        shell: bash
        run: |
          git add -- data/quiz/natur/nydalsdammen_sets.json data/knowledge/knowledge_units.generated.json data/knowledge/knowledge_emne_review_queue.generated.json reports/knowledge-id-backfill.json
          if git diff --cached --quiet; then
            echo 'Canonical Knowledge data already in sync'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(knowledge): update Nydalsdammen sourced quiz contract'
          git push origin HEAD:refs/heads/content/nydalsdammen-source-only-3x7-20261021
