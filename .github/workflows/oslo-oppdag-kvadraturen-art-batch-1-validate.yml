name: Oslo Oppdag Kvadraturen art batch 1 validate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-oppdag-kvadraturen-art-batch-1-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Validate art microplace integration
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-batch-1/validation'
          mkdir -p "$outdir"

          node <<'NODE' | tee "$outdir/wonderkammer-validation.txt"
          const fs = require('fs');

          const batchPath = 'data/wonderkammer/oslo_oppdag_kvadraturen_art_microplaces_batch_1.json';
          const indexPath = 'data/wonderkammer/index.json';
          const placesPath = 'data/places/places_index.json';

          const readJson = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const batch = readJson(batchPath);
          const index = readJson(indexPath);
          const places = readJson(placesPath);

          if (!Array.isArray(batch.places)) throw new Error('Batch must contain places[]');
          if (!index.files.includes(batchPath)) throw new Error('Batch file is not registered in Wonderkammer index');

          const placeIds = new Set(places.map((place) => place.id));
          const missingParents = [...new Set(batch.places.map((entry) => entry.place_id).filter((id) => !placeIds.has(id)))];
          if (missingParents.length) throw new Error(`Missing parent place IDs: ${missingParents.join(', ')}`);

          const newIds = [];
          for (const entry of batch.places) {
            if (!entry.place_id || !Array.isArray(entry.chambers)) throw new Error(`Invalid place entry for ${entry.place_id || '<missing>'}`);
            for (const chamber of entry.chambers) {
              if (!chamber.id) throw new Error(`Missing chamber ID under ${entry.place_id}`);
              if (chamber.treasureScope !== 'actual_site_treasure') throw new Error(`Unexpected treasureScope for ${chamber.id}`);
              newIds.push(chamber.id);
            }
          }

          const newIdSet = new Set(newIds);
          if (newIdSet.size !== newIds.length) throw new Error('Duplicate chamber IDs inside new batch');
          if (newIds.length !== 12) throw new Error(`Expected 12 new chambers, found ${newIds.length}`);

          // The batch gate owns collisions introduced by this batch. Existing duplicate
          // backlog elsewhere in Wonderkammer is not a reason to block unrelated new data.
          const existingIds = new Map();
          const collectChambers = (value, sourceFile) => {
            if (!value || typeof value !== 'object') return;
            if (Array.isArray(value)) {
              for (const item of value) collectChambers(item, sourceFile);
              return;
            }
            if (Array.isArray(value.chambers)) {
              for (const chamber of value.chambers) {
                if (!chamber || !chamber.id) continue;
                if (!existingIds.has(chamber.id)) existingIds.set(chamber.id, sourceFile);
              }
            }
            for (const child of Object.values(value)) collectChambers(child, sourceFile);
          };

          for (const file of index.files) {
            if (!fs.existsSync(file)) throw new Error(`Registered Wonderkammer file missing: ${file}`);
            if (file === batchPath) continue;
            collectChambers(readJson(file), file);
          }

          const collisions = newIds
            .filter((id) => existingIds.has(id))
            .map((id) => `${id}: ${existingIds.get(id)}`);
          if (collisions.length) throw new Error(`New chamber IDs collide with registered Wonderkammer data:\n${collisions.join('\n')}`);

          console.log(`Wonderkammer manifest registration: OK (${batchPath})`);
          console.log(`Parent place IDs: OK (${batch.places.length} parent entries)`);
          console.log(`New chamber IDs: OK (${newIds.length} unique)`);
          console.log('New-vs-existing chamber ID collisions: 0');
          NODE

      - name: Validate JSON and whitespace
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-batch-1/validation'
          jq empty data/wonderkammer/oslo_oppdag_kvadraturen_art_microplaces_batch_1.json
          jq empty data/wonderkammer/index.json
          echo 'JSON syntax: OK' | tee "$outdir/json-syntax.txt"
          git diff --check | tee "$outdir/git-diff-check.txt"

      - name: Remove temporary workflow and save validation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/oslo-oppdag-kvadraturen-art-batch-1-validate.yml
          git add reports/oslo-oppdag-kvadraturen-art-batch-1/validation
          git add -u .github/workflows/oslo-oppdag-kvadraturen-art-batch-1-validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Validate Oppdag Kvadraturen art microplaces batch 1'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
