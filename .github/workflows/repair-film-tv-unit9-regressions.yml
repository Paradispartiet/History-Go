name: Repair Film TV unit 9 regression contracts

on:
  push:
    branches:
      - agent/film-tv-unit9-fulltext-final
    paths:
      - ".github/workflows/repair-film-tv-unit9-regressions.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-tv-unit9-fulltext-final
          fetch-depth: 0
      - name: Replace obsolete unit 7 regression atomically
        run: |
          cp \
            tests/film-tv-representation-position-counterimages-monotone-regression-v2.test.mjs \
            tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs
          rm tests/film-tv-representation-position-counterimages-monotone-regression-v2.test.mjs
          rm .github/workflows/repair-film-tv-unit9-regressions.yml
      - name: Persist repaired regression contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make unit 7 Film TV regression monotone'
          git push origin HEAD:agent/film-tv-unit9-fulltext-final
