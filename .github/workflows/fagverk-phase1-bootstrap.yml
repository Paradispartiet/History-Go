name: Materialize Fagverk Phase 1

on:
  pull_request:
    paths:
      - 'scripts/fagverk-phase1-bootstrap.mjs'
      - '.github/workflows/fagverk-phase1-bootstrap.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize general subject engine
        run: node scripts/fagverk-phase1-bootstrap.mjs
      - name: Commit materialized Phase 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bygg generell manifest-first fagsidemotor"
          git push origin "HEAD:${{ github.head_ref }}"
