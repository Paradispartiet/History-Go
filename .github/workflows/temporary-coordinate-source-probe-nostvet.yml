name: Temporary Nøstvet coordinate source probe

on:
  push:
    branches:
      - agent/akershus-nostvet-boplass-production

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/akershus-nostvet-boplass-production
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize coordinate sources
        shell: bash
        run: |
          set -euo pipefail
          OUT='reports/akershus-coordinate-nostvet-source-probe'
          mkdir -p "$OUT"
          UA='History-Go coordinate research (Paradispartiet/History-Go)'
          WFS='https://wfs.geonorge.no/skwms1/wfs.kulturminner'

          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get "$WFS" \
            --data 'service=WFS' --data 'request=GetCapabilities' \
            | tee "$OUT/riksantikvaren-wfs-capabilities.xml" >/dev/null

          python - <<'PY' | tee "$OUT/riksantikvaren-wfs-typenames.txt" >/dev/null
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path('reports/akershus-coordinate-nostvet-source-probe/riksantikvaren-wfs-capabilities.xml')
          root = ET.parse(path).getroot()
          names = []
          for elem in root.iter():
              if elem.tag.rsplit('}', 1)[-1] != 'FeatureType':
                  continue
              for child in elem:
                  if child.tag.rsplit('}', 1)[-1] == 'Name' and child.text:
                      names.append(child.text.strip())
                      break
          selected = [name for name in names if any(token in name.lower() for token in ('lokalitet', 'enkeltminne', 'sikringssone'))]
          for name in selected:
              print(name)
          PY

          while IFS= read -r TYPE; do
            [ -n "$TYPE" ] || continue
            SAFE=$(printf '%s' "$TYPE" | tr ':/' '__')
            curl --fail --silent --show-error --location --user-agent "$UA" \
              --get "$WFS" \
              --data 'service=WFS' --data 'version=2.0.0' --data 'request=GetFeature' \
              --data-urlencode "typeNames=$TYPE" \
              --data-urlencode 'bbox=10.790,59.744,10.810,59.758,EPSG:4326' \
              --data-urlencode 'srsName=EPSG:4326' \
              --data-urlencode 'outputFormat=application/json' \
              --data 'count=1000' \
              | tee "$OUT/wfs-${SAFE}.json" >/dev/null
          done < "$OUT/riksantikvaren-wfs-typenames.txt"

          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'q=Nøstvedtfunnet, Ås, Norge' \
            --data 'format=jsonv2' --data 'polygon_geojson=1' --data 'extratags=1' \
            --data 'namedetails=1' --data 'limit=20' \
            | tee "$OUT/nominatim-nostvedtfunnet.json" >/dev/null

          sleep 1
          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'q=Tussebohuken, Ås, Norge' \
            --data 'format=jsonv2' --data 'polygon_geojson=1' --data 'extratags=1' \
            --data 'namedetails=1' --data 'limit=20' \
            | tee "$OUT/nominatim-tussebohuken.json" >/dev/null

          curl --fail --silent --show-error --location --user-agent "$UA" \
            'https://api.openstreetmap.org/api/0.6/map?bbox=10.790,59.744,10.810,59.758' \
            | tee "$OUT/osm-nostvet-sjoskogen-bbox.xml" >/dev/null

          python - <<'PY' | tee "$OUT/source-summary.txt" >/dev/null
          import json
          import math
          import unicodedata
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path('reports/akershus-coordinate-nostvet-source-probe')
          legacy = (59.75109, 10.7996)

          def distance_m(a, b):
              lat1, lon1 = map(math.radians, a)
              lat2, lon2 = map(math.radians, b)
              dlat = lat2 - lat1
              dlon = lon2 - lon1
              h = math.sin(dlat / 2) ** 2 + math.cos(lat1) * math.cos(lat2) * math.sin(dlon / 2) ** 2
              return 6371000 * 2 * math.asin(math.sqrt(h))

          def norm(value):
              text = unicodedata.normalize('NFKD', str(value)).encode('ascii', 'ignore').decode().lower()
              return text

          def flatten_pairs(coords):
              if not isinstance(coords, list):
                  return []
              if len(coords) >= 2 and all(isinstance(v, (int, float)) for v in coords[:2]):
                  return [(float(coords[0]), float(coords[1]))]
              pairs = []
              for item in coords:
                  pairs.extend(flatten_pairs(item))
              return pairs

          def ring_centroid(ring):
              if len(ring) < 4:
                  return None
              pts = ring
              if pts[0] != pts[-1]:
                  pts = pts + [pts[0]]
              twice_area = 0.0
              cx = 0.0
              cy = 0.0
              for (x1, y1), (x2, y2) in zip(pts, pts[1:]):
                  cross = x1 * y2 - x2 * y1
                  twice_area += cross
                  cx += (x1 + x2) * cross
                  cy += (y1 + y2) * cross
              if abs(twice_area) < 1e-15:
                  return None
              return (cx / (3 * twice_area), cy / (3 * twice_area))

          def geometry_point(geometry):
              if not geometry:
                  return None
              kind = geometry.get('type')
              coords = geometry.get('coordinates')
              if kind == 'Point' and isinstance(coords, list) and len(coords) >= 2:
                  return (float(coords[0]), float(coords[1]))
              if kind == 'Polygon' and coords and coords[0]:
                  point = ring_centroid([(float(x), float(y)) for x, y, *_ in coords[0]])
                  if point:
                      return point
              if kind == 'MultiPolygon' and coords and coords[0] and coords[0][0]:
                  point = ring_centroid([(float(x), float(y)) for x, y, *_ in coords[0][0]])
                  if point:
                      return point
              pairs = flatten_pairs(coords)
              if not pairs:
                  return None
              return (sum(x for x, _ in pairs) / len(pairs), sum(y for _, y in pairs) / len(pairs))

          print(f'legacy_lat={legacy[0]:.12f}')
          print(f'legacy_lon={legacy[1]:.12f}')

          keywords = ('nost', 'sjoskog', 'tussebo', 'boplass', 'steinalder', 'funn')
          for path in sorted(out.glob('wfs-*.json')):
              try:
                  data = json.loads(path.read_text())
              except Exception as exc:
                  print(f'WFS_FILE {path.name} parse_error={exc}')
                  continue
              features = data.get('features', []) if isinstance(data, dict) else []
              print(f'WFS_FILE {path.name} feature_count={len(features)}')
              rows = []
              for feature in features:
                  props = feature.get('properties') or {}
                  joined = ' '.join(f'{key}={value}' for key, value in props.items() if value is not None)
                  point = geometry_point(feature.get('geometry'))
                  if not point:
                      continue
                  lon, lat = point
                  row = {
                      'feature_id': feature.get('id'),
                      'lat': lat,
                      'lon': lon,
                      'distance_from_legacy_m': round(distance_m(legacy, (lat, lon)), 1),
                      'geometry_type': (feature.get('geometry') or {}).get('type'),
                      'properties': props,
                  }
                  rows.append(row)
                  if any(keyword in norm(joined) for keyword in keywords):
                      print('WFS_MATCH ' + json.dumps(row, ensure_ascii=False, sort_keys=True))
              rows.sort(key=lambda row: row['distance_from_legacy_m'])
              print('WFS_NEAREST ' + json.dumps(rows[:25], ensure_ascii=False, sort_keys=True))

          for filename in ('nominatim-nostvedtfunnet.json', 'nominatim-tussebohuken.json'):
              data = json.loads((out / filename).read_text())
              print(f'NOMINATIM_FILE {filename} results={len(data)}')
              for row in data:
                  point = (float(row['lat']), float(row['lon']))
                  print('NOMINATIM ' + json.dumps({
                      'name': row.get('name'),
                      'display_name': row.get('display_name'),
                      'category': row.get('category'),
                      'type': row.get('type'),
                      'osm_type': row.get('osm_type'),
                      'osm_id': row.get('osm_id'),
                      'lat': point[0],
                      'lon': point[1],
                      'distance_from_legacy_m': round(distance_m(legacy, point), 1),
                      'extratags': row.get('extratags', {}),
                  }, ensure_ascii=False, sort_keys=True))

          root = ET.parse(out / 'osm-nostvet-sjoskogen-bbox.xml').getroot()
          nodes = {
              node.attrib['id']: (float(node.attrib['lat']), float(node.attrib['lon']))
              for node in root.findall('node')
          }

          def tags(element):
              return {tag.attrib['k']: tag.attrib['v'] for tag in element.findall('tag')}

          relevant = []
          for node in root.findall('node'):
              t = tags(node)
              if not t:
                  continue
              text = ' '.join(t.values())
              if t.get('name') or any(k in t for k in ('historic', 'tourism', 'archaeological_site', 'information')) or any(k in norm(text) for k in keywords):
                  point = nodes[node.attrib['id']]
                  relevant.append({
                      'type': 'node', 'id': node.attrib['id'], 'lat': point[0], 'lon': point[1],
                      'distance_from_legacy_m': round(distance_m(legacy, point), 1), 'tags': t,
                  })

          relevant.sort(key=lambda row: row['distance_from_legacy_m'])
          print('OSM_RELEVANT=' + json.dumps(relevant[:80], ensure_ascii=False, sort_keys=True))
          PY

          rm -f .github/workflows/temporary-coordinate-source-probe-nostvet.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT" .github/workflows/temporary-coordinate-source-probe-nostvet.yml
          if git diff --cached --quiet; then
            echo 'No source-probe changes.'
          else
            git commit -m 'Materialize Nøstvet archaeological coordinate sources'
            git push origin HEAD:agent/akershus-nostvet-boplass-production
          fi
