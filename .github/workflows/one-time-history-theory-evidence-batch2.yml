name: One-time History theory evidence batch 2

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/history-theory-evidence-batch2-trigger.txt'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/history-theory-evidence-batch2-prod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Refine distinct industrial-city evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          file = Path('tools/materialize-historie-theory-evidence-batch2.mjs')
          text = file.read_text()
          old_claims = """      'claim_his_akerselva_industrial_energy_axis',
                'claim_his_akerselva_environmental_reuse_from_1986',
                'claim_his_folkets_hus_first_opened_1907',
                'claim_his_folkets_hus_current_complex_1958_1962',"""
          new_claims = """      'claim_his_akerselva_industrial_energy_axis',
                'claim_his_akerselva_environmental_reuse_from_1986',
                'claim_his_folkets_hus_first_opened_1907',
                'claim_his_folkets_hus_current_complex_1958_1962',
                'claim_his_oslo_radhus_pipervika_transformation',"""
          old_rationale = "Akerselva dokumenterer hvordan vannkraft, fabrikker og verksteder formet Christianias industriby, mens Folkets Hus dokumenterer arbeiderbevegelsens organisatoriske infrastruktur. Miljøpark og ombruk viser hvordan industrilandskapet senere ble omformet, slik at produksjon, arbeidsorganisering og etterindustriell byutvikling kan analyseres samlet."
          new_rationale = "Akerselva dokumenterer hvordan vannkraft, fabrikker og verksteder formet Christianias industriby, mens Folkets Hus dokumenterer arbeiderbevegelsens organisatoriske infrastruktur. Pipervika-saneringen og senere miljøpark og ombruk viser hvordan produksjons- og hverdagsmiljøer ble fysisk omformet, slik at industri, arbeiderorganisering og byutvikling kan analyseres samlet."
          if old_claims not in text:
              raise SystemExit('Expected industriby claim bundle not found')
          if old_rationale not in text:
              raise SystemExit('Expected industriby rationale not found')
          file.write_text(text.replace(old_claims, new_claims, 1).replace(old_rationale, new_rationale, 1))
          PY

      - name: Materialize batch 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/historie-theory-evidence/batch-2-validation
          node --check tools/materialize-historie-theory-evidence-batch2.mjs 2>&1 \
            | tee reports/historie-theory-evidence/batch-2-validation/materializer-syntax.log
          node tools/materialize-historie-theory-evidence-batch2.mjs 2>&1 \
            | tee reports/historie-theory-evidence/batch-2-validation/materializer.log

      - name: Validate theory evidence and regenerate reports
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/validate-historie-theory-evidence.mjs 2>&1 \
            | tee reports/historie-theory-evidence/batch-2-validation/validator-syntax.log
          node tools/validate-historie-theory-evidence.mjs 2>&1 \
            | tee reports/historie-theory-evidence/batch-2-validation/validator.log
          node tools/validate-historie-theory-evidence.mjs --check 2>&1 \
            | tee reports/historie-theory-evidence/batch-2-validation/validator-check.log
          node tools/audit-historie-universal-coverage.mjs 2>&1 \
            | tee reports/historie-theory-evidence/batch-2-validation/universal-coverage.log
          node tools/audit-historie-universal-coverage.mjs --check 2>&1 \
            | tee reports/historie-theory-evidence/batch-2-validation/universal-coverage-check.log

      - name: Upload batch 2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-theory-evidence-batch2-diagnostics
          path: |
            reports/historie-theory-evidence/batch-2-validation
            reports/historie-theory-evidence/history-theory-evidence-foundation-v1.json
            reports/historie-theory-evidence/history-theory-evidence-foundation-v1.md
          if-no-files-found: error

      - name: Verify frozen V5.8 base
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-historie-v5-5-quality-depth.mjs 2>&1 \
            | tee reports/historie-theory-evidence/batch-2-validation/quality-freeze.log
          git restore -- reports/historie-v5/historie-v5-8-quality-depth.json reports/historie-v5/historie-v5-8-quality-depth.md 2>/dev/null || true

      - name: Remove one-time transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/materialize-historie-theory-evidence-batch2.mjs
          rm -f .github/workflows/one-time-history-theory-evidence-batch2.yml
          rm -f .github/history-theory-evidence-batch2-trigger.txt

      - name: Commit clean production diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check 2>&1 \
            | tee reports/historie-theory-evidence/batch-2-validation/git-diff-check.log
          git status --short \
            | tee reports/historie-theory-evidence/batch-2-validation/git-status.log
          git add -A
          git add -f reports/historie-theory-evidence/batch-2-validation
          git commit -m "Expand History theory evidence batch 2"
          git push origin HEAD:agent/history-theory-evidence-batch2-prod
