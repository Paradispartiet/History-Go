name: Generate Gamle Aker portrait once
on:
  push:
    branches:
      - agent/gamle-aker-portrait-v1-20261021
    paths:
      - '.github/workflows/gamle-aker-portrait-once.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gamle-aker-portrait-v1-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependency
        run: npm ci --no-audit --no-fund
      - name: Rasterize local documentary photo
        run: node scripts/build-gamle-aker-portrait.mjs
      - name: Commit raster asset and remove one-off runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/places/gamle_aker_kirke_front_portrait.webp reports/place-production/gamle-aker-kirke-v1-portrait-photo.json
          git rm .github/workflows/gamle-aker-portrait-once.yml
          git diff --cached --check
          git commit -m "Add physical licensed Gamle Aker portrait WebP"
          git push origin HEAD:agent/gamle-aker-portrait-v1-20261021
