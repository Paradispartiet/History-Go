name: TEMP sync Fagverk subject baseline

on:
  push:
    branches:
      - agent/fagverk-theory-integrity-audit
    paths:
      - '.github/workflows/temp-fagverk-subject-baseline-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fagverk-theory-integrity-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate owned baseline and self-clean
        run: |
          set -euo pipefail
          node scripts/audit-fagverk-subject-inventory.mjs --write-report
          git rm .github/workflows/temp-fagverk-subject-baseline-sync.yml
          git add reports/fagverk/subject-baseline.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Fagverk subject baseline report"
          git push origin HEAD:agent/fagverk-theory-integrity-audit
