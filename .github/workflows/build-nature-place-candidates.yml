name: Nature data validation and candidates

on:
  workflow_dispatch:
    inputs:
      commit_output:
        description: "Commit data/natur/nature_place_map_candidates.json back to the repo when output is valid"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - "tools/build_nature_place_candidates*.mts"
      - "tools/validate_nature_maps.mts"
      - "data/places/natur/**"
      - "data/natur/**"
      - "!data/natur/nature_place_map_candidates.json"
      - ".github/workflows/build-nature-place-candidates.yml"
permissions:
  contents: read

concurrency:
  group: nature-place-candidates-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NATURE_CANDIDATES_FINAL: data/natur/nature_place_map_candidates.json
  NATURE_CANDIDATES_TMP: data/natur/.tmp_nature_place_map_candidates.json

jobs:
  validate:
    name: Validate maps and build Artskart candidates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check scripts
        run: |
          npm ci
          npm run build:tools
          node --check dist/tools/validate_nature_maps.mjs
          node --check dist/tools/build_nature_place_candidates_v2.mjs

      - name: Validate active nature maps
        run: node dist/tools/validate_nature_maps.mjs

      - name: Build candidates from Artskart into temp file
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node dist/tools/build_nature_place_candidates_v2.mjs --out="$NATURE_CANDIDATES_TMP" --retries=4 --retry-base-delay-ms=1500

      - name: Print temp candidate summary
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = process.env.NATURE_CANDIDATES_TMP;
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          const counts = data.meta?.counts || {};
          const places = data.places || {};
          const values = Object.values(places);
          const checked = Object.keys(places).length;
          const errors = values.filter(x => x?.status === 'error').length;
          const candidateFromArtskart = values.filter(x => x?.status === 'candidate_from_artskart').length;
          const withFlora = values.filter(x => Array.isArray(x.flora) && x.flora.length).length;
          const withFauna = values.filter(x => Array.isArray(x.fauna) && x.fauna.length).length;
          const withExternal = values.filter(x => Array.isArray(x.externalTaxa) && x.externalTaxa.length).length;
          console.log(JSON.stringify({ counts, checked, errors, candidateFromArtskart, withFlora, withFauna, withExternal }, null, 2));
          NODE

      - name: Validate temp candidate output
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = process.env.NATURE_CANDIDATES_TMP;
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          const places = data.places || {};
          const values = Object.values(places);
          const errors = values.filter(x => x?.status === 'error');
          const candidateFromArtskart = values.filter(x => x?.status === 'candidate_from_artskart').length;

          if (!values.length) {
            throw new Error('Temp candidate file has no places. Refusing to continue.');
          }

          if (errors.length) {
            const sample = errors.slice(0, 10).map(x => `${x.name || 'unknown'}: ${x.error || 'unknown error'}`).join('\n');
            throw new Error(`Temp candidate file contains ${errors.length} error entries. Refusing to replace final output.\n${sample}`);
          }

          if (candidateFromArtskart !== values.length) {
            throw new Error(`Expected all temp places to have status candidate_from_artskart, got ${candidateFromArtskart}/${values.length}.`);
          }

          console.log(`Temp candidate output valid: ${candidateFromArtskart}/${values.length} candidate_from_artskart, 0 errors.`);
          NODE

      - name: Promote temp candidate file
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: cp "$NATURE_CANDIDATES_TMP" "$NATURE_CANDIDATES_FINAL"

      - name: Upload candidate file
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: nature-place-map-candidates
          path: data/natur/nature_place_map_candidates.json
          if-no-files-found: error

  publish:
    name: Publish validated Artskart candidates
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_output == true }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download validated candidate file
        uses: actions/download-artifact@v4
        with:
          name: nature-place-map-candidates
          path: data/natur

      - name: Verify downloaded candidate file
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.env.NATURE_CANDIDATES_FINAL, 'utf8'));
          const values = Object.values(data.places || {});
          const invalid = values.filter((entry) => entry?.status !== 'candidate_from_artskart');

          if (!values.length || invalid.length) {
            throw new Error(`Downloaded artifact is not publishable: ${values.length} places, ${invalid.length} invalid entries.`);
          }
          console.log(`Downloaded artifact is publishable: ${values.length} validated places.`);
          NODE

      - name: Commit candidate file
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$NATURE_CANDIDATES_FINAL"

          if git diff --cached --quiet; then
            echo "No candidate file changes to commit."
            exit 0
          fi

          git commit -m "Update nature place map candidates from Artskart"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}"
            git pull --rebase origin main

            if git push origin HEAD:main; then
              echo "Pushed candidate file to main."
              exit 0
            fi

            echo "Push failed, retrying after refetch."
            sleep 2
          done

          echo "Failed to push after 3 attempts."
          exit 1
