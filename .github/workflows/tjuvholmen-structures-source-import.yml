name: Tjuvholmen Structures - source photo binary import

on:
  pull_request:
    paths:
      - '.github/workflows/tjuvholmen-structures-source-import.yml'
      - 'scripts/import-tjuvholmen-structures-assets.py'
      - 'reports/place-production/tjuvholmen-structures-source-candidates-20261112.json'

permissions:
  contents: read

jobs:
  import-three-source-photos:
    if: ${{ github.event.pull_request.number == 7269 && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact same-repository PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image conversion dependency
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Download three exact Commons source files and generate uncropped WebP
        run: python scripts/import-tjuvholmen-structures-assets.py

      - name: Verify three source photos and output hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image
          root=Path('.')
          path=root/'reports/place-production/tjuvholmen-structures-source-candidates-20261112.json'
          d=json.loads(path.read_text(encoding='utf-8'))
          assert d['status']=='local_source_and_webp_bytes_verified_pending_visual_and_runtime'
          assert len(d['candidates'])==3
          for c in d['candidates']:
              for field,pathkey in [('photo_sha256','source_local_path'),('webp_sha256','planned_asset')]:
                  asset=root/c[pathkey]
                  assert asset.is_file(),asset
                  assert hashlib.sha256(asset.read_bytes()).hexdigest()==c[field],asset
              with Image.open(root/c['planned_asset']) as im:
                  assert im.format=='WEBP'
                  assert list(im.size)==c['webp_dimensions']
              assert 'PENDING_VISUAL_AND_COLLECTION_REVIEW' in c['photo_review_status']
              print('ASSET_PASS', c['id'], c['webp_sha256'])
          PY

      - name: Commit verified binaries and source attribution only to the PR branch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          case "$TARGET_BRANCH" in
            main|master|refs/heads/main|refs/heads/master) echo 'Refusing to push to default branch'; exit 1 ;;
          esac
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            bilder/kort/structures \
            reports/place-production/tjuvholmen-structures-source-candidates-20261112.json
          if git diff --cached --quiet; then
            echo 'No binary changes, nothing to commit'
          else
            git commit -m 'assets(tjuvholmen): three licensed Structures originals and uncropped WebP previews'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
