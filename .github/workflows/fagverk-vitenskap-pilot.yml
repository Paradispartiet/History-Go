      - 'fagverk-forside.html'
      - 'data/categories/category_contract.json'
      - 'data/fag/vitenskap/**'
      - 'data/fag/teknologi/**'
      - 'data/badges/vitenskap.json'
      - 'data/fagverk/vitenskap/**'
      - 'js/fagverk-subject-core.js'
      - 'js/fagverk-subject-model.js'
      - 'js/fagverk.js'
      - 'scripts/audit-fagverk-subject-inventory.mjs'
      - 'scripts/audit-fagverk-general-engine.mjs'
      - 'scripts/audit-fagverk-vitenskap-breadth-reconciliation.mjs'
      - 'scripts/audit-fagverk-vitenskap-pilot.mjs'
      - 'scripts/audit-fagverk-vitenskap-university-readiness.mjs'
      - 'scripts/audit-fagverk-vitenskap-unit1.mjs'
      - 'scripts/audit-fagverk-vitenskap-mathematics-source-brief.mjs'
      - 'scripts/audit-fagverk-vitenskap-mathematics-fulltext.mjs'
      - 'scripts/audit-fagverk-vitenskap-physics-astronomy-source-brief.mjs'
      - 'scripts/audit-fagverk-vitenskap-physics-astronomy-fulltext.mjs'
      - 'scripts/audit-fagverk-vitenskap-chemistry-material-science-source-brief.mjs'
      - 'scripts/audit-fagverk-vitenskap-chemistry-material-science-fulltext.mjs'
      - 'scripts/audit-fagverk-vitenskap-medicine-biomedicine-public-health-source-brief.mjs'
      - 'tools/audit-vitenskap-theory-integrity.mjs'
      - 'scripts/build-fagverk-release-manifest.mjs'
      - 'tests/fagverk-subject-inventory.test.mjs'
      - 'tests/fagverk-general-engine.test.mjs'
      - 'tests/fagverk-vitenskap-breadth-reconciliation.test.mjs'
      - 'tests/fagverk-vitenskap-pilot.test.mjs'
      - 'tests/fagverk-vitenskap-university-readiness.test.mjs'
      - 'tests/fagverk-vitenskap-unit1.test.mjs'
      - 'tests/fagverk-vitenskap-mathematics-source-brief.test.mjs'
      - 'tests/fagverk-vitenskap-mathematics-fulltext.test.mjs'
      - 'tests/fagverk-vitenskap-physics-astronomy-source-brief.test.mjs'
      - 'tests/fagverk-vitenskap-physics-astronomy-fulltext.test.mjs'
      - 'tests/fagverk-vitenskap-chemistry-material-science-source-brief.test.mjs'
      - 'tests/fagverk-vitenskap-chemistry-material-science-fulltext.test.mjs'
      - 'tests/fagverk-vitenskap-medicine-biomedicine-public-health-source-brief.test.mjs'
      - 'tests/vitenskap-theory-integrity.test.mjs'
      - 'tests/fagverk-release-manifest.test.mjs'
      - 'tests/vitenskap-teknologi-category-contract.test.mjs'
      - 'reports/fagverk/**'
      - '.github/workflows/fagverk-vitenskap-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'data/fag/vitenskap/**'
      - 'data/fag/teknologi/**'
      - 'data/badges/vitenskap.json'
      - 'data/fagverk/vitenskap/**'
      - 'scripts/audit-fagverk-vitenskap-breadth-reconciliation.mjs'
      - 'scripts/audit-fagverk-vitenskap-pilot.mjs'
      - 'scripts/audit-fagverk-vitenskap-university-readiness.mjs'
      - 'scripts/audit-fagverk-vitenskap-unit1.mjs'
      - 'scripts/audit-fagverk-vitenskap-mathematics-source-brief.mjs'
      - 'scripts/audit-fagverk-vitenskap-mathematics-fulltext.mjs'
      - 'scripts/audit-fagverk-vitenskap-physics-astronomy-source-brief.mjs'
      - 'scripts/audit-fagverk-vitenskap-physics-astronomy-fulltext.mjs'
      - 'scripts/audit-fagverk-vitenskap-chemistry-material-science-source-brief.mjs'
      - 'scripts/audit-fagverk-vitenskap-chemistry-material-science-fulltext.mjs'
      - 'scripts/audit-fagverk-vitenskap-medicine-biomedicine-public-health-source-brief.mjs'
      - 'tools/audit-vitenskap-theory-integrity.mjs'
      - 'tests/fagverk-vitenskap-breadth-reconciliation.test.mjs'
      - 'tests/fagverk-vitenskap-pilot.test.mjs'
      - 'tests/fagverk-vitenskap-university-readiness.test.mjs'
      - 'tests/fagverk-vitenskap-unit1.test.mjs'
      - 'tests/fagverk-vitenskap-mathematics-source-brief.test.mjs'
      - 'tests/fagverk-vitenskap-mathematics-fulltext.test.mjs'
      - 'tests/fagverk-vitenskap-physics-astronomy-source-brief.test.mjs'
      - 'tests/fagverk-vitenskap-physics-astronomy-fulltext.test.mjs'
      - 'tests/fagverk-vitenskap-chemistry-material-science-source-brief.test.mjs'
      - 'tests/fagverk-vitenskap-chemistry-material-science-fulltext.test.mjs'
      - 'tests/fagverk-vitenskap-medicine-biomedicine-public-health-source-brief.test.mjs'
      - 'tests/vitenskap-theory-integrity.test.mjs'
      - 'reports/fagverk/**'
      - '.github/workflows/fagverk-vitenskap-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Vitenskap with nested Teknologi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate audit script syntax
        run: |
          node --check scripts/audit-fagverk-vitenskap-breadth-reconciliation.mjs
          node --check scripts/audit-fagverk-vitenskap-pilot.mjs
          node --check scripts/audit-fagverk-vitenskap-university-readiness.mjs
          node --check scripts/audit-fagverk-vitenskap-unit1.mjs
          node --check scripts/audit-fagverk-vitenskap-mathematics-source-brief.mjs
          node --check scripts/audit-fagverk-vitenskap-mathematics-fulltext.mjs
          node --check scripts/audit-fagverk-vitenskap-physics-astronomy-source-brief.mjs
          node --check scripts/audit-fagverk-vitenskap-physics-astronomy-fulltext.mjs
          node --check scripts/audit-fagverk-vitenskap-chemistry-material-science-source-brief.mjs
          node --check scripts/audit-fagverk-vitenskap-chemistry-material-science-fulltext.mjs
          node --check scripts/audit-fagverk-vitenskap-medicine-biomedicine-public-health-source-brief.mjs
          node --check tools/audit-vitenskap-theory-integrity.mjs
      - name: Validate shared Fagverk inventory and engine
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
      - name: Validate Vitenskap v4.6 breadth, structure and university readiness
        run: |
          node scripts/audit-fagverk-vitenskap-breadth-reconciliation.mjs
          node scripts/audit-fagverk-vitenskap-pilot.mjs
          node scripts/audit-fagverk-vitenskap-university-readiness.mjs
      - name: Validate Vitenskap Unit 1 content integrity
        shell: bash
        run: |
          set +e
          output=$(node scripts/audit-fagverk-vitenskap-unit1.mjs 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(printf '%s' "$output" | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error file=scripts/audit-fagverk-vitenskap-unit1.mjs,title=Vitenskap Unit 1 audit failed::$message"
            printf '%s\n' "$output"
            exit "$status"
          fi
          printf '%s\n' "$output"
      - name: Validate Vitenskap Unit 2 mathematics source brief
        shell: bash
        run: |
          set +e
          output=$(node scripts/audit-fagverk-vitenskap-mathematics-source-brief.mjs 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(printf '%s' "$output" | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error file=scripts/audit-fagverk-vitenskap-mathematics-source-brief.mjs,title=Vitenskap mathematics source brief audit failed::$message"
            printf '%s\n' "$output"
            exit "$status"
          fi
          printf '%s\n' "$output"
      - name: Validate Vitenskap Unit 2 mathematics fulltext
        shell: bash
        run: |
          set +e
          output=$(node scripts/audit-fagverk-vitenskap-mathematics-fulltext.mjs 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(printf '%s' "$output" | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error file=scripts/audit-fagverk-vitenskap-mathematics-fulltext.mjs,title=Vitenskap mathematics fulltext audit failed::$message"
            printf '%s\n' "$output"
            exit "$status"
          fi
          printf '%s\n' "$output"
      - name: Validate Vitenskap Unit 3 physics astronomy source brief
        shell: bash
        run: |
          set +e
          output=$(node scripts/audit-fagverk-vitenskap-physics-astronomy-source-brief.mjs 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(printf '%s' "$output" | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error file=scripts/audit-fagverk-vitenskap-physics-astronomy-source-brief.mjs,title=Vitenskap physics astronomy source brief audit failed::$message"
            printf '%s\n' "$output"
            exit "$status"
          fi
          printf '%s\n' "$output"
      - name: Validate Vitenskap Unit 3 physics astronomy fulltext
        shell: bash
        run: |
          set +e
          output=$(node scripts/audit-fagverk-vitenskap-physics-astronomy-fulltext.mjs 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(printf '%s' "$output" | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error file=scripts/audit-fagverk-vitenskap-physics-astronomy-fulltext.mjs,title=Vitenskap physics astronomy fulltext audit failed::$message"
            printf '%s\n' "$output"
            exit "$status"
          fi
          printf '%s\n' "$output"
      - name: Validate Vitenskap Unit 4 chemistry material science source brief
        shell: bash
        run: |
          set +e
          output=$(node scripts/audit-fagverk-vitenskap-chemistry-material-science-source-brief.mjs 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(printf '%s' "$output" | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error file=scripts/audit-fagverk-vitenskap-chemistry-material-science-source-brief.mjs,title=Vitenskap chemistry material science source brief audit failed::$message"
            printf '%s\n' "$output"
            exit "$status"
          fi
          printf '%s\n' "$output"
      - name: Validate Vitenskap Unit 4 chemistry material science fulltext
        shell: bash
        run: |
          set +e
          output=$(node scripts/audit-fagverk-vitenskap-chemistry-material-science-fulltext.mjs 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(printf '%s' "$output" | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error file=scripts/audit-fagverk-vitenskap-chemistry-material-science-fulltext.mjs,title=Vitenskap chemistry material science fulltext audit failed::$message"
            printf '%s\n' "$output"
            exit "$status"
          fi
          printf '%s\n' "$output"
      - name: Validate Vitenskap Unit 5 medicine biomedicine public health source brief
        shell: bash
        run: |
          set +e
          output=$(node scripts/audit-fagverk-vitenskap-medicine-biomedicine-public-health-source-brief.mjs 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(printf '%s' "$output" | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error file=scripts/audit-fagverk-vitenskap-medicine-biomedicine-public-health-source-brief.mjs,title=Vitenskap medicine biomedicine public health source brief audit failed::$message"
            printf '%s\n' "$output"
            exit "$status"
          fi
          printf '%s\n' "$output"
      - name: Validate release manifest remains deterministic
        run: node scripts/build-fagverk-release-manifest.mjs --check
      - name: Validate Fagverk, Vitenskap and Teknologi contracts
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-vitenskap-breadth-reconciliation.test.mjs
          node --test tests/fagverk-vitenskap-pilot.test.mjs
          node --test tests/fagverk-vitenskap-university-readiness.test.mjs
          node --test tests/fagverk-vitenskap-unit1.test.mjs
          node --test tests/fagverk-vitenskap-mathematics-source-brief.test.mjs
          node --test tests/fagverk-vitenskap-mathematics-fulltext.test.mjs
          node --test tests/fagverk-vitenskap-physics-astronomy-source-brief.test.mjs
          node --test tests/fagverk-vitenskap-physics-astronomy-fulltext.test.mjs
          node --test tests/fagverk-vitenskap-chemistry-material-science-source-brief.test.mjs
          node --test tests/fagverk-vitenskap-chemistry-material-science-fulltext.test.mjs
          node --test tests/fagverk-vitenskap-medicine-biomedicine-public-health-source-brief.test.mjs
          node tools/audit-vitenskap-theory-integrity.mjs
          node --test tests/vitenskap-theory-integrity.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
          node --test tests/vitenskap-teknologi-category-contract.test.mjs
      - name: Validate nested Teknologi scientific package
        run: |
          node tools/build-teknologi-editorial-v3.mjs --check
          node tools/validate-teknologi-foundation.mjs
          node tools/validate-teknologi-quality-v2_1.mjs
          node tools/validate-teknologi-ontology-v2_2.mjs
          node tools/validate-teknologi-evidence-v2_3.mjs
          node scripts/validate-teknologi-editorial-v3.mjs
