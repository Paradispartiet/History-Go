name: Fagverk Vitenskap pilot

on:
  pull_request:
    paths:
      - 'fagverk.html'
      - 'fagverk-forside.html'
      - 'data/categories/category_contract.json'
      - 'data/fag/fag_manifest.json'
      - 'data/fag/vitenskap/**'
      - 'data/fag/teknologi/**'
      - 'data/badges/vitenskap.json'
      - 'data/fagverk/**'
      - 'js/fagverk-subject-core.js'
      - 'js/fagverk-subject-model.js'
      - 'js/fagverk.js'
      - 'scripts/audit-fagverk-subject-inventory.mjs'
      - 'scripts/audit-fagverk-general-engine.mjs'
      - 'scripts/audit-fagverk-vitenskap-pilot.mjs'
      - 'scripts/audit-fagverk-vitenskap-university-readiness.mjs'
      - 'scripts/build-fagverk-release-manifest.mjs'
      - 'tests/fagverk-subject-inventory.test.mjs'
      - 'tests/fagverk-general-engine.test.mjs'
      - 'tests/fagverk-vitenskap-pilot.test.mjs'
      - 'tests/fagverk-vitenskap-university-readiness.test.mjs'
      - 'tests/fagverk-release-manifest.test.mjs'
      - 'tests/vitenskap-teknologi-category-contract.test.mjs'
      - 'reports/fagverk/**'
      - '.github/workflows/fagverk-vitenskap-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'data/fag/vitenskap/**'
      - 'data/fag/teknologi/**'
      - 'data/badges/vitenskap.json'
      - 'data/fagverk/**'
      - 'scripts/audit-fagverk-vitenskap-pilot.mjs'
      - 'scripts/audit-fagverk-vitenskap-university-readiness.mjs'
      - 'tests/fagverk-vitenskap-pilot.test.mjs'
      - 'tests/fagverk-vitenskap-university-readiness.test.mjs'
      - 'reports/fagverk/**'
      - '.github/workflows/fagverk-vitenskap-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Vitenskap with nested Teknologi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate syntax and deterministic reports
        run: |
          node --check scripts/audit-fagverk-vitenskap-pilot.mjs
          node --check scripts/audit-fagverk-vitenskap-university-readiness.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-vitenskap-pilot.mjs
          node scripts/audit-fagverk-vitenskap-university-readiness.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Validate Fagverk, Vitenskap and Teknologi contracts
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-vitenskap-pilot.test.mjs
          node --test tests/fagverk-vitenskap-university-readiness.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
          node --test tests/vitenskap-teknologi-category-contract.test.mjs
      - name: Validate nested Teknologi scientific package
        run: |
          node tools/build-teknologi-editorial-v3.mjs --check
          node tools/validate-teknologi-foundation.mjs
          node tools/validate-teknologi-quality-v2_1.mjs
          node tools/validate-teknologi-ontology-v2_2.mjs
          node tools/validate-teknologi-evidence-v2_3.mjs
          node scripts/validate-teknologi-editorial-v3.mjs
