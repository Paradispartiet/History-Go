name: Voldslokka canonical generated sync
on:
  push:
    branches:
      - content/voldslokka-pumptrack-editorial-v42-20261027
    paths:
      - '.github/workflows/voldslokka-sync-generated-20261027.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voldslokka-generated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regenerate:
    if: github.ref == 'refs/heads/content/voldslokka-pumptrack-editorial-v42-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/voldslokka-pumptrack-editorial-v42-20261027
          fetch-depth: 0
          persist-credentials: true
      - name: Merge latest main without replacing parallel changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rebuild canonical place and epoch indexes
        run: |
          npm run places:index:build
          npm run epoker:places:build
          npm run place-open:build
      - name: Verify exact canonical outputs and existing quiz
        run: |
          npm run places:index:check
          npm run epoker:places:check
          npm run place-open:check
          node --test tests/voldslokka-pumptrack-integrity-20261027.test.mjs
          node scripts/audit-place-images.mjs --mode=changed
      - name: Commit generated files and remove single-use workflow
        shell: bash
        run: |
          set -euo pipefail
          git add data/places/places_index.json
          git add data/epoker/epoke-place-index.json
          git add data/runtime/place-open/voldslokka_pumptrack.json
          git rm .github/workflows/voldslokka-sync-generated-20261027.yml
          git diff --cached --check
          git commit -m "Voldslokka: regenerate place, epoch and place-open parity after main sync"
          git push origin HEAD:content/voldslokka-pumptrack-editorial-v42-20261027
