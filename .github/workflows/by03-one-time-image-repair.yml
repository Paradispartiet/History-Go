name: By03 one-time image URL repair
on:
  push:
    branches: [feature/by-bolk03-regional-20-20261025]
    paths:
      - '.github/workflows/by03-one-time-image-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: by03-one-time-image-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Change Commons HTML page links into direct image redirects
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const regions = {
            akershus:['tertitten_urskog_holandsbanen','kjeller_flyplass','hvitsten_sjobodene','son_ladested','holen_ladested'],
            ostfold:['orje_sluser_haldenkanalen','kornsjo_grensestasjon','brekke_sluser_haldenkanalen','stromsfoss_sluser','homlungen_fyr'],
            buskerud:['drammen_tollbod_havn','gamle_nesbyen','kroderbanen_kroderen_stasjon','riddergarden_honefoss','vikersund_stasjon_randsfjordbanen'],
            innlandet:['eina_stasjon_totenbanen','fagernes_stasjon_valdresbanen','hamar_stasjon_jernbanebyen','lillehammer_stasjon','skibladner_gjovik']
          };
          let count = 0;
          for (const [region,ids] of Object.entries(regions)) {
            for (const id of ids) {
              const file = 'data/places/by/' + region + '/' + id + '/' + id + '.json';
              const place = JSON.parse(fs.readFileSync(file,'utf8'));
              for (const field of ['image','cardImage','popupImage']) {
                const value = place[field];
                if (typeof value !== 'string') continue;
                const pagePrefix = 'https://commons.wikimedia.org/wiki/File:';
                if (!value.startsWith(pagePrefix)) continue;
                const fileName = value.slice(pagePrefix.length).split('?')[0];
                place[field] = 'https://commons.wikimedia.org/wiki/Special:Redirect/file/' + fileName + '?width=1280';
                count++;
              }
              for (const field of ['image','cardImage']) {
                if (String(place[field] || '').includes('/wiki/File:')) {
                  throw new Error(id + ': still contains a Commons HTML page URL as image');
                }
              }
              fs.writeFileSync(file, JSON.stringify(place,null,2)+'\n');
            }
          }
          console.log('Normalized direct-image fields:',count);
          if (count !== 40) throw new Error('Expected 40 corrected image/cardImage URLs; found '+count);
          NODE
      - name: Regenerate canonical places index
        run: npm run places:index:build
      - name: Regenerate Place-open payloads
        run: npm run place-open:build
      - name: Commit source images and generated snapshots to existing PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/by/akershus data/places/by/ostfold data/places/by/buskerud data/places/by/innlandet data/places/places_index.json data/runtime/place-open
          if git diff --cached --quiet; then
            echo 'Image pointers were already normalized'
          else
            git commit -m 'fix(by03): use directly renderable Commons images and sync place data'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
