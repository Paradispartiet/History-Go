name: TEMP Vinderen canonical replay and release repair

on:
  push:
    branches:
      - agent/vinderen-place-production-20260907

permissions:
  contents: write

concurrency:
  group: temp-vinderen-canonical-replay
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vinderen-place-production-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Replay on exact fresh main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          set +e
          git merge --no-edit origin/main
          MERGE_STATUS=$?
          set -e
          if [ "$MERGE_STATUS" -ne 0 ]; then
            CONFLICTS="$(git diff --name-only --diff-filter=U)"
            if [ "$CONFLICTS" != "data/Civication/scenarioPeople_index.json" ]; then
              printf 'Unexpected merge conflicts:\n%s\n' "$CONFLICTS" >&2
              exit 1
            fi
            node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
            git add data/Civication/scenarioPeople_index.json data/Civication/scenarioPeople/generated
            git diff --cached --check
            git commit --no-edit
          fi
          test "$(git merge-base origin/main HEAD)" = "$MAIN_SHA"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$MAIN_SHA" > /tmp/vinderen-main-sha
      - name: Regenerate canonical outputs
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
          node scripts/materialize-natur-final-registry.mjs
          node scripts/build-fagverk-release-manifest.mjs
          git rm .github/workflows/temp-vinderen-phase3-release-repair.yml
          CHANGED="$(git status --porcelain | sed 's/^...//')"
          EXPECTED="$(printf '%s\n'             data/Civication/scenarioPeople/generated/by.json             data/Civication/scenarioPeople/generated/politikk.json             data/Civication/scenarioPeople_index.json             data/fagverk/fagverk_release.json             .github/workflows/temp-vinderen-phase3-release-repair.yml | sort)"
          ACTUAL="$(printf '%s\n' "$CHANGED" | sort)"
          EXTRA="$(comm -23 <(printf '%s\n' "$ACTUAL") <(printf '%s\n' "$EXPECTED"))"
          if [ -n "$EXTRA" ]; then
            printf 'Unexpected generated changes:\n%s\n' "$EXTRA" >&2
            exit 1
          fi
          git add data/Civication/scenarioPeople/generated data/Civication/scenarioPeople_index.json data/fagverk/fagverk_release.json
          git diff --cached --check
          git commit -m "Replay Vinderen on fresh main and refresh Fagverk release"
      - name: Validate canonical Phase 3 and release gates
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(cat /tmp/vinderen-main-sha)"
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node --test tests/civication-scenario-people.test.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/fagverk-release-manifest.test.mjs
          FAGVERK_PHASE3_BASE_SHA="$MAIN_SHA" FAGVERK_PHASE3_HEAD_SHA="$(git rev-parse HEAD)" node scripts/run-fagverk-phase3-ci-v1.mjs
          REPO_HYGIENE_BASE_SHA="$MAIN_SHA" REPO_HYGIENE_HEAD_SHA="$(git rev-parse HEAD)" node scripts/audit-repository-hygiene-v1.mjs
          test -z "$(git status --porcelain)"
      - name: Push exact validated head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN="$(cat /tmp/vinderen-main-sha)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git push origin HEAD:agent/vinderen-place-production-20260907
