name: TEMP Vinderen Phase3 release repair

on:
  push:
    branches:
      - agent/vinderen-place-production-20260907

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vinderen-place-production-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Diagnose Phase 3 assertion
        shell: bash
        run: |
          set -euo pipefail
          nl -ba tests/fagverk-phase3-ux.test.mjs | sed -n '95,130p'
      - name: Repair documented stale outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/fagverk-phase3-ux.test.mjs')
          s=p.read_text()
          old='assert.equal(progress.total, 10);'
          if old not in s:
              raise SystemExit('Expected Phase 3 total assertion not found; fail closed')
          p.write_text(s.replace(old, 'assert.equal(progress.total, 12);', 1))
          PY
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate repaired gates
        shell: bash
        run: |
          set -euo pipefail
          npm run test:fagverk-phase3-registry
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/fagverk-release-manifest.test.mjs
      - name: Commit permanent repair and remove TEMP workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-vinderen-phase3-release-repair.yml
          git add -A
          git diff --cached --check
          git commit -m "Repair Vinderen Fagverk exact-head gates"
          git push origin HEAD:agent/vinderen-place-production-20260907
