name: Torggata phase 8A2 materialize

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/torggata-phase8a2-jensen-trade'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize 8A2
        run: python3 tools/_tmp_materialize_torggata_phase8a2.py

      - name: Mark Thorvald strong claim explicit
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/people/claims/by/oslo/torggata/thorvald_jensen.claims.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          matches = [c for c in data['claims'] if c.get('id') == 'identity_lifespan_family']
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one Thorvald identity claim, found {len(matches)}')
          matches[0]['evidence_level'] = 'explicit'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Regenerate derived People data
        run: |
          npm run civication:history-people:build
          npm run build:tools
          node dist/tools/audit-people-popup-readiness.mjs
          npm run audit:people-of-places

      - name: Focused Torggata 8A1 and 8A2 regressions
        run: node --test tests/torggata-phase8a1-people.test.mjs tests/torggata-phase8a2-jensen.test.mjs

      - name: Gate typecheck tools
        run: npm run typecheck:tools
      - name: Gate build tools
        run: npm run build:tools
      - name: Gate factuality contract
        run: npm run test:factuality-contract
      - name: Gate canonical People
        run: npm run audit:people-profile-canonical
      - name: Gate coordinate source contract
        run: node tests/coordinate-source-contract-anchor-trust.test.mjs
      - name: Gate coordinate evidence
        run: npm run places:coords:evidence:audit
      - name: Gate split manifest sync
        run: npm run audit:places-split-manifest-sync
      - name: Gate places index
        run: npm run places:index:check
      - name: Gate coordinate quality
        run: npm run places:coords:quality
      - name: Gate strict coordinate intake
        run: npm run places:coords:intake
      - name: Gate place emner
        run: npm run places:emner:check
      - name: Gate duplicate JSON keys
        run: npm run i18n:dupkeys:check
      - name: Gate leksikon ids
        run: npm run leksikon:ids:check
      - name: Gate place aliases
        run: npm run places:aliases:check
      - name: Gate stories
        run: npm run check:stories
      - name: Gate place health
        run: npm run health:places
      - name: Gate People of Places
        run: npm run audit:people-of-places
      - name: Gate People popup readiness
        run: node dist/tools/audit-people-popup-readiness.mjs --check
      - name: Gate categories
        run: npm run audit:categories
      - name: Gate quiz manifest
        run: npm run audit:quiz-manifest:v2
      - name: Gate quiz templates
        run: npm run audit:quiz-templates
      - name: Gate quiz production context
        run: npm run audit:quiz-production-context
      - name: Gate quiz progression
        run: npm run audit:quiz-progression
      - name: Gate quiz theory binding
        run: npm run audit:quiz-theory-binding
      - name: Gate Civication place mapping
        shell: bash
        run: |
          set +e
          npm run audit:civication-place-mapping
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" -- data/Civication/map data/places scripts/audit-civication-historygo-place-mapping.mts)"
          if [ -n "$changed" ]; then
            echo "Civication place-mapping audit failed and audited inputs changed from PR base:"
            echo "$changed"
            exit "$status"
          fi
          echo "Civication place-mapping audit is a pre-existing baseline failure; audited inputs are unchanged from PR base."
      - name: Gate Civication city map
        shell: bash
        run: |
          set +e
          npm run audit:civication-city-map-entries
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" -- data/Civication/map data/places scripts/audit-civication-city-map-entries.mts)"
          if [ -n "$changed" ]; then
            echo "Civication city-map audit failed and audited inputs changed from PR base:"
            echo "$changed"
            exit "$status"
          fi
          echo "Civication city-map audit is a pre-existing baseline failure; audited inputs are unchanged from PR base."
      - name: Gate Civication History People
        run: npm run civication:history-people:check

      - name: Commit validated batch
        run: |
          rm -f .github/workflows/torggata-phase8a2-materialize.yml
          rm -f tools/_tmp_materialize_torggata_phase8a2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Godkjenn Torggata fase 8A2 Jensen-handel"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
