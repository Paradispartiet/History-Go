name: Place-open payloads

on:
  pull_request:
    paths:
      - 'data/people/**'
      - 'data/places/**'
      - 'data/relations*.json'
      - 'data/stories/**'
      - 'data/leksikon/**'
      - 'data/lesespor/**'
      - 'data/natur/**'
      - 'data/wonderkammer/**'
      - 'data/events/**'
      - 'data/brands/**'
      - 'data/runtime/**'
      - 'js/data/place-open-loader.js'
      - 'js/ui/place-popup-v2.js'
      - 'js/ui/place-popup-tabs.js'
      - 'js/ui/place-popup-direct-tabs.js'
      - 'js/ui/place-popup-unified-host-bridge.js'
      - 'js/ui/place-language-layer.js'
      - 'js/ui/place-learning-surface.js'
      - 'js/ui/place-card-status-surface.js'
      - 'js/ui/place-rounds-visual-collections.js'
      - 'js/ui/place-unified-surface.ts'
      - 'js/ui/place-sheet/**'
      - 'dist/web/place-unified-surface.js'
      - 'dist/web/place-unified-surface.js.map'
      - 'css/place-unified-surface.css'
      - 'css/place-sheet.css'
      - 'js/config.js'
      - 'build/build-web.mjs'
      - 'docs/PLACE_UNIFIED_SURFACE_PLAN.md'
      - 'scripts/build-place-open-payloads.mjs'
      - 'tests/place-open-hyperfast.test.mjs'
      - 'tests/place-popup-lesespor-place-open-race.test.mjs'
      - 'tests/place-popup-unified-host-bridge.test.mjs'
      - 'tests/place-popup-v2-unified-target.test.mjs'
      - 'tests/place-popup-root-scoped-decorators.test.mjs'
      - 'tests/place-sheet-phase1.test.mjs'
      - 'tests/place-sheet-about-renderer.test.mjs'
      - 'tests/place-sheet-history-renderer.test.mjs'
      - 'tests/place-sheet-stories-renderer.test.mjs'
      - 'tests/place-unified-surface.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/place-open-payloads.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify generated place-open data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify payload sync and runtime contract
        run: npm run place-open:check && npm run test:place-open

      - name: Verify unified Place surface build and parity contract
        run: |
          npm run typecheck:web
          npm run build:web:check
          node --check dist/web/place-unified-surface.js
          node --check js/ui/place-popup-unified-host-bridge.js
          node --check tests/place-unified-surface.test.mjs
          node --check tests/place-popup-unified-host-bridge.test.mjs
          node --check tests/place-popup-v2-unified-target.test.mjs
          node --check tests/place-popup-root-scoped-decorators.test.mjs
          node --check tests/place-sheet-phase1.test.mjs
          node --check tests/place-sheet-about-renderer.test.mjs
          node --check tests/place-sheet-history-renderer.test.mjs
          node --check tests/place-sheet-stories-renderer.test.mjs
          node --test tests/place-unified-surface.test.mjs tests/place-popup-unified-host-bridge.test.mjs tests/place-popup-v2-unified-target.test.mjs tests/place-popup-root-scoped-decorators.test.mjs tests/place-sheet-phase1.test.mjs tests/place-sheet-about-renderer.test.mjs tests/place-sheet-history-renderer.test.mjs tests/place-sheet-stories-renderer.test.mjs
