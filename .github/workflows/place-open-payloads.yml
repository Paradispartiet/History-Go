name: Place-open payloads

on:
  pull_request:
    paths:
      - 'data/people/**'
      - 'data/places/**'
      - 'data/relations*.json'
      - 'data/stories/**'
      - 'data/leksikon/**'
      - 'data/lesespor/**'
      - 'data/natur/**'
      - 'data/wonderkammer/**'
      - 'data/events/**'
      - 'data/brands/**'
      - 'data/runtime/**'
      - 'js/data/place-open-loader.js'
      - 'scripts/build-place-open-payloads.mjs'
      - 'tests/place-open-hyperfast.test.mjs'
      - 'tests/place-popup-lesespor-place-open-race.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/place-open-payloads.yml'
  push:
    branches:
      - main
    paths:
      - 'data/people/**'
      - 'data/places/**'
      - 'data/relations*.json'
      - 'data/stories/**'
      - 'data/leksikon/**'
      - 'data/lesespor/**'
      - 'data/natur/**'
      - 'data/wonderkammer/**'
      - 'data/events/**'
      - 'data/brands/**'
      - 'data/runtime/**'
      - 'js/data/place-open-loader.js'
      - 'scripts/build-place-open-payloads.mjs'
      - 'tests/place-open-hyperfast.test.mjs'
      - 'tests/place-popup-lesespor-place-open-race.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/place-open-payloads.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify generated place-open data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify payload sync and runtime contract
        run: npm run place-open:check && npm run test:place-open
