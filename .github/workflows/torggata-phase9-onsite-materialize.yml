name: Torggata phase 9 onsite materialize

on:
  push:
    branches:
      - agent/torggata-phase9-onsite-closeout

permissions:
  contents: write

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize Torggata phase 9
        run: node scripts/materialize-torggata-phase9-onsite-closeout.mjs

      - name: Validate focused phase 9
        run: |
          node --check scripts/materialize-torggata-phase9-onsite-closeout.mjs
          node --test tests/torggata-phase9-onsite.test.mjs
          node --test tests/place-onsite-category-policy.test.mjs

      - name: Preserve phase 8 closeout regression
        run: node --test tests/torggata-phase8e-rounds-closeout.test.mjs

      - name: Assert canonical task migration
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const place = JSON.parse(fs.readFileSync('data/places/by/oslo/places/torggata.json', 'utf8'));
          if (Object.prototype.hasOwnProperty.call(place, 'tasks_profile')) throw new Error('tasks_profile survived phase 9 migration');
          const text = JSON.stringify(place);
          for (const marker of ['torggata_task_', 'gateprofil-oppgaven', 'oppgaven Les aktørene', '`tasks_profile`']) {
            if (text.includes(marker)) throw new Error('stale task marker survived: ' + marker);
          }
          NODE

      - name: TypeScript hard gates
        run: |
          npm run typecheck:web
          npm run typecheck:scripts
          npm run typecheck:tools

      - name: Build guard
        run: npm run build --if-present

      - name: Persist validated phase 9 batch
        shell: bash
        run: |
          rm -f .github/workflows/torggata-phase9-onsite-materialize.yml scripts/materialize-torggata-phase9-onsite-closeout.mjs
          git add -A
          git diff --cached --check
          echo "Validated permanent diff:"
          git diff --cached --name-status
          if git diff --cached --quiet; then
            echo "No validated changes to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Godkjenn Torggata fase 9 På stedet"
          git push origin HEAD:agent/torggata-phase9-onsite-closeout
