name: TEMP Kulturkirken Jakob scenario People repair

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-kulturkirken-jakob-scenario-people-repair.yml'
      - 'data/Civication/historyPeople_index.json'
      - 'data/Civication/scenarioPeople/**'
      - 'data/Civication/scenarioPeople_index.json'
      - 'data/people/**'

permissions:
  contents: read

concurrency:
  group: tmp-kulturkirken-jakob-scenario-people-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build scenario People through canonical owner
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - name: Verify scenario People parity
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
      - name: Commit generated scenario People
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/scenarioPeople/generated data/Civication/scenarioPeople_index.json
          if git diff --cached --quiet; then
            echo "scenarioPeople is current."
          else
            git commit -m "build: regenerate Kulturkirken Jakob scenario People"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
