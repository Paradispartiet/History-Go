name: TEMP Materialize Administrasjonsmedarbeider Readiness Prerequisites

on:
  workflow_dispatch:
  push:
    branches:
      - agent/civication-naeringsliv-administrasjonsmedarbeider-prerequisites
    paths:
      - reports/CIVICATION_NAERINGSLIV_ADMINISTRASJONSMEDARBEIDER_PREREQUISITES_SOURCE_FIRST.md
      - scripts/TEMP_materialize_administrasjonsmedarbeider_readiness_prerequisites.mjs
      - tests/civication-administrasjonsmedarbeider-readiness-prerequisites.test.js
      - .github/workflows/TEMP-civication-naeringsliv-administrasjonsmedarbeider-prerequisites.yml

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/civication-naeringsliv-administrasjonsmedarbeider-prerequisites
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize Administrasjonsmedarbeider prerequisites
        run: node scripts/TEMP_materialize_administrasjonsmedarbeider_readiness_prerequisites.mjs

      - name: Regenerate scene registry
        run: node scripts/build-civication-scene-registry.mjs --write

      - name: Regenerate career gameplay audit
        run: node scripts/audit-civication-career-gameplay.mjs --write

      - name: Regenerate rollout readiness
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write

      - name: Verify focused prerequisite and canonical gates
        run: |
          node tests/civication-administrasjonsmedarbeider-readiness-prerequisites.test.js
          node tests/civication-career-gameplay-matrix.test.js
          node tests/civication-role-world-rollout-readiness.test.js
          node tests/civication-compiled-scene-registry-parity.test.js

      - name: Run full Civication suite
        run: npm run test:civication

      - name: Remove TEMP surfaces
        run: |
          rm scripts/TEMP_materialize_administrasjonsmedarbeider_readiness_prerequisites.mjs
          rm .github/workflows/TEMP-civication-naeringsliv-administrasjonsmedarbeider-prerequisites.yml

      - name: Commit permanent verified state
        run: |
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No permanent changes produced"; exit 1; }
          git commit -m "Complete Administrasjonsmedarbeider readiness prerequisites"
          git push origin HEAD:agent/civication-naeringsliv-administrasjonsmedarbeider-prerequisites
