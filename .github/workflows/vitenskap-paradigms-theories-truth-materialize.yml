name: Vitenskap paradigms theories truth materialize

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/vitenskap-paradigms-theories-truth-materialize.yml'

permissions:
  contents: write

jobs:
  materialize-and-validate:
    if: github.head_ref == 'agent/vitenskap-editorial-coverage-repair-6'
    runs-on: ubuntu-latest
    env:
      REPAIR_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate static batch 6 artifacts and materializer syntax
        run: |
          node --check scripts/materialize-vitenskap-paradigms-theories-truth-coverage-batch.mjs
          node --check scripts/audit-fagverk-vitenskap-paradigms-theories-truth-coverage.mjs
          node -e "JSON.parse(require('fs').readFileSync('data/fagverk/vitenskap/vitenskap-fra-observasjon-til-etterprovbar-kunnskap/09-paradigmer-teorier-sannhet.json','utf8')); JSON.parse(require('fs').readFileSync('data/fagverk/vitenskap/vitenskap-fra-observasjon-til-etterprovbar-kunnskap/09-paradigmer-teorier-sannhet-brief.json','utf8'))"
      - name: Materialize canonical paradigms theories truth coverage
        run: node scripts/materialize-vitenskap-paradigms-theories-truth-coverage-batch.mjs
      - name: Regenerate permanent reports and release projection
        run: |
          node scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs --write-report --no-check-report
          node scripts/audit-fagverk-vitenskap-paradigms-theories-truth-coverage.mjs --write-report --no-check-report
          node scripts/build-fagverk-release-manifest.mjs
      - name: Verify final coverage transition before quality review
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('reports/fagverk/vitenskap-holistic-university-breadth-completion-audit.json','utf8'));
          if (report.canonicalInventory.explicitChapterOwnedEmneCount !== 117) throw new Error(`Expected 117 owned, got ${report.canonicalInventory.explicitChapterOwnedEmneCount}`);
          if (report.canonicalInventory.explicitUncoveredEmneCount !== 0) throw new Error(`Expected 0 uncovered, got ${report.canonicalInventory.explicitUncoveredEmneCount}`);
          if (report.blockers.some((row) => row.id === 'canonical_emne_full_editorial_treatment_gap')) throw new Error('Coverage blocker still present');
          if (report.qualityReview.status !== 'missing_required_review') throw new Error(`Expected missing_required_review, got ${report.qualityReview.status}`);
          if (!report.blockers.some((row) => row.id === 'full_subject_quality_review_missing')) throw new Error('Missing explicit quality-review blocker');
          if (report.subject.completeReady !== false || report.status !== 'blocked' || report.gates.eligibleForCompletion !== false) throw new Error('Coverage PR advanced completion prematurely');
          NODE
      - name: Validate permanent Vitenskap coverage gates
        run: |
          node --test tests/fagverk-vitenskap-paradigms-theories-truth-coverage.test.mjs
          node --test tests/fagverk-vitenskap-natural-science-medicine-environment-coverage.test.mjs
          node --test tests/fagverk-vitenskap-digital-science-data-infrastructure-coverage.test.mjs
          node --test tests/fagverk-vitenskap-society-power-ethics-coverage.test.mjs
          node --test tests/fagverk-vitenskap-institutions-knowledge-places-coverage.test.mjs
          node --test tests/fagverk-vitenskap-methods-models-coverage.test.mjs
          node --test tests/fagverk-vitenskap-unit1.test.mjs
          node --test tests/fagverk-vitenskap-holistic-university-breadth-completion.test.mjs
      - name: Validate shared Vitenskap release and nested Teknologi gates
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
          node --test tests/vitenskap-teknologi-category-contract.test.mjs
          node tools/build-teknologi-editorial-v3.mjs --check
          node tools/validate-teknologi-foundation.mjs
          node tools/validate-teknologi-quality-v2_1.mjs
          node tools/validate-teknologi-ontology-v2_2.mjs
          node tools/validate-teknologi-evidence-v2_3.mjs
          node scripts/validate-teknologi-editorial-v3.mjs
      - name: Verify deterministic rerun
        run: |
          git diff > /tmp/vitenskap-batch6-before.diff
          node scripts/materialize-vitenskap-paradigms-theories-truth-coverage-batch.mjs
          node scripts/audit-fagverk-vitenskap-holistic-university-breadth-completion.mjs --write-report --no-check-report
          node scripts/audit-fagverk-vitenskap-paradigms-theories-truth-coverage.mjs --write-report --no-check-report
          node scripts/build-fagverk-release-manifest.mjs
          git diff > /tmp/vitenskap-batch6-after.diff
          cmp /tmp/vitenskap-batch6-before.diff /tmp/vitenskap-batch6-after.diff
          git diff --check
      - name: Remove temporary batch 6 artifacts
        run: |
          rm -f scripts/materialize-vitenskap-paradigms-theories-truth-coverage-batch.mjs
          rm -f .github/workflows/vitenskap-paradigms-theories-truth-materialize.yml
      - name: Commit canonical paradigms theories truth coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Materialize Vitenskap paradigms theories truth coverage'
          git push origin HEAD:${REPAIR_BRANCH}
