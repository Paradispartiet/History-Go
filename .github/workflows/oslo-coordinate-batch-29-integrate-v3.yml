name: Integrate Oslo coordinate batch 29 v3

on:
  push:
    branches:
      - agent/oslo-coordinate-control-batch-29-v3
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: oslo-coordinate-batch-29-v3
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-29-v3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply strict batch 29 decisions
        run: node scripts/tmp-complete-oslo-coordinate-batch29-v3.mjs

      - name: Repair pre-existing evidence drift and normalize report EOF
        run: node scripts/tmp-fix-batch29-validation-prereqs.mjs

      - name: Rebuild runtime index
        run: npm run places:index:build

      - name: Validate data and coordinate contracts
        shell: bash
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-29-v3/validation
          mkdir -p "$out"

          npm run audit:places-split-manifest-sync | tee "$out/split-manifest-sync.txt"
          npm run places:index:check | tee "$out/places-index-check.txt"
          npm run test:coordinate-source-contract | tee "$out/coordinate-source-contract.txt"
          npm run places:coords:quality | tee "$out/coordinate-quality.txt"
          npm run places:coords:intake | tee "$out/coordinate-intake.txt"
          npm run places:coords:evidence:audit | tee "$out/coordinate-evidence-audit.txt"
          git diff --check | tee "$out/git-diff-check.txt"

      - name: Assert batch 29 scope and runtime parity
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = (f) => JSON.parse(fs.readFileSync(f, 'utf8'));
          const oslo = read('data/places/litteratur/oslo/places_litteratur.json');
          const index = read('data/places/litteratur/oslo/places_litteratur_index.json');
          const splitManifest = read('data/places/litteratur/oslo/places_litteratur_manifest.json');
          const topManifest = read('data/places/manifest.json');
          const runtime = read('data/places/places_index.json');
          const byId = new Map(oslo.map((p) => [p.id, p]));
          const runtimeById = new Map(runtime.map((p) => [p.id, p]));

          for (const id of ['alf_proysen_statue_nittedal', 'proysenhuset_rudshogda']) {
            if (byId.has(id)) throw new Error(`${id} remains in Oslo aggregate`);
            if (index.some((p) => p.id === id)) throw new Error(`${id} remains in Oslo category index`);
            if (splitManifest.places.some((p) => p.id === id)) throw new Error(`${id} remains in Oslo split manifest`);
            if (fs.existsSync(`data/places/litteratur/oslo/places_litteratur/${id}.json`)) throw new Error(`${id} split child remains in Oslo`);
          }

          const expectedVerified = {
            kulturkirken_jakob_litteratur: ['geonorge-adresser-v1:0301:12782:14', 59.9180329772343, 10.754119014784367],
            ruth_maier_minne: ['geonorge-adresser-v1:0301:11153:3', 59.922730001268235, 10.737930723902437],
          };
          for (const [id, [sourceObjectId, lat, lon]] of Object.entries(expectedVerified)) {
            const place = byId.get(id);
            if (!place) throw new Error(`${id} missing from Oslo aggregate`);
            if (place.coordStatus !== 'verified' || place.sourceObjectId !== sourceObjectId || place.lat !== lat || place.lon !== lon) {
              throw new Error(`${id} verified coordinate contract mismatch`);
            }
            const runtimePlace = runtimeById.get(id);
            if (!runtimePlace || runtimePlace.lat !== lat || runtimePlace.lon !== lon || runtimePlace.coordStatus !== 'verified') {
              throw new Error(`${id} runtime mismatch`);
            }
          }

          for (const id of ['norli_universitetsgata', 'sigrid_undset_statue', 'inger_hagerups_plass']) {
            const place = byId.get(id);
            if (!place || place.coordStatus !== 'needs_source') throw new Error(`${id} should remain needs_source`);
          }

          const alfPath = 'places/litteratur/akershus/alf_proysen_statue_nittedal.json';
          const proysenPath = 'places/litteratur/innlandet/proysenhuset_rudshogda.json';
          if (!topManifest.files.includes(alfPath) || !topManifest.files.includes(proysenPath)) throw new Error('Moved files missing from top manifest');
          const alf = read(`data/${alfPath}`);
          const proysen = read(`data/${proysenPath}`);
          if (alf.coordStatus !== 'needs_manual_visual_qa' || alf.kommune !== 'Nittedal') throw new Error('Alf Prøysen move/status mismatch');
          if (proysen.coordStatus !== 'verified' || proysen.sourceObjectId !== 'geonorge-adresser-v1:3411:8235:1' || proysen.kommune !== 'Ringsaker') throw new Error('Prøysenhuset move/coordinate mismatch');
          if (!runtimeById.has('alf_proysen_statue_nittedal') || !runtimeById.has('proysenhuset_rudshogda')) throw new Error('Moved records missing from runtime');

          const protocol = fs.readFileSync('docs/coordinates/coordinate-control-protocol.md', 'utf8');
          if (!protocol.includes('| 29 | `kulturkirken_jakob_litteratur`') || !protocol.includes('`norli_universitetsgata` – Norli Universitetsgata')) {
            throw new Error('Coordinate protocol not updated for batch 29');
          }
          NODE

      - name: Commit completed batch and remove temporary tooling
        run: |
          set -euo pipefail
          rm .github/workflows/oslo-coordinate-batch-29-integrate-v3.yml
          rm scripts/tmp-complete-oslo-coordinate-batch29-v3.mjs
          rm scripts/tmp-fix-batch29-validation-prereqs.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs reports .github/workflows/oslo-coordinate-batch-29-integrate-v3.yml scripts/tmp-complete-oslo-coordinate-batch29-v3.mjs scripts/tmp-fix-batch29-validation-prereqs.mjs
          git commit -m "Complete Oslo coordinate control batch 29 with strict address-first method"
          git push origin HEAD
