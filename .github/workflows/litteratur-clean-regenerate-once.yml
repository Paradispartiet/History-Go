name: Litteratur clean report regeneration once

on:
  push:
    branches:
      - agent/litteratur-expanded-clean-regeneration-20260911

permissions:
  contents: write

concurrency:
  group: litteratur-clean-regenerate-once
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/litteratur-expanded-clean-regeneration-20260911
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Repair semantic audit recognition
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/audit-litteratur-article-editorial-quality-v1.mjs')
          text = path.read_text()

          old_limit = '/grense|begrens|skiller|ikke|usikker|alternativ/iu'
          new_limit = '/grense|begrens|skiller|ikke|usikker|alternativ|utfordr|for grov|trengs før/iu'
          if text.count(old_limit) != 1:
              raise SystemExit(f'Expected exactly one inference-limit matcher, found {text.count(old_limit)}')
          text = text.replace(old_limit, new_limit)

          old_theory = r'teori\p{L}*|modell\p{L}*|forskn\p{L}*'
          new_theory = r'\p{L}*teori\p{L}*|modell\p{L}*|\p{L}*forskn\p{L}*'
          if text.count(old_theory) != 1:
              raise SystemExit(f'Expected exactly one theory/research stem sequence, found {text.count(old_theory)}')
          text = text.replace(old_theory, new_theory)

          path.write_text(text)
          PY
      - name: Regenerate deterministic reports
        run: |
          node tools/audit-litteratur-theory-integrity.mjs --write-report --no-check-report
          node tools/audit-litteratur-expanded-quality.mjs --write-report --no-check-report
      - name: Verify regenerated reports
        run: |
          node tools/audit-litteratur-theory-integrity.mjs
          node tools/audit-litteratur-expanded-quality.mjs
      - name: Commit permanent repair and report outputs; remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-litteratur-article-editorial-quality-v1.mjs reports/fagverk/litteratur-theory-integrity-audit.json reports/fagverk/litteratur-expanded-quality-audit.json
          git rm .github/workflows/litteratur-clean-regenerate-once.yml
          git commit -m 'Align Litteratur audit semantics and regenerate deterministic reports'
          git push origin HEAD:agent/litteratur-expanded-clean-regeneration-20260911
