name: Litteratur clean report regeneration once

on:
  push:
    branches:
      - agent/litteratur-expanded-clean-regeneration-20260911

permissions:
  contents: write

concurrency:
  group: litteratur-clean-regenerate-once
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/litteratur-expanded-clean-regeneration-20260911
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate deterministic reports
        run: |
          node tools/audit-litteratur-theory-integrity.mjs --write-report --no-check-report
          node tools/audit-litteratur-expanded-quality.mjs --write-report --no-check-report
      - name: Verify regenerated reports
        run: |
          node tools/audit-litteratur-theory-integrity.mjs
          node tools/audit-litteratur-expanded-quality.mjs
      - name: Commit report outputs and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/fagverk/litteratur-theory-integrity-audit.json reports/fagverk/litteratur-expanded-quality-audit.json
          git rm .github/workflows/litteratur-clean-regenerate-once.yml
          git commit -m 'Regenerate deterministic Litteratur audit reports on clean source'
          git push origin HEAD:agent/litteratur-expanded-clean-regeneration-20260911
