name: Sync Asker branch and refresh quiz contexts

on:
  pull_request:
    paths:
      - '.github/workflows/sync-asker-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Configure git and merge current main
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild all quiz production contexts and audit
        shell: bash
        run: |
          set -euo pipefail
          out=reports/akershus-coordinate-asker-kirkested-production-ci
          mkdir -p "$out"

          while read -r category target output; do
            npm run quiz:context -- \
              --category "$category" \
              --target "$target" \
              --output "$output" \
              2>&1 | tee "$out/${category}-${target}-rebuild.log"
          done <<'TARGETS'
          by deichman_bjorvika data/quiz/production_context/by/deichman_bjorvika.json
          historie grindheim_runestein data/quiz/production_context/historie/grindheim_runestein.json
          historie grindheim_steinkross data/quiz/production_context/historie/grindheim_steinkross.json
          historie grindheimsveien_nord_gravfelt data/quiz/production_context/historie/grindheimsveien_nord_gravfelt.json
          historie hoyland_gravhaug_etne data/quiz/production_context/historie/hoyland_gravhaug_etne.json
          naeringsliv telegrafbygningen data/quiz/production_context/naeringsliv/telegrafbygningen.json
          naeringsliv oslo_posthus data/quiz/production_context/naeringsliv/oslo_posthus.json
          naeringsliv havnelageret data/quiz/production_context/naeringsliv/havnelageret.json
          TARGETS

          npm run audit:quiz-production-context \
            2>&1 | tee "$out/quiz-production-context-audit-final.log"
          npm run audit:quiz-progression \
            2>&1 | tee "$out/quiz-progression-audit-final.log"
          npm run audit:quiz-theory-binding \
            2>&1 | tee "$out/quiz-theory-binding-audit-final.log"

      - name: Remove workflow, commit and push
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git rm .github/workflows/sync-asker-branch.yml
          git add data/quiz/production_context \
            reports/akershus-coordinate-asker-kirkested-production-ci
          git commit -m "Sync main and refresh quiz production contexts"
          git push origin "HEAD:${BRANCH_NAME}"
