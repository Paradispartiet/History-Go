name: Run politics democracy migration on PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: read

jobs:
  migrate-and-validate:
    if: github.head_ref == 'agent/politikk-demokrati-vertical-chain'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/politikk-demokrati-vertical-chain
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply and validate canonical democracy upgrade
        shell: bash
        run: |
          set -uo pipefail
          REPORT_DIR="reports/politikk-canonical-migration"
          VALIDATION="$REPORT_DIR/demokrati-representasjon-vertical-chain-validation.txt"
          FAILURE="$REPORT_DIR/demokrati-representasjon-migration-failure.txt"
          mkdir -p "$REPORT_DIR"
          rm -f "$FAILURE"
          : > /tmp/demokrati-migration.log

          set +e
          {
            echo "# Politikk migrering – politikk-demokrati-vertical-2026-07-24"
            cat tools/politikk-demokrati-migration-gz/part-*.b64 | base64 --decode | gunzip > tools/apply-politikk-demokrati-vertical.mjs
            echo "PASS | Migreringsscript rekonstruert"
            node --check tools/apply-politikk-demokrati-vertical.mjs
            echo "PASS | Migreringsscript har gyldig syntaks"
            node tools/apply-politikk-demokrati-vertical.mjs
          } 2>&1 | tee /tmp/demokrati-migration.log
          migration_status=${PIPESTATUS[0]}
          set -e

          if [ "$migration_status" -ne 0 ]; then
            git reset --hard HEAD
            mkdir -p "$REPORT_DIR"
            cp /tmp/demokrati-migration.log "$FAILURE"
            git add "$FAILURE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Logg feil i demokratimigrering"
            git push origin HEAD:agent/politikk-demokrati-vertical-chain
            exit "$migration_status"
          fi

          rm -rf tools/politikk-demokrati-migration-gz tools/politikk-demokrati-migration-parts
          : > "$VALIDATION"
          set +e
          {
            echo "# Politikk vertikal validering – politikk-demokrati-vertical-2026-07-24"
            node --check tools/validate-politikk-demokrati-vertical.mjs
            echo "PASS | Permanent validator har gyldig syntaks"
            node tools/validate-politikk-demokrati-vertical.mjs
            node <<'NODE'
          const fs = require('node:fs');
          const files = [
            'data/fag/politikk/fagkart_politikk_canonical_v4_5.json',
            'data/fag/politikk/emner_politikk_canonical_v4_5.json',
            'data/fag/politikk/methods_politikk_canonical_v4_5.json',
            'data/fag/politikk/emnemapping_politikk_canonical_v4_5.json',
            'data/fag/politikk/politikkpensum_canonical_v4_5.json',
            'data/fag/politikk/quiz_generator_rules_politikk_v5_1_source_priority_patch.json',
            'reports/politikk-canonical-migration/demokrati-representasjon-question-blueprints.json'
          ];
          for (const file of files) {
            JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(`PASS | Gyldig JSON: ${file}`);
          }
          const absent = [
            '.github/workflows/apply-politikk-demokrati-vertical.yml',
            'tools/apply-politikk-demokrati-vertical.mjs',
            'tools/politikk-demokrati-migration-gz',
            'tools/politikk-demokrati-migration-parts',
            'reports/politikk-canonical-migration/demokrati-domain-compact-audit.json'
          ];
          for (const item of absent) {
            if (fs.existsSync(item)) throw new Error(`FAIL | Midlertidig fil finnes fortsatt: ${item}`);
            console.log(`PASS | Midlertidig fil fjernet: ${item}`);
          }
          NODE
          } 2>&1 | tee "$VALIDATION"
          validation_status=${PIPESTATUS[0]}
          set -e

          if [ "$validation_status" -ne 0 ]; then
            cp "$VALIDATION" /tmp/demokrati-validation.log
            git reset --hard HEAD
            mkdir -p "$REPORT_DIR"
            {
              cat /tmp/demokrati-migration.log
              echo
              cat /tmp/demokrati-validation.log
            } > "$FAILURE"
            git add "$FAILURE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Logg valideringsfeil i demokratiløftet"
            git push origin HEAD:agent/politikk-demokrati-vertical-chain
            exit "$validation_status"
          fi

          git status --short | tee -a "$VALIDATION"
          git add -A
          git diff --cached --check 2>&1 | tee -a "$VALIDATION"
          echo "PASS | git diff --cached --check" | tee -a "$VALIDATION"
          git add "$VALIDATION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Politikk: fullfør demokratidomenets kvalitetskjede"
          git push origin HEAD:agent/politikk-demokrati-vertical-chain
