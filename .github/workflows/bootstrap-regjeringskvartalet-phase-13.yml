<div id="placeCard" data-current-place-id="regjeringskvartalet"><div class="pc-title-row"><h2>Regjeringskvartalet</h2><button id="pcBadgesIcon" class="pc-round" aria-label="Merker"></button></div><div class="pc-icons-quad"><button id="pcPeopleIcon" class="pc-round" aria-label="Personer"></button><button id="pcBrandsIcon" class="pc-round" aria-label="Brands"></button></div><div class="pc-body"><div id="pcPeopleList"></div><div id="pcBrandsList"></div></div></div>
<script>window.showPlacePopup=()=>{};window.showPlaceCardRoundPopup=p=>window.__lastRound=p;window.CSS=window.CSS||{};window.CSS.escape=window.CSS.escape||((v)=>String(v).replace(/[^a-zA-Z0-9_-]/g,'\\$&'));window.HGLeksikon={init:async()=>{}};window.HGStories={init:async()=>{},getByPlace:()=>window.__stories||[]};window.DataHub={loadLesespor:async()=>window.LESESPOR||[]};</script>
<script src="/js/ui/place-popup-tabs.js"></script><script src="/js/ui/place-rounds-visual-collections.js"></script>
<script type="module">const [place,articles,stories,reading]=await Promise.all([fetch('/data/places/politikk/oslo/places_politikk/regjeringskvartalet.json').then(r=>r.json()),fetch('/data/leksikon/places/oslo/politikk/leksikon_regjeringskvartalet.json').then(r=>r.json()),fetch('/data/stories/stories_regjeringskvartalet.json').then(r=>r.json()),fetch('/data/lesespor/oslo/lesespor_oslo_politikk.json').then(r=>r.json())]);window.PLACES=[place];window.LEKSIKON_BY_PLACE={regjeringskvartalet:articles};window.__stories=stories;window.LESESPOR=Array.isArray(reading)?reading:(reading.items||[]);window.HGPlacePopupTabs.decoratePopup(place);window.dispatchEvent(new Event('hg:places-ready'));await new Promise(r=>setTimeout(r,180));window.__auditReady=true;</script>
</body></html>`;

const mime = { '.html': 'text/html; charset=utf-8', '.js': 'text/javascript; charset=utf-8', '.json': 'application/json; charset=utf-8', '.css': 'text/css; charset=utf-8' };
const server = http.createServer((request, response) => {
  const pathname = decodeURIComponent(new URL(request.url, 'http://localhost').pathname);
  if (pathname === '/__audit__/regjeringskvartalet.html') {
    response.writeHead(200, { 'content-type': mime['.html'] }); response.end(fixture); return;
  }
  const file = path.resolve(root, '.' + pathname);
  if (!file.startsWith(root) || !fs.existsSync(file) || fs.statSync(file).isDirectory()) {
    response.writeHead(404); response.end('not found'); return;
  }
  response.writeHead(200, { 'content-type': mime[path.extname(file)] || 'application/octet-stream' });
  response.end(fs.readFileSync(file));
});

await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
const { port } = server.address();
const base = `http://127.0.0.1:${port}`;
const png = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=', 'base64');
let browser;
try {
  browser = await chromium.launch({ headless: true });
  const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
  const page = await context.newPage();
  await page.route('**/*', route => route.request().resourceType() === 'image' ? route.fulfill({ status: 200, contentType: 'image/png', body: png }) : route.continue());
  await page.goto(`${base}/__audit__/regjeringskvartalet.html`, { waitUntil: 'networkidle' });
  await page.waitForFunction(() => window.__auditReady === true);

  const tabLabels = await page.locator('[role=tab]').allTextContents();
  assert.deepEqual(tabLabels, ['Om', 'Historie', 'Fortellinger', 'Før/etter', 'Nyheter', 'Lesespor', 'Kilder', 'Mer']);
  assert.equal(await page.locator('[role=tabpanel]').count(), 8);
  for (const id of ['about','history','stories','before-after','news','reading','sources','more']) {
    await page.locator(`[data-place-tab="${id}"]`).click();
    assert.equal(await page.locator(`[data-place-tab="${id}"]`).getAttribute('aria-selected'), 'true');
    assert.equal(await page.locator(`#hg-place-panel-${id}`).isVisible(), true);
  }
  await page.locator('[data-place-tab="about"]').focus();
  await page.keyboard.press('End');
  assert.equal(await page.locator('[data-place-tab="more"]').getAttribute('aria-selected'), 'true');
  await page.keyboard.press('Home');
  assert.equal(await page.locator('[data-place-tab="about"]').getAttribute('aria-selected'), 'true');
  await page.keyboard.press('ArrowRight');
  assert.equal(await page.locator('[data-place-tab="history"]').getAttribute('aria-selected'), 'true');

  await page.waitForSelector('#pcObjectsIcon img');
  const rounds = await page.evaluate(() => ({
    mode: document.getElementById('placeCard').dataset.roundMode,
    count: document.getElementById('placeCard').dataset.roundCount,
    visible: ['pcPeopleIcon','pcObjectsIcon','pcBrandsIcon'].map(id => !document.getElementById(id).hidden),
    badgeParent: document.getElementById('pcBadgesIcon').parentElement.className,
    objectSrc: document.querySelector('#pcObjectsIcon img')?.getAttribute('src') || ''
  }));
  assert.equal(rounds.mode, 'standard-three');
  assert.equal(rounds.count, '3');
  assert.deepEqual(rounds.visible, [true, true, true]);
  assert.match(rounds.badgeParent, /pc-title-row/);
  assert.match(rounds.objectSrc, /^https:\/\/commons\.wikimedia\.org/);
  await page.locator('#pcObjectsIcon').click();
  await page.waitForFunction(() => window.__lastRound?.title === 'Gjenstander');
  const objectPopup = await page.evaluate(() => window.__lastRound.html);
  assert.match(objectPopup, /Fiskerne/);
  assert.match(objectPopup, /Grass Roots Square/);

  await page.setViewportSize({ width: 390, height: 844 });
  await page.reload({ waitUntil: 'networkidle' });
  await page.waitForFunction(() => window.__auditReady === true);
  const mobileTabs = await page.locator('.hg-place-tabs').evaluate(el => ({ client: el.clientWidth, scroll: el.scrollWidth }));
  assert.ok(mobileTabs.scroll > mobileTabs.client);
  await page.locator('[data-place-tab="before-after"]').click();
  await page.waitForSelector('#hg-place-panel-before-after figure');
  const mobileColumns = await page.locator('.hg-place-before-after-media').evaluate(el => getComputedStyle(el).gridTemplateColumns.trim().split(/\s+/).length);
  assert.equal(mobileColumns, 1);
  assert.equal(await page.evaluate(() => document.documentElement.scrollWidth <= window.innerWidth + 2), true);

  const fagverk = await context.newPage();
  await fagverk.route('**/*', route => route.request().resourceType() === 'image' ? route.fulfill({ status: 200, contentType: 'image/png', body: png }) : route.continue());
  await fagverk.goto(`${base}/fagverk-sted.html?place=regjeringskvartalet`, { waitUntil: 'networkidle' });
  await fagverk.waitForSelector('#fagverkPlaceContent:not([hidden])');
  await fagverk.waitForSelector('#fagverkPlaceBadgePath:not([hidden])');
  assert.equal((await fagverk.textContent('#fagverkPlaceTitle')).trim(), 'Regjeringskvartalet');
  assert.equal(await fagverk.locator('#fagverkPlaceUnderbadges a').count(), 3);
  assert.ok(await fagverk.locator('#fagverkPlaceLenses article').count() >= 4);
  assert.ok(await fagverk.locator('#fagverkPlaceQuestions li').count() >= 4);
  assert.ok(await fagverk.locator('#fagverkPlaceChapters a').count() >= 1);
  assert.ok(await fagverk.locator('#fagverkPlaceConcepts a, #fagverkPlaceConcepts span').count() >= 1);
  assert.ok(await fagverk.locator('#fagverkPlaceEmners a, #fagverkPlaceEmners span').count() >= 3);
  assert.ok(await fagverk.locator('#fagverkPlaceSources a').count() >= 10);
  assert.equal(await fagverk.locator('#fagverkPlaceImage').isVisible(), true);
  assert.ok(await fagverk.locator('#fagverkPlaceImage').evaluate(img => img.naturalWidth) > 0);
  const unsafe = await fagverk.locator('#fagverkPlaceSources a').evaluateAll(links => links.filter(link => link.target !== '_blank' || !String(link.rel).includes('noopener') || !String(link.rel).includes('noreferrer')).length);
  assert.equal(unsafe, 0);
  const visibleText = await fagverk.locator('body').innerText();
  for (const forbidden of ['reports/', 'tests/', 'data/quiz/production_context', 'data/coordinate-evidence']) assert.equal(visibleText.includes(forbidden), false);
  await fagverk.setViewportSize({ width: 390, height: 844 });
  await fagverk.reload({ waitUntil: 'networkidle' });
  await fagverk.waitForSelector('#fagverkPlaceContent:not([hidden])');
  assert.equal(await fagverk.evaluate(() => document.documentElement.scrollWidth <= window.innerWidth + 2), true);

  await context.close();
  console.log('Regjeringskvartalet phase 13 Chromium audit: PASS');
} finally {
  if (browser) await browser.close();
  await new Promise(resolve => server.close(resolve));
}
'''
          (root / 'tests/regjeringskvartalet-ui-production-audit.test.mjs').write_text(test_source)

          workflow_path = root / '.github/workflows/place-rounds-governance.yml'
