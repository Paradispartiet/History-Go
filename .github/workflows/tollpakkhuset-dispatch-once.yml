name: Tollpakkhuset completion one-shot dispatch

on:
  push:
    branches: [agent/tollpakkhuset-completion-20260911-v2]
    paths:
      - ".github/workflows/tollpakkhuset-dispatch-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove dispatcher and publish clean repair head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tollpakkhuset-dispatch-once.yml
          git commit -m "Remove one-shot Tollpakkhuset dispatcher"
          git push origin HEAD:agent/tollpakkhuset-completion-20260911-v2

      - name: Dispatch Tollpakkhuset completion workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Paradispartiet/History-Go/actions/workflows/tollpakkhuset-completion.yml/dispatches \
            -d '{"ref":"agent/tollpakkhuset-completion-20260911-v2"}'
