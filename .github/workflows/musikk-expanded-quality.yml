name: Musikk expansion readiness

on:
  pull_request:
    paths:
      - 'data/fag/musikk/**'
      - 'data/fagverk/musikk/**'
      - 'data/places/musikk/**'
      - 'data/places/media/oslo/places_oslo_media/nrk_huset_marienlyst.json'
      - 'data/places/scenekunst/oslo/chateau_neuf.json'
      - 'reports/fagverk/musikk-subject-audit.json'
      - 'reports/fagverk/musikk-theory-integrity-audit.json'
      - 'reports/fagverk/musikk-legacy-theory-audit.json'
      - 'reports/fagverk/musikk-expanded-quality-audit.json'
      - 'reports/fagverk/fagverk-expanded-subject-by-subject-audit-v1.json'
      - 'scripts/audit-fagverk-musikk.mjs'
      - 'scripts/audit-fagverk-musikk-legacy-theory.mjs'
      - 'scripts/audit-fagverk-musikk-legacy-adjudication.mjs'
      - 'scripts/audit-musikk-source-refresh-place-case-expansion.mjs'
      - 'tools/audit-musikk-theory-integrity.mjs'
      - 'tools/audit-musikk-expanded-quality.mjs'
      - 'tests/fagverk-musikk.test.mjs'
      - 'tests/musikk-theory-integrity.test.mjs'
      - 'tests/musikk-expanded-quality.test.mjs'
      - '.github/workflows/musikk-expanded-quality.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  expansion-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Musikk post-completion whole-subject expansion proof
        run: |
          node --check scripts/audit-musikk-source-refresh-place-case-expansion.mjs
          node --check tools/audit-musikk-expanded-quality.mjs
          node scripts/audit-fagverk-musikk.mjs
          node tools/audit-musikk-theory-integrity.mjs
          node scripts/audit-fagverk-musikk-legacy-theory.mjs > /tmp/musikk-legacy-theory.json
          node scripts/audit-fagverk-musikk-legacy-adjudication.mjs > /tmp/musikk-legacy-adjudication.json
          node scripts/audit-musikk-source-refresh-place-case-expansion.mjs > /tmp/musikk-maintenance.json
          node tools/audit-musikk-expanded-quality.mjs
          node --test tests/fagverk-musikk.test.mjs tests/musikk-theory-integrity.test.mjs tests/musikk-expanded-quality.test.mjs
      - name: Preserve shared Fagverk contracts
        run: |
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
