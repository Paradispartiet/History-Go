name: Tollpakkhuset completion materialization

on:
  push:
    branches: [agent/tollpakkhuset-completion-20260911-v2]
    paths:
      - "tools/build-tollpakkhuset-completion.mjs"
      - ".github/workflows/tollpakkhuset-completion.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tollpakkhuset-completion-20260911-v2
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Configure git and integrate fresh main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Install dependencies
        run: npm ci

      - name: Capture quiz production baseline
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'scripts/audit-quiz-production-context.mjs';
          let src = fs.readFileSync(file, 'utf8');
          const replacements = [
            ['brief.profile_decision.profile', 'brief.profile_decision?.profile'],
            ['brief.profile_decision.set_count', 'brief.profile_decision?.set_count'],
            ['brief.profile_decision.questions_per_set', 'brief.profile_decision?.questions_per_set']
          ];
          for (const [from, to] of replacements) {
            const count = src.split(from).length - 1;
            if (count < 1) throw new Error(`Expected at least one audit match for ${from}; got ${count}`);
            src = src.split(from).join(to);
            console.log(`Patched ${count} occurrence(s): ${from}`);
          }
          fs.writeFileSync(file, src);
          const { auditQuizProductionContext } = await import(`./scripts/audit-quiz-production-context.mjs?baseline=${Date.now()}`);
          const report = await auditQuizProductionContext();
          fs.writeFileSync('/tmp/quiz-production-baseline.json', JSON.stringify(report, null, 2));
          console.log(`Quiz production baseline: ${report.failures.length} existing failure(s)`);
          NODE
          git checkout -- scripts/audit-quiz-production-context.mjs

      - name: Download verified source assets
        run: |
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Oslo_Tollbod_stenpakkhuset_rk_117572_IMG_2583.JPG' -o /tmp/tollpakkhuset-place.jpg
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Gad_Frederik_Clement_-_Johan_Henrik_Nebelong_-_Norsk_portrettarkiv_-_Riksantikvaren_-_N000136.jpg' -o /tmp/nebelong.jpg
          curl -L --fail --retry 3 'https://altinncdn.no/orgs/tad/tad.png' -o /tmp/tolletaten.png
          file /tmp/tollpakkhuset-place.jpg /tmp/nebelong.jpg /tmp/tolletaten.png

      - name: Repair quiz production contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'tools/build-tollpakkhuset-completion.mjs';
          let src = fs.readFileSync(file, 'utf8');
          const replaceExact = (from, to, label) => {
            const count = src.split(from).length - 1;
            if (count !== 1) throw new Error(`Expected exactly one match for ${label}; got ${count}`);
            src = src.replace(from, to);
            console.log(`Repaired ${label}`);
          };

          replaceExact(
            'phase: i === 0 ? "opening" : i === 1 ? "middle" : "final"',
            'phase: i === 0 ? "opening" : i === 1 ? "bridge" : "final"',
            '3-set phase progression'
          );
          replaceExact(
            'planned_phase: i < 7 ? "opening" : i < 14 ? "middle" : "final"',
            'planned_phase: i < 7 ? "opening" : i < 14 ? "bridge" : "final"',
            'claim phase progression'
          );

          replaceExact(
            'const contextFile = "data/quiz/production_context/naeringsliv/tollpakkhuset.json";',
            `const contextFile = "data/quiz/production_context/naeringsliv/tollpakkhuset.json";
const selectedCurriculum = {
  module_ids: ["arbeid_produksjon_verdiskaping", "kapital_eierskap_finans", "logistikk_infrastruktur_rom"],
  emne_ids: place.emne_ids,
  topic_hook_ids: ["arbeid_som_verdiskaping"],
  method_ids: ["met_naering_infrastrukturanalyse", "met_naering_arbeidslivsanalyse", "met_naering_byhistorisk_naeringsanalyse"],
  thinker_ids: ["adam_smith"],
  works: []
};
const existingQuizAudit = {
  searched_paths: ["data/quiz/manifest.json", "data/quiz/naeringsliv", placeFile],
  active_before: { finding: "Ingen aktiv canonical kildeledet 3x7-pakke for Tollpakkhuset var registrert før materialiseringen." },
  decisions: [
    "Materialiser én canonical narrow 3x7-pakke.",
    "Bevar de første fjorten spørsmålene som direkte stedskunnskap.",
    "Legg metode og eksplisitt teoribinding først i siste sett."
  ],
  knowledge_migration: "Alle 21 spørsmål får stabile claim- og Knowledge-identiteter i den canonicale pakken."
};
const profileDecision = {
  profile: "narrow",
  set_count: 3,
  questions_per_set: 7,
  justification: "Tre læringsjobber dekker bygg og varehåndtering, tidslag og institusjonsbruk samt avsluttende analyse av kapasitet, arbeid og ombruk uten å fylle med perifert stoff."
};
const heldBackCandidates = [
  "Å bruke antall vekter eller heiser som direkte mål på varevolum eller produktivitet.",
  "Å beskrive Tollpakkhuset som ordinært publikumsekspedisjonssted i 2026.",
  "Å slå Tollpakkhuset, Tollboden og Tollbukaia sammen til ett fysisk sted."
];`,
            'quiz audit metadata and selected curriculum'
          );

          replaceExact(
            '...(method_id ? { method_id } : {})',
            `...(method_id ? {
    method_id,
    guidance_basis: [
      "data/fag/naeringsliv/fagkart_naeringsliv_canonical_v4_5.json",
      "data/fag/naeringsliv/methods_naeringsliv_canonical_v4_5.json"
    ]
  } : {}),
  ...(n === 16 || n === 17 ? {
    topic_hook_id: "arbeid_som_verdiskaping",
    thinker_id: "adam_smith",
    theory_ref: {
      topic_hook_id: "arbeid_som_verdiskaping",
      thinker_id: "adam_smith",
      why_it_helps: "Arbeidsdeling og produktivitetsbegrepet gir et faglig rammeverk for å skille fysisk kapasitet fra faktisk output uten å gjøre utstyrstall til bevis for produktivitet."
    }
  } : {})`,
            'method guidance and late theory binding'
          );

          replaceExact(
            `    required_inputs_loaded: ["pensum", "emner", "fagkart", "methods", "supersetQuizMal", "quizStandard", "quizQuestionSchema"],
    emne_ids: place.emne_ids,
    method_ids: ["met_naering_infrastrukturanalyse", "met_naering_arbeidslivsanalyse", "met_naering_byhistorisk_naeringsanalyse"],
    thinker_ids: [],
    works: [],
    source_review_status: "reviewed",`,
            `    required_inputs_loaded: ["pensum", "emner", "fagkart", "methods", "supersetQuizMal", "quizStandard", "quizQuestionSchema"],
    pensum_module_ids: selectedCurriculum.module_ids,
    emne_ids: selectedCurriculum.emne_ids,
    topic_hook_ids: selectedCurriculum.topic_hook_ids,
    method_ids: selectedCurriculum.method_ids,
    thinker_ids: selectedCurriculum.thinker_ids,
    works: selectedCurriculum.works,
    source_review_status: "reviewed",
    existing_quiz_audit: existingQuizAudit,
    profile_decision: profileDecision,
    held_back_candidates: heldBackCandidates,`,
            'quiz production_context contract fields'
          );

          replaceExact(
            `  selected_curriculum: {
    module_ids: [], emne_ids: place.emne_ids, topic_hook_ids: [],
    method_ids: ["met_naering_infrastrukturanalyse", "met_naering_arbeidslivsanalyse", "met_naering_byhistorisk_naeringsanalyse"],
    thinker_ids: [], works: []
  },
  profile_hint: "narrow",`,
            `  selected_curriculum: selectedCurriculum,
  existing_quiz_audit: existingQuizAudit,
  profile_decision: profileDecision,
  held_back_candidates: heldBackCandidates,
  profile_hint: "narrow",`,
            'source brief profile contract fields'
          );

          fs.writeFileSync(file, src);
          console.log('Tollpakkhuset quiz production contract repaired: metadata, curriculum, guidance and late theory binding');
          NODE

      - name: Materialize Tollpakkhuset
        run: |
          node --check tools/build-tollpakkhuset-completion.mjs
          node tools/build-tollpakkhuset-completion.mjs

      - name: Validate Næringsliv production contract
        run: node scripts/audit-naeringsliv-place-production.mjs --all

      - name: Validate quiz manifest
        run: node scripts/audit-quiz-manifest-v2.mjs

      - name: Validate quiz production context against baseline
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'scripts/audit-quiz-production-context.mjs';
          let src = fs.readFileSync(file, 'utf8');
          const replacements = [
            ['brief.profile_decision.profile', 'brief.profile_decision?.profile'],
            ['brief.profile_decision.set_count', 'brief.profile_decision?.set_count'],
            ['brief.profile_decision.questions_per_set', 'brief.profile_decision?.questions_per_set']
          ];
          for (const [from, to] of replacements) {
            const count = src.split(from).length - 1;
            if (count < 1) throw new Error(`Expected at least one audit match for ${from}; got ${count}`);
            src = src.split(from).join(to);
            console.log(`Patched ${count} occurrence(s): ${from}`);
          }
          fs.writeFileSync(file, src);
          const { auditQuizProductionContext } = await import(`./scripts/audit-quiz-production-context.mjs?post=${Date.now()}`);
          const report = await auditQuizProductionContext();
          fs.writeFileSync('/tmp/quiz-production-post.json', JSON.stringify(report, null, 2));
          console.log(`Quiz production post-materialization: ${report.failures.length} failure(s)`);
          NODE
          git checkout -- scripts/audit-quiz-production-context.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const baseline = JSON.parse(fs.readFileSync('/tmp/quiz-production-baseline.json', 'utf8'));
          const post = JSON.parse(fs.readFileSync('/tmp/quiz-production-post.json', 'utf8'));
          const stable = (value) => {
            if (Array.isArray(value)) return `[${value.map(stable).join(',')}]`;
            if (value && typeof value === 'object') return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`;
            return JSON.stringify(value);
          };
          const baselineSet = new Set((baseline.failures || []).map(stable));
          const newFailures = (post.failures || []).filter((failure) => !baselineSet.has(stable(failure)));
          const tollpakkhusetFailures = (post.failures || []).filter((failure) => JSON.stringify(failure).toLowerCase().includes('tollpakkhuset'));
          console.log(`Quiz production baseline ${baseline.failures?.length || 0} → post ${post.failures?.length || 0}`);
          if (tollpakkhusetFailures.length) {
            console.error('Tollpakkhuset production-context failures:', JSON.stringify(tollpakkhusetFailures, null, 2));
            process.exit(1);
          }
          if (newFailures.length) {
            console.error('New quiz production-context failures introduced by materialization:', JSON.stringify(newFailures, null, 2));
            process.exit(1);
          }
          console.log('Quiz production context PASS: Tollpakkhuset clean and no baseline regressions');
          NODE

      - name: Validate quiz progression
        run: node scripts/audit-quiz-progression.mjs

      - name: Validate quiz theory binding
        run: node scripts/audit-quiz-theory-binding.mjs

      - name: Validate place runtime and collection contract
        run: |
          node scripts/build-place-open-payloads.mjs --check
          node --test tests/place-rounds-visual-collections.test.mjs tests/place-open-hyperfast.test.mjs

      - name: Validate canonical place data
        run: |
          npm run build:tools
          node dist/tools/check_place_emne_ids.mjs
          node dist/tools/check_duplicate_json_keys.mjs
          node dist/tools/check_stories_integrity.mjs

      - name: Validate no empty Tollpakkhuset collections
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('data/places/naeringsliv/oslo/places_naeringsliv_oslo_oppdag_kvadraturen_batch_04/tollpakkhuset.json','utf8'));
          const ids=p.place_card_profile?.collection_ids||[];
          if (JSON.stringify(ids)!==JSON.stringify(['people','objects','brands','productions'])) throw new Error(`unexpected collection_ids ${JSON.stringify(ids)}`);
          if (!p.related_people_ids?.includes('johan_henrik_nebelong')) throw new Error('Nebelong missing');
          if (!p.objects?.length || !p.productions?.length) throw new Error('object/production collection empty');
          const brands=JSON.parse(fs.readFileSync('data/brands/brands_by_place.json','utf8'));
          if (!(brands.tollpakkhuset||[]).includes('tolletaten')) throw new Error('Tolletaten brand missing');
          const runtime=JSON.parse(fs.readFileSync('data/runtime/place-open/tollpakkhuset.json','utf8'));
          if (!runtime.people?.some(x=>x.id==='johan_henrik_nebelong')) throw new Error('runtime People missing');
          if (!runtime.brands?.some(x=>x.id==='tolletaten')) throw new Error('runtime Brand missing');
          console.log('Tollpakkhuset four-collection membership PASS');
          NODE

      - name: Remove temporary materialization machinery
        run: |
          rm tools/build-tollpakkhuset-completion.mjs
          rm .github/workflows/tollpakkhuset-completion.yml

      - name: Commit verified Tollpakkhuset completion
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes to commit"
            exit 1
          fi
          git commit -m "Complete Tollpakkhuset production"
          git push origin HEAD:${GITHUB_REF_NAME}
