name: Split Innlandet batch 14

on:
  workflow_dispatch:
  push:
    branches:
      - data/split-innlandet-batch14-places

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/split-innlandet-batch14-places
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/split-historie-innlandet-batch14-places.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/historie/innlandet/places_historie_innlandet_batch14 data/places/historie/innlandet/places_historie_innlandet_batch14_manifest.json data/places/historie/innlandet/places_historie_innlandet_batch14_index.json data/places/historie/innlandet/places_historie_innlandet_batch14_split_report.txt
          git commit -m "Generate split Historie Innlandet batch 14 place files" || exit 0
          git push
