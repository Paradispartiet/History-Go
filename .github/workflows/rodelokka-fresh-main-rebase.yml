name: Rodeløkka fresh-main rebase

on:
  push:
    branches:
      - agent/rodelokka-production-replay-20260905

permissions:
  contents: write

jobs:
  rebase-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rodelokka-production-replay-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rebase on exact fresh main
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "af93d660f20404d6cf7860fa6a91e9193ec0e017"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rebase origin/main
      - name: Rebuild derived data in dependency order
        run: |
          npm run places:index:build
          npm run place-open:build
          npm run epoker:places:build
          npm run quiz:context -- --category by --target rodelokka --output data/quiz/production_context/by/rodelokka.json
      - name: Verify Rodeløkka production
        run: |
          node --test tests/rodelokka-completion.test.mjs
          npm run places:emner:check
          npm run check:stories
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-content
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run epoker:places:check
          npm run places:index:check
          npm run place-open:check
      - name: Commit clean fresh-main state
        run: |
          rm .github/workflows/rodelokka-fresh-main-rebase.yml
          git add -A
          git diff --cached --quiet || git commit -m "Replay Rodeløkka on fresh main"
          git push --force-with-lease origin HEAD:agent/rodelokka-production-replay-20260905
