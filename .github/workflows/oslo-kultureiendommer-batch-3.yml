name: Oslo kultureiendommer batch 3 coordinate lookup

on:
  push:
    branches:
      - agent/oslo-kultureiendommer-batch-3

permissions:
  contents: write

jobs:
  coordinates:
    if: github.event.head_commit.message != 'Save Oslo kultureiendommer batch 3 coordinates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-kultureiendommer-batch-3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Find and save Geonorge address candidates
        run: |
          mkdir -p reports/oslo-kultureiendommer-batch-3/coordinates

          npm run places:coords:find:address -- --address "Olaf Ryes plass 2 Oslo" \
            | tee reports/oslo-kultureiendommer-batch-3/coordinates/hauges-minde.json

          npm run places:coords:find:address -- --address "Lakkegata 79C Oslo" \
            | tee reports/oslo-kultureiendommer-batch-3/coordinates/slurpen.json
      - name: Commit coordinate reports
        run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add reports/oslo-kultureiendommer-batch-3/coordinates
          if git diff --cached --quiet; then
            echo "No coordinate report changes."
          else
            git commit -m "Save Oslo kultureiendommer batch 3 coordinates"
            git push
          fi
