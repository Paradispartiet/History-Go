name: VisitOSLO Grünerløkka coverage audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'data/visitoslo-grunerlokka-audit-20260721'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Audit source entries against current canonical index
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import re
          import unicodedata
          from difflib import SequenceMatcher
          from pathlib import Path

          root = Path('reports/visitoslo-grunerlokka-audit-20260721')
          source = json.loads((root / 'source.json').read_text())
          places = json.loads(Path('data/places/places_index.json').read_text())

          variants = {
              'Akerselva river': ['Akerselva'],
              'Sculpturestop - HEAD N.N.': ['HEAD N.N.', 'HEAD NNN', 'Marianne Heske HEAD'],
              'Paulus Church': ['Paulus kirke', 'Paulus Church'],
              'Torshovparken': ['Torshovparken', 'Torshov park'],
              'Atelier Nord': ['Atelier Nord'],
              'Sofienberg Park': ['Sofienbergparken', 'Sofienberg park'],
              'Hønse-Lovisas hus': ['Hønse-Lovisas hus'],
              'Purenkel': ['Purenkel'],
              'Labour Museum': ['Arbeidermuseet', 'Labour Museum'],
              'Jakob Culture Church': ['Kulturkirken Jakob', 'Jakob kulturkirke'],
              'Vulkan': ['Vulkan'],
              'Waterfall at Mølla': ['Møllafossen', 'Mølla foss', 'Øvre Foss'],
              'Anker bridge': ['Ankerbrua', 'Anker bridge'],
              'Birkelunden': ['Birkelunden']
          }

          def norm(value):
              value = unicodedata.normalize('NFKD', str(value)).encode('ascii', 'ignore').decode('ascii')
              value = value.casefold().replace('_', ' ')
              value = re.sub(r'[^a-z0-9]+', ' ', value)
              return ' '.join(value.split())

          place_rows = []
          for place in places:
              keys = {norm(place.get('id', '')), norm(place.get('name', ''))}
              for field in ('aliases', 'altNames', 'alternateNames'):
                  vals = place.get(field, [])
                  if isinstance(vals, str):
                      vals = [vals]
                  if isinstance(vals, list):
                      keys.update(norm(v) for v in vals)
              keys.discard('')
              place_rows.append((place, keys))

          results = []
          for entry in source['entries']:
              name = entry['name']
              queries = variants.get(name, [name])
              qnorms = {norm(q) for q in queries}
              exact = []
              scored = []
              for place, keys in place_rows:
                  if qnorms & keys:
                      exact.append({
                          'id': place.get('id'),
                          'name': place.get('name'),
                          'category': place.get('category'),
                          'sourceFile': place.get('sourceFile')
                      })
                  score = max(
                      SequenceMatcher(None, q, key).ratio()
                      for q in qnorms for key in keys
                  )
                  if score >= 0.42:
                      scored.append((score, place))
              scored.sort(key=lambda item: (-item[0], item[1].get('id', '')))
              top = []
              seen = set()
              for score, place in scored:
                  pid = place.get('id')
                  if pid in seen:
                      continue
                  seen.add(pid)
                  top.append({
                      'id': pid,
                      'name': place.get('name'),
                      'category': place.get('category'),
                      'score': round(score, 3),
                      'sourceFile': place.get('sourceFile')
                  })
                  if len(top) == 5:
                      break
              results.append({
                  'sourceName': name,
                  'queryVariants': queries,
                  'status': 'exact_or_alias_match' if exact else 'manual_review',
                  'exactMatches': exact,
                  'topCandidates': top
              })

          summary = {
              'sourceEntryCount': len(results),
              'exactOrAliasMatches': sum(r['status'] == 'exact_or_alias_match' for r in results),
              'manualReview': sum(r['status'] == 'manual_review' for r in results)
          }
          audit = {
              'source': source['source'],
              'summary': summary,
              'results': results
          }
          (root / 'audit.json').write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n')

          lines = [
              '# VisitOSLO Grünerløkka – canonical coverage audit',
              '',
              f"Source snapshot: {source['source']['capturedAt']}",
              f"Source entries: {summary['sourceEntryCount']}",
              f"Exact/alias matches before manual scope review: {summary['exactOrAliasMatches']}",
              f"Manual-review entries: {summary['manualReview']}",
              '',
              'This is a preliminary source-to-repository audit. Fuzzy candidates are not acceptance decisions; every unresolved entry requires identity and physical-scope review before production.',
              '',
              '| VisitOSLO entry | preliminary status | exact match(es) | strongest repository candidates |',
              '|---|---|---|---|'
          ]
          for result in results:
              exact_text = ', '.join(f"`{m['id']}`" for m in result['exactMatches']) or '—'
              candidate_text = ', '.join(
                  f"`{c['id']}` ({c['score']:.3f})" for c in result['topCandidates'][:3]
              ) or '—'
              lines.append(
                  f"| {result['sourceName']} | {result['status']} | {exact_text} | {candidate_text} |"
              )
          lines.extend([
              '',
              '## Representation gate',
              '',
              '- Reuse an existing canonical place when the VisitOSLO entry is the same physical place or an activity/feature already correctly anchored there.',
              '- Add a new canonical place only for a genuinely distinct, stable physical place.',
              '- Do not turn temporary events, generic itineraries or unsupported sub-features into standalone places.',
              '- Resolve coordinates only after identity and physical scope are locked.',
              ''
          ])
          (root / 'README.md').write_text('\n'.join(lines))
          PY

      - name: Remove one-shot workflow and commit audit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/visitoslo-grunerlokka-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Audit VisitOSLO Grünerløkka canonical coverage"
          git push origin HEAD:${{ github.head_ref }}
