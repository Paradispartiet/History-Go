name: Oslo coordinate batch 23 integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'agent/oslo-coordinate-control-batch-23'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run and save address-first lookups
        run: |
          set -o pipefail
          mkdir -p reports/oslo-coordinate-control-batch-23/lookups
          npm run places:coords:find:address -- --address "Haslevangen 16 Oslo" \
            | tee reports/oslo-coordinate-control-batch-23/lookups/vinmonopolet_lager-geonorge.json
          npm run places:coords:find:address -- --address "Dyvekes vei 2 Oslo" \
            | tee reports/oslo-coordinate-control-batch-23/lookups/jernbaneverkstedet_lodalen-geonorge.json
          npm run places:coords:find:address -- --address "Bankplassen 3 Oslo" \
            | tee reports/oslo-coordinate-control-batch-23/lookups/grunnlovsbygget_bankplassen-geonorge.json
      - name: Apply batch 23
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/tmp-complete-oslo-coordinate-batch23.mjs 2>&1 | tee /tmp/apply-batch23.log
      - name: Upload apply failure log
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch23-apply-log
          path: /tmp/apply-batch23.log
          if-no-files-found: error
      - name: Stop on apply failure
        if: steps.apply.outcome == 'failure'
        run: exit 1
      - name: Rebuild place index
        run: npm run places:index:build
      - name: Check place index
        run: npm run places:index:check
      - name: Check split manifest sync
        run: npm run audit:places-split-manifest-sync
      - name: Check coordinate quality
        run: npm run places:coords:quality
      - name: Check strict coordinate intake
        id: intake
        continue-on-error: true
        run: |
          COORD_INTAKE_BASE="$(git merge-base HEAD origin/main)" npm run places:coords:intake
      - name: Upload intake failure report
        if: steps.intake.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch23-intake-report
          path: reports/place-coordinate-intake-gate.md
          if-no-files-found: error
      - name: Stop on intake failure
        if: steps.intake.outcome == 'failure'
        run: exit 1
      - name: Check coordinate evidence
        id: evidence
        continue-on-error: true
        run: npm run places:coords:evidence:audit
      - name: Upload evidence failure report
        if: steps.evidence.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch23-evidence-report
          path: reports/coordinate-evidence-audit.md
          if-no-files-found: error
      - name: Stop on evidence failure
        if: steps.evidence.outcome == 'failure'
        run: exit 1
      - name: Check whitespace
        run: git diff --check
      - name: Remove temporary integration files
        run: |
          rm scripts/tmp-complete-oslo-coordinate-batch23.mjs
          rm .github/workflows/oslo-coordinate-batch23-lookups.yml
      - name: Commit integrated batch
        run: |
          git config user.name 'history-go-coordinate-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'Complete Oslo coordinate control batch 23'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
