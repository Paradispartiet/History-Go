          const path = require('path');
          const writeJson = (p, v) => { fs.mkdirSync(path.dirname(p), {recursive:true}); fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n'); };

          const sources = {
            ct_byleksikon: {url:'https://oslobyleksikon.no/side/Christiania_Torv', source_type:'local_history_encyclopedia', review_status:'reviewed', review_note:'Kontrollert 2026-08-23; hovedkilde for torgets funksjoner, marked, vannpost, straff, kirker, navn, rehabilitering og fontene.'},
            ct_oppdag: {url:'https://www.oppdagkvadraturen.no/stoppesteder/christiania-torv', source_type:'municipal_heritage_interpretation', review_status:'reviewed', review_note:'Kontrollert 2026-08-23; brukt for 1624-byflytting, civic sentrum og forskyvningen mot Stortorvet.'},
            ct_arch: {url:'https://www.oppdagkvadraturen.no/stoppesteder/christiania-torv-stil-og-arkitektur', source_type:'municipal_heritage_interpretation', review_status:'reviewed', review_note:'Kontrollert 2026-08-23; brukt for torgets form, plassering, rehabilitering og hanskefontenen.'},
            ct_history: {url:'https://www.oppdagkvadraturen.no/historien', source_type:'municipal_heritage_interpretation', review_status:'reviewed', review_note:'Kontrollert 2026-08-23; brukt for brannen i 1624, byflyttingen og reguleringen av Christiania.'},
            ct_snl: {url:'https://snl.no/Christiania_torg', source_type:'encyclopedia', review_status:'reviewed', review_note:'Kontrollert 2026-08-23 som uavhengig korroborasjon for sentrale navn- og historieopplysninger.'},
            ct_market: {url:'https://oslobyleksikon.no/side/Christianiamarkedet', source_type:'local_history_encyclopedia', review_status:'reviewed', review_note:'Kontrollert 2026-08-23 som korroborasjon for Christianiamarkedets plassering og flytting.'},
            stortorvet_byleksikon: {url:'https://oslobyleksikon.no/side/Stortorvet', source_type:'local_history_encyclopedia', review_status:'reviewed', review_note:'Kontrollert 2026-08-23 kun for eksplisitt sammenligning av funksjonsflyttingen fra Christiania Torv.'},
            bank_byleksikon: {url:'https://oslobyleksikon.no/side/Bankplassen', source_type:'local_history_encyclopedia', review_status:'reviewed', review_note:'Kontrollert 2026-08-23 kun for eksplisitt sammenligning mellom to separate Kvadraturen-plasser.'},
            ct_osm: {url:'https://www.openstreetmap.org/way/594329484', source_type:'geometry', review_status:'reviewed', review_note:'Verifisert 2026-07-19; brukes bare som geometri-/plassanker, ikke som historisk kilde.'}
