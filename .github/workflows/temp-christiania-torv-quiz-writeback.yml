          const E = {
            scene:'em_by_torg_plasser_som_scene',
            public:'em_by_offentlige_rom_motesteder',
            layers:'em_by_historiske_lag_i_hverdagsrom',
            reuse:'em_by_transformasjon_ombruk'
          };

          const qs = [
            ['Hva bestemte Christian IV etter storbrannen i 1624?',['Byen skulle flyttes til området ved Akershus festning','Byen skulle flyttes til Bygdøy','Byen skulle gjenreises uendret i middelalderbyen'],0,'Byflyttingen etter brannen endret Oslos bygeografi og la grunnlaget for Christiania ved festningen.','fact',E.layers,['ct_history','ct_oppdag'],'Etter storbrannen i 1624 bestemte Christian IV at byen skulle flyttes vestover til området ved Akershus festning og bygges som Christiania.'],
            ['Hva het den nye byen som ble anlagt ved festningen?',['Oslo Nova','Christiania','Akersborg'],1,'Navnet Christiania ble brukt om byen som ble anlagt etter flyttevedtaket i 1624.','fact',E.layers,['ct_history'],'Den flyttede byen fikk navnet Christiania.'],
            ['Når ble Hellig Trefoldighets kirke innviet ved torget?',['1624','1639','1697'],1,'Kirkeinnvielsen i 1639 viser hvor tidlig religiøs og offentlig funksjon ble samlet ved torget.','fact',E.layers,['ct_byleksikon','ct_snl'],'Hellig Trefoldighets kirke ble innviet ved Christiania Torv i 1639.'],
            ['Når sto Gamle Rådhus ferdig ved Christiania Torv?',['1641','1686','1736'],0,'Gamle Rådhus fra 1641 er et synlig spor etter torgets tidlige sivile tyngde.','fact',E.layers,['ct_byleksikon','ct_oppdag'],'Gamle Rådhus sto ferdig ved Christiania Torv i 1641.'],
            ['Hva het den offentlige vannposten midt på torget?',['Vandkunsten','Bybrønnen','Kongskilden'],0,'Vandkunsten var offentlig vannpost, og private ledninger kunne kobles til mot betaling.','fact',E.scene,['ct_byleksikon'],'Den offentlige vannposten midt på torget ble kalt Vandkunsten.'],
            ['Hva var «kaken» på Christiania Torv?',['En markedsbod','En påle med halsjern brukt ved offentlig pisking','En vannrenne'],1,'Kaken og gapestokken viser at offentlig straff var synlig i det samme rommet som handel og hverdagsliv.','fact',E.public,['ct_byleksikon'],'Kaken var en påle med halsjern som ble brukt ved offentlig pisking på torget.'],
            ['Når ble Christianiamarkedet flyttet fra torget til Stortorvet?',['1697','1736','1878'],1,'Flyttingen av markedet i 1736 var del av forskyvningen av sentrumsfunksjoner mot Stortorvet.','fact',E.scene,['ct_byleksikon','ct_market'],'Christianiamarkedet ble flyttet fra Christiania Torv til Stortorvet i 1736.'],

            ['Hva skjedde med Hellig Trefoldighets kirke i 1686?',['Den ble rådhus','Den brant ned','Den ble flyttet hel til Stortorvet'],1,'Kirkebrannen i 1686 bidro til at en ny domkirke senere ble reist ved Stortorvet.','fact',E.layers,['ct_byleksikon','ct_oppdag'],'Hellig Trefoldighets kirke brant ned i 1686.'],
            ['Hvor sto den nye domkirken ferdig i 1697?',['Ved Stortorvet','På Bankplassen','Ved Youngstorget'],0,'Den nye domkirken ved Stortorvet var et viktig ledd i forskyvningen av byens sentrum.','fact',E.layers,['ct_oppdag','stortorvet_byleksikon'],'Den nye domkirken sto ferdig ved Stortorvet i 1697.'],
            ['Hvilket navn ble torget senere kjent under etter at det mistet sentrale funksjoner?',['Gammel-Torvet','Nytorvet','Jernbanetorvet'],0,'Navneformen Gammel-Torvet peker på at andre plasser hadde overtatt flere sentrale funksjoner.','fact',E.layers,['ct_byleksikon'],'Christiania Torv ble senere omtalt som Byens gamle Torv eller Gammel-Torvet.'],
            ['Når ble Johannes kirke innviet ved torget?',['1736','1878','1929'],1,'Johannes kirke lå ved torget fra 1878 til 1929 på tomten etter Hellig Trefoldighets kirke.','fact',E.layers,['ct_byleksikon'],'Johannes kirke ble innviet ved torget i 1878 og sto der til 1929.'],
            ['Når ble navnet Christiania Torv vedtatt?',['1924','1958','1997'],1,'Navnevedtaket i 1958 er langt senere enn torgets etablering på 1600-tallet.','fact',E.layers,['ct_byleksikon','ct_snl'],'Navnet Christiania Torv ble vedtatt i 1958.'],
            ['Hva skjedde med torget i 1964?',['Det ble innhegnet og steinsatt og fikk ny vannkunst','Det ble gjort om til jernbanestasjon','Gamle Rådhus ble revet'],0,'1964-omformingen viser at dagens plass er resultat av flere moderne inngrep, ikke en urørt 1600-tallsflate.','fact',E.reuse,['ct_byleksikon'],'I 1964 ble torget innhegnet og steinsatt og fikk en ny vannkunst.'],
            ['Hvem laget fonteneskulpturen «Christian IVs hanske» fra 1997?',['Wenche Gulbransen','Gustav Vigeland','Per Palle Storm'],0,'Wenche Gulbransens verk gjør bygrunnleggelsesfortellingen synlig i dagens plassrom.','fact',E.public,['ct_byleksikon','ct_arch'],'Wenche Gulbransen laget fonteneskulpturen «Christian IVs hanske», som kom på torget i 1997.'],

            ['Hva ble torgets utforming tildelt i 2003?',['Oslo bys arkitekturpris','Houens fonds diplom','Sundts premie'],0,'Arkitekturprisen kom etter rehabiliteringen i 1990-årene og fontenen fra 1997.','fact',E.reuse,['ct_byleksikon'],'Utformingen av Christiania Torv ble tildelt Oslo bys arkitekturpris i 2003.'],
            ['Hvilke gater møtes ved Christiania Torv?',['Rådhusgata og Øvre Slottsgate','Karl Johans gate og Akersgata','Torggata og Storgata'],0,'Gatekrysset er en konkret del av den regulerte Kvadraturens lesbare geometri.','fact',E.scene,['ct_byleksikon','ct_osm'],'Rådhusgata og Øvre Slottsgate møtes ved Christiania Torv.'],
            ['Hvilket bygg fra 1641 står fortsatt ved torget?',['Gamle Rådhus','Johannes kirke','Hellig Trefoldighets kirke'],0,'Gamle Rådhus er et eget canonical Place, men fungerer som et synlig historisk anker ved torget.','fact',E.layers,['ct_byleksikon','ct_oppdag'],'Gamle Rådhus fra 1641 står fortsatt ved Christiania Torv.'],
            ['I hvilke måneder ble Christianiamarkedet holdt på torget?',['Januar og februar','Mai og juni','September og oktober'],0,'Det historiske markedet ble holdt vinterstid før det ble flyttet til Stortorvet i 1736.','fact',E.scene,['ct_byleksikon','ct_market'],'Christianiamarkedet ble holdt på torget i januar og februar.'],
            ['Hvilken kombinasjon beskriver best torgets tidlige funksjoner?',['Marked, vannforsyning og offentlig myndighet','Flyplass, havn og industri','Universitet, stadion og jernbane'],0,'Handel, infrastruktur og myndighetsutøvelse var samlet i samme plassrom.','fact',E.scene,['ct_byleksikon','ct_oppdag'],'Torget samlet marked, offentlig vannpost og offentlig myndighetsutøvelse i den tidlige byen.'],
            ['Hvorfor mistet Christiania Torv gradvis rollen som byens naturlige midtpunkt?',['Kirke- og markedsfunksjoner ble flyttet mot Stortorvet','Akershus festning ble flyttet','Torget ble oversvømt permanent'],0,'Både ny domkirke og marked ble flyttet mot Stortorvet, slik at tyngdepunktet i byen endret seg.','context',E.layers,['ct_oppdag','ct_byleksikon','stortorvet_byleksikon'],'Flytting av domkirke- og markedsfunksjoner mot Stortorvet bidro til at Christiania Torv mistet sin tidligere sentralitet.'],
            ['Hvorfor er Gamle Rådhus viktig for å lese torget uten at bygget og plassen blir samme sted?',['Bygget er et eget sted som viser en dokumentert funksjon ved torget','Bygget dekker hele torgets areal','Torget er bare et annet navn på rådhuset'],0,'Place-grensen gjør det mulig å bruke Gamle Rådhus som historisk relasjon uten å overta byggets egen identitet.','context',E.layers,['ct_byleksikon','ct_oppdag'],'Gamle Rådhus er et separat bygg ved torget og et synlig bevis på torgets tidlige sivile funksjon.'],

            ['Hva skiller Christiania Torvs historiske opphav tydeligst fra Bankplassens?',['Christiania Torv hører til 1624-byen, mens Bankplassen vokste fram etter fjerning av festningsverk på 1800-tallet','Begge ble anlagt samtidig i 1624','Bankplassen er middelalderens hovedtorg'],0,'De to plassene ligger nær hverandre, men tilhører ulike faser av byutviklingen og skal ikke slås sammen som én historisk flate.','comparison',E.layers,['ct_oppdag','bank_byleksikon'],'Christiania Torv inngår i byplanen etter 1624, mens Bankplassen vokste fram på frigjort areal etter fjerning av festningsverk fra 1820-årene.'],
            ['Hvilken rolle fikk Stortorvet i forhold til Christiania Torv?',['Det overtok sentrale kirke- og markedsfunksjoner','Det ble et militært fort','Det ble underjordisk vannreservoar'],0,'Stortorvet ble nytt tyngdepunkt for domkirke og marked, mens Christiania Torv senere ble omtalt som Gammel-Torvet.','context',E.layers,['ct_oppdag','stortorvet_byleksikon'],'Stortorvet overtok sentrale kirke- og markedsfunksjoner som tidligere var knyttet til Christiania Torv.'],
            ['Hvordan var Christiania Torv opprinnelig formet?',['Tilnærmet kvadratisk','Som en lang, smal gate','Som en rund park'],0,'Den tilnærmet kvadratiske formen inngikk i den regulerte renessansebyen.','fact',E.scene,['ct_arch'],'Christiania Torv hadde opprinnelig en tilnærmet kvadratisk form.'],
            ['Hvis du teller hvor folk stopper, sitter og passerer på torget i dag, hvilken metode bruker du?',['Feltobservasjon','Radiokarbondatering','Tekstkritisk stemmaanalyse'],0,'Feltobservasjon skiller faktisk bruk av et byrom fra det man bare antar ut fra plan eller form.','observation',E.public,['ct_osm','ct_arch'],'Dagens plass kan undersøkes ved systematisk feltobservasjon av hvor mennesker stopper, sitter og beveger seg.'],
            ['Hvilket synlig element binder dagens plass til bygrunnleggelsesfortellingen?',['Fonteneskulpturen «Christian IVs hanske»','Johannes kirke som fortsatt står','En bevart gapestokk fra 1600-tallet'],0,'Hansken er et moderne kunstverk fra 1997 som formidler en fortelling om bygrunnleggelsen; den er ikke bevis for selve hanskekastet.','observation',E.public,['ct_byleksikon','ct_arch'],'Fonteneskulpturen «Christian IVs hanske» er et synlig moderne anker for fortellingen om bygrunnleggelsen.'],
            ['Hvorfor er Vandkunsten viktig for å forstå torget som mer enn et representativt sentrum?',['Den viser at torget også var praktisk infrastruktur for vannforsyning','Den gjorde torget til havn','Den var bare dekorasjon uten bruksfunksjon'],0,'Vannposten viser at sentrale byrom også løste hverdagslige infrastrukturoppgaver.','context',E.scene,['ct_byleksikon'],'Vandkunsten gjorde torget til praktisk infrastruktur fordi borgere kunne hente vann og legge private ledninger derfra.'],
            ['Hva viser plasseringen av gapestokk, kake og rettersted om offentlig myndighet?',['Straff og maktutøvelse var synlig i det samme hverdagsrommet som handel','All straff foregikk skjult utenfor byen','Torget hadde ingen offentlig myndighetsfunksjon'],0,'Det offentlige rommet var også en scene for makt og sosial kontroll, ikke bare handel og møte.','context',E.public,['ct_byleksikon'],'Offentlig straff på torget gjorde myndighetsutøvelse synlig i et felles byrom.'],

            ['Hva menes med å lese Christiania Torv som et byrom med historiske lag?',['At ulike funksjoner fra ulike perioder kan spores i samme plassrom','At alle bygninger er fra samme år','At torget aldri har endret bruk'],0,'Historiske lag handler om at samme sted kan romme spor etter skiftende funksjoner, former og institusjoner.','concept',E.layers,['ct_byleksikon','ct_oppdag'],'Christiania Torv har historiske lag fra civic sentrum, marked og myndighet til trafikk, rehabilitering og offentlig kunst.'],
            ['Hva gjør Christiania Torv til et godt eksempel på et flerfunksjonelt offentlig rom?',['Handel, religion, infrastruktur og myndighet har vært samlet rundt samme plass','Plassen har alltid hatt én eneste funksjon','Plassen mangler dokumenterte offentlige funksjoner'],0,'Et offentlig rom kan ha flere funksjoner samtidig og skifte tyngde over tid.','concept',E.public,['ct_byleksikon','ct_oppdag'],'Christiania Torv samlet flere offentlige og hverdagslige funksjoner i samme plassrom.'],
            ['William H. Whyte er opptatt av faktisk bruk av plasser. Hva kan den tilnærmingen hjelpe deg å undersøke på Christiania Torv?',['Om folk faktisk oppholder seg der form og møblering inviterer til det','Om Christian IV personlig tegnet alle fasadene','Om torget ligger over havnivå'],0,'Whytes byromslesning er nyttig når man sammenholder fysisk utforming med observerbar bruk, framfor å anta bruk ut fra planen alene.','concept',E.public,['ct_arch','ct_osm'],'Torgets fysiske utforming kan sammenholdes med faktisk observerbar bruk av plassrommet.'],
            ['Hva er den sterkeste Whyte-inspirerte testen av en påstand om at fontenen skaper opphold?',['Observer systematisk hvor folk faktisk stopper over tid','Anta at alle fontener skaper opphold','Les bare fontenens tittel'],0,'En observasjonsbasert test gjør forskjell på designintensjon og faktisk bruk.','analysis',E.public,['ct_arch','ct_osm'],'Påstander om hvordan et plassgrep påvirker opphold bør testes mot faktisk observerbar bruk.'],
            ['Hvilken sammenligning mellom Christiania Torv og Bankplassen er kildebelagt?',['De representerer ulike byutviklingsfaser: 1624-byen og 1800-tallets frigjorte festningsareal','Begge ble etablert som samme markedsplass','Bankplassen erstattet Christiania Torv i 1736'],0,'Nærhet i Kvadraturen betyr ikke samme historiske identitet; de to plassene kan nettopp brukes til å lese forskjellige byutviklingsfaser.','comparison',E.layers,['ct_oppdag','bank_byleksikon'],'Christiania Torv og Bankplassen er separate plassrom fra ulike historiske faser.'],
            ['Hvilken rekkefølge gir den mest presise syntesen av torgets utvikling?',['1624-byens civic kjerne → funksjoner flyttes mot Stortorvet → moderne rehabilitering og offentlig kunst','1997-fontene → middelalderby → 1639-kirke','Bankplassen → jernbanestasjon → havn'],0,'Torgets historie er ikke lineær vekst: sentralitet flyttes bort, og senere rehabilitering gjør eldre byform og nye lag lesbare samtidig.','context',E.layers,['ct_history','ct_oppdag','ct_byleksikon','ct_arch'],'Torgets dokumenterte utvikling går fra 1624-byens civic kjerne via funksjonsforskyvning til moderne rehabilitering og offentlig kunst.'],
