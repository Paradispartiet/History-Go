              decisions:['Opprett én canonical By-quiz for torget; ikke gjenbruk Gamle Rådhus-quiz som proxy.','Bruk fem kildebårne læringsjobber og 5×7, ikke et fast volumkrav.','Første 14 spørsmål er direkte, normale og kildebelagte.','Teori og metode kommer først i bridge/final og er bundet til konkrete plassfakta.'],
