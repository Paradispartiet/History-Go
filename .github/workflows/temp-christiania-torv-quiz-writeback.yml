          ];

          const phases = ['opening','middle','middle','bridge','final'];
          const claims = qs.map((q,i)=>({claim_id:`claim_christiania_torv_quiz_${i+1}`,order:i+1,planned_phase:phases[Math.floor(i/7)],family:q[5],statement:q[8],source_ids:q[7],source_origin:q[5]==='observation'?'external':'external',emne_id:q[6]}));
          const sourceBrief = {
            schema_version:'1.0',status:'reviewed',categoryId:'by',targetId:'christiania_torv',reviewed_at:'2026-08-23',
