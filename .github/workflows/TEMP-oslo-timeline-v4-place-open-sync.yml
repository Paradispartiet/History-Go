name: TEMP Oslo timeline v4 place-open sync

on:
  push:
    branches:
      - agent/oslo-timeline-anchors-v4-20260826

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate place-open runtime
        shell: bash
        run: |
          npm run place-open:build
          echo 'Generated diff:'
          git status --short
          bad="$(git diff --name-only | grep -v '^data/runtime/' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected non-runtime generator changes:"
            echo "$bad"
            exit 1
          fi
      - name: Verify runtime and timeline contracts
        shell: bash
        run: |
          npm run place-open:check
          npm run test:place-open
          node scripts/build-epoke-place-index.mjs --check
          node --test tests/epoke-place-index.test.mjs tests/oslo-medieval-timeline-v4.test.mjs
          git diff --check
      - name: Commit deterministic runtime sync and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/TEMP-oslo-timeline-v4-place-open-sync.yml
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add data/runtime .github/workflows/TEMP-oslo-timeline-v4-place-open-sync.yml
          git diff --cached --check
          echo 'Permanent sync diff:'
          git diff --cached --name-status
          unexpected="$(git diff --cached --name-only | grep -v '^data/runtime/' | grep -v '^.github/workflows/TEMP-oslo-timeline-v4-place-open-sync.yml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected permanent files:"
            echo "$unexpected"
            exit 1
          fi
          git commit -m "Sync Gamlebyen leksikon runtime"
          git push origin HEAD:agent/oslo-timeline-anchors-v4-20260826
