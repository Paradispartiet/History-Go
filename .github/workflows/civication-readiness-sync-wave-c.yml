name: Civication readiness sync Wave C
on:
  push:
    branches:
      - civication/wave-c-story-content-20261018
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate readiness files and remove one-shot workflow
        run: |
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
          rm .github/workflows/civication-readiness-sync-wave-c.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/Civication/roleWorldRolloutReadiness.json reports/civication-role-world-rollout-readiness.md .github/workflows/civication-readiness-sync-wave-c.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(civication): sync role world readiness after Wave C'
          git push
