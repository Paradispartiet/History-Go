name: Temporary Ekebergparken Museum coordinate intake

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  intake:
    if: github.head_ref == 'data/oslo-ekebergparken-museum-coordinate-intake'
    runs-on: ubuntu-latest
    steps:
      - name: Check out intake branch
        uses: actions/checkout@v4
        with:
          ref: data/oslo-ekebergparken-museum-coordinate-intake
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run and save Geonorge address lookup
        shell: bash
        run: |
          set -euo pipefail
          REPORTDIR="reports/visitoslo-oslo-east-audit-20260720/ekebergparken-museum"
          mkdir -p "$REPORTDIR"
          npm run places:coords:find:address -- --address "Kongsveien 23 Oslo" \
            2>&1 | tee "$REPORTDIR/geonorge-address-lookup.txt"

      - name: Parse coordinate and physical scope gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          from pathlib import Path

          reportdir = Path('reports/visitoslo-oslo-east-audit-20260720/ekebergparken-museum')
          text = (reportdir / 'geonorge-address-lookup.txt').read_text()
          start = text.find('{\n')
          if start < 0:
              raise SystemExit('No JSON object found in Geonorge lookup output')
          lookup = json.loads(text[start:])
          if not lookup.get('ok') or lookup.get('status') != 'verified_candidate':
              raise SystemExit(f'Geonorge lookup not verified: {lookup}')

          coord = lookup['coordinate']
          lat, lon = coord['lat'], coord['lon']
          index = json.loads(Path('data/places/places_index.json').read_text())

          def haversine(lat1, lon1, lat2, lon2):
              R = 6371000
              p1, p2 = math.radians(lat1), math.radians(lat2)
              dp = math.radians(lat2-lat1)
              dl = math.radians(lon2-lon1)
              a = math.sin(dp/2)**2 + math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*R*math.asin(math.sqrt(a))

          keyword_matches = []
          for p in index:
              hay = ' '.join(str(p.get(k, '')) for k in ('id','name','desc')).lower()
              if ('ekebergparken museum' in hay or 'lunds villa' in hay or 'lunds hus' in hay or 'kongsveien 23' in hay):
                  keyword_matches.append({k:p.get(k) for k in ('id','name','category','lat','lon')})

          nearby = []
          for p in index:
              if isinstance(p.get('lat'), (int,float)) and isinstance(p.get('lon'), (int,float)):
                  d = haversine(lat, lon, p['lat'], p['lon'])
                  if d <= 350:
                      nearby.append({
                          'id': p.get('id'), 'name': p.get('name'), 'category': p.get('category'),
                          'distanceMeters': round(d, 1)
                      })
          nearby.sort(key=lambda x: x['distanceMeters'])

          decision = {
              'version': '2026-07-20-address-first-clean',
              'placeId': 'ekebergparken_museum',
              'candidateName': 'Ekebergparken Museum',
              'status': 'verified_address_candidate',
              'productionGate': 'ready_for_canonical_production' if not keyword_matches else 'manual_duplicate_review_required',
              'primaryCategory': 'historie',
              'identity': {
                  'currentName': 'Ekebergparken Museum',
                  'buildingName': 'Lunds villa / Lunds hus',
                  'currentAddress': 'Kongsveien 23, Oslo',
                  'distinctFrom': 'Ekebergparken skulpturpark as a broad area marker',
                  'summary': 'Eget fysisk museum, besøkssenter, butikk og administrasjonsbygg i den historiske Lunds villa, med utstillinger om Ekebergs kulturhistorie og natur.'
              },
              'coordinate': coord,
              'source': {
                  'sourceProvider': lookup['sourceProvider'],
                  'sourceName': lookup['sourceName'],
                  'sourceUrl': lookup['sourceUrl'],
                  'sourceObjectId': lookup['sourceObjectId']
              },
              'duplicateGate': {
                  'canonicalIdentityMatches': keyword_matches,
                  'nearbyWithin350m': nearby,
                  'conclusion': 'No museum/Lunds villa identity match exists in the current canonical index.' if not keyword_matches else 'Potential identity match requires review.'
              },
              'scopeDecision': 'The museum is a separate addressable building and visitor institution. Existing `ekebergparken` remains the broad sculpture-park area anchor and must not move to the museum address.',
              'categoryDecision': 'Primary category `historie`: the museum exhibitions focus on Ekeberg area cultural history and nature. Art remains a secondary layer through its institutional relation to the sculpture park.',
              'guardrails': [
                  'Do not move or replace the existing `ekebergparken` area anchor.',
                  'Do not merge the museum into `ekebergrestauranten` or another nearby Ekeberg building.',
                  'Do not describe the museum as the indoor home of the park sculpture collection; its documented exhibition focus is history and nature.'
              ]
          }
          (reportdir / 'coordinate-decision.json').write_text(json.dumps(decision, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(decision, ensure_ascii=False, indent=2))
          PY

      - name: Commit durable intake and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-ekebergparken-museum-coordinate-intake.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record Ekebergparken Museum address-first intake"
          git push origin HEAD:data/oslo-ekebergparken-museum-coordinate-intake
