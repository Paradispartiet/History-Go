name: Finalize Vitenskap canonical v4.6

on:
  push:
    branches:
      - agent/vitenskap-university-breadth-reconciliation
    paths:
      - '.github/workflows/vitenskap-v4_6-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitenskap-university-breadth-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconcile internal v4.6 metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'data/fag/vitenskap/vitenskappensum_canonical_v4_6.json';
          const p = JSON.parse(fs.readFileSync(file, 'utf8'));
          p.canonical_registry_version = 'vitenskappensum_v4_6';
          p.canonical_files = {
            ...(p.canonical_files || {}),
            fagkart: 'fagkart_vitenskap_canonical_v4_6.json',
            methods: 'methods_vitenskap_canonical_v4_6.json',
            emner: 'emner_vitenskap_canonical_v4_6.json',
            emnemapping: 'emnemapping_vitenskap_canonical_v4_6.json',
            pensum: 'vitenskappensum_canonical_v4_6.json'
          };
          delete p.files;
          fs.writeFileSync(file, JSON.stringify(p, null, 2) + '\n');
          NODE
      - name: Reconcile shared v4.6 regression expectations
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const replaceOnce = (file, before, after) => {
            let source = fs.readFileSync(file, 'utf8');
            if (!source.includes(before)) throw new Error(`${file}: mangler forventet gammel verdi ${before}`);
            source = source.replace(before, after);
            fs.writeFileSync(file, source);
          };
          replaceOnce(
            'tests/fagverk-subject-inventory.test.mjs',
            "assert.equal(vitenskap.nextGate, 'university_breadth_gap_reconciliation_and_remaining_chapter_production');",
            "assert.equal(vitenskap.nextGate, 'remaining_chapter_production_across_reconciled_university_breadth');"
          );
          replaceOnce('tests/fagverk-general-engine.test.mjs', 'assert.equal(vitenskap.emneCount, 93);', 'assert.equal(vitenskap.emneCount, 117);');
          replaceOnce('tests/fagverk-general-engine.test.mjs', 'assert.equal(vitenskap.mappingCount, 93);', 'assert.equal(vitenskap.mappingCount, 117);');
          replaceOnce('tests/fagverk-general-engine.test.mjs', 'assert.equal(vitenskap.hookCount, 60);', 'assert.equal(vitenskap.hookCount, 64);');
          NODE
      - name: Regenerate deterministic Science and shared reports
        run: |
          node scripts/audit-fagverk-vitenskap-breadth-reconciliation.mjs --write-report --no-check-report
          node scripts/audit-fagverk-vitenskap-pilot.mjs --write-report --no-check-report
          node scripts/audit-fagverk-vitenskap-university-readiness.mjs --write-report --no-check-report
          node scripts/audit-fagverk-subject-inventory.mjs --write-report --no-check-report
          node scripts/audit-fagverk-general-engine.mjs --write-report --no-check-report
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate permanent Science gates
        run: |
          node scripts/audit-fagverk-vitenskap-breadth-reconciliation.mjs
          node scripts/audit-fagverk-vitenskap-pilot.mjs
          node scripts/audit-fagverk-vitenskap-university-readiness.mjs
          node scripts/audit-fagverk-vitenskap-unit1.mjs
          node --test tests/fagverk-vitenskap-breadth-reconciliation.test.mjs
          node --test tests/fagverk-vitenskap-pilot.test.mjs
          node --test tests/fagverk-vitenskap-university-readiness.test.mjs
          node --test tests/fagverk-vitenskap-unit1.test.mjs
      - name: Validate shared Fagverk and nested Technology
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
          node --test tests/vitenskap-teknologi-category-contract.test.mjs
          node tools/build-teknologi-editorial-v3.mjs --check
          node tools/validate-teknologi-foundation.mjs
          node tools/validate-teknologi-quality-v2_1.mjs
          node tools/validate-teknologi-ontology-v2_2.mjs
          node tools/validate-teknologi-evidence-v2_3.mjs
          node scripts/validate-teknologi-editorial-v3.mjs
          git diff --check
      - name: Commit canonical v4.6 finalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/fag/vitenskap/vitenskappensum_canonical_v4_6.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/vitenskap-breadth-reconciliation-audit.json \
            reports/fagverk/vitenskap-pilot-audit.json \
            reports/fagverk/vitenskap-university-readiness-audit.json \
            reports/fagverk/subject-baseline.json \
            reports/fagverk/general-engine-audit.json \
            tests/fagverk-subject-inventory.test.mjs \
            tests/fagverk-general-engine.test.mjs
          if git diff --cached --quiet; then
            echo 'No generated finalization changes.'
          else
            git commit -m 'Finalize Vitenskap canonical v4.6 audit state'
            git push origin HEAD:agent/vitenskap-university-breadth-reconciliation
          fi
