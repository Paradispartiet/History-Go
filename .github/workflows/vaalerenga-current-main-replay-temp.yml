name: TEMP Vålerenga current-main replay

on:
  push:
    branches:
      - agent/vaalerenga-replay-main-20260905

permissions:
  contents: write

jobs:
  replay:
    if: github.event.head_commit.message == 'Run fail-closed current-main Vålerenga replay'
    runs-on: ubuntu-latest
    env:
      LOCKED_MAIN: 0b704807b6272a9a0e8df28daee0d0965ac086a9
      OLD_BASE: de937ab02a273f7a3831424a4e6252078a2f4a44
      FINAL_VAALERENGA: be862d68e1ebbb12e9e124d4720123bc5d66c5e9
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/vaalerenga-replay-main-20260905
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Lock current main and source refs
        run: |
          git fetch origin main "$OLD_BASE" "$FINAL_VAALERENGA"
          test "$(git rev-parse origin/main)" = "$LOCKED_MAIN"
          git merge-base --is-ancestor "$LOCKED_MAIN" HEAD
          test "$(git diff --name-only "$OLD_BASE" "$FINAL_VAALERENGA" | wc -l | tr -d ' ')" = "51"
          test -z "$(git diff --name-only "$OLD_BASE" "$FINAL_VAALERENGA" | grep -Ei '(^data/coordinate-evidence/|(^|/)[^/]*coordinate[^/]*$)' || true)"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Replay non-shared verified Vålerenga delta
        run: |
          git diff --binary "$OLD_BASE" "$FINAL_VAALERENGA" -- . \
            ':(exclude)data/Civication/historyPeople_index.json' \
            ':(exclude)data/Civication/scenarioPeople/generated/by.json' \
            ':(exclude)data/Civication/scenarioPeople_index.json' \
            ':(exclude)data/brands/brands_by_place.json' \
            ':(exclude)data/brands/brands_master.json' \
            ':(exclude)data/epoker/epoke-place-index.json' \
            ':(exclude)data/fag/fag_manifest.json' \
            ':(exclude)data/fagverk/fagverk_registry.json' \
            ':(exclude)data/fagverk/fagverk_release.json' \
            ':(exclude)data/knowledge/knowledge_units.generated.json' \
            ':(exclude)data/leksikon/manifest.json' \
            ':(exclude)data/lesespor/oslo/lesespor_oslo_by.json' \
            ':(exclude)data/people/manifest.json' \
            ':(exclude)data/places/place_image_backlog_summary.json' \
            ':(exclude)data/places/places_index.json' \
            ':(exclude)data/quiz/manifest.json' \
            ':(exclude)data/quiz/production_context/by/vaalerenga.json' \
            ':(exclude)data/runtime/lesespor-all.json' \
            ':(exclude)data/runtime/people-all/part-007.json' \
            ':(exclude)data/runtime/place-open/vaalerenga.json' \
            ':(exclude)data/runtime/stories-all/part-004.json' \
            ':(exclude)data/runtime/stories-all/part-005.json' \
            ':(exclude)data/stories/stories_episode_v1_manifest.json' \
            ':(exclude)data/stories/stories_manifest.json' \
            ':(exclude)reports/fagverk/fagverk-place-page-coverage-v2.json' \
            ':(exclude)reports/knowledge-contract-audit.json' \
            ':(exclude)reports/knowledge-id-backfill.json' \
            ':(exclude)reports/quiz_manifest_v2_audit_report.json' \
            ':(exclude)tests/epoke-place-index.test.mjs' > /tmp/vaalerenga.patch
          git apply --3way --index /tmp/vaalerenga.patch
          test -f data/places/production/vaalerenga.json
          test -f data/quiz/by/vaalerenga_sets.json
          git diff --check

      - name: Semantic merge shared registries
        run: |
          node .tmp/vaalerenga-current-main-helper.mjs merge "$OLD_BASE" "$FINAL_VAALERENGA" \
            data/brands/brands_by_place.json \
            data/brands/brands_master.json \
            data/fag/fag_manifest.json \
            data/fagverk/fagverk_registry.json \
            data/leksikon/manifest.json \
            data/lesespor/oslo/lesespor_oslo_by.json \
            data/people/manifest.json \
            data/quiz/manifest.json \
            data/stories/stories_episode_v1_manifest.json \
            data/stories/stories_manifest.json
          git add data/brands/brands_by_place.json data/brands/brands_master.json data/fag/fag_manifest.json data/fagverk/fagverk_registry.json data/leksikon/manifest.json data/lesespor/oslo/lesespor_oslo_by.json data/people/manifest.json data/quiz/manifest.json data/stories/stories_episode_v1_manifest.json data/stories/stories_manifest.json
          git diff --cached --check

      - name: Apply minimal Place-description governance repair
        run: |
          node .tmp/vaalerenga-current-main-helper.mjs repair
          node scripts/validate-place-description-production-v4_2_policy.mjs --all --report /tmp/vaalerenga-description.json
          git add data/places/by/oslo/places/vaalerenga.json data/places/production/vaalerenga.json
          git diff --cached --check

      - name: Regenerate canonical and runtime derivatives
        run: |
          npm run places:index:build
          npm run civication:history-people:build
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
          npm run place-open:build
          npm run epoker:places:build
          npm run quiz:context -- --category by --target vaalerenga --output data/quiz/production_context/by/vaalerenga.json
          npm run knowledge:canonical:write
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/vaalerenga-place-images.json
          node .tmp/vaalerenga-current-main-helper.mjs backlog /tmp/vaalerenga-place-images.json
          git show "$LOCKED_MAIN:data/epoker/epoke-place-index.json" > /tmp/locked-epoke-place-index.json
          node .tmp/vaalerenga-current-main-helper.mjs sync-history /tmp/locked-epoke-place-index.json
          git checkout "$LOCKED_MAIN" -- reports/knowledge-contract-audit.json
          git add -A
          git diff --cached --check

      - name: Remove coordinate-named generated drift outside verified delta
        run: |
          mapfile -t coordinate_files < <(git diff --cached --name-only "$LOCKED_MAIN" | grep -Ei '(^data/coordinate-evidence/|(^|/)[^/]*coordinate[^/]*$)' || true)
          printf 'Coordinate-like candidate paths outside the verified Vålerenga source delta:\n'
          printf '%s\n' "${coordinate_files[@]}"
          for file in "${coordinate_files[@]}"; do
            test -n "$file" || continue
            if git cat-file -e "$LOCKED_MAIN:$file" 2>/dev/null; then
              git checkout "$LOCKED_MAIN" -- "$file"
            else
              rm -f -- "$file"
            fi
          done
          git add -A
          test -z "$(git diff --cached --name-only "$LOCKED_MAIN" | grep -Ei '(^data/coordinate-evidence/|(^|/)[^/]*coordinate[^/]*$)' || true)"
          git diff --cached --check

      - name: Validate focused Vålerenga contracts
        run: |
          npm run build:tools --silent
          node dist/tools/check_stories_integrity.mjs
          node --test tests/vaalerenga-completion.test.mjs
          node scripts/validate-place-description-production-v4_2_policy.mjs --all --report /tmp/vaalerenga-description-after.json
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-content
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run knowledge:canonical:check
          npm run civication:history-people:check
          npm run places:index:check
          node scripts/build-fagverk-release-manifest.mjs --check
          node scripts/audit-place-images.mjs --mode=changed

      - name: Validate shared runtime contracts
        run: |
          node --test tests/place-language-layer.test.mjs tests/place-language-dialect-scope.test.mjs tests/place-popup-direct-tabs.test.mjs tests/place-popup-all-direct-tabs-visible.test.mjs
          npm run epoker:places:check
          node --test tests/epoke-place-index.test.mjs tests/epoker-runtime-place-index.test.mjs tests/epoke-viewer.test.mjs
          npm run place-open:check
          npm run test:place-open

      - name: Remove temporary replay machinery
        run: |
          rm -f .github/workflows/vaalerenga-current-main-replay-temp.yml
          rm -f .tmp/vaalerenga-current-main-helper.mjs
          rm -f .tmp/vaalerenga-current-main-replay-trigger
          rmdir .tmp 2>/dev/null || true
          git add -A
          git diff --cached --check
          test ! -e .github/workflows/vaalerenga-current-main-replay-temp.yml
          test ! -e .tmp/vaalerenga-current-main-helper.mjs
          test ! -e .tmp/vaalerenga-current-main-replay-trigger

      - name: Create local verified candidate
        run: |
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete verified Vålerenga Place production on current main'

      - name: Validate PR isolation and repository hygiene on candidate
        run: |
          git diff --name-only "$LOCKED_MAIN"...HEAD
          node scripts/validate-place-description-production-v4_2_policy.mjs --changed --base "$LOCKED_MAIN" --head HEAD
          REPO_HYGIENE_BASE_SHA="$LOCKED_MAIN" REPO_HYGIENE_HEAD_SHA="$(git rev-parse HEAD)" node scripts/audit-repository-hygiene-v1.mjs
          npm run knowledge:canonical:check
          git diff --check "$LOCKED_MAIN" HEAD

      - name: Recheck exact main
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$LOCKED_MAIN"

      - name: Push permanent candidate
        run: git push origin HEAD:agent/vaalerenga-replay-main-20260905
