name: Place rounds governance

on:
  pull_request:
    paths:
      - "js/ui/place-rounds-visual-collections.js"
      - "js/ui/place-rounds-fill-layout.js"
      - "js/ui/place-card.js"
      - "css/place-rounds-fill-layout.css"
      - "js/ui/place-card-status-surface.js"
      - "tests/place-rounds-visual-collections.test.mjs"
      - "tests/place-rounds-grid-exclusivity.test.mjs"
      - "tests/place-rounds-fill-layout.test.mjs"
      - "tests/place-card-rounds-runtime-audit.test.js"
      - "data/places/README_place_rounds.md"
      - "docs/PLACE_PRODUCTION_CHECKLIST.md"
      - "docs/PLACE_STANDARD.md"
      - "docs/PLACE_POPUP_SYSTEM.md"
      - "docs/DATA_PRODUCTION_CONTRACT.md"
      - "docs/HISTORY_GO_PRODUCT_MAP.md"
      - "schemas/place.ts"
      - ".github/workflows/place-rounds-governance.yml"
  push:
    branches: [main]
    paths:
      - "js/ui/place-rounds-visual-collections.js"
      - "js/ui/place-rounds-fill-layout.js"
      - "js/ui/place-card.js"
      - "css/place-rounds-fill-layout.css"
      - "js/ui/place-card-status-surface.js"
      - "tests/place-rounds-visual-collections.test.mjs"
      - "tests/place-rounds-grid-exclusivity.test.mjs"
      - "tests/place-rounds-fill-layout.test.mjs"
      - "tests/place-card-rounds-runtime-audit.test.js"
      - "data/places/README_place_rounds.md"
      - "docs/PLACE_PRODUCTION_CHECKLIST.md"
      - "docs/PLACE_STANDARD.md"
      - "docs/PLACE_POPUP_SYSTEM.md"
      - "docs/DATA_PRODUCTION_CONTRACT.md"
      - "docs/HISTORY_GO_PRODUCT_MAP.md"
      - "schemas/place.ts"
      - ".github/workflows/place-rounds-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-rounds:
    name: Visual round contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test canonical four-round contract
        run: |
          node --test tests/place-rounds-visual-collections.test.mjs tests/place-rounds-grid-exclusivity.test.mjs tests/place-rounds-fill-layout.test.mjs
          node tests/place-card-rounds-runtime-audit.test.js
