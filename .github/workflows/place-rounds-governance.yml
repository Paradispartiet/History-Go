      - "reports/place-production/olaf-ryes-plass-*"
      - ".github/workflows/place-rounds-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-rounds:
    name: Visual round contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for PlaceCard UI audits
        run: npx playwright install --with-deps chromium

      - name: Test canonical adaptive PlaceCard plus Badges contract
        run: |
          node --check js/ui/place-popup-tabs.js
          node --check js/ui/nature-detailed-map.js
          node --test tests/place-rounds-visual-collections.test.mjs tests/place-rounds-grid-exclusivity.test.mjs tests/place-rounds-fill-layout.test.mjs tests/place-card-profile-schema.test.mjs tests/christiania-torv-placecard-collections-v2.test.mjs tests/bankplassen-place-completion-v1.test.mjs tests/nature-detailed-map.test.mjs
          node tests/place-card-rounds-runtime-audit.test.js
          node tests/place-people-ids-runtime.test.js
          node tests/nationaltheatret-people-curation.test.js
          node tests/tinghuset-rounds-completion.test.mjs
          node --test tests/oslo-tinghuset-before-after-phase.test.mjs tests/oslo-tinghuset-news-phase.test.mjs tests/oslo-tinghuset-reading-phase.test.mjs tests/oslo-tinghuset-sources-phase.test.mjs tests/oslo-tinghuset-more-phase.test.mjs tests/oslo-tinghuset-people-phase.test.mjs tests/oslo-tinghuset-objects-phase.test.mjs
          node --test tests/regjeringskvartalet-before-after-phase.test.mjs tests/regjeringskvartalet-news-phase.test.mjs tests/regjeringskvartalet-reading-phase.test.mjs tests/regjeringskvartalet-sources-phase.test.mjs tests/regjeringskvartalet-more-phase.test.mjs tests/regjeringskvartalet-objects-phase.test.mjs tests/regjeringskvartalet-brands-phase.test.mjs
          node --test tests/regjeringskvartalet-quiz-completion.test.mjs
          node --test tests/regjeringskvartalet-people-expansion.test.mjs
          node --test tests/regjeringskvartalet-checklist-completion.test.mjs
          node --test tests/regjeringskvartalet-image-gates.test.mjs
          node --test tests/place-production-brand-quiz-governance.test.mjs
          node tests/regjeringskvartalet-ui-production-audit.test.mjs
          node tests/christiania-torv-placecard-collections-v2-browser-audit.test.mjs
          node tests/place-card-fullness-all-categories-browser-audit.test.mjs
          node tests/bankplassen-place-completion-v1-browser-audit.test.mjs
          node --test tests/brugata-storgata-rusmiljo-full-completion.test.mjs
          node --test tests/olaf-ryes-plass-completion.test.mjs tests/place-quizcards-category-manifests.test.mjs
