name: Place rounds governance

on:
  pull_request:
    paths:
      - "js/ui/place-rounds-visual-collections.js"
      - "tests/place-rounds-visual-collections.test.mjs"
      - "tests/place-rounds-grid-exclusivity.test.mjs"
      - "data/places/README_place_rounds.md"
      - "schemas/place.ts"
      - ".github/workflows/place-rounds-governance.yml"
  push:
    branches: [main]
    paths:
      - "js/ui/place-rounds-visual-collections.js"
      - "tests/place-rounds-visual-collections.test.mjs"
      - "tests/place-rounds-grid-exclusivity.test.mjs"
      - "data/places/README_place_rounds.md"
      - "schemas/place.ts"
      - ".github/workflows/place-rounds-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-rounds:
    name: Visual round contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test 4/6 visual round contract
        run: node --test tests/place-rounds-visual-collections.test.mjs tests/place-rounds-grid-exclusivity.test.mjs
