name: TEMP Klubbmenneske source materialization

on:
  push:
    branches:
      - agent/civication-sport-klubbmenneske-role-world-20260913

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[klubbmenneske-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/civication-sport-klubbmenneske-role-world-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Regenerate life-position readiness
        run: |
          node scripts/audit-civication-life-position-role-world-readiness.mjs --write
          node scripts/audit-civication-life-position-role-world-readiness.mjs --check
      - name: Verify Klubbmenneske became source-ready
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('data/Civication/lifePositionRoleWorldReadiness.json','utf8'));
          const r = a.positions.find(x => x.key === 'sport/klubbmenneske');
          if (!r) throw new Error('sport/klubbmenneske missing');
          if (r.classification !== 'ready') throw new Error('expected ready, got '+r.classification);
          if (r.authored_depth.max_narrative_depth !== 14) throw new Error('expected depth 14, got '+r.authored_depth.max_narrative_depth);
          if (!r.evidence.exact_source_refs.includes('data/Civication/narratives/leisure/sport_klubbmenneske.json')) throw new Error('exact source missing');
          if (a.first_ready?.key !== 'sport/klubbmenneske') throw new Error('Klubbmenneske not first_ready');
          console.log('Klubbmenneske source readiness verified');
          NODE
      - name: Commit generated readiness
        run: |
          if git diff --quiet -- data/Civication/lifePositionRoleWorldReadiness.json reports/civication-life-position-role-world-readiness.md; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/lifePositionRoleWorldReadiness.json reports/civication-life-position-role-world-readiness.md
          git commit -m "Regenerate Klubbmenneske readiness [klubbmenneske-generated]"
          git push origin HEAD:agent/civication-sport-klubbmenneske-role-world-20260913
