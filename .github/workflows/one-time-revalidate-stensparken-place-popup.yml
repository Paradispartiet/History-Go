name: One-time revalidate Stensparken place popup

on:
  push:
    branches:
      - agent/stensparken-place-popup-system
    paths:
      - .github/workflows/one-time-revalidate-stensparken-place-popup.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out synchronized popup branch
        uses: actions/checkout@v4
        with:
          ref: agent/stensparken-place-popup-system
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild derived place index
        run: npm run places:index:build

      - name: Validate popup, places and documentation
        run: |
          node --check js/ui/place-popup-v2.js
          node --test tests/place-popup-v2.test.js tests/place-popup-type-sections.test.js
          npm run places:index:check
          npm run health:places
          npm run build:scripts
          node dist/scripts/check-documentation-governance.mjs
          npm run build:web:check

      - name: Commit refreshed outputs and remove runner
        run: |
          git restore --staged --worktree reports 2>/dev/null || true
          git clean -fd reports/documentation-governance 2>/dev/null || true
          git rm .github/workflows/one-time-revalidate-stensparken-place-popup.yml
          git add data/places/places_index.json

          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Revalidate structured place popup on latest main"
          git push origin HEAD:agent/stensparken-place-popup-system
