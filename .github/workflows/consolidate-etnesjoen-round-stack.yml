name: Consolidate Etnesjoen round stack

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - agent/merge-etnesjoen-round-stack-runner

permissions:
  contents: write

jobs:
  consolidate:
    if: github.head_ref == 'agent/merge-etnesjoen-round-stack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Merge validated stack onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "History GO data bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin agent/fill-etnesjoen-bmx-skate-rounds-batch1

          OURS="$(git rev-parse HEAD)"
          TOP="$(git rev-parse origin/agent/fill-etnesjoen-bmx-skate-rounds-batch1)"
          BASE="$(git merge-base "$OURS" "$TOP")"
          printf '%s\n' "$BASE" > /tmp/hg-base
          printf '%s\n' "$OURS" > /tmp/hg-ours
          printf '%s\n' "$TOP" > /tmp/hg-theirs

          git merge --no-ff --no-commit "$TOP" || true

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          BASE = Path('/tmp/hg-base').read_text().strip()
          OURS = Path('/tmp/hg-ours').read_text().strip()
          THEIRS = Path('/tmp/hg-theirs').read_text().strip()
          MISSING = object()

          def show(ref, path):
              proc = subprocess.run(['git', 'show', f'{ref}:{path}'], capture_output=True)
              if proc.returncode != 0:
                  return MISSING
              return proc.stdout.decode('utf-8')

          def item_key(rows):
              candidates = ('id', 'place_id', 'path', 'entity_id', 'emne_id', 'file', 'name')
              dicts = [row for row in rows if isinstance(row, dict)]
              for candidate in candidates:
                  if dicts and all(candidate in row for row in dicts):
                      return candidate
              return None

          def merge3(base, ours, theirs):
              if theirs == base:
                  return ours
              if ours == base:
                  return theirs
              if ours == theirs:
                  return ours
              if base is MISSING:
                  return ours if ours is not MISSING else theirs
              if theirs is MISSING:
                  return MISSING if ours == base else ours
              if ours is MISSING:
                  return theirs

              if isinstance(base, dict) and isinstance(ours, dict) and isinstance(theirs, dict):
                  result = dict(ours)
                  for key in set(base) | set(theirs):
                      merged = merge3(base.get(key, MISSING), ours.get(key, MISSING), theirs.get(key, MISSING))
                      if merged is MISSING:
                          result.pop(key, None)
                      else:
                          result[key] = merged
                  return result

              if isinstance(base, list) and isinstance(ours, list) and isinstance(theirs, list):
                  combined = base + ours + theirs
                  key = item_key(combined)
                  if key:
                      bmap = {row[key]: row for row in base if isinstance(row, dict) and key in row}
                      omap = {row[key]: row for row in ours if isinstance(row, dict) and key in row}
                      tmap = {row[key]: row for row in theirs if isinstance(row, dict) and key in row}
                      order = [row[key] for row in ours if isinstance(row, dict) and key in row]
                      result_map = dict(omap)
                      for marker, trow in tmap.items():
                          if marker not in bmap:
                              if marker not in result_map:
                                  order.append(marker)
                              result_map[marker] = trow
                          elif trow != bmap[marker]:
                              orow = omap.get(marker, MISSING)
                              merged = merge3(bmap[marker], orow, trow)
                              if merged is MISSING:
                                  result_map.pop(marker, None)
                              else:
                                  if marker not in result_map:
                                      order.append(marker)
                                  result_map[marker] = merged
                      for marker, brow in bmap.items():
                          if marker not in tmap and omap.get(marker, MISSING) == brow:
                              result_map.pop(marker, None)
                      return [result_map[marker] for marker in order if marker in result_map]

                  if all(not isinstance(v, (dict, list)) for v in combined):
                      result = list(ours)
                      for value in theirs:
                          if value not in base and value not in result:
                              result.append(value)
                      for value in base:
                          if value not in theirs and value in result and ours == base:
                              result.remove(value)
                      return result

                  return ours

              # Preserve current main when both sides changed the same scalar.
              return ours

          proc = subprocess.run(['git', 'diff', '--name-only', '--diff-filter=U'], capture_output=True, text=True, check=True)
          unresolved = [line.strip() for line in proc.stdout.splitlines() if line.strip()]
          print('Initial unresolved paths:', unresolved)

          for path in unresolved:
              if not path.endswith('.json'):
                  continue
              base_text = show(BASE, path)
              ours_text = show(OURS, path)
              theirs_text = show(THEIRS, path)
              base = MISSING if base_text is MISSING else json.loads(base_text)
              ours = MISSING if ours_text is MISSING else json.loads(ours_text)
              theirs = MISSING if theirs_text is MISSING else json.loads(theirs_text)
              merged = merge3(base, ours, theirs)
              target = Path(path)
              if merged is MISSING:
                  if target.exists():
                      target.unlink()
                  subprocess.run(['git', 'rm', '-f', '--ignore-unmatch', path], check=True)
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(json.dumps(merged, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
                  subprocess.run(['git', 'add', path], check=True)
              print('Semantically resolved JSON:', path)
          PY

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo "Unresolved non-JSON paths:"
            printf '%s\n' "$remaining"
            exit 1
          fi

          git diff --check

      - name: Validate consolidated stack
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            tests/etnesjoen-art-batch1-round-content.test.js \
            tests/etnesjoen-river-batch1-round-content.test.js \
            tests/etnesjoen-media-batch1-round-content.test.js \
            tests/etnesjoen-dojo-batch1-round-content.test.js \
            tests/etnesjoen-idrettsanlegg-batch1-round-content.test.js \
            tests/etnesjoen-tennis-batch1-round-content.test.js \
            tests/etnesjoen-bmx-skate-batch1-round-content.test.js \
            tests/place-card-rounds-runtime-audit.test.js \
            tests/place-card-leksikon-content-audit.test.js \
            tests/etne-people-manifest-integration.test.js; do
            [ -f "$test" ] && node "$test"
          done
          npm ci
          npx tsc -p tsconfig.tools.json
          npx tsc -p tsconfig.web.json
          git diff --check

      - name: Commit clean consolidation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Consolidate Etnesjoen round content stack"
          git push origin HEAD:agent/merge-etnesjoen-round-stack
