name: Temporary Regissør Role World authoring

on:
  push:
    branches:
      - civication/scenekunst-regissor-role-world
    paths:
      - .github/workflows/tmp-regissor-author.yml

permissions:
  contents: write

jobs:
  author-verify-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Author and materialize Regissør
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>{fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n')};
          const streamPath='data/Civication/narratives/leisure/scenekunst_regissor.json';
          const worldPath='data/Civication/roleWorlds/scenekunst/scenekunst_regissor.json';
          const lifeKey='scenekunst/regissor';
          const lifeScope='scenekunst_regissor';
          const storyData=[
            ['lesningen_som_blir_hypotese','Dramaturgen','En tydelig lesning er fortsatt bare en lesning',['Du har formulert en sterk retning for scenen, og teamet begynner å omtale den som verkets egentlige mening.','Regiarbeid trenger en arbeidshypotese som kan organisere prøven uten å gjøre tolkning til oppdaget sannhet.','Regissørens autoritet ligger i å ramme en undersøkelse og ta avgrensede valg, ikke i å eie betydningen alene.'],'Formuler hva lesningen forklarer, hva den ikke forklarer, og bygg neste prøve rundt ett konkret spørsmål.','Presenter lesningen som den endelige meningen slik at teamet slipper å bruke tid på alternative retninger.',['interpretive_humility','rehearsal_question'],'Prøven får en tydelig retning som fortsatt kan korrigeres.','En arbeidshypotese blir gjort til kunstnerisk fasit før den er prøvd.'],
            ['noten_som_blir_dom','Utøveren','En reginote treffer identiteten, ikke handlingen',['En utøver får beskjed om å være mer interessant i en scene som fortsatt er uklar.','Reginoter virker best når de peker mot observerbar handling, relasjon eller rytme framfor personlighet og verdi.','Språket i prøverommet er også makt: presisjon kan redusere både skam og lydighet uten forståelse.'],'Oversett noten til en konkret handling eller relasjon som kan prøves og be utøveren beskrive hva som faktisk endrer seg.','Gjenta karakterdommen sterkere slik at utøveren forstår hvilket nivå du forventer.',['note_discipline','performer_agency'],'Noten blir prøvbar og utøverens faglige respons blir en del av evidensen.','Uklart språk får høyere trykk i stedet for høyere presisjon.'],
            ['grensen_i_den_intime_scenen','Utøveren','Scenen krever nærhet uten at regi kan eie kroppen',['En scene innebærer fysisk nærhet som må kunne repeteres presist over tid.','Kunstnerisk intensjon kan ikke brukes som erstatning for konkret samtykke, avtalte grenser og mulighet til å endre løsning.','Regissøren må kunne holde scenens funksjon tydelig uten å gjøre kroppslig tilgjengelighet til lydighetskrav.'],'Skill scenens dramatiske funksjon fra den konkrete fysiske løsningen, avklar grenser og prøv et reelt alternativ.','Be utøverne gjennomføre den planlagte nærheten først og ta grensene når scenen allerede fungerer.',['embodied_consent','direction_boundary'],'Scenens funksjon kan undersøkes uten at én fysisk løsning blir tvangsmessig premiss.','Kunstnerisk framdrift brukes til å utsette samtykke og alternativtenkning.'],
            ['blokkeringen_som_moter_rommet','Teknisk partner','Den sceniske ideen kolliderer med rommets faktiske grenser',['En sentral plassering gir dårlig sikt og skaper en teknisk konflikt i rommet.','Regi organiserer oppmerksomhet i et konkret rom; siktlinjer, sikkerhet og teknisk gjennomførbarhet er kunnskap, ikke bare service rundt ideen.','Tilpasning bør være sporbar slik at tekniske grenser ikke kamufleres som smak.'],'Kartlegg hvilke funksjoner plasseringen skulle løse, og prøv en ny løsning som bevarer de viktigste relasjonene.','Be teknikken kompensere rundt den opprinnelige plasseringen fordi det kunstneriske valget kom først.',['spatial_evidence','collaboration_boundary'],'Rommet blir en del av den sceniske tenkningen i stedet for en skjult motstander.','Førsterett i prosessen forveksles med overordnet beslutningsmyndighet.'],
            ['teksten_som_motsetter_seg_konseptet','Dramatikeren','Konseptet forklarer ikke lenger teksten',['Flere prøver viser at enkelte tekstpartier bare fungerer når utøverne arbeider mot den opprinnelige regihypotesen.','Et regikonsept er et verktøy for lesning og struktur, ikke et krav om at all evidens skal passe inn.','Når motfunn gjentar seg, må konseptet kunne endres uten at prosessen mister retning.'],'Dokumenter motfunnene, nedgrader den gamle hypotesen og prøv en revidert struktur på neste gjennomløp.','Behold konseptet og juster utøvernes arbeid til avvikene slutter å være synlige.',['textual_counterevidence','concept_reversibility'],'Regien beholder retning ved å være korrigerbar mot gjentatte motfunn.','Konseptlojalitet blir viktigere enn det arbeidet faktisk viser.'],
            ['designet_som_blir_reginote','Designpartneren','Et visuelt samarbeid har to faglige eiere',['Du ønsker en sterk scenisk kontrast og begynner å spesifisere designløsningen detalj for detalj.','Regi kan definere dramaturgisk funksjon, rytme og relasjon uten automatisk å eie det andre fagets metode og løsning.','Et godt grensesnitt gjør intensjon, begrensning og beslutningsansvar synlig.'],'Beskriv funksjonen du trenger, vis hvilke sceniske konsekvenser som er kritiske, og la designpartneren svare med løsninger.','Detaljstyr løsningen fordi helheten til slutt er regissørens ansvar.',['discipline_interface','shared_authorship'],'Samarbeidet får et tydelig problem å løse uten at faggrensene blir slettet.','Helhetsansvar blir brukt som begrunnelse for å overta et annet fags metode.'],
            ['proven_som_endrer_tempoet','Utøveren','Det planlagte tempoet finnes ikke i kroppen',['En scene er tenkt rask, men gjentatte gjennomløp viser at relasjonen mister lesbarhet når tempoet presses.','Prøven produserer situert evidens om timing, oppmerksomhet og handling, men ett gjennomløp er ikke en universell fasit.','Regissøren må skille ønsket effekt fra den første mekanismen som skulle skape den.'],'Navngi effekten du trenger, endre én temporal variabel og sammenlign to gjennomløp før du låser tempoet.','Be utøverne repetere raskere til den opprinnelige tidsplanen sitter.',['rehearsal_evidence','effect_mechanism_split'],'Tempoet blir et undersøkbart virkemiddel, ikke et lydighetsmål.','Den første mekanismen blir forvekslet med selve scenens hensikt.'],
            ['uenigheten_i_proverommet','Medregissøren','To lesninger konkurrerer om samme scene',['En fagfelle mener scenen krever en annen relasjonell akse enn den du har arbeidet med.','Regifaglig uenighet kan være kvalitetskontroll dersom argumentene bindes til observasjon og konsekvens framfor status.','Det formelle mandatet, der det finnes, avgjør hvem som tar sluttvalget, men ikke hvem som har rett til å produsere motfunn.'],'Formuler begge lesningene som prøvbare hypoteser og avklar hvem som faktisk har beslutningsmandat etter prøven.','Bruk Regissør-identiteten som grunn til å avslutte diskusjonen før alternativet prøves.',['peer_challenge','mandate_separation'],'Uenigheten blir produktiv uten å gjøre autoritet usynlig.','Identitet brukes som erstatning for både evidens og faktisk avtalt mandat.'],
            ['vikaren_som_trenger_struktur','Produksjonslederen','En utøver må inn uten å arve hele prosessen',['Kort før visning må en ny utøver inn i flere scener med lite tid til å forstå alle tidligere valg.','Regikunnskap ligger i relasjoner, handlinger, rytme, notater og kroppslig hukommelse; et sent handoff må prioritere det som faktisk bærer scenen.','Fullstendig prosesshistorie er mindre nyttig enn tydelige ankerpunkter, sikkerhetsgrenser og restusikkerhet.'],'Lag et prioritert handoff med scenefunksjon, relasjonelle ankerpunkter, trygge forenklinger og hva som fortsatt er åpent.','Krev at vikaren kopierer originalutøveren så nøyaktig som mulig for å spare tid.',['handoff_priority','role_transfer'],'Den nye utøveren får et realistisk arbeidsgrunnlag uten å bli redusert til kopi.','Likhet i overflate blir brukt som snarvei rundt forståelse og ny kroppslig evidens.'],
            ['forhandsvisningen_som_blir_folkeavstemning','Dramaturgen','Ett publikum blir gjort til alle publikummere',['En liten forhåndsvisning reagerer tydelig på én scene, og teamet vil straks endre hele sekvensen.','Publikumsrespons er situert data: sammensetning, kontekst og spørsmål påvirker hva den kan fortelle.','Regi må kunne ta mottak på alvor uten å gjøre en liten responsflate til plebisitt over verket.'],'Sorter reaksjonene etter hva de faktisk viser, velg ett spørsmål og prøv en avgrenset endring før større omskriving.','Behandle den tydeligste reaksjonen som representativ og bygg resten av forestillingen rundt den.',['audience_evidence','sampling_humility'],'Responsen åpner en kontrollert ny undersøkelse.','Et lite rom får ubegrunnet representativitet over hele verket.'],
            ['fristen_som_laser_scenen','Produksjonslederen','En produksjonsfrist gjør et utkast dyrt å endre',['Tekniske fag trenger stabile cues før flere regispørsmål er ferdig undersøkt.','Produksjonsavhengigheter er reelle og kan kreve midlertidige låser uten å gjøre scenen kunstnerisk endelig.','Tydelig versjonering må skille hva som er låst, hvorfor, og hvem som eier neste mulige endring.'],'Marker hvilke valg som låses av produksjonsbehov, hvilke som fortsatt er reversible, og hva en senere endring faktisk vil koste.','Kall hele scenen ferdig slik at ingen andre trenger å forholde seg til usikkerheten.',['production_lock','rework_visibility'],'Teamet får et stabilt arbeidsgrunnlag uten at usikkerheten forsvinner fra historikken.','Et operativt behov blir omskrevet til kunstnerisk sluttpunkt.'],
            ['programteksten_som_gjor_regien_allmektig','Kommunikasjonsansvarlig','Offentlig tekst overdriver regissørens eierskap',['Programteksten beskriver forestillingen som regissørens visjon selv om tekst, utøverarbeid, dramaturgi og design har formet resultatet vesentlig.','Offentlig forenkling kan gjøre faktisk medskaping usynlig og flytte attribusjon oppover i hierarkiet.','Regissørrollen må kunne være tydelig uten å absorbere andres opphav og faglige bidrag.'],'Omskriv teksten slik at regiansvaret er tydelig samtidig som sentrale opphav og medskapende bidrag forblir synlige.','Behold formuleringen fordi publikum trenger én tydelig kunstnerisk avsender.',['public_credit','attribution_trace'],'Regiansvar og kollektivt arbeid kan beskrives samtidig.','Kommunikativ enkelhet kjøpes ved å gjøre andres arbeid usynlig.'],
            ['proven_som_folger_hjem','Nærpersonen','Prøverommet fortsetter i hodet etter arbeidstid',['Du merker at du fortsatt analyserer utøvernes valg, konflikter og feil lenge etter at prøven er slutt.','Regiarbeid kan gjøre andre menneskers uttrykk og sårbarhet til kontinuerlig mentalt materiale; grenseløs beredskap svekker både relasjon og neste dags oppmerksomhet.','Privatlivet må kunne romme presset uten at fortrolig prøveinnhold eller ubetalt reservearbeid blir normalen.'],'Beskriv presset uten å dele fortrolige detaljer, legg bort notatene og bestem når neste arbeidsøkt faktisk begynner.','Fortsett å analysere hjemme fordi helhetsansvar betyr at regissøren aldri kan koble av.',['private_containment','invisible_work'],'En tydelig slutt beskytter både fortrolighet og neste dags faglige presisjon.','Helhetsansvar blir gjort til permanent personlig beredskap.'],
            ['sesongslutt_hva_er_en_regissor','Regissørkollegaen','Hva slags myndighet følger egentlig Regissør-identiteten?',['Etter to uker har du formulert hypoteser, gitt prøvbare noter, organisert oppmerksomhet, håndtert motfunn og koordinert faglige grensesnitt.','Regissør er her en employment-independent directing_practice_or_livelihood: Badge-identiteten kan eksistere som praksis eller levevei uten arbeidsgiveransettelse eller institusjonelt mandat.','Formell Regissør-jobb krever fortsatt appointment_required; livsposisjonen gjør deg ikke automatisk til Dramaturg, Koreograf, Skuespiller / danser, Produsent, Scenekunstkurator eller Kunstnerisk leder.'],'Oppsummer praksisen som korrigerbar scenisk ledelse, prøvbar kommunikasjon, synlig attribusjon og tydelig mandatgrense, og la formell myndighet følge faktisk avtale.','Bruk Badge-identiteten som bevis på at du kan styre utøvere, fagpartnere, produksjon og offentlig kommunikasjon uten særskilt mandat.',['role_boundary','employment_independence'],'Rollen blir tydelig som praksis og mulig levevei uten å late som den gir institusjonell fullmakt.','Identitet glir over i ubegrunnet arbeidsgiver- og beslutningsmyndighet.']
          ];
          const storylets=storyData.map(x=>({id:x[0],message_type:'decision',time_slot:['people','personal'],from:x[1],subject:x[2],situation:x[3],choices:[{id:'A',label:x[4],effect:1,tags:x[6],feedback:x[7]},{id:'B',label:x[5],effect:-1,tags:x[6].map(t=>t+'_failure'),feedback:x[8]}],opens_streams:[],adds_flags:['regissor_'+x[0]],risk_links:['reputation_risk','relationship_risk'],links:[]}));
          const stream={schema:'civication_narrative_stream_v1',id:'scenekunst_regissor_stream',type:'leisure',title:'Regissør — prøvbar scenisk ledelse, utøveragency, samarbeid og mandatgrense',sociological_theme:'scenekunst_regissor_tolkingshypotese_provbar_reginote_utoveragency_samtykke_romlig_evidens_faggrense_proveevidens_publikumsmottak_produksjonslas_kreditering_privatarbeid_og_mandatseparasjon',applies_when:{any_tags:['scenekunst:regissor']},time_slots:['personal','home','people','leisure'],storylets};
          write(streamPath,stream);
          const manifest=read('data/Civication/narratives/manifest.json');manifest.streams=manifest.streams.filter(x=>x.id!==stream.id&&x.path!==streamPath);manifest.streams.push({id:stream.id,path:streamPath});write('data/Civication/narratives/manifest.json',manifest);
          const themeIds=['professional_culture','invisible_work','loyalty_up_down','public_attention','shame_reputation','public_private_leakage','local_knowledge_vs_system'];
          const people=[
            ['elin_utover','Utøver som gjør handling, samtykke, relasjon og faktisk prøveevidens synlig når regikonseptet blir for abstrakt.','kunstnerisk utøver','høy situert troverdighet om egen kropp og spillhandling','kan sette grenser for egen kropp og levere faglige motfunn, men kan ikke alene definere hele verkets regi','at noter er prøvbare og at hennes arbeid får endre hypotesen','at hun noen ganger nikker til uklare noter for å unngå statuskonflikt','konkret om handling, relasjon og timing','at utøveragency er kunnskap og ikke bare gjennomføring'],
            ['liv_dramatiker','Dramatiker og opphavsperson som prøver om regien åpner teksten eller absorberer den inn i konseptet.','opphavsperson med eierskap til egen tekst','høy kunstnerisk legitimitet rundt tekst og språk','kan godta eller avvise avtalte tekstendringer, men gir ikke regissøren generell opphavs- eller institusjonsmyndighet','at teksten kan transformeres scenisk uten at opphav og rettighetsgrenser blir usynlige','hvor sårbar hun blir når motstand i teksten omtales som et problem i stedet for evidens','tekstnær og presis om attribusjon og endringsgrunn','at regikonseptet må tåle motfunn fra teksten'],
            ['noah_dramaturg','Dramaturgisk samarbeidspartner som holder observasjon, hypotese, kilde og publikumsrespons fra hverandre.','kunstnerisk fagpartner','sterk analytisk posisjon uten automatisk regimandat','kan utfordre lesning og dokumentere motfunn, men kan ikke overta formell regiavgjørelse uten avtale','at prøverommet bruker uenighet som kvalitetskontroll','at han av og til ønsker å bli den som definerer hva scenen egentlig betyr','analytisk, spørrende og tydelig om usikkerhet','at regiautoritet må være korrigerbar mot dokumenterte motfunn'],
            ['maja_produksjonsleder','Produksjonsleder som gjør tid, versjon, kostnad og tekniske avhengigheter synlige før kunstnerisk usikkerhet blir skjult omarbeid.','produksjonsleder med delegert prosessansvar','sterk posisjon i frister, koordinering og gjennomførbarhet','kan sette produksjonsgrenser og stoppe uforsvarlig framdrift, men kan ikke definere verkets mening','et arbeidsgrunnlag med låsegrad, eier og realistisk restarbeid','hvor mye uavklart arbeid hun absorberer for å beskytte teamet','kort og presis om ansvar, frist og reversibilitet','at produksjonsbegrensning er kunnskap uten å være kunstnerisk fasit'],
            ['sara_designpartner','Designpartner som gjør visuelle og romlige løsninger til et faglig samarbeid snarere enn underordnet utførelse.','kunstnerisk designfaglig partner','høy faglig legitimitet i eget medium','kan definere løsninger innen eget fag og synliggjøre konsekvenser, men kan ikke alene overta regiens helhetsvalg','at regien beskriver funksjon og konsekvens tydelig nok til reelt samarbeid','hvor ofte hun tidligere har levert detaljer hun var faglig uenig i for å holde tempoet oppe','visuell, konkret og presis om materialitet og rom','at helhetsansvar ikke gir metodeeierskap over andre fag'],
            ['leila_regissorkollega','Fagfelle som kan se blinde flekker i tolkning, notearbeid og rollegrense uten å være prosjektets beslutningstaker.','selvstendig regifaglig kollega','kollegial status uten personalmyndighet','kan utfordre metode og lesning, men kan ikke tildele spilleren stilling, rettighet eller institusjonsmandat','at uenighet blir prøvbar framfor statusdrevet','at hun selv ønsker å framstå som den som ser helheten raskest','direkte, analytisk og villig til å vise egne forbehold','at Regissør-identiteten må skilles fra faktisk oppnevnt myndighet']
          ].map(x=>({id:x[0],social_function:x[1],class_position:x[2],status:x[3],power_over_player:x[4],wants:x[5],conceals:x[6],speech_style:x[7],teaches_player:x[8]}));
          const slowAxes=[['interpretive_humility','Hvor godt arbeidshypoteser holdes åpne for tekstlige og sceniske motfunn.','editorial_only_until_governed'],['performer_agency','Hvor tydelig utøverens faglige respons, kropp og grenser inngår som kunnskap.','editorial_only_until_governed'],['rehearsal_evidence','Hvor korrigerbar scenisk ledelse er mot det som faktisk skjer i prøven.','editorial_only_until_governed'],['note_discipline','Hvor prøvbare reginoter er som handling, relasjon, rytme eller oppmerksomhet.','editorial_only_until_governed'],['shared_authorship','Hvor synlig andre fags og opphavspersoners bidrag forblir i helheten.','editorial_only_until_governed'],['mandate_separation','Hvor tydelig directing practice holdes atskilt fra arbeidsgiver-, produksjons-, opphavs- og institusjonsmyndighet.','editorial_only_until_governed']].map(x=>({id:x[0],meaning:x[1],runtime_binding:x[2]}));
          const phases=['morning','lunch','afternoon','evening'];const phaseTypes={morning:'info',lunch:'conversation',afternoon:'decision',evening:'private_consequence'};const phaseText={morning:'arbeidshypotesen åpnes og premissene skilles',lunch:'en annen fagperson utfordrer lesningen',afternoon:'spilleren må velge en prøvbar handling og synliggjøre mandatet',evening:'prøverommet får privat etterklang uten at fortrolig materiale eller grenseløs beredskap følger med'};
          const coverage=[];for(let day=1;day<=14;day++){const s=storylets[day-1];for(const phase of phases)coverage.push({day,phase,beat_type:phaseTypes[phase],summary:`Dag ${day} ${phase}: ${s.subject}. ${phaseText[phase]}; neste prøve beholder sporbarhet mellom observasjon, hypotese, note, respons og restspørsmål.`,thread_ids:[`regissor_thread_${String(day).padStart(2,'0')}`],materialization_refs:[`${streamPath}#${s.id}`]});}
          const beat=(day,phase)=>`${day}/${phase}`;const primaryThreads=[];for(let day=1;day<=14;day++){const d2=(day%14)+1,d3=((day+1)%14)+1,d4=((day+2)%14)+1;primaryThreads.push({id:`regissor_thread_${String(day).padStart(2,'0')}`,relationship:`${storylets[day-1].from}: ${storylets[day-1].subject} utvikles fra regihypotese til sosial reaksjon og senere korrigering uten at Regissør-identiteten overtar andres fag eller formelle mandat.`,beat_refs:[beat(day,'morning'),beat(day,'lunch'),beat(d2,'afternoon'),beat(d3,'lunch'),beat(d4,'morning')]});}
          const privateAftermath=[0,3,6,9,12].map((idx,n)=>({id:`private_aftermath_${n+1}`,description:`Etter ${storylets[idx].subject.toLowerCase()} må spilleren skille helhetsansvar fra privat beredskap, beskytte fortrolighet og la hvile være en del av neste dags presisjon.`,materialization_refs:[`${streamPath}#${storylets[idx].id}`]}));
