          const world={schema:'civication_role_world_v1',version:1,category:'scenekunst',role_scope:lifeScope,title:'Regissør — korrigerbar scenisk ledelse, prøvbare noter og tydelig mandat',status:'role_world_complete',subject_type:'life_position',life_position_ref:{badge_id:'scenekunst',id:'regissor',label:'Regissør'},sociological_core:{main_problem:'helhetsansvar i et prøverom der kunstnerisk retning virker gjennom andre menneskers fag, kropper og opphav',description:'Regissør som employment-independent directing_practice_or_livelihood handler om å formulere og revidere sceniske hypoteser, gi prøvbare noter, organisere oppmerksomhet og koordinere faglige grensesnitt med utøveragency, samtykke, prøveevidens, produksjonsbegrensning og attribusjon synlig. Badge-identiteten kan romme praksis eller levevei uten arbeidsgiveransettelse eller institusjonelt mandat, mens formell Regissør-jobb fortsatt krever appointment_required. Rollen må skilles fra Dramaturg, Koreograf, Skuespiller / danser, Produsent, Scenekunstkurator og Kunstnerisk leder, og ingen ny runtime opprettes.'},theme_ids:themeIds,social_environments:['proverom_og_scenisk_undersokelse','utoverarbeid_og_reginote','tekst_dramaturgi_og_motfunn','design_rom_og_teknisk_grensesnitt','produksjonslas_og_overforing','offentlig_kreditering_og_privat_etterklang'],recurring_people_archetypes:people,slow_axes:slowAxes,season:{days:14,day_phases:phases,coverage},primary_threads:primaryThreads,private_aftermath:privateAftermath,delayed_consequences:delayedConsequences,materialization:{no_new_runtime:true,source_refs:storylets.map(s=>`${streamPath}#${s.id}`)}};write(worldPath,world);
