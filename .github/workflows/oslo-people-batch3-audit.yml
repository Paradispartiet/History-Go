name: Oslo People zero-gap batch 3 materialize

on:
  push:
    branches:
      - agent/oslo-people-zero-gap-batch3
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-people-zero-gap-batch3
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize batch
        id: materialize
        shell: bash
        run: |
          set +e
          sed -i 's#https://www.oslo.kommune.no/get-file/1055127/#https://www.visitnorway.no/aktiviteter-og-attraksjoner/kunst-kultur/litteratur/framtidsbiblioteket-i-nordmarka/#' tools/materialize-oslo-people-batch3.mts
          npx tsx tools/materialize-oslo-people-batch3.mts > reports/people-oslo-batch3-materialize.log 2>&1
          status=$?
          cat reports/people-oslo-batch3-materialize.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload failure log
        if: steps.materialize.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: oslo-people-batch3-materializer-failure
          path: reports/people-oslo-batch3-materialize.log

      - name: Publish clean data commit
        if: steps.materialize.outputs.status == '0'
        run: |
          rm -f tools/materialize-oslo-people-batch3.mts
          rm -f tools/audit-oslo-people-batch3-candidates.mts
          rm -f .github/workflows/oslo-people-batch3-audit.yml
          rm -f reports/people-oslo-batch3-materialize.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add Oslo People zero-gap batch 3"
          git push origin HEAD:agent/oslo-people-zero-gap-batch3

      - name: Fail on materializer error
        if: steps.materialize.outputs.status != '0'
        run: exit 1
