name: Fagverk Scenekunst holistic completion

on:
  pull_request:
    paths:
      - 'data/fag/scenekunst/**'
      - 'data/fagverk/scenekunst/**'
      - 'reports/fagverk/scenekunst-*.json'
      - 'scripts/audit-fagverk-scenekunst-*.mjs'
      - 'scripts/materialize-fagverk-scenekunst-completion.mjs'
      - 'tests/fagverk-scenekunst-*.test.mjs'
      - '.github/workflows/fagverk-scenekunst-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Scenekunst completion, scholarly sources and theory canon
        run: |
          node --check scripts/audit-fagverk-scenekunst-completion.mjs
          node --check scripts/materialize-fagverk-scenekunst-completion.mjs
          node scripts/audit-fagverk-scenekunst-completion.mjs
          node --test tests/fagverk-scenekunst-completion.test.mjs
          node --check scripts/audit-fagverk-scenekunst-scholarly-sources.mjs
          node scripts/audit-fagverk-scenekunst-scholarly-sources.mjs
          node --test tests/fagverk-scenekunst-scholarly-sources.test.mjs
          node --check scripts/audit-fagverk-scenekunst-theory-canon.mjs
          node scripts/audit-fagverk-scenekunst-theory-canon.mjs
          node --test tests/fagverk-scenekunst-theory-canon.test.mjs
      - name: Preserve university breadth and Phase 3 contracts
        run: |
          node --check scripts/audit-fagverk-scenekunst-university-readiness.mjs
          node scripts/audit-fagverk-scenekunst-university-readiness.mjs
          node --test tests/fagverk-scenekunst-university-readiness.test.mjs
          node --check scripts/audit-fagverk-scenekunst-phase3.mjs
          node scripts/audit-fagverk-scenekunst-phase3.mjs
          node --test tests/fagverk-scenekunst-phase3.test.mjs
