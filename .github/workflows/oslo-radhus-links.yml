name: Finalize Oslo City Hall links

on:
  push:
    paths:
      - ".github/workflows/oslo-radhus-links.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register quiz, leksikon, people, relations and actors
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const paths = {
            place: 'data/places/politikk/oslo/places_politikk/oslo_radhus.json',
            stories: 'data/stories/stories_oslo_radhus.json',
            quiz: 'data/quiz/politikk/oslo_radhus_sets.json',
            quizManifest: 'data/quiz/manifest.json',
            legacyQuiz: 'data/quiz/quiz_politikk.json',
            leksikon: 'data/leksikon/places/oslo/politikk/leksikon_oslo_radhus.json',
            leksikonManifest: 'data/leksikon/manifest.json',
            peopleBy: 'data/people/by/oslo/people_by_oslo.json',
            peopleKunst: 'data/people/kunst/oslo/people_kunst_oslo.json',
            relations: 'data/relations_philanthropy.json',
            actors: 'data/brands/actors_by_place.json'
          };

          const read = path => ({ raw: fs.readFileSync(path, 'utf8'), data: JSON.parse(fs.readFileSync(path, 'utf8')) });
          const write = (path, raw, data) => {
            const pretty = raw.trim().split(/\r?\n/).length > 3;
            fs.writeFileSync(path, JSON.stringify(data, null, pretty ? 2 : 0) + '\n');
          };
          const assert = (ok, message) => { if (!ok) throw new Error(message); };
          const upsertById = (list, item) => {
            const i = list.findIndex(entry => entry?.id === item.id);
            if (i >= 0) list[i] = item;
            else list.push(item);
          };
          const addPlace = (person, placeId) => {
            const values = [person.placeId, ...(Array.isArray(person.places) ? person.places : [])]
              .map(value => String(value || '').trim()).filter(Boolean);
            if (!values.includes(placeId)) values.push(placeId);
            person.places = [...new Set(values)];
          };

          const place = read(paths.place).data;
          assert(place.id === 'oslo_radhus' && place.category === 'politikk', 'Wrong place/category');
          assert(Array.isArray(place.rounds) && place.rounds.length === 9 && new Set(place.rounds).size === 9, 'Expected nine unique rounds');
          assert(place.rounds.includes('tasks') && !place.rounds.includes('nature') && !place.rounds.includes('routes'), 'Round selection invalid');
          assert(place.works?.length === 4, 'Works incomplete');
          assert(place.tasks_profile?.tasks?.length === 3, 'Tasks incomplete');
          assert(place.civication_store?.length === 3, 'Civication incomplete');
          assert(place.underbadge_ids?.every(id => ['kommune_og_byraad','velferd_og_institusjoner'].includes(id)), 'Invalid politics underbadge');

          const stories = read(paths.stories).data;
          assert(Array.isArray(stories) && stories.length === 3, 'Stories incomplete');
          assert(stories.every(story => story.place_id === place.id && Array.isArray(story.sources) && story.sources.length), 'Story target/source error');

          const quiz = read(paths.quiz).data;
          const questions = (quiz.sets || []).flatMap(set => set.questions || []);
          assert(quiz.targetId === place.id && quiz.categoryId === 'politikk' && questions.length === 5, 'Quiz incomplete');
          assert(questions.every(q => q.placeId === place.id && q.targetId === place.id && q.options?.includes(q.answer)), 'Quiz target/answer error');
          assert(questions.every(q => String(q.emne_id || '').startsWith('em_pol_')), 'Quiz contains non-politics emne');

          const articles = read(paths.leksikon).data;
          assert(Array.isArray(articles) && articles.length === 4, 'Leksikon incomplete');
          assert(articles.every(article => article.place_id === place.id && Array.isArray(article.sources) && article.sources.length), 'Leksikon target/source error');

          const quizManifestFile = read(paths.quizManifest);
          const quizManifest = quizManifestFile.data;
          quizManifest.sets = (quizManifest.sets || []).filter(entry => entry?.targetId !== place.id);
          quizManifest.sets.push({ targetId: place.id, file: paths.quiz });
          assert(quizManifest.sets.filter(entry => entry?.targetId === place.id).length === 1, 'Quiz manifest duplicate');
          write(paths.quizManifest, quizManifestFile.raw, quizManifest);

          const legacyFile = read(paths.legacyQuiz);
          const legacyBefore = legacyFile.data.length;
          legacyFile.data = legacyFile.data.filter(q => {
            const id = String(q?.id || '');
            const placeId = String(q?.placeId || '');
            if (placeId === place.id && /^oslo_radhus_quiz_\d+$/.test(id)) return false;
            if (placeId === 'radhuset' && /^radhuset_quiz_\d+$/.test(id)) return false;
            return true;
          });
          const removedLegacy = legacyBefore - legacyFile.data.length;
          assert(removedLegacy >= 5, `Expected at least 5 legacy questions removed, removed ${removedLegacy}`);
          write(paths.legacyQuiz, legacyFile.raw, legacyFile.data);

          const leksManifestFile = read(paths.leksikonManifest);
          const leksManifest = leksManifestFile.data;
          leksManifest.files = (leksManifest.files || []).filter(file => file !== paths.leksikon);
          leksManifest.files.push(paths.leksikon);
          assert(leksManifest.files.filter(file => file === paths.leksikon).length === 1, 'Leksikon manifest duplicate');
          write(paths.leksikonManifest, leksManifestFile.raw, leksManifest);

          const peopleByFile = read(paths.peopleBy);
          const peopleBy = peopleByFile.data;
          const arneberg = peopleBy.find(person => person?.id === 'arnstein_arneberg');
          const poulsson = peopleBy.find(person => person?.id === 'magnus_poulsson');
          assert(arneberg && poulsson, 'Existing City Hall architects missing');
          addPlace(arneberg, place.id);
          addPlace(poulsson, place.id);
          arneberg.popupDesc = 'Arnstein Arneberg tegnet Oslo rådhus sammen med Magnus Poulsson. Fra konkurranseseieren i 1918 til åpningen i 1950 ble prosjektet bearbeidet gjennom en rekke utkast. Rådhuset viser hvordan Arneberg kombinerte monumental arkitektur, materialbruk, kunst og representasjonsrom i en offentlig institusjon.';
          poulsson.popupDesc = 'Magnus Poulsson tegnet Oslo rådhus sammen med Arnstein Arneberg. Prosjektet utviklet seg fra et historiserende konkurranseutkast til bygget med to kraftige kontortårn og en lavere representasjonsfløy. Poulsson knyttes dermed til både rådhuset og den omfattende byomformingen av Pipervika.';
          write(paths.peopleBy, peopleByFile.raw, peopleBy);

          const peopleKunstFile = read(paths.peopleKunst);
          const peopleKunst = peopleKunstFile.data;
          [
            {
              id: 'henrik_sorensen', visual: { designCode: 'person_artist_miniature' }, name: 'Henrik Sørensen', initials: 'HS',
              desc: 'Kunstneren bak monumentalmaleriet «Folket i arbeid og fest» i Rådhushallen.',
              tags: ['kunst','monumentalmaleri','offentlig_kunst','oslo_radhus','representasjon'], placeId: place.id, category: 'kunst',
              kindLabel: 'Monumentalmaler / offentlig kunst', year: 1950,
              popupDesc: 'Henrik Sørensen utførte «Folket i arbeid og fest» på Rådhushallens fondvegg. Det store verket gjør arbeid, fellesskap og offentlig fest til bakgrunn for rådhusets viktigste seremonier og politiske representasjon.',
              places: [place.id], image: '', cardImage: '',
              emne_ids: ['em_kunst_offentlig_kunst_monumenter','em_kunst_institusjoner_kanon','em_kunst_arbeidsformer_og_prosess'],
              externalLinks: [{ type:'source', label:'Store norske leksikon – Oslo rådhus', url:'https://snl.no/Oslo_r%C3%A5dhus', verifiedAt:'2026-07-19' }]
            },
            {
              id: 'alf_rolfsen', visual: { designCode: 'person_artist_miniature' }, name: 'Alf Rolfsen', initials: 'AR',
              desc: 'Monumentalmaler bak tre store veggpartier i Oslo rådhus.',
              tags: ['kunst','fresko','monumentalmaleri','offentlig_kunst','oslo_radhus','okkupasjonshistorie'], placeId: place.id, category: 'kunst',
              kindLabel: 'Monumentalmaler / fresko', year: 1950,
              popupDesc: 'Alf Rolfsen dekorerte tre vegger i Rådhushallen med motiver fra norsk arbeidsliv, okkupasjonen, frigjøringen og St. Hallvard. Verkene gjør rådhusets representasjonsrom til en historisk og politisk billedfortelling.',
              places: [place.id], image: '', cardImage: '',
              emne_ids: ['em_kunst_offentlig_kunst_monumenter','em_kunst_epoker_og_kunsthistorisk_narrativ','em_kunst_teknologi_og_materialitet'],
              externalLinks: [{ type:'source', label:'Store norske leksikon – Alf Rolfsen', url:'https://nbl.snl.no/Alf_Rolfsen', verifiedAt:'2026-07-19' }]
            }
          ].forEach(person => upsertById(peopleKunst, person));
          assert(new Set(peopleKunst.map(person => person.id)).size === peopleKunst.length, 'Duplicate art person ids');
          write(paths.peopleKunst, peopleKunstFile.raw, peopleKunst);

          const relationFile = read(paths.relations);
          const relations = relationFile.data;
          [
            { id:'rel_oslo_radhus_arnstein_arneberg_arkitekt', type:'arkitekt', place:place.id, person:'arnstein_arneberg', label:'Rådhusarkitekt', why:'Arnstein Arneberg tegnet Oslo rådhus sammen med Magnus Poulsson.', source:'https://snl.no/Oslo_r%C3%A5dhus', verified_at:'2026-07-19' },
            { id:'rel_oslo_radhus_magnus_poulsson_arkitekt', type:'arkitekt', place:place.id, person:'magnus_poulsson', label:'Rådhusarkitekt', why:'Magnus Poulsson tegnet Oslo rådhus sammen med Arnstein Arneberg.', source:'https://snl.no/Oslo_r%C3%A5dhus', verified_at:'2026-07-19' },
            { id:'rel_oslo_radhus_henrik_sorensen_kunstner', type:'kunstnerisk_utforelse', place:place.id, person:'henrik_sorensen', label:'«Folket i arbeid og fest»', why:'Henrik Sørensen utførte monumentalmaleriet på Rådhushallens fondvegg.', source:'https://snl.no/Oslo_r%C3%A5dhus', verified_at:'2026-07-19' },
            { id:'rel_oslo_radhus_alf_rolfsen_kunstner', type:'kunstnerisk_utforelse', place:place.id, person:'alf_rolfsen', label:'Rådhushallens veggmalerier', why:'Alf Rolfsen utførte tre store veggpartier i Rådhushallen.', source:'https://nbl.snl.no/Alf_Rolfsen', verified_at:'2026-07-19' }
          ].forEach(item => upsertById(relations, item));
          assert(new Set(relations.map(item => item.id)).size === relations.length, 'Duplicate relation ids');
          write(paths.relations, relationFile.raw, relations);

          const actorFile = read(paths.actors);
          actorFile.data[place.id] = [
            {
              id:'oslo_bystyre', name:'Oslo bystyre', entity_type:'actor', actor_kind:'elected_municipal_council',
              actor_role:'Kommunens øverste folkevalgte organ holder møtene sine i bystyresalen i Oslo rådhus.', brand_group:'public_actor', brand_type:'municipal_council', brand_kind:'brand', sector:'local_government', state:'catalog', status:'active', verification:'verified',
              popupdesc:'Oslo bystyre vedtar kommunens overordnede politikk, budsjett og viktige planer. Møtene er åpne for publikum og kan følges fra galleriet eller digitalt.', desc:'Oslos øverste folkevalgte organ.', aliases:['Bystyret'], tags:['actor','local_democracy','elected_body','oslo_radhus'],
              source_urls:['https://www.oslo.kommune.no/politikk/bystyret/moter-i-oslo-bystyre/'], verified_at:'2026-07-19'
            },
            {
              id:'oslo_byrad', name:'Oslo byråd', entity_type:'actor', actor_kind:'municipal_executive',
              actor_role:'Byrådet fungerer som kommuneråd og leder den utøvende kommunale virksomheten.', brand_group:'public_actor', brand_type:'municipal_executive', brand_kind:'brand', sector:'local_government', state:'catalog', status:'active', verification:'verified',
              popupdesc:'Oslo har parlamentarisk styringsform. Byrådet leder administrasjonen, forbereder saker og gjennomfører politikken innenfor rammene bystyret vedtar.', desc:'Oslos utøvende politiske ledelse.', aliases:['Byrådet'], tags:['actor','local_government','executive_power','oslo_radhus'],
              source_urls:['https://www.oslo.kommune.no/politikk/reglement-for-folkevalgte/reglement-for-byradet/'], verified_at:'2026-07-19'
            },
            {
              id:'radhusets_forvaltningstjeneste', name:'Rådhusets forvaltningstjeneste', entity_type:'actor', actor_kind:'municipal_facility_service',
              actor_role:'Forvalter rådhusbygget, publikumsfunksjoner, arrangementer og klokkespillet.', brand_group:'public_actor', brand_type:'municipal_service', brand_kind:'brand', sector:'public_administration', state:'catalog', status:'active', verification:'verified',
              popupdesc:'Rådhusets forvaltningstjeneste sørger for drift og publikumsrettede funksjoner i rådhuset og forvalter blant annet klokkespillet.', desc:'Kommunal drift og forvaltning av Oslo rådhus.', aliases:['RFT'], tags:['actor','facility_management','public_service','carillon','oslo_radhus'],
              source_urls:['https://www.oslo.kommune.no/radhuset/','https://www.oslo.kommune.no/english/oslo-city-hall/the-carillon-at-oslo-city-hall/'], verified_at:'2026-07-19'
            },
            {
              id:'den_norske_nobelkomite', name:'Den norske Nobelkomité', entity_type:'actor', actor_kind:'prize_committee',
              actor_role:'Velger mottakeren av Nobels fredspris og gjennomfører den årlige prisseremonien i Oslo rådhus.', brand_group:'institution_actor', brand_type:'prize_committee', brand_kind:'brand', sector:'peace_and_diplomacy', state:'catalog', status:'active', verification:'verified',
              popupdesc:'Den norske Nobelkomité avgjør hvem som får Nobels fredspris. Oslo rådhus er seremonirommet der medalje og diplom deles ut 10. desember.', desc:'Komiteen som velger mottakeren av Nobels fredspris.', aliases:['Nobelkomiteen','Norwegian Nobel Committee'], tags:['actor','nobel_peace_prize','public_ritual','oslo_radhus'],
              source_urls:['https://www.nobelpeaceprize.org/nobel-peace-prize/nomination/the-nomination-process','https://www.nobelpeaceprize.org/nobel-peace-prize/about-the-nobel-peace-prize/nobel-peace-prize-celebrations/award-ceremony?instance=0'], verified_at:'2026-07-19'
            }
          ];
          write(paths.actors, actorFile.raw, actorFile.data);
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz/manifest.json data/quiz/quiz_politikk.json data/leksikon/manifest.json data/people/by/oslo/people_by_oslo.json data/people/kunst/oslo/people_kunst_oslo.json data/relations_philanthropy.json data/brands/actors_by_place.json
          git rm .github/workflows/oslo-radhus-links.yml
          git commit -m "Connect Oslo City Hall people, actors and indexes"
          git push
