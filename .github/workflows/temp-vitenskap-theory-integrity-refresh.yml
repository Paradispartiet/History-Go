name: TEMP Vitenskap theory integrity refresh

on:
  push:
    branches:
      - agent/vitenskap-final-readiness-reconciliation
    paths:
      - .github/workflows/temp-vitenskap-theory-integrity-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitenskap-final-readiness-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate strict theory integrity projection
        run: node scripts/audit-fagverk-theory-integrity.mjs --write-report --no-check-report
      - name: Enforce projection-only scope
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          unexpected=$(grep -v '^reports/fagverk/fagverk-theory-integrity-audit.json$' /tmp/changed.txt || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes:"
            echo "$unexpected"
            exit 1
          fi
          grep -qx 'reports/fagverk/fagverk-theory-integrity-audit.json' /tmp/changed.txt
      - name: Validate regenerated projection
        run: |
          node scripts/audit-fagverk-theory-integrity.mjs
          node --test tests/fagverk-theory-integrity.test.mjs
          node --test tests/fagverk-documentation-contract.test.mjs
      - name: Commit projection and remove TEMP workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-vitenskap-theory-integrity-refresh.yml
          git add reports/fagverk/fagverk-theory-integrity-audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(fagverk): refresh theory integrity projection"
          git push origin HEAD:agent/vitenskap-final-readiness-reconciliation
