name: Torggata phase 8A closeout

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/torggata-phase8a-closeout'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize 8A closeout
        run: python3 tools/_tmp_materialize_torggata_phase8a_closeout.py

      - name: Focused 8A data and UI regressions
        run: |
          node --test tests/torggata-phase8a1-people.test.mjs tests/torggata-phase8a2-jensen.test.mjs tests/torggata-phase8a3-people.test.mjs tests/torggata-phase8a-closeout.test.mjs tests/place-rounds-grid-exclusivity.test.mjs
          node tests/place-people-ids-runtime.test.js

      - name: Build tools
        run: npm run build:tools
      - name: People popup readiness
        run: node dist/tools/audit-people-popup-readiness.mjs --check
      - name: Full tools gate
        run: npm run tools:check

      - name: Commit validated closeout
        run: |
          rm -f .github/workflows/torggata-phase8a-closeout.yml
          rm -f tools/_tmp_materialize_torggata_phase8a_closeout.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Godkjenn Torggata fase 8A People closeout"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
