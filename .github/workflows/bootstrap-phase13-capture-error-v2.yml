name: Capture corrected phase 13 materialization error

on:
  push:
    branches:
      - agent/regjeringskvartalet-phase-13-ui-audit

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/regjeringskvartalet-phase-13-ui-audit
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import traceback

          try:
              source = Path('.github/workflows/bootstrap-regjeringskvartalet-phase-13.yml').read_text()
              marker = "python3 - <<'PY'\n"
              raw = source.split(marker, 1)[1].split('\n          PY\n', 1)[0]
              script = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines()) + '\n'
              script = script.replace('fagverkPlaceEmners', 'fagverkPlaceEmner')
              exec(compile(script, '<phase13-materialize>', 'exec'))
              result = 'MATERIALIZE_OK\n'
          except BaseException:
              result = traceback.format_exc()
          Path('.github/phase13-materialize-result-v2.txt').write_text(result)
          PY
          rm -f .github/workflows/bootstrap-phase13-capture-error-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture corrected phase 13 materialization result"
          git push origin HEAD:agent/regjeringskvartalet-phase-13-ui-audit
