name: TEMP Reverify Manusmedarbeider on latest main

on:
  push:
    branches:
      - agent/civication-film-tv-manusmedarbeider-role-world-rollout
    paths:
      - .github/workflows/TEMP-civication-manusmedarbeider-final-verify.yml

permissions:
  contents: write

jobs:
  final-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-film-tv-manusmedarbeider-role-world-rollout
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Reconcile generated artifacts on latest main
        run: |
          node scripts/build-civication-scene-registry.mjs --write
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write

      - name: Verify rollout and canonical gates
        run: |
          node tests/civication-film-tv-manusmedarbeider-role-world-rollout.test.js
          node tests/civication-film-tv-manusmedarbeider-playability.test.js
          node tests/civication-role-world-contract.test.js
          node tests/civication-role-world-broad-rollout-policy.test.js
          node scripts/build-civication-scene-registry.mjs --check
          node scripts/audit-civication-career-gameplay.mjs --check
          node scripts/audit-civication-role-world-rollout-readiness.mjs --check
          npm run test:civication

      - name: Remove temporary verifier and commit exact result
        run: |
          rm .github/workflows/TEMP-civication-manusmedarbeider-final-verify.yml
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reverify Manusmedarbeider rollout on latest main"
          git push origin HEAD:agent/civication-film-tv-manusmedarbeider-role-world-rollout
