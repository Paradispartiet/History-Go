name: Split Oslo politikk places

on:
  push:
    branches:
      - data/split-politikk-oslo-places-20260708

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/split-politikk-oslo-places-20260708
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/split-politikk-oslo-places.mjs
      - run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add data/places/politikk/oslo/places_politikk data/places/politikk/oslo/places_politikk_manifest.json data/places/politikk/oslo/places_politikk_index.json data/places/politikk/oslo/places_politikk_split_report.txt
          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Generate split Oslo politikk place files"
            git push
          fi
