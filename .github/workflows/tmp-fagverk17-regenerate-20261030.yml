name: Temporary scoped Fagverk17 regeneration
on:
  push:
    branches:
      - integration/fagverk17-quiz8-20261030
permissions:
  contents: write
concurrency:
  group: tmp-fagverk17-regenerate-20261030
  cancel-in-progress: true
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate only scoped derived files
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-subkultur-case-evidence-v1.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-quiz-production-context.mjs --category kunst --target van_etten --output data/quiz/production_context/kunst/van_etten.json
          node scripts/build-quiz-production-context.mjs --category kunst --target villa_furulund --output data/quiz/production_context/kunst/villa_furulund.json
          node scripts/build-quiz-production-context.mjs --category historie --target vestre_gravlund --output data/quiz/production_context/historie/vestre_gravlund.json
          node scripts/build-quiz-production-context.mjs --category historie --target vikingtidsmuseet --output data/quiz/production_context/historie/vikingtidsmuseet.json
          node scripts/build-quiz-production-context.mjs --category kunst --target vigelandmuseet --output data/quiz/production_context/kunst/vigelandmuseet.json
          node scripts/build-quiz-production-context.mjs --category historie --target villa_grande --output data/quiz/production_context/historie/villa_grande.json
          node scripts/build-quiz-production-context.mjs --category scenekunst --target vega_scene --output data/quiz/production_context/scenekunst/vega_scene.json
          node scripts/build-quiz-production-context.mjs --category subkultur --target vaterland_bar_scene --output data/quiz/production_context/subkultur/vaterland_bar_scene.json
          git restore --source=origin/main -- scripts/audit-quiz-production-context.mjs
          git add -- data/fag/subkultur/case_sources_subkultur_canonical_v1.json data/fag/subkultur/case_evidence_subkultur_canonical_v1.json data/fag/subkultur/case_validation_subkultur_v1.json data/fagverk/fagverk_release.json data/quiz/production_context/kunst/van_etten.json data/quiz/production_context/kunst/villa_furulund.json data/quiz/production_context/historie/vestre_gravlund.json data/quiz/production_context/historie/vikingtidsmuseet.json data/quiz/production_context/kunst/vigelandmuseet.json data/quiz/production_context/historie/villa_grande.json data/quiz/production_context/scenekunst/vega_scene.json data/quiz/production_context/subkultur/vaterland_bar_scene.json scripts/audit-quiz-production-context.mjs
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='actions@github.com' commit -m 'build: regenerate scoped Fagverk17 derived artifacts'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
