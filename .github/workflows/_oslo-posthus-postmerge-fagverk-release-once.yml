name: Oslo Posthus post-merge Fagverk release regen once

on:
  push:
    branches:
      - agent/oslo-posthus-postmerge-fagverk-release-20260910
    paths:
      - '.github/workflows/_oslo-posthus-postmerge-fagverk-release-once.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/oslo-posthus-postmerge-fagverk-release-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate canonical Fagverk release manifest
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Verify canonical Fagverk release manifest
        run: node scripts/build-fagverk-release-manifest.mjs --check
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/_oslo-posthus-postmerge-fagverk-release-once.yml
      - name: Commit permanent generated output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 1
          fi
          git commit -m 'Regenerate Fagverk release after Oslo Posthus merge'
          git push origin HEAD:agent/oslo-posthus-postmerge-fagverk-release-20260910
