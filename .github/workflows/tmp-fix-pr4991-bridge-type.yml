name: Temporary PR 4991 bridge type fix

on:
  push:
    branches:
      - agent/civication-scene-director-4c

permissions:
  contents: write

jobs:
  patch-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow descriptor setter cast
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/Civication/systems/civicationWorkdayMailBuilder.js")
          text = path.read_text(encoding="utf-8")

          old = '    if (descriptor?.set?.__civicationSceneDirectorBridge === true) return true;'
          new = (
              '    const descriptorSetter = /** @type {any} */ (descriptor?.set);'
              '\n    if (descriptorSetter?.__civicationSceneDirectorBridge === true) return true;'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one descriptor setter target, found {count}")
          text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          print("patched descriptor setter with one local JSDoc cast")
          PY
      - name: Remove temporary workflow and push correction
        shell: bash
        run: |
          rm .github/workflows/tmp-fix-pr4991-bridge-type.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rett Daily-bridge-typen"
          git push origin HEAD:agent/civication-scene-director-4c