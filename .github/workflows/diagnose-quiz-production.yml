name: Repair deterministic quiz context

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-quiz-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild context, remove diagnostic workflow and push
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p reports/akershus-coordinate-asker-kirkested-production-ci

          npm run quiz:context -- \
            --category by \
            --target deichman_bjorvika \
            --output data/quiz/production_context/by/deichman_bjorvika.json \
            2>&1 | tee reports/akershus-coordinate-asker-kirkested-production-ci/deichman-context-rebuild.log

          npm run audit:quiz-production-context \
            2>&1 | tee reports/akershus-coordinate-asker-kirkested-production-ci/quiz-production-context-audit.log

          git rm .github/workflows/diagnose-quiz-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz/production_context/by/deichman_bjorvika.json \
            reports/akershus-coordinate-asker-kirkested-production-ci/deichman-context-rebuild.log \
            reports/akershus-coordinate-asker-kirkested-production-ci/quiz-production-context-audit.log
          git commit -m "Refresh deterministic Deichman quiz context"
          git push origin "HEAD:${BRANCH_NAME}"
