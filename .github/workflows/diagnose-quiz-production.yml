name: Diagnose quiz production

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-quiz-production.yml'
      - 'data/places/**'
      - 'data/quiz/**'
      - 'scripts/audit-quiz-*.mjs'
      - 'scripts/quiz-production-lib.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run quiz audits with persisted logs
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/quiz-audit-diagnostics

          npm run quiz:context -- \
            --category by \
            --target deichman_bjorvika \
            --output /tmp/quiz-audit-diagnostics/deichman_bjorvika.expected.json \
            2>&1 | tee /tmp/quiz-audit-diagnostics/rebuild.log
          rebuild_status=${PIPESTATUS[0]}

          cp data/quiz/production_context/by/deichman_bjorvika.json \
            /tmp/quiz-audit-diagnostics/deichman_bjorvika.current.json

          npm run audit:quiz-production-context 2>&1 | tee /tmp/quiz-audit-diagnostics/production-context.log
          context_status=${PIPESTATUS[0]}

          npm run audit:quiz-progression 2>&1 | tee /tmp/quiz-audit-diagnostics/progression.log
          progression_status=${PIPESTATUS[0]}

          npm run audit:quiz-theory-binding 2>&1 | tee /tmp/quiz-audit-diagnostics/theory-binding.log
          theory_status=${PIPESTATUS[0]}

          {
            echo "rebuild=${rebuild_status}"
            echo "production_context=${context_status}"
            echo "progression=${progression_status}"
            echo "theory_binding=${theory_status}"
          } | tee /tmp/quiz-audit-diagnostics/status.txt

          if [ "${rebuild_status}" -ne 0 ] || [ "${context_status}" -ne 0 ] || [ "${progression_status}" -ne 0 ] || [ "${theory_status}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload quiz audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-audit-diagnostics
          path: /tmp/quiz-audit-diagnostics
          if-no-files-found: error
