name: Bootstrap Regjeringskvartalet phase 13 final

on:
  push:
    branches:
      - agent/regjeringskvartalet-phase-13-ui-audit

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/regjeringskvartalet-phase-13-ui-audit
          fetch-depth: 0

      - name: Materialize production diff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/workflows/bootstrap-regjeringskvartalet-phase-13.yml').read_text()
          marker = "python3 - <<'PY'\n"
          raw = source.split(marker, 1)[1].split('\n          PY\n', 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines()) + '\n'
          script = script.replace('fagverkPlaceEmners', 'fagverkPlaceEmner')
          exec(compile(script, '<phase13-materialize>', 'exec'))

          test_path = Path('tests/regjeringskvartalet-ui-production-audit.test.mjs')
          test_text = test_path.read_text()
          test_text, count = re.subn(
              r"  assert\.match\(popupRuntime, new RegExp\(`[^\n]+`\)\);",
              '  assert.ok(popupRuntime.includes(`["${id}", "${label}"]`));',
              test_text,
              count=1
          )
          if count != 1:
              raise SystemExit('Fant ikke TAB_DEFS-regexen')
          test_text = test_text.replace(
              'window.showPlacePopup=()=>{};window.showPlaceCardRoundPopup=',
              'window.showPlacePopup=()=>{};window.openPlaceCard=async()=>{};window.showPlaceCardRoundPopup='
          )
          test_path.write_text(test_text)

          brands_path = Path('tests/regjeringskvartalet-brands-phase.test.mjs')
          brands = brands_path.read_text().replace('\n// Phase 13 bootstrap trigger; removed from the final diff.\n', '\n')
          brands_path.write_text(brands)
          PY

      - name: Commit materialized diff
        run: |
          rm -f .github/workflows/bootstrap-regjeringskvartalet-phase-13.yml
          rm -f .github/workflows/bootstrap-regjeringskvartalet-phase-13-v2.yml
          rm -f .github/workflows/bootstrap-regjeringskvartalet-phase-13-v3.yml
          rm -f .github/workflows/bootstrap-regjeringskvartalet-phase-13-final.yml
          rm -f .github/workflows/bootstrap-phase13-diagnostic.yml
          rm -f .github/workflows/bootstrap-phase13-capture-error.yml
          rm -f .github/phase13-trigger.txt .github/phase13-trigger-v2.txt .github/phase13-trigger-v3.txt
          rm -f .github/phase13-diagnostic-trigger.txt .github/phase13-capture-trigger.txt
          rm -f .github/phase13-workflow-ran.txt .github/phase13-materialize-result.txt .github/phase13-final-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fullfør Regjeringskvartalets UI-audit"
          git push origin HEAD:agent/regjeringskvartalet-phase-13-ui-audit
