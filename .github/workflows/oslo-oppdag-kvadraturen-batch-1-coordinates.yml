name: Oslo Oppdag Kvadraturen batch 1 coordinates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-oppdag-kvadraturen-batch-1-coordinates.yml'

permissions:
  contents: write

jobs:
  coordinates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve and save address evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/oslo-oppdag-kvadraturen-batch-1/coordinates
          npm run places:coords:find:address -- --address "Kongens gate 23 Oslo" \
            | tee reports/oslo-oppdag-kvadraturen-batch-1/coordinates/steen_og_strom.json
          npm run places:coords:find:address -- --address "Kirkegata 18 Oslo" \
            | tee reports/oslo-oppdag-kvadraturen-batch-1/coordinates/centralbanken.json
          npm run places:coords:find:address -- --address "Dronningens gate 27 Oslo" \
            | tee reports/oslo-oppdag-kvadraturen-batch-1/coordinates/kirkeristen_basarene_brannvakten.json
          npm run places:coords:find:address -- --address "Skippergata 3 Oslo" \
            | tee reports/oslo-oppdag-kvadraturen-batch-1/coordinates/kafe_grei.json
          npm run places:coords:find:address -- --address "Tollbugata 2 Oslo" \
            | tee reports/oslo-oppdag-kvadraturen-batch-1/coordinates/borsen.json
          npm run places:coords:find:address -- --address "Fred Olsens gate 2 Oslo" \
            | tee reports/oslo-oppdag-kvadraturen-batch-1/coordinates/treschowgarden.json
          npm run places:coords:find:address -- --address "Tollbugata 10 Oslo" \
            | tee reports/oslo-oppdag-kvadraturen-batch-1/coordinates/den_gamle_krigsskolen.json
      - name: Persist coordinate results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/oslo-oppdag-kvadraturen-batch-1/coordinates
          git commit -m "Save Oppdag Kvadraturen batch 1 coordinate results"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
