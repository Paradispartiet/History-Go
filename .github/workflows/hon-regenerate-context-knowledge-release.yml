name: House of Nerds temporary canonical artifact regeneration
on:
  push:
    branches: [place/house-of-nerds-quiz-20261101]
    paths: [.github/workflows/hon-regenerate-context-knowledge-release.yml]
permissions:
  contents: write
jobs:
  generate:
    if: github.ref == 'refs/heads/place/house-of-nerds-quiz-20261101'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/build-quiz-production-context.mjs --category subkultur --target house_of_nerds --output data/quiz/production_context/subkultur/house_of_nerds.json
      - run: npm run knowledge:canonical:write
      - run: node scripts/build-fagverk-release-manifest.mjs
      - run: node scripts/audit-quiz-progression.mjs
      - name: Commit deterministic source-linked output only
        shell: bash
        run: |
          set -eu
          git add -- data/quiz/production_context/subkultur/house_of_nerds.json data/quiz/subkultur/house_of_nerds_sets.json data/knowledge/subjects/subkultur/knowledge_units.generated.json reports/knowledge-id-backfill.json data/fagverk/fagverk_release.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate audited House of Nerds Knowledge and Fagverk release"
            git push origin HEAD:place/house-of-nerds-quiz-20261101
          fi
