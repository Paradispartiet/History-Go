name: Temporary Abelonegården quiz materialization

on:
  push:
    branches:
      - quiz/abelonegarden-3x7-20261008

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install deterministic tooling
        run: npm ci --no-audit --no-fund
      - name: Generate canonical quiz production context
        run: node scripts/build-quiz-production-context.mjs --category historie --target abelonegarden --output data/quiz/production_context/historie/abelonegarden.json
      - name: Verify canonical quiz contracts
        run: |
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
      - name: Sync canonical Knowledge
        run: npm run knowledge:canonical:write
      - name: Regenerate Fagverk release from canonical sources
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Validate generated artifacts
        run: |
          node scripts/build-quiz-production-context.mjs --category historie --target abelonegarden --output data/quiz/production_context/historie/abelonegarden.json --check
          npm run knowledge:canonical:check
          npm run audit:quiz-wiring
      - name: Remove temporary generator workflow from branch
        run: rm .github/workflows/tmp-abelonegarden-quiz-materialize.yml
      - name: Commit derived artifacts to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/quiz/production_context/historie/abelonegarden.json data/quiz/historie/abelonegarden_sets.json data/knowledge data/fagverk/fagverk_release.json reports/ .github/workflows/tmp-abelonegarden-quiz-materialize.yml
          git diff --cached --stat
          test -n "$(git diff --cached --name-only)"
          git commit -m "Materialize Abelonegarden quiz context, Knowledge, and release"
          git push origin HEAD:quiz/abelonegarden-3x7-20261008
