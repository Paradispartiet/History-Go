name: Fagverk By Data og styring Phase 4
on:
  push:
    paths:
      - 'data/fagverk/by/data-styring-kart-plan-medvirkning-algoritmer.json'
      - 'data/fagverk/by/data-styring-kart-plan-medvirkning-algoritmer/**'
      - 'data/fagverk/fagverk_registry.json'
      - 'data/fagverk/subject_status.json'
      - 'scripts/audit-fagverk-by-data-styring-kart-plan-medvirkning-algoritmer-phase4.mjs'
      - 'tests/fagverk-by-data-styring-kart-plan-medvirkning-algoritmer-phase4.test.mjs'
      - 'reports/fagverk/by-data-styring-kart-plan-medvirkning-algoritmer-phase4-audit.json'
      - '.github/workflows/fagverk-by-data-styring-kart-plan-medvirkning-algoritmer-phase4.yml'
  pull_request:
    paths:
      - 'data/fagverk/by/data-styring-kart-plan-medvirkning-algoritmer.json'
      - 'data/fagverk/by/data-styring-kart-plan-medvirkning-algoritmer/**'
      - 'data/fagverk/fagverk_registry.json'
      - 'data/fagverk/subject_status.json'
      - 'scripts/**'
      - 'tests/**'
      - 'reports/**'
      - '.github/workflows/**'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit-fagverk-by-data-styring-kart-plan-medvirkning-algoritmer-phase4.mjs
      - run: node --test tests/fagverk-by-data-styring-kart-plan-medvirkning-algoritmer-phase4.test.mjs
