name: Visual QA Oslo coordinate batch 29

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  visual-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-29-v3
          fetch-depth: 0

      - name: Build visual QA page
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-29-v3/visual-qa
          mkdir -p "$out"
          cat > "$out/index.html" <<'HTML'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Batch 29 visual QA</title>
            <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
            <style>
              html,body{margin:0;background:#fff;font-family:Arial,sans-serif}h1{font-size:22px;margin:12px 16px 4px}.sub{margin:0 16px 10px;color:#444;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 12px}.panel{border:1px solid #222;background:#fff}.title{font-weight:700;padding:7px 9px;font-size:15px}.map{height:390px}.legend{padding:6px 9px;font-size:12px}.old{color:#1565c0;font-weight:bold}.new{color:#c62828;font-weight:bold}
            </style>
          </head>
          <body>
            <h1>Oslo coordinate batch 29 — visual QA</h1>
            <div class="sub">Blå = gammel canonical markør. Rød = nytt adresseanker / foreløpig host-anchor.</div>
            <div class="grid">
              <div class="panel"><div class="title">Kulturkirken Jakob — Hausmanns gate 14</div><div id="m1" class="map"></div><div class="legend"><span class="old">Gammel 59.9194, 10.7553</span> · <span class="new">Ny 59.918033, 10.754119</span></div></div>
              <div class="panel"><div class="title">Ruth Maier — Dalsbergstien 3</div><div id="m2" class="map"></div><div class="legend"><span class="old">Gammel 59.9183, 10.7427</span> · <span class="new">Ny 59.922730, 10.737931</span></div></div>
              <div class="panel"><div class="title">Prøysenhuset — Prestvegen 1, Rudshøgda</div><div id="m3" class="map"></div><div class="legend"><span class="old">Gammel 60.8827, 10.9502</span> · <span class="new">Ny 60.912182, 10.791216</span></div></div>
              <div class="panel"><div class="title">Alf Prøysen-monumentet — Flammen host-anchor</div><div id="m4" class="map"></div><div class="legend"><span class="old">Gammel 60.0620, 10.8750</span> · <span class="new">Ny host 60.044012, 10.880400</span> · ikke verifisert sokkelpunkt</div></div>
            </div>
            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
            <script>
              const specs=[
                {id:'m1',old:[59.9194,10.7553],neu:[59.9180329772343,10.754119014784367],zoom:16},
                {id:'m2',old:[59.9183,10.7427],neu:[59.922730001268235,10.737930723902437],zoom:15},
                {id:'m3',old:[60.8827,10.9502],neu:[60.912182010287836,10.791215743205731],zoom:11},
                {id:'m4',old:[60.062,10.875],neu:[60.04401205900787,10.880400225286696],zoom:13}
              ];
              let loaded=0;
              for(const s of specs){
                const map=L.map(s.id,{zoomControl:false,attributionControl:false});
                const group=L.featureGroup();
                L.circleMarker(s.old,{radius:10,color:'#1565c0',fillColor:'#1565c0',fillOpacity:1,weight:3}).bindTooltip('GAMMEL',{permanent:true,direction:'top'}).addTo(group);
                L.circleMarker(s.neu,{radius:10,color:'#c62828',fillColor:'#c62828',fillOpacity:1,weight:3}).bindTooltip('NY',{permanent:true,direction:'bottom'}).addTo(group);
                group.addTo(map);
                map.fitBounds(group.getBounds().pad(0.35),{maxZoom:s.zoom});
                const tiles=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19});
                tiles.on('load',()=>{loaded++; if(loaded>=4) document.body.dataset.tiles='ready';});
                tiles.addTo(map);
              }
            </script>
          </body>
          </html>
          HTML

      - name: Capture rendered map screenshot
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-29-v3/visual-qa
          python3 -m http.server 8765 --directory . >/tmp/b29-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=1400,1000 --virtual-time-budget=12000 \
            --screenshot="$out/batch29-map-qa.png" \
            http://127.0.0.1:8765/$out/index.html
          file "$out/batch29-map-qa.png"
          test -s "$out/batch29-map-qa.png"

      - name: Persist QA artifact and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/oslo-coordinate-batch-29-visual-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/oslo-coordinate-control-batch-29-v3/visual-qa .github/workflows/oslo-coordinate-batch-29-visual-qa.yml
          git commit -m "Add visual QA for Oslo coordinate batch 29"
          git push origin HEAD
