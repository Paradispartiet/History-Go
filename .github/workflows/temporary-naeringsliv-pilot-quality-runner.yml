name: Temporary Næringsliv pilot quality runner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: temporary-naeringsliv-pilot-quality-runner
  cancel-in-progress: false

jobs:
  quality-lift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out quality branch
        uses: actions/checkout@v4
        with:
          ref: agent/naeringsliv-pilot-context-quality
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute locked quality job
        run: bash scripts/temp-execute-naeringsliv-pilot-quality.sh
