name: Fagverk IA v3 By redirect generated probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fagverk-ia-v3-by-redirect-generated-probe.yml'
      - 'data/fagverk/fagverk_portal.json'
      - 'reports/fagverk/by-pilot-audit.json'
      - 'reports/fagverk/general-engine-audit.json'
      - 'scripts/audit-fagverk-by-legacy-adjudication.mjs'
      - 'tests/fagverk-*.test.mjs'

permissions:
  contents: write

jobs:
  generate-and-clean:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate deterministic Fagverk audit projections
        run: |
          node scripts/audit-fagverk-by-pilot.mjs --write-report
          node scripts/audit-fagverk-general-engine.mjs --write-report
      - name: Commit generated outputs and remove probe
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fagverk-ia-v3-by-redirect-generated-probe.yml
          git add reports/fagverk/by-pilot-audit.json reports/fagverk/general-engine-audit.json
          git commit -m "Regenerate By redirect Fagverk audit reports"
          git push origin HEAD:"$HEAD_BRANCH"
