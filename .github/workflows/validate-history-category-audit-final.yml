name: Validate final history category audit

on:
  push:
    branches: [main]
    paths:
      - .github/history-category-audit-final-trigger.txt

permissions:
  contents: write

concurrency:
  group: validate-history-category-audit-final
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate active history data and split manifests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          root = Path('.')
          places_root = root / 'data/places'
          manifest_path = places_root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = manifest.get('files')
          if not isinstance(files, list):
              raise SystemExit('Manifest files must be a list')
          if len(files) != len(set(files)):
              raise SystemExit('Duplicate manifest paths found')

          id_counts = Counter()
          active_history_files = []
          active_history_places = 0
          history_category_errors = []

          for rel in files:
              path = places_root / rel.removeprefix('places/')
              payload = json.loads(path.read_text(encoding='utf-8'))
              if isinstance(payload, list):
                  for place in payload:
                      if isinstance(place, dict) and isinstance(place.get('id'), str):
                          id_counts[place['id']] += 1
              if rel.startswith('places/historie/'):
                  active_history_files.append(rel)
                  if not isinstance(payload, list):
                      history_category_errors.append({'path': rel, 'error': 'not_array'})
                      continue
                  active_history_places += len(payload)
                  for index, place in enumerate(payload):
                      if not isinstance(place, dict) or place.get('category') != 'historie':
                          history_category_errors.append({
                              'path': rel,
                              'index': index,
                              'id': place.get('id') if isinstance(place, dict) else None,
                              'category': place.get('category') if isinstance(place, dict) else None,
                          })

          duplicate_ids = sorted(k for k, v in id_counts.items() if v > 1)
          if duplicate_ids:
              raise SystemExit(f'Duplicate manifest-loaded place IDs: {duplicate_ids[:50]}')
          if history_category_errors:
              raise SystemExit(f'Active history category errors: {history_category_errors[:20]}')

          split_manifests = []
          split_errors = []
          for sm_path in sorted((places_root / 'historie').rglob('*_manifest.json')):
              try:
                  sm = json.loads(sm_path.read_text(encoding='utf-8'))
              except Exception as exc:
                  split_errors.append({'manifest': str(sm_path), 'error': f'invalid_json:{exc}'})
                  continue
              source_path_value = sm.get('source_path')
              places = sm.get('places')
              layout = sm.get('layout') or {}
              split_dir_value = layout.get('place_files_dir')
              if not isinstance(source_path_value, str) or not isinstance(places, list) or not isinstance(split_dir_value, str):
                  continue
              source_path = root / source_path_value
              if not source_path.exists():
                  split_errors.append({'manifest': str(sm_path), 'error': 'missing_source', 'source': source_path_value})
                  continue
              source_text = source_path.read_text(encoding='utf-8')
              source = json.loads(source_text)
              if not isinstance(source, list):
                  split_errors.append({'manifest': str(sm_path), 'error': 'source_not_array'})
                  continue

              source_ids = [p.get('id') for p in source if isinstance(p, dict)]
              manifest_ids = [p.get('id') for p in places if isinstance(p, dict)]
              errs = []
              if sm.get('place_count') != len(source):
                  errs.append('place_count')
              if manifest_ids != source_ids:
                  errs.append('id_order')
              source_sha = hashlib.sha256(source_text.encode('utf-8')).hexdigest()
              if sm.get('source_sha256') != source_sha:
                  errs.append('source_sha256')
              if any((p.get('category') != 'historie') for p in source if isinstance(p, dict)):
                  errs.append('source_non_historie')
              if any((p.get('category') != 'historie') for p in places if isinstance(p, dict)):
                  errs.append('manifest_non_historie')

              split_dir = sm_path.parent / split_dir_value
              for order, (entry, source_place) in enumerate(zip(places, source)):
                  if entry.get('order') != order:
                      errs.append(f'order:{entry.get("id")}')
                  rel_file = entry.get('file')
                  if not isinstance(rel_file, str):
                      errs.append(f'missing_file:{entry.get("id")}')
                      continue
                  split_path = sm_path.parent / rel_file
                  if not split_path.exists():
                      errs.append(f'missing_split:{entry.get("id")}')
                      continue
                  split_text = split_path.read_text(encoding='utf-8')
                  try:
                      split_payload = json.loads(split_text)
                  except Exception:
                      errs.append(f'invalid_split:{entry.get("id")}')
                      continue
                  if split_payload != source_place:
                      errs.append(f'split_content:{entry.get("id")}')
                  split_sha = hashlib.sha256(split_text.encode('utf-8')).hexdigest()
                  if entry.get('sha256') != split_sha:
                      errs.append(f'split_sha256:{entry.get("id")}')

              split_manifests.append({
                  'manifest': str(sm_path),
                  'source': source_path_value,
                  'place_count': len(source),
                  'errors': errs,
              })
              if errs:
                  split_errors.append({'manifest': str(sm_path), 'errors': errs})

          if split_errors:
              raise SystemExit(f'Split manifest errors: {split_errors[:20]}')

          report = {
              'status': 'ok',
              'active_history_files': len(active_history_files),
              'active_history_places': active_history_places,
              'manifest_total_files': len(files),
              'manifest_unique_place_ids': len(id_counts),
              'duplicate_manifest_paths': 0,
              'duplicate_place_ids': 0,
              'active_history_non_historie_entries': 0,
              'validated_split_manifests': len(split_manifests),
              'split_manifest_errors': 0,
              'active_history_paths': active_history_files,
          }
          out = Path('reports/category-audit/history-category-audit-final.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          inventory = Path('reports/category-audit/history-aggregate-inventory.json')
          if inventory.exists():
              inventory.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports/category-audit
          git rm .github/workflows/validate-history-category-audit-final.yml
          git rm .github/history-category-audit-final-trigger.txt
          git commit -m "Validate final history category audit"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            sleep 2
          done
          exit 1
