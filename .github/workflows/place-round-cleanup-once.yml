name: Place round cleanup once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/place-round-cleanup-once.yml
      - js/ui/place-rounds-visual-collections.js
      - data/places/README_place_rounds.md

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/place-rounds-canonical-four-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/place-rounds-canonical-four-cleanup
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Remove legacy round registry from place-card
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/ui/place-card.js')
          text = path.read_text()
          start_marker = '''// ============================================================\n// PLACE ROUNDS — kategori-profiler med manuelle overstyringer'''
          end_marker = 'window.getPlaceRounds = getPlaceRounds;'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('legacy round registry sentinels not found')
          end += len(end_marker)
          replacement = '''// ============================================================
// PLACE ROUNDS — compatibility bridge only
// ------------------------------------------------------------
// Canonical round identity, profiles and presentation are owned only by:
//   data/places/README_place_rounds.md
//   js/ui/place-rounds-visual-collections.js
//
// Do not add a second registry, palette, category matrix or round count here.
// This bridge exists because the older openPlaceCard flow still calls
// applyPlaceRounds(place) before the canonical visual runtime applies itself.
// ============================================================
function getPlaceRounds(place) {
  const api = window.HGVisualPlaceRounds;
  if (api && typeof api.get === "function") {
    const ids = api.get(place);
    const byId = new Map((api.registry || []).map(def => [def.id, def]));
    return ids.map(id => byId.get(id)).filter(Boolean);
  }
  return [];
}

function applyPlaceRounds(place) {
  window.HGVisualPlaceRounds?.apply?.(place);
}

window.HGPlaceRounds = {
  get: getPlaceRounds,
  apply: applyPlaceRounds,
  canonicalOwner: "data/places/README_place_rounds.md"
};
window.getPlaceRounds = getPlaceRounds;'''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Verify targeted round tests
        run: |
          node --check js/ui/place-card.js
          node --check js/ui/nature-place-map.js
          node --test tests/place-rounds-visual-collections.test.mjs tests/place-rounds-grid-exclusivity.test.mjs tests/place-rounds-fill-layout.test.mjs tests/nature-place-map.test.mjs

      - name: Commit cleanup and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/place-round-cleanup-once.yml
          git add js/ui/place-card.js
          git commit -m "Remove legacy PlaceCard round registry"
          git push origin HEAD:agent/place-rounds-canonical-four-cleanup
