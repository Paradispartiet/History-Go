name: TEMP Bankplassen v3 final UI close

on:
  push:
    branches:
      - repair/bankplassen-4-v3-final-20260917

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Close verified final UI review and rebuild V3 projections
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from pathlib import Path

          path = Path('data/places/workflow/norges_bank_bankplassen_4.json')
          record = json.loads(path.read_text())
          review = record['manual_reviews']['final_ui']
          if review['status'] != 'PENDING':
              raise SystemExit(f"expected final_ui PENDING, got {review['status']}")
          if record['state'] != 'in_progress':
              raise SystemExit(f"expected state in_progress, got {record['state']}")
          review['status'] = 'PASS'
          review['evidence'] = 'QA run 35182483058 passed desktop and mobile PlaceCard plus unified info-surface capture for norges_bank_bankplassen_4 after discovery stabilization.'
          record['state'] = 'complete'
          path.write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n')
          PY

          node scripts/build-place-production-v3-projections.mjs norges_bank_bankplassen_4
          node scripts/build-place-production-v3-projections.mjs norges_bank_bankplassen_4 --check
          node --test tests/norges-bank-bankplassen-4-place-production-v3.test.mjs
          git diff --check

          rm -f .github/workflows/tmp-bankplassen-v3-final-ui-close.yml
          git add \
            data/places/workflow/norges_bank_bankplassen_4.json \
            reports/place-production/norges-bank-bankplassen-4-workcard-current.json \
            reports/place-production/norges-bank-bankplassen-4-quality-gate-current.json \
            .github/workflows/tmp-bankplassen-v3-final-ui-close.yml

          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/tmp-bankplassen-v3-final-ui-close.yml data/places/workflow/norges_bank_bankplassen_4.json reports/place-production/norges-bank-bankplassen-4-quality-gate-current.json reports/place-production/norges-bank-bankplassen-4-workcard-current.json "

          git config user.name 'Bankplassen V3 Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'repair: close Bankplassen final UI review'
          git push origin HEAD:repair/bankplassen-4-v3-final-20260917
