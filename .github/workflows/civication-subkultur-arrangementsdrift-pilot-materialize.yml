name: Civication Subkultur arrangementsdrift pilot materializer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: civication-subkultur-arrangementsdrift-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/civication-subkultur-arrangementsdrift-pilot-playable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply proven permanent Civication repairs and stage instrumentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old_lines, new_lines, marker):
              text = path.read_text()
              old = "\n".join(old_lines) + "\n"
              new = "\n".join(new_lines) + "\n"
              if old in text:
                  path.write_text(text.replace(old, new, 1))
                  return
              if new not in text:
                  raise SystemExit(f"{marker} target not found")

          runtime = Path('js/Civication/systems/civicationWorkdayMailBuilder.js')
          replace_once(runtime, [
              '  function pickDailyExtra(pool, wantedTypes, usedSourceIds, seed, phaseId, slotId, context) {',
              '    const wantedList = uniqueStrings(wantedTypes);',
              '    const wanted = new Set(wantedList);',
              '    if (!wanted.size) return null;',
              '    const safe = (Array.isArray(pool) ? pool : [])',
              '      .filter((mail) => mailMatchesDailyProgression(mail, context))',
              '      .filter(isActionableSceneCandidate);',
              '    let candidates = safe.filter((mail) => {',
              '      const id = norm(mail?.id);',
              '      return id && !usedSourceIds.has(id) && wanted.has(norm(mail?.mail_type));',
              '    });',
              '    const primaryType = wantedList[0];',
              '    if (CASE_THREAD_TYPES.has(primaryType)) {',
              '      const primaryCandidates = candidates.filter((mail) => norm(mail?.mail_type) === primaryType);',
              '      if (primaryCandidates.length) candidates = primaryCandidates;',
              '    }',
              '    if (!candidates.length && !isStrictDailySlot(slotId)) {',
              '      candidates = safe.filter((mail) => {',
              '        const id = norm(mail?.id);',
              '        return id && !usedSourceIds.has(id);',
              '      });',
              '    }',
              '    candidates.sort((a, b) => {',
              '      const phase = norm(phaseId);',
              '      const aPhase = norm(a?.phase) === phase ? 500000 : 0;',
              '      const bPhase = norm(b?.phase) === phase ? 500000 : 0;',
              '      return (bPhase + seededScore(seed, b)) - (aPhase + seededScore(seed, a));',
              '    });',
              '    const selected = candidates[0] || null;',
              '    if (selected) usedSourceIds.add(norm(selected.id));',
              '    return selected;',
              '  }',
          ], [
              '  function pickDailyExtra(pool, wantedTypes, usedSourceIds, seed, phaseId, slotId, context) {',
              '    const wantedList = uniqueStrings(wantedTypes);',
              '    if (!wantedList.length) return null;',
              '    const safe = (Array.isArray(pool) ? pool : [])',
              '      .filter((mail) => mailMatchesDailyProgression(mail, context))',
              '      .filter(isActionableSceneCandidate);',
              '    let candidates = [];',
              '    for (const wantedType of wantedList) {',
              '      const preferred = safe.filter((mail) => {',
              '        const id = norm(mail?.id);',
              '        return id && !usedSourceIds.has(id) && norm(mail?.mail_type) === wantedType;',
              '      });',
              '      if (preferred.length) {',
              '        candidates = preferred;',
              '        break;',
              '      }',
              '    }',
              '    if (!candidates.length && !isStrictDailySlot(slotId)) {',
              '      candidates = safe.filter((mail) => {',
              '        const id = norm(mail?.id);',
              '        return id && !usedSourceIds.has(id);',
              '      });',
              '    }',
              '    candidates.sort((a, b) => {',
              '      const phase = norm(phaseId);',
              '      const aPhase = norm(a?.phase) === phase ? 500000 : 0;',
              '      const bPhase = norm(b?.phase) === phase ? 500000 : 0;',
              '      return (bPhase + seededScore(seed, b)) - (aPhase + seededScore(seed, a));',
              '    });',
              '    const selected = candidates[0] || null;',
              '    if (selected) usedSourceIds.add(norm(selected.id));',
              '    return selected;',
              '  }',
          ], 'pickDailyExtra')

          replace_once(runtime, [
              '  function addExistingSourcesToUsed(runtime, usedSourceIds) {',
              '    for (const row of (Array.isArray(runtime?.items) ? runtime.items : [])) {',
              '      const event = row?.event || {};',
              '      if (norm(event?.source_type) === "daily_generated") continue;',
              '      const sourceId = norm(event?.source_mail_id || event?.daily_mail_meta?.source_mail_id);',
              '      if (sourceId) usedSourceIds.add(sourceId);',
              '    }',
              '  }',
          ], [
              '  function isDailyExtraRebuildRow(row) {',
              '    const event = row?.event || {};',
              '    if (event?.go_to_work === true) return false;',
              '    const sourceType = norm(event?.source_type);',
              '    if (sourceType === "daily_generated") return true;',
              '    if (sourceType !== "daily_extra") return false;',
              '    return norm(row?.selected_by) === "CivicationSceneDirector" ||',
              '      norm(event?.daily_mail_meta?.selection_owner) === "CivicationSceneDirector";',
              '  }',
              '  function addExistingSourcesToUsed(runtime, usedSourceIds) {',
              '    for (const row of (Array.isArray(runtime?.items) ? runtime.items : [])) {',
              '      const event = row?.event || {};',
              '      if (isDailyExtraRebuildRow(row)) continue;',
              '      const sourceId = norm(event?.source_mail_id || event?.daily_mail_meta?.source_mail_id);',
              '      if (sourceId) usedSourceIds.add(sourceId);',
              '    }',
              '  }',
          ], 'addExistingSourcesToUsed')

          replace_once(runtime, [
              '      if (row?.phase_generator) return row;',
              '      if (norm(event?.source_type) !== "daily_generated") return row;',
              '      if (event?.go_to_work === true) return row;',
          ], [
              '      if (row?.phase_generator) return row;',
              '      if (!isDailyExtraRebuildRow(row)) return row;',
              '      if (event?.go_to_work === true) return row;',
          ], 'populateDailyExtraSlots rebuild guard')

          test = Path('tests/civication-scene-director-daily-catalog.test.js')
          replace_once(test, [
              '  "data/Civication/mailFamilies/fixture/micro/fixture_role_micro.json": catalog("micro", [',
              '    mail("micro_one", "micro", "micro_ops"),',
              '    mail("micro_two", "micro", "micro_choice")',
              '  ]),',
          ], [
              '  "data/Civication/mailFamilies/fixture/micro/fixture_role_micro.json": catalog("micro", [',
              '    mail("micro_one", "micro", "micro_choice")',
              '  ]),',
              '  "data/Civication/mailFamilies/fixture/knowledge/fixture_role_knowledge.json": catalog("knowledge", [',
              '    mail("knowledge_one", "knowledge", "knowledge_ops")',
              '  ]),',
          ], 'knowledge fixture')

          replace_once(test, [
              '    rows.push(row("forenoon", "operational_mail", generated("g_operational")));',
              '    rows.push(row("forenoon", "people_ping", generated("g_people")));',
              '    rows.push(row("forenoon", "small_choice", generated("g_small")));',
          ], [
              '    rows.push(row("forenoon", "small_choice", generated("g_small")));',
              '    rows.push(row("forenoon", "operational_mail", generated("g_operational")));',
              '    rows.push(row("forenoon", "people_ping", generated("g_people")));',
          ], 'daily row order fixture')

          replace_once(test, [
              '  assert.deepEqual(',
              '    extras.map((runtimeRow) => runtimeRow.event.mail_type).sort(),',
              '    ["conflict", "consequence", "followup", "job", "micro", "micro", "people"].sort()',
              '  );',
          ], [
              '  assert.deepEqual(',
              '    extras.map((runtimeRow) => runtimeRow.event.mail_type).sort(),',
              '    ["conflict", "consequence", "followup", "job", "knowledge", "micro", "people"].sort()',
              '  );',
              '  const operational = runtime.items.find((runtimeRow) => runtimeRow.slot === "operational_mail");',
              '  const peoplePing = runtime.items.find((runtimeRow) => runtimeRow.slot === "people_ping");',
              '  assert.equal(operational.event.mail_type, "knowledge", "operational_mail skal velge knowledge foran job når tidligere prioritet er utilgjengelig");',
              '  assert.equal(peoplePing.event.mail_type, "people", "people_ping skal velge people når people finnes");',
              '',
              '  const rebuilt = await windowObject.CivicationSceneDirector.populateDailyExtraSlots(active, state, runtime);',
              '  const rebuiltExtras = rebuilt.items.filter((runtimeRow) => runtimeRow.event.source_type === "daily_extra");',
              '  const rebuiltOperational = rebuilt.items.find((runtimeRow) => runtimeRow.slot === "operational_mail");',
              '  const rebuiltPeoplePing = rebuilt.items.find((runtimeRow) => runtimeRow.slot === "people_ping");',
              '  assert.equal(rebuiltOperational.event.mail_type, "knowledge", "rebuild skal ikke reservere knowledge-kilden som slotten selv skal erstatte");',
              '  assert.equal(rebuiltPeoplePing.event.mail_type, "people", "rebuild skal ikke reservere people-kilden som slotten selv skal erstatte");',
              '  assert.equal(',
              '    new Set(rebuiltExtras.map((runtimeRow) => runtimeRow.event.source_mail_id)).size,',
              '    rebuiltExtras.length,',
              '    "rebuild skal bevare no-duplicate source-ID-garantien"',
              '  );',
          ], 'daily catalog regression assertions')

          audit = Path('scripts/audit-civication-career-gameplay.mjs')
          replace_once(audit, [
              '  const badge = badges.get(world.category);',
              '  const tierRows = world.badge_titles.map((title) => {',
              "    const index = (badge?.tiers || []).findIndex((tier) => String(tier.label || '') === title);",
              '    const tier = index >= 0 ? badge.tiers[index] : null;',
              '    const contract = tier?.career_unlock || tier?.career_offer || null;',
          ], [
              '  const badge = badges.get(world.category);',
              '  const badgeTiers = badge?.tiers || [];',
              '  const tierRows = world.badge_titles.map((title) => {',
              "    let index = badgeTiers.findIndex((tier) => String(tier.label || '') === title);",
              '    if (index < 0) {',
              '      index = badgeTiers.findIndex((tier) => {',
              '        const candidate = tier?.career_unlock || tier?.career_offer || null;',
              "        return String(candidate?.title || '') === title &&",
              '          (!candidate?.role_scope || String(candidate.role_scope) === world.role_scope);',
              '      });',
              '    }',
              '    const tier = index >= 0 ? badgeTiers[index] : null;',
              '    const contract = tier?.career_unlock || tier?.career_offer || null;',
          ], 'career gameplay tier resolution')

          materializer = Path('scripts/materialize-civication-subkultur-arrangementsdrift-pilot.mjs')
          replace_once(materializer, [
              "const run = (args) => execFileSync(process.execPath, args, { cwd: ROOT, stdio: 'inherit' });",
          ], [
              'const run = (stage, args) => {',
              "  const command = [process.execPath, ...args].join(' ');",
              '  console.log(`::group::Subkultur materializer: ${stage}`);',
              '  try {',
              "    execFileSync(process.execPath, args, { cwd: ROOT, stdio: 'inherit' });",
              '    console.log(`::notice title=Subkultur materializer stage passed::${stage}`);',
              '  } catch (error) {',
              '    console.error(`::error title=Subkultur materializer stage failed::${stage} (${command})`);',
              '    throw error;',
              '  } finally {',
              "    console.log('::endgroup::');",
              '  }',
              '};',
          ], 'materializer run helper')

          replace_once(materializer, [
              "run(['scripts/audit-civication-career-gameplay.mjs', '--write']);",
              "run(['scripts/build-civication-scene-registry.mjs', '--write']);",
              "run(['scripts/build-civication-scene-registry.mjs', '--check']);",
              "run(['tests/civication-subkultur-arrangementsdrift-playability.test.js']);",
              "run(['tests/civication-mail-choice-uniqueness.test.js']);",
              "run(['tests/civication-religion-forskning-playability.test.js']);",
              "run(['tests/civication-produksjonsassistent-playability.test.js']);",
              "run(['tests/civication-avdelingsleder-playability.test.js']);",
              "run(['tests/civication-role-world-contract.test.js']);",
          ], [
              "run('career-audit', ['scripts/audit-civication-career-gameplay.mjs', '--write']);",
              "run('compiled-scene-registry-build', ['scripts/build-civication-scene-registry.mjs', '--write']);",
              "run('compiled-scene-registry-check', ['scripts/build-civication-scene-registry.mjs', '--check']);",
              "run('subkultur-playability', ['tests/civication-subkultur-arrangementsdrift-playability.test.js']);",
              "run('choice-uniqueness-regression', ['tests/civication-mail-choice-uniqueness.test.js']);",
              "run('religion-forskning-regression', ['tests/civication-religion-forskning-playability.test.js']);",
              "run('produksjonsassistent-regression', ['tests/civication-produksjonsassistent-playability.test.js']);",
              "run('avdelingsleder-regression', ['tests/civication-avdelingsleder-playability.test.js']);",
              "run('role-world-integrity', ['tests/civication-role-world-contract.test.js']);",
          ], 'materializer stage calls')
          PY

      - name: Verify proven repairs before materialization
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/audit-civication-career-gameplay.mjs
          node --check scripts/materialize-civication-subkultur-arrangementsdrift-pilot.mjs
          node tests/civication-scene-director-daily-catalog.test.js
          git diff --check

      - name: Commit proven permanent repairs before materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/audit-civication-career-gameplay.mjs \
            js/Civication/systems/civicationWorkdayMailBuilder.js \
            tests/civication-scene-director-daily-catalog.test.js \
            scripts/materialize-civication-subkultur-arrangementsdrift-pilot.mjs
          if git diff --cached --quiet; then
            echo "Proven Civication repairs already permanent."
          else
            git commit -m "Fix Civication career tier and daily slot selection"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Materialize and verify Subkultur arrangementsdrift pilot
        run: node scripts/materialize-civication-subkultur-arrangementsdrift-pilot.mjs

      - name: Commit verified permanent outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/Civication/roleModels/subkultur/subkultur_arrangementsdrift.json \
            data/Civication/workGrammars/subkultur/subkultur_arrangementsdrift.json \
            data/Civication/mailPlans/subkultur/subkultur_arrangementsdrift_plan.json \
            data/Civication/mailFamilies/subkultur/job/subkultur_arrangementsdrift_job.json \
            data/Civication/mailFamilies/subkultur/people/subkultur_arrangementsdrift_people.json \
            data/Civication/mailFamilies/subkultur/conflict/subkultur_arrangementsdrift_conflict.json \
            data/Civication/mailFamilies/subkultur/event/subkultur_arrangementsdrift_event.json \
            data/Civication/mailFamilies/subkultur/followup/subkultur_arrangementsdrift_followup.json \
            data/Civication/mailFamilies/subkultur/knowledge/subkultur_arrangementsdrift_knowledge.json \
            data/Civication/mailFamilies/subkultur/consequence/subkultur_arrangementsdrift_consequence.json \
            data/Civication/careerGameplayMatrix.json \
            data/Civication/compiledSceneRegistryV1.json \
            reports/civication-career-gameplay-matrix.md \
            tests/civication-subkultur-arrangementsdrift-playability.test.js
          if git diff --cached --quiet; then
            echo "Subkultur arrangementsdrift pilot already materialized; nothing to commit."
            exit 0
          fi
          git commit -m "Materialize playable Subkultur arrangementsdrift pilot"
          git push origin HEAD:${{ github.head_ref }}
