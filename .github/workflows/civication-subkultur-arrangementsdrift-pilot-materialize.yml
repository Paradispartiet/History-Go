name: Civication Subkultur arrangementsdrift pilot materializer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: civication-subkultur-arrangementsdrift-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/civication-subkultur-arrangementsdrift-pilot-playable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify permanent Civication repairs before materialization
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/audit-civication-career-gameplay.mjs
          node --check scripts/materialize-civication-subkultur-arrangementsdrift-pilot.mjs
          node tests/civication-scene-director-daily-catalog.test.js
          git diff --check

      - name: Materialize and verify Subkultur arrangementsdrift pilot
        shell: bash
        run: |
          set -euo pipefail
          node scripts/materialize-civication-subkultur-arrangementsdrift-pilot.mjs 2>&1 | tee subkultur-materializer.log

      - name: Upload materializer failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: subkultur-arrangementsdrift-materializer-log-${{ github.run_attempt }}
          path: subkultur-materializer.log
          if-no-files-found: error
          retention-days: 1

      - name: Commit verified permanent outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/Civication/roleModels/subkultur/subkultur_arrangementsdrift.json \
            data/Civication/workGrammars/subkultur/subkultur_arrangementsdrift.json \
            data/Civication/mailPlans/subkultur/subkultur_arrangementsdrift_plan.json \
            data/Civication/mailFamilies/subkultur/job/subkultur_arrangementsdrift_job.json \
            data/Civication/mailFamilies/subkultur/people/subkultur_arrangementsdrift_people.json \
            data/Civication/mailFamilies/subkultur/conflict/subkultur_arrangementsdrift_conflict.json \
            data/Civication/mailFamilies/subkultur/event/subkultur_arrangementsdrift_event.json \
            data/Civication/mailFamilies/subkultur/followup/subkultur_arrangementsdrift_followup.json \
            data/Civication/mailFamilies/subkultur/knowledge/subkultur_arrangementsdrift_knowledge.json \
            data/Civication/mailFamilies/subkultur/consequence/subkultur_arrangementsdrift_consequence.json \
            data/Civication/careerGameplayMatrix.json \
            data/Civication/compiledSceneRegistryV1.json \
            reports/civication-career-gameplay-matrix.md \
            tests/civication-subkultur-arrangementsdrift-playability.test.js
          if git diff --cached --quiet; then
            echo "Subkultur arrangementsdrift pilot already materialized; nothing to commit."
            exit 0
          fi
          git commit -m "Materialize playable Subkultur arrangementsdrift pilot"
          git push origin HEAD:${{ github.head_ref }}
