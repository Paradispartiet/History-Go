name: Temporary Regjeringskvartalet news production

on:
  push:
    branches:
      - production/regjeringskvartalet-phase-5-news
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  produce:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: production/regjeringskvartalet-phase-5-news
          fetch-depth: 0

      - name: Produce phase 5
        run: python .github/scripts/_tmp_regjeringskvartalet_news.py

      - name: Validate targeted phase
        run: node --test tests/regjeringskvartalet-news-phase.test.mjs

      - name: Remove temporary production files
        run: |
          rm .github/workflows/_tmp-regjeringskvartalet-news.yml
          rm .github/scripts/_tmp_regjeringskvartalet_news.py

      - name: Commit phase 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leksikon/places/oslo/politikk/leksikon_regjeringskvartalet.json reports/place-production/regjeringskvartalet-politikk-v1.md tests/regjeringskvartalet-news-phase.test.mjs .github/workflows/_tmp-regjeringskvartalet-news.yml .github/scripts/_tmp_regjeringskvartalet_news.py
          git commit -m "Bygg Nyheter for Regjeringskvartalet"
          git push origin HEAD:production/regjeringskvartalet-phase-5-news
