name: Fagverk Helse clinical medicine source brief

on:
  pull_request:
    paths:
      - 'data/fag/helse/clinical_medicine_source_claim_brief_v1.json'
      - 'data/fag/fag_manifest.json'
      - 'data/fagverk/helse/**'
      - 'data/fagverk/fagverk_registry.json'
      - 'data/fagverk/fagverk_release.json'
      - 'data/fagverk/subject_inventory.json'
      - 'data/fagverk/subject_status.json'
      - 'reports/fagverk/helse-clinical-medicine-source-brief-v1-audit.json'
      - 'scripts/*helse-clinical-medicine*'
      - 'scripts/audit-helse-cumulative-progress-v1.mjs'
      - 'tests/helse-clinical-medicine-source-brief-v1.test.mjs'
      - 'tests/helse-cumulative-progress-v1.test.mjs'
      - '.github/workflows/fagverk-helse-clinical-medicine-source-brief.yml'
  push:
    branches: [main]
    paths:
      - 'data/fag/helse/clinical_medicine_source_claim_brief_v1.json'
      - 'scripts/*helse-clinical-medicine*'
      - 'tests/helse-clinical-medicine-source-brief-v1.test.mjs'
      - '.github/workflows/fagverk-helse-clinical-medicine-source-brief.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - id: progress
        shell: bash
        run: |
          count=$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('data/fagverk/fagverk_registry.json','utf8')).subjects.helse.editorialPlan.registeredChapterCount;process.stdout.write(String(r))")
          if [[ "$count" -ge 4 ]]; then
            echo "fulltext=true" >> "$GITHUB_OUTPUT"
            echo "Clinical medicine is already fulltext-materialized at $count/12; preserve source brief and validate cumulative state."
          else
            echo "fulltext=false" >> "$GITHUB_OUTPUT"
          fi
      - id: source_gate
        shell: bash
        run: |
          if [[ -f scripts/brief-helse-clinical-medicine-sources-v1.mjs && -f tests/helse-clinical-medicine-source-brief-v1.test.mjs ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Bootstrap only: clinical medicine source brief generator/test not present yet."
          fi
      - if: steps.source_gate.outputs.ready == 'true' && steps.progress.outputs.fulltext != 'true'
        run: node scripts/brief-helse-clinical-medicine-sources-v1.mjs
      - run: node scripts/audit-helse-cumulative-progress-v1.mjs
      - run: node scripts/audit-fagverk-subject-inventory.mjs
      - run: node scripts/audit-fagverk-general-engine.mjs
      - run: node scripts/audit-fagverk-theory-quality.mjs
      - run: node scripts/audit-fagverk-theory-integrity.mjs
      - run: node scripts/build-fagverk-release-manifest.mjs --check
      - if: steps.source_gate.outputs.ready == 'true' && steps.progress.outputs.fulltext != 'true'
        run: node --test tests/helse-clinical-medicine-source-brief-v1.test.mjs tests/helse-cumulative-progress-v1.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-general-engine.test.mjs tests/fagverk-release-manifest.test.mjs
      - if: steps.progress.outputs.fulltext == 'true'
        run: node --test tests/helse-cumulative-progress-v1.test.mjs tests/fagverk-subject-inventory.test.mjs tests/fagverk-general-engine.test.mjs tests/fagverk-release-manifest.test.mjs
