name: Tjuvholmen authentic THE THIEF logo one-shot
on:
  pull_request:
    paths:
      - '.github/workflows/tjuvholmen-the-thief-logo-one-shot.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tjuvholmen-thief-logo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/tjuvholmen-the-thief-brand-logo-20261112
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow requests cairosvg
      - name: Fetch authentic source and normalize unchanged artwork
        run: |
          python - <<'PY'
          import hashlib,json
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          import requests,cairosvg
          url='https://static.thatsup.website/520/57271/Thethief-logo-ice-blue.svg?v=1745055281'
          page='https://thethief.com/'
          res=requests.get(url,timeout=45,headers={'User-Agent':'HistoryGo EducationalPlaceDocumentation/1.0'})
          res.raise_for_status()
          source=res.content
          if not source.strip().startswith((b'<svg',b'<?xml')) or b'<svg' not in source[:7000]:
            raise ValueError('THE THIEF official source is not SVG')
          svg_path=Path('bilder/kort/brands/source/the_thief_official_ice_blue.svg')
          out=Path('bilder/kort/brands/the_thief.webp')
          attribution=Path('data/brands/the_thief_logo_provenance.json')
          svg_path.parent.mkdir(parents=True,exist_ok=True)
          out.parent.mkdir(parents=True,exist_ok=True)
          svg_path.write_bytes(source)
          original_png=cairosvg.svg2png(bytestring=source,output_width=1100)
          with Image.open(BytesIO(original_png)) as inp:
            logo=inp.convert('RGBA')
            logo.thumbnail((840,460),Image.Resampling.LANCZOS)
            full=Image.new('RGBA',(900,520),(0,0,0,0))
            full.alpha_composite(logo,((900-logo.width)//2,(520-logo.height)//2))
            full.save(out,'WEBP',lossless=True,method=6)
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          info={
            'schema':'history_go_brand_asset_attribution_v1',
            'brandId':'the_thief','path':str(out),'sourcePage':page,
            'sourceAsset':url,'sourceLocalAsset':str(svg_path),
            'assetKind':'logo','sourceForm':'original_official_current_logo',
            'creator':'THE THIEF','credit':'THE THIEF official hotel website',
            'rightsBasis':'referential_trademark_identification; authentic logo asset displayed by official hotel website; no affiliation or endorsement implied',
            'license':'Original trademark, not Creative Commons',
            'usageContext':'referential_identification','noEndorsement':True,
            'sourceDimensions':list(Image.open(BytesIO(original_png)).size),
            'outputDimensions':[900,520],
            'transformation':'Original site SVG rendered to PNG and aspect-preserving downscaled/padded on transparency; no icon redrawing or wordmark reconstruction',
            'sourceSha256':digest(svg_path),'assetSha256':digest(out),
            'reviewStatus':'source_verified_visual_review_pending',
            'verifiedDate':'2026-11-12',
            'temporalScope':'current',
            'placeId':'tjuvholmen'
          }
          attribution.write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n')
          master=Path('data/brands/brands_master.json')
          brands=json.loads(master.read_text())
          match=[b for b in brands if b.get('id')=='the_thief']
          assert len(match)==1
          match[0]['logo']=str(out)
          match[0]['source_urls']=list(dict.fromkeys(match[0].get('source_urls',[])+['https://thethief.com/']))
          master.write_text(json.dumps(brands,ensure_ascii=False,indent=2)+'\n')
          print('OFFICIAL_THE_THIEF',json.dumps(info,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tjuvholmen-the-thief-logo-preview
          path: |
            bilder/kort/brands/the_thief.webp
            bilder/kort/brands/source/the_thief_official_ice_blue.svg
            data/brands/the_thief_logo_provenance.json
      - name: Commit only sourced brand logo and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/kort/brands/source/the_thief_official_ice_blue.svg bilder/kort/brands/the_thief.webp data/brands/the_thief_logo_provenance.json data/brands/brands_master.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat(tjuvholmen): authentic THE THIEF brand mark and verifiable provenance"
            git reset --hard HEAD
            git clean -fd
            git fetch origin content/tjuvholmen-the-thief-brand-logo-20261112
            git rebase origin/content/tjuvholmen-the-thief-brand-logo-20261112
            git push origin HEAD:content/tjuvholmen-the-thief-brand-logo-20261112
          fi
