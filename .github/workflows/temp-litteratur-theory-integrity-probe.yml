name: TEMP Litteratur theory integrity probe

on:
  push:
    branches:
      - agent/fagverk-litteratur-theory-integrity-proof-20260820
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate permanent strict gate before promotion
        run: |
          node --check tools/audit-litteratur-theory-integrity.mjs
          node --test tests/litteratur-theory-integrity.test.mjs
          node tools/audit-litteratur-theory-integrity.mjs --write-report --no-check-report | tee /tmp/litteratur-theory-integrity-audit.json
      - name: Upload strict-gate candidate report
        uses: actions/upload-artifact@v4
        with:
          name: litteratur-theory-integrity-probe
          path: /tmp/litteratur-theory-integrity-audit.json
