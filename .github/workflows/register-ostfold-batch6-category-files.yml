name: Register Ostfold batch 6 category files

on:
  push:
    branches:
      - main
    paths:
      - .github/ostfold-batch6-split-trigger.txt

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Split category file, reduce batch, and update manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          batch_path = Path('data/places/historie/ostfold/places_historie_ostfold_batch6.json')
          batch = json.loads(batch_path.read_text(encoding='utf-8'))
          ids = [place['id'] for place in batch]
          if len(ids) != len(set(ids)):
              raise SystemExit('Duplicate IDs in Ostfold batch 6')

          moves = [
              ('homlungen_fyr', 'by', Path('data/places/by/ostfold/homlungen_fyr.json')),
          ]
          move_ids = {place_id for place_id, _, _ in moves}
          by_id = {place['id']: place for place in batch}
          missing = move_ids - set(by_id)
          if missing:
              raise SystemExit(f'Missing Ostfold batch 6 move IDs: {sorted(missing)}')

          for place_id, category, destination in moves:
              if destination.exists():
                  raise SystemExit(f'Destination already exists: {destination}')
              place = dict(by_id[place_id])
              place['category'] = category
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(
                  json.dumps([place], ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )

          reduced = [place for place in batch if place['id'] not in move_ids]
          expected_retained = [
              'folkenborg_museum',
              'elingaard_herregard',
              'nes_lensemuseum',
              'spydeberg_kirke',
              'trogstad_kirke',
              'skiptvet_kirke',
              'momarken_markedsplass',
          ]
          if [place['id'] for place in reduced] != expected_retained:
              raise SystemExit(
                  f'Unexpected retained Ostfold batch 6 IDs: {[place["id"] for place in reduced]}'
              )
          if any(place.get('category') != 'historie' for place in reduced):
              raise SystemExit('Retained Ostfold batch 6 place has non-historie category')
          batch_path.write_text(
              json.dumps(reduced, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          manifest_path = Path('data/places/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = manifest['files']
          anchor = 'places/historie/ostfold/places_historie_ostfold_batch6.json'
          additions = [
              'places/by/ostfold/homlungen_fyr.json',
          ]
          if anchor not in files:
              raise SystemExit(f'Manifest anchor missing: {anchor}')
          for item in additions:
              while item in files:
                  files.remove(item)
          insert_at = files.index(anchor) + 1
          files[insert_at:insert_at] = additions
          if len(files) != len(set(files)):
              raise SystemExit('Duplicate paths in places manifest after Ostfold batch 6 update')
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8',
          )
          PY
      - name: Commit changes and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/by/ostfold/homlungen_fyr.json
          git add data/places/historie/ostfold/places_historie_ostfold_batch6.json data/places/manifest.json
          git rm .github/workflows/register-ostfold-batch6-category-files.yml
          git rm .github/ostfold-batch6-split-trigger.txt
          git commit -m "Split and register Ostfold batch 6 category file"
          git push origin main
