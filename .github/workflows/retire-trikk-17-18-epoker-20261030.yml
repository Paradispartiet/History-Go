name: Refresh epoke index after Trikk 17/18 retirement
on:
  push:
    branches:
      - cleanup/remove-trikk-17-18-20261030
    paths:
      - '.github/workflows/retire-trikk-17-18-epoker-20261030.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-trikk-17-18-20261030
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate and check source-backed epoke place index
        run: |
          npm run epoker:places:build
          npm run epoker:places:check
          node --test tests/trikk-17-18-retirement.test.mjs
      - name: Commit regenerated epoke index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u data/epoker/epoke-place-index.json
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Sync historical epoke index after Trikk 17/18 removal"
            git push origin HEAD:cleanup/remove-trikk-17-18-20261030
          fi
