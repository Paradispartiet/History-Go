name: History semantic preflight temporary
# Diagnostic writer only. Writes a temporary PASS/FAIL report, never fagdata. Delete before merge.

on:
  push:
    branches:
      - agent/history-completion-audit
    paths:
      - '.github/workflows/history-semantic-preflight-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact History branch
        uses: actions/checkout@v4
        with:
          ref: agent/history-completion-audit
          fetch-depth: 0

      - name: Lock branch and current main
        shell: bash
        run: |
          set -euo pipefail
          echo "INITIAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main agent/history-completion-audit
          git merge-base --is-ancestor origin/main HEAD || {
            echo 'History branch does not contain current main; refusing diagnostic write.' >&2
            exit 1
          }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build semantic preflight report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/fagverk
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';

          const checks = [
            ['policy', ['policy']],
            ['primary_ownership', ['primary']],
            ['secondary_mapping', ['secondary']],
            ['legacy_partition', ['legacy']],
            ['active_blueprint_uniqueness', ['active-unique']],
            ['byhistorie_editorial_hooks', ['blueprint-file', 'byhistorie']],
            ['industri_editorial_hooks', ['blueprint-file', 'industri-arbeid']],
            ['velferd_editorial_hooks', ['blueprint-file', 'velferd']],
            ['overrides', ['overrides']],
            ['curated_30_of_30', ['coverage']],
            ['permanent_audit', null]
          ];

          const results = [];
          for (const [id, args] of checks) {
            const commandArgs = args
              ? ['tools/diagnose-historie-semantic-preflight-temp.mjs', ...args]
              : ['tools/audit-historie-semantic-hook-alignment.mjs'];
            const run = spawnSync(process.execPath, commandArgs, { encoding: 'utf8' });
            results.push({
              id,
              status: run.status === 0 ? 'PASS' : 'FAIL',
              exit_code: run.status,
              stdout: (run.stdout || '').trim(),
              stderr: (run.stderr || '').trim()
            });
          }
          const failed = results.filter((row) => row.status === 'FAIL');
          const report = {
            schema: 'history_go_historie_semantic_preflight_temp_v1',
            generated_from_head: process.env.INITIAL_HEAD,
            status: failed.length ? 'FAIL' : 'PASS',
            failed_checks: failed.map((row) => row.id),
            checks: results
          };
          fs.writeFileSync('reports/fagverk/historie-semantic-preflight-temp.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify({ status: report.status, failed_checks: report.failed_checks }, null, 2));
          NODE

      - name: Commit diagnostic report only
        shell: bash
        run: |
          set -euo pipefail
          git add reports/fagverk/historie-semantic-preflight-temp.json
          if git diff --cached --quiet; then
            echo 'Diagnostic report unchanged.'
            exit 0
          fi
          git commit -m 'Record History semantic preflight diagnosis'
          git fetch origin agent/history-completion-audit
          remote_head="$(git rev-parse origin/agent/history-completion-audit)"
          if [ "$remote_head" != "$INITIAL_HEAD" ]; then
            echo "History branch moved during diagnosis: started $INITIAL_HEAD, remote is $remote_head" >&2
            exit 1
          fi
          git push origin HEAD:agent/history-completion-audit
