name: One-time sync History V5.8 with main

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-sync-history-v5-8-with-main.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out V5.8 branch
        uses: actions/checkout@v4
        with:
          ref: agent/history-v5-8-cold-war
          fetch-depth: 0

      - name: Merge current main conservatively
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/historie-v5
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main 2>&1 \
            | tee reports/historie-v5/historie-v5-8-main-sync-fetch.log

          set +e
          git merge --no-commit --no-ff origin/main \
            > reports/historie-v5/historie-v5-8-main-sync-merge.log 2>&1
          merge_status=$?
          set -e
          cat reports/historie-v5/historie-v5-8-main-sync-merge.log

          if [ "$merge_status" -ne 0 ]; then
            git diff --name-only --diff-filter=U 2>&1 \
              | tee reports/historie-v5/historie-v5-8-main-sync-conflicts.log
            git status --short 2>&1 \
              | tee reports/historie-v5/historie-v5-8-main-sync-status.log
            exit "$merge_status"
          fi

          git diff --name-only HEAD -- .github/workflows \
            | tee reports/historie-v5/historie-v5-8-main-sync-workflow-exclusions.log
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if git cat-file -e "HEAD:$file" 2>/dev/null; then
              git checkout HEAD -- "$file"
            else
              git rm -f -- "$file"
            fi
          done < reports/historie-v5/historie-v5-8-main-sync-workflow-exclusions.log

          git status --short 2>&1 \
            | tee reports/historie-v5/historie-v5-8-main-sync-status.log
          git add -A
          git commit -m 'Synkroniser Historie V5.8 med main'
          git push origin HEAD:agent/history-v5-8-cold-war 2>&1 \
            | tee /tmp/historie-v5-8-main-sync-publish.log

      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-v5-8-main-sync
          path: |
            reports/historie-v5/historie-v5-8-main-sync-*.log
            /tmp/historie-v5-8-main-sync-publish.log
          if-no-files-found: warn
