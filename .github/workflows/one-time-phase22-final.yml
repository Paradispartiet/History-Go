name: One-time phase 22 final

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-phase22-final.yml

permissions:
  contents: write

jobs:
  build-clean-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reset target to current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -C agent/documentation-governance-phase-22-people-of-places origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply phase 22
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          registry_path = Path('docs/documentation_registry.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          method_path = 'docs/people-of-places-method.md'
          registry['documents'] = [e for e in registry['documents'] if e.get('path') != method_path]
          entry = {
              'path': method_path,
              'status': 'canonical',
              'role': 'Bindende redaksjonell metode for relevante, kildebelagte og ikke-dupliserte person–sted-koblinger',
              'owns': ['people_of_places_method'],
              'last_verified': '2026-07-26',
          }
          i = next(i + 1 for i, e in enumerate(registry['documents']) if e.get('path') == 'docs/DATA_PRODUCTION_CONTRACT.md')
          registry['documents'].insert(i, entry)
          registry['last_verified'] = '2026-07-26'
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme_path = Path('docs/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          section = '''### People-produksjon, stedskobling og bilder

1. [`people-of-places-method.md`](./people-of-places-method.md) — canonical relevans-, kilde-, gjenbruks- og batchmetode for person–sted-koblinger
2. [`../data/people/manifest.json`](../data/people/manifest.json) — aktive canonical people-source-filer
3. [`../tools/audit-people-of-places-status.mts`](../tools/audit-people-of-places-status.mts) — status-, schema-, referanse- og struktur-audit
4. [`../tools/check-people-of-places-gate.mts`](../tools/check-people-of-places-gate.mts) — blokkerer duplikater, ugyldige refs, manglende primæranker og tomme `places`
5. [`PEOPLE_IMAGES.md`](./PEOPLE_IMAGES.md) — canonical kilde-, lisens-, godkjennings- og attribusjonskontrakt for people-bilder
6. [`../tools/people-image-pipeline.mts`](../tools/people-image-pipeline.mts) — implementert kandidat-, review-, apply- og audit-pipeline
7. [`../tests/people-images.test.mjs`](../tests/people-images.test.mjs) — lisens-, identitets-, quality-, apply- og attribusjonsregresjoner

People of Places-metoden eier den redaksjonelle relevans- og kildegaten. Dagens CI blokkerer dupliserte people-ID-er, ugyldige place-referanser, manglende gyldige primærankere og tomme `places`, men beregner ikke full place-for-place-dekning og avgjør ikke historisk relevans. Dekningsmål og relevans må derfor dokumenteres i batchen. Runtime leser bare manifest-loadede canonical people-filer. Kandidat-, attribusjons- og statusrapporter er arbeids- og sporbarhetsdata, ikke parallelle people-sannheter.
'''
          starts = [readme.find('### People-bilder og rettigheter\n'), readme.find('### People-produksjon, stedskobling og bilder\n')]
          starts = [x for x in starts if x >= 0]
          if not starts:
              raise SystemExit('People-seksjonen mangler')
          start = min(starts)
          end = readme.find('\n### Koordinater og geografisk evidens\n', start)
          if end < 0:
              raise SystemExit('People-seksjonens slutt mangler')
          readme = readme[:start] + section.rstrip('\n') + readme[end:]
          bullet = '- `people-of-places-method.md` synkronisert med manifest/audit/gate og registrert som canonical redaksjonell metode'
          if bullet not in readme:
              anchor = '- `PEOPLE_IMAGES.md` synkronisert med pipeline og registrert som canonical bilde- og rettighetskontrakt'
              if anchor not in readme:
                  raise SystemExit('Konsolideringsankeret mangler')
              readme = readme.replace(anchor, anchor + '\n' + bullet, 1)
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Remove temporary files from target
        shell: bash
        run: |
          rm -f .github/workflows/one-time-phase22-final.yml
          rm -f .github/workflows/one-time-register-people-of-places-governance.yml
          rm -f .github/workflows/one-time-rebuild-phase22.yml
          rm -f .github/workflows/one-time-clean-rebuild-phase22.yml
          rm -f .github/phase22-main-trigger.txt .github/phase22-clean-trigger.txt
          rm -f .github/rebuild-phase22-trigger.txt .github/people-of-places-governance-trigger.txt

      - run: npm ci --no-audit --no-fund
      - run: npm run build:scripts
      - run: node dist/scripts/check-documentation-governance.mjs

      - name: Reset generated output
        run: |
          git restore --source=HEAD --worktree --staged -- dist 2>/dev/null || true
          git clean -fd -- dist

      - name: Verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          r = json.loads(Path('docs/documentation_registry.json').read_text())
          e = next(x for x in r['documents'] if x['path'] == 'docs/people-of-places-method.md')
          assert e['status'] == 'canonical' and e['owns'] == ['people_of_places_method']
          t = Path('docs/README.md').read_text()
          assert 'avgjør ikke historisk relevans' in t
          inv = json.loads(Path('reports/documentation-governance/inventory.json').read_text())
          assert 'docs/people-of-places-method.md' not in inv['unregistered_governance_candidates']
          PY

      - name: Commit target
        shell: bash
        run: |
          git add -A
          git commit -m "Registrer canonical People of Places-governance"
          git push --force origin HEAD:agent/documentation-governance-phase-22-people-of-places

      - name: Clean main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git switch -C main origin/main
          changed=0
          for f in .github/workflows/one-time-phase22-final.yml .github/workflows/one-time-register-people-of-places-governance.yml; do
            if [ -f "$f" ]; then git rm "$f"; changed=1; fi
          done
          if [ "$changed" = 1 ]; then
            git commit -m "Fjern engangsrunnere for dokumentasjonsfase 22"
            for n in 1 2 3 4 5; do git push origin HEAD:main && exit 0; git pull --rebase origin main; done
            exit 1
          fi
