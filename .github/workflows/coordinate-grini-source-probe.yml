name: One-time Grini coordinate source probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize current Ila and Grini map sources
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/grini"
          mkdir -p "$OUT"
          UA='History-Go coordinate research (Paradispartiet/History-Go)'
          curl --fail --silent --show-error --location --user-agent "$UA" \
            'https://api.openstreetmap.org/api/0.6/map?bbox=10.5790,59.9510,10.5965,59.9605' \
            | tee "$OUT/osm-grini-ila-bbox.xml" >/dev/null
          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'q=Ila fengsel, Eiksmarka, Norway' \
            --data 'format=jsonv2' --data 'polygon_geojson=1' --data 'extratags=1' --data 'namedetails=1' --data 'limit=20' \
            | tee "$OUT/nominatim-ila-fengsel.json" >/dev/null
          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://nominatim.openstreetmap.org/search' \
            --data-urlencode 'q=Grinimuseet, Eiksmarka, Norway' \
            --data 'format=jsonv2' --data 'polygon_geojson=1' --data 'extratags=1' --data 'namedetails=1' --data 'limit=20' \
            | tee "$OUT/nominatim-grinimuseet.json" >/dev/null
          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://ws.geonorge.no/adresser/v1/sok' \
            --data-urlencode 'sok=Jøssingveien 33 Eiksmarka' --data 'treffPerSide=30' \
            | tee "$OUT/geonorge-jossingveien-33.json" >/dev/null
          curl --fail --silent --show-error --location --user-agent "$UA" \
            --get 'https://ws.geonorge.no/adresser/v1/sok' \
            --data-urlencode 'sok=Jøssingveien 31 Eiksmarka' --data 'treffPerSide=30' \
            | tee "$OUT/geonorge-jossingveien-31.json" >/dev/null
      - name: Upload raw source artifact
        uses: actions/upload-artifact@v4
        with:
          name: grini-coordinate-source-probe
          path: ${{ runner.temp }}/grini
