name: Validate Atlas Obscura Oslo Wonderkammer batch 9

on:
  push:
    branches:
      - agent/atlas-obscura-oslo-wonderkammer-batch-9

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Save Atlas Obscura Wonderkammer batch 9 validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atlas-obscura-oslo-wonderkammer-batch-9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Audit Wonderkammer data
        run: |
          mkdir -p reports/atlas-obscura-oslo-wonderkammer-batch-9
          node scripts/audit-wonderkammer-data.mjs \
            | tee reports/atlas-obscura-oslo-wonderkammer-batch-9/wonderkammer-audit.txt
      - name: Verify parents and batch registration
        run: |
          node <<'NODE' | tee reports/atlas-obscura-oslo-wonderkammer-batch-9/parent-and-batch-check.txt
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('data/places/manifest.json', 'utf8'));
          const placeIds = new Set();
          for (const rel of manifest.files || []) {
            const path = `data/${rel.replace(/^data\//, '')}`;
            if (!fs.existsSync(path)) continue;
            const raw = JSON.parse(fs.readFileSync(path, 'utf8'));
            const rows = Array.isArray(raw) ? raw : Array.isArray(raw.places) ? raw.places : [raw];
            for (const row of rows) if (row?.id) placeIds.add(row.id);
          }
          for (const id of ['var_frelsers_gravlund', 'ekebergparken']) {
            if (!placeIds.has(id)) throw new Error(`Missing parent place: ${id}`);
            console.log(`parent OK: ${id}`);
          }
          const batchPath = 'data/wonderkammer/atlas_obscura_oslo_microplaces_batch_2.json';
          const index = JSON.parse(fs.readFileSync('data/wonderkammer/index.json', 'utf8'));
          if (!(index.files || []).includes(batchPath)) throw new Error('Batch missing from Wonderkammer index');
          const batch = JSON.parse(fs.readFileSync(batchPath, 'utf8'));
          const ids = [];
          for (const row of batch.places || []) for (const chamber of row.chambers || []) ids.push(chamber.id);
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate chamber id in batch');
          console.log(`batch index OK: ${batchPath}`);
          console.log(`unique new chambers: ${ids.length}`);
          NODE
      - name: Commit validation reports
        run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add reports/atlas-obscura-oslo-wonderkammer-batch-9
          if git diff --cached --quiet; then
            echo "No validation report changes."
          else
            git commit -m "Save Atlas Obscura Wonderkammer batch 9 validation"
            git push
          fi
