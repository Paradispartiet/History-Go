name: Fagverk Subkultur

on:
  pull_request:
    paths:
      - 'data/fag/subkultur/**'
      - 'data/fagverk/subkultur/**'
      - 'data/fagverk/fagverk_portal.json'
      - 'data/fagverk/subject_inventory.json'
      - 'data/fag/profiles/subkultur/**'
      - 'data/places/subkultur/**'
      - 'data/places/subkultur-production/**'
      - 'data/places/film/oslo/places/hartvig_nissens_skole_skam.json'
      - 'data/places/historie/oslo/places_historie/abelonegarden.json'
      - 'data/people/subkultur/**'
      - 'data/people/kunst/oslo/people_kunst_oslo.json'
      - 'data/people/musikk/oslo/people_musikk_oslo.json'
      - 'data/people/politikk/oslo/people_politikk_oslo.json'
      - 'data/quiz/subkultur/**'
      - 'data/knowledge/knowledge_manifest.json'
      - 'data/knowledge/subjects/subkultur/**'
      - 'docs/SUBKULTUR_FAGVERK_V1_CONTRACT.md'
      - 'scripts/audit-subkultur-fagverk-*.mjs'
      - 'scripts/audit-subkultur-foundation-*.mjs'
      - 'scripts/audit-subkultur-evidence-*.mjs'
      - 'scripts/audit-subkultur-chapters-*.mjs'
      - 'scripts/audit-subkultur-data-*.mjs'
      - 'scripts/audit-subkultur-case-evidence-*.mjs'
      - 'scripts/audit-subkultur-quiz-knowledge-*.mjs'
      - 'scripts/audit-subkultur-runtime-final-*.mjs'
      - 'tests/subkultur-fagverk-*.test.mjs'
      - 'tests/subkultur-foundation-*.test.mjs'
      - 'tests/subkultur-evidence-*.test.mjs'
      - 'tests/subkultur-chapters-*.test.mjs'
      - 'tests/subkultur-data-*.test.mjs'
      - 'tests/subkultur-case-evidence-*.test.mjs'
      - 'tests/subkultur-quiz-knowledge-*.test.mjs'
      - 'tests/subkultur-runtime-final-*.test.mjs'
      - 'tools/build-subkultur-foundation-*.mjs'
      - 'tools/build-subkultur-evidence-*.mjs'
      - 'tools/build-subkultur-chapters-*.mjs'
      - 'tools/build-subkultur-data-*.mjs'
      - 'tools/build-subkultur-case-evidence-*.mjs'
      - 'tools/build-subkultur-quiz-knowledge-*.mjs'
      - 'tools/materialize-subkultur-runtime-*.mjs'
      - 'tools/build-subkultur-place-reports-*.mjs'
      - 'scripts/audit-subkultur-place-production.mjs'
      - 'tests/subkultur-place-production.test.mjs'
      - 'reports/fagverk/subkultur-*.json'
      - 'reports/fagverk/README.md'
      - '.github/workflows/fagverk-subkultur.yml'
  push:
    branches: [main]
    paths:
      - 'data/fag/subkultur/**'
      - 'data/fagverk/subkultur/**'
      - 'data/fagverk/fagverk_portal.json'
      - 'data/fagverk/subject_inventory.json'
      - 'data/fag/profiles/subkultur/**'
      - 'data/places/subkultur/**'
      - 'data/places/subkultur-production/**'
      - 'data/places/film/oslo/places/hartvig_nissens_skole_skam.json'
      - 'data/places/historie/oslo/places_historie/abelonegarden.json'
      - 'data/people/subkultur/**'
      - 'data/people/kunst/oslo/people_kunst_oslo.json'
      - 'data/people/musikk/oslo/people_musikk_oslo.json'
      - 'data/people/politikk/oslo/people_politikk_oslo.json'
      - 'data/quiz/subkultur/**'
      - 'data/knowledge/knowledge_manifest.json'
      - 'data/knowledge/subjects/subkultur/**'
      - 'docs/SUBKULTUR_FAGVERK_V1_CONTRACT.md'
      - 'scripts/audit-subkultur-fagverk-*.mjs'
      - 'scripts/audit-subkultur-foundation-*.mjs'
      - 'scripts/audit-subkultur-evidence-*.mjs'
      - 'scripts/audit-subkultur-chapters-*.mjs'
      - 'scripts/audit-subkultur-data-*.mjs'
      - 'scripts/audit-subkultur-case-evidence-*.mjs'
      - 'scripts/audit-subkultur-quiz-knowledge-*.mjs'
      - 'scripts/audit-subkultur-runtime-final-*.mjs'
      - 'tests/subkultur-fagverk-*.test.mjs'
      - 'tests/subkultur-foundation-*.test.mjs'
      - 'tests/subkultur-evidence-*.test.mjs'
      - 'tests/subkultur-chapters-*.test.mjs'
      - 'tests/subkultur-data-*.test.mjs'
      - 'tests/subkultur-case-evidence-*.test.mjs'
      - 'tests/subkultur-quiz-knowledge-*.test.mjs'
      - 'tests/subkultur-runtime-final-*.test.mjs'
      - 'tools/build-subkultur-foundation-*.mjs'
      - 'tools/build-subkultur-evidence-*.mjs'
      - 'tools/build-subkultur-chapters-*.mjs'
      - 'tools/build-subkultur-data-*.mjs'
      - 'tools/build-subkultur-case-evidence-*.mjs'
      - 'tools/build-subkultur-quiz-knowledge-*.mjs'
      - 'tools/materialize-subkultur-runtime-*.mjs'
      - 'tools/build-subkultur-place-reports-*.mjs'
      - 'scripts/audit-subkultur-place-production.mjs'
      - 'tests/subkultur-place-production.test.mjs'
      - 'reports/fagverk/subkultur-*.json'
      - 'reports/fagverk/README.md'
      - '.github/workflows/fagverk-subkultur.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check tools/build-subkultur-foundation-v1.mjs
          node --check scripts/audit-subkultur-fagverk-baseline.mjs
          node --check scripts/audit-subkultur-foundation-v1.mjs
          node --check tools/build-subkultur-evidence-v1.mjs
          node --check scripts/audit-subkultur-evidence-v1.mjs
          node --check tools/build-subkultur-chapters-v1.mjs
          node --check scripts/audit-subkultur-chapters-v1.mjs
          node --check tools/build-subkultur-data-audit-v1.mjs
          node --check scripts/audit-subkultur-data-v1.mjs
          node --check tools/build-subkultur-case-evidence-v1.mjs
          node --check scripts/audit-subkultur-case-evidence-v1.mjs
          node --check tools/build-subkultur-quiz-knowledge-v1.mjs
          node --check scripts/audit-subkultur-quiz-knowledge-v1.mjs
          node --check tools/materialize-subkultur-runtime-v1.mjs
          node --check scripts/audit-subkultur-runtime-final-v1.mjs
          node --check tools/build-subkultur-place-reports-batch-v1.mjs
          node --check scripts/audit-subkultur-place-production.mjs
      - name: Reproducible canonical foundation
        run: node tools/build-subkultur-foundation-v1.mjs --check
      - name: Historical baseline audit
        run: node scripts/audit-subkultur-fagverk-baseline.mjs
      - name: Foundation audit
        run: node scripts/audit-subkultur-foundation-v1.mjs
      - name: Reproducible theory evidence
        run: node tools/build-subkultur-evidence-v1.mjs --check
      - name: Theory evidence audit
        run: node scripts/audit-subkultur-evidence-v1.mjs
      - name: Reproducible chapters and profiles
        run: node tools/build-subkultur-chapters-v1.mjs --check
      - name: Chapter and profile audit
        run: node scripts/audit-subkultur-chapters-v1.mjs
      - name: Reproducible Places and People classification
        run: node tools/build-subkultur-data-audit-v1.mjs
      - name: Places and People audit
        run: node scripts/audit-subkultur-data-v1.mjs
      - name: Reproducible case evidence
        run: node tools/build-subkultur-case-evidence-v1.mjs --check
      - name: Reproducible Subkultur place reports
        run: node tools/build-subkultur-place-reports-batch-v1.mjs
      - name: Subkultur place report audit
        run: node scripts/audit-subkultur-place-production.mjs --all
      - name: Case evidence audit
        run: node scripts/audit-subkultur-case-evidence-v1.mjs
      - name: Reproducible Quiz and Knowledge
        run: node tools/build-subkultur-quiz-knowledge-v1.mjs --check
      - name: Quiz and Knowledge audit
        run: node scripts/audit-subkultur-quiz-knowledge-v1.mjs
      - name: Reproducible final runtime
        run: node tools/materialize-subkultur-runtime-v1.mjs --check
      - name: Final runtime audit
        run: node scripts/audit-subkultur-runtime-final-v1.mjs
      - name: Contract, foundation, evidence, chapter, data, case, assessment and runtime tests
        run: node --test tests/subkultur-fagverk-baseline.test.mjs
          tests/subkultur-foundation-v1.test.mjs
          tests/subkultur-evidence-v1.test.mjs
          tests/subkultur-chapters-v1.test.mjs
          tests/subkultur-data-v1.test.mjs
          tests/subkultur-case-evidence-v1.test.mjs
          tests/subkultur-place-production.test.mjs
          tests/subkultur-quiz-knowledge-v1.test.mjs
          tests/subkultur-runtime-final-v1.test.mjs
