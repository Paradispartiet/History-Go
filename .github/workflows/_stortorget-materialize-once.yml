name: Stortorget materialize once

on:
  push:
    branches:
      - agent/stortorget-production-closure-20260910
    paths:
      - '.github/workflows/_stortorget-materialize-once.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stortorget-production-closure-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Materialize canonical Stortorget production
        run: node tools/finalize-stortorget-completion.mjs
      - name: Normalize image backlog summary
        run: |
          node scripts/audit-place-images.mjs --mode=all --report=/tmp/stortorget-image-audit.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('/tmp/stortorget-image-audit.json', 'utf8'));
          const file = 'data/places/place_image_backlog_summary.json';
          const backlog = JSON.parse(fs.readFileSync(file, 'utf8'));
          backlog.generatedAt = '2026-09-10';
          backlog.generatedFromCommit = 'stortorget_completion_20260910';
          backlog.totalPlaces = audit.totalPlaces;
          backlog.summary = {
            validLocal: audit.summary.local,
            validRemote: audit.summary.remote,
            optionalMissing: audit.summary.optional,
            missing: audit.summary.missing,
            invalidLocalPath: audit.summary.invalid,
            remaining: audit.summary.missing + audit.summary.invalid
          };
          for (const [category, row] of Object.entries(audit.byCategory)) {
            backlog.byCategory[category] = {
              ...backlog.byCategory[category], total: row.total, valid: row.local + row.remote,
              optional: row.optional, missing: row.missing, invalid: row.invalid
            };
          }
          fs.writeFileSync(file, JSON.stringify(backlog, null, 2) + '\n');
          NODE
      - name: Record mandatory place-production preflight
        run: node scripts/place-production-rule-preflight.mjs record --workcard reports/place-production/stortorget-workcard-current.json --place-id stortorget --category by
      - name: Regenerate Civication history People
        run: npm run civication:history-people:build
      - name: Regenerate Civication scenario People
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
      - name: Regenerate epoch place index
        run: npm run epoker:places:build
      - name: Regenerate quiz production context
        run: node scripts/build-quiz-production-context.mjs --category by --target stortorget --output data/quiz/production_context/by/stortorget.json
      - name: Regenerate places index
        run: npm run places:index:build
      - name: Regenerate place-open runtime
        run: npm run place-open:build
      - name: Regenerate Fagverk release manifest
        run: node scripts/build-fagverk-release-manifest.mjs
      - name: Verify focused contracts
        run: |
          node scripts/validate-place-description-production-v4_2.mjs
          npm run places:index:check
          npm run place-open:check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/stortorget-production-closure.test.mjs
      - name: Remove one-shot workflow
        run: git rm -- .github/workflows/_stortorget-materialize-once.yml
      - name: Commit permanent Stortorget production
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Complete Stortorget production'
          git push origin HEAD:agent/stortorget-production-closure-20260910
