name: One-time Oslo popup batch 29 science closure writer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/oslo-popup-batch-29-trigger.txt

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-popup-v4-batch-29-finish-science
          fetch-depth: 0
      - name: Apply final science text
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const item=JSON.parse(fs.readFileSync('.github/oslo-popup-batch-29-science-patch.json','utf8')).places[0];
          const words=t=>(String(t).match(/[\p{L}\p{N}]+(?:[’'\-][\p{L}\p{N}]+)*/gu)||[]).length;
          const paras=t=>String(t).trim().split(/\n\s*\n/).filter(Boolean).length;
          const withoutText=v=>{const c=JSON.parse(JSON.stringify(v));delete c.desc;delete c.popupDesc;return c;};
          const before=JSON.parse(fs.readFileSync(item.path,'utf8'));
          let popupDesc=item.popupDesc;
          if(words(popupDesc)<300)popupDesc+=' Byggets vitenskapshistoriske verdi ligger dermed i den dokumenterte koblingen mellom rom, metode, forskere og publiserte resultater.';
          const after={...before,desc:item.desc,popupDesc};
          if(JSON.stringify(withoutText(before))!==JSON.stringify(withoutText(after)))throw new Error('Non-text parity');
          const dw=words(after.desc),pw=words(after.popupDesc),pc=paras(after.popupDesc);
          console.log(`desc=${dw}, popup=${pw}, paragraphs=${pc}`);
          if(dw<40||dw>80)throw new Error(`desc ${dw}`);
          if(pw<300||pw>600)throw new Error(`popup ${pw}`);
          if(pc!==6)throw new Error(`paragraphs ${pc}`);
          fs.writeFileSync(item.path,JSON.stringify(after,null,2)+'\n');
          const pr=process.env.PR_NUMBER;if(!/^\d+$/.test(pr||''))throw new Error('Invalid PR');
          const pp='reports/place-description-revision-protocol.md';let p=fs.readFileSync(pp,'utf8');
          p=p.replace('Ferdige etter alle mergede revisjonsbatcher: **238 steder**','Ferdige etter alle mergede revisjonsbatcher: **239 steder**').replace('Gjenstår: **274 steder**','Gjenstår: **273 steder**').replace('Det gjenstår **274 aktive Oslo-steder**','Det gjenstår **273 aktive Oslo-steder**').replace('- vitenskap: **1**\n','');
          const row=`| 239 | ${after.name} | \`${after.id}\` | ${dw} | ${pw} | ${pc} | #${pr} |`;
          if(!p.includes('| 239 | Universitetets gamle kjemibygning |'))p=p.replace('\n## Gjenstående Oslo-kø',`\n\n${row}\n\n## Gjenstående Oslo-kø`);
          const batch=`| Oslo V4 batch 29 | 1 | #${pr} – fullførte hele Oslo-køen for fagområdet vitenskap |`;
          if(!p.includes(batch))p=p.replace(/(\| Oslo V4 batch 28 \| 10 \| #[0-9]+ – andre produksjonsbatch fra vitenskapskøen \|)/,`$1\n${batch}`);
          fs.writeFileSync(pp,p);
          NODE
          node tools/audit-oslo-place-description-scope.mjs --write
          node <<'NODE'
          const fs=require('fs'),p=fs.readFileSync('reports/place-description-revision-protocol.md','utf8'),a=fs.readFileSync('reports/oslo-place-description-scope-audit-2026-07-26.md','utf8');
          if(!p.includes('Ferdige etter alle mergede revisjonsbatcher: **239 steder**'))throw new Error('total');
          if(!p.includes('Gjenstår: **273 steder**'))throw new Error('remaining');
          if(p.includes('- vitenskap: **'))throw new Error('science remains in protocol');
          if(!a.includes('IDs in the current revision protocol: **239**'))throw new Error('audit total');
          if(!a.includes('Additional active Oslo IDs outside the protocol: **273**'))throw new Error('audit remaining');
          if(a.includes('| vitenskap |'))throw new Error('science remains in audit');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/vitenskap/oslo/places_vitenskap/universitetets_gamle_kjemi.json reports/oslo-place-description-scope-audit-2026-07-26.json reports/oslo-place-description-scope-audit-2026-07-26.md reports/place-description-revision-protocol.md
          git commit -m "Complete Oslo science description revision"
          git push origin HEAD:agent/oslo-popup-v4-batch-29-finish-science
