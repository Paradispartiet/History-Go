name: TEMP PR6130 place-open sync

on:
  push:
    branches:
      - agent/klassekampen-phase2-v3-20261004
    paths:
      - .github/workflows/tmp-pr6130-place-open-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/klassekampen-phase2-v3-20261004
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate and verify place-open runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run place-open:build

          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "::error::Expected generated place-open changes, found none"
            exit 1
          fi
          printf 'Generated changes:\n%s\n' "${changed[@]}"
          for file in "${changed[@]}"; do
            case "$file" in
              data/runtime/*) ;;
              *)
                echo "::error::Builder changed non-runtime file: $file"
                exit 1
                ;;
            esac
          done

          npm run place-open:check
          npm run test:place-open

      - name: Commit generated runtime and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-pr6130-place-open-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/runtime .github/workflows/tmp-pr6130-place-open-sync.yml
          git commit -m "Regenerate place-open runtime after Mari fallback fix"
          git push origin HEAD:agent/klassekampen-phase2-v3-20261004
