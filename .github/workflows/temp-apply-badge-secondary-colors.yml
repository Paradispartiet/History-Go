name: Apply badge secondary colors on fresh main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/badge-secondary-map-borders
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply badge secondary colors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          secondary = {
              "by": "#3C3731",
              "historie": "#533217",
              "kunst": "#1D3E5F",
              "litteratur": "#C0964A",
              "musikk": "#121E2B",
              "naeringsliv": "#0754A9",
              "natur": "#DC7A04",
              "politikk": "#114A84",
              "populaerkultur": "#1C3463",
              "religion": "#151B28",
              "sport": "#A51E15",
              "subkultur": "#181615",
              "vitenskap": "#413E17",
          }

          def update_badge_json(category_id, color):
              path = Path(f"data/badges/{category_id}.json")
              text = path.read_text(encoding="utf-8")
              if '"secondaryColor"' in text:
                  text = re.sub(r'("secondaryColor"\s*:\s*")[^"]+("\s*,)', rf'\g<1>{color}\g<2>', text, count=1)
              else:
                  text, count = re.subn(
                      r'(\n  "color"\s*:\s*"[^"]+",\n)',
                      rf'\g<1>  "secondaryColor": "{color}",\n',
                      text,
                      count=1,
                  )
                  if count != 1:
                      raise RuntimeError(f"Could not insert secondaryColor in {path}")
              path.write_text(text, encoding="utf-8")

          def set_category_secondary(text, category_id, color):
              marker = f'id: "{category_id}"'
              start = text.find(marker)
              if start < 0:
                  raise RuntimeError(f"Category {category_id} not found")
              next_entry = text.find("\n  {", start + len(marker))
              array_end = text.find("\n];", start + len(marker))
              end_candidates = [p for p in (next_entry, array_end) if p >= 0]
              end = min(end_candidates) if end_candidates else len(text)
              segment = text[start:end]

              if "secondaryColor:" in segment:
                  segment = re.sub(r'secondaryColor:\s*"[^"]+"', f'secondaryColor: "{color}"', segment, count=1)
                  return text[:start] + segment + text[end:]

              color_match = re.search(r'color:\s*"[^"]+"', segment)
              if not color_match:
                  raise RuntimeError(f"Color field for {category_id} not found")
              absolute_color_start = start + color_match.start()
              line_start = text.rfind("\n", 0, absolute_color_start) + 1
              line_end = text.find("\n", absolute_color_start)
              if line_end < 0:
                  line_end = len(text)
              line = text[line_start:line_end]
              indent = re.match(r"\s*", line).group(0)
              token = color_match.group(0)
              if "scope:" in line:
                  new_line = line.replace(token, token + f', secondaryColor: "{color}"', 1)
              else:
                  new_line = line + f'\n{indent}secondaryColor: "{color}",'
              return text[:line_start] + new_line + text[line_end:]

          for category_id, color in secondary.items():
              update_badge_json(category_id, color)

          categories_path = Path("js/core/categories.ts")
          categories = categories_path.read_text(encoding="utf-8")
          if "secondaryColor?: string;" not in categories:
              categories = categories.replace(
                  "  color: string;\n  scope: CategoryScope;",
                  "  color: string;\n  secondaryColor?: string;\n  scope: CategoryScope;",
                  1,
              )
          if "catSecondaryColor?:" not in categories:
              categories = categories.replace(
                  "  catColor?: (categoryId: unknown) => string;\n",
                  "  catColor?: (categoryId: unknown) => string;\n  catSecondaryColor?: (categoryId: unknown) => string;\n",
                  1,
              )
          for category_id, color in secondary.items():
              categories = set_category_secondary(categories, category_id, color)

          if "function catSecondaryColor(" not in categories:
              cat_color_block = (
                  'function catColor(categoryId: unknown): string {\n'
                  '  const category = CAT_BY_ID[norm(categoryId)];\n'
                  '  return category?.color || "#6c757d";\n'
                  '}\n'
              )
              cat_secondary_block = (
                  '\nfunction catSecondaryColor(categoryId: unknown): string {\n'
                  '  const category = CAT_BY_ID[norm(categoryId)];\n'
                  '  return category?.secondaryColor || category?.color || "#6c757d";\n'
                  '}\n'
              )
              if cat_color_block not in categories:
                  raise RuntimeError("catColor anchor not found")
              categories = categories.replace(cat_color_block, cat_color_block + cat_secondary_block, 1)

          if "win.catSecondaryColor = catSecondaryColor;" not in categories:
              categories = categories.replace(
                  "win.catColor = catColor;\n",
                  "win.catColor = catColor;\nwin.catSecondaryColor = catSecondaryColor;\n",
                  1,
              )
          categories = categories.replace(
              "export { CATEGORY_LIST, catColor, catClass, tagToCat, catIdFromDisplay };",
              "export { CATEGORY_LIST, catColor, catSecondaryColor, catClass, tagToCat, catIdFromDisplay };",
              1,
          )
          categories_path.write_text(categories, encoding="utf-8")

          map_path = Path("js/map.ts")
          map_text = map_path.read_text(encoding="utf-8")
          old_border = (
              '  function getPlaceMarkerBorder(isVisited) {\n'
              '    if (isStandardMapStyle()) return isVisited ? "#ffe45f" : "#f8fbff";\n'
              '    return isVisited ? "#ffd700" : "#111111";\n'
              '  }'
          )
          new_border = (
              '  function getPlaceMarkerBorder(categoryId, fallbackColor) {\n'
              '    const secondaryColorFn = (window as any).catSecondaryColor;\n'
              '    if (typeof secondaryColorFn === "function") {\n'
              '      const secondaryColor = String(secondaryColorFn(categoryId) || "").trim();\n'
              '      if (secondaryColor) return secondaryColor;\n'
              '    }\n'
              '    return fallbackColor || "#6c757d";\n'
              '  }'
          )
          if old_border not in map_text:
              raise RuntimeError("Old map marker border function not found")
          map_text = map_text.replace(old_border, new_border, 1)
          map_text = map_text.replace(
              "const border = getPlaceMarkerBorder(isVisited);",
              "const border = getPlaceMarkerBorder(p.category, base);",
              1,
          )
          map_path.write_text(map_text, encoding="utf-8")

          config_path = Path("js/config.js")
          config = config_path.read_text(encoding="utf-8")
          marker = "\n// Korrigerer den forrige feilendringen"
          marker_index = config.find(marker)
          if marker_index >= 0:
              config = config[:marker_index].rstrip() + "\n"
          config_path.write_text(config, encoding="utf-8")

          badges_path = Path("js/ui/badges.js")
          badges = badges_path.read_text(encoding="utf-8")
          badges, removed = re.subn(
              r'\nfunction ensurePlaceCardRoundBorderStyle\(\) \{.*?\n\}\n\n(?=function formatSubcategoryLabel)',
              "\n",
              badges,
              count=1,
              flags=re.S,
          )
          if removed != 1 and "ensurePlaceCardRoundBorderStyle" in badges:
              raise RuntimeError("Could not remove old PlaceCard border override")
          badges = badges.replace("\nensurePlaceCardRoundBorderStyle();", "", 1)
          badges_path.write_text(badges, encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck browser TypeScript
        run: npm run typecheck:web

      - name: Rebuild browser runtime
        run: npm run build:web

      - name: Validate result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          expected = {
              "by": "#3C3731",
              "historie": "#533217",
              "kunst": "#1D3E5F",
              "litteratur": "#C0964A",
              "musikk": "#121E2B",
              "naeringsliv": "#0754A9",
              "natur": "#DC7A04",
              "politikk": "#114A84",
              "populaerkultur": "#1C3463",
              "religion": "#151B28",
              "sport": "#A51E15",
              "subkultur": "#181615",
              "vitenskap": "#413E17",
          }

          categories = Path("js/core/categories.ts").read_text(encoding="utf-8")
          map_ts = Path("js/map.ts").read_text(encoding="utf-8")
          config = Path("js/config.js").read_text(encoding="utf-8")
          badges_js = Path("js/ui/badges.js").read_text(encoding="utf-8")

          for category_id, color in expected.items():
              badge = json.loads(Path(f"data/badges/{category_id}.json").read_text(encoding="utf-8"))
              assert badge.get("secondaryColor") == color
              start = categories.index(f'id: "{category_id}"')
              assert categories.index(f'secondaryColor: "{color}"', start) > start

          assert "getPlaceMarkerBorder(p.category, base)" in map_ts
          assert "installMapPointBorderFix" not in config
          assert "ensurePlaceCardRoundBorderStyle" not in badges_js
          PY
          git diff --check

      - name: Commit final implementation
        shell: bash
        run: |
          rm -f .github/workflows/temp-apply-badge-secondary-colors.yml
          git config user.name "Paradispartiet"
          git config user.email "225725199+Paradispartiet@users.noreply.github.com"
          git add \
            data/badges \
            js/core/categories.ts \
            js/core/categories.js \
            js/map.ts \
            js/map.js \
            js/config.js \
            js/ui/badges.js \
            dist/web/categories.js \
            dist/web/map.js \
            .github/workflows/temp-apply-badge-secondary-colors.yml
          git commit -m "Use badge secondary colors for map dot borders"
          git push origin HEAD:fix/badge-secondary-map-borders
