name: Rockefeller temporary canonical Knowledge regeneration
on:
  push:
    branches:
      - content/rockefeller-v1-knowledge-prose-20261101
    paths:
      - data/quiz/musikk/rockefeller_sets_merged.json
      - .github/workflows/rockefeller-temporary-knowledge-write.yml
permissions:
  contents: write
concurrency:
  group: rockefeller-knowledge-regeneration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    if: github.repository == 'Paradispartiet/History-Go' && github.actor == 'Paradispartiet'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate canonical Knowledge
        run: npm run knowledge:canonical:write
      - name: Commit only derived Knowledge data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u data/knowledge reports/knowledge-contract-audit.json reports/knowledge-id-backfill.json
          if ! git diff --cached --quiet; then
            git commit -m "Rockefeller: synchronize canonical Knowledge after editorial cleanup"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
