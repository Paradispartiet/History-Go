name: Fagverk Media complete

on:
  pull_request:
    paths:
      - 'data/fag/media/**'
      - 'data/fagverk/media/**'
      - 'scripts/audit-fagverk-media-*.mjs'
      - 'tools/audit-media-theory-integrity.mjs'
      - 'tests/fagverk-media-*.test.mjs'
      - 'tests/media-theory-integrity.test.mjs'
      - 'reports/fagverk/media-*-audit.json'
      - '.github/workflows/fagverk-media-complete.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit-fagverk-media-complete.mjs
      - run: node --check tools/audit-media-theory-integrity.mjs
      - run: node tools/audit-media-theory-integrity.mjs
      - run: node --test tests/media-theory-integrity.test.mjs
      - run: node --test tests/fagverk-media-*.test.mjs tests/fagverk-general-engine.test.mjs tests/fagverk-subject-inventory.test.mjs
      - run: node scripts/build-fagverk-release-manifest.mjs --check
