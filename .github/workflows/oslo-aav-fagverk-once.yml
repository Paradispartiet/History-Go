name: One-shot Oslo AAV Fagverk integration 20261027
on:
  push:
    branches:
      - content/oslo-aav-two-fagverk-20261027
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build two sourced Fagverk blocks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = {
            "wessels_plass": {
              "schema": "history_go_place_fagverk_v2",
              "level": "standard",
              "status": "curated",
              "intro": "Wessels plass viser hvordan en by kan omforme et tidligere festnings- og hageområde til et offentlig rom, og hvordan både monumenter, sporveier og Stortingets byggearbeid har endret bruken.",
              "article": [
                "Før det fantes en plass, lå Bukkebjerget som del av det eldre befestede bylandskapet. Huitfeldts hus og hage var et privat anlegg på tomten. Da kommunen overtok eiendommen, ble huset revet og terrenget bearbeidet før et offentlig parkanlegg kunne opparbeides. Historien handler dermed ikke om en park som alltid har ligget her, men om at en knaus, et gårdsanlegg og en hage ble erstattet av et nytt byrom. En vandrer kan se dagens åpne plass, men ikke uten videre rekonstruere den forsvunne topografien.",
                "Plassen fikk først navnet Stortingspladsen. Senere ble den knyttet til dikteren Johan Herman Wessel gjennom navn og portrettbyste. Samtidig fungerte den som en del av byens trafikknett med buss og sporvogn. Monumenter og holdeplasser har flyttet, mens gatene rundt plassen fortsatt binder sammen institusjoner, handel og ferdsel. Den skiftende bruken viser at et torg eller en park ikke har én fast funksjon: minne, gjennomreise og opphold kan fylle det samme arealet til ulike tider.",
                "Under plassen finnes også en mindre synlig byhistorie. Stortingets gangforbindelse og senere anleggsarbeider la nye funksjoner under parkanlegget og førte til perioder med avsperring og rehabilitering. Det som framstår som en liten, åpen grønn plass, er derfor også et sted for omfattende teknisk infrastruktur og institusjonell planlegging. Gamle kart og historiske kilder må brukes for å skille dagens dekke fra tidligere tomtegrenser, monumentplasseringer og underjordiske inngrep."
              ],
              "subject_ids": [
                "by"
              ],
              "emne_ids": [
                "em_by_torg_plasser_som_scene",
                "em_by_historiske_lag_i_hverdagsrom"
              ],
              "chapter_ids": [
                "byliv-offentlige-rom",
                "historiske-lag-ruiner-minner"
              ],
              "lenses": [
                {
                  "id": "wessels-plass-aav-lens-1",
                  "title": "Fra hage til byrom",
                  "prompt": "Hvordan kan vi skille den tidligere private hagen og festningsknausen fra det offentlige parkanlegget som kom etterpå?",
                  "subject_id": "by",
                  "emne_id": "em_by_historiske_lag_i_hverdagsrom",
                  "evidence": "Kommunens overtakelse, rivingen av Huitfeldts hus og bearbeidingen av Bukkebjerget er dokumentert i lokalhistoriske kilder."
                },
                {
                  "id": "wessels-plass-aav-lens-2",
                  "title": "Monument og trafikk",
                  "prompt": "Hva sier navneendringen, den flyttede statuen og nedlagte trikkeholdeplassen om skiftende bruk av Wessels plass?",
                  "subject_id": "by",
                  "emne_id": "em_by_torg_plasser_som_scene",
                  "evidence": "Navnehistorie, Wessel-bysten, Sverdrup-statuen og holdeplassens historie beskrives i kildene."
                },
                {
                  "id": "wessels-plass-aav-lens-3",
                  "title": "Byrom over anlegg",
                  "prompt": "Hvorfor er det utilstrekkelig å forklare Wessels plass bare ved å se på parken og bygningene på bakken?",
                  "subject_id": "by",
                  "emne_id": "em_by_historiske_lag_i_hverdagsrom",
                  "evidence": "Stortingets tunnel og underjordiske arbeider viser at viktige funksjoner ikke er synlige i parkens overflate."
                }
              ],
              "guiding_questions": [
                "Hvilke synlige trekk ved Wessels plass forteller om dagens ferdselslinjer mellom gatene rundt parken?",
                "Hvorfor trenger vi gamle kilder for å lokalisere Bukkebjerget og den tidligere hagen?",
                "Hvordan endret navnet og dikterbysten plassens rolle som offentlig minnested?",
                "Hvilke forskjeller er det mellom det som ses fra parken og den dokumenterte tunnelhistorien under bakken?"
              ],
              "concepts": [
                "byrom",
                "terrengendring",
                "minnemonument",
                "kollektivtransport",
                "historiske kart",
                "underjordisk infrastruktur"
              ],
              "observable_traces": [
                {
                  "title": "Plassens gatemøter",
                  "observation": "Fra plassen kan man se hvordan Stortingsgata, Akersgata, Prinsens gate og Nedre Vollgate avgrenser og forbinder det offentlige arealet.",
                  "interpretation_boundary": "Gatebildet alene dokumenterer ikke hvordan Bukkebjerget så ut, når parken ble opparbeidet eller hvor de tidligere holdeplassene sto.",
                  "source_urls": [
                    "https://www.oppdagkvadraturen.no/stoppesteder/wessels-plass",
                    "https://oslobyleksikon.no/side/Wessels_plass"
                  ]
                }
              ],
              "source_urls": [
                "https://www.oppdagkvadraturen.no/stoppesteder/wessels-plass",
                "https://oslobyleksikon.no/side/Wessels_plass"
              ],
              "verified_at": "2026-10-26"
            },
            "ostbanestasjonen": {
              "schema": "history_go_place_fagverk_v2",
              "level": "standard",
              "status": "curated",
              "intro": "Østbanestasjonen forteller om skiftet fra den første hovedbanens stasjon til en større nasjonal jernbaneterminal, og videre til fredet bygningsarv med butikker og servering.",
              "article": [
                "Den første hovedbanestasjonen lå ved havnen og bandt Christiania til Eidsvoll. Da jernbanenettet vokste og Østfoldbanen skulle føres inn, ble anlegget utvidet. I stedet for at alle spor av den gamle stasjonen forsvant, ble deler av 1854-bygningen bevart i det større anlegget. Georg Andreas Bull ga nybygget en tydelig fasade mot Jernbanetorget, og hovedinngangen ble plassert i forlengelsen av Karl Johans gates akse. Terminalens plassering og form viser hvordan jernbaneutbygging også ble byplanlegging.",
                "En toghall av jern og glass ble anlagt mellom eldre og nyere bygningsdeler. Hallen hadde en teknisk funksjon som overdekket møtepunkt mellom tog, reisende og stasjonens byside, men den fikk også politiske og militære betydninger under okkupasjonen. Krigshistorien bør ikke leses ut av dagens fasade alene: påstander om bruk av hallen i 1940 og bombeangrepet i 1942 må bygge på historiske dokumenter. Den samme bygningen kan stå igjen selv om hendelsene som fant sted i den, ikke lenger er synlige.",
                "Da Oslo S overtok trafikkfunksjoner, oppsto spørsmålet om hva som skulle skje med den gamle stasjonen. Tidlige planer åpnet for omfattende riving, mens senere vedtak la til grunn at betydelige deler skulle bevares. Oslotunnelens drift fra 1980 må skilles fra den høytidelige åpningen av Oslo S i 1987 og den gradvise avviklingen av Østbanestasjonen. Den restaurerte Østbanehallen brukes nå til andre formål, men jern- og glasshallen og den bevarte bygningskroppen gjør jernbanehistorien lesbar i bybildet."
              ],
              "subject_ids": [
                "by"
              ],
              "emne_ids": [
                "em_by_infrastruktur_mobilitet",
                "em_by_historiske_lag_i_hverdagsrom",
                "em_by_transformasjon_ombruk"
              ],
              "chapter_ids": [
                "urbanisme-idealer-forbindelser-fortetting",
                "arkitektur-gatekant-makt-ombruk",
                "historiske-lag-ruiner-minner"
              ],
              "lenses": [
                {
                  "id": "ostbanestasjonen-aav-lens-1",
                  "title": "Jernbanen former byen",
                  "prompt": "Hvordan viser stasjonsinngangens plassering mot Karl Johans gate samspillet mellom jernbaneteknikk og byplanlegging?",
                  "subject_id": "by",
                  "emne_id": "em_by_infrastruktur_mobilitet",
                  "evidence": "Hovedbanens endestasjon, Bulls utvidelse og hovedinngangens plassering er beskrevet i stasjonens historikk."
                },
                {
                  "id": "ostbanestasjonen-aav-lens-2",
                  "title": "Hall med flere liv",
                  "prompt": "Hvordan kan samme jern- og glasshall ha rommet jernbanedrift, krigshendelser og senere butikker og serveringssteder?",
                  "subject_id": "by",
                  "emne_id": "em_by_historiske_lag_i_hverdagsrom",
                  "evidence": "De dokumenterte bruksfasene omfatter toghall, okkupasjonsår og restaurering til Østbanehallen."
                },
                {
                  "id": "ostbanestasjonen-aav-lens-3",
                  "title": "Bevaring og ombruk",
                  "prompt": "Hva skiller beslutningen om å bevare en eldre stasjonsbygning fra beslutningen om å beholde jernbanedriften der?",
                  "subject_id": "by",
                  "emne_id": "em_by_transformasjon_ombruk",
                  "evidence": "Rivningsforutsetningene etter krigen, reguleringsplanen i 1976 og den senere ombruken belyser to ulike beslutninger."
                }
              ],
              "guiding_questions": [
                "Hva ved Østbanestasjonens fasade viser sammenhengen mellom hovedinngangen og Karl Johans gates retning?",
                "Hvordan vet vi at utvidelsen ikke fjernet absolutt alle deler av den første stasjonsbygningen?",
                "Hvorfor må Oslotunnelens åpning og den offisielle åpningen av Oslo S dateres hver for seg?",
                "Hva forteller dagens butikker i hallen om forholdet mellom vern av bygninger og endret transportfunksjon?"
              ],
              "concepts": [
                "jernbaneterminal",
                "jern- og glasshall",
                "byakse",
                "bygningsvern",
                "ombruk",
                "transportknutepunkt"
              ],
              "observable_traces": [
                {
                  "title": "Fasaden ved Jernbanetorget",
                  "observation": "Fra offentlig plass kan en se den historiske fasaden og undersøke hvordan hovedinngangen er orientert mot retningen til Karl Johans gate.",
                  "interpretation_boundary": "Fasaden alene dokumenterer ikke hvor mye av stasjonen fra 1854 som overlevde, eller hva som skjedde inne i hallen under krigen.",
                  "source_urls": [
                    "https://www.nyeoslos.no/oslo-s-gjennom-tidene/",
                    "https://oslobyleksikon.no/side/%C3%98stbanestasjonen"
                  ]
                }
              ],
              "source_urls": [
                "https://www.nyeoslos.no/oslo-s-gjennom-tidene/",
                "https://oslobyleksikon.no/side/%C3%98stbanestasjonen",
                "https://www.ostbanehallen.no/om-oss/"
              ],
              "verified_at": "2026-10-26"
            }
          };
          const map = {
            wessels_plass: "data/places/by/oslo/places_by_oslo_oppdag_kvadraturen_batch_03/wessels_plass.json",
            ostbanestasjonen: "data/places/by/oslo/places_by_oslo_oppdag_kvadraturen_batch_04/ostbanestasjonen.json"
          };
          const registryFile = "data/fagverk/fagverk_registry.json";
          const registry = JSON.parse(fs.readFileSync(registryFile,"utf8"));
          for (const [id, path] of Object.entries(map)) {
            const place=JSON.parse(fs.readFileSync(path,"utf8"));
            if(place.id!==id || place.category!=="by" || place.fagverk) throw new Error("Unexpected existing Place state: "+id);
            const sources=new Set((place.externalLinks||[]).map(x=>x.url));
            if(data[id].source_urls.some(url=>!sources.has(url))) throw new Error("Unlinked source: "+id);
            place.fagverk=data[id];
            fs.writeFileSync(path,JSON.stringify(place,null,2)+"\n");
            registry.placeLinks[id]={sourceFile:path.replace(/^data\//,""),field:"fagverk",schema:data[id].schema,level:data[id].level,status:data[id].status};
          }
          registry.updatedAt="2026-10-27";
          fs.writeFileSync(registryFile,JSON.stringify(registry,null,2)+"\n");
          
          NODE
          npm run places:index:build
          npm run place-open:build
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-fagverk-place-pages.mjs
          npm run places:index:check
          npm run place-open:check
          node scripts/build-fagverk-release-manifest.mjs --check
          git rm .github/workflows/oslo-aav-fagverk-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/by/oslo data/places/places_index.json data/fagverk/fagverk_registry.json data/fagverk/fagverk_release.json data/runtime
          git diff --cached --check
          git commit -m "feat(by): curate Fagverk for Wessels plass and Østbanestasjonen"
          git push origin HEAD:refs/heads/content/oslo-aav-two-fagverk-20261027
