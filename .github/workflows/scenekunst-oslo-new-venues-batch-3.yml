name: Oslo Scenekunst new venues batch 3

on:
  push:
    branches:
      - agent/scenekunst-oslo-new-venues-03

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/scenekunst-oslo-new-venues-03
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare documented coordinate resolver
        id: prepare
        shell: bash
        run: |
          set +e
          {
            node tools/scenekunst-oslo-batch3-runner.mjs prepare
            python - <<'PY'
          from pathlib import Path
          p = Path('tools/add-scenekunst-oslo-venues-batch-3.mjs')
          s = p.read_text()
          old = "allowedCoLocationIds: ['hausmania', 'hausmania_kulturhus']"
          new = "allowedCoLocationIds: ['hausmania', 'hausmania_kulturhus', 'kafe_haerverk']"
          if old not in s:
              raise SystemExit('Grusomhetens co-location list not found')
          p.write_text(s.replace(old, new, 1))
          PY
          } > /tmp/scenekunst-batch-3-prepare.log 2>&1
          status=$?
          cat /tmp/scenekunst-batch-3-prepare.log
          if [ "$status" -ne 0 ]; then
            mkdir -p reports
            cp /tmp/scenekunst-batch-3-prepare.log reports/scenekunst-oslo-new-venues-batch-3-runner-error.log
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit diagnostic on preparation failure
        if: steps.prepare.outputs.failed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/scenekunst-oslo-new-venues-batch-3-runner-error.log
          git diff --cached --quiet || git commit -m "Record Scenekunst batch 3 preparation failure"
          git push origin HEAD:agent/scenekunst-oslo-new-venues-03
          exit 1

      - name: Build three verified Oslo venue packages
        if: steps.prepare.outputs.failed == 'false'
        id: venue_build
        shell: bash
        run: |
          set +e
          node tools/add-scenekunst-oslo-venues-batch-3.mjs > /tmp/scenekunst-batch-3.log 2>&1
          status=$?
          cat /tmp/scenekunst-batch-3.log
          if [ "$status" -ne 0 ]; then
            mkdir -p reports
            cp /tmp/scenekunst-batch-3.log reports/scenekunst-oslo-new-venues-batch-3-runner-error.log
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit diagnostic on builder failure
        if: steps.prepare.outputs.failed == 'false' && steps.venue_build.outputs.failed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/scenekunst-oslo-new-venues-batch-3-runner-error.log
          git diff --cached --quiet || git commit -m "Record Scenekunst batch 3 runner failure"
          git push origin HEAD:agent/scenekunst-oslo-new-venues-03
          exit 1

      - name: Record coordinate evidence and protocol
        if: steps.prepare.outputs.failed == 'false' && steps.venue_build.outputs.failed == 'false'
        run: node tools/scenekunst-oslo-batch3-runner.mjs finalize

      - name: Build tools and regenerate place index
        if: steps.prepare.outputs.failed == 'false' && steps.venue_build.outputs.failed == 'false'
        run: |
          npm run build:tools
          npm run places:index:build

      - name: Validate places and categories
        if: steps.prepare.outputs.failed == 'false' && steps.venue_build.outputs.failed == 'false'
        run: |
          bash scripts/check-places.sh
          npm run audit:categories

      - name: Mark report checks validated
        if: steps.prepare.outputs.failed == 'false' && steps.venue_build.outputs.failed == 'false'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'reports/scenekunst-oslo-new-venues-batch-3-2026-07-21.json';
          const report = JSON.parse(fs.readFileSync(p, 'utf8'));
          report.validation.placesIndexBuild = 'pass';
          report.validation.placesChecks = 'pass';
          report.validation.categoryAudit = 'pass';
          fs.writeFileSync(p, JSON.stringify(report, null, 2) + '\n');
          NODE

      - name: Remove one-shot files and commit result
        if: steps.prepare.outputs.failed == 'false' && steps.venue_build.outputs.failed == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/add-scenekunst-oslo-venues-batch-3.mjs
          git rm tools/scenekunst-oslo-batch3-runner.mjs
          git rm .github/workflows/scenekunst-oslo-new-venues-batch-3.yml
          git rm -f reports/scenekunst-oslo-new-venues-batch-3-trigger.md
          git rm -f reports/scenekunst-oslo-new-venues-batch-3-runner-error.log
          git rm -f reports/scenekunst-oslo-new-venues-batch-3-kloden-geonorge-candidates.json
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo "No venue changes produced"; exit 1; }
          git commit -m "Add third missing Oslo Scenekunst venue batch"
          git push origin HEAD:agent/scenekunst-oslo-new-venues-03
