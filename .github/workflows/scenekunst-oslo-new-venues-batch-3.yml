name: Oslo Scenekunst new venues batch 3

on:
  push:
    branches:
      - agent/scenekunst-oslo-new-venues-03

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/scenekunst-oslo-new-venues-03
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture Kloden Geonorge candidates
        run: |
          node <<'NODE'
          const fs = require('fs');
          const queries = {
            freeTextOslo: 'https://ws.geonorge.no/adresser/v1/sok?sok=' + encodeURIComponent('Kabelgata 31 Oslo'),
            structuredExact: 'https://ws.geonorge.no/adresser/v1/sok?adressenavn=' + encodeURIComponent('Kabelgata') + '&nummer=31&kommunenummer=0301&treffPerSide=100',
            streetOslo: 'https://ws.geonorge.no/adresser/v1/sok?adressenavn=' + encodeURIComponent('Kabelgata') + '&kommunenummer=0301&treffPerSide=100'
          };
          const output = {};
          for (const [name, url] of Object.entries(queries)) {
            const response = await fetch(url, { headers: { 'user-agent': 'History-Go-coordinate-audit/1.0' } });
            const text = await response.text();
            let payload;
            try { payload = JSON.parse(text); } catch { payload = { raw: text }; }
            output[name] = { url, status: response.status, payload };
          }
          fs.mkdirSync('reports', { recursive: true });
          fs.writeFileSync(
            'reports/scenekunst-oslo-new-venues-batch-3-kloden-geonorge-candidates.json',
            JSON.stringify(output, null, 2) + '\n'
          );
          NODE

      - name: Build three verified Oslo venue packages
        id: venue_build
        shell: bash
        run: |
          set +e
          node tools/add-scenekunst-oslo-venues-batch-3.mjs > /tmp/scenekunst-batch-3.log 2>&1
          status=$?
          cat /tmp/scenekunst-batch-3.log
          if [ "$status" -ne 0 ]; then
            mkdir -p reports
            cp /tmp/scenekunst-batch-3.log reports/scenekunst-oslo-new-venues-batch-3-runner-error.log
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit diagnostic on builder failure
        if: steps.venue_build.outputs.failed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/scenekunst-oslo-new-venues-batch-3-runner-error.log
          git add reports/scenekunst-oslo-new-venues-batch-3-kloden-geonorge-candidates.json
          git diff --cached --quiet || git commit -m "Record Kloden Geonorge address candidates"
          git push origin HEAD:agent/scenekunst-oslo-new-venues-03
          exit 1

      - name: Build tools and regenerate place index
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          npm run build:tools
          npm run places:index:build

      - name: Validate places and categories
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          bash scripts/check-places.sh
          npm run audit:categories

      - name: Mark report validated
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'reports/scenekunst-oslo-new-venues-batch-3-2026-07-21.json';
          const report = JSON.parse(fs.readFileSync(p, 'utf8'));
          report.status = 'validated';
          report.validatedAt = new Date().toISOString();
          report.validation = {
            geonorgeExactAddressLookup: 'pass',
            overlapAudit: 'pass',
            placesIndexBuild: 'pass',
            placesChecks: 'pass',
            categoryAudit: 'pass'
          };
          fs.writeFileSync(p, JSON.stringify(report, null, 2) + '\n');
          NODE

      - name: Remove one-shot runner and commit result
        if: steps.venue_build.outputs.failed == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/add-scenekunst-oslo-venues-batch-3.mjs
          git rm .github/workflows/scenekunst-oslo-new-venues-batch-3.yml
          git rm -f reports/scenekunst-oslo-new-venues-batch-3-trigger.md
          git rm -f reports/scenekunst-oslo-new-venues-batch-3-runner-error.log
          git rm -f reports/scenekunst-oslo-new-venues-batch-3-kloden-geonorge-candidates.json
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo "No venue changes produced"; exit 1; }
          git commit -m "Add third missing Oslo Scenekunst venue batch"
          git push origin HEAD:agent/scenekunst-oslo-new-venues-03
