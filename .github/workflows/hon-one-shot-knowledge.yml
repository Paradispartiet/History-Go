name: House of Nerds one-shot Knowledge generation
on:
  push:
    branches:
      - place/house-of-nerds-quiz-20261101
    paths:
      - .github/workflows/hon-one-shot-knowledge.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/place/house-of-nerds-quiz-20261101'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly this production branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build canonical source context
        run: node scripts/build-quiz-production-context.mjs --category subkultur --target house_of_nerds --output data/quiz/production_context/subkultur/house_of_nerds.json
      - name: Run repository-owned canonical Knowledge generator
        run: npm run knowledge:canonical:write
      - name: Commit only House of Nerds and directly affected Knowledge artifacts
        shell: bash
        run: |
          set -eu
          git add -- data/quiz/production_context/subkultur/house_of_nerds.json
          git add -- data/quiz/subkultur/house_of_nerds_sets.json
          git add -- data/knowledge/subjects/subkultur/knowledge_units.generated.json
          git add -- reports/knowledge-id-backfill.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Generate canonical House of Nerds quiz context and Knowledge links"
            git push origin HEAD:place/house-of-nerds-quiz-20261101
          fi
