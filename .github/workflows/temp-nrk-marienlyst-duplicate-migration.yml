name: Temp NRK Marienlyst duplicate migration

on:
  push:
    branches:
      - 'agent/nrk-marienlyst-duplicate-migration'
    paths:
      - 'scripts/nrk-marienlyst-duplicate-migration.mjs'
      - '.github/workflows/temp-nrk-marienlyst-duplicate-migration.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  rebind-validate-merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: '2641'
      REPO: Paradispartiet/History-Go
      BRANCH: agent/nrk-marienlyst-duplicate-migration
    steps:
      - name: Check out trigger branch
        uses: actions/checkout@v4
        with:
          ref: agent/nrk-marienlyst-duplicate-migration
          fetch-depth: 0

      - name: Preserve migration script
        run: cp scripts/nrk-marienlyst-duplicate-migration.mjs /tmp/nrk-migration.mjs

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebind, migrate, validate and merge
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Migration attempt $attempt"
            git fetch origin main
            base_sha="$(git rev-parse origin/main)"
            git reset --hard "$base_sha"

            node /tmp/nrk-migration.mjs
            npm run places:index:build
            npm run audit:places-split-manifest-sync
            npm run places:index:check
            npm run test:coordinate-source-contract
            npm run places:coords:quality
            npm run places:coords:intake
            npm run places:coords:evidence:audit
            npm run places:aliases:check
            npm run check:stories
            npm run audit:quiz-manifest:v2
            npm run audit:people-of-places
            npm run places:emner:check
            set +e
            npm run health:places
            health_exit=$?
            set -e
            echo "health:places exit code: $health_exit"
            if rg -n '"nrk_marienlyst"' data; then
              echo "Legacy nrk_marienlyst references remain in active data" >&2
              exit 1
            fi
            git diff --check

            git fetch origin main
            latest_sha="$(git rev-parse origin/main)"
            if [[ "$latest_sha" != "$base_sha" ]]; then
              echo "Main moved during validation; retrying from newest main"
              continue
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data
            git add docs/coordinates/coordinate-control-protocol.md tools/check_place_id_aliases.mts reports/nrk-marienlyst-duplicate-migration-final/
            git diff --cached --check
            git commit -m "Migrate duplicate NRK Marienlyst place id"
            git push --force origin HEAD:"$BRANCH"

            gh pr ready "$PR_NUMBER" --repo "$REPO" || true
            if gh pr merge "$PR_NUMBER" --squash --repo "$REPO"; then
              echo "Merged PR #$PR_NUMBER"
              exit 0
            fi
            echo "Merge raced with main; retrying"
          done

          echo "Could not merge after five fresh-main attempts" >&2
          exit 1

# retrigger: 2026-07-20
