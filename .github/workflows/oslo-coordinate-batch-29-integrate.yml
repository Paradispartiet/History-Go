name: Oslo coordinate batch 29 integration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-coordinate-batch-29-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'agent/oslo-coordinate-control-batch-29-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect persistent batch 29 evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT='reports/oslo-coordinate-control-batch-29'
          mkdir -p "$OUT/lookups" "$OUT/sources" "$OUT/artwork-audit"

          run_finder() {
            local address="$1"
            local file="$2"
            set +e
            set -o pipefail
            npm run places:coords:find:address -- --address "$address" | tee "$OUT/lookups/$file"
            local code=${PIPESTATUS[0]}
            set +o pipefail
            set -e
            printf '%s\n' "$code" > "$OUT/lookups/$file.exit-status.txt"
          }

          run_curl() {
            local url="$1"
            local file="$2"
            set +e
            curl --retry 3 --retry-delay 2 -fsSL -A 'History-Go-coordinate-audit/1.0' "$url" \
              | tee "$OUT/sources/$file" >/dev/null
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$code" > "$OUT/sources/$file.exit-status.txt"
          }

          run_finder 'Hausmanns gate 14 Oslo' 'kulturkirken-jakob-hausmanns-gate-14-geonorge.json'
          run_finder 'Universitetsgata 22 Oslo' 'norli-universitetsgata-22-geonorge.json'
          run_finder 'Universitetsgata 24 Oslo' 'norli-universitetsgata-24-geonorge.json'
          run_finder 'Dalsbergstien 3 Oslo' 'ruth-maier-dalsbergstien-3-geonorge.json'
          run_finder 'Borghild Ruds vei 3 Nittedal' 'alf-proysen-nittedal-flammen-geonorge.json'

          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Kulturkirken%20Jakob%20Oslo' 'kulturkirken-jakob-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Norli%20Universitetsgata%20Oslo' 'norli-universitetsgata-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Pr%C3%B8ysenhuset%20Rudsh%C3%B8gda' 'proysenhuset-rudshogda-nominatim.json'
          run_curl 'https://www.wikidata.org/wiki/Special:EntityData/Q44179381.json' 'ruth-maier-wikidata-Q44179381.json'
          run_curl 'https://www.wikidata.org/wiki/Special:EntityData/Q19347867.json' 'inger-hagerups-plass-wikidata-Q19347867.json'
          run_curl 'https://www.norli.no/kundeservice/omoss' 'norli-official-om-oss.html'
          run_curl 'https://www.snublestein.no/Ruth-Maier/p%3D92/' 'ruth-maier-snublestein.html'
          run_curl 'https://www.proysenhuset.no/' 'proysenhuset-official.html'
          run_curl 'https://oslobyleksikon.no/side/Stensparken' 'sigrid-undset-stensparken-oslobyleksikon.html'
          run_curl 'https://lokalhistoriewiki.no/wiki/Inger_Hagerups_plass' 'inger-hagerups-plass-lokalhistoriewiki.html'

          STENSPARKEN='[out:json][timeout:30];(nwr(around:700,59.928571,10.730418)[tourism=artwork];nwr(around:700,59.928571,10.730418)[historic=memorial];nwr(around:700,59.928571,10.730418)[memorial];);out center tags;'
          set +e
          curl --retry 3 --retry-delay 3 -fsSL -A 'History-Go-coordinate-audit/1.0' \
            --data-urlencode "data=$STENSPARKEN" 'https://overpass-api.de/api/interpreter' \
            | tee "$OUT/artwork-audit/stensparken-artwork-overpass.json" >/dev/null
          OVERPASS_CODE=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$OVERPASS_CODE" > "$OUT/artwork-audit/stensparken-artwork-overpass.json.exit-status.txt"

          cat > "$OUT/source-notes.md" <<'EOF'
          # Batch 29 – kilde- og identitetsnotater

          - Kulturkirken Jakob: konkret bygg, Hausmanns gate 14; Geonorge adresse-first brukes og kryssjekkes mot navngitt OSM-bygg.
          - Norli Universitetsgata: Norli oppgir Universitetsgata 22–24. Geonorge har separate adressepunkter for 22 og 24, så det navngitte Norli-POI-et brukes for å unngå vilkårlig husnummer.
          - Sigrid Undset-statuen: kilder dokumenterer Stensparken og avduking i 1991, men ingen entydig navngitt statuegeometri er funnet. Legacy-punktet verifiseres ikke.
          - Ruth Maier: recorden korrigeres fra generell minnetavle til den konkrete snublesteinen utenfor Dalsbergstien 3; Wikidata Q44179381 kryssjekkes mot Snublestein.no.
          - Alf Prøysen-statuen: recorden flyttes fra Oslo til Nittedal, Akershus. Flammen-adressen brukes bare som foreløpig site-anchor med needs_manual_visual_qa; exact statuepunkt mangler.
          - Prøysenhuset: recorden flyttes fra Oslo til Ringsaker, Innlandet og bruker det navngitte museumsbygget OSM way 319658476, kryssjekket mot offisiell adresse Prestvegen 1.
          - Inger Hagerups plass: navngitt plassobjekt Wikidata Q19347867 kryssjekkes mot Lokalhistoriewiki; år korrigeres til 1994.
          EOF

      - name: Capture baseline place health
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run health:places | tee reports/oslo-coordinate-control-batch-29/places-health-baseline.txt
          CODE=${PIPESTATUS[0]}
          set +o pipefail
          set -e
          echo "$CODE" > reports/oslo-coordinate-control-batch-29/places-health-baseline.exit-status.txt
          exit 0

      - name: Apply batch 29
        run: node scripts/tmp-complete-oslo-coordinate-batch29.mjs

      - name: Build global place index
        run: |
          set -o pipefail
          npm run places:index:build | tee reports/oslo-coordinate-control-batch-29/places-index-build.txt

      - name: Validate split manifest sync
        run: |
          set -o pipefail
          npm run audit:places-split-manifest-sync | tee reports/oslo-coordinate-control-batch-29/split-manifest-audit.txt

      - name: Validate source and runtime parity
        run: |
          set -o pipefail
          npm run places:index:check | tee reports/oslo-coordinate-control-batch-29/places-index-check.txt

      - name: Validate no new place health errors
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run health:places | tee reports/oslo-coordinate-control-batch-29/places-health-post.txt
          POST_CODE=${PIPESTATUS[0]}
          set +o pipefail
          set -e
          echo "$POST_CODE" > reports/oslo-coordinate-control-batch-29/places-health-post.exit-status.txt

          extract_errors() {
            awk '
              $0 == "Errors:" { capture=1; next }
              $0 == "Warnings:" { capture=0 }
              capture && /^- / { print }
            ' "$1" | sort -u
          }

          extract_errors reports/oslo-coordinate-control-batch-29/places-health-baseline.txt \
            > reports/oslo-coordinate-control-batch-29/places-health-baseline-errors.txt
          extract_errors reports/oslo-coordinate-control-batch-29/places-health-post.txt \
            > reports/oslo-coordinate-control-batch-29/places-health-post-errors.txt
          comm -13 \
            reports/oslo-coordinate-control-batch-29/places-health-baseline-errors.txt \
            reports/oslo-coordinate-control-batch-29/places-health-post-errors.txt \
            > reports/oslo-coordinate-control-batch-29/places-health-new-errors.txt

          if [ -s reports/oslo-coordinate-control-batch-29/places-health-new-errors.txt ]; then
            echo 'Batch 29 introduced new place-health errors:'
            cat reports/oslo-coordinate-control-batch-29/places-health-new-errors.txt
            exit 1
          fi
          echo 'No new place-health errors introduced by batch 29.'

      - name: Validate coordinate quality
        run: |
          set -o pipefail
          npm run places:coords:quality | tee reports/oslo-coordinate-control-batch-29/coordinate-quality.txt

      - name: Validate strict coordinate intake against merge-base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE="$(git merge-base HEAD origin/main)"
          echo "COORD_INTAKE_BASE=$BASE" | tee reports/oslo-coordinate-control-batch-29/strict-intake-base.txt
          COORD_INTAKE_BASE="$BASE" npm run places:coords:intake \
            | tee reports/oslo-coordinate-control-batch-29/strict-intake.txt

      - name: Validate coordinate evidence
        id: evidence
        continue-on-error: true
        run: |
          set -o pipefail
          npm run places:coords:evidence:audit | tee reports/oslo-coordinate-control-batch-29/evidence-audit.txt

      - name: Upload evidence audit failure report
        if: steps.evidence.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch-29-evidence-audit-failure
          path: |
            reports/coordinate-evidence-audit.md
            reports/oslo-coordinate-control-batch-29/evidence-audit.txt
          if-no-files-found: error

      - name: Stop on evidence audit failure
        if: steps.evidence.outcome == 'failure'
        run: exit 1

      - name: Validate diff whitespace
        run: git diff --check

      - name: Remove temporary integration files and commit result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/oslo-coordinate-batch-29-integrate.yml
          rm -f scripts/tmp-complete-oslo-coordinate-batch29.mjs
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete Oslo coordinate control batch 29'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
