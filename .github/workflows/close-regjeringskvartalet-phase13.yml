name: Close Regjeringskvartalet phase 13

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/close-regjeringskvartalet-phase13.yml"
      - "scripts/close_regjeringskvartalet_phase13.py"

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/regjeringskvartalet-phase-13-closure
          fetch-depth: 0

      - name: Close phase 13 card
        run: python3 scripts/close_regjeringskvartalet_phase13.py

      - name: Commit closure
        run: |
          rm scripts/close_regjeringskvartalet_phase13.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/place-production/regjeringskvartalet-politikk-v1.md scripts/close_regjeringskvartalet_phase13.py
          git commit -m "Lukk Regjeringskvartalets fasekort"
          git push origin HEAD:agent/regjeringskvartalet-phase-13-closure
