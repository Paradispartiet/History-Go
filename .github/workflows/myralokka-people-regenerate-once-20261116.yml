name: Myralokka People runtime regenerate (one-time PR)
on:
  pull_request:
    paths:
      - ".github/workflows/myralokka-people-regenerate-once-20261116.yml"
permissions:
  contents: write
jobs:
  rebuild-runtime:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 7342
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate secondary roles and regenerate canonical Place-open
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const people = [
            require('./data/people/by/oslo/folketeateret/arne_eide.json'),
            require('./data/people/by/oslo/folketeateret/christian_morgenstierne.json')
          ];
          for (const person of people) {
            assert.equal(person.placeId, 'folketeateret');
            assert.ok(person.places.includes('myralokka'));
            assert.match(person.popupDesc, /Myragården/u);
            assert.ok(person.externalLinks.some(x => x.url === 'https://oslobyleksikon.no/side/Arendalsgata'));
          }
          NODE
          npm run place-open:build
          npm run place-open:check
          node --test tests/myralokka-placecard-collections-v2.test.mjs
      - name: Verify exact generated scope, commit and self-remove
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          changes="$(git diff --name-only)"
          printf 'Generated files:\n%s\n' "$changes"
          unexpected="$(printf '%s\n' "$changes" | grep -vE '^data/runtime/place-open/(myralokka|folketeateret|torggata|storgata)\.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated changes: $unexpected"
            exit 1
          fi
          test -n "$changes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/place-open/myralokka.json data/runtime/place-open/folketeateret.json data/runtime/place-open/torggata.json data/runtime/place-open/storgata.json data/runtime/people-all/part-007.json
          git rm .github/workflows/myralokka-people-regenerate-once-20261116.yml
          git commit -m "chore(myralokka): sync sourced architect links in Place-open"
          git push origin "HEAD:refs/heads/$HEAD_REF"
