name: Fagverk Psykologi audit diagnostics

on:
  pull_request:
    paths:
      - "data/fag/psykologi/**"
      - "data/fagverk/**"
      - "scripts/materialize-psykologi-*-phase4.mjs"
      - "scripts/audit-fagverk-psykologi-*.mjs"
      - ".github/workflows/fagverk-psykologi-audit-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Expose exact Psychology audit assertion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Materialize Psychology 1-5
        run: |
          node scripts/materialize-psykologi-psykisk-helse-institusjoner-behandling-phase4.mjs
          node scripts/enrich-psykologi-psykisk-helse-source-evidence-phase4.mjs
          node scripts/materialize-psykologi-fagtradisjoner-teori-phase4.mjs
          node scripts/materialize-psykologi-utvikling-oppvekst-laring-phase4.mjs
          node scripts/materialize-psykologi-kognisjon-folelser-atferd-phase4.mjs
          node scripts/materialize-psykologi-sosialpsykologi-normalitet-stigma-phase4.mjs

      - name: Diagnose phase 3 audit
        run: |
          set -euo pipefail
          output="$(node scripts/audit-fagverk-psykologi-phase3.mjs --write-report 2>&1)" || {
            while IFS= read -r line; do printf '::error title=Psykologi phase 3 audit::%s\n' "$line"; done <<< "$output"
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"

      - name: Diagnose chapter 1 audit
        run: |
          set -euo pipefail
          output="$(node scripts/audit-fagverk-psykologi-psykisk-helse-phase4.mjs --write-report 2>&1)" || {
            while IFS= read -r line; do printf '::error title=Psykologi chapter 1 audit::%s\n' "$line"; done <<< "$output"
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"

      - name: Diagnose chapter 2 audit
        run: |
          set -euo pipefail
          output="$(node scripts/audit-fagverk-psykologi-fagtradisjoner-teori-phase4.mjs --write-report 2>&1)" || {
            while IFS= read -r line; do printf '::error title=Psykologi chapter 2 audit::%s\n' "$line"; done <<< "$output"
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"

      - name: Diagnose chapter 3 audit
        run: |
          set -euo pipefail
          output="$(node scripts/audit-fagverk-psykologi-utvikling-oppvekst-laring-phase4.mjs --write-report 2>&1)" || {
            while IFS= read -r line; do printf '::error title=Psykologi chapter 3 audit::%s\n' "$line"; done <<< "$output"
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"

      - name: Diagnose chapter 4 audit
        run: |
          set -euo pipefail
          output="$(node scripts/audit-fagverk-psykologi-kognisjon-folelser-atferd-phase4.mjs --write-report 2>&1)" || {
            while IFS= read -r line; do printf '::error title=Psykologi chapter 4 audit::%s\n' "$line"; done <<< "$output"
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"

      - name: Diagnose chapter 5 audit
        run: |
          set -euo pipefail
          output="$(node scripts/audit-fagverk-psykologi-sosialpsykologi-normalitet-stigma-phase4.mjs --write-report 2>&1)" || {
            while IFS= read -r line; do printf '::error title=Psykologi chapter 5 audit::%s\n' "$line"; done <<< "$output"
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
