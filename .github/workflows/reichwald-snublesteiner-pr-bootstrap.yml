name: Build Reichwald snublesteiner quiz
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: reichwald-snublesteiner-quiz-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build-quiz:
    if: github.head_ref == 'agent/etne-reichwald-snublesteiner-quiz'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-reichwald-snublesteiner-quiz
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Assemble quiz
        run: node .tmp/bootstrap-reichwald-snublesteiner.mjs assemble
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Knowledge links
        run: npm run knowledge:canonical:write
      - name: Validate quiz
        run: node .tmp/bootstrap-reichwald-snublesteiner.mjs validate
      - name: Audit quiz content
        run: npm run audit:quiz-content
      - name: Audit quiz templates
        run: npm run audit:quiz-templates
      - name: Test quiz audit
        run: npm run test:quiz-content-audit
      - name: Check Knowledge data
        run: npm run knowledge:canonical:check
      - name: Commit quiz package
        run: |
          rm -rf .tmp
          rm -f .github/workflows/reichwald-snublesteiner-pr-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Reichwald snublesteiner quiz'
          git push origin HEAD:agent/etne-reichwald-snublesteiner-quiz
