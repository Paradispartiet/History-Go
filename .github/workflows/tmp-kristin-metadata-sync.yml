name: Temporary People metadata repair
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'data/people/scenekunst/oslo/dramatikkens_hus/kristin_auestad_danielsen.json'
      - '.github/workflows/tmp-kristin-metadata-sync.yml'
permissions:
  contents: read
concurrency:
  group: tmp-kristin-metadata-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  synchronize:
    if: github.event.pull_request.head.ref == 'agent/kristin-claims-metadata-20261008' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run place-open:build
      - name: Verify restricted metadata repair
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const base='4c6ee9b8e6e3ba042999ae3e5e46fd7ba14a0a07';
          const old=f=>JSON.parse(execFileSync('git',['show',base+':'+f],{encoding:'utf8',maxBuffer:20000000}));
          const read=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const id='kristin_auestad_danielsen';
          const source='data/people/scenekunst/oslo/dramatikkens_hus/kristin_auestad_danielsen.json';
          const expected=old(source);expected[0].claimsFile='data/people/claims/scenekunst/oslo/dramatikkens_hus/kristin_auestad_danielsen.claims.json';expected[0].profileStandard='people_profile_v1.0';
          assert.deepEqual(read(source),expected);
          const changed=execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          assert.ok(changed.every(p=>/^data\/runtime\/people-all\/(part-\d+|index)\.json$/.test(p)||p==='data/runtime/place-open/dramatikkens_hus.json'),changed.join(','));
          const beforePaths=execFileSync('git',['ls-tree','-r','--name-only',base,'data/runtime/people-all'],{encoding:'utf8'}).trim().split('\n').filter(p=>/part-\d+/.test(p)).sort();
          const afterPaths=fs.readdirSync('data/runtime/people-all').filter(p=>/part-\d+/.test(p)).sort().map(p=>'data/runtime/people-all/'+p);
          const before=beforePaths.flatMap(old),after=afterPaths.flatMap(read);
          assert.deepEqual(before.filter(p=>p.id!==id),after.filter(p=>p.id!==id));
          assert.deepEqual(after.find(p=>p.id===id),expected[0]);
          const file='data/runtime/place-open/dramatikkens_hus.json',oldPlace=old(file),newPlace=read(file);
          oldPlace.people=oldPlace.people.map(p=>p.id===id?expected[0]:p);
          assert.deepEqual(newPlace,oldPlace);
          console.log('PASS: only Kristin claimsFile/profileStandard and their runtime projections changed.');
          
          JS
      - name: Verify People contracts and generated state
        run: |
          bash scripts/check-people.sh
          npm run test:factuality-contract
          npm run audit:people-profile-canonical
          npm run place-open:check
          npm run test:place-open
      - name: Commit generated repair to this branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: agent/kristin-claims-metadata-20261008
        run: |
          set -euo pipefail
          actual_head=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$actual_head" = "$EXPECTED_HEAD"
          git add -- data/runtime/people-all data/runtime/place-open/dramatikkens_hus.json
          git config user.name "History Go data synchronization"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: synchronize Kristin profile metadata projections"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
