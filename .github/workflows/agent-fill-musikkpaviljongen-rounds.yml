name: Fill Musikkpaviljongen rounds

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-validate-commit:
    if: github.head_ref == 'agent/fill-musikkpaviljongen-rounds-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Musikkpaviljongen content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path, value):
              Path(path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          payload_dir = Path('.github/agent-payloads')

          place_path = 'data/places/kunst/vestland/etne/musikkpaviljongen_doktorhagen.json'
          rows = load(place_path)
          if len(rows) != 1 or rows[0].get('id') != 'musikkpaviljongen_doktorhagen':
              raise SystemExit('Unexpected Musikkpaviljongen place file')
          rows[0].update(load(payload_dir / 'musikkpaviljongen-place.json'))
          save(place_path, rows)

          relation = load(payload_dir / 'musikkpaviljongen-relation.json')
          relations_path = 'data/relations.json'
          relations = [row for row in load(relations_path) if row.get('id') != relation['id']]
          relations.append(relation)
          save(relations_path, relations)

          story = load(payload_dir / 'musikkpaviljongen-story.json')
          story_path = 'data/stories/stories_etnesjoen_kunst_rounds_batch1.json'
          stories = [row for row in load(story_path) if row.get('id') != story['id']]
          stories.append(story)
          save(story_path, stories)

          article = load(payload_dir / 'musikkpaviljongen-article.json')
          article_path = 'data/leksikon/places/vestland/etne/kunst/leksikon_etnesjoen_kunst_rounds_batch1.json'
          articles = [row for row in load(article_path) if row.get('place_id') != article['place_id']]
          articles.append(article)
          save(article_path, articles)
          PY
      - name: Musikkpaviljongen dedicated test
        run: node tests/musikkpaviljongen-batch1-round-content.test.js
      - name: Inherited Etne batch 1 round tests
        shell: bash
        run: |
          find tests -maxdepth 1 -type f -name '*batch1-round-content.test.js' \
            | grep -E '/(etne|etnesjoen|skanevik|steinsvollen|engebanen|skakkeringen|osnes|sjokanten|fikse|house-of-blues|musikkpaviljongen)[^/]*batch1-round-content\.test\.js$' \
            | grep -v 'musikkpaviljongen-batch1-round-content.test.js' \
            | sort \
            | xargs -r -n1 node
      - run: npm run leksikon:ids:check
      - name: People audit
        run: bash scripts/check-people.sh
      - name: Restore generated people audit reports
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- \
            reports/people-invalid-place-refs.json \
            reports/people-invalid-place-refs.md \
            reports/people-of-places-status.json \
            reports/people-of-places-status.md \
            reports/people-place-coverage.json \
            reports/people-place-coverage.md
      - run: npm run typecheck:tools
      - run: npm run typecheck:web
      - name: Story integrity without new Musikkpaviljongen errors
        shell: bash
        run: |
          set +e
          npx tsx tools/check_stories_integrity.mts > /tmp/story-integrity.log 2>&1
          status=$?
          set -e
          cat /tmp/story-integrity.log
          if grep -E 'musikkpaviljongen_doktorhagen|st_musikkpaviljongen' /tmp/story-integrity.log; then
            echo "New Musikkpaviljongen story-integrity error detected"
            exit 1
          fi
          echo "Story integrity exit status: $status; no Musikkpaviljongen-specific errors"
      - run: git diff --check
      - name: Remove temporary payloads and workflow
        run: |
          rm -rf .github/agent-payloads
          rm .github/workflows/agent-fill-musikkpaviljongen-rounds.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name "History Go data agent"
          git config user.email "history-go-agent@users.noreply.github.com"
          git add -A
          git commit -m "Fill Musikkpaviljongen place rounds batch 1"
          git push origin HEAD:${{ github.head_ref }}
