name: Oset slusebru licensed photos one-time generator
on:
  pull_request:
    paths:
      - ".github/workflows/oset-slusebru-photos-once-20261117.yml"
permissions:
  contents: write
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 7342
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch CC BY-SA source, validate identity and produce two different compositions
        run: |
          python -m pip install --quiet --break-system-packages Pillow
          python - <<'PY'
          from urllib.request import Request, urlopen
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          src='https://oslobyleksikon.no/images/5/51/Oset_slusebru.jpg'
          req=Request(src,headers={'User-Agent':'HistoryGo/1.0 (licensed place-photo creation; attribution retained)'})
          with urlopen(req,timeout=40) as response:
              payload=response.read()
          picture=Image.open(BytesIO(payload)).convert('RGB')
          assert picture.size==(3008,2000),f'Unexpected copyrighted source/image dimensions: {picture.size}'
          out=Path('bilder/places');out.mkdir(parents=True,exist_ok=True)
          # The full landscape image shows the entire historic sluice bridge.
          landscape=picture.resize((1600,1064),Image.Resampling.LANCZOS)
          landscape.save(out/'oset_slusebru_landscape.webp',format='WEBP',quality=88,method=6)
          # Deliberate documented crop, centered on the manual winch and railings.
          portrait=picture.crop((970,0,2470,2000)).resize((900,1200),Image.Resampling.LANCZOS)
          portrait.save(out/'oset_slusebru_front_portrait.webp',format='WEBP',quality=88,method=6)
          assert landscape.size==(1600,1064) and portrait.size==(900,1200)
          assert (out/'oset_slusebru_landscape.webp').read_bytes()!=(out/'oset_slusebru_front_portrait.webp').read_bytes()
          print('Licensed Oset source 3008x2000, landscape 1600x1064, portrait 900x1200; original photo Kjell Egil Sterten, CC BY-SA 4.0')
          PY
      - name: Regenerate Place-open source and verify photo pointers
        run: |
          npm run place-open:build
          npm run place-open:check
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          for(const id of ['frysjadammen','stilla_nydalen']){
            const src=require('./data/places/natur/oslo/places_oslo_natur_akerselvarute/'+id+'.json');
            const runtime=require('./data/runtime/place-open/'+id+'.json');
            assert.ok(src.image && src.frontImage && src.image!==src.frontImage);
            assert.equal(runtime.place.image,src.image);
            assert.equal(runtime.place.frontImage,src.frontImage);
            assert.ok(src.imageLicense==='CC BY-SA 4.0');
          }
          for(const p of ['bilder/places/oset_slusebru_landscape.webp','bilder/places/oset_slusebru_front_portrait.webp'])
            assert.ok(fs.statSync(p).size>50000,p+' is empty or low resolution');
          NODE
      - name: Guard generated changes, commit and self-remove
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          printf 'Generated photo and runtime scope:\n%s\n' "$changes"
          unexpected="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | grep -vE '^(bilder/places/oset_slusebru_(landscape|front_portrait)\.webp|data/runtime/place-open/(frysjadammen|stilla_nydalen)\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths: $unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/places/oset_slusebru_landscape.webp bilder/places/oset_slusebru_front_portrait.webp data/runtime/place-open/frysjadammen.json data/runtime/place-open/stilla_nydalen.json
          git rm .github/workflows/oset-slusebru-photos-once-20261117.yml
          git commit -m "chore(oset): publish two credited CC BY-SA photos and synced Place-open"
          git push origin "HEAD:refs/heads/$HEAD_REF"
