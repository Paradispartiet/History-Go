name: Finalize Bjørvika Fagverk v2

on:
  push:
    branches:
      - work/bjorvika-fagverk-v2-20260901
    paths:
      - .github/workflows/finalize-bjorvika-fagverk-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Sync branch to current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Materialize Bjørvika Fagverk source
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'data/places/by/oslo/places/bjorvika.json';
          const place = JSON.parse(fs.readFileSync(path, 'utf8'));
          place.fagverk = {
            schema: 'history_go_place_fagverk_v2',
            level: 'full',
            status: 'curated',
            intro: 'Bjørvika gjør det mulig å undersøke hvordan havn, jernbane og hovedvei kan bygges om til en tett fjordby med kulturbygg, boliger, arbeidsplasser og offentlig sjøfront. Stedet viser samtidig at fysisk åpning mot vannet ikke opphever spørsmål om eiendomsverdier, tetthet, tilgang og hvem den nye byen er utviklet for.',
            article: [
              'Bjørvika er Fjordbyens største delområde og måler omkring 697 dekar. Området ligger mellom Vippetangen og Sydhavna og var lenge preget av havnefunksjoner, jernbane, lager- og trafikkanlegg. Derfor er dagens bylandskap ikke bare et nytt arkitekturprosjekt, men resultatet av en omfattende endring i arealbruk og infrastruktur.',
              'Oslo bystyre vedtok utvikling av Bjørvika i 1988, før Fjordbyen ble etablert som samlet strategi for sjøfronten. Fjordbyarbeidet skulle frigjøre tidligere havnearealer til blant annet bolig, næring og rekreasjon og åpne byen mot fjorden. Bjørvika ble dermed et tidlig og stort laboratorium for transformasjon fra transport- og produksjonsareal til en ny sentrumsdel.',
              'Trafikkomleggingen var en strukturell forutsetning for utbyggingen. Da senketunnelen under Bjørvika åpnet i 2010, kunne store overflatearealer organiseres på nytt. Dronning Eufemias gate, nye bygater, kollektivtrafikk og gangforbindelser viser hvordan et infrastrukturgrep kan endre hvilke aktiviteter som får plass på bakkenivå uten at transportbehovet forsvinner.',
              'Offentlig tilgang til fjorden er et eget planleggingsmål. Bjørvikas allmenninger er planlagt som offentlig tilgjengelige fotgjengerområder som visuelt og fysisk forbinder byen bak med sjøfronten og knyttes til Havnepromenaden. Havnepromenaden skal være sammenhengende, bred og tilgjengelig hele døgnet. Dette gjør det mulig å undersøke forskjellen mellom privat eierskap til byggefelter og offentlig tilgjengelighet i byrommene mellom dem.',
              'Kulturbyggene har samtidig fått en viktig rolle i den nye bystrukturen. Operaen åpnet 12. april 2008, og Snøhettas idé om taket som en allmenning inviterer publikum til å gå på selve bygningen mellom land og fjord. MUNCH åpnet i Bjørvika i 2021, og den vertikale museumsbygningen inngår sammen med Operaen og andre institusjoner i et område der kultur brukes som både attraksjon, møteplass og byutviklingsmotor.',
              'Tettheten og eiendomsutviklingen må analyseres separat fra den fysiske åpningen av sjøfronten. Kommunens egne beskrivelser av Bjørvika peker både på mange arbeidsplasser og boliger, tidlig kritikk av et kontordominert Barcode-område og behovet for steder der folk kan oppholde seg uten kjøpepress. Feltarbeid kan dokumentere byggehøyder, funksjonsblanding, promenadebredder, innganger og oppholdssoner, men spørsmål om boligøkonomi, sosial inkludering og fordeling av gevinster krever andre data enn det man kan se på stedet.'
            ],
            subject_ids: ['by'],
            emne_ids: [
              'em_by_transformasjon_ombruk',
              'em_by_gentrifisering_eiendom',
              'em_by_vannpromenader_fjordliv'
            ],
            chapter_ids: [
              'arkitektur-gatekant-makt-ombruk',
              'bolig-nabolag-tilgang-endring',
              'arbeid-naering-handel-logistikk'
            ],
            lenses: [
              {
                id: 'bjorvika-fra-havn-til-fjordby',
                title: 'Fra havn og trafikk til fjordby',
                prompt: 'Hvilke synlige trekk i Bjørvika kan brukes til å undersøke overgangen fra havne- og transportareal til ny sentrumsby?',
                subject_id: 'by',
                emne_id: 'em_by_transformasjon_ombruk',
                evidence: 'Sammenhold dagens bygater, kulturbygg og sjøfront med kommunens dokumentasjon av tidligere havneareal, bystyrevedtaket fra 1988 og Fjordbyens mål om ny arealbruk.'
              },
              {
                id: 'bjorvika-infrastruktur-forst',
                title: 'Infrastruktur før byrom',
                prompt: 'Hvordan kan tunnelen og den nye gateordningen ha vært en forutsetning for at andre funksjoner kunne flytte inn på overflaten?',
                subject_id: 'by',
                emne_id: 'em_by_transformasjon_ombruk',
                evidence: 'Bruk overgangen fra senketunnel til Dronning Eufemias gate og nye overflater som observerbare spor, og kommunens tidslinje for å dokumentere rekkefølgen.'
              },
              {
                id: 'bjorvika-allmenninger-og-sjofront',
                title: 'Allmenninger og offentlig sjøfront',
                prompt: 'Hvordan forsøker allmenninger og Havnepromenaden å sikre offentlig tilgang gjennom et område med omfattende privat og institusjonell utbygging?',
                subject_id: 'by',
                emne_id: 'em_by_vannpromenader_fjordliv',
                evidence: 'Følg ganglinjene fra byen mot fjorden og sammenhold dem med Fjordbyens dokumenterte krav om offentlig tilgjengelige allmenninger og en sammenhengende havnepromenade.'
              },
              {
                id: 'bjorvika-tetthet-og-eiendomslogikk',
                title: 'Tetthet, arbeidsplasser og eiendomslogikk',
                prompt: 'Hva kan Barcode, Bispevika og de nye byggefeltene fortelle om forholdet mellom høy tetthet, sentral beliggenhet og eiendomsutvikling?',
                subject_id: 'by',
                emne_id: 'em_by_gentrifisering_eiendom',
                evidence: 'Registrer høyder, funksjoner, boliger, kontorer og publikumsrettede førsteetasjer, men bruk egne bolig- og eiendomsdata før du trekker konklusjoner om pris, fortrengning eller sosial sammensetning.'
              },
              {
                id: 'bjorvika-kultur-som-bystruktur',
                title: 'Kulturbygg som bystruktur',
                prompt: 'Hvordan fungerer Operaen og MUNCH både som institusjoner og som fysiske organiseringspunkter i den nye fjordbyen?',
                subject_id: 'by',
                emne_id: 'em_by_transformasjon_ombruk',
                evidence: 'Observer tak, innganger, plasser, siktlinjer og forbindelser til vannet; bruk institusjonenes egne kilder til å dokumentere åpningsår og arkitektoniske intensjoner.'
              }
            ],
            guiding_questions: [
              'Hvorfor er vedtaket fra 1988 viktig for å forstå Bjørvika som et langsiktig transformasjonsprosjekt?',
              'Hvordan endret senketunnelen hva som kunne skje på overflaten i Bjørvika?',
              'Hva er forskjellen mellom privat utbygging og offentlig tilgjengelighet når allmenninger og Havnepromenaden går gjennom samme område?',
              'Hvordan kan høy tetthet både støtte kollektivbruk og skape konflikter om høyder, utsyn, boligøkonomi og eiendomsverdier?',
              'Hvilke påstander om gentrifisering, inkludering og fordeling kan ikke avgjøres ved feltobservasjon alene?'
            ],
            concepts: [
              'bytransformasjon',
              'arealbruksendring',
              'infrastrukturstyrt byutvikling',
              'allmenning',
              'havnepromenade',
              'offentlig tilgjengelighet',
              'fortetting',
              'eiendomsutvikling',
              'funksjonsblanding',
              'feltobservasjon'
            ],
            observable_traces: [
              {
                title: 'Operaen som allmenning mellom land og fjord',
                observation: 'Det skrånende operataket kan brukes som gangflate og utsiktspunkt helt ned mot vannet, og bygningen ligger som et tydelig overgangselement mellom fast bygrunn og fjord.',
                interpretation_boundary: 'Den åpne takflaten dokumenterer en fysisk invitasjon til offentlig bruk, men sier ikke alene hvem som faktisk bruker stedet eller opplever det som tilgjengelig.',
                source_urls: [
                  'https://www.operaen.no/om-oss/om-operahuset/',
                  'https://www.oslo.kommune.no/slik-bygger-vi-oslo/fjordbyen/bjorvika/'
                ]
              },
              {
                title: 'Dronning Eufemias gate over et ombygd trafikksystem',
                observation: 'Hovedgaten, trikkesporene, brede fortauene og de nye byggefeltene ligger i et område som ble mulig å organisere på nytt etter at hovedtrafikken ble flyttet ned i senketunnel.',
                interpretation_boundary: 'Dagens gate viser resultatet av ombyggingen, men man må bruke plan- og transportkilder for å fastslå årsaker, trafikkvirkninger og miljøeffekter.',
                source_urls: [
                  'https://www.oslo.kommune.no/slik-bygger-vi-oslo/fjordbyen/bjorvika/',
                  'https://magasin.oslo.kommune.no/byplan/fjordbysjefens-statusrapport-for-bjorvika-miljoeffektene-gleder-meg-aller-mest'
                ]
              },
              {
                title: 'Allmenninger som ganglinjer mot sjøen',
                observation: 'Flere åpne gang- og plassforløp går på tvers av utbyggingsfeltene fra byen mot vannkanten og kobles til promenaden langs fjorden.',
                interpretation_boundary: 'Ganglinjene kan observeres og måles, men graden av sosial tilgjengelighet krever også kunnskap om bruk, regler, økonomi og hvem som oppholder seg der over tid.',
                source_urls: [
                  'https://www.oslo.kommune.no/get-file/111607/375ae66e5695fd46bcf18b76d67deb6af3244318c0f3b74b28901be6ef86f586',
                  'https://www.oslo.kommune.no/slik-bygger-vi-oslo/fjordbyen/havnepromenaden'
                ]
              },
              {
                title: 'Tetthet og publikumsrettede førsteetasjer',
                observation: 'Barcode og nyere felter viser høy bygningstetthet, mens deler av sjøfronten og gateplanet inneholder servering, handel, kultur og oppholdssoner.',
                interpretation_boundary: 'Tetthet og funksjoner kan registreres direkte, men de er ikke i seg selv bevis på gentrifisering, fortrengning eller økonomisk eksklusjon.',
                source_urls: [
                  'https://magasin.oslo.kommune.no/byplan/trivsel-i-bjorvika',
                  'https://www.oslo.kommune.no/slik-bygger-vi-oslo/fjordbyen/bjorvika/'
                ]
              }
            ],
            source_urls: [
              'https://www.oslo.kommune.no/slik-bygger-vi-oslo/fjordbyen/bjorvika/',
              'https://www.oslo.kommune.no/slik-bygger-vi-oslo/fjordbyen/havnepromenaden',
              'https://www.oslo.kommune.no/get-file/111607/375ae66e5695fd46bcf18b76d67deb6af3244318c0f3b74b28901be6ef86f586',
              'https://magasin.oslo.kommune.no/byplan/trivsel-i-bjorvika',
              'https://www.operaen.no/om-oss/om-operahuset/',
              'https://www.munch.no/dette-er-munch/bygget-for-fremtiden/'
            ],
            verified_at: '2026-09-01'
          };
          place.externalLinks = [
            { type: 'source', label: 'Oslo kommune – Fjordbyen: Bjørvika', url: 'https://www.oslo.kommune.no/slik-bygger-vi-oslo/fjordbyen/bjorvika/', verifiedAt: '2026-09-01' },
            { type: 'source', label: 'Oslo kommune – Havnepromenaden', url: 'https://www.oslo.kommune.no/slik-bygger-vi-oslo/fjordbyen/havnepromenaden', verifiedAt: '2026-09-01' },
            { type: 'source', label: 'Oslo kommune – Fjordbyen Oslo (brosjyre)', url: 'https://www.oslo.kommune.no/get-file/111607/375ae66e5695fd46bcf18b76d67deb6af3244318c0f3b74b28901be6ef86f586', verifiedAt: '2026-09-01' },
            { type: 'source', label: 'Oslo kommune – Trivsel i Bjørvika', url: 'https://magasin.oslo.kommune.no/byplan/trivsel-i-bjorvika', verifiedAt: '2026-09-01' },
            { type: 'source', label: 'Den Norske Opera & Ballett – om Operahuset', url: 'https://www.operaen.no/om-oss/om-operahuset/', verifiedAt: '2026-09-01' },
            { type: 'source', label: 'MUNCH – Bygget for fremtiden', url: 'https://www.munch.no/dette-er-munch/bygget-for-fremtiden/', verifiedAt: '2026-09-01' }
          ];
          fs.writeFileSync(path, JSON.stringify(place, null, 2) + '\n');
          NODE
      - name: Regenerate derived Place and Fagverk state
        run: |
          node scripts/build-place-open-payloads.mjs
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate generated state
        run: |
          npm run places:index:check
          node scripts/build-place-open-payloads.mjs --check
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Validate Fagverk contracts
        run: |
          node --test tests/fagverk-place-pages.test.mjs
          node --test tests/fagverk-place-rendering.test.mjs
          node --test tests/fagverk-place-substance-audit.test.mjs
          node --test tests/fagverk-link-audit.test.mjs
      - name: Validate changed Place image
        run: node scripts/audit-place-images.mjs --mode=changed
      - name: Validate generated web runtime
        run: npm run build:web:check
      - name: Validate diff whitespace
        run: git diff --check
      - name: Commit clean production result
        run: |
          git add \
            data/places/by/oslo/places/bjorvika.json \
            data/runtime/place-open/bjorvika.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/fagverk-place-page-coverage-v2.json
          git rm .github/workflows/finalize-bjorvika-fagverk-v2.yml
          git diff --cached --quiet && { echo "No production changes to commit"; exit 1; }
          git commit -m "Curate Bjørvika Fagverk v2"
          git push origin HEAD:${GITHUB_REF_NAME}
