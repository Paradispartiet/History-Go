name: Audit final Oslo politics identities

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'agent/oslo-politikk-people-final-completion'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/oslo-politikk-people-final-completion
          fetch-depth: 0

      - name: Replay validated batches structurally
        env:
          SOURCE_REF: origin/agent/oslo-politikk-people-full-coverage
        run: |
          git fetch origin agent/oslo-politikk-people-full-coverage
          git show 22e2f6c1f882d0e151d772357e2a205d64cc8fe5:.github/workflows/oslo-politikk-people-refresh-main.yml \
            | sed -n "/python3 <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/replay-politics-people.py
          python3 /tmp/replay-politics-people.py

      - name: Write identity audit
        run: |
          python3 <<'PY'
          import json
          import pathlib
          import re
          import unicodedata

          root = pathlib.Path('.')
          manifest = json.loads((root / 'data/people/manifest.json').read_text(encoding='utf-8'))

          def norm(value):
              text = unicodedata.normalize('NFKD', str(value or ''))
              text = ''.join(ch for ch in text if not unicodedata.combining(ch))
              return re.sub(r'[^a-z0-9]+', '', text.casefold())

          candidates = {
              'Knut Knutsen': ['Knut Knutsen'],
              'Bengt Espen Knudsen': ['Bengt Espen Knudsen'],
              'Henrik Bull': ['Henrik Bull'],
              'Torstein Ramberg': ['Torstein Ramberg'],
              'Carl III Johan': ['Carl III Johan','Karl III Johan','Carl Johan','Karl Johan'],
              'Oscar I': ['Oscar I','Oscar 1'],
              'Heinrich Ernst Schirmer': ['Heinrich Ernst Schirmer'],
              'Johan Henrik Nebelong': ['Johan Henrik Nebelong'],
              'Peter Fredrik Wergmann': ['Peter Fredrik Wergmann','Peder Wergmann','Peter Wergmann'],
              'Johannes Flintoe': ['Johannes Flintoe'],
              'Peter Petersen': ['Peter Petersen'],
              'Henrik Thrap-Meyer': ['Henrik Thrap-Meyer','Henrik Thrap Meyer'],
              'Wilhelm von Hanno': ['Wilhelm von Hanno'],
              'Paul Due': ['Paul Due'],
              'Bernhard Steckmest': ['Bernhard Steckmest'],
              'Henrik Ibsen': ['Henrik Ibsen'],
              'Johan Nygaardsvold': ['Johan Nygaardsvold'],
              'Curt Bräuer': ['Curt Bräuer','Curt Brauer'],
              'Christian Mohr': ['Christian Mohr'],
              'Christian P. Reusch': ['Christian P. Reusch','Christian Reusch'],
          }

          by_name = {}
          for rel in manifest['files']:
              path = root / 'data' / rel
              doc = json.loads(path.read_text(encoding='utf-8'))
              people = doc if isinstance(doc, list) else [doc]
              for person in people:
                  by_name.setdefault(norm(person.get('name')), []).append({
                      'id': person.get('id'),
                      'name': person.get('name'),
                      'category': person.get('category'),
                      'placeId': person.get('placeId'),
                      'places': person.get('places') or [],
                      'file': str(path),
                  })

          result = {}
          for name, aliases in candidates.items():
              hits = []
              seen = set()
              for alias in aliases:
                  for hit in by_name.get(norm(alias), []):
                      key = (hit['file'], hit['id'])
                      if key not in seen:
                          seen.add(key)
                          hits.append(hit)
              result[name] = hits

          out = root / 'reports/oslo-politikk-people-full-coverage/final-identity-audit.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          for name, hits in result.items():
              print(name, '=>', [(h['id'], h['file']) for h in hits])
          PY

      - name: Publish audit and fresh-main replay
        run: |
          rm .github/workflows/oslo-politikk-people-final-completion.yml
          rm .github/workflows/oslo-politikk-people-final-completion-v2.yml
          rm .github/workflows/oslo-politikk-people-final-identity-audit.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auditér siste politikk-People-identiteter"
          git push origin HEAD:agent/oslo-politikk-people-final-completion
