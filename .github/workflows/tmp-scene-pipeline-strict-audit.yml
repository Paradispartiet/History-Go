name: Temporary Civication staged-plan audit repair

on:
  push:
    branches:
      - civication/scene-pipeline-enforcement-audit
    paths:
      - .github/workflows/tmp-scene-pipeline-strict-audit.yml

permissions:
  contents: write

jobs:
  repair-verify-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prove red then apply staged-plan audit repair
        shell: bash
        run: |
          set +e
          node tests/civication-scene-pipeline-staged-plan.test.js
          BEFORE=$?
          set -e
          if [ "$BEFORE" -eq 0 ]; then
            echo 'Expected the staged-plan regression test to fail before the repair.' >&2
            exit 1
          fi
          node scripts/tmp-fix-scene-pipeline-staged-plan.cjs
          node tests/civication-scene-pipeline-staged-plan.test.js
      - name: Verify focused audit semantics
        shell: bash
        run: |
          node tests/civication-scene-pipeline-reachability.test.js
          node scripts/audit-civication-scene-pipeline.mjs --json > /tmp/scene-pipeline-audit.json
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/scene-pipeline-audit.json','utf8'));
          const planPath='data/Civication/mailPlans/naeringsliv/kapital_og_eierskap_plan.json';
          const capital=audit.plan_reachability.plans.find((row)=>row.path===planPath);
          if (!capital || capital.activation_status!=='staged_future_split' || capital.blocking_reachability!==false) process.exit(1);
          if ((audit.blocking_issues||[]).some((issue)=>issue.plan===planPath)) process.exit(1);
          console.log(JSON.stringify({blocking_issues:audit.summary.blocking_issues,staged_future_split_plans:audit.plan_reachability.staged_future_split_plans,capital:{direct_steps:capital.direct_steps,total_steps:capital.total_steps,missing_family_steps:capital.missing_family_steps}},null,2));
          NODE
      - name: Verify complete Civication state
        run: |
          node scripts/build-civication-scene-registry.mjs --check
          npm run test:civication
          git diff --check
      - name: Commit permanent audit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-scene-pipeline-strict-audit.yml scripts/tmp-fix-scene-pipeline-staged-plan.cjs
          git add scripts/audit-civication-scene-pipeline.mjs tests/civication-scene-pipeline-staged-plan.test.js
          git diff --cached --check
          git commit -m "Civication: classify staged future-split mail plans"
          git push origin HEAD:civication/scene-pipeline-enforcement-audit
