name: TEMP Civication authority reconciliation

on:
  push:
    branches:
      - agent/civication-barnehageassistent-authority-reconciliation

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-barnehageassistent-authority-reconciliation
          fetch-depth: 0

      - name: Regenerate authority projections
        run: |
          node --check scripts/audit-civication-career-gameplay.mjs
          node scripts/audit-civication-career-gameplay.mjs --write
          node tests/civication-career-gameplay-matrix.test.js
          node scripts/audit-category-governance.mjs

      - name: Commit projections and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-civication-authority-reconciliation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/careerGameplayMatrix.json reports/civication-career-gameplay-matrix.md .github/workflows/temp-civication-authority-reconciliation.yml
          git diff --cached --quiet && exit 0
          git commit -m "Materialize Civication career authority reconciliation"
          git push origin HEAD:agent/civication-barnehageassistent-authority-reconciliation
