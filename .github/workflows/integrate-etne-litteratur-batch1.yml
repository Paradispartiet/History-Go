name: Integrate Etne literature batch 1

on:
  push:
    branches:
      - agent/etne-litteratur-batch-1

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip etne literature integration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          mkdir -p reports/etne-litteratur-batch-1-integration
          npm install 2>&1 | tee reports/etne-litteratur-batch-1-integration/npm-install.txt

      - name: Resolve and apply address anchors
        shell: bash
        run: |
          node <<'NODE' 2>&1 | tee reports/etne-litteratur-batch-1-integration/address-anchor-lookup.txt
          const fs = require('fs');
          const targets = [
            {
              id: 'olav_vik_garden_osnes',
              path: 'data/places/litteratur/vestland/etne/olav_vik_garden_osnes.json',
              query: 'Olav Viks veg 28, 5590 Etne',
              label: 'Olav Viks veg 28, 5590'
            },
            {
              id: 'ingvar_moe_byste_etne',
              path: 'data/places/litteratur/vestland/etne/ingvar_moe_byste_etne.json',
              query: 'Sjoarvegen 2, 5590 Etne',
              label: 'Sjoarvegen 2, 5590'
            },
            {
              id: 'gurine_johan_ebnes_minde',
              path: 'data/places/litteratur/vestland/etne/gurine_johan_ebnes_minde.json',
              query: 'Strondavegen 1758, 5593 Skånevik',
              label: 'Strondavegen 1758, 5593'
            }
          ];

          async function lookup(target) {
            const url = new URL('https://ws.geonorge.no/adresser/v1/sok');
            url.searchParams.set('sok', target.query);
            url.searchParams.set('treffPerSide', '10');
            const response = await fetch(url);
            if (!response.ok) throw new Error(`${target.id}: Geonorge HTTP ${response.status}`);
            const data = await response.json();
            const addresses = data.adresser || [];
            if (!addresses.length) throw new Error(`${target.id}: no Geonorge address result for ${target.query}`);
            const best = addresses[0];
            const point = best.representasjonspunkt;
            if (!point || typeof point.lat !== 'number' || typeof point.lon !== 'number') {
              throw new Error(`${target.id}: missing representation point`);
            }
            const records = JSON.parse(fs.readFileSync(target.path, 'utf8'));
            const record = records.find((row) => row.id === target.id);
            if (!record) throw new Error(`${target.id}: source record missing`);
            record.lat = point.lat;
            record.lon = point.lon;
            record.quiz_profile.notes += ` Offisielt Kartverket/Geonorge-adressepunkt brukt som anker: ${target.label}.`;
            fs.writeFileSync(target.path, JSON.stringify(records, null, 2) + '\n');
            console.log(`PASS ${target.id}: ${point.lat}, ${point.lon} -> ${target.label}`);
            return { id: target.id, lat: point.lat, lon: point.lon };
          }

          (async () => {
            for (const target of targets) await lookup(target);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Register manifest paths
        shell: bash
        run: |
          node <<'NODE' 2>&1 | tee reports/etne-litteratur-batch-1-integration/manifest-update.txt
          const fs = require('fs');
          const path = 'data/places/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const additions = [
            'places/litteratur/vestland/etne/olav_vik_garden_osnes.json',
            'places/litteratur/vestland/etne/ingvar_moe_byste_etne.json',
            'places/litteratur/vestland/etne/gurine_johan_ebnes_minde.json'
          ];
          for (const item of additions) {
            if (!manifest.files.includes(item)) manifest.files.push(item);
          }
          for (const item of additions) {
            const count = manifest.files.filter((row) => row === item).length;
            if (count !== 1) throw new Error(`${item}: manifest count ${count}`);
            console.log(`PASS ${item}: exactly once in manifest`);
          }
          fs.writeFileSync(path, JSON.stringify(manifest) + '\n');
          NODE

      - name: Run place validation
        shell: bash
        run: |
          bash scripts/check-places.sh 2>&1 | tee reports/etne-litteratur-batch-1-integration/check-places.txt

      - name: Run split manifest audit
        shell: bash
        run: |
          npm run audit:places-split-manifest-sync 2>&1 | tee reports/etne-litteratur-batch-1-integration/split-manifest-sync.txt

      - name: Run coordinate quality gate
        shell: bash
        run: |
          npm run places:coords:quality 2>&1 | tee reports/etne-litteratur-batch-1-integration/coordinate-quality.txt

      - name: Run targeted runtime validation
        shell: bash
        run: |
          node <<'NODE' 2>&1 | tee reports/etne-litteratur-batch-1-integration/targeted-validation.txt
          const fs = require('fs');
          const ids = ['olav_vik_garden_osnes', 'ingvar_moe_byste_etne', 'gurine_johan_ebnes_minde'];
          const rows = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const list = Array.isArray(rows) ? rows : (rows.places || []);
          for (const id of ids) {
            const count = list.filter((row) => row.id === id).length;
            if (count !== 1) throw new Error(`${id}: active runtime count ${count}`);
            console.log(`PASS ${id}: exactly one active runtime row`);
          }
          const counts = new Map();
          for (const row of list) counts.set(row.id, (counts.get(row.id) || 0) + 1);
          const duplicates = [...counts.entries()].filter(([, count]) => count > 1);
          if (duplicates.length) throw new Error(`global duplicate active place IDs: ${duplicates.length}`);
          console.log('PASS global duplicate active place IDs: 0');
          NODE

      - name: Audit anchor semantics
        shell: bash
        run: |
          node <<'NODE' 2>&1 | tee reports/etne-litteratur-batch-1-integration/anchor-audit.txt
          const fs = require('fs');
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'))[0];
          const olav = read('data/places/litteratur/vestland/etne/olav_vik_garden_osnes.json');
          const ingvar = read('data/places/litteratur/vestland/etne/ingvar_moe_byste_etne.json');
          const ebne = read('data/places/litteratur/vestland/etne/gurine_johan_ebnes_minde.json');
          const quay = (() => {
            const rows = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
            const list = Array.isArray(rows) ? rows : (rows.places || []);
            return list.find((row) => row.id === 'etnesjoen_torg_og_kai');
          })();
          const hav = (a,b) => {
            const R=6371, rad=(x)=>x*Math.PI/180;
            const dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
            const q=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
            return 2*R*Math.asin(Math.sqrt(q));
          };
          if (!quay) throw new Error('existing etnesjoen_torg_og_kai runtime row missing');
          const d = hav(ingvar, quay);
          if (d > 0.2) throw new Error(`Ingvar Moe quay anchor too far from documented quayfront: ${d.toFixed(3)} km`);
          if (!ingvar.quiz_profile.notes.includes('representativt')) throw new Error('Ingvar Moe representative-anchor disclosure missing');
          if (!ebne.quiz_profile.notes.includes('ikkje eit sikkert noverande samlingslokale') && !ebne.quiz_profile.notes.includes('ikkje')) throw new Error('Ebne representative-anchor disclosure missing');
          console.log(`PASS Ingvar Moe bust ↔ Etnesjøen quayfront: ${d.toFixed(3)} km; documented representative quay anchor`);
          console.log('PASS Ebne collection: representative locality/community anchor disclosed; not claimed as exact collection building');
          console.log('PASS Olav Vik: exact address anchor applied to literary farm/property');
          console.log('PASS all three records categorized as litteratur');
          NODE

      - name: Check diff whitespace
        shell: bash
        run: |
          git diff --check 2>&1 | tee reports/etne-litteratur-batch-1-integration/git-diff-check.txt

      - name: Commit integrated batch and self-remove workflow
        shell: bash
        run: |
          rm .github/workflows/integrate-etne-litteratur-batch1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/litteratur/vestland/etne data/places/manifest.json data/places/places_index.json reports/etne-litteratur-batch-1-integration .github/workflows/integrate-etne-litteratur-batch1.yml
          git commit -m 'Integrate Etne literature batch 1 [skip etne literature integration]'
          git push
