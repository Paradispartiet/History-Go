name: TEMP Akershus festning completion rescue

on:
  push:
    branches:
      - work/akershus-festning-completion-20260829

permissions:
  contents: write

concurrency:
  group: temp-akershus-festning-completion-rescue
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-npm

      - name: Reuse canonical Akershus normalization step
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/temp-akershus-festning-completion.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if 'name: Normalize permanent Akershus materializer contracts' in line)
          run_line = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'run: |')
          body = []
          for line in source[run_line + 1:]:
              if line.startswith('      - name:'):
                  break
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/normalize-akershus.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/normalize-akershus.sh

      - name: Use throttling-safe direct Wikimedia downloads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/finalize-akershus-festning-completion.mjs')
          s = p.read_text()
          old = '''const commonsDownload = name => `https://commons.wikimedia.org/wiki/Special:Redirect/file/${encodeURIComponent(name)}`;'''
          new = '''const commonsDownload = name => {
            const normalized = String(name).replaceAll(" ", "_");
            const digest = crypto.createHash("md5").update(normalized).digest("hex");
            return `https://upload.wikimedia.org/wikipedia/commons/${digest[0]}/${digest.slice(0, 2)}/${encodeURIComponent(normalized)}`;
          };'''
          if old not in s:
              raise SystemExit('commonsDownload patch anchor missing')
          s = s.replace(old, new)
          old = '''async function download(url) { const res = await fetch(url, { redirect: "follow", headers: { "user-agent": "History-Go-place-production/1.0" } }); if (!res.ok) throw new Error(`download failed ${res.status} ${url}`); return Buffer.from(await res.arrayBuffer()); }'''
          new = '''const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function download(url, attempts = 8) {
            let lastError;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const res = await fetch(url, { redirect: "follow", headers: { "user-agent": "History-Go-place-production/1.0 (Paradispartiet/History-Go)" } });
              if (res.ok) {
                const buffer = Buffer.from(await res.arrayBuffer());
                await sleep(30000);
                return buffer;
              }
              lastError = new Error(`download failed ${res.status} ${url}`);
              if (!(res.status === 429 || res.status >= 500) || attempt === attempts) throw lastError;
              const retryAfterSeconds = Number(res.headers.get("retry-after"));
              const waitMs = Math.min(60000, Math.max(30000, Number.isFinite(retryAfterSeconds) && retryAfterSeconds > 0 ? retryAfterSeconds * 1000 : 2000 * 2 ** (attempt - 1)));
              console.warn(`retrying ${url} after HTTP ${res.status}; attempt ${attempt}/${attempts}; waiting ${waitMs} ms`);
              await sleep(waitMs);
            }
            throw lastError;
          }'''
          if old not in s:
              raise SystemExit('download helper patch anchor missing')
          p.write_text(s.replace(old, new))
          PY
          node --check tools/finalize-akershus-festning-completion.mjs

      - name: Materialize Akershus canonical package
        run: node tools/finalize-akershus-festning-completion.mjs

      - name: Build canonical generated state
        shell: bash
        run: |
          npm run places:index:build
          npm run knowledge:canonical:write
          npm run epoker:places:build
          npm run civication:history-people:build
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --write
          npm run place-open:build
          node scripts/build-fagverk-release-manifest.mjs

      - name: Verify Akershus target and repository contracts
        shell: bash
        env:
          COORD_INTAKE_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          node --test tests/akershus-festning-completion.test.mjs tests/epoke-place-index.test.mjs
          node scripts/audit-historie-place-production.mjs --all
          npm run places:index:check
          npm run places:coords:check
          npm run places:emner:check
          npm run leksikon:ids:check
          npm run places:aliases:check
          npm run check:stories
          npm run audit:people-profile-canonical
          npm run audit:people-of-places
          npm run audit:quiz-manifest:v2
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run knowledge:canonical:check
          npm run civication:history-people:check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          npm run place-open:check
          npm run epoker:places:check
          node scripts/build-fagverk-release-manifest.mjs --check
          git diff --check

      - name: Verify generated image dimensions
        run: |
          node - <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const expected = {
            'bilder/places/akershus_festning.webp': [1200,675],
            'bilder/kort/places/akershus_festning.webp': [640,360],
            'bilder/places/akershus_festning_front_portrait.webp': [900,1200],
            'bilder/historisk/akershus_festning/akershus_festning_1892.webp': [1200,800],
            'bilder/kort/people/hannibal_sehested.webp': [720,900],
            'bilder/kort/objects/akershus_festning_retterstedet.webp': [900,520],
            'bilder/kort/brands/forsvarsbygg_akershus_wordmark.webp': [900,520],
            'bilder/kort/structures/akershus_festning_jomfrutarnet.webp': [900,520],
            'bilder/kort/structures/akershus_festning_slottskirke.webp': [900,520],
            'bilder/kort/structures/akershus_festning_kongelige_mausoleum.webp': [900,520]
          };
          (async () => {
            for (const [file,[w,h]] of Object.entries(expected)) {
              if (!fs.existsSync(file) || fs.statSync(file).size === 0) throw new Error(`Missing image ${file}`);
              const meta = await sharp(file).metadata();
              if (meta.width !== w || meta.height !== h) throw new Error(`${file}: ${meta.width}x${meta.height}, expected ${w}x${h}`);
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload Akershus image review sheet
        uses: actions/upload-artifact@v4
        with:
          name: akershus-festning-image-review-rescue
          path: |
            bilder/places/akershus_festning.webp
            bilder/places/akershus_festning_front_portrait.webp
            bilder/historisk/akershus_festning/akershus_festning_1892.webp
            bilder/kort/people/hannibal_sehested.webp
            bilder/kort/objects/akershus_festning_retterstedet.webp
            bilder/kort/brands/forsvarsbygg_akershus_wordmark.webp
            bilder/kort/structures/akershus_festning_jomfrutarnet.webp
            bilder/kort/structures/akershus_festning_slottskirke.webp
            bilder/kort/structures/akershus_festning_kongelige_mausoleum.webp
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified permanent state and remove TEMP workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-akershus-festning-completion.yml
          git rm .github/workflows/temp-akershus-festning-completion-rescue.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No permanent Akershus changes produced.' >&2
            exit 1
          fi
          git commit -m 'Complete Akershus festning canonical production'
          git push origin HEAD:work/akershus-festning-completion-20260829
