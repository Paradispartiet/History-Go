name: Temporary upstream WebP and People hygiene targeted QA
on:
  push:
    branches:
      - fix/webp-locale-people-hygiene-20261104
    paths:
      - .github/workflows/upstream-webp-people-hygiene-20261104-temp.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact branch and strict diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'a4044e1421167548a4820d5cf447f12fe717f488'
          git merge-base --is-ancestor 'a8d7c2c1c947263fb9d35a78aeab3469cf10c3fe' HEAD
          git diff --check 'a8d7c2c1c947263fb9d35a78aeab3469cf10c3fe' HEAD
          git diff --name-only 'a8d7c2c1c947263fb9d35a78aeab3469cf10c3fe' HEAD | sort
      - name: Test WebP locale format, alpha, dimensions and hashes
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/badge-by-samtidsarkitektur-v1-production.test.mjs tests/badge-by-funksjonalisme-v1-locales.test.mjs tests/badge-by-postmodernisme-v1-production.test.mjs
