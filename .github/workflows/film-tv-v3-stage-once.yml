name: Stage Film & TV v3 image Git objects (temporary)
on:
  push:
    branches:
      - badges/rework-filmfestivaler-filmlocations-v2-20261102
permissions:
  contents: write
jobs:
  stage-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Attach pre-uploaded WebP blobs to PR branch
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const ref="heads/badges/rework-filmfestivaler-filmlocations-v2-20261102";
            const current=(await github.rest.git.getRef({owner,repo,ref})).data.object.sha;
            const tree=(await github.rest.git.getCommit({owner,repo,commit_sha:current})).data.tree.sha;
            const entries=[
              {path:"bilder/merker/film_tv/undermerker/filmfestivaler-brodert-v3.webp", mode:"100644",type:"blob",sha:"0fe02fe5c6185ef3f25c549d8a984bb17d6e69f4"},
              {path:"bilder/merker/film_tv/undermerker/filmlocations-brodert-v3.webp",mode:"100644",type:"blob",sha:"3fdc85b11d902a53b0b71c514365ffb7a3bca9b0"}
            ];
            const target=(await github.rest.git.createTree({owner,repo,base_tree:tree,tree:entries})).data.sha;
            if(target===tree){core.info("Both image files already linked");return;}
            const created=(await github.rest.git.createCommit({owner,repo,message:"badges: attach two circular embroidered v3 WebP artworks",tree:target,parents:[current]})).data.sha;
            await github.rest.git.updateRef({owner,repo,ref,sha:created,force:false});
            core.info("Updated badge branch "+created);
