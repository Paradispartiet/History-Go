name: Apply Philosophy final quality repair

on:
  push:
    branches:
      - agent/philosophy-final-qa-repair
    paths:
      - scripts/repair-filosofi-final-quality.mjs
      - .github/workflows/philosophy-final-quality-repair-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/philosophy-final-qa-repair
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rewrite affected Philosophy prose and reconcile review state
        run: node scripts/repair-filosofi-final-quality.mjs
      - name: Rebuild Philosophy deterministic audits
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-filosofi-phase3.mjs
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate Philosophy contracts including final QA
        run: |
          node --test tests/fagverk-filosofi-phase3.test.mjs \
            tests/fagverk-filosofi-complete.test.mjs \
            tests/fagverk-filosofi-editorial-style.test.mjs \
            tests/fagverk-filosofi-university-depth.test.mjs \
            tests/fagverk-filosofi-final-quality.test.mjs
      - name: Remove one-shot repair workflow
        run: rm .github/workflows/philosophy-final-quality-repair-apply.yml
      - name: Commit repaired Philosophy corpus
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fagverk/filosofi data/fag/filosofi reports scripts tests .github/workflows
          if git diff --cached --quiet; then
            echo 'No repair changes to commit.'
            exit 0
          fi
          git commit -m 'Repair Philosophy final prose quality'
          git push origin HEAD:agent/philosophy-final-qa-repair
