name: Det Norske Teatret C47 published Kilder QA
on:
  push:
    branches: [main]
    paths:
      - 'data/places/scenekunst/oslo/places_scenekunst/det_norske_teatret.json'
      - 'tests/det-norske-teatret-public-unified-c47.mjs'
      - '.github/workflows/det-norske-teatret-public-c47.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dnt-c47-public-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-kilder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify PUBLIC deployed photo bytes and actual PlaceCard at two widths
        run: |
          node --check tests/det-norske-teatret-public-unified-c47.mjs
          node tests/det-norske-teatret-public-unified-c47.mjs
      - name: Archive actual deployed Kilder screenshots and HTTP evidence, even if blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnt-c47-public-evidence
          path: artifacts/dnt-c47-public/*
          if-no-files-found: warn
          retention-days: 10
