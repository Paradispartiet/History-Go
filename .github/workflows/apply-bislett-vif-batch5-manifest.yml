name: Apply Bislett Vålerenga batch 5 manifest

on:
  push:
    branches:
      - data/people-bislett-vif-historic-batch5-20260716
    paths:
      - .github/workflows/apply-bislett-vif-batch5-manifest.yml
      - reports/people-bislett-vif-historic-batch5-validation.md

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/people-bislett-vif-historic-batch5-20260716
      - name: Register batch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/people/manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          additions = [
              'people/sport/oslo/bislett_stadion/trond_sollied.json',
              'people/sport/oslo/bislett_stadion/henning_bjarnoy.json',
              'people/sport/oslo/bislett_stadion/tor_brevik.json',
              'people/sport/oslo/bislett_stadion/jo_bergsvand.json',
              'people/sport/oslo/bislett_stadion/olle_nordin.json',
          ]
          anchor = 'people/sport/oslo/bislett_stadion/knut_arild_loberg.json'
          for item in additions:
              if item in data:
                  data.remove(item)
          try:
              index = data.index(anchor) + 1
          except ValueError:
              raise SystemExit(f'anchor not found: {anchor}')
          data[index:index] = additions
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/apply-bislett-vif-batch5-manifest.yml
          git add data/people/manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Register Bislett Vålerenga batch 5'
          git push origin HEAD:data/people-bislett-vif-historic-batch5-20260716
