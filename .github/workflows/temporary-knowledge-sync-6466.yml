name: Temporary knowledge sync 6466
on:
  push:
    branches:
      - content/akerselva-dams-playable-quiz-20261021
    paths:
      - .github/workflows/temporary-knowledge-sync-6466.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: content/akerselva-dams-playable-quiz-20261021
          persist-credentials: true
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate Knowledge canonical data
        run: |
          npm ci --no-audit --no-fund
          npm run knowledge:canonical:write
      - name: Commit only Knowledge generated outputs
        shell: bash
        run: |
          git add -- data/quiz/natur/brekkedammen_sets.json data/quiz/natur/nydalsdammen_sets.json data/knowledge/knowledge_units.generated.json data/knowledge/knowledge_emne_review_queue.generated.json reports/knowledge-id-backfill.json
          if git diff --cached --quiet; then
            echo 'No canonical updates required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(knowledge): sync dam quiz IDs and generated data'
          git push origin HEAD:refs/heads/content/akerselva-dams-playable-quiz-20261021
