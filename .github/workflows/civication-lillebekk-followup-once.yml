name: Civication Lillebekk followup case materialization (one-shot)
on:
  push:
    branches:
      - civication/lillebekk-followup-continuity-20261105
    paths:
      - .github/workflows/civication-lillebekk-followup-once.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify realistic followup choices and persistence
        run: node tests/civication-by-radgiver-lillebekk-followup-continuity.test.js
      - name: Rebuild canonical compiled scene registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Rebuild career gameplay matrix
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Rebuild role rollout readiness
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Repeat professional acceptance on rebuilt data
        run: |
          node tests/civication-by-radgiver-lillebekk-followup-continuity.test.js
          git status --short
      - name: Commit derived registers only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/compiledSceneRegistryV1.json data/Civication/careerGameplayMatrix.json data/Civication/roleWorldRolloutReadiness.json
          if ! git diff --cached --quiet; then
            git commit -m "Materialize Lillebekk followup continuity in canonical indexes"
            git push origin HEAD:civication/lillebekk-followup-continuity-20261105
          fi
