name: Temporary Alnaparken nature rounds materializer

on:
  pull_request:
    paths:
      - 'scripts/_tmp_alnaparken_materializer_*.b64'
      - '.github/workflows/temporary-alnaparken-nature-rounds.yml'

permissions:
  contents: write

jobs:
  materialize-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild and run materializer
        run: |
          cat scripts/_tmp_alnaparken_materializer_*.b64 | base64 --decode | gzip --decompress > scripts/_tmp_alnaparken_materializer.py
          python -m py_compile scripts/_tmp_alnaparken_materializer.py
          python scripts/_tmp_alnaparken_materializer.py

      - name: Run targeted Alnaparken test
        run: node tests/alnaparken-nature-rounds-batch1.test.js

      - name: Run existing Alna route test
        run: node tests/oslo-nature-rounds-batch5-alna.test.js

      - name: Run existing nature profile test
        run: node tests/oslo-nature-rounds-batch4.test.js

      - name: Run places check
        run: bash scripts/check-places.sh

      - name: Check whitespace
        run: git diff --check

      - name: Commit clean materialized branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/_tmp_alnaparken_materializer_*.b64
          rm -f scripts/_tmp_alnaparken_materializer.py
          rm -f .github/workflows/temporary-alnaparken-nature-rounds.yml
          git add -A
          git diff --cached --check
          git commit -m "Fill Alnaparken nature rounds batch 1"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
