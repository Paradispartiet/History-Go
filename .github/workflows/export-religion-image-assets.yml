name: Export Religion badge images to repo
on:
  push:
    branches: [design/religion-yellow-subbadges-20261029]
    paths:
      - .github/workflows/export-religion-image-assets.yml
      - bilder/merker/religion.svg
      - 'bilder/merker/religion/familie/*.svg'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render 9 image assets from the category SVG artwork
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          from pathlib import Path
          import json,io
          from PIL import Image
          import cairosvg
          badge=json.loads(Path('data/badges/religion.json').read_text())
          paths=[badge['image']]+list(badge['subBadgeImages'].values())
          assert len(paths)==9 and len(set(paths))==9
          for path in paths:
              src=Path(path)
              assert src.exists() and src.suffix=='.svg'
              png=cairosvg.svg2png(url=str(src),output_width=720,output_height=720)
              image=Image.open(io.BytesIO(png)).convert('RGBA')
              dest=src.with_suffix('.webp')
              image.save(dest,format='WEBP',quality=90,method=6)
              assert dest.stat().st_size>1000
              print(dest,dest.stat().st_size)
          PY
      - name: Commit exported artwork to the same PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/merker/religion.webp bilder/merker/religion/familie/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add 9 raster image exports for approved Religion badge family"
            git push
          fi
