name: Literature vertical depth phase 1

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-validate:
    if: github.head_ref == 'agent/litteratur-vertikal-fase-1-poetikk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/litteratur-vertikal-fase-1-poetikk
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and validate literature phase 1
        id: build
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p reports/litteratur-canonical-migration
          exec > >(tee reports/litteratur-canonical-migration/litteratur-poetikk-phase-1-full-run.log) 2>&1

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          cat > reports/litteratur-canonical-migration/litteratur-poetikk-phase-1-part-checksums.expected <<'SUMS'
          8d6777b6f7ab54cbba81929be8358148955e3f83aff910ed5e42e5c61449bfc8  tools/build-litteratur-vertical-phase-1.mjs.gz.b64.part00
          2d53b28e10b5abd5f10c7a942d8555f3a3ba47a44cb82f96bea9611d28839568  tools/build-litteratur-vertical-phase-1.mjs.gz.b64.part01
          SUMS
          sha256sum -c reports/litteratur-canonical-migration/litteratur-poetikk-phase-1-part-checksums.expected \
            2>&1 | tee reports/litteratur-canonical-migration/litteratur-poetikk-phase-1-part-checksums.txt

          cat tools/build-litteratur-vertical-phase-1.mjs.gz.b64.part* \
            > tools/build-litteratur-vertical-phase-1.mjs.gz.b64
          echo '217095f4e1617d68c48e528402116679a354c7374efd76bf723ebce6c154ad01  tools/build-litteratur-vertical-phase-1.mjs.gz.b64' \
            | sha256sum -c - \
            2>&1 | tee reports/litteratur-canonical-migration/litteratur-poetikk-phase-1-builder-checksum.txt

          base64 -d tools/build-litteratur-vertical-phase-1.mjs.gz.b64 \
            | gzip -d > tools/build-litteratur-vertical-phase-1.mjs
          node --check tools/build-litteratur-vertical-phase-1.mjs \
            2>&1 | tee reports/litteratur-canonical-migration/litteratur-poetikk-phase-1-builder-syntax.txt
          node tools/build-litteratur-vertical-phase-1.mjs \
            2>&1 | tee reports/litteratur-canonical-migration/litteratur-poetikk-phase-1-builder-output.txt

          rm -f tools/build-litteratur-vertical-phase-1.mjs
          rm -f tools/build-litteratur-vertical-phase-1.mjs.gz.b64
          rm -f tools/build-litteratur-vertical-phase-1.mjs.gz.b64.part*
          rm -f .github/workflows/litteratur-vertical-phase-1.yml
          rm -f reports/litteratur-canonical-migration/litteratur-poetikk-phase-1-part-checksums.expected
          rm -f reports/litteratur-canonical-migration/litteratur-poetikk-phase-1-part-checksums.txt
          rm -f reports/litteratur-canonical-migration/litteratur-poetikk-phase-1-builder-checksum.txt
          rm -f reports/litteratur-canonical-migration/litteratur-poetikk-phase-1-builder-syntax.txt
          rm -f reports/litteratur-canonical-migration/litteratur-poetikk-phase-1-builder-output.txt
          rm -f reports/litteratur-canonical-migration/litteratur-poetikk-phase-1-full-run.log

          node tools/validate-litteratur-poetikk-phase-1.mjs \
            2>&1 | tee reports/litteratur-canonical-migration/litteratur-poetikk-phase-1-validation.txt

          for file in \
            data/fag/litteratur/fagkart_litteratur_canonical_v4_5.json \
            data/fag/litteratur/emner_litteratur_canonical_v4_5.json \
            data/fag/litteratur/methods_litteratur_canonical_v4_5.json \
            data/fag/litteratur/emnemapping_litteratur_canonical_v4_5.json \
            data/fag/litteratur/litteraturpensum_canonical_v4_5.json \
            data/fag/litteratur/quiz_generator_rules_litteratur_v5_1_source_priority_patch.json \
            reports/litteratur-canonical-migration/litteratur-question-blueprints.json; do
              node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log("PASS | Gyldig JSON: "+process.argv[1])' "$file" \
                2>&1 | tee -a reports/litteratur-canonical-migration/litteratur-poetikk-phase-1-validation.txt
          done

          git diff --check \
            2>&1 | tee -a reports/litteratur-canonical-migration/litteratur-poetikk-phase-1-validation.txt
          echo 'PASS | git diff --check' \
            | tee -a reports/litteratur-canonical-migration/litteratur-poetikk-phase-1-validation.txt

          git add -A data/fag/litteratur reports/litteratur-canonical-migration tools .github/workflows
          git diff --cached --check
          git commit -m 'Litteratur: bygg poetikk- og narratologiakse'
          git push --force-with-lease origin HEAD:agent/litteratur-vertikal-fase-1-poetikk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: literature-poetics-phase-1-diagnostics
          path: |
            reports/litteratur-canonical-migration/litteratur-poetikk-phase-1-*
          if-no-files-found: warn

      - name: Propagate build failure
        if: steps.build.outcome == 'failure'
        run: exit 1
