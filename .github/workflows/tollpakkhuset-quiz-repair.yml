name: Tollpakkhuset quiz progression one-shot repair

on:
  push:
    branches: [agent/tollpakkhuset-completion-20260911-v2]
    paths:
      - ".github/workflows/tollpakkhuset-quiz-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch authoritative materializer source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'tools/build-tollpakkhuset-completion.mjs';
          let src = fs.readFileSync(file, 'utf8');
          const replaceExact = (from, to, label) => {
            const count = src.split(from).length - 1;
            if (count !== 1) throw new Error(`Expected exactly one match for ${label}; got ${count}`);
            src = src.replace(from, to);
            console.log(`Repaired ${label}`);
          };

          replaceExact(
            'q(4, "Hva gjorde de store bueåpningene i første etasje mulig?", ["Inn- og utlasting av varer", "Jernbanetrafikk gjennom bygget", "Fortøyning av skip inne i bygget"], "Inn- og utlasting av varer", "Oppdag Kvadraturen knytter de store åpningene til inn- og utlasting av varer for tollbehandling.", "em_naering_logistikk_verdikjeder", ["oppdag"]),',
            'q(4, "Hva gjorde de store bueåpningene i første etasje mulig?", ["Inn- og utlasting av varer", "Jernbanetrafikk gjennom bygget", "Fortøyning av skip inne i bygget"], "Inn- og utlasting av varer", "Oppdag Kvadraturen knytter de store åpningene til inn- og utlasting av varer for tollbehandling.", "em_naering_logistikk_verdikjeder", ["oppdag"], "context"),',
            'q4 context classification'
          );
          replaceExact(
            'q(12, "Hva sier Riksantikvaren om det gamle treklossgulvet?", ["Det var egnet når fat og kolli skulle rulles", "Det ble lagt for å dempe togtrafikk", "Det var et rent dekorativt parkettgulv"], "Det var egnet når fat og kolli skulle rulles", "Treklossgulvet er et funksjonelt spor etter varehåndtering.", "em_naering_arbeid_verdiskaping", ["riks_plan", "riks_fred"]),',
            'q(12, "Hva sier Riksantikvaren om det gamle treklossgulvet?", ["Det var egnet når fat og kolli skulle rulles", "Det ble lagt for å dempe togtrafikk", "Det var et rent dekorativt parkettgulv"], "Det var egnet når fat og kolli skulle rulles", "Treklossgulvet er et funksjonelt spor etter varehåndtering.", "em_naering_arbeid_verdiskaping", ["riks_plan", "riks_fred"], "context"),',
            'q12 context classification'
          );
          replaceExact(
            'q(13, "Hvilket bygg må Tollpakkhuset ikke forveksles med?", ["Tollboden fra 1896", "Oslo Børs", "Østbanestasjonen"], "Tollboden fra 1896", "Tollpakkhuset er lagerbygningen; Tollboden er den separate administrasjonsbygningen fra 1896.", "em_naering_havn_transport", ["oppdag"]),',
            'q(13, "Hvilket bygg må Tollpakkhuset ikke forveksles med?", ["Tollboden fra 1896", "Oslo Børs", "Østbanestasjonen"], "Tollboden fra 1896", "Tollpakkhuset er lagerbygningen; Tollboden er den separate administrasjonsbygningen fra 1896.", "em_naering_havn_transport", ["oppdag"], "comparison"),',
            'q13 comparison classification'
          );
          replaceExact(
            'q(14, "Hva er den mest presise beskrivelsen av Tollpakkhuset i 2026?", ["Del av et administrativt tollanlegg, ikke dokumentert ordinært ekspedisjonssted", "Oslos eneste tollklareringssted", "Aktivt pakkhus for alle importvarer til Oslo"], "Del av et administrativt tollanlegg, ikke dokumentert ordinært ekspedisjonssted", "Tolletaten er registrert i Tollbugata, mens etatens ekspedisjonsoversikt peker på andre operative steder i Oslo.", "em_naering_risiko_regulering", ["sikt", "toll_oslo"]),',
            'q(14, "Hvilken bruk er dokumentert for Tollpakkhuset i 2026?", ["Del av et administrativt tollanlegg, ikke dokumentert ordinært ekspedisjonssted", "Oslos eneste tollklareringssted", "Aktivt pakkhus for alle importvarer til Oslo"], "Del av et administrativt tollanlegg, ikke dokumentert ordinært ekspedisjonssted", "Tolletaten er registrert i Tollbugata, mens etatens ekspedisjonsoversikt peker på andre operative steder i Oslo.", "em_naering_risiko_regulering", ["sikt", "toll_oslo"]),',
            'q14 normal opening surface'
          );
          replaceExact(
            'q(18, "Hvilke to aktørgrupper møttes tydelig i Tollpakkhusets økonomiske funksjon?", ["Tollvesenet og vareeiere/transportører", "Skuespillere og publikum", "Bankdirektører og aksjemeglere"], "Tollvesenet og vareeiere/transportører", "Tollvesenet kontrollerte vareflyten, mens handels- og transportaktører måtte få varer gjennom prosessen.", "em_naering_risiko_regulering", ["oppdag", "riks_plan"], "context", "met_naering_arbeidslivsanalyse"),',
            'q(18, "Hvilke to aktørgrupper møttes tydelig i Tollpakkhusets økonomiske funksjon?", ["Tollvesenet og vareeiere/transportører", "Skuespillere og publikum", "Bankdirektører og aksjemeglere"], "Tollvesenet og vareeiere/transportører", "Tollvesenet kontrollerte vareflyten, mens handels- og transportaktører måtte få varer gjennom prosessen.", "em_naering_risiko_regulering", ["oppdag", "riks_plan"], "context"),',
            'q18 context without method binding'
          );
          replaceExact(
            'q(20, "Hva viser 1979-museet og senere administrativ ombruk?", ["At samme bygg kan få nye økonomiske og institusjonelle funksjoner", "At tollagerfunksjonen var uendret", "At bygningen sluttet å være fredet"], "At samme bygg kan få nye økonomiske og institusjonelle funksjoner", "Materiell kontinuitet betyr ikke at samme virksomhetsfunksjon fortsetter.", "em_naering_havn_transport", ["riks_plan", "riks_hq"], "context", "met_naering_byhistorisk_naeringsanalyse"),',
            'q(20, "Hva viser 1979-museet og senere administrativ ombruk?", ["At samme bygg kan få nye økonomiske og institusjonelle funksjoner", "At tollagerfunksjonen var uendret", "At bygningen sluttet å være fredet"], "At samme bygg kan få nye økonomiske og institusjonelle funksjoner", "Materiell kontinuitet betyr ikke at samme virksomhetsfunksjon fortsetter.", "em_naering_havn_transport", ["riks_plan", "riks_hq"], "context"),',
            'q20 context without method binding'
          );
          replaceExact(
            'q(21, "Hvorfor skiller History Go mellom Tollpakkhuset og Tollbukaia?", ["Pakkhuset er en konkret bygning, Tollbukaia er et kai-/linjeanker", "De ligger i hver sin by", "Tollbukaia er et museum"], "Pakkhuset er en konkret bygning, Tollbukaia er et kai-/linjeanker", "Skillet bevarer fysisk presisjon og hindrer at bygning, kai og administrasjonsbygg blir ett kunstig sted.", "em_naering_havn_transport", ["oppdag"], "context", "met_naering_infrastrukturanalyse")',
            'q(21, "Hvorfor skiller History Go mellom Tollpakkhuset og Tollbukaia?", ["Pakkhuset er en konkret bygning, Tollbukaia er et kai-/linjeanker", "De ligger i hver sin by", "Tollbukaia er et museum"], "Pakkhuset er en konkret bygning, Tollbukaia er et kai-/linjeanker", "Skillet bevarer fysisk presisjon og hindrer at bygning, kai og administrasjonsbygg blir ett kunstig sted.", "em_naering_havn_transport", ["oppdag"], "context")',
            'q21 context without method binding'
          );
          replaceExact(
            'content_balance: { fact: 14, context: 4, concept_theory: 3 }',
            'content_balance: { fact: 11, context: 6, concept_theory: 4 }',
            'declared question balance'
          );

          fs.writeFileSync(file, src);
          NODE
          git rm .github/workflows/tollpakkhuset-quiz-repair.yml
          git add tools/build-tollpakkhuset-completion.mjs
          git commit -m "Repair Tollpakkhuset quiz progression source"
          git push origin HEAD:agent/tollpakkhuset-completion-20260911-v2
