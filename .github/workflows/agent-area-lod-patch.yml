name: Agent area language and map LOD patch

on:
  push:
    branches: [agent/sprak-place-area-lod]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sprak-place-area-lod
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply source and contract patch
        shell: bash
        run: |
          if [ -f scripts/agent_area_lod_patch.py ]; then
            python scripts/agent_area_lod_patch.py
          else
            echo "Patch already applied."
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build committed web runtimes
        run: npm run build:web

      - name: Verify focused contracts
        run: |
          node --test tests/place-language-layer.test.mjs
          node --test tests/map-place-area-lod.test.mjs
          npm run typecheck:web
          git diff --check

      - name: Commit product changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No product changes to publish."
            exit 0
          fi
          git config user.name "History Go migration bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset .github/workflows/agent-area-lod-patch.yml
          if git diff --cached --quiet; then
            echo "No non-workflow changes to publish."
            exit 0
          fi
          git commit -m "Skill dialektord fra detaljsteder og legg til kart-LOD"
          git pull --rebase origin agent/sprak-place-area-lod
          git push origin HEAD:agent/sprak-place-area-lod
