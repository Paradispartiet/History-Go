name: TEMP Klassekampen generated cleanup

on:
  push:
    branches:
      - agent/klassekampen-final-ui-closeout-20261007
    paths:
      - .github/workflows/tmp-klassekampen-generated-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/klassekampen-final-ui-closeout-20261007
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate only the two stale owned artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm run epoker:places:build
          node scripts/build-quiz-production-context.mjs \
            --category media \
            --target klassekampen_redaksjon \
            --output data/quiz/production_context/media/klassekampen_redaksjon.json

      - name: Enforce exact regeneration scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          printf '%s\n' \
            data/epoker/epoke-place-index.json \
            data/quiz/production_context/media/klassekampen_redaksjon.json \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Verify regenerated contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run epoker:places:check
          npm run audit:quiz-production-context

      - name: Commit regenerated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/epoker/epoke-place-index.json data/quiz/production_context/media/klassekampen_redaksjon.json
          git commit -m "Regenerate Klassekampen derived artifacts"
          git push origin HEAD:agent/klassekampen-final-ui-closeout-20261007
