name: Split Oslo nature A

on:
  push:
    branches:
      - data/split-natur-oslo-alna-places-20260708

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/split-natur-oslo-alna-places-20260708
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/split-natur-oslo-alna-places.mjs
      - run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add data/places/natur/oslo/places_oslo_alna data/places/natur/oslo/places_oslo_alna_manifest.json data/places/natur/oslo/places_oslo_alna_index.json data/places/natur/oslo/places_oslo_alna_split_report.txt
          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Generate split Oslo nature A place files"
            git push
          fi
