name: Reclassify Agder single files pass 1 v2

on:
  push:
    branches:
      - main
    paths:
      - .github/agder-single-files-pass1-v2-trigger.txt

permissions:
  contents: write

concurrency:
  group: reclassify-agder-single-files-pass1-v2
  cancel-in-progress: false

jobs:
  reclassify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reclassify five Agder city-history files
        shell: bash
        run: |
          set -euo pipefail

          declare -a IDS=(
            risor_kirke_byhistorie
            farsund_kirke_byhistorie
            flekkefjord_kirke_byhistorie
            grimstad_kirke_byhistorie
            arendal_gamle_radhus
          )

          for id in "${IDS[@]}"; do
            src="data/places/historie/agder/${id}.json"
            dst="data/places/by/agder/${id}.json"
            test -f "$src"
            test ! -e "$dst"
            git mv "$src" "$dst"
          done

          python - <<'PY'
          import json
          from pathlib import Path

          ids = [
              'risor_kirke_byhistorie',
              'farsund_kirke_byhistorie',
              'flekkefjord_kirke_byhistorie',
              'grimstad_kirke_byhistorie',
              'arendal_gamle_radhus',
          ]

          for place_id in ids:
              path = Path(f'data/places/by/agder/{place_id}.json')
              payload = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(payload, list) or len(payload) != 1:
                  raise SystemExit(f'Expected one-place array: {path}')
              place = payload[0]
              if place.get('id') != place_id:
                  raise SystemExit(f'Unexpected ID in {path}: {place.get("id")}')
              if place.get('category') != 'historie':
                  raise SystemExit(f'Unexpected source category in {path}: {place.get("category")}')
              place['category'] = 'by'
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest_path = Path('data/places/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = manifest['files']

          for place_id in ids:
              old = f'places/historie/agder/{place_id}.json'
              new = f'places/by/agder/{place_id}.json'
              if files.count(old) != 1:
                  raise SystemExit(f'Expected exactly one manifest source: {old}')
              if new in files:
                  raise SystemExit(f'Manifest destination already exists: {new}')
              files[files.index(old)] = new

          if len(files) != len(set(files)):
              raise SystemExit('Duplicate manifest paths after Agder category update')
          if any(f'places/historie/agder/{place_id}.json' in files for place_id in ids):
              raise SystemExit('Old history paths remain in manifest')
          if any(files.count(f'places/by/agder/{place_id}.json') != 1 for place_id in ids):
              raise SystemExit('New by paths are not registered exactly once')

          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8',
          )
          PY

          rm -f .github/workflows/reclassify-agder-single-files-pass1.yml
          rm -f .github/agder-single-files-pass1-trigger.txt
          rm -f .github/workflows/reclassify-agder-single-files-pass1-v2.yml
          rm -f .github/agder-single-files-pass1-v2-trigger.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reclassify Agder city-history single files"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            sleep 2
          done
          exit 1
