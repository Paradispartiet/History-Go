name: TEMP Vålerenga governance repair once

on:
  push:
    branches:
      - agent/vaalerenga-place-production-replay-20260907

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Run Vålerenga governance repair'
    runs-on: ubuntu-latest
    env:
      LOCKED_MAIN: 278e37537ee02ef6bc9fb2f908c41c7aa4da95e8
      BRANCH: agent/vaalerenga-place-production-replay-20260907
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Lock fresh main
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$LOCKED_MAIN"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply narrow governance repair
        run: node scripts/vaalerenga-governance-repair-once.mjs

      - name: Re-record current READ-FIRST evidence
        run: |
          node scripts/place-production-rule-preflight.mjs record --workcard reports/place-production/vaalerenga-workcard-current.json --place-id vaalerenga --category by
          node scripts/place-production-rule-preflight.mjs check --base "$LOCKED_MAIN"

      - name: Run exact description-governance regression and all-packet policy gate
        run: |
          node --check scripts/validate-place-description-production-v4_2.mjs
          node --check scripts/validate-place-description-production-v4_2_policy.mjs
          node --test tests/place-description-production-v4_2.test.mjs
          node --test tests/place-description-length-policy.test.mjs
          node --test tests/place-description-ingress-policy.test.mjs
          node scripts/validate-place-description-production-v4_2_policy.mjs --all --report reports/place-description-validation-v4_2.json
          node --test tests/vaalerenga-completion.test.mjs

      - name: Recheck focused Place contracts
        run: |
          npm run places:index:check
          npm run place-open:check
          npm run test:place-open
          node scripts/place-production-rule-preflight.mjs check --base "$LOCKED_MAIN"

      - name: Commit clean permanent tree
        run: |
          git rm .github/workflows/vaalerenga-governance-repair-once.yml scripts/vaalerenga-governance-repair-once.mjs
          git add data/places/production/vaalerenga.json scripts/validate-place-description-production-v4_2.mjs tests/place-description-production-v4_2.test.mjs reports/place-production/vaalerenga-workcard-current.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair Vålerenga governance gates'

      - name: Run exact changed-description PR-isolation gate
        run: node scripts/validate-place-description-production-v4_2_policy.mjs --changed --base "$LOCKED_MAIN" --head "$(git rev-parse HEAD)"

      - name: Run exact repository hygiene
        run: REPO_HYGIENE_BASE_SHA="$LOCKED_MAIN" REPO_HYGIENE_HEAD_SHA="$(git rev-parse HEAD)" node scripts/audit-repository-hygiene-v1.mjs

      - name: Publish clean fast-forward result
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$LOCKED_MAIN"
          git push origin "HEAD:refs/heads/$BRANCH"
