name: Probe Vollen Maudbukta address source

on:
  pull_request:
    paths:
      - '.github/workflows/probe-vollen-maudbukta-address.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: agent/akershus-vollen-maudbukta-production
          fetch-depth: 0

      - name: Fetch and persist Kartverket address result
        shell: bash
        run: |
          set -euo pipefail
          out=reports/akershus-coordinate-vollen-maudbukta-source-probe
          mkdir -p "$out"

          curl --fail --silent --show-error --get \
            'https://ws.geonorge.no/adresser/v1/sok' \
            --data-urlencode 'adressenavn=Chr. Jensens vei' \
            --data-urlencode 'nummer=8' \
            --data-urlencode 'postnummer=1390' \
            --data-urlencode 'treffPerSide=100' \
            | tee "$out/geonorge-chr-jensens-vei-8.json"

          python - <<'PY' 2>&1 | tee "$out/geonorge-chr-jensens-vei-8-summary.txt"
          import json
          from pathlib import Path

          path = Path('reports/akershus-coordinate-vollen-maudbukta-source-probe/geonorge-chr-jensens-vei-8.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          rows = data.get('adresser', [])
          exact = [
              row for row in rows
              if str(row.get('nummer', '')) == '8'
              and str(row.get('postnummer', '')) == '1390'
              and 'jensens' in str(row.get('adressenavn', '')).casefold()
          ]
          print(f'total_results={len(rows)}')
          print(f'exact_results={len(exact)}')
          for row in exact:
              print(json.dumps(row, ensure_ascii=False, sort_keys=True))
          if len(exact) != 1:
              raise SystemExit('Expected exactly one Chr. Jensens vei 8, 1390 Vollen result')
          PY

      - name: Remove probe workflow and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/probe-vollen-maudbukta-address.yml
          git add reports/akershus-coordinate-vollen-maudbukta-source-probe
          git commit -m 'Materialize Vollen Maudbukta address source probe'
          git push origin HEAD:agent/akershus-vollen-maudbukta-production
