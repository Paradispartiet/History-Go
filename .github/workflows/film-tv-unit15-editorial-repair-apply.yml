name: Apply Film TV Unit15 editorial repair

on:
  push:
    branches:
      - agent/film-tv-unit15-cultural-heritage-canon-stars-memory-fulltext
    paths:
      - "scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs"
      - "scripts/audit-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs"
      - "scripts/audit-film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.mjs"
      - "tests/film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.test.mjs"
      - ".github/workflows/film-tv-unit15-editorial-repair-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Materialize polished Unit15 prose
        run: |
          node --check scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs
          node --check scripts/audit-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs
          node scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs
          node scripts/audit-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs --write

      - name: Rebuild shared deterministic audits
        run: |
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-film-tv-phase3.mjs
          node scripts/build-fagverk-release-manifest.mjs

      - name: Validate Unit15 and shared contracts
        run: |
          node --test tests/film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.test.mjs
          node --test tests/film-tv-cultural-heritage-canon-stars-memory-registry-v1.test.mjs
          node --test tests/film-tv-unit15-fulltext-predecessor-monotonicity-v1.test.mjs
          node --test tests/fagverk-film-tv-phase3.test.mjs
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
          node scripts/audit-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs --check
          node scripts/build-fagverk-release-manifest.mjs --check

      - name: Remove one-shot workflow
        if: success()
        run: rm .github/workflows/film-tv-unit15-editorial-repair-apply.yml

      - name: Commit verified editorial corpus
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk reports/fagverk .github/workflows/film-tv-unit15-editorial-repair-apply.yml
          if git diff --cached --quiet; then
            echo "No editorial changes to commit"
          else
            git commit -m "Polish Film TV Unit15 editorial prose"
            git push
          fi
