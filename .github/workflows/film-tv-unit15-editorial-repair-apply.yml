name: Apply Film TV Unit15 editorial repair

on:
  push:
    branches:
      - agent/film-tv-unit15-cultural-heritage-canon-stars-memory-fulltext
    paths:
      - "scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs"
      - "scripts/audit-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs"
      - "scripts/audit-film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.mjs"
      - "tests/film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.test.mjs"
      - ".github/workflows/film-tv-unit15-editorial-repair-apply.yml"

concurrency:
  group: film-tv-unit15-editorial-repair
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-tv-unit15-cultural-heritage-canon-stars-memory-fulltext
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Reconcile Film TV phase3 completion gate
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'source_brief_complete_full_chapter_production|full_chapter_complete_next_unit_source_brief'
          new = old + '|full_chapter_complete_completion_audit'
          for name in ['scripts/audit-fagverk-film-tv-phase3.mjs', 'tests/fagverk-film-tv-phase3.test.mjs']:
              path = Path(name)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected Film TV gate pattern missing in {name}')
              path.write_text(text.replace(old, new))
          PY
          node --check scripts/audit-fagverk-film-tv-phase3.mjs
          node --check tests/fagverk-film-tv-phase3.test.mjs

      - name: Materialize polished Unit15 prose
        run: |
          node --check scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs
          node --check scripts/audit-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs
          node scripts/materialize-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs
          node scripts/audit-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs --write

      - name: Refresh subject inventory audit
        run: node scripts/audit-fagverk-subject-inventory.mjs

      - name: Refresh general engine audit
        run: node scripts/audit-fagverk-general-engine.mjs --write-report --no-check-report

      - name: Refresh Film TV phase3 audit
        run: node scripts/audit-fagverk-film-tv-phase3.mjs --write-report --no-check-report

      - name: Rebuild release manifest
        run: node scripts/build-fagverk-release-manifest.mjs

      - name: Test Unit15 fulltext contract
        run: node --test tests/film-tv-cultural-heritage-canon-stars-memory-fulltext-v1.test.mjs

      - name: Test Unit15 registry contract
        run: node --test tests/film-tv-cultural-heritage-canon-stars-memory-registry-v1.test.mjs

      - name: Test Unit15 predecessor monotonicity
        run: node --test tests/film-tv-unit15-fulltext-predecessor-monotonicity-v1.test.mjs

      - name: Test Film TV phase3 contract
        run: node --test tests/fagverk-film-tv-phase3.test.mjs

      - name: Test subject inventory contract
        run: node --test tests/fagverk-subject-inventory.test.mjs

      - name: Test general engine contract
        run: node --test tests/fagverk-general-engine.test.mjs

      - name: Test release manifest contract
        run: node --test tests/fagverk-release-manifest.test.mjs

      - name: Check Unit15 editorial audit
        run: node scripts/audit-film-tv-cultural-heritage-canon-stars-memory-editorial-v1.mjs --check

      - name: Check Film TV phase3 audit
        run: node scripts/audit-fagverk-film-tv-phase3.mjs

      - name: Check release manifest
        run: node scripts/build-fagverk-release-manifest.mjs --check

      - name: Remove one-shot workflow
        if: success()
        run: rm .github/workflows/film-tv-unit15-editorial-repair-apply.yml

      - name: Commit verified editorial corpus
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk reports/fagverk scripts/audit-fagverk-film-tv-phase3.mjs tests/fagverk-film-tv-phase3.test.mjs .github/workflows/film-tv-unit15-editorial-repair-apply.yml
          if git diff --cached --quiet; then
            echo "No editorial changes to commit"
          else
            git commit -m "Polish Film TV Unit15 editorial prose"
            git push origin HEAD:agent/film-tv-unit15-cultural-heritage-canon-stars-memory-fulltext
          fi
