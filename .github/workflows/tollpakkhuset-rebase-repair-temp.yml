name: Tollpakkhuset fresh-main repair

on:
  push:
    branches: [agent/tollpakkhuset-completion-20260911-v2]
    paths:
      - ".github/workflows/tollpakkhuset-rebase-repair-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tollpakkhuset-fresh-main-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Merge fresh main without discarding parallel main work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "START_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
          git fetch origin main
          if ! git merge -X theirs --no-edit origin/main; then
            echo "Unresolved merge conflicts:"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Install dependencies and source assets
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Oslo_Tollbod_stenpakkhuset_rk_117572_IMG_2583.JPG' -o /tmp/tollpakkhuset-place.jpg
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Gad_Frederik_Clement_-_Johan_Henrik_Nebelong_-_Norsk_portrettarkiv_-_Riksantikvaren_-_N000136.jpg' -o /tmp/nebelong.jpg
          curl -L --fail --retry 3 'https://altinncdn.no/orgs/tad/tad.png' -o /tmp/tolletaten.png

      - name: Re-materialize shared Tollpakkhuset registrations on fresh main
        shell: bash
        run: |
          set -euo pipefail
          git show dc3c5c7bc2a0c1beeaea05c4d177fe72a46e24d3:tools/build-tollpakkhuset-completion.mjs > tools/build-tollpakkhuset-completion.mjs

          raw_brand_file='data/brands/brands_master_raw.json'
          raw_brand_backup='/tmp/brands_master_raw.json'
          if [[ -f "$raw_brand_file" ]]; then
            mv "$raw_brand_file" "$raw_brand_backup"
          fi

          set +e
          node --trace-uncaught tools/build-tollpakkhuset-completion.mjs > /tmp/tollpakkhuset-materializer.log 2>&1
          status=$?
          set -e

          if [[ -f "$raw_brand_backup" ]]; then
            mv "$raw_brand_backup" "$raw_brand_file"
          fi

          cat /tmp/tollpakkhuset-materializer.log
          cp /tmp/tollpakkhuset-materializer.log tollpakkhuset-materializer-diagnostic.log
          exit "$status"

      - name: Upload materializer diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tollpakkhuset-materializer-diagnostic
          path: tollpakkhuset-materializer-diagnostic.log
          if-no-files-found: error
          retention-days: 1

      - name: Restore verified post-materialization Tollpakkhuset source repairs
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$START_HEAD" -- \
            bilder/kort/brands/tolletaten.webp \
            bilder/kort/objects/tollpakkhuset_pakkhusporter.webp \
            bilder/kort/people/johan_henrik_nebelong.webp \
            bilder/kort/productions/tollpakkhuset_tollbehandling.webp \
            bilder/places/tollpakkhuset.webp \
            bilder/places/tollpakkhuset_front_portrait.webp \
            data/leksikon/places/oslo/naeringsliv/leksikon_tollpakkhuset.json \
            data/leksikon/sprak/places/europe/norway/oslo/tollpakkhuset.json \
            data/people/claims/naeringsliv/oslo/tollpakkhuset/johan_henrik_nebelong.claims.json \
            data/people/naeringsliv/oslo/tollpakkhuset/johan_henrik_nebelong.json \
            data/places/naeringsliv-production/tollpakkhuset.json \
            data/places/naeringsliv/oslo/places_naeringsliv_oslo_oppdag_kvadraturen_batch_04/tollpakkhuset.json \
            data/places/production/tollpakkhuset.json \
            data/quiz/naeringsliv/tollpakkhuset_sets.json \
            data/quiz/production_briefs/naeringsliv/tollpakkhuset.json \
            data/quiz/production_context/naeringsliv/tollpakkhuset.json \
            reports/place-production/tollpakkhuset-source-review-v1.md \
            reports/place-production/tollpakkhuset-workcard-current.json

      - name: Repair shared Lesespor and Fagverk registry entries
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const lesesporPath = 'data/lesespor/oslo/lesespor_oslo_naeringsliv.json';
          const lesespor = JSON.parse(fs.readFileSync(lesesporPath, 'utf8'));
          const oppdag = (lesespor.items || []).find((row) => row?.id === 'lesespor_tollpakkhuset_oppdag');
          if (!oppdag) throw new Error('Missing lesespor_tollpakkhuset_oppdag after materialization');
          oppdag.source_quality = 'institutional';
          fs.writeFileSync(lesesporPath, JSON.stringify(lesespor, null, 2) + '\n');

          const registryPath = 'data/fagverk/fagverk_registry.json';
          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          registry.updatedAt = '2026-09-11';
          registry.placeLinks ||= {};
          registry.placeLinks.tollpakkhuset = {
            sourceFile: 'places/naeringsliv/oslo/places_naeringsliv_oslo_oppdag_kvadraturen_batch_04/tollpakkhuset.json',
            field: 'fagverk',
            schema: 'history_go_place_fagverk_v2',
            level: 'standard',
            status: 'curated'
          };
          fs.writeFileSync(registryPath, JSON.stringify(registry, null, 2) + '\n');
          NODE

      - name: Regenerate canonical derived outputs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target tollpakkhuset --output data/quiz/production_context/naeringsliv/tollpakkhuset.json
          npm run knowledge:canonical:write
          npm run civication:history-people:build
          npm run place-open:build
          npm run epoker:places:build
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs

      - name: Validate repaired contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-naeringsliv-place-production.mjs --all
          node scripts/audit-quiz-manifest-v2.mjs
          node scripts/audit-quiz-progression.mjs
          node scripts/audit-quiz-theory-binding.mjs
          npm run knowledge:canonical:check
          npm run civication:history-people:check
          node scripts/build-place-open-payloads.mjs --check
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          node --test tests/epoke-place-index.test.mjs

      - name: Remove temporary workflow and push fresh-main candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/build-tollpakkhuset-completion.mjs
          rm -f tollpakkhuset-materializer-diagnostic.log
          rm .github/workflows/tollpakkhuset-rebase-repair-temp.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 1
          fi
          git commit -m "Rebase Tollpakkhuset completion onto fresh main"
          git push origin HEAD:${GITHUB_REF_NAME}
