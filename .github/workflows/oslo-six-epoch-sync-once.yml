name: Oslo six epoch index sync once
on:
  push:
    branches:
      - research/oslo-six-culture-institutions-v1-20261023
    paths:
      - .github/workflows/oslo-six-epoch-sync-once.yml

permissions:
  contents: write

jobs:
  sync-epoch-index:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-six-culture-institutions-v1-20261023
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate and verify only epoch-place index
        run: |
          npm run epoker:places:build
          npm run epoker:places:check
      - name: Commit only generated epoch-place index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/epoker/epoke-place-index.json
          if git diff --cached --quiet; then
            echo "Index already synchronized"
          else
            git commit -m "build(epoker): synchronize Oslo six epoch index"
            git push origin HEAD:research/oslo-six-culture-institutions-v1-20261023
          fi
