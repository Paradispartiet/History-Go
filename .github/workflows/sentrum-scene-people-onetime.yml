name: Sentrum Scene People one-time sync
on:
  push:
    branches:
      - content/sentrum-scene-v1-20261102
    paths:
      - .github/workflows/sentrum-scene-people-onetime.yml
permissions:
  contents: write
concurrency:
  group: sentrum-scene-people-onetime
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build canonical Place-open, People shards and Civication index
        run: |
          npm run place-open:build
          npm run civication:history-people:build
          node --test tests/sentrum-scene-v1-fagverk-people-quiz-20261102.test.mjs
      - name: Commit affected generated source outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/place-open/sentrum_scene.json data/runtime/place-open/salt_oslo.json data/runtime/place-open/salt.json data/runtime/place-open/hoyblokka.json data/runtime/place-open/regjeringskvartalet.json data/runtime/people-all data/runtime/people-all.json data/Civication/historyPeople_index.json
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Sentrum Scene: synchronize deduplicated People and venue runtime"
            git restore .
            for attempt in 1 2 3; do
              git fetch origin content/sentrum-scene-v1-20261102
              git rebase origin/content/sentrum-scene-v1-20261102
              if git push origin HEAD:content/sentrum-scene-v1-20261102; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
