name: TEMP Bogstadveien PR repair

on:
  push:
    branches:
      - work/bogstadveien-completion-20260903

permissions:
  contents: write

concurrency:
  group: tmp-bogstadveien-pr-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/bogstadveien-production-final-20260904
          fetch-depth: 0
      - name: Replay final branch on fresh main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main work/bogstadveien-production-final-20260904
          remote_sha="$(git rev-parse origin/work/bogstadveien-production-final-20260904)"
          echo "REMOTE_SHA=$remote_sha" >> "$GITHUB_ENV"
          git checkout -B work/bogstadveien-production-final-20260904 origin/work/bogstadveien-production-final-20260904
          git rebase origin/main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repair description claims and current READ-FIRST evidence
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const placePath = 'data/places/by/oslo/places/bogstadveien.json';
          const packetPath = 'data/places/production/bogstadveien.json';
          const workcardPath = 'reports/place-production/bogstadveien-workcard-current.json';

          const place = JSON.parse(fs.readFileSync(placePath, 'utf8'));
          const packet = JSON.parse(fs.readFileSync(packetPath, 'utf8'));
          const workcard = JSON.parse(fs.readFileSync(workcardPath, 'utf8'));

          const replacements = [
            [
              'Bogstadveien fikk navn i 1879 etter Bogstad gård og ble en av vestbyens viktigste handelsgater da den elektriske trikken kom i 1894.',
              'Bogstadveien fikk navn i 1879 etter Bogstad gård og ble en sentral handelsgate i vestbyen da den elektriske trikken kom i 1894.'
            ],
            [
              'Leiegårdene fra 1890-årene rommer fortsatt butikker i første etasje.',
              'Leiegårdene fra 1890-årene rommer fortsatt butikker i gateplanet.'
            ],
            [
              'Da den elektriske sporveien nådde Majorstuen gjennom Bogstadveien i 1894, ble gaten en av vestbyens viktigste forbindelser.',
              'Da den elektriske sporveien nådde Majorstuen gjennom Bogstadveien i 1894, ble gaten en sentral forbindelse i vestbyen.'
            ],
            [
              'Gaten er derfor et sammenhengende stykke transport- og handelshistorie: gammel landevei, trikkelinje fra 1894, leiegårder fra 1890-årene, en nedlagt undergrunnsstasjon og butikker som spenner fra mer enn hundre års drift til stadig nye virksomheter.',
              'Gaten viser et sammenhengende stykke transport- og handelshistorie: gammel landevei, trikkelinje fra 1894, leiegårder fra 1890-årene, en nedlagt undergrunnsstasjon og butikker som spenner fra mer enn hundre års drift til stadig nye virksomheter.'
            ]
          ];

          function replaceExact(text, before, after, label) {
            const count = text.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: expected one exact replacement, found ${count}`);
            return text.replace(before, after);
          }

          place.desc = replaceExact(place.desc, ...replacements[0], 'place.desc sentence 1');
          place.desc = replaceExact(place.desc, ...replacements[1], 'place.desc sentence 2');
          place.popupDesc = replaceExact(place.popupDesc, ...replacements[2], 'place.popupDesc sentence 3');
          place.popupDesc = replaceExact(place.popupDesc, ...replacements[3], 'place.popupDesc sentence 19');

          const claimReplacements = new Map([
            ['claim_bogstadveien_desc_01', replacements[0]],
            ['claim_bogstadveien_desc_02', replacements[1]],
            ['claim_bogstadveien_popup_03', replacements[2]],
            ['claim_bogstadveien_popup_19', replacements[3]]
          ]);
          for (const claim of packet.claims ?? []) {
            const pair = claimReplacements.get(claim.id);
            if (!pair) continue;
            if (claim.claim !== pair[0]) throw new Error(`${claim.id}: unexpected pre-repair claim text`);
            claim.claim = pair[1];
            claimReplacements.delete(claim.id);
          }
          if (claimReplacements.size) throw new Error(`Missing claims: ${[...claimReplacements.keys()].join(', ')}`);

          const sha256 = (text) => crypto.createHash('sha256').update(String(text), 'utf8').digest('hex');
          packet.textHashes.desc = sha256(place.desc);
          packet.textHashes.popupDesc = sha256(place.popupDesc);

          workcard.schema = 'history_go_place_workcard_v2';
          workcard.category = 'by';
          delete workcard.rule_preflight;
          workcard.branch_status = 'PR';
          workcard.live_status = 'not_live_until_merge';

          fs.writeFileSync(placePath, `${JSON.stringify(place, null, 2)}\n`);
          fs.writeFileSync(packetPath, `${JSON.stringify(packet, null, 2)}\n`);
          fs.writeFileSync(workcardPath, `${JSON.stringify(workcard, null, 2)}\n`);
          NODE
          node scripts/place-production-rule-preflight.mjs record \
            --workcard reports/place-production/bogstadveien-workcard-current.json \
            --place-id bogstadveien \
            --category by
          node scripts/place-production-rule-preflight.mjs validate \
            --workcard reports/place-production/bogstadveien-workcard-current.json
      - name: Rebuild derived state
        run: |
          set -euo pipefail
          npm run places:index:build
          npm run place-open:build
          npm run epoker:places:build
          node scripts/build-fagverk-release-manifest.mjs
      - name: Validate Bogstadveien and repository contracts
        run: |
          set -euo pipefail
          node scripts/validate-place-description-production-v4_2_policy.mjs --all --report reports/place-description-validation-v4_2.json
          node --test tests/bogstadveien-completion.test.mjs
          node scripts/place-production-rule-preflight.mjs validate --workcard reports/place-production/bogstadveien-workcard-current.json
          npm run places:index:check
          npm run place-open:check
          npm run epoker:places:check
          node --test tests/epoke-place-index.test.mjs tests/epoker-runtime-place-index.test.mjs tests/epoke-viewer.test.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          git diff --check
      - name: Commit and push repaired exact head
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "Satisfy Bogstadveien PR governance gates"
          git push --force-with-lease=refs/heads/work/bogstadveien-production-final-20260904:${REMOTE_SHA} \
            origin HEAD:refs/heads/work/bogstadveien-production-final-20260904
