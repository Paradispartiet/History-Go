name: TEMP Bogstadveien completion

on:
  push:
    branches:
      - work/bogstadveien-completion-20260903

permissions:
  contents: write

concurrency:
  group: tmp-bogstadveien-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Replay branch on fresh main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prefetch Commons assets with backoff
        run: |
          set -euo pipefail
          mkdir -p .cache/bogstadveien-completion
          UA='History-Go-place-production/1.0 (https://github.com/Paradispartiet/History-Go)'
          fetch_asset() {
            url="$1"
            output="$2"
            curl -fL --retry 8 --retry-delay 5 --retry-max-time 180 --retry-all-errors \
              -A "$UA" -o "$output" "$url"
            test "$(stat -c%s "$output")" -gt 1000
          }
          fetch_asset 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Bogstadveien.jpg' '.cache/bogstadveien-completion/bogstadveien.jpg'
          sleep 5
          fetch_asset 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Bogstadveien%2037%20IV.jpg' '.cache/bogstadveien-completion/bogstadveien-37-iv.jpg'
          sleep 5
          fetch_asset 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Bogstadveien%2039.jpg' '.cache/bogstadveien-completion/bogstadveien-39.jpg'
      - name: Align finalizer with canonical contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/finalize-bogstadveien-completion.mjs')
          s = p.read_text()
          old_manifest = '''const quizManifest=read("data/quiz/manifest.json"); const rows=(quizManifest.targets||[]).filter(row=>row.targetId===placeId); if(rows.length!==1)throw new Error(`Expected exactly one Bogstadveien quiz manifest row, got ${rows.length}`); rows[0].file=quizFile; write("data/quiz/manifest.json",quizManifest);'''
          new_manifest = '''const quizManifest=read("data/quiz/manifest.json"); const rows=(quizManifest.sets||[]).filter(row=>row.targetId===placeId); if(rows.length!==1)throw new Error(`Expected exactly one Bogstadveien quiz manifest row, got ${rows.length}`); rows[0].file=quizFile; write("data/quiz/manifest.json",quizManifest);'''
          old_builder = '''let contextBuilt=false; try{await runBuildQuizProductionContext(["--category","by","--target",placeId,"--output","data/quiz/production_context/by/bogstadveien.json"]);contextBuilt=true;}catch(error){console.error("Quiz context builder failed; leaving source brief for explicit repair:",error?.message||error);} if(!contextBuilt)write("data/quiz/production_context/by/bogstadveien.json",{schema_version:"1.0",categoryId:"by",targetId:placeId,generated_at:verifiedAt,source_brief:briefFile,profile_decision:brief.profile_decision,selected_curriculum:brief.selected_curriculum,existing_quiz_audit:brief.existing_quiz_audit,source_inventory:Object.entries(sourceMap).map(([id,value])=>({id,...value})),status:"materialized_from_reviewed_source_brief"});'''
          new_builder = '''let contextBuilt=false; try{await runBuildQuizProductionContext({root,categoryId:"by",targetId:placeId,outputPath:"data/quiz/production_context/by/bogstadveien.json"});contextBuilt=true;}catch(error){console.error("Quiz context builder failed; leaving source brief for explicit repair:",error?.message||error);} if(!contextBuilt)write("data/quiz/production_context/by/bogstadveien.json",{schema_version:"1.0",categoryId:"by",targetId:placeId,generated_at:verifiedAt,source_brief:briefFile,profile_decision:brief.profile_decision,selected_curriculum:brief.selected_curriculum,existing_quiz_audit:brief.existing_quiz_audit,source_inventory:Object.entries(sourceMap).map(([id,value])=>({id,...value})),status:"materialized_from_reviewed_source_brief"});'''
          old_test = '''assert.doesNotMatch(JSON.stringify(quiz.profile_snapshot),/høy kjøpekraft|prisnivå/i);'''
          new_test = '''const economicProfileText=JSON.stringify({signature_features:quiz.profile_snapshot.signature_features,must_include:quiz.profile_snapshot.must_include,primary_angles:quiz.profile_snapshot.primary_angles,question_families:quiz.profile_snapshot.question_families});assert.doesNotMatch(economicProfileText,/kjøpekraft|prisnivå/i);assert.match(quiz.profile_snapshot.notes,/uten å utlede/i);'''
          old_score = '''score: { narrative: 4, historical: 3, source: 5, play_value: 3, originality: 3, total: 18 }'''
          new_score = '''score: { narrative: 3, historical: 2, source: 4, play_value: 3, originality: 3, total: 15 }'''
          for label, old in [('quiz manifest', old_manifest), ('quiz context builder', old_builder), ('quiz regression', old_test), ('story score', old_score)]:
              if s.count(old) != 1:
                  raise SystemExit(f'{label} patch anchor count: {s.count(old)}')
          s = s.replace(old_manifest,new_manifest).replace(old_builder,new_builder).replace(old_test,new_test).replace(old_score,new_score)
          p.write_text(s)
          PY
      - name: Materialize Bogstadveien
        run: node tools/finalize-bogstadveien-completion.mjs
      - name: Build derived state
        run: |
          npm run places:index:build
          npm run place-open:build
          npm run epoker:places:build
          node scripts/build-fagverk-release-manifest.mjs
      - name: Verify and ratchet epoch coverage
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { buildEpokePlaceIndex } from './scripts/build-epoke-place-index.mjs';
          const index = buildEpokePlaceIndex();
          assert.equal(index.stats.canonical_story_milestone_count, 220);
          assert.equal(index.stats.verified_place_production_milestone_count, 410);
          assert.equal(index.domains.historie.oslo_coverage.canonical_place_count, 587);
          assert.equal(index.domains.historie.oslo_coverage.dated_evidence_place_count, 231);
          assert.equal(index.domains.historie.oslo_coverage.documented_case_place_count, 2);
          assert.equal(index.domains.historie.oslo_coverage.awaiting_source_backed_history_count, 354);
          assert.equal(index.domains.historie.oslo_coverage.places.find((row) => row.place_id === 'bogstadveien')?.status, 'dated_evidence');
          NODE
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/epoke-place-index.test.mjs')
          s = p.read_text()
          replacements = {
              'index.stats.canonical_story_milestone_count, 219': 'index.stats.canonical_story_milestone_count, 220',
              'index.stats.verified_place_production_milestone_count, 402': 'index.stats.verified_place_production_milestone_count, 410',
              'coverage.dated_evidence_place_count, 230': 'coverage.dated_evidence_place_count, 231',
              'coverage.awaiting_source_backed_history_count, 355': 'coverage.awaiting_source_backed_history_count, 354',
              '["akershus_slott", "gamle_radhus"': '["akershus_slott", "bogstadveien", "gamle_radhus"',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'epoch fixture anchor count for {old!r}: {s.count(old)}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Bogstadveien contract
        run: node --test tests/bogstadveien-completion.test.mjs
      - name: Epoch runtime
        run: node --test tests/epoke-place-index.test.mjs tests/epoker-runtime-place-index.test.mjs tests/epoke-viewer.test.mjs
      - name: Quiz manifest
        run: npm run audit:quiz-manifest:v2
      - name: Quiz production context
        run: npm run audit:quiz-production-context
      - name: Quiz progression
        run: npm run audit:quiz-progression
      - name: Quiz theory binding
        run: npm run audit:quiz-theory-binding
      - name: Stories
        run: npm run check:stories
      - name: Places index
        run: npm run places:index:check
      - name: Place-open
        run: npm run place-open:check
      - name: Fagverk release manifest
        run: node scripts/build-fagverk-release-manifest.mjs --check
      - name: Diff check
        run: git diff --check
      - name: Commit permanent Bogstadveien production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-bogstadveien-completion.yml tools/finalize-bogstadveien-completion.mjs
          git add -A
          git diff --cached --check
          git commit -m "Complete Bogstadveien Place production"
          git push --force-with-lease origin HEAD:work/bogstadveien-completion-20260903
