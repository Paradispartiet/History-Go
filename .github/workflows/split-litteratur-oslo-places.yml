name: Split Litteratur Oslo places

on:
  push:
    branches:
      - data/split-litteratur-oslo-places-20260707

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/split-litteratur-oslo-places-20260707
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/split-litteratur-oslo-places.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/litteratur/oslo/places_litteratur data/places/litteratur/oslo/places_litteratur_manifest.json data/places/litteratur/oslo/places_litteratur_index.json data/places/litteratur/oslo/places_litteratur_split_report.txt
          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Generate split Litteratur Oslo place files"
            git push
          fi
