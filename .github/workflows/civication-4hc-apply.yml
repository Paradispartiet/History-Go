name: Civication 4H-C apply

on:
  push:
    branches:
      - agent/civication-4hc-remove-legacy-gameplay-fallbacks
    paths:
      - .github/workflows/civication-4hc-apply.yml

permissions:
  contents: write

concurrency:
  group: civication-4hc-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply 4H-C fail-closed cutover
        run: |
          python scripts/.tmp-civication-4hc-apply.py
          python scripts/.tmp-civication-4hc-fix-stale-test.py

      - name: Verify 4H-C focused contracts
        run: |
          node tests/civication-scene-director-ownership.test.js
          node tests/civication-scene-interaction-contract.test.js
          node tests/civication-legacy-work-fallback-closed.test.js
          node scripts/build-civication-scene-registry.mjs --check

      - name: Run complete Civication suite
        id: full_suite
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:civication 2>&1 | tee /tmp/civication-4hc-suite.log

      - name: Capture full-suite failure
        if: steps.full_suite.outcome == 'failure'
        run: |
          {
            echo "Civication 4H-C full-suite failure"
            echo "run=${{ github.run_id }}"
            echo
            grep -nE "FAIL|AssertionError|ERR_ASSERTION|Error:|test\.js" /tmp/civication-4hc-suite.log | tail -120 || true
            echo
            echo "--- tail ---"
            tail -220 /tmp/civication-4hc-suite.log
          } > scripts/.tmp-civication-4hc-suite-failure.log
          git config user.name "civication-4hc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/.tmp-civication-4hc-suite-failure.log
          git commit -m "Capture Civication 4H-C suite failure" || true
          git push origin HEAD:agent/civication-4hc-remove-legacy-gameplay-fallbacks
          exit 1

      - name: Check diff hygiene
        run: git diff --check

      - name: Commit permanent 4H-C result and remove temporary helpers
        run: |
          git config user.name "civication-4hc-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f \
            .github/workflows/civication-4hc-apply.yml \
            scripts/.tmp-civication-4hc-apply.py \
            scripts/.tmp-civication-4hc-fix-stale-test.py \
            scripts/.tmp-civication-4hc-suite-failure.log
          git add \
            js/Civication/core/civicationEventEngine.js \
            js/Civication/systems/civicationWorkdayMailBuilder.js \
            tests/civication-scene-director-ownership.test.js \
            tests/civication-scene-interaction-contract.test.js \
            tests/civication-legacy-work-fallback-closed.test.js \
            data/Civication/scenePipelinePolicyV1.json \
            data/Civication/SCENE_PIPELINE_V1.md
          git diff --cached --check
          git commit -m "Close Civication 4H-C legacy gameplay fallbacks"
          git push origin HEAD:agent/civication-4hc-remove-legacy-gameplay-fallbacks
