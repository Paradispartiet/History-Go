name: Temporary Aktiv leser canonical sync
on:
  push:
    branches:
      - civication/litteratur-aktiv-leser-role-world
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: civication/litteratur-aktiv-leser-role-world
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Synchronize canonical Role World contracts
        run: node scripts/tmp-sync-aktiv-leser-role-world.mjs
      - name: Remove temporary sync machinery and commit generated state
        run: |
          rm -f scripts/tmp-sync-aktiv-leser-role-world.mjs .github/workflows/tmp-aktiv-leser-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize Aktiv leser canonical Role World state"
          git push origin HEAD:civication/litteratur-aktiv-leser-role-world
