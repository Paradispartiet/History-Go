name: TEMP Civication Politikk Parlamentarisk arbeid prerequisites

on:
  push:
    branches:
      - agent/civication-politikk-parlamentarisk-arbeid-prerequisites-20260907
    paths:
      - scripts/TEMP_materialize_politikk_parlamentarisk_arbeid_prerequisites.mjs
      - .github/workflows/TEMP-civication-politikk-parlamentarisk-arbeid-prerequisites.yml

permissions:
  contents: write

concurrency:
  group: temp-civication-politikk-parlamentarisk-arbeid-prerequisites
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-politikk-parlamentarisk-arbeid-prerequisites-20260907
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Syntax
        run: node --check scripts/TEMP_materialize_politikk_parlamentarisk_arbeid_prerequisites.mjs

      - name: Materialize
        run: node scripts/TEMP_materialize_politikk_parlamentarisk_arbeid_prerequisites.mjs

      - name: Generate canonical derived surfaces
        run: |
          set -euo pipefail
          node scripts/audit-civication-role-packs.mjs
          node scripts/audit-civication-career-gameplay.mjs --write
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write
          node scripts/build-civication-scene-registry.mjs --write
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts

      - name: Verify Parlamentarisk arbeid prerequisites
        run: node tests/civication-politikk-parlamentarisk-arbeid-prerequisites.test.js

      - name: Verify Career Gameplay Matrix
        run: node tests/civication-career-gameplay-matrix.test.js

      - name: Verify Role World readiness
        run: node tests/civication-role-world-rollout-readiness.test.js

      - name: Verify Scene Registry
        run: node scripts/build-civication-scene-registry.mjs --check

      - name: Verify Scenario People index
        run: node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check

      - name: Verify Scenario People audit
        run: node --test tests/civication-scenario-people.test.mjs

      - name: Verify full Civication suite
        run: node tests/run-civication-tests.mjs

      - name: Verify job learning profiles
        run: npm run audit:job-learning-profiles

      - name: Verify job knowledge requirements
        run: npm run audit:job-knowledge-requirements

      - name: Verify generated permanent scope
        shell: bash
        run: |
          set -euo pipefail
          ROLE=politikk_parlamentarisk_arbeid
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          if [ "${#changed[@]}" -lt 20 ]; then
            echo "Expected a materialized prerequisite package, found only ${#changed[@]} changed files" >&2
            exit 1
          fi
          for f in "${changed[@]}"; do
            case "$f" in
              data/Civication/careerGameplayMatrix.json|data/Civication/compiledSceneRegistryV1.json|data/Civication/roleModels/manifest.json|data/Civication/rolePackIndex.json|data/Civication/roleWorldRolloutReadiness.json|data/Civication/scenarioPeople/generated/politikk.json|data/Civication/scenarioPeople_index.json|docs/CIVICATION_ROLE_PACK_INDEX.md|reports/civication-career-gameplay-matrix.md|reports/civication-role-world-rollout-readiness.md|reports/CIVICATION_POLITIKK_PARLAMENTARISK_ARBEID_PREREQUISITES_SOURCE_FIRST.md|tests/civication-politikk-parlamentarisk-arbeid-prerequisites.test.js|data/Civication/roleModels/politikk/politikk_parlamentarisk_arbeid.json|data/Civication/workGrammars/politikk/politikk_parlamentarisk_arbeid.json|data/Civication/mailPlans/politikk/politikk_parlamentarisk_arbeid_plan.json|data/Civication/mailFamilies/politikk/*/politikk_parlamentarisk_arbeid_*.json)
                ;;
              *)
                echo "Unexpected generated path: $f" >&2
                exit 1
                ;;
            esac
          done
          for required in \
            data/Civication/roleModels/politikk/$ROLE.json \
            data/Civication/workGrammars/politikk/$ROLE.json \
            data/Civication/mailPlans/politikk/${ROLE}_plan.json \
            reports/CIVICATION_POLITIKK_PARLAMENTARISK_ARBEID_PREREQUISITES_SOURCE_FIRST.md \
            tests/civication-politikk-parlamentarisk-arbeid-prerequisites.test.js; do
            printf '%s\n' "${changed[@]}" | grep -Fx "$required" >/dev/null || { echo "Missing required generated path: $required" >&2; exit 1; }
          done
          for type in job people conflict story event micro followup knowledge consequence; do
            required="data/Civication/mailFamilies/politikk/$type/${ROLE}_${type}.json"
            printf '%s\n' "${changed[@]}" | grep -Fx "$required" >/dev/null || { echo "Missing mail family: $required" >&2; exit 1; }
          done
          git diff --check

      - name: Commit permanent verified package
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/TEMP_materialize_politikk_parlamentarisk_arbeid_prerequisites.mjs
          rm -f .github/workflows/TEMP-civication-politikk-parlamentarisk-arbeid-prerequisites.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.' >&2
            exit 1
          fi
          git diff --cached --check
          git status --short
          git commit -m "Complete Politikk Parlamentarisk arbeid prerequisites"
          git push origin HEAD:agent/civication-politikk-parlamentarisk-arbeid-prerequisites-20260907
