name: House of Nerds temporary release candidate build
on:
  push:
    branches: [place/house-of-nerds-release-candidate-20261102]
    paths:
      - .github/workflows/hon-release-candidate-build.yml
permissions:
  contents: write
concurrency:
  group: house-of-nerds-release-candidate-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build canonical learning and Fagverk
        run: |
          node scripts/build-quiz-production-context.mjs --category subkultur --target house_of_nerds --output data/quiz/production_context/subkultur/house_of_nerds.json
          npm run knowledge:canonical:write
      - name: Build People, Civication, chronology and Place-open
        run: |
          npm run civication:history-people:build
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
          npm run place-open:build
          npm run epoker:places:build
          node tools/materialize-subkultur-runtime-v1.mjs --write
          node scripts/audit-subkultur-runtime-final-v1.mjs --write-report
          node scripts/build-fagverk-release-manifest.mjs
      - name: Verify generated data and quiz parity
        run: |
          npm run knowledge:canonical:check
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run civication:history-people:check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          npm run epoker:places:check
          npm run place-open:check
          node tools/materialize-subkultur-runtime-v1.mjs --check
          node scripts/audit-subkultur-runtime-final-v1.mjs
          node --test tests/house-of-nerds-quizcard-parity.test.mjs
      - name: Commit only canonical generated changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --stat
          changed=$(git diff --name-only | wc -l)
          echo "Generated changed files: $changed"
          test "$changed" -le 65
          unexpected=$(git diff --name-only | grep -Ev '^(data/Civication/|data/runtime/|data/epoker/epoke-place-index.json$|data/fag/subkultur/subkultur_runtime_manifest.json$|data/fagverk/fagverk_release.json$|data/knowledge/|reports/knowledge-|reports/fagverk/subkultur-runtime-final-audit.json$|data/quiz/production_context/subkultur/house_of_nerds.json$|data/quiz/subkultur/house_of_nerds_sets.json$)' || true)
          if [[ -n "$unexpected" ]]; then echo "Unreviewed generated files: $unexpected"; exit 1; fi
          git add -A -- data/Civication/ data/runtime/ data/epoker/epoke-place-index.json data/fag/subkultur/subkultur_runtime_manifest.json data/fagverk/fagverk_release.json data/knowledge/ reports/knowledge-contract-audit.json reports/knowledge-id-backfill.json reports/fagverk/subkultur-runtime-final-audit.json data/quiz/production_context/subkultur/house_of_nerds.json data/quiz/subkultur/house_of_nerds_sets.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate House of Nerds release-candidate runtime"
            git push origin HEAD:place/house-of-nerds-release-candidate-20261102
          fi
