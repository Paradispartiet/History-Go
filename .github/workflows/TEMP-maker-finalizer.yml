name: TEMP Maker finalizer

on:
  push:
    branches:
      - agent/civication-vitenskap-maker-role-world-20260913
    paths:
      - .github/maker-finalize-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/civication-vitenskap-maker-role-world-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Align canonical Maker Role World state
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = 'tests';
          const files = fs.readdirSync(dir).filter(f => /^civication-.*\.test\.js$/.test(f));
          const replacements = [
            [/98_role_worlds_materialized/g, '99_role_worlds_materialized'],
            [/role_worlds_total:\s*98/g, 'role_worlds_total: 99'],
            [/\.role_worlds_total,\s*98/g, '.role_worlds_total, 99'],
            [/life_position_role_worlds:\s*13/g, 'life_position_role_worlds: 14'],
            [/\.life_position_role_worlds,\s*13/g, '.life_position_role_worlds, 14'],
            [/life_position_role_world_count,\s*13/g, 'life_position_role_world_count, 14'],
            [/subject_type === 'life_position'\)\.length,\s*13/g, "subject_type === 'life_position').length, 14"],
            [/completed_life_position_role_worlds\.length,\s*13/g, 'completed_life_position_role_worlds.length, 14'],
            [/canonical_counts\.life_position_role_worlds,\s*13/g, 'canonical_counts.life_position_role_worlds, 14'],
            [/canonical_counts\.total_role_worlds,\s*98/g, 'canonical_counts.total_role_worlds, 99'],
            [/life_position_readiness\.completed_life_position_role_worlds,\s*13/g, 'life_position_readiness.completed_life_position_role_worlds, 14'],
            [/summary\.life_position_role_world_complete,\s*13/g, 'summary.life_position_role_world_complete, 14'],
            [/summary\.completed_life_position_role_worlds,\s*13/g, 'summary.completed_life_position_role_worlds, 14'],
            [/positions_with_exact_governed_sources,\s*13/g, 'positions_with_exact_governed_sources, 14'],
            [/positions_with_multi_scene_narrative_foundation,\s*13/g, 'positions_with_multi_scene_narrative_foundation, 14'],
            [/lifePositionWorlds\.length,\s*13/g, 'lifePositionWorlds.length, 14'],
            [/roles\.length,\s*98/g, 'roles.length, 99'],
            [/ready:\s*13,\n(\s*)needs_authored_depth:\s*146/g, 'ready: 14,\n$1needs_authored_depth: 145'],
            [/98 total worlds/g, '99 total worlds'],
            [/13 completed life-position worlds/g, '14 completed life-position worlds'],
            [/13 life-position worlds/g, '14 life-position worlds']
          ];
          const changed = [];
          for (const file of files) {
            const p = path.join(dir, file);
            const before = fs.readFileSync(p, 'utf8');
            let after = before;
            for (const [re, to] of replacements) after = after.replace(re, to);
            after = after.replace(
              /(assert\.deepEqual\(taxonomy\.role_world_rollout_boundary\.completed_life_position_role_worlds, \[)([\s\S]*?)(\]\);)/g,
              (full, start, body, end) => body.includes("'vitenskap/maker'") ? full : start + body.replace(/\s*$/, '') + ",\n  'vitenskap/maker'\n" + end
            );
            if (after !== before) { fs.writeFileSync(p, after); changed.push(p); }
          }
          console.log('assertion-aligned files:', changed.length);
          for (const p of changed) console.log(p);
          NODE
      - name: Regenerate readiness
        run: |
          node scripts/audit-civication-life-position-role-world-readiness.mjs --write
          node scripts/audit-civication-life-position-role-world-readiness.mjs --check
      - name: Commit deterministic alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Civication/lifePositionRoleWorldReadiness.json reports/civication-life-position-role-world-readiness.md tests
          if git diff --cached --quiet; then
            echo "No deterministic changes to commit"
          else
            git commit -m "Finalize Maker Role World state [maker-finalized]"
            git push origin HEAD:agent/civication-vitenskap-maker-role-world-20260913
          fi
      - name: Run full Civication suite
        run: node tests/run-civication-tests.mjs
