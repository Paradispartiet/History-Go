name: Temporary fix PR 2140 single-person loader

on:
  push:
    branches:
      - data/people-jordal-amfi-batch1-20260714
    paths:
      - .github/workflows/fix-pr2140-single-person-loader.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/people-jordal-amfi-batch1-20260714
          fetch-depth: 0
      - name: Sync main and support single-person JSON files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-commit --no-ff origin/main

          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'js/boot.js',
              '/** @typedef {{ people?: unknown[] }} BootPeoplePayload */',
              '/** @typedef {{ id?: unknown, people?: unknown[] }} BootPeoplePayload */',
          )
          replace_once(
              'js/boot.js',
              '''    if (Array.isArray(data)) {
                peopleAll.push(...data);
              } else if (Array.isArray(data?.people)) {
                peopleAll.push(...data.people);
              }
          ''',
              '''    if (Array.isArray(data)) {
                peopleAll.push(...data);
              } else if (Array.isArray(data?.people)) {
                peopleAll.push(...data.people);
              } else if (data && typeof data === "object" && typeof data.id === "string") {
                peopleAll.push(data);
              }
          ''',
          )

          replace_once(
              'js/boot-fast.js',
              '''  function normalizeRows(data, key) {
                if (Array.isArray(data)) return data;
                if (Array.isArray(data?.[key])) return data[key];
                return [];
              }
          ''',
              '''  function normalizeRows(data, key) {
                if (Array.isArray(data)) return data;
                if (Array.isArray(data?.[key])) return data[key];
                return [];
              }

              function normalizePeopleRows(data) {
                const rows = normalizeRows(data, "people");
                if (rows.length) return rows;
                if (data && typeof data === "object" && typeof data.id === "string") return [data];
                return [];
              }
          ''',
          )
          replace_once(
              'js/boot-fast.js',
              '      peopleAll.push(...normalizeRows(data, "people"));',
              '      peopleAll.push(...normalizePeopleRows(data));',
          )

          replace_once(
              'js/dataHub.js',
              '''      if (Array.isArray(data)) {
                people.push(...data);
              } else if (Array.isArray(data?.people)) {
                people.push(...data.people);
              } else if (data) {
                console.error(`[DataHub.loadPeopleBase] ugyldig people-fil: ${file}`);
              }
          ''',
              '''      if (Array.isArray(data)) {
                people.push(...data);
              } else if (Array.isArray(data?.people)) {
                people.push(...data.people);
              } else if (data && typeof data === "object" && typeof data.id === "string") {
                people.push(data);
              } else if (data) {
                console.error(`[DataHub.loadPeopleBase] ugyldig people-fil: ${file}`);
              }
          ''',
          )

          report = Path('reports/people-jordal-amfi-batch1-validation.md')
          report_text = report.read_text(encoding='utf-8')
          marker = '## Runtime-loader\n'
          if marker not in report_text:
              report_text += '''

## Runtime-loader

`js/boot.js`, `js/boot-fast.js` and `js/dataHub.js` accept all three supported people payload forms:

- an array of people
- `{ "people": [...] }`
- one person object with a string `id`

This makes the new one-person-per-file entries loadable without changing existing array-based data.
'''
              report.write_text(report_text, encoding='utf-8')
          PY

          node --check js/boot.js
          node --check js/boot-fast.js
          node --check js/dataHub.js

          grep -q 'peopleAll.push(data);' js/boot.js
          grep -q 'normalizePeopleRows(data)' js/boot-fast.js
          grep -q 'people.push(data);' js/dataHub.js

          git rm .github/workflows/fix-pr2140-single-person-loader.yml
          git add js/boot.js js/boot-fast.js js/dataHub.js reports/people-jordal-amfi-batch1-validation.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Support single-person people files at runtime'
          git push origin HEAD:data/people-jordal-amfi-batch1-20260714
