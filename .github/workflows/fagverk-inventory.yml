name: Fagverk subject inventory

on:
  pull_request:
    paths:
      - 'data/fag/fag_manifest.json'
      - 'data/fag/**'
      - 'data/fagverk/fagverk_portal.json'
      - 'data/fagverk/subject_inventory.json'
      - 'data/fagverk/subject_status.json'
      - 'reports/fagverk/subject-baseline.json'
      - 'reports/fagverk/subject-inventory-audit.json'
      - 'scripts/audit-fagverk-subject-inventory.mjs'
      - 'tests/fagverk-subject-inventory.test.mjs'
      - '.github/workflows/fagverk-inventory.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Validate all-subject inventory and living baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check inventory audit
        run: node --check scripts/audit-fagverk-subject-inventory.mjs
      - name: Run subject inventory regression tests
        run: node --test --test-reporter=spec tests/fagverk-subject-inventory.test.mjs
      - name: Verify committed living baseline
        run: node scripts/audit-fagverk-subject-inventory.mjs
