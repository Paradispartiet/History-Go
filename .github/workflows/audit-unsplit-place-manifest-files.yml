name: Audit unsplit place manifest files

on:
  workflow_dispatch:
  push:
    branches:
      - data/refresh-unsplit-place-audit

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/refresh-unsplit-place-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/audit-unsplit-place-manifest-files.mjs
      - run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add reports/places-unsplit-manifest-audit.md reports/places-unsplit-manifest-audit.json
          if git diff --cached --quiet; then
            echo "No audit report changes."
          else
            git commit -m "Refresh unsplit place manifest audit report"
            git push
          fi
