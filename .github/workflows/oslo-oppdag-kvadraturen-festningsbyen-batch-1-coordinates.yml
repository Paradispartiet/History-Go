name: Oslo Oppdag Kvadraturen Festningsbyen batch 1 coordinates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-oppdag-kvadraturen-festningsbyen-batch-1-coordinates.yml'

permissions:
  contents: write

jobs:
  coordinates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Resolve exact named fortress subplaces
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-festningsbyen-batch-1/coordinates'
          mkdir -p "$outdir"

          nominatim_lookup() {
            local slug="$1"
            local query="$2"
            curl --max-time 30 --retry 2 --fail --silent --show-error \
              -H 'User-Agent: History-Go coordinate audit (github.com/Paradispartiet/History-Go)' \
              --get 'https://nominatim.openstreetmap.org/search' \
              --data-urlencode 'format=jsonv2' \
              --data-urlencode "q=${query}, Akershus festning, Oslo, Norge" \
              --data-urlencode 'countrycodes=no' \
              --data-urlencode 'limit=10' \
              --data-urlencode 'addressdetails=1' \
              --data-urlencode 'namedetails=1' \
              --data-urlencode 'polygon_geojson=1' \
              --data-urlencode 'viewbox=10.72,59.92,10.75,59.89' \
              --data-urlencode 'bounded=1' \
              -o "$outdir/${slug}_nominatim.json"
          }

          nominatim_lookup hovedporten 'Hovedporten'
          nominatim_lookup festningsplassen 'Festningsplassen'
          nominatim_lookup michael_von_sundts_plass 'Michael von Sundts plass'
          nominatim_lookup stallgarden 'Stallgården'
          nominatim_lookup arkeliggaarden 'Arkeliggården'

          query='[out:json][timeout:35];(nwr["name"="Hovedporten"](59.89,10.72,59.92,10.75);nwr["name"="Festningsplassen"](59.89,10.72,59.92,10.75);nwr["name"="Michael von Sundts plass"](59.89,10.72,59.92,10.75);nwr["name"="Stallgården"](59.89,10.72,59.92,10.75);nwr["name"="Arkeliggården"](59.89,10.72,59.92,10.75););out center geom tags;'
          if ! curl --max-time 45 --retry 1 --fail --silent --show-error --get \
            'https://overpass-api.de/api/interpreter' \
            --data-urlencode "data=${query}" \
            -o "$outdir/festningsbyen_named_subplaces_overpass.json"; then
            curl --max-time 60 --retry 1 --fail --silent --show-error --get \
              'https://overpass.kumi.systems/api/interpreter' \
              --data-urlencode "data=${query}" \
              -o "$outdir/festningsbyen_named_subplaces_overpass.json"
          fi

          jq -e '.elements | length > 0' "$outdir/festningsbyen_named_subplaces_overpass.json" >/dev/null

      - name: Persist coordinate evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/oslo-oppdag-kvadraturen-festningsbyen-batch-1/coordinates
          git commit -m 'Save Festningsbyen batch 1 coordinate evidence'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
