name: Oslo Oppdag Kvadraturen Festningsbyen batch 1 coordinates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-oppdag-kvadraturen-festningsbyen-batch-1-coordinates.yml'

permissions:
  contents: write

jobs:
  coordinates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Resolve broader fortress subplace map objects
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-festningsbyen-batch-1/coordinates'
          mkdir -p "$outdir"

          broad_query='[out:json][timeout:60];(nwr["name"](59.9035,10.7350,59.9085,10.7415);nwr["barrier"="gate"](59.9035,10.7350,59.9085,10.7415);nwr["entrance"](59.9035,10.7350,59.9085,10.7415););out center tags;'
          if ! curl --max-time 75 --retry 1 --fail --silent --show-error --get \
            'https://overpass-api.de/api/interpreter' \
            --data-urlencode "data=${broad_query}" \
            -o "$outdir/festningsbyen_broad_subplaces_overpass.json"; then
            curl --max-time 90 --retry 1 --fail --silent --show-error --get \
              'https://overpass.kumi.systems/api/interpreter' \
              --data-urlencode "data=${broad_query}" \
              -o "$outdir/festningsbyen_broad_subplaces_overpass.json"
          fi

          jq -e '.elements | length > 0' "$outdir/festningsbyen_broad_subplaces_overpass.json" >/dev/null

      - name: Persist coordinate evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/oslo-oppdag-kvadraturen-festningsbyen-batch-1/coordinates
          if ! git diff --cached --quiet; then
            git commit -m 'Save expanded Festningsbyen coordinate evidence'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
