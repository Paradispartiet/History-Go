name: Reset unrelated Technology release drift

on:
  push:
    branches:
      - editorial/teknologi-v3-20260805
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    if: ${{ !contains(github.event.head_commit.message, '[tech-v3-release-reset]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: editorial/teknologi-v3-20260805
      - name: Restore unrelated generated release file from main
        run: |
          git fetch origin main
          git checkout origin/main -- data/fagverk/fagverk_release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fagverk/fagverk_release.json
          git commit -m "[tech-v3-release-reset] Restore release artifact from main"
          git push origin HEAD:editorial/teknologi-v3-20260805
