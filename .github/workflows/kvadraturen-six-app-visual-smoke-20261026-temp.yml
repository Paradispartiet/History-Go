name: Kvadraturen six desktop mobile app visual smoke 20261026
on:
  push:
    branches:
      - research/oslo-sentrum-kvadraturen-v1-six-20261023
    paths:
      - '.github/workflows/kvadraturen-six-app-visual-smoke-20261026-temp.yml'
permissions:
  contents: write
concurrency:
  group: kvadraturen-six-visual-20261026
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-kvadraturen-v1-six-20261023
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install canonical app and browser dependencies
        run: npm ci --no-audit --no-fund
      - name: Resolve Chromium executable
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Test PlaceCards and 18 media files in real desktop and mobile app
        run: node scripts/verify-kvadraturen-six-visual-qa-20261026.mjs
      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: '3.12'
      - name: Compose mobile and desktop contact sheets when screenshots exist
        if: always()
        shell: bash
        run: |
          python -m pip install Pillow==11.3.0
          python - <<'PY'
          from PIL import Image,ImageOps,ImageDraw
          from pathlib import Path
          ids=["den_gamle_krigsskolen","garmanngarden","stattholdergarden","hotel_du_nord","cafe_engebret","treschowgarden"]
          src=Path("artifacts/kvadraturen-six-visuals-20261026")
          dst=Path("reports/place-production");dst.mkdir(parents=True,exist_ok=True)
          for mode in ("mobile","desktop"):
              width,height=(390,844) if mode=="mobile" else (560,360)
              out=Image.new("RGB",(width*3,(height+40)*2),(15,19,25))
              draw=ImageDraw.Draw(out)
              count=0
              for ix,pid in enumerate(ids):
                  f=src/(mode+"-"+pid+".png")
                  if not f.is_file():continue
                  with Image.open(f) as img:
                      thumb=ImageOps.contain(img.convert("RGB"),(width,height))
                  x=(ix%3)*width+(width-thumb.width)//2;y=(ix//3)*(height+40)
                  out.paste(thumb,(x,y))
                  draw.text(((ix%3)*width+8,y+height+9),pid,fill=(240,240,240))
                  count+=1
              if count:
                  f=dst/("oslo-kvadraturen-six-app-"+mode+"-contact-sheet-20261026.jpg")
                  out.save(f,quality=85,optimize=True)
                  print("CONTACT_SHEET",mode,count,f,flush=True)
          PY
          cp artifacts/kvadraturen-six-visuals-20261026/visual-report.json reports/place-production/oslo-kvadraturen-six-app-visual-report-20261026.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kvadraturen-six-placecard-visual-screenshots
          path: |
            artifacts/kvadraturen-six-visuals-20261026/
            reports/place-production/oslo-kvadraturen-six-app-*-contact-sheet-20261026.jpg
          retention-days: 14
          if-no-files-found: warn
      - name: Commit only review artifacts, never declare v1 approval
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add reports/place-production/oslo-kvadraturen-six-app-*-contact-sheet-20261026.jpg
          git add reports/place-production/oslo-kvadraturen-six-app-visual-report-20261026.json
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Document six Kvadraturen desktop/mobile PlaceCard visual QA; v1 review pending'
          git push origin HEAD:research/oslo-sentrum-kvadraturen-v1-six-20261023
