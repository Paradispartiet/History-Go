name: TEMP repair Film TV unit 11 monotone gate

on:
  push:
    branches:
      - agent/film-tv-unit14-archive-preservation-access-authenticity-source-brief
    paths:
      - ".trigger/unit14-unit11-monotone-repair"

permissions:
  contents: write

concurrency:
  group: temp-film-tv-unit14-unit11-monotone-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/film-tv-unit14-archive-preservation-access-authenticity-source-brief
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Extend complete unit 11 monotone contract through unit 14
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const archiveSource = "const ARCHIVE_PRESERVATION_SOURCE_GATE = 'archive_preservation_access_authenticity_source_brief_complete_full_chapter_production';";
          const archiveFulltext = "const ARCHIVE_PRESERVATION_FULLTEXT_GATE = 'archive_preservation_access_authenticity_full_chapter_complete_next_unit_source_brief';";
          const locationAnchor = "const LOCATION_PRODUCTION_FULLTEXT_GATE = 'location_production_place_ethics_full_chapter_complete_next_unit_source_brief';";

          function addArchiveConstants(source, label) {
            if (!source.includes(locationAnchor)) throw new Error(`${label}: location gate anchor missing`);
            if (!source.includes('ARCHIVE_PRESERVATION_SOURCE_GATE')) {
              source = source.replace(locationAnchor, `${locationAnchor}\n${archiveSource}\n${archiveFulltext}`);
            }
            return source;
          }

          {
            const file = 'scripts/brief-film-tv-reception-participation-audience-methods-sources-v1.mjs';
            let source = addArchiveConstants(fs.readFileSync(file, 'utf8'), 'unit11 source brief');
            const setAnchor = '  LOCATION_PRODUCTION_SOURCE_GATE,\n  LOCATION_PRODUCTION_FULLTEXT_GATE\n]);';
            if (!source.includes(setAnchor)) throw new Error('unit11 source brief: production gate set anchor missing');
            source = source.replace(setAnchor, '  LOCATION_PRODUCTION_SOURCE_GATE,\n  LOCATION_PRODUCTION_FULLTEXT_GATE,\n  ARCHIVE_PRESERVATION_SOURCE_GATE,\n  ARCHIVE_PRESERVATION_FULLTEXT_GATE\n]);');
            const activeAnchor = 'const laterGateAlreadyActive = [FULLTEXT_GATE, SCREEN_PLACES_SOURCE_GATE, SCREEN_PLACES_FULLTEXT_GATE, LOCATION_PRODUCTION_SOURCE_GATE, LOCATION_PRODUCTION_FULLTEXT_GATE].includes(currentGate);';
            if (!source.includes(activeAnchor)) throw new Error('unit11 source brief: laterGateAlreadyActive anchor missing');
            source = source.replace(activeAnchor, 'const laterGateAlreadyActive = [FULLTEXT_GATE, SCREEN_PLACES_SOURCE_GATE, SCREEN_PLACES_FULLTEXT_GATE, LOCATION_PRODUCTION_SOURCE_GATE, LOCATION_PRODUCTION_FULLTEXT_GATE, ARCHIVE_PRESERVATION_SOURCE_GATE, ARCHIVE_PRESERVATION_FULLTEXT_GATE].includes(currentGate);');
            fs.writeFileSync(file, source);
          }

          {
            const file = 'scripts/materialize-film-tv-reception-participation-audience-methods-fulltext-v1.mjs';
            let source = addArchiveConstants(fs.readFileSync(file, 'utf8'), 'unit11 materializer');
            const setAnchor = 'const UNIT_TWELVE_OR_LATER_GATES = new Set([SCREEN_PLACES_SOURCE_GATE, SCREEN_PLACES_FULLTEXT_GATE, LOCATION_PRODUCTION_SOURCE_GATE, LOCATION_PRODUCTION_FULLTEXT_GATE]);';
            if (!source.includes(setAnchor)) throw new Error('unit11 materializer: later gate set anchor missing');
            source = source.replace(setAnchor, 'const UNIT_TWELVE_OR_LATER_GATES = new Set([SCREEN_PLACES_SOURCE_GATE, SCREEN_PLACES_FULLTEXT_GATE, LOCATION_PRODUCTION_SOURCE_GATE, LOCATION_PRODUCTION_FULLTEXT_GATE, ARCHIVE_PRESERVATION_SOURCE_GATE, ARCHIVE_PRESERVATION_FULLTEXT_GATE]);');
            fs.writeFileSync(file, source);
          }

          {
            const file = 'scripts/audit-film-tv-reception-participation-audience-methods-fulltext-v1.mjs';
            let source = addArchiveConstants(fs.readFileSync(file, 'utf8'), 'unit11 fulltext audit');
            const setAnchor = 'const UNIT_ELEVEN_OR_LATER_GATES = new Set([OUTPUT_GATE, SCREEN_PLACES_SOURCE_GATE, SCREEN_PLACES_FULLTEXT_GATE, LOCATION_PRODUCTION_SOURCE_GATE, LOCATION_PRODUCTION_FULLTEXT_GATE]);';
            if (!source.includes(setAnchor)) throw new Error('unit11 fulltext audit: later gate set anchor missing');
            source = source.replace(setAnchor, 'const UNIT_ELEVEN_OR_LATER_GATES = new Set([OUTPUT_GATE, SCREEN_PLACES_SOURCE_GATE, SCREEN_PLACES_FULLTEXT_GATE, LOCATION_PRODUCTION_SOURCE_GATE, LOCATION_PRODUCTION_FULLTEXT_GATE, ARCHIVE_PRESERVATION_SOURCE_GATE, ARCHIVE_PRESERVATION_FULLTEXT_GATE]);');
            fs.writeFileSync(file, source);
          }

          {
            const file = 'tests/film-tv-reception-participation-audience-methods-fulltext-v1.test.mjs';
            let source = fs.readFileSync(file, 'utf8');
            const anchor = "    'location_production_place_ethics_full_chapter_complete_next_unit_source_brief'\n  ].includes(film.nextGate), true);";
            if (!source.includes(anchor)) throw new Error('unit11 fulltext test: later gate assertion anchor missing');
            source = source.replace(anchor, "    'location_production_place_ethics_full_chapter_complete_next_unit_source_brief',\n    'archive_preservation_access_authenticity_source_brief_complete_full_chapter_production',\n    'archive_preservation_access_authenticity_full_chapter_complete_next_unit_source_brief'\n  ].includes(film.nextGate), true);");
            fs.writeFileSync(file, source);
          }
          EOF
          node --check scripts/brief-film-tv-reception-participation-audience-methods-sources-v1.mjs
          node --check scripts/materialize-film-tv-reception-participation-audience-methods-fulltext-v1.mjs
          node --check scripts/audit-film-tv-reception-participation-audience-methods-fulltext-v1.mjs
          node --check tests/film-tv-reception-participation-audience-methods-fulltext-v1.test.mjs

      - name: Set synthetic unit 14 gate
        run: |
          cp data/fagverk/subject_status.json /tmp/subject_status.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const file = 'data/fagverk/subject_status.json';
          const status = JSON.parse(fs.readFileSync(file, 'utf8'));
          const film = status.subjects.find((row) => row.id === 'film_tv');
          if (!film) throw new Error('Film & TV status missing');
          film.nextGate = 'archive_preservation_access_authenticity_source_brief_complete_full_chapter_production';
          fs.writeFileSync(file, `${JSON.stringify(status, null, 2)}\n`);
          EOF

      - name: Validate unit 11 source brief
        run: node scripts/brief-film-tv-reception-participation-audience-methods-sources-v1.mjs

      - name: Validate unit 11 fulltext audit
        run: node scripts/audit-film-tv-reception-participation-audience-methods-fulltext-v1.mjs

      - name: Validate unit 11 source brief tests
        run: node --test tests/film-tv-reception-participation-audience-methods-source-brief-v1.test.mjs

      - name: Validate unit 11 fulltext tests
        run: node --test tests/film-tv-reception-participation-audience-methods-fulltext-v1.test.mjs

      - name: Restore subject status
        if: always()
        run: |
          if [ -f /tmp/subject_status.json ]; then mv /tmp/subject_status.json data/fagverk/subject_status.json; fi

      - name: Commit focused unit 11 repair
        run: |
          rm -f .trigger/unit14-unit11-monotone-repair
          rm -f .github/workflows/temp-film-tv-unit14-unit11-monotone-repair.yml
          git add scripts/brief-film-tv-reception-participation-audience-methods-sources-v1.mjs \
                  scripts/materialize-film-tv-reception-participation-audience-methods-fulltext-v1.mjs \
                  scripts/audit-film-tv-reception-participation-audience-methods-fulltext-v1.mjs \
                  tests/film-tv-reception-participation-audience-methods-fulltext-v1.test.mjs \
                  .trigger/unit14-unit11-monotone-repair \
                  .github/workflows/temp-film-tv-unit14-unit11-monotone-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Allow Film TV unit 11 regression through unit 14"
          git push origin HEAD:agent/film-tv-unit14-archive-preservation-access-authenticity-source-brief
