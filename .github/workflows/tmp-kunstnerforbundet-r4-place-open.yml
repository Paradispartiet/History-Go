name: TEMP Kunstnerforbundet R4 place-open materialization

on:
  push:
    branches:
      - agent/kunstnerforbundet-sprak-r4-20260913

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/kunstnerforbundet-sprak-r4-20260913
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize place-open payloads
        run: npm run place-open:build

      - name: Guard generator scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Generator changed:\n%s\n' "${changed[*]:-<none>}"
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "data/runtime/place-open/kunstnerforbundet.json" ]]; then
            echo "Unexpected place-open generator scope" >&2
            exit 1
          fi

      - name: Commit generated payload and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-kunstnerforbundet-r4-place-open.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/place-open/kunstnerforbundet.json .github/workflows/tmp-kunstnerforbundet-r4-place-open.yml
          git commit -m "Rematerialize Kunstnerforbundet place-open for Språkleksikon"
          git push origin HEAD:agent/kunstnerforbundet-sprak-r4-20260913
