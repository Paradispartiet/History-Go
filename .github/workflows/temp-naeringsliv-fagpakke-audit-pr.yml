name: Temporary Næringsliv fagpakke audit PR

on:
  pull_request:
    paths:
      - '.github/workflows/temp-naeringsliv-fagpakke-audit-pr.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate audit
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='data/fag/naeringsliv';
          const read=n=>JSON.parse(fs.readFileSync(`${p}/${n}`,'utf8'));
          const pensum=read('naeringslivpensum_canonical_v4_5.json');
          const er=read('emner_naeringsliv_canonical_v4_5.json');
          const mr=read('methods_naeringsliv_canonical_v4_5.json');
          const fk=read('fagkart_naeringsliv_canonical_v4_5.json');
          const emner=Array.isArray(er)?er:er.emner||[];
          const methods=Array.isArray(mr)?mr:mr.methods||[];
          const domains=pensum.domains||pensum.modules||[];
          const hooks=(fk.categories||[]).flatMap(c=>(c.topic_hooks||[]).map(h=>({...h,category_id:c.id})));
          const norm=x=>String(x??'').normalize('NFKD').replace(/\p{M}/gu,'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
          const tok=x=>new Set(norm(x).split(/\s+/).filter(w=>w.length>2));
          const jac=(a,b)=>{const A=tok(a),B=tok(b);if(!A.size&&!B.size)return 1;let n=0;for(const x of A)if(B.has(x))n++;return n/new Set([...A,...B]).size};
          const dup=(items,field,id)=>{const m=new Map();for(const x of items){const v=x[field];if(v==null||v===''||(Array.isArray(v)&&!v.length))continue;const k=JSON.stringify(v);if(!m.has(k))m.set(k,[]);m.get(k).push(x[id]||x.id||x.title)}return[...m.entries()].filter(([,v])=>v.length>1).map(([value,ids])=>({count:ids.length,ids,value:JSON.parse(value)})).sort((a,b)=>b.count-a.count)};
          const near=(items,field,id,t=.82)=>{const o=[];for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=items[i][field],b=items[j][field];if(typeof a!=='string'||typeof b!=='string'||!a||!b)continue;const s=jac(a,b);if(s>=t&&norm(a)!==norm(b))o.push({score:+s.toFixed(3),a:items[i][id],b:items[j][id],a_value:a,b_value:b})}return o.sort((a,b)=>b.score-a.score).slice(0,200)};
          const coverage=items=>Object.fromEntries([...new Set(items.flatMap(x=>Object.keys(x)))].sort().map(f=>{const v=items.map(x=>x[f]).filter(x=>x!==undefined&&x!==null&&x!==''&&(!Array.isArray(x)||x.length));return[f,{present:v.length,total:items.length,distinct:new Set(v.map(JSON.stringify)).size}]}));
          const eid=new Set(emner.map(x=>x.emne_id)),mid=new Set(methods.map(x=>x.method_id)),hid=new Set(hooks.map(x=>x.id));
          const phrases=['Hvilken konkret virksomhet, arbeidsplass, kapitalstrøm, marked, teknologi eller infrastruktur gjør emnet relevant?','Hvordan skapes, organiseres, måles, fordeles eller skjules økonomisk verdi her?','Hvilke eiere, arbeidere, kunder, reguleringer, risikoforhold, miljøkostnader eller maktstrukturer blir synlige?','Start fra konkret arbeid, virksomhet, produksjon, kapital, eierskap, marked, teknologi, logistikk, infrastruktur, økonomisk institusjon eller ekstern næringslivsfaglig kilde.'];
          const report={
            counts:{declared_domains:pensum.summary?.domain_count,declared_emner:pensum.summary?.emne_count,declared_methods:pensum.summary?.method_count,actual_domains:domains.length,actual_emner:emner.length,actual_methods:methods.length,actual_hooks:hooks.length},
            domains:Object.fromEntries(domains.map(d=>{const id=d.domain_id||d.module_id,l=d.emne_ids||d.emners||d.emner||[];return[id,{label:d.label||d.title,declared:d.emne_count,listed:l.length,actual:emner.filter(e=>(e.domain||e.area_id)===id).length,ids:l,titles:l.map(x=>emner.find(e=>e.emne_id===x)?.title||null)}]})),
            cross_references:{missing_domain_emnes:domains.flatMap(d=>(d.emne_ids||d.emners||d.emner||[]).filter(x=>!eid.has(x)).map(x=>({domain:d.domain_id||d.module_id,id:x}))),unlisted_emnes:emner.filter(e=>!domains.some(d=>(d.emne_ids||d.emners||d.emner||[]).includes(e.emne_id))).map(e=>e.emne_id),missing_emne_methods:emner.flatMap(e=>[...new Set([...(e.methods||[]),...(e.method_ids||[])])].filter(x=>!mid.has(x)).map(x=>({emne_id:e.emne_id,id:x}))),missing_emne_hooks:emner.flatMap(e=>[...new Set([...(e.primary_theory_hooks||[]),...(e.secondary_theory_hooks||[]),...(e.reserve_theory_hooks||[])])].filter(x=>!hid.has(x)).map(x=>({emne_id:e.emne_id,id:x}))),missing_hook_emnes:hooks.flatMap(h=>(h.emne_ids||[]).filter(x=>!eid.has(x)).map(x=>({hook_id:h.id,id:x}))),missing_hook_methods:hooks.flatMap(h=>(h.recommended_method_ids||[]).filter(x=>!mid.has(x)).map(x=>({hook_id:h.id,id:x})))},
            phrase_counts:Object.fromEntries(phrases.map(q=>[q,emner.filter(e=>JSON.stringify(e).includes(q)).length])),
            alias_duplication:{related:emner.filter(e=>JSON.stringify(e.related_emners??null)===JSON.stringify(e.related_emner??null)).map(e=>e.emne_id),key_core:emner.filter(e=>JSON.stringify(e.key_concepts??null)===JSON.stringify(e.core_concepts??null)).map(e=>e.emne_id),key_sub:emner.filter(e=>JSON.stringify(e.key_concepts??null)===JSON.stringify(e.sub_concepts??null)).map(e=>e.emne_id),places:emner.filter(e=>JSON.stringify(e.good_for_places??null)===JSON.stringify(e.place_type_fit??null)).map(e=>e.emne_id)},
            coverage:{emner:coverage(emner),methods:coverage(methods),hooks:coverage(hooks)},
            exact:{emne_definition:dup(emner,'definition','emne_id'),emne_why:dup(emner,'why_it_matters','emne_id'),emne_questions:dup(emner,'key_questions','emne_id'),emne_conflicts:dup(emner,'conflicts','emne_id'),emne_axes:dup(emner,'analysis_axes','emne_id'),emne_blindspots:dup(emner,'blindspots','emne_id'),emne_generator:dup(emner,'generator_use_note','emne_id'),emne_anti:dup(emner,'anti_patterns','emne_id'),method_definition:dup(methods,'definition','method_id'),method_questions:dup(methods,'questions','method_id'),method_steps:dup(methods,'steps','method_id'),hook_definition:dup(hooks,'definition','id'),hook_questions:dup(hooks,'questions','id')},
            near:{emne_definition:near(emner,'definition','emne_id'),emne_why:near(emner,'why_it_matters','emne_id'),method_definition:near(methods,'definition','method_id'),hook_definition:near(hooks,'definition','id')},
            emner:emner.map(e=>({emne_id:e.emne_id,domain:e.domain,title:e.title,role:e.emne_role,level:e.level,priority:e.quiz_priority,broadness:e.broadness,mapping_count:e.mapping_count,methods:e.method_ids||e.methods||[],hooks:e.primary_theory_hooks||[]})),
            methods:methods.map(m=>({method_id:m.method_id,title:m.title,domain:m.domain||m.area_id})),
            hooks:hooks.map(h=>({id:h.id,title:h.title,category_id:h.category_id,emne_ids:h.emne_ids||[]}))
          };
          fs.writeFileSync('/tmp/naeringsliv-fagpakke-audit.json',JSON.stringify(report,null,2)+'\n');
          console.log(report.counts);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: naeringsliv-fagpakke-audit-pr
          path: /tmp/naeringsliv-fagpakke-audit.json
          if-no-files-found: error
