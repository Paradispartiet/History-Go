name: Tinghuset TS09 runtime materialization
on:
  pull_request:
    paths:
      - 'data/places/politikk/oslo/places_politikk/tinghuset.json'
      - '.github/workflows/tinghuset-ts09-runtime-one-shot.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tinghuset-ts09-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/oslo-ts-09-tinghuset-vferdig-20261111
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate canonical Place-open from source
        run: npm run place-open:build
      - name: Verify generated PlaceCard profile and existing 13 People
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const x=JSON.parse(fs.readFileSync('data/runtime/place-open/tinghuset.json','utf8'));
          assert.deepEqual(x.place.place_card_profile.collection_ids,['people','objects','brands']);
          assert.equal(x.people.length,13);
          assert.equal(x.brands.length,1);
          assert.equal(x.place.production_profile,'standard');
          console.log('Tinghuset generated PlaceCard profile and 13 People PASS');
          NODE
      - name: Commit only Tinghuset derived payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/place-open/tinghuset.json
          if ! git diff --cached --quiet; then
            git commit -m "build(tinghuset): sync canonical PlaceCard profile into runtime"
            git fetch origin content/oslo-ts-09-tinghuset-vferdig-20261111
            git rebase origin/content/oslo-ts-09-tinghuset-vferdig-20261111
            git push origin HEAD:content/oslo-ts-09-tinghuset-vferdig-20261111
          fi
