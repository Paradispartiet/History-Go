name: Etne People of Places batch 4 integration

on:
  pull_request:
    paths:
      - 'data/people/media/vestland/etne/**'
      - 'reports/etne-people-of-places-batch-4-research.md'
      - '.github/workflows/etne-people-batch-4-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.number == 2275
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-people-batch-4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          mkdir -p reports/etne-people-of-places-batch-4-integration
          npm install --no-audit --no-fund 2>&1 | tee reports/etne-people-of-places-batch-4-integration/npm-install.txt
      - name: Register source exactly once
        run: |
          node --input-type=module <<'NODE' | tee reports/etne-people-of-places-batch-4-integration/manifest-update.txt
          import fs from 'node:fs';
          const p='data/people/manifest.json';
          const addition='people/media/vestland/etne/ann_margit_gronstad.json';
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          m.files=m.files.filter((v)=>v!==addition); m.files.push(addition);
          if(m.files.filter((v)=>v===addition).length!==1) throw new Error('manifest registration failed');
          fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');
          console.log(`PASS ${addition}`);
          NODE
      - name: Run people checks
        run: bash scripts/check-people.sh 2>&1 | tee reports/etne-people-of-places-batch-4-integration/check-people.txt
      - name: Run People of Places audit
        run: npm run audit:people-of-places 2>&1 | tee reports/etne-people-of-places-batch-4-integration/people-of-places-audit.txt
      - name: Validate target
        run: |
          node --input-type=module <<'NODE' | tee reports/etne-people-of-places-batch-4-integration/targeted-validation.json
          import fs from 'node:fs'; import path from 'node:path';
          const manifest=JSON.parse(fs.readFileSync('data/people/manifest.json','utf8'));
          const all=[];
          for(const rel of manifest.files){const doc=JSON.parse(fs.readFileSync(path.join('data',rel),'utf8'));const rows=Array.isArray(doc)?doc:Array.isArray(doc?.people)?doc.people:[];for(const person of rows)all.push(person);}
          const counts=new Map();for(const p of all)if(p?.id)counts.set(p.id,(counts.get(p.id)||0)+1);
          const dup=[...counts.entries()].filter(([,c])=>c>1);if(dup.length)throw new Error(`duplicates ${JSON.stringify(dup)}`);
          const rows=all.filter((p)=>p?.id==='ann_margit_gronstad');if(rows.length!==1)throw new Error(`Ann rows ${rows.length}`);
          const person=rows[0];if(person.placeId!=='grannar_redaksjon_etne'||(person.places||[]).filter((id)=>id==='grannar_redaksjon_etne').length!==1)throw new Error('Grannar link mismatch');
          const places=new Set(JSON.parse(fs.readFileSync('data/places/places_index.json','utf8')).map((p)=>p.id));if(!places.has('grannar_redaksjon_etne'))throw new Error('target place inactive');
          console.log(JSON.stringify({status:'PASS',canonicalRows:1,placeId:person.placeId,duplicatePeopleIds:0},null,2));
          NODE
      - name: Diff check
        run: git diff --check | tee reports/etne-people-of-places-batch-4-integration/git-diff-check.txt
      - name: Remove workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/etne-people-batch-4-integration.yml
          git add data/people/manifest.json reports/etne-people-of-places-batch-4-integration
          git diff --cached --check
          git commit -m "Integrate Etne People of Places batch 4"
          git push origin HEAD:agent/etne-people-batch-4
