name: Fagverk IA v3 Litteratur redirect regenerate probe

on:
  pull_request:
    paths:
      - '.github/workflows/fagverk-ia-v3-litteratur-redirect-regenerate-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fagverk-ia-v3-litteratur-redirect-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate deterministic Litteratur redirect reports
        run: |
          node scripts/audit-fagverk-litteratur-legacy-theory.mjs --write-report
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/audit-fagverk-litteratur-legacy-theory.mjs
          node scripts/audit-fagverk-litteratur-legacy-adjudication.mjs
          node scripts/audit-fagverk-badge-equivalence.mjs
          node --test tests/fagverk-litteratur-legacy-theory-audit.test.mjs
          node --test tests/fagverk-litteratur-legacy-theory-adjudication.test.mjs
          node --test tests/fagverk-badge-equivalence.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
      - name: Commit generated reports and remove probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fagverk-ia-v3-litteratur-redirect-regenerate-probe.yml
          git add reports/fagverk/litteratur-legacy-theory-audit.json reports/fagverk/general-engine-audit.json
          if git diff --cached --quiet; then
            echo 'No generated report changes to commit.'
            exit 1
          fi
          git commit -m 'Regenerate Fagverk reports after Litteratur redirect'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
