name: Build corrected Etne religion and skate culture batch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/etne-religion-subculture-fresh-v2.yml

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/etne-religion-subculture-fresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-religion-subculture-fresh
          fetch-depth: 0

      - name: Reset onto fresh main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical Etne batch
        shell: bash
        run: |
          mkdir -p reports/etne-religion-subculture-batch/geonorge \
                   reports/etne-religion-subculture-batch/osm \
                   reports/etne-religion-subculture-batch/validation

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const verifiedAt = '2026-07-23';
          const repoRoot = process.cwd();
          const manifestPath = path.join(repoRoot, 'data/places/manifest.json');
          const indexPath = path.join(repoRoot, 'data/places/places_index.json');

          const writeJson = (file, value) => {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n');
          };

          const haversineM = (aLat, aLon, bLat, bLon) => {
            const R = 6371000;
            const rad = (x) => x * Math.PI / 180;
            const dLat = rad(bLat - aLat);
            const dLon = rad(bLon - aLon);
            const q = Math.sin(dLat / 2) ** 2 + Math.cos(rad(aLat)) * Math.cos(rad(bLat)) * Math.sin(dLon / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(q));
          };

          function polygonCentroid(points) {
            if (points.length < 3) throw new Error('polygonCentroid: too few points');
            const pts = [...points];
            const first = pts[0];
            const last = pts[pts.length - 1];
            if (first.lat !== last.lat || first.lon !== last.lon) pts.push(first);
            let area2 = 0;
            let cx = 0;
            let cy = 0;
            for (let i = 0; i < pts.length - 1; i++) {
              const x0 = pts[i].lon;
              const y0 = pts[i].lat;
              const x1 = pts[i + 1].lon;
              const y1 = pts[i + 1].lat;
              const cross = x0 * y1 - x1 * y0;
              area2 += cross;
              cx += (x0 + x1) * cross;
              cy += (y0 + y1) * cross;
            }
            if (Math.abs(area2) < 1e-12) {
              return {
                lat: points.reduce((sum, p) => sum + p.lat, 0) / points.length,
                lon: points.reduce((sum, p) => sum + p.lon, 0) / points.length
              };
            }
            return { lat: cy / (3 * area2), lon: cx / (3 * area2) };
          }

          async function geonorgeAddress({ key, street, number, postcode, city, expected }) {
            const url = new URL('https://ws.geonorge.no/adresser/v1/sok');
            url.searchParams.set('adressenavn', street);
            url.searchParams.set('nummer', String(number));
            url.searchParams.set('kommunenummer', '4611');
            url.searchParams.set('treffPerSide', '100');

            const response = await fetch(url, { headers: { 'user-agent': 'History-Go/Etne-religion-subculture-batch' } });
            if (!response.ok) throw new Error(`Geonorge ${response.status}: ${street} ${number}`);
            const payload = await response.json();
            writeJson(`reports/etne-religion-subculture-batch/geonorge/${key}.json`, { url: url.toString(), response: payload });

            const hits = Array.isArray(payload.adresser) ? payload.adresser : [];
            const exact = hits.filter((hit) =>
              String(hit.adressenavn || '').toLowerCase() === street.toLowerCase() &&
              String(hit.nummer) === String(number) &&
              String(hit.kommunenummer) === '4611'
            );
            if (exact.length !== 1) throw new Error(`${key}: expected exactly one exact Geonorge hit, got ${exact.length}`);
            const hit = exact[0];
            if (postcode && String(hit.postnummer) !== String(postcode)) throw new Error(`${key}: unexpected postcode ${hit.postnummer}`);
            const lat = Number(hit.representasjonspunkt?.lat);
            const lon = Number(hit.representasjonspunkt?.lon);
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) throw new Error(`${key}: missing coordinates`);
            if (expected) {
              const distance = haversineM(lat, lon, expected.lat, expected.lon);
              if (distance > expected.maxM) throw new Error(`${key}: address point is ${distance.toFixed(1)} m from independent church coordinate`);
            }
            return {
              lat,
              lon,
              id: `geonorge-adresser-v1:${hit.kommunenummer}:${hit.adressekode}:${hit.nummer}`,
              url: url.toString(),
              verified: hit.stedfestingverifisert === true,
              address: { street, number: String(number), postcode: String(hit.postnummer || postcode), city, country: 'NO' }
            };
          }

          async function osmWayGeometry({ id, key, requiredTags, expected, expectedNameFragment }) {
            const url = `https://api.openstreetmap.org/api/0.6/way/${id}/full.json`;
            const response = await fetch(url, { headers: { 'user-agent': 'History-Go/Etne-religion-subculture-batch' } });
            if (!response.ok) throw new Error(`${key}: OSM API ${response.status}`);
            const payload = await response.json();
            writeJson(`reports/etne-religion-subculture-batch/osm/${key}.json`, { url, response: payload });

            const elements = Array.isArray(payload.elements) ? payload.elements : [];
            const way = elements.find((element) => element.type === 'way' && Number(element.id) === Number(id));
            if (!way) throw new Error(`${key}: OSM way ${id} missing`);
            for (const [tag, value] of Object.entries(requiredTags || {})) {
              if (way.tags?.[tag] !== value) throw new Error(`${key}: expected ${tag}=${value}, got ${way.tags?.[tag]}`);
            }
            if (expectedNameFragment) {
              const name = String(way.tags?.name || '').toLowerCase();
              if (!name.includes(expectedNameFragment.toLowerCase())) throw new Error(`${key}: unexpected OSM name ${way.tags?.name || '(missing)'}`);
            }

            const nodeMap = new Map(
              elements
                .filter((element) => element.type === 'node' && Number.isFinite(Number(element.lat)) && Number.isFinite(Number(element.lon)))
                .map((node) => [Number(node.id), { lat: Number(node.lat), lon: Number(node.lon) }])
            );
            const points = (way.nodes || []).map((nodeId) => nodeMap.get(Number(nodeId))).filter(Boolean);
            if (points.length < 3) throw new Error(`${key}: insufficient OSM geometry nodes`);
            const center = polygonCentroid(points);
            if (expected) {
              const distance = haversineM(center.lat, center.lon, expected.lat, expected.lon);
              if (distance > expected.maxM) throw new Error(`${key}: geometry centroid is ${distance.toFixed(1)} m from independent reference`);
            }
            return { ...center, id: `osm-way:${id}`, url };
          }

          function religionPlace({ id, name, lat, lon, year, period, desc, popupDesc, coord, tags, links, quiz }) {
            return {
              places: [{
                id, name, lat, lon, r: 180,
                category: 'religion',
                fylke: 'vestland', kommune: 'Etne', year,
                period,
                tags: ['religion', ...tags],
                desc,
                popupDesc,
                emne_ids: [
                  'em_religion_hellige_rom',
                  'em_religion_ritualer_praksis',
                  'em_religion_religionshistorie_lokalt',
                  'em_religion_kristendom'
                ],
                ...coord,
                externalLinks: links,
                quiz_profile: quiz
              }]
            };
          }

          function addSubcultureLayer(file, variant) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const records = Array.isArray(data) ? data : data.places;
            if (!Array.isArray(records) || records.length !== 1) throw new Error(`${file}: expected one place`);
            const place = records[0];
            place.secondaryBadgeIds = Array.from(new Set([...(place.secondaryBadgeIds || []), 'subkultur']));
            place.tags = Array.from(new Set([...(place.tags || []), 'subkultur', 'skatekultur', 'scene_og_fellesskap']));
            place.emne_ids = Array.from(new Set([
              ...(place.emne_ids || []),
              'em_sub_ungdomskultur_identitet',
              'em_sub_tilhorighet_miljo',
              'em_sub_scene_fellesskap'
            ]));
            const paragraph = variant === 'bmx'
              ? ' I History Go er Sport framleis hovudkategorien fordi dette fysisk er eit BMX- og skateanlegg. Samstundes får staden eit sekundært Subkultur-lag: kombinasjonen av ei eiga BMX-/skateforeining, eigenorganisert bruk, ungdomskultur og eit sjølvstendig lokalt miljø gjer arenaen til meir enn berre generell treningsinfrastruktur.'
              : ' I History Go er Sport framleis hovudkategorien fordi dette fysisk er eit skateanlegg. Samstundes får parken eit sekundært Subkultur-lag fordi han er bygd spesifikt rundt skating, street-element og eigenorganisert skatepraksis. Laget gjeld skatekulturen og miljøet rundt bruken av parken, ikkje ein påstand om at alle brukarar står utanfor storsamfunnet.';
            if (!String(place.popupDesc || '').includes('sekundært Subkultur-lag')) place.popupDesc = String(place.popupDesc || '') + paragraph;
            const qp = place.quiz_profile || {};
            qp.primary_angles = Array.from(new Set([...(qp.primary_angles || []), 'skatekultur', 'scene_og_fellesskap']));
            qp.must_include = Array.from(new Set([...(qp.must_include || []), 'at Sport er hovudkategori og Subkultur eit dokumentert sekundært lag']));
            qp.avoid_angles = Array.from(new Set([...(qp.avoid_angles || []), 'a_kalle_all_bruk_eller_alle_brukarar_subkultur']));
            qp.notes = `${qp.notes ? qp.notes + ' ' : ''}Subkultur-laget skal knytast til skate/BMX som eigenorganisert scene, praksis og fellesskap, ikkje til ulovlegheit eller ein påstand om at alle brukarar er marginaliserte.`;
            place.quiz_profile = qp;
            writeJson(file, data);
          }

          async function main() {
            const existingIndex = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
            const newIds = ['etne_kyrkje', 'skanevik_kyrkje', 'frette_kapell'];
            const duplicates = newIds.filter((id) => existingIndex.some((place) => place?.id === id));
            if (duplicates.length) throw new Error(`Refusing duplicate place IDs: ${duplicates.join(', ')}`);

            const etne = await geonorgeAddress({
              key: 'etne_kyrkje', street: 'Enge', number: 5, postcode: '5590', city: 'Etne',
              expected: { lat: 59.6696388889, lon: 5.9444611111, maxM: 250 }
            });
            const skanevik = await geonorgeAddress({
              key: 'skanevik_kyrkje', street: 'Prestavegen', number: 11, postcode: '5593', city: 'Skånevik',
              expected: { lat: 59.7318305556, lon: 5.9394833333, maxM: 250 }
            });
            const frette = await osmWayGeometry({
              id: 557505490,
              key: 'frette_kapell',
              requiredTags: { amenity: 'place_of_worship', building: 'chapel' },
              expectedNameFragment: 'Frette',
              expected: { lat: 59.7261, lon: 6.16205, maxM: 120 }
            });

            const addressCoord = (result, note) => ({
              locatorType: 'building', sourceProvider: 'official_address', sourceObjectId: result.id,
              address: result.address, geocodeAccuracy: 'rooftop', coordRole: 'display_marker',
              coordType: 'address_point', coordStatus: 'verified', coordSource: 'geonorge_adresser_v1',
              coordSourceId: result.id, coordSourceUrl: result.url, coordVerifiedAt: verifiedAt, coordNote: note
            });

            const files = [
              {
                file: 'data/places/religion/vestland/etne/etne_kyrkje.json',
                doc: religionPlace({
                  id: 'etne_kyrkje', name: 'Etne kyrkje', lat: etne.lat, lon: etne.lon, year: 2013,
                  period: 'Moderne soknekyrkje frå 2013',
                  desc: 'Etne kyrkje er den moderne soknekyrkja i Etne sentrum, teken i bruk i 2013 og i aktiv bruk til gudstenester, trusopplæring og kyrkjelydsarbeid.',
                  popupDesc: 'Etne kyrkje vart teken i bruk i 2013 og er eit aktivt religiøst samlingspunkt i Etne. Kyrkja blir brukt til gudstenester, konfirmantarbeid, babysong, KRIK og anna kyrkjelydsarbeid. I History Go er dette først og fremst eit levande trossted, medan den nyare bygningshistoria er eit sekundært lag.',
                  coord: addressCoord(etne, 'Address-first: Enge 5 er løyst som eitt eksakt Geonorge-adressepunkt og krysskontrollert mot ein uavhengig kyrkjeposisjon for Etne kyrkje. Markøren representerer den aktive kyrkja, ikkje eit generelt sentrumspunkt.'),
                  tags: ['kristendom', 'kirke', 'etne', 'soknekyrkje', 'trusliv', '2013'],
                  links: [
                    { type: 'official', label: 'Etne kyrkjelege fellesråd – Kyrkjene våre', url: 'https://www.etne.kyrkja.no/Kyrkjene-v%C3%A5re', lang: 'nn', verifiedAt },
                    { type: 'official', label: 'Etne kyrkjelege fellesråd – aktivitetar for born og unge', url: 'https://www.etne.kyrkja.no/Born-og-unge', lang: 'nn', verifiedAt }
                  ],
                  quiz: {
                    place_type: 'kirke', subtype: 'moderne_aktiv_soknekyrkje_fra_2013',
                    signature_features: ['teken i bruk i 2013', 'aktiv soknekyrkje i Etne', 'arena for gudstenester og trusopplæring'],
                    primary_angles: ['trosliv', 'kristendom', 'ritualer', 'lokalsamfunn'],
                    question_families: ['kirkesteder', 'moderne_kirkebygg', 'etne', 'trosliv'],
                    avoid_angles: ['framstille_som_historisk_middelalderkirke'],
                    must_include: ['året 2013', 'den aktive kyrkjelydsfunksjonen'],
                    contrast_targets: ['gjerde_kyrkje_etne', 'stodle_kyrkje']
                  }
                })
              },
              {
                file: 'data/places/religion/vestland/etne/skanevik_kyrkje.json',
                doc: religionPlace({
                  id: 'skanevik_kyrkje', name: 'Skånevik kyrkje', lat: skanevik.lat, lon: skanevik.lon, year: 1900,
                  period: 'Aktiv soknekyrkje frå 1900',
                  desc: 'Dagens Skånevik kyrkje vart vigsla i 1900 og er den aktive soknekyrkja i bygda, fysisk skild frå det eldre historiske kyrkjestadsankeret.',
                  popupDesc: 'Skånevik kyrkje er dagens aktive kyrkjebygg i bygda og vart vigsla i 1900. Ho står nord for den eldre kyrkjestaden der tidlegare kyrkjer stod. History Go skil derfor mellom dagens levande trossted og den eldre kyrkjestaden som eit eige fysisk og historisk lag.',
                  coord: addressCoord(skanevik, 'Address-first: Prestavegen 11 er løyst som eitt eksakt Geonorge-adressepunkt og krysskontrollert mot ein uavhengig kyrkjeposisjon. Markøren er medvite skild frå det eldre skanevik_kyrkjestad-ankeret.'),
                  tags: ['kristendom', 'kirke', 'skanevik', 'soknekyrkje', 'trusliv', '1900'],
                  links: [
                    { type: 'official', label: 'Etne kyrkjelege fellesråd – Kyrkjene våre', url: 'https://www.etne.kyrkja.no/Kyrkjene-v%C3%A5re', lang: 'nn', verifiedAt },
                    { type: 'reference', label: 'Norges Kirker – Skånevik kyrkje', url: 'https://norgeskirker.no/wiki/Sk%C3%A5nevik_kyrkje', lang: 'nn', verifiedAt }
                  ],
                  quiz: {
                    place_type: 'kirke', subtype: 'aktiv_soknekyrkje_fra_1900',
                    signature_features: ['vigsla i 1900', 'dagens aktive kyrkje i Skånevik', 'fysisk skild frå den eldre kyrkjestaden'],
                    primary_angles: ['trosliv', 'kristendom', 'ritualer', 'stadskontinuitet'],
                    question_families: ['kirkesteder', 'skanevik', '1900_tallet', 'trosliv'],
                    avoid_angles: ['blande_med_skanevik_kyrkjestad', 'framstille_dagens_bygg_som_middelalderkirke'],
                    must_include: ['at dette er dagens kyrkje frå 1900', 'skiljet frå den eldre kyrkjestaden'],
                    contrast_targets: ['skanevik_kyrkjestad', 'fjaera_kapell']
                  }
                })
              },
              {
                file: 'data/places/religion/vestland/etne/frette_kapell.json',
                doc: religionPlace({
                  id: 'frette_kapell', name: 'Frette kapell', lat: frette.lat, lon: frette.lon, year: 1959,
                  period: 'Bedehus frå 1910, vigsla som kapell i 1959',
                  desc: 'Frette kapell ved enden av Stordalsvatnet vart oppført som bedehuset Betania i 1910 og ombygd og vigsla til kyrkjeleg bruk i 1959.',
                  popupDesc: 'Bygningen på Frette vart reist som bedehuset Betania i 1910. I 1959 vart han bygd grundig om til kyrkjeleg bruk med den eldre stova som kjerne, og kapellet vart vigsla 13. desember same år. Staden viser ei konkret overgang frå lokal bedehustradisjon til fast kapellfunksjon.',
                  coord: {
                    locatorType: 'building', sourceProvider: 'osm', sourceObjectId: frette.id,
                    geocodeAccuracy: 'building', coordRole: 'building_center', coordType: 'building_center',
                    coordStatus: 'verified_geometry', coordSource: 'OpenStreetMap building geometry + Norges Kirker',
                    coordSourceId: frette.id, coordSourceUrl: frette.url, coordVerifiedAt: verifiedAt,
                    coordNote: 'Object-first: OSM way 557505490 er henta direkte frå OSM API og verifisert fresh som namngitt place_of_worship med building=chapel. Polygoncentroid frå sjølve bygningsgeometrien brukes som canonical marker og er krysskontrollert mot uavhengig referanse for Frette kapell.'
                  },
                  tags: ['kristendom', 'kapell', 'bedehus', 'frette', 'stordalsvatnet', '1910', '1959'],
                  links: [
                    { type: 'reference', label: 'Norges Kirker – Frette kapell', url: 'https://norgeskirker.no/wiki/Frette_kapell', lang: 'nn', verifiedAt },
                    { type: 'official', label: 'Etne kyrkjelege fellesråd – Kyrkjene våre', url: 'https://www.etne.kyrkja.no/Kyrkjene-v%C3%A5re', lang: 'nn', verifiedAt }
                  ],
                  quiz: {
                    place_type: 'kapell', subtype: 'bedehus_ombygd_til_kapell_i_1959',
                    signature_features: ['Betania bedehus frå 1910', 'ombygd og vigsla som kapell i 1959', 'ligg ved enden av Stordalsvatnet'],
                    primary_angles: ['trosliv', 'bedehustradisjon', 'kristendom', 'lokalsamfunn'],
                    question_families: ['kapeller', 'bedehus', 'frette', '1950_tallet'],
                    avoid_angles: ['hevde_at_bygningen_var_kapell_fra_1910'],
                    must_include: ['skiljet mellom bedehuset frå 1910 og kapellfunksjonen frå 1959'],
                    contrast_targets: ['fjaera_kapell', 'grindheim_kyrkje_etne']
                  }
                })
              }
            ];

            for (const entry of files) writeJson(entry.file, entry.doc);

            addSubcultureLayer('data/places/sport/vestland/etne/etne_bmx_og_skatepark.json', 'bmx');
            addSubcultureLayer('data/places/sport/vestland/etne/skanevik_skatepark.json', 'skate');

            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            for (const entry of files) {
              const rel = entry.file.replace(/^data\//, '');
              if (!manifest.files.includes(rel)) manifest.files.push(rel);
            }
            writeJson(manifestPath, manifest);

            fs.writeFileSync('reports/etne-religion-subculture-batch/README.md', `# Etne Religion og skatekultur\n\nDato: ${verifiedAt}\n\n## Nye Religion-steder\n\n- Etne kyrkje\n- Skånevik kyrkje\n- Frette kapell\n\n## Utsett stad\n\n- Skånevik bedehus er ikkje oppretta enno. Kommunen oppgir Tjedlavegen 38, medan Brønnøysund registrerer organisasjonen c/o Kristoffer Tjelle på Tjellevegen 38. Dette er ikkje tilstrekkeleg bevis for den fysiske bedehusbygningen, så ingen kartmarkør blir gjetta.\n\n## Subkultur-vurdering\n\n- Etne BMX- og skatepark: Sport som primærkategori, sekundært Subkultur-lag. Eiga BMX-/skateforeining, eigenorganisert aktivitet og ungdomskultur er dokumentert i den eksisterande recorden.\n- Skånevik skatepark: Sport som primærkategori, sekundært Subkultur-lag. Den permanente streetprega skateparken representerer spesifikk skatepraksis og scene, ikkje berre eit generisk idrettsanlegg.\n- Etne pumptrack: framleis berre Sport. Fleirbruks hjulaktivitet og lågterskeltilbod er dokumentert, men kjeldegrunnlaget etablerer ikkje eit like tydeleg sjølvstendig skate-/subkulturmiljø.\n\nIngen duplikatmarkør er oppretta for eksisterande kyrkjer eller kulturarenaer.\n`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Rebuild canonical place index
        run: npm run places:index:build

      - name: Run blocking place checks
        shell: bash
        run: |
          set -o pipefail
          npm run audit:places-split-manifest-sync 2>&1 | tee reports/etne-religion-subculture-batch/validation/split-manifest-sync.txt
          npm run places:index:check 2>&1 | tee reports/etne-religion-subculture-batch/validation/places-index-check.txt
          npm run places:emner:check 2>&1 | tee reports/etne-religion-subculture-batch/validation/emne-check.txt
          npm run places:coords:intake 2>&1 | tee reports/etne-religion-subculture-batch/validation/coordinate-intake.txt

      - name: Capture nonblocking place health
        shell: bash
        run: |
          set +e
          npm run health:places 2>&1 | tee reports/etne-religion-subculture-batch/validation/health-places.txt
          exit 0

      - name: Commit clean generated result
        shell: bash
        env:
          BRANCH: agent/etne-religion-subculture-fresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Etne religion places and skate culture layers"
          git push --force-with-lease origin HEAD:$BRANCH
