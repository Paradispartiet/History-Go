name: One-time materialize business-school extension

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/one-time-materialize-handelshogskole.yml'
      - '.tmp/handelshogskole/**'
      - 'tools/validate-okonomi-naeringsliv-handelshogskole.mjs'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/okonomi-naeringsliv-handelshogskole-stage
          fetch-depth: 0

      - name: Generate and validate business-school extension
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p .tmp/handelshogskole

          python .tmp/handelshogskole/generate.py > .tmp/handelshogskole/generation.log 2>&1
          generation_status=$?

          framework_status=99
          quality_status=99
          individual_status=99
          professional_status=99
          governance_status=99

          if [ "$generation_status" -eq 0 ]; then
            node tools/validate-okonomi-naeringsliv-universitetsramme.mjs > .tmp/handelshogskole/framework-validation.log 2>&1
            framework_status=$?
            node tools/validate-okonomi-naeringsliv-universitetskvalitet.mjs > .tmp/handelshogskole/quality-validation.log 2>&1
            quality_status=$?
            node tools/validate-okonomi-naeringsliv-emnerevisjon.mjs > .tmp/handelshogskole/individual-validation.log 2>&1
            individual_status=$?
            node tools/validate-okonomi-naeringsliv-handelshogskole.mjs > .tmp/handelshogskole/professional-validation.log 2>&1
            professional_status=$?
            node scripts/audit-category-governance.mjs > .tmp/handelshogskole/governance-validation.log 2>&1
            governance_status=$?
          else
            echo 'Framework validation not run because generation failed.' > .tmp/handelshogskole/framework-validation.log
            echo 'Quality validation not run because generation failed.' > .tmp/handelshogskole/quality-validation.log
            echo 'Individual validation not run because generation failed.' > .tmp/handelshogskole/individual-validation.log
            echo 'Professional validation not run because generation failed.' > .tmp/handelshogskole/professional-validation.log
            echo 'Governance validation not run because generation failed.' > .tmp/handelshogskole/governance-validation.log
          fi

          {
            echo "generation_status=$generation_status"
            echo "framework_status=$framework_status"
            echo "quality_status=$quality_status"
            echo "individual_status=$individual_status"
            echo "professional_status=$professional_status"
            echo "governance_status=$governance_status"
          } > .tmp/handelshogskole/status.txt

          cat .tmp/handelshogskole/status.txt
          cat .tmp/handelshogskole/generation.log
          cat .tmp/handelshogskole/framework-validation.log
          cat .tmp/handelshogskole/quality-validation.log
          cat .tmp/handelshogskole/individual-validation.log
          cat .tmp/handelshogskole/professional-validation.log
          cat .tmp/handelshogskole/governance-validation.log
          exit 0

      - name: Commit generated outputs and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          for file in \
            data/fag/naeringsliv/handelshogskoleramme_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/handelshogskolespor_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/handelshogskolemoduler_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/handelshogskoleteori_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/handelshogskolemetoder_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/handelshogskolemodeller_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/handelshogskolemal_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/handelshogskolekilder_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/handelshogskolevurdering_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/universitetsramme_okonomi_og_naeringsliv_v1.json \
            data/fag/naeringsliv/universitetskvalitet_okonomi_og_naeringsliv_v2.json \
            data/fag/naeringsliv/supersetQUIZMAL_naeringsliv.json \
            data/fag/fag_manifest.json \
            scripts/audit-category-governance.mjs \
            tools/validate-okonomi-naeringsliv-handelshogskole.mjs \
            .tmp/handelshogskole/generation.log \
            .tmp/handelshogskole/framework-validation.log \
            .tmp/handelshogskole/quality-validation.log \
            .tmp/handelshogskole/individual-validation.log \
            .tmp/handelshogskole/professional-validation.log \
            .tmp/handelshogskole/governance-validation.log \
            .tmp/handelshogskole/status.txt; do
            if [ -f "$file" ]; then git add "$file"; fi
          done

          git diff --cached --quiet && exit 0
          git commit -m 'TEMP: materialiser handelshøyskolelaget'
          git push origin HEAD:agent/okonomi-naeringsliv-handelshogskole-stage
