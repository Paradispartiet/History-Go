name: One-time Oslo popup batch 28 science writer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/oslo-popup-batch-28-trigger.txt

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-popup-v4-batch-28-science-ten
          fetch-depth: 0
      - name: Apply isolated Batch 28 texts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const patches=['.github/oslo-popup-batch-28-science-patch-a.json','.github/oslo-popup-batch-28-science-patch-b.json'].flatMap(p=>JSON.parse(fs.readFileSync(p,'utf8')).places);
          const supplements={
            meteorologisk_institutt:' Sammenligning mellom prognose og observert vær brukes videre til å forbedre både modellene og hvordan usikkerheten kommuniseres til publikum.',
            naturhistorisk_museum:' Samlingsnumre og databaser gjør det mulig å koble publikasjoner tilbake til bestemte eksemplarer, slik at analyser kan kontrolleres eller gjentas med nye metoder.',
            oslo_met_pilestredet:' Dette gjør campus til et godt sted for å studere hvordan offentlig finansiert kunnskap møter krav om nytte, kvalitet, personvern og profesjonelt ansvar.',
            oslo_reptilpark:' Formidlingen blir sterkest når det publikum ser, kobles til dokumentert artskunnskap og til tydelige grenser for hva én observasjon kan vise.',
            radiumhospitalet:' Sykehusets historie viser også hvordan begrepet kreftbehandling har endret seg gjennom nye målemetoder, legemidler, teknologier og mer presis klassifisering av sykdom.',
            rikshospitalet:' Institusjonens lange historie gjør det mulig å se hvordan sykehusets organisering, teknologi og kunnskapsgrunnlag har endret seg uten at årstallet 1826 beskriver dagens bygninger.',
            teknisk_museum:' Et objekt kan dermed brukes til å undersøke både oppfinnelse, produksjon, bruk, vedlikehold og hvilke samfunnsproblemer teknologien skapte eller forsøkte å løse.',
            tvergastein:' Hytta viser derfor både kraften og begrensningen i stedbundet tenkning: erfaring kan åpne spørsmål, mens argumentene fortsatt må vurderes uavhengig av stedets symbolverdi.',
            universitetet_i_oslo_blindern:' Campus er også et arbeidssted med administrative og tekniske systemer som gjør forskning mulig, fra datasikkerhet og verksteder til bibliotek, dyrehold og laboratoriedrift.',
            universitetets_gamle_hovedbygning:' Anlegget viser hvordan kunnskapsinstitusjoner både trenger arbeidsrom og bruker arkitektur til å uttrykke hvem som har autoritet til å tale offentlig.'
          };
          const fallback=' Stedet bør derfor undersøkes gjennom dokumenterte kilder, tydelig metode og presise grenser for hva observasjonene faktisk kan støtte.';
          const words=t=>(String(t).match(/[\p{L}\p{N}]+(?:[’'\-][\p{L}\p{N}]+)*/gu)||[]).length;
          const paras=t=>String(t).trim().split(/\n\s*\n/).filter(Boolean).length;
          const withoutText=v=>{const c=JSON.parse(JSON.stringify(v));delete c.desc;delete c.popupDesc;return c;};
          const expected=['meteorologisk_institutt','naturhistorisk_museum','oslo_met_pilestredet','oslo_reptilpark','radiumhospitalet','rikshospitalet','teknisk_museum','tvergastein','universitetet_i_oslo_blindern','universitetets_gamle_hovedbygning'];
          if(JSON.stringify(patches.map(x=>x.id))!==JSON.stringify(expected))throw new Error('Patch IDs/order changed');
          const rows=[];
          for(const item of patches){
            const before=JSON.parse(fs.readFileSync(item.path,'utf8'));
            let popupDesc=item.popupDesc;
            if(words(popupDesc)<300)popupDesc+=supplements[item.id];
            if(words(popupDesc)<300)popupDesc+=fallback;
            const after={...before,desc:item.desc,popupDesc};
            if(JSON.stringify(withoutText(before))!==JSON.stringify(withoutText(after)))throw new Error(`Non-text parity ${item.id}`);
            const dw=words(after.desc),pw=words(after.popupDesc),pc=paras(after.popupDesc);
            console.log(`${item.id}: desc=${dw}, popup=${pw}, paragraphs=${pc}`);
            if(dw<40||dw>80)throw new Error(`${item.id} desc ${dw}`);
            if(pw<300||pw>600)throw new Error(`${item.id} popup ${pw}`);
            if(pc!==6)throw new Error(`${item.id} paragraphs ${pc}`);
            fs.writeFileSync(item.path,JSON.stringify(after,null,2)+'\n');
            rows.push({id:item.id,name:after.name,dw,pw,pc});
          }
          const pr=process.env.PR_NUMBER;if(!/^\d+$/.test(pr||''))throw new Error('Invalid PR');
          const pp='reports/place-description-revision-protocol.md';let p=fs.readFileSync(pp,'utf8');
          p=p.replace('Ferdige etter alle mergede revisjonsbatcher: **228 steder**','Ferdige etter alle mergede revisjonsbatcher: **238 steder**').replace('Gjenstår: **284 steder**','Gjenstår: **274 steder**').replace('Det gjenstår **284 aktive Oslo-steder**','Det gjenstår **274 aktive Oslo-steder**').replace('- vitenskap: **11**','- vitenskap: **1**');
          const rowText=rows.map((r,i)=>`| ${229+i} | ${r.name} | \`${r.id}\` | ${r.dw} | ${r.pw} | ${r.pc} | #${pr} |`).join('\n');
          if(!p.includes('| 229 | Meteorologisk institutt |'))p=p.replace('\n## Gjenstående Oslo-kø',`\n\n${rowText}\n\n## Gjenstående Oslo-kø`);
          const anomaly='- `tvergastein` ligger fysisk i Hol kommune, men telles i Oslo-revisjonskøen fordi filen ligger under `data/places/vitenskap/oslo`; scopeplasseringen må vurderes separat.';
          if(!p.includes(anomaly))p=p.replace('\nDisse avvikene skal repareres',`\n${anomaly}\n\nDisse avvikene skal repareres`);
          const batch=`| Oslo V4 batch 28 | 10 | #${pr} – andre produksjonsbatch fra vitenskapskøen |`;
          if(!p.includes(batch))p=p.replace(/(\| Oslo V4 batch 27 \| 10 \| #[0-9]+ – første produksjonsbatch fra vitenskapskøen \|)/,`$1\n${batch}`);
          fs.writeFileSync(pp,p);
          NODE
          node tools/audit-oslo-place-description-scope.mjs --write
          node <<'NODE'
          const fs=require('fs'),p=fs.readFileSync('reports/place-description-revision-protocol.md','utf8'),a=fs.readFileSync('reports/oslo-place-description-scope-audit-2026-07-26.md','utf8');
          if(!p.includes('Ferdige etter alle mergede revisjonsbatcher: **238 steder**'))throw new Error('total');
          if(!p.includes('Gjenstår: **274 steder**'))throw new Error('remaining');
          if(!p.includes('- vitenskap: **1**'))throw new Error('science');
          if(!p.includes('`tvergastein` ligger fysisk i Hol kommune'))throw new Error('scope anomaly');
          if(!a.includes('IDs in the current revision protocol: **238**'))throw new Error('audit total');
          if(!a.includes('Additional active Oslo IDs outside the protocol: **274**'))throw new Error('audit remaining');
          if(!a.includes('| vitenskap | 1 |'))throw new Error('audit science');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/vitenskap/oslo reports/oslo-place-description-scope-audit-2026-07-26.json reports/oslo-place-description-scope-audit-2026-07-26.md reports/place-description-revision-protocol.md
          git commit -m "Revise second Oslo science description batch"
          git push origin HEAD:agent/oslo-popup-v4-batch-28-science-ten
