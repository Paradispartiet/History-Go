name: One-time build Næringsliv pilot final

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - '.github/workflows/one-time-build-naeringsliv-pilot-final.yml'
      - '.tmp/rebuild-naeringsliv-pilot.txt'

permissions:
  contents: write

jobs:
  build-final:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/naeringsliv-pilot-profesjonsmaterialisering-control
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Execute locked builder with corrected package loop
        shell: bash
        run: |
          set -euo pipefail
          LOCKED_BUILDER_COMMIT='4234d827f9d852a0bde596d928d689a821408b21'
          git show "${LOCKED_BUILDER_COMMIT}:.github/workflows/one-time-build-naeringsliv-pilot-final.yml" > /tmp/locked-builder.yml

          python - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/locked-builder.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Reconstruct, validate and publish clean final branch'
          marker_index = lines.index(marker)
          run_index = next(index for index in range(marker_index, len(lines)) if lines[index] == '        run: |')
          body_lines = lines[run_index + 1:]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body_lines) + '\n'

          old = '''for part in $(seq -w 0 8); do
  git -C "$GITHUB_WORKSPACE" show "origin/${OLD_BRANCH}:.tmp/naeringsliv-pilot/pkg-${part}"
done > /tmp/naeringsliv-pilot.b64
'''
          new = '''for part_index in $(seq 0 8); do
  part=$(printf '%02d' "$part_index")
  git -C "$GITHUB_WORKSPACE" show "origin/${OLD_BRANCH}:.tmp/naeringsliv-pilot/pkg-${part}"
done > /tmp/naeringsliv-pilot.b64
'''
          if old not in body:
              raise SystemExit('Fant ikke den låste pakkeløkken')
          body = body.replace(old, new, 1)
          Path('/tmp/run-locked-naeringsliv-pilot-builder.sh').write_text(body, encoding='utf-8')
          PY

          bash /tmp/run-locked-naeringsliv-pilot-builder.sh
