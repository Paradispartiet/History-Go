name: Temporary Film TV FWG governance repair

on:
  push:
    branches:
      - civication/film-tv-fwg-governance

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align Film TV FWG bindings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          manus = 'data/Civication/workGrammars/film_tv/manusmedarbeider.json'
          replace_once(manus,
              '"can_send_mail_types": ["people", "story"]',
              '"can_send_mail_types": ["people", "story", "conflict", "followup"]')
          replace_once(manus,
              '"can_send_mail_types": ["event", "consequence"]',
              '"can_send_mail_types": ["event", "consequence", "story", "followup"]')
          replace_once(manus,
              '"mail_families": ["manusmedarbeider_motstridende_notater"]',
              '"mail_families": ["manusmedarbeider_motstridende_notater", "role_world_rollout_manus_author_response"]')

          program = 'data/Civication/workGrammars/film_tv/programleder.json'
          replace_once(program,
              '"id": "skarphet_vs_faktagrunnlag", "pressure": "sendetid_og_profil", "must_remain_visible"',
              '"id": "skarphet_vs_faktagrunnlag", "pressure": "sendetid_og_profil", "mail_families": ["programleder_skarpt_premiss", "role_world_rollout_program_editorial_premise_rework"], "must_remain_visible"')

          regi = 'data/Civication/workGrammars/film_tv/regissor.json'
          replace_once(regi,
              '"example_id": "leila_forste_regiassistent", "function": "Holder dagsplan, settflyt og eskaleringslinjer for gjennomføring og sikkerhet tydelige.", "can_send_mail_types": ["micro", "event", "people"]',
              '"example_id": "leila_forste_regiassistent", "function": "Holder dagsplan, settflyt og eskaleringslinjer for gjennomføring og sikkerhet tydelige.", "can_send_mail_types": ["micro", "event", "people", "story"]')

          series = 'data/Civication/workGrammars/film_tv/serieskaper.json'
          replace_once(series,
              '"can_send_mail_types": ["people", "story", "event"]',
              '"can_send_mail_types": ["people", "story", "event", "followup"]')
          replace_once(series,
              '"can_send_mail_types": ["event", "conflict", "consequence"]',
              '"can_send_mail_types": ["event", "conflict", "consequence", "story"]')
          replace_once(series,
              '"id": "notes_vs_seriekjerne",\n      "pressure": "flere_legitime_bestillere",',
              '"id": "notes_vs_seriekjerne",\n      "pressure": "flere_legitime_bestillere",\n      "mail_families": ["serieskaper_noteskonflikt"],')
          PY

      - name: Regenerate and verify FWG governance report
        shell: bash
        run: |
          node scripts/audit-civication-fwg-governance.mjs
          grep -F -- '- Totalt antall avvik: 21' docs/CIVICATION_FWG_GOVERNANCE.md
          python3 - <<'PY'
          from pathlib import Path
          report = Path('docs/CIVICATION_FWG_GOVERNANCE.md').read_text()
          rows = [line for line in report.splitlines() if line.startswith('| ') and ' | film_tv | ' in line]
          bad = [line for line in rows if '⚠️' in line]
          if bad:
              raise SystemExit('film_tv still has FWG findings:\n' + '\n'.join(bad))
          print(f'film_tv governance rows green: {len(rows)}')
          PY

      - name: Commit verified repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-film-tv-fwg-governance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/Civication/workGrammars/film_tv/manusmedarbeider.json \
                  data/Civication/workGrammars/film_tv/programleder.json \
                  data/Civication/workGrammars/film_tv/regissor.json \
                  data/Civication/workGrammars/film_tv/serieskaper.json \
                  docs/CIVICATION_FWG_GOVERNANCE.md \
                  .github/workflows/tmp-film-tv-fwg-governance.yml
          git diff --cached --check
          git commit -m 'Civication: align Film TV FWG with authored mail roles'
          git push
