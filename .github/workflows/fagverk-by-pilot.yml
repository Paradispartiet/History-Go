name: Fagverk By pilot

on:
  pull_request:
    paths:
      - 'fagverk.html'
      - 'fagverk-forside.html'
      - 'data/categories/category_contract.json'
      - 'data/fag/by/**'
      - 'data/badges/by.json'
      - 'data/fagverk/by/**'
      - 'js/fagverk-subject-core.js'
      - 'js/fagverk-subject-model.js'
      - 'js/fagverk.js'
      - 'scripts/audit-fagverk-subject-inventory.mjs'
      - 'scripts/audit-fagverk-general-engine.mjs'
      - 'scripts/audit-fagverk-by-pilot.mjs'
      - 'tools/audit-by-theory-integrity.mjs'
      - 'scripts/build-fagverk-release-manifest.mjs'
      - 'tests/fagverk-subject-inventory.test.mjs'
      - 'tests/fagverk-general-engine.test.mjs'
      - 'tests/fagverk-by-pilot.test.mjs'
      - 'tests/by-theory-integrity.test.mjs'
      - 'tests/fagverk-release-manifest.test.mjs'
      - 'reports/fagverk/**'
      - '.github/workflows/fagverk-by-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'data/fag/by/**'
      - 'data/badges/by.json'
      - 'data/fagverk/by/**'
      - 'scripts/audit-fagverk-by-pilot.mjs'
      - 'tools/audit-by-theory-integrity.mjs'
      - 'tests/fagverk-by-pilot.test.mjs'
      - 'tests/by-theory-integrity.test.mjs'
      - 'reports/fagverk/**'
      - '.github/workflows/fagverk-by-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate By compatibility pilot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate syntax and deterministic reports
        run: |
          node --check scripts/audit-fagverk-by-pilot.mjs
          node --check tools/audit-by-theory-integrity.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-by-pilot.mjs
          node tools/audit-by-theory-integrity.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Validate Fagverk and By contracts
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-by-pilot.test.mjs
          node --test tests/by-theory-integrity.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
