name: Generate Subkultur randsoner batch 02

on:
  push:
    branches:
      - agent/subkultur-randsoner-batch-02

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/subkultur-randsoner-batch-02
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Add researched places and save Geonorge evidence
        run: node scripts/tmp-add-subkultur-randsoner-batch-02.mjs

      - name: Regenerate split Subkultur files
        run: node scripts/split-subkultur-oslo-places.mjs

      - name: Record coordinate-control batch
        run: node scripts/tmp-update-subkultur-randsoner-protocol.mjs

      - name: Rebuild global places index
        run: npm run places:index:build

      - name: Validate generated place data
        run: |
          mkdir -p reports/subkultur-oslo-randsoner-batch-02/validation
          npm run audit:places-split-manifest-sync | tee reports/subkultur-oslo-randsoner-batch-02/validation/split-manifest-sync.txt
          npm run places:index:check | tee reports/subkultur-oslo-randsoner-batch-02/validation/places-index-check.txt
          npm run places:emners:check | tee reports/subkultur-oslo-randsoner-batch-02/validation/emne-check.txt
          npm run places:coords:intake | tee reports/subkultur-oslo-randsoner-batch-02/validation/coordinate-intake.txt
          npm run health:places | tee reports/subkultur-oslo-randsoner-batch-02/validation/health-places.txt

      - name: Remove one-shot generator files
        run: git rm scripts/tmp-add-subkultur-randsoner-batch-02.mjs scripts/tmp-update-subkultur-randsoner-protocol.mjs .github/workflows/tmp-subkultur-randsoner-batch-02.yml

      - name: Commit generated batch
        run: |
          git config user.name "history-go-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/places/subkultur/oslo data/places/places_index.json docs/coordinates/coordinate-control-protocol.md reports/subkultur-oslo-randsoner-batch-02
          git commit -m "Add Subkultur social margins places batch 02"
          git push origin HEAD:agent/subkultur-randsoner-batch-02
