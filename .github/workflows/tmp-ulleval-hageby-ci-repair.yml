name: tmp Ullevål Hageby composed CI repair
on:
  push:
    branches:
      - work/ulleval-hageby-completion-20260902
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'Repair Ullevål Hageby composed CI state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ulleval-hageby-completion-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Merge fresh main
        run: |
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Repair composed contracts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const lesesporFile = 'data/lesespor/oslo/lesespor_oslo_by.json';
          const root = JSON.parse(fs.readFileSync(lesesporFile, 'utf8'));
          let found = 0;
          const visit = (node) => {
            if (Array.isArray(node)) return node.forEach(visit);
            if (!node || typeof node !== 'object') return;
            if (node.id === 'lesespor_ullevål_hageby_kommune') {
              node.source_quality = 'institutional';
              found += 1;
            }
            Object.values(node).forEach(visit);
          };
          visit(root);
          if (found !== 1) throw new Error(`Expected exactly one Ullevål kommune Lesespor item, found ${found}`);
          fs.writeFileSync(lesesporFile, `${JSON.stringify(root, null, 2)}\n`);

          const epochTestFile = 'tests/epoke-place-index.test.mjs';
          let epochTestText = fs.readFileSync(epochTestFile, 'utf8');
          const replacements = [
            ['assert.equal(index.stats.canonical_story_milestone_count, 218);', 'assert.equal(index.stats.canonical_story_milestone_count, 219);', 'Epoch story milestone assertion'],
            ['assert.equal(index.stats.verified_place_production_milestone_count, 392);', 'assert.equal(index.stats.verified_place_production_milestone_count, 402);', 'Epoch verified production milestone assertion']
          ];
          for (const [oldLine, newLine, label] of replacements) {
            if (!epochTestText.includes(oldLine) && !epochTestText.includes(newLine)) throw new Error(`${label} not found`);
            if (epochTestText.includes(oldLine)) epochTestText = epochTestText.replace(oldLine, newLine);
          }
          fs.writeFileSync(epochTestFile, epochTestText);

          const ullevalTestFile = 'tests/ullevål-hageby-completion.test.mjs';
          let ullevalTestText = fs.readFileSync(ullevalTestFile, 'utf8');
          const oldStoryScoreLine = 'assert.equal(stories[0].score.total, 17);';
          const newStoryScoreLine = 'assert.equal(stories[0].score.total, 16);';
          if (!ullevalTestText.includes(oldStoryScoreLine) && !ullevalTestText.includes(newStoryScoreLine)) throw new Error('Ullevål Story total assertion not found');
          if (ullevalTestText.includes(oldStoryScoreLine)) ullevalTestText = ullevalTestText.replace(oldStoryScoreLine, newStoryScoreLine);
          fs.writeFileSync(ullevalTestFile, ullevalTestText);
          NODE
      - name: Regenerate composed canonical state
        run: |
          npm ci --no-audit --no-fund
          npm run places:index:build
          node scripts/audit-fagverk-place-pages.mjs --write
          node scripts/build-fagverk-release-manifest.mjs
          npm run epoker:places:build
          npm run place-open:build
          npm run knowledge:canonical:write
          node - <<'NODE'
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const report = path.join(os.tmpdir(), 'ullevål-hageby-ci-repair-image-audit.json');
          execFileSync(process.execPath, ['scripts/audit-place-images.mjs', '--mode=all', `--report=${report}`], { stdio: 'ignore' });
          const audit = JSON.parse(fs.readFileSync(report, 'utf8'));
          const file = 'data/places/place_image_backlog_summary.json';
          const backlog = JSON.parse(fs.readFileSync(file, 'utf8'));
          backlog.generatedAt = '2026-09-02';
          backlog.generatedFromCommit = 'ullevål_hageby_composed_ci_repair_20260902';
          backlog.totalPlaces = audit.totalPlaces;
          backlog.summary = { validLocal: audit.summary.local, validRemote: audit.summary.remote, optionalMissing: audit.summary.optional, missing: audit.summary.missing, invalidLocalPath: audit.summary.invalid, remaining: audit.summary.missing + audit.summary.invalid };
          for (const [category, row] of Object.entries(audit.byCategory || {})) backlog.byCategory[category] = { ...backlog.byCategory[category], total: row.total, valid: row.local + row.remote, optional: row.optional, missing: row.missing, invalid: row.invalid };
          fs.writeFileSync(file, `${JSON.stringify(backlog, null, 2)}\n`);
          NODE
      - name: Verify repaired candidate
        run: |
          npm run build:tools
          node dist/tools/validate_lesespor.mjs
          node dist/tools/check_stories_integrity.mjs
          node tests/ullevål-hageby-completion.test.mjs
          npm run places:index:check
          npm run place-open:check
          npm run test:place-open
          npm run epoker:places:check
          node --test tests/epoke-place-index.test.mjs
          node scripts/audit-fagverk-place-pages.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
          git diff --check
      - name: Publish repaired candidate
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Repair Ullevål Hageby composed CI state"
          fi
          git push origin HEAD:work/ulleval-hageby-completion-20260902
