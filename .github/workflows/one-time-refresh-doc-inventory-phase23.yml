name: One-time refresh documentation inventory phase 23

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-refresh-doc-inventory-phase23.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase 23 branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-governance-phase-23-civication-pr-review-archive
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Regenerate documentation inventory
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:scripts
          node dist/scripts/check-documentation-governance.mjs
          git restore --source=HEAD --worktree --staged -- dist 2>/dev/null || true
          git clean -fd -- dist

      - name: Commit refreshed inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/documentation-governance/inventory.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerer dokumentinventar etter Civication-arkivering"
          git push origin HEAD:agent/documentation-governance-phase-23-civication-pr-review-archive

      - name: Remove one-time workflow from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C main origin/main
          if [ ! -f .github/workflows/one-time-refresh-doc-inventory-phase23.yml ]; then
            exit 0
          fi
          git rm .github/workflows/one-time-refresh-doc-inventory-phase23.yml
          git commit -m "Fjern inventar-workflow for dokumentasjonsfase 23"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
