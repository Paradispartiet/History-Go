name: TEMP Materialize Historie Fagledelse prerequisites

on:
  push:
    branches:
      - agent/civication-historie-fagledelse-prerequisites
    paths:
      - scripts/TEMP_materialize_historie_fagledelse_prerequisites.mjs
      - tests/civication-historie-fagledelse-prerequisites.test.js
      - reports/CIVICATION_HISTORIE_FAGLEDELSE_PREREQUISITES_SOURCE_FIRST.md
      - .github/workflows/TEMP-civication-historie-fagledelse-prerequisites.yml
  workflow_dispatch:

concurrency:
  group: civication-historie-fagledelse-prerequisites-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/civication-historie-fagledelse-prerequisites
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Materialize Historie Fagledelse foundation
        run: node scripts/TEMP_materialize_historie_fagledelse_prerequisites.mjs
      - name: Regenerate Role Pack index
        run: node scripts/audit-civication-role-packs.mjs
      - name: Regenerate compiled Scene Registry
        run: node scripts/build-civication-scene-registry.mjs --write
      - name: Regenerate Career Gameplay audit
        run: node scripts/audit-civication-career-gameplay.mjs --write
      - name: Regenerate rollout readiness
        run: node scripts/audit-civication-role-world-rollout-readiness.mjs --write
      - name: Verify focused foundation
        run: node tests/civication-historie-fagledelse-prerequisites.test.js
      - name: Verify Career Gameplay and readiness
        run: |
          node tests/civication-career-gameplay-matrix.test.js
          node tests/civication-role-world-rollout-readiness.test.js
      - name: Verify Role Pack depth and Scene Registry
        run: |
          node tests/civication-role-pack-depth.test.js
          node scripts/build-civication-scene-registry.mjs --check
      - name: Verify Scenario People state and invariants
        run: |
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node --test tests/civication-scenario-people.test.mjs
      - name: Run full Civication suite
        run: |
          set +e
          npm run test:civication > /tmp/civication.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            grep -E -B 8 -A 24 'AssertionError|ERR_ASSERTION|not ok|FAIL|Error:|error:' /tmp/civication.log | tail -n 220 || tail -n 220 /tmp/civication.log
            exit "$status"
          fi
          tail -n 50 /tmp/civication.log
      - name: Remove temporary prerequisite surfaces
        run: rm scripts/TEMP_materialize_historie_fagledelse_prerequisites.mjs .github/workflows/TEMP-civication-historie-fagledelse-prerequisites.yml
      - name: Commit exact verified foundation
        run: |
          git diff --check
          git config user.name "Civication rollout agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No permanent changes produced"; exit 1; }
          git commit -m "Complete Historie Fagledelse prerequisites"
          git push origin HEAD:agent/civication-historie-fagledelse-prerequisites