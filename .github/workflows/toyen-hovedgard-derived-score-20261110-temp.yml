name: Temporary Tøyen hovedgård derived Story score acceptance
on:
  push:
    branches:
      - fix/toyen-hovedgard-1812-machine-score-20261110
    paths:
      - .github/workflows/toyen-hovedgard-derived-score-20261110-temp.yml
permissions:
  contents: read
jobs:
  validate-deterministic-derived-score:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prove only machine-derived fields changed
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor '5528e829d872257b12000f47fd148612cc36d6cf' HEAD
          git diff --check '5528e829d872257b12000f47fd148612cc36d6cf' HEAD
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import cp from 'node:child_process';
          import fs from 'node:fs';
          const p='data/stories/stories_toyen_hovedgard.json';
          const before=JSON.parse(cp.execFileSync('git',['show','5528e829d872257b12000f47fd148612cc36d6cf:'+p],{encoding:'utf8'}));
          const after=JSON.parse(fs.readFileSync(p,'utf8'));
          assert.equal(before.length,1);assert.equal(after.length,1);
          assert.equal(after[0].id,'st_toyen_hovedgard_gave_til_universitetet_1812');
          const old=JSON.parse(JSON.stringify(after));
          old[0].score=before[0].score;
          assert.deepEqual(old,before,'Story text, sources, editorial content changed');
          assert.deepEqual(after[0].score,{narrative:3,historical:3,source:5,play_value:3,originality:3,total:17});
          const allowed=[p,'.github/workflows/toyen-hovedgard-derived-score-20261110-temp.yml'].sort();
          const changed=cp.execFileSync('git',['diff','--name-only','5528e829d872257b12000f47fd148612cc36d6cf','HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
          assert.deepEqual(changed,allowed);
          console.log('PASS exact one-Story derived numeric fix, no editorial changes');
          NODE
      - name: Canonical production Stories integrity
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check:stories
