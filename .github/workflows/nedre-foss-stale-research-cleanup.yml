name: Nedre Foss stale research cleanup

on:
  push:
    branches: [agent/cleanup-nedre-foss-stale-research-flags]
    paths:
      - '.github/workflows/nedre-foss-stale-research-cleanup.yml'
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cleanup-nedre-foss-stale-research-flags
          fetch-depth: 0

      - name: Remove stale Nedre Foss research flags
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/nedre-foss-stale-research-cleanup

          python - <<'PY'
          import json
          from pathlib import Path

          def read(path):
              return json.loads(Path(path).read_text())

          def write(path, value):
              Path(path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n')

          place_path = Path('data/places/natur/oslo/places_oslo_natur_akerselvarute/nedre_foss.json')
          place = read(place_path)

          stale_ids = {
              'nedre_foss_exact_mill_chronology',
              'nedre_foss_building_specific_history',
          }
          place['research_notes'] = [
              row for row in place.get('research_notes', [])
              if row.get('id') not in stale_ids
          ]

          place['source_summary'] = {
              'safe_sources': [
                  'Store norske leksikon – Foss (Oslo)',
                  'Oslo byleksikon – Foss gård',
                  'Industrimuseum – Akerselva Digitalt / Nedre Foss',
                  'Oslo byleksikon – Nedre Foss park'
              ],
              'resolved_research': [
                  'Møllekronologien fra 1220, Kongens mølle og Friedrich Grüners kjøp i 1672 er kildebelagt og app-klar.',
                  'Hovedbygningen fra 1801/1802 og kornsiloens ombygging til studentboliger i 2001 er kildebelagt og app-klar.'
              ],
              'hold_back_sources': [
                  'Current businesses and venues are time-sensitive and should not be hard-coded.',
                  'Precise geology claims should be verified before app-facing use.'
              ]
          }
          write(place_path, place)

          article_path = Path('data/leksikon/places/oslo/historie/leksikon_oslo_historie_nedre_foss.json')
          article = read(article_path)
          article['interpretation']['counterpoints'] = [
              'Nåværende virksomheter i området er tidssensitive og bør ikke hardkodes uten ny kildekontroll.',
              'Presise geologipåstander om synlig berg ved fossen krever egen geologisk kilde.'
          ]
          article['ui']['mini_panel']['highlights'] = [
              'fact_nedre_foss_01',
              'fact_nedre_foss_02',
              'story_nedre_foss_01',
              'artifact_01'
          ]
          write(article_path, article)
          PY

          node tests/nedre-foss-history-rounds-batch1.test.js \
            | tee reports/nedre-foss-stale-research-cleanup/targeted-test.txt
          node tests/place-card-rounds-runtime-audit.test.js \
            | tee reports/nedre-foss-stale-research-cleanup/place-card-rounds-runtime.txt

          node - <<'NODE' | tee reports/nedre-foss-stale-research-cleanup/cleanup-audit.txt
          const fs = require('fs');
          const place = JSON.parse(fs.readFileSync('data/places/natur/oslo/places_oslo_natur_akerselvarute/nedre_foss.json', 'utf8'));
          const article = JSON.parse(fs.readFileSync('data/leksikon/places/oslo/historie/leksikon_oslo_historie_nedre_foss.json', 'utf8'));
          const ids = new Set(place.research_notes.map(x => x.id));
          if (ids.has('nedre_foss_exact_mill_chronology') || ids.has('nedre_foss_building_specific_history')) throw new Error('stale research flags remain');
          if (!place.source_summary.resolved_research || place.source_summary.resolved_research.length < 2) throw new Error('resolved research summary missing');
          if (article.interpretation.counterpoints.some(x => /møllekronologi|bygningsspesifikk/i.test(x))) throw new Error('stale leksikon counterpoint remains');
          const allIds = new Set([
            ...article.facts.map(x => x.id),
            ...article.stories.map(x => x.id),
            ...article.artifacts.map(x => x.id)
          ]);
          for (const id of article.ui.mini_panel.highlights) {
            if (!allIds.has(id)) throw new Error(`missing mini-panel highlight target: ${id}`);
          }
          console.log('Nedre Foss stale research cleanup audit OK');
          NODE

          git diff --check \
            | tee reports/nedre-foss-stale-research-cleanup/git-diff-check.txt

          rm -f .github/workflows/nedre-foss-stale-research-cleanup.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove stale Nedre Foss research flags'
          git push origin HEAD:agent/cleanup-nedre-foss-stale-research-flags
