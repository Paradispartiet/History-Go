name: Diagnose Oslo coordinate batch 29 validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: oslo-coordinate-batch-29-validation-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-29-v3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply batch in workspace only
        run: |
          node scripts/tmp-complete-oslo-coordinate-batch29-v3.mjs
          npm run places:index:build

      - name: Capture every validation result
        shell: bash
        run: |
          set +e
          out=reports/oslo-coordinate-control-batch-29-v3/validation-diagnose
          mkdir -p "$out"

          npm run audit:places-split-manifest-sync > "$out/split-manifest-sync.txt" 2>&1
          s1=$?
          npm run places:index:check > "$out/places-index-check.txt" 2>&1
          s2=$?
          npm run test:coordinate-source-contract > "$out/coordinate-source-contract.txt" 2>&1
          s3=$?
          npm run places:coords:quality > "$out/coordinate-quality.txt" 2>&1
          s4=$?
          npm run places:coords:intake > "$out/coordinate-intake.txt" 2>&1
          s5=$?
          npm run places:coords:evidence:audit > "$out/coordinate-evidence-audit.txt" 2>&1
          s6=$?
          git diff --check > "$out/git-diff-check.txt" 2>&1
          s7=$?

          cat > "$out/status.json" <<EOF
          {
            "split_manifest_sync": $s1,
            "places_index_check": $s2,
            "coordinate_source_contract": $s3,
            "coordinate_quality": $s4,
            "coordinate_intake": $s5,
            "coordinate_evidence_audit": $s6,
            "git_diff_check": $s7
          }
          EOF

          cat "$out/status.json"
          exit 0

      - name: Persist diagnostics only
        run: |
          set -euo pipefail
          rm .github/workflows/oslo-coordinate-batch-29-validation-diagnose.yml
          git reset --hard HEAD -- data docs
          git clean -fd data docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/oslo-coordinate-control-batch-29-v3/validation-diagnose .github/workflows/oslo-coordinate-batch-29-validation-diagnose.yml
          git commit -m "Capture batch 29 validation diagnostics"
          git push origin HEAD
