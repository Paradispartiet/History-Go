name: Build Hidlesnes source-sized quiz

on:
  push:
    branches:
      - agent/etne-hidlesnes-source-sized-quiz

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-hidlesnes-source-sized-quiz
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Materialize source-sized Hidlesnes quiz
        run: |
          node <<'NODE'
          const fs = require('fs');
          const targetId = 'hidlesnes_nernes_gravroys';
          const quizPath = `data/quiz/historie/${targetId}_sets.json`;
          const guidanceFiles = [
            'data/fag/historie/emner_historie_canonical_v4_5.json',
            'data/fag/historie/supersetQUIZMAL_historie.json',
            'data/fag/historie/methods_historie_canonical_v4_5.json'
          ];

          function q({n, set, local, text, options, answer, knowledge, type, difficulty, emne, method, concepts, tags, claim, sources, focus = []}) {
            const answerIndex = options.indexOf(answer);
            if (answerIndex < 0) throw new Error(`Answer missing for ${n}`);
            return {
              id: `${targetId}_quiz_${n}`,
              quiz_id: `historie_${targetId}_set_${set}_q${local}`,
              categoryId: 'historie',
              placeId: targetId,
              targetId,
              question_scope: 'place',
              question: text,
              options,
              answer,
              answerIndex,
              knowledge,
              difficulty,
              question_type: type,
              year: null,
              epoke_id: null,
              epoke_domain: 'historie',
              emne_id: emne,
              related_emner: [],
              source: sources,
              source_origin: 'mixed',
              claim_basis: claim,
              guidance_basis: {
                emne_id: emne,
                canonical_files_used_as_guidance_only: guidanceFiles,
                method_id: method
              },
              method_id: method,
              core_concepts: concepts,
              concept_focus: focus,
              tags: [targetId, ...tags]
            };
          }

          const sets = [
            {
              set_id: `historie_${targetId}_set_1`, level: 1, order: 1, xp: 50,
              title: 'Røysa på den ytste pynten',
              questions: [
                q({
                  n: 1, set: 1, local: 1,
                  text: 'Kva slags kulturminne er registrert på Hidlesnes?',
                  options: ['Ei gravrøys', 'Ein steinring', 'Ei bygdeborg'],
                  answer: 'Ei gravrøys',
                  knowledge: 'På Hidlesnes ved Nernes er det registrert ei førhistorisk gravrøys som i dag er sterkt forstyrra.',
                  type: 'fact', difficulty: 1,
                  emne: 'em_his_spor_materialitet', method: 'met_sporlesning',
                  concepts: ['gravrøys', 'gravminne'], tags: ['kulturminnetype', 'gravroys'],
                  claim: 'Askeladden-posten klassifiserer lokaliteten som gravrøys.',
                  sources: ['b2find_hidlesnes', 'etne_register']
                }),
                q({
                  n: 2, set: 1, local: 2,
                  text: 'Kva terreng kjenneteiknar plasseringa?',
                  options: ['Den ytste høge pynten av neset', 'Ei låg myr inne i dalen', 'Ein flat plass midt i kyrkjegarden'],
                  answer: 'Den ytste høge pynten av neset',
                  knowledge: 'Røysa ligg ytterst på den høge pynten av Hidlesnes, tydeleg vend mot sjøen.',
                  type: 'observation', difficulty: 1,
                  emne: 'em_his_spor_materialitet', method: 'met_sporlesning',
                  concepts: ['høgt nes', 'kystlandskap', 'landskapsplassering'], tags: ['landskap', 'nes'],
                  claim: 'Registreringa plasserer røysa på den ytste høge pynten av Hidlesnes.',
                  sources: ['b2find_hidlesnes', 'etne_register']
                }),
                q({
                  n: 3, set: 1, local: 3,
                  text: 'Kva mål er registrerte for Hidlesnes-røysa?',
                  options: ['Om lag seks meter i tverrmål og ein halv meter høg', 'Om lag femten meter i tverrmål og tre meter høg', 'Om lag to meter i tverrmål og to meter høg'],
                  answer: 'Om lag seks meter i tverrmål og ein halv meter høg',
                  knowledge: 'Den låge røysa er registrert til om lag seks meter i tverrmål og kring ein halv meter i høgd.',
                  type: 'fact', difficulty: 1,
                  emne: 'em_his_spor_materialitet', method: 'met_sporlesning',
                  concepts: ['tverrmål', 'høgd', 'låg røys'], tags: ['mal', 'storleik'],
                  claim: 'Registreringa oppgir omtrent seks meter i diameter og rundt 0,5 meter i høgd.',
                  sources: ['b2find_hidlesnes']
                })
              ]
            },
            {
              set_id: `historie_${targetId}_set_2`, level: 2, order: 2, xp: 50,
              title: 'Kantstein, søkk og kol',
              questions: [
                q({
                  n: 4, set: 2, local: 1,
                  text: 'Kva byggjedetalj er registrert i røysa?',
                  options: ['Kantsteinar rundt monumentet', 'Teglveggar med mørtel', 'Ein trekonstruksjon over røysa'],
                  answer: 'Kantsteinar rundt monumentet',
                  knowledge: 'Røysa er skildra som bygd med kantsteinar, sjølv om mykje stein seinare er kasta ut.',
                  type: 'fact', difficulty: 2,
                  emne: 'em_his_spor_materialitet', method: 'met_sporlesning',
                  concepts: ['kantstein', 'røyskonstruksjon'], tags: ['byggjemate', 'kantstein'],
                  claim: 'Kjelda dokumenterer kantsteinar som del av konstruksjonen.',
                  sources: ['b2find_hidlesnes']
                }),
                q({
                  n: 5, set: 2, local: 2,
                  text: 'Kva skildrar forstyrringa av røysa best?',
                  options: ['Mykje stein er kasta ut, og sentrum har eit søkk', 'Røysa står urørt med jamn topp', 'Heile røysa er rekonstruert i betong'],
                  answer: 'Mykje stein er kasta ut, og sentrum har eit søkk',
                  knowledge: 'Røysa var sterkt forstyrra, med mykje utkastet stein og ei grop eller eit søkk i midten.',
                  type: 'observation', difficulty: 2,
                  emne: 'em_his_kulturminner_bevaring', method: 'met_sporlesning',
                  concepts: ['utkasta stein', 'sentralt søkk', 'forstyrring'], tags: ['bevaring', 'observasjon'],
                  claim: 'Registreringa dokumenterer både omfattande steinutkasting og eit sentralt søkk.',
                  sources: ['b2find_hidlesnes', 'etne_register']
                }),
                q({
                  n: 6, set: 2, local: 3,
                  text: 'Kva seier registreringa at det skal ha vore funne på røysbotnen?',
                  options: ['Mykje kol, men ingen andre oppgitte funn', 'Ei datert gullmynt og eit sverd', 'Ein komplett trekiste'],
                  answer: 'Mykje kol, men ingen andre oppgitte funn',
                  knowledge: 'Kjelda omtalar mykje kol på botnen av det forstyrra søkket, men nemner ingen andre funn og gir inga sikker datering.',
                  type: 'fact', difficulty: 2,
                  emne: 'em_his_kildekritikk_arkiv_spor', method: 'met_kildekritikk',
                  concepts: ['kolopplysning', 'røysbotn', 'manglande funn'], tags: ['kol', 'kildespor'],
                  claim: 'Registreringa gjengir ei opplysning om kol på røysbotnen og ingen andre funn.',
                  sources: ['b2find_hidlesnes']
                }),
                q({
                  n: 7, set: 2, local: 4,
                  text: 'Kvifor svekkjer søkket og den utkasta steinen tolkinga av kolopplysninga?',
                  options: ['Den opphavlege samanhengen mellom kol, lag og konstruksjon kan vere broten', 'Kol kan berre finnast i urørte steinrøyser', 'Steinutkasting gir automatisk ein presis dato'],
                  answer: 'Den opphavlege samanhengen mellom kol, lag og konstruksjon kan vere broten',
                  knowledge: 'Når massar er flytta og sentrum er grave i, blir det vanskelegare å vite om kolet låg i opphavleg kontekst.',
                  type: 'analysis', difficulty: 3,
                  emne: 'em_his_kildekritikk_arkiv_spor', method: 'met_kildekritikk',
                  concepts: ['forstyrra kontekst', 'lag', 'kildeusikkerheit'], tags: ['analyse', 'funnkontekst'],
                  claim: 'Den dokumenterte forstyrringa kan ha brote den opphavlege funnsamanhengen.',
                  sources: ['b2find_hidlesnes', 'etne_register']
                })
              ]
            },
            {
              set_id: `historie_${targetId}_set_3`, level: 3, order: 3, xp: 50,
              title: 'Konstruksjon og dateringsgrense',
              questions: [
                q({
                  n: 8, set: 3, local: 1,
                  text: 'Kva betyr «kantstein» i denne røysa?',
                  options: ['Steinar som avgrensar eller held kanten av monumentet', 'Steinar som alltid inneheld innskrifter', 'Laus stein frå ein moderne vegkant'],
                  answer: 'Steinar som avgrensar eller held kanten av monumentet',
                  knowledge: 'Kantsteinar dannar ei ytre avgrensing eller støtte i eit bygd monument og kan hjelpe til med å lese den opphavlege forma.',
                  type: 'concept', difficulty: 2,
                  emne: 'em_his_spor_materialitet', method: 'met_sporlesning',
                  concepts: ['kantstein', 'avgrensing', 'konstruksjon'], focus: ['kantstein'], tags: ['begrep', 'byggjemate'],
                  claim: 'Den registrerte kantsteinen gjer fagomgrepet konkret på Hidlesnes.',
                  sources: ['b2find_hidlesnes']
                }),
                q({
                  n: 9, set: 3, local: 2,
                  text: 'Kva betyr «funnkontekst» for kolet på Hidlesnes?',
                  options: ['Den dokumenterte plasseringa i lag og samanhengen med andre spor', 'Berre namnet på personen som fann kolet', 'Eit generelt kartpunkt for heile Nernes'],
                  answer: 'Den dokumenterte plasseringa i lag og samanhengen med andre spor',
                  knowledge: 'Funnkontekst er kvar eit materiale låg, i kva lag og saman med kva konstruksjonar eller funn. Det er avgjerande for sikker tolking.',
                  type: 'concept', difficulty: 3,
                  emne: 'em_his_kildekritikk_arkiv_spor', method: 'met_kildekritikk',
                  concepts: ['funnkontekst', 'jordlag', 'arkeologisk samanheng'], focus: ['funnkontekst'], tags: ['begrep', 'kildekritikk'],
                  claim: 'Kolopplysninga kjem frå eit forstyrra søkk og gjer dokumentert funnkontekst sentral.',
                  sources: ['b2find_hidlesnes']
                }),
                q({
                  n: 10, set: 3, local: 3,
                  text: 'Kvifor er kolopplysninga ikkje ei sikker datering av røysa?',
                  options: ['Det manglar dokumentert prøve, sikker kontekst og dateringsanalyse', 'Alt kol er yngre enn gravrøyser', 'Kantstein gjer radiokarbondatering umogleg'],
                  answer: 'Det manglar dokumentert prøve, sikker kontekst og dateringsanalyse',
                  knowledge: 'Kol kan daterast når ei dokumentert prøve har sikker samanheng og blir analysert. Ei eldre opplysning om kol i eit forstyrra søkk gir ikkje dette åleine.',
                  type: 'analysis', difficulty: 3,
                  emne: 'em_his_kilder_taushet_blindsoner', method: 'met_kildekritikk',
                  concepts: ['radiokarbondatering', 'prøve', 'dateringsgrunnlag'], tags: ['analyse', 'datering'],
                  claim: 'Kjelda dokumenterer ikkje ei analysert prøve med sikker kontekst og kan derfor ikkje gi eksakt datering.',
                  sources: ['b2find_hidlesnes', 'etne_register']
                })
              ]
            }
          ];

          const quiz = {
            targetId,
            categoryId: 'historie',
            generator_version: 'quiz_standard_canonical_v2_manual_source_based_source_sized',
            generated_from: [
              'data/places/historie/vestland/etne/hidlesnes_nernes_gravroys.json',
              'reports/etne-historie-batch-6-research.md',
              'data/quiz/regler/QUIZ_STANDARD_CANONICAL_V2.md'
            ],
            sources: {
              b2find_hidlesnes: 'https://b2find.eudat.eu/dataset/8c59421c-3c1e-5c51-9640-71678442627f',
              etne_register: 'https://www.etne.kommune.no/_f/p1/i4eafad86-cabd-457e-966f-ded5c38a9ab0/vedlegg-1-liste-over-arkeologiske-kulturminne.pdf'
            },
            profile_snapshot: {
              place_type: 'gravroys',
              subtype: 'forstyrret_kystgravroys_pa_hoyt_nes',
              signature_features: [
                'ytste høge pynten av Hidlesnes',
                'om lag seks meter i tverrmål og ein halv meter høg',
                'kantsteinar, utkasta stein og sentralt søkk',
                'rapportert kol utan sikker funnkontekst eller datering'
              ],
              primary_angles: ['gravskikk', 'kystlandskap', 'bevaringshistorie', 'kildekritikk'],
              avoid_angles: [
                'tolke kolopplysninga som sikker datering',
                'framstille røysa som urørt',
                'dikte gravinnhald eller identitet'
              ]
            },
            sets
          };

          fs.mkdirSync('data/quiz/historie', { recursive: true });
          fs.writeFileSync(quizPath, JSON.stringify(quiz, null, 2) + '\n');

          const manifestPath = 'data/quiz/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.sets = manifest.sets.filter(entry => entry.targetId !== targetId);
          manifest.sets.push({ targetId, file: quizPath });
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Validate source-sized contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const targetId = 'hidlesnes_nernes_gravroys';
          const data = JSON.parse(fs.readFileSync(`data/quiz/historie/${targetId}_sets.json`, 'utf8'));
          const qs = data.sets.flatMap(set => set.questions);
          const counts = {
            total: qs.length,
            concrete: qs.filter(q => ['fact', 'observation'].includes(q.question_type)).length,
            context: qs.filter(q => ['analysis', 'context', 'comparison'].includes(q.question_type)).length,
            concept: qs.filter(q => q.question_type === 'concept').length
          };
          const expected = { total: 10, concrete: 6, context: 2, concept: 2 };
          if (JSON.stringify(counts) !== JSON.stringify(expected)) throw new Error(`${JSON.stringify(counts)} != ${JSON.stringify(expected)}`);
          const setSizes = data.sets.map(set => set.questions.length);
          if (JSON.stringify(setSizes) !== JSON.stringify([3,4,3])) throw new Error(`Invalid set sizes: ${setSizes}`);
          for (const question of qs) {
            if (question.targetId !== targetId || question.placeId !== targetId || question.question_scope !== 'place') throw new Error(`${question.id}: invalid target contract`);
            if (!question.options.includes(question.answer) || question.options[question.answerIndex] !== question.answer) throw new Error(`${question.id}: invalid answer contract`);
          }
          NODE

      - name: Build canonical Knowledge links
        run: npm run knowledge:canonical:write

      - name: Run quiz and Knowledge validation
        run: |
          npm run audit:quiz-content
          npm run audit:quiz-templates
          npm run test:quiz-content-audit
          npm run knowledge:canonical:check

      - name: Remove temporary files
        run: |
          rm -f .github/workflows/build-hidlesnes-source-sized-quiz.yml
          rm -f .tmp/trigger-hidlesnes-source-sized-quiz.txt

      - name: Commit final Hidlesnes package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add source-sized Hidlesnes gravrøys quiz"
          git push
