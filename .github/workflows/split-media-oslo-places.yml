name: Split Media Oslo places

on:
  push:
    branches:
      - data/split-media-oslo-places-20260708

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/split-media-oslo-places-20260708
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/split-media-oslo-places.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/media/oslo/places_oslo_media data/places/media/oslo/places_oslo_media_manifest.json data/places/media/oslo/places_oslo_media_index.json data/places/media/oslo/places_oslo_media_split_report.txt
          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Generate split Media Oslo place files"
            git push
          fi
