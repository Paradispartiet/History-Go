name: Voldsløkka pumptrack Fagverk integration
on:
  push:
    branches:
      - content/voldslokka-pumptrack-fagverk-20261027
    paths:
      - .github/workflows/voldslokka-fagverk-materialize-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/voldslokka-pumptrack-fagverk-20261027
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate canonical runtime and subject release
        run: |
          npm run places:index:build
          npm run place-open:build
          node scripts/build-fagverk-release-manifest.mjs
      - name: Focused Fagverk, canonical index and runtime audits
        run: |
          node scripts/audit-fagverk-place-pages.mjs
          npm run places:index:check
          npm run place-open:check
          node scripts/build-fagverk-release-manifest.mjs --check
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const id='voldslokka_pumptrack';
          const p=JSON.parse(fs.readFileSync('data/places/sport/oslo/voldslokka_pumptrack/voldslokka_pumptrack.json','utf8'));
          const rt=JSON.parse(fs.readFileSync('data/runtime/place-open/'+id+'.json','utf8'));
          const reg=JSON.parse(fs.readFileSync('data/fagverk/fagverk_registry.json','utf8'));
          assert.equal(p.fagverk.status,'curated');
          assert.equal(p.fagverk.article.length,3);
          assert.equal(p.fagverk.lenses.length,3);
          assert.equal(reg.placeLinks[id].status,'curated');
          assert.equal(rt.place?.fagverk?.status,'curated');
          assert.equal(rt.place?.fagverk?.article?.length,3);
          for(const url of p.fagverk.source_urls)assert(p.externalLinks.some(x=>x.url===url&&x.label),url);
          console.log('PASS: source owner, Fagverk registry, release and place-open parity');
          NODE
      - name: Real Fagverk page on desktop and touch mobile
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import http from 'node:http';
          import path from 'node:path';
          import { chromium } from 'playwright';
          const root=process.cwd(), mime={'.html':'text/html','.css':'text/css','.js':'text/javascript','.json':'application/json','.svg':'image/svg+xml','.png':'image/png','.jpg':'image/jpeg','.webp':'image/webp'};
          const server=http.createServer((req,res)=>{
            const pathname=decodeURIComponent(new URL(req.url,'http://localhost').pathname);
            const file=path.resolve(root,'.'+(pathname==='/'?'/index.html':pathname));
            if(!file.startsWith(root+path.sep)||!fs.existsSync(file)||!fs.statSync(file).isFile()){res.writeHead(404);res.end('Not found');return;}
            res.writeHead(200,{'Content-Type':mime[path.extname(file).toLowerCase()]||'application/octet-stream'});res.end(fs.readFileSync(file));
          });
          await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
          const url='http://127.0.0.1:'+server.address().port+'/fagverk-sted.html?place=voldslokka_pumptrack';
          try{
            for(const [name,width,height] of [['desktop',1440,1000],['mobile',390,844]]){
              const page=await browser.newPage({viewport:{width,height},isMobile:name==='mobile',hasTouch:name==='mobile'});
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForFunction(()=>!document.getElementById('fagverkPlaceContent')?.hidden,{timeout:60000});
              assert.match(await page.locator('#fagverkPlaceTitle').innerText(),/Voldsløkka/i);
              assert.match(await page.locator('#fagverkPlaceArticle').innerText(),/Sagene IF/);
              assert.ok((await page.locator('#fagverkPlaceArticle').innerText()).length>900);
              assert.ok(await page.locator('#fagverkPlaceLenses').locator('h3').count()>=3);
              assert.equal(await page.locator('#fagverkPlaceSources li').count(),4);
              assert.ok(await page.locator('#fagverkPlaceError').isHidden());
              fs.mkdirSync('artifacts/voldslokka-fagverk',{recursive:true});
              await page.screenshot({path:'artifacts/voldslokka-fagverk/'+name+'.png',fullPage:true});
              console.log('PASS '+name+' '+width+'px');
              await page.close();
            }
          }finally{await browser.close();await new Promise(resolve=>server.close(resolve));}
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: voldslokka-pumptrack-fagverk-mobile-desktop
          path: artifacts/voldslokka-fagverk/
          retention-days: 14
      - name: Commit generated canonical outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/places_index.json data/runtime/place-open/ data/fagverk/fagverk_release.json
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize Voldsløkka Fagverk release, index and runtime"
            git push
          fi
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/voldslokka-fagverk-materialize-20261027.yml
          git commit -m "Remove one-time Voldsløkka Fagverk producer"
          git push
