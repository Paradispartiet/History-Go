name: Build Keisarhaugen quiz

on:
  push:
    branches:
      - agent/etne-keisarhaugen-quiz

permissions:
  contents: write

jobs:
  build-quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-keisarhaugen-quiz
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Materialize quiz and manifest
        env:
          QUIZ_GZIP_B64: 
        shell: bash
        run: |
          python3 <<'PY'
          import os, base64, gzip, json
          from pathlib import Path
          raw = gzip.decompress(base64.b64decode(os.environ['QUIZ_GZIP_B64']))
          quiz_path = Path('data/quiz/historie/keisarhaugen_frette_sets.json')
          quiz_path.parent.mkdir(parents=True, exist_ok=True)
          quiz_path.write_bytes(raw + (b'' if raw.endswith(b'\n') else b'\n'))
          manifest_path = Path('data/quiz/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          if not any(x.get('targetId') == 'keisarhaugen_frette' for x in manifest['sets']):
              manifest['sets'].append({'targetId':'keisarhaugen_frette','file':str(quiz_path)})
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build Knowledge links
        run: npm run knowledge:canonical:write

      - name: Validate quiz contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/quiz/historie/keisarhaugen_frette_sets.json';
          const quiz = JSON.parse(fs.readFileSync(path, 'utf8'));
          const questions = quiz.sets.flatMap(set => set.questions);
          if (quiz.targetId !== 'keisarhaugen_frette') throw new Error('Wrong targetId');
          if (quiz.sets.length !== 3 || questions.length !== 15) throw new Error('Expected 3 sets and 15 questions');
          const concrete = questions.filter(q => ['fact','observation'].includes(q.question_type)).length;
          const context = questions.filter(q => ['context','analysis','comparison'].includes(q.question_type)).length;
          const concepts = questions.filter(q => q.question_type === 'concept').length;
          if (concrete !== 8 || context !== 4 || concepts !== 3) throw new Error(`Wrong balance: ${concrete}/${context}/${concepts}`);
          for (const q of questions) {
            if (q.options[q.answerIndex] !== q.answer) throw new Error(`Answer contract failed: ${q.id}`);
            if (q.placeId !== quiz.targetId || q.targetId !== quiz.targetId || q.question_scope !== 'place') throw new Error(`Target contract failed: ${q.id}`);
            if (q.knowledge_link_status !== 'linked') throw new Error(`Knowledge link failed: ${q.id}`);
          }
          const manifest = JSON.parse(fs.readFileSync('data/quiz/manifest.json','utf8'));
          const matches = manifest.sets.filter(x => x.targetId === quiz.targetId);
          if (matches.length !== 1 || matches[0].file !== path) throw new Error('Manifest registration failed');
          console.log('Keisarhaugen quiz contract OK');
          NODE

      - name: Audit quiz content
        run: npm run audit:quiz-content

      - name: Audit quiz templates
        run: npm run audit:quiz-templates

      - name: Test quiz audit
        run: npm run test:quiz-content-audit

      - name: Check Knowledge data
        run: npm run knowledge:canonical:check

      - name: Commit final package
        shell: bash
        run: |
          rm -f .github/workflows/build-keisarhaugen-quiz.yml
          rm -f reports/keisarhaugen-build-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Add Keisarhaugen quiz package'
            git push origin HEAD:agent/etne-keisarhaugen-quiz
          fi
