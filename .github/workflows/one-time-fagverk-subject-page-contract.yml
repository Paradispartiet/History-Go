name: TEMP materialize fagverk subject-page contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/one-time-fagverk-subject-page-contract.mjs'
      - '.github/workflows/one-time-fagverk-subject-page-contract.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/fagverk-all-subject-pages-contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check one-time runner
        run: node --check scripts/one-time-fagverk-subject-page-contract.mjs
      - name: Materialize canonical documentation
        run: node scripts/one-time-fagverk-subject-page-contract.mjs
      - name: Install and build documentation tooling
        run: |
          npm ci --no-audit --no-fund
          npm run build:scripts
      - name: Regenerate and verify documentation governance
        run: node dist/scripts/check-documentation-governance.mjs
      - name: Verify fagverk documentation contract
        run: |
          node --test tests/fagverk-documentation-contract.test.mjs
          node --test tests/fagverk-portal.test.mjs
          node --test tests/fagverk-content.test.mjs
          node --test tests/fagverk-link-audit.test.mjs
          node -e "JSON.parse(require('fs').readFileSync('docs/documentation_registry.json','utf8'))"
          git diff --check
      - name: Remove one-time runner and commit durable result
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --worktree --staged dist 2>/dev/null || true
          git rm scripts/one-time-fagverk-subject-page-contract.mjs
          git rm .github/workflows/one-time-fagverk-subject-page-contract.yml
          git add \
            DOCS.md \
            README/README.pensum.md \
            docs/README.md \
            docs/documentation_registry.json \
            docs/FAGVERK_SUBJECT_PAGE_CONTRACT.md \
            docs/FAGVERK.md \
            docs/FAGVERK_NAVIGATION.md \
            docs/FAGVERK_PLACE_DESIGN.md \
            docs/SUBJECT_FILE_CONTRACT.md \
            docs/DATA_PRODUCTION_CONTRACT.md \
            .github/workflows/fagverk.yml \
            tests/fagverk-documentation-contract.test.mjs \
            reports/documentation-governance/inventory.json
          git diff --cached --check
          git commit -m "Dokumenter bygging av alle fagsider"
          git push origin "HEAD:${BRANCH}"
