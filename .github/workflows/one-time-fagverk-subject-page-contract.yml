name: TEMP materialize fagverk subject-page contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/one-time-fagverk-subject-page-contract.mjs'
      - '.github/workflows/one-time-fagverk-subject-page-contract.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/fagverk-all-subject-pages-contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check one-time runner
        run: node --check scripts/one-time-fagverk-subject-page-contract.mjs
      - name: Materialize canonical documentation
        run: |
          node scripts/one-time-fagverk-subject-page-contract.mjs
          node <<'NODE'
          const fs = require('fs');
          const file = 'docs/README.md';
          let source = fs.readFileSync(file, 'utf8');
          if (!source.includes('FAGVERK_PLACE_DESIGN.md')) {
            const marker = '3. [`FAGVERK_NAVIGATION.md`](./FAGVERK_NAVIGATION.md) — bindende skille mellom Fagverkforsiden, merkesider og fagsider';
            if (!source.includes(marker)) throw new Error('Mangler FAGVERK_NAVIGATION-markør i docs/README.md');
            source = source.replace(marker, `${marker}\n4. [\`FAGVERK_PLACE_DESIGN.md\`](./FAGVERK_PLACE_DESIGN.md) — bindende kategori-, bilde- og presentasjonskontrakt for stedets egne fagverksider`);
            fs.writeFileSync(file, source, 'utf8');
          }
          NODE
          cat > tests/fagverk-documentation-contract.test.mjs <<'TEST'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const read = (file) => fs.readFileSync(path.join(root, file), 'utf8');
          const json = (file) => JSON.parse(read(file));
          const contractPath = 'docs/FAGVERK_SUBJECT_PAGE_CONTRACT.md';

          test('canonical fagsidekontrakt dekker hele produksjonskjeden', () => {
            const contract = read(contractPath);
            for (const phrase of [
              'Én generell fagsidemotor',
              'Normalisert runtime-modell',
              'Adapterfamilier',
              'Teknisk status og redaksjonell status er to forskjellige ting',
              'Claims, kilder og inspectability',
              'To separate reviewporter',
              'Ferdigkriterier',
              'Produksjonsrekkefølge',
              'Permanent kvalitetsporter'
            ]) assert.ok(contract.includes(phrase), phrase);
            assert.ok(contract.includes('fagverk.html?subject=<subject_id>'));
            assert.ok(contract.includes('blocked'));
            assert.ok(contract.includes('data/fagverk/fagverk_subject_status.json'));
          });

          test('kontrakten viser til alle relevante autoriteter', () => {
            const contract = read(contractPath);
            for (const reference of [
              'documentation_registry.json',
              'FACTUALITY_CONTRACT.md',
              'HISTORY_GO_TECHNICAL_ARCHITECTURE.md',
              'DOMAIN_CONTRACT.md',
              'category_contract.json',
              'SUBJECT_FILE_CONTRACT.md',
              'README.pensum.md',
              'fagstrukturREADME.md',
              'FAGVERK_NAVIGATION.md',
              'FAGVERK.md',
              'DATA_PRODUCTION_CONTRACT.md',
              'KNOWLEDGE_ARCHITECTURE.md',
              'QUIZ_PRODUCTION_CANONICAL.md',
              'QUIZ_TEMPLATE_REGISTRY_V2.json',
              'PLACE_PRODUCTION_CHECKLIST.md',
              'PLACE_STANDARD.md',
              'FAGVERK_PLACE_DESIGN.md',
              'COMPLETION_DEFINITIONS.md',
              'HISTORY_GO_PRODUCT_MAP.md',
              'TYPESCRIPT_FIRST_POLICY.md',
              'TEAM_WORKFLOW.md',
              'data/fag/fag_manifest.json',
              'data/fagverk/fagverk_portal.json',
              'data/fagverk/fagverk_registry.json'
            ]) assert.ok(contract.includes(reference), reference);
          });

          test('alle canonicale fag er eksplisitt med i fagmatrisen', () => {
            const contract = read(contractPath);
            const categories = json('data/categories/category_contract.json');
            assert.equal(categories.fagSubjects.length, 18);
            for (const subjectId of categories.fagSubjects) {
              assert.ok(contract.includes(`| \`${subjectId}\` |`), subjectId);
            }
          });

          test('dokumentasjonsregisteret har entydige fagverksroller', () => {
            const registry = json('docs/documentation_registry.json');
            const byPath = new Map(registry.documents.map((entry) => [entry.path, entry]));
            const canonical = byPath.get(contractPath);
            assert.equal(canonical?.status, 'canonical');
            assert.ok(canonical?.owns.includes('fagverk_subject_page_contract'));
            assert.equal(byPath.get('docs/FAGVERK_NAVIGATION.md')?.status, 'canonical');
            assert.equal(byPath.get('docs/FAGVERK.md')?.status, 'operational');
            assert.equal(byPath.get('docs/FAGVERK_PLACE_DESIGN.md')?.status, 'canonical');
            assert.ok(registry.priority_order.includes(contractPath));

            const owners = new Map();
            for (const entry of registry.documents) {
              for (const owner of entry.owns || []) {
                assert.equal(owners.has(owner), false, `${owner}: ${owners.get(owner)} / ${entry.path}`);
                owners.set(owner, entry.path);
              }
            }
          });

          test('alle dokumentasjonsinnganger peker til fagsidekontrakten', () => {
            for (const file of [
              'DOCS.md',
              'docs/README.md',
              'docs/FAGVERK.md',
              'docs/FAGVERK_NAVIGATION.md',
              'docs/FAGVERK_PLACE_DESIGN.md',
              'docs/SUBJECT_FILE_CONTRACT.md',
              'docs/DATA_PRODUCTION_CONTRACT.md',
              'README/README.pensum.md'
            ]) assert.ok(read(file).includes('FAGVERK_SUBJECT_PAGE_CONTRACT.md'), file);
          });

          test('fagverk-workflowen håndhever dokumentasjonskontrakten', () => {
            const workflow = read('.github/workflows/fagverk.yml');
            assert.ok(workflow.includes("docs/FAGVERK_SUBJECT_PAGE_CONTRACT.md"));
            assert.ok(workflow.includes("tests/fagverk-documentation-contract.test.mjs"));
            assert.ok(workflow.includes("node --test tests/fagverk-documentation-contract.test.mjs"));
          });
          TEST
      - name: Install and build documentation tooling
        run: |
          npm ci --no-audit --no-fund
          npm run build:scripts
      - name: Regenerate and verify documentation governance
        run: node dist/scripts/check-documentation-governance.mjs
      - name: Verify permanent documentation test
        run: node --test tests/fagverk-documentation-contract.test.mjs
      - name: Verify existing fagverk integration
        run: |
          node --test tests/fagverk-portal.test.mjs
          node --test tests/fagverk-content.test.mjs
          node --test tests/fagverk-link-audit.test.mjs
          node -e "JSON.parse(require('fs').readFileSync('docs/documentation_registry.json','utf8'))"
          git diff --check
      - name: Remove one-time runner and commit durable result
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --worktree --staged dist 2>/dev/null || true
          git rm scripts/one-time-fagverk-subject-page-contract.mjs
          git rm .github/workflows/one-time-fagverk-subject-page-contract.yml
          git add \
            DOCS.md \
            README/README.pensum.md \
            docs/README.md \
            docs/documentation_registry.json \
            docs/FAGVERK_SUBJECT_PAGE_CONTRACT.md \
            docs/FAGVERK.md \
            docs/FAGVERK_NAVIGATION.md \
            docs/FAGVERK_PLACE_DESIGN.md \
            docs/SUBJECT_FILE_CONTRACT.md \
            docs/DATA_PRODUCTION_CONTRACT.md \
            .github/workflows/fagverk.yml \
            tests/fagverk-documentation-contract.test.mjs \
            reports/documentation-governance/inventory.json
          git diff --cached --check
          git commit -m "Dokumenter bygging av alle fagsider"
          git push origin "HEAD:${BRANCH}"
