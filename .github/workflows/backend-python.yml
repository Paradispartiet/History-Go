name: Backend Python guard

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-python.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-python.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python lint and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend[dev]'

      - name: Ruff lint
        id: ruff-lint
        run: |
          mkdir -p reports/backend-ci
          set -o pipefail
          python -m ruff check backend 2>&1 \
            | tee reports/backend-ci/ruff-lint.log

      - name: Upload Ruff lint diagnostics
        if: failure() && steps.ruff-lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: backend-ruff-lint-diagnostics-${{ github.run_id }}
          path: reports/backend-ci/ruff-lint.log
          if-no-files-found: error

      - name: Ruff format check
        id: ruff-format
        run: |
          mkdir -p reports/backend-ci
          set -o pipefail
          python -m ruff format --check --diff backend 2>&1 \
            | tee reports/backend-ci/ruff-format.diff

      - name: Upload Ruff format diff
        if: failure() && steps.ruff-format.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: backend-ruff-format-diff-${{ github.run_id }}
          path: reports/backend-ci/ruff-format.diff
          if-no-files-found: error

      - name: Mypy strict typecheck
        id: mypy
        run: |
          mkdir -p reports/backend-ci
          set -o pipefail
          python -m mypy backend/app 2>&1 \
            | tee reports/backend-ci/mypy.log

      - name: Upload mypy diagnostics
        if: failure() && steps.mypy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: backend-mypy-diagnostics-${{ github.run_id }}
          path: reports/backend-ci/mypy.log
          if-no-files-found: error

  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend[dev]'

      - name: Pytest with coverage
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80
