name: Oslo coordinate batch 25 evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oslo-coordinate-batch-25-evidence.yml'

permissions:
  contents: read

jobs:
  evidence:
    if: github.event.pull_request.head.ref == 'agent/oslo-coordinate-control-batch-25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect read-only batch 25 evidence
        shell: bash
        run: |
          set -u
          OUT='reports/oslo-coordinate-control-batch-25/evidence-pass'
          mkdir -p "$OUT"

          run_finder() {
            local address="$1"
            local file="$2"
            set +e
            set -o pipefail
            npm run places:coords:find:address -- --address "$address" | tee "$OUT/$file"
            local code=${PIPESTATUS[0]}
            set +o pipefail
            set -e
            printf '%s\n' "$code" > "$OUT/$file.exit-status.txt"
            return 0
          }

          run_curl() {
            local url="$1"
            local file="$2"
            set +e
            curl --retry 3 --retry-delay 2 -fsSL -A 'History-Go-coordinate-audit/1.0' "$url" \
              | tee "$OUT/$file" >/dev/null
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$code" > "$OUT/$file.exit-status.txt"
            return 0
          }

          set -e
          run_finder 'Sommerrogata 1 Oslo' 'oslo_kraftselskap-sommerrogata-1-geonorge.json'
          run_finder 'Akershusstranda 23 Oslo' 'vippetangen_fisketorg-akershusstranda-23-geonorge.json'

          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Grensen%20Oslo' \
            'grensen_kjopesenter-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Frysja%20industriomr%C3%A5de%20Oslo' \
            'frysja_industriomrade-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Bryn%20industriomr%C3%A5de%20Oslo' \
            'bryn_industriomrade-nominatim.json'
          run_curl 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&namedetails=1&q=Norges%20Varemesse%20Sj%C3%B8lyst%20Oslo' \
            'norges_varemesse-sjolyst-nominatim.json'

          cat > "$OUT/source-notes.md" <<'EOF'
          # Batch 25 – identitetsnotater før integrasjon

          - `jernbanetorget_trafikknutepunkt`: repoet har allerede canonical `jernbanetorget` for samme fysiske byrom. Næringslivsrecorden behandles som identitetsduplikat, ikke som et nytt koordinatpunkt.
          - `oslo_kraftselskap`: Oslo byleksikon dokumenterer Oslo Lysverkers monumentale hovedbygning i Sommerrogata 1. Adressepunkt kan bare anvendes dersom Geonorge gir ett entydig treff og bygget brukes eksplisitt som representativt institusjonsanker.
          - `grensen_kjopesenter`: aktiv record beskriver hele gaten Grensen, ikke et kjøpesenter. Gategeometri eller flere ankere kreves; ett tilfeldig gatepunkt skal ikke godkjennes.
          - `vippetangen_fisketorg`: Oslo byleksikon dokumenterer at fisketorget/fiskehavna flyttet til Vippetangen i 1905, og at dagens Fiskehallen i Akershusstranda 23 åpnet i en senere fase. Adresseoppslaget er derfor bare en identitetskandidat, ikke automatisk anker for den brede historiske recorden.
          - `frysja_industriomrade`: Oslo kommune og Oslo byleksikon beskriver Frysja som et bredt bolig- og industri-/transformasjonsområde. Et punkt krever dokumentert områdeanker eller geometri.
          - `norges_varemesse`: institusjonen har hatt flere fysiske hovedsteder – Akershus, Sjølyst og siden 2002 Lillestrøm – og skiftet navn til NOVA Spektrum i 2021. Ett Oslo-punkt kan ikke godkjennes uten eksplisitt tidsavgrenset fysisk scope.
          - `bryn_industriomrade`: Oslo byleksikon og kommuneplanen beskriver Bryn som et større industri-, bolig- og utviklingsstrøk. Et punkt krever dokumentert områdeanker eller geometri, ikke nærmeste adresse.
          EOF

      - name: Upload evidence pass
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oslo-coordinate-batch-25-evidence
          path: reports/oslo-coordinate-control-batch-25/evidence-pass
          if-no-files-found: error
