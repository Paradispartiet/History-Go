name: Materialize fagverk upgrade

on:
  push:
    branches:
      - agent/fagverk-place-pages-and-content-20260728
    paths:
      - '.github/workflows/tmp-materialize-fagverk-upgrade.yml'
      - 'tmp/fagverk-upgrade/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fagverk-place-pages-and-content-20260728
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and extract package
        run: |
          cat tmp/fagverk-upgrade/chunk-*.b64 | tr -d '\n\r' | base64 --decode > /tmp/fagverk-upgrade.tar.gz
          tar -tzf /tmp/fagverk-upgrade.tar.gz
          tar -xzf /tmp/fagverk-upgrade.tar.gz -C .
      - name: Run fagverk checks
        run: |
          node --check js/fagverk.js
          node --check js/ui/place-learning-surface.js
          if [ -f js/fagverk-place.js ]; then node --check js/fagverk-place.js; fi
          node --test tests/fagverk-content.test.mjs
          node --test tests/place-learning-surface.test.js
          if [ -f tests/fagverk-place-pages.test.mjs ]; then node --test tests/fagverk-place-pages.test.mjs; fi
      - name: Remove package chunks
        run: rm -rf tmp/fagverk-upgrade
      - name: Commit materialized files
        run: |
          git config user.name "history-go-fagverk-bot"
          git config user.email "history-go-fagverk-bot@users.noreply.github.com"
          git add -A
          git reset .github/workflows/tmp-materialize-fagverk-upgrade.yml
          git diff --cached --quiet && exit 0
          git commit -m "Skill fagkapitler fra egne stedssider"
          git push origin HEAD:agent/fagverk-place-pages-and-content-20260728
