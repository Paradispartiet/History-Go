name: TEMP history people sync

on:
  push:
    branches:
      - agent/klassekampen-phase2-v3-20261004
    paths:
      - .github/workflows/tmp-history-people-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/klassekampen-phase2-v3-20261004
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run civication:history-people:build
      - name: Commit generated index
        run: |
          git add data/Civication/historyPeople_index.json
          if git diff --cached --quiet; then
            echo "Index already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Civication history people index"
          git push origin HEAD:agent/klassekampen-phase2-v3-20261004
