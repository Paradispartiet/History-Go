name: TEMP Klassekampen Phase 1 materialization

on:
  push:
    branches:
      - agent/klassekampen-phase-1-20260915
    paths:
      - .github/workflows/tmp-klassekampen-phase1-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact phase branch
        uses: actions/checkout@v4
        with:
          ref: agent/klassekampen-phase-1-20260915
          fetch-depth: 0

      - name: Verify locked ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 458ab1e5ddea12c6035593bd3ee661a30084f549 HEAD
          test "$(git rev-parse 458ab1e5ddea12c6035593bd3ee661a30084f549)" = "458ab1e5ddea12c6035593bd3ee661a30084f549"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize canonical Phase 1 sources
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const readJson = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const writeJson = (p, v) => fs.writeFileSync(p, `${JSON.stringify(v, null, 2)}\n`);
          const decode = (v) => JSON.parse(zlib.gunzipSync(Buffer.from(v, 'base64')).toString('utf8'));

          const PLACE_PATCH = '';
          const PRODUCTION = '';
          const SPRAK = '';

          const placePath = 'data/places/media/oslo/places_oslo_media/klassekampen_redaksjon.json';
          const place = readJson(placePath);
          if (place.id !== 'klassekampen_redaksjon') throw new Error('Unexpected Klassekampen place id');
          const actualIdentity = JSON.stringify({lat: place.lat, lon: place.lon, sourceObjectId: place.sourceObjectId});
          const lockedIdentity = JSON.stringify({lat: 59.91335273517942, lon: 10.759577592129606, sourceObjectId: 'geonorge-adresser-v1:0301:12446:4'});
          if (actualIdentity !== lockedIdentity) throw new Error('Locked Grønland 4 coordinate identity drifted');
          Object.assign(place, decode(PLACE_PATCH));
          writeJson(placePath, place);

          const production = decode(PRODUCTION);
          writeJson('data/places/production/klassekampen_redaksjon.json', production);

          const sprakPath = 'data/leksikon/sprak/places/europe/norway/oslo/klassekampen_redaksjon.json';
          writeJson(sprakPath, decode(SPRAK));

          const sprakManifestPath = 'data/leksikon/sprak/manifest.json';
          const sprakManifest = readJson(sprakManifestPath);
          sprakManifest.place_files ||= {};
          if (sprakManifest.place_files.klassekampen_redaksjon && sprakManifest.place_files.klassekampen_redaksjon !== sprakPath) {
            throw new Error('Conflicting Klassekampen Språkleksikon manifest row');
          }
          sprakManifest.place_files.klassekampen_redaksjon = sprakPath;
          writeJson(sprakManifestPath, sprakManifest);

          const registryPath = 'data/fagverk/fagverk_registry.json';
          const registry = readJson(registryPath);
          registry.placeLinks ||= {};
          const expectedRegistryRow = {
            sourceFile: 'places/media/oslo/places_oslo_media/klassekampen_redaksjon.json',
            field: 'fagverk',
            schema: 'history_go_place_fagverk_v2',
            level: 'standard',
            status: 'curated'
          };
          if (registry.placeLinks.klassekampen_redaksjon && JSON.stringify(registry.placeLinks.klassekampen_redaksjon) !== JSON.stringify(expectedRegistryRow)) {
            throw new Error('Conflicting Klassekampen Fagverk registry row');
          }
          registry.placeLinks.klassekampen_redaksjon = expectedRegistryRow;
          writeJson(registryPath, registry);
          NODE

      - name: Regenerate owner-controlled outputs
        shell: bash
        run: |
          set -euo pipefail
          npm run places:index:build
          node scripts/build-fagverk-release-manifest.mjs
          npm run epoker:places:build

      - name: Validate Phase 1 contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run places:index:check
          node scripts/build-fagverk-release-manifest.mjs --check
          npm run epoker:places:check
          node --test tests/epoke-place-index.test.mjs
          npm run leksikon:ids:check
          node scripts/validate-place-description-production-v4_2_policy.mjs --all
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const manifest = JSON.parse(fs.readFileSync('data/leksikon/sprak/manifest.json', 'utf8'));
          const entry = JSON.parse(fs.readFileSync('data/leksikon/sprak/places/europe/norway/oslo/klassekampen_redaksjon.json', 'utf8'));
          assert.equal(manifest.place_files.klassekampen_redaksjon, 'data/leksikon/sprak/places/europe/norway/oslo/klassekampen_redaksjon.json');
          assert.equal(entry.place_id, 'klassekampen_redaksjon');
          assert.ok(Array.isArray(entry.entries) && entry.entries.length >= 1);
          for (const row of entry.entries) {
            assert.ok(row.id && row.term && row.type && row.meaning);
            for (const source of row.sources || []) assert.match(source.url, /^https:\/\//);
          }
          const production = JSON.parse(fs.readFileSync('data/places/production/klassekampen_redaksjon.json', 'utf8'));
          assert.equal(production.claims.length, 12);
          assert.deepEqual(production.claims.filter(c => c.timelineYear).map(c => c.timelineYear).sort((a,b)=>a-b), [1969,1969,1973,1977,1991,1996,2002,2018]);
          NODE

      - name: Record Phase 1 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const workcardPath = 'reports/place-production/klassekampen-workcard-current.json';
          const workcard = JSON.parse(fs.readFileSync(workcardPath, 'utf8'));
          workcard.phase = 'PHASE 1 COMPLETE — SOURCE-BOUND PLACE / FAGVERK / SPRÅKLEKSIKON / CHRONOLOGY';
          workcard.activePhase = 'Fase 1 — complete; Fase 2 not started';
          workcard.activeFileScope = [
            'data/places/media/oslo/places_oslo_media/klassekampen_redaksjon.json',
            'data/places/production/klassekampen_redaksjon.json',
            'data/leksikon/sprak/places/europe/norway/oslo/klassekampen_redaksjon.json',
            'data/leksikon/sprak/manifest.json',
            'data/fagverk/fagverk_registry.json',
            'data/fagverk/fagverk_release.json',
            'data/places/places_index.json',
            'data/epoker/epoke-place-index.json'
          ];
          workcard.contentChangesStarted = true;
          workcard.verifiedAt = '2026-09-15';
          workcard.status = 'phase_1_complete';
          workcard.fagverkStatus = 'PASS — Place-owned Fagverk v2 materialized and registered; release manifest regenerated through its owner builder';
          workcard.sprakleksikonStatus = 'PASS — canonical Klassekampen place-language file materialized and bound through the Språkleksikon manifest';
          workcard.chronologyStatus = 'PASS — 1969, 1973, 1977, 1991, 1996, 2002 and 2018 are source-bound in the canonical production package; epoke output regenerated by its owner script; no Grønland 4 move-in year invented';
          if (Array.isArray(workcard.blockingGates)) workcard.blockingGates = workcard.blockingGates.filter((gate) => !String(gate).startsWith('Phase 1 source-bound'));
          fs.writeFileSync(workcardPath, `${JSON.stringify(workcard, null, 2)}\n`);

          const reviewPath = 'reports/place-production/klassekampen-source-review-v1.md';
          let review = fs.readFileSync(reviewPath, 'utf8');
          const marker = '## Fase 1-materialisering — 2026-09-15';
          if (!review.includes(marker)) {
            review = review.replace(/\s*$/, '') + `\n\n${marker}\n\nFase 1 er materialisert fail-closed fra låst base \`458ab1e5ddea12c6035593bd3ee661a30084f549\`.\n\n- Canonical Place har de fire bekreftede Media-underbadgene, kildebundet \`desc\`/\`popupDesc\`, Place-eid Fagverk v2 og inspectable \`externalLinks\`.\n- \`data/places/production/klassekampen_redaksjon.json\` er canonical v4.2-produksjonspakke med 12 verifiserte claims og eksplisitt setningsdekning.\n- Språkleksikonet har ett avgrenset stedsspor for publikasjonsnavnet «Klassekampen»; dagens avis skilles fra det generelle uttrykket og den separate 1909–1940-avisen.\n- Chronology er kildebundet til 1969, 1973, 1977, 1991, 1996, 2002 og 2018. Grønland 4 behandles bare som dokumentert nåværende redaksjonsadresse; ingen innflyttingsdato er konstruert.\n- \`data/epoker/epoke-place-index.json\`, \`data/places/places_index.json\` og Fagverk-release er regenerert med sine eierkommandoer og kontrollert i sync.\n- Ingen People-, Object-, Brand-, Production-/Kunstverk-collection, bilde/frontImage, quiz, QuizCard eller \`place-open\`-runtime er materialisert i denne fasen.\n\nNeste gate er Fase 2.\n`;
          }
          fs.writeFileSync(reviewPath, review);
          NODE

      - name: Enforce exact Phase 1 write surface
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r line; do
            path="${line:3}"
            case "$path" in
              data/places/media/oslo/places_oslo_media/klassekampen_redaksjon.json|data/places/production/klassekampen_redaksjon.json|data/leksikon/sprak/places/europe/norway/oslo/klassekampen_redaksjon.json|data/leksikon/sprak/manifest.json|data/fagverk/fagverk_registry.json|data/fagverk/fagverk_release.json|data/places/places_index.json|data/epoker/epoke-place-index.json|reports/place-production/klassekampen-source-review-v1.md|reports/place-production/klassekampen-workcard-current.json|.github/workflows/tmp-klassekampen-phase1-materialize.yml)
                ;;
              *)
                echo "UNEXPECTED_PHASE1_PATH $path"
                bad=1
                ;;
            esac
          done < <(git status --porcelain)
          git status --short
          test "$bad" -eq 0

      - name: Commit Phase 1 and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-klassekampen-phase1-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/media/oslo/places_oslo_media/klassekampen_redaksjon.json data/places/production/klassekampen_redaksjon.json data/leksikon/sprak/places/europe/norway/oslo/klassekampen_redaksjon.json data/leksikon/sprak/manifest.json data/fagverk/fagverk_registry.json data/fagverk/fagverk_release.json data/places/places_index.json data/epoker/epoke-place-index.json reports/place-production/klassekampen-source-review-v1.md reports/place-production/klassekampen-workcard-current.json .github/workflows/tmp-klassekampen-phase1-materialize.yml
          git diff --cached --name-only
          git commit -m 'Materialize Klassekampen Phase 1 sources and chronology'
          git push origin HEAD:agent/klassekampen-phase-1-20260915
