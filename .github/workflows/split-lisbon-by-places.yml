name: Split Lisbon by places

on:
  push:
    branches:
      - data/split-lisbon-by-places-20260709

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/split-lisbon-by-places-20260709
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/split-lisbon-by-places.mjs
      - run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add data/places/by/europe/portugal/lisbon/places_lisbon_by data/places/by/europe/portugal/lisbon/places_lisbon_by_manifest.json data/places/by/europe/portugal/lisbon/places_lisbon_by_index.json data/places/by/europe/portugal/lisbon/places_lisbon_by_split_report.txt
          if git diff --cached --quiet; then
            echo "No generated file changes."
          else
            git commit -m "Generate split Lisbon by place files"
            git push
          fi
