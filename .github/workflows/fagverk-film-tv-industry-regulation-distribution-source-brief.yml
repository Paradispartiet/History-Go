name: Fagverk Film og TV industry regulation distribution fulltext

on:
  pull_request:
    paths:
      - "data/fag/TV_og_Film/film_tv_industry_regulation_distribution_*.json"
      - "data/fagverk/film_tv/industri-regulering-og-distribusjon.json"
      - "data/fagverk/film_tv/industri-regulering-og-distribusjon/**"
      - "data/fagverk/fagverk_registry.json"
      - "data/fagverk/subject_status.json"
      - "data/fagverk/fagverk_release.json"
      - "scripts/brief-film-tv-industry-regulation-distribution-sources-v1.mjs"
      - "scripts/materialize-film-tv-industry-regulation-distribution-fulltext-v1.mjs"
      - "scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs"
      - "scripts/audit-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs"
      - "tests/film-tv-industry-regulation-distribution-source-brief-v1.test.mjs"
      - "tests/film-tv-industry-regulation-distribution-fulltext-v1.test.mjs"
      - "reports/fagverk/film-tv-industry-regulation-distribution-source-brief-v1-audit.json"
      - "reports/fagverk/film-tv-industry-regulation-distribution-fulltext-v1-audit.json"
      - "reports/fagverk/film-tv-phase3-audit.json"
      - "reports/fagverk/general-engine-audit.json"
      - ".github/workflows/fagverk-film-tv-industry-regulation-distribution-source-brief.yml"
  push:
    branches: [main]
    paths:
      - "data/fag/TV_og_Film/film_tv_industry_regulation_distribution_*.json"
      - "data/fagverk/film_tv/industri-regulering-og-distribusjon.json"
      - "data/fagverk/film_tv/industri-regulering-og-distribusjon/**"
      - "data/fagverk/fagverk_registry.json"
      - "data/fagverk/subject_status.json"
      - "data/fagverk/fagverk_release.json"
      - "scripts/brief-film-tv-industry-regulation-distribution-sources-v1.mjs"
      - "scripts/materialize-film-tv-industry-regulation-distribution-fulltext-v1.mjs"
      - "scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs"
      - "scripts/audit-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs"
      - "tests/film-tv-industry-regulation-distribution-source-brief-v1.test.mjs"
      - "tests/film-tv-industry-regulation-distribution-fulltext-v1.test.mjs"
      - "reports/fagverk/film-tv-industry-regulation-distribution-source-brief-v1-audit.json"
      - "reports/fagverk/film-tv-industry-regulation-distribution-fulltext-v1-audit.json"
      - "reports/fagverk/film-tv-phase3-audit.json"
      - "reports/fagverk/general-engine-audit.json"
      - ".github/workflows/fagverk-film-tv-industry-regulation-distribution-source-brief.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fagverk-film-tv-unit10-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate industry regulation distribution fulltext
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate syntax
        run: |
          node --check scripts/brief-film-tv-industry-regulation-distribution-sources-v1.mjs
          node --check scripts/materialize-film-tv-industry-regulation-distribution-fulltext-v1.mjs
          node --check scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs
          node --check scripts/audit-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs
          node --check tests/film-tv-industry-regulation-distribution-source-brief-v1.test.mjs
          node --check tests/film-tv-industry-regulation-distribution-fulltext-v1.test.mjs

      - name: Validate source brief contract for current progression
        run: |
          if node -e "const fs=require('node:fs'); const registry=JSON.parse(fs.readFileSync('data/fagverk/fagverk_registry.json','utf8')); process.exit(registry.subjects.film_tv.chapters.some((row)=>row.id==='industri-regulering-og-distribusjon') ? 0 : 1)"; then
            echo 'Enhet 10 er registrert; validerer fulltekstkontrakten som monoton historisk videreføring.'
            node --test tests/film-tv-industry-regulation-distribution-fulltext-v1.test.mjs
          else
            echo 'Enhet 10 er ikke registrert; validerer den opprinnelige pre-registration-kildebriefen.'
            node scripts/brief-film-tv-industry-regulation-distribution-sources-v1.mjs
            node --test tests/film-tv-industry-regulation-distribution-source-brief-v1.test.mjs
          fi

      - name: Materialize unit 10 runtime state
        run: node scripts/materialize-film-tv-industry-regulation-distribution-fulltext-v1.mjs --write

      - name: Build deterministic release
        run: node scripts/build-fagverk-release-manifest.mjs

      - name: Refresh shared general engine audit
        run: node scripts/audit-fagverk-general-engine.mjs --write-report

      - name: Refresh unit 10 fulltext audit
        run: node scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs --write-report

      - name: Refresh shared Film and TV phase 3 audit
        run: node scripts/audit-fagverk-film-tv-phase3.mjs --write-report

      - name: Validate unit 10 fulltext
        run: node --test tests/film-tv-industry-regulation-distribution-fulltext-v1.test.mjs

      - name: Validate completed unit 9 remains monotone
        run: |
          node scripts/audit-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs
          node --test tests/film-tv-creative-work-technology-responsibility-fulltext-v1.test.mjs

      - name: Validate shared Film and TV baseline
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-film-tv-phase3.test.mjs
          node --test tests/film-tv-learning-order-plan-v1.test.mjs
          node --test tests/film-tv-learning-order-monotone-regression-v1.test.mjs
          node --test tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs

      - name: Persist deterministic unit 10 outputs on PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/fagverk/film_tv/industri-regulering-og-distribusjon.json \
            data/fagverk/film_tv/industri-regulering-og-distribusjon/01-institusjoner-stotte-samproduksjon-og-markeder.json \
            data/fagverk/film_tv/industri-regulering-og-distribusjon/02-eierskap-plattformer-og-publikumsmaling.json \
            data/fagverk/film_tv/industri-regulering-og-distribusjon/03-rettigheter-vinduer-formater-og-uformell-sirkulasjon.json \
            data/fagverk/film_tv/industri-regulering-og-distribusjon/04-klassifisering-regulering-og-ytringsrom.json \
            data/fagverk/film_tv/industri-regulering-og-distribusjon/brief.json \
            data/fagverk/film_tv/industri-regulering-og-distribusjon/claims.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_status.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/general-engine-audit.json \
            reports/fagverk/film-tv-phase3-audit.json \
            reports/fagverk/film-tv-industry-regulation-distribution-fulltext-v1-audit.json
          if git diff --cached --quiet; then
            echo 'Unit 10 deterministic outputs already match.'
            exit 0
          fi
          git commit -m 'Materialize Film TV unit 10 runtime state'
          git push origin "HEAD:${HEAD_BRANCH}"
