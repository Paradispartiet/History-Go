name: Fagverk Film og TV industry regulation distribution fulltext

on:
  pull_request:
    paths:
      - "data/fag/TV_og_Film/film_tv_industry_regulation_distribution_*.json"
      - "data/fagverk/film_tv/industri-regulering-og-distribusjon.json"
      - "data/fagverk/film_tv/industri-regulering-og-distribusjon/**"
      - "scripts/brief-film-tv-industry-regulation-distribution-sources-v1.mjs"
      - "scripts/materialize-film-tv-industry-regulation-distribution-fulltext-v1.mjs"
      - "scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs"
      - "scripts/audit-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs"
      - "tests/film-tv-industry-regulation-distribution-source-brief-v1.test.mjs"
      - "tests/film-tv-industry-regulation-distribution-fulltext-v1.test.mjs"
      - "reports/fagverk/film-tv-industry-regulation-distribution-source-brief-v1-audit.json"
      - "reports/fagverk/film-tv-industry-regulation-distribution-fulltext-v1-audit.json"
      - "reports/fagverk/film-tv-phase3-audit.json"
      - "reports/fagverk/general-engine-audit.json"
      - ".github/workflows/fagverk-film-tv-industry-regulation-distribution-source-brief.yml"
  push:
    branches: [main]
    paths:
      - "data/fag/TV_og_Film/film_tv_industry_regulation_distribution_*.json"
      - "data/fagverk/film_tv/industri-regulering-og-distribusjon.json"
      - "data/fagverk/film_tv/industri-regulering-og-distribusjon/**"
      - "scripts/brief-film-tv-industry-regulation-distribution-sources-v1.mjs"
      - "scripts/materialize-film-tv-industry-regulation-distribution-fulltext-v1.mjs"
      - "scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs"
      - "scripts/audit-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs"
      - "tests/film-tv-industry-regulation-distribution-source-brief-v1.test.mjs"
      - "tests/film-tv-industry-regulation-distribution-fulltext-v1.test.mjs"
      - "reports/fagverk/film-tv-industry-regulation-distribution-source-brief-v1-audit.json"
      - "reports/fagverk/film-tv-industry-regulation-distribution-fulltext-v1-audit.json"
      - "reports/fagverk/film-tv-phase3-audit.json"
      - "reports/fagverk/general-engine-audit.json"
      - ".github/workflows/fagverk-film-tv-industry-regulation-distribution-source-brief.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate industry regulation distribution fulltext
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate syntax
        run: |
          node --check scripts/brief-film-tv-industry-regulation-distribution-sources-v1.mjs
          node --check scripts/materialize-film-tv-industry-regulation-distribution-fulltext-v1.mjs
          node --check scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs
          node --check scripts/audit-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs
          node --check tests/film-tv-industry-regulation-distribution-source-brief-v1.test.mjs
          node --check tests/film-tv-industry-regulation-distribution-fulltext-v1.test.mjs

      - name: Rebuild deterministic unit 10 state without rewinding later progression
        run: |
          if node -e "const r=require('./data/fagverk/fagverk_registry.json'); process.exit(r.subjects?.film_tv?.canonicalModel?.eleventhSourceClaimBrief ? 0 : 1)"; then
            echo 'Unit 11 or later is registered; preserve global Film and TV progression.'
          else
            node scripts/materialize-film-tv-industry-regulation-distribution-fulltext-v1.mjs --write
          fi
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs --write-report
          node scripts/audit-fagverk-film-tv-phase3.mjs --write-report

      - name: Verify committed deterministic outputs
        run: |
          git diff --exit-code -- \
            data/fagverk/film_tv/industri-regulering-og-distribusjon.json \
            data/fagverk/film_tv/industri-regulering-og-distribusjon/brief.json \
            data/fagverk/film_tv/industri-regulering-og-distribusjon/claims.json \
            data/fagverk/fagverk_registry.json \
            data/fagverk/subject_status.json \
            data/fagverk/fagverk_release.json \
            reports/fagverk/general-engine-audit.json \
            reports/fagverk/film-tv-phase3-audit.json \
            reports/fagverk/film-tv-industry-regulation-distribution-fulltext-v1-audit.json

      - name: Validate unit 10 fulltext and immutable source brief
        run: |
          node scripts/audit-film-tv-industry-regulation-distribution-fulltext-v1.mjs
          node --test tests/film-tv-industry-regulation-distribution-fulltext-v1.test.mjs
          node --test tests/film-tv-industry-regulation-distribution-source-brief-v1.test.mjs

      - name: Validate completed unit 9 remains monotone
        run: |
          node scripts/audit-film-tv-creative-work-technology-responsibility-fulltext-v1.mjs
          node --test tests/film-tv-creative-work-technology-responsibility-fulltext-v1.test.mjs

      - name: Validate shared Film and TV baseline
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-film-tv-phase3.test.mjs
          node --test tests/film-tv-learning-order-plan-v1.test.mjs
          node --test tests/film-tv-learning-order-monotone-regression-v1.test.mjs
          node --test tests/film-tv-representation-position-counterimages-monotone-regression-v1.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
