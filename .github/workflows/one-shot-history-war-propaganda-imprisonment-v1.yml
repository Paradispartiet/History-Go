name: One-shot History war propaganda and imprisonment V1

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/history-war-propaganda-imprisonment-evidence-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize canonical evidence batch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, value) => { fs.mkdirSync(path.dirname(p), {recursive:true}); fs.writeFileSync(p, `${JSON.stringify(value, null, 2)}\n`); };
          const uniq = (xs) => [...new Set(xs)];
          const sorted = (xs) => uniq(xs).sort((a,b) => String(a).localeCompare(String(b), 'nb'));
          const addUnique = (arr, key, item) => { if (!arr.some((x) => x[key] === item[key])) arr.push(item); };
          const unionInto = (obj, key, values) => { obj[key] = sorted([...(obj[key] || []), ...values]); };

          const GEO = 'geo_no_oslo_akershus';
          const PROFILE = 'profile_historie_no_oslo_akershus';
          const BATCH = 'history_war_propaganda_imprisonment_evidence_v1';
          const PROP_EMNE = 'em_his_krig_okkupasjon_propaganda_sensur_og_informasjonskontroll';
          const FANG_EMNE = 'em_his_krig_okkupasjon_fangenskap_vold_og_forfolgelse';
          const COMMON_EMNE = 'em_his_okkupasjon_motstand';
          const LEGACY_FANG = 'em_his_fangenskap_kontroll';
          const CIVIL_EMNE = 'em_his_krig_okkupasjon_sivilsamfunn_total_krig_og_hverdagsliv';

          const claimsPath = 'data/fag/historie/claims_historie_canonical_v1.json';
          const sourcesPath = 'data/fag/historie/sources_historie_canonical_v1.json';
          const evidencePath = 'data/fag/historie/place_evidence_historie_v1.json';
          const theoryPath = 'data/fag/historie/theory_evidence_historie_canonical_v1.json';
          const profilePath = 'data/fag/profiles/historie/oslo_akershus/profile.json';
          const dossierPath = 'data/fag/historie/source_dossiers/war_propaganda_imprisonment_v1.json';

          const claimsFile = read(claimsPath);
          const sourcesFile = read(sourcesPath);
          const evidenceFile = read(evidencePath);
          const theoryFile = read(theoryPath);
          const profile = read(profilePath);

          if (theoryFile.entries.length !== 69) throw new Error(`Expected 69 theory-evidence entries, got ${theoryFile.entries.length}`);
          if (theoryFile.entries.some((x) => x.theory_id === 'theory_his_krig_okkupasjon_propaganda_sensur_og_informasjonskontroll')) throw new Error('Propaganda theory already materialized');
          if (theoryFile.entries.some((x) => x.theory_id === 'theory_his_krig_okkupasjon_fangenskap_vold_og_forfolgelse')) throw new Error('Imprisonment theory already materialized');

          const sourceDefs = [
            {
              source_id: 'src_his_snl_aftenposten_occupation',
              title: 'Aftenposten', publisher: 'Store norske leksikon', source_type: 'reference_encyclopedia',
              url: 'https://snl.no/Aftenposten', language: 'nb', geography_ids: [GEO], temporal_scope: {from:1940,to:1945},
              limitations: [
                'Leksikonartikkelen sammenfatter Aftenpostens lange historie og gir bare et kortfattet bilde av redaksjonelle beslutninger, intern uenighet, selvsensur og daglig sensurpraksis under okkupasjonen.',
                'At avisen fulgte sensur og direktiver dokumenterer informasjonskontroll, men sier ikke alene hvordan hvert enkelt budskap ble mottatt av leserne eller hvilke holdninger eksponeringen skapte.'
              ],
              quality: {tier:'B', rationale:'Redigert oppslagskilde med eksplisitt avsnitt om Aftenpostens krigsår, sensur og tyske direktiver.'}
            },
            {
              source_id: 'src_his_snl_deutsche_zeitung_norwegen',
              title: 'Deutsche Zeitung in Norwegen', publisher: 'Store norske leksikon', source_type: 'reference_encyclopedia',
              url: 'https://snl.no/Deutsche_Zeitung_in_Norwegen', language: 'nb', geography_ids: [GEO], temporal_scope: {from:'1940-05-20',to:'1945-05-08'},
              limitations: [
                'Artikkelen dokumenterer avisens målgruppe, utgivelsesperiode, trykkested og opplag, men analyserer ikke systematisk hvert nummers budskap eller redaksjonelle kommandokjede.',
                'Et dokumentert opplag er et mål på produsert/distribuert avisvolum, ikke på faktisk lesing, overbevisning eller politisk virkning blant mottakerne.'
              ],
              quality: {tier:'B', rationale:'Redigert referansekilde som direkte kobler den tyske okkupasjonsavisen til Aftenpostens trykkeri og oppgir utgivelsesperiode og toppopplag.'}
            },
            {
              source_id: 'src_his_snl_nationaltheatret_wartime_control',
              title: 'Nationaltheatret', publisher: 'Store norske leksikon', source_type: 'reference_encyclopedia',
              url: 'https://snl.no/Nationaltheatret', language: 'nb', geography_ids: [GEO], temporal_scope: {from:1941,to:1945},
              limitations: [
                'Leksikonartikkelen oppsummerer konflikten, ledelsesinngrepet og publikumsboikotten, men erstatter ikke samtidige styreprotokoller, sensurdokumenter eller representative publikumsundersøkelser.',
                'Publikumsboikott viser en kollektiv respons på institusjonens okkupasjonsstyring, men dokumenterer ikke motiv eller deltakelse for hver enkelt tilskuer eller hele befolkningen.'
              ],
              quality: {tier:'B', rationale:'Redigert referansekilde for okkupasjonskonflikten, NS-ledelsen og publikumsboikotten ved Nationaltheatret.'}
            },
            {
              source_id: 'src_his_snl_mollergata_19_occupation_prison',
              title: 'Møllergata 19', publisher: 'Store norske leksikon', source_type: 'reference_encyclopedia',
              url: 'https://snl.no/M%C3%B8llergata_19', language: 'nb', geography_ids: [GEO], temporal_scope: {from:1940,to:1945},
              limitations: [
                'Leksikonartikkelen sammenfatter fengselets institusjonshistorie og dokumenterer ikke et komplett individregister over arrestasjon, avhør, tortur, transport og videre skjebne for alle fanger.',
                'At tortur og transport til Victoria terrasse forekom dokumenterer en institusjonell praksis, men innebærer ikke at hvert opphold i Møllergata fulgte samme forløp eller voldsnivå.'
              ],
              quality: {tier:'B', rationale:'Redigert referansekilde med konkret kronologi for Sipo-overtakelsen, politisk fangenskap, rettsløs internering, avhør og tortur.'}
            },
            {
              source_id: 'src_his_mia_grini_prison_camp',
              title: 'Grini prison camp', publisher: 'Grinimuseet / MiA – Museene i Akershus', source_type: 'official_museum_history',
              url: 'https://mia.no/grinimuseet/en/grini-prison-camp', language: 'en', geography_ids: [GEO], temporal_scope: {from:1941,to:1945},
              limitations: [
                'Museets sammenstilling gir institusjonell hovedkronologi og aggregerte tall, men er ikke et komplett digitalt fange- og transportregister og kan ikke brukes til å rekonstruere hver enkelt fanges behandlingsforløp.',
                'Tall for internerte, deporterte og døde må leses med kildekritikk fordi fange- og transportdokumentasjon kan være ufullstendig, og dødsfall etter deportasjon skjedde utenfor selve Grini-leiren.'
              ],
              quality: {tier:'A', rationale:'Offisiell museumskilde for Grini-leirens etablering, fangeorganisering, deportasjoner og dokumenterte dødsutfall.'}
            }
          ];
          for (const s of sourceDefs) {
            s.provenance = {repository_source:dossierPath, extracted_from:[`sources.${s.source_id}`], accessed_at:'2026-07-30'};
            s.dating = {published_at:null, updated_at:null, accessed_at:'2026-07-30'};
            addUnique(sourcesFile.sources, 'source_id', s);
          }

          const CASE_AFT = 'case_his_aftenposten_akersgata';
          const CASE_NAT = 'case_his_nationaltheatret';
          const CASE_MOL = 'case_his_mollergata_19';
          const CASE_GRI = 'case_his_grini_fangeleir';

          const claimDefs = [
            {
              claim_id:'claim_his_aftenposten_occupation_censorship_directives_1940_1945',
              statement:'Aftenposten kom ut gjennom hele okkupasjonen og måtte, som andre norske aviser som fortsatte å utkomme, underkaste seg streng sensur og rette seg etter direktiver fra den tyske okkupasjonsmakten.',
              claim_type:'occupation_press_censorship_and_directives',
              scope:{geography_ids:[GEO],place_ids:['aftenposten_akersgata'],case_ids:[CASE_AFT],temporal:{from:1940,to:1945}},
              emne_ids:[PROP_EMNE,COMMON_EMNE,CIVIL_EMNE], source_ids:['src_his_snl_aftenposten_occupation'], confidence:'high',
              uncertainty:{level:'medium',note:'Kilden dokumenterer sensurregimet og at avisen fortsatte å utkomme, men ikke hver enkelt redaksjonell beslutning, sensurintervensjon eller selvsensurhandling.'},
              alternative_interpretations:['Fortsatt utgivelse kan analyseres både som institusjonell overlevelse under tvang og som deltakelse i en kontrollert offentlighet; klassifikasjonen av enkeltvalg krever mer finmasket aktør- og arkivmateriale.']
            },
            {
              claim_id:'claim_his_aftenposten_press_printed_deutsche_zeitung_1940_1945',
              statement:'Den tyske dagsavisen Deutsche Zeitung in Norwegen ble utgitt i Oslo fra 20. mai 1940 til 8. mai 1945, ble trykt i Aftenpostens trykkeri og nådde et oppgitt toppopplag på 98 000 i 1943.',
              claim_type:'occupation_controlled_press_production_distribution',
              scope:{geography_ids:[GEO],place_ids:['aftenposten_akersgata'],case_ids:[CASE_AFT],temporal:{from:'1940-05-20',to:'1945-05-08'}},
              emne_ids:[PROP_EMNE,COMMON_EMNE], source_ids:['src_his_snl_deutsche_zeitung_norwegen'], confidence:'high',
              uncertainty:{level:'low',note:'Utgivelsesperiode, målgruppe, trykking i Aftenpostens trykkeri og toppopplaget er eksplisitt oppgitt; claimet sier ikke at hvert eksemplar ble lest eller overbeviste mottakeren.'},
              alternative_interpretations:['Trykkeriet kan leses som materiell infrastruktur for okkupasjonskontrollert informasjon, men produksjonsvolum kan ikke uten mottakskilder oversettes til ideologisk effekt.']
            },
            {
              claim_id:'claim_his_nationaltheatret_ns_control_public_boycott_1941_1945',
              statement:'Etter konflikten med okkupasjonsmakten våren 1941 ble tre aksjonærvalgte styremedlemmer ved Nationaltheatret sendt til Grini, Gustav Berg-Jæger ble innsatt som teatersjef for 1941–1945, og teatret ble boikottet av publikum.',
              claim_type:'occupation_cultural_control_and_audience_response',
              scope:{geography_ids:[GEO],place_ids:['nationaltheatret'],case_ids:[CASE_NAT],temporal:{from:1941,to:1945}},
              emne_ids:[PROP_EMNE,COMMON_EMNE,CIVIL_EMNE], source_ids:['src_his_snl_nationaltheatret_wartime_control'], confidence:'high',
              uncertainty:{level:'medium',note:'Kilden dokumenterer styreinngrep, lederinnsettelse og boikott, men gir ikke et representativt mål på hvem som boikottet, hvorfor, eller hvor fullstendig boikotten var over hele perioden.'},
              alternative_interpretations:['Publikumsfraværet kan behandles som resepsjon og motstand mot okkupasjonsstyringen, men det må ikke gjøres til et direkte mål på hele befolkningens holdninger.']
            },
            {
              claim_id:'claim_his_mollergata_sipo_central_prison_indefinite_detention_1940',
              statement:'Den 13. september 1940 tok det tyske sikkerhetspolitiet over hele fengselet i Møllergata 19, som ble sentralfengsel for personer mistenkt for illegal virksomhet og motstand; arresterte kunne holdes på ubestemt tid uten lov og dom.',
              claim_type:'occupation_security_police_detention_without_judgment',
              scope:{geography_ids:[GEO],place_ids:['mollergata_19'],case_ids:[CASE_MOL],temporal:{from:'1940-09-13',to:1945}},
              emne_ids:[FANG_EMNE,LEGACY_FANG,COMMON_EMNE], source_ids:['src_his_snl_mollergata_19_occupation_prison'], confidence:'high',
              uncertainty:{level:'medium',note:'Kilden dokumenterer institusjonens rolle og rettsløse interneringsmulighet, men ikke at alle fanger satt like lenge eller hadde samme formelle status.'},
              alternative_interpretations:['Fengselets funksjon kan analyseres som del av et undertrykkelsesapparat der faktisk behandling og varighet ikke kan utledes av én administrativ fangekategori.']
            },
            {
              claim_id:'claim_his_mollergata_interrogation_torture_victoria_transfer_1940_1945',
              statement:'Under okkupasjonen ble psykisk og fysisk tortur vanlig i Møllergata 19, og fanger ble ofte transportert til Victoria terrasse for avhør.',
              claim_type:'occupation_interrogation_torture_and_transfer',
              scope:{geography_ids:[GEO],place_ids:['mollergata_19'],case_ids:[CASE_MOL],temporal:{from:1940,to:1945}},
              emne_ids:[FANG_EMNE,LEGACY_FANG,COMMON_EMNE], source_ids:['src_his_snl_mollergata_19_occupation_prison'], confidence:'high',
              uncertainty:{level:'medium',note:'Kilden beskriver en dokumentert praksis, men claimet sier ikke at alle fanger ble torturert eller sendt til Victoria terrasse.'},
              alternative_interpretations:['Møllergata og Victoria terrasse må analyseres som ulike ledd i et mulig institusjonelt forløp; stedskoblingen til Møllergata er ikke en påstand om at avhørene på Victoria skjedde i samme bygg.']
            },
            {
              claim_id:'claim_his_grini_polizeihäftlingslager_scale_confinement_1941_1945',
              statement:'Det tyske sikkerhetspolitiet etablerte Polizeihäftlingslager Grini i juni 1941, og fram til mai 1945 ble nesten 20 000 menn, kvinner og barn internert der; leiren omfattet hovedbygning, brakker, arbeidsgrupper og også isolasjon.',
              claim_type:'occupation_prison_camp_confinement_system',
              scope:{geography_ids:[GEO],place_ids:['grini_fangeleir'],case_ids:[CASE_GRI],temporal:{from:1941,to:1945}},
              emne_ids:[FANG_EMNE,LEGACY_FANG,COMMON_EMNE], source_ids:['src_his_mia_grini_prison_camp'], confidence:'high',
              uncertainty:{level:'medium',note:'Museet dokumenterer hovedstrukturen og samlet omfang, men aggregatet på nesten 20 000 sier ikke hvilke vilkår, arbeidsoppgaver eller disiplinærformer hver fange opplevde.'},
              alternative_interpretations:['Leirens skiftende rom og fangegrupper viser at juridisk eller administrativ status ikke alene kan brukes som mål på faktisk behandling.']
            },
            {
              claim_id:'claim_his_grini_deportations_concentration_camps_deaths_1941_1945',
              statement:'Mer enn 3 400 fanger ble deportert fra Grini til tyske konsentrasjonsleirer, og nesten 800 Grini-fanger døde, hovedsakelig etter deportasjon; noen ble også henrettet i Trandumskogen.',
              claim_type:'occupation_deportation_and_mortality_outcomes',
              scope:{geography_ids:[GEO],place_ids:['grini_fangeleir'],case_ids:[CASE_GRI],temporal:{from:1941,to:1945}},
              emne_ids:[FANG_EMNE,LEGACY_FANG,COMMON_EMNE], source_ids:['src_his_mia_grini_prison_camp'], confidence:'high',
              uncertainty:{level:'medium',note:'Dødstallet gjelder Grini-fanger og de fleste dødsfallene skjedde etter transport ut av leiren; claimet skiller derfor Grini som avsendende institusjonsledd fra dødsstedene.'},
              alternative_interpretations:['Utfallet må analyseres som en transport- og forfølgelseskjede på tvers av steder, ikke som om alle dødsfall skjedde fysisk på Grini.']
            }
          ];
          for (const c of claimDefs) addUnique(claimsFile.claims, 'claim_id', c);

          const reqs = ['case_req_his_temporal_sequence','case_req_his_actor_conflict','case_req_his_source_comparison','case_req_his_comparative_scale'];
          const validateCase = (caseId, label, placeId, emnes, spatialNote) => {
            let c = profile.cases.find((x) => x.case_id === caseId);
            if (!c) {
              c = {case_id:caseId,label,geography_id:GEO,geography_scope:'local_or_regional',status:'pilot_validated',evidence_status:'claim_source_linked',place_ids:[placeId],emne_ids:sorted(emnes),case_requirement_ids:reqs,provenance:{migrated_from:'validated evidence batch',migration_date:'2026-07-30'}};
              profile.cases.push(c);
            } else {
              if (c.evidence_status !== 'unverified') throw new Error(`${caseId} expected unverified, got ${c.evidence_status}`);
              c.status = 'pilot_validated'; c.evidence_status = 'claim_source_linked';
              unionInto(c,'place_ids',[placeId]); unionInto(c,'emne_ids',emnes); unionInto(c,'case_requirement_ids',reqs);
            }
            c.validation = {status:'validated_case',batch_id:BATCH,validated_at:'2026-07-30',minimum_evidence_links:2,source_policy:'canonical_registry_with_explicit_limitations',spatial_note:spatialNote};
            return c;
          };

          const aftenCase = profile.cases.find((x) => x.case_id === CASE_AFT);
          if (aftenCase) throw new Error('Aftenposten case unexpectedly already exists');
          profile.cases.push({
            case_id:CASE_AFT,label:'Aftenposten – Akersgata 51',geography_id:GEO,geography_scope:'local_or_regional',status:'pilot_validated',evidence_status:'claim_source_linked',
            place_ids:['aftenposten_akersgata'],emne_ids:sorted([PROP_EMNE,COMMON_EMNE,CIVIL_EMNE]),case_requirement_ids:reqs,
            provenance:{migrated_from:'data/places/media/oslo/places_oslo_media/aftenposten_akersgata.json',migration_date:'2026-07-30'},
            validation:{status:'validated_case',batch_id:BATCH,validated_at:'2026-07-30',minimum_evidence_links:2,source_policy:'canonical_registry_with_explicit_limitations',spatial_note:'`aftenposten_akersgata` er det eksplisitte historiske pressehusankeret Akersgata 51 for 1876–2003; det brukes for okkupasjonstidens avis- og trykkerivirksomhet uten å gjøre hele Akersgata eller dagens redaksjonsadresse til samme sted.'}
          });
          validateCase(CASE_MOL,'Møllergata 19','mollergata_19',[FANG_EMNE,LEGACY_FANG,COMMON_EMNE],'`mollergata_19` er det bevarte hovedbygningsankeret for det historiske politi- og fengselsanlegget; den revne fengselsfløyen og avhør på Victoria terrasse behandles som dokumenterte deler av forløpet, ikke som om de ligger i dagens fasadepunkt.');
          validateCase(CASE_GRI,'Grini fangeleir','grini_fangeleir',[FANG_EMNE,LEGACY_FANG,COMMON_EMNE],'`grini_fangeleir` bruker det dokumenterte opprinnelige Ila/Grini-hovedbygget som historisk anker; 360-metersradiusen er ikke en påstand om leirens fulle krigsperimeter, og dagens aktive fengselsområde er ikke et offentlig gameplaymål.');

          const natCase = profile.cases.find((x) => x.case_id === CASE_NAT);
          if (!natCase || natCase.evidence_status !== 'claim_source_linked') throw new Error('Expected validated Nationaltheatret case');
          unionInto(natCase,'emne_ids',[PROP_EMNE]);

          const addToMapping = (emneId, caseIds) => {
            const m = profile.emne_case_mappings.find((x) => x.emne_id === emneId);
            if (!m) throw new Error(`Missing mapping ${emneId}`);
            m.case_ids = sorted([...(m.case_ids || []), ...caseIds]);
          };
          addToMapping(PROP_EMNE,[CASE_AFT,CASE_NAT]);
          addToMapping(FANG_EMNE,[CASE_MOL,CASE_GRI]);
          addToMapping(COMMON_EMNE,[CASE_AFT,CASE_NAT,CASE_MOL,CASE_GRI]);
          addToMapping(LEGACY_FANG,[CASE_MOL,CASE_GRI]);
          addToMapping(CIVIL_EMNE,[CASE_AFT,CASE_NAT]);

          const evidenceDefs = claimDefs.map((c, i) => ({
            evidence_id:`evidence_his_war_prop_fang_${String(i+1).padStart(2,'0')}`,
            profile_id:PROFILE,geography_id:GEO,place_id:c.scope.place_ids[0],case_id:c.scope.case_ids[0],emne_ids:c.emne_ids,
            claim_id:c.claim_id,source_ids:c.source_ids,support_type:'direct_single_source',validation_status:'validated_case',limitations_inherited:true,
            note:`Direkte sted–claim–kildekobling for ${c.claim_type}; begrensningene i claim og source gjelder for teoribruk.`
          }));
          for (const e of evidenceDefs) addUnique(evidenceFile.evidence_links,'evidence_id',e);

          const claimMap = new Map(claimsFile.claims.map((x) => [x.claim_id,x]));
          const evidenceByClaim = new Map();
          for (const e of evidenceFile.evidence_links) { const a=evidenceByClaim.get(e.claim_id)||[]; a.push(e); evidenceByClaim.set(e.claim_id,a); }
          const makeTheory = ({theory_id,claim_ids,rationale,limitations,alternative_interpretations,disconfirmation_conditions,evidence_dimensions}) => {
            const cs=claim_ids.map((id)=>claimMap.get(id)); if(cs.some((x)=>!x)) throw new Error(`Missing claim in ${theory_id}`);
            return {theory_id,status:'evidence_ready',scope_status:'multi_case_geographic_pilot',universalization_status:'provisional_not_universal',claim_ids,
              source_ids:sorted(cs.flatMap((c)=>c.source_ids||[])),case_ids:sorted(cs.flatMap((c)=>c.scope?.case_ids||[])),place_ids:sorted(cs.flatMap((c)=>c.scope?.place_ids||[])),
              emne_ids:sorted(cs.flatMap((c)=>c.emne_ids||[])),evidence_link_ids:sorted(cs.flatMap((c)=>(evidenceByClaim.get(c.claim_id)||[]).map((e)=>e.evidence_id))),evidence_dimensions,
              rationale,limitations,alternative_interpretations,disconfirmation_conditions,
              scope_note:'Dette er et fler-case evidensgrunnlag i Oslo/Akershus og er ikke universelt bevis for teoriens gyldighet på tvers av okkupasjoner, mediesystemer, fangeinstitusjoner, aktørgrupper eller geografier.'};
          };

          addUnique(theoryFile.entries,'theory_id',makeTheory({
            theory_id:'theory_his_krig_okkupasjon_propaganda_sensur_og_informasjonskontroll',
            claim_ids:[claimDefs[0].claim_id,claimDefs[1].claim_id,claimDefs[2].claim_id],
            evidence_dimensions:['documented_application','limitation_test','alternative_interpretation','multi_case_comparison','production_control','distribution_scale','audience_reception'],
            rationale:'Akersgata 51 dokumenterer både et norsk pressehus under streng sensur og tyske direktiver og den materielle trykkingen av en tysk okkupasjonsavis, mens Nationaltheatret dokumenterer institusjonelt ledelsesinngrep og publikumsboikott. Sammen skiller casene produksjonskontroll og distribusjonskapasitet fra mottak og respons, slik at eksponering eller opplag ikke forveksles med overbevisning.',
            limitations:['Aftenposten- og Deutsche Zeitung-kildene dokumenterer kontroll, produksjon og opplag, men ikke representativ lesing, tolkning eller politisk virkning blant publikum.','Nationaltheatrets publikumsboikott gir et konkret mottaksspor, men er en annen kulturarena enn avispresse og kan ikke brukes som direkte mål på reaksjoner på Aftenposten eller Deutsche Zeitung.'],
            alternative_interpretations:['Fortsatt avisproduksjon under sensur kan leses som både institusjonell tilpasning og kontrollert offentlighet; det historiske spørsmålet må deles i hvem som kontrollerte produksjonen, hva som ble distribuert og hvordan ulike publikum reagerte.'],
            disconfirmation_conditions:['Anvendelsen svekkes dersom toppopplag brukes som bevis på propagandaeffekt, dersom sensur automatisk gjør alle publiserte tekster til propaganda, eller dersom teaterboikotten generaliseres til avislesere uten egne mottakskilder.']
          }));
          addUnique(theoryFile.entries,'theory_id',makeTheory({
            theory_id:'theory_his_krig_okkupasjon_fangenskap_vold_og_forfolgelse',
            claim_ids:[claimDefs[3].claim_id,claimDefs[4].claim_id,claimDefs[5].claim_id,claimDefs[6].claim_id],
            evidence_dimensions:['documented_application','limitation_test','alternative_interpretation','multi_case_comparison','institutional_sequence','legal_status_vs_treatment','transport_outcome'],
            rationale:'Møllergata 19 dokumenterer et tidlig sikkerhetspoliti-ledd med rettsløs internering, avhør, tortur og transport til Victoria terrasse, mens Grini dokumenterer videre masseinternering, arbeids- og isolasjonsformer, deportasjon til konsentrasjonsleirer og dødsutfall. Casene gjør det mulig å følge arrestasjon–fengsel–avhør–leir–transport–utfall som en institusjonell kjede uten å hevde at hver fange gjennomgikk alle ledd.',
            limitations:['Møllergata-kilden beskriver institusjonell praksis, men ikke et komplett individregister, og tortur eller transport til Victoria terrasse kan ikke tilskrives alle som satt fengslet der.','Grini-tallene er aggregerte og dødsfallene skjedde hovedsakelig etter deportasjon; leirens fangekategorier og samlet omfang sier derfor ikke alene hvordan hvert individ faktisk ble behandlet.'],
            alternative_interpretations:['De to stedene kan analyseres som koblede ledd i et større undertrykkelsesapparat, men samme systemrom inneholdt ulike rettsstatuser, fangegrupper, tidsforløp og voldsnivåer som må rekonstrueres separat i individstudier.'],
            disconfirmation_conditions:['Anvendelsen skal avvises dersom alle Møllergata-fanger antas å ha blitt torturert, dersom alle Grini-fanger antas deportert, eller dersom dødsfall etter deportasjon feilaktig plasseres fysisk på Grini.']
          }));
          theoryFile.completion.total_theories=230; theoryFile.completion.qualifying_entries=theoryFile.entries.length; theoryFile.completion.ratio=Math.round(theoryFile.entries.length/230*1000)/1000;
          if (theoryFile.entries.length !== 71) throw new Error(`Expected 71 entries after materialization, got ${theoryFile.entries.length}`);

          const profileEvidence=evidenceFile.evidence_links.filter((e)=>e.profile_id===PROFILE);
          const profileClaimIds=new Set(profileEvidence.map((e)=>e.claim_id));
          const profileSourceIds=new Set(profileEvidence.flatMap((e)=>e.source_ids||[]));
          const verifiedCases=profile.cases.filter((c)=>c.evidence_status==='claim_source_linked');
          profile.production_coverage.cases_total=profile.cases.length; profile.production_coverage.verified_cases_total=verifiedCases.length;
          profile.production_coverage.claims_total=profileClaimIds.size; profile.production_coverage.sources_total=profileSourceIds.size; profile.production_coverage.evidence_links_total=profileEvidence.length;
          profile.migration_summary.validated_cases=verifiedCases.length;
          profile.migration_summary.unverified_case_candidates=profile.cases.filter((c)=>c.evidence_status==='unverified').length;

          const dossier={
            schema_version:'1.0',dossier_id:BATCH,subject_id:'historie',geography_id:GEO,status:'reviewed_source_dossier',accessed_at:'2026-07-30',
            scope:{qualified_theory_ids:['theory_his_krig_okkupasjon_propaganda_sensur_og_informasjonskontroll','theory_his_krig_okkupasjon_fangenskap_vold_og_forfolgelse'],case_ids:[CASE_AFT,CASE_NAT,CASE_MOL,CASE_GRI],method_rule:'For informasjonsmakt skilles produksjon, kontroll, distribusjon og mottak. For fangenskap skilles arrestasjon, rettsstatus, faktisk behandling, avhør, fengsel/leir, transport og utfall. Ingen delkjede gjøres representativ for alle aktører.'},
            spatial_anchoring:{
              aftenposten:{place_id:'aftenposten_akersgata',status:'verified_historical_press_house_anchor',assessment:'Akersgata 51 er canonical historisk hovedadresse for Aftenposten 1876–2003 og brukes som fysisk pressehusanker for okkupasjonstidens redaksjons- og trykkerivirksomhet.'},
              nationaltheatret:{place_id:'nationaltheatret',status:'existing_validated_institution_anchor',assessment:'Gjenbrukes som allerede validert stedbundet teaterinstitusjon for 1941-ledelsesinngrep og publikumsboikott.'},
              mollergata:{place_id:'mollergata_19',status:'verified_historical_prison_anchor',assessment:'Den bevarte hovedbygningen forankrer det historiske politi-/fengselsanlegget; revet fengselsfløy og Victoria terrasse behandles eksplisitt som egne romlige ledd.'},
              grini:{place_id:'grini_fangeleir',status:'verified_historical_camp_core_anchor',assessment:'Det opprinnelige Ila/Grini-hovedbygget er canonical historisk anker; marker/radius er ikke full leirperimeter og dagens aktive fengsel er ikke offentlig gameplayområde.'}
            },
            sources:Object.fromEntries(sourceDefs.map((s)=>[s.source_id,{title:s.title,publisher:s.publisher,url:s.url,supported_dimensions:s.source_id.includes('aftenposten')?['press_censorship','occupation_directives']:s.source_id.includes('deutsche')?['occupation_newspaper','printing_infrastructure','circulation']:s.source_id.includes('nationaltheatret')?['institutional_control','audience_boycott']:s.source_id.includes('mollergata')?['detention_without_judgment','interrogation','torture','transfer']:['camp_scale','confinement_forms','deportation','mortality'],limitations:s.limitations}])),
            production_decisions:['Aftenposten/Akersgata 51 brukes framfor Youngstorget fordi place-recorden eksplisitt representerer det historiske pressehuset og ikke et bredt byrom.','Nationaltheatret tilfører et separat mottaksspor gjennom publikumsboikott; dette brukes ikke som mål på avislesing.','Møllergata og Grini materialiseres som to separate fangeinstitusjoner slik at avhør/fengsel, leir, transport og dødsutfall ikke kollapses til ett sted.','Dødsfall blant Grini-fanger etter deportasjon plasseres ikke fysisk på Grini, og transport til Victoria terrasse plasseres ikke fysisk i Møllergata 19.']
          };

          write(claimsPath,claimsFile); write(sourcesPath,sourcesFile); write(evidencePath,evidenceFile); write(theoryPath,theoryFile); write(profilePath,profile); write(dossierPath,dossier);

          const docPath='docs/HISTORY_THEORY_EVIDENCE.md'; let doc=fs.readFileSync(docPath,'utf8');
          if(!doc.includes('Produksjonen står på 69 av 230')) throw new Error('Expected 69 production sentence missing');
          doc=doc.replace('Produksjonen står på 69 av 230 etter at okkupasjon, samarbeid, tilpasning, motstand og gråsoner V1 er lagt til.','Produksjonen står på 71 av 230 etter at propaganda, sensur, informasjonskontroll, fangenskap, vold og forfølgelse V1 er lagt til.');
          const oldTail='- Okkupasjon, samarbeid, tilpasning, motstand og gråsoner V1: **2** nye kvalifiserende teoriobjekter, **3** nye claims, **2** nye kilder og **1** nyvalidert case.\n- Totalt: **69 av 230** teoriobjekter (**30.0 %**).\n- Universell status: **INCOMPLETE**.\n- Gjenstående teoriobjekter: **161**.';
          const newTail='- Okkupasjon, samarbeid, tilpasning, motstand og gråsoner V1: **2** nye kvalifiserende teoriobjekter, **3** nye claims, **2** nye kilder og **1** nyvalidert case.\n- Propaganda, sensur, informasjonskontroll, fangenskap, vold og forfølgelse V1: **2** nye kvalifiserende teoriobjekter, **7** nye claims, **5** nye kilder, **3** nyvaliderte cases og **1** utvidet case.\n- Totalt: **71 av 230** teoriobjekter (**30.9 %**).\n- Universell status: **INCOMPLETE**.\n- Gjenstående teoriobjekter: **159**.';
          if(!doc.includes(oldTail)) throw new Error('Expected 69 status tail missing'); doc=doc.replace(oldTail,newTail); fs.writeFileSync(docPath,doc);

          fs.writeFileSync('docs/HISTORY_WAR_PROPAGANDA_IMPRISONMENT_EVIDENCE_V1.md',`# Historie — propaganda, sensur, informasjonskontroll, fangenskap, vold og forfølgelse V1\n\nStatus: **VALIDATED EVIDENCE BATCH**\n\nDenne batchen kvalifiserer to nye teoriobjekter i \`his_krig_okkupasjon_motstand\`:\n\n- \`theory_his_krig_okkupasjon_propaganda_sensur_og_informasjonskontroll\`\n- \`theory_his_krig_okkupasjon_fangenskap_vold_og_forfolgelse\`\n\nHistorie forblir eksplisitt \`INCOMPLETE\`. Krig, okkupasjon og motstand går fra 6 av 10 til 8 av 10 kvalifiserte teoriobjekter, mens den universelle teorikøen går fra 69 til 71 av 230.\n\n## Informasjonsmakt\n\nAftenpostens historiske pressehus i Akersgata 51 dokumenterer et norsk avishus som fortsatte under streng sensur og tyske direktiver. En separat kilde dokumenterer at Deutsche Zeitung in Norwegen ble trykt i Aftenpostens trykkeri og nådde et høyt produsert opplag. Nationaltheatret tilfører en annen type mottaksspor: okkupasjonsinngrep i ledelsen og dokumentert publikumsboikott. Produksjon, rekkevidde og mottak behandles derfor som forskjellige evidensdimensjoner.\n\n## Fangenskap og forfølgelseskjede\n\nMøllergata 19 dokumenterer sentralfengsel, rettsløs internering, avhør, tortur og transport til Victoria terrasse. Grini dokumenterer masseinternering, differensierte innkvarterings- og disiplinformer, deportasjon til tyske konsentrasjonsleirer og dødsutfall blant Grini-fanger. Stedene kobles som mulige institusjonelle ledd uten å anta at hver fange fulgte samme kjede.\n\n## Produksjon\n\n- 7 nye canonical Historie-claims\n- 5 nye canonical Historie-kilder\n- 7 nye validerte place–claim–source-koblinger\n- 3 nyvaliderte cases: Aftenposten/Akersgata 51, Møllergata 19 og Grini fangeleir\n- 1 utvidet validert case: Nationaltheatret\n- 2 nye \`evidence_ready\` teoriobjekter\n- teori-evidens: 69 → 71 av 230\n- krig, okkupasjon og motstand: 6 → 8 av 10\n\n## Evidensgrense\n\n- Sensur dokumenterer kontroll, ikke at alle publiserte tekster var propaganda.\n- Opplag dokumenterer produksjon/distribusjon, ikke faktisk lesing eller overbevisning.\n- Nationaltheatrets boikott er et konkret resepsjonsspor, ikke et representativt mål på avislesere eller hele befolkningen.\n- Møllergata-fanger antas ikke automatisk å ha blitt torturert eller sendt til Victoria terrasse.\n- Grini-fanger antas ikke automatisk å ha blitt deportert.\n- Dødsfall etter deportasjon plasseres ikke fysisk på Grini.\n- Oslo/Akershus-casene er ikke universelt bevis for andre okkupasjoner eller fangesystemer.\n`);

          const testPath='tests/fagverk-historie.test.mjs'; let test=fs.readFileSync(testPath,'utf8');
          if(!test.includes('assert.equal(report.universalCoverage.theoryEvidenceQualifying, 69);')) throw new Error('Expected 69 regression assertion missing');
          test=test.replace('assert.equal(report.universalCoverage.theoryEvidenceQualifying, 69);','assert.equal(report.universalCoverage.theoryEvidenceQualifying, 71);'); fs.writeFileSync(testPath,test);
          NODE

      - name: Regenerate deterministic History reports
