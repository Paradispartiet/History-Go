name: Tjuvholmen Renzo Piano source-licensed People import
on:
  pull_request:
    paths:
      - '.github/workflows/tjuvholmen-renzo-piano-one-shot.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: renzo-piano-tjuvholmen-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/tjuvholmen-renzo-piano-person-20261112
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests pillow
      - name: Download Commons original and add verified person and 3:4 WebP
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from io import BytesIO
          from PIL import Image,ImageOps
          import requests
          sourcePage="https://commons.wikimedia.org/wiki/File:Renzo_Piano,_portrait.jpg"
          sourceAsset="https://upload.wikimedia.org/wikipedia/commons/0/0f/Renzo_Piano%2C_portrait.jpg"
          r=requests.get(sourceAsset,timeout=65,headers={'User-Agent':'HistoryGoDocumentarySourceAudit/1.0 (https://github.com/Paradispartiet/History-Go)'})
          r.raise_for_status()
          if len(r.content)>10_000_000 or not r.content.startswith(b'\xff\xd8\xff'):
            raise RuntimeError("Expected actual CC BY-SA Wikimedia original JPEG")
          im=Image.open(BytesIO(r.content)).convert('RGB')
          if im.width!=2400 or im.height!=3600:
            raise RuntimeError(f"Unexpected original dimensions {im.size}")
          original=Path('bilder/kort/people/source/renzo_piano_2012_cirone_musi.jpg')
          out=Path('bilder/kort/people/renzo_piano.webp')
          original.parent.mkdir(parents=True,exist_ok=True)
          out.parent.mkdir(parents=True,exist_ok=True)
          original.write_bytes(r.content)
          resized=ImageOps.contain(im,(900,1200),method=Image.Resampling.LANCZOS)
          board=Image.new('RGB',(900,1200),(23,27,32))
          board.paste(resized,((900-resized.width)//2,(1200-resized.height)//2))
          board.save(out,'WEBP',quality=93,method=6)
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          meta={'schema':'history_go_people_portrait_attribution_v1','personId':'renzo_piano',
          'path':str(out),'sourceLocalPath':str(original),'sourcePage':sourcePage,
          'sourceAsset':sourceAsset,'sourceSha256':sha(original),'assetSha256':sha(out),
          'sourceDimensions':[im.width,im.height],'outputDimensions':[900,1200],
          'creator':'Cirone-Musi (Festival della Scienza, Genoa)',
          'credit':'Cirone-Musi / Festival della Scienza / Wikimedia Commons',
          'license':'CC BY-SA 2.0','licenseUrl':'https://creativecommons.org/licenses/by-sa/2.0/',
          'identityEvidence':'Commons verified CC BY-SA license and original Renzo Piano portrait taken 27 October 2012 at Festival della Scienza, Genoa',
          'transformation':'Uncropped original scaled proportionally with neutral dark side padding to 900x1200; no face retouch',
          'reviewStatus':'source_verified_visual_review_pending','dateVerified':'2026-11-12'}
          Path('data/people/renzo_piano_image_provenance.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          peoplePath=Path('data/people/by/oslo/people_by_oslo.json')
          people=json.loads(peoplePath.read_text())
          if any(p.get('id')=='renzo_piano' for p in people):raise RuntimeError('Renzo Piano canonical ID already exists')
          desc='Italiensk arkitekt bak Astrup Fearnley Museet og tilhørende deler av Tjuvholmens offentlige sjøfront.'
          popup='Renzo Piano tegnet Astrup Fearnley Museet på Tjuvholmen gjennom Renzo Piano Building Workshop, i samarbeid med Narud-Stokke-Wiig. Museet åpnet i 2012 som en del av omformingen av Oslos tidligere havneområde. Det buede glasstaket binder museumsbygningene sammen, og prosjektet omfatter også offentlige promenader, park og badeområde ved sjøen. Derfor er Piano knyttet til både Tjuvholmen som byområde og Astrup Fearnley som egen institusjon.'
          people.append({
          'id':'renzo_piano','name':'Renzo Piano','initials':'RP','desc':desc,
          'tags':['by','arkitektur','samtidsarkitektur','museum','tjuvholmen','fjordbyen'],
          'placeId':'tjuvholmen','places':['tjuvholmen','astrup_fearnley'],
          'category':'by','year':2012,'popupDesc':popup,'image':str(out),'cardImage':str(out),
          'source_urls':['https://www.oslo.kommune.no/slik-bygger-vi-oslo/fjordbyen/tjuvholmen/',
            'https://www.fondazionerenzopiano.org/en/project/astrup-fearnley-museum-of-modern-art/',sourcePage],
          'imageMeta':{'sourcePage':sourcePage,'sourceAsset':sourceAsset,'sourceSha256':meta['sourceSha256'],
             'assetSha256':meta['assetSha256'],'creator':meta['creator'],'credit':meta['credit'],
             'license':meta['license'],'licenseUrl':meta['licenseUrl'],
             'reviewStatus':meta['reviewStatus'],'width':900,'height':1200,
             'transformation':meta['transformation']}
          })
          peoplePath.write_text(json.dumps(people,ensure_ascii=False,indent=2)+'\n')
          print('RENZO_ORIGINAL_AND_CANONICAL',json.dumps(meta,ensure_ascii=False))
          PY
      - run: npm ci --no-audit --no-fund
      - name: Generate real Place-open and Civication People indexes
        run: |
          npm run place-open:build
          npm run place-open:check
          npm run civication:history-people:build
          npm run civication:history-people:check
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const meta=read('data/people/renzo_piano_image_provenance.json');
          const canon=read('data/people/by/oslo/people_by_oslo.json').find(x=>x.id==='renzo_piano');
          for(const placeId of ['tjuvholmen','astrup_fearnley']){
           const p=read('data/runtime/place-open/'+placeId+'.json');
           assert.equal(p.people.filter(x=>x.id==='renzo_piano').length,1,placeId+' Renzo missing');
           assert.equal(p.people.find(x=>x.id==='renzo_piano').image,meta.path);
          }
          assert.equal(canon.image,meta.path);
          const sha=f=>crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          assert.equal(sha(meta.path),meta.assetSha256);
          assert.equal(sha(meta.sourceLocalPath),meta.sourceSha256);
          assert.equal(meta.license,'CC BY-SA 2.0');
          console.log('RENZO_PIANO_TJUVHOLMEN_RUNTIME_PASS',meta.path);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tjuvholmen-renzo-piano-photo-review
          path: |
            bilder/kort/people/renzo_piano.webp
            data/people/renzo_piano_image_provenance.json
          if-no-files-found: ignore
      - name: Commit original, portrait and generated projections
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/kort/people/source/renzo_piano_2012_cirone_musi.jpg bilder/kort/people/renzo_piano.webp data/people/by/oslo/people_by_oslo.json data/people/renzo_piano_image_provenance.json
          git add data/runtime/people-all data/runtime/place-open/tjuvholmen.json data/runtime/place-open/astrup_fearnley.json data/Civication/historyPeople_index.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat(tjuvholmen): Renzo Piano sourced portrait and factual Place links"
            git reset --hard HEAD
            git clean -fd
            git fetch origin content/tjuvholmen-renzo-piano-person-20261112
            git rebase origin/content/tjuvholmen-renzo-piano-person-20261112
            git push origin HEAD:content/tjuvholmen-renzo-piano-person-20261112
          fi
