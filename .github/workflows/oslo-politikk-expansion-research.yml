name: Oslo politics expansion research

on:
  push:
    branches:
      - agent/oslo-politikk-steder-underkategorier
    paths:
      - scripts/research-oslo-politikk-expansion.mjs
      - .github/workflows/oslo-politikk-expansion-research.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-politikk-steder-underkategorier
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Research sources and coordinates
        run: node scripts/research-oslo-politikk-expansion.mjs
      - name: Commit report
        run: |
          if git diff --quiet -- reports/oslo-politikk-expansion-research.json; then
            echo "No report changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/oslo-politikk-expansion-research.json
          git commit -m "Research Oslo politics expansion coordinates"
          git push origin HEAD:agent/oslo-politikk-steder-underkategorier
