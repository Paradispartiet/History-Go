name: Oslo politics expansion research

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/research-oslo-politikk-expansion.mjs
      - .github/workflows/oslo-politikk-expansion-research.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Research sources and coordinates
        run: node scripts/research-oslo-politikk-expansion.mjs
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: oslo-politikk-expansion-research
          path: reports/oslo-politikk-expansion-research.json
