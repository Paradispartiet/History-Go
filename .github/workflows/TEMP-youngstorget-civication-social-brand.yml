name: TEMP Youngstorget Civication social-brand verification

on:
  push:
    branches:
      - agent/fix-youngstorget-civication-social-brand

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-youngstorget-civication-social-brand
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify failed social-place contract
        run: node tests/civication-social-place-resolver.test.js
      - name: Verify complete Civication suite
        run: npm run test:civication
      - name: Remove temporary verifier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/TEMP-youngstorget-civication-social-brand.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary Youngstorget Civication verifier"
          git pull --rebase origin agent/fix-youngstorget-civication-social-brand
          git push origin HEAD:agent/fix-youngstorget-civication-social-brand
