name: Oslo v1 photo batch 02 (one-shot)
on:
  push:
    branches:
      - production/oslo-v1-photo-batch02-20261018
    paths:
      - 'scripts/produce-oslo-v1-photos-batch02-20261018.py'
      - '.github/workflows/oslo-v1-image-batch02-20261018.yml'
permissions:
  contents: write
jobs:
  create-licensed-images:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produce licensed WebP assets and image summary once
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/produce-oslo-v1-photos-batch02-20261018.py
      - name: Materialize canonical place index and place-open payloads
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run places:index:build
          npm run place-open:build
          node scripts/audit-place-images.mjs --mode=all --verify-summary=data/places/place_image_backlog_summary.json
      - name: Commit real images, source metadata and generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/places/ bilder/kort/places/ data/places/ data/runtime/ reports/place-image-audit.json
          if git diff --cached --quiet; then
            echo "No image outputs changed"; exit 1
          fi
          git commit -m "content(oslo): produce five Commons-licensed place image sets"
          git push origin HEAD:production/oslo-v1-photo-batch02-20261018
