name: Materialize Vinderen place-open payload

on:
  push:
    branches:
      - place/vinderen-fagverk-v2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: place/vinderen-fagverk-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build place-open payload
        run: |
          npm run place-open:build
          changed="$(git diff --name-only)"
          test "$changed" = "data/runtime/place-open/vinderen.json" || {
            echo "Unexpected generated changes:"
            printf '%s\n' "$changed"
            exit 1
          }
      - name: Commit permanent payload and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/place-open/vinderen.json
          git rm .github/workflows/vinderen-place-open-materialize.yml
          git commit -m "chore: sync Vinderen place-open payload"
          git push origin HEAD:place/vinderen-fagverk-v2
