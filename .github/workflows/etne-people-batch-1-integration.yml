name: Etne People of Places batch 1 integration

on:
  pull_request:
    paths:
      - 'data/people/litteratur/vestland/etne/**'
      - 'reports/etne-people-of-places-batch-1-research.md'
      - '.github/workflows/etne-people-batch-1-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.number == 2270
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/etne-people-batch-1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          mkdir -p reports/etne-people-of-places-batch-1-integration
          npm install --no-audit --no-fund 2>&1 | tee reports/etne-people-of-places-batch-1-integration/npm-install.txt

      - name: Register Ivar Aasen and patch existing Erling Skakke
        run: |
          node --input-type=module <<'NODE' | tee reports/etne-people-of-places-batch-1-integration/integration-patch.txt
          import fs from 'node:fs';

          const manifestPath = 'data/people/manifest.json';
          const ivarPath = 'people/litteratur/vestland/etne/ivar_aasen.json';
          const erlingPath = 'data/people/historie/norge/people_historie_norge_for_1500_to_add_47.json';

          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.files = manifest.files.filter((value) => value !== ivarPath);
          manifest.files.push(ivarPath);
          if (manifest.files.filter((value) => value === ivarPath).length !== 1) {
            throw new Error('Ivar Aasen manifest registration is not exactly once');
          }
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

          const people = JSON.parse(fs.readFileSync(erlingPath, 'utf8'));
          const matches = people.filter((person) => person?.id === 'erling_skakke');
          if (matches.length !== 1) throw new Error(`Expected one erling_skakke record, got ${matches.length}`);
          const erling = matches[0];
          if (erling.placeId !== 'kalvskinnet_slagsted') {
            throw new Error(`Unexpected primary placeId for erling_skakke: ${erling.placeId}`);
          }
          erling.places = Array.isArray(erling.places) ? erling.places.filter((id) => id !== 'stodle_kyrkje') : [];
          erling.places.push('stodle_kyrkje');
          erling.placeIdStatus = {
            ...(erling.placeIdStatus || {}),
            stodle_kyrkje: 'active_verified_place'
          };
          erling.popupDesc = 'Erling Skakke var stormann og riksstyrer i borgerkrigstiden, far til Magnus Erlingsson og en nøkkelperson i utviklingen av kirkelig legitimert kongedømme. Han hadde sete på Stødle i Etne. Middelalderkirken på Stødle knyttes direkte til stormannsætten, og historiske oversikter peker på Erling som byggherre omkring 1160. Koblingen til Stødle kyrkje kommer derfor i tillegg til de eksisterende ankerne ved Kalvskinnet og Kristkirken i Bergen; det primære placeId-et forblir Kalvskinnet.';
          const sourceUrls = new Set(Array.isArray(erling.source_urls) ? erling.source_urls : []);
          sourceUrls.add('https://snl.no/Erling_Skakke');
          sourceUrls.add('https://snl.no/Etne');
          sourceUrls.add('https://www.kringom.no/nb/stole-kyrkje');
          erling.source_urls = [...sourceUrls];
          erling.verifiedAt = '2026-07-18';
          fs.writeFileSync(erlingPath, JSON.stringify(people, null, 2) + '\n');

          console.log('PASS Ivar Aasen registered exactly once');
          console.log('PASS Erling Skakke canonical record patched in place');
          console.log('PASS Erling primary placeId preserved: kalvskinnet_slagsted');
          console.log('PASS stodle_kyrkje added exactly once to Erling places');
          NODE

      - name: Run full people checks
        run: bash scripts/check-people.sh 2>&1 | tee reports/etne-people-of-places-batch-1-integration/check-people.txt

      - name: Run People of Places audit
        run: npm run audit:people-of-places 2>&1 | tee reports/etne-people-of-places-batch-1-integration/people-of-places-audit.txt

      - name: Validate canonical IDs and target links
        run: |
          node --input-type=module <<'NODE' | tee reports/etne-people-of-places-batch-1-integration/targeted-validation.json
          import fs from 'node:fs';
          import path from 'node:path';

          const manifest = JSON.parse(fs.readFileSync('data/people/manifest.json', 'utf8'));
          const all = [];
          for (const rel of manifest.files) {
            const file = path.join('data', rel);
            const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
            const rows = Array.isArray(doc) ? doc : Array.isArray(doc?.people) ? doc.people : [];
            for (const person of rows) all.push({ person, file: rel });
          }

          const counts = new Map();
          for (const { person } of all) {
            if (person?.id) counts.set(person.id, (counts.get(person.id) || 0) + 1);
          }
          const duplicateIds = [...counts.entries()].filter(([, count]) => count > 1);
          if (duplicateIds.length) throw new Error(`Global duplicate canonical people IDs: ${JSON.stringify(duplicateIds)}`);

          const ivars = all.filter(({ person }) => person?.id === 'ivar_aasen');
          const erlings = all.filter(({ person }) => person?.id === 'erling_skakke');
          if (ivars.length !== 1) throw new Error(`Expected one ivar_aasen, got ${ivars.length}`);
          if (erlings.length !== 1) throw new Error(`Expected one erling_skakke, got ${erlings.length}`);

          const ivar = ivars[0].person;
          const erling = erlings[0].person;
          if (ivar.placeId !== 'skanevik_gjestgjevargarden') throw new Error('Ivar primary placeId mismatch');
          if ((ivar.places || []).filter((id) => id === 'skanevik_gjestgjevargarden').length !== 1) throw new Error('Ivar guesthouse link must occur exactly once');
          if (erling.placeId !== 'kalvskinnet_slagsted') throw new Error('Erling primary placeId changed');
          if ((erling.places || []).filter((id) => id === 'stodle_kyrkje').length !== 1) throw new Error('Erling Stødle link must occur exactly once');
          if (erling.placeIdStatus?.stodle_kyrkje !== 'active_verified_place') throw new Error('Erling Stødle status missing');

          const places = JSON.parse(fs.readFileSync('data/places/places_index.json', 'utf8'));
          const placeIds = new Set(places.map((place) => place.id));
          for (const id of ['skanevik_gjestgjevargarden', 'stodle_kyrkje']) {
            if (!placeIds.has(id)) throw new Error(`Missing active target place: ${id}`);
          }

          console.log(JSON.stringify({
            status: 'PASS',
            totalPeople: all.length,
            uniquePeopleIds: counts.size,
            duplicatePeopleIds: 0,
            results: [
              {
                id: 'ivar_aasen',
                canonicalRows: 1,
                placeId: ivar.placeId,
                places: ivar.places,
                sourceFile: ivars[0].file
              },
              {
                id: 'erling_skakke',
                canonicalRows: 1,
                primaryPlaceIdPreserved: erling.placeId,
                stodleLinkCount: erling.places.filter((id) => id === 'stodle_kyrkje').length,
                stodleStatus: erling.placeIdStatus.stodle_kyrkje,
                sourceFile: erlings[0].file
              }
            ]
          }, null, 2));
          NODE

      - name: Run diff whitespace check
        run: git diff --check | tee reports/etne-people-of-places-batch-1-integration/git-diff-check.txt

      - name: Remove temporary workflow and commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/etne-people-batch-1-integration.yml
          git add data/people/manifest.json data/people/historie/norge/people_historie_norge_for_1500_to_add_47.json reports/etne-people-of-places-batch-1-integration reports/people-invalid-place-refs.json reports/people-invalid-place-refs.md reports/people-of-places-status.md reports/people-place-coverage.md reports/people-split-vs-legacy.md
          git diff --cached --check
          git commit -m "Integrate Etne People of Places batch 1"
          git push origin HEAD:agent/etne-people-batch-1
