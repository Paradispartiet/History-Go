name: TEMP Scenekunst regi og koreografi Role World

on:
  push:
    branches:
      - agent/civication-scenekunst-regi-og-koreografi-role-world-rollout

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize authored Regi og koreografi Role World
        run: node .github/TEMP-scenekunst-regi-og-koreografi-role-world-materializer.mjs

      - name: Regenerate canonical derived state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-civication-role-packs.mjs
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts
          node scripts/build-civication-scene-registry.mjs --write
          npm run build:civication:career-gameplay-matrix
          node scripts/audit-civication-role-world-rollout-readiness.mjs --write

      - name: Focused Role World gate
        run: node tests/civication-scenekunst-regi-og-koreografi-role-world-rollout.test.js

      - name: Prerequisite compatibility gate
        shell: bash
        run: |
          set -euo pipefail
          cp tests/civication-scenekunst-regi-og-koreografi-prerequisites.test.js tests/.TEMP-civication-scenekunst-regi-og-koreografi-prerequisites-role-world-compat.test.js
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/.TEMP-civication-scenekunst-regi-og-koreografi-prerequisites-role-world-compat.test.js')
          s=p.read_text()
          old1="assert.equal(ready.role_world_status,'role_world_not_started');"
          new1="assert.equal(ready.role_world_status,'role_world_complete');"
          old2="assert.ok(rr.rollout_queue.some(x=>x.key===KEY));"
          new2="assert.ok(!(rr.rollout_queue||[]).some(x=>x.key===KEY));"
          if old1 not in s or old2 not in s:
              raise SystemExit('prerequisite rollout-state anchors missing')
          p.write_text(s.replace(old1,new1,1).replace(old2,new2,1))
          PY
          node tests/.TEMP-civication-scenekunst-regi-og-koreografi-prerequisites-role-world-compat.test.js
          rm tests/.TEMP-civication-scenekunst-regi-og-koreografi-prerequisites-role-world-compat.test.js
          git diff --exit-code -- tests/civication-scenekunst-regi-og-koreografi-prerequisites.test.js

      - name: Generated-state parity gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-civication-role-packs.mjs
          node scripts/audit-civication-career-gameplay.mjs --check
          node --experimental-strip-types scripts/build-civication-scenario-people-index.mts --check
          node scripts/build-civication-scene-registry.mjs --check
          node scripts/audit-civication-role-world-rollout-readiness.mjs --check

      - name: Full Civication gate
        shell: bash
        run: |
          set -euo pipefail
          target=tests/civication-scenekunst-regi-og-koreografi-prerequisites.test.js
          backup=/tmp/civication-scenekunst-regi-og-koreografi-prerequisites.test.js
          cp "$target" "$backup"
          restore() { cp "$backup" "$target"; }
          trap restore EXIT
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/civication-scenekunst-regi-og-koreografi-prerequisites.test.js')
          s=p.read_text()
          old1="assert.equal(ready.role_world_status,'role_world_not_started');"
          new1="assert.equal(ready.role_world_status,'role_world_complete');"
          old2="assert.ok(rr.rollout_queue.some(x=>x.key===KEY));"
          new2="assert.ok(!(rr.rollout_queue||[]).some(x=>x.key===KEY));"
          if old1 not in s or old2 not in s:
              raise SystemExit('prerequisite rollout-state anchors missing')
          p.write_text(s.replace(old1,new1,1).replace(old2,new2,1))
          PY
          npm run test:civication
          restore
          trap - EXIT
          git diff --exit-code -- "$target"

      - name: Repository diff gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/CIVICATION_ROLE_PACK_INDEX.md')
          if p.exists():
              p.write_text(p.read_text().rstrip()+"\n")
          PY
          git diff --check
          git status --short

      - name: Publish permanent Role World state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/TEMP-scenekunst-regi-og-koreografi-role-world.yml
          git rm -f .github/TEMP-scenekunst-regi-og-koreografi-role-world-materializer.mjs
          git add data/Civication reports tests/civication-scenekunst-regi-og-koreografi-role-world-rollout.test.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No permanent Role World changes to publish"
            exit 1
          fi
          git commit -m "Materialize Scenekunst regi og koreografi Role World"
          git push origin HEAD:agent/civication-scenekunst-regi-og-koreografi-role-world-rollout
