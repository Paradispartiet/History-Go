name: Oslo-20 Sagene source packet closeout
on:
  push:
    branches: [content/oslo20-sagene-v42-closeout-20261020]
    paths: [.github/workflows/oslo20-sagene-v42-oneoff-20261020.yml]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and write only missing Sagene v4.2 packet
        run: |
          cat > .tmp-sagene-v42.mjs <<'JS'
          import fs from "node:fs";
          import { splitSentences, sha256Text, containsStrongClaim, containsTemporalClaim, validatePacket } from "./scripts/validate-place-description-production-v4_2.mjs";
          const file="data/places/historie/oslo/places_historie/sagene_skole.json";
          const place=JSON.parse(fs.readFileSync(file,"utf8"));
          if (place.id!=="sagene_skole"||place.name!=="Sagene skole")throw Error("Sagene identity mismatch");
          const sourceUrls={
           school:"https://sagene.osloskolen.no/om-skolen/om-oss/skolens-historie/",
           byleksikon:"https://oslobyleksikon.no/side/Sagene_skole",
           sethne:"https://nbl.snl.no/Anna_Sethne",
           leirskole:"https://sagene.osloskolen.no/for-elever-og-foresatte/andre-tilbud-til-elevene/vesle-sagene-leirskole/",
           archive:"https://oslobilder.no/ARB/0043158",
           antiracism:"https://yunawigen-uealt.wordpress.com/2025/10/19/17-mai-for-alle/"
          };
          const claims=[],coverage={desc:[],popupDesc:[]};
          for(const [field,tag] of [["desc","desc"],["popupDesc","popup"]]){
           const ss=splitSentences(place[field]);
           for(let i=0;i<ss.length;i++){
            const line=ss[i],strong=containsStrongClaim(line),current=containsTemporalClaim(line)||/fortsatt i drift/i.test(line);
            let url=sourceUrls.school,alt=sourceUrls.byleksikon,location="Sagene skole: Skolens historie, historiske bygninger og skoleliv";
            if(/Vesle Sagene|leirskole/i.test(line)){url=sourceUrls.leirskole;alt=sourceUrls.archive;location="Sagene skole: Vesle-Sagene leirskole, åpning 1951";}
            else if(/Anna Sethne|Sagene-forsøkene|reformpedagogikk/i.test(line)){url=sourceUrls.school;alt=sourceUrls.sethne;location="Sagene skole og Norsk biografisk leksikon: reformpedagogikken";}
            else if(/tospråklige klasser|tospråklig klasse/i.test(line)){url=sourceUrls.school;alt=sourceUrls.antiracism;location="Sagene skole: Historie, tospråklig klasse 1982";}
            else if(/fortsatt i drift/i.test(line)){url=sourceUrls.byleksikon;alt=sourceUrls.school;location="Oslo byleksikon: Sagene skole, aktuell skoledrift høsten 2026";}
            else if(/1940|verdenskrig|kaserne|tysk/i.test(line)){url=sourceUrls.byleksikon;alt=sourceUrls.school;location="Oslo byleksikon og skolehistorien: skolebygg brukt som kaserne";}
            const id="claim_sagene_skole_"+tag+"_"+String(i+1).padStart(2,"0");
            const type=url===sourceUrls.byleksikon?"reputable_secondary":"official";
            claims.push({id,claim:line,sourceUrl:url,sourceLocation:location,sourceType:type,verifiedAt:"2026-10-20",status:"verified",claimKind:strong?"strong":i===0?"identity":"fact",evidenceMode:strong?"explicit":"direct",temporalStatus:current?"current":"historical",...(strong?{independentSourceUrls:[alt]}:{})});
            coverage[field].push({sentence:i+1,claimIds:[id]});
           }
          }
          const qs=[
           ["Når ble den første allmueskolen i Aker opprettet?","1741","når","1741"],
           ["Hvem tegnet den eldste nåværende skolebygningen?","Jacob Wilhelm Nordan","hvem","Jacob Wilhelm Nordan"],
           ["Når sto den eldste nåværende skolebygningen ferdig?","1861","når","1861"],
           ["Hvilket område preger historien rundt skolen?","Akerselva og industribydelen Sagene","hvor","Akerselva"],
           ["Hvem ledet de pedagogiske forsøkene ved Sagene?","Anna Sethne","hvem","Anna Sethne"],
           ["Når startet Sagene-forsøkene?","1930","når","1930"],
           ["Hva ble skolebygningene brukt som under krigen?","Tysk kaserne","hva","kaserne"],
           ["Når åpnet leirskolen Vesle Sagene?","1951","når","1951"],
           ["Hvilket år ble en tospråklig skoleklasse etablert?","1982","når","1982"],
           ["Hva var slagordet ved skolens 17. mai-markering?","17. mai for alle","hva","17. mai for alle"],
           ["Hvilket år sto en ny skolebygning ferdig?","1926","når","1926"]
          ];
          const quizQuestions=qs.map(([question,answer,type,needle])=>{
           const hit=claims.find(c=>c.id.includes("_popup_")&&c.claim.toLocaleLowerCase("nb-NO").includes(needle.toLocaleLowerCase("nb-NO")));
           if(!hit)throw Error("Quiz evidence mismatch: "+needle);
           return {question,answer,type,normalKnowledgeQuestion:true,claimIds:[hit.id]};
          });
          const packet={
           schemaVersion:"4.2",validatorVersion:"4.2.1",placeId:"sagene_skole",placeFile:file,status:"ready_v4_2",
           identity:{status:"resolved",represents:"Den historiske Sagene skole ved Biermanns gate 2 i Oslo, med skolebygg fra 1861 og 1926.",period:"Skolehistorien går tilbake til 1741; bygningene på dagens skoleområde fra 1861 og senere.",excludes:["Sagene bad som eget nabobygg","Leirstedet Vesle Sagene på Hadeland","Andre tidligere skolelokaler i Aker før 1861"]},
           metadataSnapshot:{name:place.name,year:place.year,category:place.category,coordinates:{lat:place.lat,lon:place.lon}},
           textHashes:{algorithm:"sha256",desc:sha256Text(place.desc),popupDesc:sha256Text(place.popupDesc)},
           claims,sentenceCoverage:coverage,collections:{people:[],objects:[],structures:[],productions:[]},
           quizReadiness:{questions:quizQuestions},roundsReadiness:{status:"not_produced",exactCollectionCount:0},
           source_conflicts:[{claim:"Sagene skole er fortsatt ungdomsskole etter høsten 2026.",status:"rejected",reason:"Oslo byleksikon oppgir overgang til ren barneskole fra høsten 2026, med avsluttende 10. trinn fram til våren 2027."}],
           reviews:{factual:{status:"passed",reviewedAt:"2026-10-20",reviewer:"Sagene skole source comparison",notes:"Skolens egen historie sammenholdt med Oslo byleksikon, Norsk biografisk leksikon og arkiv om Vesle Sagene."},
           editorial:{status:"passed",reviewedAt:"2026-10-20",reviewer:"Oslo-20 source package closeout",introducedNewFacts:false,notes:"Kildegrunnlaget er komplettert uten endring av publisert stedstekst, quiz, stedskart eller bilder."}},
           reviewsNotes:"Historical source coverage added to existing six-paragraph place narrative; no change to player-facing content.",
           completion:{completedUnder:"4.2",currentStatus:"current",sourceVerifiedAt:"2026-10-20",claimsVerified:{verified:claims.length,total:claims.length},factualReview:"passed",editorialReview:"passed",validatorVersion:"4.2.1"}
          };
          const result=validatePacket({packet,place,now:new Date("2026-10-20T12:00:00Z")});
          if(result.issues.length){console.error(JSON.stringify(result.issues,null,2));throw Error("Sagene source package failed validator: "+result.issues.length+" issues");}
          const target="data/places/production/sagene_skole.json";
          if(fs.existsSync(target))throw Error("Sagene packet already exists");
          fs.writeFileSync(target,JSON.stringify(packet,null,2)+"\n");
          const tierFile="data/places/production-tiers/v1-oslo-place-media-text-review-20261019-batch04.json";
          const tier=JSON.parse(fs.readFileSync(tierFile,"utf8"));
          const row=tier.places.find(x=>x.place_id==="sagene_skole");
          if(!row)throw Error("Sagene missing Oslo-20");
          row.text_status="existing_published_text_with_ready_v4_2_source_packet";
          row.source_packet_verified=true;
          tier.source_packet_closeout={date:"2026-10-20",place_id:"sagene_skole",source_packet:target,validator:"4.2.1",claims:claims.length,quiz_candidate_count:quizQuestions.length,existing_text_unchanged:true,existing_quiz_unchanged:true,v1_promoted:0};
          fs.writeFileSync(tierFile,JSON.stringify(tier,null,2)+"\n");
          console.log("SAGENE_PACKET_PASS",claims.length,"verified claims",quizQuestions.length,"question candidates");
          JS
          node .tmp-sagene-v42.mjs
      - name: Commit result and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/oslo20-sagene-v42-oneoff-20261020.yml .tmp-sagene-v42.mjs
          git add -A .github/workflows/oslo20-sagene-v42-oneoff-20261020.yml
          git add data/places/production/sagene_skole.json data/places/production-tiers/v1-oslo-place-media-text-review-20261019-batch04.json
          git diff --cached --quiet && exit 0
          git commit -m 'content(oslo20): finish Sagene skole evidence packet without prose changes'
          git push origin HEAD:refs/heads/content/oslo20-sagene-v42-closeout-20261020
