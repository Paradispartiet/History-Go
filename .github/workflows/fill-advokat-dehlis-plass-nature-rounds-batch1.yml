          report='''# Advokat Dehlis plass – natur-rundinger batch 1

Dato: 2026-07-19

## Identitets- og koordinatkontroll

Det tekniske stedet `bjoelsenparken_elvenaer` var feilaktig kalt **Bjølsenparken (elvenær del)**. Punktet lå ved Advokat Dehlis plass og var samtidig ført som en gjenværende faktisk feil i koordinatprotokollen.

Visningsstedet er rettet til **Advokat Dehlis plass – grøntarealet**. Områdeankeret bruker OSM way `336602343` med geometrisk sentrum `59.93914, 10.75891`. Teknisk ID er beholdt for kompatibilitet. Radiusen er beholdt på 160 meter. Canonical år er rettet fra et omtrentelig 1930 til det dokumenterte navnevedtaket i 1934.

## Fylte natur-rundinger

- Oppgaver: stedsidentitet, grønt/hardt dekke, skygge og overvann
- Natur: urbant grøntareal, kantvirkning, trær, overvann og dokumentert artskartkobling
- Merker: seks kanoniske natur-underbadges
- Trening: trygg kortøkt på fortau og grøntareal
- Civication: snittmodell, monumentplate og overvannskart
- Aktører: kommunal forvaltning, skole, samvirkehistorie og monumentkunst
- Før / nå: fra navnløst veikryss til grønt minnested
- Fortellinger: `Fire bilder i et lite grønt rom`
- Leksikon: full kildebelagt artikkel med identitetsrettelsen

Ingen manuell `rounds`- eller `rundinger`-override er lagt inn. Ingen direkte flora- eller faunalister er lagt i stedfilen. Den eksisterende Artskart-baserte koblingen beholdes i naturkartet.

## Dokumenterte hovedpunkter

- Plassen ligger ved krysset Maridalsveien/Bentsebrugata
- navnet ble vedtatt i 1934
- monumentet av Asbjørg Borgfelt ble reist i 1946
- monumentets fire relieffer viser bonde, arbeider, fisker og kvinne med barn og kurv
- den egentlige Bjølsenparken ligger lenger nordvest og er et separat parkanlegg

## Kilder

Oslo byleksikon, Lokalhistoriewiki, Store norske leksikon, Norsk biografisk leksikon, Wikimedia/OpenStreetMap og repoets Artskart-baserte naturkart.
'''
