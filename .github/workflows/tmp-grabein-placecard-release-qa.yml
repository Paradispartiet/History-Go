name: Gråbein targeted QA (temporary)

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-grabein-placecard-release-qa.yml'
      - 'scripts/verify-place-closeout-browser.mjs'

permissions:
  contents: read

jobs:
  regenerate-release-for-review:
    name: Rebuild Fagverk release, emit exact artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate canonical release snapshot
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Emit generated release for PR materialization
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const content = fs.readFileSync('data/fagverk/fagverk_release.json', 'utf8');
          const size = 1200;
          const pieces = Math.ceil(content.length / size);
          console.log('HG_RELEASE_START ' + pieces);
          for (let i = 0; i < pieces; i++) {
            console.log('HG_RELEASE_CHUNK ' + i + ' ' + JSON.stringify(content.slice(i * size, (i + 1) * size)));
          }
          console.log('HG_RELEASE_END ' + pieces);
          NODE

  browser-placecard:
    name: Gråbein desktop + mobile PlaceCard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Resolve runner Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "::error::Chrome/Chromium is not available"
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Verify real desktop/mobile PlaceCard, collections and quiz flip
        run: node scripts/verify-place-closeout-browser.mjs museumsleiligheten_grabein --partial-placecard-qa
      - name: Upload desktop/mobile QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grabein-placecard-mobile-desktop
          path: artifacts/place-closeout/museumsleiligheten_grabein/
          if-no-files-found: ignore
          retention-days: 14
