name: TEMP Bankplassen Fagverk ordering diagnose

on:
  push:
    branches:
      - repair/bankplassen-4-v3-20260916

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Find first Fagverk release invalidator
        shell: bash
        run: |
          set -euo pipefail
          src=.github/workflows/tmp-bankplassen-v3-materialize.yml
          awk 'f{sub(/^          /,""); print} /^        run: \|$/{f=1}' "$src" > /tmp/bankplassen.sh
          python <<'PY'
          from pathlib import Path
          p = Path('/tmp/bankplassen.sh')
          s = p.read_text()
          context = 'node scripts/build-quiz-production-context.mjs --category naeringsliv --target "$PLACE_ID" --output data/quiz/production_context/naeringsliv/norges_bank_bankplassen_4.json\n'
          if s.count(context) != 1:
              raise SystemExit(f'expected one initial context build, found {s.count(context)}')
          s = s.replace(context, '', 1)
          place = 'npm run place:build -- "$PLACE_ID"\n'
          if s.count(place) != 1:
              raise SystemExit(f'expected one place build, found {s.count(place)}')
          s = s.replace(place, place + context, 1)
          helper = 'check_fagverk() {\n  label="$1"\n  echo "FAGVERK_ORDER_CHECK: $label"\n  if node scripts/build-fagverk-release-manifest.mjs --check; then\n    echo "FAGVERK_ORDER_PASS: $label"\n    return 0\n  fi\n  echo "FAGVERK_ORDER_FIRST_FAILURE: $label"\n  git status --short\n  exit 97\n}\n'
          anchor = 'set -euo pipefail\n'
          if anchor not in s:
              raise SystemExit('strict-mode anchor missing')
          s = s.replace(anchor, anchor + helper, 1)
          checks = [
              ('node scripts/build-fagverk-release-manifest.mjs\n', 'initial release build'),
              ('node --experimental-strip-types scripts/build-civication-history-people-index.mts\n', 'civication history people'),
              ('node --experimental-strip-types scripts/build-civication-scenario-people-index.mts\n', 'civication scenario people'),
              ('node --experimental-strip-types scripts/knowledge-canonical-data.mts --write\n', 'knowledge canonical write'),
              ('node scripts/build-place-open-payloads.mjs\n', 'place-open payloads'),
              ('node scripts/build-epoke-place-index.mjs\n', 'epoke place index'),
              ('node scripts/audit-place-images.mjs --mode=all --report=reports/place-image-audit.json\n', 'place image audit'),
              ('node scripts/audit-quiz-manifest-v2.mjs\n', 'quiz manifest audit'),
              ('npm run place:build -- "$PLACE_ID"\n', 'place build'),
              (context, 'quiz production context after place build'),
              ("node --test --test-name-pattern='registered in Place Production v3 routing' tests/norges-bank-bankplassen-4-place-production-v3.test.mjs\n", 'Bankplassen v3 routing test'),
          ]
          for line, label in checks:
              if s.count(line) != 1:
                  raise SystemExit(f'expected one command for {label}, found {s.count(line)}')
              s = s.replace(line, line + f'check_fagverk "{label}"\n', 1)
          s = s.replace('git push origin HEAD:repair/bankplassen-4-v3-20260916\n', 'echo "diagnostic complete; remote push suppressed"\n')
          p.write_text(s)
          PY
          bash -n /tmp/bankplassen.sh
          bash /tmp/bankplassen.sh
