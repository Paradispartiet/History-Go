name: Kvadraturen temporary release regeneration
on:
  push:
    branches:
      - research/oslo-sentrum-kvadraturen-v1-six-20261023
    paths:
      - .github/workflows/kvadraturen-fagverk-release-sync-temp.yml
permissions:
  contents: write
concurrency:
  group: kvadraturen-fagverk-release-oneoff
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oslo-sentrum-kvadraturen-v1-six-20261023
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate release with repository canonical builder
        run: |
          node scripts/build-fagverk-release-manifest.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Commit ONLY generated release, preserving concurrent work
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | grep -v '^data/fagverk/fagverk_release.json$' > /tmp/unexpected || true
          test ! -s /tmp/unexpected || { cat /tmp/unexpected; exit 1; }
          git add data/fagverk/fagverk_release.json
          if git diff --cached --quiet; then
            echo 'Release already synchronized'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate Fagverk release for Garmanngården QuizProduction target'
          git push origin HEAD:research/oslo-sentrum-kvadraturen-v1-six-20261023
