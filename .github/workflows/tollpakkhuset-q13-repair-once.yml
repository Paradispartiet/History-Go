name: Tollpakkhuset q13 repair one-shot

on:
  push:
    branches: [agent/tollpakkhuset-completion-20260911-v2]
    paths:
      - ".github/workflows/tollpakkhuset-q13-repair-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  repair-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair q13 claim family, clean diagnostic, publish and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'tools/build-tollpakkhuset-completion.mjs';
          let src = fs.readFileSync(file, 'utf8');
          const from = 'q(13, "Hvilket bygg må Tollpakkhuset ikke forveksles med?", ["Tollboden fra 1896", "Oslo Børs", "Østbanestasjonen"], "Tollboden fra 1896", "Tollpakkhuset er lagerbygningen; Tollboden er den separate administrasjonsbygningen fra 1896.", "em_naering_havn_transport", ["oppdag"], "comparison"),';
          const to = 'q(13, "Hvilket bygg må Tollpakkhuset ikke forveksles med?", ["Tollboden fra 1896", "Oslo Børs", "Østbanestasjonen"], "Tollboden fra 1896", "Tollpakkhuset er lagerbygningen; Tollboden er den separate administrasjonsbygningen fra 1896.", "em_naering_havn_transport", ["oppdag"], "context"),';
          const count = src.split(from).length - 1;
          if (count !== 1) throw new Error(`Expected exactly one q13 comparison match; got ${count}`);
          src = src.replace(from, to);
          fs.writeFileSync(file, src);
          NODE
          git rm TEMP_tollpakkhuset_materialize_error.log
          git rm .github/workflows/tollpakkhuset-q13-repair-once.yml
          git add tools/build-tollpakkhuset-completion.mjs
          git commit -m "Repair Tollpakkhuset q13 progression family"
          git push origin HEAD:agent/tollpakkhuset-completion-20260911-v2
          curl --fail-with-body -L -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Paradispartiet/History-Go/actions/workflows/tollpakkhuset-completion.yml/dispatches \
            -d '{"ref":"agent/tollpakkhuset-completion-20260911-v2"}'
