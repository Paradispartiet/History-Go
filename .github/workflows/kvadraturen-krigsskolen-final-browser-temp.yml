name: Kvadraturen Krigsskolen final browser QA
on:
  push:
    branches:
      - research/oslo-sentrum-kvadraturen-v1-six-20261023
    paths:
      - '.github/workflows/kvadraturen-krigsskolen-final-browser-temp.yml'
permissions:
  contents: read
jobs:
  playthrough:
    name: Final Krigsskolen 21-question desktop mobile quiz
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Resolve Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Run final revision through entire in-app quiz on both viewports
        run: node scripts/verify-place-quiz-browser.mjs den_gamle_krigsskolen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krigsskolen-final-browser-proof
          path: artifacts/place-quiz/den_gamle_krigsskolen/
          retention-days: 14
          if-no-files-found: warn
