name: TEMP Rådhusplassen PR contract fix

on:
  push:
    branches:
      - agent/radhusplassen-materialize-20260908
    paths:
      - '.github/workflows/TEMP_radhusplassen_pr_contract_fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Apply exact Rådhusplassen PR contract fixes
        run: |
          set -euxo pipefail
          git config user.name 'history-go-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main

          node scripts/place-production-rule-preflight.mjs record \
            --workcard reports/place-production/radhusplassen-workcard-current.json \
            --place-id radhusplassen \
            --category by

          node - <<'NODE'
          const fs = require('fs');

          const placePath = 'data/places/by/oslo/places/radhusplassen.json';
          const place = JSON.parse(fs.readFileSync(placePath, 'utf8'));
          const requiredLinks = [
            {
              type: 'source',
              label: 'Oslo kommune – leie Rådhusplassen',
              url: 'https://www.oslo.kommune.no/radhuset/leie-radhusplassen/',
              verifiedAt: '2026-09-08'
            },
            {
              type: 'source',
              label: 'Oslo kommune – Oslo rådhus',
              url: 'https://www.oslo.kommune.no/radhuset/',
              verifiedAt: '2026-09-08'
            }
          ];
          place.externalLinks ||= [];
          for (const link of requiredLinks) {
            const existing = place.externalLinks.find(row => row?.url === link.url);
            if (existing) Object.assign(existing, link);
            else place.externalLinks.push(link);
          }
          fs.writeFileSync(placePath, JSON.stringify(place, null, 2) + '\n');

          const readingPath = 'data/lesespor/oslo/lesespor_oslo_by.json';
          const reading = JSON.parse(fs.readFileSync(readingPath, 'utf8'));
          const expected = new Map([
            ['lesespor_radhusplassen_kommune', 'institutional'],
            ['lesespor_radhusplassen_tobias', 'institutional'],
            ['lesespor_radhusplassen_sporveien', 'institutional'],
            ['lesespor_radhusplassen_arkitektskap', 'recognized']
          ]);
          for (const [id, quality] of expected) {
            const matches = reading.items.filter(row => row?.id === id);
            if (matches.length !== 1) throw new Error(`${id}: expected exactly one item, found ${matches.length}`);
            matches[0].source_quality = quality;
          }
          fs.writeFileSync(readingPath, JSON.stringify(reading, null, 2) + '\n');
          NODE

          git checkout origin/main -- reports/knowledge-contract-audit.json

      - name: Validate repaired gates
        run: |
          set -euxo pipefail
          node scripts/place-production-rule-preflight.mjs check --base origin/main
          node --experimental-strip-types tools/validate_lesespor.mts
          node scripts/audit-fagverk-place-pages.mjs
          test "$(wc -c < reports/knowledge-contract-audit.json)" -le 512000
          git diff --check

      - name: Commit clean permanent repair
        run: |
          set -euxo pipefail
          rm .github/workflows/TEMP_radhusplassen_pr_contract_fix.yml
          git add -A
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/TEMP_' || true)"
          git commit -m 'Fix Rådhusplassen PR contract gates'
          git push origin HEAD:refs/heads/agent/radhusplassen-materialize-20260908
