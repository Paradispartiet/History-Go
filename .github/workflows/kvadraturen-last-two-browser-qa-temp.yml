name: Kvadraturen last two fullquiz mobile desktop QA
on:
  push:
    branches:
      - research/oslo-sentrum-kvadraturen-v1-six-20261023
    paths:
      - '.github/workflows/kvadraturen-last-two-browser-qa-temp.yml'
permissions:
  contents: read
jobs:
  playthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app dependencies
        run: npm ci --no-audit --no-fund
      - name: Detect Chromium
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Play through all three Cafe Engebret quiz sets on desktop and mobile
        run: node scripts/verify-place-quiz-browser.mjs cafe_engebret
      - name: Play through all three Treschowgarden quiz sets on desktop and mobile
        run: node scripts/verify-place-quiz-browser.mjs treschowgarden
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kvadraturen-last-two-real-browser-evidence
          path: |
            artifacts/place-quiz/cafe_engebret/
            artifacts/place-quiz/treschowgarden/
          retention-days: 14
          if-no-files-found: warn
