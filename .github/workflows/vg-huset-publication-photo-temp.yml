name: VG-huset physical publication photo import (temporary)
on:
  push:
    branches:
      - agent/vg-huset-source-preflight-20261009
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/agent/vg-huset-source-preflight-20261009'
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vg-huset-source-preflight-20261009
          persist-credentials: true
      - name: Import unchanged 2013 documentary publication photo
        shell: bash
        run: |
          set -euo pipefail
          path="bilder/kort/productions/vg_papiravis_2011_i_monter_2013.jpg"
          mkdir -p bilder/kort/productions
          if [[ ! -s "$path" ]]; then
            curl --fail --location --retry 4 --retry-all-errors --max-time 100 \
              -A "HistoryGo documentary asset attribution" \
              "https://commons.wikimedia.org/wiki/Special:Redirect/file/VG_monter_flyttet.JPG" -o "$path"
          fi
          test "$(file -b --mime-type "$path")" = "image/jpeg"
          test "$(wc -c < "$path")" -gt 150000
          sha256sum "$path"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          if ! git diff --cached --quiet; then
            git commit -m "Import licensed 2013 photograph of VG's 2011 newspaper display"
            git push origin HEAD:refs/heads/agent/vg-huset-source-preflight-20261009
          fi
