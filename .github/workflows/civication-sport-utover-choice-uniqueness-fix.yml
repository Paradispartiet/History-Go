name: Civication Sport-utøver choice uniqueness fixer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: civication-sport-utover-choice-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/civication-sport-utover-role-world'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Patch Sport-utøver choice wording
        run: node scripts/fix-civication-sport-utover-choice-uniqueness.mjs

      - name: Regenerate canonical outputs
        run: |
          node scripts/build-civication-scene-registry.mjs --write
          node scripts/audit-civication-career-gameplay.mjs --write

      - name: Verify focused Sport and uniqueness contracts
        run: |
          node tests/civication-mail-choice-uniqueness.test.js
          node tests/civication-sport-utover-role-world.test.js
          node tests/civication-role-world-contract.test.js
          node scripts/build-civication-scene-registry.mjs --check
          node scripts/audit-civication-career-gameplay.mjs --check

      - name: Verify complete Civication suite
        run: npm run test:civication

      - name: Commit verified permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/Civication/mailFamilies/sport/job/sport_utover_job.json \
            data/Civication/mailFamilies/sport/people/sport_utover_people.json \
            data/Civication/compiledSceneRegistryV1.json \
            data/Civication/careerGameplayMatrix.json \
            reports/civication-career-gameplay-matrix.md
          if git diff --cached --quiet; then
            echo "Sport-utøver choice repair already materialized; nothing to commit."
            exit 0
          fi
          git commit -m "Make Sport-utøver practice choices scenario-specific"
          git push origin HEAD:${{ github.head_ref }}
