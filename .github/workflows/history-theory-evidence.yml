name: History theory evidence

on:
  pull_request:
    paths:
      - 'data/fag/historie/theory_evidence_historie_contract_v1.json'
      - 'data/fag/historie/theory_evidence_historie_canonical_v1.json'
      - 'data/fag/historie/theory_objects_historie_canonical_v5_5.json'
      - 'data/fag/historie/historiepensum_canonical_v4_5.json'
      - 'data/fag/historie/emner_historie_canonical_v4_5.json'
      - 'data/fag/historie/emnemapping_historie_canonical_v4_5.json'
      - 'data/fag/historie/fagkart_historie_canonical_v4_5.json'
      - 'data/fag/historie/claims_historie_canonical_v1.json'
      - 'data/fag/historie/sources_historie_canonical_v1.json'
      - 'data/fag/historie/place_evidence_historie_v1.json'
      - 'data/fag/profiles/historie/oslo_akershus/profile.json'
      - 'data/fag/historie/historie_universal_coverage_contract_v1.json'
      - 'tools/validate-historie-theory-evidence.mjs'
      - 'tools/validate-historie-domain.mjs'
      - 'tools/validate-historie-forste-verdenskrig-mellomkrig.mjs'
      - 'tools/validate-historie-kjonn-familie-livslop.mjs'
      - 'tools/validate-historie-kald-krig-etterkrig.mjs'
      - 'tools/validate-historie-global-kolonial-transnasjonal.mjs'
      - 'tools/audit-historie-universal-coverage.mjs'
      - 'tests/historie-global-colonial-transnational-evidence.test.mjs'
      - 'tests/historie-first-world-war-interwar-evidence.test.mjs'
      - 'tests/historie-gender-family-lifecourse-evidence.test.mjs'
      - 'tests/historie-cold-war-postwar-evidence.test.mjs'
      - 'data/fag/historie/source_dossiers/global_colonial_transnational_v1.json'
      - 'data/fag/historie/source_dossiers/first_world_war_interwar_v1.json'
      - 'data/fag/historie/source_dossiers/gender_family_lifecourse_v1.json'
      - 'data/fag/historie/source_dossiers/cold_war_postwar_v1.json'
      - 'reports/historie-theory-evidence/**'
      - 'reports/historie-universal-coverage/**'
      - 'docs/HISTORY_THEORY_EVIDENCE.md'
      - '.github/workflows/history-theory-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  theory-evidence:
    name: History theory evidence contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate theory evidence foundation
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/validate-historie-theory-evidence.mjs
          node tools/validate-historie-theory-evidence.mjs --check

      - name: Validate global-colonial evidence regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/validate-historie-global-kolonial-transnasjonal.mjs
          node tools/validate-historie-global-kolonial-transnasjonal.mjs
          node --test --test-reporter=spec tests/historie-global-colonial-transnational-evidence.test.mjs

      - name: Validate first-world-war and interwar evidence regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/validate-historie-forste-verdenskrig-mellomkrig.mjs
          node tools/validate-historie-forste-verdenskrig-mellomkrig.mjs
          node --test --test-reporter=spec tests/historie-first-world-war-interwar-evidence.test.mjs

      - name: Validate gender, family and life-course evidence regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/validate-historie-kjonn-familie-livslop.mjs
          node tools/validate-historie-kjonn-familie-livslop.mjs
          node --test --test-reporter=spec tests/historie-gender-family-lifecourse-evidence.test.mjs

      - name: Validate Cold War and postwar evidence regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/validate-historie-kald-krig-etterkrig.mjs
          node tools/validate-historie-kald-krig-etterkrig.mjs
          node --test --test-reporter=spec tests/historie-cold-war-postwar-evidence.test.mjs

      - name: Verify universal coverage integration
        run: node tools/audit-historie-universal-coverage.mjs --check

      - name: Verify frozen V5.8 base remains intact
        run: node tools/audit-historie-v5-5-quality-depth.mjs

      - name: Upload theory evidence audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-theory-evidence
          path: |
            reports/historie-theory-evidence/history-theory-evidence-foundation-v1.json
            reports/historie-theory-evidence/history-theory-evidence-foundation-v1.md
            reports/historie-universal-coverage/historie-universal-coverage.json
            reports/historie-universal-coverage/historie-universal-coverage.md
          if-no-files-found: error
