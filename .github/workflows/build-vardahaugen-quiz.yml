name: Build Vardahaugen quiz

on:
  push:
    branches:
      - agent/etne-vardahaugen-quiz

permissions:
  contents: write

jobs:
  build-quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etne-vardahaugen-quiz
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Materialize quiz and manifest
        env:
          QUIZ_GZIP_B64: 
        shell: bash
        run: |
          python3 <<'PY'
          import os, base64, gzip, json
          from pathlib import Path
          raw = gzip.decompress(base64.b64decode(os.environ['QUIZ_GZIP_B64']))
          quiz_path = Path('data/quiz/historie/vardahaugen_lauareid_sets.json')
          quiz_path.parent.mkdir(parents=True, exist_ok=True)
          quiz_path.write_bytes(raw + (b'' if raw.endswith(b'\n') else b'\n'))
          manifest_path = Path('data/quiz/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          if not any(x.get('targetId') == 'vardahaugen_lauareid' for x in manifest['sets']):
              manifest['sets'].append({'targetId':'vardahaugen_lauareid','file':str(quiz_path)})
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build Knowledge links
        run: npm run knowledge:canonical:write
      - name: Validate quiz contract
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='data/quiz/historie/vardahaugen_lauareid_sets.json';
          const quiz=JSON.parse(fs.readFileSync(path,'utf8'));
          const qs=quiz.sets.flatMap(s=>s.questions);
          if(quiz.targetId!=='vardahaugen_lauareid'||quiz.sets.length!==3||qs.length!==15) throw new Error('Package contract failed');
          const a=qs.filter(q=>['fact','observation'].includes(q.question_type)).length;
          const b=qs.filter(q=>['context','analysis','comparison'].includes(q.question_type)).length;
          const c=qs.filter(q=>q.question_type==='concept').length;
          if(a!==8||b!==4||c!==3) throw new Error(`Wrong balance ${a}/${b}/${c}`);
          for(const q of qs){if(q.options[q.answerIndex]!==q.answer)throw new Error(`Answer ${q.id}`);if(q.knowledge_link_status!=='linked')throw new Error(`Knowledge ${q.id}`);}
          const m=JSON.parse(fs.readFileSync('data/quiz/manifest.json','utf8')).sets.filter(x=>x.targetId===quiz.targetId);
          if(m.length!==1||m[0].file!==path)throw new Error('Manifest failed');
          console.log('Vardahaugen quiz contract OK');
          NODE
      - name: Audit quiz content
        run: npm run audit:quiz-content
      - name: Audit quiz templates
        run: npm run audit:quiz-templates
      - name: Test quiz audit
        run: npm run test:quiz-content-audit
      - name: Check Knowledge data
        run: npm run knowledge:canonical:check
      - name: Commit final package
        shell: bash
        run: |
          rm -f .github/workflows/build-vardahaugen-quiz.yml reports/vardahaugen-build-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'Add Vardahaugen quiz package'; git push origin HEAD:agent/etne-vardahaugen-quiz; fi
