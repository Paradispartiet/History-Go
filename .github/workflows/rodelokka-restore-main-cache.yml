name: Rodeløkka restore unrelated main cache

on:
  push:
    branches:
      - agent/rodelokka-production-replay-20260905

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rodelokka-production-replay-20260905
          fetch-depth: 0
      - name: Restore only tracked cache inherited from main
        env:
          EXPECTED_MAIN: 1b4f7a58e08d36487eca2c6cdd81c7ce44e0fca1
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git checkout "$EXPECTED_MAIN" -- .cache/akershus-slottskirke-media
          rm .github/workflows/rodelokka-restore-main-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          staged="$(git diff --cached --name-only)"
          printf '%s\n' "$staged"
          unexpected="$(printf '%s\n' "$staged" | grep -v -E '^(\.cache/akershus-slottskirke-media/|\.github/workflows/rodelokka-restore-main-cache\.yml$)' || true)"
          test -z "$unexpected"
          git commit -m "Restore unrelated main cache after Rodeløkka replay"
          git push origin HEAD:agent/rodelokka-production-replay-20260905
