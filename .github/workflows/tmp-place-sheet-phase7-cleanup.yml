              place_open = place_open.replace("      - 'tests/place-sheet-special-profiles.test.mjs'\n", "      - 'tests/place-sheet-special-profiles.test.mjs'\n      - 'tests/place-sheet-phase7-legacy-cleanup.test.mjs'\n")
