name: TEMP Place Sheet Phase 7 cleanup

on:
  push:
    branches:
      - agent/place-sheet-phase7-legacy-cleanup-20260910
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/place-sheet-phase7-legacy-cleanup-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply Phase 7 cleanup
        run: python3 scripts/tmp-place-sheet-phase7-cleanup.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify canonical Place-open data
        run: npm run place-open:check && npm run test:place-open
      - name: Typecheck and rebuild web runtime
        run: |
          npm run typecheck:web
          npm run build:web
          node --check dist/web/place-unified-surface.js
          node --check js/ui/place-popup-v2.js
          node --check js/ui/place-popup-shortcuts.js
      - name: Run Phase 7 unit regressions
        run: |
          node --test \
            tests/place-unified-surface.test.mjs \
            tests/place-popup-v2-unified-target.test.mjs \
            tests/place-popup-root-scoped-decorators.test.mjs \
            tests/place-sheet-phase1.test.mjs \
            tests/place-sheet-about-renderer.test.mjs \
            tests/place-sheet-history-renderer.test.mjs \
            tests/place-sheet-stories-renderer.test.mjs \
            tests/place-sheet-before-after-renderer.test.mjs \
            tests/place-sheet-news-renderer.test.mjs \
            tests/place-sheet-reading-renderer.test.mjs \
            tests/place-sheet-language-renderer.test.mjs \
            tests/place-sheet-learning-renderer.test.mjs \
            tests/place-sheet-sources-renderer.test.mjs \
            tests/place-sheet-render-queue.test.mjs \
            tests/place-sheet-direct-routing.test.mjs \
            tests/place-sheet-special-profiles.test.mjs \
            tests/place-sheet-phase7-legacy-cleanup.test.mjs \
            tests/micro-place-contract.test.mjs \
            tests/place-rounds-grid-exclusivity.test.mjs
      - name: Commit green Phase 7 cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/tmp-place-sheet-phase7-cleanup.yml scripts/tmp-place-sheet-phase7-cleanup.py
          if git diff --cached --quiet; then
            echo "Phase 7 cleanup already committed"
            exit 0
          fi
          git commit -m "Retire legacy Place popup shell geometry"
          git push origin HEAD:agent/place-sheet-phase7-legacy-cleanup-20260910
