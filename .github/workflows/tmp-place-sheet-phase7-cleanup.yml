  assert.match(unified, /phase:\s*7/);
  assert.match(popup, /renderMicroPlacePopup/);
  assert.match(popup, /micro-place-popup-shell/);
});
''')

          # The bridge and its test are entirely obsolete after direct Place Sheet ownership.
