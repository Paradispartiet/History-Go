name: Diagnose Oslo coordinate batch 30

on:
  push:
    branches:
      - agent/oslo-coordinate-control-batch-30
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: oslo-coordinate-batch-30-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-30
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build coordinate tools
        run: |
          npm ci
          npm run build:tools

      - name: Query Kartverket SSR first
        shell: bash
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-30/coordinates
          mkdir -p "$out"

          curl --fail --retry 3 --retry-delay 2 --silent --show-error --get \
            --data-urlencode "sok=Alexander Kiellands plass" \
            --data-urlencode "knr=0301" \
            --data-urlencode "treffPerSide=50" \
            --data-urlencode "side=1" \
            "https://api.kartverket.no/stedsnavn/v1/sted" \
            | tee "$out/alexander_kiellands_plass_ssr.json"

          curl --fail --retry 3 --retry-delay 2 --silent --show-error --get \
            --data-urlencode "sok=Oskar Braaten" \
            --data-urlencode "knr=0301" \
            --data-urlencode "treffPerSide=50" \
            --data-urlencode "side=1" \
            "https://api.kartverket.no/stedsnavn/v1/sted" \
            | tee "$out/oskar_braaten_ssr.json"

      - name: Test named-place address lookup for Alexander Kiellands plass
        shell: bash
        run: |
          set +e
          out=reports/oslo-coordinate-control-batch-30/coordinates
          node dist/tools/address-first-coordinate-finder.mjs --address "Alexander Kiellands plass Oslo" \
            | tee "$out/alexander_kiellands_plass_address.json"
          status=${PIPESTATUS[0]}
          printf '{"exit": %s}\n' "$status" > "$out/alexander_kiellands_plass_address_status.json"
          exit 0

      - name: Query exact named OSM objects only after SSR
        shell: bash
        run: |
          set +e
          out=reports/oslo-coordinate-control-batch-30/coordinates

          cat > /tmp/alexander.overpass <<'QL'
          [out:json][timeout:60];
          nwr["name"="Alexander Kiellands plass"](59.90,10.70,59.96,10.80);
          out center tags;
          QL

          cat > /tmp/oskar.overpass <<'QL'
          [out:json][timeout:60];
          (
            nwr["name"~"Oskar Braaten",i](around:600,59.930969,10.757267);
            nwr["name"~"Oscar Braaten",i](around:600,59.930969,10.757267);
          );
          out center tags;
          QL

          query_overpass() {
            local query_file="$1"
            local output_file="$2"
            local endpoint
            for endpoint in \
              "https://overpass-api.de/api/interpreter" \
              "https://overpass.kumi.systems/api/interpreter" \
              "https://overpass.nchc.org.tw/api/interpreter"
            do
              echo "Trying $endpoint" >&2
              if curl --fail --retry 2 --retry-delay 2 --max-time 90 --silent --show-error \
                --data-urlencode "data@${query_file}" "$endpoint" > "$output_file"; then
                if jq -e '.elements | type == "array"' "$output_file" >/dev/null 2>&1; then
                  return 0
                fi
              fi
            done
            printf '{"version":0.6,"generator":"unavailable","elements":[],"diagnostic":"All Overpass endpoints failed"}\n' > "$output_file"
            return 1
          }

          query_overpass /tmp/alexander.overpass "$out/alexander_kiellands_plass_osm.json"
          alexander_osm_status=$?
          query_overpass /tmp/oskar.overpass "$out/oskar_braaten_byste_osm.json"
          oskar_osm_status=$?
          printf '{"alexander_osm":%s,"oskar_osm":%s}\n' "$alexander_osm_status" "$oskar_osm_status" > "$out/overpass-status.json"
          exit 0

      - name: Write compact diagnostic summary
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='reports/oslo-coordinate-control-batch-30/coordinates/';
          const read=(f)=>JSON.parse(fs.readFileSync(p+f,'utf8'));
          const compactSsr=(obj)=>({metadata:obj.metadata??null,navn:obj.navn??null,steder:obj.steder??null});
          const out={
            alexander_ssr: compactSsr(read('alexander_kiellands_plass_ssr.json')),
            oskar_ssr: compactSsr(read('oskar_braaten_ssr.json')),
            alexander_address: read('alexander_kiellands_plass_address.json'),
            overpass_status: read('overpass-status.json'),
            alexander_osm: read('alexander_kiellands_plass_osm.json').elements ?? [],
            oskar_osm: read('oskar_braaten_byste_osm.json').elements ?? [],
          };
          fs.writeFileSync('reports/oslo-coordinate-control-batch-30/diagnostic-summary.json',JSON.stringify(out,null,2)+'\n');
          NODE

      - name: Persist diagnostics and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/oslo-coordinate-batch-30-diagnose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/oslo-coordinate-control-batch-30 .github/workflows/oslo-coordinate-batch-30-diagnose.yml
          git commit -m "Capture Oslo coordinate batch 30 diagnostics"
          git push origin HEAD
