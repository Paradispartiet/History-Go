name: Diagnose Oslo coordinate batch 30

on:
  push:
    branches:
      - agent/oslo-coordinate-control-batch-30
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: oslo-coordinate-batch-30-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oslo-coordinate-control-batch-30
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build coordinate tools
        run: |
          npm ci
          npm run build:tools

      - name: Query Kartverket SSR first
        shell: bash
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-30/coordinates
          mkdir -p "$out"

          curl --fail --retry 3 --retry-delay 2 --silent --show-error --get \
            --data-urlencode "sok=Alexander Kiellands plass" \
            --data-urlencode "knr=0301" \
            --data-urlencode "treffPerSide=50" \
            --data-urlencode "side=1" \
            "https://api.kartverket.no/stedsnavn/v1/sted" \
            | tee "$out/alexander_kiellands_plass_ssr.json"

          curl --fail --retry 3 --retry-delay 2 --silent --show-error --get \
            --data-urlencode "sok=Oskar Braaten" \
            --data-urlencode "knr=0301" \
            --data-urlencode "treffPerSide=50" \
            --data-urlencode "side=1" \
            "https://api.kartverket.no/stedsnavn/v1/sted" \
            | tee "$out/oskar_braaten_ssr.json"

      - name: Test named-place address lookup for Alexander Kiellands plass
        shell: bash
        run: |
          set +e
          out=reports/oslo-coordinate-control-batch-30/coordinates
          node dist/tools/address-first-coordinate-finder.mjs --address "Alexander Kiellands plass Oslo" \
            | tee "$out/alexander_kiellands_plass_address.json"
          status=${PIPESTATUS[0]}
          printf '{"exit": %s}\n' "$status" > "$out/alexander_kiellands_plass_address_status.json"
          exit 0

      - name: Fetch exact OSM objects only after SSR
        shell: bash
        run: |
          set -euo pipefail
          out=reports/oslo-coordinate-control-batch-30/coordinates
          user_agent="History-Go-coordinate-audit/1.0 (Paradispartiet/History-Go)"

          curl --fail --retry 3 --retry-delay 2 --max-time 45 --silent --show-error \
            -A "$user_agent" \
            "https://nominatim.openstreetmap.org/lookup?osm_ids=W3610607&format=json&polygon_geojson=1" \
            | tee "$out/alexander_kiellands_plass_osm.json"

          sleep 1

          curl --fail --retry 3 --retry-delay 2 --max-time 45 --silent --show-error \
            -A "$user_agent" \
            "https://nominatim.openstreetmap.org/lookup?osm_ids=N10819902960&format=json" \
            | tee "$out/oskar_braaten_byste_osm.json"

      - name: Write compact diagnostic summary
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='reports/oslo-coordinate-control-batch-30/coordinates/';
          const read=(f)=>JSON.parse(fs.readFileSync(p+f,'utf8'));
          const compactSsr=(obj)=>({metadata:obj.metadata??null,navn:obj.navn??null,steder:obj.steder??null});
          const out={
            alexander_ssr: compactSsr(read('alexander_kiellands_plass_ssr.json')),
            oskar_ssr: compactSsr(read('oskar_braaten_ssr.json')),
            alexander_address: read('alexander_kiellands_plass_address.json'),
            alexander_osm: read('alexander_kiellands_plass_osm.json'),
            oskar_osm: read('oskar_braaten_byste_osm.json'),
          };
          fs.writeFileSync('reports/oslo-coordinate-control-batch-30/diagnostic-summary.json',JSON.stringify(out,null,2)+'\n');
          NODE

      - name: Persist diagnostics and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/oslo-coordinate-batch-30-diagnose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/oslo-coordinate-control-batch-30 .github/workflows/oslo-coordinate-batch-30-diagnose.yml
          git commit -m "Capture Oslo coordinate batch 30 diagnostics"
          git push origin HEAD
