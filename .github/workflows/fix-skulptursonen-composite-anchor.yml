name: Fix Skulptursonen composite anchor

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fix-skulptursonen-composite-anchor.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verify composite OSM geometry and midpoint
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation'
          node <<'NODE' | tee "$outdir/composite-anchor-check.txt"
          const fs = require('fs');
          const evidence = JSON.parse(fs.readFileSync('reports/oslo-oppdag-kvadraturen-art-sites-batch-1/coordinates/ovre_slottsgate_overpass.json', 'utf8'));
          const [place] = JSON.parse(fs.readFileSync('data/places/kunst/oslo/places_kunst_oslo_oppdag_kvadraturen_art_sites_batch_01.json', 'utf8'));
          const ids = [972903959, 995344351, 995344352, 306572322];
          const ways = ids.map((id) => {
            const way = evidence.elements.find((x) => x.type === 'way' && x.id === id);
            if (!way || !Array.isArray(way.geometry) || way.geometry.length < 2) throw new Error(`Missing geometry for OSM way ${id}`);
            return way;
          });
          const same = (a, b) => Math.abs(a.lat - b.lat) < 1e-9 && Math.abs(a.lon - b.lon) < 1e-9;
          for (let i = 0; i < ways.length - 1; i++) {
            const end = ways[i].geometry.at(-1);
            const start = ways[i + 1].geometry[0];
            if (!same(end, start)) throw new Error(`Composite ways are not continuous: ${ways[i].id} -> ${ways[i + 1].id}`);
          }
          const points = [];
          for (const way of ways) {
            for (const point of way.geometry) {
              if (!points.length || !same(points.at(-1), point)) points.push(point);
            }
          }
          const R = 6371000;
          const dist = (a, b) => {
            const toRad = (v) => v * Math.PI / 180;
            const lat1 = toRad(a.lat), lat2 = toRad(b.lat);
            const dLat = lat2 - lat1, dLon = toRad(b.lon - a.lon);
            const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(h));
          };
          const lengths = points.slice(1).map((point, i) => dist(points[i], point));
          const total = lengths.reduce((a, b) => a + b, 0);
          const target = total / 2;
          let walked = 0;
          let midpoint = null;
          for (let i = 0; i < lengths.length; i++) {
            if (walked + lengths[i] >= target) {
              const f = (target - walked) / lengths[i];
              midpoint = {
                lat: points[i].lat + f * (points[i + 1].lat - points[i].lat),
                lon: points[i].lon + f * (points[i + 1].lon - points[i].lon)
              };
              break;
            }
            walked += lengths[i];
          }
          if (!midpoint) throw new Error('Could not calculate composite midpoint');
          const delta = Math.max(Math.abs(place.lat - midpoint.lat), Math.abs(place.lon - midpoint.lon));
          if (delta > 1e-9) throw new Error(`Place coordinate does not match composite midpoint: delta=${delta}`);
          if (total < 160 || total > 175) throw new Error(`Unexpected composite length: ${total}`);
          console.log(`Composite OSM ways: ${ids.join(', ')}`);
          console.log(`Continuity: OK (${points.length} unique geometry points)`);
          console.log(`Composite length: ${total.toFixed(3)} m`);
          console.log(`Length-weighted midpoint: ${midpoint.lat}, ${midpoint.lon}`);
          console.log('Canonical coordinate matches full composite geometry: OK');
          NODE

      - name: Rebuild places index
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation'
          npm run places:index:build | tee "$outdir/composite-anchor-index-build.txt"

      - name: Run coordinate and data gates
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation'
          npm run places:index:check | tee "$outdir/composite-anchor-index-check.txt"
          npm run places:coords:intake | tee "$outdir/composite-anchor-coordinate-intake.txt"
          npm run places:emner:check | tee "$outdir/composite-anchor-emne-check.txt"
          npm run audit:places-split-manifest-sync | tee "$outdir/composite-anchor-split-manifest-sync.txt"
          npm run test:coordinate-source-contract | tee "$outdir/composite-anchor-coordinate-contract.txt"

      - name: Hold place-health baseline
        shell: bash
        run: |
          set -uo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation'
          set +e
          npm run health:places | tee "$outdir/composite-anchor-health-places.txt"
          status=${PIPESTATUS[0]}
          set -e
          grep -q '^Errors: 40$' "$outdir/composite-anchor-health-places.txt"
          if grep -F 'data/places/kunst/oslo/places_kunst_oslo_oppdag_kvadraturen_art_sites_batch_01.json:' "$outdir/composite-anchor-health-places.txt" | grep -q '^'; then
            echo 'Corrected art place introduced a health finding.' >&2
            exit 1
          fi
          echo "PlaceHealth baseline held at 40 existing errors (command status=$status)." | tee "$outdir/composite-anchor-health-baseline.txt"

      - name: Check whitespace
        shell: bash
        run: |
          set -euo pipefail
          outdir='reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation'
          git diff --check | tee "$outdir/composite-anchor-git-diff-check.txt"

      - name: Remove temporary workflow and commit correction outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-skulptursonen-composite-anchor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/places/places_index.json
          git add reports/oslo-oppdag-kvadraturen-art-sites-batch-1/validation/composite-anchor-*.txt
          git add -u .github/workflows/fix-skulptursonen-composite-anchor.yml
          git commit -m 'Validate Skulptursonen composite anchor correction'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
