name: Fagverk Sport phase 3

on:
  pull_request:
    paths:
      - "fagverk.html"
      - "fagverk-forside.html"
      - "data/categories/category_contract.json"
      - "data/fag/fag_manifest.json"
      - "data/fag/sport/**"
      - "data/badges/sport.json"
      - "data/fagverk/**"
      - "js/fagverk-subject-core.js"
      - "js/fagverk-subject-model.js"
      - "js/fagverk.js"
      - "scripts/audit-fagverk-subject-inventory.mjs"
      - "scripts/audit-fagverk-general-engine.mjs"
      - "scripts/audit-fagverk-sport-phase3.mjs"
      - "scripts/materialize-sport-complete.mjs"
      - "scripts/build-fagverk-release-manifest.mjs"
      - "tests/fagverk-subject-inventory.test.mjs"
      - "tests/fagverk-general-engine.test.mjs"
      - "tests/fagverk-sport-phase3.test.mjs"
      - "tests/fagverk-release-manifest.test.mjs"
      - "reports/fagverk/**"
      - ".github/workflows/fagverk-sport-phase3.yml"
  push:
    branches: [main]
    paths:
      - "data/fag/sport/**"
      - "data/badges/sport.json"
      - "data/fagverk/**"
      - "scripts/audit-fagverk-sport-phase3.mjs"
      - "tests/fagverk-sport-phase3.test.mjs"
      - "reports/fagverk/**"
      - ".github/workflows/fagverk-sport-phase3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate Sport phase 3 materialization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Materialize complete Sport state on PR branch
        if: github.event_name == 'pull_request'
        run: |
          node scripts/materialize-sport-complete.mjs
          node scripts/audit-fagverk-subject-inventory.mjs --write-report
          node scripts/audit-fagverk-general-engine.mjs --write-report
          node scripts/audit-fagverk-sport-phase3.mjs --write-report
          node scripts/build-fagverk-release-manifest.mjs
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard data/fagverk/sport/sport_completion_v1.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/fagverk/fagverk_registry.json data/fagverk/subject_status.json data/fagverk/fagverk_release.json data/fagverk/sport/sport_completion_v1.json data/fagverk/sport/regler-spill-konkurranse/claims.json reports/fagverk/subject-baseline.json reports/fagverk/general-engine-audit.json reports/fagverk/sport-phase3-audit.json
            git commit -m "Materialize complete Sport state"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Validate syntax and deterministic reports
        run: |
          node --check scripts/audit-fagverk-sport-phase3.mjs
          node scripts/audit-fagverk-subject-inventory.mjs
          node scripts/audit-fagverk-general-engine.mjs
          node scripts/audit-fagverk-sport-phase3.mjs
          node scripts/build-fagverk-release-manifest.mjs --check
      - name: Validate Fagverk and Sport contracts
        run: |
          node --test tests/fagverk-subject-inventory.test.mjs
          node --test tests/fagverk-general-engine.test.mjs
          node --test tests/fagverk-sport-phase3.test.mjs
          node --test tests/fagverk-release-manifest.test.mjs
