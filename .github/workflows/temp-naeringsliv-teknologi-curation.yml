name: Temporary Næringsliv technology-domain curation

on:
  pull_request:
    paths:
      - '.github/workflows/temp-naeringsliv-teknologi-curation.yml'

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Curate seven technology emners individually
        run: |
          node scripts/temp-curate-naeringsliv-teknologi-domain.mjs
          node scripts/temp-mark-naeringsliv-teknologi-curation.mjs

      - name: Regenerate Næringsliv production contexts
        run: |
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target telegrafbygningen --output data/quiz/production_context/naeringsliv/telegrafbygningen.json
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target oslo_posthus --output data/quiz/production_context/naeringsliv/oslo_posthus.json
          node scripts/build-quiz-production-context.mjs --category naeringsliv --target havnelageret --output data/quiz/production_context/naeringsliv/havnelageret.json

      - name: Validate curation
        run: |
          npm run audit:quiz-templates
          npm run audit:quiz-production-context
          npm run audit:quiz-progression
          npm run audit:quiz-theory-binding
          npm run test:quiz-content-audit
          node <<'NODE'
          const fs = require('fs');
          const ids = [
            'em_naering_data_algoritmer_verdiskaping',
            'em_naering_digitalisering_plattformokonomi',
            'em_naering_doxa_vekst_effektivitet',
            'em_naering_innovasjon_teknologisk_skift',
            'em_naering_ledelse_kontrollsystemer',
            'em_naering_startup_grunder_innovasjon',
            'em_naering_teknologi_infrastruktur'
          ];
          const all = JSON.parse(fs.readFileSync('data/fag/naeringsliv/emner_naeringsliv_canonical_v4_5.json','utf8'));
          const selected = ids.map(id => all.find(item => item.emne_id === id));
          if (selected.some(item => !item)) throw new Error('Mangler kuratert teknologiemne');
          const fields = ['definition','why_it_matters','key_questions','conflicts','ideological_dimensions','analysis_axes','blindspots','generator_use_note','overlap_resolution_note','anti_patterns'];
          for (const field of fields) {
            const values = selected.map(item => JSON.stringify(item[field]));
            if (new Set(values).size !== selected.length) throw new Error(`${field} er ikke individuelt for alle sju emner`);
          }
          if (selected.some(item => item.curation_status !== 'individually_curated')) throw new Error('Kurateringsstatus mangler');
          const pensum = JSON.parse(fs.readFileSync('data/fag/naeringsliv/naeringslivpensum_canonical_v4_5.json','utf8'));
          if (pensum.summary.individually_curated_core_emne_count !== 30) throw new Error('Kuraterte emner skal være 30');
          if (pensum.summary.remaining_core_emne_count !== 6) throw new Error('Gjenstående emner skal være 6');
          if (pensum.content_curation.curated_domain_ids.length !== 4) throw new Error('Fire domener skal være kuratert');
          NODE

      - name: Commit curated data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fag/naeringsliv/emner_naeringsliv_canonical_v4_5.json
          git add data/fag/naeringsliv/naeringslivpensum_canonical_v4_5.json
          git add data/quiz/production_context/naeringsliv/telegrafbygningen.json
          git add data/quiz/production_context/naeringsliv/oslo_posthus.json
          git add data/quiz/production_context/naeringsliv/havnelageret.json
          git commit -m 'Kurater teknologi- og innovasjonsemnene individuelt'
          git push origin HEAD:${{ github.head_ref }}
