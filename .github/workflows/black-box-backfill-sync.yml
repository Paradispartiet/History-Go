name: TEMP Black Box Knowledge backfill synchronization
on:
  push:
    branches:
      - production/black-box-quiz-and-quizcard-20261012
    paths:
      - .github/workflows/black-box-backfill-sync.yml
permissions:
  contents: write
jobs:
  sync-backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/black-box-quiz-and-quizcard-20261012
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate canonical Knowledge and backfill
        run: |
          npm run build:scripts
          node dist/scripts/knowledge-canonical-data.mjs --write
          git status --short
          git diff --exit-code -- data/knowledge/knowledge_units.generated.json data/quiz/scenekunst/black_box_teater_sets.json
      - name: Commit only regenerated backfill report
        shell: bash
        run: |
          git add reports/knowledge-id-backfill.json
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'Backfill already in sync'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Black Box: refresh canonical Knowledge ID backfill report'
          git push origin HEAD:production/black-box-quiz-and-quizcard-20261012
