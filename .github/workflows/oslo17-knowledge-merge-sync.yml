name: Sync combined Oslo17 Knowledge after main reconciliation
on:
  push:
    branches:
      - history-go/oslo17-editorial-quiz-fixes-20261022
    paths:
      - '.github/workflows/oslo17-knowledge-merge-sync.yml'
permissions:
  contents: write
concurrency:
  group: oslo17-merge-knowledge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rebuild canonical Knowledge after merged editorial corrections
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=history-go/oslo17-editorial-quiz-fixes-20261022
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard FETCH_HEAD
            npm run knowledge:canonical:write
            npm run knowledge:canonical:check
            node --test tests/oslo-batch04-v1-quiz-parity.test.mjs
            git diff --name-only > /tmp/changed-knowledge-files.txt
            cat /tmp/changed-knowledge-files.txt
            while IFS= read -r file; do
              case "$file" in
                data/knowledge/*|reports/knowledge-*|reports/knowledge/*|data/quiz/naeringsliv/oslo_mek_sets_merged.json|data/quiz/by/grev_wedels_plass_sets.json) ;;
                *) echo "Unexpected generator mutation: $file" >&2; exit 1 ;;
              esac
            done < /tmp/changed-knowledge-files.txt
            git add data/knowledge/knowledge_units.generated.json data/knowledge/concepts.generated.json reports/knowledge-id-backfill.json data/quiz/naeringsliv/oslo_mek_sets_merged.json data/quiz/by/grev_wedels_plass_sets.json
            if git diff --cached --quiet; then echo 'Knowledge already synchronized'; exit 0; fi
            git commit -m "build(history): reconcile canonical Knowledge after Grev Wedels art and quiz edits"
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
          done
          echo 'Failed to push safely after 5 branch changes' >&2
          exit 1
