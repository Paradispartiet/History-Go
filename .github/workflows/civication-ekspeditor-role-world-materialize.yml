name: Civication Ekspeditor Role World materialize

on:
  push:
    branches:
      - agent/civication-ekspeditor-role-world
    paths:
      - data/Civication/roleWorlds/.materialize-ekspeditor

permissions:
  contents: write

concurrency:
  group: civication-ekspeditor-role-world-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/civication-ekspeditor-role-world
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Canonicalize Ekspeditor roleModel manifest
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifestPath = 'data/Civication/roleModels/manifest.json';
          const oldPath = 'data/Civication/roleModels/naeringsliv/ekspeditor_butikkmedarbeider.json';
          const newPath = 'data/Civication/roleModels/naeringsliv/ekspeditor.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (!manifest.files.includes(oldPath)) throw new Error(`Missing legacy manifest entry: ${oldPath}`);
          if (manifest.files.includes(newPath)) throw new Error(`Canonical manifest entry already exists: ${newPath}`);
          manifest.files = manifest.files.map((entry) => entry === oldPath ? newPath : entry);
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          fs.rmSync(oldPath);
          NODE

      - name: Regenerate Career Gameplay Matrix
        run: node scripts/audit-civication-career-gameplay.mjs --write

      - name: Verify Role World and generated career status
        run: |
          node tests/civication-role-world-contract.test.js
          node tests/civication-ekspeditor-role-world.test.js
          node scripts/audit-civication-career-gameplay.mjs --check
          node scripts/build-civication-scene-registry.mjs --check

      - name: Commit generated reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            data/Civication/roleModels/manifest.json \
            data/Civication/roleModels/naeringsliv/ekspeditor_butikkmedarbeider.json \
            data/Civication/careerGameplayMatrix.json \
            reports/civication-career-gameplay-matrix.md
          if git diff --cached --quiet; then
            echo "Expected generated reconciliation produced no diff" >&2
            exit 1
          fi
          git commit -m "Materialize Ekspeditor Role World status"
          git push origin HEAD:agent/civication-ekspeditor-role-world
