<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Batch 7 map audit</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}.legend{background:#fff;padding:10px;font:14px system-ui;box-shadow:0 1px 8px #0004}</style></head><body><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>fetch('./apply-audit.json').then(r=>r.json()).then(a=>{const m=L.map('map');L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);const b=[];for(const[id,n]of Object.entries(a.newCoordinates)){const o=a.oldCoordinates[id];L.circleMarker([o.lat,o.lon],{radius:9,color:'#b00020',fillOpacity:.35}).addTo(m).bindTooltip(id+' OLD',{permanent:true,direction:'left'});L.circleMarker([n.lat,n.lon],{radius:9,color:'#087f23',fillOpacity:.6}).addTo(m).bindTooltip(id+' NEW',{permanent:true,direction:'right'});L.polyline([[o.lat,o.lon],[n.lat,n.lon]],{color:'#222',dashArray:'5,6'}).addTo(m);b.push([o.lat,o.lon],[n.lat,n.lon]);}m.fitBounds(b,{padding:[80,80]});const c=L.control({position:'topright'});c.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<b>Oslo batch 7</b><br><span style="color:#b00020">● old</span> → <span style="color:#087f23">● verified address point</span>';return d};c.addTo(m);});</script></body></html>
