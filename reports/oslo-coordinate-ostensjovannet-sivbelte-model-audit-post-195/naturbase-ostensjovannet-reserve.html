<!doctype html>
<html lang="no">
    <head>

        <title>Naturbase faktaark</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">        
        <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css" />
        <!-- <link rel="stylesheet" href="css/styles.css"> -->
        <style>
            body {
                line-height: 1.5;
                font-size: 0.8em;
            }

            #miljodir-header-bg {
                background: #ebf3f3;
            }

            #miljodir-header-table {
                margin-left: auto;
                margin-right: auto;
                vertical-align: middle;
            }

            #miljodir-header-tittelTd {
                color: #00615c;
                font-family: OpenSans-SemiBold, open sans, arial, helvetica, sans-serif;
                font-size: 22px;
            }

            #miljodir-barTd {
                vertical-align: middle;
                width: 5%;
            }

            #miljodir-barDiv {
                border-left: 2px solid #c7cece;
                width: 2px;
                height: 42px;
            }

            #miljodir-header-logoTd {
                padding-left: 20px;
            }

            #miljodir-logo {
                width: 152px;
                height: 34px;
            }

            #miljodir-header-tr {
                height: 62px;
            }

            #map {
                border-radius: 1px;
                -moz-border-radius: 1px;
                overflow: hidden;
                border: solid 1px #666666;
                height: 430px;
                width: 100%;
                margin: 0;
                padding: 0;
            }

            img.ramme {
                border-radius: 1px;
                -moz-border-radius: 1px;
                overflow: hidden;
                border: solid 1px #666666;
                width: 100%;
            }

            .noBorder {
                border: 0px;
                padding: 0;
                margin: 0;
                border-collapse: collapse;
            }

            .centeredRow {
                text-align: center;
            }

            .heading {
                font-size: 1.5em;
                font-family: 'Palatino Linotype';
                font-weight: bold;
                margin-bottom: 3px;
                color: #016968;
            }

            .headingMedium {
                font-size: 1.4em;
                font-family: 'Palatino Linotype';
                font-weight: normal;
                margin-bottom: 3px;
                color: #016968;
            }

            .centerImg {
                vertical-align: middle;
                text-align: center;
                top: 50%;
                bottom: 50%;
            }

            h2 {
                margin-top: 0;
                padding-top: 0;
                font-weight: normal;
                font-family: 'Open Sans Bold';
                font-size: 16px;
                color: #016968;
                line-height: 1;
            }

            /* mindre luft i tabellen */
            .table td {
                padding: 0.3em;
            }
        </style>
      <script type="module" crossorigin src="/assets/index-C3_rn6e8.js"></script>
      <link rel="stylesheet" crossorigin href="/assets/index-CQED0rIl.css">

                    <table class="table table-condensed">

            </div>
        </div>

        <p style="page-break-before: always"></p>
