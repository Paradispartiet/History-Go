<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070c">
  <title>Fagverket – History Go</title>
  <meta name="description" content="Velg et fag i History Go og finn emner, lærestoff, steder og progresjon på én samlet fagflate.">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/fagverk-premium.css">
  <link rel="stylesheet" href="css/fagverk-forside.css">
</head>
<body class="hg-fagverk-portal-page">
  <a class="fagverk-skip-link" href="#fagverkPortalMain">Hopp til fagene</a>
  <header class="fagverk-topbar">
    <a class="fagverk-brand" href="index.html" aria-label="Tilbake til History Go"><img src="bilder/logo_historygo.PNG" alt="History Go"></a>
    <nav aria-label="Fagverknavigasjon"><a href="emner.html">Min læring</a><a href="index.html">Kartet</a></nav>
  </header>
  <main id="fagverkPortalMain" class="fagverk-portal-shell">
    <header class="fagverk-portal-hero">
      <p class="fagverk-kicker">Én inngang til hvert fag</p>
      <h1>Fagverket</h1>
      <p class="fagverk-portal-lead">Velg et fag. På fagsiden finner du <strong>emner</strong>, redigert <strong>lærestoff</strong>, steder å <strong>utforske</strong> og din <strong>progresjon</strong>. Merke, poeng og nivå er en del av progresjonen i faget – ikke en egen læringsvei.</p>
    </header>
    <section class="fagverk-portal-section" aria-labelledby="fagverkPortalTitle">
      <div class="fagverk-portal-section-head"><p class="fagverk-kicker">Alle fag</p><h2 id="fagverkPortalTitle">Hva vil du lære?</h2></div>
      <div id="fagverkPortalLoading" class="fagverk-loading">Laster fagene …</div>
      <div id="fagverkPortalGrid" class="fagverk-portal-grid" hidden></div>
      <div id="fagverkPortalError" class="fagverk-error" hidden></div>
    </section>
  </main>
  <script src="js/fagverk-forside.js"></script>
</body>
</html>
