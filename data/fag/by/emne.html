<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>History Go – By & arkitektur – Emne</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <p id="status">Flytter gammelt emne til Fagverket …</p>
  <script>
    (async function redirectLegacyByEmne() {
      const fallback = '../../../fagverk.html?subject=by#fagverkIaEmner';
      const id = new URL(window.location.href).searchParams.get('id');
      if (!id) {
        window.location.replace(fallback);
        return;
      }
      try {
        const response = await fetch('pensum_by.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(String(response.status));
        const pensum = await response.json();
        const domains = Array.isArray(pensum?.domains) ? pensum.domains : [];
        const domain = domains.find((item) => Array.isArray(item?.emne_ids) && item.emne_ids.includes(id));
        if (!domain?.domain_id) {
          window.location.replace(fallback);
          return;
        }
        const target = '../../../fagverk.html?subject=by&domain=' + encodeURIComponent(domain.domain_id) + '&emne=' + encodeURIComponent(id);
        window.location.replace(target);
      } catch (error) {
        console.warn('[by/emne compatibility] canonical lookup failed', error);
        window.location.replace(fallback);
      }
    })();
  </script>
  <noscript><p>Åpne <a href="../../../fagverk.html?subject=by#fagverkIaEmner">By & arkitektur – Emner</a>.</p></noscript>
</body>
</html>
