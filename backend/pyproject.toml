[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "history-go-backend"
version = "0.1.0"
description = "Production API and server-authoritative backend for History GO"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi[standard-no-fastapi-cloud-cli]>=0.115,<1",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
# The moderation repository contains long SQL predicates inside Python strings.
# The two test helpers below contain compact formatter-owned conditional expressions.
# Keep these line-length exceptions narrow; all other Ruff rules remain active.
"app/domains/social_meet/moderation_repository.py" = ["E501"]
# Spotmeeting creation intentionally keeps connection lifetime and transaction scope
# as two explicit contexts because serialization errors are classified at that boundary.
"app/domains/social_meet/spotmeeting_repository.py" = ["SIM117"]
"tests/test_social_meet_moderation_api.py" = ["E501"]
"tests/test_social_meet_moderation_service.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# SQL-heavy repository formatting is kept manual so Ruff does not churn embedded
# SQL layout while lint/type checks remain active for the file.
exclude = ["app/domains/social_meet/moderation_repository.py"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jwt.*"]
ignore_missing_imports = true
